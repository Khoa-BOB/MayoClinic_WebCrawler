    - type: paragraph
      text: Receiving this vaccine with any of the following medicines may cause an
        increased risk of certain side effects, but using both drugs may be the best
        treatment for you. If both medicines are prescribed together, your doctor
        may change the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Abatacept
      - Cytomegalovirus Immune Globulin, Human
      - Hepatitis B Immune Globulin
      - Rabies Immune Globulin
      - Respiratory Syncytial Virus Immune Globulin, Human
      - Tetanus Immune Globulin
      - Vaccinia Immune Globulin, Human
      - Varicella-Zoster Immune Globulin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Immune system problems (eg, immunodeficiency or immunosuppression caused by
        dengue disease or treatment), severe—Should not be used in patients with this
        condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this vaccine.
      It is given as a shot under your skin.
  - type: paragraph
    text: This vaccine requires 3 doses that are given 6 months apart (at months 0,
      6, and 12). If you miss the second or third shot, call your doctor to make another
      appointment as soon as possible.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that you receive the second and third dose of the vaccine
      series at the right times and that your doctor check your progress at regular
      visits to make sure that this medicine is working properly and to check for
      unwanted effects.
  - type: paragraph
    text: Children without a previous laboratory-confirmed dengue infection should
      not receive the vaccine . Dengue tetravalent vaccine, live may increase your
      child's risk for severe dengue disease when vaccinated and later infected with
      the dengue virus. Your child's doctor should check for this information in your
      child's medical records.
  - type: paragraph
    text: This vaccine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have a rash, itching, a fast heartbeat, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      after receiving the vaccine.
  - type: paragraph
    text: This vaccine may case syncope (fainting). Talk with your doctor if you have
      concerns.
  - type: paragraph
    text: Side effects from this vaccine could occur within 14 days after you receive
      a shot. Be sure to tell your doctor about any serious side effects that occur
      during that time.
  - type: paragraph
    text: This vaccine may not protect everyone completely. It is very important that
      you use precautions to reduce the risk of mosquito bites. Use insect repellents
      and mosquito nets, wear protective clothing, and stay indoors during twilight
      and after dark.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are receiving
      this medicine. This medicine may affect the results of certain medical tests,
      including tuberculin purified protein derivative (PPD) test sensitivity. Tuberculin
      testing should be done before or at least 1 month after receiving the vaccine.
  - type: paragraph
    text: Tell your doctor if you are using medicine that weakens the immune system,
      including cancer medicine, steroids, or radiation treatment.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding in the mouth
      - cough
      - high fever
      - noisy breathing
      - persistent vomiting
      - redness of the skin
      - restlessness
      - severe stomach pain or tenderness
      - sleepiness or drowsiness
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
      - tightness in the chest
      - trouble breathing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty swallowing
      - dizziness
      - fast heartbeat
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - difficulty in moving
      - general feeling of discomfort or illness
      - headache
      - joint pain or swelling
      - lack or loss of strength
      - muscle pains, cramps, or stiffness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Collection of blood under the skin
      - deep, dark purple bruise
      - stomach pain
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
