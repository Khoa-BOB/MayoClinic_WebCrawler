    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Aortic stenosis (heart valve problem), severe or
      - Blood clotting disorder or
      - Heart disease, severe or
      - Heart failure, severe, history of—Use with caution. May cause side effects
        to become worse.
    - type: list
      ordered: false
      items:
      - Aspirin-sensitive asthma or
      - Aspirin sensitivity, history of or
      - Kidney disease, severe or
      - Liver disease, moderate to severe or
      - Sulfa or sulfonamide allergy—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Coagulopathy (bleeding disorder) or
      - Kidney disease, advanced—May increase risk of stomach or bowel bleeding.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Hypovolemia—Must be corrected first before using this medicine.
    - type: list
      ordered: false
      items:
      - Heart attack, recent or
      - Stomach or bowel problems (eg, peptic ulcer disease, bleeding), history of—Use
        with caution. Make make these conditions worse.
    - type: list
      ordered: false
      items:
      - Heart surgery (eg, coronary artery bypass graft [CABG])—Should not be used
        to relieve pain right before or after the surgery.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: For safe and effective use of this medicine, do not take more of it, do
      not take it more often, and do not take it for a longer time than your doctor
      ordered . Taking too much of this medicine may increase the chance of unwanted
      effects.
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these are most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure, but
      it does help control it. Therefore, you must continue to take it as directed
      if you expect to lower your blood pressure and keep it down. You might have
      to take high blood pressure medicine for the rest of your life . If high blood
      pressure is not treated, it can cause serious problems such as heart failure,
      blood vessel disease, strokes, or kidney disease.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For hypertension and osteoarthritis: Adults—At
        first, amlodipine 5 milligrams (mg) and celecoxib 200 mg once a day. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than amlodipine 10 mg and celecoxib 200 mg per day. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For hypertension and osteoarthritis: Adults—At first, amlodipine 5 milligrams
        (mg) and celecoxib 200 mg once a day. Your doctor may adjust your dose as
        needed. However, the dose is usually not more than amlodipine 10 mg and celecoxib
        200 mg per day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, amlodipine 5 milligrams (mg) and celecoxib 200 mg once a
        day. Your doctor may adjust your dose as needed. However, the dose is usually
        not more than amlodipine 10 mg and celecoxib 200 mg per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: Do not stop using this medicine without asking your doctor, even if the
      pain stops and you feel well. Wait until your doctor prescribes a different
      medicine to treat your blood pressure.
  - type: paragraph
    text: Using this medicine during the later part of pregnancy can harm your unborn
      baby. If you think you have become pregnant while using the medicine, tell your
      doctor right away.
  - type: paragraph
    text: This medicine may increase your risk of having a heart attack or stroke.
      This is more likely in people who already have heart disease or in people who
      use this medicine for a longer time.
  - type: paragraph
    text: This medicine may cause bleeding in your stomach or intestines. This problem
      can happen without warning signs. This is more likely if you have had a stomach
      ulcer in the past, if you smoke or drink alcohol regularly, if you are over
      60 years of age, are in poor health, or are using certain other medicines (such
      as a steroid or a blood thinner).
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Possible warning signs of some serious side effects that can occur during
      treatment with this medicine may include swelling of the face, fingers, feet,
      or lower legs, severe stomach pain, black, tarry stools, or vomiting of blood
      or material that looks like coffee grounds, unusual weight gain, yellow skin
      or eyes, decreased urination, unusual bleeding or bruising, or skin rash. Also,
      signs of serious heart problems could occur including chest pain or tightness,
      fast or irregular heartbeat, unusual flushing or warmth of the skin, weakness,
      or slurring of speech. Check with your doctor immediately if you notice any
      of these warning signs .
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, trouble breathing, unusual tiredness or weakness, vomiting, or
      weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: 'Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have the following symptoms:
      stomach pain, confusion, difficulty with breathing, irregular heartbeat, nausea
      or vomiting, nervousness, numbness or tingling in the hands, feet, or lips,
      or weakness or heaviness of the legs.'
  - type: paragraph
    text: This medicine may cause a serious allergic reaction called anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, trouble breathing or swallowing,
      or any swelling of your hands, face, or mouth while you are using this medicine.
  - type: paragraph
    text: Serious skin reactions, including Stevens-Johnson syndrome, toxic epidermal
      necrolysis, drug reaction with eosinophilia and systemic symptoms (DRESS), and
      acute generalized exanthematous pustulosis (AGEP) can occur during treatment
      with this medicine. Check with your doctor right away if you have black, tarry
      stools, blistering, peeling, or loosening of the skin, chest pain, chills, cough,
      diarrhea, fever, itching, joint or muscle pain, painful or difficult urination,
      red irritated eyes, red skin lesions, sore throat, sores, ulcers, or white spots
      in the mouth or on the lips, swollen glands, unusual bleeding or bruising, or
      unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause a delay in ovulation for women and may affect their
      ability to have children. If you plan to have children, talk with your doctor
      before using this medicine.
  - type: paragraph
    text: Before having any kind of surgery or medical tests, tell your doctor that
      you are using this medicine. It may be necessary for you to stop treatment for
      a while, or to change to a different NSAID before your procedure.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
