title: Bebtelovimab (intravenous route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Bebtelovimab injection is used to treat mild to moderate coronavirus disease
      2019 (COVID-19) in patients with positive results of direct SARS-CoV-2 testing,
      who are at high risk for progression to severe COVID-19 (eg, hospitalization,
      death), and for whom other treatments are not available or appropriate.
  - type: paragraph
    text: This medicine is to be given only by or under the immediate supervision
      of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of bebtelovimab injection in children younger than 12 years
        of age or weighing less than 40 kilograms (kg). Safety and efficacy have not
        been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of bebtelovimab injection in the
        elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - COVID-19, severe (eg, hospitalized patients, patients who need oxygen therapy
        or respiratory support)—Should not be used in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins. It must be given slowly, so the needle will have to stay in place for
      at least 30 seconds.
  - type: paragraph
    text: This medicine comes with a Fact Sheet for Patients, Parents, and Caregivers.
      Read and follow the information in the Fact Sheet carefully. Ask your doctor
      if you have any questions.
  - type: paragraph
    text: You should receive this medicine within 7 days of the onset of COVID-19
      symptoms.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you or your child's progress
      closely while you are receiving this medicine to make sure that it is working
      properly. Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including infusion-related
      reactions and anaphylaxis, which can be life-threatening and require immediate
      medical attention. Tell your doctor right away if you start to have a fever,
      chill or shaking, dizziness, headache, hoarseness, increased sweating, trouble
      breathing, trouble swallowing, itching or skin rash, lightheadedness, fainting,
      fast, pounding, or uneven heartbeat, or any swelling of your hands, face, or
      mouth after receiving this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - blurred vision
      - chest pain, discomfort, or tightness
      - chills
      - confusion
      - cough
      - difficulty in moving
      - dizziness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fainting
      - fast or irregular heartbeat
      - fever
      - flushing
      - headache
      - itching skin
      - joint pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - muscle aches, cramps, pains, or stiffness
      - nausea and vomiting
      - nervousness
      - noisy breathing
      - pounding in the ears
      - sweating
      - swollen joints
      - trouble breathing
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty swallowing
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
    - type: paragraph
      text: 'Drug information provided by: Merative, Micromedex®'
