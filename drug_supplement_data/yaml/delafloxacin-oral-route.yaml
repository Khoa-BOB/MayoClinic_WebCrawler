title: Delafloxacin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Baxdela
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Delafloxacin is used to treat acute bacterial skin and skin structure infections
      (ABSSSI) and community-acquired bacterial pneumonia (CABP).
  - type: paragraph
    text: Delafloxacin belongs to the class of drugs, known as quinolone antibiotics.
      It works by killing bacteria or preventing their growth. However, this medicine
      will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use in children is not recommended. Safety and efficacy have not been
        established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of delafloxacin in the elderly. However,
        elderly patients are more likely to have age-related kidney problems, or develop
        aortic aneurysm or severe tendon disorders (including tendon rupture), especially
        in those who also take steroid medicines, which may require caution in patients
        receiving delafloxacin.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Albiglutide
      - Alogliptin
      - Canagliflozin
      - Chlorpropamide
      - Dapagliflozin
      - Dulaglutide
      - Empagliflozin
      - Ertugliflozin
      - Exenatide
      - Glimepiride
      - Glipizide
      - Glyburide
      - Insulin
      - Insulin Aspart, Recombinant
      - Insulin Bovine
      - Insulin Degludec
      - Insulin Detemir
      - Insulin Glulisine
      - Insulin Lispro, Recombinant
      - Linagliptin
      - Liraglutide
      - Lixisenatide
      - Magnesium Sulfate
      - Metformin
      - Miglitol
      - Nateglinide
      - Pioglitazone
      - Porfimer
      - Pramlintide
      - Repaglinide
      - Rosiglitazone
      - Saxagliptin
      - Semaglutide
      - Sitagliptin
      - Tolazamide
      - Tolbutamide
      - Voglibose
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aluminum
      - Calcium
      - Iron
      - Magnesium
      - Sucralfate
      - Zinc
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Aortic aneurysm (bulge in the wall of the largest artery) or
      - Diabetes or
      - Diarrhea or
      - Mental illness, history of or
      - Peripheral neuropathy (nerve problem), history of or
      - Seizures (epilepsy), history of—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Brain problems (eg, hardening of the brain arteries, change in brain structure)
        or
      - Kidney disease, severe or
      - Organ transplant (eg, heart, kidney, or lung), history of or
      - Tendon disorder (eg, rheumatoid arthritis), history of—Use with caution. May
        cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - End-stage kidney disease or
      - Myasthenia gravis (severe muscle weakness), or history of—Should not be used
        in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: If you are taking didanosine buffered tablets for oral suspension or the
      pediatric powder for oral suspension, sucralfate, or antacids, multivitamins,
      or other products containing aluminum, magnesium, iron, or zinc, take them at
      least 6 hours before or 2 hours after using delafloxacin . These medicines may
      keep delafloxacin from working properly.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you feel
      better after the first few doses. Your infection may not clear up if you stop
      using this medicine too soon.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For acute bacterial skin and skin structure
        infections: Adults—450 milligrams (mg) every 12 hours for 5 to 14 days. Children—Use
        and dose must be determined by your doctor. For community acquired bacterial
        pneumonia: Adults—450 milligrams (mg) every 12 hours for 5 to 10 days. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For acute bacterial skin and skin structure infections: Adults—450 milligrams
        (mg) every 12 hours for 5 to 14 days. Children—Use and dose must be determined
        by your doctor.'
      - 'For community acquired bacterial pneumonia: Adults—450 milligrams (mg) every
        12 hours for 5 to 10 days. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - Adults—450 milligrams (mg) every 12 hours for 5 to 14 days.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—450 milligrams (mg) every 12 hours for 5 to 10 days.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is less than 8 hours until your next dose, skip
        the missed dose and go back to your regular dosing schedule.
    - type: paragraph
      text: If you miss a dose and it is more than 8 hours until your next dose, take
        it as soon as possible and go back to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure it is working properly. Blood and urine tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: Delafloxacin may cause inflammation (tendinitis) or tearing of a tendon
      (the cord that attaches muscles to bones). This can occur while you are using
      the medicine or after you finish using it. The risk of having tendon problems
      may be increased if you are over 60 years of age, are using steroid medicines
      (eg, dexamethasone, prednisolone, prednisone, Medrol®), have severe kidney problems,
      have a history of tendon problems (eg, rheumatoid arthritis), or if you have
      received an organ transplant (eg, heart, kidney, or lung). Check with your doctor
      right away if you have sudden pain or swelling in a tendon (eg, ankle, back
      of the knee or leg, shoulder, elbow, or wrist), bruise more easily after an
      injury, or are unable to bear weight or move the affected area. Refrain from
      exercise until your doctor says otherwise.
  - type: paragraph
    text: Tell your doctor right away if you start having numbness, tingling, or burning
      pain in your hands, arms, legs, or feet. These may be symptoms of a condition
      called peripheral neuropathy.
  - type: paragraph
    text: 'Tell your doctor right away if you have any of the following symptoms while
      using this medicine: seizures, feeling anxious, confused, or depressed, seeing,
      hearing, or feeling things that are not there, severe headache, trouble sleeping,
      or unusual thoughts or behaviors.'
  - type: paragraph
    text: Delafloxacin may worsen myasthenia gravis (severe muscle weakness) in people
      who already have this condition. Talk to your doctor if you have concerns.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, hives, hoarseness, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      after you use this medicine.
  - type: paragraph
    text: This medicine may increase your risk for aortic aneurysm (bulge in the wall
      of the largest artery). Check with your doctor right away if you have sudden
      chest, stomach, or back pain, trouble breathing, cough, or hoarseness.
  - type: paragraph
    text: Delafloxacin may cause diarrhea, and in some cases it can be severe. It
      may occur 2 months or more after you stop using this medicine. Do not take any
      medicine to treat diarrhea without first checking with your doctor. Diarrhea
      medicines may make the diarrhea worse or make it last longer. If you have any
      questions about this or if mild diarrhea continues or gets worse, check with
      your doctor.
  - type: paragraph
    text: Delafloxacin may cause some people to become dizzy or lightheaded than they
      are normally. Do not drive or do anything else that could be dangerous until
      you know how this medicine affects you .
  - type: paragraph
    text: 'If you are a diabetic patient taking diabetes medicine by mouth : Delafloxacin
      may cause hypoglycemia (low blood sugar) in some patients. Symptoms of low blood
      sugar must be treated before they lead to unconsciousness (passing out) . Different
      people may feel different symptoms of low blood sugar. If you experience symptoms
      of low blood sugar, check with your doctor right away.'
  - type: list
    ordered: false
    items:
    - 'Symptoms of low blood sugar can include: anxiety, behavior change similar to
      being drunk, blurred vision, cold sweats, confusion, cool pale skin, difficulty
      with concentrating, drowsiness, excessive hunger, headache, nausea, nervousness,
      rapid heartbeat, shakiness, or unusual tiredness or weakness.'
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
