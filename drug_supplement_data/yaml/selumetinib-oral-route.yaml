      - Ebola Zaire Vaccine, Live
      - Efavirenz
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Eye or vision problems or
      - Heart disease (eg, cardiomyopathy)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Liver disease, moderate or severe—Use with caution. The effects may be increased
        because of the slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine usually comes with a patient information leaflet and patient
      instructions. Read and follow the instructions carefully. Ask your doctor or
      pharmacist if you have any questions.
  - type: paragraph
    text: You may take the capsule with or without food.
  - type: paragraph
    text: Swallow the capsule whole with water. Do not chew, crush, or open it.
  - type: paragraph
    text: 'To use the oral granules :'
  - type: list
    ordered: false
    items:
    - Do not swallow, chew, or dissolve the capsule shell. Do not chew or crush the
      granules. Do not add the granules to liquids. Do not use the granules if it
      is clumped or stuck inside the capsule shell.
    - Wash and dry your hands before and after using this medicine.
    - Add 1 to 3 teaspoons of smooth yogurt or fruit puree (eg, apple, banana, pear,
      or strawberry) into a spoon or small cup. Do not mix it with grapefruit or any
      juice, fruit puree, or jam with Seville orange.
    - Carefully open the capsule and sprinkle the contents in a spoon or cup. Take
      or give the mixture within 30 minutes after preparing it. Swallow the mixture
      right away without chewing while seated upright. Do not save for later use.
    - If you take or give part of the mixture within 30 minutes of preparing, throw
      away the remainder of the mixture and do not prepare a new dose. Take or give
      the full dose within 30 minutes next time.
    - If you used a cup to prepare, add more of the same food into the cup and take
      or give all of the mixture to make sure you get the full dose.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For neurofibromatosis type 1 (NF1): For oral dosage form (capsules): Children
        1 year of age and older—Dose is based on body surface area and must be determined
        by your doctor. The dose is usually 25 milligrams per square meter (mg/m[2])
        of body surface area, taken 2 times. Your doctor may adjust your dose as needed
        and tolerated. BSA of 1.90 meter squared (m2) or more—50 mg 2 times a day.
        BSA of 1.70 to 1.89 m2—45 mg 2 times a day. BSA of 1.50 to 1.69 m2—40 mg 2
        times a day. BSA of 1.30 to 1.49 m2—35 mg 2 times a day. BSA of 1.10 to 1.29
        m2—30 mg 2 times a day. BSA of 0.90 to 1.09 m2—25 mg 2 times a day. BSA of
        0.70 to 0.89 m2—20 mg 2 times a day. BSA of 0.55 to 0.69 m2—20 mg in the morning
        and 10 mg in the evening. Children younger than 1 year of age—Use and dose
        must be determined by your doctor. For oral dosage form (granules): Children
        1 year of age and older—Dose is based on body surface area and must be determined
