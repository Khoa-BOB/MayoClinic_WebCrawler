    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose, take it as soon as you remember. If it is within 6
        hours until your next dose, skip the missed dose and go back to your regular
        dosing schedule. If you vomit after taking your medicine, do not take an extra
        dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the medicine in its original bottle. Do not throw the desiccant (drying
        agent) packet.
    - type: paragraph
      text: You may also store oral granules in the refrigerator. Keep it in a cooler
        bag with a cold pack if you need to take it anywhere.
    - type: paragraph
      text: Throw away unused mixture within 30 minutes after preparing it.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to decide if you should continue to take it. Blood and urine tests will be needed
      to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant during treatment
      and for at least 1 week after your last dose. Males who are taking this medicine,
      with female partners who can become pregnant must use effective birth control
      during treatment and for at least 1 week after the last dose of this medicine.
      If you think you have become pregnant while using the medicine, tell your doctor
      right away.
  - type: paragraph
    text: This medicine may cause heart problems. Check with your doctor right away
      if you have chest discomfort or pain, dizziness or faintness, fast, irregular,
      or pounding heartbeat, swelling of the feet or lower legs, trouble with breathing,
      or unusual tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if eye pain or a change in vision occurs
      during treatment. These could be a sign of a serious eye problem. Your doctor
      may want your eyes be checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: This medicine may cause diarrhea, nausea, vomiting, and mouth sores. Do
      not take any medicine to treat diarrhea without first checking with your doctor.
      If you have any questions about this or if mild diarrhea continues or gets worse,
      check with your doctor.
  - type: paragraph
    text: Check with your doctor right away if you have a severe skin rash, acne,
      loss or thinning of the hair, raised bumps on your skin, or redness, swelling,
      peeling, or tenderness of the hands or feet. These may be symptoms of a serious
      skin problem.
  - type: paragraph
    text: Call your doctor right away if you have dark urine, fever, muscle cramps
      or spasms, muscle pain or stiffness, or unusual tiredness or weakness. These
      could be symptoms of a serious muscle problem called rhabdomyolysis, which can
      cause kidney problems.
  - type: paragraph
    text: This medicine may cause bleeding problems. Tell your doctor if you have
      bleeding gums, coughing up blood, difficulty with breathing or swallowing, dizziness,
      headache, increased menstrual flow or vaginal bleeding, nosebleeds, prolonged
      bleeding from cuts, red or dark brown urine, or red or black, tarry stools.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, crusting, irritation, itching, or reddening of the skin
      - blood in urine
      - cracked, dry scaly skin
      - diarrhea
      - fast heartbeat
      - itching, pain, redness, swelling, tenderness, warmth on the skin
      - loosening of the fingernails
      - muscle or bone pain
      - nosebleeds
      - redness or soreness around the fingernails
      - swelling
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - change in vision
      - chest tightness
      - difficult or labored breathing
      - dizziness
      - headache
      - nervousness
      - overbright appearance of lights
      - pounding in the ears
      - rapid weight gain
      - seeing flashes or sparks of light
      - seeing floating spots before the eyes, or a veil or curtain across part of
        your vision
      - slow or fast heartbeat
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - fever
      - hair loss, thinning of the hair
      - loss of appetite
      - nausea
      - stomach pain
      - swelling or inflammation of the mouth
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
