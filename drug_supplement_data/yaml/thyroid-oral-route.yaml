    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child at regular visits . This will allow your doctor to see if the medicine
      is working properly and to decide if you should continue to take it. Blood tests
      will be needed to check for unwanted effects.
  - type: paragraph
    text: Thyroid should not be used for the treatment of obesity or for the purpose
      of losing weight. This medicine is ineffective for weight reduction and when
      taken in larger amount, it may cause more serious medical conditions.
  - type: paragraph
    text: Hypothyroidism can sometimes cause infertility in men and women. Thyroid
      should not be used for the treatment of infertility unless it is caused by hypothyroidism.
  - type: paragraph
    text: Call your doctor right away if you start to have chest pain, fast, irregular,
      pounding, or racing heartbeat or pulse, excessive sweating, heat intolerance,
      nervousness, or any other unusual medical condition.
  - type: paragraph
    text: 'For patients with diabetes : It is very important that you keep track of
      your blood or urine sugar levels as instructed by your doctor. Check with your
      doctor immediately if you notice any changes in your sugar levels.'
  - type: paragraph
    text: A temporary loss of hair may occur during the first few months of thyroid
      therapy. Ask your doctor about this if you have any concerns.
  - type: paragraph
    text: Do not suddenly stop taking this medicine without first checking with your
      doctor . Your doctor may want you or your child to gradually reduce the amount
      you are using before stopping completely.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Get emergency help immediately if any of the following symptoms of overdose
      occur:'
  - type: list
    ordered: false
    items:
    - Changes in appetite
    - changes in menstrual periods
    - chest pain
    - diarrhea
    - fast or irregular heartbeat
    - fever
    - hand tremors
    - headache
    - irritability
    - leg cramps
    - nervousness
    - sensitivity to heat
    - sweating
    - trouble breathing
    - trouble sleeping
    - vomiting
    - weight loss
  - type: paragraph
    text: Other side effects not listed may also occur in some patients. If you notice
      any other effects, check with your healthcare professional.
  - type: paragraph
    text: Call your doctor for medical advice about side effects. You may report side
      effects to the FDA at 1-800-FDA-1088.
