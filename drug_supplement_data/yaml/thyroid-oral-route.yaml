- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Thyroid is used to treat hypothyroidism, a condition where the thyroid gland
      does not produce enough thyroid hormone. It is also used to help decrease the
      size of enlarged thyroid glands (known as goiter) and to treat thyroid cancer.
  - type: paragraph
    text: Thyroid is also used in some medical tests to help diagnose problems with
      the thyroid gland.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatrics-specific
        problems that would limit the usefulness of thyroid in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatrics-specific
        problems that would limit the usefulness of thyroid in the elderly. However,
        elderly patients are more likely to have age-related heart and blood vessel
        problems, which may require caution in patients receiving thyroid.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Midodrine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Kelp
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Adrenal insufficiency (untreated) or
      - Thyrotoxicosis (overactive thyroid), untreated—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Adrenal gland problems or
      - Angina or
      - Blood clotting problems or
      - Diabetes or
      - Heart or blood vessel disease (eg, coronary artery disease)—Use with caution.
        May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine will need to be taken for the rest of your life or your child's
      life . Do not stop taking this medicine or change your dose without first checking
      with your doctor.
  - type: paragraph
    text: If you are taking cholestyramine (Questran®), take it at least 4 hours before
      or 4 hours after you take this medicine .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablet): For hypothyroidism and thyroid cancer: Adults—At
        first, 30 milligrams (mg) once a day. Then, your doctor may increase your
        dose a little at a time up to the usual maintenance dose of 60 to 120 mg a
        day. A lower starting dose of 15 mg per day may be given to patients for certain
        conditions. Your doctor may adjust your dose as needed or tolerated. Children
        older than 12 years of age—Dose is based on body weight and must be determined
        by your doctor. The dose is usually more than 90 mg per day. Your doctor may
        adjust your dose as needed or tolerated. Children 6 to 12 years of age—Dose
        is based on body weight and must be determined by your doctor. The dose is
        usually 60 to 90 mg per day. Your doctor may adjust your dose as needed or
        tolerated. Children 1 to 5 years of age—Dose is based on body weight and must
        be determined by your doctor. The dose is usually 45 to 60 mg per day. Your
        doctor may adjust your dose as needed or tolerated. Children 6 to 12 months
        of age—Dose is based on body weight and must be determined by your doctor.
        The dose is usually 30 to 45 mg per day. Your doctor may adjust your dose
        as needed or tolerated. Children 0 to 6 months of age—Dose is based on body
        weight and must be determined by your doctor. The dose is usually 15 to 30
        mg per day. Your doctor may adjust your dose as needed or tolerated.'
    - type: list
      ordered: false
      items:
      - 'For hypothyroidism and thyroid cancer: Adults—At first, 30 milligrams (mg)
        once a day. Then, your doctor may increase your dose a little at a time up
