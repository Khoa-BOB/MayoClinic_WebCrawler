title: Emapalumab-lzsg (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Gamifant
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Emapalumab-lzsg injection is used to treat a blood disorder called primary
      hemophagocytic lymphohistiocytosis (HLH) that has come back or progressed, or
      in patients who have received other medicines that did not work well or cannot
      be tolerated. This medicine is also used to treat hemophagocytic lymphohistiocytosis/macrophage
      activation syndrome (HLH/MAS) in patients with known or suspected Still's disease,
      including systemic juvenile idiopathic arthritis (sJIA), when glucocorticoids
      (steroid medicine) did not work well or cannot be tolerated, or MAS has come
      back.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of emapalumab-lzsg injection in newborns
        and children. Safety and efficacy have been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of emapalumab-lzsg injection in the
        elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Cholera Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Poliovirus Vaccine, Live
      - Rotavirus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine, Live
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
      - Zoster Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Infection (eg, fungus, herpes zoster, tuberculosis)—Must be treated first
        before receiving this medicine.
    - type: list
      ordered: false
      items:
      - Weak immune system—Use with caution. May increase risk for more side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through an IV catheter that placed into one
      of your veins. The medicine must be given slowly, so the IV will need to stay
      in place for at least 1 hour.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: You may also be given other medicines (eg, antifungal, antiviral medicine,
      steroids) before receiving this medicine.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      closely while receiving the medicine and at regular visits to make sure this
      medicine is working properly. Blood tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: You or your child will need to have a skin test or blood test for tuberculosis
      before you start receiving this medicine. Tell your doctor if you or anyone
      in your home has ever had a positive reaction to a tuberculosis skin or blood
      test.
  - type: paragraph
    text: Call your doctor right away if you or your child start to have a cough that
      would not go away, weight loss, night sweats, fever, chills, flu-like symptoms
      (eg, runny or stuffy nose, headache, blurred vision, or feeling generally ill),
      painful or difficult urination, or sores, ulcers, or white spots in the mouth
      or on the lips. These may be signs that you have an infection.
  - type: paragraph
    text: While you are being treated with emapalumab-lzsg injection, do not have
      any immunizations (vaccinations) without your doctor's approval. Live virus
      vaccinations should not be given for at least 4 weeks after the last dose.
  - type: paragraph
    text: This medicine may cause infusion-related reactions, which can be life-threatening
      and require immediate medical attention. Tell your doctor right away if you
      start to have a fever, chills or shaking, dizziness, trouble breathing, itching
      or rash, lightheadedness, or fainting after receiving this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - back pain
      - black, tarry stools
      - bleeding gums
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - bloody stools
      - blurred vision
      - chest pain, discomfort, or tightness
      - chills
      - confusion
      - cough
      - decreased awareness or responsiveness
      - decreased urine
      - depression
      - difficult or labored breathing
      - dry mouth
      - fast, pounding, or irregular heartbeat or pulse
      - feeling of warmth
      - fever
      - flushed, dry skin
      - fruit-like breath odor
      - headache
      - hoarseness
      - hostility
      - increased hunger
      - increased thirst
      - increased urination
      - irritability
      - lightheadedness, dizziness, or fainting
      - loss of appetite
      - loss of consciousness
      - loss of taste or smell
      - lower back or side pain
      - mood changes
      - muscle pain, cramps, or twitching
      - nausea
      - nervousness
      - nosebleed
      - numbness or tingling in the hands, feet, or lips
      - painful or difficult urination
      - pinpoint red spots on the skin
      - pounding in the ears
      - rapid weight gain
      - rapid, shallow breathing
      - redness of the face, neck, arms and occasionally, upper chest
      - seizures
      - severe sleepiness
      - slow heartbeat
      - stomach pain
      - stuffy or runny nose
      - sweating
      - swollen glands
      - tenderness, pain, swelling, warmth, skin discoloration, and prominent superficial
        veins over affected area
      - trouble breathing
      - unusual bleeding or bruising
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
      - unusual weight gain or loss
      - vomiting
      - vomiting of blood or material that looks like coffee grounds
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - lack or loss of strength
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
