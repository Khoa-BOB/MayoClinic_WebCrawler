title: Thiethylperazine (oral route, intramuscular route, rectal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Torecan
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Thiethylperazine is a phenothiazine medicine. It is used to treat nausea
      and vomiting.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Children are usually more sensitive than adults to the effects of phenothiazine
        medicines such as thiethylperazine. Certain side effects, such as muscle spasms
        of the face, neck, and back, tic-like or twitching movements, inability to
        move the eyes, twisting of the body, or weakness of the arms and legs, are
        more likely to occur in children, especially those with severe illness or
        dehydration.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Elderly patients are usually more sensitive to the effects of phenothiazine
        medicines such as thiethylperazine. Confusion; difficult or painful urination;
        dizziness; drowsiness; feeling faint; or dryness of mouth, nose, or throat
        may be more likely to occur in elderly patients. Also, nightmares or unusual
        excitement, nervousness, restlessness, or irritability may be more likely
        to occur in elderly patients. In addition, uncontrolled movements may be more
        likely to occur in elderly patients taking thiethylperazine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
      - Saquinavir
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alfentanil
      - Alprazolam
      - Amifampridine
      - Apomorphine
      - Benzhydrocodone
      - Bromazepam
      - Buprenorphine
      - Bupropion
      - Butalbital
      - Butorphanol
      - Cabergoline
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Cetirizine
      - Clobazam
      - Clomipramine
      - Clonazepam
      - Codeine
      - Cyclobenzaprine
      - Cyproheptadine
      - Daridorexant
      - Dexmedetomidine
      - Diazepam
      - Dihydrocodeine
      - Donepezil
      - Doxepin
      - Doxylamine
      - Duloxetine
      - Epinephrine
      - Esketamine
      - Fentanyl
      - Flibanserin
      - Foscarbidopa
      - Foslevodopa
      - Fosphenytoin
      - Gabapentin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aminolevulinic Acid
      - Belladonna
      - Belladonna Alkaloids
      - Betel Nut
      - Evening Primrose
      - Phenylalanine
      - Tizanidine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse—This medicine, if taken together with alcohol, may lower the
        blood pressure and cause CNS depressant effects, such as severe drowsiness
    - type: list
      ordered: false
      items:
      - Asthma attack or
      - Other lung diseases—Thiethylperazine may cause secretions to become thick
        so that it might be difficult to cough them up, for example, during an asthma
        attack
    - type: list
      ordered: false
      items:
      - Blood disease or
      - Heart or blood vessel disease—This medicine may cause more serious conditions
        to develop
    - type: list
      ordered: false
      items:
      - Difficult urination or
      - Enlarged prostate—This medicine may cause urinary problems to get worse
    - type: list
      ordered: false
      items:
      - Glaucoma—This medicine may cause an increase in inner eye pressure
    - type: list
      ordered: false
      items:
      - Liver disease—Thiethylperazine may accumulate in the body, increasing the
        chance of side effects, such as muscle spasms
    - type: list
      ordered: false
      items:
      - Parkinson's disease or
      - Seizure disorders—The chance of thiethylperazine causing seizures or uncontrolled
        movements is greater when these conditions are present
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Thiethylperazine is used only to relieve or prevent nausea and vomiting.
      Use it only as directed. Do not use more of it and do not use it more often
      than your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: 'For patients taking this medicine by mouth:'
  - type: list
    ordered: false
    items:
    - This medicine may be taken with food or a full glass (8 ounces) of water or
      milk to reduce stomach irritation.
  - type: paragraph
    text: 'For patients using the suppository form of this medicine :'
  - type: list
    ordered: false
    items:
    - 'To insert suppository: First, remove foil wrapper and moisten the suppository
      with cold water. Lie down on your side and use your finger to push the suppository
      well up into the rectum. If the suppository is too soft to insert, chill it
      in the refrigerator for 30 minutes or run cold water over it before removing
      the foil wrapper.'
    - Wash your hands with soap and water.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For nausea and vomiting: For oral dosage form (tablets): Adults—10 milligrams
        (mg) one to three times a day. Children—Use and dose must be determined by
        your doctor. For injection dosage form: Adults—10 mg one to three times a
        day, injected into a muscle. Children—Use and dose must be determined by your
        doctor. For rectal dosage form (suppositories): Adults—10 mg one to three
        times a day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): Adults—10 milligrams (mg) one to three times
        a day. Children—Use and dose must be determined by your doctor.'
      - 'For injection dosage form: Adults—10 mg one to three times a day, injected
        into a muscle. Children—Use and dose must be determined by your doctor.'
      - 'For rectal dosage form (suppositories): Adults—10 mg one to three times a
        day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—10 milligrams (mg) one to three times a day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—10 mg one to three times a day, injected into a muscle.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—10 mg one to three times a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If you are going to be taking this medicine for a long time, your doctor
      should check your progress at regular visits, especially during the first few
      months of treatment with this medicine. This will allow your dosage to be changed
      if necessary to meet your needs.
  - type: paragraph
    text: Thiethylperazine will add to the effects of alcohol and other CNS depressants
      (medicines that cause you to feel drowsy or less alert). Some examples of CNS
      depressants are antihistamines or medicine for hay fever, other allergies, or
      colds; sedatives, tranquilizers, or sleeping medicine; prescription pain medicine
      or narcotics; barbiturates; medicine for seizures; muscle relaxants; or anesthetics,
      including some dental anesthetics. Check with your doctor before taking any
      of the above while you are using this medicine .
  - type: paragraph
    text: This medicine may cause some people to have blurred vision or to become
      dizzy, lightheaded, drowsy, or less alert than they are normally. Make sure
      you know how you react to this medicine before you drive, use machines, or do
      anything else that could be dangerous if you are dizzy or are not alert or able
      to see well.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up from a lying or sitting position. Getting up slowly may help. If the problem
      continues or gets worse, check with your doctor.
  - type: paragraph
    text: When using thiethylperazine on a regular basis, make sure your doctor knows
      if you are taking large amounts of aspirin or other salicylates at the same
      time (as for arthritis or rheumatism). Effects of too much aspirin, such as
      ringing in the ears, may be covered up by this medicine.
  - type: paragraph
    text: Thiethylperazine may cause dryness of the mouth, nose, and throat. For temporary
      relief of mouth dryness, use sugarless candy or gum, melt bits of ice in your
      mouth, or use a saliva substitute. However, if your mouth continues to feel
      dry for more than 2 weeks, check with your medical doctor or dentist. Continuing
      dryness of the mouth may increase the chance of dental disease, including tooth
      decay, gum disease, and fungus infections.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pains
      - aching muscles and joints
      - blurred vision, change in color vision, or difficulty in seeing at night
      - confusion (especially in the elderly)
      - convulsions (seizures)
      - difficulty in speaking or swallowing
      - fast heartbeat
      - fever and chills
      - inability to move eyes
      - lip smacking or puckering
      - loss of balance control
      - mask-like face
      - muscle spasms (especially of face, neck, and back)
      - nausea, vomiting, or diarrhea
      - nightmares (continuing)
      - nosebleeds
      - puffing of cheeks
      - rapid or fine, worm-like movements of tongue
      - shuffling walk
      - skin itching (severe)
      - sore throat and fever
      - stiffness of arms or legs
      - swelling of arms, hands, and face
      - tic-like or twitching movements
      - trembling and shaking of hands and fingers
      - twisting movements of body
      - uncontrolled chewing movements
      - uncontrolled movements of arms or legs
      - unusual bleeding or bruising
      - unusual excitement, nervousness, restlessness, or irritability
      - unusual tiredness or weakness
      - weakness of arms and legs
      - yellow eyes or skin
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion (severe)
      - convulsions (seizures)
      - dizziness (severe)
      - drowsiness (severe)
      - dry mouth (severe)
      - hyperextension of neck and trunk
      - inability to move eyes
      - loss of consciousness
      - spasms of face and neck
      - stuffy nose
      - troubled breathing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - drowsiness
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - dizziness or lightheadedness, especially when getting up from a lying or sitting
        position
      - dryness of mouth, nose and throat
      - fainting
      - fever
      - headache
      - ringing or buzzing in ears
      - skin rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
