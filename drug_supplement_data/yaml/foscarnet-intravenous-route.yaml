title: Foscarnet (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Foscavir
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Foscarnet injection is used to treat symptoms of cytomegalovirus (CMV) infection
      of the eyes in patients with acquired immune deficiency syndrome (AIDS). Foscarnet
      will not cure CMV eye infection, but it may help to control worsening of the
      symptoms. This medicine is also used to treat herpes simplex virus (HSV) infections
      of the skin and mucous membranes in people who are immunocompromised and whose
      infections did not improve with other treatment. Foscarnet may also be used
      for other serious viral infections as determined by your doctor. However, it
      does not work in treating certain viruses, such as the common cold or the flu.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of foscarnet injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of foscarnet injection in the elderly.
        However, elderly patients are more likely to have age-related kidney problems,
        which may require caution and an adjustment in the dose for patients receiving
        foscarnet injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Arsenic Trioxide
      - Bepridil
      - Cisapride
      - Dronedarone
      - Levoketoconazole
      - Levomethadyl
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Probucol
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acecainide
      - Acyclovir
      - Adagrasib
      - Ajmaline
      - Alfuzosin
      - Amikacin
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amoxapine
      - Amphotericin B
      - Anagrelide
      - Apomorphine
      - Aprindine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Asenapine
      - Aspirin
      - Astemizole
      - Atazanavir
      - Azimilide
      - Azithromycin
      - Bedaquiline
      - Bretylium
      - Bumetanide
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Capreomycin
      - Ceritinib
      - Chloral Hydrate
      - Chloroquine
      - Chlorpromazine
      - Cidofovir
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Electrolyte or mineral imbalance (eg, low calcium, phosphorus, magnesium,
        or potassium) or
      - Granulocytopenia (a low number of certain white blood cells) or
      - Heart disease or
      - Seizures—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Kidney disease—Use with caution. May have an increased risk for more serious
        side effects.
    - type: list
      ordered: false
      items:
      - Patients who are on a controlled sodium diet—Avoid foscarnet injection in
        patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other health professional will give you this medicine in a hospital.
      This medicine is given through a needle placed in one of your veins. The medicine
      must be injected slowly, so your IV tube will need to stay in place for at least
      1 to 2 hours.
  - type: paragraph
    text: This medicine may damage your kidneys. To help prevent this, you may have
      extra liquids given into your vein before or with your treatment. Your doctor
      may also want you to drink extra liquids while you are being given this medicine.
  - type: paragraph
    text: To ensure the best response, foscarnet must be given for the full time of
      treatment . Also, this medicine works best when there is a constant amount in
      the blood. To help keep the amount constant, foscarnet must be given on a regular
      schedule.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly. Blood
      and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you have a rash, itching, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are using this medicine.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you or anyone in your family has ever
      had a heart rhythm problem such as QT prolongation.
  - type: paragraph
    text: This medicine may cause sores on the genitals (sex organs). Washing your
      genitals after urination may decrease the chance of your developing this problem.
  - type: paragraph
    text: It is also very important that your ophthalmologist (eye doctor) check your
      eyes at regular visits since you may have some loss of eyesight due to retinitis
      even while you are receiving foscarnet injection.
  - type: paragraph
    text: This medicine may make you dizzy. Do not drive or do anything else that
      could be dangerous until you know how this medicine affects you .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Increased or decreased frequency of urination or amount of urine
      - increased thirst
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - convulsions
      - fever
      - muscle twitching
      - pain at the injection site
      - pain or numbness in hands or feet
      - tingling sensation around the mouth
      - tremor
      - unusual tiredness and weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sores or ulcers on the mouth or throat, penis, or vulva
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with breathing or swallowing
      - fainting
      - hives or welts, itching, or skin rash
      - irregular heartbeat recurrent
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - nausea
      - reddening of the skin, especially around the ears
      - swelling of the eyes, face, or inside of the nose
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - anxious feeling
      - confusion
      - dizziness
      - headache
      - loss of appetite
      - nausea and vomiting
      - unusual tiredness or weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
