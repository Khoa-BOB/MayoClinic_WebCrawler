title: Amikacin liposome (inhalation route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Arikayce
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Amikacin liposome is used to treat adults with refractory (difficult to
      treat) Mycobacterium avium complex (MAC) lung disease as part of a combination
      antibacterial drug treatment plan (regimen). This medicine is an aminoglycoside
      antibiotic.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of amikacin liposome in the pediatric population. Safety and
        efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of amikacin liposome in the elderly.
        However, elderly patients are more likely to have age-related kidney problems,
        which may require caution in the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Bumetanide
      - Emtricitabine
      - Ethacrynic Acid
      - Furosemide
      - Mannitol
      - Teicoplanin
      - Tenofovir Alafenamide
      - Urea
      - Vancomycin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma or
      - Bronchospasm or
      - Chronic obstructive pulmonary disease (COPD) or
      - Hyperreactive airway disease—Must be treated first before using this medicine.
    - type: list
      ordered: false
      items:
      - Ear or hearing problems or
      - Lung or breathing problems or
      - Nerve or muscle problems (eg, myasthenia gravis)—Use with caution. May make
        these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: This medicine is given through the Lamira™ Nebulizer System. Follow the
      instructions carefully on how to use it. Do not use the nebulizer system with
      any other medicine.
  - type: paragraph
    text: If you are using a bronchodilator (reliever) medicine for your lung or breathing
      problem, you should take it first before using this medicine.
  - type: paragraph
    text: Keep using this medicine for the full treatment time even if you feel better
      after the first few doses. Your infection may not clear up if you stop using
      the medicine too soon.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For inhalation dosage form (suspension): For Mycobacterium avium complex
        lung disease: Adults—One inhalation once a day using the Lamira™ Nebulizer
        System. Each dose contains 590 milligrams (mg) per 8.4 milliliters (mL) of
        amikacin. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For Mycobacterium avium complex lung disease: Adults—One inhalation once
        a day using the Lamira™ Nebulizer System. Each dose contains 590 milligrams
        (mg) per 8.4 milliliters (mL) of amikacin. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—One inhalation once a day using the Lamira™ Nebulizer System. Each
        dose contains 590 milligrams (mg) per 8.4 milliliters (mL) of amikacin.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store unopened vials of this medicine in the refrigerator. Do not freeze.
        An open vial of medicine must be used right away.
    - type: paragraph
      text: You may also store the vials at room temperature for up to 4 weeks. Throw
        away any unused medicine after 4 weeks.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: This medicine may cause hearing loss in your baby if used during pregnancy.
      Use an effective form of birth control to keep from getting pregnant during
      treatment with this medicine. If you think you have become pregnant while using
      this medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause allergic lung disease or worsen existing breathing
      problems. Check with your doctor right away if you cough up blood, have difficult,
      fast, or labored breathing, fever, or chest pain or tightness.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you have chest tightness, cough, dizziness, fast heartbeat,
      hives, rash, itching, puffiness or swelling of the eyelids, or around the eyes,
      face, lips, or tongue, trouble breathing or swallowing, or unusual tiredness
      or weakness while you are using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have dizziness, feeling of fullness
      in the ears, loss of balance, loss of hearing, ringing or buzzing in the ears,
      or trouble in hearing. These may be symptoms of a serious hearing or balance
      problem.
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, trouble breathing, unusual tiredness or weakness, vomiting, or
      weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - cough
      - coughing or spitting up blood
      - difficulty breathing
      - dizziness
      - feeling of fullness in the ears
      - fever
      - loss of balance
      - loss of hearing
      - noisy breathing
      - ringing or buzzing in the ears
      - sore throat
      - trouble hearing
      - upper airway irritation
      - voice changes
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Balance disorder
      - blue lips, fingernails, or skin
      - change in sputum
      - chest discomfort or pain
      - chills
      - cough producing mucus
      - general feeling of discomfort or illness
      - irregular, fast or slow, or shallow breathing
      - nosebleed
      - severe pain in the chest
      - sudden onset of severe breathing difficulty
      - thickening of bronchial secretions
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty swallowing
      - hives, itching, skin rash
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bone or muscle pain
      - decreased weight
      - diarrhea
      - headache
      - lack or loss of strength
      - nausea
      - rash
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - change in taste
      - dry mouth
      - loss of taste
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
