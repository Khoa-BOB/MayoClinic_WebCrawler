    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anuria (not able to pass urine) or
      - Diabetes patients or those with renal impairment who are also taking aliskiren
        (Tekturna®) or
      - Sulfa drug allergy (eg, sulfamethoxazole, sulfasalazine, sulfisoxazole, Azulfidine®,
        Bactrim®, Septra®)—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Asthma—May increase likelihood of having an allergic reaction.
    - type: list
      ordered: false
      items:
      - Congestive heart failure, severe—Use may lead to kidney problems.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Electrolyte imbalances (eg, high calcium or low magnesium, potassium, or sodium
        in the blood) or
      - Fluid imbalances (caused by dehydration, vomiting, or diarrhea) or
      - Gallbladder disease or gallstones, history of or
      - Glaucoma, secondary angle closure or
      - Gout or
      - Hyperlipidemia (high cholesterol or fats in the blood) or
      - Kidney problems or
      - Liver disease (including cirrhosis) or
      - Myopia, acute (changes in the eyeball causing vision problems) or
      - Systemic lupus erythematosus (an autoimmune disorder)—Use with caution. May
        make these conditions worse.
    - type: list
      ordered: false
      items:
      - Sympathectomy—Blood pressure–lowering effects may be increased.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine should not be the first medicine you use to treat your condition
      . It is meant to be used only after you have tried other medicines that have
      not worked or have caused unwanted side effects.
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these is most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure but it
      does help control it. Therefore, you must continue to take it as directed if
      you expect to lower your blood pressure and keep it down. You may have to take
      high blood pressure medicine for the rest of your life . If high blood pressure
      is not treated, it can cause serious problems such as heart failure, blood vessel
      disease, stroke, or kidney disease.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions in the insert carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the tablet whole. Do not break, crush, or chew it. You may take
      this medicine with or without food.
  - type: paragraph
    text: If you also use cholestyramine or colestipol, take these at least 4 to 6
      hours before or 4 hours after you take this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For high blood pressure: Adults—At first,
        one tablet containing 40 milligrams (mg) of telmisartan and 12.5 mg of hydrochlorothiazide
        once a day. Your doctor may adjust your dose if needed. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—At first, one tablet containing 40 milligrams
        (mg) of telmisartan and 12.5 mg of hydrochlorothiazide once a day. Your doctor
        may adjust your dose if needed. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, one tablet containing 40 milligrams (mg) of telmisartan and
        12.5 mg of hydrochlorothiazide once a day. Your doctor may adjust your dose
        if needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the tablets in the blister pack and remove only the medicine you
        need when you are ready to take your dose.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby, especially
      in your second or third trimester. Use an effective form of birth control to
      keep from getting pregnant. If you think you have become pregnant while using
      this medicine, tell your doctor right away. You may need to stop using this
      medicine.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up from a lying or sitting position. Make sure you know how you react to this
      medicine before you drive, use machines, or do anything else that could be dangerous
      if you are dizzy or not alert . If you feel dizzy, lie down so you do not faint.
      Then sit for a few moments before standing to prevent the dizziness from returning.
  - type: paragraph
    text: Check with your doctor right away if you become sick while taking this medicine,
      especially with severe or continuing nausea, vomiting, or diarrhea. These conditions
      may cause you to lose too much water and lead to low blood pressure. You can
      also lose water by sweating, so drink plenty of water during exercise or in
      hot weather.
  - type: paragraph
    text: This medicine may affect blood sugar levels. If you notice a change in the
      results of your blood or urine sugar tests, or if you have any questions, check
      with your doctor.
  - type: paragraph
    text: Check with your doctor immediately if blurred vision, difficulty in reading,
      eye pain, or any other change in vision occurs during or after treatment. This
      could be a sign of a serious eye problem. Your doctor may want you to have your
      eyes checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have stomach pain, confusion,
      irregular heartbeat, nausea or vomiting, nervousness, numbness or tingling in
      the hands, feet, or lips, trouble breathing, or weakness or heaviness of the
      legs. Do not use medicines, supplements, or salt substitutes containing potassium
      without first checking with your doctor .
  - type: paragraph
    text: This medicine may increase your risk of getting skin cancer (eg, non-melanoma
      skin cancer). Avoid sun exposure. Use a sunscreen when you are outdoors. Avoid
      sunlamps and tanning beds. Talk to your doctor if you have concerns about this
      risk.
  - type: paragraph
    text: Alcohol, narcotic pain relievers, or sleeping pills may cause you to feel
      more lightheaded, dizzy, or faint when used with this medicine. Tell your doctor
      if you are drinking alcohol or using pain relievers or sleeping pills.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes nonprescription medicines, such as aspirin, and medicines
      for appetite control, asthma, colds, cough, hay fever, or sinus problems, since
      they may increase your blood pressure.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - blurred vision
      - confusion
      - decreased urine
      - difficult, burning, or painful urination
      - dizziness, faintness, or lightheadedness when getting up from a lying or sitting
        position
      - dry mouth
      - fainting
      - fast, pounding, or irregular heartbeat or pulse
      - frequent urge to urinate
      - increased thirst
      - loss of appetite
      - lower back or side pain
      - muscle pain or cramps
      - nausea or vomiting
      - numbness or tingling in the hands, feet, or lips
      - seizures
      - sudden sweating
      - trouble breathing
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - cold sweats
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Persistent non-healing sore
      - pink growth
      - reddish patch or irritated area
      - shiny bump
      - white, yellow or waxy scar-like area
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - cough
      - difficulty breathing
      - dizziness
      - ear congestion
      - fever
      - headache
      - loss of voice
      - runny or stuffy nose
      - sneezing
      - sore throat
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - back pain
      - belching
      - blistering, peeling, loosening of the skin
      - cough producing mucus
      - diarrhea
      - heartburn
      - hoarseness
      - indigestion
      - itching
      - joint pain
      - loss of appetite
      - muscle aches and pains
      - pain or tenderness around the eyes and cheekbones
      - rash
      - red irritated eyes
      - red skin lesions, often with a purple center
      - shivering
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach pain
      - sweating
      - tender, swollen glands in the neck
      - tightness in the chest
      - trouble sleeping
      - trouble swallowing
      - voice changes
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased interest in sexual intercourse
      - inability to have or keep an erection
      - loss in sexual ability, desire, drive, or performance
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
