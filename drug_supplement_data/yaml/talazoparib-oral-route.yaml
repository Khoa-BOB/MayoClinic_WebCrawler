title: Talazoparib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Talzenna
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Talazoparib is used to treat HER2-negative locally advanced or metastatic
      breast cancer (cancer that has spread) with a deleterious or suspected deleterious
      BRCA mutation gene. Your doctor will use a test to check for this mutation before
      you receive the medicine.
  - type: paragraph
    text: Talazoparib is also used together with enzalutamide to treat metastatic
      castration-resistant prostate cancer (prostate cancer that is resistant to medical
      or surgical treatments that lower testosterone and has spread to other parts
      of the body) with certain abnormal inherited or acquired genes called homologous
      recombination repair (HRR genes). Your doctor will use a test to check for this
      mutation before you receive the medicine.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule, Liquid Filled
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of talazoparib in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of talazoparib in the elderly. However,
        elderly patients are more sensitive to the effects of this medicine than younger
        adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Amiodarone
      - Apalutamide
      - Asciminib
      - Berotralstat
      - Capmatinib
      - Carvedilol
      - Cholera Vaccine
      - Clarithromycin
      - Cobicistat
      - Cyclosporine
      - Daclatasvir
      - Danicopan
      - Darolutamide
      - Dasabuvir
      - Ebola Zaire Vaccine, Live
      - Elacestrant
      - Elbasvir
      - Eltrombopag
      - Enasidenib
      - Febuxostat
      - Fostamatinib
      - Fostemsavir
      - Glecaprevir
      - Grazoprevir
      - Influenza Virus Vaccine, Live
      - Itraconazole
      - Lenacapavir
      - Leniolisib
      - Momelotinib
      - Oteseconazole
      - Pacritinib
      - Pantoprazole
      - Paritaprevir
      - Pibrentasvir
      - Regorafenib
      - Ritonavir
      - Rolapitant
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood or bone marrow problems or
      - Kidney disease, moderate or severe—Use with caution. May make these conditions
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: 'For prostate cancer : You should also receive a gonadotropin-releasing
      hormone (GnRH) analog treatment or have had a surgery to lower testosterone
      in your body (surgical castration) during treatment with this medicine.'
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the capsule whole. Do not open, crush, break, or dissolve it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For breast cancer: Adults—1 milligram (mg)
        once a day. Your doctor may adjust your dose as needed and tolerated. Children—Use
        and dose must be determined by your doctor. For prostate cancer: Adults—0.5
        milligram (mg) once a day. Your doctor may adjust your dose as needed and
        tolerated. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For breast cancer: Adults—1 milligram (mg) once a day. Your doctor may adjust
        your dose as needed and tolerated. Children—Use and dose must be determined
        by your doctor.'
      - 'For prostate cancer: Adults—0.5 milligram (mg) once a day. Your doctor may
        adjust your dose as needed and tolerated. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—1 milligram (mg) once a day. Your doctor may adjust your dose as needed
        and tolerated.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—0.5 milligram (mg) once a day. Your doctor may adjust your dose as
        needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you vomit after taking a dose, do not take an extra dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to check for any problems that may be caused by this medicine. Blood and urine
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you are a woman who can get pregnant, your doctor may do tests to make sure
      you are not pregnant before starting this medicine. It may also cause birth
      defects if the father is using it when his sexual partner becomes pregnant.
      Female patients should use effective birth control during treatment with this
      medicine and for at least 7 months after the last dose. Male patients who have
      female partners should use effective birth control during treatment with this
      medicine and for at least 4 months after the last dose. If you think you have
      become pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: Tell your doctor if you have bone pain, blood in the urine or stools, fever
      or chills, cough, sore throat, trouble breathing, unusual bleeding or bruising,
      or unusual tiredness or weakness. These may be symptoms of a bone marrow problem
      called myelodysplastic syndrome (MDS) or acute myeloid leukemia (AML).
  - type: paragraph
    text: If you plan to have children, talk with your doctor before using this medicine.
      Some men using this medicine have become infertile (unable to have children).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - bone pain or fracture
      - chest pain
      - chills
      - cough
      - fever
      - hoarseness
      - lower back or side pain
      - painful or difficult urination
      - pale skin
      - pinpoint red spots on the skin
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swelling or inflammation of the mouth
      - swollen glands
      - trouble breathing with exertion
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - change or loss of taste
      - decreased appetite
      - diarrhea
      - dizziness
      - headache
      - heartburn
      - indigestion
      - nausea
      - stomach discomfort, upset, or pain
      - thinning or loss of hair
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
