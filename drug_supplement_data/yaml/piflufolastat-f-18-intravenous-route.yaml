title: Piflufolastat f 18 (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Pylarify
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Piflufolastat F 18 injection is used with a PET scan (positron emission
      tomography) of prostate-specific membrane antigen (PSMA) positive lesions in
      men with prostate cancer. It is given in patients with suspected metastasis
      (cancer that has spread to the other parts of the body) who are candidates for
      initial treatment and with suspected recurrence (cancer that keeps coming back)
      based on an increased serum prostate-specific antigen (PSA) level.
  - type: paragraph
    text: Piflufolastat F 18 is a radiopharmaceutical. Radiopharmaceuticals are radioactive
      agents, which may be used to find and treat certain diseases or to study the
      function of the body's organs.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor with specialized training in nuclear medicine.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a diagnostic test, any risks of the test must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      Also, other things may affect test results. For this test, the following should
      be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of piflufolastat F 18 injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of piflufolastat F 18 injection in
        the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine.
      This medicine is given through a needle placed in one of your veins just before
      you have a PET scan.
  - type: paragraph
    text: Drink enough water to be hydrated before the PET scan.
  - type: paragraph
    text: You will need to urinate right away and as often as possible for the first
      few hours after the PET scan.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you closely while you are receiving
      this medicine . This will allow your doctor to see if the medicine is working
      properly and to decide if you should continue to receive it.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, which can be life-threatening
      and require immediate medical attention. Check with your doctor right away if
      you have a difficulty in breathing or swallowing, fast heartbeat, skin itching,
      rash, or redness, or swelling of the face, throat, or tongue after you receive
      the injection.
  - type: paragraph
    text: While receiving this medicine, you will be exposed to radiation and increase
      risk of cancer. If you have any questions about this, talk to your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with breathing or swallowing
      - fast heartbeat
      - skin itching, rash, or redness
      - swelling of the face, throat, or tongue
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in taste
      - headache
      - loss of taste
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain, redness, or irritation at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
