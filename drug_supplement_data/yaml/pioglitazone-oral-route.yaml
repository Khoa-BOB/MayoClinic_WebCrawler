title: Pioglitazone (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Actos
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Pioglitazone is used with proper diet and exercise to treat high blood sugar
      levels caused by type 2 diabetes. It may be used alone or with other medicines
      such as insulin, metformin, or sulfonylurea agents. Pioglitazone works by helping
      your body use insulin better. This medicine does not help patients who have
      insulin-dependent or type 1 diabetes.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of pioglitazone in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of pioglitazone in the elderly. However,
        elderly patients are more likely to have age-related heart disease, which
        may require an adjustment in the dose for patients receiving pioglitazone.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Ranolazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Acarbose
      - Amlodipine
      - Atogepant
      - Cannabidiol
      - Carbamazepine
      - Cariprazine
      - Chloroquine
      - Chlorothiazide
      - Chlorpropamide
      - Chlorthalidone
      - Ciprofloxacin
      - Delafloxacin
      - Enoxacin
      - Furosemide
      - Gatifloxacin
      - Gemfibrozil
      - Gemifloxacin
      - Glimepiride
      - Glipizide
      - Glyburide
      - Grepafloxacin
      - Hydrochlorothiazide
      - Hydroflumethiazide
      - Hydroxychloroquine
      - Ifosfamide
      - Indapamide
      - Insulin
      - Insulin Aspart, Recombinant
      - Insulin Bovine
      - Insulin Degludec
      - Insulin Detemir
      - Insulin Glargine, Recombinant
      - Insulin Glulisine
      - Insulin Lispro, Recombinant
      - Ivosidenib
      - Lanreotide Acetate
      - Levofloxacin
      - Lomefloxacin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acebutolol
      - Atenolol
      - Atorvastatin
      - Betaxolol
      - Bisoprolol
      - Bitter Melon
      - Carteolol
      - Carvedilol
      - Celiprolol
      - Clopidogrel
      - Esmolol
      - Fenugreek
      - Glecaprevir
      - Glucomannan
      - Guar Gum
      - Ketoconazole
      - Labetalol
      - Levobunolol
      - Metipranolol
      - Metoprolol
      - Nadolol
      - Nebivolol
      - Nilotinib
      - Oxprenolol
      - Penbutolol
      - Pibrentasvir
      - Pindolol
      - Practolol
      - Propranolol
      - Psyllium
      - Sotalol
      - Timolol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bladder cancer, active or
      - Diabetic ketoacidosis (high ketones and acid in the blood) or
      - Heart failure, severe or
      - Type I diabetes—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Diabetic macular edema (swelling of the back of the eye) or
      - Edema (fluid retention or swelling) or
      - Heart disease or
      - Liver disease—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Fever or
      - Infection or
      - Surgery or
      - Trauma—Use with caution. These conditions may cause problems with blood sugar
        control.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Carefully follow the special diet your doctor gave you . This is the most
      important part of controlling your diabetes and will help the medicine work
      properly. Exercise regularly and test for sugar in your blood or urine as directed.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: The tablets may be taken with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For type 2 diabetes: Adults—At first, 15
        or 30 milligrams (mg) once a day. Your doctor may adjust your dose as needed.
        However, the dose is usually not more than 45 mg once a day. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For type 2 diabetes: Adults—At first, 15 or 30 milligrams (mg) once a day.
        Your doctor may adjust your dose as needed. However, the dose is usually not
        more than 45 mg once a day. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 15 or 30 milligrams (mg) once a day. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 45 mg once
        a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly and to decide if you should
      continue to use it. Blood and urine tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: This medicine may cause some women who do not have regular monthly periods
      to ovulate. This can increase the chance of pregnancy. If you are a woman of
      childbearing potential, you should discuss birth control options with your doctor.
  - type: paragraph
    text: If you are rapidly gaining weight, having shortness of breath, chest pain
      or discomfort, extreme tiredness or weakness, irregular breathing, irregular
      heartbeat, or excessive swelling of the hands, wrist, ankles, or feet, check
      with your doctor immediately. These may be symptoms of a serious heart problem.
  - type: paragraph
    text: If you have abdominal or stomach pain, dark urine, a loss of appetite, nausea
      or vomiting, unusual tiredness or weakness, or yellow eyes or skin, check with
      your doctor right away. These may be symptoms of a serious liver problem.
  - type: paragraph
    text: Check with your doctor right away if blurred vision, decreased vision, or
      any other change in vision occurs while you are taking this medicine. Your doctor
      may want you to have your eyes checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: This medicine may increase the risk for bone fractures in women. Ask your
      doctor about ways to keep your bones strong to help prevent fractures.
  - type: paragraph
    text: This medicine may increase your risk for bladder cancer if you take it for
      more than 12 months. Tell your doctor right away if you have blood in the urine,
      a frequent, strong, or increased urge to urinate, painful urination, or pain
      in the back, lower abdomen, or stomach.
  - type: paragraph
    text: This medicine can cause hypoglycemia (low blood sugar). However, low blood
      sugar can occur if you delay or miss a meal or snack, exercise more than usual,
      drink alcohol, cannot eat because of nausea or vomiting, or take certain medicines.
      Low blood sugar must be treated before it causes you to pass out (unconsciousness).
      People feel different symptoms of low blood sugar . It is important that you
      learn which symptoms you have in order to treat it quickly. Talk to your doctor
      about the best way to treat low blood sugar.
  - type: paragraph
    text: Hyperglycemia (high blood sugar) may occur if you do not take enough or
      skip a dose of your medicine, overeat or do not follow your meal plan, have
      a fever or infection, or do not exercise as much as usual. High blood sugar
      can be very serious and must be treated right away . It is important that you
      learn which symptoms you have in order to treat it quickly. Talk to your doctor
      about the best way to treat high blood sugar.
  - type: paragraph
    text: There may be a time when you need emergency help for a problem caused by
      your diabetes. You need to be prepared for these emergencies. It is a good idea
      to wear a medical identification (ID) bracelet or neck chain at all times. Also,
      carry an ID card in your wallet or purse that says you have diabetes with a
      list of all your medicines.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - decreased urine output
      - dilated neck veins
      - extreme fatigue
      - irregular breathing
      - irregular heartbeat
      - problems with teeth
      - swelling of the face, fingers, feet, or lower legs
      - tightness in the chest
      - trouble breathing
      - weight gain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain or swelling in the arms or legs without an injury
      - pale skin
      - swelling
      - trouble with breathing when active
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dark urine
      - loss of appetite
      - nausea or vomiting
      - stomach pain
      - unexplained, rapid weight gain
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision or other changes in vision
      - cough
      - dry mouth
      - flushed, dry skin
      - fruit-like breath odor
      - headache
      - increased hunger
      - increased thirst
      - increased urination
      - loss of consciousness
      - muscle pain or soreness
      - problems with your teeth
      - runny or stuffy nose
      - sore throat
      - stomachache
      - sweating
      - unexplained weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
