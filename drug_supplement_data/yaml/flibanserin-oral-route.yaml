      - Netupitant
      - Nilotinib
      - Nirmatrelvir
      - Nirogacestat
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acepromazine
      - Afatinib
      - Alfentanil
      - Alprazolam
      - Amobarbital
      - Anileridine
      - Apalutamide
      - Aripiprazole
      - Asciminib
      - Asenapine
      - Avacopan
      - Baclofen
      - Belzutifan
      - Benperidol
      - Benzhydrocodone
      - Betrixaban
      - Bromazepam
      - Buprenorphine
      - Buspirone
      - Butabarbital
      - Butalbital
      - Butorphanol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Carisoprodol
      - Carphenazine
      - Cetirizine
      - Chloral Hydrate
      - Chlordiazepoxide
      - Chlorpromazine
      - Chlorzoxazone
      - Clobazam
      - Clomipramine
      - Clonazepam
      - Clorazepate
      - Clozapine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Digoxin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Depression or mental illness, history of or
      - Drug or alcohol abuse, or history of or
      - Hypotension (low blood pressure)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Liver problem—Should not be used in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: The medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: Take flibanserin only at bedtime. Taking this medicine at a time other than
      bedtime may increase risk of low blood pressure, fainting, accidental injury,
      or sleepiness.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine . Grapefruit and grapefruit juice may change the amount of this medicine
      that is absorbed in the body.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of hypoactive sexual desire
        disorder: Adults—100 milligrams (mg) once a day at bedtime. Children—Use is
        not recommended.'
    - type: list
      ordered: false
      items:
      - 'For treatment of hypoactive sexual desire disorder: Adults—100 milligrams
        (mg) once a day at bedtime. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—100 milligrams (mg) once a day at bedtime.
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly and to check for unwanted
      effects.
  - type: paragraph
    text: Do not use this medicine together with amprenavir, atazanavir (Reyataz®),
      boceprevir (Victrelis®), ciprofloxacin (Cipro®), clarithromycin (Biaxin®), conivaptan
      (Vaprisol®), diltiazem (Cardizem®), erythromycin (Ery-Tab®), fluconazole (Diflucan®),
      fosamprenavir (Lexiva®), indinavir (Crixivan®), itraconazole (Sporanox®), ketoconazole
      (Nizoral®), nefazodone, nelfinavir (Viracept®), posaconazole (Noxafil®), ritonavir
      (Norvir®), saquinavir (Invirase®), telaprevir, telithromycin (Ketek®), or verapamil
      (Calan®). Using these medicines together may increase risk for low blood pressure
      and fainting .
  - type: paragraph
    text: Lightheadedness, dizziness, or fainting may occur when you take flibanserin
      within 2 hours of drinking alcohol. It is recommended to wait at least 2 hours
      after drinking 1 or 2 standard alcoholic drinks (eg, one 12-ounce regular beer,
      5 ounces of wine, or 1.5 ounces of distilled spirits or shot) before taking
      flibanserin at bedtime, or you may skip your dose if you drink 3 or more standard
      alcoholic drinks in the evening. If you have taken flibanserin at bedtime, do
      not drink alcohol until the following day.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that may make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicines for hay fever, allergies, or colds, sedatives,
      tranquilizers, or sleeping medicine, prescription pain medicine or narcotics,
      medicine for seizures or barbiturates, muscle relaxants, or anesthetics, including
      some dental anesthetics. Check with your doctor before taking any of these medicines
      while you are using flibanserin .
  - type: paragraph
    text: If your condition does not improve within 8 weeks, or if it become worse,
      check with your doctor.
  - type: paragraph
    text: This medicine may cause you to feel dizzy, drowsy, or lightheaded. Avoid
      driving, using machines, or doing anything else that could be dangerous if you
      are not alert for at least 6 hours after you take this medicine and until you
      know how this medicine affects you . If you feel lightheaded, getting up slowing
      after sitting or lying down may help.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Check with your doctor right away if you have chest tightness, cough,
      difficulty swallowing, dizziness, fast heartbeat, hives, itching, skin rash,
      large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
      feet, or sex organs, or unusual tiredness or weakness.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - dizziness, fainting, or lightheadedness, especially when getting up suddenly
        from a lying or sitting position
      - sleepiness or unusual drowsiness
      - sweating
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Feeling of constant movement of self or surroundings
      - sensation of spinning
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating
      - fever
      - nausea
      - severe cramping
      - stomach or lower abdominal pain
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - cough
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - hives, itching, skin rash
      - large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
        feet, or sex organs
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - dry mouth
      - nervousness
      - normal menstrual bleeding occurring earlier, possibly lasting longer than
        expected
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
