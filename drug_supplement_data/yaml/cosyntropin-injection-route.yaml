title: Cosyntropin (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cortrosyn
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cosyntropin injection is used to help diagnose adrenal gland problems. Cosyntropin
      injection is a man-made form of a hormone called adrenocorticotropic hormone
      (ACTH) that is normally produced by the pituitary gland.
  - type: paragraph
    text: This medicine is to be used only by or under the direct supervision of a
      doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a diagnostic test, any risks of the test must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      Also, other things may affect test results. For this test, the following should
      be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of cosyntropin injection in children.
        Safety and efficacy have been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of cosyntropin injection in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this diagnostic test,
        it is especially important that your healthcare professional know if you are
        taking any of the medicines listed below. The following interactions have
        been selected on the basis of their potential significance and are not necessarily
        all-inclusive.
    - type: paragraph
      text: Receiving this diagnostic test with any of the following medicines is
        usually not recommended, but may be required in some cases. If both medicines
        are prescribed together, your doctor may change the dose or how often you
        use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Alclometasone
      - Amcinonide
      - Balofloxacin
      - Beclomethasone
      - Besifloxacin
      - Betamethasone
      - Budesonide
      - Bupropion
      - Chlorotrianisene
      - Ciclesonide
      - Ciprofloxacin
      - Clobetasol
      - Clobetasone
      - Clocortolone
      - Conjugated Estrogens
      - Conjugated Estrogens Synthetic A
      - Conjugated Estrogens Synthetic B
      - Cortisone
      - Deflazacort
      - Desonide
      - Desoximetasone
      - Dexamethasone
      - Dienestrol
      - Diethylstilbestrol
      - Diflorasone
      - Diflucortolone
      - Difluprednate
      - Enoxacin
      - Esterified Estrogens
      - Estradiol
      - Estramustine
      - Estriol
      - Estropipate
      - Ethinyl Estradiol
      - Fleroxacin
      - Flucloronide
      - Flumequine
      - Flumethasone
      - Flunisolide
      - Fluocinolone
    - type: paragraph
      text: Receiving this diagnostic test with any of the following medicines may
        cause an increased risk of certain side effects, but using both drugs may
        be the best treatment for you. If both medicines are prescribed together,
        your doctor may change the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Licorice
      - Saiboku-To
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this medicine. This medicine is given as a shot into a muscle or into a vein.
  - type: paragraph
    text: Do not take spironolactone or glucocorticoids on the day of cosyntropin
      testing. Do not take medicines that contain estrogen 4 to 6 weeks before receiving
      this medicine.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you have a rash, itching, trouble breathing, trouble
      swallowing, or any swelling of your hands, face, or mouth while you or your
      child are receiving this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - blurred vision
      - chest pain, discomfort, or tightness
      - cough
      - difficulty swallowing
      - dizziness
      - fast, pounding, or irregular heartbeat or pulse
      - headache
      - hives, itching, skin rash
      - nervousness
      - pounding in the ears
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid weight gain
      - slow or irregular heartbeat
      - tingling of the hands or feet
      - trouble breathing
      - unusual tiredness or weakness
      - unusual weight gain or loss
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
