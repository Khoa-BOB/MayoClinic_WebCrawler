title: Umbralisib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ukoniq
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Umbralisib is used to treat marginal zone lymphoma (MZL) that has come back
      (relapsed) or did not respond to the treatment (refractory) in patients who
      have received at least one previous treatment (eg, anti-CD20-based treatment).
      It is also used to treat follicular lymphoma (FL) that has come back or did
      not respond to treatment in patients who have received at least 3 previous treatments.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: This medicine was withdrawn from the U.S. market on June 1, 2022, due to
      safety concerns.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of umbralisib in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of umbralisib in the elderly. However,
        elderly patients are more likely to have unwanted effects (eg, serious infections),
        which may require caution in patients receiving umbralisib.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to aspirin—Use with caution. This medicine contains a yellow dye called
        tartrazine, which may cause allergic reactions (including asthma) in patients
        with this condition.
    - type: list
      ordered: false
      items:
      - Infection—May decrease your body's ability to fight an infection.
    - type: list
      ordered: false
      items:
      - Liver disease or
      - Stomach or bowel problems—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before using this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the tablet whole. Do not crush, break, cut, or chew it.
  - type: paragraph
    text: It is best to take this medicine with food. Take the medicine at the same
      time each day.
  - type: paragraph
    text: You may also receive medicines to help prevent infections during treatment
      with this medicine.
  - type: paragraph
    text: Drink plenty of water each day to help prevent dehydration caused by diarrhea.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For marginal zone lymphoma or follicular
        lymphoma: Adults—800 milligrams (mg) once a day. Your doctor may adjust your
        dose as needed and tolerated. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - 'For marginal zone lymphoma or follicular lymphoma: Adults—800 milligrams
        (mg) once a day. Your doctor may adjust your dose as needed and tolerated.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—800 milligrams (mg) once a day. Your doctor may adjust your dose as
        needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is more than 12 hours until your next scheduled
        dose, take it as soon as possible, and then go back to your regular schedule.
        If you miss a dose and it is less than 12 hours until your next scheduled
        dose, skip the missed dose and take your next dose at the regular time.
    - type: paragraph
      text: If you vomit after taking a dose, do not take an extra dose. Take the
        next dose at the regular time.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. It
      may also cause birth defects if the father is using it when his sexual partner
      becomes pregnant. If you are a woman who can get pregnant, your doctor may do
      tests to make sure you are not pregnant before starting treatment. Use an effective
      form of birth control during treatment and for at least 1 month after the last
      dose. Males with female partners who are able to become pregnant should use
      an effective form of birth control during treatment and for at least 1 month
      after the last dose. If you think you have become pregnant, tell your doctor
      right away.
  - type: paragraph
    text: Some men who use this medicine have become infertile (unable to have children).
      Talk yo your doctor before using this medicine if you plan to have children.
  - type: paragraph
    text: This medicine may cause serious infections. Check with your doctor right
      away if you have chest pain, fever or chills, confusion, cough or hoarseness,
      dizziness, fainting, fast heartbeat, lightheadedness, lower back or side pain,
      painful or difficult urination, sneezing, sore throat, tightness in the chest,
      or trouble breathing.
  - type: paragraph
    text: 'Umbralisib can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. It can also lower the
      number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in urine or stools, or pinpoint red spots on your
      skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: This medicine may cause severe diarrhea or non-infectious colitis. Check
      with your doctor right away if you have fever, pain, stomach cramps, tenderness,
      or watery or bloody diarrhea.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: This medicine may cause serious skin reactions (eg, exfoliative dermatitis).
      Check with your doctor right away if you have cracks in the skin, flushing,
      redness of the skin, loss of heat from the body, rash, red, swollen skin, scaly
      skin, or unusually warm skin.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bladder pain
      - bleeding gums
      - bloody or cloudy urine
      - body aches or pain
      - chest pain or tightness
      - chills
      - clay colored stools
      - confusion
      - cracks in the skin
      - cough
      - dark urine
      - decreased appetite
      - difficult, burning, or painful urination
      - dizziness or lightheadedness
      - ear congestion
      - fainting
      - fast heartbeat
      - fever
      - frequent urge to urinate
      - headache
      - itching, skin rash
      - loss of heat from the body
      - loss of voice
      - lower back or side pain
      - muscle or bone pain
      - nausea and vomiting
      - pain or tenderness around the eyes and cheekbones
      - pale skin
      - pinpoint red spots on the skin
      - rapid, shallow breathing
      - red, swollen skin
      - scaly skin
      - sneezing
      - stomach cramps, tenderness, or pain
      - stuffy or runny nose
      - sore throat
      - swelling of the hands, ankles, feet, or lower legs
      - trouble breathing
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - watery or bloody diarrhea
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
