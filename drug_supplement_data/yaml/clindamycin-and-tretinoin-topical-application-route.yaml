title: Clindamycin and tretinoin (topical application route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Veltin
    - type: paragraph
      text: Ziana
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Clindamycin and tretinoin topical is used to treat acne. It works by killing
      the bacteria that cause acne and by keeping the skin pores (tiny openings on
      the skin's surface) clear.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Gel/Jelly
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of clindamycin and tretinoin topical in children younger than
        12 years of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of clindamycin
        and tretinoin topical have not been performed in the geriatric population.
        However, no geriatric-specific problems have been documented to date.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Erythromycin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atracurium
      - Metocurine
      - Tubocurarine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Colitis caused by antibiotics, history of or
      - Crohn's disease or
      - Ulcerative colitis—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine only as directed . Do not
      use more of it, do not use it more often, and do not use it for a longer time
      than your doctor ordered. To do so may cause your skin to become too dry or
      irritated. You may need to use this medicine for several weeks or months before
      your skin starts to look better. Applying extra medicine will not make it work
      faster.
  - type: paragraph
    text: This medicine is for use on the skin only . Do not get it in your eyes,
      mouth, nose, on the corners of your nose, or vagina. Do not use it on skin areas
      that have cuts, scrapes, or burns. If it does get on these areas, rinse it off
      right away.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions in the insert carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: 'To use:'
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and water before and after using this medicine.
    - Before applying this medicine, wash your face with warm water and a mild soap,
      rinse well, and pat dry.
    - Apply just enough medicine to lightly cover the affected areas, and rub it in
      gently but well. A pea-sized amount is enough to cover the whole face.
    - You should not wash your face too often, 2 or 3 times a day is enough. Washing
      your face too often may dry your skin and make the acne worse.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (gel): For acne: Adults and teenagers—Apply to the
        affected area(s) of the skin once a day, at bedtime. Children younger than
        12 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For acne: Adults and teenagers—Apply to the affected area(s) of the skin
        once a day, at bedtime. Children younger than 12 years of age—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—Apply to the affected area(s) of the skin once a day,
        at bedtime.
      - Children younger than 12 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits.
      This will allow your doctor to see if the medicine is working properly and to
      decide if you should continue to take it.
  - type: paragraph
    text: Stop using this medicine and call your doctor right away if you start having
      severe, watery diarrhea or bloody diarrhea. This could be a sign of a serious
      side effect. Do not take any medicine for diarrhea without checking first with
      your doctor. Some medicines may make your diarrhea worse or make it last longer.
  - type: paragraph
    text: This medicine may make your skin more sensitive to sunlight, wind, and cold
      weather. Use a sunscreen when you are outdoors. Avoid sunlamps and tanning beds.
      You may need to wear protective clothing, such as a hat.
  - type: paragraph
    text: Skin reactions can occur when you use this medicine, such as dryness, redness,
      peeling, burning, or stinging. Stop using this medicine and call your doctor
      right away if your skin becomes very red, swollen, blistered, or crusted.
  - type: paragraph
    text: This medicine may also cause a temporary change in skin color (lighter or
      darker). Talk to your doctor if this concerns you.
  - type: paragraph
    text: Tell your doctor if you are planning to have a surgery before using this
      medicine. This medicine may affect how certain anesthesia medicines (medicines
      used during surgery to make you numb) work.
  - type: paragraph
    text: Do not use any other medicines on the treated skin areas without asking
      your doctor. Avoid using any skin care products that can dry or irritate your
      skin. These include rough skin cleansers, soaps, or products that contain alcohol,
      spices, or lime.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dryness and peeling of the skin
      - flushing or redness of the skin
      - itching
      - unusually warm skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning or stinging at the site of application
      - changes in the color of the skin
      - fever
      - stomach cramps, tenderness, or pain
      - watery or bloody diarrhea
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - dry skin
      - headaches
      - muscle aches
      - pain and tenderness around the eyes and cheekbones
      - shortness of breath or troubled breathing
      - sore throat
      - stuffy or runny nose
      - tightness of the chest or wheezing
      - unusual tiredness or weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
