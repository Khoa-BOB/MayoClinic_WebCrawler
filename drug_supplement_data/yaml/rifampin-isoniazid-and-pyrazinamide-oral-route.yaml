    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
      - Histamine Containing Food
      - Tyramine Containing Food
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Adrenal gland problem or
      - Blood clotting problems or
      - Diabetes, history of or
      - Porphyria (an enzyme problem) or
      - Vitamin K deficiency—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Alcohol abuse, or history of—Use with caution. There may be an increased chance
        of getting liver problems (eg, hepatitis) if you take this medicine and drink
        alcohol daily.
    - type: list
      ordered: false
      items:
      - Gout, acute or
      - Liver disease, acute or severe or
      - Meningococcal disease (including infections of the lining of the brain and
        spinal cord [meningitis] and bloodstream [eg, bacteremia, septicemia])—Should
        not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Liver disease, chronic or
      - Patients with poor nutrition status—Use with caution. May increase risk for
        vitamin K deficiency, which may lead to excessive bleeding.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine should be taken on an empty stomach, 1 hour before or 2 hours
      after a meal, with a full of glass of water. It is important to take this medicine
      on a regular schedule.
  - type: paragraph
    text: If this medicine upsets your stomach, take it with food. Antacids may also
      help. However, do not take aluminum-containing antacids (eg, Maalox®, Mylanta®)
      within 1 hour of the time you take rifampin, isoniazid, and pyrazinamide combination.
      They may keep this medicine from working properly.
  - type: paragraph
    text: To help clear up your tuberculosis (TB) infection completely, it is very
      important that you keep taking this medicine for the full time of treatment
      , even if you begin to feel better after a few weeks. It is important that you
      do not miss any doses.
  - type: paragraph
    text: Your doctor may also want you to take pyridoxine (eg, Hexa-Betalin, vitamin
      B6) everyday to help prevent or lessen some of the side effects of isoniazid.
      If it is needed, it is very important to take pyridoxine everyday along with
      this medicine. Do not miss any doses.
  - type: paragraph
    text: If you are taking itraconazole, do not use rifampin, isoniazid, and pyrazinamide
      combination 2 weeks before and during itraconazole treatment.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For the treatment of tuberculosis: Adults
        and children 15 years of age and older weighing 55 kilograms (kg) (121 pounds)
        or more—6 tablets per day. Adults and children 15 years of age and older weighing
        between 45 and 54 kg (99 and 119 pounds)—5 tablets per day. Adults and children
        15 years of age and older weighing 44 kg (97 pounds) or less—4 tablets per
        day. Children younger than 15 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For the treatment of tuberculosis: Adults and children 15 years of age and
        older weighing 55 kilograms (kg) (121 pounds) or more—6 tablets per day. Adults
        and children 15 years of age and older weighing between 45 and 54 kg (99 and
        119 pounds)—5 tablets per day. Adults and children 15 years of age and older
        weighing 44 kg (97 pounds) or less—4 tablets per day. Children younger than
        15 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 15 years of age and older weighing 55 kilograms (kg) (121
        pounds) or more—6 tablets per day.
      - Adults and children 15 years of age and older weighing between 45 and 54 kg
        (99 and 119 pounds)—5 tablets per day.
      - Adults and children 15 years of age and older weighing 44 kg (97 pounds) or
        less—4 tablets per day.
      - Children younger than 15 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If rifampin, isoniazid, and pyrazinamide combination is taken on an irregular
        schedule, side effects may occur more often and may be more serious than usual.
        If you have any questions about this, check with your doctor.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits . Blood and urine tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: If your symptoms do not improve within 2 to 3 weeks, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: Do not use this medicine if you are also receiving lurasidone (Latuda®)
      or certain medicines to treat HIV infection (eg, atazanavir, darunavir, fosamprenavir,
      ritonavir, ritonavir-boosted saquinavir, saquinavir, tipranavir, Aptivus®, Fortovase®,
      Invirase®, Lexiva®, Norvir®, Prezista®, or Reyataz®).
  - type: paragraph
    text: Do not use this medicine together with praziquantel. If you need to take
      praziquantel, you should stop using this medicine 4 weeks before starting praziquantel.
      You may restart this medicine one day after the last dose of praziquantel.
  - type: paragraph
    text: Liver problems may be more likely to occur if you drink alcoholic beverages
      regularly while you are using this medicine. Also, the regular use of alcohol
      may keep this medicine from working properly. Therefore, you should strictly
      limit the amount of alcoholic beverages you drink while you are using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have a fever, chills, cough, sore
      throat, swollen, painful, or tender lymph glands in the neck, armpit, or groin,
      or yellow skin or eyes while using this medicine. These could be symptoms of
      a serious condition called drug reaction with eosinophilia and systemic symptoms
      (DRESS).
  - type: paragraph
    text: Serious skin reactions (eg, Stevens-Johnson syndrome, toxic epidermal necrolysis,
      and acute generalized exanthematous pustulosis) can occur with this medicine.
      Check with your doctor right away if you have blistering, peeling, or loosening
      of the skin, red skin lesions, severe acne or a skin rash, sores or ulcers on
      the skin, or fever or chills with this medicine.
  - type: paragraph
    text: Tell your doctor right away if you have chest pain, cough, coughing or spitting
      up blood, difficulty in breathing, sore throat, muscle aches, night sweats,
      sudden high fever, or unusual tiredness. These could be symptoms of a paradoxical
      drug reaction to this medicine. If your symptoms do not improve within a few
      days or if they become worse, check with your doctor.
  - type: paragraph
    text: Check with your doctor right away if blurred vision, difficulty in reading,
      or any other change in vision occurs during or after treatment. Your doctor
      may want you to have your eyes checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: Check with your doctor right away if you have joint pain, stiffness, or
      swelling, lower back, side, or stomach pain, or swelling of the feet or lower
      legs. These could be symptoms of an acute gout.
  - type: paragraph
    text: This medicine may cause blood clotting problems, which may lead to bleeding.
      Check with your doctor right away if you cough up blood, have bleeding gums,
      difficulty in breathing or swallowing, dizziness, headache, increased menstrual
      flow or vaginal bleeding, nosebleeds, prolonged bleeding from cuts, red or dark
      brown urine, or red or black, tarry stools after using this medicine.
  - type: paragraph
    text: This medicine will cause urine, stool, saliva, sputum, sweat, teeth, and
      tears to turn reddish-orange to reddish-brown. This is to be expected while
      you are using this medicine. This effect may cause soft contact lenses to become
      permanently discolored. Standard cleaning solutions may not take out all the
      discoloration. Therefore, it is best not to wear soft contact lenses while using
      this medicine. Hard contact lenses are not discolored by this medicine. This
      condition will return to normal once you stop using this medicine. If you have
      any questions about this, check with your doctor.
  - type: paragraph
    text: This medicine may cause lung or breathing problems (eg, interstitial lung
      disease, pneumonitis, pneumonia, respiratory failure, pulmonary fibrosis, acute
      respiratory distress syndrome), which can be life-threatening and require immediate
      medical attention. Check with your doctor right away if you have chest pain,
      chills, dry cough, fever, general feeling of discomfort or illness, thickening
      of bronchial secretions, or trouble breathing.
  - type: paragraph
    text: Check with your doctor right away if you feel very tired or very weak, or
      if you have clumsiness, unsteadiness, loss of appetite, nausea, numbness, tingling,
      burning, or pain in the hands and feet, or vomiting. These may be early warning
      symptoms of more serious liver or nerve problems that could develop later.
  - type: paragraph
    text: Rifampin, isoniazid, and pyrazinamide combination may cause blood problems.
      These problems may result in a greater chance of certain infections, slow healing,
      and bleeding of the gums. Therefore, you should be careful when using regular
      toothbrushes, dental floss, and toothpicks. Dental work should be delayed until
      your blood counts have returned to normal. Check with your medical doctor or
      dentist if you have any questions about proper oral hygiene (mouth care) during
      treatment.
  - type: paragraph
    text: This medicine may cause thrombotic microangiopathy (damage in the smallest
      blood vessels), including hemolytic uremic syndrome and thrombotic thrombocytopenic
      purpura. Tell your doctor right away if you have a change in mental status,
      dark or bloody urine, decreased urine output, difficulty speaking, fever, pale
      color of the skin, pinpoint red spots on the skin, seizures, severe chest pain,
      sudden weakness in the arms or legs, unusual bleeding or bruising, or yellow
      eyes or skin.
  - type: paragraph
    text: This medicine may cause problems with coordination. Check with your doctor
      right away if you have changes in patterns and rhythms of speech, poor control
      in body movements, for example, when reaching or stepping, shakiness and unsteady
      walk, shakiness in the legs, arms, hands, or feet, slurred speech, trembling
      or shaking of hands or feet, trouble in speaking, trouble in walking, uncontrolled
      eye movements, or unsteadiness, trembling, or other problems with muscle control.
  - type: paragraph
    text: If you develop a skin rash, hives, or any allergic reaction to this medicine,
      check with your doctor right away.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are using this medicine. The results of some tests may be affected by this
      medicine.
  - type: paragraph
    text: Eating certain foods (eg, Cheshire cheese, Swiss cheese, skipjack, tuna,
      or Sardinella) or drinking red wine may cause reactions in some patients using
      isoniazid-containing medicines. Check with your doctor if flushing, fast or
      pounding heartbeat, headache, redness or itching of the skin, sweating, dizziness,
      or lightheadedness occurs while you are using this medicine.
  - type: paragraph
    text: Birth control pills may not work properly while you are using this medicine.
      To keep from getting pregnant, use another form of birth control along with
      your birth control pills. Other forms include condoms, diaphragms, or contraceptive
      foams or jellies.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or tightness
      - clumsiness or unsteadiness
      - coughing or spitting up blood
      - dark urine
      - fast, irregular, pounding, or racing heartbeat or pulse
      - loss of appetite
      - nausea
      - numbness, tingling, burning, or pain in the hands and feet
      - pain in the large and small joints
      - sneezing
      - trouble breathing
      - unusual tiredness or weakness
      - vomiting
      - yellow eyes or skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - difficulty in breathing
      - dizziness
      - fever
      - headache
      - hearing loss
      - muscle and bone pain
      - ringing or buzzing or other unexplained noise in the ears
      - shivering
      - skin rash, itching, or redness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - bleeding gums
      - blistering, peeling, or loosening of the skin
      - blood in the urine or stools
      - blurred vision or loss of vision, with or without eye pain
      - bruising
      - confusion
      - darkening of the skin
      - difficulty in swallowing
      - fainting
      - feeling that others are watching you or controlling your behavior
      - feeling that others can hear your thoughts
      - feeling, seeing, or hearing things that are not there
      - fever with or without chills
      - general feeling of tiredness or weakness
      - heavier menstrual periods
      - hives
      - hoarseness
      - hostility
      - increased blood pressure
      - increased thirst
      - irritability
      - light-colored stools
      - lower back or side pain
      - mental depression
      - muscle tenderness, wasting, or weakness
      - persistent bleeding or oozing from puncture sites, mouth, or nose
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - seizures
      - severe mood or mental changes
      - swelling of the face, ankles, fingers, hands, or lower legs
      - unusual behavior
      - unusual drowsiness, dullness, or feeling of sluggishness
      - weight gain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Ankle, knee, or great toe pain
      - back pain
      - being forgetful
      - black, tarry stools
      - bleeding under the skin
      - blemishes on the skin
      - bloating
      - bloody, severe, or watery diarrhea
      - blue-yellow color blindness
      - bone pain
      - burning while urinating
      - changes in patterns and rhythms of speech
      - cloudy urine
      - cold, clammy skin
      - constipation
      - cough
      - difficulty seeing at night
      - difficulty with speaking
      - double vision
      - dry mouth
      - fast, weak pulse
      - flushed, dry skin
      - fruit-like breath odor
      - general feeling of discomfort or illness
      - greatly decreased frequency of urination or amount of urine
      - hair loss
      - inability to move the arms, legs, or facial muscles
      - inability to speak
      - increased hunger
      - increased menstrual flow or vaginal bleeding
      - increased sensitivity of the eyes to sunlight
      - increased urination
      - indigestion
      - joint pain, stiffness, or swelling
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - lightheadedness
      - muscle aches, pains, and tremors
      - night sweats
      - nosebleeds
      - painful or difficult urination
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - pale skin
      - paralysis
      - pimple
      - poor control in body movements
      - prolonged bleeding from cuts
      - rapid, deep breathing
      - red or dark brown urine
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - restlessness
      - runny nose
      - shakiness in the legs, arms, hands, or feet
      - slow speech
      - slurred speech
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stiff neck
      - stomach cramps or pain
      - sweating
      - swollen glands
      - trembling or shaking of the hands or feet
      - trouble in speaking or walking
      - trouble sleeping
      - uncontrolled eye movements
      - unpleasant breath odor
      - unusual bleeding or bruising
      - unusual weight loss
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - decreased awareness or responsiveness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fainting
      - fast, pounding, or irregular heartbeat or pulse
      - feeling of fullness in the upper abdomen or stomach
      - loss of consciousness
      - low blood pressure or slow pulse
      - pain in the upper abdomen or stomach
      - reddish-orange to reddish-brown color of the urine, stool, saliva, sputum,
        sweat, and tears
      - seeing, hearing, or feeling things that are not there
      - seizures
      - severe sleepiness
      - slurring of speech
      - swelling around the eyes and face
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sore mouth or tongue
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - bloated or full feeling
      - excess air or gas in the stomach or bowels
      - not able to concentrate
      - pain or discomfort in the chest, upper stomach, or throat
      - swelling of the breasts or breast soreness in both females and males
      - tooth discoloration
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
