title: Peramivir (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Rapivab
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Peramivir injection is used to treat acute uncomplicated influenza in patients
      who have flu symptoms (eg, weakness, headache, fever, cough, runny or stuffy
      nose, sore throat) for no more than 2 days. Peramivir belongs to the family
      of medicines called antivirals, which are used to treat infections caused by
      viruses.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of peramivir injection in children
        6 months of age and older. Safety and efficacy have not been established in
        children younger than 6 months of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of peramivir injection in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Influenza Virus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. It is given through a needle placed into one of your veins. The
      medicine must be injected slowly, so your IV tube will need to stay in place
      for 15 to 30 minutes.
  - type: paragraph
    text: This medicine should be given as soon as possible after flu symptoms start
      or after you are exposed to the flu (within the first 2 days).
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your or your child's progress closely while you are
      receiving this medicine . This is to make sure that the infection is cleared
      up completely.
  - type: paragraph
    text: Serious allergic or skin reactions can occur with this medicine. Check with
      your doctor right away if you have blistering, peeling, or loosening of the
      skin, red skin lesions, severe acne or skin rash, itching, hoarseness, sores
      or ulcers on the skin, fever or chills, trouble breathing or swallowing, or
      any swelling of your hands, face, or mouth while you are receiving this medicine.
  - type: paragraph
    text: This medicine may cause some people to be confused or display other abnormal
      behaviors. Tell your doctor right away if you have hallucinations (seeing, hearing,
      or feeling things that are not there) or unusual excitement, nervousness, or
      restlessness after receiving this medicine.
  - type: paragraph
    text: Make sure your doctor knows if you plan to get the live flu vaccine nasal
      spray before you start receiving this medicine. You should not use the vaccine
      within 2 weeks before or 48 hours after receiving this medicine.
  - type: paragraph
    text: If your symptoms do not improve after you receive this medicine, or if they
      become worse, check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cloudy urine
      - fever
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - chills
      - confusion as to time, place, or person
      - cough
      - cracks in the skin
      - diarrhea
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - hives, itching, skin rash
      - holding false beliefs that cannot be changed by fact
      - joint or muscle pain
      - loss of heat from the body
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red, irritated eyes
      - red, swollen skin
      - red skin lesions, often with a purple center
      - scaly skin
      - seeing, hearing, or feeling things that are not there
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - tightness in the chest
      - trouble breathing
      - unusual excitement, nervousness, or restlessness
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - constipation
      - difficulty having a bowel movement
      - headache
      - nervousness
      - pounding in the ears
      - redness of the eardrum
      - slow or fast heartbeat
      - trouble sleeping
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
