title: Amphetamine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Adzenys ER
    - type: paragraph
      text: Adzenys XR ODT
    - type: paragraph
      text: Dyanavel XR
    - type: paragraph
      text: Evekeo
    - type: paragraph
      text: Evekeo ODT
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Amphetamine is used to treat narcolepsy (sleep disorder). It is also used
      to treat attention-deficit hyperactivity disorder (ADHD). It belongs to the
      group of medicines called central nervous system (CNS) stimulants.
  - type: paragraph
    text: Amphetamine is also used for weight reduction in patients with obesity.
  - type: paragraph
    text: Amphetamine works in the treatment of ADHD by increasing attention and decreasing
      restlessness in children and adults who are overactive, cannot concentrate for
      very long, or are easily distracted and impulsive. This medicine is used as
      part of a total treatment program that also includes social, educational, and
      psychological treatment.
  - type: paragraph
    text: This medicine is available only with a doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Extended Release, Disintegrating
    - Tablet, Extended Release, Chewable
    - Suspension, Extended Release
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of amphetamine tablets in children with obesity who are younger
        than 12 years of age, in children with narcolepsy who are younger than 6 years
        of age, and in children with ADHD who are younger than 3 years of age. Safety
        and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of amphetamine extended-release oral suspension , extended-release
        tablets , and Evekeo ODT® extended-release oral disintegrating tablets in
        children with ADHD who are younger than 6 years of age. Safety and efficacy
        have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Adzenys XR-ODT® extended-release disintegrating tablet in
        children younger than 6 years of age. However, children are more likely to
        have unwanted effects (eg, weight loss, slow growth). Use in children younger
        than 6 years of age is not recommended.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of amphetamine tablets in geriatric patients.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of amphetamine extended-release oral suspension , extended-release
        tablets , and extended-release oral disintegrating tablets in the geriatric
        population. However, elderly patients are more likely to have age-related
        liver, kidney, or heart problems, which may require caution and an adjustment
        in the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
      - Linezolid
      - Methylene Blue
      - Ozanimod
      - Phenelzine
      - Pimozide
      - Procarbazine
      - Rasagiline
      - Safinamide
      - Selegiline
      - Sibutramine
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Acetazolamide
      - Albuterol Sulfate
