    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure the medicine is working properly. Blood tests
      and blood pressure tests may be needed to check for unwanted effects. Your doctor
      may occasionally stop treatment to check symptoms of ADHD.
  - type: paragraph
    text: Do not use this medicine if you are using or have used an MAO inhibitor
      (MAOI), including isocarboxazid [Marplan®], linezolid [Zyvox®], phenelzine [Nardil®],
      selegiline [Eldepryl®], tranylcypromine [Parnate®]), within the past 14 days.
  - type: paragraph
    text: 'If you have been using this medicine for a long time and you think you
      may have become mentally or physically dependent on it, check with your doctor
      right away . Some signs of dependence may be:'
  - type: list
    ordered: false
    items:
    - A strong desire or need to continue using the medicine.
    - A need to increase the dose to receive the same effects.
    - Withdrawal effects after stopping the medicine including agitation, generalized
      slowing of mental and physical activity, increased appetite, trouble sleeping,
      unable to sleep, unpleasant dreams, unusual tiredness or weakness, or unusually
      deep sleep or long duration of sleep.
  - type: paragraph
    text: This medicine may cause serious heart or blood vessel problems. This may
      be more likely to occur in patients who have a family history of heart disease.
      Check with your doctor right away if you have chest pain, fast or uneven heartbeat,
      trouble breathing, or fainting while using this medicine.
  - type: paragraph
    text: Tell your doctor right away if you or your family notice any unusual changes
      in behavior, including an increase in aggression, hostility, agitation, irritability,
      or suicidal thinking or behavior. Also tell your doctor if you or your child
      see, hear, or feel things that are not there, or have any unusual thoughts,
      especially if they are new or getting worse quickly .
  - type: paragraph
    text: 'Symptoms of an overdose include : agitation, blurred vision, change in
      consciousness, chest pain or discomfort, confusion, fast, pounding, or irregular
      heartbeat, inability to speak, loss of bladder control, muscle spasm or jerking
      of all extremities, nausea, nervousness, overactive reflexes, pain or discomfort
      in the arms, jaw, back, or neck, pale, clammy skin, panic states, physical attempt
      to injure, restlessness, seeing, hearing, or feeling things that are not there,
      seizures, shakiness in the legs, arms, hands, or feet, shivering, slurred speech,
      vomiting. Call your doctor right away if you notice these symptoms.'
  - type: paragraph
    text: This medicine may cause slow growth and weight loss. If your child is using
      this medicine, the doctor will need to keep track of your child's height and
      weight to make sure your child is growing properly.
  - type: paragraph
    text: This medicine may cause some people to feel a false sense of well-being
      or to become dizzy, lightheaded, or less alert than they are normally. It may
      also cause blurred vision or other vision problems. Do not drive or do anything
      else that could be dangerous until you or your child know how this medicine
      affects you .
  - type: paragraph
    text: This medicine may cause Raynaud's phenomenon, which is a problem with blood
      circulation in the fingers or toes. Tell your doctor if you or your child have
      tingling or pain, a cold feeling, paleness, or skin color changes in the fingers
      or toes, especially when exposed to cold temperatures. Call your doctor right
      away if you have unexplained sores or ulcers on your fingers or toes .
  - type: paragraph
    text: Check with your doctor right away if you or your child have anxiety, restlessness,
      a fast heartbeat, fever, sweating, muscle spasms, twitching, nausea, vomiting,
      diarrhea, or see or hear things that are not there. These may be symptoms of
      a serious condition called serotonin syndrome. Your risk may be higher if you
      also take certain other medicines that affect serotonin levels in your body.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are using this medicine. The results of some tests may be affected by this
      medicine.
  - type: paragraph
    text: Avoid drinking alcohol while using this medicine.
  - type: paragraph
    text: Use with medications that increase stomach or urine alkalinity, including
      sodium bicarbonate, acetazolamide, and some thiazide diuretics (water pill)
      should be avoided. .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines,
      herbal (eg, St. John's wort) or vitamin supplements, and medicine for appetite
      control, asthma, colds, cough, hayfever, or sinus problems.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - anxiety
      - bladder pain
      - bloody or cloudy urine
      - crying
      - delusions of persecution, mistrust, suspiciousness, or combativeness
      - difficult, burning, or painful urination
      - false or unusual sense of well-being
      - feeling of unreality
      - frequent urge to urinate
      - lower back or side pain
      - mental depression
      - nervousness
      - quick to react or overreact emotionally
      - rapidly changing moods
      - sense of detachment from self or body
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - cough
      - fever
      - hoarseness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Seeing, hearing, or feeling things that are not there
