    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Agitation, severe or
      - Arteriosclerosis (hardening of the arteries), severe or
      - Drug use disorder, history of or
      - Heart attack, recent or
      - Heart failure or
      - Heart or blood vessel disease (eg, cardiomyopathy, coronary artery disease)
        or
      - Heart rhythm problems (eg, arrhythmia, ventricular arrhythmia), or family
        history of or
      - Hypertension (high blood pressure), moderate to severe or
      - Hyperthyroidism (overactive thyroid) or
      - Stroke, history of—Avoid use in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Bipolar disorder (manic-depressive illness), or a family history of or
      - Blood vessel problems (eg, Raynaud disease) or
      - Depression, or a family history of or
      - Hypertension (high blood pressure), mild or
      - Psychosis (mental illness), history of or
      - Seizures, history of or
      - Tourette syndrome, or family history of—Use with caution. May make these conditions
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. If too much of this medicine is taken, it may become habit-forming
      (causing mental or physical dependence). If you feel that the medicine is not
      working properly after using it for several weeks, check with your doctor first
      and do not increase the dose.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Amphetamine is used for different conditions and comes in different forms.
      Make sure you understand how to take your prescribed brand.
  - type: paragraph
    text: It is best to take this medicine when you wake up in the morning. You may
      take this medicine with or without food or liquid.
  - type: paragraph
    text: You may chew or swallow the Dyanavel® XR tablet whole. You may divide the
      Dyanavel® XR 5-mg tablet into equal parts at the score line.
  - type: paragraph
    text: Measure the extended-release oral suspension with a marked measuring spoon,
      oral syringe, or medicine cup. The average household teaspoon may not hold the
      right amount of liquid. Shake the bottle before each use.
  - type: paragraph
    text: If you are using the extended-release oral disintegrating tablet , make
      sure your hands are dry before you handle the tablet. Do not open the blister
      pack that contains the tablet until you are ready to take it. Remove Adzenys
      XR-ODT® from the blister pack by peeling back the foil, then taking the tablet
      out. Do not push Adzenys XR-ODT® through the foil. You may push Evekeo ODT®
      through the back of the foil to remove it. Place the whole tablet on your tongue.
      It should melt quickly. Do not chew or crush it. You may move the tablet around
      between the tongue and the roof of the mouth until it melts.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ADHD: For oral dosage form (extended-release oral disintegrating tablets):
        Adzenys XR-ODT®: Adults—12.5 milligrams (mg) once a day, in the morning. Children
        13 to 17 years of age and older—At first, 6.3 mg once a day, in the morning.
        Your doctor may increase your dose as needed. However, the dose is usually
        not more than 12.5 mg per day. Children 6 to 12 years of age—At first, 6.3
        mg once a day, in the morning. Your doctor may increase your dose as needed.
        However, the dose is usually not more than 18.8 mg per day. Children younger
        than 6 years of age—Use and dose must be determined by your doctor. Evekeo
        ODT®: Children 6 to 17 years of age—At first, 5 milligrams (mg) 1 or 2 times
        a day, in the morning. You may add another dose after 4 to 6 hours. Your doctor
        may increase your dose as needed. However, the dose is usually not more than
        40 mg per day. Children younger than 6 years of age—Use and dose must be determined
        by your doctor. For oral dosage form (extended-release tablets): Adults and
        children 6 years of age and older—At first, 2.5 or 5 milligrams (mg) once
        a day, in the morning. Your doctor may increase your dose as needed. However,
        the dose is usually not more than 20 mg per day. Children younger than 6 years
        of age—Use and dose must be determined by your doctor. For oral dosage form
        (extended-release suspension): Dyanavel® XR: Adults and children 6 years of
        age and older—At first, 2.5 or 5 milligrams (mg) once a day, in the morning.
        Your doctor may increase your dose as needed. However, the dose is usually
        not more than 20 mg per day. Children younger than 6 years of age—Use and
        dose must be determined by your doctor. For oral dosage form (tablets): Adults
        and children 6 years of age and older—At first, 5 milligrams (mg) 1 or 2 times
        a day. Your doctor may increase your dose as needed. However, the dose is
        usually not more than 40 mg per day. Children 3 to 5 years of age—At first,
        2.5 mg once a day. Your doctor may increase your dose as needed. Children
        younger than 3 years of age—Use is not recommended.'
      - 'For narcolepsy: For oral dosage form (tablets): Adults and children 12 years
        of age and older—At first, 10 milligrams (mg) once a day, in the morning.
        Your doctor may increase your dose as needed. However, the dose is usually
        not more than 60 mg per day. Children 6 to 12 years of age—At first, 5 mg
        once a day, in the morning. Your doctor may increase your dose as needed.
        Children younger than 6 years of age—Use and dose must be determined by your
        doctor.'
      - 'For weight loss: For oral dosage form (tablets): Adults and children 12 years
