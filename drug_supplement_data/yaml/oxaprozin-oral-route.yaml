      - excess air or gas in the stomach or intestines
      - hearing loss
      - passing gas
      - relaxed and calm
      - sleepiness or unusual drowsiness
      - trouble sleeping
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
