    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Bleeding problems or
      - Congestive heart failure or
      - Dehydration or
      - Edema (fluid retention or swelling) or
      - Heart attack, history of or
      - Heart or blood vessel disease or
      - Hyperkalemia (high potassium in the blood) or
      - Hypertension (high blood pressure) or
      - Hypovolemia (low amount of blood) or
      - Kidney disease or
      - Liver disease (eg, hepatitis) or
      - Stomach or intestinal ulcers or bleeding, history of or
      - Stroke, history of—Use with caution. This medicine may make these conditions
        worse. .
    - type: list
      ordered: false
      items:
      - Aspirin-sensitive asthma or
      - Aspirin sensitivity, history of—Should not be used in patients with these
        conditions.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Hypovolemia—Must be corrected first before using this medicine.
    - type: list
      ordered: false
      items:
      - Heart surgery (eg, coronary artery bypass graft [CABG])—Should not be used
        to relieve pain right before or after the surgery.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine exactly as ordered by your doctor . Do not use more of
      it, do not use it more often, and do not use it for a longer time than ordered
      by your doctor. To do so may increase the chance of unwanted effects, especially
      in elderly patients.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the tablet whole. Do not break, crush, divide, or chew it.
  - type: paragraph
    text: When used for severe or continuing arthritis, this medicine must be taken
      regularly as ordered by your doctor in order for it to help you. This medicine
      usually begins to work within one week, but in severe cases up to two weeks
      or even longer may pass before you begin to feel better. Also, several weeks
      may pass before you feel the full effects of this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For juvenile rheumatoid arthritis: For oral dosage form (capsules): Children
        6 to 16 years of age and older—Dose is base on body weight and must be determined
        by your doctor. Your doctor may adjust your dose as needed and tolerated.
        Weighing 55 kilograms (kg) or more—1200 milligrams (mg) (four capsules) once
        a day. Weighing 32 to 54 kg—900 mg (three capsules) once a day. Weighing 22
        to 31 kg—600 mg (two capsules) once a day. Children younger than 6 years of
        age—Use and dose must be determined by your doctor. For oral dosage form (tablets):
        Children 6 to 16 years of age and older—Dose is base on body weight and must
        be determined by your doctor. Your doctor may adjust your dose as needed and
        tolerated. Weighing 55 kilograms (kg) or more—1200 milligrams (mg) once a
        day. Weighing 32 to 54 kg—900 mg once a day. Weighing 22 to 31 kg—600 mg once
        a day. Children younger than 6 years of age—Use and dose must be determined
        by your doctor.'
