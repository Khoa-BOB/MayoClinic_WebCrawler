    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits while you are using this medicine. This will allow your doctor
      to see if the medicine is working properly and to decide if you or your child
      should continue to use it. Blood and urine tests may be needed to check for
      unwanted effects.
  - type: paragraph
    text: This medicine may increase your risk of having a heart attack or stroke.
      This is more likely in people who already have heart disease. People who use
      this medicine for a long time might also have a higher risk. Check with your
      doctor right away if you or your child has chest pain that may spread to your
      arms, jaw, back, or neck, trouble breathing or speaking, headache, nausea, unusual
      sweating, or faintness.
  - type: paragraph
    text: This medicine may cause bleeding in your stomach or intestines. These problems
      can happen without warning signs. This is more likely if you have had a stomach
      ulcer in the past, if you smoke or drink alcohol regularly, if you are over
      60 years of age, are in poor health, or are using certain other medicines (eg,
      steroid or a blood thinner).
  - type: paragraph
    text: Check with your doctor right away if you or your child has pain or tenderness
      in the upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: If you are rapidly gaining weight, trouble breathing, chest pain or discomfort,
      extreme tiredness or weakness, irregular breathing, irregular heartbeat, or
      excessive swelling of the hands, wrist, ankles, or feet, check with your doctor
      immediately. These may be symptoms of heart problems or your body keeping too
      much water.
  - type: paragraph
    text: Serious skin reactions, including Stevens-Johnson syndrome, exfoliative
      dermatitis, toxic epidermal necrolysis, fixed drug eruption (FDE), and general
      bullous fixed drug eruption (GBFDE) can occur during treatment with this medicine.
      Check with your doctor right away if you have black, tarry stools, blistering,
      peeling, or loosening of the skin, chest pain, chills, cough, diarrhea, fever,
      itching, joint or muscle pain, painful or difficult urination, red irritated
      eyes, red skin lesions, sore throat, sores, ulcers, or white spots in the mouth
      or on the lips, swollen glands, unusual bleeding or bruising, or unusual tiredness
      or weakness. .
  - type: paragraph
    text: Check with your doctor right away if you have black, tarry stools, chest
      pain, chills, cough, fever, painful or difficult urination, sore throat, sores,
      ulcers, or white spots in the mouth or on the lips, swollen glands, unusual
      bleeding or bruising, or unusual tiredness or weakness. These may be symptoms
      of serious skin reaction called drug reaction with eosinophilia and systemic
      symptoms (DRESS).
  - type: paragraph
    text: Possible warning signs of some serious side effects that can occur during
      treatment with this medicine may include swelling of the face, fingers, feet,
      or lower legs, severe stomach pain, black, tarry stools, or vomiting of blood
      or material that looks like coffee grounds, unusual weight gain, yellow skin
      or eyes, decreased urination, unusual bleeding or bruising, or skin rash. Also,
      signs of serious heart problems could occur including chest pain or tightness,
      fast or irregular heartbeat, unusual flushing or warmth of skin, weakness, or
      slurring of speech. Check with your doctor immediately if you notice any of
      these warning signs.
  - type: paragraph
    text: Check with your doctor right away if you have blood in the urine, decrease
      in the frequency or amount of urine, an increase in blood pressure, increased
      thirst, loss of appetite, lower back or side pain, nausea, swelling of the face,
      fingers, or lower legs, trouble breathing, unusual tiredness or weakness, vomiting,
      or weight gain. These may be symptoms of a serious kidney problem.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction called anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are using this medicine.
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. You might need to measure
      your blood pressure at home. If you think your blood pressure is too high, call
      your doctor right away.
  - type: paragraph
    text: Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have stomach pain, confusion,
      difficulty with breathing, irregular heartbeat, nausea or vomiting, nervousness,
      numbness or tingling in the hands, feet, or lips, or weakness or heaviness of
      the legs.
  - type: paragraph
    text: Using this medicine during the later part of a pregnancy can harm your unborn
      baby. If you think you have become pregnant while using the medicine, tell your
      doctor right away.
  - type: paragraph
    text: This medicine may cause a delay in ovulation for women and may affect their
      ability to have children. If you plan to have children, talk with your doctor
      before using this medicine.
  - type: paragraph
    text: This medicine may make your skin more sensitive to sunlight. Use a sunscreen
      when you are outdoors. Avoid sunlamps and tanning beds.
  - type: paragraph
    text: Before having any kind of surgery or medical tests, tell your doctor that
      you are using this medicine. It may be necessary for you to stop treatment for
      a while, or to change to a different medicine before your procedure.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
