- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Loratadine is used to treat allergy symptoms, including runny or stuffy
      nose, sneezing, watery eyes, and itching of the eyes, nose or throat.
  - type: paragraph
    text: This medicine is available as an over-the-counter (OTC) product.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Chewable
    - Tablet
    - Tablet, Disintegrating
    - Syrup
    - Solution
    - Capsule, Liquid Filled
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of loratadine in children. However,
        safety and efficacy have not been established in children younger than 6 years
        of age for liquid-filled capsules , chewable tablets , orally disintegrating
        tablets , and tablets and in children younger than 2 years of age for oral
        liquid .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of loratadine in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Mavorixafor
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amiodarone
      - Apalutamide
      - Avacopan
      - Carbamazepine
      - Clarithromycin
      - Conivaptan
      - Itraconazole
      - Ketoconazole
      - Letermovir
      - Mifepristone
      - Paroxetine
      - Pitolisant
      - Ranolazine
      - Tazemetostat
      - Voriconazole
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. Your dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Phenylketonuria (PKU)—The chewable tablet contains phenylalanine (aspartame),
        which can make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Follow the instructions on the medicine label.
  - type: paragraph
    text: 'Orally disintegrating tablet : Place one tablet on the tongue, with or
      without water.'
  - type: paragraph
    text: 'Oral liquid : Measure with a medicine cup.'
  - type: paragraph
    text: 'Chewable tablets : Chew or crush tablets before swallowing.'
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For allergies: For oral dosage form (chewable tablets, orally disintegrating
        tablets, tablets): Adults and children 6 years of age and older—One tablet
        or 10 milligrams (mg) once a day. Do not take more than one tablet per day.
        Children younger than 6 years of age—Use and dose must be determined by your
        doctor. For oral dosage form (liquid-filled capsules): Adults and children
        6 years of age and older—One capsule or 10 milligrams (mg) once a day. Do
        not take more than one capsule per day. Children younger than 6 years of age—Use
        and dose must be determined by your doctor. For oral dosage form (solution):
        Adults and children 6 years of age and older—2 teaspoonfuls or 10 milliliters
        (mL) once a day. Do not take more than 2 teaspoonfuls per day. Children 2
        to younger than 6 years of age—1 teaspoonful or 5 mL once day. Do not take
        more than 1 teaspoonful per day. Children younger than 2 years of age—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
