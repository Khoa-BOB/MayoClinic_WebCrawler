title: Sars-cov-2 (covid-19) vaccine, mrna-lnp, spike protein (moderna) (intramuscular
  route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Spikevax
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: SARS-CoV-2 vaccine (mRNA-LNP, spike protein) is under investigation as an
      active immunization against COVID-19 caused by the SARS-CoV-2 virus in persons
      6 months of age and older. SARS-CoV-2 (COVID-19) vaccine is used to prevent
      coronavirus disease 2019 (COVID-19) caused by severe acute respiratory syndrome
      coronavirus 2 (SARS-CoV-2).
  - type: paragraph
    text: This vaccine is to be given only by or under the direct supervision of your
      doctor.
  - type: paragraph
    text: Monovalent Moderna COVID-19 vaccine is no longer authorized for use in the
      United States.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of SARS-CoV-2 (COVID-19) vaccine
        supplied in a vial with a red cap and a label with a light blue border in
        children 12 years of age and older, vial with a dark blue cap and a label
        with a purple or light blue border in children 6 to 11 years of age, and vial
        with a dark blue cap and a label with a magenta border in children 6 months
        to 5 years of age. Safety and efficacy have been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of SARS-CoV-2 (COVID-19) vaccine
        n in the elderly. However, elderly patients are more likely to have age-related
        liver, kidney, or heart problems, which may require caution for patients receiving
        this vaccine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Atidarsagene Autotemcel
      - Elivaldogene Autotemcel
      - Ocrelizumab
      - Rituximab
      - Teplizumab-mzwv
      - Ublituximab-xiiy
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart disease (eg, myocarditis, pericarditis), history of—Use with caution.
        May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Immune system problems (eg, patients who received an organ transplant)—This
        condition may decrease the useful effects of the vaccine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given as a shot into one of your muscles.
  - type: paragraph
    text: 'Spikevax COVID-19 vaccine : This vaccine is given in 2 doses at least 1
      month apart. If you have received 1 dose of Spikevax COVID-19 vaccine, you should
      receive a second dose of this vaccine to complete your vaccination series.'
  - type: paragraph
    text: 'Moderna COVID-19 vaccine primary series (supplied in a vial with a dark
      blue cap and a label with a magenta border) : This vaccine is given in 2 doses
      at least 1 month apart in children 6 months to 5 years of age. Patients who
      have a weak immune system may receive a third dose at least 1 month after the
      first 2 doses.'
  - type: paragraph
    text: 'Moderna COVID-19 vaccine primary series (supplied in a vial with a dark
      blue cap and a label with a purple or light blue border) : This vaccine is given
      in 2 doses at least 1 month apart in children 6 to 11 years of age. Patients
      who have a weak immune system may receive a third dose at least 1 month after
      the first 2 doses.'
  - type: paragraph
    text: 'Moderna COVID-19 vaccine primary series (supplied in a vial with a red
      cap and a label with a light blue border) : This vaccine is given in 2 doses
      at least 1 month apart in adults and children 12 years of age and older. Patients
      who have a weak immune system may receive a third dose at least 1 month after
      the first 2 doses.'
  - type: paragraph
    text: 'Moderna COVID-19 vaccine first booster dose (supplied in a vial with a
      red cap and a label with a light blue border) : You may be given a first booster
      dose of Moderna COVID-19 vaccine at least 5 months after your primary series
      with this vaccine. It is usually given to patients 18 years of age and older.
      You may also receive a first booster dose of this vaccine after your primary
      vaccination with another authorized or approved COVID-19 vaccine (eg, Janssen
      COVID-19 vaccine or Pfizer-BioNTech COVID-19 vaccine).'
  - type: paragraph
    text: 'Moderna COVID-19 vaccine second booster dose (supplied in a vial with a
      red cap and a label with a light blue border) : You may be given a second booster
      dose of Moderna COVID-19 vaccine at least 4 months after your first booster
      dose with any authorized or approved COVID-19 vaccine. It is usually given to
      patients 18 years of age and older who have a weak immune system and to patients
      50 years of age and older.'
  - type: paragraph
    text: This vaccine comes with a Fact Sheet for Recipients and Caregivers. Read
      and follow the information in the Fact Sheet carefully. Ask your doctor if you
      have any questions.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Be sure to notify your doctor of any side effects that occur after you receive
      this vaccine.
  - type: paragraph
    text: This vaccine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you have a rash, itching, a fast heartbeat, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      after receiving the vaccine.
  - type: paragraph
    text: This vaccine may increase your risk of serious heart problems (eg, myocarditis,
      pericarditis), especially after you receive the second dose. Check with your
      doctor right away if you have anxiety, blue or pale skin, chest pain, possibly
      moving to the left arm, neck, or shoulder, fever, chills, a fast heartbeat,
      trouble breathing, or unusual tiredness or weakness.
  - type: paragraph
    text: Fainting may occur after you receive this vaccine. You may also have vision
      changes, numbness or tingling in your arms, hands, or feet, or jerky movements
      of the arms and legs. Your doctor may want you to be observed after you get
      the injection to prevent and manage fainting.
  - type: paragraph
    text: This vaccine may not protect everyone who receives it. This vaccine will
      not treat symptoms of COVID-19 infection if you already have the disease. It
      is very important that you take precautions to reduce the risk of COVID-19.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - difficulty in moving
      - fever
      - headache
      - joint pain
      - muscle aches, cramps, pains, or stiffness
      - nausea
      - swollen joints
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blue or pale skin
      - chest discomfort or tightness
      - chest pain, possible moving to the left arm, neck, or shoulder
      - cough
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - fainting
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - trouble breathing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
