title: Norepinephrine (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Levophed
    - type: paragraph
      text: Levophed Bitartrate
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Norepinephrine injection is used to raise blood pressure in patients with
      severe, acute hypotension (short-term low blood pressure).
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of norepinephrine injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of norepinephrine injection in the
        elderly. However, elderly patients are more likely to have age-related liver,
        kidney, or heart problems, which may require caution and an adjustment in
        the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Dihydroergotamine
      - Isocarboxazid
      - Phenelzine
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amineptine
      - Amitriptyline
      - Amitriptylinoxide
      - Amoxapine
      - Amphetamine
      - Clomipramine
      - Cyclopropane
      - Desflurane
      - Desipramine
      - Dextroamphetamine
      - Dibenzepin
      - Digoxin
      - Doxepin
      - Enflurane
      - Entacapone
      - Ergonovine
      - Furazolidone
      - Furosemide
      - Halothane
      - Imipramine
      - Insulin Aspart, Recombinant
      - Iobenguane I 123
      - Iproniazid
      - Isoflurane
      - Landiolol
      - Linezolid
      - Lisdexamfetamine
      - Lofepramine
      - Melitracen
      - Methoxyflurane
      - Methylene Blue
      - Methylergonovine
      - Milnacipran
      - Moclobemide
      - Nialamide
      - Nortriptyline
      - Opicapone
      - Opipramol
      - Ozanimod
      - Procarbazine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to sulfites, history or
      - Asthma—Norepinephrine contains sodium metabisulfite which can trigger attacks
        in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Blood clots (eg, mesenteric or peripheral vascular thrombosis, occlusive or
        thrombotic vascular disease) or
      - Heart rhythm problems (eg, arrhythmia) or
      - Hypertension (high blood pressure)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Hypercarbia (high carbon dioxide in the blood) or
      - Hypoxia (low oxygen in the blood)—Use with caution. May increase risk for
        more side effects.
    - type: list
      ordered: false
      items:
      - Hypovolemia (low blood volume)—This condition must be corrected first before
        receiving this medicine. Use of norepinephrine in this condition may increase
        the risk for more unwanted effects (eg, decreased urine output, lactic acidosis,
        low blood supply to the tissues).
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins.
  - type: paragraph
    text: If you are elderly or have blood clotting problems in the legs , you should
      not receive an infusion of this medicine into the veins of your legs.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress closely while
      receiving this medicine to make sure it is working properly. Blood tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause tissue ischemia (low blood supply to the tissue),
      which may lead to gangrene (skin or tissue damage) of the arm or leg. Check
      with your doctor right away if you have itching of the skin, numbness and tingling
      of the face, fingers, or toes, pain in the arms legs, or lower back, especially
      in the calves or heels upon exertion, pale, bluish-colored, or cold hands or
      feet, or weak or absent pulses in the legs.
  - type: paragraph
    text: This medicine may cause heart rhythm problems. Tell your doctor right away
      if you get dizzy or lightheaded, have fast or irregular heart beats, or feel
      like fainting.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain or discomfort
      - headache
      - lightheadedness, dizziness, or fainting
      - nervousness
      - pounding in the ears
      - slow, fast, or irregular heartbeat
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blue lips and fingernails
      - confusion
      - coughing that sometimes produces a pink frothy sputum
      - difficult, fast, noisy breathing
      - dizziness, fainting, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - increased sweating
      - itching of the skin
      - numbness and tingling of the face, fingers, or toes
      - pain in the arms legs, or lower back, especially in the calves or heels upon
        exertion
      - pale, bluish-colored, cold hands or feet
      - pale skin
      - swelling in the legs and ankles
      - weak or absent pulses in the legs
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
