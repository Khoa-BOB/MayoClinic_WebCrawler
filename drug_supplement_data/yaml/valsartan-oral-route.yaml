    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angioedema (an allergic reaction) with other blood pressure medicines (e.g.,
        benazepril, enalapril, lisinopril, Lotrel®, Vasotec®, Zestoretic®, Zestril®),
        history of—Use with caution. Use may cause this condition to reoccur.
    - type: list
      ordered: false
      items:
      - Congestive heart failure, severe—Use may lead to kidney problems.
    - type: list
      ordered: false
      items:
      - Diabetic patients who are also taking aliskiren (Tekturna®)—Should not be
        used in these patients.
    - type: list
      ordered: false
      items:
      - Electrolyte imbalances (eg, low sodium in the body) or
      - Fluid imbalances (caused by dehydration, vomiting, or diarrhea) or
      - Kidney disease, severe—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: In addition to using this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these is most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure, but
      it does help control it. You must continue to take it as directed if you expect
      to lower your blood pressure and keep it down. You might have to take high blood
      pressure medicine for the rest of your life . If high blood pressure is not
      treated, it can cause serious problems such as heart failure, blood vessel disease,
      strokes, or kidney disease.
  - type: paragraph
    text: You may take this medicine with or without food. Also, take this medicine
      at the same time each day.
  - type: paragraph
    text: Take all other medicines your doctor has prescribed to treat your condition.
  - type: paragraph
    text: If your child has a liquid form of the medicine, shake the bottle for at
      least 10 seconds before giving a dose.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions carefully. Ask your doctor if you have any questions.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For heart failure: Adults—At first, 40 milligrams
        (mg) two times a day. Your doctor may adjust the dose as needed. However,
        the dose is usually not more than 320 mg per day. Children—Use and dose must
        be determined by your doctor. For high blood pressure: Adults—At first, 80
        or 160 milligrams (mg) once a day. Your doctor may adjust the dose as needed.
        However, the dose is usually not more than 320 mg per day. Children 1 to 16
        years of age—Dose is based on body weight and must be determined by your doctor.
        The starting dose is usually 1 milligram (mg) per kilogram (kg) of body weight
        per day given as a single dose. Your doctor may adjust the dose as needed.
        However, the dose is usually not more than 4 mg per kg of body weight or 160
        mg per day. Children younger than 1 year of age—Use is not recommended. For
        left ventricular failure after a heart attack: Adults—At first, 20 milligrams
        (mg) two times a day. Your doctor may adjust the dose as needed. However,
        the dose is usually not more than 320 mg per day. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For heart failure: Adults—At first, 40 milligrams (mg) two times a day. Your
        doctor may adjust the dose as needed. However, the dose is usually not more
        than 320 mg per day. Children—Use and dose must be determined by your doctor.'
      - 'For high blood pressure: Adults—At first, 80 or 160 milligrams (mg) once
