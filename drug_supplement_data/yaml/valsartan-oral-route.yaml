      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the liquid at room temperature for up to 30 days, or in the refrigerator
        for up to 75 days.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure that this medicine is working properly. Blood
      and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up suddenly from a lying or sitting position or if you have been taking a diuretic
      (water pill). Make sure you know how you react to this medicine before you drive,
      use machines, or do anything else that could be dangerous if you are dizzy .
      If you feel dizzy, lie down so you do not faint. Then sit for a few moments
      before standing to prevent the dizziness from returning. If you faint, call
      your doctor right away .
  - type: paragraph
    text: Check with your doctor right away if you become sick while taking this medicine,
      especially if you have severe nausea, vomiting, or diarrhea that does not stop.
      These conditions may cause you to lose too much water and lead to low blood
      pressure. You can also lose water by sweating, so drink plenty of water during
      exercise or in hot weather.
  - type: paragraph
    text: Ask your doctor before you use medicines, supplements, or salt substitutes
      that contain potassium .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes prescription or nonprescription (over-the-counter [OTC])
      medicines for appetite control, asthma, colds, cough, hay fever, or sinus problems,
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody urine
      - cold sweats
      - confusion
      - decreased frequency or amount of urine
      - difficult breathing
      - dizziness, faintness, or lightheadedness when getting up from a lying position
      - fainting
      - increased thirst
      - irregular heartbeat
      - loss of appetite
      - lower back or side pain
      - nausea
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - swelling of the face, fingers, or lower legs
      - unusual tiredness or weakness
      - vomiting
      - weakness or heaviness of the legs
      - weight gain
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - fever
      - hoarseness
      - sore throat
      - swelling of the mouth, hands, or feet
      - trouble with swallowing or breathing (sudden)
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - dark urine
      - general tiredness and weakness
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - light-colored stools
      - pinpoint red spots on the skin
      - redness, soreness, or itching skin
      - unusual bleeding or bruising
      - upper right abdominal or stomach pain
      - yellow eyes and skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - blurred vision
      - cold or flu-like symptoms
      - coughing
      - diarrhea
      - difficulty with moving
      - headache
      - muscle pain or stiffness
      - pain, swelling, or redness in the joints
      - stomach pain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hair loss
      - thinning of the hair
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
