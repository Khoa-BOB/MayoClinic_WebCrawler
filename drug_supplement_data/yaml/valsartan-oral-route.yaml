        is usually not more than 4 mg per kg of body weight or 160 mg per day. Children
        younger than 1 year of age—Use is not recommended.'
      - 'For left ventricular failure after a heart attack: Adults—At first, 20 milligrams
        (mg) two times a day. Your doctor may adjust the dose as needed. However,
        the dose is usually not more than 320 mg per day. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 40 milligrams (mg) two times a day. Your doctor may adjust
        the dose as needed. However, the dose is usually not more than 320 mg per
        day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—At first, 80 or 160 milligrams (mg) once a day. Your doctor may adjust
