title: Apraclonidine (ophthalmic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Iopidine
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Apraclonidine 0.5% eye drops is used to treat glaucoma when the medications
      you have been using for glaucoma do not reduce your eye pressure enough.
  - type: paragraph
    text: Apraclonidine 1% eye drops is used just before and after certain types of
      eye surgery (argon laser trabeculoplasty, argon laser iridotomy, and Nd:YAG
      laser posterior capsulotomy). The medicine is used to control or prevent a rise
      in pressure within the eye (ocular hypertension) that can occur after this type
      of surgery.
  - type: paragraph
    text: Apraclonidine 0.5% and 1% are available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of apraclonidine eye drops in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of apraclonidine eye drops in the
        elderly.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amphetamine
      - Dextroamphetamine
      - Insulin Aspart, Recombinant
      - Iobenguane I 131
      - Landiolol
      - Lisdexamfetamine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart attack, history of or
      - Heart or blood vessel disease (eg, Raynaud's disease, thromboangiitis obliterans)
        or
      - High blood pressure or
      - Kidney disease or
      - Stroke, history of or
      - Vasovagal attack (rapid decrease in heart rate and blood pressure that can
        lead to fainting), history of—Use with caution. May make these conditions
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: 'This medicine is available in 2 forms: apraclonidine 0.5% eye drops and
      apraclonidine 1% eye drops. Ask your doctor or pharmacist if you have any questions.'
  - type: paragraph
    text: 'Apraclonidine 0.5% eye drops :'
  - type: list
    ordered: false
    items:
    - Use this medicine only as directed. Do not use more of it and do not use it
      more often than your doctor ordered. To do so may increase the chance of too
      much medicine being absorbed into the body and the chance of side effects.
    - First, wash your hands. Tilt the head back and, pressing your finger gently
      on the skin just beneath the lower eyelid, pull the lower eyelid away from the
      eye to make a space. Drop the medicine into this space. Let go of the eyelid
      and gently close the eyes. Do not blink. Keep the eyes closed and apply pressure
      to the inner corner of the eye with your finger for 1 or 2 minutes to allow
      the medicine to be absorbed by the eye.
    - If you think you did not get the drop of medicine into your eye properly, use
      another drop.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
    - If your doctor ordered two different eye drops to be used together, wait at
      least 10 minutes between the times you apply the medicines. This will help to
      keep the second medicine from washing out the first one.
  - type: paragraph
    text: 'Apraclonidine 1% eye drops :'
  - type: list
    ordered: false
    items:
    - A doctor or other trained health professional will give you this medicine.
    - You will receive one drop of this medicine in the affected eye 1 hour before
      surgery, then one drop in the same eye immediately after surgery.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic solution (eye drops) dosage form: For glaucoma (0.5% apraclonidine):
        Adults—Use one drop in each eye two or three times a day. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For glaucoma (0.5% apraclonidine): Adults—Use one drop in each eye two or
        three times a day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Use one drop in each eye two or three times a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Apraclonidine 0.5% eye drops may be stored in the refrigerator.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, drowsy, or less alert
      than they are normally. Make sure you know how you react to this medicine before
      you drive, use machines, or do anything else that could be dangerous if you
      are not alert .
  - type: paragraph
    text: Do not use this medicine if you are also taking a MAO inhibitor (MAOI).
  - type: paragraph
    text: Apraclonidine 0.5% eye drops may cause your eyes to become more sensitive
      to light than they are normally. Wearing sunglasses and avoiding too much exposure
      to bright light may help lessen the discomfort.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
