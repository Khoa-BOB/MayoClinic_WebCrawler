title: Fentanyl (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Sublimaze
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fentanyl injection is used to relieve severe pain during and after surgery.
      It is also used with other medicines just before or during an operation to help
      the anesthetic (numbing medicine) work better.
  - type: paragraph
    text: Fentanyl belongs to the group of medicines called opioid analgesics (pain
      medicines). It acts in the central nervous system (CNS) or brain to relieve
      pain. Some of its side effects are also caused by actions in the CNS such as
      drowsiness or dizziness.
  - type: paragraph
    text: This medicine is to be given only by or under the immediate supervision
      of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of fentanyl injection in children younger than 2 years of age.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of fentanyl injection in the elderly.
        However, elderly patients are more likely to have age-related lung, kidney,
        liver, or heart problems, which may require caution and an adjustment in the
        dose for patients receiving fentanyl injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
      - Levoketoconazole
      - Mifepristone
      - Naltrexone
      - Phenelzine
      - Safinamide
      - Samidorphan
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Acepromazine
      - Aclidinium
      - Alefacept
      - Alfentanil
      - Almotriptan
      - Alprazolam
      - Amantadine
      - Amifampridine
      - Amiloride
      - Amineptine
      - Amiodarone
      - Amitriptyline
      - Amitriptylinoxide
      - Amobarbital
      - Amoxapine
      - Amphetamine
      - Amprenavir
      - Anileridine
      - Apalutamide
      - Aprepitant
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Armodafinil
      - Asciminib
      - Asenapine
      - Atazanavir
      - Atropine
      - Avacopan
      - Baclofen
      - Belladonna
      - Belzutifan
      - Bemetizide
      - Bendroflumethiazide
      - Benperidol
      - Bentazepam
      - Benzhydrocodone
      - Benzphetamine
      - Benzthiazide
      - Benztropine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Desflurane
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Adrenal problems or
      - Brain tumor, history of or
      - Breathing or lung problems (eg, COPD, respiratory depression, sleep apnea)
        or
      - Cor pulmonale (serious heart condition) or
      - Drug dependence, especially opioid use disorder, or history of or
      - Head injury, history of or
      - Heart disease or
      - Hypokalemia (low potassium levels in the blood) or
      - Hypomagnesemia (low magnesium levels in the blood)—Use with caution. May increase
        risk for more serious side effects.
    - type: list
      ordered: false
      items:
      - Bradycardia (slow heart rhythm) or
      - Gallbladder problems or
      - Heart rhythm problems (eg, QT prolongation) or
      - Hypertension (high blood pressure) or
      - Hypotension (low blood pressure) or
      - Pancreatitis (inflammation or swelling of the pancreas) or
      - Seizures, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you or your child
      this medicine in a hospital. This medicine is given as a shot into a muscle
      or vein.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you closely while you or your
      child are receiving this medicine. This will allow your doctor to see if the
      medicine is working properly and to decide if you should continue to receive
      it.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction called anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you or your child have a rash, itching, hoarseness,
      trouble breathing, trouble swallowing, or any swelling of your hands, face,
      or mouth while you are using this medicine.
  - type: paragraph
    text: 'Do not use too much of this medicine or use it more often than your doctor
      tells you to . This can be life-threatening. Signs of an overdose include :
      change or loss of consciousness, cold, clammy skin, coughing that sometimes
      produces a pink frothy sputum, decreased awareness or responsiveness, extreme
      dizziness or weakness, increased sweating, irregular, fast, or slow, or shallow
      breathing, pale or blue lips, fingernails, or skin, sleepiness or unusual drowsiness,
      slow heartbeat, seizures, swelling in legs and ankles, or trouble breathing.
      Call your doctor right away if you notice these symptoms.'
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur with this medicine, especially
      when you get up suddenly from a lying or sitting position. Getting up slowly
      may help lessen this problem. Also, lying down for a while may relieve the dizziness
      or lightheadedness.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other central nervous
      system (CNS) depressants. CNS depressants are medicines that slow down the nervous
      system, which may cause drowsiness or make you less alert. Some examples of
      CNS depressants are antihistamines or medicine for hay fever, allergies, or
      colds, sedatives, tranquilizers, or sleeping pills, prescription pain medicine
      or opioids, barbiturates or seizure medicines, muscle relaxants, or anesthetics
      (numbing medicines), including some dental anesthetics. This effect may last
      for a few days after you stop using this medicine. Check with your medical doctor
      or dentist before taking any of the above while you or your child are receiving
      this medicine .
  - type: paragraph
    text: This medicine may cause sleep-related breathing problems (eg, sleep apnea,
      sleep-related hypoxemia). Your doctor may decrease your dose if you have sleep
      apnea (stop breathing for short periods during sleep) while using this medicine.
  - type: paragraph
    text: This medicine may make you dizzy, drowsy, confused, or disoriented. Make
      sure you know how you react to this medicine before you drive, use machines,
      or do anything else that could be dangerous if you are dizzy or not alert .
  - type: paragraph
    text: This medicine may be habit-forming. If you feel that the medicine is not
      working as well, do not use more than your prescribed dose. Call your doctor
      for instructions.
  - type: paragraph
    text: Using opioids for a long time can cause severe constipation. To prevent
      this, your doctor may direct you to take laxatives, drink a lot of fluids, or
      increase the amount of fiber in your diet. Be sure to follow the directions
      carefully, because continuing constipation can lead to more serious problems.
  - type: paragraph
    text: If you have been using this medicine regularly for several weeks or more,
      do not change your dose or suddenly stop using it without checking with your
      doctor . Your doctor may want you to gradually reduce the amount you are using
      before stopping it completely. This may help prevent worsening of your condition
      and reduce the possibility of withdrawal symptoms, such as abdominal or stomach
      cramps, anxiety, fever, nausea, runny nose, sweating, tremors, or trouble sleeping.
  - type: paragraph
    text: 'If you think you have, or someone else has, taken an overdose of this medicine,
      get emergency help at once. Your healthcare provider may prescribe  naloxone
      to treat an overdose. Naloxone is a medicine that can temporarily reverse the
      effects of an overdose. If you have been prescribed naloxone, or purchased it
      over-the-counter, make sure your household members know how to use it in the
      event of an overdose. Emergency help is still needed after naloxone is used
      because the reversal effects are only temporary. Signs of an overdose include
      : change or loss of consciousness, cold, clammy skin, coughing that sometimes
      produces a pink frothy sputum, decreased awareness or responsiveness, extreme
      dizziness or weakness, increased sweating, irregular, fast, or slow, or shallow
      breathing, pale or blue lips, fingernails, or skin, sleepiness or unusual drowsiness,
      slow heartbeat, seizures, swelling in legs and ankles, or trouble breathing.
      Call your doctor right away if you notice these symptoms.'
  - type: paragraph
    text: This medicine may increase risk for muscle rigidity and movement. Tell your
      doctor if you or your child have stiff or rigid muscles after using this medicine.
  - type: paragraph
    text: Call your doctor right away if you have worsening of pain, increased sensitivity
      to pain, or new pain after taking this medicine. These may be symptoms of opioid-induced
      hyperalgesia and allodynia.
  - type: paragraph
    text: Check with your doctor right away if you have anxiety, restlessness, a fast
      heartbeat, fever, sweating, muscle spasms, twitching, nausea, vomiting, diarrhea,
      or see or hear things that are not there. These may be symptoms of a serious
      condition called serotonin syndrome. Your risk may be higher if you also take
      certain other medicines that affect serotonin levels in your body.
  - type: paragraph
    text: This medicine may cause adrenal gland problems. Check with your doctor right
      away if you have darkening of the skin, diarrhea, dizziness, fainting, loss
      of appetite, mental depression, nausea, skin rash, unusual tiredness or weakness,
      or vomiting.
  - type: paragraph
    text: Using this medicine while you are pregnant may cause neonatal withdrawal
      syndrome in your newborn babies. Tell your doctor right away if your baby has
      an abnormal sleep pattern, diarrhea, a high-pitched cry, irritability, shakiness
      or tremors, weight loss, vomiting, or fails to gain weight.
  - type: paragraph
    text: Using too much of this medicine may cause infertility (unable to have children).
      Talk with your doctor before using this medicine if you plan to have children.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or discomfort
      - difficult or troubled breathing
      - irregular, fast or slow, or shallow breathing
      - lightheadedness, dizziness, or fainting
      - pale or blue lips, fingernails, or skin
      - severe muscle stiffness
      - slow or irregular heartbeat
      - unusual tiredness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - change in consciousness
      - chest tightness
      - chills
      - confusion
      - cough
      - difficulty with swallowing
      - fast heartbeat
      - feeling cold
      - headache
      - hives, itching, or skin rash
      - inability to move the eyes
      - inability to sit still
      - increased blinking or spasms of the eyelid
      - increased sensitivity to pain
      - nervousness
      - pounding in the ears
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - restlessness
      - seeing, hearing, or feeling things that are not there
      - sticking out the tongue when not meaning to
      - sweating
      - uncontrolled twisting movements of the neck, trunk, arms, or legs
      - unusual facial expressions
      - worsening of pain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - increased sweating
      - redness of the skin
      - vomiting
      - welts
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
