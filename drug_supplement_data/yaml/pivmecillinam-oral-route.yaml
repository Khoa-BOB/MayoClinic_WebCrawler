title: Pivmecillinam (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Pivya
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Pivmecillinam is used to treat uncomplicated urinary tract infections. This
      medicine belongs to the group of medicines known as penicillin antibiotics.
      It works by killing the bacteria and preventing their growth. However, this
      medicine will not work for colds, flu, or other virus infection.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of pivmecillinam in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of pivmecillinam in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amifampridine
      - Clomipramine
      - Donepezil
      - Hydroxychloroquine
      - Methotrexate
      - Valproic Acid
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to penicillins or cephalosporin antibiotics (eg, cefaclor, cefadroxil,
        cephalexin, Ceftin®, Keflex®) or
      - Carnitine deficiency or
      - Porphyria—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you feel
      better after the first few doses. Your infection may not clear up if you stop
      using the medicine too soon.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For uncomplicated urinary tract infections:
        Adults—185 milligrams (mg) 3 times a day for 3 to 7 days. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For uncomplicated urinary tract infections: Adults—185 milligrams (mg) 3
        times a day for 3 to 7 days. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - Adults—185 milligrams (mg) 3 times a day for 3 to 7 days.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress while you are
      using this medicine . This will allow your doctor to see if the medicine is
      working properly and to decide if you should continue to use it. Blood tests
      may be needed to check for unwanted effects.
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: This medicine may cause serious allergic reaction, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Check
      with your doctor right away if you have chest tightness, cough, difficulty swallowing,
      dizziness, fast heartbeat, hives, itching, skin rash, puffiness or swelling
      of the eyelids or around the eyes, face, lips, or tongue, trouble breathing,
      or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause serious skin reactions, including acute generalized
      exanthematous pustulosis (AGEP), drug reactions with eosinophilia and systemic
      symptoms (DRESS), Stevens-Johnson syndrome, and toxic epidermal necrolysis.
      Check with your doctor right away if you have black, tarry stools, blistering,
      peeling, or loosening of the skin, chest pain, chills, cough, diarrhea, fever,
      itching, joint or muscle pain, painful or difficult urination, red irritated
      eyes, red skin lesions, often with a purple center, sore throat, sores, ulcers,
      or white spots on the mouth or on the lips, swollen glands, trouble breathing,
      unusual bleeding or bruising, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause carnitine depletion. Check with your doctor right
      away if you have anxiety, blurred vision, chills, cold sweats, coma, confusion,
      cool, pale skin, depression, dizziness, fast heartbeat, headache, increased
      hunger, muscle pain, nausea, nervousness, nightmares, seizures, shakiness, slurred
      speech, or unusual tiredness or weakness.
  - type: paragraph
    text: Pivmecillinam may cause diarrhea, and in some cases it can be severe. It
      may occur 2 months or more after you stop taking this medicine. Do not take
      any medicine to treat diarrhea without first checking with your doctor. Diarrhea
      medicines may make the diarrhea worse or make it last longer. If you have any
      questions about this or if mild diarrhea continues or gets worse, check with
      your doctor.
  - type: paragraph
    text: Before you have any medical tests, tell the provider that you are taking
      this medicine. The results of some tests (eg, newborn screening test) may be
      affected by this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - itching of the vagina or genitals
      - thick, white vaginal discharge with mild or no odor
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - black, tarry stools
      - bleeding gums
      - blistering, peeling, or loosening of the skin
      - blood in the urine or stools
      - blurred vision
      - chest pain or tightness
      - chills
      - cold sweats
      - coma
      - confusion
      - cool, pale skin
      - cough
      - dark urine
      - depression
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - fever
      - headache
      - hives, itching, skin rash
      - increased hunger
      - joint or muscle pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss of appetite
      - muscle pain
      - nausea
      - nervousness
      - nightmares
      - painful or difficult urination
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red irritated eyes
      - red skin lesions, often with a purple center
      - seizures
      - shakiness
      - slurred speech
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach pain, severe
      - swollen glands
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest burning or discomfort
      - dizziness or lightheadedness
      - feeling of constant movement of self or surroundings
      - heartburn
      - pain or burning in the throat
      - pain with swallowing
      - sensation of spinning
      - vomiting blood
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
