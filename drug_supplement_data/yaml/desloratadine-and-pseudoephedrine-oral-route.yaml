title: Desloratadine and pseudoephedrine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Clarinex-D
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Desloratadine and pseudoephedrine is a combination of two medicines used
      to treat nasal congestion (stuffy nose), sneezing, and runny nose caused by
      hay fever.
  - type: paragraph
    text: Desloratadine works by preventing the effects of a substance called histamine,
      which is produced by the body. Histamine can cause itching, sneezing, runny
      nose, and watery eyes.
  - type: paragraph
    text: The pseudoephedrine causes narrowing of blood vessels. This leads to clearing
      of nasal congestion, but it may also cause an increase in blood pressure in
      patients who have high blood pressure.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: Do not give any over-the-counter (OTC) cough and cold medicine to a baby
      or child under 4 years of age. Using these medicines in very young children
      might cause serious or possibly life-threatening side effects .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Extended Release, 12 HR
    - Tablet, Extended Release, 24 HR
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Desloratadine and pseudoephedrine combination is not recommended for use
        in pediatric patients under 12 years of age.
    - type: paragraph
      text: Do not give any over-the-counter (OTC) cough and cold medicine to a baby
        or child under 4 years of age. Using these medicines in very young children
        might cause serious or possibly life-threatening side effects .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of desloratadine
        and pseudoephedrine combination in the elderly with use in other age groups,
        elderly patients are more likely to be sensitive to the effects of this drug.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Dihydroergotamine
      - Furazolidone
      - Iproniazid
      - Isocarboxazid
      - Linezolid
      - Methylene Blue
      - Moclobemide
      - Nialamide
      - Phenelzine
      - Procarbazine
      - Rasagiline
      - Safinamide
      - Selegiline
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Cannabidiol
      - Carbamazepine
      - Clopidogrel
      - Gemfibrozil
      - Guanethidine
      - Iobenguane I 123
      - Iobenguane I 131
      - Methyldopa
      - Midodrine
      - Pitolisant
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes mellitus (sugar diabetes)—The decongestant in this medicine may put
        diabetic patients at a greater risk of having heart or blood vessel disease.
    - type: list
      ordered: false
      items:
      - Enlarged prostate or
      - Urinary tract blockage or difficult urination—Some of the effects of antihistamines
        may make urinary problems worse.
    - type: list
      ordered: false
      items:
      - Glaucoma—A slight increase in inner eye pressure may occur.
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease or
      - High blood pressure—The decongestant in this medicine may cause blood pressure
        to increase and may also speed up the heart rate.
    - type: list
      ordered: false
      items:
      - Kidney disease—Higher blood levels of desloratadine may result, which may
        increase the chance of side effects. If you are taking the 24 hour extended-release
        tablets, the dosage may need to be reduced. The 12 hour extended-release tablets
        should generally be avoided if you have kidney disease.
    - type: list
      ordered: false
      items:
      - Liver disease—Higher blood levels of desloratadine may result, which may increase
        the chance of side effects. This medicine should generally be avoided if you
        have liver disease.
    - type: list
      ordered: false
      items:
      - Overactive thyroid—If an overactive thyroid has caused a fast heart rate,
        desloratadine in this medicine may cause the heart rate to speed up further.
    - type: list
      ordered: false
      items:
      - Urinary retention—Condition may be worsened with use of pseudoephedrine
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed. Do not take more of it and do not take
      it more often than recommended on the label, unless otherwise directed by your
      doctor. To do so may increase the chance of side effects.
  - type: paragraph
    text: Not taking over-the-counter antihistamines and decongestants while taking
      desloratadine and pseudoephedrine combination.
  - type: paragraph
    text: 'When taking desloratadine and pseudoephedrine extended-release tablet:'
  - type: list
    ordered: false
    items:
    - Swallow it whole.
    - Do not crush, break, or chew before swallowing.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets [12 hour]): For nasal congestion
        or rhinorrhea Adults and teenagers—Oral, one tablet (2.5 milligrams desloratadine,
        120 milligrams pseudoephedrine) two times a day 12 hours apart, taken with
        or without a meal Children 4 years of age and older—Use and dose must be determined
        by your doctor. Children and infants up to 4 years of age—Use is not recommended
        .'
    - type: list
      ordered: false
      items:
      - For nasal congestion or rhinorrhea Adults and teenagers—Oral, one tablet (2.5
        milligrams desloratadine, 120 milligrams pseudoephedrine) two times a day
        12 hours apart, taken with or without a meal Children 4 years of age and older—Use
        and dose must be determined by your doctor. Children and infants up to 4 years
        of age—Use is not recommended .
    - type: list
      ordered: false
      items:
      - Adults and teenagers—Oral, one tablet (2.5 milligrams desloratadine, 120 milligrams
        pseudoephedrine) two times a day 12 hours apart, taken with or without a meal
      - Children 4 years of age and older—Use and dose must be determined by your
        doctor.
      - Children and infants up to 4 years of age—Use is not recommended .
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets [24 hour]): For nasal congestion
        or rhinorrhea Adults and teenagers—Oral, one tablet (5 milligrams desloratadine,
        240 milligrams pseudoephedrine) daily, taken with or without a meal Children
        4 years of age and older—Use and dose must be determined by your doctor. Children
        and infants up to 4 years of age—Use is not recommended .'
    - type: list
      ordered: false
      items:
      - For nasal congestion or rhinorrhea Adults and teenagers—Oral, one tablet (5
        milligrams desloratadine, 240 milligrams pseudoephedrine) daily, taken with
        or without a meal Children 4 years of age and older—Use and dose must be determined
        by your doctor. Children and infants up to 4 years of age—Use is not recommended
        .
    - type: list
      ordered: false
      items:
      - Adults and teenagers—Oral, one tablet (5 milligrams desloratadine, 240 milligrams
        pseudoephedrine) daily, taken with or without a meal
      - Children 4 years of age and older—Use and dose must be determined by your
        doctor.
      - Children and infants up to 4 years of age—Use is not recommended .
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Desloratadine may cause dryness of the mouth, nose, and throat. For temporary
      relief, use sugarless candy or gum, melt bits of ice in your mouth, or use a
      saliva substitute. However, if your mouth continues to feel dry for more than
      2 weeks, check with your dentist. Continuing dryness of the mouth may increase
      the chance of dental disease, including tooth decay, gum disease, and fungus
      infections.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Observed during clinical practice
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain area
      - chills
      - clay-colored stools
      - cough
      - dark urine
      - difficult or labored breathing
      - difficulty swallowing
      - dizziness
      - elevated liver enzymes
      - fast heartbeat
      - fast, pounding, or irregular heartbeat or pulse
      - fever
      - general tiredness and weakness
      - headache
      - hives
      - irregular heartbeat
      - itching
      - light-colored stools
      - loss of appetite
      - nausea
      - puffiness or swelling of the eyelids or around the eyes, face, lips or tongue
      - rash
      - redness of skin
      - shortness of breath
      - skin rash
      - swelling
      - tightness in chest
      - unpleasant breath odor
      - unusual tiredness or weakness
      - upper right abdominal pain
      - vomiting of blood
      - vomiting
      - welts
      - wheezing
      - yellow eyes or skin
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    - type: list
      ordered: false
      items:
      - Increased heart rate
      - sleepiness or unusual drowsiness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry mouth
      - sleeplessness
      - trouble sleeping
      - unable to sleep
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - congestion
      - dryness or soreness of throat
      - hoarseness
      - nervousness
      - restlessness
      - runny nose
      - sleepiness or unusual drowsiness
      - tender, swollen glands in neck
      - trouble sitting still
      - voice changes
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
