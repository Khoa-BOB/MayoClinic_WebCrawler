title: Lofexidine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Lucemyra
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Lofexidine is used to help reduce withdrawal symptoms (eg, stomach cramps,
      muscle spasms or twitching, yawning, runny eyes, trouble sleeping, pounding
      of the heart) in patients using opioid medicines. Withdrawal symptoms happen
      when you stop using an opioid medicine suddenly. Lofexidine may also be used
      as part of a complete program, together with medical supervision and counseling,
      to treat opioid addiction.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of lofexidine in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of lofexidine in geriatric patients. However, elderly patients are more likely
        to have age-related kidney problems, which may require caution and an adjustment
        in the dose for patients receiving lofexidine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Levoketoconazole
      - Mavorixafor
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Acepromazine
      - Adagrasib
      - Alfentanil
      - Alfuzosin
      - Alprazolam
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amobarbital
      - Anagrelide
      - Anileridine
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Azithromycin
      - Baclofen
      - Bedaquiline
      - Benperidol
      - Benzhydrocodone
      - Bromazepam
      - Buprenorphine
      - Buserelin
      - Buspirone
      - Butabarbital
      - Butorphanol
      - Calcium Oxybate
      - Carbinoxamine
      - Carisoprodol
      - Carphenazine
      - Celecoxib
      - Ceritinib
      - Chloral Hydrate
      - Chlordiazepoxide
      - Chloroquine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Bupropion
      - Naltrexone
      - Terbinafine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bradycardia (slow heartbeat) or
      - Brain or blood vessel disease or
      - Chronic kidney failure or
      - Heart attack, recent or
      - Heart failure or
      - Heart problems or
      - Heart rhythm problems (eg, bradyarrhythmia, QT prolongation)—Use with caution.
        May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Hypokalemia (low potassium levels in the blood) or
      - Hypomagnesemia (low magnesium levels in the blood)—These conditions must be
        corrected first before starting treatment with this medicine.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of the
        slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. This is especially important for elderly patients, who may be
      more sensitive to the effects of pain medicines.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Do not take oral naltrexone within 2 hours of using this medicine.
  - type: paragraph
    text: Drink plenty of fluids and avoid becoming overheated during treatment with
      this medicine to prevent unwanted effects.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For opioid withdrawal symptoms: Adults—The
        usual dose is three 0.18 milligram (mg) tablets taken 4 times a day. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than 0.72 mg (4 tablets) 4 times a day. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For opioid withdrawal symptoms: Adults—The usual dose is three 0.18 milligram
        (mg) tablets taken 4 times a day. Your doctor may adjust your dose as needed.
        However, the dose is usually not more than 0.72 mg (4 tablets) 4 times a day.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—The usual dose is three 0.18 milligram (mg) tablets taken 4 times a
        day. Your doctor may adjust your dose as needed. However, the dose is usually
        not more than 0.72 mg (4 tablets) 4 times a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress while you are
      using this medicine to make sure this medicine is working properly and to check
      for unwanted effects.
  - type: paragraph
    text: This medicine may cause low blood pressure, slow heartbeat, or fainting.
      Contact your doctor right away if you have any changes to your heart rhythm.
      Make sure your doctor knows if you or anyone in your family has ever had a heart
      rhythm problem such as QT prolongation.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other central nervous
      system (CNS) depressants. CNS depressants are medicines that slow down the nervous
      system, which may cause drowsiness or make you less alert. Some examples of
      CNS depressants are antihistamines or medicine for allergies or colds, sedatives,
      tranquilizers, or sleeping medicine, other prescription pain medicine or narcotics,
      medicine for anxiety or benzodiazepines, medicine for seizures or barbiturates,
      muscle relaxants, or anesthetics (numbing medicines), including some dental
      anesthetics. This effect may last for a few days after you stop using this medicine.
      Check with your doctor before taking any of the other medicines listed above
      while you are using lofexidine .
  - type: paragraph
    text: After a period of not using an opioid medicine, you may be more sensitive
      to its effects and at greater risk of overdosing. Talk to your doctor if you
      have concerns.
  - type: paragraph
    text: Do not suddenly stop using this medicine without first checking with your
      doctor . You may be directed to gradually reduce the amount you are using before
      stopping treatment completely to lessen the chance of unwanted side effects.
  - type: paragraph
    text: This medicine may make you dizzy, drowsy, or lightheaded. Do not drive or
      do anything else that could be dangerous until you know how this medicine affects
      you .
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur when you get up suddenly
      from a lying or sitting position. Getting up slowly may help lessen this problem.
      Also, lying down for a while may relieve dizziness or lightheadedness.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or discomfort
      - chills
      - cold sweats
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - slow or irregular heartbeat
      - unusual tiredness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - drowsiness
      - dry mouth
      - relaxed and calm feeling
      - sleepiness
      - trouble sleeping
      - unusual drowsiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Continuing ringing or buzzing or other unexplained noise in the ears
      - hearing loss
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - diarrhea
      - increased sweating
      - pain the arms or legs
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
