      - Amineptine
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amitriptylinoxide
      - Amobarbital
      - Amoxapine
      - Amphetamine
      - Amtolmetin Guacil
      - Anagrelide
      - Anileridine
      - Apalutamide
      - Apomorphine
      - Aprobarbital
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Aspirin
      - Astemizole
      - Atazanavir
      - Azimilide
      - Azithromycin
