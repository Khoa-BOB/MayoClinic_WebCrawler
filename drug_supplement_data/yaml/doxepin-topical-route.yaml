      - Levonorgestrel
      - Mestranol
      - Nomegestrol
      - Norethindrone
      - Norgestimate
      - Norgestrel
      - Phenprocoumon
      - Propoxyphene
      - S-Adenosylmethionine
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Glaucoma or
      - Urinary tract blockage or difficult urination—Using topical doxepin may make
        these conditions worse
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Topical doxepin is for external use only. Do not use this medicine orally,
      do not use it on the eyes, or inside of the vagina.
  - type: paragraph
    text: Use this medicine exactly as directed. Do not use more of it, do not use
      it more often, and do not use it for more than 8 days. Also, do not apply it
      to an area of skin larger than recommended by your doctor. To do so may increase
      the chance of side effects.
  - type: paragraph
    text: Apply a thin layer of doxepin cream to only the affected area(s) of the
      skin and rub in gently.
  - type: paragraph
    text: To help clear up your skin problem it is very important that you keep using
      topical doxepin for the full time of treatment. Do not miss any doses.
  - type: paragraph
    text: Do not cover with a bandage or otherwise wrap the area of skin being treated.
      This may increase the amount of medicine that gets into the bloodstream, thereby
      increasing the chance of side effects.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (cream): For itching due to eczema: Adults—Apply
        a thin layer to the affected area(s) of the skin four times a day. Space the
        doses or applications at least three or four hours apart. Treatment may be
        continued for up to eight days. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - 'For itching due to eczema: Adults—Apply a thin layer to the affected area(s)
        of the skin four times a day. Space the doses or applications at least three
        or four hours apart. Treatment may be continued for up to eight days. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply a thin layer to the affected area(s) of the skin four times a
        day. Space the doses or applications at least three or four hours apart. Treatment
        may be continued for up to eight days.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your skin problem does not improve after 8 days or if it becomes worse,
      check with your doctor.
  - type: paragraph
    text: This medicine will add to the effects of alcohol (alcoholic beverages or
      other alcohol-containing preparations [e.g., elixirs, cough syrups, tonics])
      and other CNS depressants (medicines that slow down the nervous system, possibly
      causing drowsiness). Some examples of CNS depressants are antihistamines or
      medicine for hay fever, other allergies, or colds; sedatives, tranquilizers,
      or sleeping medicine; prescription pain medicine or narcotics; barbiturates;
      medicine for seizures; muscle relaxants; or anesthetics, including some dental
      anesthetics. Check with your doctor before taking any of the above while you
      are using this medicine.
  - type: paragraph
    text: Topical doxepin may cause some people to become drowsy. Make sure you know
      how to react to this medicine before you drive, use machines, or do other jobs
      that require you to be alert. If too much drowsiness occurs, it may be necessary
      to use less medicine, use it less often, or stop using it completely. However,
      check with your doctor first before lessening your dose or stopping use of this
      medicine.
  - type: paragraph
    text: This medicine may cause dryness of the mouth. For temporary relief, use
      sugarless gum or candy, or melt bits of ice in your mouth, or use a saliva substitute.
      However, if your mouth continues to feel dry for more than 2 weeks, check with
      your medical doctor or dentist. Continuing dryness of the mouth may increase
      the chance of dental disease, including tooth decay, gum disease, and fungus
      infections.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, or tingling sensation of the skin
      - swelling at the site of application
      - worsening of eczema and itching
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal pain and swelling
      - blurring of vision
      - convulsions (seizures)
      - decreased awareness or responsiveness
      - difficulty in breathing
      - difficulty in passing urine
      - dizziness, fainting, or lightheadedness
      - drowsiness
      - enlarged pupils
      - excessive dryness of mouth
      - extremely high fever or body temperature
      - extremely low body temperature
      - fast heartbeat
      - increased or excessive unconscious or jerking movements
      - incurable constipation
      - irregular heartbeat
      - unconsciousness
      - vomiting
      - weak pulse
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning and/or stinging at the site of application
      - changes in taste
      - dizziness
      - drowsiness
      - dryness and tightness of skin
      - dryness of mouth and/or lips
      - emotional changes
      - headache
      - thirst
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - irritation, tingling, scaling, and cracking of skin
      - nausea
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
