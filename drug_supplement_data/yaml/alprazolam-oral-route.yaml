    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: It is very important to protect the orally disintegrating tablets from
        moisture. Remove and throw away any cotton packaging from the medicine bottle
        when you first use the medicine.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for any unwanted effects.
  - type: paragraph
    text: Tell your doctor if you are pregnant or planning to become pregnant. Using
      this medicine during the later pregnancy may cause problems in your newborn
      baby (eg, sedation or withdrawal symptoms). Tell your doctor right away if your
      baby has an abnormal sleep pattern, diarrhea, feeding problems, a high-pitched
      cry, irritability, low muscle tone, restlessness, shakiness or tremors, sluggishness,
      trouble breathing, weight loss, vomiting, or fails to gain weight. If you think
      you have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: Do not take itraconazole (Sporanox®) or ketoconazole (Nizoral®) while you
      are using this medicine. Using any of them together with this medicine may increase
      the chance of serious side effects .
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that slow down the nervous system, possibly causing drowsiness).  Some
      examples of CNS depressants are antihistamines or medicine for hay fever, allergies,
      or colds, sedatives, tranquilizers, or sleeping medicine, prescription pain
      medicine or narcotics, barbiturates or seizure medicines, muscle relaxants,
      or anesthetics (numbing medicines), including some dental anesthetics. This
      effect may last for a few days after you stop using this medicine. Check with
      your doctor before taking any of the above while you are using this medicine
      .
  - type: paragraph
    text: If you develop any unusual and strange thoughts or behavior while you are
      taking alprazolam, be sure to discuss it with your doctor. Some changes that
      have occurred in people taking this medicine are like those seen in people who
      drink alcohol and then act in a manner that is not normal. Other changes may
      be more unusual and extreme, such as confusion, worsening of depression, hallucinations
      (seeing, hearing, or feeling things that are not there), suicidal thoughts,
      and unusual excitement, nervousness, or irritability.
  - type: paragraph
    text: Alprazolam may cause some people, especially older persons, to become drowsy,
      dizzy, or less alert than they are normally. Make sure you know how you react
      to this medicine before you drive, use machines, or do anything else that could
      be dangerous if you are dizzy, or are not alert or able to see well .
  - type: paragraph
    text: Do not change your dose or stop taking this medicine without checking first
      with your doctor . Your doctor may want you to gradually reduce the amount you
      are using before stopping it completely. This may help prevent a worsening of
      your condition and reduce the possibility of withdrawal symptoms including changes
      in behavior, discouragement, feeling sad or empty, irritability, lack of appetite,
      loss of interest or pleasure, nausea or vomiting, seeing or hearing things that
      others do not see or hear, seizures or tremors, stomach or muscle cramps, sweating,
      thoughts of killing oneself, trouble concentrating, trouble sleeping, unusual
      movements, responses, or expressions.
  - type: paragraph
    text: This medicine may be habit-forming. If you feel that the medicine is not
      working as well, do not use more than your prescribed dose . Call your doctor
      for instructions.
  - type: paragraph
    text: 'Symptoms of an overdose include: change in consciousness, confusion, dizziness,
      faintness, or lightheadedness when getting up suddenly from a lying or sitting
      position, drowsiness, hallucinations, lack of coordination, loss of consciousness,
      loss of strength or energy, muscle pain or weakness, shakiness and unsteady
      walk, sleepiness, trouble in speaking, trouble sleeping, unsteadiness, trembling,
      or other problems with muscle control or coordination, unusual excitement, nervousness,
      restlessness, or irritability, or unusual weakness . Call your doctor right
      away if you notice these symptoms.'
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
