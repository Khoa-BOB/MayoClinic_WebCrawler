    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol or drug abuse or dependence, history of or
      - Depression, or history of or
      - Lung or breathing problems (eg, respiratory depression) or
      - Mania, or history of or
      - Mental health problems, or history of or
      - Seizures, or history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Glaucoma, acute narrow angle—Should not be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. If too much of this medicine is used for a long time, it may
      become habit-forming (causing mental or physical dependence) or cause an overdose.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the extended-release tablet or tablet whole with a full glass of
      water. Do not break, crush, or chew it.
  - type: paragraph
    text: If you are using the orally disintegrating tablet , make sure your hands
      are dry before you handle the tablet. Do not remove the tablets from the bottle
      until you are ready to take it. Place the tablet immediately on the top of your
      tongue. It should melt quickly and be swallowed with saliva.
  - type: paragraph
    text: If you are using the oral liquid , measure the dose with a marked measuring
      spoon, oral syringe, or medicine cup.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For anxiety: For oral dosage forms (solution, tablets, or orally disintegrating
        tablets): Adults—At first, 0.25 to 0.5 milligram (mg) 3 times a day. Your
        doctor may increase your dose as needed. However, the dose is usually not
        more than 4 mg per day. Older adults—At first, 0.25 mg 2 or 3 times a day.
        Your doctor may increase your dose as needed. Children—Use and dose must be
        determined by your doctor.'
      - 'For panic disorder: For oral dosage form (extended-release tablets): Adults—At
        first, 0.5 to 1 milligram (mg) taken in the morning once a day. Your doctor
        may increase your dose as needed. However, the dose is usually not more than
        10 mg per day. Older adults—At first, 0.5 mg taken in the morning once a day.
        Your doctor may increase your dose as needed. Children—Use and dose must be
        determined by your doctor. For oral dosage forms (solution, tablets, or orally
        disintegrating tablets): Adults—At first, 0.5 milligram (mg) 3 times a day.
        Your doctor may increase your dose as needed. However, the dose is usually
        not more than 10 mg per day. Older adults—At first, 0.25 mg 2 or 3 times a
        day. Your doctor may increase your dose as needed. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (solution, tablets, or orally disintegrating tablets):
        Adults—At first, 0.25 to 0.5 milligram (mg) 3 times a day. Your doctor may
