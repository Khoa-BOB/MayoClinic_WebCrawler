  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Concizumab-mtci
      - Fitusiran
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood clots or a history of medical problems caused by blood clots or
      - Liver disease—Risk of bleeding or developing blood clots may be increased
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Some medicines given by injection may sometimes be given at home to patients
      who do not need to be in the hospital. If you are using this medicine at home,
      your health care professional will teach you how to prepare and inject the medicine.
      You will have a chance to practice preparing and injecting it. Be sure that
      you understand exactly how the medicine is to be prepared and injected.
  - type: paragraph
    text: 'To prepare this medicine:'
  - type: list
    ordered: false
    items:
    - Take the dry medicine and the liquid (diluent) out of the refrigerator and bring
      them to room temperature, as directed by your doctor.
    - When injecting the liquid (diluent) into the dry medicine, aim the stream of
      liquid (diluent) against the wall of the container of dry medicine to prevent
      foaming.
    - Swirl the container gently to dissolve the medicine. Do not shake the container.
  - type: paragraph
    text: Use this medicine right away. It should not be kept longer than 3 hours
      after it has been prepared.
  - type: paragraph
    text: A plastic disposable syringe and filter needle must be used with this medicine.
      The medicine may stick to the inside of a glass syringe, and you may not receive
      a full dose.
  - type: paragraph
    text: Do not reuse syringes and needles. Put used syringes and needles in a puncture-resistant
      disposable container, or dispose of them as directed by your health care professional.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - The condition for which you are using this medicine.
      - Your body weight.
      - The amount of factor IX your body is able to make.
      - How much, how often, and where in your body you are bleeding.
      - Whether or not your body has built up a defense (antibody) against this medicine.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Some factor IX products must be stored in the refrigerator, and some may
        be kept at room temperature for short periods of time. Store this medicine
        as directed by your doctor or the manufacturer.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If you were recently diagnosed with hemophilia B, you should receive hepatitis
      A and hepatitis B vaccines to reduce even further your risk of getting hepatitis
      A or hepatitis B from factor IX products.
  - type: paragraph
    text: After a while, your body may build up a defense (antibody) against this
      medicine. Tell your doctor if this medicine seems to be less effective than
      usual.
  - type: paragraph
    text: It is recommended that you carry identification stating that you have hemophilia
      A or hemophilia B. If you have any questions about what kind of identification
      to carry, check with your health care professional.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in facial skin color
      - fast or irregular breathing
      - puffiness or swelling of the eyelids or around the eyes
      - shortness of breath, troubled breathing, tightness in chest, and/or wheezing
      - skin rash, hives, and/or itching
    - type: paragraph
      text: 'Check with your doctor immediately if any of the following side effects
        occur:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish coloring (especially of the hands and feet)
      - convulsions
      - dizziness or lightheadedness when getting up from a lying or sitting position
      - increased heart rate
      - large blue or purplish patches in the skin (at places of injection)
      - nausea or vomiting
      - pains in chest, groin, or legs (especially calves)
      - persistent bleeding from puncture sites, gums, or inner linings of the nose
        and/or mouth, or blood in the stool or urine
      - severe pain or pressure in the chest and/or the neck, back, or left arm
      - severe, sudden headache
      - shortness of breath or fast breathing
      - sudden loss of coordination
      - sudden and unexplained slurred speech, vision changes, and/or weakness or
        numbness in arm or leg
    - type: paragraph
      text: 'Check with your doctor immediately if any of the following side effects
        occur:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning or stinging at place of injection
      - changes in blood pressure or pulse rate
      - chills
      - drowsiness
      - fever
      - headache
      - nausea or vomiting
      - redness of face
      - shortness of breath
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
