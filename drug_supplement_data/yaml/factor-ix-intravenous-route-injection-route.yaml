- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Factor IX is a protein produced naturally in the body. It helps the blood
      form clots to stop bleeding. Injections of factor IX are used to treat hemophilia
      B, which is sometimes called Christmas disease. This is a condition in which
      the body does not make enough factor IX. If you do not have enough factor IX
      and you become injured, your blood will not form clots as it should, and you
      may bleed into and damage your muscles and joints.
  - type: paragraph
    text: Injections of one form of factor IX, called factor IX complex, also are
      used to treat certain people with hemophilia A. In hemophilia A, sometimes called
      classical hemophilia, the body does not make enough factor VIII, and, just as
      in hemophilia B, the blood cannot form clots as it should. Injections of factor
      IX complex may be used in patients in whom the medicine used to treat hemophilia
      A is no longer effective. Injections of factor IX complex also may be used for
      other conditions as determined by your doctor.
  - type: paragraph
    text: The factor IX product that your doctor will give you is obtained naturally
      from human blood or artificially by a man-made process. Factor IX obtained from
      human blood has been treated and is not likely to contain harmful viruses such
      as hepatitis B virus, hepatitis C (non-A, non-B) virus, or human immunodeficiency
      virus (HIV), the virus that causes acquired immunodeficiency syndrome (AIDS).
      The man-made factor IX product does not contain these viruses.
  - type: paragraph
    text: Factor IX is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Blood clots may be especially likely to occur in premature and newborn
        babies, who are usually more sensitive than adults to the effects of injections
        of factor IX.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested and has not been shown to cause different
        side effects or problems in older people than it does in younger adults.
    subsections: []
