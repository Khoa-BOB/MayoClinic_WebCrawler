    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: 'Harliku™ : If you miss a dose of this medicine, take the next dose at
        your regular dosing schedule. Do not double doses.'
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Once opened, you may store the bottle of oral liquid at room temperature
        for up to 60 days. Throw away any unused medicine after 60 days.
    - type: paragraph
      text: Store the Harliku™ tablets in a closed container at room temperature,
        away from heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the Nityr® tablets in its original container at room temperature.
        Keep the tablets and the medicine prepared in an oral syringe and with the
        applesauce away from direct light. Throw away unused mixture within 2 hours
        after mixing with applesauce or within 24 hours after mixing in the oral syringe.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Check with your doctor right away if blurred vision, difficulty seeing at
      night, sensitivity of the eyes to sunlight, or any other changes in vision occur
      during or after treatment. Your doctor may want your eyes be checked by an ophthalmologist
      (eye doctor).
  - type: paragraph
    text: This medicine may also cause intellectual disability and developmental delay.
      Check with your doctor if you or your child has problems in short-term memory,
      learning ability, or attention.
  - type: paragraph
    text: This medicine may cause painful hyperkeratotic plaques (skin condition)
      on the soles and palms. Check with your doctor right away if your skin becomes
      thicker than normal.
  - type: paragraph
    text: 'Nitisinone can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. It can also lower the
      number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: The oral suspension contains glycerol and may cause diarrhea, an upset stomach,
      or headaches. Let your doctor know if you have these symptoms.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blindness
      - blood in the urine or stools
      - bloody nose
      - blurred vision
      - burning, dry, or itching eyes
      - change in color vision
      - chest pain or discomfort
      - chills
      - cough
      - decreased vision
      - difficulty seeing at night
      - excessive eye tearing
      - eye redness, irritation, or pain
      - fever
      - increased sensitivity of the eyes to sunlight
      - painful or difficult urination
      - pinpoint red spots on the skin
      - redness, pain, swelling of the eye, eyelid, or inner lining of the eyelid
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swollen or painful glands
      - thickened patches on the skin
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - back pain
      - bluish color of the fingernails, lips, skin, palms, or nail beds
      - chest tightness
      - confusion
      - cough with mucus
      - difficulty with breathing
      - dizziness
      - drowsiness
      - fast heartbeat
      - headache
      - irritability
      - seeing or hearing things that are not there
      - seizures
      - stiff neck
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry skin
      - hair loss or thinning
      - itching or skin rash
      - red, swollen skin
      - scaly skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cold sweats
      - cool, pale skin
      - depression
      - headache
      - increased hunger
      - nausea
      - nightmares
      - shakiness
      - slurred speech
      - stomach pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
