title: Nitisinone (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Nityr
    - type: paragraph
      text: Orfadin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Nitisinone is used to treat hereditary tyrosinemia type 1, which is too
      much tyrosine in the blood. It helps to prevent high levels of tyrosine in the
      blood. Treatment with nitisinone and diet changes may slow the progression of
      the disease, but will not cure it.
  - type: paragraph
    text: Nitisinone is also used to reduce urine homogentisic acid (HGA) in patients
      with alkaptonuria (AKU), a rare inherited genetic disorder.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
    - Tablet
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Nityr® or Orfadin® in children.
        Safety and efficacy have been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Harliku™ in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of Orfadin® in geriatric patients. However, elderly patients are more likely
        to have age-related liver, kidney, or heart problems, which may require caution
        and an adjustment in the dose for patients receiving this medicine.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Nityr® in the elderly. However,
        elderly patients are more likely to have age-related liver, kidney, or heart
        problems, which may require caution in the dose for patients receiving Nityr®
        .
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Harliku™ in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Deuruxolitinib
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acyclovir
      - Adefovir
      - Azathioprine
      - Aztreonam
      - Baricitinib
      - Bumetanide
      - Cefaclor
      - Ceftizoxime
      - Celecoxib
      - Ciprofloxacin
      - Erdafitinib
      - Famotidine
      - Fosphenytoin
      - Furosemide
      - Glipizide
      - Glyburide
      - Levoketoconazole
      - Meloxicam
      - Mercaptopurine
      - Meropenem
      - Methadone
      - Methotrexate
      - Oseltamivir
      - Penicillin G
      - Phenobarbital
      - Phenprocoumon
      - Phenytoin
      - Piroxicam
      - Primidone
      - Ruxolitinib
      - Seladelpar
      - Siponimod
      - Sulbactam
      - Sulopenem
      - Tenofovir
      - Tolbutamide
      - Vadadustat
      - Valacyclovir
      - Voriconazole
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Conjunctivitis (eye inflammation) or
      - Eye pain or
      - Leukopenia (low white blood cells) or
      - Photophobia (eye sensitivity to light) or
      - Thrombocytopenia (low platelets in the blood)—Use with caution. May make these
        conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: Carefully follow your doctor's instructions about a special diet .
  - type: paragraph
    text: This medicine should come with a Medication Guide or patient instructions.
      Read and follow these instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: You may take the oral liquid and tablet with or without food.
  - type: paragraph
    text: 'To use the Orfadin® capsule :'
  - type: list
    ordered: false
    items:
    - Take the capsule on an empty stomach at least 1 hour before or 2 hours after
      a meal.
    - If needed, you may open the capsule and put the contents in a small amount of
      water, formula, or applesauce. Give the medicine as soon as it is mixed.
  - type: paragraph
    text: 'To use the Orfadin® oral liquid :'
  - type: list
    ordered: false
    items:
    - Allow the bottle to warm to room temperature for 30 to 60 minutes.
    - Shake the bottle for at least 20 seconds until the solid cake at the bottom
      of the bottle is completely dissolved.
    - Insert the bottle adapter and measure the medicine with an oral syringe.
    - Shake the bottle for at least 5 seconds before measuring each dose to remove
      any particles at the bottom of the bottle.
  - type: paragraph
    text: 'To use the Nityr® tablet :'
  - type: list
    ordered: false
    items:
    - 'If you are unable to swallow the tablet whole, you can mix the tablet with
      water in an oral syringe or crush the tablet and mix with applesauce. Do not
      mix it with any other food or liquid. To prepare for an applesauce mixture:
      Wash your hands well before preparing the medicine. Measure about 1 teaspoon
      of applesauce and put it into a clean container (eg, glass or bowl). Place the
      tablet onto a spoon. Crush one tablet at a time between 2 spoons until the tablet
      is crushed to a fine powder. Carefully place the powder into the clean container
      of applesauce. Make sure that no tablet powder remains on the teaspoon. If more
      than 1 tablet is needed, repeat the previous steps. Stir the mixture well. Swallow
      all of the mixture right away or within 2 hours of mixing. Repeat this step
      until no mixture is left in the container. Measure another 1 teaspoon of applesauce
      and place it in the container. Stir the fresh applesauce with any remaining
      tablet powder until mixed well. Swallow this mixture right away. This will make
      sure any remaining medicine in the container is administered. To prepare for
      an oral syringe: Wash your hands well before preparing the medicine. Use only
      1 or 2 tablets in an oral syringe at a time. For 1 tablet: place the tablet
      in the oral syringe. Add 2.6 milliliters (mL) of room temperature water and
      pull the plunger back to the 3 mL mark. For 2 tablets: place the 2 tablets in
      the oral syringe. Add 5 mL of room temperature water. Replace the cap on the
      syringe and let it sit for at least 15 minutes for 2 milligrams (mg) tablets
      and at least 60 minutes for 5 mg or 10 mg tablets. Turn the syringe up and down
      for at least 30 seconds. Check the mixture in the syringe. The tablet should
      have broken down into small pieces and are evenly spread in the water (suspension).
      Do not take the suspension if there are any large pieces of tablet in it or
      if there are any tablet pieces that are not evenly spread through the water.
      If the tablet is not fully dissolved, let it sit for another 10 minutes. Then,
      turn the syringe up and down for at least 30 seconds. Place the tip of the syringe
      in the mouth. If you are giving it to a child, place the tip of the syringe
      along the inner cheek of the child''s mouth. Slowly push the plunger down until
      a small amount of air is left in the syringe, between the plunger and the tip.
      Do not press the plunger all the way down to the end of the syringe. Draw up
      an additional 2 mL of water into the syringe. Replace the cap on the syringe.
      Shake well to spread the remaining tablet pieces evenly through the water. If
      particles are still present, repeat this step one more time.'
  - type: list
    ordered: false
    items:
    - 'To prepare for an applesauce mixture: Wash your hands well before preparing
      the medicine. Measure about 1 teaspoon of applesauce and put it into a clean
      container (eg, glass or bowl). Place the tablet onto a spoon. Crush one tablet
      at a time between 2 spoons until the tablet is crushed to a fine powder. Carefully
