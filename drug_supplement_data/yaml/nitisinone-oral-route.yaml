    - Replace the cap on the syringe and let it sit for at least 15 minutes for 2
      milligrams (mg) tablets and at least 60 minutes for 5 mg or 10 mg tablets.
    - Turn the syringe up and down for at least 30 seconds.
    - Check the mixture in the syringe. The tablet should have broken down into small
      pieces and are evenly spread in the water (suspension). Do not take the suspension
      if there are any large pieces of tablet in it or if there are any tablet pieces
      that are not evenly spread through the water.
    - If the tablet is not fully dissolved, let it sit for another 10 minutes. Then,
      turn the syringe up and down for at least 30 seconds.
    - Place the tip of the syringe in the mouth. If you are giving it to a child,
