    - Slowly push the plunger down until a small amount of air is left in the syringe,
      between the plunger and the tip. Do not press the plunger all the way down to
      the end of the syringe.
    - Draw up an additional 2 mL of water into the syringe. Replace the cap on the
      syringe. Shake well to spread the remaining tablet pieces evenly through the
      water. If particles are still present, repeat this step one more time.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For hereditary tyrosinemia type 1: For oral dosage forms (capsules or suspension):
        Adults—Dose is based on body weight and must be determined by your doctor.
        The starting dose is usually 0.5 milligram (mg) per kilogram (kg) of body
        weight 2 times a day. Your doctor may adjust the dose as needed. However,
        the dose is usually not more than 1 or 2 mg per kg of body weight per day.
        Children—Dose is based on body weight and must be determined by your doctor.
        The starting dose is usually 0.5 mg per kg of body weight 2 times a day. Your
        doctor may adjust the dose as needed. However, the dose is usually not more
        than 1 or 2 mg per kg of body weight per day. For oral dosage form (tablets):
        Adults and children—Dose is based on body weight and must be determined by
        your doctor. The starting dose is usually 0.5 milligrams per kilogram (mg/kg)
        of body weight 2 times a day. Your doctor may adjust the dose as needed. However,
        the dose is usually not more than 1 to 2 mg/kg of body weight 2 times a day.'
      - 'For urine homogentisic acid (HGA): For oral dosage form (tablets): Adults—2
        milligrams (mg) once a day. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules or suspension): Adults—Dose is based on body
        weight and must be determined by your doctor. The starting dose is usually
        0.5 milligram (mg) per kilogram (kg) of body weight 2 times a day. Your doctor
        may adjust the dose as needed. However, the dose is usually not more than
        1 or 2 mg per kg of body weight per day. Children—Dose is based on body weight
        and must be determined by your doctor. The starting dose is usually 0.5 mg
        per kg of body weight 2 times a day. Your doctor may adjust the dose as needed.
        However, the dose is usually not more than 1 or 2 mg per kg of body weight
        per day.'
      - 'For oral dosage form (tablets): Adults and children—Dose is based on body
