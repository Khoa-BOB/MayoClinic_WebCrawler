title: Eltrombopag (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Alvaiz
    - type: paragraph
      text: Promacta
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Eltrombopag is used to treat thrombocytopenia (low platelets in the blood)
      in patients with a blood disorder called chronic immune thrombocytopenia (ITP).
      This medicine is used after a splenectomy (surgery to remove the spleen) and
      other medicines (eg, steroids or immunoglobulin) have not worked well enough.
      Eltrombopag is also used to treat thrombocytopenia in patients with chronic
      hepatitis C, along with interferon treatment. Platelets help clot the blood,
      so a person with thrombocytopenia may have bleeding problems. Eltrombopag works
      by stimulating the bone marrow to produce more platelets.
  - type: paragraph
    text: Eltrombopag is used together with standard immunosuppressive treatment for
      the first-line treatment of severe aplastic anemia (SAA) in adults and children
      2 years of age and older. It is also used to treat SAA in patients who have
      received other medicines that did not work well.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: 'Alvaiz™: Appropriate studies have not been performed on the relationship
        of age to the effects of eltrombopag for the treatment of ITP in children
        younger than 6 years of age and for the treatment of chronic hepatitis C and
        severe aplastic anemia in children. Safety and efficacy have not been established.'
    - type: paragraph
      text: 'Promacta®: Safety and efficacy have not been established to treat ITP
        in children younger than 1 year of age, or in children with thrombocytopenia
        associated with chronic hepatitis C or severe aplastic anemia.'
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of eltrombopag in the elderly. However,
        elderly patients are more likely to have age-related liver problems, which
        may require caution and an adjustment in the dose for patients receiving eltrombopag.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Elagolix
      - Grazoprevir
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alpelisib
      - Aluminum Carbonate, Basic
      - Aluminum Hydroxide
      - Aluminum Phosphate
      - Atogepant
      - Atorvastatin
      - Atrasentan
      - Axitinib
      - Bosentan
      - Calcium Carbonate
      - Calcium Silicate
      - Cerivastatin
      - Dihydroxyaluminum Aminoacetate
      - Dihydroxyaluminum Sodium Carbonate
      - Docetaxel
      - Eluxadoline
      - Exemestane
      - Ezetimibe
      - Fexofenadine
      - Fluvastatin
      - Glecaprevir
      - Glyburide
      - Imatinib
      - Irinotecan
      - Iron
      - Lapatinib
      - Letermovir
      - Lovastatin
      - Magaldrate
      - Magnesium Carbonate
      - Magnesium Hydroxide
      - Magnesium Oxide
      - Magnesium Peroxide
      - Magnesium Trisilicate
      - Methotrexate
      - Mitoxantrone
      - Momelotinib
      - Nateglinide
      - Olmesartan
      - Paclitaxel
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Lopinavir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Calcium Rich Food
      - Dairy Food
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Antiphospholipid syndrome or
      - ATIII deficiency or
      - Factor V Leiden (blood clotting disorder) or
      - Liver disease, severe—Use with caution. May increase risk for blood clotting
        problems (eg, thromboembolism).
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Bone marrow problems (eg, myelodysplastic syndrome) or
      - Blood clots, history of or
      - Cataracts, history of or
      - Liver disease (including cirrhosis) or
      - Surgery (eg, splenectomy)—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Tell your doctor if you have Asian relatives, such as Filipino, Chinese,
      Japanese, Korean, or Taiwanese. You may need a lower dose of this medicine.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Take this medicine without a meal or with a meal low in calcium (50 milligrams
      or less).
  - type: paragraph
    text: If you are taking antacids, multivitamins that contain aluminum, calcium,
      iron, magnesium, selenium, or zinc, or other products high in calcium (more
      than 50 milligrams of calcium including dairy products, juices, and certain
      fruits and vegetables), take these at least 4 hours before or 2 hours after
      eltrombopag .
  - type: paragraph
    text: Swallow the tablet whole. Do not crush, break, or chew it. Do not mix it
      with food or liquids.
  - type: paragraph
    text: 'If you are using the oral suspension :'
  - type: list
    ordered: false
    items:
    - Mix the powder with cold water only. Do not use hot water to mix it.
    - After mixing, take it within 30 minutes. If it comes in contact with your skin,
      wash it right away with soap and water.
    - Use the dosing syringe that comes with the package. The average household teaspoon
      may not hold the right amount of liquid.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For first-line treatment of severe aplastic anemia: For oral dosage forms
        (Promacta® suspension or tablets): Adults and children 12 years of age and
        older—At first, 150 milligrams (mg) once a day for 6 months. Some patients
        may start at a lower dose. Your doctor may adjust your dose as needed. Children
        6 to 11 years of age—At first, 75 mg once a day for 6 months. Some patients
        may start at a lower dose. Your doctor may adjust your dose as needed. Children
        2 to 5 years of age—Dose is based on weight and must be determined by your
        doctor. At first, 2.5 milligram per kilogram (mg/kg) of body weight once a
        day for 6 months. Some patients may start at a lower dose. Your doctor may
        adjust your dose as needed. Children younger than 2 years of age—Use and dose
        must be determined by your doctor.'
      - 'For refractory severe aplastic anemia: For oral dosage forms (Promacta® suspension
        or tablets): Adults—At first, 50 milligrams (mg) once a day. Some patients
        may start at a lower dose. Your doctor may adjust your dose as needed. However,
        the dose is usually not more than 150 mg per day. Children—Use and dose must
        be determined by your doctor. For oral dosage form (Alvaiz™ tablets): Adults—At
        first, 36 milligrams (mg) once a day. Some patients may start at a lower dose.
        Your doctor may adjust your dose as needed. However, the dose is usually not
        more than 108 mg per day. Children—Use and dose must be determined by your
        doctor.'
      - 'For thrombocytopenia with ITP: For oral dosage forms (Promacta® suspension
        or tablets): Adults and children 6 years of age and older—At first, 50 milligrams
        (mg) once a day. Some patients may start at a lower dose. Your doctor may
        adjust your dose as needed. However, the dose is usually not more than 75
        mg per day. Children 1 to 5 years of age—At first, 25 milligrams (mg) once
        a day. Your doctor may adjust your dose as needed. However, the dose is usually
        not more than 75 mg per day. Children younger than 1 year of age—Use and dose
        must be determined by your doctor. For oral dosage form (Alvaiz™ tablets):
        Adults and children 6 years of age and older—At first, 36 milligrams (mg)
        once a day. Some patients may start at a lower dose. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 54 mg per
        day. Children younger than 6 years of age—Use and dose must be determined
        by your doctor.'
      - 'For thrombocytopenia with chronic hepatitis C: For oral dosage forms (Promacta®
        suspension or tablets): Adults—At first, 25 milligrams (mg) once a day. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than 100 mg per day. Children—Use and dose must be determined by your doctor.
        For oral dosage form (Alvaiz™ tablets): Adults—At first, 18 milligrams (mg)
        once a day. Your doctor may adjust your dose as needed. However, the dose
        is usually not more than 72 mg per day. Children—Use and dose must be determined
        by your doctor.'
