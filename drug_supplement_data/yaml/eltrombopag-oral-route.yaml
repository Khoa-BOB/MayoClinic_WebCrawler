    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away any unused liquid within 30 minutes of mixing it.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood and
      urine tests will be needed while you are using this medicine.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant during treatment
      with this medicine and for at least 7 days after the last dose. If you think
      you have become pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: Eltrombopag may cause or increase the risk for serious liver problems. Check
      with your doctor right away if you or your child start having nausea or vomiting,
      dark urine, light-colored stools, right upper stomach pain, unusual tiredness,
      or yellow eyes or skin while using this medicine.
  - type: paragraph
    text: This medicine may increased risk for blood or bone marrow problems (eg,
      myelodysplastic syndrome, acute myeloid leukemia). Check with your doctor right
      away if you have chest pain, chills, cough or hoarseness, fever, lower back
      or side pain, painful or difficult urination, sores, ulcers, or white spots
      on the lips or in the mouth, swollen glands, unusual bleeding or bruising, or
      unusual tiredness or weakness.
  - type: paragraph
    text: Blood clotting problems may occur while you or your child are using this
      medicine. Check with your doctor right away if you or your child have pain,
      swelling, or tenderness in your leg, or pain in your chest.
  - type: paragraph
    text: Do not stop using this medicine without checking first with your doctor
      . Your doctor will check your platelet levels and progress before you stop using
      the medicine.
  - type: paragraph
    text: This medicine may cause cataracts or make them worse. Check with your doctor
      right away if you or your child have blurred vision, difficulty in reading,
      or any other change in vision while using this medicine. Your doctor may want
      your eyes be checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect certain medical test results (eg, bilirubin,
      creatinine).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - body aches or pain
      - chills
      - cough
      - difficulty with breathing
      - fever
      - headache
      - loss of voice
      - pain in the chest, groin, or legs, especially the calves
      - pale skin
      - rapid weight gain
      - runny nose
      - severe, sudden headache
      - slurred speech
      - sore throat
      - sudden loss of coordination
      - sudden, severe weakness or numbness in the arm or leg
      - tingling of the hands or feet
      - trouble breathing with exertion
      - unusual tiredness or weakness
      - unusual weight gain or loss
      - yellow eyes or skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - blindness
      - blurred or decreased vision
      - bruising
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - diarrhea
      - general feeling of discomfort or illness
      - hoarseness
      - joint pain
      - lower back or side pain
      - muscle aches and pains
      - nausea
      - pinpoint red spots on the skin
      - redness of the eye
      - shivering
      - sweating
      - tender, swollen glands in the neck
      - trouble sleeping
      - trouble swallowing
      - voice changes
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bone pain
      - chest pain
      - lower back or side pain
      - painful or difficult urination
      - sores, ulcers, or white spots on the lips or in the mouth
      - swollen glands
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased appetite
      - difficulty with moving
      - hair loss or thinning of the hair
      - itching skin
      - lack or loss of strength
      - muscle cramps or stiffness
      - swollen joints
    subsections: []
  - heading: Less common
    level: 3
