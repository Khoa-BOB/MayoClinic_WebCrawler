title: Doxepin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Silenor
    - type: paragraph
      text: SINEquan
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Doxepin is used to treat major depressive disorder (MDD). It is also used
      to treat insomnia (trouble with sleeping).
  - type: paragraph
    text: Doxepin is a tricyclic antidepressant (TCA). It works on the central nervous
      system (CNS) to increase levels of certain chemicals in the brain.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Capsule
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of doxepin capsules and solution for the treatment of depression
        and anxiety in the pediatric population. Safety and efficacy have not been
        established. Use is not recommended in children.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of doxepin tablets for the treatment of insomnia in the pediatric
        population. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of doxepin in the elderly. However,
        elderly patients are more likely to have unwanted effects (eg, confusion or
        unusual drowsiness) or age-related heart, liver, or kidney problems, which
        may require caution and an adjustment in the dose for patients receiving doxepin.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Bromopride
      - Cisapride
      - Dronedarone
      - Grepafloxacin
      - Isocarboxazid
      - Levoketoconazole
      - Levomethadyl
