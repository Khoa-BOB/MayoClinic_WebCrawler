    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol use disorder, history of or
      - Bipolar disorder (mood disorder with mania and depression), or risk of or
      - Breathing problems or
      - Glaucoma, angle-closure or history of or
      - Psychosis (mental illness) or
      - Seizures, history of or
      - Sleep apnea (breathing stops during sleeping), severe—Use with caution. May
        make these conditions worse.
    - type: list
      ordered: false
      items:
      - Glaucoma or
      - Urinary retention (trouble urinating), severe—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor to benefit your condition
      as much as possible. Do not take more of it, do not take it more often, and
      do not take it for a longer time than your doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: If you are using the Sinequan® oral liquid or capsule once a day, you may
      take it at bedtime.
  - type: paragraph
    text: 'To use the Sinequan® oral liquid :'
  - type: list
    ordered: false
    items:
    - Measure the dose with the calibrated dropper that comes with the medicine.
    - Mix each dose with 120 milliliters (mL) or 4 ounces of water, whole or skimmed
      milk, orange juice, grapefruit juice, tomato juice, prune juice, or pineapple
      juice. Do not mix it with any other liquids. Swallow the mixture right away
      after mixing.
  - type: paragraph
    text: 'To use the Silenor® tablet :'
  - type: list
    ordered: false
    items:
    - Do not take this medicine within 3 hours of a meal. It may not work as well,
      or it might make you sleepy the next day if you take it with or right after
      a meal.
    - Take the tablet 30 minutes before going to bed, when you are ready to go to
      sleep.
    - Do not take the medicine unless you can get a full night's sleep (7 to 8 hours).
      If you wake up too soon, you may feel drowsy from the medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules or solution): For depression: Adults—25 milligrams
        (mg) 3 times a day or 75 mg once a day. Your doctor may adjust your dose as
        needed. However, the dose is usually not more than 100 mg 3 times a day. Children—Use
        is not recommended.'
      - 'For oral dosage form (tablets): For insomnia: Adults—6 milligrams (mg) once
        a day. Older adults—At first, 3 mg once a day. Your doctor may adjust your
        dose as needed. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For depression: Adults—25 milligrams (mg) 3 times a day or 75 mg once a day.
        Your doctor may adjust your dose as needed. However, the dose is usually not
        more than 100 mg 3 times a day. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—25 milligrams (mg) 3 times a day or 75 mg once a day. Your doctor may
        adjust your dose as needed. However, the dose is usually not more than 100
        mg 3 times a day.
      - Children—Use is not recommended.
    - type: list
      ordered: false
      items:
      - 'For insomnia: Adults—6 milligrams (mg) once a day. Older adults—At first,
        3 mg once a day. Your doctor may adjust your dose as needed. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—6 milligrams (mg) once a day.
      - Older adults—At first, 3 mg once a day. Your doctor may adjust your dose as
        needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to allow your doctor to see if the medicine is working properly and to decide
      if you should continue to take it. Blood tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: Tell your doctor if you are pregnant or planning to become pregnant. This
      medicine may cause unwanted effects (eg, feeding problems, low muscle tone,
      sluggishness, trouble breathing, withdrawal symptoms) to newborn babies if used
      during the later part of pregnancy. Tell your doctor right away if you think
      you have become pregnant.
  - type: paragraph
    text: This medicine may cause some people to be agitated, irritable, or display
      other abnormal behaviors. Report any unusual thoughts or behaviors that trouble
      you, especially if they are new or are getting worse quickly. Make sure your
      doctor knows if you have trouble sleeping, get upset easily, have a big increase
      in energy, or start to act reckless. Also tell your doctor if you have sudden
      or strong feelings, such as feeling nervous, angry, restless, violent, or scared.
      Let your doctor know if you or anyone in your family has bipolar disorder (manic-depressive
      illness) or has attempted suicide.
  - type: paragraph
    text: Do not take doxepin if you have taken a monoamine oxidase (MAO) inhibitor
      (eg, isocarboxazid [Marplan®], linezolid [Zyvox®], methylene blue injection,
      phenelzine [Nardil®], selegiline [Eldepryl®], or tranylcypromine [Parnate®])
      in the past 2 weeks. If you do, you may have confusion, agitation, restlessness,
      stomach or intestinal symptoms, a sudden high body temperature, an extremely
      high blood pressure, or seizures.
  - type: paragraph
    text: Do not stop taking this medicine without first checking with your doctor
      . Your doctor may want you to gradually reduce the amount you are using before
      stopping it completely. This may help prevent a possible worsening of your condition
      and reduce the possibility of withdrawal symptoms, such as headache, nausea,
      or a general feeling of discomfort or illness.
  - type: paragraph
    text: Doxepin may cause a serious condition called serotonin syndrome if taken
      together with some medicines. Do not use doxepin with buspirone (Buspar®), lithium
      (Eskalith®, Lithobid®), tryptophan, St. John's wort, other medicines for depression
      (eg, SNRIs, SSRIs, tetracyclic antidepressants, other TCAs), narcotic pain medicine,
      or triptan medicine for migraine headaches. Check with your doctor first before
      taking any other medicines with doxepin .
  - type: paragraph
    text: Silenor® tablets may cause sleep-related behaviors such as driving a car
      (sleep-driving), walking (sleep-walking), having sex, making phone calls, or
      preparing and eating food while asleep or not fully awake. If any of these reactions
      occur, tell your doctor right away.
  - type: paragraph
    text: If you think you need to take Silenor® tablets for 7 to 10 days, talk to
      your doctor.
  - type: paragraph
    text: This medicine may cause some people to become drowsy. Make sure you know
      how you react to this medicine before you drive, use medicines, or do anything
      else that could be dangerous if you are drowsy or not alert .
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that slow down the nervous system, possibly causing drowsiness).
      Some examples of CNS depressants are antihistamines or medicine for hay fever,
      allergies, or colds, sedatives, tranquilizers, or sleeping medicine, prescription
      pain medicine or narcotics, medicine for seizures or barbiturates, muscle relaxants,
      or anesthetics, including some dental anesthetics. This effect may last for
      a few days after you stop taking this medicine. Check with your doctor before
      taking any of the above while you or your child are using this medicine .
  - type: paragraph
    text: Talk with your doctor before using this medicine if you plan to have children.
      Some men and women who use this medicine have become infertile (unable to have
      children).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines)
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
