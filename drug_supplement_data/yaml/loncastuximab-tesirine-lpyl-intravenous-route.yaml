title: Loncastuximab tesirine-lpyl (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Zynlonta
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Loncastuximab tesirine-lpyl injection is to treat large B-cell lymphoma
      (including diffuse large B-cell lymphoma [DLBCL], high grade B-cell lymphoma,
      or DLBCL from low grade lymphoma) that has come back or did not respond to previous
      treatment in patients who have received 2 or more other medicines did not work
      well. Lymphoma is a type of cancer where the body makes abnormal white blood
      cells.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of loncastuximab tesirine-lpy injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of loncastuximab tesirine-lpy injection
        in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Edema (swelling) or
      - Fluid retention (eg, pleural effusion, pericardial effusion)—Use with caution.
        May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Infection (eg, pneumonia, sepsis)—May decrease your body's ability to fight
        an infection.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Before receiving this medicine, make sure you understand all the risks and
      benefits. It is important for you to work closely with your doctor during your
      treatment.
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins. It must be given slowly, so the needle will have to stay in place for
      at least 30 minutes. It is usually given every 3 weeks.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have questions.
  - type: paragraph
    text: You may receive other medicines (eg, dexamethasone) before starting treatment
      with this medicine.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you are a woman who can get pregnant, your doctor may do tests to make sure
      you are not pregnant before starting this medicine. Women should use an effective
      form of birth control to avoid pregnancy during treatment and for at least 9
      months after the last dose. Men should use an effective form of birth control
      to avoid pregnancy in sexual partners during treatment and for at least 6 months
      after the last dose. If you think a pregnancy has occurred with the medicine,
      tell your doctor right away.
  - type: paragraph
    text: Talk with your doctor before using this medicine if you plan to have children.
      Some men who use this medicine have become infertile (unable to have children).
  - type: paragraph
    text: This medicine may cause fluid retention (eg, pleural effusion, pericardial
      effusion). Check with your doctor right away if you have chest pain or discomfort,
      swelling in the stomach and bloating, or trouble breathing while using this
      medicine.
  - type: paragraph
    text: This medicine lowers the number of some types of blood cells in your body.
      Because of this, you may bleed or get infections more easily. To help with these
      problems, avoid being near people who are sick or have infections. Wash your
      hands often. Stay away from rough sports or other situations where you could
      be bruised, cut, or injured. Brush and floss your teeth gently. Be careful when
      using sharp objects, including razors and fingernail clippers.
  - type: paragraph
    text: Check with your doctor right away if you have an increased sensitivity of
      the skin to sunlight, itching, rash with flat lesions or small raised lesions
      on the skin, redness or other discoloration of the skin, severe sunburn, or
      unusually warm skin. These may be symptoms of serious skin reactions (eg, photosensitivity
      reaction, exfoliative rash, maculopapular rash, and erythema). Use a sunscreen
      when you are outdoors. Avoid sunlamps and tanning beds.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - body aches or pain
      - chills
      - cough
      - ear congestion
      - fever
      - headache
      - increased sensitivity of the skin to sunlight
      - itching, skin rash
      - loss of voice
      - lower back or side pain
      - muscle or bone pain
      - pain or tenderness around the eyes and cheekbones
      - painful or difficult urination
      - pale skin
      - pinpoint red spots on the skin
      - redness or other discoloration of the skin
      - severe sunburn
      - sore throat
      - stuffy or runny nose
      - swelling of the hands, ankles, feet, or lower legs
      - swelling or puffiness of the face
      - tightness in the chest
      - trouble breathing
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blistering, crusting, irritation, itching, or reddening of the skin
      - blue or pale skin
      - chest pain, possibly moving to the left arm, neck, or shoulder
      - confusion
      - cracked, dry, scaly skin
      - darkening of the skin
      - dizziness
      - dry cough
      - fainting
      - fast heartbeat
      - general feeling of discomfort or illness
      - lightheadedness
      - rapid, shallow breathing
      - sneezing
      - thickening of bronchial secretions
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - constipation
      - decreased appetite
      - diarrhea
      - difficulty in moving
      - joint pain
      - lack or loss of strength
      - muscle aches, cramps, or stiffness
      - nausea
      - stomach pain
      - swollen joints
      - unusual drowsiness, dullness, or feeling of sluggishness
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
