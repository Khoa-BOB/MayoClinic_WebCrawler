title: Adenosine (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Adenocard
    - type: paragraph
      text: Adenoscan
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Adenosine injection is used in combination with Thallium-201 as a pharmacologic
      stress agent for myocardial perfusion scintigraphy in patients unable to undergo
      adequate exercise stress. This medicine works by dilating the arteries of the
      heart and increase blood flow to help identify coronary artery disease.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of adenosine injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of adenosine injection in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aminophylline
      - Carbamazepine
      - Cobicistat
      - Darunavir
      - Dimenhydrinate
      - Dyphylline
      - Epinephrine
      - Inotersen
      - Pentoxifylline
      - Taletrectinib
      - Theophylline
      - Verapamil
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Dipyridamole
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina, unstable or
      - Unstable heart or blood vessel problem (eg, cardiovascular instability)—Avoid
        use, as this medicine may increase the risk for heart attack.
    - type: list
      ordered: false
      items:
      - Atrial fibrillation (heart rhythm problem), or history of or
      - Breathing problems or lung disease (eg, bronchitis, emphysema) or
      - Hypertension (high blood pressure) or
      - Hypotension (low blood pressure) or
      - Seizures or
      - Stroke, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Heart block, second or third degree (type of abnormal heart rhythm), without
        a pacemaker or
      - Sinus node disease (such as sick sinus syndrome), without a pacemaker—Should
        not be used in patients with these conditions, unless patients have a pacemaker
        that works.
    - type: list
      ordered: false
      items:
      - Breathing problems or lung disease (eg, asthma)—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease (eg, coronary artery stenosis, ischemia, pericardial
        effusion, pericarditis) or
      - Heart valve disease or
      - Hypovolemia (low blood volume), uncorrected—May increase risk for more serious
        side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given through a needle placed into one of your veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress very closely while
      you are receiving this medicine. This will allow your doctor to see if the medicine
      is working properly and to decide if you should continue to receive it.
  - type: paragraph
    text: Heart attack and death may occur after receiving this medicine. Make sure
      your doctor knows if you have any heart problems (eg, unstable angina or cardiovascular
      instability) before you have a heart stress test. Check with your doctor right
      away if you have chest pain or discomfort, nausea, pain or discomfort in arms,
      jaw, back or neck, sweating, or vomiting.
  - type: paragraph
    text: Do not take anything that contains caffeine before you receive this medicine.
      This includes medicines, foods, and beverages with caffeine, such as coffee,
      tea, and cola drinks.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest discomfort
      - difficult or labored breathing
      - lightheadedness or dizziness
      - throat, neck, or jaw discomfort
      - tightness in the chest
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fainting
      - fast, slow, or irregular heartbeat
      - sweating
      - troubled breathing
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fast, irregular, pounding, or racing heartbeat or pulse
      - headache
      - nervousness
      - pounding in the ears
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - feeling of warmth
      - indigestion
      - loss of appetite
      - nausea or vomiting
      - passing of gas
      - redness of the face, neck, arms, and occasionally, upper chest
      - stomach pain, fullness, or discomfort
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Area of decreased vision
      - cough
      - discomfort in the back, ears, or tongue
      - drowsiness
      - dry mouth
      - metallic taste
      - mood changes
      - shakiness in the legs, arms, hands, or feet
      - stuffy nose
      - trembling or shaking of the hands or feet
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
