    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol use disorder, history of or
      - Cholelithiasis (gallstones), history of or
      - Pancreatitis (swelling of the pancreas), history of—May increase risk for
        pancreatitis.
    - type: list
      ordered: false
      items:
      - Gastroparesis (stomach does not empty food normally), severe—Should not be
        used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Surgery or other procedures that use anesthesia or deep sedation—May increase
        risk of pulmonary aspiration (food or liquid getting into the lungs) during
        surgery or other procedures.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: When you start using this medicine, it is very important that you check
      your blood sugar often, especially before and after meals and at bedtime. This
      will help lower the chance of having very low blood sugar.
  - type: paragraph
    text: This medicine should come with a Medication Guide and patient instructions.
      Read and follow these instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: This medicine is usually given within 1 hour before the first meal of the
      day.
  - type: paragraph
    text: Carefully follow the special meal plan your doctor gave you . This is the
      most important part of controlling your diabetes, and is necessary if the medicine
      is to work properly. Also, exercise regularly and test for sugar in your blood
      or urine as directed.
  - type: paragraph
    text: You will be using lixisenatide at home. Your doctor will teach you how the
      injections are to be given. Be sure you understand exactly how the medicine
      is to be injected.
  - type: paragraph
    text: This medicine is given as a shot under the skin of your stomach, thighs,
      or upper arm. Use a different body area each time you give yourself a shot.
      Keep track of where you give each shot to make sure you rotate body areas.
  - type: paragraph
    text: Allow the medicine to warm at room temperature before you inject it. Check
      the liquid in the pen. it should be clear and colorless to slightly yellow.
      Do not use it if it is discolored or has particles in it.
  - type: paragraph
    text: This medicine also works best when there is a constant amount in the blood.
      To help keep the amount constant, do not miss any doses. Also, it is best to
      use the doses at the same time each day.
  - type: paragraph
    text: Use a new needle each time you inject your medicine.
  - type: paragraph
    text: Never share medicine pens with others under any circumstances . It is not
      safe for one pen to be used for more than one person. Sharing needles or pens
      can result in transmission of infection.
  - type: paragraph
    text: Take acetaminophen or antibiotics at least 1 hour before you inject this
      medicine.
  - type: paragraph
    text: Take birth control pills at least 1 hour before or 11 hours after you inject
      lixisenatide.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: For type 2 diabetes: Adults—At first, 10 micrograms
        (mcg) injected under the skin once a day for 14 days. Your doctor may increase
        your dose to 20 mcg once a day starting on Day 15 and until your blood sugar
        is controlled. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For type 2 diabetes: Adults—At first, 10 micrograms (mcg) injected under
        the skin once a day for 14 days. Your doctor may increase your dose to 20
        mcg once a day starting on Day 15 and until your blood sugar is controlled.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 10 micrograms (mcg) injected under the skin once a day for
        14 days. Your doctor may increase your dose to 20 mcg once a day starting
        on Day 15 and until your blood sugar is controlled.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose of this medicine, use it within 1 hour before your
        next meal.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store your new, unused prefilled pen in the refrigerator, in the original
        carton, and protect it from light. Do not freeze this medicine, and do not
        use the medicine if it has been frozen. You may store the opened prefilled
        pen in the refrigerator, or at room temperature for up to 14 days.
    - type: paragraph
      text: Throw away used needles in a hard, closed container that the needles cannot
        poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: 'It is very important to carefully follow any instructions from your health
      care team about:'
  - type: list
    ordered: false
    items:
    - Alcohol—Drinking alcohol may cause severe low blood sugar. Discuss this with
      your health care team.
    - Other medicines—Do not take other medicines during the time you are using lixisenatide
      unless they have been discussed with your doctor. This especially includes nonprescription
      medicines such as aspirin, and medicines for appetite control, asthma, colds,
      cough, hay fever, or sinus problems.
    - Counseling—Other family members need to learn how to prevent side effects or
      help with side effects if they occur. Also, diabetic patients may need special
      counseling about diabetes medicine dosing changes that might occur because of
      lifestyle changes, such as changes in exercise and diet. Furthermore, counseling
      on contraception and pregnancy may be needed because of the problems that can
      occur during pregnancy in patients with diabetes.
    - Travel—Keep a recent prescription and your medical history with you. Be prepared
      for an emergency as you would normally. Make allowances for changing time zones
      and keep your meal times as close as possible to your usual meal times.
    - In case of emergency—There may be a time when you need emergency help for a
      problem caused by your diabetes. You need to be prepared for these emergencies.
      It is a good idea to wear a medical identification (ID) bracelet or neck chain
      at all times. Also, carry an ID card in your wallet or purse that says that
      you have diabetes and a list of all of your medicines.
  - type: paragraph
    text: Pancreatitis (swelling of the pancreas) may occur while you are using this
      medicine. Tell your doctor right away if you have sudden and severe stomach
      pain, chills, constipation, nausea, vomiting, fever, or lightheadedness.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Check
      with your doctor right away if you have a rash, itching, hoarseness, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, mouth, or
      throat while you are using this medicine.
  - type: paragraph
    text: This medicine does not cause hypoglycemia (low blood sugar). However, low
      blood sugar can occur when you use lixisenatide with other medicines that can
      lower blood sugar, such as insulin, metformin, or a sulfonylurea. Low blood
      sugar also can occur if you delay or miss a meal or snack, exercise more than
      usual, drink alcohol, or cannot eat because of nausea or vomiting.
  - type: list
    ordered: false
    items:
    - Symptoms of low blood sugar include anxiety, behavior change similar to being
      drunk, blurred vision, cold sweats, confusion, cool, pale skin, difficulty with
      thinking, drowsiness, excessive hunger, a fast heartbeat, headache (continuing),
      nausea, nervousness, nightmares, restless sleep, shakiness, slurred speech,
      or unusual tiredness or weakness.
    - If symptoms of low blood sugar occur, eat glucose tablets or gel, corn syrup,
      honey, or sugar cubes, or drink fruit juice, non-diet soft drink, or sugar dissolved
      in water to relieve the symptoms. Also, check your blood for low blood sugar.
      Glucagon is used in emergency situations when severe symptoms such as seizures
      (convulsions) or unconsciousness occur. Have a glucagon kit available, along
      with a syringe and needle, and know how to use it. Members of your family also
      should know how to use it.
  - type: paragraph
    text: Hyperglycemia (high blood sugar) may occur if you do not take enough or
      skip a dose of your antidiabetic medicine, overeat or do not follow your meal
      plan, have a fever or infection, or do not exercise as much as usual.
  - type: list
    ordered: false
    items:
    - Symptoms of high blood sugar include blurred vision, drowsiness, dry mouth,
      flushed, dry skin, fruit-like breath odor, increased urination (frequency and
      amount), ketones in the urine, loss of appetite, stomachache, nausea, or vomiting,
      tiredness, trouble breathing (rapid and deep), unconsciousness, or unusual thirst.
    - If symptoms of high blood sugar occur, check your blood sugar level and then
      call your doctor for instructions.
  - type: paragraph
    text: Check with your doctor right away if you have confusion, decreased urination,
      diarrhea, dizziness, dry mouth, fainting, increase in heart rate, lightheadedness,
      nausea, vomiting, rapid breathing, sunken eyes, thirst, unusual tiredness or
      weakness, or wrinkled skin. These may be symptoms of dehydration which can lead
      to kidney problems.
  - type: paragraph
    text: This medicine may cause severe stomach and bowel problems. Check with your
      doctor right away if you have stomach problems that are severe or will not go
      away.
  - type: paragraph
    text: Check with your doctor right away if you have gaseous stomach pain, indigestion,
      recurrent fever, severe nausea or vomiting, stomach fullness, or yellow eyes
      or skin. These may be symptoms of gallbladder problems (eg, cholelithiasis,
      cholecystitis).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - bloating
      - bluish or pale skin
      - blurred vision
      - chest tightness
      - chills
      - cold sweats
      - confusion
      - constipation
      - cough
      - darkened urine
      - depression
      - difficulty swallowing
      - dizziness
      - fainting
      - fast heartbeat
      - fever
      - headache
      - hives, itching, redness, skin rash
      - increased hunger
      - indigestion
      - loss of appetite
      - nausea
      - nervousness
      - nightmares
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - seizures
      - shakiness
      - slurred speech
      - trouble breathing
      - unusual tiredness or weakness
      - vomiting
      - yellow eyes or skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - heartburn
      - stomach discomfort or upset
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - bloating
      - decreased urine output
      - dry mouth
      - fainting
      - gaseous stomach pain
      - hostility
      - increase in heart rate
      - irritability
      - lethargy
      - muscle twitching
      - rapid breathing
      - rapid weight gain
      - stomach pain or fullness
      - stupor
      - sunken eyes
      - swelling of the face, ankles, or hands
      - thirst
      - wrinkled skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - loss of appetite
      - nausea or vomiting
      - stomach pain, fullness, or discomfort
      - indigestion
      - passing of gas
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of skin, feeling of
        pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - pressure in the stomach
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - loss or thinning of the hair
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
