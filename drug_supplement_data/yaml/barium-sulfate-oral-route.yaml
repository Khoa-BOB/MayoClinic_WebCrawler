- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Barium sulfate is used to help diagnose or find problems in the esophagus,
      stomach, and bowels. It is a radiographic contrast agent. Contrast agents are
      used to create a clear picture of the different parts of the body.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
    - Cream
    - Powder for Suspension
    - Tablet
    - Paste
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a diagnostic test, any risks of the test must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      Also, other things may affect test results. For this test, the following should
      be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Entero VU™ 24% oral suspension is not indicated for use in children.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of E-Z-HD oral suspension in children
        12 years of age and older. However, safety and efficacy of this medicine have
        not been established in children younger than 12 years of age.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Varibar® Pudding oral paste in
        children 6 months of age and older. However, safety and efficacy of this medicine
        have not been established in children younger than 6 months of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of barium sulfate oral suspension
        or paste in the elderly. However, elderly patients are more likely to have
        kidney, liver, or heart problems, which may require caution and an adjustment
        in the dose for patients receiving this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this diagnostic
        test. Make sure you tell your doctor if you have any other medical problems,
        especially:'
    - type: list
      ordered: false
      items:
      - Allergy to other contrast agents, recent or
      - Asthma, hay fever, or other allergies, history of—May increase risk for allergic
        reaction to occur again.
    - type: list
      ordered: false
      items:
      - Appendicitis (inflammation of the appendix) or
      - Cancer or
      - Inflammatory bowel disease or
      - Stomach or bowel problems (eg, diverticulitis, fistula, stenosis, ulcer)—May
        cause barium to leak in the stomach in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Cystic fibrosis or
      - Dehydration or
      - Electrolyte imbalance or
      - Stomach or bowel problems (eg, Hirschsprung disease, severe stenosis)—May
        increase risk for more serious side effects.
    - type: list
      ordered: false
      items:
      - Fructose intolerance (genetic disease), history of—The oral suspension contains
        sorbitol, which can make this condition worse.
    - type: list
      ordered: false
      items:
      - Radiation treatment on the pelvis (hip area), recent or
      - Stomach or bowel blockage, known or suspected or
      - Stomach or bowel perforation, known or suspected or
      - Stomach or bowel problems (eg, bleeding, injury, ischemia, severe ileus, toxic
        megacolon) or
      - Stomach or bowel surgery or
      - Trouble swallowing—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you or your child
      this medicine in a hospital. This medicine is given by mouth. You will swallow
      the barium liquid or paste just before a CT scan or x-ray.
  - type: paragraph
    text: Your doctor may tell you not to eat or drink anything the night before your
      test. Barium will work better if your stomach and bowels are empty.
  - type: paragraph
    text: It is important to drink plenty of liquids during and after the test. Barium
      sulfate may cause severe constipation.
  - type: paragraph
    text: Barium sulfate is also available as an enema and given through the rectum.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your or your child's progress closely while you are
      receiving this medicine . This will allow your doctor to see if the medicine
      is working properly and to decide if you or your child should continue to receive
      it.
  - type: paragraph
    text: Serious allergic reactions may occur while you are receiving this medicine.
      Tell your doctor right away if you have a rash, itching, noisy breathing, trouble
      breathing, lightheadedness, dizziness, or fainting after receiving this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating
      - constipation (severe, continuing)
      - cramping (severe)
      - nausea or vomiting
      - stomach pain
      - tightness in the chest
      - trouble breathing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blood in the urine or stools
      - blurred vision
      - bruising
      - chest pain
      - confusion
      - cough
      - coughing or vomiting blood
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fainting
      - fast or slow heartbeat
      - hives or welts, itching, or skin rash
      - noisy breathing
      - persistent bleeding or oozing from puncture sites, mouth, or nose
      - redness of the skin
      - sweating
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation or diarrhea
      - cramping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
