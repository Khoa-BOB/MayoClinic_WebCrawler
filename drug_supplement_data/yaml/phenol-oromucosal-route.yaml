- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Phenol is used to relieve pain and irritation caused by sore throat, sore
      mouth, or canker sores.
  - type: paragraph
    text: This medicine is available as an over-the-counter (OTC) product.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Spray
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Chloraseptic® in children younger than 3 years of age and
        Ulcerease® in children younger than 4 months of age. Safety and efficacy have
        not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of phenol in geriatric patients.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine exactly as directed by your doctor . Do not use more of
      this medicine, do not use it more often, and do not use it for a longer time
      than directed. To do so may increase the chance of absorption into the body
      and the risk of side effects.
  - type: paragraph
    text: This medicine should be used only for problems being treated by your doctor
      or conditions listed in the package directions. Check with your doctor before
      using it for other problems, especially if you think an infection may be present
      .
  - type: paragraph
    text: 'To use the oral rinse or spray:'
  - type: list
    ordered: false
    items:
    - Gargle or spray to the affected area.
    - Let the medicine remain in place for at least 15 seconds, then spit it out.
  - type: paragraph
    text: Do not use this medicine for more than 2 days without checking first with
      your doctor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For sore throat and mouth pain: For oromucosal dosage form (spray): Adults
        and children 3 years of age and older—One spray to the affected area every
        2 hours or as directed by a doctor or dentist. Children younger than 12 years
        of age should be supervised while using this medicine. Children younger than
        3 years of age—Use and dose must be determined by your doctor. For oromucosal
        dosage form (suspension or oral rinse): Adults and children 12 years of age
        and older—Rinse the affected area every 2 hours or as needed. Do not use more
        than 12 times per day. Children 4 months to 12 years of age—Apply to the affected
        area with a swab 6 times a day or as directed by a doctor or dentist. Children
        younger than 4 months of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oromucosal dosage form (spray): Adults and children 3 years of age and
        older—One spray to the affected area every 2 hours or as directed by a doctor
        or dentist. Children younger than 12 years of age should be supervised while
        using this medicine. Children younger than 3 years of age—Use and dose must
        be determined by your doctor.'
      - 'For oromucosal dosage form (suspension or oral rinse): Adults and children
        12 years of age and older—Rinse the affected area every 2 hours or as needed.
        Do not use more than 12 times per day. Children 4 months to 12 years of age—Apply
        to the affected area with a swab 6 times a day or as directed by a doctor
        or dentist. Children younger than 4 months of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 3 years of age and older—One spray to the affected area
        every 2 hours or as directed by a doctor or dentist. Children younger than
        12 years of age should be supervised while using this medicine.
      - Children younger than 3 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—Rinse the affected area every
        2 hours or as needed. Do not use more than 12 times per day.
      - Children 4 months to 12 years of age—Apply to the affected area with a swab
        6 times a day or as directed by a doctor or dentist.
      - Children younger than 4 months of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your condition does not improve within 7 days, or if it becomes worse,
      check with your doctor.
  - type: paragraph
    text: Call your doctor right away if you start to have a severe sore throat or
      sore throat that occurs with a high fever, headache, nausea, or vomiting. These
      maybe signs of an infection.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with breathing
      - fever
      - headache
      - nausea
      - rash
      - swelling
      - vomiting
      - worsening of pain, redness, swelling, or irritation in or around the mouth
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
