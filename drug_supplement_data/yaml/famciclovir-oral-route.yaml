title: Famciclovir (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Famvir
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Famciclovir is used to treat the symptoms of herpes zoster (also known as
      shingles), a herpes virus infection of the skin. It is used to treat and suppress
      herpes labialis (cold sores) and recurrent episodes of genital herpes infection.
      This medicine is also used to treat recurrent herpes virus infections of the
      mucous membranes (lips and mouth) and genitals in HIV-infected patients. Although
      famciclovir will not cure genital herpes or herpes zoster, it does help relieve
      the pain and discomfort and helps the sores heal faster.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of famciclovir in children under 18 years of age. Safety and efficacy have
        not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of famciclovir in the elderly. However,
        elderly patients are more likely to have age-related kidney disease, which
        may require an adjustment of dose in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Galactose intolerance or
      - Glucose-galactose malabsorption or
      - Severe lactase deficiency—Should not use in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Famciclovir is best used within 48 hours after the symptoms of shingles
      (for example, pain, burning, blisters) begin to appear, or within 6 hours after
      the symptoms of recurrent genital herpes (for example, pain, blisters) begin
      to appear.
  - type: paragraph
    text: Famciclovir may be taken with or without food.
  - type: paragraph
    text: To help clear up your herpes infection, keep taking famciclovir for the
      full time of treatment, even if your symptoms begin to clear up after a few
      days. Do not miss any doses and do not use this medicine more often or for a
      longer time than your doctor ordered.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of shingles: Adults—500 milligrams
        (mg) every eight hours for seven days. Children—Use and dose must be determined
        by your doctor. For suppression of recurrent genital herpes: Adults—250 milligrams
        (mg) two times a day for up to one year. Children—Use and dose must be determined
        by your doctor. For treatment of recurrent genital herpes: Adults—1000 milligrams
        (mg) two times a day for one day. Children—Use and dose must be determined
        by your doctor. For treatment of recurrent herpes labialis (cold sores): Adults—1500
        milligrams (mg) as a single dose. Children—Use and dose must be determined
        by your doctor. For treatment of recurrent herpes infections in HIV-infected
        patients: Adults—500 milligrams (mg) two times a day for seven days. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of shingles: Adults—500 milligrams (mg) every eight hours for
        seven days. Children—Use and dose must be determined by your doctor.'
      - 'For suppression of recurrent genital herpes: Adults—250 milligrams (mg) two
        times a day for up to one year. Children—Use and dose must be determined by
        your doctor.'
      - 'For treatment of recurrent genital herpes: Adults—1000 milligrams (mg) two
        times a day for one day. Children—Use and dose must be determined by your
        doctor.'
      - 'For treatment of recurrent herpes labialis (cold sores): Adults—1500 milligrams
        (mg) as a single dose. Children—Use and dose must be determined by your doctor.'
      - 'For treatment of recurrent herpes infections in HIV-infected patients: Adults—500
        milligrams (mg) two times a day for seven days. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—500 milligrams (mg) every eight hours for seven days.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—250 milligrams (mg) two times a day for up to one year.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—1000 milligrams (mg) two times a day for one day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—1500 milligrams (mg) as a single dose.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—500 milligrams (mg) two times a day for seven days.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: The areas affected by herpes should be kept as clean and dry as possible.
      Also, wear loose-fitting clothing to avoid irritating the sores (blisters).
  - type: paragraph
    text: This medicine may cause some people to become dizzy, drowsy, or less alert
      than they are normally. If any of these side effects occur, do not drive, use
      machines, or do anything else that could be dangerous if you are dizzy or are
      not alert while you are taking famciclovir.
  - type: paragraph
    text: This medicine does not prevent the sexual transmission of genital herpes.
      You should avoid having sex when lesions are present to avoid infecting your
      partner.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blistering, peeling, or loosening of the skin
      - blood in urine or stools
      - chills
      - clay-colored stools
      - cough
      - dark urine
      - dizziness
      - fever
      - joint or muscle pain
      - loss of appetite
      - pinpoint red spots on the skin
      - red, irritated eyes
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - unpleasant breath odor
      - unusual bleeding or bruising
      - vomiting of blood
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cramps
      - diarrhea
      - headache
      - heavy bleeding
      - nausea
      - stomach pain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloated, full feeling
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feeling
      - confusion as to time, place, or person
      - excess air or gas in the stomach or intestines
      - hives or welts
      - holding false beliefs that cannot be changed by fact
      - itching skin
      - mood or mental changes
      - passing gas
      - rash
      - redness of skin
      - seeing, hearing, or feeling things that are not there
      - unusual excitement, nervousness, or restlessness
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sleepiness or unusual drowsiness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
