    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    - type: paragraph
      text: If you miss a dose of this medicine, use it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Keep the medicine in the original carton until you are ready to use it.
        You may also store this medicine at room temperature up to 30°C for up to
        5 days. Do not put it back in the refrigerator once stored at room temperature.
        Throw away any unused medicine after 5 days.
    - type: paragraph
      text: Throw away used needles in a hard, closed container that the needles cannot
        poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure that this medicine is working properly. Blood
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious infections (eg, bacteria, fungus, virus).
      Check with your doctor right away if you have chest tightness, stomach pain,
      fever, itching, pain or redness of the skin, indigestion, nausea, vomiting,
      chills, confusion, dizziness, fast heartbeat, bone pain, diarrhea, loss of appetite,
      weakness, bleeding in the eye, blurred vision, trouble breathing, sneezing,
      or cough.
  - type: paragraph
    text: You will need to have a skin test for tuberculosis before you or your child
      starts using this medicine. Tell your doctor if you or anyone in your home has
      ever had a positive reaction to a tuberculosis test or been exposed to tuberculosis.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including angioedema.
      This may be life-threatening and require immediate medical attention. Tell your
      doctor if you or your child have a rash, itching, or large, hive-like swelling
      on face, eyelids, lips, tongue, throat, hands, legs, feet, or sex organs.
  - type: paragraph
    text: This medicine may cause serious skin reactions, including atopic dermatitis-like
      eruptions, dyshidrotic eczema, erythroderma. Check with your doctor right away
      if you have blistering, crusting, irritation, itching, or reddening of the skin,
      cracked, dry, or scaly skin, skin rash, encrusted, scaly and oozing, swelling.
  - type: paragraph
    text: While you are being treated with ixekizumab, and after you stop treatment
      with it, do not have any immunizations (vaccines) without your doctor's approval.
      You should receive all your vaccines before starting treatment with this medicine.
      Ixekizumab may lower your body's resistance and the vaccine may not work as
      well, or you might get the infection the vaccine is meant to prevent. In addition,
      you should not be around other persons living in your household who receive
      live virus vaccines because there is a chance they could pass the virus on to
      you. Some examples of live vaccines include measles, mumps, influenza (nasal
      flu vaccine), poliovirus (oral form), rotavirus, and rubella. If you have questions
      about this, talk to your doctor.
  - type: paragraph
    text: Inflammatory bowel disease may occur or worsen while you are using this
      medicine. Tell your doctor right away if you or your child have rectal bleeding,
      severe abdominal or stomach pain, or severe diarrhea while using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - burning, dry, or itching eyes
      - chills
      - cough
      - difficulty with breathing
      - discharge or excessive tearing
      - ear congestion
      - fever
      - headache
      - hoarseness
      - itching in the genital or other skin areas
      - loss of voice
      - lower back or side pain
      - painful or difficult urination
      - redness, pain, or swelling of the eye, eyelid, or inner lining of the eyelid
      - runny or stuffy nose
      - scaling of the skin
      - sneezing
      - sore mouth or tongue
      - sore throat
      - unusual tiredness or weakness
      - white patches in the mouth or on the tongue
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - diarrhea
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - general feeling of discomfort or illness
      - hives, itching, skin rash
      - joint pain
      - loss of appetite
      - muscle aches and pains
      - nausea
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - shivering
      - sweating
      - trouble sleeping
      - vomiting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - rectal bleeding
      - redness of the skin
      - severe diarrhea
      - severe stomach pain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or discomfort
      - confusion
      - irritability
      - seizures
      - skin rash
      - stiff neck
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
