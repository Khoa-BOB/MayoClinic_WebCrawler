        of age—Use and dose must be determined by your doctor.'
      - 'For psoriatic arthritis: Adults—160 milligrams (two-80 mg) injected under
        your skin at Week 0, followed by 80 mg every 4 weeks. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—160 milligrams (two-80 mg) injected under your skin at Week 0, followed
        by 80 mg every 4 weeks.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—80 milligrams (mg) injected under your skin every 4 weeks.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—160 milligrams (two-80 mg) injected under your skin at Week 0, followed
        by 80 mg at Weeks 2, 4, 6, 8, 10, and 12, and then 80 mg every 4 weeks.
      - Children 6 years of age and older weighing more than 50 kilograms (kg)—Dose
