title: Ixekizumab (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Taltz
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ixekizumab injection is used to treat moderate-to-severe plaque psoriasis
      in patients who may benefit from receiving phototherapy (ultraviolet light treatment)
      or other treatments. This medicine is also used alone or together with other
      medicines (eg, methotrexate) to treat active psoriatic arthritis.
  - type: paragraph
    text: Ixekizumab injection is also used alone or together with other medicines
      (eg, sulfasalazine, steroids, NSAIDs, pain medicines) to treat ankylosing spondylitis.
  - type: paragraph
    text: Ixekizumab injection is also used to treat non-radiographic axial spondyloarthritis
      (a type of arthritis in the spine) with objective signs of swelling.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of ixekizumab injection to treat
        plaque psoriasis in children 6 years of age and older . However, safety and
        efficacy have not been established to treat plaque psoriasis in children younger
        than 6 years of age and to treat psoriatic arthritis, ankylosing spondylitis,
        and non-radiographic axial spondyloarthritis in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of ixekizumab injection in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abatacept
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Anifrolumab-fnia
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Baricitinib
      - Cholera Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Ebola Zaire Vaccine, Live
      - Infliximab
      - Influenza Virus Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Poliovirus Vaccine, Live
      - Rotavirus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine, Live
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
      - Zoster Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Infection (eg, bacteria, fungus, virus), or history of—Ixekizumab is not recommended
        for patients with an active infection, including tuberculosis. Caution should
        be used if you have a chronic infection or history of a recurring infection.
    - type: list
      ordered: false
      items:
      - Inflammatory bowel disease (eg, Crohn disease, ulcerative colitis)—Use with
        caution. May make this condition worse.
    - type: list
      ordered: false
      items:
      - Tuberculosis infection, inactive—Should be treated first before starting treatment
        with this medicine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      It is given as a shot under your skin, usually on the upper arms, abdomen (stomach),
      or thighs.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Ixekizumab injection may sometimes be given at home to patients who do not
      need to be in the hospital or clinic (eg, adults and children weighing more
      than 50 kilograms). If you are using this medicine at home, your doctor or nurse
      will teach you how to prepare and inject the medicine. Be sure that you understand
      how to use the medicine.
  - type: paragraph
    text: 'Ixekizumab comes in 2 forms: a prefilled autoinjector and a prefilled syringe
      . Your doctor will tell you which dosage form you should use.'
  - type: paragraph
    text: You will be shown the body areas where this shot can be given. Use a different
      body area each time you give yourself a shot. Keep track of where you give each
      shot to make sure you rotate body areas. This will help prevent skin problems
      from the injections. Do not inject into skin areas that are red, bruised, tender,
      hard, or affected by psoriasis.
  - type: paragraph
    text: Allow the medicine to warm to room temperature for 30 minutes before using
      it.
  - type: paragraph
    text: You might not use all of the medicine in each autoinjector or prefilled
      syringe. Use each autoinjector or prefilled syringe only one time. Do not save
      an open autoinjector or syringe. If the medicine in the autoinjector or prefilled
      syringe has changed color, or if you see particles in it, do not use it. Do
      not shake the medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form (autoinjector or prefilled syringe): For ankylosing
        spondylitis: Adults—160 milligrams (two-80 mg) injected under your skin at
        Week 0, followed by 80 mg every 4 weeks. Children—Use and dose must be determined
        by your doctor. For non-radiographic axial spondyloarthritis: Adults—80 milligrams
        (mg) injected under your skin every 4 weeks. Children—Use and dose must be
        determined by your doctor. For plaque psoriasis: Adults—160 milligrams (two-80
        mg) injected under your skin at Week 0, followed by 80 mg at Weeks 2, 4, 6,
        8, 10, and 12, and then 80 mg every 4 weeks. Children 6 years of age and older
        weighing more than 50 kilograms (kg)—Dose is based on body weight and must
        be determined by your doctor. The starting dose is usually 160 mg (two-80
        mg) injected under your skin at Week 0, followed by 80 mg every 4 weeks. Children
        6 years of age and older weighing 25 to 50 kg—Dose is based on body weight
        and must be determined by your doctor. The starting dose is usually 80 mg
        injected under your skin at Week 0, followed by 40 mg every 4 weeks. Children
        6 years of age and older and weighing less than 25 kg—Dose is based on body
        weight and must be determined by your doctor. The starting dose is usually
        40 mg injected under your skin at Week 0, followed by 20 mg every 4 weeks.
        Children younger than 6 years of age—Use and dose must be determined by your
        doctor. For psoriatic arthritis: Adults—160 milligrams (two-80 mg) injected
        under your skin at Week 0, followed by 80 mg every 4 weeks. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For ankylosing spondylitis: Adults—160 milligrams (two-80 mg) injected under
        your skin at Week 0, followed by 80 mg every 4 weeks. Children—Use and dose
        must be determined by your doctor.'
      - 'For non-radiographic axial spondyloarthritis: Adults—80 milligrams (mg) injected
