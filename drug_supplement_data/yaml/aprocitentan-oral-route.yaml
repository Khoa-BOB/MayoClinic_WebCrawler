title: Aprocitentan (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Tryvio
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Aprocitentan is used together with other medicines to treat high blood pressure
      (hypertension) in patients whose blood pressure is not well controlled. High
      blood pressure adds to the workload of the heart and arteries. If it continues
      for a long time, the heart and arteries may not function properly. This can
      damage the blood vessels of the brain, heart, and kidneys, resulting in a stroke,
      heart failure, or kidney failure. High blood pressure may also increase the
      risk of heart attacks. These problems may be less likely to occur if blood pressure
      is controlled.
  - type: paragraph
    text: This medicine is available only under a restricted distribution program
      called the Tryvio™ REMS (Risk Evaluation and Mitigation Strategy) program.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of aprocitentan in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of aprocitentan in the elderly. However,
        elderly patients are more likely to have edema (swelling).
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Heart failure or
      - Liver disease—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease (patients on dialysis)—Use is not recommended in patients with
        this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. Your dose may need to be changed several times in order to find
      what works best for you.
  - type: paragraph
    text: It is very important that you understand the requirements of the Tryvio™
      REMS program and Medication Guide. Read and follow these instructions carefully.
      Ask your doctor if you have any questions. Ask your pharmacist for the medication
      guide if you do not have one.
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium. Your doctor will tell you which of these is most important
      for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure may not notice any signs of the
      problem. You may not have any symptoms. It is very important that you take your
      medicine exactly as directed and that you keep your appointments with your doctor
      even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure, but
      it does help control it. You must continue to take it as directed to lower your
      blood pressure and keep it down. You may have to take high blood pressure medicine
      for the rest of your life. If high blood pressure is not treated, it can cause
      serious problems such as heart failure, blood vessel disease, stroke, or kidney
      disease.
  - type: paragraph
    text: Swallow the tablet whole. You may take this medicine with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For high blood pressure: Adults—12.5 milligrams
        (mg) once a day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—12.5 milligrams (mg) once a day. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—12.5 milligrams (mg) once a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress closely while
      you are receiving this medicine to make sure that this medicine is working properly.
      Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can cause very serious birth
      defects . Use a highly effective birth control or 2 forms of effective birth
      control to keep from getting pregnant before starting, during treatment (even
      if the medicine is temporarily stopped), and for at least 1 month after your
      last dose. The most effective forms of birth control are hormone birth control
      pills, patches, shots, vaginal rings, or implants, or a vasectomy (for males).
      One of these forms of birth control should be combined with a condom, a diaphragm,
      or a cervical cap. If a partner’s vasectomy is the chosen method of contraception,
      a hormone or barrier method must be used along with this method. If you think
      you have become pregnant while using this medicine, tell your doctor right away
      .
  - type: paragraph
    text: If you can get pregnant, you must have a negative pregnancy test before
      you can take this medicine. You will also be required to have a pregnancy test
      every month during treatment and for 1 month after treatment with this medicine.
      If you miss a period while you are using this medicine, tell your doctor right
      away.
  - type: paragraph
    text: This medicine may cause serious liver problems. Check with your doctor right
      away if you have dark urine, fatigue, loss of appetite, nausea or vomiting,
      severe stomach pain, or yellow eyes or skin.
  - type: paragraph
    text: This medicine may cause fluid retention (too much water in the body) and
      edema (swelling). Check with your doctor right away if you have bloating or
      swelling of the face, arms, hands, lower legs, or feet, decrease in amount of
      urine, noisy, rattling, or trouble breathing, rapid weight gain, swelling of
      the face, hands, feet, or lower legs, tingling of the hands or feet, or weight
      gain.
  - type: paragraph
    text: Check with your doctor right away if you have pale skin, trouble breathing,
      unusual bleeding or bruising, or unusual tiredness or weakness. These may be
      symptoms of anemia.
  - type: paragraph
    text: This medicine may decrease sperm count in some males and may cause infertility
      (unable to have children). Talk with your doctor before using this medicine
      if you plan to have children.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - decrease in amount of urine
      - noisy, rattling breathing
      - rapid weight gain
      - tingling of the hands or feet
      - trouble breathing
      - unusual weight gain or loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pale skin
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty in swallowing
      - fast heartbeat
      - skin itching, rash, or redness
      - swelling of the face, throat, or tongue
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dark urine
      - loss of appetite
      - nausea or vomiting
      - stomach pain, severe
      - yellow eyes or skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
