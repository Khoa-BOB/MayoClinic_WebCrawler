    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is less than 12 hours from your regular schedule,
        take the dose as soon as you can. If you miss a dose and it is more than 12
        hours , skip the missed dose and go back to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away unused oral liquid 28 days after first opening the bottle.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may increase your blood pressure. You will need to have your
      blood pressure measured while you are using this medicine. If you notice any
      change in your blood pressure, call your doctor right away.
  - type: paragraph
    text: This medicine may increase your risk of having urinary retention (trouble
      passing urine or not fully emptying the bladder), especially when using another
      medicine (eg, solifenacin succinate). Check with your doctor if you have a decrease
      in urine volume, decrease in the frequency of urination, difficulty in passing
      urine (dribbling), or painful urination.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction, called angioedema,
      which can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have large, hive-like swelling on the face, eyelids,
      lips, tongue, throat, hands, legs, feet, or genitals, rouble breathing, or trouble
      swallowing after using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - blurred vision
      - difficult, burning, or painful urination
      - dizziness
      - frequent urge to urinate
      - headache
      - lower back or side pain
      - nervousness
      - pounding in the ears
      - slow, fast, or irregular heartbeat
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blindness
      - decrease in vision
      - eye pain
      - lower abdominal or stomach pain
      - nausea
      - pain in the groin or genitals
      - tearing or eyes
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - chills
      - confusion
      - cough
      - decrease in the frequency of urination
      - decrease in urine volume
      - diarrhea
      - difficulty in passing urine (dribbling)
      - itching
      - joint or muscle pain
      - large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
        feet, or genitals
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - seeing, hearing, or feeling things that are not there
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - trouble sleeping
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - body aches or pain
      - constipation
      - difficulty having a bowel movement
      - difficulty with breathing
      - difficulty with moving
      - dry mouth
      - ear congestion
      - fever
      - general feeling of discomfort or illness
      - loss of voice
      - muscle ache or stiffness
      - shivering
      - sneezing
      - stomach pain
      - stuffy or runny nose
      - sweating
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - burning feeling in the chest or stomach
      - full or bloated feeling
      - heartburn
      - hives or welts, skin rash
      - indigestion
      - itching or pain of the vagina or genital area
      - pain or tenderness around the eyes and cheekbones
      - pressure in the stomach
      - redness of the skin
      - stomach discomfort, upset, or tenderness
      - swelling of the lips
      - thick, white vaginal discharge with mild or no odor
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
