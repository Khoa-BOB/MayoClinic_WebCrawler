title: Mirabegron (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Myrbetriq
    - type: paragraph
      text: Myrbetriq Granules
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Mirabegron is used alone or together with other medicines (eg, solifenacin
      succinate) to treat the symptoms of an overactive bladder (OAB), such as incontinence
      (loss of bladder control), a strong need to urinate right away, or a frequent
      need to urinate. It is also used to treat neurogenic detrusor overactivity (NDO).
      Mirabegron works on the muscles of the bladder to increase the amount of urine
      your bladder can hold and prevent them from causing incontinence.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Suspension, Extended Release
    - Tablet, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of mirabegron oral liquid to treat
        NDO in children 3 years of age and older and the extended-release tablet to
        treat NDO in children 3 years of age and older and weighing 35 kilograms (kg)
        or more. Safety and efficacy have not been established to treat NDO in children
        younger than 3 years of age or to treat OAB in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of mirabegron in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Colchicine
      - Thioridazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amphetamine
      - Benzphetamine
      - Brexpiprazole
      - Clomipramine
      - Clozapine
      - Codeine
      - Cyclosporine
      - Dabigatran Etexilate
      - Dextroamphetamine
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Eliglustat
      - Ensartinib
      - Hydroxyamphetamine
      - Lefamulin
      - Lisdexamfetamine
      - Mavorixafor
      - Methamphetamine
      - Morphine
      - Morphine Sulfate Liposome
      - Oxycodone
      - Posaconazole
      - Propafenone
      - Ranolazine
      - Relugolix
      - Repotrectinib
      - Sirolimus
      - Tenofovir Alafenamide
      - Venetoclax
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Desipramine
      - Digoxin
      - Metoprolol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bladder blockage (hard to urinate) or
      - Hypertension (high blood pressure), or history of—Use with caution. May make
        these conditions worse.
    - type: list
      ordered: false
      items:
      - End-stage kidney disease or
      - Hypertension (high blood pressure), severe uncontrolled or
      - Liver disease, severe—Use is not recommended in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease, moderate—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. To do so may increase the chance for side effects.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the extended-release tablet whole and with water. Do not crush,
      break, or chew it. Adults may take this medicine with or without food. Children
      should take it with food.
  - type: paragraph
    text: 'To use the oral liquid:'
  - type: list
    ordered: false
    items:
    - It is best to take this medicine within 1 hour with food.
    - Shake the bottle well just before taking each dose.
    - Measure the oral liquid medicine with a marked measuring spoon, oral syringe,
      or medicine cup.
  - type: paragraph
    text: Use only the brand of this medicine that your doctor prescribed. Different
      brands may not work the same way.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For symptoms of an overactive bladder: For oral dosage form (extended-release
        tablets alone): Adults—At first, 25 milligrams (mg) once a day. Your doctor
        may increase the dose to 50 mg once a day after 4 to 8 weeks. Children—Use
        and dose must be determined by your doctor. For oral dosage form (extended-release
        tablets together with solifenacin succinate): Adults—At first, 25 milligrams
        (mg) mirabegron and 5 mg solifenacin succinate once a day. Your doctor may
        increase the dose of mirabegron to 50 mg once a day after 4 to 8 weeks. Children—Use
        and dose must be determined by your doctor.'
      - 'For neurogenic detrusor overactivity: For oral dosage form (extended-release
        tablets): Children 3 years of age and older weighing 35 kilograms (kg) or
        more—At first, 25 milligrams (mg) once a day. Your doctor may increase the
        dose to 50 mg once a day after 4 to 8 weeks. Children 3 years of age and older
        weighing less than 35 kg—Use the oral liquid for these patients. Children
        younger than 3 years of age—Use and dose must be determined by your doctor.
        For oral dosage form (extended-release suspension): Children 3 years of age
        and older—Dose is based on body weight and must be determined by your doctor:
        Weighing 35 kilograms (kg) or more—At first, 6 milliliters (mL) once a day.
        Your doctor may increase the dose to 10 mL once a day after 4 to 8 weeks.
        Weighing 22 to less than 35 kg—At first, 4 mL once a day. Your doctor may
        adjust your dose as needed and tolerated. However, the dose is usually not
        more than 8 mL per day. Weighing 11 to less than 22 kg—At first, 3 mL once
        a day. Your doctor may adjust your dose as needed and tolerated. However,
        the dose is usually not more than 6 mL per day. Children younger than 3 years
        of age or weighing less than 11 kg—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets alone): Adults—At first, 25
        milligrams (mg) once a day. Your doctor may increase the dose to 50 mg once
        a day after 4 to 8 weeks. Children—Use and dose must be determined by your
        doctor.'
      - 'For oral dosage form (extended-release tablets together with solifenacin
