    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If you will be taking this medicine for a long time, it is very important
      that your doctor check you and your child's progress at regular visits to make
      sure that this medicine is working properly. Blood tests may be needed to check
      for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you are a woman who can get pregnant, your doctor may do tests to make sure
      you are not pregnant before starting this medicine. Use an effective form of
      birth control during treatment with this medicine and for at least 14 days after
      the last dose to keep from getting pregnant. If you think you have become pregnant
      while using the medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine can cause changes in the heart rhythm, including a condition
      called QT prolongation. It may change the way your heart beats and cause fainting
      or serious side effects in some patients. Tell your doctor right away if you
      or your child have a fast, pounding, or irregular heartbeat. Your doctor will
      check your heartbeat with an ECG test (electrocardiogram) before, during, and
      7 days after starting treatment with nilotinib.
  - type: paragraph
    text: After at least 3 years of treatment with this medicine, your doctor may
      do certain tests to check if you continue to show no symptoms of your cancer
      (remission) and may let you stop taking it. This is called treatment free remission
      (TFR). However, you may need to restart treatment, at a later time, if you are
      no longer in remission.
  - type: paragraph
    text: This medicine may cause heart or blood vessel problems, including decreased
      blood flow to the legs, heart, or brain. Check with your doctor right away if
      you or your child have chest pain or discomfort, numbness or weakness, change
      in the color of the legs, leg pain, or problems with walking or speaking.
  - type: paragraph
    text: 'Nilotinib can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. It can also lower the
      number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor right away
      if you think you are getting an infection or if you or your child get a fever
      or chills, cough or hoarseness, lower back or side pain, or painful or difficult
      urination.
    - Check with your doctor right away if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: Pancreatitis and other pancreas problems may occur while you are using this
      medicine. Check with your doctor right away if you or your child have sudden
      and severe stomach pain with nausea and vomiting.
  - type: paragraph
    text: Check with your doctor right away if you or your child have pain or tenderness
      in the upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual
      tiredness or weakness, or yellow eyes or skin. These could be symptoms of a
      serious liver problem.
  - type: paragraph
    text: This medicine may cause a serious type of reaction called tumor lysis syndrome.
      Your doctor may give you or your child a medicine to help prevent this. Call
      your doctor right away if you or your child have a decrease or change in the
      amount of your urine, joint pain, stiffness, or swelling, lower back, side,
      or stomach pain, a rapid weight gain, swelling of the feet or lower legs, or
      unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause fluid retention (edema). Tell your doctor right
      away if you or your child have bloating or swelling of the face, arms, hands,
      lower legs, or feet, rapid weight gain, or trouble breathing.
  - type: paragraph
    text: This medicine may affect your child's growth and development. Talk to your
      doctor if you have concerns.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - blurred vision
      - bone pain
      - chest tightness
      - chills
      - clay-colored stools
      - confusion
      - cough
      - dark urine
      - decreased appetite
      - difficult or labored breathing
      - dry mouth
      - fainting
      - fever
      - flushed, dry skin
      - fruit-like breath odor
      - headache
      - hoarseness
      - increased hunger
      - increased thirst
      - increased urination
      - irregular heartbeat, recurrent
      - itching, skin rash
      - loss of appetite
      - lower back or side pain
      - muscle aches, cramps, or pain
      - nausea
      - no blood pressure
      - no breathing
      - no pulse
      - numbness, tingling, pain, or weakness in the hands or feet
      - painful or difficult urination
      - pale skin
      - pinpoint red spots on the skin
      - seizures
      - sore throat
      - stomach pain or tenderness
      - stuffy or runny nose
      - sweating
      - swelling of the hands, ankles, feet, or lower legs
      - trembling
      - trouble breathing
      - ulcers, sores, or white spots in the mouth
      - unexplained weight loss
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - weakness and heaviness of the legs
      - yellow eyes or skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased urine output
      - dizziness
      - fast heartbeat
      - loss of consciousness
      - muscle cramps in the hands, arms, feet, legs, or face
      - nervousness
      - numbness and tingling around the mouth, fingertips, or lips
      - rapid weight gain
      - tremor
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - body aches or pain
      - constipation
      - cough producing mucus
      - depressed mood
      - dry skin and hair
      - ear congestion
      - feeling cold
      - frequent urge to urinate
      - hair loss
      - loss of voice
      - muscle stiffness
      - pain or tenderness around the eyes and cheekbones
      - sensitivity to heat
      - slowed heartbeat
      - sneezing
      - swelling or puffiness of the face
      - tender, swollen glands in the neck
      - trouble sleeping
      - trouble swallowing
      - weight changes
      - white patches in the mouth or throat or on the tongue
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain or swelling of the treated skin
      - rapid, shallow breathing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
