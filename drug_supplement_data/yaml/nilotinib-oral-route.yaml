title: Nilotinib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Danziten
    - type: paragraph
      text: Tasigna
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Nilotinib is used to treat Philadelphia chromosome positive chronic myeloid
      leukemia (Ph+ CML) in adults and children who are newly diagnosed. It is also
      given to adults and children with Ph+ CML in chronic phase (CP) or accelerated
      phase (AP) who have taken other medicines (eg, imatinib, tyrosine-kinase inhibitor)
      but did not work well. Leukemia is a type of cancer where the body makes too
      many abnormal white blood cells.
  - type: paragraph
    text: Nilotinib belongs to the general group of medicines known as antineoplastics
      or cancer medicines. It interferes with the growth of cancer cells, which are
      eventually destroyed. Since the growth of normal cells may also be affected
      by nilotinib, other effects will also occur. Some of these may be serious and
      must be reported to your doctor. Other effects may not be serious but may cause
      concern.
  - type: paragraph
    text: Before you begin treatment with nilotinib, you and your doctor should talk
      about the benefits this medicine will do as well as the possible risks of using
      it.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of nilotinib in children younger than 1 year of age. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of nilotinib in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Bepridil
      - Cisapride
      - Dengue Tetravalent Vaccine, Live
      - Dronedarone
      - Flibanserin
      - Fluconazole
      - Ketoconazole
      - Lefamulin
      - Levoketoconazole
      - Measles Virus Vaccine, Live
      - Mesoridazine
      - Mifepristone
      - Mumps Virus Vaccine, Live
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Rubella Virus Vaccine, Live
      - Saquinavir
      - Smallpox Monkeypox Vaccine
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Acalabrutinib
      - Adagrasib
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Alfentanil
      - Alfuzosin
      - Alprazolam
      - Aluminum Carbonate, Basic
      - Aluminum Hydroxide
      - Aluminum Phosphate
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amlodipine
      - Amoxapine
      - Anagrelide
      - Apalutamide
      - Apomorphine
      - Aprepitant
      - Aripiprazole
      - Arsenic Trioxide
      - Asciminib
      - Asenapine
      - Astemizole
      - Atazanavir
      - Avacopan
      - Avapritinib
      - Azithromycin
      - Bedaquiline
      - Belzutifan
      - Benzhydrocodone
      - Berotralstat
      - Boceprevir
      - Bosutinib
      - Brexpiprazole
      - Brigatinib
      - Budesonide
      - Buprenorphine
      - Buserelin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Pioglitazone
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - food
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Ascites (abnormal build-up of water in the stomach) or
      - Bleeding problems or
      - Blood or bone marrow problems (eg, anemia, neutropenia, thrombocytopenia)
        or
      - Fluid retention or
      - Heart or blood vessel problems (eg, congestive heart failure, heart attack,
        ischemic heart disease, pericardial effusion, peripheral arterial occlusive
        disease, slow heartbeat, stroke), or history of or
      - Hyperkalemia (high potassium in the blood) or
      - Hypocalcemia (low calcium in the blood) or
      - Hyponatremia (low sodium in the blood) or
      - Hypophosphatemia (low phosphate in the blood) or
      - Lung disease (eg, pleural effusion, pulmonary edema) or
      - Pancreatitis (inflammation of the pancreas), history of—Use with caution.
        May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Heart rhythm problems (eg, long QT syndrome) or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood)—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Lactose intolerance—Use with caution. This medicine contains lactose.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of nilotinib from the body.
    - type: list
      ordered: false
      items:
      - Total gastrectomy (surgery that involves the removal of the entire stomach)—The
        effects of nilotinib may be decreased in patients who had this procedure.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. Do not change the dose or stop using this medicine without
      checking first with your doctor.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: It is best to take this medicine on an empty stomach (at least 1 hour before
      or 2 hours after a meal).
  - type: paragraph
    text: Swallow the capsule whole with water. If you have trouble swallowing the
      capsule, open it and sprinkle the contents in one teaspoon of applesauce (puréed
      apple). Do not sprinkle Tasigna® on other foods. This mixture must be taken
      right away within 15 minutes and should not be stored for later use.
  - type: paragraph
    text: If you are taking an H2 blocker medicine (eg, famotidine), take it at least
      10 hours before or 2 hours after using nilotinib.
  - type: paragraph
    text: If you are taking an antacid that contains aluminum, magnesium, or simethicone,
      take it at least 2 hours before or 2 hours after using nilotinib.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine. Grapefruit and grapefruit juice may change the amount of the medicine
      that is absorbed in the body.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For the treatment of Ph+ CML-CP and CML-AP
        after other treatments have failed: Adults—400 milligrams (mg) 2 times a day,
        at least 12 hours apart. Your doctor may adjust your dose as needed. Children
        1 year of age and older—Dose is based on body surface area (BSA) and must
        be determined by your doctor. The dose is usually 230 milligrams per squared
        meter (mg/m2) of BSA, taken 2 times a day, at least 12 hours apart. BSA of
        1.64 meter squared (m2) or more—400 mg 2 times a day. BSA of 1.42 to 1.63
        m2—350 mg 2 times a day. BSA of 1.20 to 1.41 m2—300 mg 2 times a day. BSA
        of 0.98 to 1.19 m2—250 mg 2 times a day. BSA of 0.77 to 0.97 m2—200 mg 2 times
        a day. BSA of 0.55 to 0.76 m2—150 mg 2 times a day. BSA of 0.33 to 0.54 m2—100
        mg 2 times a day. BSA of 0.32 m2 or less—50 mg 2 times a day. Children younger
        than 1 year of age—Use and dose must be determined by your doctor. For the
        treatment of newly diagnosed Ph+ CML-CP: Adults—300 milligrams (mg) 2 times
        a day, at least 12 hours apart. Your doctor may adjust your dose as needed.
        Children 1 year of age and older—Dose is based on body surface area (BSA)
        and must be determined by your doctor. The dose is usually 230 milligrams
        per squared meter (mg/m2) of BSA, taken 2 times a day, at least 12 hours apart.
        BSA of 1.64 meter squared (m2) or more—400 mg 2 times a day. BSA of 1.42 to
        1.63 m2—350 mg 2 times a day. BSA of 1.20 to 1.41 m2—300 mg 2 times a day.
        BSA of 0.98 to 1.19 m2—250 mg 2 times a day. BSA of 0.77 to 0.97 m2—200 mg
        2 times a day. BSA of 0.55 to 0.76 m2—150 mg 2 times a day. BSA of 0.33 to
        0.54 m2—100 mg 2 times a day. BSA of 0.32 m2 or less—50 mg 2 times a day.
        Children younger than 1 year of age—Use and dose must be determined by your
        doctor.'
    - type: list
