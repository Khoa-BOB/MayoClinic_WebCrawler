title: Clomiphene (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Clomid
    - type: paragraph
      text: Serophene
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Clomiphene is used as a fertility medicine in some women who are unable
      to become pregnant.
  - type: paragraph
    text: Clomiphene probably works by changing the hormone balance of the body. In
      women, this causes ovulation to occur and prepares the body for pregnancy.
  - type: paragraph
    text: Clomiphene may also be used for other conditions in both females and males
      as determined by your doctor.
  - type: paragraph
    text: The following information applies only to female patients taking clomiphene.
      Check with your doctor if you are a male and have any questions about the use
      of clomiphene.
  - type: paragraph
    text: Clomiphene is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Unusually large ovary or
      - Cyst on ovary—Clomiphene may cause the cyst to increase in size
    - type: list
      ordered: false
      items:
      - Endometriosis—Inducing ovulation (including using clomiphene) may worsen endometriosis
        because the body estrogen level is increased; estrogen can cause growth of
        endometriosis implants
    - type: list
      ordered: false
      items:
      - Fibroid tumors of the uterus—Clomiphene may cause fibroid tumors to increase
        in size
    - type: list
      ordered: false
      items:
      - Inflamed veins due to blood clots—Clomiphene may make condition worse
    - type: list
      ordered: false
      items:
      - Liver disease (or history of)—Clomiphene may make any liver disease worse
    - type: list
      ordered: false
      items:
      - Mental depression—Existing depression may become worse because of hormone
        changes caused by clomiphene
    - type: list
      ordered: false
      items:
      - Unusual vaginal bleeding—Some irregular vaginal bleeding is a sign that the
        lining of the uterus is growing too much or is a sign of cancer of the uterus
        lining; these problems must be ruled out before clomiphene is used because
        clomiphene can make these conditions worse
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor. If you are to begin
      on Day 5, count the first day of your menstrual period as Day 1. Beginning on
      Day 5, take the correct dose every day for as many days as your doctor ordered.
      To help you to remember to take your dose of medicine, take it at the same time
      every day.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treating infertility: Adults—50 milligrams
        (mg) a day for five days of a menstrual cycle. The treatment is usually started
        on the fifth day of your menstrual period. If you do not have menstrual cycles,
        you can begin taking your medicine at any time. If you do not become pregnant
        after the first course, your doctor may increase your dose a little at a time
        up to 250 mg a day. Your treatment may be repeated until you do become pregnant
        or for up to four treatment cycles.'
    - type: list
      ordered: false
      items:
      - 'For treating infertility: Adults—50 milligrams (mg) a day for five days of
        a menstrual cycle. The treatment is usually started on the fifth day of your
        menstrual period. If you do not have menstrual cycles, you can begin taking
        your medicine at any time. If you do not become pregnant after the first course,
        your doctor may increase your dose a little at a time up to 250 mg a day.
        Your treatment may be repeated until you do become pregnant or for up to four
        treatment cycles.'
    - type: list
      ordered: false
      items:
      - Adults—50 milligrams (mg) a day for five days of a menstrual cycle. The treatment
        is usually started on the fifth day of your menstrual period. If you do not
        have menstrual cycles, you can begin taking your medicine at any time. If
        you do not become pregnant after the first course, your doctor may increase
        your dose a little at a time up to 250 mg a day. Your treatment may be repeated
        until you do become pregnant or for up to four treatment cycles.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working and to check for unwanted effects.
  - type: paragraph
    text: At certain times in your menstrual cycle, your doctor may want you to use
      an ovulation prediction test kit. Follow your doctor's instructions carefully.
      Ovulation is controlled by luteinizing hormone (LH). LH is present in the blood
      and urine in very small amounts during most of the menstrual cycle but rises
      suddenly for a short time in the middle of the menstrual cycle. This sharp rise,
      the LH surge, usually causes ovulation within about 30 hours. A woman is most
      likely to become pregnant if she has intercourse within the 24 hours after detecting
      the LH surge. Ovulation prediction test kits are used to test for this large
      amount of LH in the urine. This method is better for predicting ovulation than
      measuring daily basal body temperature. It is important that intercourse take
      place at the correct time to give you the best chance of becoming pregnant.
  - type: paragraph
    text: There is a chance that clomiphene may cause birth defects if it is taken
      after you become pregnant. Stop taking this medicine and tell your doctor immediately
      if you think you have become pregnant while still taking clomiphene.
  - type: paragraph
    text: This medicine may cause blurred vision, difficulty in reading, or other
      changes in vision. It may also cause some people to become dizzy or lightheaded.
      Make sure you know how you react to this medicine before you drive, use machines,
      or do anything else that could be dangerous if you are not clear-headed or able
      to see well. If these reactions are especially bothersome, check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating
      - stomach or pelvic pain
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - decreased or double vision or other vision problems
      - seeing flashes of light
      - sensitivity of eyes to light
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hot flashes
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Breast discomfort
      - dizziness or lightheadedness
      - headache
      - heavy menstrual periods or bleeding between periods
      - mental depression
      - nausea or vomiting
      - nervousness
      - restlessness
      - tiredness
      - trouble in sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
