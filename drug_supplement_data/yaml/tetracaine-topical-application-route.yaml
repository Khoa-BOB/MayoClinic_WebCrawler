title: Tetracaine (topical application route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cepacol Viractin
    - type: paragraph
      text: Pontocaine
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Supracaine
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Tetracaine is used in different parts of the body to cause numbness or loss
      of feeling in some patients before having a medical test or procedure.
  - type: paragraph
    text: Tetracaine belongs to a group of medicines known as topical local anesthetics.
      It deadens the nerve endings in the skin. This medicine does not cause unconsciousness
      as general anesthetics do when used for surgery.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of tetracaine in the pediatric population. Safety and efficacy have not been
        established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of tetracaine in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Brain or spinal problems or
      - Eye problems or
      - Heart and blood vessel problems—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Infection at or near the place of application or
      - Large sores, broken skin, or severe injury at the area of application—The
        chance of side effects may be increased.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is for use on the skin only.
  - type: paragraph
    text: Be careful not to get any of this medicine in your nose, mouth, and especially
      in your eyes, because it can cause severe eye irritation. If any of the medicine
      does get into these areas especially the eyes, wash it with water and check
      with your doctor right away.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you closely for any problems
      or unwanted effects that may be caused by this medicine.
  - type: paragraph
    text: Stop using this medicine and check with your doctor right away if you have
      a skin rash, burning, stinging, swelling, or irritation of your skin.
  - type: paragraph
    text: Do not use cosmetics or other skin care products on the treated skin areas.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain or discomfort
      - confusion
      - dizziness
      - dizziness, faintness, or lightheadedness when getting up from a lying or sitting
        position suddenly
      - fainting
      - fast or irregular heartbeat
      - lightheadedness or fainting
      - no blood pressure or pulse
      - no breathing
      - numbness
      - seizures
      - shakiness in the legs, arms, hands, or feet
      - shortness of breath
      - slow or irregular heartbeat
      - stopping of heart
      - sweating
      - trembling or shaking of the hands or feet
      - unconsciousness
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Continuing ringing or buzzing or other unexplained noise in the ears
      - fear or nervousness
      - hearing loss
      - restlessness
      - sleepiness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
