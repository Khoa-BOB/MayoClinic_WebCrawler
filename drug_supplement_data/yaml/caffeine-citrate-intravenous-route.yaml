title: Caffeine citrate (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cafcit
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Caffeine citrate injection is used to treat short-term apnea of prematurity
      when premature babies (infants between 28 and 32 weeks gestational age) stop
      breathing. Apnea of prematurity is caused by the baby's breathing centers not
      being fully developed.
  - type: paragraph
    text: This medicine is available with or without your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not pediatric-specific problems
        that would limit the usefulness of caffeine citrate injection in premature
        babies.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of caffeine citrate injection in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Central nervous system problems or
      - Heart or blood vessel problems or
      - Lung disease or breathing problems (eg, obstructive apnea) or
      - Sepsis (infection in the blood)—Should be ruled out or treated first before
        using this medicine.
    - type: list
      ordered: false
      items:
      - Hyperglycemia (high blood sugar) or
      - Hypoglycemia (high blood sugar) or
      - Necrotizing enterocolitis or
      - Seizures, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of caffeine oral solution from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give your baby this medicine
      in a hospital. This medicine is given through a needle placed in one of your
      baby's veins. The medicine must be injected slowly, so your baby's IV tube will
      need to stay in place for 10 to 30 minutes.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your baby's doctor will check your baby's progress closely while your baby
      is receiving this medicine . This will allow your doctor to see if the medicine
      is working properly and to decide if your baby should continue to receive it.
  - type: paragraph
    text: Call your baby's doctor right away if your baby continues to have apnea.
  - type: paragraph
    text: 'Tell your baby''s doctor right away if your baby has one of the following
      symptoms: faster heartbeat, increased diaper wetting, restlessness, jitteriness,
      or shaking.'
  - type: paragraph
    text: 'Call your baby''s doctor right away if your baby has the following symptoms:
      abdominal or stomach distension, vomiting, or bloody stools. These may be symptoms
      of a serious bowel or stomach problem.'
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Feeding intolerance
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - black, tarry stools
      - blood in the stools or urine
      - bruising
      - burning feeling or tenderness in the stomach
      - chills
      - coma
      - confusion
      - coughing or vomiting blood
      - decreased urine output
      - depression
      - dizziness
      - fainting
      - fast heartbeat
      - fever
      - headache
      - hostility
      - indigestion
      - irritability
      - lethargy
      - lightheadedness
      - muscle twitching
      - nausea
      - persistent bleeding
      - rapid, shallow breathing
      - rapid weight gain
      - rash
      - seizures
      - stomach upset
      - swelling of the face, ankles, or hands
      - trouble breathing
      - unusual tiredness or weakness
      - vomiting
      - vomiting of blood or material that looks like coffee grounds
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Irritability
      - nervousness
      - rapid heartbeat
      - trouble sleeping
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
