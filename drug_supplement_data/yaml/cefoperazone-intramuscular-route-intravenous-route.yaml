title: Cefoperazone (intramuscular route, intravenous route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cefoperazone injection is used to treat bacterial infections in the different
      parts of the body.
  - type: paragraph
    text: Cefoperazone injection belongs to the class of medicines known as cephalosporin
      antibiotics. It works by killing bacteria or preventing their growth. However,
      this medicine will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of cefoperazone injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of cefoperazone injection in the
        elderly. However, elderly patients are more likely to have age-related liver,
        kidney, or heart problems, which may require caution and an adjustment in
        the dose for patients receiving cefoperazone injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Cholera Vaccine, Live
      - Heparin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse, history of or
      - Malabsorption problems (eg, cystic fibrosis) or
      - Poor nutrition status—May increase risk of having vitamin K deficiency.
    - type: list
      ordered: false
      items:
      - Allergy to beta-lactam antibiotics, history of—Should not be used in patients
        with this condition.
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Kidney disease or
      - Stomach or bowel disease (eg, colitis), history of—Use with caution. May make
        these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      It is given as a shot into a muscle or through a needle placed into a vein.
  - type: paragraph
    text: You should receive every dose that is prescribed to clear up your infection,
      even if you feel better after the first few doses. Your infection may not clear
      up if you stop receiving the medicine too soon.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress while you are
      receiving this medicine . This will allow your doctor to see if the medicine
      is working properly and to decide if you should continue to receive it. Blood
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction, called anaphylaxis.
      This can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth after receiving
      this medicine.
  - type: paragraph
    text: Serious skin reactions (eg, Stevens-Johnson syndrome, toxic epidermal necrolysis,
      exfoliative dermatitis) can occur with this medicine. Check with your doctor
      right away if you have blistering, peeling, or loosening of the skin, red skin
      lesions, severe acne or a skin rash, sores or ulcers on the skin, or fever or
      chills with this medicine.
  - type: paragraph
    text: Cefoperazone injection may cause diarrhea, and in some cases it can be severe
      and may occur 2 months or more after you stop receiving this medicine. Do not
      take any medicine or give medicine to your child to treat diarrhea without first
      checking with your doctor. Diarrhea medicines may make the diarrhea worse or
      make it last longer. If you have any questions about this or if mild diarrhea
      continues or gets worse, check with your doctor.
  - type: paragraph
    text: This medicine may cause bleeding problems. Check with your doctor right
      away if you have any unusual bleeding or bruising, black, tarry stools, blood
      in the urine or stools, headache, dizziness, or weakness, pain, swelling, or
      discomfort in a joint, pinpoint red spots on your skin, unusual nosebleeds,
      or unusual vaginal bleeding that is heavier than normal.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are receiving this medicine. The results of some tests may be affected by
      this medicine.
  - type: paragraph
    text: Do not drink alcohol during treatment and after you receive this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry, stools
      - bluish color of the skin
      - chills
      - cough
      - dark urine
      - difficulty in breathing or swallowing
      - fast heartbeat
      - fever
      - general tiredness and weakness
      - light-colored stools
      - lower back or side pain
      - nausea
      - pain or swelling at the injection site
      - painful or difficult urination
      - pale skin
      - skin itching, rash, or redness
      - sore throat
      - stomach cramps
      - swelling of the face, throat, or tongue
      - swelling of the foot or leg
      - tenderness
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - upper right stomach pain
      - vomiting
      - watery or bloody diarrhea
      - yellow eyes and skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - bleeding under the skin
      - blistering, peeling, loosening of the skin
      - blood in the urine or stools
      - clay-colored stools
      - cold, clammy skin
      - confusion
      - coughing up blood
      - dizziness
      - fast, weak pulse
      - headache
      - increased menstrual flow or vaginal bleeding
      - joint or muscle pain
      - lightheadedness
      - loss of appetite
      - nosebleeds
      - paralysis
      - pinpoint red spots on the skin
      - prolonged bleeding from cuts
      - red, irritated eyes
      - red or black, tarry stools
      - red or dark brown urine
      - red skin lesions, often with a purple center
      - stomach pain
      - sweating
      - unpleasant breath odor
      - vomiting of blood
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
