title: Rubella virus vaccine, live (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Meruvax II
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Rubella virus vaccine live is an active immunizing agent used to prevent
      infection by the rubella virus. It works by causing your body to produce its
      own protection (antibodies) against the virus infection.
  - type: paragraph
    text: Rubella (also known as German measles) is a serious infection that causes
      miscarriages, stillbirths, or birth defects in unborn babies when pregnant women
      get the disease. While immunization against rubella is recommended for everyone,
      it is especially important for women of child-bearing age.
  - type: paragraph
    text: Immunization against rubella is also important for employees in medical
      facilities, adolescents and adult men, persons traveling outside the U.S., and
      all children 12 months of age and older, including school-aged children.
  - type: paragraph
    text: Immunization against rubella is not recommended for infants less than 12
      months of age, because antibodies they received from their mothers before birth
      may interfere with the effectiveness of the vaccine. Children who were immunized
      against rubella before 12 months of age should be immunized again.
  - type: paragraph
    text: You can be considered immune to rubella only if you received rubella vaccine
      on or after your first birthday and have the medical record to prove it, or
      if you have had a blood test showing immunity to rubella. A past history of
      having a rubella infection does not prove immunity, because the signs of rubella
      infection are not reliable enough to be certain that you have had the disease.
  - type: paragraph
    text: Since vaccination with rubella vaccine may not provide protection for everyone,
      you may want to ask your doctor to check your immunity to the rubella virus
      6 to 8 weeks following your vaccination. This may be especially important if
      you are a woman of child-bearing age who is likely to become pregnant in the
      future.
  - type: paragraph
    text: This vaccine is to be administered only by or under the supervision of your
      doctor or other health care professional.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use is not recommended for infants less than 12 months of age. This medicine
        has been tested in older infants and children and, in effective doses, has
        not been shown to cause different side effects or problems than it does in
        adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is not recommended.
        Your doctor may decide not to use this vaccine or change some of the other
        medicines you take.
    - type: list
      ordered: false
