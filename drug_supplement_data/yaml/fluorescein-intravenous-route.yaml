title: Fluorescein (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: AK-Fluor
    - type: paragraph
      text: Angioscein
    - type: paragraph
      text: Fluorescite
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fluorescein injection is used to help certain parts of the eye (eg, retina,
      iris) become more visible during eye medical procedures.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of fluorescein injection in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of fluorescein injection in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to food, dye, or medicine, history of or
      - Asthma, or history of—May increase risk of having an allergic reaction to
        occur again.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this medicine in a hospital. This medicine is given through a needle placed
      in one of your veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your progress closely while you or your child is
      receiving this medicine . This will allow your doctor to see if the medicine
      is working properly and to decide if you should continue to receive it and to
      check for unwanted effects.
  - type: paragraph
    text: This medicine may cause a serious type of allergic reaction called anaphylaxis.
      Anaphylaxis requires immediate medical attention. The most serious signs of
      this reaction are very fast or irregular breathing, gasping for breath, or fainting.
      Other signs may include changes in color of the skin of the face, very fast
      but irregular heartbeat or pulse, hive-like swellings on the skin, and puffiness
      or swellings of the eyelids or around the eyes. If these side effects occur,
      get emergency help at once.
  - type: paragraph
    text: Tell your doctor right away if you or your child has redness, swelling,
      or peeling of the skin, or severe pain or loss of feeling in the arm for several
      hours after receiving this medicine.
  - type: paragraph
    text: Tell your doctor if you or your child has nausea, vomiting, diarrhea, or
      stomach pain after receiving this medicine.
  - type: paragraph
    text: You or your child may notice a strong taste in your mouth after this medicine
      is injected. Your skin may have a yellowish discoloration for about 6 to 12
      hours after your test. Your urine may appear bright yellow for up to 36 hours
      after your test.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish color
      - cold, clammy skin
      - confusion
      - cough
      - difficulty breathing
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - hives, itching, or skin rash
      - lightheadedness
      - noisy breathing
      - pain, redness, swelling, or peeling of the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - severe pain in the arm
      - sweating
      - tightness in the chest
      - unconsciousness
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - diarrhea
      - nausea
      - vomiting
      - yellow skin and urine
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
    - type: paragraph
      text: 'Drug information provided by: Merative, Micromedex®'
