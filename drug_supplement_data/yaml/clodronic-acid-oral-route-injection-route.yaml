title: Clodronic acid (oral route, injection route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Clodronate is a medicine used to treat a high level of calcium in the blood
      caused by changes in the body that happen with cancer. Clodronate also treats
      the weakening in the bones when cancer has spread to the bones from another
      part of the body.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of clodronate in children with use
        in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of clodronate in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Stomach cramping or pain, nausea, stomach burning—Taking clodronate, especially
        by mouth, may make your stomach problems worse
    - type: list
      ordered: false
      items:
      - Kidney problems—Taking clodronate may cause your kidney problems to get worse.
        Your doctor may give you a smaller amount of clodronate to take
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form : For treating hypercalcemia (too much calcium in the
        blood): Adults—1600 milligrams (mg) to 2400 mg given in one or two divided
        amounts per day. Your doctor may give you capsules after you have had clodronate
        through your vein. You should not take more than 3200 mg in a day. You should
        take clodronate at least two hours before or after food. Children—Use and
        dosage must be determined by your doctor. For injection dosage form: For treating
        hypercalcemia (too much calcium in the blood): Adults—300 mg in a solution
        to be injected over at least two hours into a vein once a day for two to five
        days. The treatment will not be longer than seven days. The amount of medicine
        may be less if you have kidney problems. Children—Use and dosage must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treating hypercalcemia (too much calcium in the blood): Adults—1600 milligrams
        (mg) to 2400 mg given in one or two divided amounts per day. Your doctor may
        give you capsules after you have had clodronate through your vein. You should
        not take more than 3200 mg in a day. You should take clodronate at least two
        hours before or after food. Children—Use and dosage must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—1600 milligrams (mg) to 2400 mg given in one or two divided amounts
        per day. Your doctor may give you capsules after you have had clodronate through
        your vein. You should not take more than 3200 mg in a day. You should take
        clodronate at least two hours before or after food.
      - Children—Use and dosage must be determined by your doctor.
    subsections: []
  - heading: 'For injection dosage form:'
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - 'For treating hypercalcemia (too much calcium in the blood): Adults—300 mg
        in a solution to be injected over at least two hours into a vein once a day
        for two to five days. The treatment will not be longer than seven days. The
        amount of medicine may be less if you have kidney problems. Children—Use and
        dosage must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—300 mg in a solution to be injected over at least two hours into a
        vein once a day for two to five days. The treatment will not be longer than
        seven days. The amount of medicine may be less if you have kidney problems.
      - Children—Use and dosage must be determined by your doctor.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that you take adequate fluid before and while taking
      clodronate.
  - type: paragraph
    text: If you will be taking this medicine for a long time, it is very important
      that your doctor see you at regular visits to check the calcium in your blood
      and to see how well the clodronate is working.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Breathing problems
      - convulsions (seizures)
      - mood or mental changes
      - muscle cramps in hands, arms, feet, legs, or face
      - muscle shaking
      - problems with urination
      - sores in throat
      - stomach cramps or pain
      - swelling of face, ankles or hands
      - unusual heartbeats
      - unusual tiredness or weakness
    subsections: []
  - heading: Symptoms of Overdose
    level: 3
    content:
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    - type: list
      ordered: false
      items:
      - Convulsions (seizures)
      - mood or mental changes
      - muscle cramps
      - problems with urination
      - stomach pain or cramps
      - trouble breathing
      - unusual heartbeat
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - increased bowel movements
      - nausea and vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cloudy urine
      - mouth irritation
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
