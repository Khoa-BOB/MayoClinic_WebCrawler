    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the tablets in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the oral liquid in the refrigerator. Throw away any unused medicine
        after 14 days.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms or your child's symptoms do not improve within a few days,
      or if they become worse, check with your doctor.
  - type: paragraph
    text: Cefpodoxime may cause diarrhea, and in some cases it can be severe. Do not
      take any medicine or give medicine to your child to treat diarrhea without first
      checking with your doctor. Diarrhea medicines may make the diarrhea worse or
      make it last longer. If you have any questions about this or if mild diarrhea
      continues or gets worse, check with your doctor.
  - type: paragraph
    text: Before you or your child have any medical tests, tell the medical doctor
      in charge that you are using this medicine. The results of some tests may be
      affected by this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
