title: Mirvetuximab soravtansine-gynx (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Elahere
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Mirvetuximab soravtansine-gynx injection is used to treat folate receptor-alpha
      (FRa) positive platinum-resistant epithelial ovarian, fallopian tube, or primary
      peritoneal cancer in patients who have received 1 to 3 previous treatments.
      Your doctor will perform a test to check for the FRa tumor before you receive
      this medicine.
  - type: paragraph
    text: This medicine is to be given only by or under the immediate supervision
      of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of mirvetuximab soravtansine-gynx injection in the pediatric
        population. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of mirvetuximab soravtansine-gynx
        injection in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Boceprevir
      - Cholera Vaccine
      - Clarithromycin
      - Cobicistat
      - Conivaptan
      - Ebola Zaire Vaccine, Live
      - Idelalisib
      - Indinavir
      - Influenza Virus Vaccine, Live
      - Itraconazole
      - Ketoconazole
      - Lopinavir
      - Nefazodone
      - Nelfinavir
      - Posaconazole
      - Ritonavir
      - Rotavirus Vaccine, Live
      - Saquinavir
      - Telaprevir
      - Telithromycin
      - Voriconazole
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Eye or vision problems or
      - Peripheral neuropathy (nerve problem)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Liver disease, moderate or severe—Use is not recommended in patients with
        this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through an IV catheter that is placed into
      one of your veins once every 3 weeks (21-day cycle).
  - type: paragraph
    text: Your doctor will give you other medicines (eg, allergy medicine, fever medicine,
      steroids) to help prevent infusion related reactions and nausea and vomiting.
  - type: paragraph
    text: Your doctor will also give you steroid or lubricant eye drops before and
      during treatment with this medicine. Do not wear contact lenses during treatment
      with this medicine.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Receiving this medicine while you are pregnant can harm your unborn baby.
      If you are a woman who can get pregnant, your doctor may do tests to make sure
      you are not pregnant before starting treatment. Use an effective form of birth
      control to prevent pregnancy while you are receiving this medicine and for at
      least 7 months after the last dose. If you think you have become pregnant while
      receiving this medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause eye or vision problems (eg, visual impairment, keratitis,
      dry eye, photophobia, eye pain, and uveitis). Check with your doctor right away
      if you have blurred vision, changes in vision, difficulty seeing at night, eye
      pain, increased sensitivity of the eyes to sunlight, redness of the eye, or
      tearing. Your doctor may want you to have your eyes checked by an ophthalmologist
      (eye doctor).
  - type: paragraph
    text: This medicine may cause pneumonitis (swelling of the lungs). Check with
      your doctor right away if you have chest pain, chills, cough, fever, general
      feeling of discomfort or illness, thickening of bronchial secretions, or trouble
      breathing.
  - type: paragraph
    text: Check with your doctor right away if you are having burning, numbness, tingling,
      or painful sensations, weakness in the arms, hands, legs, or feet, or unsteadiness.
      These could be symptoms of a condition called peripheral neuropathy.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blindness
      - blurred vision
      - burning, numbness, tingling, or painful sensations
      - change in vision
      - chills
      - cough
      - decreased vision
      - difficulty seeing at night
      - double vision
      - dry eye
      - eye redness, irritation, or pain
      - fever
      - increased sensitivity of the eyes to sunlight
      - lower back or side pain
      - nausea
      - painful, irritation of the clear front part of the eye
      - painful or difficult urination
      - pale skin
      - seeing double
      - severe constipation
      - sore throat
      - stomach pain
      - trouble breathing
      - ulcers, sores, or white spots in the mouth
      - unsteadiness or awkwardness
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
      - watering of the eyes
      - weakness in the arms, hands, legs, or feet
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - blood in the urine or stools
      - chest pain
      - cough or hoarseness
      - general feeling of discomfort or illness
      - pinpoint red spots on the skin
      - stomach bloating
      - thickening of bronchial secretions
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased appetite
      - diarrhea
      - muscle or joint pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
