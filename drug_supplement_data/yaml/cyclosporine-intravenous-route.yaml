      - Tigecycline
      - Tolterodine
      - Troglitazone
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse, or history of, or
      - Epilepsy (seizures) or
      - Liver disease—This medicine contains alcohol, which can make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Allergy to polyoxyethylated castor oil (Cremophor® EL)—Should not be used
        in patients with this condition.
    - type: list
      ordered: false
      items:
      - Anemia or
      - Bleeding problems or
      - Brain disease (eg, encephalopathy) or
      - Cancer or
      - Eye or visual problems (eg, papilloedema) or
      - Hyperkalemia (high potassium in the blood) or
      - Hypertension (high blood pressure) or
      - Hyperuricemia (too much uric acid in the blood) or
      - Infection (eg, bacteria, fungus, virus) or
      - Kidney disease or
      - Liver disease or
      - Lymphoma (cancer of the lymph glands) or
      - Seizures, history of or
      - Skin cancer or
      - Thrombocytopenia (low number of platelets)—Use with caution. May make these
        conditions worse. .
    - type: list
      ordered: false
      items:
      - Hypertension (high blood pressure) or
      - Hypocholesterolemia (low cholesterol in the blood) or
      - Hypomagnesemia (low magnesium in the blood)—May increase risk for encephalopathy.
    - type: list
      ordered: false
      items:
      - Infection—May decrease body's ability to fight infection.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given through an IV placed in one of your veins.
  - type: paragraph
    text: This medicine is usually given 4 to 12 hours before organ transplantation.
      Then your doctor will switch you to the oral (by mouth) form of Sandimmune®.
  - type: paragraph
    text: You should not eat grapefruit or drink grapefruit juice while you are receiving
      this medicine . Grapefruit and grapefruit juice will increase the amount of
      medicine in the body.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you closely while you are receiving
      this medicine. This will allow your doctor to see if the medicine is working
      properly and to decide if you should continue to receive it. Blood and urine
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: You will also need to have your blood pressure measured before starting
      this medicine and while you are using it. If you notice any change to your recommended
      blood pressure, call your doctor right away. If you have questions about this,
      talk to your doctor.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Check
      with your doctor right away if you have chest tightness, cough, difficulty swallowing,
      dizziness, fast heartbeat, hives, itching, skin rash, puffiness or swelling
      of the eyelids or around the eyes, face, lips, or tongue, trouble breathing,
      or unusual tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have blood in the urine, change
      in the frequency of urination or amount of urine, difficulty breathing, drowsiness,
      increased thirst, loss of appetite, nausea or vomiting, or swelling of the feet
      or lower legs, or weakness. These may be symptoms of a serious kidney problem.
  - type: paragraph
    text: Hyperkalemia (high potassium in the blood) may occur while you are receiving
      this medicine. Tell your doctor right away if you have confusion, difficulty
      breathing, irregular heartbeat, nausea or vomiting, nervousness, numbness or
      tingling in the hands, feet, or lips, stomach pain, trouble breathing, or weakness
      or heaviness of the legs. Do not use supplements or salt substitutes containing
      potassium without first checking with your doctor .
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may cause thrombotic microangiopathy (damage in the smallest
      blood vessels) and hemolytic anemia. Tell your doctor right away if you have
      back, leg, or stomach pains, bleeding gums, chills, dark urine, difficulty breathing,
      fever, general body swelling, headache, loss of appetite, nausea or vomiting,
      nosebleeds, pale skin, sore throat, sudden, severe chest pain, sudden weakness
      in arms or legs, or yellowing of the eyes or skin.
  - type: paragraph
    text: Do not take cyclosporine if you are receiving treatment for psoriasis, including
      PUVA or UVB therapy, methotrexate (Rheumatrex®), or radiation therapy.
  - type: paragraph
    text: This medicine may increase your risk of getting skin cancer or lymphoma.
      Talk to your doctor if you have concerns about this risk.
  - type: paragraph
    text: This medicine may increase your risk of developing infections. Avoid being
      near people who are sick while you are receiving this medicine. Wash your hands
      often. Tell your doctor if you have any kind of infection before you start using
      this medicine. Tell your doctor if you have ever had an infection that would
      not go away or an infection that kept coming back.
  - type: paragraph
    text: If you are taking this medicine after a kidney transplant , it may increase
      your risk for developing rare and serious virus infections, including polyoma
      virus-associated nephropathy (PVAN), progressive multiple leukoencephalopathy
      (PML), and BK virus-associated nephropathy (BKVAN). The BK virus may affect
      how your kidneys work and cause a transplanted kidney to fail. Check with your
      doctor right away if you have bloody urine, a decreased frequency or amount
      of urine, increased thirst, loss of appetite, lower back or side pain, nausea,
      swelling of the face, fingers, or lower legs, trouble breathing, unusual tiredness
      or weakness, vomiting, or weight gain.
  - type: paragraph
    text: Tell your doctor right away if you have seizures, headaches, confusion,
      vision problems, unusual drowsiness, tiredness, or weakness. These could be
      symptoms of a serious nervous system problem called posterior reversible encephalopathy
      syndrome (PRES).
  - type: paragraph
    text: While you are being treated with cyclosporine, and after you stop treatment
      with it, do not have any immunizations (vaccines) without your doctor's approval
      . Cyclosporine lowers your body's resistance and there is a chance you might
      get the infection the immunization is meant to prevent. However, it may be especially
      important to receive certain immunizations to prevent a disease. In addition,
      other persons living in your house should not take oral polio vaccine since
      there is a chance they could pass the polio virus on to you. Also, avoid persons
      who have recently taken oral polio vaccine. Do not get close to them, and do
      not stay in the same room with them for very long. If you cannot take these
      precautions, you should consider wearing a protective face mask that covers
      the nose and mouth.
  - type: paragraph
    text: In some patients (usually younger patients), tenderness, swelling, or bleeding
      of the gums may appear soon after treatment with cyclosporine is started. Brushing
      and flossing your teeth, carefully and regularly, and massaging your gums may
      help prevent this. See your dentist regularly to have your teeth cleaned. Check
      with your medical doctor or dentist if you have any questions about how to take
      care of your teeth and gums, or if you notice any tenderness, swelling, or bleeding
      of your gums.
  - type: paragraph
    text: This medicine may cause dizziness, confusion, or sleepiness. Do not drive
      or do anything else that could be dangerous until you know how this medicine
      affects you.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blurred vision
      - chest pain
      - chills
      - clay colored stools
      - cloudy urine
      - cough
      - dark urine
      - decrease in urine output or decrease in urine-concentrating ability
      - decreased appetite
      - dizziness
      - fever
      - headache
      - itching
      - loss of appetite
      - nausea and vomiting
      - nervousness
      - painful or difficult urination
      - pounding in the ears
      - shakiness in the legs, arms, hands, or feet
      - skin rash
      - slow or fast heartbeat
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach pain
      - swelling of the feet or lower legs
      - swollen glands
      - trembling or shaking of the hands or feet
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - yellow eyes or skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - blood in the urine
      - blood in the vomit
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chest tightness
      - difficulty swallowing
      - hives
      - pale skin
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - seizures
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating
      - chest discomfort
      - constipation
      - darkened urine
      - hoarseness
      - indigestion
      - lower back or side pain
      - night sweats
      - pain or discomfort in the arms, jaw, back, or neck
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - sweating
      - vomiting of blood or material that looks like coffee grounds
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - drowsiness
      - headache, severe and throbbing
      - muscle spasms (tetany) or twitching
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, tender, or enlarged gums
      - blemishes on the skin
      - increased hair growth, especially on the face
      - pain or tenderness around the eyes and cheekbones
      - pimples
      - stomach discomfort
      - stuffy or runny nose
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Brittle fingernails
      - burning feeling in the chest or stomach
      - burning, dry, or itching eyes
      - continuing ringing or buzzing or other unexplained noise in the ears
      - cramps
      - discharge or excessive tearing
      - feeling of warmth
      - hearing loss
      - redness of the face, neck, arms, and occasionally, upper chest
      - redness, pain, swelling of the eye, eyelid, or inner lining of the eyelid
      - swelling of the breasts or breast soreness in both females and males
      - weight loss
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred or loss of vision
      - discouragement
      - disturbed color perception
      - double vision
      - fear or nervousness
      - feeling sad or empty
      - halos around lights
      - irritability
      - joint pain
      - loss of interest or pleasure
      - night blindness
      - overbright appearance of lights
      - tiredness
      - trouble concentrating
      - trouble sleeping
      - tunnel vision
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
      - weakness
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
