title: Cyclosporine (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: SandIMMUNE
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cyclosporine injection is used in combination with other medicines (eg,
      steroid medicines) to prevent the body from rejecting a transplanted organ (eg,
      kidney, liver, or heart). It belongs to a group of medicines known as immunosuppressive
      agents. When a patient receives an organ transplant, the body's white blood
      cells will try to get rid of (reject) the transplanted organ. Cyclosporine works
      by suppressing the immune system to prevent the white blood cells from trying
      to get rid of the transplanted organ.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of cyclosporine
        injection have not been performed in the pediatric population. However, no
        pediatric-specific problems have been documented to date.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of cyclosporine injection in the
        elderly. However, elderly patients are more likely to have high blood pressure
        or age-related kidney, liver, or heart problems, which may require caution
        and an adjustment in the dose for patients receiving cyclosporine injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bosentan
      - Colchicine
      - Dronedarone
      - Elagolix
      - Ezetimibe
      - Grazoprevir
      - Lercanidipine
      - Levoketoconazole
      - Mifepristone
      - Pitavastatin
      - Simvastatin
      - Sitaxsentan
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Abrocitinib
      - Acalabrutinib
      - Aceclofenac
      - Acemetacin
      - Adagrasib
      - Adalimumab
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Afatinib
      - Alefacept
      - Alfalfa
      - Alfentanil
      - Aliskiren
      - Alogliptin
      - Alpelisib
      - Alprazolam
      - Ambrisentan
      - Amifampridine
      - Amiloride
      - Amlodipine
      - Amphotericin B
      - Amprenavir
      - Amtolmetin Guacil
      - Apalutamide
      - Apazone
      - Apixaban
      - Aprepitant
      - Asciminib
      - Aspirin
      - Asunaprevir
      - Atogepant
      - Atorvastatin
      - Atrasentan
      - Avacopan
      - Azilsartan
      - Azilsartan Medoxomil
      - Azithromycin
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Bedaquiline
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acetazolamide
      - Allopurinol
      - Amiodarone
      - Amphotericin B Cholesteryl Sulfate Complex
      - Amphotericin B Lipid Complex
      - Amphotericin B Liposome
      - Chloramphenicol
      - Chloroquine
      - Cisapride
      - Clonidine
      - Colesevelam
      - Dalfopristin
      - Danazol
      - Dirithromycin
      - Famotidine
      - Furosemide
      - Glipizide
      - Glyburide
      - Imipenem
      - Josamycin
      - Metronidazole
      - Midazolam
      - Miokamycin
      - Norfloxacin
      - Oxypurinol
      - Probucol
      - Quinupristin
      - Repaglinide
      - Sulfadiazine
