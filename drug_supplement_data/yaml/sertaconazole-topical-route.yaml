title: Sertaconazole (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ertaczo
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Sertaconazole is used to treat infections caused by a fungus. It works by
      killing the fungus or yeast or preventing its growth. Sertaconazole is applied
      to your skin to treat athlete's foot (tinea pedis).
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Cream
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested in children and has not been shown to cause
        different side effects or problems than it does in adults. This medicine is
        to be used in children 12 years of age and older.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of topical
        sertaconazole in the elderly with use in other age groups, this medicine is
        not expected to cause different side effects or problems in older people than
        it does in younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use sertaconazole as directed by your doctor. Your hands should be washed
      after applying the medicine to the affected area(s) of your skin. Avoid contact
      with the eyes, nose, mouth and other mucus membranes. Sertaconazole is for external
      use only.
  - type: paragraph
    text: Dry the affected area(s) thoroughly before application, if you wish to use
      sertaconazole after bathing.
  - type: paragraph
    text: Use your medicine for the full treatment time recommended by your doctor,
      even though symptoms may have improved.
  - type: paragraph
    text: Avoid the use of bandages or gauze (occlusive dressings) unless otherwise
      directed by your doctor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (cream): For athlete''s foot: Adults—Apply enough
        sertaconazole to cover the affected and surrounding skin areas and rub in
        gently Children over the age of 12—Apply enough sertaconazole to cover the
        affected and surrounding skin areas and rub in gently'
    - type: list
      ordered: false
      items:
      - 'For athlete''s foot: Adults—Apply enough sertaconazole to cover the affected
        and surrounding skin areas and rub in gently Children over the age of 12—Apply
        enough sertaconazole to cover the affected and surrounding skin areas and
        rub in gently'
    - type: list
      ordered: false
      items:
      - Adults—Apply enough sertaconazole to cover the affected and surrounding skin
        areas and rub in gently
      - Children over the age of 12—Apply enough sertaconazole to cover the affected
        and surrounding skin areas and rub in gently
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Inform your doctor if the area of application shows signs of increased skin
      irritation, redness, itching, burning, blistering, swelling or oozing.
  - type: paragraph
    text: It is very important that you check with your doctor in 2 weeks if your
      symptoms are not improving or if your conditions become worse.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  subsections:
  - heading: Incidence unknown
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, burning, crusting, dryness or flaking of skin
      - itching, redness, skin rash, swelling, or soreness at application site
      - darkening of skin
      - dry skin
      - flushing and redness of skin
      - scaling, severe redness, soreness or swelling of skin
      - peeling or loosening of skin
      - skin tenderness
      - unusually warm skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
