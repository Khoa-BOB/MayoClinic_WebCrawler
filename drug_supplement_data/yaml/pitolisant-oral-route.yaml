        dose is usually not more than 35.6 mg per day. Children 6 years of age and
        older weighing less than 40 kg—At first, 4.45 mg (one tablet of 4.45 mg) once
        a day on Week 1. Your doctor may increase your dose to 8.9 mg (two tablets
        of 4.45 mg) once a day on Week 2. Then, your doctor may increase your dose
