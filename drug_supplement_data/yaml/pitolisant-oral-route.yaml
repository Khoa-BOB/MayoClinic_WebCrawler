      - Ceritinib
      - Cetirizine
      - Chloroquine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart rhythm problems (eg, arrhythmia, slow heartbeat), or history of or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood)—May increase risk for more serious
        side effects.
    - type: list
      ordered: false
      items:
      - Kidney disease, end stage—Use is not recommended in patients with this condition.
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate to severe or
      - Liver disease, moderate—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Should not be used in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. If you think this medicine is not working properly after you
      have taken it for several weeks, check with your doctor.
  - type: paragraph
    text: Take the tablet when you wake up in the morning.
  - type: paragraph
    text: Swallow the tablet whole. Do not crush, break, or chew it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For cataplexy caused by narcolepsy: Adults—At
        first, 8.9 milligrams (mg) (two tablets of 4.45 mg) once a day on Week 1.
        Your doctor may increase your dose to 17.8 mg (one tablet of 17.8 mg) once
        a day on Week 2. Then, your doctor may increase your dose to 35.6 mg (two
        tablets of 17.8 mg) once a day on Week 3. Your doctor may adjust your dose
        as needed and tolerated. However, the dose is usually not more than 35.6 mg
        per day. Children—Use and dose must be determined by your doctor. For excessive
        daytime sleepiness caused by narcolepsy: Adults—At first, 8.9 milligrams (mg)
        (two tablets of 4.45 mg) once a day on Week 1. Your doctor may increase your
        dose to 17.8 mg (one tablet of 17.8 mg) once a day on Week 2. Then, your doctor
        may increase your dose to 35.6 mg (two tablets of 17.8 mg) once a day on Week
        3. Your doctor may adjust your dose as needed and tolerated. However, the
        dose is usually not more than 35.6 mg per day. Children 6 years of age and
        older weighing 40 kilograms (kg) or more—At first, 4.45 mg (one tablet of
        4.45 mg) once a day on Week 1. Your doctor may increase your dose to 8.9 mg
        (two tablets of 4.45 mg) once a day on Week 2. Then, your doctor may increase
        your dose to 17.8 mg (one tablet of 17.8 mg) once a day on Week 3. Your doctor
        may increase your dose to 35.6 mg (two tablets of 17.8 mg) once a day on Week
