    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you missed a dose, take the next dose on the following day when you
        first wake up in the morning.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: This medicine does not take the place of getting enough sleep. It should
      not be used for occasional sleepiness that has not been diagnosed as narcolepsy.
      Ask your doctor for advice about good sleep habits.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you or anyone in your family has ever
      had a heart rhythm problem such as QT prolongation.
  - type: paragraph
    text: Birth control pills may not work while you are using pitolisant. To keep
      from getting pregnant, use another form of birth control during treatment and
      for at least 21 days after your last dose. Other forms of birth control include
      condoms, diaphragms, or contraceptive foams or jellies.
  - type: paragraph
    text: It is important to tell your doctor if you become pregnant. Your doctor
      may want you to join a pregnancy exposure registry for patients taking this
      medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in behavior
      - chest tightness
      - cough
      - difficulty swallowing
      - discouragement
      - feeling sad or empty
      - dizziness
      - fast or irregular heartbeat
      - fainting
      - hives, itching, skin rash
      - irritability
      - lack of appetite
      - loss of interest or pleasure
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - seizures
      - thoughts of killing oneself
      - trouble breathing
      - trouble concentrating
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - nausea
      - trouble sleeping
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - body aches or pain
      - burning, numbness, pain, or tingling in all fingers except smallest finger
      - chills
      - decreased appetite
      - difficulty in moving
      - dry mouth
      - ear congestion
      - fever
      - headache
      - loss of voice
      - muscle or joint pain
      - runny or stuffy nose
      - seeing, hearing, or feeling things that are not there
      - sneezing
      - sore throat
      - stomach pain or discomfort
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Weight gain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
