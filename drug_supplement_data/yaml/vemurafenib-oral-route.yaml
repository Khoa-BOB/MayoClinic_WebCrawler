    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bradycardia (slow heartbeat) or
      - Congenital long QT syndrome (abnormal heart rhythm) or
      - Congestive heart failure or
      - Mineral imbalance (eg, blood levels of potassium, calcium, magnesium) or
      - QT prolongation (abnormal heart rhythm) or
      - Skin cancer, history of—May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Eye problems (eg, iritis, uveitis) or
      - Kidney disease—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before using this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the tablet whole with a glass of water. Do not crush, break, or
      chew it.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: If you vomit after taking this medicine, do not take an extra dose. Wait
      and take your next dose at the normal time.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablet): For melanoma or Erdheim-Chester Disease: Adults—960
        milligrams (mg) (four 240 mg tablets) two times a day. The first dose should
        be taken in the morning, and the second dose in the evening. The 2 doses should
        be taken 12 hours apart. Your doctor may adjust your dose as needed and tolerated.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For melanoma or Erdheim-Chester Disease: Adults—960 milligrams (mg) (four
        240 mg tablets) two times a day. The first dose should be taken in the morning,
        and the second dose in the evening. The 2 doses should be taken 12 hours apart.
        Your doctor may adjust your dose as needed and tolerated. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—960 milligrams (mg) (four 240 mg tablets) two times a day. The first
        dose should be taken in the morning, and the second dose in the evening. The
        2 doses should be taken 12 hours apart. Your doctor may adjust your dose as
        needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is more than 4 hours before your next dose,
        take the tablet as soon as you can.
    - type: paragraph
      text: If you miss a dose and it is less than 4 hours until your next regular
        dose, skip the missed dose then take your next dose at the regular time.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests and an ECG (electrocardiogram)
      may be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control during treatment with this medicine and for
      2 weeks after the last dose. If you think you have become pregnant while using
      this medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may increase your risk of having new skin cancers such as
      cutaneous squamous cell carcinoma, keratoacanthoma, and melanoma. It may also
      cause other cancers like noncutaneous squamous cell carcinoma of the head and
      neck and myeloid neoplasm. This is more likely to occur if you are more than
      65 years of age, have too much sun exposure, or have a history of skin cancer.
      Your doctor may want to check for new skin lesions before treatment and every
      2 months while you are using this medicine.
  - type: paragraph
    text: This medicine may cause serious types of allergic reactions, including anaphylaxis
      and drug reaction with eosinophilia and systemic symptoms (DRESS syndrome).
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you have a rash, itching, hoarseness, lightheadedness
      or dizziness, trouble breathing, trouble swallowing, or any swelling of your
      hands, face, or mouth after using this medicine.
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Check with your doctor
      right away if you have blistering, peeling, or loosening of the skin, red skin
      lesions, severe acne or skin rash, sores or ulcers on the skin, or fever or
      chills with this medicine.
  - type: paragraph
    text: This medicine may cause changes to your heart rhythm, such as a condition
      called QT prolongation. Contact your doctor right away if you feel dizzy or
      faint, or have fast, pounding, or uneven heartbeats.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may make your skin more sensitive to sunlight. Use sunscreen
      or sunblock lotions and lip balms with a sun protection factor (SPF) of at least
      30 on a regular basis when you are outdoors. Wear protective clothing and hats
      and stay out of direct sunlight, especially between the hours of 10 AM and 3
      PM. Avoid sunlamps and tanning beds.
  - type: paragraph
    text: Check with your doctor right away if blurred vision, difficulty with reading,
      eye pain, or any other vision change occurs with this medicine. Your doctor
      may want an ophthalmologist (eye doctor) to check your eyes.
  - type: paragraph
    text: Kidney failure may occur while you are using this medicine. Tell your doctor
      right away if you have bloody urine, decrease in how much or how often you urinate,
      lower back or side pain, swelling of the face, fingers, or lower legs, trouble
      breathing, or weight gain.
  - type: paragraph
    text: This medicine may cause muscle, bone, and connective tissue disease (eg,
      Dupuytren's contracture or plantar fascial fibromatosis). Check with your doctor
      right away if you have unusual thickening of the palms of your hands with tightening
      of the fingers inward or unusual thickening of the soles which may be painful.
  - type: paragraph
    text: It is important to tell your doctor if you have had or are planning to receive
      radiation treatment while you are taking this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - bloody urine
      - blurred vision or other change in vision
      - chills
      - cough
      - decreased frequency or amount of urine
      - diarrhea
      - dizziness
      - eye pain
      - fainting
      - fast or irregular heartbeat
      - fever
      - increased sensitivity of the skin to sunlight
      - increased thirst
      - itching or skin rash
      - joint or muscle pain
      - loss of appetite
      - lower back or side pain
      - lump or growth on the skin
      - nausea
      - pain in the ankles or knees
      - painful, red lumps under the skin, mostly on the legs
      - paralysis of the nerves
      - rapid weight gain
      - rash with flat lesions or small raised lesions on the skin
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - redness or other discoloration of the skin
      - redness, soreness, swelling, or itching of the skin
      - scaling of the skin on the hands and feet
      - sensitivity of the eye to light
      - severe sunburn
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - sores, welts, or blisters
      - tearing
      - tingling of the hands and feet
      - tiredness
      - trouble breathing
      - ulceration of the skin
      - unusual tiredness or weakness
      - unusual weight gain or loss
      - vomiting
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back or bone pain
      - burning, itching, and pain in the hairy areas, or pus at the root of the hair
      - change in taste
      - cough
      - decreased appetite
      - decreased weight
      - difficulty having a bowel movement
      - difficulty with moving
      - dry skin
      - hair loss or thinning of the hair
      - headache
      - lack or loss of strength
      - loss of taste
      - muscle stiffness
      - pain in the arms or legs
      - sunburn
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
