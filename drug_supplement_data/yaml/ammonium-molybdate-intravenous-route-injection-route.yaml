title: Ammonium molybdate (intravenous route, injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Molypen
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: The body needs molybdenum for normal growth and health. For patients who
      are unable to get enough molybdenum in their regular diet or who have a need
      for more molybdenum, molybdenum supplements may be necessary. They are generally
      taken by mouth in multivitamin/mineral products but some patients may have to
      receive them by injection. Molybdenum is part of certain enzymes that are important
      for several body functions.
  - type: paragraph
    text: A deficiency of molybdenum is rare. However, if the body does not get enough
      molybdenum, certain enzymes needed by the body are affected. This may lead to
      a build up of unwanted substances in some people.
  - type: paragraph
    text: Injectable molybdenum is administered only by or under the supervision of
      your health care professional.
  subsections:
  - heading: Importance Of Diet
    level: 3
    content:
    - type: paragraph
      text: For good health, it is important that you eat a balanced and varied diet.
        Follow carefully any diet program your health care professional may recommend.
        For your specific dietary vitamin and/or mineral needs, ask your health care
        professional for a list of appropriate foods. If you think that you are not
        getting enough vitamins and/or minerals in your diet, you may choose to take
        a dietary supplement.
    - type: paragraph
      text: The amount of molybdenum in foods depends on the soil in which the food
        is grown. Some soils have more molybdenum than others. Peas, beans, cereal
        products, leafy vegetables, and low-fat milk are good sources of molybdenum.
    - type: paragraph
      text: The daily amount of molybdenum needed is defined in several different
        ways.
    subsections: []
  - heading: For U.S.—
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Recommended Dietary Allowances (RDAs) are the amount of vitamins and minerals
        needed to provide for adequate nutrition in most healthy persons. RDAs for
        a given nutrient may vary depending on a person's age, sex, and physical condition
        (e.g., pregnancy).
      - Daily Values (DVs) are used on food and dietary supplement labels to indicate
        the percent of the recommended daily amount of each nutrient that a serving
        provides. DV replaces the previous designation of United States Recommended
        Daily Allowances (USRDAs).
    subsections: []
  - heading: For Canada—
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Recommended Nutrient Intakes (RNIs) are used to determine the amounts of vitamins,
        minerals, and protein needed to provide adequate nutrition and lessen the
        risk of chronic disease.
    - type: paragraph
      text: 'Because a lack of molybdenum is rare, there is no RDA or RNI for it.
        The following daily intakes are thought to be plenty for most individuals:'
    - type: list
      ordered: false
      items:
      - 'Infants and children— Birth to 3 years of age: 15 to 50 micrograms (mcg).
        4 to 6 years of age: 30 to 75 mcg. 7 to 10 years of age: 50 to 150 mcg.'
      - Adolescents and adults—75 to 250 mcg.
    - type: list
      ordered: false
      items:
      - 'Birth to 3 years of age: 15 to 50 micrograms (mcg).'
      - '4 to 6 years of age: 30 to 75 mcg.'
      - '7 to 10 years of age: 50 to 150 mcg.'
    subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'If you are taking this dietary supplement without a prescription, carefully
      read and follow any precautions on the label. For this supplement, the following
      should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Problems in children have not been reported with intake of normal daily
        recommended amounts.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Problems in older adults have not been reported with intake of normal
        daily recommended amounts.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this dietary
        supplement. Make sure you tell your doctor if you have any other medical problems,
        especially:'
    - type: list
      ordered: false
      items:
      - Copper deficiency—Molybdenum may make this condition worse
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—These conditions may cause higher blood levels of molybdenum,
        which may increase the chance of unwanted effects
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Molybdenum is available orally only as part of a multivitamin/mineral product.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (as part of a multivitamin/mineral supplement): To prevent
        deficiency, the amount taken by mouth is based on normal daily recommended
        intakes: Adults and teenagers—75 to 250 micrograms (mcg) per day. Children
        7 to 10 years of age—50 to 150 mcg per day. Children 4 to 6 years of age—30
        to 75 mcg per day. Children birth to 3 years of age—15 to 150 mcg per day.
        To treat deficiency: Adults, teenagers, and children—Treatment dose is determined
        by prescriber for each individual based on severity of deficiency.'
    - type: list
      ordered: false
      items:
      - 'To prevent deficiency, the amount taken by mouth is based on normal daily
        recommended intakes: Adults and teenagers—75 to 250 micrograms (mcg) per day.
        Children 7 to 10 years of age—50 to 150 mcg per day. Children 4 to 6 years
        of age—30 to 75 mcg per day. Children birth to 3 years of age—15 to 150 mcg
        per day.'
      - 'To treat deficiency: Adults, teenagers, and children—Treatment dose is determined
        by prescriber for each individual based on severity of deficiency.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—75 to 250 micrograms (mcg) per day.
      - Children 7 to 10 years of age—50 to 150 mcg per day.
      - Children 4 to 6 years of age—30 to 75 mcg per day.
      - Children birth to 3 years of age—15 to 150 mcg per day.
    - type: list
      ordered: false
      items:
      - Adults, teenagers, and children—Treatment dose is determined by prescriber
        for each individual based on severity of deficiency.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Do not refrigerate. Keep from freezing.
    - type: paragraph
      text: Store the dietary supplement in a closed container at room temperature,
        away from heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Large amounts of molybdenum may cause your body to lose copper. Your health
      care professional may recommend that you take a copper supplement while on molybdenum
      therapy.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: paragraph
      text: 'Note: Reported rarely in individuals consuming foods grown in soil containing
        a high content of molybdenum.'
    - type: list
      ordered: false
      items:
      - Joint pain
      - side, lower back, or stomach pain
      - swelling of feet or lower legs
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
