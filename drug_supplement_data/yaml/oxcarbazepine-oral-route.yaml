        dose as needed. Children younger than 4 years of age—Use and dose must be
        determined by your doctor. For patients who are not taking any seizure medicine:
        Adults and children 17 years of age and older—At first, 300 milligrams (mg)
        2 times a day. Your doctor may adjust your dose as needed. However, the dose
        is usually not more than 1200 mg per day. Children 4 to 16 years of age—Dose
