title: Oxcarbazepine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Trileptal
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Oxcarbazepine is used alone or together with other medicines in the treatment
      of epilepsy to control partial seizures. It works in the brain to prevent seizures.
      However, this medicine will not cure epilepsy and will only control seizures
      for as long as you continue to take it.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Extended Release
    - Suspension
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of oxcarbazepine suspension or tablets
        alone in children 4 years of age and older. Safety and efficacy have not been
        established in children younger than 4 years of age.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of oxcarbazepine suspension or tablets
        together with other medicines in children 2 years of age and older. Safety
        and efficacy have not been established in children younger than 2 years of
        age.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of oxcarbazepine extended-release
        tablets in children 6 years of age and older. However, use of the extended-release
        tablets is not recommended in children younger than 6 years of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of oxcarbazepine in the elderly.
        However, elderly patients are more likely to have age-related kidney problems,
        which may require caution and an adjustment in the dose for patients receiving
        oxcarbazepine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Cabotegravir
      - Doravirine
      - Phenelzine
      - Ranolazine
      - Rilpivirine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alfentanil
      - Amiodarone
      - Amlodipine
      - Apixaban
      - Atazanavir
      - Atogepant
      - Belzutifan
      - Benzhydrocodone
      - Bictegravir
      - Buprenorphine
      - Calcifediol
      - Carbamazepine
      - Cariprazine
      - Cilostazol
      - Citalopram
      - Cobicistat
      - Codeine
      - Cyclosporine
      - Daclatasvir
      - Darunavir
      - Desogestrel
      - Dienogest
      - Dihydrocodeine
      - Diltiazem
      - Dolutegravir
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Dronedarone
      - Drospirenone
      - Elvitegravir
      - Enzalutamide
      - Estetrol
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Etonogestrel
      - Fentanyl
      - Fexinidazole
      - Fosphenytoin
      - Gestodene
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Clopidogrel
      - Felodipine
      - Ginkgo
      - Lamotrigine
      - Ospemifene
      - Simvastatin
      - Valproic Acid
      - Verapamil
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Depression or
      - Hyponatremia (low sodium in the blood)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use is not recommended in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Take the oral liquid or tablet with or without food. Take the extended-release
      tablet on an empty stomach, at least 1 hour before or 2 hours after a meal.
  - type: paragraph
    text: Swallow the extended-release tablet whole. Do not crush, break, or chew
      it.
  - type: paragraph
    text: 'For the oral liquid :'
  - type: list
    ordered: false
    items:
    - Measure your dose with a marked measuring spoon, oral syringe, or medicine cup.
      The average household teaspoon may not hold the right amount of liquid.
    - Shake the bottle for at least 10 seconds before each use.
    - Remove the child-resistant cap by pushing it down firmly and turning counterclockwise.
    - Hold the bottle upright and push the plastic adapter firmly into the neck of
      the bottle. Replace the cap to make sure that the adapter has been fully forced
      into the neck of the bottle.
    - Push the syringe firmly into the plastic adapter. Hold the syringe in place
      and turn the bottle upside down.
    - Slowly pull the plunger out until the top edge of the plunger is on the prescribed
      dose. Slowly turn the bottle upright. Remove the syringe by gently twisting
      it out of the plastic adapter.
    - If you mix the medicine with water, add some water to a glass. Push in the plunger
      on the syringe all the way to empty all the medicine into the glass. Stir the
      medicine in the water and drink or give it all.
    - If you use the syringe to give or take the medicine, the person must sit upright.
      Push the plunger slowly to let the person swallow the medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets): For seizures: For patients
        taking oxcarbazepine alone or together with other medicines: Adults—At first,
        600 milligrams (mg) once a day for 1 week. Your doctor may adjust your dose
        in the following weeks as needed. However, the dose is usually not more than
        2400 mg per day. Older adults—At first, 300 or 450 mg once a day. Your doctor
        may adjust your dose as needed. Children 6 to 16 years of age—Dose is based
        on body weight and must be determined by your doctor. The starting dose is
        8 to 10 milligrams (mg) per kilogram (kg) of body weight per day as a single
        dose. Your doctor may adjust your dose as needed. However, the dose is usually
        not more than 1800 mg per day. Children younger than 6 years of age—Use is
        not recommended.'
      - 'For oral dosage forms (suspension and tablets): For seizures: For patients
        taking oxcarbazepine together with other medicines: Adults and children 17
        years of age and older—At first, 300 milligrams (mg) 2 times a day. Your doctor
        may adjust your dose as needed. However, the dose is usually not more than
        1200 mg per day. Children 4 to 16 years of age—Dose is based on body weight
        and must be determined by your doctor. The starting dose is 8 to 10 milligrams
        (mg) per kilogram (kg) of body weight per day, divided into 2 doses. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than 600 mg per day, divided into 2 equal doses. Children 2 to 4 years of
        age—Dose is based on body weight and must be determined by your doctor. The
        starting dose is 8 to 10 mg per kg of body weight per day, divided into 2
        doses. For patients weighing less than 20 kg, the starting dose is 16 to 20
        mg per kg of body weight per day, divided in 2 doses. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 600 mg per
        day, divided into 2 equal doses. Children younger than 2 years of age—Use
        and dose must be determined by your doctor. For patients switching from another
        medicine to oxcarbazepine: Adults and children 17 years of age and older—At
        first, 300 milligrams (mg) 2 times a day. Your doctor may adjust your dose
        as needed. However, the dose is usually not more than 2400 mg per day. Children
        4 to 16 years of age—Dose is based on body weight and must be determined by
