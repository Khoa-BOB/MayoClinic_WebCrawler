    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the oral liquid in the original container. Use the liquid within
        7 weeks after opening the bottle for the first time. Throw away any unused
        liquid.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you or your child's progress
      at regular visits . This is to make sure the medicine is working properly and
      to allow for changes in your dose. Blood tests will also be needed to check
      for unwanted effects.
  - type: paragraph
    text: Tell your doctor if you become pregnant while using this medicine. Your
      doctor may need you to be monitored carefully during your pregnancy and after
      giving birth.
  - type: paragraph
    text: Hyponatremia (low sodium in the blood) may occur while you are using this
      medicine. Check with your doctor right away if you or your child develop confusion,
      decreased urine output, dizziness, fast or irregular heartbeat, headache, muscle
      pain or cramps, nausea or vomiting, weakness, or swelling of the face, ankles,
      or hands while using this medicine.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Call your doctor right away if you or your child have itching, hives,
      hoarseness, trouble breathing or swallowing, or any swelling of your face, eyes,
      lips, tongue, arms, or legs while you are using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have a fever, rash, swollen, painful,
      or tender lymph glands in the neck, armpit, or groin, unusual bleeding or bruising,
      or yellow eyes or skin. These may be symptoms of a serious and life-threatening
      allergic reaction called drug reaction with eosinophilia and systemic symptoms
      (DRESS) or multiorgan hypersensitivity.
  - type: paragraph
    text: Serious skin reactions (eg, Stevens-Johnson syndrome, toxic epidermal necrolysis)
      can occur with this medicine. Check with your doctor right away if you or your
      child have blistering, peeling, or loosening of the skin, red skin lesions,
      severe acne or skin rash, sores or ulcers on the skin, or fever or chills while
      you are using this medicine.
  - type: paragraph
    text: This medicine may cause some people to be agitated, irritable, or display
      other abnormal behaviors. It may also cause some people to have suicidal thoughts
      and tendencies or to become more depressed. If you, your child, or your caregiver
      notice any of these side effects, tell your doctor or your child's doctor right
      away.
  - type: paragraph
    text: Do not stop using this medicine suddenly without talking first to your doctor
      . You may need to slowly decrease your dose before stopping it completely.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, drowsy, lightheaded,
      clumsy, unsteady, or less alert than they are normally. Do not drive or do anything
      else that could be dangerous until you know how this medicine affects you .
  - type: paragraph
    text: This medicine can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. If you can, avoid people
      with infections. Check with your doctor immediately if you think you or your
      child have a fever or chills, cough or hoarseness, lower back or side pain,
      or painful or difficult urination.
  - type: paragraph
    text: This medicine may increase the effects of alcohol and other central nervous
      system (CNS) depressants (medicines that make you drowsy or less alert). Some
      examples of CNS depressants are antihistamines or medicine for allergies or
      colds, sedatives, tranquilizers, or sleeping medicine, prescription pain medicine
      or narcotics, medicine for seizures or barbiturates, muscle relaxants, or anesthetics,
      including some dental anesthetics. Check with your doctor before taking any
      of the above while you are using this medicine .
  - type: paragraph
    text: Birth control pills containing estrogen may not work properly if you take
      them while you are taking oxcarbazepine. Unplanned pregnancies may occur. Use
      a different or additional means of birth control while you are taking this medicine.
      If you have any questions about this, check with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in vision
      - change in walking or balance
      - clumsiness or unsteadiness
      - cough
      - crying
      - dizziness
      - double vision
      - false sense of well-being
      - feeling of constant movement of self or surroundings
      - fever
      - mental depression
      - sensation of spinning
      - sneezing
      - sore throat
      - uncontrolled back-and-forth or rolling eye movements
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - awkwardness
      - bloody or cloudy urine
      - blurred vision
      - bruising
      - chest tightness
      - confusion about identity, place, and time
      - decreased urination
      - difficulty with focusing the eyes
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
