title: Estazolam (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Prosom
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Estazolam is used to treat insomnia (trouble with sleeping). This medicine
      is for short-term use only, usually 7 to 10 days. Estazolam is a benzodiazepine.
      Benzodiazepines belong to the group of medicines called central nervous system
      (CNS) depressants, which are medicines that slow down the nervous system.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of estazolam in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of estazolam in the elderly. However,
        severe drowsiness, dizziness, confusion, clumsiness, or unsteadiness are more
        likely to occur in the elderly, which may require an adjustment in the dose
        for patients receiving estazolam.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alfentanil
      - Alprazolam
      - Amobarbital
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Benzhydrocodone
      - Bromazepam
      - Bromopride
      - Buprenorphine
      - Butabarbital
      - Butalbital
      - Butorphanol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Carisoprodol
      - Cetirizine
      - Chloral Hydrate
      - Chlorzoxazone
      - Clobazam
      - Clomipramine
      - Clonazepam
      - Cobicistat
      - Codeine
      - Cyclobenzaprine
      - Cyproheptadine
      - Dantrolene
      - Daridorexant
      - Desflurane
      - Dexmedetomidine
      - Diazepam
      - Dihydrocodeine
      - Doxepin
      - Doxylamine
      - Esketamine
      - Ethchlorvynol
      - Fentanyl
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Rifapentine
      - St John's Wort
      - Theophylline
      - Tizanidine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol or drug abuse or dependence, or history of, or
      - Breathing problems or lung disease, severe or
      - Depression, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. If too much of this medicine is taken for a long time, it may
      become habit-forming (causing mental or physical dependence).
  - type: paragraph
    text: Take estazolam just before going to bed, when you are ready to go to sleep.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For insomnia: Adults—At first, 1 milligram
        (mg) at bedtime. Your doctor may adjust your dose if needed. Older adults—At
        first, 0.5 milligram (mg) at bedtime. Your doctor may adjust your dose if
        needed. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For insomnia: Adults—At first, 1 milligram (mg) at bedtime. Your doctor may
        adjust your dose if needed. Older adults—At first, 0.5 milligram (mg) at bedtime.
        Your doctor may adjust your dose if needed. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 1 milligram (mg) at bedtime. Your doctor may adjust your
        dose if needed.
      - Older adults—At first, 0.5 milligram (mg) at bedtime. Your doctor may adjust
        your dose if needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: Use this medicine only when you cannot sleep. You do not need to keep
        a regular dosage schedule for taking it.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using this medicine, tell your doctor right away.
      Do not breastfeed while you are using this medicine.
  - type: paragraph
    text: Do not take itraconazole (Sporanox®) or ketoconazole (Nizoral®) while you
      are using this medicine. Taking these medicines together with estazolam may
      increase the chance of serious side effects.
  - type: paragraph
    text: This medicine may be habit-forming. If you feel that the medicine is not
      working as well, do not use more than your prescribed dose. Call your doctor
      for instructions.
  - type: paragraph
    text: This medicine may cause some people, especially older persons, to become
      drowsy, dizzy, or less alert than they are normally. Even though estazolam is
      taken at bedtime, it may cause some people to feel drowsy or less alert the
      next morning. Make sure you know how you react to estazolam before you drive,
      use machines, or do anything else that could be dangerous if you are dizzy,
      not alert, or not able to think or see well .
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Check
      with your doctor right away if you have a rash, itching, hoarseness, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      while you are using this medicine.
  - type: paragraph
    text: 'Symptoms of an overdose include: change in consciousness, difficult or
      trouble breathing, difficulty with coordination, irregular, fast or slow, or
      shallow breathing, loss of consciousness, mood or mental changes, pale or blue
      lips, fingernails, or skin, sleepiness or unusual drowsiness, or slurred speech
      . Call your doctor right away if you notice these symptoms.'
  - type: paragraph
    text: If you develop any unusual or strange thoughts and behavior while taking
      estazolam, be sure to discuss it with your doctor. Some changes that have occurred
      in people taking this medicine are like those seen in people who drink too much
      alcohol. Other changes might be confusion, worsening of depression, hallucinations
      (seeing, hearing, or feeling things that are not there), suicidal thoughts,
      and unusual excitement, nervousness, or irritability.
  - type: paragraph
    text: This medicine may cause sleep-related behaviors including driving a car
      (sleep-driving), walking (sleep-walking), having sex, making phone calls, or
      preparing and eating food while you are asleep or not fully awake. If these
      reactions occur, tell your doctor right away.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that slow down the nervous system, possibly causing drowsiness).
      Some examples of CNS depressants are antihistamines or medicine for hay fever,
      other allergies, or colds, sedatives, tranquilizers, or sleeping medicine, prescription
      pain medicine or narcotics, barbiturates (used for seizures), muscle relaxants,
      or anesthetics (numbing medicines), including some dental anesthetics. This
      effect may last for a few days after you stop taking this medicine. Check with
      your doctor before taking any of the above while you are using this medicine
      .
  - type: paragraph
    text: Do not stop taking this medicine without checking with your doctor first
      . Your doctor may want you to gradually reduce the amount you are using before
      stopping it completely. This may help prevent a worsening of your condition
      and reduce the possibility of withdrawal symptoms, including hallucinations,
      seizures, stomach or muscle cramps, tremors, or unusual behavior.
  - type: paragraph
    text: Avoid smoking while you are using this medicine.
  - type: paragraph
    text: If your condition does not improve within 7 to 10 days, or if it becomes
      worse, check with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Absence of or decrease in body movement
      - clumsiness or unsteadiness
      - dizziness
      - sleepiness or unusual drowsiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
