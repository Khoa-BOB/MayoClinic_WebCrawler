title: Zanubrutinib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Brukinsa
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Zanubrutinib is used to treat mantle cell lymphoma (MCL) in patients who
      have received at least one previous treatment for their cancer. This medicine
      is also used to treat Waldenström macroglobulinemia (WM). It is also used to
      treat marginal zone lymphoma (MZL) that has come back (relapsed) or did not
      respond to the treatment (refractory) in patients who have received at least
      one previous treatment (eg, anti-CD20-based treatment). This medicine is also
      used to treat chronic lymphocytic leukemia (CLL) or small lymphocytic lymphoma
      (SLL).
  - type: paragraph
    text: Zanubrutinib is also used in combination with obinutuzumab to treat follicular
      lymphoma (FL) that has come back or did not respond to the treatment in patients
      who have received at least 2 previous treatments.
  - type: paragraph
    text: Zanubrutinib is an antineoplastic agent (cancer medicine). It interferes
      with the growth of cancer cells, which are eventually destroyed by the body.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of zanubrutinib in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of zanubrutinib in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Colchicine
      - Dengue Tetravalent Vaccine, Live
      - Levoketoconazole
      - Measles Virus Vaccine, Live
      - Mifepristone
      - Mumps Virus Vaccine, Live
      - Ranolazine
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adagrasib
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Amlodipine
      - Apalutamide
      - Aprepitant
      - Asciminib
      - Atazanavir
      - Atogepant
      - Avacopan
      - Belzutifan
      - Berotralstat
      - Boceprevir
      - Bosentan
      - Cannabidiol
      - Carbamazepine
      - Cariprazine
      - Ceritinib
      - Cholera Vaccine
      - Ciprofloxacin
      - Clarithromycin
      - Cobicistat
      - Conivaptan
      - Crizotinib
      - Cyclosporine
      - Dabigatran Etexilate
      - Dabrafenib
      - Daridorexant
      - Diltiazem
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Dronedarone
      - Ebola Zaire Vaccine, Live
      - Efavirenz
      - Enasidenib
      - Encorafenib
      - Ensartinib
      - Enzalutamide
      - Erythromycin
      - Ethinyl Estradiol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Heart rhythm problems (eg, atrial fibrillation, atrial flutter) or
      - Hypertension (high blood pressure) or
      - Liver disease—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Infection (eg, hepatitis B, herpes simplex, pneumonia)—May decrease your body's
        ability to fight an infection.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before using this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the capsule whole with a glass of water. Do not open, crush, break,
      or chew it.
  - type: paragraph
    text: Swallow the tablet whole with a glass of water. Do not chew or crush it.
      Your doctor may tell you to split the tablet in half if needed.
  - type: paragraph
    text: You may take this medicine with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules and tablets): For mantle cell lymphoma, Waldenström
        macroglobulinemia, marginal zone lymphoma, chronic lymphocytic leukemia (CLL),
        small lymphocytic lymphoma (SLL), and follicular lymphoma (FL): Adults—The
        usual dose is 160 milligrams (mg) 2 times a day or 320 mg once a day. Your
        doctor may adjust your dose as needed and tolerated. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For mantle cell lymphoma, Waldenström macroglobulinemia, marginal zone lymphoma,
        chronic lymphocytic leukemia (CLL), small lymphocytic lymphoma (SLL), and
        follicular lymphoma (FL): Adults—The usual dose is 160 milligrams (mg) 2 times
        a day or 320 mg once a day. Your doctor may adjust your dose as needed and
        tolerated. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—The usual dose is 160 milligrams (mg) 2 times a day or 320 mg once
        a day. Your doctor may adjust your dose as needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you can get pregnant, your doctor may give you a pregnancy test before you start
      using this medicine to make sure you are not pregnant. Female patients should
      use an effective form of birth control during treatment and for 1 week after
      the last dose. Male patients should use an effective form of birth control during
      treatment and for 1 week after the last dose to prevent pregnancy in a sexual
      partner. If you think a pregnancy has occurred with this medicine, tell your
      doctor right away.
  - type: paragraph
    text: This medicine may cause bleeding problems. Check with your doctor right
      away if you have bloody or black, tarry stools, red or dark brown urine, severe
      stomach pain, unusual bleeding, bruising, or weakness, or vomiting of blood
      or material that looks like coffee grounds.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      and after having surgery.
  - type: paragraph
    text: Zanubrutinib may lower the number of some types of blood cells in your body.
      Because of this, you may bleed or get infections more easily. To help with these
      problems, avoid being near people who are sick or have infections. Wash your
      hands often. Stay away from rough sports or other situations where you could
      be bruised, cut, or injured. Brush and floss your teeth gently. Be careful when
      using sharp objects, including razors and fingernail clippers.
  - type: paragraph
    text: Using this medicine may increase your risk of getting new cancers, including
      skin cancer. Avoid sun exposure. Use a sunscreen when you are outdoors. Avoid
      sunlamps and tanning beds.
  - type: paragraph
    text: This medicine may cause heart rhythm problems (eg, atrial flutter, atrial
      fibrillation). Check with your doctor right away if you have a fast or irregular
      heartbeat, trouble breathing, lightheadedness, dizziness, or fainting.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem (eg, drug-induced liver injury).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bladder pain
      - bleeding gums
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - bloody or cloudy urine
      - blurred vision
      - body aches or pain
      - chest pain or tightness
      - chills
      - cough
      - coughing up blood
      - decreased urine
      - difficult, burning, or painful urination
      - difficulty in breathing or swallowing
      - dizziness
      - dry mouth
      - ear congestion
      - fast, slow, or irregular heartbeat
      - fever
      - frequent urge to urinate
      - headache
      - increased menstrual flow or vaginal bleeding
      - increased thirst
      - large, flat, blue, or purplish patches in the skin
      - loss of appetite
      - loss of voice
      - lower back or side pain
      - mood changes
      - muscle pain or cramps
      - nausea or vomiting
      - nervousness
      - nosebleeds
      - numbness or tingling in the hands, feet, or lips
      - painful or difficult urination
      - pale skin
      - paralysis
      - pinpoint red spots on the skin
      - pounding in the ears
      - prolonged bleeding from cuts
      - runny or stuffy nose
      - seizures
      - sneezing
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swollen glands
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - unusual weight gain or loss
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dark urine
      - stomach pain, severe
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - diarrhea
      - rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
