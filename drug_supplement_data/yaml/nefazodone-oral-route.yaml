title: Nefazodone (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Serzone
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Nefazodone is used to treat mental depression.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on nefazodone have been done only in adult patients, and there
        is no specific information comparing use of this medicine in children up to
        18 years of age with use in other age groups.
    - type: paragraph
      text: Nefazodone must be used with caution in children with depression. Studies
        have shown occurrences of children thinking about suicide or attempting suicide
        in clinical trials for this medicine. More study is needed to be sure nefazodone
        is safe and effective in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: The relationship of age to the effects of nefazodone has not been systematically
        studied in older people. However, blood levels of nefazodone have been found
        to be higher in older patients. An older adult may require a lower dose of
        nefazodone than a younger adult.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Alprazolam
      - Astemizole
      - Bromopride
      - Carbamazepine
      - Cisapride
      - Colchicine
      - Conivaptan
      - Dihydroergotamine
      - Dronedarone
      - Eletriptan
      - Eplerenone
      - Ergoloid Mesylates
      - Ergonovine
      - Ergotamine
      - Finerenone
      - Flibanserin
      - Furazolidone
      - Gepirone
      - Isavuconazole
      - Isavuconazonium
      - Isocarboxazid
      - Ivabradine
      - Lisuride
      - Lomitapide
      - Lonafarnib
      - Lovastatin
      - Lurasidone
      - Metergoline
      - Methylergonovine
      - Methysergide
      - Metoclopramide
      - Naloxegol
      - Nicergoline
      - Nimodipine
      - Pacritinib
      - Phenelzine
      - Pimozide
      - Ranolazine
      - Safinamide
      - Silodosin
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abciximab
      - Acalabrutinib
      - Aceclofenac
      - Acemetacin
      - Adagrasib
      - Ado-Trastuzumab Emtansine
      - Alfentanil
      - Almotriptan
      - Amiodarone
      - Amitriptyline
      - Amlodipine
      - Amoxapine
      - Amphetamine
      - Amtolmetin Guacil
      - Apalutamide
      - Apixaban
      - Aprepitant
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Asciminib
      - Aspirin
      - Atogepant
      - Atorvastatin
      - Avacopan
      - Avanafil
      - Avapritinib
      - Axitinib
      - Azathioprine
      - Bedaquiline
      - Benzhydrocodone
      - Benzphetamine
      - Bictegravir
      - Bosutinib
      - Brentuximab Vedotin
      - Brexpiprazole
      - Brigatinib
      - Bromfenac
      - Bromocriptine
      - Budesonide
      - Bufexamac
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Buspirone
      - Foxglove
      - Ginkgo
      - Methylprednisolone
      - Pravastatin
      - Ritonavir
      - St John's Wort
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Convulsions (seizures) (history of)—The risk of seizures may be increased
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Hypovolemia (low blood volume)—May increase the chance that low blood pressure
        (hypotension) will occur
    - type: list
      ordered: false
      items:
      - Heart disease or
      - Stroke (or history of)—Nefazodone may make these conditions worse by causing
        low blood pressure (hypotension)
    - type: list
      ordered: false
      items:
      - Liver function problems—If your liver does not function well, due to liver
        problems or liver disease and you take nefazodone, the amount of nefazodone
        in your blood may be too high. This may cause serious disease or damage in
        your liver.
    - type: list
      ordered: false
      items:
      - Liver function problems when taking this medicine before and you had to stop
        taking it—You may have a greater chance of having liver problems if you take
        nefazodone again. Tell your doctor immediately if you have taken this medicine
        before.
    - type: list
      ordered: false
      items:
      - Mania (a type of mental illness) (history of)—Nefazodone may cause this problem
        to recur
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor. Do not take more or
      less of it and do not take it more or less often than your doctor ordered.
  - type: paragraph
    text: Sometimes this medicine must be taken for several weeks before you begin
      to feel better.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For mental depression: Adults (18 years of
        age and older)—To start, 200 milligrams (mg) a day, divided into two doses.
        Your doctor may increase the dose if needed. Older adults—To start, 100 mg
        a day, divided into two doses. Your doctor may increase the dose if needed.
        Children up to 18 years of age—Use and dose must be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - 'For mental depression: Adults (18 years of age and older)—To start, 200 milligrams
        (mg) a day, divided into two doses. Your doctor may increase the dose if needed.
        Older adults—To start, 100 mg a day, divided into two doses. Your doctor may
        increase the dose if needed. Children up to 18 years of age—Use and dose must
        be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - Adults (18 years of age and older)—To start, 200 milligrams (mg) a day, divided
        into two doses. Your doctor may increase the dose if needed.
      - Older adults—To start, 100 mg a day, divided into two doses. Your doctor may
        increase the dose if needed.
      - Children up to 18 years of age—Use and dose must be determined by the doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      allow dosage adjustments and to help reduce side effects.
  - type: paragraph
    text: Do not take astemizole, cisapride, pimozide, or terfenadine while you are
      taking nefazodone. If you do, you may develop a very serious change in the rhythm
      of your heartbeat.
  - type: paragraph
    text: Do not take carbamazepine while you are taking nefazodone. It may cause
      the medicine to not work or to not work as well.
  - type: paragraph
    text: This medicine may cause serious problems with your liver. Call your doctor
      right away for any of the following problems. Abdominal pain, nausea, vomiting,
      yellow eyes or skin, dark colored urine, light-colored stools, feeling very
      tired or weak
  - type: paragraph
    text: Do not take a monoamine oxidase (MAO) inhibitor (furazolidone, phenelzine,
      procarbazine, selegiline, tranylcypromine) while you are taking or less than
      7 days after taking nefazodone. Do not take nefazodone less than 14 days after
      taking an MAO inhibitor. If you do, you may develop convulsions (seizures),
      extremely high fever, or other serious unwanted effects.
  - type: paragraph
    text: Nefazodone may cause some people to be agitated, irritable or display other
      abnormal behaviors. It may also cause some people to have suicidal thoughts
      and tendencies or to become more depressed. If you or your caregiver notice
      any of these adverse effects, tell your doctor right away.
  - type: paragraph
    text: This medicine may add to the effects of alcohol and other central nervous
      system (CNS) depressants (medicines that make you drowsy or less alert). Some
      examples of CNS depressants are antihistamines or medicine for hay fever, other
      allergies, or colds; sedatives, tranquilizers, or sleeping medicine; prescription
      pain medicine or narcotics; barbiturates; medicine for seizures; muscle relaxants;
      or anesthetics, including some dental anesthetics. Check with your doctor before
      taking any of the above while you are using this medicine.
  - type: paragraph
    text: This medicine may cause some people to become dizzy or drowsy, or to have
      blurred vision or other vision changes. Make sure you know how you react to
      this medicine before you drive, use machines, or do other jobs that require
      you to be alert and able to see well.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up from a lying or sitting position. Getting up slowly may help. If this problem
      continues or gets worse, check with your doctor.
  - type: paragraph
    text: This medicine may cause dryness of the mouth. For temporary relief, use
      sugarless gum or candy, melt bits of ice in your mouth, or use a saliva substitute.
      However, if your mouth feels dry for more than 2 weeks, check with your medical
      doctor or dentist. Continuing dryness of the mouth may increase the chance of
      dental disease, including tooth decay, gum disease, and fungus infections.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision or other changes in vision
      - clumsiness or unsteadiness
      - lightheadedness or fainting
      - ringing in the ears
      - skin rash or itching
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy
      - cough or hoarseness
      - diarrhea
      - excessive muscle tone
      - eye pain
      - feeling dizzy
      - frequent urge to urinate
      - itching of the vagina or genital area
      - muscle stiffness
      - muscle tension or tightness
      - nausea
      - pain during sexual intercourse
      - painful, burning, or difficult urination
      - shortness of breath, tightness in chest, or wheezing
      - stomach pain
      - thick, white vaginal discharge with no odor or with a mild odor
      - troubled breathing
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Asthma
      - bleeding from the rectum
      - bloody or black, tarry stools
      - change in sexual desire or performance
      - chest pain
      - double vision
      - dryness of eye
      - ear pain
      - fainting
      - fast heartbeat
      - fever, chills, or sore throat
      - hallucinations (seeing, hearing, or feeling things that are not there)
      - hives
      - increased sense of hearing
      - increased sensitivity to sun
      - irritation or soreness of mouth
      - joint or muscle pain or stiffness
      - kidney stones
      - large pupils of eyes
      - lower back, side, or stomach pain
      - menstrual changes
      - mood or mental changes
      - nerve pain or twitching
      - pelvic pain
      - problems in speaking
      - problems with urination
      - prolonged, painful, inappropriate penile erection
      - red or irritated eyes
      - sensitivity of eyes to light
      - swelling of face
      - swollen glands
      - talking, feeling, and acting with excitement and activity you cannot control
      - unusual bleeding or bruising
      - unusual feeling of well-being
      - unusual tiredness or weakness
      - vomiting of blood or material that looks like coffee grounds
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of skin
      - light-colored stools
      - confusion
      - dark urine
      - decreased urine output
      - fever
      - increased thirst
      - itching
      - lack of appetite
      - large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
        feet, or sex organs
      - muscle pain or cramps
      - muscle spasm or jerking of all extremities
      - muscle stiffness
      - pain, warmth, or burning in fingers, toes, and legs
      - red skin lesions, often with a purple center
      - sore throat
      - sudden loss of consciousness
      - sweating
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal dreams
      - agitation
      - confusion
      - constipation
      - diarrhea
      - dizziness
      - drowsiness
      - dryness of mouth
      - flushing or feeling of warmth
      - headache
      - heartburn
      - increased appetite
      - increased cough
      - memory problems
      - nausea
      - swelling of arms or legs
      - tingling, burning, or prickly sensations
      - tremor
      - trouble in sleeping
      - vomiting
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Breast pain
      - generalized slowing of mental and physical activity
      - increased thirst
      - loss of strength or energy
      - muscle weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Unexpected or excess milk flow from breasts
      - swelling of the breasts or breast soreness in males
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
