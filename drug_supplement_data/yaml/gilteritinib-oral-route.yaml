title: Gilteritinib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Xospata
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Gilteritinib is used to treat acute myeloid leukemia with an FMS-like tyrosine
      kinase 3 (FLT3) mutation that has come back or has not improved after previous
      treatments. Your doctor will test for the presence of this mutation.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of gilteritinib in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of gilteritinib in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Apalutamide
      - Avacopan
      - Berotralstat
      - Boceprevir
      - Capmatinib
      - Carbamazepine
      - Cholera Vaccine
      - Clarithromycin
      - Cobicistat
      - Colchicine
      - Conivaptan
      - Cyclosporine
      - Digoxin
      - Dofetilide
      - Ebola Zaire Vaccine, Live
      - Escitalopram
      - Everolimus
      - Fedratinib
      - Fexinidazole
      - Fluoxetine
      - Fosphenytoin
      - Idelalisib
      - Indinavir
      - Influenza Virus Vaccine, Live
      - Itraconazole
      - Ketoconazole
      - Lenacapavir
      - Letermovir
      - Lopinavir
      - Mifepristone
      - Nefazodone
      - Nelfinavir
      - Omaveloxolone
      - Phenobarbital
      - Phenytoin
      - Posaconazole
      - Primidone
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart or heart rhythm problems (eg, QT prolongation)—Use with caution. May
        make this condition worse.
    - type: list
      ordered: false
      items:
      - Hypokalemia (low potassium levels in the blood) or
      - Hypomagnesemia (low magnesium levels in the blood)—Must be corrected first
        before using this medicine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before using this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food. Take this medicine at the
      same time each day.
  - type: paragraph
    text: Swallow the tablet whole with water. Do not break, crush, or chew it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For acute myeloid leukemia: Adults—120 milligrams
        (mg) once a day. Your doctor may adjust your dose as needed and tolerated.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For acute myeloid leukemia: Adults—120 milligrams (mg) once a day. Your doctor
        may adjust your dose as needed and tolerated. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—120 milligrams (mg) once a day. Your doctor may adjust your dose as
        needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is less than 12 hours until your next regular
        dose, skip the missed dose and take your next dose at the regular time. If
        you miss a dose and it is 12 hours or more until your next dose, take the
        missed dose then go back to your regular schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. It
      may also cause birth defects if the father is using it when his sexual partner
      becomes pregnant. Female patients should use effective birth control during
      treatment with this medicine and for at least 6 months after the last dose.
      Male patients who have female partners should use effective birth control during
      treatment with this medicine and for at least 4 months after the last dose.
      If you think you have become pregnant while using this medicine, tell your doctor
      right away.
  - type: paragraph
    text: Your doctor will give you a pregnancy test within 7 days before you use
      this medicine to make sure you are not pregnant.
  - type: paragraph
    text: Using this medicine may increase your risk of having a condition called
      differentiation syndrome, which may be life-threatening. It may occur as early
      as 1 day after starting this medicine and during the first 3 months of treatment.
      Check with your doctor right away if you start to have a fever, cough, trouble
      breathing, swelling of the arms or legs or around the neck, groin, or underarms,
      rapid weight gain, or bone pain. Your doctor may give you a steroid medicine
      (eg, dexamethasone) to help treat these symptoms.
  - type: paragraph
    text: Tell your doctor right away if you have seizures, headache, confusion, vision
      problems, unusual drowsiness, tiredness, or weakness. These could be symptoms
      of a serious nervous system problem called posterior reversible encephalopathy
      syndrome (PRES).
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you had a heart rhythm problem, including
      QT prolongation.
  - type: paragraph
    text: Check with your doctor right away if you have loss of appetite, nausea,
      or pains in stomach, side, or abdomen, possibly radiating to the back. These
      could be symptoms of pancreatitis (swelling of the pancreas).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody urine
      - blurred vision
      - chest pain or tightness
      - chills
      - confusion
      - cough
      - decreased frequency or amount of urine
      - dizziness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fainting
      - fast or irregular heartbeat
      - fever
      - headache
      - increased thirst
      - lightheadedness
      - loss of appetite
      - lower back or side pain
      - nausea
      - nervousness
      - pounding in the ears
      - rapid, shallow breathing
      - recurrent fainting
      - slow heartbeat
      - sneezing
      - sore throat
      - stomach pain
      - sweating
      - swelling of the face, fingers, or lower legs
      - trouble breathing
      - unusual tiredness or weakness
      - vomiting
      - weight gain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blue or pale skin
      - chest discomfort
      - chest pain, possibly moving to the left arm, neck, or shoulder
      - difficulty swallowing
      - dilated neck veins
      - hives, itching, skin rash
      - irregular breathing
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - seizures
      - unusual drowsiness
      - vision problems
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in taste
      - constipation
      - decreased appetite
      - diarrhea
      - loss of taste
      - muscle or joint pain
      - swelling or inflammation of the mouth
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
