title: Meningococcal vaccine and haemophilus b vaccine (intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Menhibrix
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Meningococcal polysaccharide vaccine and Haemophilus B conjugate vaccine
      is an active immunizing combination agent that is used to prevent infection
      caused by certain groups of meningococcal bacteria and Haemophilus influenza
      type b (Hib) bacteria. The vaccine works by causing your body to produce its
      own protection (antibodies) against the disease.
  - type: paragraph
    text: The following information applies only to the meningococcal vaccine used
      for meningococcal bacteria Groups C and Y
  - type: paragraph
    text: Menhibrix® vaccine is recommended for use in children 6 weeks to 18 months
      of age.
  - type: paragraph
    text: This vaccine is to be administered only by or under the direct supervision
      of your doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Menhibrix® vaccine in infants younger than 6 weeks of age
        and in children 19 months to 16 years of age. Safety and efficacy have not
        been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of Menhibrix® vaccine in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atidarsagene Autotemcel
      - Elivaldogene Autotemcel
      - Ocrelizumab
      - Teplizumab-mzwv
      - Ublituximab-xiiy
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Apnea in premature babies (breathing stops for short periods)—Use with caution.
        Shots given into the muscle, such as this vaccine, may make this condition
        worse.
    - type: list
      ordered: false
      items:
      - Guillain-Barré syndrome (GBS, nervous system disorder that causes paralysis),
        history of after a vaccine with tetanus—Your doctor will decide if your child
        should receive this vaccine.
    - type: list
      ordered: false
      items:
      - Immunodeficiency disorder or
      - Weak immune system—May not work as well in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give your child this vaccine.
      This vaccine is given as a shot into a muscle (usually in the thighs or upper
      arms).
  - type: paragraph
    text: The exact schedule for your child's vaccines will vary depending on your
      child's age at the time of the first dose. In general, your child can receive
      the first dose of the vaccine as early as 6 weeks to 2 months of age. This is
      followed by receiving the remaining three doses at 4, 6, and 12 to 15 months
      of age.
  - type: paragraph
    text: It is important that your child receives all of the doses of vaccine in
      this series. Try to keep all of your child's scheduled appointments. If your
      child does miss a dose of this vaccine, make another appointment as soon as
      possible.
  - type: paragraph
    text: Your child may receive other vaccines at the same time as this one, but
      in a different body area. You should receive information sheets about all of
      the vaccines your child receives. Make sure you understand all of the information
      that is given to you.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your child return to your doctor’s office at the
      right time for each dose . Be sure to notify your doctor of any side effects
      that occur after your child receives this vaccine.
  - type: paragraph
    text: 'Fainting may occur after receiving intramuscular injections, such as this
      vaccine. It may occur with other symptoms including: blurred vision, numbness
      or tingling in your arms, hands, or feet, or seizures.'
  - type: paragraph
    text: Check with your doctor right away if your child has a cough, difficulty
      with swallowing, dizziness, fast heartbeat, hives, itching, puffiness or swelling
      of the eyelids or around the eyes, face, lips, or tongue, shortness of breath,
      skin rash, tightness in the chest, or unusual tiredness or weakness. These could
      be symptoms of an allergic reaction to the vaccine.
  - type: paragraph
    text: This vaccine may interfere with laboratory tests that check for Hib disease.
      Make sure your doctor knows that your child received the vaccine if a severe
      infection occurs during 2 weeks after the vaccine is given.
  - type: paragraph
    text: It is important that your child's doctor should know about all other vaccines
      your child have recently received, including a flu shot.
  - type: paragraph
    text: Make sure your doctor knows if you are using medicines that weaken your
      immune system such as cancer medicines, radiation treatment, or steroids.
  - type: paragraph
    text: Menhibrix® vaccine is not a substitute for routine tetanus vaccination,
      and will not treat symptoms of meningococcal infection or flu if your child
      already has the disease.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish lips
      - cough
      - difficulty with swallowing
      - fainting
      - fast heartbeat
      - hives
      - itching
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - shortness of breath
      - skin rash
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Crying
      - drowsiness
      - irritability
      - loss of appetite
      - pain, redness, or swelling at the injection site
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hard lump at the injection site
      - sleepiness or unusual drowsiness
      - welts
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
