title: Gatifloxacin (ophthalmic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Zymar
    - type: paragraph
      text: Zymaxid
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Gatifloxacin eye drops are used to treat infections of the eye, such as
      bacterial conjunctivitis. Gatifloxacin belongs to a group of medicines called
      fluoroquinolone antibiotics. It works by killing bacteria that cause conjunctivitis.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Zymaxid® in children. However,
        safety and efficacy have not been established in children younger than 1 year
        of age.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Zymar® in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of gatifloxacin eye drops in the
        elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Corneal problems—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your doctor will tell you how much of this medicine to use and how often.
      Do not use more medicine or use it more often than your doctor tells you to.
      This medicine is not for long-term use.
  - type: paragraph
    text: 'To use the eye drops:'
  - type: list
    ordered: false
    items:
    - First, wash your hands. Then tilt the head back and pull the lower eyelid away
      from the eye to form a pouch. Drop the medicine into the pouch and gently close
      the eyes. Do not blink. Keep the eyes closed for 1 or 2 minutes to allow the
      medicine to come into contact with the infection.
    - If you think you did not get the drop of medicine into your eye properly, repeat
      the directions with another drop.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
  - type: paragraph
    text: To help clear up your eye infection completely, keep using this medicine
      for the full time of treatment , even if your symptoms have disappeared and
      even if you feel better after the first few doses. Your infection may not clear
      up if you stop using the medicine too soon. Do not miss any doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic dosage form (eye drops): For bacterial conjunctivitis: Zymar®:
        Adults and children— Days 1 and 2: Put 1 drop in the affected eye every 2
        hours while awake, up to 8 times a day. Days 3 through 7: Put 1 drop in the
        affected eye up to 4 times a day while awake. Zymaxid®: Adults and children
        1 year of age and older— Day 1: Put 1 drop in the affected eye every 2 hours
        while awake, up to 8 times. Days 2 through 7: Put 1 drop in the affected eye
        2 to 4 times a day while awake. Children younger than 1 year of age—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For bacterial conjunctivitis: Zymar®: Adults and children— Days 1 and 2:
        Put 1 drop in the affected eye every 2 hours while awake, up to 8 times a
        day. Days 3 through 7: Put 1 drop in the affected eye up to 4 times a day
        while awake. Zymaxid®: Adults and children 1 year of age and older— Day 1:
        Put 1 drop in the affected eye every 2 hours while awake, up to 8 times. Days
        2 through 7: Put 1 drop in the affected eye 2 to 4 times a day while awake.
        Children younger than 1 year of age—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - 'Zymar®: Adults and children— Days 1 and 2: Put 1 drop in the affected eye
        every 2 hours while awake, up to 8 times a day. Days 3 through 7: Put 1 drop
        in the affected eye up to 4 times a day while awake.'
      - 'Zymaxid®: Adults and children 1 year of age and older— Day 1: Put 1 drop
        in the affected eye every 2 hours while awake, up to 8 times. Days 2 through
        7: Put 1 drop in the affected eye 2 to 4 times a day while awake. Children
        younger than 1 year of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults and children— Days 1 and 2: Put 1 drop in the affected eye every 2
        hours while awake, up to 8 times a day. Days 3 through 7: Put 1 drop in the
        affected eye up to 4 times a day while awake.'
    - type: list
      ordered: false
      items:
      - 'Days 1 and 2: Put 1 drop in the affected eye every 2 hours while awake, up
        to 8 times a day.'
      - 'Days 3 through 7: Put 1 drop in the affected eye up to 4 times a day while
        awake.'
    - type: list
      ordered: false
      items:
      - 'Adults and children 1 year of age and older— Day 1: Put 1 drop in the affected
        eye every 2 hours while awake, up to 8 times. Days 2 through 7: Put 1 drop
        in the affected eye 2 to 4 times a day while awake.'
      - Children younger than 1 year of age—Use and dose must be determined by your
