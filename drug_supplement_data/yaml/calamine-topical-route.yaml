title: Calamine (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Calamine Lotion
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Calamine is used to relieve the itching, pain, and discomfort of minor skin
      irritations, such as those caused by poison ivy, poison oak, and poison sumac.
      This medicine also dries oozing and weeping caused by poison ivy, poison oak,
      and poison sumac.
  - type: paragraph
    text: Calamine is available without prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of calamine in
        children with use in other age groups, this medicine is not expected to cause
        different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of calamine
        in the elderly with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Calamine is for external use only. Do not swallow it and do not use it on
      the eyes or mucous membranes such as the inside of the mouth, nose, genital
      (sex organs), or anal areas.
  - type: paragraph
    text: 'To use calamine lotion:'
  - type: list
    ordered: false
    items:
    - Shake the lotion well before using.
    - Moisten a pledget of cotton with the lotion.
    - Use the moistened pledget to apply the lotion to the affected skin area(s).
    - Allow the medicine to dry on the skin.
  - type: paragraph
    text: 'To use calamine ointment:'
  - type: list
    ordered: false
    items:
    - Apply enough medicine to cover affected skin area(s) and rub in gently.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For minor skin irritations: For topical dosage forms (lotion, ointment):
        Adults and children—Apply to the affected area(s) of skin as often as needed.'
    - type: list
      ordered: false
      items:
      - 'For topical dosage forms (lotion, ointment): Adults and children—Apply to
        the affected area(s) of skin as often as needed.'
    - type: list
      ordered: false
      items:
      - Adults and children—Apply to the affected area(s) of skin as often as needed.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your condition gets worse or if it does not improve within 7 days, or
      if rash or irritation develops, stop using calamine and check with your doctor.
