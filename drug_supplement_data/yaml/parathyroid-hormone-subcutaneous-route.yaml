title: Parathyroid hormone (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Natpara
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Parathyroid hormone injection is used together with calcium and vitamin
      D to control hypocalcemia (low calcium levels) in patients with hypoparathyroidism.
      Hypoparathyroidism is a condition that is caused when the parathyroid gland
      in the neck doesn't make enough parathyroid hormone (PTH).
  - type: paragraph
    text: This medicine is only available through a restricted access program. Doctors
      who are enrolled in the restricted program can write a prescription for this
      medicine.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of parathyroid hormone injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of  parathyroid hormone injection
        in the elderly. However, elderly patients are more likely to have kidney problems,
        which may require caution and an adjustment in the dose for patients receiving
        this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alendronate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bone disease (eg, osteosarcoma, Paget's disease of bone)—Use with caution.
        May make this condition worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine to the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine.
      This medicine is given as a shot under your skin, usually on the upper thighs.
  - type: paragraph
    text: You may be taught how to give this medicine at home. Make sure you understand
      all of the instructions before giving yourself an injection. Do not use more
      medicine or use it more often than your doctor tells you to.
  - type: paragraph
    text: 'This medicine comes with a Medication Guide and patient instructions. Read
      and follow the instructions carefully. Ask your doctor if you have any questions
      about:'
  - type: list
    ordered: false
    items:
    - How to prepare the injection using the medication cartridge and mixing device.
    - The proper use of disposable syringes.
    - How to give the injection using the reusable Q-Cliq pen injector.
    - How long the injection can be stored at home.
  - type: paragraph
    text: If you have any questions about any of this, check with your doctor.
  - type: paragraph
    text: The medicine should be clear. Do not use the medicine if it is cloudy, discolored,
      or has large particles in it.
  - type: paragraph
    text: Follow your doctor's instructions about how to take vitamin D and calcium
      supplements while using this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: For low calcium levels: Adults—Dose must be determined
        by your doctor. The starting dose is usually 50 microgram (mcg) injected under
        the skin once a day. Your doctor may adjust your dose every 4 weeks as needed.
        However, the dose is usually not more than 100 mcg per day. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For low calcium levels: Adults—Dose must be determined by your doctor. The
        starting dose is usually 50 microgram (mcg) injected under the skin once a
        day. Your doctor may adjust your dose every 4 weeks as needed. However, the
        dose is usually not more than 100 mcg per day. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Dose must be determined by your doctor. The starting dose is usually
        50 microgram (mcg) injected under the skin once a day. Your doctor may adjust
        your dose every 4 weeks as needed. However, the dose is usually not more than
        100 mcg per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: After mixing Natpara®, store the medication cartridge in the Q-Cliq pen
        in the refrigerator for up to 14 days. Store away from heat and light. Do
        not freeze or shake. Throw away any unused mixed medicine in the medication
        cartridges after 14 days.
    - type: paragraph
      text: Throw away used needles in a hard, closed container that the needles cannot
        poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      make sure this medicine is working properly. Blood and urine tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Do not use this medicine together with alendronate (Fosamax®).
  - type: paragraph
    text: This medicine may increase your risk of having osteosarcoma (bone tumor).
      This is more likely to occur if you have Paget's disease of the bone, high levels
      of alkaline phosphatase, genetic disorders, children with open epiphyses, or
      a history of external beam or implant radiation therapy. Tell your doctor right
      away if you have bone pain that does not go away or a new soft tissue mass that
      is tender to palpitation.
  - type: paragraph
    text: Severe hypercalcemia (high calcium in the blood) may occur while using this
      medicine. This is more likely to occur when you start treatment or increase
      your dose. Call your doctor right away if you have confusion, constipation,
      dry mouth, metallic taste, muscle weakness, nausea or vomiting, or weight loss.
  - type: paragraph
    text: Do not stop using this medicine suddenly without asking your doctor . This
      may increase your risk of having severe hypocalcemia (low calcium in the blood).
      Symptoms include abdominal or stomach cramps, muscle spasms or twitching, numbness
      or tingling in your fingers, toes, or around your mouth, or trouble breathing.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      Taking other medicines (especially digoxin, Lanoxin®) together with Natpara®
      may require your doctor to change the dose of one of the medicines.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps or pain
      - blurred vision
      - confusion
      - constipation
      - convulsions
      - depression
      - difficulty with breathing
      - dizziness
      - dry mouth
      - headache
      - incoherent speech
      - increased urination
      - irregular heartbeats
      - loss of appetite
      - metallic taste
      - muscle cramps in the hands, arms, feet, legs, or face
      - muscle weakness
      - nausea
      - nervousness
      - numbness and tingling around the mouth, fingertips, or feet
      - pounding in the ears
      - slow or fast heartbeat
      - thirst
      - tremor
      - unusual tiredness
      - vomiting
      - weight loss
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal or decreased touch sensation
      - body aches or pain
      - chills
      - cough
      - diarrhea
      - difficulty with moving
      - ear congestion
      - fever
      - loss of voice
      - muscle pain or stiffness
      - pain in the joints or neck
      - pain or tenderness around the eyes and cheekbones
      - sneezing
      - sore throat
      - stuffy or runny nose
      - tightness of the chest
      - upper abdominal or stomach pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
