    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - High Protein Food
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma or
      - Biliary obstruction or blockage or
      - Colitis (inflammation of the colon) or
      - Depression, history of or
      - Dyskinesia (abnormal muscle movements) or
      - Endocrine or metabolic disease or
      - Heart attack, history of or
      - Heart or blood vessel disease, severe or
      - Heart rhythm problems (eg, ventricular tachycardia) or
      - Hypotension (low blood pressure) or
      - Kidney disease or
      - Liver disease or
      - Lung disease, severe or
      - Psychosis (mental disorder), or history of or
      - Wide-angle glaucoma (eye pressure problem)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Melanoma (skin tumor), history of or
      - Narrow–angle glaucoma (eye pressure problem) or
      - Skin lesions, undiagnosed (rashes that involve changes in color or texture
        of the skin)—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Peptic ulcer, history of—May increase risk of stomach or bowel hemorrhage.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed , and every time that you are supposed
      to take it. It is important that you do not stop taking your medicine unless
      ordered by your doctor. It is also important to not start taking other medicines
      for your Parkinson's disease without first talking with your doctor.
  - type: paragraph
    text: Swallow the tablet whole. Do not crush, chew, or break it. You may take
      the tablet with or without food.
  - type: paragraph
    text: Since protein may interfere with the body's response to levodopa, high protein
      diets should be avoided. Intake of normal amounts of protein should be spaced
      equally throughout the day, or taken as directed by your doctor.
  - type: paragraph
    text: You may experience a “wearing-off” effect towards the end of the dosing
      interval. You should tell your doctor if you have problems with this that affect
      your every day life. Your doctor may want to adjust your dose.
  - type: paragraph
    text: This medicine begins to release its ingredients 30 minutes after you take
      it.
  - type: paragraph
    text: If you are taking multivitamin tablets or plan to start taking them, discuss
      this first with your doctor. Iron salts (in vitamins) may keep this medicine
      from working properly.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules or tablets): For Parkinson''s disease: Adults—The
        starting dose is usually the same as the current dose you are taking. If you
        are starting this medicine for the first time, your doctor may want to start
        you on a carbidopa and levodopa combination with entacapone and gradually
        switch you over to this combination. Do not use more than 6 to 8 tablets in
        a 24-hour period. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For Parkinson''s disease: Adults—The starting dose is usually the same as
        the current dose you are taking. If you are starting this medicine for the
        first time, your doctor may want to start you on a carbidopa and levodopa
        combination with entacapone and gradually switch you over to this combination.
        Do not use more than 6 to 8 tablets in a 24-hour period. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—The starting dose is usually the same as the current dose you are taking.
        If you are starting this medicine for the first time, your doctor may want
        to start you on a carbidopa and levodopa combination with entacapone and gradually
        switch you over to this combination. Do not use more than 6 to 8 tablets in
        a 24-hour period.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to allow changes in your dose and to check for any unwanted effects.
  - type: paragraph
    text: Do not take this medicine if you have taken a monoamine oxidase (MAO) inhibitor
      (eg, isocarboxazid [Marplan®], phenelzine [Nardil®] or tranylcypromine [Parnate®])
      in the past 2 weeks.
  - type: paragraph
    text: Do not stop taking this medicine without first checking with your doctor
      . Your doctor may want you to gradually reduce the amount you are taking before
      stopping completely.
  - type: paragraph
    text: Check with your doctor right away if you are having convulsions (seizures),
      difficulty with breathing, a fast heartbeat, a high fever, high or low blood
      pressure, increased sweating, loss of bladder control, severe muscle stiffness,
      unusually pale skin, or tiredness. These could be symptoms of a serious condition
      called neuroleptic malignant syndrome (NMS).
  - type: paragraph
    text: This medicine may cause dizziness, drowsiness, trouble in controlling movements,
      or trouble in concentrating or seeing clearly. It may even cause you to fall
      asleep without warning while you drive, talk, or eat. Make sure you know how
      you react to this medicine before you drive, use machines, or do other jobs
      that require you to be alert, well-coordinated, or able to think or see well
      .
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur with this medicine, especially
      when you get up from a lying or sitting position suddenly. These symptoms are
      more likely to occur when you begin taking this medicine, or when the dose is
      increased. Getting up slowly may also help. If this problem continues or gets
      worse, check with your doctor.
  - type: paragraph
    text: This medicine will add to the effects of other CNS depressants (medicines
      that make you drowsy or less alert). Some examples of CNS depressants are antihistamines
      or medicine for hay fever, other allergies, or colds, sedatives, tranquilizers,
      or sleeping medications, prescription pain medicine or narcotics, medicine for
      seizures or barbiturates, muscle relaxants, or anesthetics, including some dental
      anesthetics. Check with your medical doctor or dentist before taking any of
      the above while you are taking this medicine .
  - type: paragraph
    text: This medicine may cause diarrhea, and in some cases it can be severe. It
      can occur months after starting this medicine. Do not take any medicine to treat
      diarrhea without first checking with your doctor. Diarrhea medicines may make
      the diarrhea worse or make it last longer. If you have any questions about this
      or if mild diarrhea continues or gets worse, check with your doctor.
  - type: paragraph
    text: If you develop any unusual or strange thoughts and behavior while receiving
      this medicine, be sure to discuss it with your doctor. Other changes might be
      confusion, worsening of depression, visual hallucinations (seeing things that
      are not there), suicidal thoughts, and unusual excitement, nervousness, or irritability.
  - type: paragraph
    text: Check with your doctor right away if you have dark-colored urine, fever,
      muscle cramps or spasms, muscle pain or stiffness, or unusual tiredness or weakness.
      These may be symptoms of a condition called rhabdomyolysis.
  - type: paragraph
    text: Check with your doctor right away if you are having shortness of breath,
      chest tightness, or any type of breathing problem while being treated with this
      medicine.
  - type: paragraph
    text: It is important that your doctor check your skin regularly for signs of
      a skin cancer called melanoma. If you notice any unusual red, brown, or black
      spots on your skin, talk to your doctor right away.
  - type: paragraph
    text: It is possible that a dark color (red, brown, or black) may appear in saliva,
      urine, or sweat after taking this medicine. The color may cause some of your
      garments to become discolored. This is normal and nothing to worry about.
  - type: paragraph
    text: It is possible that you may become nauseous, especially when you are first
      starting your medicine.
  - type: paragraph
    text: Some people who have used this medicine had unusual changes in their behavior.
      Talk with your doctor right away if you start having problems with gambling
      or an increased interest in sex while using this medicine.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are taking this medicine. The results of some tests may be affected by this
      medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
