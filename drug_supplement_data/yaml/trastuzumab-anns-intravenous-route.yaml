title: Trastuzumab-anns (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Kanjinti
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Trastuzumab-anns injection is used together with other cancer medicines
      (eg, doxorubicin, cyclophosphamide, and either paclitaxel or docetaxel, or docetaxel
      and carboplatin) or used alone after a previous treatment with an anthracycline
      medicine to treat HER2-overexpressing node positive or node negative (ER/PR
      negative or with one high risk feature) breast cancer.
  - type: paragraph
    text: Trastuzumab-anns injection is also used to treat HER2-overexpressing metastatic
      (cancer that has spread) breast cancer in patients who have received one or
      more cancer treatments. It is also used together with paclitaxel for the first-line
      treatment of HER2-overexpressing metastatic breast cancer.
  - type: paragraph
    text: Trastuzumab-anns injection is also used together with cisplatin and capecitabine
      or 5-fluorouracil to treat HER2-overexpressing metastatic (cancer that has spread
      to other parts of the body) gastric or gastroesophageal junction (GEJ) adenocarcinoma
      (stomach or esophagus cancer) in patients who have not previously received treatment.
  - type: paragraph
    text: Trastuzumab-anns prevents the growth of some tumors that produce extra amounts
      of a certain substance known as the HER2 protein. It should only be used in
      patients whose tumors have been shown to produce extra amounts of this protein
      (HER2 overexpression) .
  - type: paragraph
    text: Trastuzumab-anns is a monoclonal antibody. It interferes with the growth
      of cancer cells, which are eventually destroyed by the body. Since the growth
      of normal body cells may also be affected by trastuzumab-anns, other effects
      will also occur. Some of these may be serious and must be reported to your doctor.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of trastuzumab-anns injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of trastuzumab-anns injection in
        the elderly. However, elderly patients are more likely to have age-related
        heart problems, which may require caution in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Daunorubicin
      - Daunorubicin Citrate Liposome
      - Daunorubicin Liposome
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Ebola Zaire Vaccine, Live
      - Epirubicin
      - Idarubicin
      - Influenza Virus Vaccine, Live
      - Pirarubicin
      - Pixantrone
      - Rotavirus Vaccine, Live
      - Valrubicin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Heart disease (eg, cardiomyopathy) or
      - Heart rhythm problems (eg, arrhythmia) or
      - Hypertension (high blood pressure) or
      - Lung disease (eg, interstitial pneumonitis, pulmonary fibrosis, tumor)—Use
        with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine
      in a medical facility. It is given through an IV catheter that is placed into
      one of your veins. It must be given slowly, so the IV should remain in place
      for at least 30 to 90 minutes.
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: This medicine needs to be given on a fixed schedule. If you miss a dose,
        call your doctor, home health caregiver, or treatment clinic for instructions.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress closely while
      receiving the medicine and at regular visits . This will allow your doctor to
      see if the medicine is working properly and to decide if you should continue
      to receive it. Blood and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Receiving this medicine while you are pregnant can harm your unborn baby.
      If you can get pregnant, your doctor may do tests to make sure you are not pregnant
      before receiving this medicine. Use an effective form of birth control to keep
      from getting pregnant during treatment with this medicine and for 7 months after
      the last dose. If you think you have become pregnant while receiving the medicine,
      tell your doctor right away.
  - type: paragraph
    text: Your doctor may test your heart before you start receiving trastuzumab-anns
      injection and while you are getting treatments with this medicine. This medicine
      may cause heart problems (eg, heart failure, heart rhythm problems, heart failure,
      heart muscle problems, and high blood pressure). Check with your doctor right
      away if you have blurred vision, chest pain or tightness, decreased urine output,
      dilated neck veins, dizziness, extreme fatigue, fainting, fast or slow heartbeat,
      headache, irregular breathing, irregular heartbeat, nervousness, pounding in
      the ears, swelling of the face, fingers, feet, or lower legs, trouble breathing,
      or weight gain.
  - type: paragraph
    text: This medicine may cause infusion reactions, which can be life-threatening
      and require immediate medical attention. Tell your doctor right away if you
      start to have a fever, chills or shaking, dizziness, trouble breathing, itching
      or rash, or lightheadedness or fainting after receiving this medicine.
  - type: paragraph
    text: Serious lung or breathing problems may occur after you receive this medicine.
      Call your doctor right away if have changes in your breathing, chest tightness,
      or any type of breathing problem.
  - type: paragraph
    text: Trastuzumab-anns can temporarily lower the number of some types of blood
      cells in your body. Because of this, you may bleed or get infections more easily.
      To help with these problems, avoid being near people who are sick or have infections.
      Wash your hands often. Stay away from rough sports or other situations where
      you could be bruised, cut, or injured. Brush and floss your teeth gently. Be
      careful when using sharp objects, including razors and fingernail clippers.
  - type: paragraph
    text: Do not receive an anthracycline medicine for up to 7 months after stopping
      treatment with any medicine containing trastuzumab.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - tingling of the hands or feet
      - unusual weight gain or loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bloody urine
      - blurred vision
      - bone pain
      - burning or stinging of the skin
      - chest pain, discomfort, or tightness
      - cough or hoarseness
      - difficult, burning, or painful urination
      - dilated neck veins
      - dizziness
      - fainting
      - fast, slow, or irregular heartbeat or pulse
      - fever or chills
      - headache
      - increased thirst
      - irregular breathing
      - loss of appetite
      - lower back or side pain
      - nausea
      - nervousness
      - painful cold sores or blisters on the lips, nose, eyes, or genitals
      - pale skin
      - pounding in the ears
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swelling of the face, fingers, feet, or lower legs
      - swollen glands
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hives, itching, rash
      - irritation
      - joint pain, stiffness, or swelling
      - neck tenderness or swelling
      - redness of the skin
      - trouble swallowing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - change in taste
      - cracked lips
      - diarrhea
      - difficulty in moving
      - muscle aches, cramps, pain or stiffness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - bladder pain
      - blemishes on the skin
      - bloody or cloudy urine
      - body aches or pain
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - clumsiness or unsteadiness
      - constipation
      - discoloration of the fingernails or toenails
      - ear congestion
      - feeling of warmth
      - general feeling of discomfort or illness
      - heartburn
      - indigestion
      - lack or loss of strength
      - loss of voice
      - muscle spasm
      - pain or tenderness around the eyes and cheekbones
      - peeling of the skin
      - pimples
      - redness of the face, neck, arms and occasionally, upper chest
      - runny or stuffy nose
      - shivering
      - sneezing
      - stomach discomfort, upset, or pain
      - sweating
      - swelling or inflammation of the mouth
      - trouble sleeping
      - weakness in the hands or feet
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
