title: Butorphanol (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Stadol
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Butorphanol injection is used to relieve pain. It may also be given before
      a surgery, when giving birth, or with general anesthesia before an operation.
      It belongs to the group of medicines called narcotic analgesics (pain medicines).
      Butorphanol acts on the central nervous system (CNS) to relieve pain.
  - type: paragraph
    text: When butorphanol injection is used for a long time, it may become habit-forming,
      causing mental or physical dependence. However, people who have continuing pain
      should not let the fear of dependence keep them from using narcotics to relieve
      their pain. Mental dependence (addiction) is not likely to occur when narcotics
      are used for this purpose. Physical dependence may lead to withdrawal side effects
      if treatment is stopped suddenly. However, severe withdrawal side effects can
      usually be prevented by gradually reducing the dose over a period of time before
      treatment is stopped completely.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of butorphanol injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of butorphanol injection in the elderly.
        However, elderly patients may be more sensitive to the effects of this medicine
        than younger adults, and are more likely to have age-related lung, kidney,
        liver, or heart problems, which may require caution and an adjustment in the
        dose for patients receiving butorphanol injection in order to avoid serious
        side effects.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
      - Naltrexone
      - Phenelzine
      - Safinamide
      - Samidorphan
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acepromazine
      - Alfentanil
      - Almotriptan
      - Alprazolam
      - Amifampridine
      - Amineptine
      - Amitriptyline
      - Amitriptylinoxide
      - Amobarbital
      - Amoxapine
      - Amphetamine
      - Aripiprazole
      - Asenapine
      - Baclofen
      - Benperidol
      - Benzhydrocodone
      - Benzphetamine
      - Bromazepam
      - Bromopride
      - Brompheniramine
      - Buprenorphine
      - Bupropion
      - Buspirone
      - Butabarbital
      - Butalbital
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Carisoprodol
      - Carphenazine
      - Cetirizine
      - Chloral Hydrate
      - Chlordiazepoxide
      - Chlorpheniramine
      - Chlorpromazine
      - Chlorzoxazone
      - Citalopram
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Desflurane
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Adrenal problems or
      - Alcohol abuse, or history of or
      - Brain tumor or
      - Breathing problems (eg, chronic obstructive pulmonary disease [COPD], cor
        pulmonale, hypoxia, apnea) or
      - Drug dependence, especially narcotic abuse, history of or
      - Head injuries or
      - Heart attack or
      - Heart or blood vessel problems or
      - Increased pressure in the head—Use with caution. May increase risk for more
        serious side effects.
    - type: list
      ordered: false
      items:
      - Heart attack or
      - Heart or blood vessel problems or
      - Hypertension (high blood pressure)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given as a shot into a muscle or through a needle placed in
      one of your veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress while you are
      using this medicine. This will allow your doctor to see if the medicine is working
      properly and to decide if you should continue to use it.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that can make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for allergies or colds; sedatives, tranquilizers,
      or sleeping medicine; other prescription pain medicine or narcotics; medicine
      for seizures or barbiturates; muscle relaxants; or anesthetics, including some
      dental anesthetics. Check with your doctor before taking any of the other medicines
      listed above while you are using this medicine .
  - type: paragraph
    text: This medicine may make you dizzy, drowsy, confused, or disoriented. Make
      sure you know how you react to this medicine before you drive, use machines,
      or do anything else that could be dangerous if you are dizzy or not alert .
  - type: paragraph
    text: Using narcotics for a long time can cause severe constipation. To prevent
      this, your doctor may direct you to take laxatives, drink a lot of fluids, or
      increase the amount of fiber in your diet. Be sure to follow the directions
      carefully, because continuing constipation can lead to more serious problems.
  - type: paragraph
    text: Your doctor may want you to gradually reduce the amount you are using before
      stopping it completely. This may help prevent worsening of your condition and
      reduce the possibility of withdrawal symptoms, such as abdominal or stomach
      cramps, anxiety, fever, nausea, runny nose, sweating, tremors, or trouble with
      sleeping.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough producing mucus
      - difficulty breathing
      - shortness of breath
      - tightness in chest
      - wheezing
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain
      - confusion
      - dizziness, faintness, or lightheadedness when getting up from a lying or sitting
        position suddenly
      - fast, pounding, or irregular heartbeat or pulse
      - nervousness
      - pounding in the ears
      - slow or fast heartbeat
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish lips or skin
      - false beliefs that cannot be changed by facts
      - not breathing
      - seizures
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in consciousness
      - extremely shallow or slow breathing
      - irregular heartbeats
      - loss of consciousness
      - shortness of breath
      - swelling in hands and feet
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - nausea
      - sleepiness or unusual drowsiness
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bad unusual or unpleasant (after) taste
      - bloody nose
      - body aches or pain
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - change in taste
      - clammy skin
      - congestion
      - continuing ringing or buzzing or other unexplained noise in ears
      - cough
      - dry mouth
      - dryness or soreness of throat
      - ear pain
      - false or unusual sense of well-being
      - fear or nervousness
      - feeling of warmth or heat
      - fever
      - floating feeling
      - flushing or redness of skin, especially on face and neck
      - headache
      - hearing loss
      - heat sensation on body
      - hoarseness
      - loss of appetite
      - nasal irritation
      - runny nose
      - shakiness
      - skin itching
      - sleeplessness
      - sneezing
      - stomach pain
      - stuffy nose
      - tender, swollen glands in neck
      - trouble in swallowing
      - trouble sleeping
      - unable to sleep
      - voice changes
      - weight loss
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sweating
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness or lightheadedness
      - feeling of constant movement of self or surroundings
      - lack or loss of strength
      - problems in speaking
      - sensation of spinning
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
