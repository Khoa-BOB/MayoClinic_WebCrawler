title: Avalglucosidase alfa-ngpt (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Nexviazyme
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Avalglucosidase alfa-ngpt injection is an enzyme used to treat late-onset
      of Pompe disease, which is also called glycogen storage disease type II. It
      contains a human enzyme called acid alpha-glucosidase, which helps with the
      digestion and absorption of glycogen. People with Pompe disease are not able
      to make enough of this enzyme.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of avalglucosidase alfa-ngpt injection
        in children 1 year of age and older. However, safety and efficacy have not
        been established in children younger than 1 year of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of avalglucosidase alfa-ngpt injection
        in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart disease or
      - Lung or breathing problems—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this medicine in a hospital. This medicine is given through a needle placed
      in one of your veins. The medicine must be injected slowly, so your IV tube
      will need to stay in place for 4 to 7 hours. It is usually given every 2 weeks.
  - type: paragraph
    text: Your doctor will give you other medicines (eg, allergy, fever, or steroid
      medicine) before you receive this medicine to help prevent unwanted effects.
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: This medicine needs to be given on a fixed schedule. If you miss a dose
        or forget to use your medicine, call your doctor or pharmacist for instructions.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      closely and at regular visits to make sure this medicine is working properly
      and to decide if you should continue to receive it. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you have blurred vision, chest discomfort or tightness,
      confusion, dizziness, faintness, or lightheadedness when getting up suddenly
      from a lying or sitting position, fast heartbeat, flushing, redness of the skin,
      rash, itching, hoarseness, sweating, trouble breathing, trouble swallowing,
      unusually warm skin, any swelling of your hands, face, or mouth, or unusual
      tiredness or weakness after receiving this medicine.
  - type: paragraph
    text: This medicine may cause infusion-related reactions, which can be life-threatening
      and require immediate medical attention. Tell your doctor right away if you
      start to have chest discomfort, fever, chills or shaking, confusion, difficulty
      swallowing, dizziness, fast heartbeat, flushing, redness of the skin, increase
      or decrease blood pressure, trouble breathing, itching or rash, unusually warm
      skin, or lightheadedness, or fainting after receiving this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - bluish lips or skin
      - blurred vision
      - chest discomfort or tightness
      - chills
      - confusion
      - cough
      - diarrhea
      - difficulty swallowing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fast, pounding, or irregular heartbeat or pulse
      - feeling of warmth
      - fever
      - general feeling of discomfort or illness
      - headache
      - hives, itching, skin rash
      - increased sweating
      - joint pain
      - loss of appetite
      - muscle aches and pains
      - nausea
      - nervousness
      - pounding in the ears
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness of the face, neck, arms, and occasionally, upper chest
      - runny nose
      - shakiness in the legs, arms, hands, or feet
      - shivering
      - slow or fast heartbeat
      - sore throat
      - trembling or shaking of the hands or feet
      - trouble breathing
      - trouble sleeping
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - difficulty in moving
      - swollen joints
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
