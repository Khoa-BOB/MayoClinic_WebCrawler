title: Selpercatinib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Retevmo
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Selpercatinib is used to treat locally advanced or metastatic (cancer that
      has already spread) non-small cell lung cancer (NSCLC) in patients whose tumors
      have RET fusion-positive genes. Your doctor will perform a test to check for
      the RET gene fusion before you use this medicine.
  - type: paragraph
    text: Selpercatinib is also used to treat advanced or metastatic (cancer that
      has already spread) medullary thyroid cancer (MTC) in patients whose tumors
      have abnormal RET (RET-mutant) genes. Your doctor will perform a test to check
      for the abnormal RET gene before you use this medicine.
  - type: paragraph
    text: Selpercatinib is also used to treat advanced or metastatic (cancer that
      has already spread) thyroid cancer in patients whose tumors have RET fusion-positive
      genes. Your doctor will perform a test to check for the RET gene fusion before
      you use this medicine. It is used in patients who needs a medicine by mouth
      or injection and have received radioactive iodine but did not work.
  - type: paragraph
    text: Selpercatinib is also used to treat locally advanced or metastatic (cancer
      that has already spread) solid tumors in patients whose tumors have RET fusion-positive
      genes. It is used in patients whose tumors have gotten worse on or after receiving
      other treatments or there are no treatment options that work well.
  - type: paragraph
    text: Selpercatinib belongs to the group of medicines called antineoplastics (cancer
      medicines). It works by interfering with the growth of cancer cells, which are
      eventually destroyed.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of selpercatinib to treat non-small cell lung cancer in the
        pediatric population. Safety and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of selpercatinib to treat medullary
        thyroid cancer, solid tumors, and thyroid cancer in children 2 years of age
        and older. Safety and efficacy have not been established in children younger
        than 2 years of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of selpercatinib in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Bepridil
