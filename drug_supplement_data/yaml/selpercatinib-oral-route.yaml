    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If your next dose is less than 6 hours away, skip the missed dose and
        take the medicine at your regular dosing time. If your missed dose is more
        than 6 hours until the time you normally take a dose, take it as soon as you
        remember and go back to your regular dosing schedule. If you vomit after taking
        your medicine, do not take an extra dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you can get pregnant, your doctor may give you a pregnancy test before you start
      using this medicine to make sure you are not pregnant. Use an effective form
      of birth control during treatment and for at least 1 week after the last dose.
      Males with female partners who are able to become pregnant should use an effective
      form of birth control during treatment and for at least 1 week after the last
      dose. If you think you have become pregnant, tell your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      unusual tiredness or weakness, or yellow eyes or skin. These could be symptoms
      of a serious liver problem.
  - type: paragraph
    text: This medicine may cause serious lung or breathing problems (eg, interstitial
      lung disease, pneumonitis). Check with your doctor right away if you have chest
      pain, chills, cough, fever, general feeling of discomfort or illness, thickening
      of bronchial secretions, or trouble breathing.
  - type: paragraph
    text: Check with your doctor right away if blurred vision, dizziness, nervousness,
      headache, pounding in the ears, or slow or fast heartbeat occurs during or after
      treatment with this medicine. These can be symptoms of hypertension (high blood
      pressure).
  - type: paragraph
    text: This medicine can cause changes in your heart rhythm, including a condition
      called QT prolongation. Call your doctor right away if you have dizziness, fainting,
      or slow, fast, pounding, or uneven heartbeats.
  - type: paragraph
    text: This medicine can cause serious bleeding problems that may be life-threatening.
      Check with your doctor right away if you have coughing up blood, increased menstrual
      flow or vaginal bleeding, nosebleeds, red or black, tarry stools, red or dark
      brown urine, vomiting of blood or material that looks like coffee grounds, or
      any unusual bleeding or bruising.
  - type: paragraph
    text: Selpercatinib may cause serious allergic reactions. Check with your doctor
      right away if you have a fever, rash, itching, joint or muscle pain, swelling
      of the face, tongue, and throat, trouble breathing, or chest pain after you
      take the medicine.
  - type: paragraph
    text: This medicine may affect the way your body heals from cuts and wounds. Make
      sure any doctor who treats you knows that you are using this medicine. You may
      need to stop using this medicine several days before and after having surgery.
  - type: paragraph
    text: This medicine may cause a serious type of reaction called tumor lysis syndrome.
      Your doctor may give you medicine to help prevent this. Call your doctor right
      away if you have a decrease or change in urine amount, joint pain, stiffness,
      or swelling, lower back, side, or stomach pain, a rapid weight gain, swelling
      of the feet or lower legs, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause hypothyroidism (underactive thyroid). Check with
      your doctor right away if you have constipation, depressed mood, dry skin and
      hair, feeling cold, hair loss, hoarseness or husky voice, muscle cramps and
      stiffness, slowed heartbeat, weight gain, or unusual tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you or your child has hip or knee pain,
      or a painless limp. These may be symptoms of hip joint problems (eg, slipped
      capital femoral epiphysis, slipped upper femoral epiphysis).
  - type: paragraph
    text: Talk with your doctor before using this medicine if you plan to have children.
      Some patients using this medicine have become infertile (unable to have children).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - blurred vision
      - chest tightness
      - constipation
      - coughing up blood
      - depressed mood
      - diarrhea
      - difficulty in breathing or swallowing
      - dizziness or fainting
      - dry skin and hair
      - feeling cold
      - hair loss
      - headache
      - hoarseness or husky voice
      - increased menstrual flow or vaginal bleeding
      - muscle cramps and stiffness
      - nervousness
      - nosebleeds
      - paralysis
      - pounding in the ears
      - prolonged bleeding from cuts
      - red or black, tarry stools
      - red or dark brown urine
      - slow, fast, irregular, or pounding heartbeat
      - stomach pain
      - swelling of the hands, ankles, feet, or lower legs
      - unusual tiredness or weakness
      - vomiting of blood or material that looks like coffee grounds
      - weight gain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - cough
      - fever or chills
      - general feeling of discomfort or illness
      - hives, itching, skin rash
      - hip or knee pain
      - irritation
      - joint pain, stiffness, or swelling
      - loss of appetite
      - lower back or side pain
      - nausea and vomiting
      - limping
      - redness of the skin
      - sore throat
      - stomach tenderness
      - swelling of the eyelids, face, or lips
      - thickening of bronchial secretions
      - trouble breathing
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry mouth
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
