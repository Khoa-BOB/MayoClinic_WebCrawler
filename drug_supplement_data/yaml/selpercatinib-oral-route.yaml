    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Heart disease or
      - Heart rhythm problems (eg, long QT syndrome, slow heartbeat, uncontrolled
        heart failure) or
      - Hypertension (high blood pressure), controlled or
      - Liver disease or
      - Lung or breathing problems or
      - Thyroid problems—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Hypertension (high blood pressure), uncontrolled or
      - Hypocalcemia (low calcium in the blood) or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood)—These conditions must be corrected
        first before using and during treatment with this medicine.
    - type: list
      ordered: false
      items:
      - Surgery, recent—Use with caution. May cause side effects to become worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. It is very important
      that you read and understand this information. Be sure to ask your doctor about
      anything you do not understand.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the capsule and tablet whole. Do not crush or chew it. Do not take
      the capsule if you are unable to swallow it.
  - type: paragraph
    text: Take this medicine at least 2 hours before or 2 hours after taking antacids
      that contain aluminum, calcium, magnesium, simethicone, or buffered medicines.
  - type: paragraph
    text: Take this medicine at least 2 hours before or 10 hours after taking an H2
      blocker (eg, cimetidine, famotidine, nizatidine).
  - type: paragraph
    text: Take this medicine with food if you are also taking a proton pump inhibitor
      (eg, dexlansoprazole, esomeprazole, lansoprazole, omeprazole, pantoprazole sodium,
      rabeprazole).
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules or tablets): For non-small cell lung cancer
        (NSCLC): Adults weighing 50 kilograms (kg) or more—160 milligrams (mg) 2 times
        a day. Your doctor may adjust your dose as needed and tolerated. Adults weighing
        less than 50 kg—120 mg 2 times a day. Your doctor may adjust your dose as
        needed and tolerated. Children—Use and dose must be determined by your doctor.
        For medullary thyroid cancer (MTC), solid tumors, and thyroid cancer: Adults
        and children 12 years of age and older weighing 50 kilograms (kg) or more—160
        milligrams (mg) 2 times a day. Your doctor may adjust your dose as needed
        and tolerated. Adults and children 12 years of age and older weighing less
        than 50 kg—120 mg 2 times a day. Your doctor may adjust your dose as needed
        and tolerated. Children 2 to less than 12 years of age—Dose is based on body
        surface area (BSA) and must be determined by your doctor. BSA of 1.53 meter
        squared (m2) or more—160 milligrams (mg) 2 times a day. Your doctor may adjust
        your dose as needed and tolerated. BSA of 1.09 to 1.52 m2—120 mg 2 times a
        day. Your doctor may adjust your dose as needed and tolerated. BSA of 0.66
        to 1.08 m2—80 mg 2 times a day. Your doctor may adjust your dose as needed
        and tolerated. BSA of 0.33 to 0.65 m2—40 mg 3 times a day. Your doctor may
        adjust your dose as needed and tolerated. Children younger than 2 years of
        age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For non-small cell lung cancer (NSCLC): Adults weighing 50 kilograms (kg)
        or more—160 milligrams (mg) 2 times a day. Your doctor may adjust your dose
        as needed and tolerated. Adults weighing less than 50 kg—120 mg 2 times a
        day. Your doctor may adjust your dose as needed and tolerated. Children—Use
        and dose must be determined by your doctor.'
      - 'For medullary thyroid cancer (MTC), solid tumors, and thyroid cancer: Adults
        and children 12 years of age and older weighing 50 kilograms (kg) or more—160
