title: Varicella-zoster immune globulin (intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Varicella Zoster Immune Globulin
    - type: paragraph
      text: Varizig
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Varicella-zoster immune globulin is used to prevent exposure of varicella
      virus in high risk individuals, such as adults and children with weakened immune
      system, pregnant women, premature babies, and babies younger than 1 year of
      age.
  - type: paragraph
    text: Varicella-zoster immune globulin works by giving your body the antibodies
      it needs to protect it against varicella-zoster virus (VZV). This is called
      passive protection. This passive protection lasts long enough to protect your
      body until your body can produce its own antibodies against VZV.
  - type: paragraph
    text: Varicella (commonly known as chickenpox) is an infection that is easily
      spread from one person to another. Chickenpox is usually a mild infection but
      sometimes it can cause serious problems, such as pneumonia, inflammation of
      the brain, and a rare disease called Reye's syndrome.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor
      or other health care professional.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of varicella-zoster immune globulin
        in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of varicella-zoster immune globulin
        in the elderly. However, elderly patients are more likely to have blood clotting
        problems which may require caution in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Dengue Tetravalent Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Poliovirus Vaccine, Live
      - Rotavirus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
      - Zoster Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to human immune globulin—Should not be used in patients with this
        condition.
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Thrombocytopenia (low number of platelets), severe—Use with caution. May make
        these conditions worse.
    - type: list
      ordered: false
      items:
      - Immunoglobulin A (IgA) deficiencies—Varicella-zoster immune globulin may cause
        an allergic reaction to occur.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: You will receive this medicine while you are in a hospital or clinic. A
      doctor, nurse, or other trained health professional will give you this medicine.
      It is given as a shot upper arm (deltoid) or thigh muscle.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you closely to make sure that
      this medicine is working properly. Blood tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: This medicine may cause serious types of allergic reactions, including anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Tell your doctor right away if you have a rash, itching, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth after you
      receive the medicine.
  - type: paragraph
    text: Blood clotting problems may occur while you are receiving this medicine.
      This is more likely to occur if you are an elderly, or if you have a history
      of atherosclerosis (hardening of the fats in the arteries), heart and blood
      vessel problems, bleeding problems, or prolonged time of not standing up or
      sitting down. Tell your doctor right away if you have chest pain, trouble breathing,
      numbness or weakness in your arm or leg, or on one side of your body, trouble
      seeing or speaking, or sudden or severe headache.
  - type: paragraph
    text: This medicine is made from donated human blood. Some human blood products
      have transmitted viruses to people who have received them, although the risk
      is low. Human donors and donated blood are both tested for viruses to keep the
      transmission risk low. Talk with your doctor about this risk if you are concerned.
  - type: paragraph
    text: While you are being treated with varicella-zoster immune globulin, do not
      have any immunizations (vaccinations) without your doctor's approval. Live virus
      vaccines (e.g., measles, mumps, rubella, varicella) should not be given within
      3 months after receiving this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - nausea
      - rash
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hives
      - itching
      - redness of the skin
      - shortness of breath
      - swelling of the eyelids, face, lips, hands, or feet
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - pain at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
