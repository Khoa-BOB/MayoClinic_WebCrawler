title: Ammoniated mercury (topical route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ammoniated mercury is used to treat impetigo, psoriasis, minor skin infections,
      and other skin disorders.
  - type: paragraph
    text: This medicine is available without a prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  - type: paragraph
    text: 'Carefully read and follow any precautions on the label. For ammoniated
      mercury, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use is not recommended, since children are especially sensitive to the
        effects of ammoniated mercury. This may increase the chance of side effects
        during treatment.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of ammoniated mercury in the
        elderly with use in other age groups.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Deep or open wounds or
      - Serious burns—Use of ammoniated mercury on these areas may cause mercury poisoning
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine only as directed. Do not
      use more of it and do not use it more often than recommended on the label, unless
      otherwise directed by your doctor. To do so may increase the chance of absorption
      through the skin and the risk of mercury poisoning.
  - type: paragraph
    text: Do not use this medicine on deep or open wounds or serious burns. To do
      so may cause mercury poisoning.
  - type: paragraph
    text: Keep this medicine away from the eyes.
  - type: paragraph
    text: Apply enough ointment to cover the affected area, and rub in gently.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (ointment): For bacterial infections: Adults—Apply
        to the affected area(s) of the skin one or two times a day. Children—Use is
        not recommended.'
    - type: list
      ordered: false
      items:
      - 'For bacterial infections: Adults—Apply to the affected area(s) of the skin
        one or two times a day. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—Apply to the affected area(s) of the skin one or two times a day.
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Do not use any topical iodine-containing preparations (for example, iodine
      solution, iodine tincture, or povidone-iodine) on the same affected area as
      this medicine. To do so may increase the possibility of side effects. If you
      have any questions about this, check with your health care professional.
  - type: paragraph
    text: Do not use any sulfur-containing preparations on the same affected area
      as this medicine. To do so may cause a foul odor, may irritate the skin, and
      may stain the skin black. If you have any questions about this, check with your
      health care professional.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  - type: list
    ordered: false
    items:
    - Skin infection or irritation not present before use of this medicine
  subsections:
  - heading: Symptoms of mercury poisoning
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cloudy urine
      - dizziness
      - headache (continuing or severe)
      - irritation, soreness, or swelling of gums
      - nausea
      - skin rash or unusual redness of skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
