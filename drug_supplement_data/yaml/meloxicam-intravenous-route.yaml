      - Bufexamac
      - Bumetanide
      - Cangrelor
      - Cannabidiol
      - Capecitabine
      - Carbamazepine
      - Celecoxib
      - Ceritinib
      - Certoparin
      - Chlorothiazide
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acebutolol
      - Atenolol
      - Azilsartan
      - Azilsartan Medoxomil
      - Benazepril
      - Betaxolol
      - Bisoprolol
      - Candesartan
      - Captopril
      - Carteolol
      - Carvedilol
      - Celiprolol
      - Enalapril
      - Enalaprilat
      - Eprosartan
      - Esmolol
      - Fosinopril
      - Irbesartan
      - Itraconazole
      - Labetalol
