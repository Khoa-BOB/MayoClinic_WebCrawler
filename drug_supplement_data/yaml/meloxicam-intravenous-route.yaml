    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Asthma or
      - Bleeding problems or
      - Congestive heart failure or
      - Dehydration or
      - Edema (fluid retention or body swelling) or
      - Heart attack, recent or history of or
      - Heart or blood vessel disease or
      - Hyperkalemia (high blood potassium) or
      - Hypertension (high blood pressure) or
      - Liver disease or
      - Stomach ulcers or bleeding, history of or
      - Stroke, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Aspirin-sensitive asthma or
      - Aspirin sensitivity, history of or
      - Kidney disease, moderate to severe—Should not be used in patients with these
        conditions.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Hypovolemia—Must be corrected first before using this medicine.
    - type: list
      ordered: false
      items:
      - Heart surgery (eg, coronary artery bypass graft [CABG])—Should not be used
        to relieve pain right before or after the surgery.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. This medicine is given through an IV catheter that is placed
      in one of your veins.
  - type: paragraph
    text: Drink extra fluids so you will urinate more often and help prevent kidney
      problems.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress closely while
      you are receiving this medicine to make sure that this medicine is working properly.
      Blood and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may increase your risk of having a heart attack, blood clot,
      or stroke. This is more likely to occur in people who already have heart and
      blood vessel disease and who are using this medicine for a long time. Check
      with your doctor right away if you are having chest pain or discomfort, nausea
      or vomiting, pain or discomfort in the arms, jaw, back, or neck, trouble breathing,
      slurred speech, or weakness.
  - type: paragraph
    text: Meloxicam may cause bleeding in your stomach or bowels. This problem can
      happen without warning signs. This is more likely to occur if you have had a
      stomach ulcer in the past, if you smoke or drink alcohol regularly, if you are
      over 60 years of age, are in poor health, or are using certain other medicines
      (eg, steroids, blood thinner). Call your doctor right away if you have severe
      stomach pain, black, tarry stools, or are vomiting blood or material that looks
      like coffee grounds.
  - type: paragraph
    text: Check with your doctor right away if you or your child have pain or tenderness
      in the upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. You might need to measure
      your blood pressure at home. If you think your blood pressure is too high, call
      your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, troubled breathing, unusual tiredness or weakness, vomiting,
      or weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have stomach pain, confusion,
      difficulty with breathing, irregular heartbeat, nausea or vomiting, nervousness,
      numbness or tingling in the hands, feet, or lips, or weakness or heaviness of
      the legs.
  - type: paragraph
    text: Serious side effects can occur during treatment with this medicine and can
      occur without warning. However, possible warning signs often occur, including
      severe stomach pain, black tarry stools, vomiting of blood or material that
      looks like coffee grounds, skin rash, swelling of the face, fingers, feet, or
      lower legs. Also, signs of serious heart problems could occur such as chest
      pain, tightness in the chest, fast or irregular heartbeat, or unusual flushing
      or warmth of the skin. Check with your doctor immediately if you notice any
      of these warning signs .
  - type: paragraph
    text: This medicine may cause a serious allergic reaction called anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, trouble breathing or swallowing,
      or any swelling of your hands, face, or mouth while you are using this medicine.
  - type: paragraph
    text: Serious skin reactions, including Stevens-Johnson syndrome, exfoliative
      dermatitis, and toxic epidermal necrolysis can occur during treatment with this
      medicine. Check with your doctor right away if you have blistering, peeling,
      or loosening of the skin, red skin lesions, severe acne or skin rash, sores
      or ulcers on the skin, or fever or chills while you or your child are using
      this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have black, tarry stools, chest
      pain, chills, cough, fever, painful or difficult urination, sore throat, sores,
      ulcers, or white spots in the mouth or on the lips, swollen glands, unusual
      bleeding or bruising, or unusual tiredness or weakness. These may be symptoms
      of serious skin reaction called drug reaction with eosinophilia and systemic
      symptoms (DRESS).
  - type: paragraph
    text: Using this medicine during the later part of a pregnancy can harm your unborn
      baby. If you think you have become pregnant while using the medicine, tell your
      doctor right away.
  - type: paragraph
    text: This medicine may cause a delay in ovulation for women and may decrease
      sperm count in men, which can affect their ability to have children. If you
      plan to have children, talk with your doctor before using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody or black, tarry stools
      - constipation
      - dark urine
      - decreased appetite
      - diarrhea
      - dry mouth
      - fever
      - headache
      - heartburn
      - increased thirst
      - indigestion
      - itching or skin rash
      - loss of appetite
      - mood changes
      - muscle pain or cramps
      - nausea and vomiting
      - numbness or tingling in the hands, feet, or lips
      - seizures
      - stomach pain, cramping, burning, or tenderness
      - swelling of the feet or lower legs
      - trouble breathing
      - unusual tiredness or weakness
      - vomiting of material that looks like coffee grounds, severe and continuing
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - bloody or cloudy urine
      - chest pain or tightness
      - chills
      - cough
      - cough or hoarseness
      - decrease in the frequency of urination
      - decrease in urine volume
      - difficulty in passing urine (dribbling)
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - fever with or without chills
      - general feeling of tiredness or weakness
      - greatly decreased frequency of urination or amount of urine
      - hives, itching
      - lower back or side pain
      - pains in the chest, groin, or legs, especially calves of the legs
      - painful or difficult urination
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red, irritated eyes
      - red skin lesions, often with a purple center
      - severe headaches of sudden onset
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - sudden loss of coordination
      - sudden onset of shortness of breath for no apparent reason
      - sudden onset of slurred speech
      - sudden vision changes
      - swelling of the feet or lower legs
      - swollen glands
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
