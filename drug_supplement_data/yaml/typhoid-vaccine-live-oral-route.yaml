    - type: paragraph
      text: Receiving this vaccine with any of the following medicines may cause an
        increased risk of certain side effects, but using both drugs may be the best
        treatment for you. If both medicines are prescribed together, your doctor
        may change the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Abatacept
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diarrhea or
      - Fever or
      - Other illness (severe) or
      - Stomach or intestinal illness (severe) or
      - Vomiting—These conditions may reduce the useful effect of the vaccine.
    - type: list
      ordered: false
      items:
      - Immune deficiency condition, including HIV or AIDS—May increase the chance
        of side effects from the vaccine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is important that all 4 doses of the vaccine be taken exactly as directed.
      If all the doses are not taken or if doses are not taken at the correct times,
      the vaccine may not work properly.
  - type: paragraph
    text: The vaccine capsules are meant to dissolve in the intestines. Therefore,
      they should be inspected to make sure that they are not broken or cracked when
      you take them. If any are broken or cracked, you will need to replace them.
  - type: paragraph
    text: Typhoid vaccine must be stored in the refrigerator at a temperature between
      2 and 8 degrees C (35.6 and 46.4 degrees F) at all times. If the vaccine is
      left at room temperature, it will lose its effectiveness. Therefore, remember
      to replace unused vaccine in the refrigerator between doses.
  - type: paragraph
    text: Each dose of the vaccine should be taken approximately 1 hour before a meal.
      Take with a cold or lukewarm drink that has a temperature that does not exceed
      body temperature (eg, 37 degrees C or 98.6 degrees F).
  - type: paragraph
    text: Swallow the capsule whole. Do not chew it before swallowing. Also swallow
      the capsule as soon as possible after you place it in your mouth.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - Take 1 capsule by mouth every other day for a total of 4 doses.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    - type: paragraph
      text: If you do not remember the missed dose until the next day, take the missed
        dose at that time and reschedule your every-other-day doses from then. It
        is important that this vaccine be taken exactly as directed so it can give
        you the most protection against typhoid fever.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Tell all of your doctors that you have taken this vaccine if you plan to
      receive any other live vaccines within 1 month after the last dose.
  - type: paragraph
    text: If you are receiving this vaccine, do not take proguanil (Paludrine(R))
      as a single medicine (not available in the United States) for at least 10 days
      after your last dose.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  - type: list
    ordered: false
    items:
    - Difficulty with breathing or swallowing
    - hives
    - itching, especially of the feet or hands
    - reddening of the skin, especially around the ears
    - swelling of the eyes, face, or inside of the nose
    - unusual tiredness or weakness that is sudden and severe
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - fever
      - nausea
      - skin rash
      - stomach cramps or pain
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
