title: Typhoid vaccine, live (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Vivotif
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Typhoid fever is a serious disease that can cause death. It is caused by
      a germ called Salmonella typhi, and is spread most often through infected food
      or water. Typhoid may also be spread by close person-to-person contact with
      infected persons (such as occurs with persons living in the same household).
      Some infected persons do not appear to be sick, but they can still spread the
      germ to others.
  - type: paragraph
    text: 'Typhoid fever is very rare in the United States (U.S.) and other areas
      of the world that have good water and sewage (waste) systems. However, it is
      a problem in parts of the world that do not have such systems. If you are traveling
      to certain countries or remote areas, typhoid vaccine will help protect you
      from typhoid fever. The U.S. CDC recommends caution in the following areas of
      the world:'
  - type: list
    ordered: false
    items:
    - Africa
    - Asia
    - Latin America
  - type: paragraph
    text: Typhoid vaccine taken by mouth helps prevent typhoid fever, but does not
      provide 100% protection. Therefore, it is very important to avoid infected persons
      and food and water that may be infected, even if you have taken the vaccine.
  - type: paragraph
    text: To get the best possible protection against typhoid, you should complete
      the vaccine dosing schedule (all 4 doses of the vaccine) at least 1 week before
      travel to areas where you may be exposed to typhoid.
  - type: paragraph
    text: If you will be traveling regularly to parts of the world where typhoid is
      a problem, you should get a booster (repeat) dose of the vaccine every 5 years.
  - type: paragraph
    text: Typhoid vaccine is available only from a health care professional.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Typhoid vaccine is not recommended for infants and children up to 6 years
        of age. Although there is no specific information comparing use of typhoid
        vaccine in children 6 years of age and over with use in other age groups,
        this vaccine is not expected to cause different side effects or problems in
        these children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of typhoid
        vaccine in the elderly with use in other age groups, this vaccine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is not recommended.
        Your doctor may decide not to use this vaccine or change some of the other
        medicines you take.
    - type: list
      ordered: false
      items:
      - Abarelix
      - Abemaciclib
      - Abiraterone
