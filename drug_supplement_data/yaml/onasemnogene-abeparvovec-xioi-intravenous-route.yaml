title: Onasemnogene abeparvovec-xioi (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Zolgensma
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Onasemnogene abeparvovec-xioi injection is used to treat spinal muscular
      atrophy (SMA) with bi-allelic mutations in the survival motor neuron 1 (SMN1)
      gene. Spinal muscular atrophy is a rare neuromuscular disorder that is characterized
      by loss of lower motor neurons and progressive muscle wasting, often leading
      to early death. Onasemnogene abeparvovec-xioi is an adeno-associated virus vector-based
      gene treatment that works by copying the gene needed for the human SMN protein.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of onasemnogene abeparvovec-xioi
        injection in newborns to children younger than 2 years of age. However, use
        is not recommended in premature infants. Safety and efficacy have been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of onasemnogene abeparvovec-xioi injection in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart disease or
      - Infection, active or
      - Liver disease or
      - Thrombocytopenia (low platelet count)—Use with caution. May make these conditions
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give your child this medicine
      in a medical facility. It is given through a needle placed into one of your
      child's veins. The medicine must be given slowly, so the needle will have to
      stay in place for at least 60 minutes.
  - type: paragraph
    text: Your doctor may give your child other medicines (eg, steroids) before and
      after the infusion to prevent unwanted effects.
  - type: paragraph
    text: Your doctor may also give your child a vaccine to prevent respiratory syncytial
      virus. Talk to your doctor if you have concerns.
  - type: paragraph
    text: This medicine is a virus vector-based gene treatment and may spread to other
      people through body waste (feces). Seal diapers in trash bags and throw them
      into the trash. Wash your hands with soap and water before and after handling
      your child's body waste. Follow these precautions during treatment with this
      medicine and for 1 month after the infusion.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your child's progress closely
      while receiving the medicine to make sure it is working properly. Blood and
      urine tests are needed to check for unwanted effects.
  - type: paragraph
    text: Check with your doctor right away if your child has pain or tenderness in
      the upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may cause heart problems. Check with your doctor right away
      if your child has chest pain or discomfort, fast or irregular heartbeat, swelling
      of the feet and lower legs, or trouble breathing.
  - type: paragraph
    text: This medicine may cause your child to bruise or bleed more easily. Be extra
      careful to avoid injuries. Stay away from rough sports or other situations where
      you could be bruised, cut, or injured. Gently brush and floss your teeth. Be
      careful when using sharp objects, including razors and fingernail clippers.
  - type: paragraph
    text: Thrombotic microangiopathy (damage in the smallest blood vessels) may occur
      while you are using this medicine. Tell your doctor right away if your child
      have a decreased urine output, seizures, severe chest pain, sudden weakness
      in the arms or legs, or unusual bleeding or bruising.
  - type: paragraph
    text: Talk with your doctor before your child receives any vaccines during treatment
      with this medicine. The vaccination schedule should be adjusted as needed to
      fit in with the steroid treatment schedule.
  - type: paragraph
    text: This medicine may increase your risk of a tumor. Talk with your doctor if
      you have concerns about this.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Clay-colored stools
      - dark urine
      - decreased appetite
      - fever
      - headache
      - itching, skin rash
      - light-colored stools
      - loss of appetite
      - nausea
      - stomach pain or tenderness
      - swelling of the feet or lower legs
      - unusual tiredness or weakness
      - vomiting
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - blurred vision
      - confusion
      - decreased urine output
      - dizziness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - drowsiness
      - pinpoint red spots on the skin
      - seizures
      - sudden weakness in the arms or legs
      - sudden, severe chest pain
      - sweating
      - unusual bleeding or bruising
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
