title: Bumetanide (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Bumex
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Bumetanide belongs to a group of medicines called loop diuretics or "water
      pills." Bumetanide is given to help treat fluid retention (edema) and swelling
      that is caused by congestive heart failure, liver disease, kidney disease, or
      other medical conditions. It works by acting on the kidneys to increase the
      flow of urine .
  - type: paragraph
    text: This medicine is available only with your doctor's prescription .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of bumetanide injection in the pediatric population. Safety
        and efficacy have not been established .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatrics-specific
        problems that would limit the usefulness of bumetanide injection in the elderly.
        However, elderly patients are more likely to have age-related liver, kidney
        or heart problems, which may require an adjustment of dosage in patients receiving
        bumetanide injection .
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Desmopressin
      - Methenamine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aceclofenac
      - Acemetacin
      - Albuterol
      - Amikacin
      - Amikacin Liposome
      - Amtolmetin Guacil
      - Arsenic Trioxide
      - Articaine
      - Aspirin
      - Benzhydrocodone
      - Bepridil
      - Bromfenac
      - Bufexamac
      - Buprenorphine
      - Cefepime
      - Celecoxib
      - Choline Salicylate
      - Clonixin
      - Codeine
      - Dexibuprofen
      - Dexketoprofen
      - Diazoxide
      - Diclofenac
      - Diflunisal
      - Digitoxin
      - Dihydrocodeine
      - Dipyrone
      - Dofetilide
      - Droperidol
      - Droxicam
      - Epinephrine
      - Ethacrynic Acid
      - Etodolac
      - Etofenamate
      - Etoricoxib
      - Felbinac
      - Fenoprofen
      - Fentanyl
      - Fepradinol
      - Feprazone
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Benazepril
      - Captopril
      - Cilazapril
      - Dibekacin
      - Enalapril
      - Enalaprilat
      - Fosinopril
      - Germanium
      - Ginseng
      - Gossypol
      - Licorice
      - Lisinopril
      - Moexipril
      - Perindopril
      - Quinapril
      - Ramipril
      - Spirapril
      - Trandolapril
      - Zofenopril
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anuria (not able to form urine) or
      - Liver disease, severe (e.g., hepatic coma)—Should not use in patients with
        these conditions .
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Gout or
      - Hearing problems or
      - Hyperuricemia (high uric acid in the blood) or
      - Hypocalcemia (low calcium in the blood) or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood) or
      - Hypovolemia (low blood volume) or
      - Thrombocytopenia (low platelets in the blood)—Use with caution. This medicine
        may make these conditions worse .
    - type: list
      ordered: false
      items:
      - Diabetes—This medicine may increase the amount of sugar in the blood .
    - type: list
      ordered: false
      items:
      - Kidney disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body .
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given through a needle placed into one of your veins .
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will only give you a few doses of this medicine until your condition
      improves, and then you will be switched to another medicine that works the same
      way. If you have any concerns about this, talk to your doctor .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal pain
      - blurred vision
      - confusion
      - decreased urine output
      - dizziness
      - drowsiness
      - dry mouth
      - fast or irregular heartbeat
      - flushed, dry skin
      - fruit-like breath odor
      - headache
      - increased hunger
      - increased thirst
      - increased urination
      - irritability
      - joint pain, stiffness, or swelling
      - loss of appetite
      - loss of mental alertness
      - lower back, side, or stomach pain
      - mood or mental changes
      - muscle pain or cramps
      - nausea or vomiting
      - numbness or tingling in the hands, feet, or lips
      - shortness of breath
      - sweating
      - swelling of face, hands, feet, ankles, or lower legs
      - troubled breathing
      - unexplained weight loss
      - unusual tiredness or weakness
      - weak pulse
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - back pain
      - black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - chest pain
      - convulsions (seizures)
      - deep or fast breathing with dizziness
      - dizziness, faintness, or lightheadedness when getting up from a lying or sitting
        position suddenly
      - fever
      - hallucinations
      - hives
      - increase in heart rate
      - increased blood pressure
      - numbness of feet, hands, and around the mouth
      - pinpoint red spots on the skin
      - rapid breathing
      - stiff neck
      - sunken eyes
      - trembling, jerking of hands
      - unusual bleeding or bruising
      - weight gain
      - wrinkled skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty breathing
      - pain in chest, groin, or legs, especially the calves
      - severe, sudden headache
      - slurred speech
      - sudden loss of coordination
      - sudden, severe weakness or numbness in the arm or leg
      - sudden, unexplained shortness of breath
      - tenderness, pain, swelling, warmth, skin discoloration, and prominent superficial
        veins over affected area
      - unusual drowsiness, dullness, or feeling of sluggishness
      - vision changes
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased interest in sexual intercourse
      - diarrhea
      - difficulty with moving
      - ear discomfort
      - feeling of constant movement of self or surroundings
      - inability to have or keep an erection
      - itching skin
      - loss in sexual ability, desire, drive, or performance
      - muscle or bone pain
      - muscle stiffness
      - nipple tenderness
      - pain, swelling, or redness in joints
      - rash
      - sensation of spinning
      - shorter than usual time to ejaculation of semen
      - trouble with hearing
      - upset stomach
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
