title: Safinamide (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Xadago
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Safinamide is used in combination with levodopa and carbidopa to treat adults
      with Parkinson's disease who are having "off" episodes. This medicine is a MAO-B
      inhibitor that works to increase and extend the effects of levodopa and may
      help to slow the progress of Parkinson's disease.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of safinamide in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of safinamide in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Alfentanil
      - Amineptine
      - Amitriptyline
      - Amitriptylinoxide
      - Amoxapine
      - Amphetamine
      - Anileridine
      - Apraclonidine
      - Atomoxetine
      - Benzhydrocodone
      - Benzphetamine
      - Brimonidine
      - Buprenorphine
      - Bupropion
      - Butorphanol
      - Carbamazepine
      - Carbinoxamine
      - Citalopram
      - Clomipramine
      - Codeine
      - Cyclobenzaprine
      - Cyproheptadine
      - Desipramine
      - Desvenlafaxine
      - Deutetrabenazine
      - Dexmethylphenidate
      - Dextroamphetamine
      - Dextromethorphan
      - Diacetylmorphine
      - Dibenzepin
      - Difenoxin
      - Dihydrocodeine
      - Diphenoxylate
      - Doxepin
      - Doxylamine
      - Duloxetine
      - Escitalopram
      - Ethylmorphine
      - Fenfluramine
      - Fentanyl
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Albuterol
      - Amlodipine
      - Atogepant
      - Atropine
      - Butalbital
      - Carbidopa
      - Cariprazine
      - Droperidol
      - Epinephrine
      - Formoterol
      - Foscarbidopa
      - Foslevodopa
      - Granisetron
      - Hydroxychloroquine
      - Iobenguane I 131
      - Isoflurane
      - Landiolol
      - Lasmiditan
      - Levodopa
      - Lithium
      - Metaxalone
      - Metoclopramide
      - Midodrine
      - Nifedipine
      - Norepinephrine
      - Oliceridine
      - Ondansetron
      - Oxymetazoline
      - Palonosetron
      - Pimozide
      - Tizanidine
      - Valbenazine
      - Vilanterol
      - Voriconazole
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Chlorpropamide
      - Glimepiride
      - Glipizide
      - Glyburide
      - Insulin
      - Insulin Aspart, Recombinant
      - Insulin Bovine
      - Insulin Degludec
      - Insulin Detemir
      - Insulin Glargine, Recombinant
      - Insulin Glulisine
      - Insulin Lispro, Recombinant
      - Metformin
      - Nateglinide
      - Repaglinide
      - Tolazamide
      - Tolbutamide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Avocado
      - Tyramine Containing Food
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Dyskinesia (abnormal muscle movements) or
      - Eye problems (eg, diabetic retinopathy, retinal or macular degeneration, uveitis),
        or family history of or
      - Hypertension (high blood pressure) or
      - Mental illness (eg, psychosis)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Liver disease, moderate—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Should not be used in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the tablet whole. Do not crush, break, or chew it. You may take
      this medicine with or without food.
  - type: paragraph
    text: Take this medicine at the same time each day.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of Parkinson''s disease with
        "off" episodes: Adults—At first, 50 milligrams (mg) once a day. After 2 weeks,
        your doctor may increase your dose to 100 mg once a day. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of Parkinson''s disease with "off" episodes: Adults—At first,
        50 milligrams (mg) once a day. After 2 weeks, your doctor may increase your
        dose to 100 mg once a day. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 50 milligrams (mg) once a day. After 2 weeks, your doctor
        may increase your dose to 100 mg once a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you missed a dose, take the next dose at the same time the next day.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to allow for changes in your dose and to check for any unwanted effects.
  - type: paragraph
    text: Do not take safinamide if you are also using amphetamine, cyclobenzaprine,
      dextromethorphan (eg, Pediacare®, Robitussin®), methylphenidate (Ritalin®),
      St. John's wort, other MAO inhibitors (MAOI) (eg, isocarboxazid, linezolid,
      phenelzine, selegiline, tranylcypromine, Eldepryl®, Marplan®, Nardil®, or Parnate®),
      narcotic pain medicines (eg, meperidine, methadone,  propoxyphene, tramadol,
      Darvon®, Dolophine®, Ultram®), or medicine to treat depression (eg, amitriptyline,
      desvenlafaxine, duloxetine, milnacipran, nortriptyline, venlafaxine, Cymbalta®,
      Effexor® XR, Elavil®, Pamelor®, Pristiq®). Using these medicines together may
      cause serious unwanted effects .
  - type: paragraph
    text: Check with your doctor right away if you have anxiety, restlessness, a fast
      heartbeat, fever, sweating, muscle spasms, twitching, nausea, vomiting, diarrhea,
      or see or hear things that are not there. These may be symptoms of a serious
      condition called serotonin syndrome. Your risk may be higher if you also take
      certain other medicines that affect serotonin levels in your body.
  - type: paragraph
    text: This medicine may make you drowsy. It may even cause you to fall asleep
      without warning while you drive, talk, or eat. Do not drive or do anything that
      could be dangerous until you know how this medicine affects you .
  - type: paragraph
    text: Some people who have used this medicine had unusual changes in their behavior.
      Talk with your doctor if you start having problems with gambling or increased
      interest in sex while using this medicine.
  - type: paragraph
    text: Do not stop taking this medicine without first checking with your doctor
      . Your doctor may want you to reduce gradually the amount you are taking before
      stopping completely.
  - type: paragraph
    text: Avoid foods and drinks that are high in tyramine, because your blood pressure
      could get dangerously high. Your doctor should give you a complete list. In
      general, do not eat anything aged, fermented, or smoked, such as most cheese,
      most alcohol, cured meat (such as salami), pickled foods, sauerkraut, and soy
      sauce. Check the expiration dates on packages. Tyramine levels get higher as
      food gets older or if it has not been refrigerated properly.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes prescription or nonprescription (over-the-counter)
      medicines for appetite control, asthma, colds, cough, hay fever, or sinus problems,
      since they may increase your blood pressure.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - dizziness
      - headache
      - nervousness
      - pounding in the ears
      - slow or fast heartbeat
      - twitching, twisting, uncontrolled repetitive movements of the tongue, lips,
        face, arms, or legs
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - cold sweats
      - confusion
      - dizziness, faintness, or lightheadedness when getting up from lying or sitting
        position
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - confusion
      - diarrhea
      - feeling that others are watching you or controlling your behavior
      - feeling that others can hear your thoughts
      - feeling, seeing, or hearing things that are not there
      - fever
      - overactive reflexes
      - poor coordination
      - restlessness
      - severe mood or mental changes
      - shivering
      - sweating
      - talking or acting with excitement you cannot control
      - trembling or shaking
      - trouble breathing
      - unusual behavior
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - cough
      - heartburn
      - indigestion
      - stomach discomfort, upset, or pain
      - trouble sleeping
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin rash
      - swelling of the gums and tongue
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
