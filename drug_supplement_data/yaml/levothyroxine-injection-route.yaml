title: Levothyroxine (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Synthroid
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Levothyroxine injection is used to treat myxedema coma (severe hypothyroidism),
      a condition where the thyroid gland does not produce enough thyroid hormone.
      The powder form of levothyroxine injection can be used as a substitute for the
      oral dose when a rapid effect is needed and when the oral route is not allowed.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatrics-specific
        problems that would limit the usefulness of levothyroxine injection in the
        pediatric population.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of levothyroxine injection in the
        elderly. However, elderly patients are more likely to have age-related heart
        and blood vessel problems, which may require caution in patients receiving
        levothyroxine injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Digitalis
      - Digoxin
      - Epinephrine
      - Furosemide
      - Iomeprol
      - Iopromide
      - Ketamine
      - Midodrine
      - Orlistat
      - Rifampin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Afatinib
      - Alectinib
      - Amiodarone
      - Baricitinib
      - Capmatinib
      - Chlorotrianisene
      - Cholestyramine
      - Chromium
      - Colesevelam
      - Conjugated Estrogens
      - Conjugated Estrogens Synthetic A
      - Conjugated Estrogens Synthetic B
      - Dexlansoprazole
      - Dienestrol
      - Diethylstilbestrol
      - Esomeprazole
      - Esterified Estrogens
      - Estradiol
      - Estramustine
      - Estriol
      - Estropipate
      - Ethinyl Estradiol
      - Fosphenytoin
      - Fostamatinib
      - Gefitinib
      - Imatinib
      - Kelp
      - Lansoprazole
      - Lanthanum Carbonate
      - Lopinavir
      - Mestranol
      - Mifepristone
      - Nintedanib
      - Omeprazole
      - Pantoprazole
      - Phenytoin
      - Polyestradiol Phosphate
      - Promestriene
      - Quinestrol
      - Rabeprazole
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Dietary Fiber
      - Grapefruit Juice
      - Soybean
      - Walnut
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Adrenal insufficiency or Addison's disease (adrenal gland problem), uncorrected
        or
      - Thyrotoxicosis (overactive thyroid)—Should not be used in patients with these
        conditions.
    - type: list
      ordered: false
      items:
      - Clotting disorder or
      - Diabetes or
      - Heart disease (history of) or
      - Underactive pituitary gland—Use with caution. May side effects to become worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins.
  - type: paragraph
    text: You will receive a few doses of this medicine, then your doctor may switch
      you to an oral dosage form.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection form (powder for solution): For the treatment of hypothyroidism:
        Adults—50 to 100 micrograms (mcg) injected into a muscle or vein once a day.
        People with very serious conditions caused by too little thyroid hormone may
        need higher doses. Children—Dose is based on body weight and must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For the treatment of hypothyroidism: Adults—50 to 100 micrograms (mcg) injected
        into a muscle or vein once a day. People with very serious conditions caused
        by too little thyroid hormone may need higher doses. Children—Dose is based
        on body weight and must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—50 to 100 micrograms (mcg) injected into a muscle or vein once a day.
        People with very serious conditions caused by too little thyroid hormone may
        need higher doses.
      - Children—Dose is based on body weight and must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For injection form (powder for solution): For myxedema coma: Adults—The loading
        dose is usually 300 to 500 micrograms (mcg) injected into a vein once a day.
        The maintenance dose is usually 50 to 100 mcg injected into a vein once a
        day. Your doctor may adjust your dose as needed and tolerated. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For myxedema coma: Adults—The loading dose is usually 300 to 500 micrograms
        (mcg) injected into a vein once a day. The maintenance dose is usually 50
        to 100 mcg injected into a vein once a day. Your doctor may adjust your dose
        as needed and tolerated. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - Adults—The loading dose is usually 300 to 500 micrograms (mcg) injected into
        a vein once a day. The maintenance dose is usually 50 to 100 mcg injected
        into a vein once a day. Your doctor may adjust your dose as needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to allow your doctor to see if the medicine is working properly and to decide
      if you should continue to take it. Blood tests will be needed to check for unwanted
      effects.
  - type: paragraph
    text: This medicine may increase your risk of heart rhythm problems or heart attack.
      Check with your doctor right away if you have dizziness, fainting, fast, slow,
      or irregular heartbeat, chest pain or discomfort, or pain or discomfort in the
      arms, jaw, back, or neck.
  - type: paragraph
    text: 'This medicine may cause new or worsening heart failure. Check with your
      doctor right away if you have more than one of these symptoms: chest pain, decreased
      urine output, dilated neck veins, extreme fatigue, irregular breathing, irregular
      heartbeat, swelling of the face, fingers, feet, or lower legs, tightness in
      the chest, trouble breathing, or weight gain.'
  - type: paragraph
    text: Levothyroxine should not be used for the treatment of obesity or for the
      purpose of losing weight. This medicine is ineffective for weight reduction
      and when taken in larger amounts may cause more serious medical conditions.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect the results of certain medical tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Seizures
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fast heartbeat
      - fever
      - hives, itching, skin rash
      - hoarseness
      - irritation
      - joint pain, stiffness, or swelling
      - redness of the skin
      - swelling of the eyelids, face, lips, hands, or feet
      - tightness in the chest
      - troubled breathing or swallowing
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    - type: list
      ordered: false
      items:
      - Anxiety
      - changes in menstrual periods
      - chest pain, discomfort, or heaviness
      - decreased urine output
      - diarrhea
      - dilated neck veins
      - excessive sweating
      - extreme tiredness or weakness
      - fainting
      - fast, pounding, or irregular heartbeat or pulse
      - feeling of warmth
      - hand tremors
      - headache
      - heat intolerance
      - increased appetite
      - leg cramps
      - mood changes
      - muscle weakness or spasm
      - nausea
      - nervousness
      - pain or discomfort in the arms, jaw, back, or neck
      - restlessness
      - sensitivity to heat
      - stomach cramps
      - sweating
      - trouble sleeping
      - trouble sitting still
      - vomiting
      - weight gain or loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
