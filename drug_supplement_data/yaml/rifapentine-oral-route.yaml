        isoniazid for 12 weeks. Weighing more than 50 kilograms (kg)—900 mg (6 tablets)
        once a week. Weighing 32.1 to 50 kg—750 mg (5 tablets) once a week. Weighing
        25.1 to 32 kg—600 mg (4 tablets) once a week. Weighing 14.1 to 25 kg—450 mg
        (3 tablets) once a week. Weighing 10 to 14 kg—300 mg (2 tablets) once a week.
        Children younger than 2 years of age—Use and dose must be determined by your
        doctor.'
