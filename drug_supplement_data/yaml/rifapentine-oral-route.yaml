    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - HIV infection—Use is not recommended to treat active tuberculosis in patients
        with this condition.
    - type: list
      ordered: false
      items:
      - Liver disease or
      - Porphyria (an enzyme problem)—Use with caution. May make these conditions
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance for side effects.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Take this medicine with food.
  - type: paragraph
    text: Swallow the tablet whole. If you cannot swallow it whole, you may crush
      it and add it to a small amount of semi-solid food. Take all of it right away
      and do not store it for later use.
  - type: paragraph
    text: To help clear up your infection completely, it is very important that you
      keep using this medicine for the full time of treatment , even if you begin
      to feel better after a few weeks. If you have TB, you might have to take rifapentine
      for several months. It is important that you not miss any doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For the treatment of active tuberculosis:
        Adults and children 12 years of age and older—600 milligrams (mg) 2 times
        a week with an interval of not less than 3 days (72 hours) between doses.
        Then, 600 mg once a week taken for 4 months with isoniazid or other medicines.
        Children younger than 12 years of age—Use and dose must be determined by your
        doctor. For the treatment of latent tuberculosis: Adults and children 12 years
        of age and older—Dose is based on body weight and must be determined by your
        doctor. The dose is usually up to 900 milligrams (mg) once a week taken with
        isoniazid for 12 weeks. Children 2 to 11 years of age—Dose is based on body
        weight and must be determined by your doctor. The dose is usually taken with
        isoniazid for 12 weeks. Weighing more than 50 kilograms (kg)—900 mg (6 tablets)
        once a week. Weighing 32.1 to 50 kg—750 mg (5 tablets) once a week. Weighing
        25.1 to 32 kg—600 mg (4 tablets) once a week. Weighing 14.1 to 25 kg—450 mg
        (3 tablets) once a week. Weighing 10 to 14 kg—300 mg (2 tablets) once a week.
        Children younger than 2 years of age—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - 'For the treatment of active tuberculosis: Adults and children 12 years of
        age and older—600 milligrams (mg) 2 times a week with an interval of not less
        than 3 days (72 hours) between doses. Then, 600 mg once a week taken for 4
        months with isoniazid or other medicines. Children younger than 12 years of
        age—Use and dose must be determined by your doctor.'
      - 'For the treatment of latent tuberculosis: Adults and children 12 years of
