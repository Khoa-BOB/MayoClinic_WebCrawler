    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Check with your doctor right away if you or your child have pain or tenderness
      in the upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Tell your doctor right away if you or your child have a rash, itching,
      hoarseness, trouble breathing, trouble swallowing, or large, hive-like swelling
      on face, eyelids, lips, tongue, throat, hands, legs, feet, or genitals after
      using this medicine.
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Check with your doctor
      right away if you or your child have blistering, peeling, or loosening of the
      skin, red skin lesions, severe acne or a skin rash, sores or ulcers on the skin,
      or fever or chills after using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you or your child have a fever, chills,
      cough, sore throat, swollen, painful, or tender lymph glands in the neck, armpit,
      or groin, or yellow skin or eyes while using this medicine. These could be symptoms
      of a serious condition called drug reaction with eosinophilia and systemic symptoms
      (DRESS).
  - type: paragraph
    text: Liver problems may be more likely to occur if you drink alcoholic beverages
      regularly while you are using this medicine. Also, the regular use of alcohol
      may keep this medicine from working properly. You should not drink alcoholic
      beverages while you are using this medicine.
  - type: paragraph
    text: Rifapentine will cause the urine, stools, saliva, sputum, sweat, and tears
      to turn reddish-orange to reddish-brown. This is to be expected while you are
      using this medicine. This effect may also cause soft contact lenses and dentures
      to become permanently discolored. Standard cleaning solutions may not take out
      all the discoloration. It is best not to wear soft contact lenses or dentures
      while using this medicine. Hard contact lenses are not discolored by rifapentine.
      If you have any questions about this, check with your doctor.
  - type: paragraph
    text: This medicine may cause diarrhea, and in some cases it can be severe. It
      may occur 2 months or more after you stop using this medicine. Do not take any
      medicine to treat diarrhea without first checking with your doctor. If you have
      any questions or if mild diarrhea continues or gets worse, check with your doctor.
  - type: paragraph
    text: Rifapentine can lower the number of white blood cells in your blood temporarily,
      increasing the chance of getting infection. It can also lower the number of
      platelets, which are necessary for proper blood clotting. These problems may
      result in a greater chance of getting certain infections, slow healing, and
      bleeding of the gums. Be careful when using a regular toothbrush, dental floss,
      or a toothpick. Dental work should be delayed until your blood counts have returned
      to normal. Check with your medical doctor or dentist if you have any questions
      about proper oral hygiene (mouth care) during treatment.
  - type: paragraph
    text: Before you have any medical tests, tell the doctor in charge that you are
      using this medicine. The results of some tests may be affected by this medicine.
  - type: paragraph
    text: Birth control pills may not work properly if you take them while you are
      using rifapentine. Use a non-hormonal form of birth control (eg, condoms, spermicide)
      while you are using rifapentine. If you have any questions about this, check
      with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chills
      - cough
      - coughing up blood
      - fever
      - hoarseness
      - lower back or side pain
      - painful or difficult urination
      - pale skin
      - skin rash
      - sore throat
      - trouble breathing with exertion
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - blood in the urine or stools
      - burning, dry, or itching eyes
      - excessive tearing of the eye
      - eye pain
      - fast heartbeat
      - general feeling of illness
      - headache
      - hives, itching
      - irritation
      - joint pain, stiffness, or swelling
      - loss of appetite
      - pinpoint red spots on the skin
      - redness of the skin
      - swelling of the eyelids, face, lips, hands, or feet
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
      - tightness in the chest
      - trouble breathing or swallowing
      - weight loss
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - bloating
      - blue or pale skin
      - burning feeling in the chest or stomach
      - burning, tingling, numbness, or pain in the hands, arms, feet, or legs
      - chest pain, possibly moving to the left arm, neck, or shoulder
      - cloudy or dark urine
      - cold sweat
      - collection of blood under the skin
      - confusion
      - constipation
      - deep, dark purple bruise
      - dizziness, fainting, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dry mouth
      - fast, pounding, or irregular heartbeat or pulse
      - heartburn
      - indigestion
      - itching in the genital or other skin areas
      - lack or loss of strength
      - light-colored stools
      - muscle pain
      - nausea
      - noisy breathing
      - pain in the lower back or side
      - pain or burning in the throat
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - right upper stomach pain and fullness
      - scaling of the skin
      - seizures
      - stabbing pain
      - stomach upset
      - tenderness, pain, swelling, warmth, skin discoloration, and prominent superficial
        veins over the affected area
      - thick, white vaginal discharge with mild or no odor
      - thickening of bronchial secretions
      - thirst
      - vaginal bleeding
      - voice changes
      - vomiting
      - yellow skin or eyes
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - diarrhea
      - red skin lesions, often with a purple center
      - sensitivity of the skin to the sun
      - thinning of the skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Increased sweating
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - difficulty in moving
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Discoloration of the skin
      - drowsiness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
