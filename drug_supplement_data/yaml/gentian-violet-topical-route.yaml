title: Gentian violet (topical route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Gentian violet belongs to the group of medicines called antifungals. Topical
      gentian violet is used to treat some types of fungus infections inside the mouth
      (thrush) and of the skin.
  - type: paragraph
    text: Gentian violet is available without a prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of this medicine
        in children with use in other age groups, this medicine is not expected to
        cause different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of this medicine
        in the elderly with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Ulcerative skin condition on the face—Use of gentian violet may cause tattooing
        of the area
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Using a cotton swab, apply enough gentian violet to cover only the affected
      area.
  - type: paragraph
    text: If you are applying this medicine to affected areas in the mouth, avoid
      swallowing any of the medicine.
  - type: paragraph
    text: If you are using this medicine in a child's mouth, make sure you understand
      exactly how to apply it so that it is not swallowed. If you have any questions
      about this, check with your health care professional.
  - type: paragraph
    text: Do not apply an occlusive dressing (airtight covering, such as kitchen plastic
      wrap) over this medicine. It may cause irritation of the skin.
  - type: paragraph
    text: To help clear up your infection completely, keep using this medicine for
      the full time of treatment, even if your condition has improved. Do not miss
      any doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical solution dosage form: For fungus infections: Adults and children—Apply
        to the affected area(s) of the skin two or three times a day for three days.'
    - type: list
      ordered: false
      items:
      - 'For fungus infections: Adults and children—Apply to the affected area(s)
        of the skin two or three times a day for three days.'
    - type: list
      ordered: false
      items:
      - Adults and children—Apply to the affected area(s) of the skin two or three
        times a day for three days.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Gentian violet will stain the skin and clothing. Avoid getting the medicine
      on your clothes.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  - type: list
    ordered: false
    items:
    - Skin irritation not present before use of this medicine
  - type: paragraph
    text: Other side effects not listed may also occur in some patients. If you notice
      any other effects, check with your healthcare professional.
  - type: paragraph
    text: Call your doctor for medical advice about side effects. You may report side
      effects to the FDA at 1-800-FDA-1088.
