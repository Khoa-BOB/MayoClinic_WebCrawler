title: Alectinib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Alecensa
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Alectinib is used to treat non-small cell lung cancer (NSCLC) that has spread
      or to help prevent NSCLC from coming back after the tumor has been removed by
      surgery in patients whose tumors have an abnormal anaplastic lymphoma kinase
      (ALK) gene. Your doctor will perform a test to check for the ALK gene before
      you use this medicine.
  - type: paragraph
    text: Alectinib belongs to the group of medicines called antineoplastics (cancer
      medicines). It works by interfering with the growth of cancer cells, which are
      eventually destroyed.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of alectinib in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of alectinib in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Rotavirus Vaccine, Live
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Levothyroxine
      - Semaglutide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bradycardia (slow heart beat) or
      - Kidney disease, severe or end-stage or
      - Liver disease, moderate to severe or
      - Lung or breathing problems (eg, interstitial lung disease, pneumonitis), history
        of—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the capsule whole. Do not open, crush, or chew it. You may take
      this medicine with food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For lung cancer: Adults—At first, 600 milligrams
        (mg) 2 times a day. Your doctor may adjust your dose as needed and tolerated.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For lung cancer: Adults—At first, 600 milligrams (mg) 2 times a day. Your
        doctor may adjust your dose as needed and tolerated. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 600 milligrams (mg) 2 times a day. Your doctor may adjust
        your dose as needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you vomit after taking this medicine, do not take an extra dose. Take
        your next dose at the regular time.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you are a woman who can get pregnant, your doctor may do tests to make sure
      you are not pregnant before starting this medicine. It may also cause birth
      defects if the father is using it when his sexual partner becomes pregnant.
      Use effective birth control during treatment with this medicine and for at least
      5 weeks after the last dose. Male patients with female partners who are able
      to become pregnant should use an effective form of birth control during treatment
      and for at least 3 months after the last dose. If you think a pregnancy has
      occurred with this medicine, tell your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may cause swelling of the lungs (pneumonitis) or interstitial
      lung disease. These are life-threatening conditions and require immediate medical
      attention. The symptoms may be similar to those for lung cancer. Check with
      your doctor right away if you have a new or worsening cough, fever, or trouble
      breathing.
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, trouble breathing, unusual tiredness or weakness, vomiting, or
      weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: Bradycardia (slow heartbeat) may occur while you are using this medicine.
      Tell your doctor right away if you have chest pain or discomfort, lightheadedness,
      dizziness, or fainting, or a slow or uneven heartbeat.
  - type: paragraph
    text: Tell your doctor right away if you have unexplained muscle pain, tenderness,
      or weakness after taking this medicine. These may be symptoms of a serious muscle
      problem.
  - type: paragraph
    text: This medicine may cause hemolytic anemia. Check with your doctor right away
      if you have back, leg, or stomach pains, bleeding gums, chills, dark urine,
      difficulty breathing, fever, general body swelling, headache, loss of appetite,
      nausea or vomiting, nosebleeds, pale skin, sore throat, unusual tiredness or
      weakness, or yellowing of the eyes or skin.
  - type: paragraph
    text: This medicine may make your skin more sensitive to sunlight. Use a sunscreen
      and protective clothing when you are outdoors. Avoid sunlamps and tanning beds
      during treatment with this medicine and for at least 7 days after the last dose.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody urine
      - body aches
      - chest pain or discomfort
      - cough
      - dark urine
      - decreased frequency or amount of urine
      - diarrhea
      - difficulty with moving
      - fever or chills
      - headache
      - increased blood pressure
      - increased thirst
      - joint pain or swelling
      - loss of appetite
      - lower back or side pain
      - lightheadedness, dizziness, or fainting
      - muscle aches, cramps, pains, or stiffness
      - nausea
      - new loss of taste or smell
      - slow or irregular heartbeat
      - sore throat
      - stomach pain, severe
      - stuffy or runny nose
      - swelling of the face, fingers, or lower legs
      - trouble breathing
      - unusual tiredness or weakness
      - vomiting
      - weight gain
      - yellow eyes or skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Clay-colored stools
      - decreased appetite
      - itching or skin rash
      - stomach pain or tenderness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back, leg, or stomach pains
      - bleeding gums
      - general body swelling
      - nosebleeds
      - pale skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - blurred vision
      - difficulty having a bowel movement
      - double vision
      - lack or loss of strength
      - rapid weight gain
      - rash with flat lesions or small raised lesions on the skin
      - seeing double
      - seeing floating dark spots or material before the eyes
      - swelling around the eyes
      - tingling of the hands or feet
      - unusual weight gain or loss
      - vision changes
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in taste
      - increased sensitivity of the skin to sunlight
      - redness or other discoloration of the skin
      - severe sunburn
      - swelling or inflammation of the mouth
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
