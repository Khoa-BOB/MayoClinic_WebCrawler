title: Proparacaine (ophthalmic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Alcaine
    - type: paragraph
      text: Ocu-Caine
    - type: paragraph
      text: Ophthetic
    - type: paragraph
      text: Parcaine
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Proparacaine eye drops are used to numb the eye before surgery, certain
      tests, or procedures. The eye drops are used to prevent pain during the procedure.
  - type: paragraph
    text: Proparacaine belongs to the group of medicines called local anesthetics.
      It works by blocking the pain signals at the nerve endings in the eye.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      an eye doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of proparacaine eye drops in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of proparacaine eye drops in the
        elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart disease or
      - Hyperthyroidism (overactive thyroid)—May cause side effects to become worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you or your child
      this medicine. The eye drops are placed directly in the eye just before your
      eye procedure.
  - type: paragraph
    text: This medicine is not for long-term use. Using this medicine for a longer
      time than needed may cause blurred vision, decreased vision, or blindness.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your progress closely while you or your child are
      receiving this medicine . This will allow your doctor to see if the medicine
      is working properly and to decide if you should continue to receive it.
  - type: paragraph
    text: It is very important to protect your eye from injury while it is still numb.
      Do not touch or rub the eye. Do not use additional eye drops in the eye until
      your doctor tells you to. Protect your eye from dust particles, sand, or anything
      that might cause irritation.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - redness of the clear part of the eye
      - sensitivity to light
      - severe stinging in the eye
      - tearing
      - throbbing eye pain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody eye
      - burning, stinging, itching, redness, or irritation of the eye
      - change in vision
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry skin with cracking
      - grooves or lines in the skin of the fingertips
      - skin rash, hives, itching, or redness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
