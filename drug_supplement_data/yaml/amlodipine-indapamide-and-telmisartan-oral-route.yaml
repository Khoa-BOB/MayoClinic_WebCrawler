    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to penicillin, history of or
      - Congestive heart failure, severe or
      - Electrolyte imbalance (eg, low magnesium, potassium, sodium in the body) or
      - Glaucoma, angle-closure or
      - Hyperuricemia (high uric acid in the blood) or
      - Kidney disease or
      - Myopia (nearsightedness)—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Anuria (not able to form urine) or
      - Diabetes patients who are also taking aliskiren (Tekturna®) or
      - Sulfa drug allergy—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of this medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: In addition to the use of the medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these are most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure but it
      does help control it. You must continue to take it as directed if you expect
      to lower your blood pressure and keep it down. You may have to take high blood
      pressure medicine for the rest of your life . If high blood pressure is not
      treated, it can cause serious problems such as heart failure, blood vessel disease,
      stroke, or kidney disease.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the tablet whole. Do not cut, crush, or chew it.
  - type: paragraph
    text: Ask your doctor before you use medicines, supplements, or salt substitutes
      that contain potassium .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For high blood pressure: Adults—At first,
        one tablet (10 mg telmisartan, 1.25 milligrams (mg) of amlodipine, and 0.625
        mg of indapamide OR 20 mg of telmisartan, 2.5 mg of amlodipine, and 1.25 mg
        of indapamide) once a day. Your doctor may adjust your dose as needed. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—At first, one tablet (10 mg telmisartan,
        1.25 milligrams (mg) of amlodipine, and 0.625 mg of indapamide OR 20 mg of
        telmisartan, 2.5 mg of amlodipine, and 1.25 mg of indapamide) once a day.
        Your doctor may adjust your dose as needed. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, one tablet (10 mg telmisartan, 1.25 milligrams (mg) of amlodipine,
        and 0.625 mg of indapamide OR 20 mg of telmisartan, 2.5 mg of amlodipine,
        and 1.25 mg of indapamide) once a day. Your doctor may adjust your dose as
        needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby, especially
      in your second or third trimester. Use an effective form of birth control to
      keep from getting pregnant. If you think you have become pregnant while using
      this medicine, tell your doctor right away. You may need to stop using this
      medicine and change to another blood pressure medicine.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially if you have
      been taking a diuretic (water pill), are on a low-salt diet, have excessive
      sweating, or do not drink enough liquids. Make sure you know how you react to
      this medicine before you drive, use machines, or do anything else that could
      be dangerous if you are dizzy or not alert . If you feel dizzy, lie down so
      you do not faint. Then sit for a few moments before standing to prevent the
      dizziness from returning. If you faint, call your doctor right away .
  - type: paragraph
    text: This medicine may cause electrolyte imbalance (eg, hypokalemia, hypomagnesemia,
      hyponatremia) and changes in your blood sugar. Check with your doctor right
      away if you have confusion, irregular heartbeat, muscle cramps or pain, numbness,
      tingling, pain, or weakness in the hands or feet, seizures, trembling, unusual
      tiredness or weakness, weakness and heaviness of the legs, or if you notice
      a change in the results of your blood or urine sugar tests.
  - type: paragraph
    text: This medicine may cause kidney problems. Check with your doctor right away
      if you have bloody urine, decreased amount of urine, increased blood pressure,
      increased thirst, loss of appetite, lower back or side pain, nausea or vomiting,
      swelling of the face, fingers, or lower legs, trouble breathing, unusual tiredness
      or weakness, or weight gain.
  - type: paragraph
    text: Check with your doctor immediately if blurred vision, difficulty with reading,
      eye pain, or any other change in vision occurs during or after treatment. These
      could be signs of serious eye problems (eg, angle-closure glaucoma, myopia,
      and choroidal effusion). Your doctor will want you to have your eyes checked
      by an ophthalmologist (eye doctor).
  - type: paragraph
    text: This medicine may cause hyperuricemia (high uric acid in the blood). Check
      with your doctor right away if you have joint pain, stiffness, or swelling,
      lower back, side, or stomach pain, or swelling of the feet or lower legs.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes prescription or nonprescription (over-the-counter [OTC])
      medicines for appetite control, asthma, colds, cough, hay fever, or sinus problems,
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - sweating
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Coma
      - decreased urine output
      - fast or irregular heartbeat
      - headache
      - increased thirst
      - loss of appetite
      - muscle pain or cramps
      - nausea or vomiting
      - numbness or tingling in the hands, feet, or lips
      - seizures
      - swelling of the face, ankles, or hands
      - trouble breathing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in urine or stools
      - chest pain
      - clay-colored stools
      - chills
      - cough
      - dark urine
      - decreased interest in sexual intercourse
      - fever
      - inability to have or keep an erection
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss in sexual ability, desire, drive, or performance
      - muscle spasms
      - painful or difficult urination
      - pale skin
      - pinpoint red spots on the skin
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach pain
      - swelling
      - swelling of the legs and feet
      - swelling or puffiness of the face
      - swollen glands
      - unpleasant breath odor
      - unusual bleeding or bruising
      - vomiting of blood
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - diarrhea
      - difficulty in moving
      - heartburn
      - indigestion
      - joint pain
      - lack or loss of strength
      - muscle aches or stiffness
      - stomach discomfort or upset
      - swollen joints
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
