title: Mometasone (inhalation route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Asmanex HFA
    - type: paragraph
      text: Asmanex Twist
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Asmanex Twisthaler
    - type: paragraph
      text: Azmax Twisthaler
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Mometasone is used to help prevent the symptoms of asthma and improve breathing.
      When used regularly every day, inhaled mometasone decreases the number and severity
      of asthma attacks. However, it will not relieve an asthma attack that has already
      started.
  - type: paragraph
    text: Mometasone HFA is used as a maintenance treatment for the prevention and
      control of asthma symptoms in patients 5 years of age and older.
  - type: paragraph
    text: Inhaled mometasone belongs to the family of medicines known as corticosteroids
      (cortisone-like medicines). It works by preventing certain cells in the lungs
      and breathing passages from releasing substances that cause asthma symptoms.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder
    - Aerosol Powder
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of inhaled mometasone to prevent
        asthma in children 4 years of age and older. However, safety and efficacy
        have not been established in children younger than 4 years of age.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of inhaled mometasone HFA to prevent
        asthma in children 5 years of age and older. However, safety and efficacy
        have not been established in children younger than 5 years of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of mometasone in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Desmopressin
      - Mifepristone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aspirin
      - Atazanavir
      - Bemiparin
      - Carbamazepine
      - Cobicistat
      - Cosyntropin
      - Darunavir
      - Ethinyl Estradiol
      - Fosphenytoin
      - Insulin Aspart, Recombinant
      - Lutetium Lu 177 Dotatate
      - Macimorelin
      - Nadroparin
      - Nirmatrelvir
      - Phenytoin
      - Rabies Vaccine
      - Ritonavir
      - Sargramostim
      - Somatrogon-ghla
      - Upadacitinib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Auranofin
      - Ketoconazole
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Cataracts or
      - Glaucoma—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Chickenpox (including recent exposure) or
      - Herpes simplex (virus) infection of the eye or
      - Infections (virus, bacteria, fungus, or parasite) or
      - Measles or
      - Tuberculosis, active or history of—Inhaled mometasone can reduce the body's
        ability to fight off these infections.
    - type: list
      ordered: false
      items:
      - Immobilization for long periods of time or
      - Osteoporosis, family history of—Mometasone may make your bones weaker and
        increase the chance of a broken bone after a minor fall or injury.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Milk protein allergy—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Inhaled mometasone is used to prevent asthma attacks. It is not used to
      relieve an asthma attack that has already started. For relief of an asthma attack
      that has already started, you should use another medicine. If you do not have
      another medicine to use for an attack or if you have any questions about this,
      check with your doctor.
  - type: paragraph
    text: Inhaled mometasone is used with a special inhaler that comes with patient
      directions. Read the directions carefully before using this medicine. If you
      do not understand the directions or you are not sure how to use the inhaler,
      ask your doctor to show you what to do. Also, ask your doctor to check regularly
      how you use the inhaler to make sure you are using it properly.
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it
      and do not use it more often than your doctor ordered. Also, do not stop using
      this medicine without telling your doctor. To do so may increase the chance
      of side effects.
  - type: paragraph
    text: In order for this medicine to help prevent asthma attacks, it must be used
      every day in regularly spaced doses and be used at the same time each day, as
      ordered by your doctor .
  - type: paragraph
    text: 'To use the Twisthaler® :'
  - type: list
    ordered: false
    items:
    - Take the Twisthaler® out of the pouch before you use it for the first time.
    - Write down the date on the cap label when you first open the foil pouch. The
      medicine is good for only 45 days once the pouch is opened.
    - The Twisthaler® has a small window on the side with numbers showing. This is
      the dose counter. It keeps track of how many more times you can use the inhaler
      before you need to open a new one. When the dose counter reaches "00", the Twisthaler®
      will lock itself. If the dose counter is not working correctly, do not use the
      Twisthaler® and return it to your pharmacy or doctor.
    - Remove the cap while it is in upright position to make sure you get the right
      amount of medicine with each dose.
    - Hold the Twisthaler® upright and twist the cap in a counterclockwise direction
      to open it. The dose counter should change to a lower number when you take off
      the cap. The arrow on the Twisthaler® should be pointing to the dose counter.
    - To inhale this medicine, breathe out fully, trying to get as much air out of
      the lungs as possible. Put the mouthpiece fully into your mouth and close your
      lips around it. Do not block the mouthpiece with your teeth or tongue.
    - Breathe in through your mouth as deeply as you can until you have taken a full
      deep breath.
    - Take the Twisthaler® out of your mouth. Hold your breath for about 10 seconds,
      then breathe out slowly.
    - Do not breathe out into the inhaler.
    - Wipe the mouthpiece dry with a cloth or tissue. Do not wash it with water. Put
      the cap back on right away and twist it in a clockwise direction. You should
      hear a "click" when the cap is fully closed.
    - Gargle and rinse your mouth with water after each dose. This will help prevent
      hoarseness, throat irritation, and infection in the mouth. Do not swallow the
      water after rinsing.
  - type: paragraph
    text: 'To use the Asmanex® HFA inhaler :'
  - type: list
    ordered: false
    items:
    - This medicine comes in 2 strengths. Your doctor will decide which dosage strength
      is best for you.
    - The Asmanex® HFA aerosol canister provides about 124 inhalations, depending
      on the size of the canister your doctor ordered.
    - The Asmanex® HFA inhaler has a small window on the side with numbers showing.
      This is the dose counter. It keeps track of how many more times you can use
      the inhaler before you need to open a new one.
    - Before using this medicine, remove the cap from the mouthpiece.
    - When you use the inhaler for the first time, or if you have not used it in a
      while, test or prime it by releasing 4 test sprays into the air, away from the
      face.
    - Shake well before each spray.
    - To inhale this medicine, breathe out fully, trying to get as much air out of
      the lungs as possible. Put the mouthpiece fully into your mouth and close your
      lips around it. Do not block the mouthpiece with your teeth or tongue.
    - Breathe in through your mouth as deeply as you can until you have taken a full
      deep breath.
    - Do not use Asmanex® HFA canister or actuator with any other medicines. Do not
      remove the canister from the actuator.
    - Rinse your mouth with water after each dose. Do not swallow the water after
      rinsing.
    - Do not wash the inhaler in water. The mouthpiece should be cleaned using a dry
      wipe after every 7 days of use.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For inhalation dosage form (aerosol powder): For preventing an asthma attack:
        For patients who have received inhaled corticosteroids and bronchodilators:
        Adults and children 12 years of age and older—One puff once a day, in the
        evening for 1 to 2 weeks. Each puff contains 220 micrograms (mcg) of mometasone.
        Your doctor may increase your dose as needed. However, the dose is usually
        not more than 440 mcg per day. Children 4 to 11 years of age—One puff once
        a day, in the evening. Each puff contains 110 mcg of mometasone. Children
        younger than 4 years of age—Use and dose must be determined by your doctor.
        For patients who have received oral corticosteroids: Adults and children 12
        years of age and older—Two puffs 2 times a day, in the evening for 1 to 2
        weeks. Each puff contains 220 micrograms (mcg) of mometasone. Your doctor
        may increase your dose as needed. However, the dose is usually not more than
        880 mcg per day. Children 4 to 11 years of age—One puff once a day, in the
        evening. Each puff contains 110 mcg of mometasone. Children younger than 4
        years of age—Use and dose must be determined by your doctor. For preventing
        an asthma attack (HFA): For patients who have received inhaled corticosteroids:
        Adults and children 12 years of age and older—Two puffs 2 times a day (in
        the morning and in the evening). Each puff contains 100 or 200 micrograms
        (mcg) of mometasone. Your doctor may increase your dose as needed. However,
        the dose is usually not more than 400 to 800 mcg per day. Children 5 to 11
        years of age—Two puffs 2 times a day (in the morning and in the evening).
        Each puff contains 50 mcg of mometasone. Your doctor may increase your dose
        as needed. Children younger than 5 years of age—Use and dose must be determined
        by your doctor. For patients who have received oral corticosteroids: Adults
        and children 12 years of age and older—Two puffs 2 times a day, (in the morning
        and in the evening). Each puff contains 100 micrograms (mcg) of mometasone.
        Your doctor may increase your dose as needed. However, the dose is usually
        not more than 800 mcg per day. Children 5 to 11 years of age and older—Two
        puffs 2 times a day (in the morning and in the evening). Each puff contains
        50 mcg of mometasone. Your doctor may increase your dose as needed. Children
        younger than 5 years of age—Use and dose must be determined by your doctor.'
    - type: list
