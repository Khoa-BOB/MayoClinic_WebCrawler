    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the canister at room temperature, away from heat and direct light.
        Do not freeze. Do not keep this medicine inside a car where it could be exposed
        to extreme heat or cold. Do not poke holes in the canister or throw it into
        a fire, even if the canister is empty.
    - type: paragraph
      text: Keep the medicine in the foil pouch until you are ready to use it. Store
        at room temperature, away from heat and direct light. Do not freeze.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away the inhaler when the dose counter is at "00" or 45 days after
        you opened the package. Ask your pharmacist, doctor, or health caregiver about
        the best way to dispose of the used inhaler and any leftover medicine.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If you will be using this medicine for a long time, it is very important
      that your doctor check the progress of you or your child at regular visits .
      This will allow your doctor to see if the medicine is working properly and to
      check for any unwanted effects.
  - type: paragraph
    text: This medicine may cause fungus infection of the mouth or throat (thrush).
      Tell your doctor right away if you or your child have white patches in the mouth
      or throat, or pain when eating or swallowing.
  - type: paragraph
    text: You should not use this medicine if your asthma attack has already started
      . Your doctor will prescribe another medicine (eg, a short-acting inhaler) for
      you to use in case of an acute asthma attack. Make sure you understand how to
      use the short-acting inhaler. Talk to your doctor if you need instructions.
  - type: paragraph
    text: 'Talk with your doctor or get medical care right away if:'
  - type: list
    ordered: false
    items:
    - Your or your child's symptoms do not improve after using this medicine for 2
      weeks or if they become worse.
    - You or your child have a big decrease in your peak flow when measured as directed
      by your doctor.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you or your child have a rash, itching, hoarseness,
      trouble breathing, trouble swallowing, or any swelling of your hands, face,
      or mouth while you are using this medicine.
  - type: paragraph
    text: Your doctor may want you to carry a medical identification (ID) card stating
      that you or your child are using this medicine. The card will say that you may
      need additional medicine during an emergency, a severe asthma attack or other
      illness, or unusual stress.
  - type: paragraph
    text: Using too much of this medicine for a long period of time can cause problems
      with your adrenal gland. Talk to your doctor if you or your child have darkening
      of the skin, diarrhea, dizziness, fainting, loss of appetite, mental depression,
      nausea, skin rash, unusual tiredness or weakness, or weight loss.
  - type: paragraph
    text: Follow your doctor's directions carefully if you are switching from an oral
      corticosteroid to this medicine.
  - type: paragraph
    text: This medicine may decrease bone mineral density when used for a long time.
      Low bone mineral density can cause weak bones or osteoporosis. If you have any
      questions about this, ask your doctor.
  - type: paragraph
    text: This medicine may cause children to grow more slowly than usual. Talk to
      your child's doctor if you have any concerns.
  - type: paragraph
    text: Check with your doctor right away if blurred vision, difficulty in reading,
      or any other change in vision occurs during or after treatment. Your doctor
      may want you or your child to have your eyes checked by an ophthalmologist (eye
      doctor).
  - type: paragraph
    text: This medicine may cause paradoxical bronchospasm, which means your breathing
      or wheezing will get worse. Paradoxical bronchospasm may be life-threatening.
      Check with your doctor right away if you or your child are having a cough or
      difficulty with breathing after using this medicine. Use a short acting inhaler
      right away to treat your symptoms.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - cold or flu-like symptoms
      - congestion
      - cough
      - dryness or soreness of the throat
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - fever or chills
      - loss of appetite
      - lower back or side pain
      - nausea
      - stomach pain
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - White patches inside the nose or mouth
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - hives, itching
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - tightness in the chest
      - trouble breathing
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
