        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Bupropion
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart rhythm problem (eg, familial short QT syndrome)—Should not be used in
        patients with this condition.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. May make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine for the full time of treatment , even if you begin to
      feel better. Also, keep your appointments with your doctor for check-ups so
      that your doctor will be better able to tell you when to stop taking this medicine.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the capsule whole. Do not crush, break, dissolve, or open it. You
      may take this medicine with or without food.
  - type: paragraph
    text: Your doctor may switch you between injection and oral medicine that works
      the same way. If you have any concerns about this, talk to your doctor.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you feel
      better after the first few doses. Your infection may not clear up if you stop
      using the medicine too soon.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For invasive aspergillosis and invasive
        mucormycosis: Adults—At first, 372 milligrams (mg) (two 186 mg capsules or
        five 74.5 mg capsules) every 8 hours for 6 doses (48 hours). Then, your doctor
        will adjust your dose to 372 mg (two 186 mg capsules or five 74.5 mg capsules)
        once a day. Children 6 years of age and older—Dose is based on body weight
        and must be determined by your doctor. Weighing 32 kilograms (kg) or more—At
        first, 372 milligrams (mg) (five 74.5 mg capsules) every 8 hours for 6 doses
        (48 hours). Then, your doctor will adjust your dose to 372 mg (five 74.5 mg
        capsules) once a day. Weighing 25 to less than 32 kg—At first, 298 mg (four
        74.5 mg capsules) every 8 hours for 6 doses (48 hours). Then, your doctor
        will adjust your dose to 298 mg (four 74.5 mg capsules) once a day. Weighing
        18 to less than 25 kg—At first, 223.5 mg (three 74.5 mg capsules) every 8
        hours for 6 doses (48 hours). Then, your doctor will adjust your dose to 223.5
        mg (three 74.5 mg capsules) once a day. Weighing 16 to less than 18 kg—At
        first, 149 mg (two 74.5 mg capsules) every 8 hours for 6 doses (48 hours).
        Then, your doctor will adjust your dose to 149 mg (two 74.5 mg capsules) once
        a day. Children younger than 6 years of age weighing less than 16 kg—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
