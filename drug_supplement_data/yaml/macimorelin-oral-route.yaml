title: Macimorelin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Macrilen
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Macimorelin is used for the diagnosis of adult growth hormone deficiency
      (AGHD).
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of a doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a diagnostic test, any risks of the test must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      Also, other things may affect test results. For this test, the following should
      be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of macimorelin in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of macimorelin in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this diagnostic test,
        it is especially important that your healthcare professional know if you are
        taking any of the medicines listed below. The following interactions have
        been selected on the basis of their potential significance and are not necessarily
        all-inclusive.
    - type: paragraph
      text: Receiving this diagnostic test with any of the following medicines is
        not recommended. Your doctor may decide not to use this diagnostic test or
        change some of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Fluconazole
      - Ketoconazole
      - Levoketoconazole
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Receiving this diagnostic test with any of the following medicines is
        usually not recommended, but may be required in some cases. If both medicines
        are prescribed together, your doctor may change the dose or how often you
        use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Adagrasib
      - Alclometasone
      - Alfuzosin
      - Amcinonide
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Anagrelide
      - Apalutamide
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Armodafinil
      - Arsenic Trioxide
      - Asenapine
      - Aspirin
      - Astemizole
      - Atazanavir
      - Atropine
      - Avacopan
      - Azithromycin
      - Beclomethasone
      - Bedaquiline
      - Betamethasone
      - Bosentan
      - Budesonide
      - Buprenorphine
      - Buserelin
      - Carbamazepine
      - Ceritinib
      - Chloroquine
      - Chlorpromazine
      - Ciclesonide
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clobetasol
      - Clobetasone
      - Clocortolone
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this diagnostic
        test. Make sure you tell your doctor if you have any other medical problems,
        especially:'
    - type: list
      ordered: false
      items:
      - Glucocorticoid (steroid) deficiency or
      - Sex hormone deficiency or
      - Thyroid deficiency—Your doctor may tell you to replace these missing hormones
        before starting treatment with this medicine.
    - type: list
      ordered: false
      items:
      - Heart rhythm problem (eg, QT prolongation)—Used with caution. May make this
        condition worse.
    - type: list
      ordered: false
      items:
      - Lesion in the brain (eg, hypothalamus)—Adult growth hormone deficiency caused
        by this condition may cause a false negative result. Repeat testing may be
        needed.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A healthcare provider will give you this medicine in a hospital or clinic.
      You should drink all the medicine within 30 seconds.
  - type: paragraph
    text: Follow all instructions you are given for your scan or procedure. Your doctor
      may tell you not to eat or drink anything at least 8 hours before your test.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress to make sure that
      this medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: Do not use a growth hormone medicine for at least 1 week before receiving
      this medicine.
  - type: paragraph
    text: Do not use armodafinil (Nuvigil®), bosentan (Tracleer®), carbamazepine (Tegretol®),
      efavirenz (Sustiva®), enzalutamide (Xtandi®), etravirine (Intelence®), mitotane
      (Lysodren®), modafinil (Provigil®), phenytoin (Dilantin®), rifampin (Rifadin®,
      Rimactane®), rufinamide (Banzel®), or St. John’s wort together with macimorelin.
      These medicines may decrease the amount of macimorelin in the blood, which may
      cause a false positive result to adult growth hormone deficiency test. Your
      doctor may tell you to stop taking these medicines for a certain period of time
      before using macimorelin.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Slow heartbeat
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - change in taste
      - chills
      - cough
      - diarrhea
      - difficulty in breathing
      - dizziness
      - ear congestion
      - feeling hot
      - fever
      - headache
      - hunger
      - increased sweating
      - loss of taste
      - loss of voice
      - muscle aches
      - nasal congestion
      - nausea
      - runny nose
      - sneezing
      - sore throat
      - stuffy or runny nose
      - unusual tiredness or weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
