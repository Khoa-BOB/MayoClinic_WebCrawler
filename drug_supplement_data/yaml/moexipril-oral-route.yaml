title: Moexipril (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Univasc
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Moexipril is used alone or together with other medicines to treat high blood
      pressure (hypertension). High blood pressure adds to the workload of the heart
      and arteries. If it continues for a long time, the heart and arteries may not
      function properly. This can damage the blood vessels of the brain, heart, and
      kidneys, resulting in a stroke, heart failure, or kidney failure. Lowering blood
      pressure reduces the risk of strokes and heart attacks.
  - type: paragraph
    text: Moexipril is an angiotensin converting enzyme (ACE) inhibitor. It works
      by blocking a substance in the body that causes blood vessels to tighten. As
      a result, moexipril relaxes the blood vessels. This lowers blood pressure and
      increases the supply of blood and oxygen to the heart.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of moexipril in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of moexipril have not been performed in the geriatric population, no geriatric-specific
        problems have been documented to date. However, elderly patients are more
        likely to have age-related kidney problems, which may require caution and
        a dose adjustment for patients receiving moexipril.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Aliskiren
      - Sacubitril
      - Valsartan
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alteplase, Recombinant
      - Amiloride
      - Aspirin
      - Azathioprine
      - Azilsartan
      - Azilsartan Medoxomil
      - Candesartan
      - Canrenoate
      - Cyclosporine
      - Eplerenone
      - Eprosartan
      - Everolimus
      - Furosemide
      - Irbesartan
      - Lithium
      - Losartan
      - Melphalan
      - Mercaptopurine
      - Olmesartan
      - Potassium
      - Potassium Citrate
      - Potassium Phosphate
      - Sirolimus
      - Spironolactone
      - Tacrolimus
      - Telmisartan
      - Temsirolimus
      - Triamterene
      - Trimethoprim
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aceclofenac
      - Acemetacin
      - Amtolmetin Guacil
      - Bromfenac
      - Bufexamac
      - Bumetanide
      - Bupivacaine
      - Bupivacaine Liposome
      - Capsaicin
      - Celecoxib
      - Choline Salicylate
      - Clonixin
      - Dexibuprofen
      - Dexketoprofen
      - Diclofenac
      - Diflunisal
      - Dipyrone
      - Droxicam
      - Ethacrynic Acid
      - Etodolac
      - Etofenamate
      - Etoricoxib
      - Etozolin
      - Felbinac
      - Fenoprofen
      - Fepradinol
      - Feprazone
      - Floctafenine
      - Flufenamic Acid
      - Flurbiprofen
      - Gold Sodium Thiomalate
      - Ibuprofen
      - Indomethacin
      - Ketoprofen
      - Ketorolac
      - Lornoxicam
      - Loxoprofen
      - Lumiracoxib
      - Meclofenamate
      - Mefenamic Acid
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angioedema (swelling of the face, lips, tongue, throat, arms, or legs) with
        other ACE inhibitors, history of—Moexipril may increase the risk of this condition
        occurring again.
    - type: list
      ordered: false
      items:
      - Collagen vascular disease (an autoimmune disease) together with kidney disease—Increased
        risk of blood problems.
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Dehydration or
      - Diarrhea or
      - Hyponatremia (low sodium in the blood) or
      - Kidney disease—These conditions may cause the blood pressure to fall too low
        with moexipril.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Kidney problems—Increased risk of potassium levels in the body becoming too
        high.
    - type: list
      ordered: false
      items:
      - Diabetic patients who are also taking aliskiren (Tekturna®)—Should not be
        used in these patients.
    - type: list
      ordered: false
      items:
      - Heart disease (e.g., ischemic heart disease, aortic stenosis, cerebrovascular
        disease) or
      - Liver disease or
      - Systemic lupus erythematosus (SLE)—Use with caution. May make these conditions
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: In addition to the use of moexipril, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these are most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure but it
      does help control it. Therefore, you must continue to take it as directed if
      you expect to lower your blood pressure and keep it down. You may have to take
      high blood pressure medicine for the rest of your life . If high blood pressure
      is not treated, it can cause serious problems such as heart failure, blood vessel
      disease, stroke, or kidney disease.
  - type: paragraph
    text: It is best to take this medicine on an empty stomach, at least 1 hour before
      meals.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For high blood pressure: Adults—At first,
        7.5 milligrams (mg) once a day. Your doctor may increase your dose up to 30
        mg per day taken as a single dose or divided into two doses. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—At first, 7.5 milligrams (mg) once a day.
        Your doctor may increase your dose up to 30 mg per day taken as a single dose
        or divided into two doses. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 7.5 milligrams (mg) once a day. Your doctor may increase
        your dose up to 30 mg per day taken as a single dose or divided into two doses.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause serious types of allergic reactions. These reactions
      can be life-threatening and require immediate medical attention. Call your doctor
      right away if you have a rash, itching, hoarseness, trouble breathing, trouble
      swallowing, or any swelling of your face, arms, legs, eyes, lips, tongue, or
      throat while you are using this medicine.
  - type: paragraph
    text: Call your doctor right away if you have severe stomach pain (with or without
      nausea or vomiting). This could be a symptom of a condition called intestinal
      angioedema.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may also occur, especially when
      you get up from a lying or sitting position or if you have been taking a diuretic
      (water pill). Make sure you know how you react to the medicine before you drive,
      use machines, or do other things that could be dangerous if you are dizzy or
      not alert . If you feel dizzy, lie down so you do not faint. Then sit for a
      few moments before standing to prevent the dizziness from returning. If you
      faint, stop using this medicine and call your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you become sick while taking this medicine,
      especially with severe or continuing nausea, vomiting, or diarrhea. These conditions
      may cause you to lose too much water or salt and may lead to low blood pressure.
      You can also lose water by sweating, so drink plenty of water during exercise
      or in hot weather.
  - type: paragraph
    text: Check with your doctor if you have a fever, chills, or sore throat. These
      may be symptoms of an infection caused by low white blood cells.
  - type: paragraph
    text: Check with your doctor right away if you have any symptoms of liver problems,
      such as dark-colored urine or pale stools, nausea, vomiting, loss of appetite,
      pain in your upper stomach, or yellow skin or eyes.
  - type: paragraph
    text: 'Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have the following symptoms:
      abdominal or stomach pain, confusion, difficulty breathing, irregular heartbeat,
      nausea or vomiting, nervousness, numbness or tingling in the hands, feet, or
      lips, shortness of breath, or weakness or heaviness of the legs. Do not use
      supplements or salt substitutes containing potassium without first checking
      with your doctor .'
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery or medical tests.
  - type: paragraph
    text: Black patients may be less sensitive to the blood pressure-lowering effects
      of this medicine. In addition, the risk of a serious allergic reaction involving
      swelling of the face, mouth, hands, or feet may be increased.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes over-the-counter (nonprescription) medicines for appetite
      control, asthma, colds, cough, hay fever, or sinus problems, since they may
      tend to increase your blood pressure.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chills
      - confusion
      - cough
      - diarrhea
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fever
      - headache
      - joint pain
      - loss of appetite
      - muscle aches and pains
      - nausea
      - runny nose
      - shivering
      - sore throat
      - sweating
      - trouble sleeping
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry cough
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - congestion
      - difficulty moving
      - dizziness
      - feeling of warmth
      - hoarseness
      - muscle cramping
      - muscle stiffness
      - rash
      - redness of the face, neck, arms, and upper chest
      - swollen joints
      - tender, swollen glands in the neck
      - trouble swallowing
      - voice changes
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
