    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: 'Once a day dosing : If a dose is missed by 12 hours or less , take it
        as soon as possible, and then go back to your regular schedule. If a dose
        is missed by more than 12 hours , do not take an extra dose. Take the next
        dose at the regular scheduled time.'
    - type: paragraph
      text: 'Two times a day dosing : If a dose is missed by 6 hours or less , take
        it as soon as possible, and then go back to your regular schedule. If a dose
        is missed by more than 6 hours , do not take an extra dose. Take the next
        dose at the regular scheduled time.'
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store this medicine with the cap on the bottle.
    - type: paragraph
      text: Throw away any unused medicine 100 days after opening the bottle.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to see if the medicine is working properly and to decide if
      you or your child should continue to take it. Blood tests may be needed to check
      for any unwanted effects.
  - type: paragraph
    text: Check with your doctor right away if you have dark urine, clay-colored stools,
      stomach pain, or yellow eyes or skin. These may be symptoms of a serious liver
      problem.
  - type: paragraph
    text: This medicine may cause stomach or bowel problems, including diarrhea, stomach
      pain, or vomiting. If you have any questions or if these symptoms continue or
      get worse, check with your doctor.
  - type: paragraph
    text: This medicine may cause bleeding problems and bone fractures. Call your
      doctor right away if you bleed more, bleed longer, or have pain or swelling
      in the arms or legs without any injury.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody or black, tarry stools
      - bone fractures
      - chills
      - constipation
      - dark urine
      - diarrhea
      - dizziness
      - fever
      - headache
      - itching, rash
      - light-colored stools
      - loss of appetite
      - nausea
      - pain or swelling in the arms or legs without any injury
      - stomach pain
      - unpleasant breath odor
      - unusual bleeding
      - unusual tiredness or weakness
      - vomiting
      - vomiting of blood or material that looks like coffee grounds
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
