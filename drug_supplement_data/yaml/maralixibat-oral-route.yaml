        2 times a day taken in the morning and evening. Your doctor may adjust your
        dose as needed and tolerated. Weighing 50 kg to 59 kg—At first, 0.8 mL once
        a day taken in the morning. Then, 0.8 mL 2 times a day taken in the morning
        and evening. Your doctor may adjust your dose as needed and tolerated. Weighing
        40 kg to 49 kg—At first, 0.6 mL once a day taken in the morning. Then, 0.6
