title: Maralixibat (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Livmarli
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Maralixibat is used to treat cholestatic pruritus (skin itching) in patients
      with Alagille syndrome (ALGS) and progressive familial intrahepatic cholestasis
      (PFIC).
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of maralixibat to treat skin itching with Alagille syndrome
        (ALGS) in children younger than 3 months of age and to treat skin itching
        with progressive familial intrahepatic cholestasis (PFIC) in children younger
        than 12 months of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of maralixibat in geriatric patients. Safety and efficacy have
        not been established.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Fat-soluble vitamin (vitamins A, D, E, and K) deficiency—Use with caution.
        May make this condition worse.
    - type: list
      ordered: false
      items:
      - Liver problems (variceal hemorrhage, ascites, hepatic encephalopathy), active
        or history of—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Take this medicine at least 30 minutes before the first meal of the day.
  - type: paragraph
    text: Check the liquid in the bottle. It should be clear to almost clear and colorless
      to light yellow. Do not use the medicine if the liquid is discolored, or has
      particles in it.
  - type: paragraph
    text: 'To use:'
  - type: list
    ordered: false
    items:
    - Write the date on the bottle when you first opened the medicine. Remove the
      plastic seal.
    - Open the bottle by pushing down on the child-resistant cap and turn the cap
      to the left (counter-clockwise).
    - If you are using a new dosing dispenser, remove it from the wrapper. If you
      are using a used dosing dispenser, make sure that it has been cleaned. Remove
      and throw away the cap of the dosing dispenser, if applicable.
    - Measure the oral liquid medicine with the provided dosing dispenser. Make sure
      to use the correct dosing dispenser depending on the prescribed dose.
    - Push the plunger down fully to remove air from the dispenser. Once the cap of
      the bottle is removed, insert the tip of the dispenser into the bottle. The
      tip should fit into the hole. Check for air bubbles. If you see any, push the
      plunger so that the medicine flows back into the bottle.
    - Keep the dosing dispenser in place and turn the bottle upside down. Pull back
      the plunger slowly until the top of the plunger is even with the marking on
      the barrel of the dosing dispenser.
    - Remove the dosing dispenser from the bottle by pulling straight up on the barrel.
      Place the tip of the dispenser against the inside of the cheek and slowly push
      the plunger all the way to give the entire dose.
    - Swallow the whole dose. If you are not sure the full dose was swallowed, do
      not give another dose. Wait until the next scheduled dose.
  - type: paragraph
    text: Take this medicine at least 4 hours before or 4 hours after using bile acid
      sequestrants (eg, cholestyramine, colesevelam, colestipol).
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (solution): For cholestatic pruritus in patients with
        Alagille syndrome: Adults and children 3 months of age and older—Dose is base
        on weight and must be determined by your doctor. The dose is usually 380 micrograms
        per kilogram (mcg/kg) of body weight once a day. However, the dose is usually
        not more than 28.5 milligrams (mg) or 3 mL per day. Weighing 70 kilograms
        (kg) or more—At first, 1.5 milliliters (mL) once a day for Days 1 to 7. Then,
        3 mL once a day starting on Day 8. Your doctor may adjust your dose as needed
        and tolerated. Weighing 60 kg to 69 kg—At first, 1.25 mL once a day for Days
        1 to 7. Then, 2.5 mL once a day starting on Day 8. Your doctor may adjust
        your dose as needed and tolerated. Weighing 50 kg to 59 kg—At first, 1 mL
        once a day for Days 1 to 7. Then, 2.25 mL once a day starting on Day 8. Your
        doctor may adjust your dose as needed and tolerated. Weighing 40 kg to 49
        kg—At first, 0.9 mL once a day for Days 1 to 7. Then, 1.75 mL once a day starting
        on Day 8. Your doctor may adjust your dose as needed and tolerated. Weighing
        35 kg to 39 kg—At first, 0.7 mL once a day for Days 1 to 7. Then, 1.5 mL once
        a day starting on Day 8. Your doctor may adjust your dose as needed and tolerated.
        Weighing 30 kg to 34 kg—At first, 0.6 mL once a day for Days 1 to 7. Then,
        1.25 mL once a day starting on Day 8. Your doctor may adjust your dose as
        needed and tolerated. Weighing 25 kg to 29 kg—At first, 0.5 mL once a day
        for Days 1 to 7. Then, 1 mL once a day starting on Day 8. Your doctor may
        adjust your dose as needed and tolerated. Weighing 20 kg to 24 kg—At first,
        0.45 mL once a day for Days 1 to 7, 0.9 mL once a day starting on Day 8. Your
        doctor may adjust your dose as needed and tolerated. Weighing 16 kg to 19
        kg—At first, 0.35 mL once a day for Days 1 to 7. Then, 0.7 mL once a day starting
        on Day 8. Your doctor may adjust your dose as needed and tolerated. Weighing
        13 kg to 15 kg—At first, 0.3 mL once a day for Days 1 to 7. Then, 0.6 mL once
        a day starting on Day 8. Your doctor may adjust your dose as needed and tolerated.
        Weighing 10 kg to 12 kg—At first, 0.2 mL once a day for Days 1 to 7. Then,
