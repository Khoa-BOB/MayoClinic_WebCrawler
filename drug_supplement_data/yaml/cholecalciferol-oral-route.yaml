title: Cholecalciferol (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Delta D3
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: D-Vi-Sol
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cholecalciferol is a dietary supplement that is used to treat vitamin D
      deficiency. It is also used with calcium to maintain bone strength.
  - type: paragraph
    text: This medicine is available both over-the-counter (OTC) and with your doctor's
      prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Oil
    - Wafer
    - Capsule
    - Tablet
    - Capsule, Liquid Filled
    - Tablet, Chewable
    - Solution
    - Suspension
    - Tablet, Disintegrating
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'If you are taking this dietary supplement without a prescription, carefully
      read and follow any precautions on the label. For this supplement, the following
      should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of cholecalciferol in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of cholecalciferol in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this dietary supplement,
        it is especially important that your healthcare professional know if you are
        taking any of the medicines listed below. The following interactions have
        been selected on the basis of their potential significance and are not necessarily
        all-inclusive.
    - type: paragraph
      text: Using this dietary supplement with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Erdafitinib
      - Fosphenytoin
      - Phenytoin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not use more of
      it, do not use it more often, and do not use it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: If you are using this medicine without a prescription, follow the instructions
      on the package.
  - type: paragraph
    text: The chewable wafer must be chewed or crushed. Do not swallow the wafer whole.
  - type: paragraph
    text: 'Using the oral liquid :'
  - type: list
    ordered: false
    items:
    - Use the dropper that comes with the package to measure your dose.
    - 'Adults and adolescents: Drop the liquid directly into the mouth or mix it with
      food or other liquids (eg, water or juice).'
    - 'Children 2 years of age and older: Drop the liquid directly into the mouth,
      mix it with food or other liquids (eg, water or juice), or take it from a spoon.'
    - 'Children younger than 2 years of age: Place one drop of the liquid on the pacifier,
      mother''s nipple, or bottle nipple and allow baby to suck for at least 30 seconds.'
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For vitamin D deficiency: For oral dosage form (capsules): Adults—One capsule
        containing 5000 international units (IU) once a day. Children—Use and dose
        must be determined by your doctor. For oral dosage form (solution): Adults—One
        drop containing 1000 international units (IU) once a day or 2 times per day.
        Infants and children—One drop containing 400 IU once a day. For oral dosage
        form (wafer): Children 6 years of age and older—One wafer containing 14,000
        international units (IU) once a week for 6 weeks. Children younger than 6
        years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): Adults—One capsule containing 5000 international
        units (IU) once a day. Children—Use and dose must be determined by your doctor.'
      - 'For oral dosage form (solution): Adults—One drop containing 1000 international
        units (IU) once a day or 2 times per day. Infants and children—One drop containing
        400 IU once a day.'
      - 'For oral dosage form (wafer): Children 6 years of age and older—One wafer
        containing 14,000 international units (IU) once a week for 6 weeks. Children
        younger than 6 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—One capsule containing 5000 international units (IU) once a day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—One drop containing 1000 international units (IU) once a day or 2 times
        per day.
      - Infants and children—One drop containing 400 IU once a day.
    - type: list
      ordered: false
      items:
      - Children 6 years of age and older—One wafer containing 14,000 international
        units (IU) once a week for 6 weeks.
      - Children younger than 6 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to decide if you should continue to take it.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - hives or itching
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - skin rash
      - tightness in the chest
      - unusual tiredness or weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
