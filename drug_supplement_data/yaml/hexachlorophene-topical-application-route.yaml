title: Hexachlorophene (topical application route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Phisohex
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Hexachlorophene is a topical antibacterial cleanser. It is used to clean
      the skin before surgery to prevent the spread of infection. It works like a
      detergent to cleanse the skin by killing or preventing the growth of bacteria.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Because of hexachlorophene's potential for the risk of increased drug
        absorption, use in infants and premature babies is not recommended.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of hexachlorophene in the elderly.
        However, elderly patients are more likely to have skin diseases, circulation
        problems, delayed wound healing, and age-related liver, kidney, and heart
        problems, which may require caution in patients receiving hexachlorophene.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Broken or burned skin—Should not be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Ichthyosis congenita (genetic skin disorder) or
      - Letterer-Siwe disease (a rare disease) or
      - Other skin diseases—Use with caution. May increase the risk for serious side
        effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine only as directed . Do not
      use more of it, do not use it more often, and do not use it for a longer time
      than your doctor ordered.
  - type: paragraph
    text: Hexachlorophene should only be used on the skin. Do not swallow it or use
      it in the eyes, ears, mouth, nose, genital area (sex organs), or anal area.
      If it does get on these areas, rinse it right away with water.
  - type: paragraph
    text: Follow your doctor's instructions about how to clean and care for your skin
      before and after you use this medicine. Make sure you understand all of the
      directions, and ask questions if you find something is not clear.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (emulsion): For cleaning the skin: Adults and children—Apply
        5 milliliters (mL) to the hands and make it into a lather by adding a small
        amount of water. Apply to the area to be cleansed, rinse thoroughly with running
        water, and pat dry. Infants—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For cleaning the skin: Adults and children—Apply 5 milliliters (mL) to the
        hands and make it into a lather by adding a small amount of water. Apply to
        the area to be cleansed, rinse thoroughly with running water, and pat dry.
        Infants—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children—Apply 5 milliliters (mL) to the hands and make it into
        a lather by adding a small amount of water. Apply to the area to be cleansed,
        rinse thoroughly with running water, and pat dry.
      - Infants—Use is not recommended.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Check with your doctor if your skin problem becomes worse. Call your doctor
      if you develop a constant skin irritation, such as redness, itching or burning,
      in the area where you used this medicine.
  - type: paragraph
    text: This medicine should not be used on a regular basis on large areas of the
      body. Follow your doctor's instructions about how long to use this medicine.
  - type: paragraph
    text: This medicine may cause serious and permanent injury when placed in the
      eyes, ears, mouth, or vagina. Carefully follow all instructions before using
      this medicine to prevent serious side effects.
  - type: paragraph
    text: Hexachlorophene must not be used to bathe infants on a regular basis unless
      your doctor tells you otherwise. This may increase risk for more serious side
      effects.
  - type: paragraph
    text: Do not use this medicine as an occlusive dressing, wet pack, lotion, or
      tampon. Also, using other skin products that contain alcohol may decrease the
      effectiveness of hexachlorophene.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, crusting, irritation, itching, or reddening of the skin
      - cracked, dry, or scaly skin
      - increased sensitivity of the skin to sunlight
      - redness or other discoloration of the skin
      - severe sunburn
      - skin rash
      - swelling
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps
      - blurred vision
      - cold, clammy skin
      - confusion
      - convulsions
      - decreased urination
      - diarrhea
      - dizziness
      - dizziness, faintness, or lightheadedness when getting up from a lying or sitting
        position suddenly
      - dry mouth
      - fainting
      - fast, weak pulse
      - increase in heart rate
      - lightheadedness
      - loss of appetite
      - rapid breathing
      - sunken eyes
      - sweating
      - thirst
      - unusual tiredness or weakness
      - vomiting
      - weight loss
      - wheezing
      - wrinkled skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
