    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is 12 hours or more until your next regular
        dose, take the missed dose as soon as possible, and then go back to your regular
        schedule. If you miss a dose and it is less than 12 hours until your next
        regular dose, skip the missed dose and take your next dose at the regular
        time.
    - type: paragraph
      text: If you vomit after taking a dose of this medicine, do not take an additional
        dose. Take your next dose at your usual time.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. It
      may also cause birth defects if the father is using it when his sexual partner
      becomes pregnant. If you can get pregnant, your doctor may do tests to make
      sure you are not pregnant 7 days before starting treatment. Use an effective
      form of birth control during treatment and for at least 4 months after the last
      dose. Males with female partners who are able to become pregnant should use
      an effective form of birth control during treatment and for at least 4 months
      after the last dose. If you think you have become pregnant, tell your doctor
      right away.
  - type: paragraph
    text: Using this medicine may cause differentiation syndrome, which may be life-threatening.
      It may occur within 1 day and up to 41 days after treatment with this medicine.
      Check with your doctor right away if you have agitation, bloating or swelling
      of the face, arms, hands, lower legs, or feet, blurred vision, coma, confusion,
      decreased urine output, dizziness, dizziness, faintness, or lightheadedness
      when getting up suddenly from a lying or sitting position, fever, headache,
      hostility, irritability, lethargy, muscle twitching, nausea, rapid weight gain,
      seizures, stupor, sweating, swelling of the face, ankles, or hands, tingling
      of the hands or feet, trouble breathing, unusual weight gain or loss. Your doctor
      may give you a steroid medicine (eg, dexamethasone) to help treat these symptoms.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you had a heart rhythm problem, including
      QT prolongation.
  - type: paragraph
    text: Some men and women who use this medicine have become infertile (unable to
      have children). Talk with your doctor before using this medicine if you plan
      to have children.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
