    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart failure or
      - Heart rhythm problems (eg, long QT syndrome)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Hypokalemia (low potassium levels in the blood) or
      - Hypomagnesemia (low magnesium levels in the blood)—Must be corrected first
        before using this medicine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before using this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Take this medicine at the same time each day. You may take this medicine
      on an empty stomach or with a low-fat meal.
  - type: paragraph
    text: Swallow the tablet whole with a cup of water. Do not cut or chew it.
  - type: paragraph
    text: 'If you are unable to swallow the tablet whole:'
  - type: list
    ordered: false
    items:
    - Add all the tablets to a clean and dry pill crusher. Screw the top of the pill
      crusher down until it touches the tablets.
    - Turn the cap back and forth to crush the tablets. Repeat until all large tablet
      pieces are broken up. The crushed tablets should be like the consistency of
      flour.
    - Use 2 teaspoons to measure 10 milliliters (mL) of room temperature water and
      add it into a small cup. Add the crushed tablets into the small cup with 10
      mL water. Tap the pill crusher to make sure no more crushed tablet pieces are
      left.
    - Carefully swirl the cup every 30 seconds to 1 minute for a total of 5 minutes.
      The mixture should look cloudy.
    - Draw up the mixture into a 20 mL syringe. Turn the oral syringe upside down
      and back multiple times before taking or giving the medicine. Take the mixture
      within 2 hours of mixing.
    - Place the tip of the oral syringe into the mouth against the inside of the cheek.
      Slowly and gently press down on the plunger. Allow the patient to swallow the
      medicine. Make sure that no medicine is left in the mouth. The patient should
      remain sitting up straight or standing for 2 to 3 minutes right after receiving
      the medicine.
    - Rinse the cup with another 10 mL of room temperature water and repeat the steps
      to swirl and draw up the water, and give the water until no medicine is left
      in the cup.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of acute leukemia: Adults and
        children 1 year of age and older weighing 40 kilograms (kg) or more—160 to
        270 milligrams (mg) 2 times a day. Your doctor may adjust your dose as needed
        and tolerated. Children 1 year of age and older weighing less than 40 kg—Dose
        is based on body surface area (BSA) and must be determined by your doctor.
        The dose is usually 95 to 160 milligrams per square meter (mg/m[2]) of BSA,
        taken 2 times a day. Your doctor may adjust your dose as needed and tolerated.
        BSA of 1.3 to 1.4 meter squared (m2)—135 to 220 mg 2 times a day. BSA of 1.1
        to 1.2 m2—110 to 185 mg 2 times a day. BSA of 1 m2—100 to 160 mg 2 times a
        day. BSA of 0.8 to 0.9 m2—75 to 135 mg 2 times a day. BSA of 0.7 m2—50 to
        110 mg 2 times a day. BSA of 0.6 m2—50 to 100 mg 2 times a day. BSA of 0.5
        m2—50 to 75 mg 2 times a day. BSA of 0.4 m2—25 to 50 mg 2 times a day. Children
        younger than 1 year of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of acute leukemia: Adults and children 1 year of age and older
        weighing 40 kilograms (kg) or more—160 to 270 milligrams (mg) 2 times a day.
        Your doctor may adjust your dose as needed and tolerated. Children 1 year
        of age and older weighing less than 40 kg—Dose is based on body surface area
