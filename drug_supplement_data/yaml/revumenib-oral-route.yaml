        m2—50 to 100 mg 2 times a day. BSA of 0.5 m2—50 to 75 mg 2 times a day. BSA
        of 0.4 m2—25 to 50 mg 2 times a day. Children younger than 1 year of age—Use
        and dose must be determined by your doctor.'
