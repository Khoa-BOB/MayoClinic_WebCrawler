title: Mometasone (nasal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Nasonex
    - type: paragraph
      text: Sinuva
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Mometasone nasal spray is used to treat and prevent the symptoms (eg, stuffy
      or runny nose, itching, sneezing) of seasonal (short-term) and perennial (year-round)
      allergic rhinitis (hay fever). This medicine is also used to treat nasal polyps
      in adults.
  - type: paragraph
    text: Mometasone belongs to the family of medicines known as corticosteroids (cortisone-like
      medicines). It works by preventing certain cells from releasing substances that
      cause an allergic reaction.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Implant
    - Spray
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of mometasone nasal spray to treat symptoms of allergic rhinitis
        in children younger than 2 years of age , to prevent seasonal allergic rhinitis
        in children younger then 12 years of age , and to treat nasal polyps in children
        younger than 18 years of age . Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of mometasone nasal spray in the
        elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Desmopressin
      - Mifepristone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aspirin
      - Atazanavir
      - Bemiparin
      - Carbamazepine
      - Cobicistat
      - Cosyntropin
      - Darunavir
      - Ethinyl Estradiol
      - Fosphenytoin
      - Insulin Aspart, Recombinant
      - Lutetium Lu 177 Dotatate
      - Macimorelin
      - Nadroparin
      - Nirmatrelvir
      - Phenytoin
      - Rabies Vaccine
      - Ritonavir
      - Sargramostim
      - Somatrogon-ghla
      - Upadacitinib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Auranofin
      - Ketoconazole
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Cataracts, history of or
      - Glaucoma, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Chickenpox, recent exposure or
      - Herpes simplex (virus) infection of the eye or
      - Infections (virus, bacteria, or fungus) or
      - Measles, recent exposure or
      - Tuberculosis, active or history of—This medicine can reduce the body's ability
        to fight off these infections.
    - type: list
      ordered: false
      items:
      - Injury to the nose, recent or
      - Nose surgery, recent or
      - Sores or ulcers in the nose, recent—This medicine may prevent proper healing
        of these conditions.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of this
      medicine than your doctor ordered because it may increase the chance of absorption
      through the lining of the nose and result in unwanted effects.
  - type: paragraph
    text: This medicine usually comes with patient information leaflet and patient
      instructions. Read and follow the instructions carefully. Ask your doctor if
      you have any questions.
  - type: paragraph
    text: This medicine is for use only in the nose . Do not get any of it into your
      eyes or on your skin. If it does get in these areas, rinse them with water right
      away and call your doctor.
  - type: paragraph
    text: This medicine must be used regularly as ordered by your doctor. It usually
      begins to work in about 2 days, but up to 2 weeks may pass before you feel its
      full effects.
  - type: paragraph
    text: Check with your doctor before using this medicine for nasal problems other
      than the one for which it was prescribed, since it should not be used on many
      bacterial, viral, or fungal nasal infections.
  - type: paragraph
    text: 'To use:'
  - type: list
    ordered: false
    items:
    - Shake the bottle thoroughly before each use.
    - When you use the spray for the first time, you must prime the bottle. To do
      this, pump the bottle 10 times or until a fine spray comes out. Now it is ready
      to use.
    - If you do not use the bottle for 7 days or longer, prime it again by releasing
      2 sprays.
    - Before using the spray, gently blow your nose to clear the nostrils.
    - Sit or stand up straight and tilt your head slightly forward. Insert the tip
      of the bottle into your right nostril. Spray into your right nostril.
    - Breathe gently inward through the nostril and then breathe out through your
      mouth.
    - Spray into your left nostril the same way.
    - After using the spray, wipe the tip of the bottle with a clean tissue and put
      the cap back on.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For nasal dosage form (spray): For prevention of seasonal allergic rhinitis:
        Adults and children 12 years of age and older—2 sprays in each nostril once
        a day. Each spray contains 50 micrograms (mcg) of mometasone. Children younger
        than 12 years of age—Use and dose must be determined by your doctor. For treatment
        of nasal polyps: Adults—2 sprays in each nostril 2 times a day or once a day.
        Each spray contains 50 micrograms (mcg) of mometasone. Children—Use and dose
        must be determined by your doctor. For treatment of seasonal and perennial
        allergic rhinitis: Adults and children 12 years of age and older—2 sprays
        in each nostril once a day. Each spray contains 50 micrograms (mcg) of mometasone.
        Children 2 to 11 years of age—1 spray in each nostril once a day. Children
        younger than 2 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For prevention of seasonal allergic rhinitis: Adults and children 12 years
        of age and older—2 sprays in each nostril once a day. Each spray contains
        50 micrograms (mcg) of mometasone. Children younger than 12 years of age—Use
        and dose must be determined by your doctor.'
      - 'For treatment of nasal polyps: Adults—2 sprays in each nostril 2 times a
        day or once a day. Each spray contains 50 micrograms (mcg) of mometasone.
        Children—Use and dose must be determined by your doctor.'
      - 'For treatment of seasonal and perennial allergic rhinitis: Adults and children
        12 years of age and older—2 sprays in each nostril once a day. Each spray
        contains 50 micrograms (mcg) of mometasone. Children 2 to 11 years of age—1
        spray in each nostril once a day. Children younger than 2 years of age—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—2 sprays in each nostril once
        a day. Each spray contains 50 micrograms (mcg) of mometasone.
      - Children younger than 12 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - Adults—2 sprays in each nostril 2 times a day or once a day. Each spray contains
        50 micrograms (mcg) of mometasone.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—2 sprays in each nostril once
        a day. Each spray contains 50 micrograms (mcg) of mometasone.
      - Children 2 to 11 years of age—1 spray in each nostril once a day.
      - Children younger than 2 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away the bottle after you have used 120 sprays, even if there is
        still some medicine left in it. It is best to keep track of the number of
        sprays used so you will know when it is time to throw the bottle away.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly and to check
      for unwanted effects.
  - type: paragraph
    text: If your or your child's symptoms do not improve within a few days or if
      they become worse, check with your doctor.
  - type: paragraph
    text: This medicine may cause fungus infection of the mouth or throat (thrush).
      Tell your doctor right away if you have white patches in the mouth or throat,
      or pain when eating or swallowing.
  - type: paragraph
    text: This medicine may increase your risk of having problems with your nose.
      Check with your doctor right away if you or your child have bloody mucus, sores
      inside the nose, or unexplained nosebleeds while you are using this medicine.
  - type: paragraph
    text: Check with your doctor immediately if blurred vision, difficulty in reading,
      or any other change in vision occurs during or after treatment. Your doctor
      may want your eyes be checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: If you or your child have difficulty with breathing, or any allergic reaction
      to this medicine, check with your doctor right away.
  - type: paragraph
    text: Avoid close contact with anyone who has chickenpox or measles if you have
      never had these conditions before. This is especially important for children.
      Tell your doctor right away if you think you have been exposed to chickenpox
      or measles.
  - type: paragraph
    text: 'Using too much of this medicine or using it for a long time may increase
      your risk of having adrenal gland problems. Talk to your doctor if you or your
      child have more than one of these symptoms while using this medicine: darkening
      of the skin, diarrhea, dizziness, fainting, loss of appetite, mental depression,
      nausea, skin rash, unusual tiredness or weakness, or weight loss.'
  - type: paragraph
    text: This medicine may cause children to grow more slowly than usual. Talk to
      your child's doctor if you have any concerns.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody mucus or unexplained nosebleeds
      - chills
      - cold
      - cough
      - fever
      - headache
      - hoarseness
      - increased abdominal or stomach pain and cramping during menstrual periods
      - muscle or bone pain
      - stuffy or runny nose
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - discharge or redness in the eye, eyelid, or inner lining of the eyelid
      - earache
      - tightness in the chest
      - troubled breathing
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sores inside the nose
      - white patches inside the nose or mouth
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - hives, skin rash
      - itching, puffiness, or swelling of the eyelids or around the eyes, face, lips,
        or tongue
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sore throat
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - joint or muscle ache or pain
      - nasal burning or irritation
      - nausea
      - sneezing
      - stomach upset or discomfort following meals
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bad, unusual, or unpleasant (after) taste or smell
      - change in taste or smell
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
