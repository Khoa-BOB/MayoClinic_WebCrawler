    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: You may store the oral liquid at room temperature for up to 8 weeks. Throw
        away any unused medicine after 8 weeks.
    - type: paragraph
      text: Keep the bottle tightly closed. Use the tablets dispensed only in its
        original container.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and to decide if you should continue
      to take it. Blood and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you can get pregnant, your doctor may do tests to make sure you are not pregnant
      before starting this medicine. Use an effective birth control to keep from getting
      pregnant during treatment and for at least 6 months after the last dose of this
      medicine. Male patients who have female partners who can become pregnant must
      use an effective birth control during treatment and for at least 3 months after
      the last dose. If you think you have become pregnant while using the medicine,
      tell your doctor right away.
  - type: paragraph
    text: Deferiprone can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. If you can, avoid being
      near people who are sick or have infections. Wash your hands often. Stay away
      from rough sports or other situations where you could be bruised, cut, or injured.
      Brush and floss your teeth gently. Be careful when using sharp objects, including
      razors and fingernail clippers.
  - type: paragraph
    text: Check with your doctor right away if you start to have a cough that will
      not go away, weight loss, night sweats, a fever, chills, or flu-like symptoms,
      such as a runny or stuffy nose, headache, blurred vision, or feeling generally
      ill. These may be signs that you have an infection.
  - type: paragraph
    text: This medicine may cause your urine to turn red or brownish in color. This
      is normal and is nothing to worry about.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bone pain
      - chills
      - cough
      - fever
      - lower back or side pain
      - painful or difficult urination
      - pale skin
      - sore throat
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever with or without chills
      - general feeling of tiredness or weakness
      - hoarseness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - bleeding gums
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - blood in the urine or stools
      - blurred vision
      - chest pain, discomfort, or tightness
      - clay-colored stools
      - confusion
      - dark urine
      - decreased urination
      - dilated neck veins
      - dizziness or lightheadedness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - drowsiness
      - dry mouth
      - fainting
      - fast or irregular heartbeat
      - headache
      - hives, itching, skin rash
      - increase in heart rate
      - increased sweating
      - irregular breathing
      - irritation
      - joint pain, stiffness, or swelling
      - large, flat, blue or purplish patches in the skin
      - loss of appetite
      - muscle tremors
      - nausea
      - nervousness
      - painful knees and ankles
      - pinpoint red spots on the skin
      - pounding in the ears
      - raised red swellings on the skin, the buttocks, legs, or ankles
      - rapid weight gain
      - rapid, deep or shallow breathing
      - redness of the skin
      - restlessness
      - seizures
      - severe nausea or vomiting
      - slow heartbeat
      - sneezing
      - spots on your skin resembling a blister or pimple
      - stomach pain or cramps
      - sudden trouble breathing
      - sugar in the urine
      - sunken eyes
      - sweating
      - swelling of the eyelids, around the eyes, face, lips, hands, or feet
      - thirst
      - tingling of the hands or feet
      - trouble with balance
      - trouble breathing or swallowing
      - unpleasant breath odor
      - unusual weight gain or loss
      - vision changes
      - vomiting of blood
      - weight gain
      - wrinkled skin
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with moving
      - muscle pain or stiffness
      - reddish or brown discoloration of the urine
      - stomach discomfort
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - belching
      - diarrhea
      - heartburn
      - increased or decreased appetite
      - indigestion
      - pain in the arms or legs
      - stomach upset
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody nose
      - clenching, gnashing, or grinding teeth
      - constipation
      - coughing or spitting up blood
      - depression
      - difficulty opening the mouth
      - difficulty with speaking
      - drooling
      - impaired psychomotor skills
      - increased sensitivity of the skin to sunlight
      - lockjaw
      - loss of balance control
      - muscle spasm, especially of the neck and back
      - muscle trembling, jerking, or stiffness
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - severe sunburn
      - shuffling walk
      - sleepiness or unusual drowsiness
      - stiffness of the limbs
      - stomach bloating, burning, cramping, or pain
      - twisting movements of the body
      - uncontrolled movements, especially of the face, neck, and back
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
