title: Deferiprone (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ferriprox
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Deferiprone is used to remove excess iron from the body in patients with
      thalassemia, sickle cell disease, or anemia who have blood transfusions.
  - type: paragraph
    text: Deferiprone is an iron chelator (binder). It combines with iron in the blood.
      The combination of iron and deferiprone is then removed from the body by the
      kidneys. If you have too much iron in the body, it can damage various organs
      and tissues.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of deferiprone tablets in children younger than 8 years of
        age and deferiprone oral liquid in children younger than 3 years of age. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness deferiprone in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aceclofenac
      - Busulfan
      - Diclofenac
      - Exagamglogene Autotemcel
      - Lovotibeglogene Autotemcel
      - Phenylbutazone
      - Probenecid
      - Silymarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood or bone marrow problems (eg, agranulocytosis, neutropenia) or
      - Liver disease—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Diamond Blackfan anemia or
      - Myelodysplastic syndrome (bone marrow cancer)—Safety and efficacy have not
        been established in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Infection—May decrease your body's ability to fight infection.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor to benefit your condition
      as much as possible . Do not take more of it, do not take it more often, and
      do not take it for a longer time than your doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have questions.
  - type: paragraph
    text: 'Deferiprone tablets are available in 3 forms: 1000 milligram (mg) tablet
      2 times a day , 1000 mg tablet 3 times a day , and 500 mg tablet 3 times a day
      . Make sure you are taking the correct tablet and dose. Ask your doctor or pharmacist
      if you have questions.'
  - type: paragraph
    text: 'If you are taking the oral liquid or tablet 3 times a day : It is best
      to take the first dose of this medicine in the morning, the second dose at mid-day,
      and the third dose in the evening with meals unless your doctor tells you otherwise.'
  - type: paragraph
    text: 'If you are taking the tablet 2 times a day : Take the first dose in the
      morning and the second dose in the evening with food.'
  - type: paragraph
    text: Use a marked measuring spoon, oral syringe, or medicine cup to measure the
      oral liquid .
  - type: paragraph
    text: If you have trouble swallowing the tablet , you may use the oral liquid
      form of this medicine.
  - type: paragraph
    text: If you are taking antacids, multivitamins, or supplements containing aluminum,
      iron, and zinc, take these medicines at least 4 hours before or after taking
      deferiprone .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For chronic iron overload: For oral dosage forms (oral liquid): Adults and
        children 3 years of age and older—Dose is based on body weight and must be
        determined by your doctor. At first, 25 milligrams (mg) per kilogram (kg)
        of body weight, 3 times a day (75 mg per kg per day). Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 33 mg per
        kg of body weight, 3 times a day (99 mg per kg per day). Children younger
        than 3 years of age—Use and dose must be determined by your doctor. For oral
        dosage forms (1000-mg tablets 2 times a day): Adults and children 8 years
        of age and older—Dose is based on body weight and must be determined by your
        doctor. At first, 75 milligrams (mg) per kilogram (kg) of body weight per
        day, given in 2 divided doses (taken at least 12 hours apart). Your doctor
        may adjust your dose as needed. However, the dose is usually not more than
        99 mg per kg of body weight per day. Children younger than 8 years of age—Use
        and dose must be determined by your doctor. For oral dosage forms (1000-mg
        tablets 3 times a day): Adults and children 8 years of age and older—Dose
