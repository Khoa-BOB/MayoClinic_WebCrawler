    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the oral liquid in the refrigerator. Throw away any unused medicine
        after 14 days.
    - type: paragraph
      text: Store the tablets in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: Cefprozil may cause diarrhea, and in some cases it can be severe. Do not
      take any medicine or give medicine to your child to treat diarrhea without first
      checking with your doctor. Diarrhea medicines may make the diarrhea worse or
      make it last longer. If you have any questions about this or if mild diarrhea
      continues or gets worse, check with your doctor.
  - type: paragraph
    text: Before you or your child have any medical tests, tell the medical doctor
      in charge that you are using this medicine. The results of some tests may be
      affected by this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chest pain
      - cough or hoarseness
      - diarrhea
      - fever or chills
      - lower back or side pain
      - painful or difficult urination
      - shortness of breath
      - sore throat sores, ulcers, or white spots on the lips or in the mouth
      - swollen glands
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps, pain, or tenderness
      - bleeding gums
      - blistering, peeling, or loosening of the skin
      - bloating
      - blood in the urine or stools
      - clay-colored stools
      - dark urine
      - diarrhea, watery and severe, which may also be bloody
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - feeling of discomfort
      - headache
      - hives
      - increased thirst
      - inflammation of the joints
      - itching
      - joint or muscle pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss of appetite
      - muscle aches
      - nausea or vomiting
      - pain
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rash
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - shortness of breath
      - swollen lymph glands
      - tightness in the chest
      - unpleasant breath odor
      - unusual weight loss
      - vomiting of blood
      - watery or bloody diarrhea
      - wheezing
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back, leg, or stomach pains
      - bleeding gums
      - bloody or cloudy urine
      - bloody, black, or tarry stools
      - decrease in urine output or decrease in urine-concentrating ability
      - difficulty with breathing
      - fever with or without chills
      - general body swelling
      - general feeling of tiredness or weakness
      - high fever
      - nosebleeds
      - pale skin
      - sudden decrease in the amount of urine
      - swollen or painful glands
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Itching or pain of the vagina or genital area
      - pain during sexual intercourse
      - thick, white vaginal discharge with no odor or with a mild odor
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - hives or welts
      - nervousness
      - redness of the skin
      - restlessness
      - sleepiness or unusual drowsiness
      - sleeplessness
      - trouble sitting still
      - trouble with sleeping
      - unable to sleep
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
