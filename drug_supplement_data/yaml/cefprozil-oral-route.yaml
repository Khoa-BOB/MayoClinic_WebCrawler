title: Cefprozil (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cefzil
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cefprozil is used to treat bacterial infections in many different parts
      of the body. It belongs to the class of medicines known as cephalosporin antibiotics.
      It works by killing bacteria or preventing their growth. However, this medicine
      will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of cefprozil for otitis media (ear
        infection) and sinusitis in children 6 months to 12 years of age. However,
        safety and efficacy have not been established in infants younger than 6 months
        of age.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of cefprozil for sore throat and
        skin infections in children 2 to 12 years of age. However, safety and efficacy
        have not been established in children younger than 2 years of age.
    - type: paragraph
      text: Because of cefprozil's toxicity, use in newborn babies is not recommended.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of cefprozil in the elderly. However,
        elderly patients are more likely to have age-related kidney problems, which
        may require caution and an adjustment in the dose for patients receiving cefprozil.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Cholera Vaccine, Live
      - Desogestrel
      - Dienogest
      - Drospirenone
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Exenatide
      - Gestodene
      - Levonorgestrel
      - Mestranol
      - Methotrexate
      - Nomegestrol
      - Norethindrone
      - Norgestimate
      - Norgestrel
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Probenecid
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Colitis (inflammation in gut), history of or
      - Diarrhea, severe, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. Effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Phenylketonuria (PKU)—The oral liquid form of this medicine contains phenylalanine,
        which can make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Shake the oral liquid well before each use. Measure the medicine with a
      marked measuring spoon, oral syringe, or medicine cup. The average household
      teaspoon may not hold the right amount of liquid.
  - type: paragraph
    text: Keep using this medicine for the full treatment time, even if you feel better
      after the first few doses. Your infection may not clear up if you stop using
      the medicine too soon.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (tablets or suspension): For bronchitis: Adults and
        teenagers—500 milligrams (mg) every 12 hours, taken for 10 days. Children
        younger than 13 years of age—Use and dose must be determined by your doctor.
        For ear infections: Children 6 months to 12 years of age—Dose is based on
        body weight and must be determined by your doctor. The dose is usually 15
        milligrams (mg) per kilogram (kg) of body weight every 12 hours, taken for
        10 days. Infants younger than 6 months of age—Use and dose must be determined
        by your doctor. For sinusitis: Adults and teenagers—250 or 500 milligrams
        (mg) every 12 hours for 10 days. Children 6 months to 12 years of age—Dose
        is based on body weight and must be determined by your doctor. The dose is
        usually 7.5 to 15 milligrams (mg) per kilogram (kg) of body weight every 12
        hours, taken for 10 days. Infants younger than 6 months of age—Use and dose
        must be determined by your doctor. For skin infections: Adults and teenagers—250
        to 500 milligrams (mg) every 12 hours or 500 mg once a day, taken for 10 days.
        Children 2 to 12 years of age—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 20 milligrams (mg) per kilogram (kg) of
        body weight per day, taken for 10 days. Children younger than 2 years of age—Use
        and dose must be determined by your doctor. For sore throat and tonsillitis:
        Adults and teenagers—500 milligrams (mg) once a day for 10 days. Children
        2 to 12 years of age—Dose is based on body weight and must be determined by
        your doctor. The dose is usually 7.5 milligrams (mg) per kilogram (kg) of
        body weight every 12 hours, taken for 10 days. Children younger than 2 years
        of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
