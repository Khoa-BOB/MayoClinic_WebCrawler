title: Metipranolol (ophthalmic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Optipranolol
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Metipranolol is used alone or together with other medicines to treat increased
      pressure in the eye that is caused by open-angle glaucoma or a condition called
      ocular (eye) hypertension. This medicine is a beta-blocker .
  - type: paragraph
    text: This medicine is available only with your doctor's prescription .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of metipranolol in the pediatric population. Safety and efficacy
        have not been established .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatrics-specific
        problems that would limit the usefulness of metipranolol in the elderly .
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Albuterol
      - Ceritinib
      - Clonidine
      - Crizotinib
      - Darunavir
      - Diltiazem
      - Dronedarone
      - Fenoldopam
      - Fingolimod
      - Formoterol
      - Indacaterol
      - Iobenguane I 131
      - Iohexol
      - Lacosamide
      - Landiolol
      - Levalbuterol
      - Melatonin
      - Methylergonovine
      - Olodaterol
      - Oxymetazoline
      - Phenelzine
      - Ponesimod
      - Rivastigmine
      - Salmeterol
      - Terbutaline
      - Verapamil
      - Vilanterol
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Aceclofenac
      - Acemetacin
      - Acetyldigoxin
      - Albiglutide
      - Alfuzosin
      - Alogliptin
      - Amtolmetin Guacil
      - Aspirin
      - Bromfenac
      - Bufexamac
      - Bunazosin
      - Canagliflozin
      - Celecoxib
      - Chlorpropamide
      - Choline Salicylate
      - Clonixin
      - Dapagliflozin
      - Deslanoside
      - Dexibuprofen
      - Dexketoprofen
      - Diclofenac
      - Diflunisal
      - Digitoxin
      - Digoxin
      - Dipyrone
      - Doxazosin
      - Droxicam
      - Dulaglutide
      - Empagliflozin
      - Ertugliflozin
      - Etodolac
      - Etofenamate
      - Etoricoxib
      - Exenatide
      - Felbinac
      - Fenoprofen
      - Fepradinol
      - Feprazone
      - Floctafenine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma or
      - Bradycardia (slow heartbeat) or
      - Chronic obstructive pulmonary disease (COPD), severe or
      - Heart block or
      - Heart failure—Should not use in patients with these conditions .
    - type: list
      ordered: false
      items:
      - Blood vessel disease (especially blood vessels of the brain) or
      - Stroke, history of—Use with caution. This medicine may worsen these conditions
        .
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hyperthyroidism (overactive thyroid) or
      - Hypoglycemia (low blood sugar)—May cover up some of the signs and symptoms
        of these diseases, such as a fast heartbeat .
    - type: list
      ordered: false
      items:
      - Lung disease—Use with caution. May cause difficulty with breathing in patients
        with this condition .
    - type: list
      ordered: false
      items:
      - Myasthenia gravis—May worsen symptoms of this condition, such as muscle weakness
        .
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Shake the medicine well just before each use .
  - type: paragraph
    text: 'To use the eye drops (solution):'
  - type: list
    ordered: false
    items:
    - First, wash your hands. Tilt the head back and, pressing your finger gently
      on the skin just beneath the lower eyelid, pull the lower eyelid away from the
      eye to make a space. Drop the medicine into this space. Let go of the eyelid
      and gently close the eyes. Do not blink. Keep the eyes closed and apply pressure
      to the inner corner of the eye with your finger for 1 or 2 minutes to allow
      the medicine to be absorbed by the eye.
    - Immediately after using the medicine, wash your hands to remove any medicine
      that may be on them.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
      Serious damage to the eye and possible loss of vision may result from using
      contaminated eye medicines .
  - type: paragraph
    text: If your doctor ordered two different eye medicines to be used together,
      wait several minutes before using the second medicine. This will help prevent
      the second medicine from “washing out” the first one .
  - type: paragraph
    text: You should not use this medicine if you have contact lenses in your eyes.
      Remove your contact lenses before you use this medicine, and wait 15 minutes
      before putting the lenses back in .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic solution dosage form (eye drops): For glaucoma or ocular hypertension:
        Adults—One drop in the affected eye(s) two times a day. Children—Use and dose
        must be determined by your doctor .'
    - type: list
      ordered: false
      items:
      - 'For glaucoma or ocular hypertension: Adults—One drop in the affected eye(s)
        two times a day. Children—Use and dose must be determined by your doctor .'
    - type: list
      ordered: false
      items:
      - Adults—One drop in the affected eye(s) two times a day.
      - Children—Use and dose must be determined by your doctor .
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and to check for unwanted effects
      .
  - type: paragraph
    text: If itching, redness, swelling, or other signs of eye or eyelid irritation
      occur, stop using this medicine and check with your doctor. These signs may
      mean that you are allergic to this medicine .
  - type: paragraph
    text: Metipranolol may cause heart failure in some patients. Check with your doctor
      right away if you are having chest pain or discomfort; dilated neck veins; extreme
      fatigue; irregular breathing; an irregular heartbeat; shortness of breath; swelling
      of the face, fingers, feet, or lower legs; weight gain; or wheezing .
  - type: paragraph
    text: This medicine may cause changes in your blood sugar levels. Also, this medicine
      may cover up signs of low blood sugar, such as a rapid pulse rate. Check with
      your doctor if you have these problems or if you notice a change in the results
      of your blood or urine sugar tests .
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not determined
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody nose
      - blurred vision
      - burning, dry, or itching eyes
      - changes in vision
      - chest pain or discomfort
      - cough producing mucus
      - difficult or labored breathing
      - difficulty in moving
      - difficulty seeing at night
      - difficulty swallowing
      - discharge, excessive tearing
      - fast, slow, irregular, pounding, or racing heartbeat or pulse
      - headache
      - hives
      - increased sensitivity of eyes to sunlight
      - itching
      - lightheadedness, dizziness, or fainting
      - muscle pain or stiffness
      - nausea
      - nervousness
      - pain in forehead
      - pain or discomfort in arms, jaw, back, or neck
      - pain, swelling, or redness in joints
      - pounding in the ears
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness, pain, swelling, or itching of the eye, eyelid, or inner lining of
        eyelid
      - shortness of breath
      - skin rash
      - sweating
      - tightness in chest
      - unusual tiredness or weakness
      - wheezing
      - vomiting
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - dilated neck veins
      - dizziness, faintness, or lightheadedness when getting up from a lying or sitting
        position suddenly
      - extreme fatigue
      - irregular breathing
      - swelling of face, fingers, feet, or lower legs
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not determined
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Discouragement
      - feeling sad or empty
      - irritability
      - lack of appetite
      - lack or loss of strength
      - loss of interest or pleasure
      - muscle aching or cramping
      - runny nose
      - sleepiness or unusual drowsiness
      - sneezing
      - stuffy nose
      - tiredness
      - trouble concentrating
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
