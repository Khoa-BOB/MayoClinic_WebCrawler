title: Ondansetron (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Zofran
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ondansetron injection is used to prevent nausea and vomiting caused by cancer
      medicines (chemotherapy or radiation), including high-dose cisplatin. This medicine
      is also used to prevent and treat nausea and vomiting that may happen after
      surgery.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of ondansetron injection in children.
        However, safety and efficacy have not been established in children being treated
        for nausea and vomiting due to cancer treatments who are younger than 6 months
        of age or for the prevention of nausea and vomiting from surgery in children
        younger than 1 month of age .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of ondansetron injection in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Apomorphine
      - Bepridil
      - Cisapride
      - Dronedarone
      - Fluconazole
      - Ketoconazole
      - Levoketoconazole
      - Mavorixafor
      - Mesoridazine
      - Phenelzine
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Acecainide
      - Adagrasib
      - Alfentanil
      - Alfuzosin
      - Almotriptan
      - Amineptine
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amitriptylinoxide
      - Amoxapine
      - Amphetamine
      - Anagrelide
      - Anileridine
      - Apalutamide
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Avacopan
      - Azathioprine
      - Azimilide
      - Azithromycin
      - Bedaquiline
      - Benzhydrocodone
      - Benzphetamine
      - Bretylium
      - Brompheniramine
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Buspirone
      - Butorphanol
      - Capmatinib
      - Carbamazepine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Cyclophosphamide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to selective 5-HT3 receptor antagonists (eg, alosetron [Lotronex®],
        dolasetron [Anzemet®], granisetron [Kytril®], or palonosetron [Aloxi®])—Use
        with caution. It is likely you will also be allergic to ondansetron.
    - type: list
      ordered: false
      items:
      - Bowel blockage or
      - Gastric distension (enlarged stomach)—May cover up symptoms of these stomach
        or bowel problems, especially in patients who had a recent stomach surgery.
    - type: list
      ordered: false
      items:
      - Bradyarrhythmia (slow heartbeat) or
      - Congestive heart failure or
      - Electrolyte imbalance (eg, low potassium or magnesium in the blood)—Patients
        with these conditions should be monitored while using this medicine.
    - type: list
      ordered: false
      items:
      - Heart rhythm problems (eg, congenital long QT syndrome)—Use is not recommended
        in patients with this condition.
    - type: list
      ordered: false
      items:
      - Heart rhythm problems (eg, prolonged QT interval)—Use with caution. May make
        this condition worse.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this medicine in a medical facility. This medicine is given as a shot into one
      of your muscles or through a needle placed in one of your veins.
  - type: paragraph
    text: When this medicine is used to prevent nausea and vomiting caused by cancer
      medicines (chemotherapy) , it is usually given 30 minutes before the start of
      chemotherapy for at least 15 minutes. Additional doses may be given 4 hours
      after the first dose and 8 hours after the first dose.
  - type: paragraph
    text: When this medicine is used to prevent nausea and vomiting caused by surgery
      , it is usually given just before anesthesia (medicine to put you to sleep before
      surgery) or right after surgery if nausea and vomiting begin.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Check with your doctor if severe nausea and vomiting continue after leaving
      the hospital or cancer treatment center .
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you or your child have a rash, itching, hoarseness,
      trouble breathing, trouble swallowing, or any swelling of your hands, face,
      or mouth after you receive the medicine.
  - type: paragraph
    text: Do not use this medicine if you or your child are receiving apomorphine
      (Apokyn®). Using these medicines together may cause serious side effects .
  - type: paragraph
    text: This medicine can cause changes in heart rhythms, including QT prolongation.
      It may change the way your heart beats and cause fainting or serious side effects
      in some patients. Contact your doctor right away if you or your child have fast,
      pounding, or irregular heartbeats.
  - type: paragraph
    text: Check with your doctor right away if you have anxiety, restlessness, a fast
      heartbeat, fever, sweating, muscle spasms, twitching, nausea, vomiting, diarrhea,
      or seeing or hearing things that are not there. These may be symptoms of a serious
      condition called serotonin syndrome. Your risk may be higher if you also take
      certain other medicines that affect serotonin levels in your body.
  - type: paragraph
    text: This medicine may cause a serious heart problem called myocardial ischemia
      (low blood supply to the heart). Check with your doctor right away if you have
      chest pain or discomfort, nausea, pain or discomfort in the arms, jaw, back,
      or neck, sweating, trouble breathing, irregular heartbeat, or vomiting.
  - type: paragraph
    text: Check with your doctor right away if you or your child start to have pain
      or swelling in your stomach area. These may be signs of a serious stomach or
      bowel problem.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain, discomfort, or tightness
      - pain, redness, or burning at the injection site
      - skin rash, hives, redness, or itching
      - trouble breathing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - blistering, peeling, or loosening of the skin
      - blurred vision
      - chills
      - cold, clammy skin
      - confusion
      - coughing
      - dark-colored urine
      - diarrhea
      - decreased or irregular heartbeat
      - difficulty with breathing or swallowing
      - dizziness or fainting
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        position
      - fast, pounding, slow, or irregular heartbeat or pulse
      - fast, weak pulse
      - fever
      - fixed position of the eye
      - headache
      - heart stops
      - hives or welts
      - hoarseness
      - inability to move the eyes
      - increased blinking or spasms of the eyelid
      - joint or muscle pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - light-colored stools
      - lightheadedness
      - no breathing
      - no pulse or blood pressure
      - noisy breathing
      - overactive reflexes
      - pain or discomfort in the arms, jaw, back, or neck
      - poor coordination
      - red irritated eyes
      - red skin lesions, often with a purple center
      - restlessness
      - shivering
      - slow or irregular breathing
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - sticking out of the tongue
      - stomach pain or swelling
      - sweating
      - swelling of the face, throat, or tongue
      - talking or acting with excitement you cannot control
      - trembling or shaking
      - trouble with speaking or swallowing
      - twitching
      - unconscious
      - uncontrolled twisting movements of the neck, trunk, arms, or legs
      - unusual facial expressions
      - unusual tiredness or weakness
      - vomiting
      - weakness of the arms and legs
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - headache
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, tingling, or prickling sensations
      - drowsiness
      - dryness of the mouth
      - feeling cold
      - itching
      - stomach cramps
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hiccups
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
