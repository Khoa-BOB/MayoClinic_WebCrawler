title: Terazosin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Hytrin
    - type: paragraph
      text: Tezruly
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Terazosin is used to treat men who have symptoms of an enlarged prostate
      gland, which is also known as benign prostatic hyperplasia (BPH). When the prostate
      gland gets larger, certain muscles in the gland get in the way of the tube that
      drains urine from the bladder. This can cause problems with urinating, such
      as a need to urinate often, a weak stream when urinating, or a feeling of not
      being able to empty the bladder completely.
  - type: paragraph
    text: Terazosin is also used to treat high blood pressure (hypertension). High
      blood pressure adds to the workload of the heart and arteries. If it continues
      for a long time, the heart and arteries may not function properly. This can
      damage the blood vessels of the brain, heart, and kidneys, resulting in a stroke,
      heart failure, or kidney failure.
  - type: paragraph
    text: This medicine is an alpha-blocker. It works by relaxing the blood vessels
      so that blood passes through them more easily. As a result, the heart beats
      slower and decreases the blood pressure. When the blood pressure is lowered,
      the amount of blood and oxygen is increased to the heart. It also helps relax
      the muscles in the prostate gland and the opening of the bladder. This may help
      increase the flow of urine or decrease symptoms.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of terazosin oral liquid in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of terazosin oral liquid in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alfuzosin
      - Asenapine
      - Avanafil
      - Iloperidone
      - Melphalan
      - Sildenafil
      - Silodosin
      - Tadalafil
      - Tamsulosin
      - Vardenafil
      - Verapamil
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acebutolol
      - Alprenolol
      - Atenolol
      - Betaxolol
      - Bevantolol
      - Bisoprolol
      - Bucindolol
      - Carteolol
      - Carvedilol
      - Celiprolol
      - Dilevalol
      - Esmolol
      - Labetalol
      - Levobunolol
      - Mepindolol
      - Metipranolol
      - Metoprolol
      - Nadolol
      - Nebivolol
      - Oxprenolol
      - Penbutolol
      - Pindolol
      - Propranolol
      - Sotalol
      - Talinolol
      - Tertatolol
      - Timolol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (chest pain) or
      - Heart disease, severe or
      - Postural hypotension (low blood pressure) or
      - Prostate cancer, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Cataract surgery—An eye problem called Intraoperative Floppy Iris Syndrome
        (IFIS) has occurred in patients who are taking or who have recently taken
        this medicine when they are having cataract surgery. You should tell your
        ophthalmologist (eye doctor) before your surgery if you are taking terazosin.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions in the insert carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: If you take this medicine to treat high blood pressure, your doctor may
      also recommend lifestyle changes. These may include weight control and changes
      in the types of foods you eat, especially foods high in sodium. Your doctor
      will tell you which of these are most important for you. You should check with
      your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure, but
      it does help control it. You must continue to take it as directed if you expect
      to lower your blood pressure and keep it down. You may have to take high blood
      pressure medicine for the rest of your life. If high blood pressure is not treated,
      it can cause serious problems such as heart failure, blood vessel disease, stroke,
      or kidney disease.
  - type: paragraph
    text: 'For patients taking this medicine for benign enlargement of the prostate:'
  - type: list
    ordered: false
    items:
    - Remember that terazosin will not shrink the size of your prostate but it does
      help to relieve the symptoms.
    - It may take up to 4 to 6 weeks before your symptoms get better.
  - type: paragraph
    text: To help you remember to take your medicine, try to get into the habit of
      taking it at the same time each day.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Measure the oral liquid with a marked measuring spoon, oral syringe, or
      medicine cup. The average household teaspoon may not hold the right amount of
      liquid.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For benign prostatic hyperplasia: For oral dosage form (solution): Adults—At
        first, 1 milligram (mg) once a day taken at bedtime. Your doctor may increase
        your dose as needed. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (solution): Adults—At first, 1 milligram (mg) once a
        day taken at bedtime. Your doctor may increase your dose as needed. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 1 milligram (mg) once a day taken at bedtime. Your doctor
        may increase your dose as needed.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: For oral dosage form (solution): Adults—At first,
        1 milligram (mg) once a day taken at bedtime. Your doctor may increase your
        dose as needed. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (solution): Adults—At first, 1 milligram (mg) once a
        day taken at bedtime. Your doctor may increase your dose as needed. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 1 milligram (mg) once a day taken at bedtime. Your doctor
        may increase your dose as needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and to check for unwanted effects.
      Blood and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up suddenly from a lying or sitting position. These symptoms are more likely
      to occur when you begin using this medicine, or when the dose is increased.
      Getting up slowly may help.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, drowsy, or less alert
      than they are normally. Make sure you know how you react to this medicine before
      you drive, use machines, or do anything else that could be dangerous .
  - type: paragraph
    text: If you experience painful or prolonged erection for hours, contact your
      doctor immediately . This condition may require prompt medical treatment to
      prevent serious and permanent damage to your penis.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
    subsections: []
  - heading: Less common
