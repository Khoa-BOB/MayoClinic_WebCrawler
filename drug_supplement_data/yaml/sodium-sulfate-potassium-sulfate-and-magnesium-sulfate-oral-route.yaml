    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check you closely for any problems that
      may be caused by this medicine. Blood and urine tests may be needed to check
      for unwanted effects.
  - type: paragraph
    text: Call your doctor right away if you have decreased urination, dizziness,
      headache, or vomiting. These could be symptoms of a loss of too much body fluid
      (dehydration).
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you had a heart rhythm problem, such
      as QT prolongation.
  - type: paragraph
    text: This medicine may increase your risk for seizures. This is more likely to
      occur if you take medicine for depression, if you are withdrawing from alcohol
      or benzodiazepine use, or if you electrolyte imbalances (eg, low sodium, potassium,
      calcium, or magnesium in the blood). Talk to your doctor if you have any concerns.
  - type: paragraph
    text: Keep yourself hydrated before, during, and after using this medicine. Drink
      extra fluids so you will pass more urine. This may help prevent kidney problems.
  - type: paragraph
    text: This medicine may cause serious bowel problems (eg, colon ulcers, ischemic
      colitis). Check with your doctor right away if you have stomach pain and tenderness,
      bloody stools, or rectal bleeding.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - fainting
      - fast, slow, or uneven heartbeat
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody stools
      - confusion
      - decreased urination
      - diarrhea
      - drowsiness
      - dry mouth
      - fainting
      - increase in heart rate
      - lightheadedness
      - loss of appetite
      - mood or mental changes
      - nausea
      - rapid breathing
      - rectal bleeding
      - seizures
      - stomach pain and tenderness
      - sunken eyes
      - swelling of the eyelids, face, lips, ankles, hands, or feet
      - thirst
      - trouble breathing
      - unusual tiredness or weakness
      - vomiting
      - wrinkled skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Full or bloated feeling
      - pressure in the stomach
      - swelling of the stomach area
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
