title: Sodium sulfate, potassium sulfate, and magnesium sulfate (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: ColPrep Kit
    - type: paragraph
      text: Suprep Bowel Prep Kit
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Sodium sulfate, potassium sulfate, and magnesium sulfate combination is
      used to cleanse the colon (bowel) before a colonoscopy. This medicine is a laxative.
      It works by causing you to have diarrhea to clean your colon. Cleaning your
      colon will help your doctor see the inside of your colon more clearly during
      colonoscopy.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Suprep Bowel Prep Kit® in children younger than 12 years
        of age. Safety and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of ColPrep Kit® in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of ColPrep Kit® or Suprep Bowel Prep
        Kit® in the elderly. However, elderly patients are more likely to have age-related
        liver, kidney, or heart problems, and unwanted effects (eg, fluid or electrolyte
        imbalance), which may require caution in patients receiving Suprep Bowel Prep
        Kit® .
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Eplerenone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alacepril
      - Amiloride
      - Baloxavir Marboxil
      - Benazepril
      - Bisacodyl
      - Canrenoate
      - Captopril
      - Chlorpromazine
      - Chlortetracycline
      - Cilazapril
      - Ciprofloxacin
      - Delafloxacin
      - Delapril
      - Demeclocycline
      - Digoxin
      - Dolutegravir
      - Doxycycline
      - Elvitegravir
      - Enoxacin
      - Eravacycline
      - Fosinopril
      - Gatifloxacin
      - Gemifloxacin
      - Grepafloxacin
      - Hydroxychloroquine
      - Imidapril
      - Indomethacin
      - Iron
      - Levofloxacin
      - Levomethadyl
      - Licorice
      - Lisinopril
      - Lomefloxacin
      - Lymecycline
      - Meclocycline
      - Methacycline
      - Minocycline
      - Moexipril
      - Moxifloxacin
      - Norfloxacin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Delafloxacin
      - Felodipine
      - Isradipine
      - Licorice
      - Nicardipine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (chest pain), unstable or
      - Congestive heart failure or
      - Electrolyte imbalance (eg, low calcium, magnesium, potassium, sodium in the
        blood) or
      - Fluid imbalance or
      - Heart attack, recent or
      - Heart disease (eg, cardiomyopathy) or
      - Heart rhythm problems (eg, prolonged QT interval, uncontrolled arrhythmia),
        history of or
      - Withdrawal from alcohol or benzodiazepines (eg, alprazolam, clonazepam, diazepam,
        lorazepam, Xanax®)—May increase risk for seizures, arrhythmia, or kidney problems.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Gout or
      - Inflammatory bowel disease or
      - Kidney disease or
      - Seizures, history of or
      - Trouble swallowing or
      - Ulcerative colitis, active and severe—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Gastric retention (problems with emptying of food or fluid from the stomach)
        or
      - Intestinal problems (eg, blockage, ileus, perforation) or
      - Toxic colitis or
      - Toxic megacolon (a very dilated intestine)—Should not be used in patients
        with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your doctor may have special instructions for you, depending on the schedule
      of your colonoscopy you are going to have. If you have not received such instructions,
      or if you do not understand them, check with your doctor in advance.
  - type: paragraph
    text: Take this medicine exactly as directed . Otherwise, the test you are going
      to have may not work and may have to be done again.
  - type: paragraph
    text: This medicine comes with a Medication Guide. You must read, understand,
      and follow these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: It is best if you do not eat any solid food before taking this medicine
      and until after your colonoscopy.
  - type: paragraph
    text: You may eat a light breakfast or drink clear liquids (eg, water, strained
      fruit juice without pulp, lemonade, plain coffee or tea, chicken broth, gelatin
      without fruit) on the day before your colonoscopy.
  - type: paragraph
    text: You may drink clear liquids (eg, water, apple juice, broth, tea, jello),
      before, during, and up until 2 hours before the time of your colonoscopy. Do
      not drink anything colored red or purple. Do not drink milk or alcohol .
  - type: paragraph
    text: 'To use the ColPrep Kit®:'
  - type: list
    ordered: false
    items:
    - The ColPrep Kit® contains 2 bottles of ColPrep®, taken as a 2-day regimen (Split-dose
      method).
    - The powder must be mixed with water before it is used. Open 1 bottle of ColPrep
      Kit® and add water up to the neck of the bottle.
    - Replace cap and shake well and mix thoroughly.
    - Pour the mixed solution into the mixing container provided.
    - Fill the mixing container with water to up the red 16 ounce fill line.
    - Drink all of the liquid in the mixing container.
    - Drink 2 more mixing containers filled up to the 16 ounce fill line with water
      over the next hour (32 ounces of additional water).
    - Then, on the morning before the colonoscopy, repeat the same steps and complete
      all ColPrep Kit® solution and required amount of water at least 2 hours before
      the test.
    - Do not eat or drink anything 2 hours prior to your colonoscopy, unless your
      doctor provides you with different instructions.
  - type: paragraph
    text: 'To use the Suprep Bowel Prep Kit®:'
  - type: list
    ordered: false
    items:
    - The Suprep Bowel Prep Kit® contains 2 bottles of this medicine, taken as a 2-day
      regimen (Split-dose method).
    - On the evening before the colonoscopy, open 1 bottle of Suprep Bowel Prep Kit®
      and pour the contents into the mixing container provided.
    - Fill the mixing container with cool water up to the 16-ounce fill line for adults
      or 12-ounce fill line for children.
    - Drink all of the liquid in the mixing container.
    - Drink 2 more mixing containers filled up to the 16-ounce fill line for adults
      or 12-ounce fill line for children with water over the next hour (32 ounces
      for adults or 24 ounces for children of additional water).
    - Then, on the morning (10 to 12 hours after the evening dose) before the colonoscopy,
      repeat the same steps and complete all Suprep Bowel Prep Kit® solution and required
      amount of water at least 2 hours before the test.
  - type: paragraph
    text: Avoid taking other laxatives (eg, bisacodyl, sodium picosulfate) while you
      are taking this medicine. Do not take any medicine by mouth within 1 hour before
      taking this medicine .
  - type: paragraph
    text: If you are taking chlorpromazine (Thorazine®), digoxin (Lanoxin®), iron
      supplements, penicillamine (Cuprimine®, Depen®), or tetracycline or fluoroquinolone
      antibiotics, take these medicines at least 2 hours before or 6 hours after taking
      Suprep Bowel Prep Kit® .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For cleansing the colon: For oral dosage form (oral solution): Adults— Dose
        1: One bottle (6 ounces) taken early in the evening before colonoscopy, 10
        to 12 hours before the second dose. Dose 2: One bottle (6 ounces) taken in
        the morning of the test, at least 2 hours before the colonoscopy. Children
        12 years of age and older— Dose 1: One bottle (4.5 ounces) taken early in
        the evening before colonoscopy, 10 to 12 hours before the second dose. Dose
        2: One bottle (4.5 ounces) taken in the morning of the test, at least 2 hours
        before the colonoscopy. Children younger than 12 years of age—Use and dose
        must be determined by your doctor. For oral dosage form (powder for oral solution):
        Adults— Dose 1: One bottle taken early in the evening before colonoscopy,
        10 to 12 hours before the second dose. Dose 2: One bottle taken in the morning
        of the test, at least 3.5 hours before the colonoscopy. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (oral solution): Adults— Dose 1: One bottle (6 ounces)
        taken early in the evening before colonoscopy, 10 to 12 hours before the second
        dose. Dose 2: One bottle (6 ounces) taken in the morning of the test, at least
        2 hours before the colonoscopy. Children 12 years of age and older— Dose 1:
        One bottle (4.5 ounces) taken early in the evening before colonoscopy, 10
        to 12 hours before the second dose. Dose 2: One bottle (4.5 ounces) taken
        in the morning of the test, at least 2 hours before the colonoscopy. Children
