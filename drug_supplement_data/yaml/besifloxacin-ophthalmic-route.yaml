title: Besifloxacin (ophthalmic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Besivance
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Besifloxacin ophthalmic (eye) preparation is used to treat infections of
      the eye, such as bacterial conjunctivitis. Besifloxacin belongs to a group of
      medicines called fluoroquinolone antibiotics. It works by killing bacteria that
      cause conjunctivitis.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of besifloxacin in children. However,
        safety and efficacy have not been established in children younger than 1 year
        of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of besifloxacin in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your doctor will tell you how much of this medicine to use and how often.
      Do not use more medicine or use it more often than your doctor tells you to.
      This medicine is not for long-term use.
  - type: paragraph
    text: 'To use the eye drops:'
  - type: list
    ordered: false
    items:
    - First, wash your hands. Then turn the closed bottle upside down and shake it
      one time before putting the medicine in your eye. Remove the cap with the bottle
      still being held upside down.
    - Tilt your head back and, pressing your finger gently on the skin just beneath
      the lower eyelid, pull the lower eyelid away from the eye to make a space. Drop
      the medicine into this space. Let go of the eyelid and gently close the eye.
      Do not blink. Keep the eye closed for 1 or 2 minutes to allow the medicine to
      cover the eye.
    - If you think you did not get the drop of medicine into your eye properly, repeat
      the directions with another drop.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
  - type: paragraph
    text: To help clear up your eye infection completely, keep using this medicine
      for the full time of treatment, even if you feel better after the first few
      doses. Your infection may not clear up if you stop using the medicine too soon.
      Do not miss any doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic dosage form (eye drops): For bacterial conjunctivitis: Adults
        and children 1 year of age and older—Put one drop in the affected eye three
        times a day, with each dose at least four to twelve hours apart. Infants younger
        than 1 year of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For bacterial conjunctivitis: Adults and children 1 year of age and older—Put
        one drop in the affected eye three times a day, with each dose at least four
        to twelve hours apart. Infants younger than 1 year of age—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 1 year of age and older—Put one drop in the affected eye
        three times a day, with each dose at least four to twelve hours apart.
      - Infants younger than 1 year of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your eye infection does not improve, or if it becomes worse, check with
      your doctor.
  - type: paragraph
    text: Stop using this medicine and check with your doctor right away if you have
      a rash, itching, or red or swollen skin around the eye or eyelid. These may
      be symptoms of an allergic reaction.
  - type: paragraph
    text: Do not wear contact lenses while you are using this medicine to avoid further
      eye irritation.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - eye pain
      - itching of the eye
      - red, sore eyes
      - swelling of the eye or eyelid
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
