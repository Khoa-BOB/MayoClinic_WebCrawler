    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits , especially during the first few weeks that you take this
      medicine. Blood and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may interact with the dye used for an X-ray or CT scan. Your
      doctor should advise you to stop taking it before you have any medical exams
      or diagnostic tests that might cause less urine output than usual. You may be
      advised to start taking the medicine again 48 hours after the exams or tests
      if your kidney function is tested and found to be normal.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery or medical tests.
  - type: paragraph
    text: 'It is very important to carefully follow any instructions from your health
      care team about:'
  - type: list
    ordered: false
    items:
    - Alcohol—Drinking alcohol may cause severe low blood sugar. Discuss this with
      your health care team.
    - Other medicines—Do not take other medicines unless they have been discussed
      with your doctor. This especially includes nonprescription medicines such as
      aspirin, and medicines for appetite control, asthma, colds, cough, hay fever,
      or sinus problems.
    - Counseling—Other family members need to learn how to prevent side effects or
      help with side effects if they occur. Also, patients with diabetes may need
      special counseling about diabetes medicine dosing changes that might occur with
      lifestyle changes, such as changes in exercise or diet. Counseling on birth
      control and pregnancy may be needed because of the problems that can occur in
      pregnancy for patients with diabetes.
    - Travel—Keep a recent prescription and your medical history with you. Be prepared
      for an emergency as you would normally. Make allowances for changing time zones
      and keep your meal times as close as possible to your usual meal times.
    - In case of emergency—There may be a time when you need emergency help for a
      problem caused by your diabetes. You need to be prepared for these emergencies.
      It is a good idea to wear a medical identification (ID) bracelet or neck chain
      at all times. Also, carry an ID card in your wallet or purse that says that
      you have diabetes and a list of all of your medicines.
  - type: paragraph
    text: Under certain conditions, too much metformin can cause lactic acidosis.
      The symptoms of lactic acidosis are severe and quick to appear , and usually
      occur when other health problems not related to the medicine are present and
      are very severe, such as a heart attack or kidney failure. Symptoms of lactic
      acidosis include abdominal or stomach discomfort, decreased appetite, diarrhea,
      fast or shallow breathing, a general feeling of discomfort, severe muscle pain
      or cramping, and unusual sleepiness, tiredness, or weakness.
  - type: paragraph
    text: If symptoms of lactic acidosis occur, you should get immediate emergency
      medical help .
  - type: paragraph
    text: This medicine may cause some premenopausal women who do not have regular
      monthly periods to ovulate. This can increase the chance of pregnancy. If you
      are a woman of childbearing potential, you should discuss birth control options
      with your doctor.
  - type: paragraph
    text: This medicine may cause hypoglycemia (low blood sugar). This is more common
      when this medicine is taken together with certain medicines. Low blood sugar
      must be treated before it causes you to pass out (unconsciousness). People feel
      different symptoms of low blood sugar . It is important that you learn which
      symptoms you usually have so you can treat it quickly. Talk to your doctor about
      the best way to treat low blood sugar.
  - type: paragraph
    text: Hyperglycemia (high blood sugar) may occur if you do not take enough or
      skip a dose of your medicine, overeat or do not follow your meal plan, have
      a fever or infection, or do not exercise as much as usual. High blood sugar
      can be very serious and must be treated right away. It is important that you
      learn which symptoms you have in order to treat it quickly . Talk to your doctor
      about the best way to treat high blood sugar.
  - type: paragraph
    text: High blood sugar may occur if you do not exercise as much as usual, have
      a fever or infection, do not take enough or skip a dose of your diabetes medicine,
      or overeat or do not follow your meal plan.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach discomfort
      - cough or hoarseness
      - decreased appetite
      - diarrhea
      - fast or shallow breathing
      - fever or chills
      - general feeling of discomfort
      - lower back or side pain
      - muscle pain or cramping
      - painful or difficult urination
      - sleepiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blurred vision
      - chest discomfort
      - cold sweats
      - coma
      - confusion
      - cool, pale skin
      - depression
      - difficult or labored breathing
      - dizziness
      - fast, irregular, pounding, or racing heartbeat or pulse
      - feeling of warmth
      - headache
      - increased hunger
      - increased sweating
      - nausea
      - nervousness
      - nightmares
      - redness of the face, neck, arms, and occasionally, upper chest
      - seizures
      - shakiness
      - slurred speech
      - tightness in the chest
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Behavior change similar to being drunk
      - difficulty with concentrating
      - drowsiness
      - lack or loss of strength
      - restless sleep
      - unusual sleepiness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - bloated
      - excess air or gas in the stomach or intestines
      - full feeling
      - heartburn
      - indigestion
      - loss of appetite
      - metallic taste in the mouth
      - passing of gas
      - stomachache
      - stomach upset or pain
      - vomiting
      - weight loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal stools
      - bad, unusual, or unpleasant (after) taste
      - change in taste
      - difficulty with moving
      - discoloration of the fingernails or toenails
      - flu-like symptoms
      - joint pain
      - rash
      - sneezing
      - stuffy or runny nose
      - swollen joints
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
