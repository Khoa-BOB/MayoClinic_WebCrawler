- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Metformin is used to treat high blood sugar levels that are caused by a
      type of diabetes mellitus or sugar diabetes called type 2 diabetes. With this
      type of diabetes, insulin produced by the pancreas is not able to get sugar
      into the cells of the body where it can work properly. Using metformin alone,
      with a type of oral antidiabetic medicine called a sulfonylurea, or with insulin,
      will help to lower blood sugar when it is too high and help restore the way
      you use food to make energy.
  - type: paragraph
    text: Many people can control type 2 diabetes with diet and exercise. Following
      a specially planned diet and exercise will always be important when you have
      diabetes, even when you are taking medicines. To work properly, the amount of
      metformin you take must be balanced against the amount and type of food you
      eat and the amount of exercise you do. If you change your diet or exercise,
      you will want to test your blood sugar to find out if it is too low. Your doctor
      will teach you what to do if this happens.
  - type: paragraph
    text: Metformin does not help patients who have insulin-dependent or type 1 diabetes
      because they cannot produce insulin from their pancreas gland. Their blood glucose
      is best controlled by insulin injections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Tablet, Extended Release
    - Suspension, Extended Release
    - Solution
    - Tablet, Extended Release, 24 HR
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of metformin oral solution , extended-release
        oral suspension , and tablets in children 10 to 16 years of age. However,
        safety and efficacy of metformin extended-release tablets in the pediatric
        population have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of metformin have not been performed in the geriatric population, geriatric-specific
        problems are not expected to limit the usefulness of metformin in the elderly.
        However, elderly patients are more likely to have age-related kidney problems,
        which may require caution in patients receiving metformin. This medicine is
        not recommended in patients 80 years of age and older who have kidney problems.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abemaciclib
      - Abiraterone Acetate
