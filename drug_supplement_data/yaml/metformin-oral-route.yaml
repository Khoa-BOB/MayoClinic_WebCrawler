    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol, excessive use or
      - Underactive adrenal glands or
      - Underactive pituitary gland or
      - Undernourished condition or
      - Weakened physical condition or
      - Any other condition that causes low blood sugar—Patients with these conditions
        may be more likely to develop low blood sugar while taking metformin.
    - type: list
      ordered: false
      items:
      - Anemia (low levels of red blood cells) or
      - Vitamin B12 deficiency—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Congestive heart failure, acute or unstable or
      - Dehydration or
      - Heart attack, acute or
      - Hypoxemia (decreased oxygen in the blood) or
      - Kidney disease or
      - Liver disease or
      - Sepsis (blood poisoning) or
      - Shock (low blood pressure, blood circulation is poor)—A rare condition called
        lactic acidosis can occur. Talk with your doctor if you have concerns about
        this.
    - type: list
      ordered: false
      items:
      - Diabetic ketoacidosis (ketones in the blood) or
      - Kidney disease, severe or
      - Metabolic acidosis (extra acids in the blood) or
      - Type 1 diabetes—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Fever or
      - Infection or
      - Surgery or
      - Trauma—These conditions may cause temporary problems with blood sugar control
        and your doctor may want to treat you with insulin.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine usually comes with a patient information insert. Read the
      information carefully and make sure you understand it before taking this medicine.
      If you have any questions, ask your doctor.
  - type: paragraph
    text: Carefully follow the special meal plan your doctor gave you . This is a
      very important part of controlling your condition, and is necessary if the medicine
      is to work properly. Also, exercise regularly and test for sugar in your blood
      or urine as directed.
  - type: paragraph
    text: Metformin should be taken with meals to help reduce stomach or bowel side
      effects that may occur during the first few weeks of treatment.
  - type: paragraph
    text: Swallow the tablet or extended-release tablet whole with a full glass of
      water. Do not crush, break, or chew it.
  - type: paragraph
    text: While taking the extended-release tablet , part of the tablet may pass into
      your stool after your body has absorbed the medicine. This is normal and nothing
      to worry about.
  - type: paragraph
    text: Measure the oral liquid with a marked measuring spoon, oral syringe, or
      medicine cup. The average household teaspoon may not hold the right amount of
      liquid.
  - type: paragraph
    text: Use the supplied dosing cup to measure the mixed extended-release oral suspension
      . Ask your pharmacist for a dosing cup if you do not have one.
  - type: paragraph
    text: Use only the brand of this medicine that your doctor prescribed. Different
      brands may not work the same way.
  - type: paragraph
    text: You may notice improvement in your blood glucose control in 1 to 2 weeks,
      but the full effect of blood glucose control may take up to 2 to 3 months. Ask
      your doctor if you have any questions about this.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For type 2 diabetes: For oral dosage form (extended-release tablets): Adults—
        Metformin alone (Fortamet®): At first, 1000 milligrams (mg) once a day taken
        with the evening meal. Your doctor may increase your dose if needed until
        your blood sugar is controlled. However, the dose is usually not more than
        2500 mg per day. Metformin alone (Glucophage® XR): At first, 500 mg once daily
        with the evening meal. Your doctor may increase your dose if needed until
        your blood sugar is controlled. However, the dose is usually not more than
        2000 mg per day. Metformin alone (Glumetza®): At first, 500 mg once a day
        taken with the evening meal. Then, your doctor may increase your dose if needed
        until your blood sugar is controlled. However, the dose is usually not more
        than 2000 mg per day. Metformin with a sulfonylurea: Your doctor will determine
        the dose of each medicine. Metformin with insulin: At first, 500 mg once a
        day. Then, your doctor may increase your dose by 500 mg every week if needed
        until your blood sugar is controlled. However, the dose is usually not more
        than 2500 mg per day. Children—Use and dose must be determined by your doctor.
        For oral dosage form (extended-release suspension): Adults—At first, 5 milliliters
        (mL) once a day taken with the evening meal. Your doctor may increase your
        dose by 5 mL weekly if needed until your blood sugar is controlled. However,
        the dose is usually not more than 20 mL per day. Children 10 to 16 years of
        age—At first, 5 mL once a day taken with the evening meal. Your doctor may
        increase your dose by 5 mL weekly if needed until your blood sugar is controlled.
        However, the dose is usually not more than 20 mL per day. Children younger
        than 10 years of age—Use and dose must be determined by your doctor. For oral
        dosage form (solution): Adults— Metformin alone: At first, 5 milliliters (mL)
        two times a day, or 8.5 mL once a day with meals. Your doctor may increase
