    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your or your child's progress after
      treatment . This is to make sure that the infection is cleared up completely,
      and to allow your doctor to check for any unwanted effects. Blood tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: If your or your child's symptoms do not improve within a few days, or if
      they become worse, check with your doctor.
  - type: paragraph
    text: Do not take halofantrine (Halfan®) or ketoconazole (Nizoral®) with mefloquine
      or within 15 weeks after the last dose of this medicine. This may increase the
      risk for more serious problems.
  - type: paragraph
    text: Contact your doctor right away if you or your child have any changes to
      your heart rhythm. You might feel dizzy or faint, or you might have a fast,
      pounding, or uneven heartbeat. Make sure your doctor knows if you or anyone
      in your family has ever had a heart rhythm problem such as QT prolongation.
  - type: paragraph
    text: Tell your doctor right away if you or your child are feeling anxious, confused,
      depressed, restless, or having unusual thoughts or behavior after using mefloquine.
  - type: paragraph
    text: 'Check with your doctor right away if you have the following symptoms after
      taking this medicine: dizziness, feeling of constant movement of self or surroundings,
      seizures, or trouble sleeping. These symptoms may continue to occur for months
      or years after stopping treatment with mefloquine.'
  - type: paragraph
    text: Check with your doctor right away if you or your child have flu-like symptoms
      (such as chills, fever, headache, or muscle pains) again after treatment with
      this medicine.
  - type: paragraph
    text: Use birth control pills while you are taking this medicine and for 3 months
      after stopping it. If you think you have become pregnant while using this medicine,
      tell your doctor right away.
  - type: paragraph
    text: This medicine may cause serious allergic reactions. Call your doctor right
      away if you or your child have a rash, itching, hives, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are using this medicine.
  - type: paragraph
    text: Mefloquine may cause vision problems. It may also cause some people to become
      dizzy or lightheaded, lose your balance, or to have hallucinations (seeing,
      hearing, or feeling things that are not there). Make sure you know how you react
      to this medicine before you drive, use machines, or do anything else that could
      be dangerous if you are dizzy or are not alert or able to see well . This is
      especially important for people whose jobs require fine coordination. If these
      reactions are especially bothersome, check with your doctor.
  - type: paragraph
    text: Check with your doctor immediately if blurred vision, difficulty with reading,
      or any other change in vision occurs during or after treatment. Your doctor
      may want your eyes be checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: While you are being treated with mefloquine, do not have any immunizations
      (vaccinations) without your doctor's approval. Live virus vaccines should be
      completed 3 days before the first dose of this medicine.
  - type: paragraph
    text: 'Malaria is spread by the bites of certain kinds of infected female mosquitoes.
      If you are living in or will be traveling to an area where there is a chance
      of getting malaria, the following mosquito-control measures will help to prevent
      infection:'
  - type: list
    ordered: false
    items:
    - If possible, avoid going out between dusk and dawn because it is at these times
      that mosquitoes most commonly bite.
    - Wear long-sleeved shirts or blouses and long trousers to protect your arms and
      legs, especially from dusk through dawn when mosquitoes are out.
    - Apply insect repellant, preferably one containing DEET, to uncovered areas of
      the skin from dusk through dawn when mosquitoes are out.
    - If possible, sleep in a screened or air-conditioned room or under mosquito netting
      sprayed with insecticide to avoid being bitten by malaria-carrying mosquitoes.
    - Use mosquito coils or sprays to kill mosquitoes in living and sleeping quarters
      during evening and nighttime hours.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Aching joints and muscles
      - anxiety
      - blistering, loosening, peeling, or redness of the skin
      - chest pain or discomfort
      - chills
      - confusion
      - convulsions (seizures)
      - cough or hoarseness
      - dizziness
      - fainting
      - fever
      - hallucinations (seeing, hearing, or feeling things that are not there)
      - irregular, pounding, slow, or fast heartbeat or pulse
      - irritability
      - lightheadedness
      - lower back or side pain
      - mental depression
      - painful or difficult urination
      - pinpoint red spots on the skin
      - red or irritated eye
      - restlessness
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stiff neck
      - swelling of the ankles, feet, or lower legs
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred or loss of vision
      - continuing ringing or buzzing or other unexplained noise in the ears
      - disturbed color perception
      - double vision
      - feeling of constant movement of self or surroundings
      - halos around lights
      - hearing loss
      - hearing problems
      - loss of balance
      - loss of bladder control
      - muscle spasm or jerking of all extremities
      - night blindness
      - overbright appearance of lights
      - sensation of spinning
      - severe or continuing headache
      - sudden loss of consciousness
      - trouble sleeping
      - troubled breathing
      - tunnel vision
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - emotional problems
      - nausea
      - stomach pain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal dreams
      - loss of appetite
      - skin rash
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Loss of hair
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - flushing or redness of the skin
      - heartburn
      - indigestion
      - skin rash with a general disease
      - stomach discomfort, upset, or pain
      - swelling
      - unusually warm skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
