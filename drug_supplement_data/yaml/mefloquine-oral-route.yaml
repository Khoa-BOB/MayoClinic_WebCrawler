title: Mefloquine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Lariam
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Mefloquine is used to treat malaria. It is also used to prevent malaria
      infection in areas or regions where it is known that other medicines (eg, chloroquine)
      may not work.
  - type: paragraph
    text: Mefloquine belongs to a group of medicines known as antimalarials. It works
      by preventing or treating malaria, a red blood cell infection transmitted by
      the bite of a mosquito.
  - type: paragraph
    text: Malaria transmission occurs in large areas of Central and South America,
      Hispaniola, sub-Saharan Africa, the Indian subcontinent, Southeast Asia, the
      Middle East, and Oceania. Country-specific information on malaria can be obtained
      from the Centers for Disease Control and Prevention (CDC), or from the CDC's
      web site at http://www.cdc.gov/travel.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of mefloquine in children. However,
        safety and efficacy have not been established in children younger than 6 months
        of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of mefloquine in the elderly. However,
        elderly patients are more likely to have age-related heart problems, which
        may require caution in patients receiving mefloquine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Aurothioglucose
      - Bepridil
      - Cisapride
      - Dronedarone
      - Fluconazole
      - Isradipine
      - Levoketoconazole
      - Levomethadyl
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acecainide
      - Adagrasib
      - Ajmaline
      - Alfuzosin
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amoxapine
      - Anagrelide
      - Apomorphine
      - Aprindine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Azathioprine
      - Azimilide
      - Azithromycin
      - Bedaquiline
      - Bretylium
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Carbamazepine
      - Ceritinib
      - Chloral Hydrate
      - Chloroquine
      - Chlorpromazine
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
      - Crizotinib
      - Cyclobenzaprine
      - Dabrafenib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Lumefantrine
      - Rifampin
      - Valproic Acid
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood or bone marrow problems (eg, agranulocytosis, aplastic anemia) or
      - Bradycardia (slow heartbeat), severe or
      - Heart block, severe or
      - Heart disease, severe or
      - Heart rhythm problems (eg, arrhythmia, prolonged QT interval), history of—Use
        with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Depression, active or history of or
      - Generalized anxiety disorder, history of or
      - Psychosis (mental illness), history of or
      - Schizophrenia (mental illness), history of or
      - Seizures, history of—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Epilepsy—May increase risk of having convulsions.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Malaria, severe or life-threatening—Your doctor may want you to receive an
        antimalarial injection before taking this medicine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide and an information wallet card.
      Read and follow the instructions carefully. Talk with your doctor if you have
      any questions.
  - type: paragraph
    text: Mefloquine is best taken with a full glass (8 ounces) of water and with
      food, unless otherwise directed by your doctor.
  - type: paragraph
    text: Mefloquine may be crushed and put in water, milk, or juice to make it easier
      to take.
  - type: paragraph
    text: 'For patients taking mefloquine to prevent the symptoms of malaria:'
  - type: list
    ordered: false
    items:
    - Your doctor will want you to start taking this medicine one week before you
      travel to an area where there is a chance of getting malaria.
    - Also, you should keep taking this medicine while you are in the area where malaria
      is present and for 4 weeks after you leave the area. No medicine will protect
      you completely from malaria. However, to protect you as completely as possible,
      it is important that you keep taking this medicine for the full time your doctor
      ordered. Also, if fever or “flu-like” symptoms develop during your travels or
      within 2 to 3 months after you leave the area, check with your doctor immediately.
    - This medicine works best when you take it on a regular schedule. For example,
      if you are to take it once a week, it is best to take it on the same day each
      week. Do not miss any doses. If you have any questions about this, check with
      your doctor.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you feel
      better after the first few doses. Your infection may not clear up if you stop
      using the medicine too soon.
  - type: paragraph
    text: Children may vomit after taking this medicine. Your child may vomit some
      of the dose of medicine. Contact your child's doctor if vomiting occurs. The
      doctor may need for you to give your child more medicine.
  - type: paragraph
    text: The number of doses you take each day, the time allowed between doses, and
      the length of time you take the medicine depend on whether you are using mefloquine
      to prevent or to treat malaria.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of malaria: Adults—1250 milligrams
        (mg) or five tablets as a single dose. Children 6 months of age and older—Dose
        is based on body weight and must be determined by your doctor. The usual dose
        is 20 to 25 mg per kg of body weight as a single dose or two doses (divide
        the single dose by two) taken 6 to 8 hours apart. Taking two doses may decrease
        the occurrence of unwanted side effects. Children younger than 6 months of
        age—Use and dose must be determined by your doctor. For prevention of malaria:
        Adults and children weighing over 45 kilograms (kg)—250 milligrams (mg) (1
        tablet) 1 week before traveling to an area where malaria occurs. Then, 250
        mg once a week on the same day of each week and preferably after your main
        meal while staying in the area and every week for 4 weeks after leaving the
        area. Children 6 months of age and older—Dose is based on body weight and
        must be determined by your doctor. Children weighing 30 to 45 kg: 187.5 mg
        (¾ tablet) 1 week before traveling to an area where malaria occurs. Then,
        187.5 mg once a week while staying in the area and every week for 4 weeks
        after leaving the area. Children weighing 20 to 30 kg: 125 mg (½ tablet) 1
        week before traveling to an area where malaria occurs. Then, 125 mg once a
        week while staying in the area and every week for 4 weeks after leaving the
        area. Children weighing 10 to 19 kg: 62.5 mg (¼ tablet) 1 week before traveling
        to an area where malaria occurs. Then, 62.5 mg once a week while staying in
        the area where malaria occurs and every week for 4 weeks after leaving the
        area. Children weighing 5 to 9 kg: 5 mg per kg of body weight 1 week before
        traveling to an area where malaria occurs. Children younger than 6 months
        of age and weighing less than 5 kg—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of malaria: Adults—1250 milligrams (mg) or five tablets as
        a single dose. Children 6 months of age and older—Dose is based on body weight
