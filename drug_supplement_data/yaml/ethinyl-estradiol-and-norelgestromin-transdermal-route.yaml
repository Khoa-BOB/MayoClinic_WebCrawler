title: Ethinyl estradiol and norelgestromin (transdermal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ortho Evra
    - type: paragraph
      text: Xulane
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Norelgestromin and ethinyl estradiol combination contraceptive skin patch
      is used to prevent pregnancy. Hormones from the patch are absorbed through your
      skin into your body. It works by stopping a woman's egg from fully developing
      each month. The egg can no longer accept a sperm and fertilization (pregnancy)
      is prevented.
  - type: paragraph
    text: This patch allows more estrogen into the blood than oral birth control containing
      the same amount of estrogen.
  - type: paragraph
    text: No contraceptive method is 100 percent effective. Birth control methods
      such as having surgery to become sterile or not having sex are more effective.
      Discuss with your doctor your options for birth control.
  - type: paragraph
    text: Norelgestromin and ethinyl Estradiol combination does not prevent AIDS or
      other sexually transmitted diseases. It will not prevent hepatitis B. It will
      not help as emergency contraception, such as after unprotected sexual contact.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Patch, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of norelgestromin
        and ethinyl estradiol combination transdermal have not been performed in the
        pediatric population. However, pediatric-specific problems that would limit
        the usefulness of this medication in teenagers are not expected. This medicine
        may be used for birth control in teenage females but should not be used before
        the start of menstruation.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of norelgestromin
        and ethinyl estradiol combination transdermal have not been performed in the
        geriatric population. This medicine is not indicated for use in elderly women.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Dasabuvir
      - Fezolinetant
      - Ombitasvir
      - Paritaprevir
      - Ritonavir
      - Tranexamic Acid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alclometasone
      - Aldosterone
      - Amcinonide
      - Amifampridine
      - Amobarbital
      - Amoxicillin
      - Ampicillin
      - Amprenavir
      - Anagrelide
      - Apalutamide
      - Aprepitant
      - Armodafinil
      - Artemether
      - Avapritinib
      - Bacampicillin
      - Beclomethasone
      - Belzutifan
      - Betamethasone
      - Bexarotene
      - Boceprevir
      - Bosentan
      - Budesonide
      - Bupropion
      - Butabarbital
      - Butalbital
      - Carbamazepine
      - Carbenicillin
      - Cefaclor
      - Cefadroxil
      - Cefdinir
      - Cefditoren
      - Cefixime
      - Cefpodoxime
      - Cefprozil
      - Ceftazidime
      - Ceftibuten
      - Cefuroxime
      - Cenobamate
      - Ceritinib
      - Chlortetracycline
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Amitriptyline
      - Atazanavir
      - Atorvastatin
      - Diazepam
      - Doxepin
      - Etoricoxib
      - Ginseng
      - Imipramine
      - Lamotrigine
      - Leflunomide
      - Levothyroxine
      - Licorice
      - Liothyronine
      - Lorazepam
      - Parecoxib
      - Roflumilast
      - Selegiline
      - Temazepam
      - Teriflunomide
      - Tipranavir
      - Triazolam
      - Valdecoxib
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Abnormal or unusual vaginal bleeding or
      - Blood clots (eg, deep vein thrombosis, pulmonary embolism), or history of
        or
      - Breast cancer, or history of or
      - Cervical cancer, or history of or
      - Diabetes with kidney, eye, nerve, or blood vessel damage or
      - Heart attack, history of or
      - Heart or blood vessel disease (eg, coronary artery disease, heart valve problems),
        now or in the past or
      - Hypertension (high blood pressure), uncontrolled or
      - Liver disease, including tumors or cancer or
      - Major surgery with a long period of inactivity or
      - Migraine headache or
      - Stroke, history of or
      - Tumors (estrogen-dependent), known or suspected—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Depression, history of or
      - Dyslipidemia (high cholesterol or fats in the blood) or
      - Edema (fluid retention or body swelling) or
      - Gallbladder disease or
      - Hypertension (high blood pressure)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Obesity—Use of the transdermal patch may be less effective in women with body
        weight greater than or equal to 198 pounds (90 kilograms).
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: To make using hormonal contraceptives as safe and reliable as possible,
      you should understand how and when to use them and what effects may be expected.
  - type: paragraph
    text: This medicine comes with patient instructions. Read and follow these instructions
      carefully. Ask your doctor if you have questions.
  - type: paragraph
    text: This transdermal patch system is to be used for 28 days (four-week) cycle.
      A new patch is applied each week for 3 weeks (21 days), and week four is patch-free.
  - type: paragraph
    text: When you begin using norelgestromin and ethinyl estradiol combination transdermal,
      your body will require at least 7 days to adjust before a pregnancy will be
      prevented. Use a second form of contraception (eg, condoms, spermicides, diaphragms)
      for the first 7 days of your first patch cycle.
  - type: paragraph
    text: 'To use this patch :'
  - type: list
    ordered: false
    items:
    - Keep each patch in the package until you are ready to use it.
    - Wash your hands with soap and water before and after applying a patch.
    - Apply the patch to clean, dry, and intact skin on the abdomen or stomach, upper
      body, the upper outside part of the arm, or the buttocks. Avoid touching the
      sticky surface of the patch.
    - Make sure there is no lotion, powder, cream, or make-up on the skin.
    - Apply the patch and then press it with the palm of your hand for 10 seconds
      to make sure it sticks.
    - Change the location of the patch each time you apply a new one. Do not apply
      a patch to skin that is injured, broken, or cut. Do not apply a patch to your
      breasts. Check the patch every day to make sure it is in place.
  - type: paragraph
    text: If the patch comes off partly or all the way, try to apply it again or apply
      a new patch. If it becomes loose less than 24 hours , no other form of birth
      control is needed. If the patch has peeled away for more than 24 hours , apply
      a new patch and start a new cycle. A second form of birth control should also
      be used.
  - type: paragraph
    text: If the patch is not sticky or has stuck to material or itself, remove it
      and apply a new patch. Do not hold the patch in place with tape or wraps.
  - type: paragraph
    text: If you are switching from a contraceptive pill or vaginal ring to using
      the patch , start the patch on the first day of your period on the day that
      you would usually use your next pill or vaginal ring for Xulane® . If your period
      does not start after 1 week for Xulane® , you should see your doctor for a pregnancy
      test. If you apply Xulane® more than 1 week after using your last pill or vaginal
      ring , use a second method of birth control with the patch for the first 7 days.
  - type: paragraph
    text: If you have a miscarriage or an abortion in the first trimester of your
      pregnancy , you may start norelgestromin and ethinyl estradiol combination transdermal
      right away. You do not need a second form of birth control. If you start this
      medicine 5 days or more after the miscarriage or abortion, you should use a
      second form of birth control with the patch for the first 24 hours during the
      start of your menstrual period or for the first 7 days on the first Sunday of
      your menstruation. If you have a miscarriage or abortion after the first trimester,
      you should wait for 4 weeks before starting this medicine.
  - type: paragraph
    text: If you use this patch after giving birth and choose not to breastfeed ,
      you may start after 4 weeks to prevent the risk of having blood clots.
  - type: paragraph
    text: If you have bleeding with the patch in place, continue to use the patches
      as usual. If the bleeding continues for 2–3 cycles, call your doctor. If you
      do not have your period during the time the patch is off, stay on your regular
      schedule and call your doctor.
  - type: paragraph
    text: If the patch is uncomfortable or causes irritation, change to a new patch
      in a new location. Change the patch again on your regular schedule. Do not use
      more than one patch at a time.
  - type: paragraph
    text: When you remove a patch, carefully fold it in half so that it sticks to
      itself and throw it away. There will still be some hormones on the patch. Do
      not touch the inside of the patch.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine. Grapefruit and grapefruit juice may change the amount of this medicine
      that is absorbed in the body.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: paragraph
      text: Your doctor may begin your patch on the first day of your menstrual period
        (called Day-1 start) or on a Sunday (called Sunday start). When you begin
        on a certain day it is important that you follow that schedule, even if you
        forget to change a patch. Do not change your schedule on your own. If the
        schedule that you have been put on is not convenient, talk to your doctor
        about changing schedules.
    - type: list
      ordered: false
      items:
      - 'For transdermal dosage form (skin patch): For contraception (to prevent pregnancy):
        Adults—Apply one patch to the skin and keep it in place for 1 week. Apply
        a new patch at the beginning of week 2 and again at week 3. Always change
        the patch on the same day of the week. Do not use a patch during week 4. This
        is when you will have your period. Start a new patch 7 days after the last
        patch was removed. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For contraception (to prevent pregnancy): Adults—Apply one patch to the skin
        and keep it in place for 1 week. Apply a new patch at the beginning of week
        2 and again at week 3. Always change the patch on the same day of the week.
        Do not use a patch during week 4. This is when you will have your period.
        Start a new patch 7 days after the last patch was removed. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply one patch to the skin and keep it in place for 1 week. Apply
        a new patch at the beginning of week 2 and again at week 3. Always change
        the patch on the same day of the week. Do not use a patch during week 4. This
        is when you will have your period. Start a new patch 7 days after the last
        patch was removed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    - type: paragraph
      text: Follow your doctor's orders or the directions on the label if you forget
        to change your patch. This includes only some of the ways to handle this medicine.
        Your doctor may want you to stop using this medicine and use other birth control
        methods for the rest of the month until you have your menstrual period. Then
        your doctor can tell you how to begin using your medicine again.
    - type: paragraph
      text: If you forget to apply your patch during the 1st week , apply it as soon
        as possible and start a new cycle. Use a second form of birth control for
        the first week of the new cycle. You will now have a new patch start day.
    - type: paragraph
      text: If you forget to change your patch in the 2nd or 3rd week for one or two
        days , change it as soon as you remember. No other form of birth control is
        needed. If you forget to change your patch in the 2nd or 3rd week for more
        than two days , change to a new patch and start a new cycle. Use a second
        form of birth control for the first week of the new cycle. If you forget to
        remove your patch at the end of the 3rd week , remove it as soon as possible
        and then start a new patch on your regular start day. You should never have
        the patch off for more than 7 days in a row.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the patches at room temperature in a closed container, away from
        heat, moisture, and direct light.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: After removing a used patch, fold the patch in half with the sticky sides
        together. Place it in a child-resistant container or a sealed bag. Make sure
        to dispose of it out of the reach of children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and does not cause unwanted effects.
      These visits will usually be every 6 to 12 months, but some doctors require
      them more often. Your doctor may also want to check your blood pressure while
      using this medicine.
  - type: paragraph
    text: Although you are using this medicine to prevent pregnancy, you should know
      that using this medicine while you are pregnant could harm your unborn baby.
      If you think you have become pregnant while using the medicine, tell your doctor
      right away. Make sure your doctor knows if you have had a baby within 4 weeks
      before you start using this medicine.
  - type: paragraph
    text: Tell the medical doctor or dentist in charge that you are using this medicine
      before any kind of surgery (including dental surgery) or emergency treatment.
      Your doctor will decide whether you should continue using this medicine.
  - type: paragraph
    text: Norelgestromin and ethinyl estradiol transdermal may not work as well for
      you if you weigh more than 198 pounds (98 kilograms). Talk to your doctor about
      the kind of birth control that is best for you.
  - type: paragraph
    text: 'Vaginal bleeding of various amounts may occur between your regular menstrual
      periods during the first 3 months of use. This is sometimes called spotting
      when light, or breakthrough bleeding when heavier. If this should occur:'
  - type: list
    ordered: false
    items:
    - If this should occur, continue with your regular dosing schedule.
    - The bleeding usually stops within 1 week. Check with your doctor if the bleeding
      continues for more than 1 week.
    - If the bleeding continues after you have been using hormonal contraceptives
      on schedule and for more than 3 months, check with your doctor.
  - type: paragraph
    text: Do not use this medicine together with medicine to treat hepatitis C virus
      infection, including ombitasvir/paritaprevir/ritonavir, with or without dasabuvir
      (Technivie®, Viekira Pak®).
  - type: paragraph
    text: This medicine will not protect you from getting HIV/AIDS, herpes, or other
      sexually transmitted diseases. Tell your doctor if you or your partner begin
      to have sexual intercourse with other people, or you or your partner tests positive
      for a sexually transmitted disease. If this is a concern for you, talk with
      your doctor.
  - type: paragraph
    text: Check with your doctor if you miss a menstrual period so that the cause
      may be determined. Missed periods may occur if you have not used the patch exactly
      as scheduled or the medicine is not the right strength or type for your needs.
      You might need a pregnancy test.
  - type: paragraph
    text: If you suspect that you may have become pregnant, stop using this medicine
      immediately and check with your doctor .
  - type: paragraph
    text: Do not use this medicine if you smoke cigarettes or if you are over 35 years
      of age . If you smoke while using this birth control, you increase your risk
      of having a blood clot, heart attack, or stroke. Your risk is even higher if
      you are over age 35, if you have diabetes, high blood pressure, high cholesterol,
      or if you are overweight. Talk with your doctor about ways to stop smoking.
      Keep your diabetes under control. Ask your doctor about the type of diet and
      exercise to control your weight and blood cholesterol level.
  - type: paragraph
    text: You will be exposed to more estrogen if you use this medicine than if you
      use a typical birth control pill. Increased estrogen exposure may increase the
      risk of side effects. Talk to your doctor about this risk.
  - type: paragraph
    text: Using this medicine may increase your risk of having blood clotting problems.
      Check with your doctor right away if you have pain in the chest, groin, or legs,
      especially the calves, difficulty with breathing, a sudden, severe headache,
      slurred speech, a sudden, unexplained shortness of breath, a sudden unexplained
      shortness of breath, a sudden loss of coordination, or vision changes while
      using this medicine.
  - type: paragraph
    text: Check with your doctor immediately if you wear contact lenses or if blurred
      vision, difficulty with reading, or any other change in vision occurs during
      or after treatment . Your doctor may want you to have your eyes checked by an
      ophthalmologist (eye doctor).
  - type: paragraph
    text: Using this medicine may increase your risk of breast cancer or cervical
      cancer. Talk with your doctor about this risk. Check with your doctor immediately
      if you experience abnormal vaginal bleeding.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, dark urine or pale stools, or yellow eyes or skin. These could
      be symptoms of a serious liver problem.
  - type: paragraph
    text: Using this medicine may increase your risk for gallbladder disease. Talk
      with your doctor about this risk.
  - type: paragraph
    text: Check with your doctor before refilling an old prescription, especially
      after a pregnancy. You will need another physical examination and your doctor
      may change your prescription.
  - type: paragraph
    text: Use with caution around small children. The contraceptive patch may be a
      choking hazard if swallowed by a child.
  - type: paragraph
    text: Make sure any doctor who treats you knows that you are using this medicine.
      This medicine may affect the results of certain medical tests. You may also
      need to stop using this medicine at least 4 weeks before and 2 weeks after having
      major surgery.
  - type: paragraph
    text: This medicine may make your skin more sensitive to sunlight. Use a sunscreen
      when you are outdoors. Avoid sunlamps and tanning beds.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - chills
      - cough
      - difficulty with breathing
      - ear congestion
      - fever
      - headache
      - loss of voice
      - nasal congestion
      - runny nose
      - sneezing
      - sore throat
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - changes in skin color
      - chest pain or discomfort
      - confusion
      - dark urine
      - diarrhea
      - dizziness
      - eye pain
      - fainting
      - inability to speak
      - itching
      - lack or loss of appetite
      - light-colored stools
      - lightheadedness
      - nausea
      - numbness in the hands
      - pain in the stomach
      - pain in the chest, groin, or legs, especially the calves
      - pain or discomfort in the arms, jaw, back, or neck
      - pain, tenderness, or swelling of the foot or leg
      - pounding in the ears
      - rash
      - seizures
      - slow or fast heartbeat
      - slurred speech
      - sudden headache
      - sudden loss of coordination
      - sudden, severe weakness or numbness in the arm or leg on one side of the body
      - sweating
      - swelling, pain, or tenderness in the upper abdominal or stomach area
      - temporary blindness
      - unpleasant breath odor
      - vision changes
      - vomiting of blood
      - yellow eyes or skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Unusual vaginal bleeding in women
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, itching, or redness of the skin
      - menstrual cramps
      - pain, soreness, swelling, or discharge from the breast or breasts
      - swelling or soreness at the patch site
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Absent, missed, or irregular menstrual periods
      - bloody vaginal discharge
      - brown, blotchy spots on exposed skin
      - change in amount of vaginal discharge
      - change in menstrual flow
      - decreased amount of breast milk
      - discouragement
      - dry mouth
      - feeling sad or empty
      - increase or decrease in weight
      - increased hunger or thirst
      - increased urination
      - irritability
      - itching of the vagina or outside of the genitals
      - light vaginal bleeding between periods and after sexual intercourse
      - loss of interest or pleasure
      - pain during sexual intercourse
      - stomach cramps or bloating
      - stopping of menstrual bleeding
      - swelling
      - thick, white curd-like vaginal discharge without odor or with mild odor
      - trouble concentrating
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
