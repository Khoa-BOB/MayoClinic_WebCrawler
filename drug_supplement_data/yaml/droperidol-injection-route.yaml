title: Droperidol (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Inapsine
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Droperidol injection is used to prevent the nausea and vomiting that may
      occur after surgery or diagnostic procedures.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of droperidol injection in children younger than 2 years of
        age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of droperidol injection in geriatric patients. However, elderly patients are
        more likely to have age-related heart or kidney problems, which may require
        caution and an adjustment in the dose for patients receiving droperidol injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Acetophenazine
      - Bepridil
      - Bromperidol
      - Cisapride
      - Clozapine
      - Dronedarone
      - Isocarboxazid
      - Levoketoconazole
      - Levomethadyl
      - Mesoridazine
      - Molindone
      - Perphenazine
      - Pimozide
      - Pipamperone
      - Piperaquine
      - Remoxipride
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Tiapride
      - Triflupromazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acecainide
      - Acetazolamide
      - Adagrasib
      - Ajmaline
      - Alfentanil
      - Alfuzosin
      - Alprazolam
      - Amiloride
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amlodipine
      - Amoxapine
      - Anagrelide
      - Apomorphine
      - Aprindine
      - Aranidipine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Artemether
      - Asenapine
      - Astemizole
      - Atazanavir
      - Azimilide
      - Azithromycin
      - Azosemide
      - Bedaquiline
      - Bemetizide
      - Bendroflumethiazide
      - Benzhydrocodone
      - Benzthiazide
      - Bretylium
      - Bromazepam
      - Bumetanide
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Butalbital
      - Butorphanol
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Tizanidine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bradycardia (slow heartbeat) or
      - Cardiac hypertrophy (heart is larger than normal) or
      - Congestive heart failure or
      - Heart disease or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood) or
      - Pheochromocytoma (adrenal gland tumor)—May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Cardiac arrhythmias (abnormal heart beats) or
      - Hypotension (low blood pressure)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Congenital long QT syndrome (heart rhythm problem) or
      - QT prolongation (heart rhythm problem)—Should not be used in patients with
        these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. This medicine is given as a shot into a muscle or a vein.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your progress after you receive this medicine . This
      will allow your doctor to see if the medicine is working properly and to check
      for unwanted effects.
  - type: paragraph
    text: Tell your doctor right away if you have any change in your heart rhythm.
      The symptoms may include feeling dizzy or faint, or having a fast, pounding,
      or uneven heartbeat. Make sure your doctor knows if you or anyone in your family
      has ever had a heart rhythm problem such as QT prolongation.
  - type: paragraph
    text: Check with your doctor right away if you have difficulty breathing, a fast
      heartbeat, a high fever, a change in blood pressure, increased sweating, loss
      of bladder control, severe muscle stiffness, unusually pale skin, or tiredness.
      These could be symptoms of a serious condition called neuroleptic malignant
      syndrome (NMS).
  - type: paragraph
    text: Droperidol will add to the effects of alcohol and other central nervous
      system (CNS) depressants (medicines that make you drowsy or less alert). Some
      examples of CNS depressants are antihistamines or medicine for hay fever, allergies,
      or colds; sedatives, tranquilizers, or sleeping medicine; prescription pain
      medicine or narcotics; barbiturates or other seizure medicines; and muscle relaxants.
      Check with your doctor before taking any of these medicines after you receive
      droperidol.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - sweating
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - cough
      - difficulty with breathing
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - noisy breathing
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - skin rash, hives, or itching
      - tightness in the chest
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or discomfort
      - fainting
      - fast, pounding, or irregular heartbeat or pulse
      - irregular or slow heart rate
      - low blood pressure or pulse
      - severe confusion or loss of consciousness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - drowsiness
      - restlessness
      - trouble sitting still
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with speaking
      - drooling
      - loss of balance control
      - muscle trembling, jerking, or stiffness
      - seeing, hearing, or feeling things that are not there
      - shuffling walk
      - stiffness of the limbs
      - twisting movements of the body
      - uncontrolled movements, especially of the face, neck, and back
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
