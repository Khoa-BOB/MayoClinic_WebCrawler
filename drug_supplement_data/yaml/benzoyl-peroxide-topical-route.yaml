- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Benzoyl peroxide topical is used to treat acne and may be used for other
      skin conditions as determined by your doctor. Epsolay® topical cream is used
      to treat inflammatory lesions (pimples and red bumps) caused by rosacea.
  - type: paragraph
    text: Epsolay® topical cream is available only with your doctor's prescription.
      Some of the skin products are available without prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Soap
    - Gel/Jelly
    - Liquid
    - Foam
    - Cream
    - Pad
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Epsolay® topical cream in the pediatric population. Safety
        and efficacy have not been established.
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of benzoyl peroxide topical have not been performed in children 12 years of
        age and older, no pediatric-specific problems have been documented to date.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Epsolay® topical cream in the
        elderly.
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of benzoyl peroxide topical have not been performed in the geriatric population,
        no geriatric-specific problems have been documented to date.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Dermatitis, seborrheic or
      - Eczema (skin problem) or
      - Sunburn—May cause skin irritation in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine only as directed . Do not
      use more of it, do not use it more often, and do not use it for a longer time
      than your doctor ordered. To do so may cause your skin to be irritated. You
      may need to use this medicine for several weeks or months before your skin starts
      to look better. Applying extra medicine will not make it work faster.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: This medicine is for use on the skin only . Do not get it in your eyes,
      nose, lips, mouth, or vagina. Do not use on skin areas that have cuts, scrapes,
      or sunburn. If it does get on these areas, rinse it off right away.
  - type: paragraph
    text: Before using an OTC acne product for the first time, apply a small amount
      to one or two small affected areas of the skin for 3 days. If no discomfort
      occurs, follow the directions on the drug facts label of the product.
  - type: paragraph
    text: Wash your hands with soap and water before and after you use this medicine.
  - type: paragraph
    text: 'To use the cream :'
  - type: list
    ordered: false
    items:
    - Make sure your skin is clean and dry before you apply this medicine.
    - Apply a thin layer to the affected areas, and gently rub it in.
    - When you first begin to use this product, prime the pump by pressing down until
      the first drop of cream is released.
  - type: paragraph
    text: 'To use the gel, lotion, or stick :'
  - type: list
    ordered: false
    items:
    - Before applying, wash the affected area with a nonmedicated soap and water or
      with a mild cleanser and then gently pat dry with a towel.
    - Apply enough medicine to cover the affected areas, and rub in gently.
  - type: paragraph
    text: 'To use the shave cream :'
  - type: list
    ordered: false
    items:
    - Wet the area to be shaved.
    - Apply a small amount of the shave cream and gently rub over entire area.
    - Shave. Rinse the area and pat dry.
    - After-shave lotions or other drying face products should not be used without
      checking with your doctor first.
  - type: paragraph
    text: 'To use the cleansing bar, cleansing lotion, or soap :'
  - type: list
    ordered: false
    items:
    - Use to wash the affected areas as directed.
  - type: paragraph
    text: 'To use the facial mask :'
  - type: list
    ordered: false
    items:
    - Before applying, wash the affected area with a nonmedicated cleanser. Then rinse
      and pat dry.
    - Using a circular motion, apply a thin layer of the mask evenly over the affected
      area.
    - Allow the mask to dry for 15 to 25 minutes.
    - Then rinse thoroughly with warm water and pat dry.
  - type: paragraph
    text: You should not wash the areas of the skin treated with benzoyl peroxide
      for at least 1 hour after application.
  - type: paragraph
    text: Avoid getting this medicine in your hair or on colored fabrics. It may bleach
      your hair or colored fabrics.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For acne: For topical dosage form (cleansing bar): Adults and children 12
        years of age and over—Use 2 or 3 times a day, or as directed by your doctor.
        Children younger than 12 years of age—Use and dose must be determined by your
        doctor. For topical dosage forms (cleansing lotion, cream, or gel): Adults
        and children 12 years of age and over—Use on the affected area(s) of the skin
        1 or 2 times a day. Children younger than 12 years of age—Use and dose must
        be determined by your doctor. For topical dosage form (facial mask): Adults
        and children 12 years of age and over—Use once a week or as directed by your
        doctor. Children younger than 12 years of age—Use and dose must be determined
        by your doctor. For topical dosage form (lotion): Adults and children 12 years
        of age and over—Use on the affected area(s) of the skin 1 to 4 times a day.
        Children younger than 12 years of age—Use and dose must be determined by your
        doctor. For topical dosage form (stick): Adults and children 12 years of age
        and over—Use on the affected area(s) of the skin 1 to 3 times a day. Children
        younger than 12 years of age—Use and dose must be determined by your doctor.'
      - 'For inflammatory lesions caused by rosacea: For topical dosage form (cream):
        Adults—Apply to the affected area of the skin once a day. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (cleansing bar): Adults and children 12 years of
        age and over—Use 2 or 3 times a day, or as directed by your doctor. Children
        younger than 12 years of age—Use and dose must be determined by your doctor.'
      - 'For topical dosage forms (cleansing lotion, cream, or gel): Adults and children
        12 years of age and over—Use on the affected area(s) of the skin 1 or 2 times
