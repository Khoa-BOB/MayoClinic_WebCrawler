    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away any unused Epsolay® topical cream 30 days after first use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to see if the medicine is working properly and to check for any unwanted effects.
  - type: paragraph
    text: 'For patients using the Epsolay® topical cream:'
  - type: list
    ordered: false
    items:
    - This medicine may cause serious allergic reactions, including anaphylaxis and
      angioedema, which can be life-threatening and require immediate medical attention.
      Check with your doctor right away if you have chest tightness, cough, difficulty
      swallowing, dizziness, fast heartbeat, hives, itching, or skin rash, large,
      hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs, feet,
      or sex organs, trouble breathing, or unusual tiredness or weakness.
    - Serious skin reactions (eg, skin irritation, contact dermatitis) including pain,
      irritation, itching, burning, redness, peeling, dryness, scaling, or stinging
      of the skin can occur during treatment with this medicine. Your doctor may tell
      you to use a moisturizer to treat skin irritation.
    - This medicine may make your skin more sensitive to sunlight. Use a sunscreen
      and wear loose-fitting clothes when you are outdoors. Avoid sunlamps and tanning
      beds.
  - type: paragraph
    text: During the first 3 weeks you are using benzoyl peroxide, your skin may become
      irritated. Also, your acne may seem to get worse before it gets better. If your
      skin problem has not improved within 4 to 6 weeks, check with your doctor.
  - type: paragraph
    text: Certain over-the-counter (OTC) acne products may cause rare and life-threatening
      allergic reactions. Check with your doctor right away if you have hives, itching,
      trouble breathing, swelling of the eyes, face, lips, or tongue, tightness in
      the throat, or feeling faint while using these acne products.
  - type: paragraph
    text: Do not use an OTC acne product again if you have developed a serious allergic
      reaction from it.
  - type: paragraph
    text: Avoid using any other topical medicine on the same area within 1 hour before
      or after using benzoyl peroxide. Otherwise, benzoyl peroxide may not work properly.
  - type: paragraph
    text: 'Unless your doctor tells you otherwise, it is especially important to avoid
      using the following skin products on the same area as benzoyl peroxide:'
  - type: list
    ordered: false
    items:
    - Any other topical acne product or skin product containing a peeling agent (eg,
      resorcinol, salicylic acid, sulfur, or tretinoin);
    - Hair products that are irritating, such as permanents or hair removal products;
    - Skin products that cause sensitivity to the sun, such as those containing lime
      or spices;
    - Skin products containing a large amount of alcohol, such as astringents, shaving
      creams, or after-shave lotions; or
    - Skin products that are too drying or abrasive, such as some cosmetics, soaps,
      or skin cleansers.
  - type: paragraph
    text: Using these products along with benzoyl peroxide may cause mild to severe
      irritation of the skin. Although skin irritation can occur, some doctors sometimes
      allow benzoyl peroxide to be used with tretinoin to treat acne. Usually tretinoin
      is applied at night so that it doesn't cause a problem with any other topical
      products that you might use during the day. Check with your doctor before using
      any other topical medicines with benzoyl peroxide.
  - type: paragraph
    text: Check with your doctor at any time your skin becomes too dry or irritated.
      Your doctor can help you choose the right skin products for you to reduce skin
      dryness and irritation.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain, burning, blistering, changes in color, dryness, itching, peeling, redness,
        scaling, stinging, or swelling of the skin where the medicine is applied
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - cough
      - difficulty swallowing
      - dizziness
      - fainting
      - fast heartbeat
      - hives, itching, or skin rash
      - increased sensitivity of the skin to sunlight
      - large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
        feet, or sex organs
      - redness or other discoloration of the skin
      - severe sunburn
      - swelling of the eyes, face, lips, or tongue
      - tightness in the throat
      - trouble breathing
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dryness or peeling of the skin (may occur after a few days)
      - feeling of warmth, mild stinging, and redness of the skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
