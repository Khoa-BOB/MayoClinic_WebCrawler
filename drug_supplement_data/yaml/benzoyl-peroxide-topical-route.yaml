        younger than 12 years of age—Use and dose must be determined by your doctor.'
      - 'For topical dosage form (stick): Adults and children 12 years of age and
        over—Use on the affected area(s) of the skin 1 to 3 times a day. Children
        younger than 12 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and over—Use 2 or 3 times a day, or as
