title: Immune globulin-slra (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Asceniv
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Immune globulin-slra injection contains antibodies that make your immune
      system stronger. It is used for patients who have primary humoral immunodeficiency
      (PI), including congenital agammaglobulinemia, common variable immunodeficiency,
      X-linked agammaglobulinemia, Wiskott-Aldrich syndrome, and other severe combined
      immune system problems.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of immune globulin-slra injection in children younger than
        3 years of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of immune globulin-slra injection
        in the elderly. However, elderly patients are more likely to have age-related
        liver, kidney, or heart problems, which may require caution and an adjustment
        in the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Bumetanide
      - Cholera Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Ebola Zaire Vaccine, Live
      - Eculizumab
      - Ethacrynic Acid
      - Etozolin
      - Furosemide
      - Influenza Virus Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Piretanide
      - Poliovirus Vaccine, Live
      - Pozelimab-bbfg
      - Ravulizumab-cwvz
      - Rotavirus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Torsemide
      - Typhoid Vaccine, Live
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
      - Zoster Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood clotting problems or
      - Diabetes or
      - Heart or blood vessel disease or
      - Hyperproteinemia (high protein in the blood) or
      - Hyperviscosity (thick blood) or
      - Hypovolemia (low blood volume or major loss of body fluids) or
      - Paraproteinemia (paraproteins in the blood) or
      - Sepsis (serious infection in the body)—Use with caution. May cause side effects
        to become worse.
    - type: list
      ordered: false
      items:
      - Bleeding problems, history of or
      - Hyponatremia (low sodium in the blood) or
      - Kidney problems—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - IgA (immunoglobulin A) deficiency with antibodies against IgA—Should not be
        used in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      closely for any problems that may be caused by this medicine. Blood and urine
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause a serious type of allergic reaction, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have a rash, itching, hives, chest pain, dizziness
      or lightheadedness, trouble breathing or swallowing, or any swelling of your
      hands, face, or mouth after using this medicine. Certain people, including those
      with IgA (an immunoglobulin) deficiency and antibodies against IgA and a history
      of hypersensitivity to human immunoglobulin products should not use this medicine
      .
  - type: paragraph
    text: This medicine may increase your risk of developing blood clots. Check with
      your doctor right away if you or your child have swelling and pain in your arms,
      legs, or stomach, chest pain, shortness of breath, loss of sensation, confusion,
      or problems with muscle control or speech.
  - type: paragraph
    text: Check with your doctor right away if you start to have a stiff neck, drowsiness,
      fever, severe headache, nausea, vomiting, painful eye movements, or eye sensitivity
      to light. These could be symptoms of a serious condition called aseptic meningitis
      syndrome (AMS).
  - type: paragraph
    text: Check with your doctor right away if you start having red or dark brown
      urine, lower back or side pain, sudden weight gain, swollen face, arms, or legs,
      decreased urine output, or any problems with urination after you receive this
      medicine. These may be symptoms of a serious kidney problem.
  - type: paragraph
    text: This medicine may cause bleeding (hemolysis) or hemolytic anemia. Tell your
      doctor right away if you have stomach or back pain, dark urine, decreased urination,
      difficulty with breathing, an increased heart rate, tiredness, or yellow eyes
      or skin after you receive the medicine.
  - type: paragraph
    text: Check with your doctor right away if you start having chest pain, difficult,
      fast, or noisy breathing, blue lips and fingernails, fever, pale skin, increased
      sweating, coughing that sometimes produces a pink frothy sputum, or swelling
      of the legs and ankles after receiving this medicine. These may be symptoms
      of a serious lung problem.
  - type: paragraph
    text: This medicine is made from donated human blood. Some human blood products
      have transmitted certain viruses to people who have received them, although
      the risk is low. Human donors and donated blood are both tested for viruses
      to keep the transmission risk low. Talk with your doctor if you have concerns
      about this risk.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect the results of certain medical tests.
      Make sure any doctor or dentist who treats you knows that you are using this
      medicine. This medicine may affect the results of certain medical tests.
  - type: paragraph
    text: While you are being treated with immune globulin injection, do not have
      any immunizations (vaccines) without your doctor's approval .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - chills
      - cough
      - cough producing mucus
      - diarrhea
      - ear congestion
      - fever
      - headache
      - loss of appetite
      - loss of voice
      - muscle aches
      - nausea
      - pain or tenderness around the eyes and cheekbones
      - sneezing
      - sore throat
      - stomach pain
      - stuffy or runny nose
      - tightness of the chest
      - troubled breathing
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nosebleed
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - bloody, black, or tarry stools
      - bluish color of the fingernails, lips, skin, palms, or nail beds
      - chest pain
      - dark urine
      - feeling unusually cold
      - high fever
      - itching skin
      - joint or muscle pain
      - light-colored stools
      - loss of consciousness
      - painful or difficult urination
      - pale skin
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - seizures
      - shivering
      - sores, ulcers, or white spots in the mouth or on the lips
      - swollen glands
      - tremor
      - unexplained bleeding or bruising
      - unusual bleeding or bruising
      - vomiting
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Muscle spasms
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm or leg pain
      - mouth or throat pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
