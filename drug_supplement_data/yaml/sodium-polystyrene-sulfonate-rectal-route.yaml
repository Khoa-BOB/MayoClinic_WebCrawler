title: Sodium polystyrene sulfonate (rectal route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Sodium polystyrene sulfonate is used to treat high levels of potassium in
      the blood, also called hyperkalemia.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of sodium polystyrene sulfonate in the pediatric population.
        However, pediatric-specific problems that would limit the usefulness of this
        medicine in children are not expected.
    - type: paragraph
      text: This medicine should not be used in newborn infants who have reduced or
        slow bowel movements.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of sodium polystyrene sulfonate in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Meloxicam
      - Sorbitol
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Liothyronine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bowel blockage or
      - Newborn infants who have slow bowel movements��Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Congestive heart failure, or
      - Edema (fluid retention) or
      - Heart rhythm problems (eg, arrhythmia, QT prolongation) or
      - Hypertension (high blood pressure), severe or
      - Hypocalcemia (low calcium in the blood) or
      - Hypokalemia (low potassium in the blood)
      - Hypomagnesemia (low magnesium in the blood)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Hyperkalemia, life-threatening—Should not be used as an emergency treatment
        because of its delayed onset of action.
    - type: list
      ordered: false
      items:
      - Hypovolemia (low blood volume) or
      - Kidney disease—Use with caution. May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Patients not having any bowel movements after a surgery
      - Stomach or bowel problems (eg, bleeding, colitis, constipation, perforation),
        history of—Avoid use in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. Sodium polystyrene sulfonate is given as a rectal enema.
  - type: paragraph
    text: Use this medicine at least 3 hours before or after taking oral medicines.
      If your stomach takes too long to empty food (gastroparesis), use this medicine
      6 hours before or after taking oral medicines.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you closely to make sure that
      this medicine is working properly . Blood tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: Hypokalemia (low potassium in the blood) may occur while you are using this
      medicine. Check with your doctor right away if you have confusion, dry mouth,
      increased thirst, irregular heartbeat, irritability, muscle cramps, nausea or
      vomiting, or trouble breathing.
  - type: paragraph
    text: This medicine may cause a serious stomach or bowel problem, called intestinal
      necrosis. This is more likely to occur if you have a history of bowel disease,
      bowel surgery, low blood volume, kidney problems or if you take sorbitol together
      with this medicine. Tell your doctor right away if you or your child have severe
      constipation, severe stomach pain, bloody, black, or tarry stools, or vomit
      blood or a material that looks like coffee grounds.
  - type: paragraph
    text: Tell your doctor if you have unexplained weight gain or edema (fluid retention
      or body swelling) while using this medicine.
  - type: paragraph
    text: This medicine may cause lung or breathing problems (eg, bronchitis, bronchopneumonia)
      when you inhale its powder form. It may also increase your risk of having aspiration.
      Take this medicine in an upright position to prevent this. Talk to your doctor
      if you have questions.
  - type: paragraph
    text: If you are taking aluminum or magnesium-containing antacids or laxatives,
      tell your doctor before using sodium polystyrene sulfonate. These medicines
      may keep sodium polystyrene sulfonate from working properly and may cause serious
      side effects.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody vomit
      - chest pain or tightness
      - cough
      - cough producing mucus
      - difficulty with breathing
      - fever or chills
      - severe stomach pain
      - sneezing
      - sore throat
      - trouble breathing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - constipation
      - decrease in the amount of urine
      - diarrhea
      - dry mouth
      - increased thirst
      - irregular heartbeat
      - loss of appetite
      - muscle cramps in the hands, arms, feet, legs, or face
      - nausea or vomiting
      - noisy, rattling breathing
      - numbness and tingling around the mouth, fingertips, or feet
      - seizures
      - severe constipation
      - swelling of the fingers, hands, feet, or lower legs
      - stomach cramps or pain
      - tremor
      - unusual tiredness or weakness
      - weight gain or loss
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - drowsiness
      - fainting
      - fast, slow, or irregular heartbeat
      - lightheadedness
      - muscle spasms (tetany) or twitching
      - pounding or rapid pulse
      - trembling
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
