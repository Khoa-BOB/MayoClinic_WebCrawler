title: Tafasitamab-cxix (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Monjuvi
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Tafasitamab-cxix injection is used together with lenalidomide to treat certain
      types of diffuse large B-cell lymphoma (DLBCL) that has come back or did not
      respond to previous treatment in patients who cannot receive a stem cell transplant.
      This medicine is also used in combination with lenalidomide and rituximab to
      treat follicular lymphoma that has come back or did not respond to previous
      treatment. Lymphoma is a type of cancer where the body makes abnormal white
      blood cells.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of tafasitamab-cxix injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of tafasitamab-cxix in the elderly.
        However, elderly patients are more likely to have serious unwanted effects
        to this medicine than younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Infection or
      - Neutropenia (low number of white blood cells)—May decrease your body's ability
        to fight an infection.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Before receiving this medicine, make sure you understand all the risks and
      benefits. It is important for you to work closely with your doctor during your
      treatment.
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins. It is usually given in 4 or more cycles. Each treatment cycle lasts for
      28 days.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor or pharmacist if you have any
      questions.
  - type: paragraph
    text: You may also receive other medicines (eg, allergy medicine, fever medicine,
      steroids) 30 minutes to 2 hours before starting treatment with this medicine.
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: This medicine needs to be given on a fixed schedule. If you miss a dose,
        call your doctor, home health caregiver, or treatment clinic for instructions.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests are needed
      to check for unwanted effects.
  - type: paragraph
    text: Receiving this medicine while you are pregnant can harm your unborn baby.
      If you can get pregnant, your doctor may do tests to make sure you are not pregnant
      before receiving this medicine. Use an effective form of birth control to keep
      from getting pregnant during treatment and for 3 months after the last dose.
      If you think you have become pregnant while using the medicine, tell your doctor
      right away.
  - type: paragraph
    text: This medicine may cause an infusion reaction, which can be life-threatening
      and requires immediate medical attention. Tell your doctor or nurse right away
      if you have a fever, chills, headache, feeling of warmth, redness of the face,
      neck, arms and occasionally, upper chest, trouble breathing, lightheadedness,
      fainting, or chest pain within a few hours after you receive it.
  - type: paragraph
    text: This medicine lowers the number of some types of blood cells in your body.
      Because of this, you may bleed or get infections more easily. To help with these
      problems, avoid being near people who are sick or have infections. Wash your
      hands often. Stay away from rough sports or other situations where you could
      be bruised, cut, or injured. Brush and floss your teeth gently. Be careful when
      using sharp objects, including razors and fingernail clippers.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bladder pain
      - bleeding gums
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - bloody or cloudy urine
      - body aches or pain
      - burning, numbness, tingling, or painful sensations
      - chest pain or tightness
      - chills
      - confusion
      - cough producing mucus
      - decreased urine
      - diarrhea
      - difficult, burning, or painful urination
      - dizziness
      - dry mouth
      - ear congestion or pain
      - fainting
      - fast or slow heartbeat
      - fever
      - frequent urge to urinate
      - hoarseness or other voice changes
      - increased thirst
      - lightheadedness
      - loss of appetite
      - loss of taste or smell
      - loss of voice
      - lower back or side pain
      - mood changes
      - muscle pain or cramps
      - nausea
      - numbness or tingling in the hands, feet, or lips
      - pale skin
      - persistent non-healing sore on the skin
      - pink growth on the skin
      - pinpoint red spots on the skin
      - rapid, shallow breathing
      - rapid weight gain
      - reddish patch or irritated area on the skin
      - runny nose
      - seizures
      - shiny bump on the skin
      - sneezing
      - sore throat
      - stuffy or runny nose
      - tingling of the hands or feet
      - trouble breathing
      - ulcers, sores, or white spots in the mouth
      - unsteadiness or awkwardness
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - unusual weight gain or loss
      - vomiting
      - weakness in the arms, hands, legs, or feet
      - white, yellow or waxy scar-like area on the skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - change in taste
      - constipation
      - difficulty in moving
      - joint or muscle pain
      - loss of taste
      - muscle spasm
      - redness of the skin
      - unusually warm skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hair loss
      - increased sweating
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
