    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the oral liquid in the refrigerator. Do not freeze.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits.
      This will allow your doctor to see if the medicine is working properly and to
      decide if you should continue to take it.
  - type: paragraph
    text: Do not suddenly stop using this medicine without checking first with your
      doctor . You may need to slowly decrease your dose before stopping it completely.
      Unwanted side effects (eg, hallucinations, seizures, high fever, rhabdomyolysis)
      may occur if baclofen is stopped suddenly.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that slow down the nervous system, possibly causing drowsiness).
      Some examples of CNS depressants are antihistamines or medicine for hay fever,
      other allergies, or colds, sedatives, tranquilizers, or sleeping medicine, prescription
      pain medicine or narcotics, medicine for seizures or barbiturates, other muscle
      relaxants, or anesthetics, including some dental anesthetics. Check with your
      doctor before taking any of the above while you are using baclofen .
  - type: paragraph
    text: This medicine may cause dizziness, drowsiness, vision problems, or clumsiness
      or unsteadiness in some people. Make sure you know how you react to this medicine
      before you drive, use machines, or do anything else that could be dangerous
      if you are not alert, well-coordinated, and able to see well .
  - type: paragraph
    text: This medicine may affect blood sugar levels. If you notice a change in the
      results of your blood or urine sugar tests or if you have any questions, check
      with your doctor.
  - type: paragraph
    text: Using this medicine while you are pregnant may cause neonatal withdrawal
      syndrome in your newborn babies. Tell your doctor right away if your baby has
      shakiness or tremors, seizures, or increased muscle tone.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody or dark urine
      - chest pain
      - clumsiness, unsteadiness, trembling, or other problems with muscle control
      - fainting
      - false sense of well-being
      - mental depression or other mood changes
      - pounding heartbeat
      - ringing or buzzing in the ears
      - seeing or hearing things that are not there
      - skin rash or itching
      - slurred speech or other speech problems
      - swelling of the ankles
      - unexplained muscle stiffness
      - unusual excitement
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - dizziness
      - drowsiness
      - irregular, fast or slow, or shallow breathing
      - lightheadedness
      - loss of strength or energy
      - muscle pain or weakness
      - pale or blue lips, fingernails, or skin
      - seizures
      - sleepiness or unusual drowsiness
      - trouble breathing
      - unusual weak feeling
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - constipation
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - headache
      - increased need to urinate
      - nausea
      - passing urine more often
      - sweating
      - trouble sleeping
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - loss of appetite
      - muscle or joint pain
      - numbness or tingling in the hands or feet
      - stomach pain or discomfort
      - stuffy nose
      - weight gain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
