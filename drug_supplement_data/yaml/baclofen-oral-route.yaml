- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Baclofen is used to help relax certain muscles in your body. It relieves
      the spasms, cramping, and tightness of muscles caused by medical problems, including
      multiple sclerosis or certain injuries to the spine. Baclofen does not cure
      these problems, but it may allow other treatment, such as physical therapy,
      to be more helpful in improving your condition.
  - type: paragraph
    text: Baclofen acts on the central nervous system (CNS) to produce its muscle
      relaxant effects. Its actions on the CNS may also cause some of the medicine's
      side effects. Baclofen may also be used to relieve other conditions as determined
      by your doctor.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Solution
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of baclofen oral liquid and granules in children younger than
        12 years of age. Safety and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of baclofen tablets in the pediatric population. Safety and
        efficacy have not been established..
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of baclofen oral liquid and granules
        in the elderly. However, elderly patients are more likely to have age-related
        kidney, liver, or heart problems, which may require caution for patients receiving
        this medicine.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of baclofen tablet in the elderly.
        Side effects such as hallucinations, confusion or mental depression, other
        mood or mental changes, and severe drowsiness may be especially likely to
        occur in elderly patients, who are usually more sensitive than younger adults
        to the effects of this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alfentanil
      - Alprazolam
      - Amifampridine
      - Benzhydrocodone
      - Bromazepam
      - Buprenorphine
      - Bupropion
      - Butalbital
      - Butorphanol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Cetirizine
      - Clobazam
      - Clomipramine
      - Clonazepam
      - Codeine
      - Cyclobenzaprine
      - Cyproheptadine
      - Daridorexant
      - Dexmedetomidine
      - Diazepam
      - Dihydrocodeine
      - Donepezil
      - Doxylamine
      - Esketamine
      - Fentanyl
      - Flibanserin
      - Foscarbidopa
      - Foslevodopa
      - Gabapentin
      - Gabapentin Enacarbil
      - Hydrocodone
      - Hydromorphone
      - Hydroxychloroquine
      - Ketamine
      - Lacosamide
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Tizanidine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Autonomic dysreflexia, history of or
      - Diabetes or
      - Epilepsy or
      - Mental illness or problems (eg, psychosis, schizophrenia) or
      - Ovarian cysts or
      - Posture or balance problems or
      - Stroke, recent—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—The effects may be increased because of slower removal of the
        medicine from the body. Avoid use in elderly patients with kidney disease
        because of increased risk of serious brain problems (eg, encephalopathy).
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, or do not take it longer than your doctor
      ordered.
  - type: paragraph
    text: This medicine comes with a patient information and instructions leaflet.
      Read and follow the instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: 'To use the granules :'
  - type: list
    ordered: false
    items:
    - Open the packet and empty all the granules directly into your mouth. The granules
      will dissolve in your mouth or can be swallowed. You may drink water after taking
      the medicine.
    - You may mix the granules with 1 tablespoon (15 mL) of liquid (eg, apple juice
      or milk) or soft foods (eg, applesauce, pudding, or yogurt). Take this mixture
      within 2 hours of mixing.
    - This medicine can also be given using a nasogastric or gastric feeding tube.
      Mix the granules with 1 tablespoon (15 mL) of liquid (eg, apple juice or milk).
      Give this mixture within 2 hours of mixing. After the medicine is given, flush
      the tube with an additional 1 tablespoon (15 mL) of water.
    - Take all the contents of the packet to get a full dose. Do not take only part
      of this medicine. Do not save a portion for later use.
  - type: paragraph
    text: Measure the oral liquid with a marked measuring spoon, oral syringe, or
      medicine cup.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For muscle relaxation: For oral dosage form (granules): Adults and children
        12 years of age and older—At first, 5 milligrams (mg) 3 times a day for 3
        days. Your doctor may increase your dose by 5 mg every 3 days as needed and
        tolerated. However, the dose is usually not more than 80 milligrams (mg) per
        day (20 mg four times a day). Children younger than 12 years of age—Use and
        dose must be determined by your doctor. For oral dosage form (solution): Adults
        and children 12 years of age and older—At first, 5 milliliters (mL) 3 times
        a day for 3 days. Your doctor may increase your dose by 5 mL every 3 days
        as needed and tolerated. However, the dose is usually not more than 80 milligrams
        (mg) per day (20 mg four times a day). Children younger than 12 years of age—Use
        and dose must be determined by your doctor. For oral dosage form (tablets):
        Adults and teenagers—At first, 5 milligrams (mg) 3 times a day. Your doctor
        may increase your dose by 5 mg every 3 days until the desired response is
        reached. However, the dose is not more than 80 mg per day. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (granules): Adults and children 12 years of age and
        older—At first, 5 milligrams (mg) 3 times a day for 3 days. Your doctor may
        increase your dose by 5 mg every 3 days as needed and tolerated. However,
