title: Baclofen (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Fleqsuvy
    - type: paragraph
      text: Lyvispah
    - type: paragraph
      text: Ozobax
    - type: paragraph
