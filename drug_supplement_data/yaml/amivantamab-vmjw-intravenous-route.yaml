title: Amivantamab-vmjw (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Rybrevant
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Amivantamab-vmjw injection is used in combination with lazertinib as a first-line
      treatment for metastatic (cancer that has spread) or locally advanced (cannot
      be removed by surgery) non-small cell lung cancer (NSCLC) in patients who have
      an abnormal epidermal growth factor receptor (EGFR) gene (exon 19 deletions
      or exon 21 L858R substitution mutations). This medicine is also used in combination
      with carboplatin and pemetrexed to treat metastatic or locally advanced NSCLC
      in patients who have an EGFR gene (exon 19 deletions or exon 21 L858R substitution
      mutations), whose disease has progressed during or after treatment with other
      cancer medicines (eg, EFGR tyrosine kinase inhibitor).
  - type: paragraph
    text: It is also used in combination with carboplatin and pemetrexed as a first-line
      treatment for metastatic or locally advanced NSCLC in patients who have an abnormal
      EGFR gene (exon 20 insertion mutations). This medicine is also used alone to
      treat metastatic or locally advanced NSCLC in patients who have an abnormal
      EGFR gene (exon 20 insertion mutations), whose disease has progressed during
      or after treatment with other cancer medicines (eg, platinum). Your doctor will
      perform a test before you take this medicine.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of amivantamab-vmjw injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of amivantamab-vmjw injection in
        the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood clots (eg, deep vein thrombosis, pulmonary embolism) or
      - Eye or vision problems (eg, blepharitis, keratitis, uveitis) or
      - Lung or breathing problems (eg, interstitial lung disease, pneumonitis), history
        of or
      - Serious skin reactions (eg, dermatitis acneiform, toxic epidermal necrolysis)—Use
        with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through an IV catheter that is placed into
      one of your veins.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Your doctor will give you other medicines (eg, allergy medicine, fever medicine,
      steroid) before you receive this medicine to help prevent unwanted effects.
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: This medicine needs to be given on a fixed schedule. If you miss a dose,
        call your doctor, home health caregiver, or treatment clinic for instructions.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress closely while
      you are receiving this medicine. This will allow your doctor to see if the medicine
      is working properly and to decide if you should continue to receive it. Blood
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Receiving this medicine while you are pregnant can harm your unborn baby.
      If you can get pregnant, your doctor may do tests to make sure you are not pregnant
      before starting treatment. Use an effective form of birth control to keep from
      getting pregnant during treatment and for at least 3 months after the last dose.
      If you think you have become pregnant while receiving this medicine, tell your
      doctor right away.
  - type: paragraph
    text: This medicine may cause infusion-related reactions, which can be life-threatening
      and require immediate medical attention. Tell your doctor right away if you
      start to have a fever, chills or shaking, dizziness, trouble breathing, itching
      or rash, or lightheadedness or fainting after receiving this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have chest pain, chills, cough,
      fever, general feeling of discomfort or illness, trouble breathing, or thickening
      of bronchial secretions. These may be symptoms of a lung problem (eg, interstitial
      lung disease, pneumonitis).
  - type: paragraph
    text: Check with your doctor right away if you have anxiety, chest pain, cough,
      dizziness, lightheadedness, or fainting, fast heartbeat, pain, redness, or swelling
      in the arm or leg, or trouble breathing. These may be symptoms of serious blood
      clots (eg, deep vein thrombosis, pulmonary embolism).
  - type: paragraph
    text: This medicine may cause serious skin reactions (eg, dermatitis acneiform,
      toxic epidermal necrolysis). Check with your doctor right away if you have acne,
      blistering, crusting, irritation, itching, or reddening of the skin, chills,
      cough, cracked, dry, or scaly skin, diarrhea, itching, joint or muscle pain,
      peeling or loosening of the skin, red irritated eyes, red skin lesions, often
      with a purple center, sore throat, sores, ulcers, or white spots in the mouth
      or on the lips, swelling, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may make your skin more sensitive to sunlight. Use a sunscreen
      when you are outdoors. Avoid sunlamps, outdoors and tanning beds for at least
      2 months after the last dose.
  - type: paragraph
    text: Check with your doctor right away if blurred vision, difficulty with reading,
      eye pain, or any other change in vision occurs while you are receiving this
      medicine. Your doctor may want your eyes be checked by an ophthalmologist (eye
      doctor).
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - back pain
      - bleeding gums
      - blistering, crusting, irritation, itching, or reddening of the skin
      - blood in the urine
      - bloody nose
      - burning, crawling, itching, numbness, painful, prickling, "pins and needles",
        or tingling feelings
      - chest pain or tightness
      - chills
      - cough
      - coughing or spitting up blood
      - cracked, dry, or scaly skin
      - dizziness or lightheadedness
      - dry, itching skin
      - fainting
      - fast heartbeat
      - fever
      - flushing
      - headache
      - loosening of the fingernails
      - muscle or bone pain
      - nausea and vomiting
      - nerve pain
      - pain, redness, or swelling in the arm or leg
      - rash with flat lesions or small raised lesions on the skin
      - redness or soreness around the fingernails
      - sneezing
      - swelling
      - trouble breathing
      - unsteadiness or awkwardness
      - weakness in the arms, hands, legs, or feet
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - General feeling of discomfort or illness
      - thickening of bronchial secretions
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - blurred vision or other change in vision
      - diarrhea
      - eye redness, irritation, or pain
      - red skin lesions, often with a purple center
      - sensitivity of the eye to light
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - tearing
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty swallowing
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Canker sores
      - chapped, red, or swollen lips
      - constipation
      - decreased appetite
      - difficulty in moving
      - lack or loss of strength
      - muscle aches, cramps, or stiffness
      - pain in the arms or legs
      - pain in the joints
      - redness, swelling, or soreness of the tongue
      - scaling, redness, burning, pain, or other signs of inflammation of the lips
      - stomach pain
      - swelling or inflammation of the mouth
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
