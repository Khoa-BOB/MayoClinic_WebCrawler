        more than 600 mg a day. Adults and children older than 13 years of age not
        taking valproic acid (Depakote®), carbamazepine (Tegretol®), phenobarbital
        (Luminal®), phenytoin (Dilantin®), or primidone (Mysoline®)—At first, 25 mg
        of lamotrigine once a day for 2 weeks, then 50 mg once a day for 2 weeks.
        After this, your doctor may gradually increase your dose as needed. However,
        the dose is usually not more than 400 mg a day. Adults and children older
        than 13 years of age taking valproic acid (Depakote®)—At first, 25 mg of lamotrigine
