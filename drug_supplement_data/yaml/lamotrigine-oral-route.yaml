        this, your doctor may gradually increase your dose as needed. However, the
        dose is usually not more than 250 mg a day. Children younger than 13 years
        of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of bipolar disorder: Adults not taking valproic acid (Depakote®)
        and not taking carbamazepine (Tegretol®), phenobarbital (Luminal®), phenytoin
        (Dilantin®), or primidone (Mysoline®)—At first, 25 milligrams (mg) of lamotrigine
