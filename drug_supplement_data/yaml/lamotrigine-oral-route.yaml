- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Lamotrigine is used alone or together with other medicines to help control
      certain types of seizures (eg, partial seizures, tonic-clonic seizures, or Lennox-Gastaut
      syndrome) in the treatment of epilepsy. This medicine cannot cure epilepsy and
      will only work to control seizures for as long as you continue to take it. It
      can also be used in the treatment of bipolar disorder (manic-depressive illness)
      in adults.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Tablet, Extended Release
    - Tablet, Chewable
    - Tablet, Disintegrating
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of lamotrigine chewable tablets,
        disintegrating tablets, suspension, tablets for suspension, or tablets in
        children with certain types of seizures 2 years of age and older. However,
        safety and efficacy have not been established in children younger than 2 years
        of age.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of lamotrigine extended-release tablets in children with partial
        seizures younger than 13 years of age. Safety and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of lamotrigine chewable tablets, disintegrating tablets, suspension,
        tablets for suspension, or tablets in children with bipolar disorder. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of lamotrigine have not been performed in the geriatric population, geriatric-specific
        problems are not expected to limit the usefulness of lamotrigine in the elderly.
        However, elderly patients are more likely to have age-related liver, kidney,
        or heart problems, which may require an adjustment in the dose for patients
        receiving lamotrigine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Atazanavir
      - Azathioprine
      - Calcifediol
      - Carbamazepine
      - Cenobamate
      - Desmopressin
      - Dofetilide
      - Ezogabine
      - Fosphenytoin
      - Hydroxychloroquine
      - Levoketoconazole
      - Lopinavir
      - Mercaptopurine
      - Methotrexate
      - Orlistat
      - Phenobarbital
      - Phenytoin
      - Pimozide
      - Primidone
      - Rifampin
      - Valproic Acid
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Desogestrel
      - Dienogest
      - Drospirenone
      - Escitalopram
      - Estetrol
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Gestodene
      - Ginkgo
      - Ginseng
      - Levonorgestrel
      - Mestranol
      - Methsuximide
      - Nomegestrol
      - Norethindrone
      - Norgestimate
      - Norgestrel
      - Oxcarbazepine
      - Risperidone
      - Ritonavir
      - Rufinamide
      - Sertraline
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood or bone marrow problems or
      - Depression or
      - Heart disease (eg, heart attack, heart failure) or
      - Heart rhythm problems—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Genetic condition (eg, gene variation called HLA-B*1502)—Use with caution.
        May increase risk for serious skin reactions.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of the
        slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor to help your condition
      as much as possible and to decrease the chance of unwanted effects. Do not take
      more of it, do not take it more often, and do not take it for a longer time
      than your doctor ordered.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Lamotrigine may be taken with or without food or on a full or empty stomach.
      However, if your doctor tells you to take the medicine a certain way, take it
      exactly as directed.
  - type: paragraph
    text: If you are taking the chewable dispersible tablets or tablets for suspension
      , they may be swallowed whole, chewed, and swallowed, or dispersed in a small
      amount of liquid and swallowed. If the tablets are chewed, they should be followed
      with a small amount of water or diluted fruit juice to aid in swallowing. To
      break up these tablets, add them in enough water or diluted fruit juice to cover
      the tablets (about a teaspoonful). Wait until the tablets are completely dispersed
      (about 1 minute), then swirl the solution and swallow it immediately.
  - type: paragraph
    text: If you are taking the disintegrating tablet , make sure your hands are dry
      before you handle the tablet. Do not open the blister pack that contains the
      tablet until you are ready to take it. Remove the tablet from the blister pack
      by peeling back the foil, then taking the tablet out. Do not push the tablet
      through the foil. Place the tablet into your tongue and move it around in your
      mouth. It should melt quickly. After the tablet has melted, swallow or take
      a sip of water.
  - type: paragraph
    text: Swallow the extended-release tablets whole. Do not break, crush, or chew
      it.
  - type: paragraph
    text: 'To use the oral liquid :'
  - type: list
    ordered: false
    items:
    - Measure the oral liquid with a marked oral dosing syringe or dosing cup. The
      average household teaspoon may not hold the right amount of liquid.
    - Shake well before each use.
  - type: paragraph
    text: Use only the brand of this medicine that your doctor prescribed. Different
      brands and dosage forms may not work the same way.
  - type: paragraph
    text: This medicine can be used with other seizure medicines. Keep using all of
      your seizure medicines unless your doctor tells you to stop.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (chewable dispersible tablets, disintegrating tablets,
        suspension, tablets for suspension, or tablets): For treatment of bipolar
        disorder: Adults not taking valproic acid (Depakote®) and not taking carbamazepine
        (Tegretol®), phenobarbital (Luminal®), phenytoin (Dilantin®), or primidone
        (Mysoline®)—At first, 25 milligrams (mg) of lamotrigine once a day for 2 weeks,
        then 50 mg once a day for 2 weeks. After this, your doctor may gradually increase
        your dose as needed. However, the dose is usually not more than 200 mg a day.
        Adults taking valproic acid (Depakote®)—At first, 25 mg of lamotrigine once
        every other day for 2 weeks, then 25 mg once a day for 2 weeks. After this,
        your doctor may gradually increase your dose as needed. However, the dose
        is usually not more than 100 mg a day. Adults not taking valproic acid (Depakote®)
        but taking carbamazepine (Tegretol®), phenobarbital (Luminal®), phenytoin
        (Dilantin®), or primidone (Mysoline®)—At first, 50 mg of lamotrigine once
        a day for 2 weeks, then a total of 100 mg divided into 2 smaller doses each
        day for 2 weeks. After this, your doctor may gradually increase your dose
        as needed. However, the dose is usually not more than 400 mg a day. Adults
        who are discontinuing valproic acid (Depakote®) or discontinuing carbamazepine
        (Tegretol®), phenobarbital (Luminal®), phenytoin (Dilantin®), or primidone
        (Mysoline®)—Dose will be determined by your doctor. Children—Use and dose
        must be determined by your doctor. For treatment of epilepsy: Adults not taking
        valproic acid (Depakote®) but taking carbamazepine (Tegretol®), phenobarbital
        (Luminal®), phenytoin (Dilantin®), or primidone (Mysoline®)—At first, 50 milligrams
        (mg) of lamotrigine once a day for 2 weeks, then a total of 100 mg divided
        into 2 smaller doses each day for 2 weeks. After this, your doctor may gradually
        increase your dose as needed. However, the dose is usually not more than 500
        mg a day. Adults not taking valproic acid (Depakote®), carbamazepine (Tegretol®),
        phenobarbital (Luminal®), phenytoin (Dilantin®), or primidone (Mysoline®)—At
        first, 25 mg of lamotrigine once a day for 2 weeks, then 50 mg once a day
        for 2 weeks. After this, your doctor may gradually increase your dose as needed.
        However, the dose is usually not more than 375 mg a day. Adults taking valproic
        acid (Depakote®)—At first, 25 mg of lamotrigine once every other day for 2
        weeks, then 25 mg once a day for 2 weeks. After this, your doctor may gradually
        increase your dose as needed. However, the dose is usually not more than 400
        mg a day. Adults who are discontinuing valproic acid (Depakote®) or discontinuing
        carbamazepine (Tegretol®), phenobarbital (Luminal®), phenytoin (Dilantin®),
        or primidone (Mysoline®)—Dose will be determined by your doctor. Children
        2 to 12 years of age: Children not taking valproic acid (Depakote®) but taking
        carbamazepine (Tegretol®), phenobarbital (Luminal®), phenytoin (Dilantin®),
        or primidone (Mysoline®)— At first, 0.6 milligrams per kilogram (mg/kg) of
        body weight of lamotrigine divided into 2 smaller doses each day for 2 weeks,
        then 1.2 mg/kg of body weight divided into 2 smaller doses each day for 2
        weeks. After this, your doctor may gradually increase your dose as needed.
        However, the dose is usually not more than 400 mg a day. Children not taking
        valproic acid (Depakote®), carbamazepine (Tegretol®), phenobarbital (Luminal®),
        phenytoin (Dilantin®), or primidone (Mysoline®)— At first, 0.3 mg/kg of body
        weight of lamotrigine given in one dose or two smaller doses each day for
        2 weeks, then 0.6 mg/kg of body weight divided into 2 smaller doses each day
        for 2 weeks. After this, your doctor may gradually increase your dose as needed.
        However, the dose is usually not more than 300 mg a day. Children taking valproic
        acid (Depakote®)— At first, 0.15 mg/kg of body weight of lamotrigine given
        in one dose or two smaller doses each day for 2 weeks, then 0.3 mg/kg of body
        weight given in one dose or two smaller doses each day for 2 weeks. After
        this, your doctor may gradually increase your dose as needed. However, the
        dose is usually not more than 200 mg a day. Children younger than 2 years
        of age—Use and dose must be determined by your doctor.'
      - 'For oral dosage form (extended-release tablets): For seizures: Adults and
        children older than 13 years of age not taking valproic acid (Depakote®) but
        taking carbamazepine (Tegretol®), phenobarbital (Luminal®), phenytoin (Dilantin®),
        or primidone (Mysoline®)—At first, 50 milligrams (mg) of lamotrigine once
