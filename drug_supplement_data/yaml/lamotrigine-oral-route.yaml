        the dose is usually not more than 600 mg a day. Adults and children older
        than 13 years of age not taking valproic acid (Depakote®), carbamazepine (Tegretol®),
        phenobarbital (Luminal®), phenytoin (Dilantin®), or primidone (Mysoline®)—At
        first, 25 mg of lamotrigine once a day for 2 weeks, then 50 mg once a day
        for 2 weeks. After this, your doctor may gradually increase your dose as needed.
        However, the dose is usually not more than 400 mg a day. Adults and children
        older than 13 years of age taking valproic acid (Depakote®)—At first, 25 mg
        of lamotrigine once every other day for 2 weeks, then 25 mg once a day for
        2 weeks. After this, your doctor may gradually increase your dose as needed.
        However, the dose is usually not more than 250 mg a day. Children younger
        than 13 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children older than 13 years of age not taking valproic acid (Depakote®)
        but taking carbamazepine (Tegretol®), phenobarbital (Luminal®), phenytoin
        (Dilantin®), or primidone (Mysoline®)—At first, 50 milligrams (mg) of lamotrigine
        once a day for 2 weeks, then 100 mg once a day for 2 weeks. After this, your
        doctor may gradually increase your dose as needed. However, the dose is usually
        not more than 600 mg a day.
      - Adults and children older than 13 years of age not taking valproic acid (Depakote®),
        carbamazepine (Tegretol®), phenobarbital (Luminal®), phenytoin (Dilantin®),
        or primidone (Mysoline®)—At first, 25 mg of lamotrigine once a day for 2 weeks,
        then 50 mg once a day for 2 weeks. After this, your doctor may gradually increase
        your dose as needed. However, the dose is usually not more than 400 mg a day.
      - Adults and children older than 13 years of age taking valproic acid (Depakote®)—At
        first, 25 mg of lamotrigine once every other day for 2 weeks, then 25 mg once
        a day for 2 weeks. After this, your doctor may gradually increase your dose
        as needed. However, the dose is usually not more than 250 mg a day.
      - Children younger than 13 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away unused oral liquid 90 days after opening.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your or your child's progress at
      regular visits , especially during the first few months of your treatment with
      lamotrigine. This will allow your doctor to change your dose, if necessary,
      and will help reduce any unwanted effects.
  - type: paragraph
    text: It is important to tell your doctor if you become pregnant while using this
      medicine. Your doctor may want you to join a pregnancy registry for patients
      taking a seizure medicine.
  - type: paragraph
    text: You should not start or stop using birth control pills or other female hormonal
      products (eg, estrogen) while you are using this medicine until you have consulted
      your doctor.
  - type: paragraph
    text: Tell your doctor right away if you have unusual changes in your menstrual
      cycle such as breakthrough bleeding while taking lamotrigine and birth control
      pills or other female hormonal products.
  - type: paragraph
    text: This medicine may increase the effects of alcohol and other central nervous
      system (CNS) depressants (medicines that make you drowsy or less alert). Some
      examples of CNS depressants are antihistamines or medicine for allergies or
      colds, sedatives, tranquilizers, or sleeping medicine, prescription pain medicine
      or narcotics, medicine for seizures or barbiturates, muscle relaxants, or anesthetics,
      including some dental anesthetics. Check with your doctor before taking any
      of the above while you are using this medicine .
  - type: paragraph
    text: Lamotrigine may cause blurred vision, double vision, clumsiness, unsteadiness,
      dizziness, or drowsiness. Do not drive or do anything else that could be dangerous
      until you know how this medicine affects you . If these reactions are especially
      bothersome, check with your doctor.
  - type: paragraph
    text: Tell your doctor if you are of Asian descent, including Han Chinese or Thai.
      You may have an increased risk for serious skin reactions, including Stevens-Johnson
      syndrome and toxic epidermal necrolysis. Check with your doctor right away if
      you have blistering, peeling, or loosening of the skin, chills, cough, diarrhea,
      itching, joint or muscle pain, red irritated eyes, red skin lesions, often with
      a purple center, sore throat, sores, ulcers, or white spots in the mouth or
      on the lips, or unusual tiredness or weakness.
  - type: paragraph
    text: Skin rash may be a sign of a serious unwanted effect. Check with your doctor
      immediately if you or your child develop a rash, fever, flu-like symptoms, or
      swollen glands, or if your seizures becomes worse .
  - type: paragraph
    text: This medicine may cause hemophagocytic lymphohistiocytosis, a rare and life-threatening
      disorder wherein the body makes too many activated immune cells (macrophages
      and lymphocytes). Talk to your doctor if you have any concerns.
  - type: paragraph
    text: Lamotrigine may cause serious allergic reactions affecting multiple body
      organs (eg, liver or kidney). Check with your doctor right away if you or your
      child have fever, dark urine, headache, hives, muscle pain or stiffness, stomach
      pain, unusual tiredness, or yellow eyes or skin.
  - type: paragraph
    text: This medicine may cause heart rhythm problems. Check with your doctor right
      away if you have chest pain, fast, slow, or uneven heartbeat, lightheadedness,
      or trouble breathing.
  - type: paragraph
    text: This medicine may cause some people to be agitated, irritable, or display
      other abnormal behaviors. It may also cause some people to have suicidal thoughts
      and tendencies or to become more depressed. If you, your child, or your caregiver
      notice any of these side effects, tell your doctor or your child's doctor right
      away.
  - type: paragraph
    text: Check with your doctor right away if you or your child start to have a stiff
      neck, confusion, drowsiness, fever, chills, headache, nausea, vomiting, rash,
      or sensitivity to light. These could be symptoms of a rare and serious condition
      called aseptic meningitis.
  - type: paragraph
    text: Check with your doctor right away if blurred vision, difficulty with reading,
      or any other change in vision occurs during or after treatment. Your doctor
      may want your eyes be checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: Do not stop taking lamotrigine without first checking with your doctor .
      Stopping this medicine suddenly may cause your seizures to return or to occur
      more often. Your doctor may want you to gradually reduce the amount you are
      taking before stopping completely.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - changes in vision
      - chest pain, discomfort, or tightness
      - clumsiness or unsteadiness
      - decreased urine output
      - dilated neck veins
      - double vision
      - irregular breathing
      - irregular heartbeat
      - nausea
      - pain or discomfort in the arms, jaw, back, or neck
      - poor coordination
      - seizure that will not stop
      - skin rash
      - sweating
      - swelling of the face, fingers, feet, or lower legs
      - trouble breathing
      - unusual tiredness or weakness
      - vomiting
      - weight gain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - chest pain
      - confusion
      - continuous, uncontrolled back and forth or rolling eye movements
      - depression
      - increase in seizures
      - infection
      - irritability
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - chills
      - cough
      - dark urine
      - diarrhea
      - fever
      - general feeling of discomfort or illness
      - headache
      - itching
      - joint pain
      - loss of appetite
      - memory loss
      - muscle cramps, pain, or weakness
      - red or irritated eyes
      - runny nose
      - shivering
      - small red or purple spots on the skin
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swelling of the face, mouth, hands, or feet
      - swollen lymph nodes
      - trouble sleeping
      - unusual bleeding or bruising
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back, leg, or stomach pains
      - bleeding gums
      - bloating
      - blood in the urine
      - bloody, black or tarry stools
      - bluish lips or skin
      - constipation
      - cough
      - coughing or vomiting blood
      - difficulty with swallowing
      - fainting
      - fast heartbeat
      - general body swelling
      - heartburn
      - high fever
      - hoarseness
      - lightheadedness
      - loss of balance control
      - lower back or side pain
      - mask-like face
      - muscle spasms
      - nosebleeds
      - not breathing
      - pain or burning in the throat
      - painful or difficult urination
      - pains in the stomach or side, possibly radiating to the back
      - pale skin
      - persistent bleeding or oozing from puncture sites, mouth, or nose
      - rapid, shallow breathing
      - redness, soreness, or itching skin
      - shuffling walk
      - slowed movement
      - slurred speech
      - sores, welting, or blisters
      - stiffness of the arms and legs
      - swollen or painful glands
      - tic-like (jerky) movements
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Clumsiness or unsteadiness (severe)
      - continuous, uncontrolled back and forth or rolling eye movements (severe)
      - dizziness (severe)
      - drowsiness (severe)
      - dryness of the mouth (severe)
      - headache (severe)
      - increased heart rate
      - loss of consciousness
      - slurred speech (severe)
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - drowsiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Indigestion
      - loss of strength
      - menstrual pain
      - pain
      - trembling or shaking
      - trouble with sleeping
      - unusual weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
