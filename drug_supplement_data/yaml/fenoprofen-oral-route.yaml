    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Bleeding problems or
      - Congestive heart failure or
      - Edema (fluid retention or body swelling) or
      - Heart attack, recent or
      - Hyperkalemia (high potassium in the blood) or
      - Hypertension (high blood pressure) or
      - Kidney disease, history of or
      - Liver disease (eg, hepatitis) or
      - Stomach ulcers or bleeding or
      - Stroke, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Aspirin-sensitive asthma or
      - Aspirin sensitivity, history of or
      - Kidney disease, severe—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Hypovolemia—Must be corrected first before using this medicine.
    - type: list
      ordered: false
      items:
      - Heart surgery (eg, coronary artery bypass graft [CABG])—Should not be used
        to relieve pain right before or after the surgery.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: For safe and effective use of this medicine, do not use more of it, do not
      use it more often, and do not use it for a longer time than ordered by your
      doctor. Using too much of this medicine may increase the chance of unwanted
      effects, especially in elderly patients.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: To lessen stomach upset, you may take this medicine with food or milk. .
  - type: paragraph
    text: Swallow the tablet whole. Do not break, crush, divide, or chew it. .
  - type: paragraph
    text: When used for severe or continuing arthritis, this medicine must be taken
      regularly as ordered by your doctor in order for it to help you. This medicine
      usually begins to work within one week, but in severe cases up to two weeks
      or even longer may pass before you begin to feel better. Also, several weeks
      may pass before you feel the full effects of this medicine. .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For mild to moderate pain: Adults—200 milligrams
        (mg) every 4 to 6 hours as needed. Children—Use and dose must be determined
        by your doctor. For rheumatoid arthritis and osteoarthritis: Adults—At first,
        400 to 600 mg 3 or 4 times a day. Your doctor may adjust your dose as needed.
        However, the dose usually is not more than 3200 mg per day. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For mild to moderate pain: Adults—200 milligrams (mg) every 4 to 6 hours
        as needed. Children—Use and dose must be determined by your doctor.'
      - 'For rheumatoid arthritis and osteoarthritis: Adults—At first, 400 to 600
        mg 3 or 4 times a day. Your doctor may adjust your dose as needed. However,
        the dose usually is not more than 3200 mg per day. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—200 milligrams (mg) every 4 to 6 hours as needed.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—At first, 400 to 600 mg 3 or 4 times a day. Your doctor may adjust
        your dose as needed. However, the dose usually is not more than 3200 mg per
        day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits.
      This will allow your doctor to see if the medicine is working properly and to
      decide if you should continue to use it. Blood and urine tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: This medicine may raise your risk of having a heart attack, heart failure,
      or stroke. This is more likely in people who already have heart disease. People
      who use this medicine for a long time might also have a higher risk. Check with
      your doctor right away if you have chest pain that may spread to your arms,
      jaw, back, or neck, trouble breathing or speaking, headache, nausea, unusual
      sweating, or faintness.
  - type: paragraph
    text: This medicine may cause bleeding in your stomach or bowels. These problems
      can happen without warning signs. This is more likely if you have had a stomach
      ulcer in the past, if you smoke or drink alcohol regularly, if you are over
      60 years old, are in poor health, or are using certain other medicines (a steroid
      or a blood thinner).
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. You might need to measure
      your blood pressure at home. If you think your blood pressure is too high, call
      your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, troubled breathing, unusual tiredness or weakness, vomiting,
      or weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have stomach pain, confusion,
      difficulty with breathing, irregular heartbeat, nausea or vomiting, nervousness,
      numbness or tingling in the hands, feet, or lips, or weakness or heaviness of
      the legs.
  - type: paragraph
    text: Serious side effects can occur during treatment with this medicine and can
      occur without warning. However, possible warning signs often occur, including
      severe stomach pain, black tarry stools, vomiting of blood or material that
      looks like coffee grounds, skin rash, swelling of the face, fingers, feet, or
      lower legs. Also, signs of serious heart problems could occur such as chest
      pain, tightness in the chest, fast or irregular heartbeat, or unusual flushing
      or warmth of the skin. Check with your doctor immediately if you notice any
      of these warning signs .
  - type: paragraph
    text: This medicine may cause a serious allergic reaction called anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you have a rash, itching, trouble breathing or swallowing,
      or any swelling of your hands, face, or mouth while you are using this medicine.
  - type: paragraph
    text: Serious skin reactions, including Stevens-Johnson syndrome, exfoliative
      dermatitis, toxic epidermal necrolysis, fixed drug eruption (FDE), and generalized
      bullous fixed drug eruption (GBFDE) can occur during treatment with this medicine.
      Check with your doctor right away if you have blistering, peeling, or loosening
      of the skin, chills, cough, diarrhea, itching, joint or muscle pain, red irritated
      eyes, red skin lesions, sore throat, sores, ulcers, or white spots in the mouth
      or on the lips.
  - type: paragraph
    text: Check with your doctor right away if you have black, tarry stools, chest
      pain, chills, cough, fever, painful or difficult urination, sore throat, sores,
      ulcers, or white spots in the mouth or on the lips, swollen glands, unusual
      bleeding or bruising, or unusual tiredness or weakness. These may be symptoms
      of serious skin reaction called drug reaction with eosinophilia and systemic
      symptoms (DRESS).
  - type: paragraph
    text: Using this medicine during the later part of a pregnancy can harm your unborn
      baby. If you think you have become pregnant while using this medicine, tell
      your doctor right away.
  - type: paragraph
    text: Check with your doctor immediately if blurred vision, difficulty in reading,
      or any other change in vision occurs during or after your treatment. Your doctor
      may want you to have your eyes checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: This medicine may cause some people to become dizzy, lightheaded, drowsy,
      or less alert than they are normally. Even if taken at bedtime, it may cause
      some people to feel drowsy or less alert on arising. Make sure you know how
      you react to this medicine before you drive, use machines, or do anything else
      that could be dangerous if you are not alert .
  - type: paragraph
    text: Check with your doctor if you start having ringing in your ears or trouble
      hearing while you are using this medicine. Your doctor may want you to have
      your ears checked by an ear doctor especially when you are using this medicine
      for a long time.
  - type: paragraph
    text: Before having any kind of surgery or medical tests, tell your doctor that
      you are taking this medicine. It may be necessary for you to stop treatment
      for a while, or to change to a different nonsteroidal anti-inflammatory drug
      before your procedure.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - blurred vision
      - chest tightness
      - continuing ringing or buzzing or other unexplained noise in the ears
      - decreased hearing
      - difficult or labored breathing
      - fast, irregular, pounding, or racing heartbeat or pulse
      - hearing loss
      - itching skin or rash
      - rapid weight gain
      - stomach pain
      - tingling of the hands or feet
      - unusual weight gain or loss
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back, leg, or stomach pains
      - black or red, tarry stools
      - bleeding gums
      - blood in vomit
      - bloody or cloudy urine
      - bloody stools
      - burning feeling in the chest or stomach
      - chills
      - clay-colored stools
      - coughing up blood
      - dark urine
      - diarrhea
      - difficult, burning, or painful urination
      - difficulty with swallowing
      - dizziness
      - dry mouth
      - fever with or without chills
      - frequent urge to urinate
      - general body swelling
      - greatly decreased frequency or amount of urine
      - hoarseness
      - increased menstrual flow or vaginal bleeding
      - increased thirst
      - indigestion
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss of appetite
      - lower back or side pain
      - nausea
      - nosebleeds
      - not able to pass urine
      - pale skin
      - paralysis
      - pinpoint red or purple spots on the skin
      - prolonged bleeding from cuts
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red or dark brown urine
      - redness of the skin
      - severe or continuing stomach pain
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach upset
      - swelling of the face, fingers, or lower legs
      - swelling of the hands, legs, and feet
      - swollen or painful glands
      - tenderness in the stomach area
      - trouble breathing
      - unpleasant breath odor
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
      - vomiting of blood or material that looks like coffee grounds
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blistering, peeling, or loosening of the skin
      - itching
      - joint pain
      - painful or difficult urination
      - red irritated eyes
      - red skin lesions, often with a purple center
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - swollen glands
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptom of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - irregular, fast or slow, or shallow breathing
      - pale or blue lips, fingernails, or skin
      - rapid, deep breathing
      - restlessness
      - shakiness and unsteady walk
      - stomach cramps
      - unsteadiness, trembling, or other problems with muscle control or coordination
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - constipation
      - headache
      - heartburn
      - lack or loss of strength
      - sleepiness or unusual drowsiness
      - stomach discomfort
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - cough
      - ear congestion
      - increased sweating
      - loss of voice
      - mood or mental changes
      - muscle aches
      - sneezing
      - stuffy or runny nose
      - tremor
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - General feeling of discomfort or illness
      - trouble sleeping
