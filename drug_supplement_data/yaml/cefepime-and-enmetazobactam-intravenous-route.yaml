title: Cefepime and enmetazobactam (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Exblifep
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cefepime and enmetazobactam combination injection is used to treat complicated
      urinary tract infections (cUTI), including pyelonephritis (kidney infection).
  - type: paragraph
    text: Cefepime and enmetazobactam are antibiotics that belong to the group of
      medicines known as cephalosporin antibiotics and beta-lactamase inhibitors.
      They work by killing the bacteria and preventing their growth. However, these
      medicines will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of cefepime and enmetazobactam combination injection in the
        pediatric population. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of cefepime and enmetazobactam combination
        injection in the elderly. However, elderly patients are more likely to have
        age-related kidney problems, which may require caution in the dose for patients
        receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amiloride
      - Bemetizide
      - Bendroflumethiazide
      - Benzthiazide
      - Bumetanide
      - Canrenoate
      - Canrenone
      - Chlorothiazide
      - Chlorthalidone
      - Cholera Vaccine, Live
      - Clopamide
      - Cyclopenthiazide
      - Cyclothiazide
      - Diazoxide
      - Eplerenone
      - Ethacrynic Acid
      - Etozolin
      - Furosemide
      - Hydrochlorothiazide
      - Hydroflumethiazide
      - Indapamide
      - Methyclothiazide
      - Metolazone
      - Piretanide
      - Polythiazide
      - Quinethazone
      - Spironolactone
      - Torsemide
      - Triamterene
      - Trichlormethiazide
      - Warfarin
      - Xipamide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to cephalosporins or beta-lactams, known or history of—Should not
        be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease or
      - Poor nutrition status—Use with caution. May increase the risk for serious
        side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      It is given through an IV catheter placed into one of your veins. This medicine
      must be given slowly, so the IV will have to stay in place for at least 2 hours.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress while you are
      receiving this medicine to see if the medicine is working properly and to decide
      if you should continue to receive it. Blood and urine tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth after using
      this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have agitation, back pain, blurred
      vision, coma, confusion, dizziness, drowsiness, fever, hallucinations, headache,
      irritability, mood or mental changes, muscle twitching or jerking, problems
      with speech or speaking, rhythmic movement of the muscles, seizures, stiff neck,
      unusual tiredness or weakness, or vomiting. These may be symptoms of serious
      nervous system problems (eg, encephalopathy, aphasia, myoclonus, and seizures).
  - type: paragraph
    text: Cefepime and enmetazobactam combination injection may cause diarrhea, and
      in some cases it can be severe. It may occur 2 or more months after you stop
      receiving this medicine. Do not take any medicine to treat diarrhea without
      first checking with your doctor. Diarrhea medicines may make the diarrhea worse
      or make it last longer. If you have any questions about this or if mild diarrhea
      continues or gets worse, check with your doctor.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are receiving this medicine. The results of some tests (eg, urine glucose
      test) may be affected by this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - pale skin
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - chest pain
      - chills
      - confusion
      - cough
      - dizziness
      - fever
      - irregular heartbeat
      - mood or mental changes
      - muscle cramps in the hands, arms, feet, legs, or face
      - nausea or vomiting
      - numbness and tingling around the mouth, fingertips, or feet
      - painful or difficult urination
      - pinpoint red spots on the skin
      - restlessness
      - seizures
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach cramps
      - swollen glands
      - tenderness
      - tremor
      - watery or bloody diarrhea
      - weakness or heaviness of the legs
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - back or leg pain
      - blistering, peeling, or loosening of the skin
      - bloody or cloudy urine
      - chest tightness
      - clay-colored stools
      - coma
      - cough or hoarseness
      - dark urine
      - difficulty swallowing
      - drowsiness
      - hallucinations
      - headache
      - hives, itching, skin rash
      - increased menstrual flow or vaginal bleeding
      - irritability
      - joint or muscle pain
      - loss of appetite
      - lower back or side pain
      - muscle twitching or jerking
      - nosebleeds
      - paralysis
      - problems with speech or speaking
      - prolonged bleeding from cuts
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red irritated eyes
      - red skin lesions, often with a purple center
      - rhythmic movement of the muscles
      - stiff neck
      - sudden decrease in amount of urine
      - unpleasant breath odor
      - vomiting of blood
      - yellowing of the eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish color
      - changes in skin color
      - dry, red, hot, or irritated skin
      - swelling of the foot or leg
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - bloated, full feeling
      - excess air or gas in the stomach
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
