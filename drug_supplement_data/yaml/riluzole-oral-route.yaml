title: Riluzole (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Exservan
    - type: paragraph
      text: Rilutek
    - type: paragraph
      text: Tiglutik
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Riluzole is used to treat patients with amyotrophic lateral sclerosis (ALS),
      which is also known as Lou Gehrig's disease. Riluzole is not a cure for ALS,
      but it may extend survival for patients in the early stages of the disease or
      extend the time until a tracheostomy (breathing tube in the throat) is needed.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of riluzole in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of riluzole in the elderly. However,
        elderly patients are more likely to have age-related liver problems and are
        more sensitive to the effects of this medicine than younger adults, which
        may require caution and an adjustment in the dose for patients receiving riluzole.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Azathioprine
      - Capmatinib
      - Carbamazepine
      - Diazoxide
      - Levoketoconazole
      - Mercaptopurine
      - Methotrexate
      - Pixantrone
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bone marrow problems (eg, neutropenia) or
      - Liver disease, recent or history of or
      - Lung disease (eg, interstitial lung disease)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with patient instructions. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Place the oral film on top of the tongue one at a time. The film will stick
      to the tongue and begin to dissolve. Do not cut or split it. Do not take it
      with liquids. Do not talk, chew, or spit while the film dissolves.
  - type: paragraph
    text: Swallow the tablet whole. Do not break, crush, or chew it.
  - type: paragraph
    text: 'If you are using the oral liquid :'
  - type: list
    ordered: false
    items:
    - This medicine can be taken by the mouth or be given through PEG tubes.
    - Measure the oral liquid with the oral syringe that it comes with. Gently shake
      the oral liquid for at least 30 seconds before using it.
    - Press down on the bottle cap and turn it counterclockwise to open. If you are
      using it for the first time, place the bottle on a flat surface. Insert the
      ribbed end of the bottle adapter into the bottle by firmly pressing it in. Do
      not remove the bottle adapter after it is inserted.
    - Insert the syringe into the opening of the bottle adapter. Turn the bottle upside
      down. Slowly pull the plunger to withdraw a small amount of suspension. Then
      push the plunger all the way in to remove any air bubbles. Slowly pull the plunger
      back and draw up the prescribed dose. Turn the bottle upright and remove the
      oral syringe by gently twisting or pulling it out from the bottle adapter.
    - Place the tip of the oral syringe in the mouth towards the inside of the cheek.
      Swallow all the medicine.
    - 'If given through a PEG tube: Using a catheter-tip syringe, rinse the tube with
      30 milliliters (mL) of water. Then, inject the oral syringe with medicine into
      the PEG tube and rinse the tube with 30 mL water.'
  - type: paragraph
    text: Take this medicine on an empty stomach. Take it at least 1 hour before or
      2 hours after meals.
  - type: paragraph
    text: This medicine works best if there is a constant amount in the blood. To
      keep blood levels constant, take this medicine at the same time each day (eg,
      in the morning and in the evening) and do not miss any doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (film, suspension, tablets): For amyotrophic lateral
        sclerosis (ALS): Adults—50 milligrams (mg) (10 milliliters [mL]) 2 times a
        day (every 12 hours). Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For amyotrophic lateral sclerosis (ALS): Adults—50 milligrams (mg) (10 milliliters
        [mL]) 2 times a day (every 12 hours). Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—50 milligrams (mg) (10 milliliters [mL]) 2 times a day (every 12 hours).
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: 'Tablet : Skip the missed dose and take your next dose at the regular
        time. Do not use extra medicine to make up for a missed dose.'
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away any unused liquid after 15 days of opening the bottle.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Check with your doctor right away if you have a rash, stomach pain, pale
      stools, dark urine, loss of appetite, nausea, unusual tiredness or weakness,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Riluzole can temporarily lower the number of white blood cells in your blood,
      increasing the chance of getting an infection. If you can, avoid people with
      infections. Check with your doctor right away if you think you are getting an
      infection or if you have a fever or chills, cough or hoarseness, lower back
      or side pain, or painful or difficult urination.
  - type: paragraph
    text: Check with your doctor right away if you start having breathing problems,
      dry cough, chest pain, fever, or chills. These could be symptoms of a serious
      lung problem (eg, interstitial lung disease).
  - type: paragraph
    text: This medicine may cause pancreatitis (swelling of the pancreas). Check with
      your doctor right away if you have bloating, chills, constipation, dark urine,
      fast heartbeat, fever, indigestion, loss of appetite, nausea, pains in the stomach,
      side, or abdomen, possibly radiating to the back, vomiting, or yellow eyes or
      skin.
  - type: paragraph
    text: Tell your doctor if you have Japanese ancestry. You may need a lower dose
      of this medicine to avoid unwanted effects.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - blurred vision
      - chills
      - cough
      - dark urine
      - diarrhea
      - difficult, burning, or painful urination
      - fast, pounding, or irregular heartbeat or pulse
      - fever
      - frequent urge to urinate
      - general feeling of discomfort or illness
      - headache
      - increased cough
      - itching skin
      - joint pain
      - loss of appetite
      - lower back or side pain
      - muscle aches and pains
      - nausea
      - nervousness
      - persistent loss of appetite or weight loss
      - pounding in the ears
      - right upper quadrant tenderness
      - runny nose
      - shivering
      - slow heartbeat
      - sore throat
      - trouble sleeping
      - unusual tiredness or weakness
      - vomiting
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry, stools
      - bloating
      - constipation
      - decreased frequency or amount of urine
      - difficult breathing
      - increased thirst
      - indigestion
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - pale skin
      - swelling of the face, fingers, or lower legs
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - weight gain
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - back pain
      - bluish-colored lips, fingernails, or palms
      - blurred vision
      - coma
      - confusion
      - dark urine
      - difficulty breathing
      - dizziness or lightheadedness
      - drowsiness
      - fever
      - headache
      - irritability
      - memory loss
      - pale skin
      - rapid heart rate
      - seeing, hearing, or feeling things that are not there
      - seizures
      - sore throat
      - stiff neck
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - lack or loss of strength
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty moving
      - dizziness or lightheadedness
      - dry mouth
      - excess air or gas in the stomach or bowels
      - feeling of constant movement of self or surroundings
      - full feeling
      - muscle stiffness
      - passing gas
      - rapid weight gain
      - sensation of spinning
      - skin rash, encrusted, scaly and oozing
      - sleepiness or unusual drowsiness
      - stomach pain
      - tingling of the hands or feet
      - unusual weight gain or loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
