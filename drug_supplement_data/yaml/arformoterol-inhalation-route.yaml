    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm, back, or jaw pain
      - blurred vision
      - chest discomfort, tightness, or heaviness
      - confusion
      - decreased urine
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - drowsiness
      - dry mouth
      - fast, pounding, or irregular heartbeat or pulse
      - increased thirst
      - loss of consciousness
      - mood changes
      - muscle pain, cramps, or tremors
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - pounding in the ears
      - rapid, deep breathing
      - restlessness
      - seizures
      - slow heartbeat
      - stomach cramps
      - tremor
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blindness
      - bloody, black, or tarry stools
      - blurred vision
      - burning feeling in the chest or stomach
      - change in vision
      - change in voice
      - constipation
      - decreased vision
      - difficulty in moving
      - dry skin
      - eye pain
      - indigestion
      - leg cramps
      - muscle stiffness
      - pain, swelling, or redness in the joints
      - pelvic pain
      - skin color changes
      - stomach upset
      - tearing
      - tenderness in the stomach area
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
