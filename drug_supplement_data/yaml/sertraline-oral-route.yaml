    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bipolar disorder (mood disorder with mania and depression), or risk of or
      - Bleeding problems or
      - Diabetes or
      - Glaucoma, angle-closure, or history of or
      - Heart rhythm problems (eg, QT prolongation) or
      - Hyponatremia (low sodium in the blood) or
      - Mania or hypomania, history of or
      - Purpura (purplish or brownish-red discoloration of the skin), history of or
      - Seizures, history of or
      - Sexual problems—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor , to benefit your condition
      as much as possible. Do not take more of it, do not take it more often, and
      do not take it for a longer time than your doctor ordered.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: The tablets may be taken with or without food.
  - type: paragraph
    text: If you are taking the oral liquid , use the dropper provided to measure
      your dose and mix it with 1/2 cup (4 ounces) of water, ginger ale, lemon-lime
      soda, lemonade, or orange juice. Do not mix this medicine with any other liquid.
      Drink it right away after mixing. Do not mix the medicine with the liquid until
      you are ready to take your dose. It is okay if the mixture looks hazy.
  - type: paragraph
    text: You may have to take this medicine for several months before you begin to
      feel better.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (solution or tablets): For depression: Adults—At first,
        50 milligrams (mg) once a day, taken either in the morning or evening. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than 200 mg per day. Children—Use and dose must be determined by your doctor.
        For obsessive-compulsive disorder: Adults and teenagers—At first, 50 milligrams
        (mg) once a day, taken either in the morning or evening. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 200 mg per
        day. Children 6 to 12 years of age—At first, 25 mg once a day, taken either
        in the morning or evening. Your doctor may adjust your dose as needed. However,
        the dose is usually not more than 200 mg per day. Children younger than 6
        years of age—Use and dose must be determined by your doctor. For panic disorder,
        posttraumatic stress disorder, or social anxiety disorder: Adults—At first,
        25 milligrams (mg) once a day, taken either in the morning or evening. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than 200 mg per day. Children—Use and dose must be determined by your doctor.
        For premenstrual dysphoric disorder: Adults—At first, 50 milligrams (mg) once
        a day throughout your menstrual cycle or just during the premenstrual time.
        Your doctor may adjust your dose as needed. However, the dose is usually not
        more than 150 mg per day throughout your menstrual cycle or 100 mg per day
        if you are only taking it during your premenstrual time. Children—Use and
        dose must be determined by your doctor.'
    - type: list
