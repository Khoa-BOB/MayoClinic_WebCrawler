    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits . This is to allow for changes in your dose and to help reduce
      any side effects. Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not take sertraline with a monoamine oxidase (MAO) inhibitor (eg, isocarboxazid
      [Marplan®], phenelzine [Nardil®], selegiline [Eldepryl®], tranylcypromine [Parnate®]).
      Do not start taking sertraline during the 14 days after you stop a MAO inhibitor
      and wait 14 days after stopping sertraline before you start taking a MAO inhibitor.
      If you take them together or do not wait 14 days, you may develop confusion,
      agitation, restlessness, stomach or intestinal symptoms, a sudden high body
      temperature, an extremely high blood pressure, or severe convulsions.
  - type: paragraph
    text: Do not use pimozide (Orap®) while you are taking this medicine. Do not use
      the oral liquid form of sertraline if you are also using disulfiram (Antabuse®).
      Using these medicines together can cause serious problems .
  - type: paragraph
    text: Sertraline may cause a serious condition called serotonin syndrome if taken
      together with some medicines. Do not use sertraline with buspirone (Buspar®),
      fentanyl (Abstral®, Duragesic®), linezolid (Zyvox®), lithium (Eskalith®, Lithobid®),
      methylene blue injection, tryptophan, St John's wort, or some pain or migraine
      medicines (eg, meperidine, methadone, rizatriptan, sumatriptan, tramadol, Demerol®,
      Frova®, Imitrex®, Maxalt®, Methadose®, Relpax®, Ultram®, Zomig®). Check with
      your doctor first before taking any other medicines with sertraline .
  - type: paragraph
    text: For some children, teenagers, and young adults, this medicine can increase
      thoughts of suicide. Tell your doctor right away if you or your child start
      to feel more depressed and have thoughts about hurting yourselves. Report any
      unusual thoughts or behaviors that trouble you or your child, especially if
      they are new or get worse quickly. Make sure the doctor knows if you or your
      child have trouble sleeping, get upset easily, have a big increase in energy,
      or start to act reckless. Also tell the doctor if you or your child have sudden
      or strong feelings, including feeling nervous, angry, restless, violent, or
      scared. Let the doctor know if you, your child, or anyone in your family has
      bipolar disorder (manic-depressive) or has tried to commit suicide.
  - type: paragraph
    text: Sertraline may increase your risk for bleeding problems. Make sure your
      doctor knows if you or your child are also using other medicines that thin the
      blood, including NSAIDs (eg, aspirin, diclofenac, ibuprofen, naproxen, Advil®,
      Aleve®, Celebrex®, Voltaren®) or warfarin (Coumadin®, Jantoven®).
  - type: paragraph
    text: This medicine may cause hyponatremia (low sodium in the blood). This is
      more common in elderly patients, those who are taking diuretic medicines for
      high blood pressure, or those who have decreased amounts of fluid in the body
      due to severe diarrhea or vomiting. Check with your doctor right away if you
      or your child have headache, trouble concentrating, memory problems, confusion,
      weakness, or unsteadiness.
  - type: paragraph
    text: Check with your doctor right away if you have chest pain or discomfort,
      fainting, irregular or slow heart rate, or trouble breathing. These may be symptoms
      of heart rhythm problems, including QT prolongation and torsades de pointes.
  - type: paragraph
    text: Check with your doctor right away if you have decreased interest in sexual
      intercourse, delayed or inability to have and orgasm, inability to have or keep
      an erection, or loss in sexual ability, desire, drive, or performance. These
      could be symptoms of sexual dysfunction.
  - type: paragraph
    text: This medicine may affect blood sugar levels. If you are diabetic and notice
      a change in the results of your blood or urine sugar tests, talk with your doctor.
  - type: paragraph
    text: The use of alcohol is not recommended in patients who are taking sertraline.
  - type: paragraph
    text: This medicine may cause some people to become drowsy, to have trouble thinking,
      or to have problems with movement. Make sure you know how you react to this
      medicine before you drive, use machines, or do anything else that could be dangerous
      if you are not alert or well-coordinated .
  - type: paragraph
    text: The dropper dispenser for the oral liquid contains dry natural rubber (a
      derivative of latex). This may cause allergic reactions in people who are sensitive
      to latex. Tell your doctor if you or your child have a latex allergy before
      you start using this medicine.
  - type: paragraph
    text: Do not stop taking this medicine without checking first with your doctor
      . Your doctor may want you to gradually reduce the amount you are taking before
      stopping it completely. This is to decrease the chance of having side effects
      including agitation, anxiety, dizziness, a feeling of constant movement of self
      or surroundings, headache, increased sweating, nausea, trembling or shaking,
      trouble with sleeping or walking, or unusual tiredness when you stop the medicine.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you or your child are taking this medicine. The results of some tests may be
      affected by this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
