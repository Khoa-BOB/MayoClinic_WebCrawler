- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Erythromycin belongs to the family of medicines called antibiotics. Erythromycin
      topical preparations are used on the skin to help control acne. They may be
      used alone or with one or more other medicines that are applied to the skin
      or taken by mouth for acne. They may also be used for other problems, such as
      skin infections, as determined by your doctor.
  - type: paragraph
    text: Erythromycin is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
    - Gel/Jelly
    - Pad
    - Powder
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Erythromycin topical solution has been tested in children 12 years of
        age and older and, in effective doses, has not been shown to cause different
        side effects or problems than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of topical
        erythromycin in the elderly with use in other age groups, this medicine is
        not expected to cause different side effects or problems in older people than
        it does in younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Clindamycin
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Before applying this medicine, thoroughly wash the affected area with warm
      water and soap, rinse well, and pat dry. After washing or shaving, it is best
      to wait 30 minutes before applying the pledget (swab), topical gel, or topical
      liquid form. The alcohol in them may irritate freshly washed or shaved skin.
  - type: paragraph
    text: 'For patients using the pledget (swab), topical gel, or topical liquid form
      of erythromycin:'
  - type: list
    ordered: false
    items:
    - These forms contain alcohol and are flammable. Do not use near heat, near open
      flame, or while smoking.
    - It is important that you do not use this medicine more often than your doctor
      ordered. It may cause your skin to become too dry or irritated.
    - Also, you should avoid washing the acne-affected areas too often. This may dry
      your skin and make your acne worse. Washing with a mild, bland soap 2 or 3 times
      a day should be enough, unless you have oily skin. If you have any questions
      about this, check with your doctor.
    - 'To use: The topical liquid form of this medicine may come in a bottle with
      an applicator tip, which may be used to apply the medicine directly to the skin.
      Use the applicator with a dabbing motion instead of a rolling motion (not like
      a roll-on deodorant, for example). If the medicine does not come in an applicator
      bottle, you may moisten a pad with the medicine and then rub the pad over the
      whole affected area. Or you may also apply this medicine with your fingertips.
      Be sure to wash the medicine off your hands afterward. Apply a thin film of
      medicine, using enough to cover the affected area lightly. You should apply
      the medicine to the whole area usually affected by acne, not just to the pimples
      themselves. This will help keep new pimples from breaking out. The pledget (swab)
      form should be rubbed over the whole affected area. You may use extra pledgets
      (swabs), if needed, to cover larger areas. Since these medicines contain alcohol,
      they may sting or burn. Therefore, do not get these medicines in the eyes, nose,
      mouth, or on other mucous membranes. Spread the medicine away from these areas
      when applying. If these medicines do get in the eyes, wash them out immediately,
      but carefully, with large amounts of cool tap water. If your eyes still burn
      or are painful, check with your doctor.'
  - type: list
    ordered: false
    items:
    - The topical liquid form of this medicine may come in a bottle with an applicator
      tip, which may be used to apply the medicine directly to the skin. Use the applicator
      with a dabbing motion instead of a rolling motion (not like a roll-on deodorant,
      for example). If the medicine does not come in an applicator bottle, you may
      moisten a pad with the medicine and then rub the pad over the whole affected
      area. Or you may also apply this medicine with your fingertips. Be sure to wash
      the medicine off your hands afterward.
    - Apply a thin film of medicine, using enough to cover the affected area lightly.
      You should apply the medicine to the whole area usually affected by acne, not
      just to the pimples themselves. This will help keep new pimples from breaking
      out.
    - The pledget (swab) form should be rubbed over the whole affected area. You may
      use extra pledgets (swabs), if needed, to cover larger areas.
    - Since these medicines contain alcohol, they may sting or burn. Therefore, do
      not get these medicines in the eyes, nose, mouth, or on other mucous membranes.
      Spread the medicine away from these areas when applying. If these medicines
      do get in the eyes, wash them out immediately, but carefully, with large amounts
      of cool tap water. If your eyes still burn or are painful, check with your doctor.
  - type: paragraph
    text: This medicine will not cure your acne. However, to help keep your acne under
      control, keep using this medicine for the full time of treatment, even if your
      symptoms begin to clear up after a few days. You may have to continue using
      this medicine every day for months or even longer in some cases. If you stop
      using this medicine too soon, your symptoms may return. It is important that
      you do not miss any doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For acne: For gel dosage form: Adults—Apply to the affected area(s) of the
        skin two times a day, morning and evening. Children—Dose must be determined
        by your doctor. For ointment dosage form: Adults, teenagers, and children—Apply
        to the affected area(s) of the skin two times a day, morning and evening.
        For pledgets dosage form: Adults, teenagers, and children—Apply to the affected
        area(s) of the skin two times a day. For topical solution dosage form: Adults,
        teenagers, and children 12 years of age and over—Apply to the affected area(s)
        of the skin two times a day, morning and evening. Children up to 12 years
        of age—Dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For gel dosage form: Adults—Apply to the affected area(s) of the skin two
        times a day, morning and evening. Children—Dose must be determined by your
        doctor.'
      - 'For ointment dosage form: Adults, teenagers, and children—Apply to the affected
        area(s) of the skin two times a day, morning and evening.'
      - 'For pledgets dosage form: Adults, teenagers, and children—Apply to the affected
        area(s) of the skin two times a day.'
      - 'For topical solution dosage form: Adults, teenagers, and children 12 years
        of age and over—Apply to the affected area(s) of the skin two times a day,
        morning and evening. Children up to 12 years of age—Dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply to the affected area(s) of the skin two times a day, morning
        and evening.
      - Children—Dose must be determined by your doctor.
    - type: list
