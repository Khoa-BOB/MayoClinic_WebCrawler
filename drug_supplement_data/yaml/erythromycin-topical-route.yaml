      - Children up to 12 years of age—Dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your acne does not improve within 3 to 4 weeks, or if it becomes worse,
      check with your health care professional. However, treatment of acne may take
      up to 8 to 12 weeks before you see full improvement.
  - type: paragraph
    text: 'For patients using the pledget (swab), topical gel, or topical liquid form
      of erythromycin:'
  - type: list
    ordered: false
    items:
    - If your doctor has ordered another medicine to be applied to the skin along
      with this medicine, it is best to wait at least 1 hour before you apply the
      second medicine. This may help keep your skin from becoming too irritated. Also,
      if the medicines are used too close together, they may not work properly.
    - After application of this medicine to the skin, mild stinging or burning may
      be expected and may last up to a few minutes or more.
    - This medicine may also cause the skin to become unusually dry, even with normal
      use. If this occurs, check with your doctor.
    - You may continue to use cosmetics (make-up) while you are using this medicine
      for acne. However, it is best to use only ``water-base'' cosmetics. Also, it
      is best not to use cosmetics too heavily or too often. They may make your acne
      worse. If you have any questions about this, check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  subsections:
