title: Ergotamine (oral route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ergotamine is used to treat or prevent vascular headaches, including migraine,
      migraine variants, or histaminic cephalalgia. It will not relieve pain other
      than from migraine headaches.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of ergotamine in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of ergotamine in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Almotriptan
      - Amprenavir
      - Atazanavir
      - Boceprevir
      - Ceritinib
      - Clarithromycin
      - Cobicistat
      - Conivaptan
      - Darunavir
      - Delavirdine
      - Dihydroergotamine
      - Dopamine
      - Eletriptan
      - Fosamprenavir
      - Frovatriptan
      - Idelalisib
      - Indinavir
      - Itraconazole
      - Ketoconazole
      - Letermovir
      - Levoketoconazole
      - Lonafarnib
      - Mifepristone
      - Naratriptan
      - Nefazodone
      - Nelfinavir
      - Nirmatrelvir
      - Paritaprevir
      - Posaconazole
      - Ribociclib
      - Ritonavir
      - Rizatriptan
      - Saquinavir
      - Sumatriptan
      - Telaprevir
      - Telithromycin
      - Tipranavir
      - Troleandomycin
      - Tucatinib
      - Voriconazole
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Alefacept
      - Apalutamide
      - Asciminib
      - Avacopan
      - Azithromycin
      - Belzutifan
      - Berotralstat
      - Carbamazepine
      - Clotrimazole
      - Crizotinib
      - Dabrafenib
      - Daridorexant
      - Enasidenib
      - Enzalutamide
      - Epinephrine
      - Fedratinib
      - Fexinidazole
      - Fluconazole
      - Fluoxetine
      - Fluvoxamine
      - Fosnetupitant
      - Gepotidacin
      - Imatinib
      - Ivacaftor
      - Lanreotide
      - Lazertinib
      - Lefamulin
      - Lenacapavir
      - Lorlatinib
      - Lumacaftor
      - Mavorixafor
      - Mitotane
      - Mobocertinib
      - Netupitant
      - Nevirapine
      - Nirogacestat
      - Octreotide
      - Omaveloxolone
      - Pacritinib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Propranolol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease—Use with caution. May make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. If too much of this medicine is taken for a long time, it may
      become habit-forming (causing serious unwanted effects).
  - type: paragraph
    text: Place the sublingual tablet under your tongue until it dissolves. Do not
      chew or swallow it.
  - type: paragraph
    text: This medicine works best if you take it at the first sign of a migraine
      headache.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For migraine headaches: Adults—2 milligrams
        (mg) (1 tablet) placed under the tongue at the first sign of a migraine attack,
        followed by 2 mg every 30 minutes. Do not use more than 3 tablets in a day
        or 5 tablets in a week. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For migraine headaches: Adults—2 milligrams (mg) (1 tablet) placed under
        the tongue at the first sign of a migraine attack, followed by 2 mg every
        30 minutes. Do not use more than 3 tablets in a day or 5 tablets in a week.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—2 milligrams (mg) (1 tablet) placed under the tongue at the first sign
        of a migraine attack, followed by 2 mg every 30 minutes. Do not use more than
        3 tablets in a day or 5 tablets in a week.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to decide if you should continue to use it.
  - type: paragraph
    text: Using this medicine could harm your unborn baby. Use an effective form of
      birth control to keep from getting pregnant. Tell your doctor right away if
      you think you have become pregnant.
  - type: paragraph
    text: Do not use this medicine together with clarithromycin (Biaxin®), erythromycin
      (Erythrocin®), indinavir (Crixivan®), itraconazole (Sporanox®), ketoconazole
      (Nizoral®), nelfinavir (Viracept®), ritonavir (Norvir®), or troleandomycin (Tao®).
  - type: paragraph
    text: This medicine may be habit-forming. If you feel that the medicine is not
      working as well, do not use more than your prescribed dose. Call your doctor
      for instructions.
  - type: paragraph
    text: This medicine may cause stomach problems (eg, retroperitoneal fibrosis).
      Check with your doctor right away if you have continuing or severe stomach pain,
      increased frequency of urination, continuing loss of appetite, lower back pain,
      continuing or severe nausea and vomiting, or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have chest pain or tightness, or
      trouble breathing. These may be symptoms of a lung problem (eg, pleuropulmonary
      fibrosis).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain, discomfort, or tightness
      - cold, pale, or a bluish color skin of the fingers or toes
      - continuing loss of appetite
      - continuing or severe nausea and vomiting
      - continuing or severe stomach pain
      - increased frequency of urination
      - irregular heartbeat
      - itching skin
      - lower back pain
      - numbness or tingling of the fingers or toes
      - pain in the fingers or toes
      - pain in arms legs, or lower back, especially pain in calves or heels upon
        exertion
      - sweating
      - swelling of hands, ankles, feet, or lower legs
      - weakness
      - weak or absent pulses in the legs
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - change or loss of consciousness
      - cold clammy skin
      - decreased awareness or responsiveness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - headache
      - nervousness
      - numbness, tingling, pain, and bluish color of the fingernails, lips, skin,
        palms, or nail beds
      - pounding in the ears
      - seizures
      - severe sleepiness
      - slow or fast heartbeat
      - sweating
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - dizziness or lightheadedness
      - feeling of constant movement of self or surroundings
      - sensation of spinning
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
