    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Cranberry
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to amoxicillin or penicillins or cephalosporins, history of or
      - Allergy to clarithromycin, erythromycin, or macrolide antibiotics or
      - Allergy to lansoprazole—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Cholestatic jaundice, history of or
      - Heart rhythm problems (eg, QT prolongation, torsades de pointes, ventricular
        arrhythmia), history of or
      - Liver disease, history of—Should not be used in patients with a history of
        these conditions caused by clarithromycin.
    - type: list
      ordered: false
      items:
      - Diarrhea or
      - Kidney disease or
      - Liver disease or
      - Myasthenia gravis (severe muscle weakness) or
      - Systemic lupus erythematosus (SLE)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Hypokalemia (low potassium in the blood), uncorrected or
      - Hypomagnesemia (low magnesium in the blood), uncorrected—Should be corrected
        first before using this medicine.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe—Use is not recommended in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: 'Prevpac® comes with an individual daily administration card that contains:
      2 pink and black capsules of lansoprazole, 4 opaque, yellow capsules of amoxicillin,
      and 2 yellow tablets of clarithromycin.'
  - type: paragraph
    text: Swallow the capsules and tablet whole. Do not crush, break, chew, or open
      any of them. Take each dose on an empty stomach, before a meal.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you feel
      better after the first few doses. Your infection may not clear up if you stop
      using the medicine too soon.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (kit): For treatment of duodenal ulcers and H. pylori
        infections: Adults—30 milligrams (mg) or 1 capsule of lansoprazole, 1000 mg
        or 2 capsules of amoxicillin, and 500 mg or 1 tablet of clarithromycin taken
        together two times per day (morning and evening) for 10 or 14 days. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of duodenal ulcers and H. pylori infections: Adults—30 milligrams
        (mg) or 1 capsule of lansoprazole, 1000 mg or 2 capsules of amoxicillin, and
        500 mg or 1 tablet of clarithromycin taken together two times per day (morning
        and evening) for 10 or 14 days. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—30 milligrams (mg) or 1 capsule of lansoprazole, 1000 mg or 2 capsules
        of amoxicillin, and 500 mg or 1 tablet of clarithromycin taken together two
        times per day (morning and evening) for 10 or 14 days.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits .
      This will allow your doctor to see if the medicine is working properly and to
      decide if you should continue to take it. Blood, urine, and other laboratory
      tests may be needed to check for unwanted effects. If your condition does not
      improve, or if it becomes worse, talk with your doctor.
  - type: paragraph
    text: Do not use this medicine if you are also using astemizole (Hismanal®), atazanavir
      (Reyataz®), cisapride (Propulsid®), lovastatin (Mevacor®), pimozide (Orap®),
      simvastatin (Zocor®), terfenadine (Seldane®), certain ergot medicines (such
      as dihydroergotamine, ergotamine, D.H.E. 45®, Ergomar®, Ergostat®, or Migranal®),
      or medicines containing rilpivirine. If you have kidney or liver disease, do
      not take this medicine together with colchicine (Colcrys®). Using these medicines
      together may increase risk for more serious side effects .
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis.
      This can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, fever or chills, hoarseness,
      sores or ulcers on the skin, trouble breathing, trouble swallowing, or any swelling
      of your hands, face, mouth, or throat while you are using this medicine.
  - type: paragraph
    text: Make sure your doctor knows if you are pregnant or planning to become pregnant.
      If you become pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you or anyone in your family has ever
      had a heart rhythm problem such as QT prolongation.
  - type: paragraph
    text: Check with your doctor right away if you have a fever, joint pain, skin
      rash, swelling of the body, feet, or ankles, or unusual weight gain after receiving
      this medicine. These could be symptoms of serious kidney problem called acute
      interstitial nephritis.
  - type: paragraph
    text: This medicine may cause diarrhea, and in some cases it can be severe. It
      may occur 2 months or more after you stop taking this medicine. Do not take
      any medicine to treat diarrhea without first checking with your doctor. If you
      have any questions or if mild diarrhea continues or gets worse, check with your
      doctor.
  - type: paragraph
    text: Cutaneous or systemic lupus erythematosus may occur or get worse in patients
      receiving a PPI. Call your doctor right away if you have joint pain or a skin
      rash on your cheeks or arms that gets worse when exposed to the sun.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect the results of certain medical tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - chills
      - clay colored stools
      - dark urine
      - diarrhea
      - difficulty with swallowing
      - dizziness or fainting
      - fast, slow, or irregular heartbeat
      - fever
      - headache
      - hives, itching, or skin rash
      - joint or muscle pain
      - loss of appetite
      - nausea
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach pain or tenderness
      - swelling of the body, feet, and ankles
      - tightness in the chest
      - unusual tiredness or weakness
      - unusual weight gain
      - vomiting
      - watery and severe diarrhea, which may also be bloody
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bad, unusual or unpleasant (after) taste
      - change in taste
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - discoloration of the tongue
      - itching of the vagina or genital area
      - pain during sexual intercourse
      - redness, swelling, or soreness of the tongue
      - sore mouth or tongue
      - thick, white vaginal discharge with no odor or with a mild odor
      - white patches in the mouth, tongue, or throat
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
