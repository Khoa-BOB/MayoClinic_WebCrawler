title: Octreotide (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Mycapssa
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Octreotide is used for the long-term treatment of acromegaly (a growth hormone
      disorder) in patients who have been previously treated with octreotide or lanreotide.
      This medicine works by reducing the amount of growth hormone that the body produces.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule, Delayed Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of octreotide in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of octreotide in the elderly. However,
        elderly patients are more sensitive to the effects of this medicine than younger
        adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Levoketoconazole
      - Levomethadyl
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abemaciclib
      - Acalabrutinib
      - Acarbose
      - Acecainide
      - Acetophenazine
      - Adagrasib
      - Ajmaline
      - Albiglutide
      - Alfentanil
      - Alogliptin
      - Aluminum Carbonate, Basic
      - Aluminum Hydroxide
      - Aluminum Phosphate
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amoxapine
      - Anagrelide
      - Apomorphine
      - Aprindine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Axitinib
      - Azimilide
      - Azithromycin
      - Bedaquiline
      - Bosutinib
      - Bretylium
      - Brigatinib
      - Buprenorphine
      - Buserelin
      - Calcium Carbonate
      - Calcium Silicate
      - Canagliflozin
      - Ceritinib
      - Chloral Hydrate
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Lisinopril
      - Pegvisomant
      - Telotristat Ethyl
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Gallbladder disease or
      - Heart rhythm problems or
      - Thyroid problems or
      - Vitamin B12 deficiency—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - End-stage kidney disease or
      - Liver disease (eg, cirrhosis, fatty liver disease)—Use with caution. The effects
        may be increased because of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Take this medicine with a glass of water on an empty stomach, at least 1
      hour before or at least 2 hours after a meal.
  - type: paragraph
    text: Swallow the delayed-release capsule whole. Do not crush, break, or chew
      it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (delayed-release capsules): For acromegaly: Adults—At
        first, 20 milligrams (mg) 2 times a day. Your doctor may adjust your dose
        as needed and tolerated. However, the dose is usually not more than 80 mg
        per day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For acromegaly: Adults—At first, 20 milligrams (mg) 2 times a day. Your doctor
        may adjust your dose as needed and tolerated. However, the dose is usually
        not more than 80 mg per day. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 20 milligrams (mg) 2 times a day. Your doctor may adjust
        your dose as needed and tolerated. However, the dose is usually not more than
        80 mg per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: You may keep the opened medicine at room temperature for up to 1 month.
        Throw away any unused medicine after 1 month.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may increase your risk of having gallstones (cholelithiasis),
      which may lead to swelling of the gallbladder (cholecystitis), bile ducts (cholangitis),
      or pancreas (pancreatitis). Check with your doctor right away if you have severe
      stomach pain with nausea and vomiting, indigestion, fever, chills, pains in
      the stomach or side, possibly radiating to the back, fast heartbeat, dark urine,
      bloating, or yellow eyes or skin.
  - type: paragraph
    text: This medicine may cause your blood sugar levels to rise or fall. It may
      cover up signs of hypoglycemia (low blood sugar), such as a change in your pulse
      rate. If you notice a change in the results of your blood sugar or urine sugar
      test, check with your doctor.
  - type: paragraph
    text: Octreotide may cause hypothyroidism (underactive thyroid gland). Check with
      your doctor right away if you have constipation, a depressed mood, dry skin
      and hair, cold skin, hair loss, hoarseness or husky voice, muscle cramps and
      stiffness, a slow heartbeat, weight gain, or unusual tiredness or weakness.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, slow, pounding, or
      uneven heartbeat. Make sure your doctor knows if you had a heart rhythm problem,
      such as QT prolongation.
  - type: paragraph
    text: This medicine may cause problems with absorbing dietary fats and steatorrhea
      (fatty stools). Check with your doctor right away if you have diarrhea, fat
      in stools, stomach bloating or cramps, or sudden weight loss.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction, called anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing
      or swallowing, or any swelling of your hands, face, or mouth after using this
      medicine.
  - type: paragraph
    text: This medicine may increase fertility in some women, which could increase
      the risk for unplanned pregnancies. Talk to your doctor if you have any concerns.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are using this medicine. The results of some tests may be affected by this
      medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - blurred vision
      - chest tightness
      - chills
      - cough
      - diarrhea
      - difficult, burning, or painful urination
      - dry mouth
      - fever
      - flushed, dry skin
      - frequent urge to urinate
      - fruit-like breath odor
      - gaseous stomach pain
      - general feeling of discomfort or illness
      - headache
      - increased hunger
      - increased thirst
      - increased urination
      - joint pain
      - loss of appetite
      - lower back or side pain
      - muscle aches or pains
      - nausea
      - pain or tenderness around the eyes and cheekbones
      - recurrent fever
      - shivering
      - sore throat
      - stomach pain or fullness
      - stuffy or runny nose
      - sweating
      - swelling of the hands, ankles, feet, or lower legs
      - trouble breathing
      - trouble sleeping
      - unexplained weight loss
      - unusual tiredness or weakness
      - vomiting
      - yellow eyes or skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - body aches or pain
      - burning feeling in the chest or stomach
      - cold sweats
      - confusion
      - constipation
      - cool, pale skin
      - depressed mood
      - dizziness
      - dry skin and hair
      - ear congestion
      - fainting
      - fast, slow, or irregular heartbeat
      - hair loss
      - hoarseness or husky voice
      - indigestion
      - loss of consciousness
      - loss of voice
      - muscle cramps or stiffness
      - nervousness
      - nightmares
      - pounding in the ears
      - seizures
      - shakiness
      - slurred speech
      - sneezing
      - stomach upset or tenderness
      - weight gain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blindness
      - bloating
      - blood in vomit
      - change in the frequency or amount of urine
      - changes in vision
      - chest pain or discomfort
      - dark urine
      - darkening of the skin
      - deafness
      - decreased vision
      - dizziness, fainting, or lightheadedness when getting up suddenly from lying
        or sitting position
      - double vision
      - eye pain
      - fat in stools
      - hives, skin rash
      - itching, pain, redness, swelling, tenderness, or warmth of the skin
      - light-colored stools
      - loss of appetite
      - migraine headache
      - pain or discomfort in the arms, jaw, back, or neck
      - pale skin
      - paleness or cold feeling in the fingertips and toes
      - pinpoint red spots on the skin
      - problems with speech or speaking
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - severe cramping
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach cramps
      - tearing
      - tingling or pain in the fingers or toes when exposed to cold temperature
      - unusual bleeding or bruising
      - vomiting of blood or material that looks like coffee grounds
      - weakness of the muscles in your face
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty in moving
      - joint swelling or redness
      - lack or loss of strength
      - passing gas
      - pressure in the stomach
      - swelling of the abdominal or stomach area
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding after defecation
      - uncomfortable swelling around the anus
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased interest in sexual intercourse
      - inability to have or keep an erection
      - loss in sexual ability, desire, drive, or performance
      - swelling of the breasts or breast soreness in both females and males
      - unexpected or excess milk flow from breasts
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
