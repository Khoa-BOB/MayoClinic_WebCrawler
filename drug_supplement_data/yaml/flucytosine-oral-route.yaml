title: Flucytosine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ancobon
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Flucytosine is used in combination with other medicine (eg, amphotericin
      B) to treat serious fungus infections, including Candida infections (eg, septicemia,
      endocarditis, urinary tract infections) or Cryptococcus infections (eg, meningitis,
      lung infections). This medicine works by killing the fungus or preventing its
      growth.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of flucytosine in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of flucytosine in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Levomethadyl
      - Tegafur
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Zidovudine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood disease or
      - Bone marrow depression or
      - Hypokalemia (low potassium in the blood) or
      - Liver disease or
      - Weak immune system—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Dihydropyrimidine dehydrogenase (DPD) enzyme deficiency (rare hereditary problem)—Should
        not be used in patients with this condition. May increase the risk of serious
        side effects (eg, drug toxicity).
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you feel
      better after the first few doses. Your infection may not clear up if you stop
      using the medicine too soon.
  - type: paragraph
    text: Swallow one capsule at a time over a 15 minute period to help prevent nausea
      and vomiting.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For fungus infections: Adults—Dose is based
        on body weight and must be determined by your doctor. The dose is usually
        50 to 150 milligrams (mg) per kilogram (kg) of body weight per day, taken
        every 6 hours. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For fungus infections: Adults—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 50 to 150 milligrams (mg) per kilogram
        (kg) of body weight per day, taken every 6 hours. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Dose is based on body weight and must be determined by your doctor.
        The dose is usually 50 to 150 milligrams (mg) per kilogram (kg) of body weight
        per day, taken every 6 hours.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: Do not take other medicines unless thy have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - black, bloody, tarry stools
      - blistering, peeling, or loosening of the skin
      - bloody or cloudy urine
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - burning upper abdominal or stomach pain
      - change in consciousness
      - chest pain or tightness
      - chills
      - confusion
      - cough or hoarseness
      - dark urine
      - decreased urine output
      - depression
      - diarrhea
      - dizziness
      - dry mouth
      - feeling of constant movement of self or surroundings
      - fever
      - headache
      - hearing loss
      - hives, itching, skin rash
      - increased sensitivity of the skin to sunlight
      - irregular heartbeat
      - irritability
      - joint or muscle pain
      - light-colored stools
      - loss of appetite
      - loss of consciousness
      - lower back or side pain
      - mood changes
      - muscle cramps or twitching
      - nausea
      - no blood pressure or pulse
      - no breathing
      - numbness or tingling in the hands, feet, or lips
      - painful or difficult urination
      - pain in the lower back or side
      - pale skin
      - rapid weight gain
      - rectal bleeding
      - red irritated eyes
      - red skin lesions, often with a purple center
      - redness of the skin
      - seeing, hearing, or feeling things that are not there
      - seizures
      - sensation of spinning
      - severe sunburn
      - shakiness and unsteady walk
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stopping of the heart
      - swelling of the face, ankles, or hands
      - swollen glands
      - thirst
      - trouble breathing
      - unpleasant breath odor
      - unsteadiness, trembling, or other problems with muscle control or coordination
      - unusual bleeding or bruising
      - unusual drowsiness, dullness, tiredness, weakness or feeling of sluggishness
      - vomiting
      - vomiting of blood or material that looks like coffee grounds
      - weakness in the arms, hands, legs, or feet
      - weight loss
      - yellow eyes or skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
