title: Iodine povacrylex and isopropyl alcohol (topical application route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Duraprep
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Iodine povacrylex and isopropyl alcohol topical is used to clean the skin
      before surgery and helps reduce bacteria that may cause skin infection. It works
      by killing or preventing the growth of bacteria on the skin.
  - type: paragraph
    text: This medicine is available without a prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use in children younger than 2 months of age is not recommended because
        of the risk of serious skin irritation and hypothyroidism (low thyroid levels).
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of Duraprep™ in geriatric patients.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Open wounds—Should not be used in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: You may be instructed to use this medicine at home. It is very important
      that you use this medicine only as directed by your doctor . Do not use more
      of it, do not use it more often, and do not use it for a longer time than your
      doctor ordered. To do so may cause irritation of the skin.
  - type: paragraph
    text: Duraprep™ should only be used on the skin. Do not use on open wounds or
      as a general skin cleanser. Do not get it in the eyes, ears, mouth, or nose.
      If it does get on these areas, rinse it off right away.
  - type: paragraph
    text: Follow your doctor's instructions about how to clean and care for your skin
      before and after you use this medicine. Make sure you understand all of the
      directions, and ask questions if you find something is not clear.
  - type: paragraph
    text: Duraprep™ is flammable. Keep it away from fire or flame . Use in a well-ventilated
      area. Do not microwave or heat the applicator.
  - type: paragraph
    text: 'To apply:'
  - type: list
    ordered: false
    items:
    - Apply evenly to a clean, dry, intact skin. Do not scrub.
    - Do not allow the solution to pool. Use a sponge applicator or towel to absorb
      excess solution.
    - Avoid applying the solution into hairy areas.
    - Use a sterile-gloved hand when applying to skin folds, fingers, or toes to hold
      the skin apart until completely dry.
    - To reduce the risk of fire, wait until the solution is completely dry (at least
      3 minutes on hairless skin or 1 hour in hair).
  subsections:
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Duraprep™ will not dissolve in water and may stain. Avoid contact with
        reusable items.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Call your doctor if you have skin irritation that does not go away, including
      redness, itching, or burning in the area where you used this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, burning, itching, peeling, skin rash, redness, swelling, or other
        signs of irritation on the skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
