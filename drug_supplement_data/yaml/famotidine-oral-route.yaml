      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away any unused oral liquid after 30 days.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: If your condition does not improve, or if it become worse, check with your
      doctor.
  - type: paragraph
    text: 'Check with your doctor right away if you have the following symptoms: confusion,
      delirium, hallucinations, disorientation, agitation, seizures, or unusual drowsiness,
      dullness, tiredness, weakness, or feeling of sluggishness. These are more likely
      to occur if you are older or if you have a kidney disease.'
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your or your child's
      heart rhythm. You or your child might feel dizzy or faint, or you or your child
      might have a fast, pounding, or uneven heartbeat. Make sure your doctor knows
      if you had a heart rhythm problem, such as QT prolongation.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - bleeding gums
      - blistering, peeling, or loosening of the skin
      - blood in the urine or stools
      - bloody, black, or tarry stools
      - cough
      - difficulty breathing
      - discouragement
      - fast, irregular, pounding, or racing heartbeat or pulse
      - feeling sad or empty
      - irritability
      - lack of appetite
      - loss of interest or pleasure
      - noisy breathing
      - pinpoint red spots on the skin
      - seeing, hearing, or feeling things that are not there
      - seizures
      - swelling around the eyes
      - tightness in the chest
      - trouble concentrating
      - trouble sleeping
      - unusual bleeding or bruising
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - blistering, peeling, or loosening of the skin
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chest pain
      - chills
      - clay-colored stools
      - dark urine
      - diarrhea
      - difficulty swallowing
      - dizziness or fainting
      - fever
      - general feeling of tiredness or weakness
      - headache
      - high fever
      - hives, itching, skin rash
      - hoarseness
      - joint or muscle pain
      - large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
        feet, or genitals
      - light-colored stools
      - lower back or side pain
      - nausea
      - painful or difficult urination
      - pale skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach pain
      - swollen glands
      - unpleasant breath odor
      - unusual tiredness or weakness
      - upper right abdominal pain
      - vomiting of blood
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty having a bowel movement
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bad, unusual, or unpleasant (after) taste
      - bone or muscle pain
      - change in taste
      - continuing ringing or buzzing or other unexplained noise in the ears
      - decreased interest in sexual intercourse
      - difficulty in moving
      - dry mouth
      - dry skin
      - feeling of warmth
      - hearing loss
      - inability to have or keep an erection
      - lack or loss of strength
      - loss in sexual ability, desire, drive, or performance
      - muscle pain or stiffness
      - redness of the face, neck, arms and occasionally, upper chest
      - redness of the white part of the eyes
      - stomach discomfort
      - unusual drowsiness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
