      items:
      - Adults and children weighing 40 kilograms (kg) or more—20 milligrams (mg)
        2 times per day, in the morning and at bedtime for up to 6 weeks.
      - Children weighing less than 40 kg—Use and dose be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults and children weighing 40 kilograms (kg) or more—20 milligrams (mg)
