title: Famotidine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Heartburn Relief
    - type: paragraph
      text: Pepcid
    - type: paragraph
      text: Pepcid AC
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Famotidine is used to treat stomach ulcers (gastric and duodenal), erosive
      esophagitis (heartburn or acid indigestion), and gastroesophageal reflux disease
      (GERD). GERD is a condition where the acid in the stomach washes back up into
      the esophagus. It is also used to treat certain conditions where there is too
      much acid in the stomach (eg, Zollinger-Ellison syndrome, multiple endocrine
      neoplasia).
  - type: paragraph
    text: Famotidine belongs to the group of medicines known as histamine H2-receptor
      antagonists or H2-blockers. It works by decreasing the amount of acid produced
      by the stomach.
  - type: paragraph
    text: This medicine is available with your doctor's prescription and also without
      a prescription. For the prescription form, there is more medicine in each tablet.
      Your doctor will have special instructions on the proper use and dose for your
      medical problem.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of famotidine in children weighing
        40 kilograms (kg) or more. Safety and efficacy have not been established in
        children to treat conditions causing too much stomach acid and to prevent
        an ulcer from coming back.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of famotidine in the elderly. However,
        elderly patients are more likely to have age-related kidney problems, which
        may require an adjustment in the dose for patients receiving famotidine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Levoketoconazole
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acalabrutinib
      - Adagrasib
      - Amiodarone
      - Amisulpride
      - Amprenavir
      - Anagrelide
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Atazanavir
      - Azithromycin
      - Bedaquiline
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Cefuroxime Axetil
      - Ceritinib
      - Chloroquine
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
      - Crizotinib
      - Cyclobenzaprine
      - Dabrafenib
      - Dasatinib
      - Defactinib
      - Degarelix
      - Delamanid
      - Delavirdine
      - Desflurane
      - Deslorelin
      - Deutetrabenazine
      - Dexmedetomidine
      - Domperidone
      - Donepezil
      - Dordaviprone
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Cefditoren Pivoxil
      - Cefpodoxime Proxetil
      - Cyclosporine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate to severe—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor or as directed on
      the package . Do not take more of it, do not take it more often, and do not
      take it for a longer time than your doctor ordered. To do so may increase the
      chance of side effects.
  - type: paragraph
    text: Keep using this medicine for the full time of treatment , even if you begin
      to feel better.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Measure the oral liquid with a marked measuring spoon or medicine cup. The
      average household teaspoon may not hold the right amount of liquid.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (suspension, tablets): To prevent an ulcer from coming
        back: Adults—20 milligrams (mg) once a day. Children—Use and dose must be
        determined by your doctor. To treat erosive esophagitis (heartburn): Adults
        and children weighing 40 kilograms (kg) or more—20 milligrams (mg) 1 or 2
        times per day, at the morning and at bedtime, or 40 mg once a day at bedtime
        for up to 12 weeks. Children weighing less than 40 kg—Use and dose be determined
        by your doctor. To treat gastroesophageal reflux disease (GERD): Adults and
        children weighing 40 kilograms (kg) or more—20 milligrams (mg) 2 times per
        day, in the morning and at bedtime for up to 6 weeks. Children weighing less
        than 40 kg—Use and dose be determined by your doctor. To treat stomach ulcers:
        Adults and children weighing 40 kilograms (kg) or more—20 milligrams (mg)
        2 times per day, at the morning and at bedtime, or 40 mg once a day at bedtime
        for up to 8 weeks. Children weighing less than 40 kg—Use and dose be determined
        by your doctor. To treat too much stomach acid (Zollinger-Ellison syndrome):
        Adults—20 milligrams (mg) every 6 hours. Your doctor may adjust your dose
        as needed. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'To prevent an ulcer from coming back: Adults—20 milligrams (mg) once a day.
        Children—Use and dose must be determined by your doctor.'
      - 'To treat erosive esophagitis (heartburn): Adults and children weighing 40
        kilograms (kg) or more—20 milligrams (mg) 1 or 2 times per day, at the morning
