        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—20 milligrams (mg) once a day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults and children weighing 40 kilograms (kg) or more—20 milligrams (mg)
        1 or 2 times per day, at the morning and at bedtime, or 40 mg once a day at
