    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Stomach or bowel blockage or
      - Stomach surgery, history of—May cover up symptoms of these stomach or bowel
        problems (eg, gastric distention, progressive ileus).
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your doctor will tell you how many patches to use, where to apply them,
      and how often to apply them. Do not use more patches or apply them more often
      than your doctor tells you to.
  - type: paragraph
    text: This medicine should come with patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: 'To use the skin patch:'
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and water before and after applying a patch. Do not
      touch your eyes until after you have washed your hands.
    - Wash the area of skin where you will apply the patch gently with soap and warm
      water. Rinse completely and dry with a clean dry towel.
    - Apply the patch right away after removing it from the protective pouch. Do not
      cut it into smaller pieces and do not touch the sticky surface of the patch.
    - Apply the patch to a clean, dry, almost hairless, intact healthy skin area on
      your upper outer arm. Do not put the patch over red, damaged, or irritated skin.
      Avoid putting the patch on areas that have been treated with other skin products
      (eg, creams, oils, lotions, powders).
    - Press the patch firmly in place with your fingertips to make sure that the edges
      of the patch stick well.
    - If the patch does not stick well, use medical tape around the edges to keep
      it in place. Do not cover the patch completely. If the patch comes more than
      halfway off or becomes damaged, call your doctor for instructions.
    - Leave the patch in place for at least 24 hours after completion of chemotherapy.
      The patch can be worn for up to 7 days depending on how long you are receiving
      chemotherapy.
    - Avoid swimming, strenuous exercise, or using a sauna or whirlpool while using
      this medicine.
    - Do not expose the patch to direct sunlight or sunlamps. This could destroy the
      medicine in the patch. If you will be exposed to direct sunlight or sunlamps,
      cover your skin with clothing where you have the patch. Keep the clothing on
      this area while you are wearing it and for 10 days after you remove it.
    - Remove the patch by peeling it off from the skin gently.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For transdermal dosage form (skin patch): For prevention of nausea and vomiting
        caused by chemotherapy: Adults—One patch applied at least 24 to 48 hours before
        chemotherapy. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For prevention of nausea and vomiting caused by chemotherapy: Adults—One
        patch applied at least 24 to 48 hours before chemotherapy. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—One patch applied at least 24 to 48 hours before chemotherapy.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you forget to wear or change a patch, put one on as soon as you can.
        If it is almost time to put on your next patch, wait until then to apply a
        new patch and skip the one you missed. Do not apply extra patches to make
        up for a missed dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the patches at room temperature in a closed container, away from
        heat, moisture, and direct light.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: After removing a used patch, fold the patch in half with the sticky sides
        together. Make sure to dispose of it out of the reach of children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Check with your doctor if severe nausea and vomiting continue after leaving
      the hospital or cancer treatment center.
  - type: paragraph
    text: Do not take other medicines containing granisetron while using Sancuso®.
      Using these medicines together may cause serious unwanted side effects .
  - type: paragraph
    text: Check with your doctor right away if you start to have pain or swelling
      in your stomach area. These may be signs of a serious stomach or bowel problem.
  - type: paragraph
    text: Check with your doctor right away if you have anxiety, restlessness, a fast
      heartbeat, fever, sweating, muscle spasms, twitching, nausea, vomiting, diarrhea,
      or see or hear things that are not there. These may be symptoms of a serious
      condition called serotonin syndrome. Your risk may be higher if you also take
      certain other medicines that affect serotonin levels in your body.
  - type: paragraph
    text: Serious skin reactions may occur while using the patch. Check with your
      doctor right away if you have a skin rash, itching, redness, or any skin irritation
      while you are wearing the patch.
  - type: paragraph
    text: Do not use a heating pad or heat lamp near the Sancuso® patch. Avoid sunlamps
      and tanning beds while using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Severe constipation
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - arm, back, or jaw pain
      - black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - blurred vision
      - chest pain or discomfort
      - chest tightness or heaviness
      - chills
      - confusion
      - cough
      - diarrhea
      - difficulty with swallowing
      - dizziness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fainting
      - fast, slow, or irregular heartbeat
      - fever
      - headache
      - hives or welts, itching, or skin rash
      - muscle spasms or twitching
      - nausea
      - nervousness
      - painful or difficult urination
      - pain, itching, redness, irritation, blistering, burning, discoloration, or
        rash where the patch is applied
      - pale skin
      - pinpoint red spots on the skin
      - pounding in the ears
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness of the skin
      - restlessness
      - seeing, hearing, or feeling things that are not there
      - sleepiness or unusual drowsiness
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach pain or swelling
      - sweating
      - swollen glands
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased appetite
      - hair loss or thinning of the hair
      - lack or loss of strength
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
