title: Metolazone (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Mykrox
    - type: paragraph
      text: Zaroxolyn
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Metolazone is used to treat fluid retention (edema) and swelling that is
      caused by congestive heart failure, kidney disease, or other medical conditions
      .
  - type: paragraph
    text: Metolazone is also used alone or together with other medicines to treat
      high blood pressure (hypertension). High blood pressure adds to the work load
      of the heart and arteries. If it continues for a long time, the heart and arteries
      may not function properly. This can damage the blood vessels of the brain, heart,
      and kidneys, resulting in a stroke, heart failure, or kidney failure. High blood
      pressure may also increase the risk of heart attacks. These problems may be
      less likely to occur if blood pressure is controlled .
  - type: paragraph
    text: Metolazone is a thiazide diuretic (water pill). It reduces the amount of
      water in the body by increasing the flow of urine, which helps to lower blood
      pressure .
  - type: paragraph
    text: This medicine is available only with your doctor's prescription .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of metolazone in the pediatric population. Safety and efficacy
        have not been established .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatrics-specific
        problems that would limit the usefulness of metolazone in the elderly. However,
        elderly patients are more likely to have age-related kidney, liver, or heart
        problems, which may require an adjustment in the dose for patients receiving
        metolazone .
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
      - Methenamine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Aceclofenac
      - Acemetacin
      - Acetyldigoxin
      - Albiglutide
      - Albuterol
      - Alogliptin
      - Amtolmetin Guacil
      - Arsenic Trioxide
      - Articaine
      - Aspirin
      - Benzhydrocodone
      - Bepridil
      - Bromfenac
      - Bromocriptine
      - Bufexamac
      - Bumetanide
      - Buprenorphine
      - Canagliflozin
      - Cefepime
      - Celecoxib
      - Chlorpropamide
      - Choline Salicylate
      - Clonixin
      - Codeine
      - Dapagliflozin
      - Deslanoside
      - Desmopressin
      - Dexibuprofen
      - Dexketoprofen
      - Diazoxide
      - Diclofenac
      - Diflunisal
      - Digitalis
      - Digitoxin
      - Digoxin
      - Dihydrocodeine
      - Dipyrone
      - Dofetilide
      - Droperidol
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aminolevulinic Acid
      - Gossypol
      - Licorice
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anuria (not able to pass urine) or
      - Liver disease, severe (e.g., hepatic coma)—Should not be used in patients
        with these conditions .
    - type: list
      ordered: false
      items:
      - Asthma or
      - Diabetes or
      - Gout or
      - Hypercalcemia (high calcium in the blood) or
      - Hyperuricemia (high uric acid in the blood) or
      - Hypochloremia (low chloride in the blood) or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood) or
      - Hyponatremia (low sodium in the blood) or
      - Systemic lupus erythematosus—Use with caution. This medicine may make these
        conditions worse .
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects of the medicine may be increased
        because of slower removal of the medicine from the body .
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium or potassium. Your doctor will tell you which of these
      are most important for you. You should check with your doctor before changing
      your diet .
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well .
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure, but
      it does help control it. You must continue to take it as directed if you expect
      to lower your blood pressure and keep it down. You may have to take high blood
      pressure medicine for the rest of your life. If high blood pressure is not treated,
      it can cause serious problems such as heart failure, blood vessel disease, stroke,
      or kidney disease .
  - type: paragraph
    text: Use only the brand of this medicine that your doctor prescribed. Different
      brands may not work the same way .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For fluid retention (edema): Adults—At first,
        5 to 20 milligrams (mg) once a day. Your doctor may adjust your dose if needed.
        Children—Use and dose must be determined by your doctor . For high blood pressure:
        Adults—At first, 2.5 to 5 milligrams (mg) once a day. Your doctor may adjust
        your dose if needed. Children—Use and dose must be determined by your doctor
        .'
    - type: list
      ordered: false
      items:
      - 'For fluid retention (edema): Adults—At first, 5 to 20 milligrams (mg) once
        a day. Your doctor may adjust your dose if needed. Children—Use and dose must
        be determined by your doctor .'
    - type: list
      ordered: false
      items:
      - Adults—At first, 5 to 20 milligrams (mg) once a day. Your doctor may adjust
        your dose if needed.
      - Children—Use and dose must be determined by your doctor .
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—At first, 2.5 to 5 milligrams (mg) once a
        day. Your doctor may adjust your dose if needed. Children—Use and dose must
        be determined by your doctor .'
    - type: list
      ordered: false
      items:
      - Adults—At first, 2.5 to 5 milligrams (mg) once a day. Your doctor may adjust
        your dose if needed.
      - Children—Use and dose must be determined by your doctor .
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood or urine tests may be
      needed to check for unwanted effects .
  - type: paragraph
    text: 'Check with your doctor right away if you have any of the following symptoms
      while taking this medicine: convulsions or seizures; decreased urine; drowsiness;
      dry mouth; excessive thirst; muscle pains or cramps; nausea or vomiting; increased
      heart rate or pulse; or unusual tiredness or weakness. These may be symptoms
      of a condition called hypokalemia or potassium loss .'
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up from a lying or sitting position. Getting up slowly may help. If the problem
      continues or gets worse, check with your doctor .
  - type: paragraph
    text: Drinking alcoholic beverages may also make the dizziness, lightheadedness,
      or fainting worse. While you are taking this medicine, be careful to limit the
      amount of alcohol you drink .
  - type: paragraph
    text: This medicine may cause changes in your blood sugar levels. If you notice
      a change in the results of your blood or urine sugar tests or if you have any
      questions, check with your doctor .
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are taking this medicine. The results of some tests (e.g., tests for parathyroid
      function) may be affected by this medicine .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blistering, peeling, or loosening of skin
      - bloating
      - blood in urine or stools
      - blurred vision
      - bone pain
      - chest pain
      - chills
      - clay-colored stools
      - cold sweats
      - coma
      - confusion
      - constipation
      - convulsions
      - cough
      - dark urine
      - decreased urine
      - diarrhea
      - dizziness, faintness, or lightheadedness when getting up from lying or sitting
        position
      - drowsiness
      - dry mouth
      - fast, irregular, pounding, or racing heartbeat or pulse
      - fever
      - flushed, dry skin
      - fruit-like breath odor
      - general tiredness and weakness
      - headache
      - incoherent speech
      - increased hunger
      - increased thirst
      - increased urination
      - indigestion
      - irritability
      - itching
      - joint or muscle pain
      - light-colored stools
      - loss of appetite
      - lower back or side pain
      - metallic taste
      - mood changes
      - muscle pain or cramps
      - nausea and vomiting
      - numbness or tingling in hands, feet, or lips
      - pain in lower legs
      - painful or difficult urination
      - pinpoint red spots on skin
      - rash
      - red irritated eyes
      - red skin lesions, often with a purple center
      - redness or swelling of lower leg
      - shortness of breath
      - sore throat
      - sores, ulcers, or white spots in mouth or on lips
      - sugar in the urine
      - sweating
      - swelling of face, ankles, or hands
      - swollen or painful glands
      - tightness in chest
      - trembling
      - troubled breathing
      - unexplained weight loss
      - unpleasant breath odor
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - upper right abdominal pain
      - vomiting of blood
      - weak pulse
      - wheezing
      - yellow eyes and skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fainting
      - irregular, fast or slow, or shallow breathing
      - pale or blue lips, fingernails, or skin
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
      - weakness and heaviness of legs
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blue-green to black skin discoloration
      - burning, tingling, numbness, or pain in the hands, arms, feet, or legs
      - cracked, dry, or scaly skin
      - decreased interest in sexual intercourse
      - feeling of constant movement of self or surroundings
      - hives or welts
      - inability to have or keep an erection
      - loss in sexual ability, desire, drive, or performance
      - pain, redness, or sloughing of skin at place of injection
      - restlessness
      - sensation of pins and needles
      - sensation of spinning
      - stabbing pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
