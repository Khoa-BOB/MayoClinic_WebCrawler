    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart rhythm problems (eg, QT prolongation, long QT syndrome), or history
        of or
      - Kidney disease, severe—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver cirrhosis—Should not be used in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the extended-release tablet and extended-release granules whole.
      Do not crush, break, or chew it.
  - type: paragraph
    text: 'To use the extended-release granules :'
  - type: list
    ordered: false
    items:
    - 'With soft food: Sprinkle the granules on one tablespoonful of soft food (eg,
      applesauce or yogurt) and swallow it right away. Do not crush or chew the granules.'
    - 'Nasogastric tube: Add the granules with 50 milliliters (mL) of water into a
      syringe. Gently shake the mixture for at least 15 seconds, then flush it through
      the tube right away. Rinse the syringe with 15 mL of water, then flush it through
      the tube until all of the medicine is washed out.'
    - 'Gastric tube: Add the granules with 30 mL of water into a syringe. Gently shake
      the mixture for at least 15 seconds, then flush it through the tube right away.
      Rinse the syringe with 20 mL of water, then flush it through the tube. Rinse
      it again with 15 mL of water until all of the medicine is washed out.'
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine.
  - type: paragraph
    text: Avoid drinking alcohol while you are using the extended-release granules
      .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets or extended-release granules):
        For chronic angina: Adults—At first, 500 milligrams (mg) 2 times a day. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than 1000 mg 2 times a day. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - 'For chronic angina: Adults—At first, 500 milligrams (mg) 2 times a day. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than 1000 mg 2 times a day. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 500 milligrams (mg) 2 times a day. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 1000 mg 2
        times a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If you will be taking this medicine for a long time, it is very important
      that your doctor check you at regular visits for any problems or unwanted effects
      that may be caused by this medicine. Blood tests may be needed to check for
      unwanted effects.
  - type: paragraph
    text: Do not use ranolazine together with carbamazepine (Tegretol®), clarithromycin
      (Biaxin®), nefazodone (Serzone®), phenobarbital, phenytoin (Dilantin®), rifabutin
      (Mycobutin®), rifampin (Rifadin®, Rimactane®), rifapentine (Priftin®), medicine
      to treat fungus infections (eg, itraconazole, ketoconazole, Nizoral®, Sporanox®),
      medicine to treat HIV or AIDS (eg, indinavir, lopinavir, nelfinavir, ritonavir,
      saquinavir, Crixivan®, Fortovase®, Invirase®, Norvir®, Viracept®), or St. John's
      wort.
  - type: paragraph
    text: Do not use this medicine to treat a sudden onset of chest pain .
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you had a heart rhythm problem, such
      as QT prolongation.
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, trouble breathing, unusual tiredness or weakness, vomiting, or
      weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, lightheaded, drowsy,
      or less alert than they are normally. Make sure you know how you react to this
      medicine before you drive, use machines, or do anything else that could be dangerous
      if you are dizzy or not alert .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - chest tightness
      - difficult or labored breathing
      - fast, irregular, pounding, or racing heartbeat or pulse
      - feeling of constant movement of self or surroundings
      - lightheadedness
      - rapid weight gain
      - sensation of spinning
      - tingling of the hands or feet
      - unusual weight gain or loss
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal or decreased touch sensation
      - agitation
      - blood in the urine
      - blurred vision
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chest pain or discomfort
      - chills
      - cold sweats
      - coma
      - confusion
      - decreased urine output
      - depression
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fainting
      - headache
      - hostility
      - irritability
      - lethargy
      - muscle twitching
      - nausea
      - seizures
      - shakiness in the legs, arms, hands, or feet
      - slow or irregular heartbeat
      - stupor
      - sweating
      - trembling or shaking of the hands or feet
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decrease in frequency of urination
      - decrease in urine volume
      - difficulty in passing urine [dribbling]
      - large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
        feet, or sex organs
      - painful urination
      - seeing, hearing, or feeling things that are not there
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty having a bowel movement (stool)
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry mouth
      - stomach pain
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - continuing ringing or buzzing or other unexplained noise in the ears
      - hearing loss
      - heartburn
      - indigestion
      - lack or loss of strength
      - stomach discomfort or upset
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
