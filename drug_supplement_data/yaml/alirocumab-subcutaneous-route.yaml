title: Alirocumab (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Praluent
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Alirocumab injection is used together with a proper diet and exercise to
      lower LDL cholesterol in patients with hypercholesterolemia (high blood cholesterol),
      heterozygous familial hypercholesterolemia (HeFH), or homozygous familial hypercholesterolemia
      (HoFH). It is also used to reduce the risk of death, heart attack, stroke, and
      unstable angina (chest pain) requiring hospitalization in patients at high risk
      for these conditions. This medicine is a PCSK9 (proprotein convertase subtilisin
      kexin type 9) inhibitor.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of alirocumab injection in children younger than 8 years of
        age with HeFH and in children with HoFH and other types of hypercholesterolemia
        . Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of alirocumab injection in the elderly.
        However, elderly patients are more sensitive to the effects of this medicine
        than younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      It is given as a shot under your skin, usually in the stomach, thighs, or upper
      arms.
  - type: paragraph
    text: Alirocumab may sometimes be given at home to patients who do not need to
      be in the hospital. If you are using this medicine at home, your doctor will
      teach you how to prepare and inject the medicine. Be sure that you understand
      exactly how the medicine is prepared and injected.
  - type: paragraph
    text: This medicine comes with a patient information leaflet and patient instructions.
      Read and follow these instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: You will be shown the body areas where this shot can be given. Use a different
      body area each time you give yourself a shot. Keep track of where you give each
      shot to make sure you rotate body areas. This will help prevent skin problems
      from the injections.
  - type: paragraph
    text: Do not inject on skin areas that are bruised, red, hard, tender, or areas
      with visible veins, scars, or stretch marks.
  - type: paragraph
    text: Allow the medicine to warm to room temperature for at least 30 to 40 minutes
      before using it. Do not warm it in any other way.
  - type: paragraph
    text: Use each prefilled pen only one time. Do not save an open pen. If the medicine
      in the pen has changed color, or if you see particles in it, do not use it.
      Do not shake. Do not use it if it has been dropped or damaged.
  - type: paragraph
    text: 'To use the prefilled pen :'
  - type: list
    ordered: false
    items:
    - Wash your hands before and after using the medicine.
    - Do not pull off the cap until you are ready to inject. Do no put the blue cap
      back on. Do not touch the yellow safety cover.
    - Pinch the skin. Press and firmly hold the pen against the skin at a 90 degree
      angle until you can no longer see the yellow safety cover. You will hear a "click",
      which means the injection has started. The window will start to turn yellow.
      It will take up to 20 seconds.
    - Do not remove the pen until the window turns yellow. You will a second "click",
      which means the injection is complete.
  - type: paragraph
    text: In addition to this medicine, your doctor may change your diet to one that
      is low in fat, sugar, and cholesterol. Carefully follow your doctor's order
      about any special diet .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form (solution): For hypercholesterolemia, including
        heterozygous familial hypercholesterolemia (HeFH): Adults—At first, 75 milligrams
        (mg) injected under your skin once every 2 weeks, or 300 mg injected under
        your skin once every 4 weeks. Your doctor may adjust your dose as needed.
        Children 8 years of age and older weighing 50 kilograms (kg) or more—300 mg
        injected under the skin once every 4 weeks. Your doctor may adjust your dose
        as needed. Children 8 years of age and older weighing less than 50 kg—150
        mg injected under the skin once every 4 weeks. Your doctor may adjust your
        dose as needed. Children younger than 8 years of age—Use and dose must be
        determined by your doctor. For homozygous familial hypercholesterolemia (HoFH)
        or HeFH undergoing LDL apheresis: Adults—150 milligrams (mg) injected under
        your skin once every 2 weeks. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - 'For hypercholesterolemia, including heterozygous familial hypercholesterolemia
        (HeFH): Adults—At first, 75 milligrams (mg) injected under your skin once
        every 2 weeks, or 300 mg injected under your skin once every 4 weeks. Your
        doctor may adjust your dose as needed. Children 8 years of age and older weighing
        50 kilograms (kg) or more—300 mg injected under the skin once every 4 weeks.
        Your doctor may adjust your dose as needed. Children 8 years of age and older
        weighing less than 50 kg—150 mg injected under the skin once every 4 weeks.
        Your doctor may adjust your dose as needed. Children younger than 8 years
        of age—Use and dose must be determined by your doctor.'
      - 'For homozygous familial hypercholesterolemia (HoFH) or HeFH undergoing LDL
        apheresis: Adults—150 milligrams (mg) injected under your skin once every
        2 weeks. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 75 milligrams (mg) injected under your skin once every 2
        weeks, or 300 mg injected under your skin once every 4 weeks. Your doctor
        may adjust your dose as needed.
      - Children 8 years of age and older weighing 50 kilograms (kg) or more—300 mg
        injected under the skin once every 4 weeks. Your doctor may adjust your dose
        as needed.
      - Children 8 years of age and older weighing less than 50 kg—150 mg injected
        under the skin once every 4 weeks. Your doctor may adjust your dose as needed.
      - Children younger than 8 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - Adults—150 milligrams (mg) injected under your skin once every 2 weeks.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: This medicine needs to be given on a fixed schedule. If you miss a dose
        or forget to use your medicine, call your doctor or pharmacist for instructions.
    - type: paragraph
      text: 'Every 2-week dose : If you missed a dose, use this medicine within 7
        days from the missed dose. Then, go back to your original schedule. If the
        missed dose is not given within 7 days, wait until your next scheduled dose
        to re-start alirocumab. If you are not sure when to re-start alirocumab, ask
        your doctor or pharmacist.'
    - type: paragraph
      text: 'Every 4-week dose : If you missed a dose, use this medicine within 7
        days from the missed dose. Then, go back to your original schedule. If the
        missed dose is not given within 7 days, use this medicine right away and re-start
        alirocumab based on this date. If you are not sure when to re-start alirocumab,
        ask your doctor or pharmacist.'
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: You may also store this medicine in its original carton at room temperature
        for up to 30 days. Do not expose to extreme heat. After removing this medicine
        from the refrigerator, use it within 30 days. Throw away any unused medicine
        after 30 days.
    - type: paragraph
      text: Throw away used needles in a hard, closed container where the needles
        cannot poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress within 4 to 8
      weeks of using this medicine . This will allow your doctor to see if the medicine
      is working properly to lower your cholesterol levels and to decide if you should
      continue to use it. Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Serious allergic reactions (eg, angioedema, vasculitis) may occur while
      you are using this medicine. Tell your doctor right away if you have a rash,
      itching skin, difficulty with breathing or swallowing, fever, hives, sores,
      welting, or blisters, large, hive-like swelling on the face, eyelids, lips,
      tongue, throat, hands, legs, feet, or sex organs, nausea, reddening of the skin,
      especially around the ears, swelling of the eyes, face, or inside of the nose,
      or unusual tiredness or weakness.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or tightness
      - difficulty with breathing or swallowing
      - fast heartbeat
      - fever
      - hives, itching, skin rash
      - hoarseness
      - irritation
      - joint pain, stiffness, or swelling
      - nausea
      - reddening of the skin, especially around the ears
      - swelling of eyelids, face, lips, hands, or feet
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough producing mucus
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - chills
      - cough
      - diarrhea
      - general feeling of discomfort or illness
      - headache
      - loss of appetite
      - muscle aches, cramps, stiffness, or pains
      - shivering
      - sore throat
      - stuffy or runny nose
      - sweating
      - trouble sleeping
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - bone pain
      - bruise
      - difficult, burning, or painful urination
      - difficulty with moving
      - frequent urge to urinate
      - lower back or side pain
      - muscle spasms
      - pain or tenderness around the eyes and cheekbones
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
