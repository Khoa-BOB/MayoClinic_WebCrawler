    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Achlorhydria (absence of stomach acid)—May not be absorbed from the stomach
        in patients with this condition.
    - type: list
      ordered: false
      items:
      - Adrenal problems or
      - Heart disease, history of or
      - Heart rhythm problems (eg, QT prolongation), or history of—These conditions
        may cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Liver disease, acute or chronic—Should not be used in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. Do not stop taking this medicine without checking first
      with your doctor.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: It is best to take this medicine with food.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you feel
      better after the first few doses. Your infection may not clear up if you stop
      using the medicine too soon.
  - type: paragraph
    text: If you are taking this medicine together with an antacid-containing aluminum,
      it should be taken with an acidic beverage (such as non-diet cola). Antacid-containing
      aluminum should be taken at least 1 hour before or 2 hours after taking this
      medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For fungal infections: Adults—At first, 200
        milligrams (mg) once a day. Your doctor may increase your dose as needed.
        Children 2 years of age and older—Dose is based on body weight and must be
        determined by your doctor. The dose is usually 3.3 to 6.6 milligrams (mg)
        per kilogram (kg) of body weight per day. Children younger than 2 years of
        age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For fungal infections: Adults—At first, 200 milligrams (mg) once a day. Your
        doctor may increase your dose as needed. Children 2 years of age and older—Dose
        is based on body weight and must be determined by your doctor. The dose is
        usually 3.3 to 6.6 milligrams (mg) per kilogram (kg) of body weight per day.
        Children younger than 2 years of age—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 200 milligrams (mg) once a day. Your doctor may increase
        your dose as needed.
      - Children 2 years of age and older—Dose is based on body weight and must be
        determined by your doctor. The dose is usually 3.3 to 6.6 milligrams (mg)
        per kilogram (kg) of body weight per day.
      - Children younger than 2 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood tests
      may be needed to check for unwanted effects.
  - type: paragraph
    text: If your or your child's symptoms do not improve, or if they become worse,
      check with your doctor. You may need to take this medicine for several months
      before your infection gets better.
  - type: paragraph
    text: Do not use this medicine together with alprazolam, cisapride, colchicine,
      disopyramide, dofetilide, dronedarone, eplerenone, felodipine, irinotecan, lovastatin,
      lurasidone, methadone, nisoldipine, oral midazolam, pimozide, quinidine, ranolazine,
      simvastatin, terfenadine, tolvaptan, triazolam, or ergot medicines (such as
      dihydroergotamine, ergometrine, ergotamine, methylergometrine). Using these
      medicines together may cause serious unwanted effects .
  - type: paragraph
    text: 'Liver problems may occur while you are taking this medicine. Check with
      your doctor right away if you are having more than one of these symptoms: abdominal
      or stomach pain or tenderness, clay-colored stools, dark urine, decreased appetite,
      fever, headache, itching, loss of appetite, nausea and vomiting, skin rash,
      swelling of the feet or lower legs, unusual tiredness or weakness, or yellow
      eyes or skin.'
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you or anyone in your family has ever
      had a heart rhythm problem such as QT prolongation.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you have a rash, itching, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are using this medicine.
  - type: paragraph
    text: Avoid drinking alcohol while you are using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back, leg, or stomach pains
      - black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - blurred vision
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - change in color vision
      - change in the ability to see colors, especially blue or yellow
      - chest pain
      - chills
      - confusion
      - cough
      - dark urine
      - difficulty seeing at night
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - fever
      - general body swelling
      - headache
      - hoarseness
      - increased sensitivity of the eyes to sunlight
      - irritation
      - joint pain, stiffness, or swelling
      - light-colored stools
      - loss of appetite
      - mood or mental changes
      - nausea or vomiting, severe
      - nosebleeds
      - painful or difficult urination
      - pale skin
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness of the skin
      - skin rash, hives, itching
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swelling of the eyelids, face, lips, hands, or feet
      - swollen glands
      - tightness in the chest
      - trouble sleeping
      - troubled breathing or swallowing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vision changes
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in number of sperm and their ability to move
      - decreased interest in sexual intercourse
      - diarrhea
      - hair loss or thinning of the hair
      - inability to have or keep an erection
      - loss in sexual ability, desire, drive, or performance
      - sleepiness or unusual drowsiness
      - swelling of the breasts or breast soreness for both female and male
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
