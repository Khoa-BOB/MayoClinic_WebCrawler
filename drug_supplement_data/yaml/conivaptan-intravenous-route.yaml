    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anuria (trouble urinating) or
      - Hypovolemic hyponatremia (low blood sodium with low blood volume)—Should not
        be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Heart disease (eg, heart failure) or
      - Hypotension (low blood pressure) or
      - Hypovolemia (low blood volume)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate or severe or
      - Liver disease, severe—Use with caution. These conditions may increase the
        concentration of conivaptan in your blood.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. This medicine is given through a needle placed in one of your
      veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits .
      This will allow your doctor to see if the medicine is working properly and to
      decide if you should continue to use it. Blood tests may be needed to check
      for unwanted effects.
  - type: paragraph
    text: If your symptoms do not improve within a few days or if they become worse,
      check with your doctor.
  - type: paragraph
    text: You should not use clarithromycin (Biaxin®), indinavir (Crixivan®), itraconazole
      (Sporanox®), ketoconazole (Nizoral®), or ritonavir (Norvir®). Using these medicines
      together may cause serious unwanted effects .
  - type: paragraph
    text: 'Tell your doctor right away if you have the following symptoms after receiving
      this medicine: a slurred speech, trouble speaking, trouble swallowing, seizures,
      or unusual drowsiness, dullness, tiredness, weakness or feeling of sluggishness.
      These may be symptoms of a nerve problem called osmotic demyelination syndrome.'
  - type: paragraph
    text: This medicine may make you feel dizzy or lightheaded. Do not drive or do
      anything that could be dangerous until you know how this medicine affects you
      .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the site
      - bloating or swelling of the face, arms, hands, lower legs, ankles, or feet
      - blurred vision
      - decreased urine
      - dizziness
      - dry mouth
      - headache
      - increased thirst
      - irregular heartbeat
      - loss of appetite
      - mood changes
      - muscle pain or cramps
      - nausea or vomiting
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - pounding in the ears
      - rapid weight gain
      - seizures
      - slow or fast heartbeat
      - tingling of hands or feet
      - unusual tiredness or weakness
      - unusual weight gain or loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - bladder pain
      - bloody or cloudy urine
      - bluish color
      - change in consciousness
      - changes in skin color
      - chest pain
      - cold sweats
      - confusion
      - cool pale skin
      - cough
