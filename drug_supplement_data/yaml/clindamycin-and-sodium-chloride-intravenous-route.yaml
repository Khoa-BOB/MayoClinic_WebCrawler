title: Clindamycin and sodium chloride (intravenous route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Clindamycin and sodium chloride injection is used to treat bacterial infections
      in different areas of the body. This medicine is given to patients who had an
      allergic reaction to penicillin.
  - type: paragraph
    text: Clindamycin belongs to the class of medicines known as macrolide antibiotics.
      It works by killing bacteria or preventing their growth. However, this medicine
      will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of clindamycin and sodium chloride
        injection in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of clindamycin and sodium chloride
        injection in the elderly. However, elderly patients are more likely to have
        diarrhea, which may require caution and adjustment in the dose for patients
        receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content: []
    subsections: []
  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Levoketoconazole
      - Mifepristone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Apalutamide
      - Asciminib
      - Avacopan
      - Belzutifan
      - Berotralstat
      - Carbamazepine
      - Ceritinib
      - Cholera Vaccine, Live
      - Clarithromycin
      - Conivaptan
      - Crizotinib
      - Daridorexant
      - Enasidenib
      - Enzalutamide
      - Erythromycin
      - Fedratinib
      - Fluconazole
      - Gepotidacin
      - Imatinib
      - Itraconazole
      - Lanreotide
      - Lazertinib
      - Lefamulin
      - Letermovir
      - Lonafarnib
      - Mavorixafor
      - Mitotane
      - Mobocertinib
      - Nirogacestat
      - Octreotide
      - Omaveloxolone
      - Pacritinib
      - Palbociclib
      - Phenobarbital
      - Primidone
      - Ranolazine
      - Repotrectinib
      - Ribociclib
      - Selpercatinib
      - Sotorasib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atracurium
      - Metocurine
      - Tubocurarine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Atopic syndrome or
      - Stomach or bowel problems, history of—Should not be used in patients with
        these conditions.
    - type: list
      ordered: false
      items:
      - Diarrhea or
      - Liver disease, severe—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given as a needle placed into one of your veins.
      This medicine must be injected slowly, so the needle will have to remain in
      place for at least 10 minutes.
  - type: paragraph
    text: Your doctor will give you or your child a few doses of this medicine until
      your condition improves, and then switch you to an oral medicine that works
      the same way. If you have any concerns about this, talk to your doctor.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your or your child's progress after
      treatment . This is to make sure that the infection is cleared up completely.
      Blood and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause diarrhea, and in some cases it can be severe. It
      may occur 2 months or more after you or your child stop using this medicine.
      Do not take any medicine to treat diarrhea without first checking with your
      doctor. If you have any questions or if mild diarrhea continues or gets worse,
      check with your doctor.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction called anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, trouble breathing, trouble
      swallowing, or any swelling of your hands, face, or mouth while you or your
      child are receiving this medicine.
  - type: paragraph
    text: Serious skin reactions, including toxic epidermal necrolysis, drug reaction
      with eosinophilia and systemic symptoms (DRESS), and Stevens-Johnson syndrome
      can occur with this medicine. Check with your doctor right away if you or your
      child have black, tarry stools, blistering, peeling, or loose skin, chest pain,
      chills, cough, diarrhea, itching, joint or muscle pain, painful or difficult
      urination, red irritated eyes, red skin lesions, often with a purple center,
      sore throat, sores, ulcers, or white spots in the mouth or on the lips, swollen
      glands, trouble breathing, unusual bleeding or bruising, or unusual tiredness
      or weakness while you or your child are receiving this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blistering, peeling, or loosening of the skin
      - bloating
      - bloody or cloudy urine
      - blurred vision
      - changes in skin color
      - chest tightness
      - chills
      - clay-colored stools
      - confusion
      - cough
      - dark urine
      - diarrhea
      - difficulty swallowing
      - dizziness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dry mouth
      - fast heartbeat
      - fever
      - headache
      - hives, itching, skin rash
      - increased thirst
      - itching of the vagina or genital area
      - joint or muscle pain
      - large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
        feet, or sex organs
      - loss of appetite
      - nausea or vomiting
      - no breathing
      - no pulse or blood pressure
      - painful or difficult urination
      - pain during sexual intercourse
      - pain in the lower back or side
      - pain, lump, or irritation at the injection site
      - pale skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rash with flat lesions or small raised lesions on the skin
      - red irritated eyes
      - red skin lesions, often with a purple center
      - severe stomach cramps, pain, and tenderness
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - sweating
      - swollen glands
      - thick, white vaginal discharge with no odor or with a mild odor
      - trouble breathing
      - unpleasant breath odor
      - unconscious
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - unusual weight loss
      - vomiting of blood
      - watery and severe diarrhea, which may also be bloody
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bitter or metallic taste
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
