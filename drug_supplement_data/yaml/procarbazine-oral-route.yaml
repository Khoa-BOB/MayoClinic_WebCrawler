title: Procarbazine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Matulane
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Procarbazine belongs to the group of medicines known as alkylating agents.
      It is used to treat some kinds of cancer.
  - type: paragraph
    text: Procarbazine is thought to interfere with the growth of cancer cells which
      are eventually destroyed. It also blocks the action of a chemical substance
      in the central nervous system called monoamine oxidase (MAO), but this is probably
      not related to its effect against cancer. Since the growth of normal body cells
      may also be affected by procarbazine, other effects will also occur. Some of
      these may be serious and must be reported to your doctor. Other effects, like
      hair loss, may not be serious but may cause concern. Some effects may not occur
      for months or years after the medicine is used.
  - type: paragraph
    text: Before you begin treatment with procarbazine, you and your doctor should
      talk about the good this medicine will do as well as the risks of using it.
  - type: paragraph
    text: Procarbazine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information about the use of procarbazine
        in children, it is not expected to cause different side effects or problems
        in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Side effects may be more likely to occur in elderly patients, who are
        usually more sensitive to the effects of procarbazine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Amitriptyline
      - Amphetamine
      - Apraclonidine
      - Atomoxetine
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Benzphetamine
      - Brimonidine
      - Bupropion
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Citalopram
      - Clomipramine
      - Codeine
      - Cyclobenzaprine
      - Cyproheptadine
      - Dengue Tetravalent Vaccine, Live
      - Desipramine
      - Desvenlafaxine
      - Deutetrabenazine
      - Dexfenfluramine
      - Dexmethylphenidate
      - Dextroamphetamine
      - Dextromethorphan
      - Diethylpropion
      - Dihydrocodeine
      - Doxepin
      - Doxylamine
      - Duloxetine
      - Entacapone
      - Escitalopram
      - Fenfluramine
      - Fluoxetine
      - Fluvoxamine
      - Gepirone
      - Guanadrel
      - Guanethidine
      - Hydroxytryptophan
      - Imipramine
      - Isocarboxazid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acetophenazine
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Albuterol
      - Alfentanil
      - Amobarbital
      - Amoxapine
      - Aprobarbital
      - Atropine
      - Barbital
      - Benzhydrocodone
      - Buprenorphine
      - Buspirone
      - Butabarbital
      - Butalbital
      - Butorphanol
      - Chlorpromazine
      - Cholera Vaccine
      - Clovoxamine
      - Difenoxin
      - Diphenoxylate
      - Dixyrazine
      - Dolasetron
      - Dothiepin
      - Droperidol
      - Ebola Zaire Vaccine, Live
      - Epinephrine
      - Eterobarb
      - Ethchlorvynol
      - Ethopropazine
      - Femoxetine
      - Fentanyl
      - Fluphenazine
      - Formoterol
      - Frovatriptan
      - Granisetron
      - Guarana
      - Heptabarbital
      - Hexobarbital
      - Hydrocodone
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Chlorpropamide
      - Ginseng
      - Glimepiride
      - Glipizide
      - Glyburide
      - Insulin
      - Insulin Aspart, Recombinant
      - Insulin Bovine
      - Insulin Degludec
      - Insulin Detemir
      - Insulin Glargine, Recombinant
      - Insulin Glulisine
      - Insulin Lispro, Recombinant
      - Metformin
      - Methotrexate
      - Nateglinide
      - Repaglinide
      - Tolazamide
      - Tolbutamide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Avocado
      - Bitter Orange
      - Ethanol
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tyramine Containing Food
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcoholism
    - type: list
      ordered: false
      items:
      - Angina (chest pain) or
      - Heart or blood vessel disease or
      - Heart attack or stroke (recent)—Lowered blood pressure caused by procarbazine
        may make problems associated with some of these conditions worse
    - type: list
      ordered: false
      items:
      - Chickenpox (including recent exposure) or
      - Herpes zoster (shingles)—Risk of severe disease affecting other parts of the
        body
    - type: list
      ordered: false
      items:
      - Type 2 diabetes mellitus—Procarbazine may change the amount of diabetes medicine
        needed
    - type: list
      ordered: false
      items:
      - Epilepsy—Procarbazine may change the seizures
    - type: list
      ordered: false
      items:
      - Headaches (severe or frequent)—You may not realize when a severe headache
        is caused by a dangerous reaction to procarbazine
    - type: list
      ordered: false
      items:
      - Infection—Procarbazine can reduce immunity to infection
    - type: list
      ordered: false
      items:
      - Kidney disease—Effects may be increased because of slower removal of procarbazine
        from the body
    - type: list
      ordered: false
      items:
      - Liver disease—Procarbazine can cause severe liver disease to become much worse
    - type: list
      ordered: false
      items:
      - Mental illness (or history of)—Some cases of mental illness may be worsened
    - type: list
      ordered: false
      items:
      - Overactive thyroid—Increased risk of dangerous reaction to procarbazine
    - type: list
      ordered: false
      items:
      - Parkinson's disease—May be worsened
    - type: list
      ordered: false
      items:
      - Pheochromocytoma—Blood pressure may be affected
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor. Do not use more or less
      of it and do not use it more often than your doctor ordered. The exact amount
      of medicine you need has been carefully worked out. Taking too much may increase
      the chance of side effects while taking too little may not improve your condition.
  - type: paragraph
    text: Procarbazine is sometimes given together with certain other medicines. If
      you are using a combination of medicines, make sure that you take each one at
      the right time and do not mix them. Ask your health care professional to help
      you plan a way to take your medicines at the right times.
  - type: paragraph
    text: Procarbazine commonly causes nausea and vomiting. Even if you begin to feel
      ill, do not stop using this medicine without first checking with your doctor.
      Ask your health care professional for ways to lessen these effects.
  - type: paragraph
    text: If you vomit shortly after taking a dose of procarbazine, check with your
      doctor. You will be told whether to take the dose again or to wait until the
      next scheduled dose.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly and to check for unwanted
      effects.
  - type: paragraph
    text: Check with your doctor or hospital emergency room immediately if severe
      headache, stiff neck, chest pains, fast heartbeat, or nausea and vomiting occur
      while you are taking this medicine. These may be symptoms of a serious high
      blood pressure reaction that should have a doctor's attention.
  - type: paragraph
    text: 'When taken with certain foods, drinks, or other medicines, procarbazine
      can cause very dangerous reactions such as sudden high blood pressure. To avoid
      such reactions, obey the following rules of caution :'
  - type: list
    ordered: false
    items:
    - Do not eat foods that have a high tyramine content (most common in foods that
      are aged or fermented to increase their flavor), such as cheeses, yeast or meat
      extracts, fava or broad bean pods, smoked or pickled meat, poultry, or fish,
      fermented sausage (bologna, pepperoni, salami, and summer sausage) or other
      unfresh meat, or any overripe fruit. If a list of these foods and beverages
      is not given to you, ask your health care professional to provide one.
    - Do not drink alcoholic beverages or alcohol-free or reduced-alcohol beer or
      wine.
    - Do not eat or drink large amounts of caffeine-containing food or beverages,
      such as chocolate, coffee, tea, or cola.
    - Do not take any other medicine unless approved or prescribed by your doctor.
      This especially includes over-the-counter (OTC) or nonprescription medicine
      such as that for colds (including nose drops or sprays), cough, asthma, hay
      fever, appetite control; “keep awake” products; or products that make you sleepy.
  - type: paragraph
    text: After you stop using this medicine you must continue to obey the rules of
      caution concerning food, drink, and other medication for at least 2 weeks since
      procarbazine may continue to react with certain foods or other medicines for
      up to 14 days after you stop taking it.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that slow down the nervous system, possibly causing drowsiness).
      Some examples of CNS depressants are antihistamines or medicine for hay fever,
      other allergies, or colds; sedatives, tranquilizers, or sleeping medicine; prescription
      pain medicine or narcotics; barbiturates; medicine for seizures; muscle relaxants;
      or anesthetics, including some dental anesthetics. Check with your doctor before
      taking any of the above while you are using this medicine.
  - type: paragraph
    text: This medicine may cause some people to become drowsy or less alert than
      they are normally. Make sure you know how you react to this medicine before
      you drive, use machines, or do anything else that could be dangerous if you
      are not alert.
  - type: paragraph
    text: While you are being treated with procarbazine, and after you stop treatment
      with it, do not have any immunizations (vaccinations) without your doctor's
      approval. Procarbazine may lower your body's resistance and there is a chance
      you might get the infection the immunization is meant to prevent. In addition,
      other persons living in your household should not take or should not have recently
      taken oral polio vaccine since there is a chance they could pass the polio virus
      on to you. Also, avoid persons who have taken oral polio vaccine. Do not get
      close to them and do not stay in the same room with them for very long. If you
      cannot take these precautions, you should consider wearing a protective face
      mask that covers the nose and mouth.
  - type: paragraph
    text: 'Procarbazine can lower the number of white blood cells in your blood temporarily,
      increasing the chance of getting an infection. It can also lower the number
      of platelets, which are necessary for proper blood clotting. If this occurs,
      there are certain precautions you can take, especially when your blood count
      is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising;
      black, tarry stools; blood in urine or stools; or pinpoint red spots on your
      skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: 'For diabetic patients:'
  - type: list
    ordered: false
    items:
    - Procarbazine may affect blood sugar levels. While you are using this medicine,
      be especially careful in testing for sugar in your blood or urine.
  - type: paragraph
    text: If you are going to have surgery (including dental surgery) or emergency
      treatment tell the medical doctor or dentist in charge that you are using this
      medicine or have used it within the past 2 weeks.
  - type: paragraph
    text: Your doctor may want you to carry an identification card stating that you
      are using this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with their needed effects, medicines like procarbazine can sometimes
      cause unwanted effects such as blood problems, loss of hair, high blood pressure
      reactions, and other side effects. These and others are described below. Also,
      because of the way these medicines act on the body, there is a chance that they
      might cause other unwanted effects that may not occur until months or years
      after the medicine is used. These delayed effects may include certain types
      of cancer, such as leukemia. Discuss these possible effects with your doctor.
  - type: paragraph
    text: Although not all of these side effects may occur, if they do occur they
      may need medical attention.
  - type: paragraph
    text: 'Stop taking this medicine and get emergency help immediately if any of
      the following effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain (severe)
      - enlarged pupils of eyes
      - fast or slow heartbeat
      - headache (severe)
      - increased sensitivity of eyes to light
      - increased sweating (possibly with fever or cold, clammy skin)
      - stiff or sore neck
    - type: paragraph
      text: 'Check with your doctor immediately if any of the following side effects
        occur:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blood in urine or stools
      - bloody vomit
      - cough or hoarseness
      - fever or chills
      - lower back or side pain
      - painful or difficult urination
      - pinpoint red spots on skin
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - convulsions (seizures)
      - cough
      - hallucinations (seeing, hearing, or feeling things that are not there)
      - missing menstrual periods
      - shortness of breath
      - thickening of bronchial secretions
      - tiredness or weakness (continuing)
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - sores in mouth and on lips
      - tingling or numbness of fingers or toes
      - unsteadiness or awkwardness
      - yellow eyes or skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fainting
      - skin rash, hives, or itching
      - wheezing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Drowsiness
      - muscle or joint pain
      - muscle twitching
      - nausea and vomiting
      - nervousness
      - nightmares
      - trouble in sleeping
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - darkening of skin
      - difficulty in swallowing
      - dizziness or lightheadedness when getting up from a lying or sitting position
      - dry mouth
      - feeling of warmth and redness in face
      - headache
      - loss of appetite
      - mental depression
    - type: paragraph
      text: This medicine may cause a temporary loss of hair in some people. After
        treatment with procarbazine has ended, normal hair growth should return.
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
