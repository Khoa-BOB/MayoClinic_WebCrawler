title: Ciprofloxacin and dexamethasone (otic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ciprodex
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ciprofloxacin and dexamethasone combination ear drops is used to treat ear
      infections, such as acute otitis externa and acute otitis media. Otitis externa,
      also known as swimmer's ear, is an infection of the outer ear canal caused by
      bacteria. The ear canal and outer part of the ear may be swollen, red, and painful.
      Otitis media is a middle ear infection in children who have a tube in their
      eardrum (known as tympanostomy) to prevent having too much fluid in the middle
      ear.
  - type: paragraph
    text: Ciprofloxacin belongs to the class of medicines known as fluoroquinolone
      antibiotics. It works by killing the bacteria or preventing their growth. Dexamethasone
      is a steroid medicine that is used to relieve the redness, itching, and swelling
      caused by ear infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Ciprodex® ear drops in children.
        However, safety and efficacy have not been established in children younger
        than 6 months of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Ciprodex® ear drops to treat outer
        ear canal infection in the elderly.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Agomelatine
      - Artemether
      - Bepridil
      - Cisapride
      - Desmopressin
      - Dronedarone
      - Fezolinetant
      - Flibanserin
      - Levoketoconazole
      - Lomitapide
      - Mesoridazine
      - Mifepristone
      - Pimozide
