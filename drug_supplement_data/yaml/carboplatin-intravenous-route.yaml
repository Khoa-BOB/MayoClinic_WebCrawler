title: Carboplatin (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Kyxata
    - type: paragraph
      text: Paraplatin
    - type: paragraph
      text: Paraplatin NovaPlus
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: CARBOplatin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Carboplatin is used in combination with other cancer medicines to treat
      advanced ovarian cancer. It is also used alone to treat ovarian cancer that
      has come back after receiving other cancer medicines.
  - type: paragraph
    text: Carboplatin is an antineoplastic agent (cancer medicine). It interferes
      with the growth of cancer cells, which are eventually destroyed by the body.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of carboplatin injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of carboplatin injection in the elderly.
        However, elderly patients are more likely to have kidney problems and unwanted
        effects (eg, blood or bone marrow problems, nerve problems), which may require
        caution and an adjustment in the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Candesartan
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Fosphenytoin
      - Influenza Virus Vaccine, Live
      - Phenytoin
      - Rotavirus Vaccine, Live
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood or bone marrow problems or
      - Infection or
      - Nerve problems—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of the
        slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine
      in a medical facility. This medicine is given through an IV catheter that is
      placed into one of your veins. This medicine must be given slowly, so the IV
      will have to stay in place for at least 30 to 60 minutes.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. It is very important
      that you read and understand this information. Be sure to ask your doctor about
      anything you do not understand.
  - type: paragraph
    text: This medicine often causes nausea and vomiting. However, it is very important
      that you continue to receive this medicine even if you begin to feel ill. Other
      medicines may be given to you to help with the nausea and vomiting. Ask your
      doctor for other ways to lessen these effects.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Receiving this medicine while you are pregnant can harm your unborn baby.
      If you can get pregnant, your doctor may do tests to make sure you are not pregnant
      before starting treatment with this medicine. Female patients should use an
      effective form of birth control during treatment and for at least 6 months after
      the last dose. Male patients who have female partners should use effective birth
      control during treatment and for at least 3 months after the last dose. If you
      think you have become pregnant, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you have blurred vision, confusion, rash, diarrhea,
      a fever or chills, hives, hoarseness, itching, lightheadedness or dizziness,
      sweating, trouble breathing, trouble swallowing, or any swelling of your hands,
      face, or mouth after you receive the medicine.
  - type: paragraph
    text: While you are being treated with carboplatin, and after you stop treatment
      with it, do not have any immunizations (vaccinations) without your doctor's
      approval. Carboplatin may lower your body's resistance and there is a chance
      you might get the infection the immunization is meant to prevent. In addition,
      other persons living in your household should not take oral polio vaccine since
      there is a chance they could pass the polio virus on to you. Also, avoid persons
      who have taken oral polio vaccine within the last several months. Do not get
      close to them, and do not stay in the same room with them for very long. If
      you cannot take these precautions, you should consider wearing a protective
      face mask that covers the nose and mouth.
  - type: paragraph
    text: 'Carboplatin can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. It can also lower the
      number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising;
      black, tarry stools; blood in urine or stools; or pinpoint red spots on your
      skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your health care professional before having any dental
      work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: Check with your doctor right away if you are having burning, numbness, tingling,
      or painful sensations in the arms, hands, legs, or feet or unsteadiness or awkwardness.
      These could be symptoms of a condition called peripheral neuropathy.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - burning, numbness, tingling, or painful sensations
      - chest tightness
      - cough or hoarseness
      - coughing up blood
      - difficulty swallowing
      - fast heartbeat
      - fever or chills
      - headache
      - hives, itching, skin rash
      - increased menstrual flow or vaginal bleeding
      - lower back or side pain
      - nausea or vomiting
      - nosebleeds
      - painful or difficult urination
      - paralysis
      - prolonged bleeding from cuts
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - trouble breathing
      - unsteadiness or awkwardness
      - unusual tiredness or weakness
      - weakness in the arms, hands, legs, or feet
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blood in urine or stools
      - pinpoint red spots on skin
      - unusual bleeding or bruising
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - blurred vision
      - coma
      - confusion
      - depression
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        position
      - hostility
      - inability to speak
      - irritability
      - lethargy
      - muscle twitching
      - nervousness
      - pounding in the ears
      - seizures
      - slurred speech
      - stomach pain
      - stupor
      - sweating
      - swelling of the face, fingers, feet, or lower legs
      - temporary blindness
      - weight gain
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Lack or loss of strength
      - loss or thinning of the hair
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change or loss of taste
      - constipation
      - diarrhea
      - loss of appetite
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of skin, feeling of
        pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - swelling or inflammation of the mouth
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
