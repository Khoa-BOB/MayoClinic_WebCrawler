title: Doxorubicin liposome (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Doxil
    - type: paragraph
      text: Lipodox
    - type: paragraph
      text: Lipodox 50
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Doxorubicin liposome injection is used to treat ovarian cancer and Kaposi
      sarcoma (AIDS patients). It is also used together with bortezomib to treat multiple
      myeloma. Doxorubicin liposome is an antineoplastic agent (cancer medicine).
  - type: paragraph
    text: Doxorubicin liposome interferes with the growth of cancer cells, which are
      eventually destroyed by the body. Since the growth of normal body cells may
      also be affected by doxorubicin liposome, other unwanted side effects will also
      occur. Some of these may be serious and must be reported to your doctor.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of doxorubicin liposome injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of doxorubicin liposome injection
        in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Cobicistat
      - Mavorixafor
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Abrocitinib
      - Adagrasib
      - Alogliptin
      - Amiodarone
      - Amitriptyline
      - Amobarbital
      - Amprenavir
      - Apalutamide
      - Aprepitant
      - Aprobarbital
      - Asunaprevir
      - Atazanavir
      - Atorvastatin
      - Avacopan
      - Azathioprine
      - Azithromycin
      - Berotralstat
      - Boceprevir
      - Bosentan
      - Bupropion
      - Butabarbital
      - Butalbital
      - Canagliflozin
      - Capivasertib
      - Capmatinib
      - Captopril
      - Carbamazepine
      - Carvedilol
      - Celecoxib
      - Ceritinib
      - Chlorpromazine
      - Chlorzoxazone
      - Cilostazol
      - Cimetidine
      - Cinacalcet
      - Ciprofloxacin
      - Cisplatin
      - Clarithromycin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Rolapitant
      - Sorafenib
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Heart or blood vessel disease, history of—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Infection—May decrease your body's ability to fight infection.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine
      in a hospital or cancer treatment center. This medicine is given through a needle
      placed in your vein.
  - type: paragraph
    text: Do not substitute Doxil® for doxorubicin HCl injection.
  - type: paragraph
    text: This medicine often causes nausea and vomiting. Your doctor may give you
      medicine to prevent this. Talk to your doctor if you continue to have nausea
      and vomiting after you receive the medicine.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you at regular visits while
      you are receiving this medicine to make sure it is working properly. Blood tests
      may be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control while you are receiving this medicine and
      for 6 months after treatment to keep from getting pregnant. If you think you
      or your partner have become pregnant, tell your doctor right away.
  - type: paragraph
    text: Talk with your doctor before using this medicine if you plan to have children.
      Some men and women who use this medicine have become infertile (unable to have
      children).
  - type: paragraph
    text: Check with your doctor right away if you have chest pain or discomfort,
      a fast or irregular heartbeat, swelling of the feet and lower legs, or troubled
      breathing. These could be symptoms of a serious heart problem.
  - type: paragraph
    text: This medicine may cause an infusion reaction, which can be life-threatening
      and requires immediate medical attention. Tell your doctor right away if you
      have chest tightness, a cough, dizziness, a fast heartbeat, trouble breathing,
      trouble swallowing, swelling in your face or hands, a fever or chills, or lightheadedness
      or faintness while you are receiving this medicine.
  - type: paragraph
    text: This medicine may cause hand-foot syndrome. Check with your doctor right
      away if you have tingling or burning, redness, swelling, blistering, or small
      sores on the palms of your hands or soles of your feet.
  - type: paragraph
    text: 'Doxorubicin liposome can temporarily lower the number of white blood cells
      in your blood, increasing the chance of getting an infection. It can also lower
      the number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury can occur.
  - type: paragraph
    text: If you continue to receive this medicine for a full year, tell your doctor
      right away if you have any discomfort, pain, sores or ulcers in your mouth.
      These could be symptoms of oral cancer.
  - type: paragraph
    text: Tell your doctor right away if you notice redness, pain, or swelling at
      the injection site after you receive this medicine. If doxorubicin liposome
      accidentally leaks out of the vein where it is injected, it may damage the skin
      and cause scars.
  - type: paragraph
    text: This medicine may cause your urine color to be red or orange for 1 or 2
      days after you receive the injection. This is normal.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blistering, peeling, redness, or swelling of the palms of the hands or bottoms
        of the feet
      - blood in the urine or stools
      - chills
      - cough or hoarseness
      - facial swelling
      - fever
      - headache
      - loss of strength and energy
      - lower back or side pain
      - numbness, pain, tingling, or unusual sensations in the palms of the hands
        or bottoms of the feet
      - painful or difficult urination
      - pinpoint red spots on the skin
      - shortness of breath
      - sore throat
      - sores in the mouth and on the lips
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain at the injection site
      - skin rash or itching
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - decreased urine output
      - dilated neck veins
      - extreme fatigue
      - irregular breathing
      - irregular heartbeat
      - swelling of the face, fingers, feet, or lower legs
      - tightness in the chest
      - weight gain
      - yellowing of the eyes and skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Creamy white, curd-like patches in mouth or throat
      - diarrhea
      - loss of appetite
      - nausea
      - pain when eating or swallowing
      - sore throat
      - swallowing problems
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - back pain
      - bad, unusual, or unpleasant aftertaste
      - burning, dry, or itching eyes
      - change in skin color
      - constipation
      - dizziness
      - excessive tearing
      - itching
      - joint pain
      - muscle aches
      - redness, pain, or swelling of the eye, eyelid, or inner lining of the eyelid
      - trouble sleeping
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal thinking
      - change in sense of smell
      - chills
      - clumsiness, unsteadiness, trembling, or problems with muscle coordination
      - cough
      - fever
      - general feeling of discomfort or illness
      - shivering
      - sweating
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
