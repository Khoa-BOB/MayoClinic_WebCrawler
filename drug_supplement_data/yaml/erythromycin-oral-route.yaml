    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the mixed E.E.S.® oral liquid in the refrigerator. Throw away any
        unused medicine within 10 days.
    - type: paragraph
      text: Store the mixed Ery-Ped® oral liquid at room temperature. Throw away any
        unused medicine within 35 days.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you or your child's progress
      at regular visits to make sure this medicine is working properly and to check
      for unwanted effects. If your or your child's symptoms do not improve within
      a few days, or if they become worse, check with your doctor.
  - type: paragraph
    text: Do not use this medicine if you or your child are also using astemizole
      (Hismanal®), cisapride (Propulsid®), ergotamine (Cafergot®, Ergomar®), dihydroergotamine
      (Migranal®), pimozide (Orap®), terfenadine (Seldane®), or statin medicine (eg,
      lovastatin, simvastatin, Mevacor®, Zocor®). Using these medicines together may
      increase risk for more serious side effects .
  - type: paragraph
    text: Check with your doctor right away if you or your child have pain or tenderness
      in the upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual
      tiredness or weakness, or yellow eyes or skin. These could be symptoms of a
      serious liver problem.
  - type: paragraph
    text: This medicine can cause changes in heart rhythms, such as a condition called
      QT prolongation. It may change the way your heart beats and cause fainting or
      serious side effects in some patients. Contact your doctor right away if you
      or your child have worsening symptoms of heart rhythm problems, such as fast,
      pounding, or uneven heartbeat.
  - type: paragraph
    text: Make sure your doctor knows if you are pregnant or may be pregnant before
      using this medicine.
  - type: paragraph
    text: Erythromycin may cause diarrhea, and in some cases it can be severe. It
      may occur 2 months or more after you stop using this medicine. Do not take any
      medicine to treat diarrhea without first checking with your doctor. Diarrhea
      medicines may make the diarrhea worse or make it last longer. If you have any
      questions about this or if mild diarrhea continues or gets worse, check with
      your doctor.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you or your child are using this medicine. The results of some tests may be
      affected by this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - chills
      - cough
      - diarrhea
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - hives or welts, skin rash
      - joint or muscle pain
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red, irritated eyes
      - red skin lesions, often with a purple center
      - redness of the skin
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - tightness in the chest
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating
      - bloody or cloudy urine
      - chest pain or discomfort
      - dark urine
      - diarrhea, watery and severe, which may also be bloody
      - fainting
      - fever
      - general tiredness and weakness
      - greatly decreased frequency of urination or amount of urine
      - hearing loss
      - increased thirst
      - irregular heartbeat recurrent
      - irregular or slow heart rate
      - light-colored stools
      - nausea
      - pain
      - stomach cramp or tenderness
      - swelling of the feet or lower legs
      - unusual weight loss
      - upper right abdominal or stomach pain
      - vomiting
      - yellow eyes and skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea (mild)
      - loss of appetite
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
