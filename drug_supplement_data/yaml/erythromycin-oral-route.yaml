    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bradycardia (slow heartbeat) or
      - Heart rhythm problems (eg, QT prolongation) or
      - Hypokalemia (low potassium in the blood), uncorrected or
      - Hypomagnesemia (low magnesium in the blood), uncorrected—Use is not recommended
        in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Congestive heart failure—The granules and tablet dosage forms of this medicine
        contains sodium, which can make this condition worse.
    - type: list
      ordered: false
      items:
      - Liver disease (including cholestatic hepatitis) or
      - Myasthenia gravis (severe muscle weakness)—Use with caution. May make these
        conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Take this medicine with or without food. PCE® tablets may be taken without
      meals or at least 30 minutes to 2 hours before meals.
  - type: paragraph
    text: Measure the mixed oral liquid with a marked measuring spoon, oral syringe,
      or medicine cup.
  - type: paragraph
    text: Keep using the medicine for the full time of treatment , even if you or
      your child begin to feel better after the first few doses. Your infection may
      not go away if you stop using the medicine too soon.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (granules for suspension, suspension, and tablets):
        For treatment of bacterial infections: Adults—400 milligrams (mg) every 6
        hours or 800 mg every 12 hours. Depending on the severity of your infection,
        your doctor may increase your dose as needed up to 4000 mg per day. Children—Dose
        is based on body weight and must be determined by your doctor. The dose is
        usually 30 to 50 milligrams (mg) per kilogram (kg) of body weight per day,
        divided in equal doses and taken every 6 hours. Depending on the severity
        of your infection, your doctor may increase your dose as needed.'
      - 'For oral dosage form (PCE® tablets): For prevention of recurring attacks
        of rheumatic fever: Adults—250 milligrams (mg) 2 times a day. Children—Use
        and dose must be determined by your doctor. For treatment of bacterial infections:
        Adults—333 milligrams (mg) every 8 hours or 500 mg every 12 hours. Depending
        on the severity of your infection, your doctor may increase your dose as needed
        up to 4000 mg per day. Children—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 30 to 50 milligrams (mg) per kilogram
        (kg) of body weight per day, divided in equal doses. Depending on the severity
        of your infection, your doctor may increase your dose as needed.'
    - type: list
      ordered: false
      items:
      - 'For treatment of bacterial infections: Adults—400 milligrams (mg) every 6
        hours or 800 mg every 12 hours. Depending on the severity of your infection,
        your doctor may increase your dose as needed up to 4000 mg per day. Children—Dose
        is based on body weight and must be determined by your doctor. The dose is
