    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hemolytic anemia (a blood disorder) or
      - Hemophilia (a bleeding disorder) or
      - Hepatitis or
      - Hyperbilirubinemia (high bilirubin in the blood) or
      - Hyperglycemia (high blood sugar) or
      - Nephrolithiasis (kidney stones)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease (including cirrhosis)—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. Also, do not stop taking this medicine without checking
      first with your doctor.
  - type: paragraph
    text: Indinavir is used with other medicines to treat HIV infection. Take all
      other medicines your doctor has prescribed as part of your combination treatment.
      Your dose of indinavir may depend on the other medicines you are using.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions in the insert carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: This medicine should be taken with water on an empty stomach (1 hour before
      or 2 hours after a meal) or with a light meal. Indinavir may also be taken with
      other liquids (eg, skim milk, juice, coffee, or tea) or with a light meal (eg,
      dry toast with jelly, juice, coffee with skim milk and sugar, or corn flakes
      with skim milk and sugar).
  - type: paragraph
    text: While you are taking indinavir, it is important that you drink extra fluids
      so that you will pass more urine. This will help prevent possible kidney stones.
      Follow your doctor's instructions carefully about how much fluid to drink. Usually
      you will need to drink at least 48 ounces (1.5 liters or 6 full glasses) of
      fluids every day during your treatment.
  - type: paragraph
    text: Keep taking indinavir for the full time of treatment, even if you begin
      to feel better.
  - type: paragraph
    text: This medicine works best when there is a constant amount in the blood. To
      help keep the amount constant, do not miss any doses. Also, it is best to take
      the doses at evenly spaced times, day and night. For example, if you are to
      take three doses a day, the doses should be spaced about 8 hours apart. If you
      need help in planning the best times to take your medicine, check with your
      doctor.
  - type: paragraph
    text: Only take medicine that your doctor has prescribed specially for you. Do
      not share your medicine with others.
  - type: paragraph
    text: If you miss a dose or forget to use your medicine less than 2 hours , use
      it as soon as you can. If your next regular dose is more than 2 hours , wait
      until then to use the medicine and skip the missed dose.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For treatment of HIV infection: Adults—800
        milligrams (mg) every 8 hours. Your doctor may adjust your dose if needed.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of HIV infection: Adults—800 milligrams (mg) every 8 hours.
        Your doctor may adjust your dose if needed. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—800 milligrams (mg) every 8 hours. Your doctor may adjust your dose
        if needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Indinavir capsules are very sensitive to moisture. Keep them in their
        original container and leave the drying packet in the container.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: Do not take any other medicines without checking first with your doctor.
      To do so may increase the chance of side effects from indinavir or other medicines.
  - type: paragraph
    text: You should not use this medicine if you are also using alfuzosin (Uroxatral®),
      alprazolam (Xanax®), amiodarone (Cordarone®), cisapride (Propulsid®), ergot
      medicines (eg, dihydroergotamine, ergonovine, ergotamine, methylergonovine,
      Cafergot®, D.H.E. 45®, Ergotrate®, Methergine®, Migranal®, Wigraine®), lovastatin
      (Mevacor®), lurasidone (Latuda®), oral midazolam (Versed®), pimozide (Orap®),
      rifampin (Rifadin®, Rifamate®, Rifater®, Rimactane®), sildenafil (Revatio®),
      simvastatin (Zocor®), St. John's wort, or triazolam (Halcion®). Using any of
      them together with this medicine may increase the chance of serious side effects.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  - type: paragraph
    text: This medicine may raise your blood sugar. Check with your doctor if you
      notice a change in the results of your blood or urine sugar tests.
  - type: paragraph
    text: This medicine may increase your risk of having kidney stones. Check with
      your doctor right away if you have blood in your urine, nausea and vomiting,
      pain in the groin or genitals, or sharp back pain just below the ribs.
  - type: paragraph
    text: When you start taking HIV medicines, your immune system may get stronger.
      If you have infections that are hidden in your body, such as pneumonia or tuberculosis,
      you may notice new symptoms when your body tries to fight them. If this occurs,
      tell your doctor immediately.
  - type: paragraph
    text: This medicine may cause you to have excess body fat. Tell your doctor if
      you notice changes in your body shape, such as an increased amount of fat in
      the upper back and neck, or around the chest and stomach area. You might also
      lose fat from the legs, arms, and face.
  - type: paragraph
    text: This medicine will not protect you from getting HIV/AIDS or other sexually
      transmitted diseases. Also, it will not keep you from giving HIV to your partner
      during sex. Make sure you understand and practice safe sex, even if your partner
      also has HIV. Do not share needles with anyone.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blood in the urine
      - sharp back pain just below the ribs
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - chills
      - clay-colored stools
      - dark urine
      - dizziness
      - fever
      - headache
      - itching
      - loss of appetite
      - nausea
      - rash
      - unpleasant breath odor
      - unusual tiredness or weakness
      - vomiting of blood
      - yellow eyes or skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - dehydration
      - dry or itchy skin
      - fruity mouth odor
      - increased hunger
      - increased thirst
      - increased urination
      - pale skin
      - troubled breathing with exertion
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
      - weight loss
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in sense of taste
      - diarrhea
      - difficulty with sleeping
      - generalized weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - acid regurgitation
      - belching
      - cough
      - general feeling of discomfort or illness
      - heartburn
      - increase in appetite
      - indigestion
      - sleepiness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
