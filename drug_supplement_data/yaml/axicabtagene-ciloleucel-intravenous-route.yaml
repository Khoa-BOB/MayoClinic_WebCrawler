title: Axicabtagene ciloleucel (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Yescarta
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Axicabtagene ciloleucel injection is used to treat follicular lymphoma and
      large B-cell lymphoma (including diffuse large B-cell lymphoma [DLBCL], primary
      mediastinal large B-cell lymphoma, high grade B-cell lymphoma, or DLBCL from
      follicular lymphoma) that has come back or after 2 or more lines of treatment
      did not work well. It is also used to treat large B-cell lymphoma that has come
      back within a year of first treatment or after first line of treatment did not
      work well.
  - type: paragraph
    text: Axicabtagene ciloleucel injection is an antineoplastic (cancer) medicine
      that is made from your own white blood cells, which have been modified to recognize
      and attack your cancer cells. Before you begin treatment, talk to your doctor
      about the benefits of this medicine as well as the possible risks of receiving
      it.
  - type: paragraph
    text: This medicine is available only under a restricted distribution program
      called Yescarta® and Tecartus™ REMS (Risk Evaluation and Mitigation Strategy)
      Program.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of axicabtagene ciloleucel injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of axicabtagene ciloleucel injection
        in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart problems or
      - Heart rhythm problems (eg, arrhythmia, tachycardia) or
      - Hypotension (low blood pressure) or
      - Infections (including hepatitis B), active or history of or
      - Kidney disease or
      - Lung or breathing problems or
      - Seizures, history of or
      - Stroke, history of—Use with caution. May cause side effects to become worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital or cancer center. It is given through an IV placed into one of
      your veins. The medicine must be injected slowly, so your IV will need to stay
      in place for less than 30 minutes. It is given 3 days after completing treatment
      with other cancer medicines (eg, fludarabine, cyclophosphamide).
  - type: paragraph
    text: Your doctor will check you for unwanted effects at least daily for 7 days.
      Your doctor may also want you to stay close to the hospital or center for at
      least 4 weeks after your infusion.
  - type: paragraph
    text: You may be given other medicines (eg, allergy medicine, fever medicine,
      steroid medicine) 1 hour before starting treatment with this medicine.
  - type: paragraph
    text: It is very important that you understand the requirements of the Yescarta®
      and Tecartus™ REMS program, and become familiar with the Yescarta® medication
      guide. Read and follow these instructions carefully. Ask your doctor if you
      have any questions. Ask your pharmacist for the medication guide if you do not
      have one.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests are needed
      to check for unwanted effects.
  - type: paragraph
    text: If you can get pregnant, your doctor may do tests to make sure you are not
      pregnant before starting treatment.
  - type: paragraph
    text: This medicine may cause cytokine release syndrome (CRS) and infusion reactions.
      This may be life-threatening and requires immediate attention. Tell your doctor
      right away if you have a fever, chills, headache, nausea, lightheadedness, dizziness,
      fainting, skin rash, trouble breathing, or tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have seizures, loss of balance,
      loss of consciousness, confusion, disorientation, difficulty with speaking,
      or slurred speech. These could be symptoms of a serious nerve problem.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which may be life-threatening and require immediate medical attention. Check
      with your doctor right away if you have a rash, itching, dizziness, fainting,
      fast heartbeat, trouble breathing or swallowing, or chest tightness while you
      are using this medicine.
  - type: paragraph
    text: This medicine can temporarily lower the number of white blood cells in your
      blood, which increases the chance of getting an infection. If you can, avoid
      people with infections. Check with your doctor immediately if you think you
      are getting an infection or if you have a fever or chills, cough or hoarseness,
      lower back or side pain, or painful or difficult urination.
  - type: paragraph
    text: This medicine may increase your risks for hypogammaglobulinemia (immune
      system problem) and getting other cancers, including certain types of blood
      cancers. Talk to your doctor if you have questions about these risks.
  - type: paragraph
    text: This medicine may cause dizziness, confusion, seizures, or decreased alertness.
      Do not drive or do anything else that could be dangerous until you know how
      this medicine affects you, for at least 8 weeks after treatment.
  - type: paragraph
    text: While you are being treated with axicabtagene ciloleucel injection, do not
      have any immunizations (vaccinations) without your doctor's approval. Live virus
      vaccinations should not be given for at least 6 weeks before start of treatment,
      during treatment, and until recovery following the last cycle of this medicine.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are taking this medicine. The results of some tests may be affected by this
      medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - back pain
      - bleeding gums
      - bloody urine
      - blue lips and fingernails
      - blurred vision
      - chest pain, discomfort, or tightness
      - chills
      - confusion as to time, place, or person
      - cough
      - coughing that sometimes produces a pink frothy sputum
      - coughing up blood
      - decreased frequency or amount of urine
      - diarrhea
      - difficult, fast, noisy breathing
      - dilated neck veins
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - drowsiness
      - dry mouth
      - fast, pounding, or irregular heartbeat or pulse
      - fever
      - general feeling of discomfort or illness
      - headache
      - hoarseness
      - holding false beliefs that cannot be changed by fact
      - increase in heart rate
      - increased blood pressure
      - increased menstrual flow or vaginal bleeding
      - increased sweating
      - increased thirst
      - irregular breathing
      - irritability
      - lightheadedness
      - loss of appetite
      - loss of consciousness
      - lower back or side pain
      - mood or mental changes
      - muscle, joint, or bone pain
      - nausea
      - nervousness
      - nosebleeds
      - painful or difficult urination
      - pale skin
      - paralysis
      - pounding in the ears
      - problems with speech or speaking
      - prolonged bleeding from cuts
      - rapid breathing
      - red or black, tarry stools
      - red or dark brown urine
      - seeing, hearing, or feeling things that are not there
      - seizures
      - shakiness and unsteady walk
      - slow heartbeat
      - stiff neck
      - sunken eyes
      - swelling of the face, fingers, feet, or lower legs
      - tenderness, pain, swelling, warmth, skin discoloration, and prominent superficial
        veins over the affected area
      - thirst
      - trembling or shaking of the hands or feet
      - trouble breathing
      - unsteadiness, trembling, or other problems with muscle control or coordination
      - unusual excitement, nervousness, or restlessness
      - unusual tiredness or weakness
      - vomiting
      - weight gain
      - wrinkled skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cloudy urine
      - muscle twitching or jerking
      - rhythmic movement of the muscles
      - stomach pain
      - unusual bleeding or bruising
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty in moving or walking
      - difficulty swallowing
      - muscle stiffness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - decreased appetite and weight
      - pain in the arms or legs
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
