title: Indomethacin (rectal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Indocin
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
