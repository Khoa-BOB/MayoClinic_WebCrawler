    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Bleeding problems or
      - Blood clots or
      - Depression or other mental changes or
      - Edema (fluid retention or body swelling) or
      - Heart attack, recent or history of or
      - Heart disease (eg, congestive heart failure) or
      - Hepatitis or jaundice, history of or
      - Hyperkalemia (high potassium in the blood) or
      - Hypertension (high blood pressure) or
      - Kidney disease or
      - Liver disease or
      - Parkinsonism or
      - Seizures or epilepsy, history of or
      - Stomach ulcers or bleeding, history of or
      - Stroke, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Aspirin-sensitive asthma, history of or
      - Aspirin sensitivity, history of or
      - Proctitis (inflammation of the rectum), history of or
      - Rectal bleeding, recent—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Heart surgery (eg, coronary artery bypass graft [CABG] surgery)—Should not
        be used to relieve pain right before or after the surgery.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: For safe and effective use of this medicine, do not use more of it, do not
      use it more often, and do not use it for a longer time than your doctor ordered
      . Using too much of this medicine may increase the chance of unwanted effects.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: When used for severe or continuing arthritis, this medicine must be used
      regularly as ordered by your doctor in order for it to help you. This medicine
      usually begins to work within one week, but in severe cases up to two weeks
      or even longer may pass before you begin to feel better. Also, several weeks
      may pass before you feel the full effects of this medicine.
  - type: paragraph
    text: Do not take rectal suppositories by mouth or use it in the vagina.
  - type: paragraph
    text: 'To use the suppository:'
  - type: list
    ordered: false
    items:
    - If the suppository is too soft to insert, chill it in the refrigerator for 30
      minutes or run cold water over it before removing the foil wrapper.
    - Remove the foil wrapper and moisten the suppository with cold water.
    - Lie down on your side and use your finger to push the suppository well up into
      the rectum
    - Remain lying down for about 15 minutes to keep the suppository from coming out
      before it melts.
    - Make sure to wash your hands with soap and water before and after inserting
      this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For rectal dosage form (suppositories): For moderate to severe ankylosing
        spondylitis, osteoarthritis, or rheumatoid arthritis: Adults and children
        older than 14 years of age—One 50-milligram (mg) suppository, inserted into
        the rectum up to 3 times a day. Children up to 14 years of age—Use and dose
        must be determined by your doctor. For acute painful shoulder caused by bursitis
        or tendinitis: Adults and children older than 14 years of age—One suppository
        inserted into the rectum 3 to 4 times a day. Children up to 14 years of age—Use
        and dose must be determined by your doctor. For gout: Adults and children
        older than 14 years of age—One suppository inserted into the rectum 3 times
        a day. Children up to 14 years of age—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - 'For moderate to severe ankylosing spondylitis, osteoarthritis, or rheumatoid
        arthritis: Adults and children older than 14 years of age—One 50-milligram
        (mg) suppository, inserted into the rectum up to 3 times a day. Children up
        to 14 years of age—Use and dose must be determined by your doctor.'
      - 'For acute painful shoulder caused by bursitis or tendinitis: Adults and children
        older than 14 years of age—One suppository inserted into the rectum 3 to 4
        times a day. Children up to 14 years of age—Use and dose must be determined
        by your doctor.'
      - 'For gout: Adults and children older than 14 years of age—One suppository
        inserted into the rectum 3 times a day. Children up to 14 years of age—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children older than 14 years of age—One 50-milligram (mg) suppository,
        inserted into the rectum up to 3 times a day.
      - Children up to 14 years of age—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults and children older than 14 years of age—One suppository inserted into
        the rectum 3 to 4 times a day.
      - Children up to 14 years of age—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults and children older than 14 years of age—One suppository inserted into
        the rectum 3 times a day.
      - Children up to 14 years of age—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits.
      This will allow your doctor to see if the medicine is working properly and to
      decide if you should continue to use it. Blood and urine tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: This medicine may increase your risk of having a heart attack or stroke.
      This is more likely in people who already have heart disease. People who use
      this medicine for a long time might also have a higher risk.
  - type: paragraph
    text: This medicine may cause bleeding in your stomach or intestines. These problems
      can happen without warning signs. This is more likely if you have had a stomach
      ulcer in the past, if you smoke or drink alcohol regularly, are over 60 years
      of age, are in poor health, or are using certain other medicines (such as a
      steroid medicine or a blood thinner).
  - type: paragraph
    text: 'Serious skin reactions can occur during treatment with this medicine. Check
      with your doctor right away if you have any of the following symptoms while
      using this medicine: blistering, peeling, loosening of the skin, chills, cough,
      diarrhea, fever, itching, joint or muscle pain, red skin lesions, sore throat,
      sores, ulcers, white spots in the mouth or on the lips, or unusual tiredness
      or weakness.'
  - type: paragraph
    text: Some possible warning signs of serious side effects that can occur during
      treatment with this medicine may include black, tarry stools, decreased urination,
      severe stomach pain, skin rash, swelling of the face, fingers, feet, or lower
      legs, unusual bleeding or bruising, unusual weight gain, vomiting of blood or
      material that looks like coffee grounds, or yellow skin or eyes. Also, signs
      of serious heart problems could occur, such as chest pain, tightness in chest,
      fast or irregular heartbeat, unusual flushing or warmth of the skin, weakness,
      or slurring of speech. Stop using this medicine and check with your doctor right
      away if you notice any of these warning signs.
  - type: paragraph
    text: This medicine may also cause a serious type of allergic reaction called
      anaphylaxis. Although this is rare, it may occur more often in patients who
      are allergic to aspirin or to any of the nonsteroidal anti-inflammatory drugs
      (NSAIDs). Anaphylaxis can be life-threatening and requires immediate medical
      attention. The most serious signs of this reaction are very fast or irregular
      breathing, gasping for breath, or fainting. Other signs may include changes
      in color of the skin of the face, very fast but irregular heartbeat or pulse,
      hive-like swellings on the skin, and puffiness or swellings of the eyelids or
      around the eyes. If these effects occur, get emergency help at once.
  - type: paragraph
    text: Using this medicine during the later part of a pregnancy can harm your unborn
      baby. If you think you have become pregnant while using the medicine, tell your
      doctor right away.
  - type: paragraph
    text: This medicine may cause a delay in ovulation for women and may affect their
      ability to have children. If you plan to have children, talk with your doctor
      before using this medicine.
  - type: paragraph
    text: Check with your doctor immediately if blurred vision, difficulty in reading,
      or any other change in vision occurs during or after treatment. Your doctor
      may want you to have your eyes checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: This medicine may cause some people to become dizzy, lightheaded, drowsy,
      or less alert than they are normally. Even if used at bedtime, it may cause
      some people to feel drowsy or less alert on arising. Make sure you know how
      you react to this medicine before you drive, use machines, or do anything else
      that could be dangerous if you are not alert .
  - type: paragraph
    text: Before having any kind of surgery or medical tests, tell your doctor that
      you are using this medicine. It may be necessary for you to stop treatment for
      a while, or to change to a different nonsteroidal anti-inflammatory drug before
      your procedure.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements. .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
