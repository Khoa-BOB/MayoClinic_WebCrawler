title: Nelarabine (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Arranon
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Nelarabine injection is used to treat specific types of cancer called T-cell
      acute lymphoblastic leukemia (T-ALL) and T-cell lymphoblastic lymphoma (T-LBL).
      This medicine is usually given to patients who have already received at least
      two other cancer medicines.
  - type: paragraph
    text: Nelarabine belongs to the group of medicines called antineoplastics. It
      interferes with the growth of cancer cells, which are eventually destroyed.
      Since the growth of normal body cells may also be affected by nelarabine, other
      effects will also occur. Some of these may be serious and must be reported to
      your doctor. Other effects may not be serious, but may cause concern.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of nelarabine injection in children
        1 year of age and older. However, safety and efficacy have not been established
        in children younger than 1 year of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of nelarabine injection in the elderly.
        However, elderly patients are more likely to have age-related kidney or nervous
        system problems, which may require caution and an adjustment in the dose for
        patients receiving nelarabine injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Pentostatin
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood problems (eg, anemia, neutropenia) or
      - Hyperuricemia (high uric acid in the blood) or
      - Kidney disease, moderate or severe or
      - Liver disease, severe or
      - Nervous system problems—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Infection—May decrease your body's ability to fight infections.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: A doctor or other trained health professional will give you or your child
      this medicine in a hospital or cancer treatment center. It is given through
      an IV catheter that is placed into one of your veins. This medicine must be
      given slowly, so the IV will have to stay in place for at least 1 to 2 hours.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. Read it carefully
      and make sure you understand it before receiving this medicine. If you have
      any questions, ask your doctor.
  - type: paragraph
    text: Your doctor may want you to drink extra fluids so that you will pass more
      urine. Your doctor may also give medicine to decrease uric acid in the blood
      (eg, allopurinol). This will help prevent kidney problems and keep your kidneys
      working well.
  - type: paragraph
    text: Nelarabine sometimes causes nausea and vomiting. However, it is very important
      that you continue to receive the medicine , even if you begin to feel ill. Ask
      your doctor for ways to lessen these effects if they bother you.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure that this medicine is working properly. Blood
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Receiving this medicine while you are pregnant can harm your unborn baby.
      If you can get pregnant, your doctor may do tests to make sure you are not pregnant
      before receiving this medicine. Use an effective form of birth control during
      treatment to keep from getting pregnant. Male patients with female partners
      should use an effective form of birth control during treatment and for 3 months
      after the last dose. If you think you have become pregnant while receiving the
      medicine, tell your doctor right away.
  - type: paragraph
    text: Nelarabine can cause serious nervous system problems. This may be more likely
      in patients who have had cancer treatment or radiation treatment to the head
      or back in the past. Check with your doctor right away if you or your child
      have a headache, dizziness, numbness and tingling in the hands, fingers, feet,
      or toes, extreme sleepiness, seizures, clumsiness or unsteadiness while walking,
      or weakness in the arms, hands, legs, or feet.
  - type: paragraph
    text: While you are being treated with nelarabine, and after you stop treatment
      with it, do not have any immunizations (vaccinations) without your doctor's
      approval . Nelarabine may lower your body's resistance and there is a chance
      you or your child might get the infection the vaccination is meant to prevent.
      In addition, other persons living in your household should not take oral polio
      vaccine since there is a chance they could pass the polio virus on to you. Also,
      avoid persons who have taken oral polio vaccine within the last several months.
      Do not get close to them, and do not stay in the same room with them for very
      long. If you cannot take these precautions, you should consider wearing a protective
      face mask that covers the nose and mouth.
  - type: paragraph
    text: 'Nelarabine can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. It can also lower the
      number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: This medicine may cause a serious reaction called tumor lysis syndrome (TLS).
      Call your doctor right away if you or your child have a change in how much or
      how often you urinate, rapid weight gain, muscle or joint pain, swelling of
      the feet or lower legs, or feel tired.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, lightheaded, drowsy,
      or less alert than they are normally. If any of these side effects occur, do
      not drive, use machines, or do anything else that could be dangerous if you
      are dizzy or are not alert while you are using nelarabine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - bloody nose
      - blurred vision
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - change in walking and balance
      - chest pain or tightness
      - chills
      - clumsiness or unsteadiness
      - cold sweats
      - coma
      - cool, pale skin
      - cough or hoarseness
      - decreased or uncontrolled urination
      - discouragement
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - drowsiness
      - dry mouth
      - fast or irregular heartbeat
      - feeling sad or empty
      - feeling unusually cold
      - fever
      - flushed, dry skin
      - fruit-like breath odor
      - headache
      - incoordination
      - increased hunger
      - increased thirst
      - increased urination
      - irritability
      - loss of appetite
      - loss of interest or pleasure
      - lower back, side, or stomach pain
      - mood or mental changes
      - muscle cramps in the hands, arms, feet, legs, or face
      - muscle pain, spasms, twitching, or weakness
      - nausea or vomiting
      - nervousness
      - nightmares
      - numbness, tingling, pain, or weakness in the hands, feet, fingertips, or mouth
      - pain or tenderness around the eyes and cheekbones
      - painful or difficult urination
      - pale skin
      - paralysis or severe weakness of the legs
      - pinpoint red spots on the skin
      - rapid breathing
      - seizures
      - shakiness and unsteady walk
      - shivering
      - sleepiness or unusual drowsiness
      - slurred speech
      - small red or purple spots on the skin
      - sneezing
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach pain or cramps
      - stuffy or runny nose
      - sunken eyes
      - sweating
      - swelling of the hands, ankles, feet, or lower legs
      - swollen glands
      - trouble concentrating
      - trouble sleeping
      - trouble breathing
      - uncontrolled bowel movements
      - unexplained weight loss
      - unsteadiness, trembling, or other problems with muscle control or coordination
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - wrinkled skin
      - yellow eyes or skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in taste
      - loss of memory
      - loss of taste
      - problems with memory
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm or leg pain
      - back pain
      - diarrhea
      - difficulty having a bowel movement (stool)
      - difficulty with moving
      - full or bloated feeling
      - joint pain
      - lack or loss of strength
      - muscle aching or stiffness
      - pressure in the stomach
      - swelling of the stomach area
      - swelling or inflammation of the mouth
      - swollen joints
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
