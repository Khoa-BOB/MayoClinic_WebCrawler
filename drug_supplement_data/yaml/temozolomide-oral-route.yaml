title: Temozolomide (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Temodar
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Temozolomide is used to treat specific types of brain cancer (eg, glioblastoma
      multiforme, anaplastic astrocytoma) in patients whose tumors have returned or
      whose tumors have just been diagnosed. It belongs to the group of medicines
      known as antineoplastics (cancer medicines).
  - type: paragraph
    text: Temozolomide interferes with the growth of cancer cells, which are then
      destroyed by the body. Since the growth of normal body cells may also be affected
      by temozolomide, other side effects may occur. Some of these may be serious
      and must be reported to your doctor. Some side effects may not occur for months
      or years after the medicine is used.
  - type: paragraph
    text: Before you begin treatment with temozolomide, you and your doctor should
      talk about the risks and benefits of this medicine.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of temozolomide in the pediatric population. Safety and efficacy
        have not been established. .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of temozolomide
        have not been performed in the geriatric population, geriatric-specific problems
        are not expected to limit the usefulness of temozolomide in the elderly. However,
        elderly patients are more likely to have kidney, liver, or heart problems,
        which may require caution and an adjustment in the dose for patients receiving
        temozolomide.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bone marrow problems (eg, anemia, leukemia, myelodysplastic syndrome, pancytopenia,
        thrombocytopenia) or
      - Liver problems—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Infection—May decrease your body's ability to fight infections.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease, severe—Use with caution.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more or
      less of it and do not take it for a longer time than directed. To do so may
      increase the chance of unwanted side effects.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Take this medicine at the same time each day, either with or without food.
  - type: paragraph
    text: Temozolomide often causes nausea and vomiting. However, it is very important
      that you continue to take the medicine, even if you begin to feel ill . You
      may take the medicine on an empty stomach or at bedtime may help to lessen the
      nausea. Ask your doctor for other ways to help lessen these effects.
  - type: paragraph
    text: Swallow the capsules whole with a full glass of water. Do not open, chew,
      or dissolve it. If the capsule is opened accidentally, do not allow the powder
      to contact your skin, mouth, or nose. Be careful not to inhale the contents
      of the capsule.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For newly diagnosed glioblastoma multiforme:
        Adults—Dose is based on body size and must be determined by your doctor. The
        dose is usually 75 milligrams (mg) per square meter (m[2]) of body size once
        day for 42 to 49 days together with radiation treatment. Followed by a maintenance
        treatment of 150 mg/m2 on Days 1 to 5 of each 28-day cycle for 6 cycles. Your
        doctor may adjust your dose as needed and tolerated. Children—Use and dose
        must be determined by your doctor. For newly diagnosed anaplastic astrocytoma:
        Adults—Dose is based on body size and must be determined by your doctor. The
        dose is usually 150 milligrams (mg) per square meter (m[2]) of body size once
        a day on Days 1 to 5 of each 28-day cycle for 12 cycles starting at 4 weeks
        after receiving radiation treatment. Your doctor may adjust your dose as needed
        and tolerated. Children—Use and dose must be determined by your doctor. For
        refractory anaplastic astrocytoma: Adults—Dose is based on body size and must
        be determined by your doctor. The starting dose is usually 150 milligrams
        (mg) per square meter (m[2]) of body size once a day on Days 1 to 5 of each
        28-day cycle. Your doctor may adjust your dose as needed and tolerated. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For newly diagnosed glioblastoma multiforme: Adults—Dose is based on body
        size and must be determined by your doctor. The dose is usually 75 milligrams
        (mg) per square meter (m[2]) of body size once day for 42 to 49 days together
        with radiation treatment. Followed by a maintenance treatment of 150 mg/m2
        on Days 1 to 5 of each 28-day cycle for 6 cycles. Your doctor may adjust your
        dose as needed and tolerated. Children—Use and dose must be determined by
        your doctor.'
      - 'For newly diagnosed anaplastic astrocytoma: Adults—Dose is based on body
        size and must be determined by your doctor. The dose is usually 150 milligrams
        (mg) per square meter (m[2]) of body size once a day on Days 1 to 5 of each
        28-day cycle for 12 cycles starting at 4 weeks after receiving radiation treatment.
        Your doctor may adjust your dose as needed and tolerated. Children—Use and
        dose must be determined by your doctor.'
      - 'For refractory anaplastic astrocytoma: Adults—Dose is based on body size
        and must be determined by your doctor. The starting dose is usually 150 milligrams
        (mg) per square meter (m[2]) of body size once a day on Days 1 to 5 of each
        28-day cycle. Your doctor may adjust your dose as needed and tolerated. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Dose is based on body size and must be determined by your doctor. The
        dose is usually 75 milligrams (mg) per square meter (m[2]) of body size once
        day for 42 to 49 days together with radiation treatment. Followed by a maintenance
        treatment of 150 mg/m2 on Days 1 to 5 of each 28-day cycle for 6 cycles. Your
        doctor may adjust your dose as needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—Dose is based on body size and must be determined by your doctor. The
        dose is usually 150 milligrams (mg) per square meter (m[2]) of body size once
        a day on Days 1 to 5 of each 28-day cycle for 12 cycles starting at 4 weeks
        after receiving radiation treatment. Your doctor may adjust your dose as needed
        and tolerated.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—Dose is based on body size and must be determined by your doctor. The
        starting dose is usually 150 milligrams (mg) per square meter (m[2]) of body
        size once a day on Days 1 to 5 of each 28-day cycle. Your doctor may adjust
        your dose as needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause birth defects if either partner is using it during
      conception or pregnancy. If you are a woman who can get pregnant, your doctor
      may do tests to make sure you are not pregnant before starting this medicine.
      Use an effective form of birth control during treatment and for at least 6 months
      after your last dose. Males with female partners who are able to become pregnant
      should use an effective form of birth control during treatment and for 3 months
      after the last dose. If you think you have become pregnant, tell your doctor
      right away.
  - type: paragraph
    text: 'Temozolomide can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. It can also lower the
      number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may cause serious lung or breathing problems (eg, pneumonia).
      Check with your doctor right away if you have chest pain or tightness, cough,
      fever or chills, sneezing, sore throat, or trouble breathing.
  - type: paragraph
    text: This medicine may increase risk of blood problems and secondary cancer (eg,
      myeloid leukemia). Check with your doctor right away if you have chest pain,
      chills, cough or hoarseness, fever, lower back or side pain, painful or difficult
      urination, sores, ulcers, or white spots on the lips or in the mouth, swollen
      glands, trouble breathing, unusual bleeding or bruising, or unusual tiredness
      or weakness.
  - type: paragraph
    text: Male patients should not donate semen during treatment and for at least
      3 months after the final dose of this medicine.
  - type: paragraph
    text: If you plan to have children, talk with your doctor before using this medicine.
      Some men using this medicine have become infertile (unable to have children).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Amnesia
      - black, tarry stools
      - blood in the urine or stools
      - cough or hoarseness
      - fever or chills
      - lower back or side pain
      - muscle weakness or paralysis on one or both sides of the body
      - painful or difficult urination
      - pinpoint red spots on the skin
      - seizures
      - swelling of the feet or lower legs
      - unusual bleeding or bruising
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - chest pain or tightness
      - clay colored stools
      - cough
      - decreased appetite
      - diarrhea
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - headache
      - hives, itching, or skin rash
      - joint or muscle pain
      - nausea or vomiting
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - sneezing
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach pain or tenderness
      - trouble breathing
      - unusual tiredness or weakness
      - yellow skin or eyes
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blurred or double vision
      - breast pain (in females)
      - burning or prickling feeling on the skin
      - confusion
      - diarrhea
      - difficulty with speaking
      - drowsiness
      - increased urge to urinate
      - loss of appetite
      - loss of muscle coordination
      - mental depression
      - runny or stuffy nose
      - trouble sleeping
      - unusual weight gain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
