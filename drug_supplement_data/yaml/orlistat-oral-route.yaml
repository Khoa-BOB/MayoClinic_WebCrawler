title: Orlistat (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Alli
    - type: paragraph
      text: Xenical
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Orlistat is used with a reduced-calorie diet and regular exercise to help
      with weight loss. This medicine is used in people with overweight or obesity.
  - type: paragraph
    text: This medicine is available both over-the-counter (OTC) and with your doctor's
      prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of orlistat in teenagers. Safety
        and efficacy have not been established in children younger than 12 years of
        age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of orlistat in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abacavir
      - Acenocoumarol
      - Acetazolamide
      - Acetazolamide Sodium
      - Acetohexamide
      - Apixaban
      - Ardeparin
      - Argatroban
      - Atazanavir
      - Azathioprine
      - Bemiparin
      - Betrixaban
      - Bivalirudin
      - Brivaracetam
      - Cannabidiol
      - Carbamazepine
      - Cenobamate
      - Certoparin
      - Chlorpropamide
      - Clobazam
      - Clonazepam
      - Clorazepate
      - Clorazepate Dipotassium
      - Cobicistat
      - Cyclosporine
      - Dabigatran Etexilate
      - Dalteparin
      - Danaparoid
      - Darunavir
      - Desirudin
      - Diazepam
      - Didanosine
      - Divalproex Sodium
      - Edoxaban
      - Efavirenz
      - Elvitegravir
      - Emtricitabine
      - Enoxaparin
      - Eslicarbazepine Acetate
      - Ethosuximide
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Linoleic Acid
      - Vitamin E
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hypothyroidism (underactive thyroid)—Use with caution. May increase risk for
        more serious side effects.
    - type: list
      ordered: false
      items:
      - Eating disorders (eg, anorexia nervosa or bulimia) or
      - HIV infection or
      - Hyperoxaluria (high oxalic acid in the urine), history of or
      - Kidney failure or
      - Kidney stones or
      - Liver disease—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Gallbladder problems or
      - Malabsorption syndrome (trouble digesting food)—Should not be used in patients
        with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions in the insert carefully. Talk to your doctor if you have any questions.
  - type: paragraph
    text: Orlistat prevents the absorption of some of the fat you eat. You should
      take it with liquids during the meal or up to 1 hour after eating. If you occasionally
      miss a meal or eat a meal that contains no fat, you should skip the dose of
      orlistat.
  - type: paragraph
    text: Because orlistat may decrease the amount of some vitamins that your body
      absorbs from food, you will need to take a multivitamin supplement once a day.
      Take the vitamin supplement at least 2 hours before or after taking orlistat.
      You may also take your multivitamin supplement at bedtime.
  - type: paragraph
    text: When using orlistat, your diet should contain no more than 30% of calories
      as fat. More fat in your diet will increase the side effects of this medicine.
      Your diet should be nutritionally balanced, and your daily intake of fat, carbohydrates,
      and protein should be distributed over three main meals.
  - type: paragraph
    text: Carefully follow your doctor's instructions for a reduced-calorie diet plan
      and regular exercise. Talk with your doctor before starting any exercise program.
  - type: paragraph
    text: If you are taking cyclosporine, take it at least 3 hours before or after
      taking this medicine. Levothyroxine should be taken 4 hours before or after
      taking orlistat.
  - type: paragraph
    text: Take a multivitamin supplement that contains vitamins A, D, E, and K with
      beta carotene at least 2 hours before or after taking this medicine. Orlistat
      keeps your body from absorbing some of the vitamins from food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For treatment of obesity: Adults and teenagers—120
        milligrams (mg) 3 times a day with meals containing fat. Children younger
        than 12 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of obesity: Adults and teenagers—120 milligrams (mg) 3 times
        a day with meals containing fat. Children younger than 12 years of age—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—120 milligrams (mg) 3 times a day with meals containing
        fat.
      - Children younger than 12 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits , to make sure that this medicine is working properly. Blood
      and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: 'For patients with diabetes: Weight loss may result in an improvement in
      your condition, and your doctor may need to change your dose of oral diabetes
      medicine or insulin.'
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: This medicine may increase your risk of having kidney stones. Check with
      your doctor right away if you or your child have blood in the urine, nausea
      and vomiting, pain in the groin or genitals, or sharp back pain just below the
      ribs.
  - type: paragraph
    text: This medicine may increase your risk of gallbladder problems (eg, cholelithiasis).
      Check with your doctor right away if you or your child have gaseous stomach
      pain, recurrent fever, stomach fullness, or yellow eyes or skin.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - body aches
      - chills
      - cough
      - diarrhea
      - difficulty with breathing
      - ear congestion
      - fever
      - general feeling of discomfort or illness
      - headache
      - loss of appetite
      - loss of voice
      - lower back or side pain
      - muscle aches and pains
      - nasal congestion
      - nausea
      - runny nose
      - shivering
      - sneezing
      - sore throat
      - sweating
      - trouble sleeping
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - tooth or gum problems
      - trouble breathing
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody or cloudy urine
      - change in hearing
      - contagious diarrhea
      - dark urine
      - difficult or painful urination
      - earache
      - fast heartbeat
      - frequent urge to urinate
      - general tiredness and weakness
      - hives
      - hoarseness
      - irritation
      - itching
      - joint pain, stiffness, or swelling
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - light-colored stools
      - noisy breathing
      - rash
      - redness of the skin
      - skin blisters
      - swelling of the eyelids, face, lips, hands, or feet
      - trouble swallowing
      - upper right abdominal or stomach pain
      - yellow eyes and skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - bloating
      - blurred vision
      - cold sweats
      - coma
      - confusion
      - constipation
      - cool, pale skin
      - depression
      - dizziness
      - dry skin and hair
      - feeling cold
      - hair loss
      - hoarseness or husky voice
      - increased hunger
      - indigestion
      - loss of appetite
      - muscle cramps and stiffness
      - nervousness
      - nightmares
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - seizures
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - difficulty with moving
      - gas with leaky bowel movements
      - inability to hold bowel movement
      - increases in bowel movements
      - loss of bowel control
      - oily bowel movements
      - oily spotting of underclothes
      - stomach pain or discomfort
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Itching of the vagina or genital area
      - menstrual changes
      - pain during sexual intercourse
      - rectal pain or discomfort
      - thick, white vaginal discharge with no odor or with a mild odor
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
