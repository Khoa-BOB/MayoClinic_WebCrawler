    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angioedema (swelling of the face, lips, tongue, or throat), history of or
      - Diabetes patients who are also taking aliskiren (Tekturna®)—Should not be
        used in these patients.
    - type: list
      ordered: false
      items:
      - Aortic stenosis (heart valve problem), severe or
      - Congestive heart failure, severe or
      - Heart disease, severe—Use with caution. May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Heart failure or
      - Kidney disease, severe or
      - Liver disease—Use is not recommended in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: In addition to using this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these are most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure, but
      it does help control it. You must continue to take it as directed if you expect
      to lower your blood pressure and keep it down. You might have to take high blood
      pressure medicine for the rest of your life . If high blood pressure is not
      treated, it can cause serious problems such as heart failure, blood vessel disease,
      strokes, or kidney disease.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For high blood pressure: Adults—At first,
        one tablet containing perindopril 3.5 milligrams (mg) and amlodipine 2.5 mg
        once a day. Your doctor may adjust your dose as needed. However, the dose
        is usually not more than perindopril 14 mg and amlodipine 10 mg per day. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—At first, one tablet containing perindopril
        3.5 milligrams (mg) and amlodipine 2.5 mg once a day. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than perindopril
        14 mg and amlodipine 10 mg per day. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, one tablet containing perindopril 3.5 milligrams (mg) and
        amlodipine 2.5 mg once a day. Your doctor may adjust your dose as needed.
        However, the dose is usually not more than perindopril 14 mg and amlodipine
        10 mg per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If it is less than 12 hours until your next regular dose, take your next
        dose at the regular time.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: You should not use this medicine together with sacubitril. Do not use this
      medicine and sacubitril/valsartan (Entresto®) within 36 hours of each other.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis.
      This can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, lips, tongue, or throat
      while you are using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have severe stomach pain (with
      or without nausea or vomiting). This could be a symptom of a condition called
      intestinal angioedema.
  - type: paragraph
    text: This medicine may cause angina (chest pain) or a heart attack in certain
      patients with severe heart or blood vessel disease. Check with your doctor right
      away if you are having chest pain or discomfort, fast or irregular heartbeat,
      nausea or vomiting, pain or discomfort in the arms, jaw, back, or neck, shortness
      of breath, or sweating.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting, may occur especially when you get
      up suddenly from a lying or sitting position or if you have been taking a diuretic
      (water pill). Do not drive or do anything else that could be dangerous if you
      are dizzy . If you feel dizzy, lie down so you do not faint. Then sit for a
      few moments before standing to prevent the dizziness from returning.
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, decrease in
      frequency or amount of urine, increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, troubled breathing, unusual tiredness or weakness, vomiting,
      or weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Before having any type of surgery (including dental surgery) or emergency
      treatment, tell the doctor or dentist in charge that you are taking this medicine.
  - type: paragraph
    text: 'Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have the following symptoms:
      abdominal or stomach pain, confusion, difficulty with breathing, irregular heartbeat,
      nausea, vomiting, nervousness, numbness or tingling in the hands, feet, or lips,
      shortness of breath, or weakness or heaviness of the legs. Ask your doctor before
      you use any medicine, supplement, or salt substitute that contains potassium
      .'
  - type: paragraph
    text: This medicine may be less effective in black patients. Black patients also
      have an increased risk of swelling of the hands, arms, face, mouth, or throat.
      Talk with your doctor if you have concerns about this.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes prescription or nonprescription (over-the-counter [OTC])
      medicines for appetite control, asthma, colds, cough, hay fever, or sinus problems,
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - rapid weight gain
      - tingling of the hands or feet
      - unusual weight gain or loss
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm, back, or jaw pain
      - bloody urine
      - blurred vision
      - chest pain or discomfort
      - chest tightness or heaviness
      - confusion
      - decreased frequency or amount of urine
      - difficult breathing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fast or irregular heartbeat
      - increased thirst
      - irregular heartbeat
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss of appetite
      - lower back or side pain
      - nausea
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - pain or discomfort in the arms, jaw, back or neck
      - stomach pain
      - sweating
      - unusual tiredness or weakness
      - vomiting
      - weakness or heaviness of the legs
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - dizziness
      - headache
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
