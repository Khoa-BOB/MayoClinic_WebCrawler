title: Gepirone (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Exxua
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Gepirone is used to treat major depressive disorder (MDD).
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of gepirone in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of gepirone in the elderly. However,
        elderly patients may be more sensitive to the effects of this medicine than
        younger adults which may require caution and an adjustment in the dose for
        patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Boceprevir
      - Ceritinib
      - Cisapride
      - Clarithromycin
      - Cobicistat
      - Dronedarone
      - Idelalisib
      - Indinavir
      - Isocarboxazid
      - Itraconazole
      - Ketoconazole
      - Levoketoconazole
      - Linezolid
      - Lonafarnib
      - Methylene Blue
      - Mifepristone
      - Nefazodone
      - Nelfinavir
      - Ozanimod
      - Paritaprevir
      - Phenelzine
      - Piperaquine
      - Posaconazole
      - Procarbazine
      - Rasagiline
      - Ribociclib
      - Ritonavir
      - Safinamide
      - Saquinavir
      - Selegiline
      - Sparfloxacin
      - Telaprevir
      - Telithromycin
      - Terfenadine
      - Thioridazine
      - Tranylcypromine
      - Troleandomycin
      - Tucatinib
      - Voriconazole
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adagrasib
      - Alfentanil
      - Alfuzosin
      - Almotriptan
      - Amineptine
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amitriptylinoxide
      - Amoxapine
      - Amphetamine
      - Amprenavir
      - Anagrelide
      - Anileridine
      - Apalutamide
      - Apomorphine
      - Aprepitant
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Avacopan
      - Azithromycin
      - Bedaquiline
      - Benzhydrocodone
      - Benzphetamine
      - Brompheniramine
      - Buprenorphine
      - Buserelin
      - Buspirone
      - Butorphanol
      - Carbamazepine
      - Chloroquine
      - Chlorpheniramine
      - Chlorpromazine
      - Cimetidine
      - Ciprofloxacin
      - Citalopram
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bipolar disorder, or risk of or
      - Electrolyte problems (eg, low magnesium or potassium in the blood), history
        of or
      - Heart attack, recent or
      - Heart disease or
      - Heart failure or
      - Heart rhythm problems or
      - High blood pressure, uncontrolled or
      - Hypothyroidism (underactive thyroid), uncontrolled or
      - Mania or hypomania, history of—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease, mild to moderate—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Heart rhythm problem (eg, QT prolongation) or
      - Liver disease, severe—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine should come with a Medication Guide. It is very important
      that you read and understand this information. Be sure to ask your doctor about
      anything you do not understand.
  - type: paragraph
    text: Take this medicine with food at the same time each day.
  - type: paragraph
    text: Swallow the extended-release tablet whole. Do not split, crush, or chew
      it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets): For depression: Adults—At
        first, 18.2 milligrams (mg) once a day. Your doctor may adjust your dose as
        needed and tolerated. However, the dose is usually not more than 72.6 mg per
        day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For depression: Adults—At first, 18.2 milligrams (mg) once a day. Your doctor
        may adjust your dose as needed and tolerated. However, the dose is usually
        not more than 72.6 mg per day. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 18.2 milligrams (mg) once a day. Your doctor may adjust your
        dose as needed and tolerated. However, the dose is usually not more than 72.6
        mg per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      allow for changes in your dose and help reduce any side effects. Blood tests
      may be needed to check for unwanted effects.
  - type: paragraph
    text: Tell your doctor if you are pregnant or plan to become pregnant. Using this
      medicine during the last 3 months of pregnancy can harm your unborn baby. Tell
      your doctor right away if you become pregnant or if you think you may be pregnant
      while using this medicine.
  - type: paragraph
    text: Gepirone may cause some teenagers and young adults to be agitated, irritable,
      or display other abnormal behaviors. It may also cause some people to have suicidal
      thoughts and tendencies or to become more depressed. Some people may have trouble
      sleeping, get upset easily, have a big increase in energy, or start to act reckless.
      If you or your caregiver notice any of these unwanted effects, tell your doctor
      right away. Let the doctor know if you or anyone in your family has bipolar
      disorder (manic-depressive) or has tried to commit suicide.
  - type: paragraph
    text: Do not use this medicine if you are using or have used an MAO inhibitor
      (MAOI), including linezolid (Zyvox®) or methylene blue injection within the
      past 14 days.
  - type: paragraph
    text: This medicine can cause a change in heart rhythm called QT prolongation.
      This condition may change the way your heart beats (faster or slower) and can
      cause chest pain, dizziness, fainting, or trouble breathing. Call your doctor
      right away if you have any of these symptoms or any questions.
  - type: paragraph
    text: This medicine may cause a condition called serotonin syndrome when used
      together with some medicines (eg, SSRIs, TCAs). Check with your doctor right
      away if you have anxiety, restlessness, fast heartbeat, fever, sweating, muscle
      spasms, twitching, nausea, vomiting, diarrhea, seeing or hearing things that
      are not there.
  - type: paragraph
    text: Do not suddenly stop taking this medicine without checking first with your
      doctor . Your doctor may want you to gradually reduce the amount you are using
      before stopping it completely.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - chills
      - cough
      - ear congestion
      - fever
      - headache
      - loss of voice
      - sneezing
      - sore throat
      - stuffy or runny nose
      - trouble breathing
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - confusion
      - delusions
      - dementia
      - rapid weight gain
      - tingling of the hands or feet
      - unusual weight gain or loss
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - dry mouth
      - fast, irregular, pounding, or racing heartbeat or pulse
      - hyperventilation
      - irritability
      - nervousness
      - restlessness
      - shaking
      - trouble sleeping
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Actions that are out of control
      - diarrhea
      - difficulty swallowing
      - fainting
      - irregular heartbeat
      - nervousness
      - overactive reflexes
      - poor coordination
      - shivering
      - skin itching, rash, or redness
      - sweating
      - swelling of the face, throat, or tongue
      - talking, feeling, and acting with excitement
      - talking or acting with excitement you cannot control
      - thoughts or attempts at killing oneself
      - trembling or shaking
      - twitching
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - dizziness
      - feeling sleepy or tired
      - heartburn
      - indigestion
      - nausea
      - stomach discomfort, upset, or pain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Breast tenderness
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - increase appetite
      - muscle aches
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Feeling jittery
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
