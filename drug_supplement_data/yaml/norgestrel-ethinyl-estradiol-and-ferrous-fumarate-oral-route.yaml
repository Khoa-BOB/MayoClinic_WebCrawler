    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
      - Dairy Food
      - Phytic Acid Containing Food
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Abnormal or unusual vaginal bleeding or
      - Blood clots (eg, deep vein thrombosis, pulmonary embolism), or history of
        or
      - Breast cancer, active or history of or
      - Diabetes with kidney, eye, nerve, or blood vessel damage or
      - Heart attack, history of or
      - Heart or blood vessel disease (eg, coronary artery disease, heart valve problems)
        or
      - Heart rhythm problems (atrial fibrillation) or
      - Hypertension (high blood pressure), uncontrolled or
      - Liver disease, including tumors or cancer or
      - Migraine headache, new or worse or a new kind of headache or
      - Problems with circulation or blood clots, now or in the past or
      - Stroke, history of—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Angioedema (swelling of the face, tongue, or throat), inherited or
      - Cervical cancer or intraepithelial neoplasia or
      - Chloasma gravidarum (skin disorder during pregnancy), history of or
      - Cholestasis (bile problem) during pregnancy, history of or
      - Depression, history of or
      - Diabetes or
      - Dyslipidemia (high cholesterol or fats in the blood), uncontrolled or
      - Gallbladder disease or
      - Hypertension (high blood pressure)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Diarrhea or
      - Vomiting—May decrease the absorption of norgestrel and ethinyl estradiol combination
        in the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine exactly as directed by your
      doctor . Do not use more of it, do not use it more often, and do not use it
      for a longer time than your doctor ordered.
  - type: paragraph
    text: This medicine comes with patient instructions. Read and follow these instructions
      carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: This medicine is available in blister packs. Each blister pack contains
      28 tablets with different colors that need to be taken in the same order as
      directed on the blister pack.
  - type: paragraph
    text: When you begin using this medicine, your body will require at least 7 days
      to adjust before a pregnancy will be prevented. Use a second form of contraception
      (eg, condom, spermicide, or diaphragm) for the first 7 days of your first cycle
      of pills.
  - type: paragraph
    text: Take this medicine at the same time each day. Birth control pills work best
      when no more than 24 hours pass between doses.
  - type: paragraph
    text: Do not skip or delay taking your pill by more than 24 hours . If you miss
      a dose, you could get pregnant. Ask your doctor for ways to help you remember
      to take your pills or about using another method of birth control.
  - type: paragraph
    text: You may have light bleeding or spotting when you first take the pill.
  - type: paragraph
    text: You may feel sick or nauseous, especially during the first few months that
      you take this medicine. If your nausea is continuous and does not go away, call
      your doctor.
  - type: paragraph
    text: If you vomit or have diarrhea within 3 to 4 hours of taking this medicine,
      treat this as a missed dose and follow the instructions in the patient leaflet
      or call your doctor.
  - type: paragraph
    text: 'If you are switching from another birth control method to using Lo/Ovral®
      :'
  - type: list
    ordered: false
    items:
    - Transdermal patch, vaginal ring, implant, or injection—Start Lo/Ovral® on the
      day that you would usually apply, insert, or inject the medicine.
    - Intrauterine device (IUD)—Start Lo/Ovral® on the day of removing the IUD. Use
      a second form of birth control for the first 7 days if the IUD has not been
      removed on the first day of your menstrual cycle.
  - type: paragraph
    text: If you have a miscarriage or an abortion in the first trimester of your
      pregnancy , you may start using this medicine right away. You do not need a
      second form of birth control. If you start this medicine 5 days or more after
      the miscarriage or abortion, you should use a second form of non-hormonal birth
      control for the first 7 days of your first pill cycle. If you have a miscarriage
      or abortion after the second trimester, you should wait for 4 weeks before starting
      this medicine. Use another form of birth control for the first 7 days of your
      first pill cycle if you use this medicine on a Sunday.
  - type: paragraph
    text: Do not drink grapefruit juice while you are using this medicine. Grapefruit
      juice may change the amount of this medicine that is absorbed in the body.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: paragraph
      text: Your doctor may ask you to begin your dose on the first day of your menstrual
        period (called Day 1 Start) or on the first Sunday after your menstrual period
        starts (called Sunday Start). When you begin on a certain day, it is important
        that you follow that schedule, even if you miss a dose. Do not change your
        schedule on your own. If the schedule that you use is not convenient, check
        with your doctor about changing it. For a Sunday start, you need to use another
        form of birth control (eg, condom, diaphragm, spermicide) for the first 7
        days.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (tablets): For contraception (to prevent pregnancy):
        Adults and teenagers—One white tablet (active) taken at the same time each
        day for 21 consecutive days followed by one brown (inert) tablet daily for
        7 days per menstrual cycle. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - 'For contraception (to prevent pregnancy): Adults and teenagers—One white
        tablet (active) taken at the same time each day for 21 consecutive days followed
        by one brown (inert) tablet daily for 7 days per menstrual cycle. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—One white tablet (active) taken at the same time each
        day for 21 consecutive days followed by one brown (inert) tablet daily for
        7 days per menstrual cycle.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    - type: list
      ordered: false
      items:
      - 'If you miss one white active tablet in weeks 1, 2, or 3: Take the tablet
        as soon as possible and take the next tablet at your regular schedule. Continue
        taking one tablet a day until you finish the pack.'
      - 'If you miss two white active tablets in week 1 or 2: Take the two tablets
        as soon as possible and the next two tablets the next day. Continue taking
        one tablet a day until you finish the pack. Use a second form of birth control
        (eg, condom, spermicide) for 7 days after you miss a dose.'
      - 'If you miss two white active tablets in week 3, or you miss three or more
        white active tablets in a row in weeks 1, 2, or 3: Day 1 start: Throw out
        the rest of the pack and start a new pack that same day. Use a second form
        of birth control (eg, condom, spermicide) for 7 days after you miss a dose.
        Sunday start: Continue taking one tablet a day until Sunday, then throw out
        the rest of the pack and start a new pack that same day. Use a second form
        of birth control (eg, condom, spermicide) for 7 days after you miss a dose,
        to prevent pregnancy.'
      - You could have light bleeding or spotting if you do not take a pill on time.
        The more pills you miss, the more likely you are to have bleeding.
      - Make sure your doctor knows if you miss your period 2 months in a row, because
        this could mean that you are pregnant.
    - type: list
      ordered: false
      items:
      - 'Day 1 start: Throw out the rest of the pack and start a new pack that same
        day. Use a second form of birth control (eg, condom, spermicide) for 7 days
        after you miss a dose.'
      - 'Sunday start: Continue taking one tablet a day until Sunday, then throw out
        the rest of the pack and start a new pack that same day. Use a second form
        of birth control (eg, condom, spermicide) for 7 days after you miss a dose,
        to prevent pregnancy.'
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and does not cause unwanted effects.
  - type: paragraph
    text: Although you are using this medicine to prevent pregnancy, you should know
      that using this medicine while you are pregnant could harm your unborn baby.
      If you think you have become pregnant while using the medicine, tell your doctor
      right away. Make sure your doctor knows if you had given birth within 4 weeks
      before you start using this medicine.
  - type: paragraph
    text: Do not use this medicine together with medicine to treat hepatitis C virus
      infection, including ombitasvir/paritaprevir/ritonavir, with or without dasabuvir
      (Technivie®, Viekira Pak®).
  - type: paragraph
    text: You might have some light bleeding or spotting during the first 3 months
      of use. This is usually normal and should not last long. However, if you have
      heavy bleeding or the bleeding lasts more than a few days in a row, call your
      doctor.
  - type: paragraph
    text: Do not use this medicine if you smoke cigarettes or if you are over 35 years
      of age . If you smoke while using this medicine, you increase your risk of having
      a blood clot, heart attack, or stroke. Your risk is even higher if you are over
      age 35, if you have diabetes, high blood pressure, high cholesterol, or if you
      are overweight. Talk with your doctor about ways to stop smoking. Keep your
      diabetes under control. Ask your doctor about diet and exercise to control your
      weight and blood cholesterol level.
  - type: paragraph
    text: Using this medicine may increase your risk of having blood clotting problems.
      Check with your doctor right away if you have pain in the chest, groin, or legs,
      especially the calves, difficulty with breathing, a sudden, severe headache,
      slurred speech, a sudden, unexplained shortness of breath, a sudden loss of
      coordination, or vision changes while using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: This medicine may increase your risk of having gallbladder disease. Check
      with your doctor if you start to have stomach pains, nausea, and vomiting.
  - type: paragraph
    text: This medicine may cause skin discoloration. Use a sunscreen when you are
      outdoors. Avoid sunlamps and tanning beds.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery or certain medical tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Breast discomfort
      - change in the color, amount, or odor of vaginal discharge
      - change in the pattern of monthly periods
      - cramps
      - dull ache or feeling of pressure or heaviness in the legs
      - heavy bleeding
      - itching skin near damaged veins
      - medium to heavy, irregular vaginal bleeding between regular monthly periods,
        which may require the use of a pad or a tampon
      - swollen feet and ankles
      - unusual stopping of menstrual bleeding
    subsections: []
  - heading: Rare common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Absent, missed, or irregular menstrual periods
      - blurred vision
      - dizziness
      - headache
      - headache, severe and throbbing
      - nervousness
      - pounding in the ears
      - slow or fast heartbeat
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating
      - chest pain or discomfort
      - chills
      - clay-colored stool
      - confusion
      - constipation
      - dark urine
      - diarrhea
      - difficulty breathing
      - difficulty in speaking
      - double vision
      - fever
      - inability to move the arms, legs, or facial muscles
      - inability to speak
      - indigestion
      - itching, skin rash
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss of appetite
      - nausea
      - pain in the chest, groin, or legs, especially the calves
      - pain or discomfort in the arms, jaw, back, or neck
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - pelvic pain
      - slow or slurred speech
      - stomach pain
      - sudden loss of coordination
      - sudden, severe weakness or numbness in the arm or leg
      - sweating
      - unpleasant breath odor
      - unusual tiredness or weakness
      - vomiting
      - vomiting of blood
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acne
      - depression
      - increased appetite
      - patchy brown or dark brown discoloration of the skin
      - stomach cramps, discomfort, or pain
      - swollen mouth and tongue
      - unpleasant taste
      - urge to have a bowel movement
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
