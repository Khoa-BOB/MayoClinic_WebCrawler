title: Antivenin (crotalidae) polyvalent immune fab (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Crofab
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: 'Pit viper antivenin injection is used to treat the bites of certain poisonous
      snakes called pit vipers (crotalids), which are native to North America. This
      particular pit viper antivenin is made from the blood of sheep and is used to
      treat the bites of the following types of pit viper: the Western Diamondback,
      Eastern Diamondback, and Mojave rattlesnakes, and the Copperhead snake, Cottonmouth,
      or Water Moccasin.'
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of pit viper antivenin injection
        in children. Safety and efficacy have been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of pit viper antivenin injection
        in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to papaya or to the enzyme papain—Should not be used in patients with
        this condition, unless management for an allergic reaction is readily available.
    - type: list
      ordered: false
      items:
      - Allergy to chymopapain, bromelain (pineapple enzyme), dust mite, or latex
        or
      - Cancer or
      - Collagen disease or
      - Congestive heart failure or
      - Diarrhea or
      - Fever or
      - Liver problems or
      - Poor nutrition status (malnourishment) or
      - Thyroid problems or
      - Vitamin K deficiency—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Snake bite, previous—Use with caution. During previous treatment, your body
        may have developed antibodies (proteins produced by the immune system that
        help the body fight infection and are involved in allergic reactions), which
        may cause a serious allergic reaction with the current treatment.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins. The medicine must be given slowly, so the needle will have to remain
      in place for at least 60 minutes.
  - type: paragraph
    text: Your doctor will need to watch you for at least one hour after your injection
      to make sure the medicine is working properly and does not cause unwanted side
      effects.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      closely while receiving this medicine to make sure this medicine is working
      properly. Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Check with your doctor right away if you have any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, headache, dizziness, or weakness,
      pain, swelling, or discomfort in a joint, pinpoint red spots on your skin, unusual
      nosebleeds, or unusual vaginal bleeding that is heavier than normal. These may
      be signs of bleeding problems.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth after receiving
      this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bruising
      - cough
      - difficulty in moving
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - feeling of discomfort
      - fever
      - hives, itching, skin rash
      - joint pain or swelling
      - large, flat, blue or purplish patches in the skin
      - muscle cramps, pain, or stiffness
      - problems with bleeding or clotting
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - swollen lymph glands
      - tightness in the chest
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain or discomfort
      - confusion
      - difficulty breathing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fast, pounding, or irregular heartbeat or pulse
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - noisy breathing
      - rapid, shallow breathing
      - sweating
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - itching, swelling, redness, tenderness, or hard lump at the injection site
      - pinpoint red spots on the skin
      - tremor
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - loss of appetite
      - nausea
      - nervousness
      - small lumps under the skin
      - weight loss
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bone pain
      - feeling cold
      - headache
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
