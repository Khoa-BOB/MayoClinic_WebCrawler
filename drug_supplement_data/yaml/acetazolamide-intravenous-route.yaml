title: Acetazolamide (intravenous route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Acetazolamide injection is used to treat edema (fluid retention) caused
      by heart failure or other medicines. This medicine is also used to treat seizures
      (eg, petit mal, unlocalized seizures). It is also used to treat open-angle glaucoma,
      secondary glaucoma, and acute angle-closure glaucoma before surgery to lower
      pressure inside the eye.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of acetazolamide injection in the pediatric population. Safety
        and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Diamox® injection in the pediatric population. Safety and
        efficacy have not been established. However, children receiving long-term
        treatment with this medicine are more likely to have slowed growth.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of acetazolamide injection in geriatric patients.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Diamox® injection in the elderly.
        However, elderly patients are more likely to have heart, liver, or kidney
        problems, which may require caution in patients using this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Methenamine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amphetamine
      - Arsenic Trioxide
      - Articaine
      - Aspirin
      - Azathioprine
      - Benzphetamine
      - Carbamazepine
      - Dextroamphetamine
      - Digitalis
      - Digoxin
      - Droperidol
      - Hydroxychloroquine
      - Insulin Aspart, Recombinant
      - Levoketoconazole
      - Levomethadyl
      - Lidocaine
      - Lisdexamfetamine
      - Lithium
      - Memantine
      - Mercaptopurine
      - Metformin
      - Methamphetamine
      - Methotrexate
      - Orlistat
      - Pimozide
      - Porfimer
      - Primidone
      - Proscillaridin
      - Quinidine
      - Sotalol
      - Topiramate
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aminolevulinic Acid
      - Cyclosporine
      - Fosphenytoin
      - Licorice
      - Phenytoin
      - Salsalate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Adrenal gland problem or
      - Glaucoma, noncongestive angle-closure or
      - Hypokalemia (low potassium levels in the blood) or
      - Hyponatremia (low sodium levels in the blood) or
      - Kidney disease or
      - Liver disease (eg, cirrhosis) or
      - Metabolic acidosis—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Lung problems (eg, emphysema)—Use with caution. May make these conditions
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious skin reactions (eg, Stevens-Johnson syndrome
      and toxic epidermal necrolysis). Check with your doctor if you have blistering,
      peeling, or loosening of the skin, chills, cough, diarrhea, itching, joint or
      muscle pain, red irritated eyes, red skin lesions, often with a purple center,
      sore throat, sores, ulcers, or white spots in the mouth or on the lips, or unusual
      tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Check
      with your doctor right away if you have chest tightness, cough, difficulty swallowing,
      dizziness, fast heartbeat, hives, itching, skin rash, puffiness or swelling
      of the eyelids or around the eyes, face, lips, or tongue, trouble breathing,
      or unusual tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have blood in the urine, nausea
      and vomiting, pain in the groin or genitals, or sharp back pain just below the
      ribs. These may be symptoms of kidney stones.
  - type: paragraph
    text: Check with your doctor right away if you have chest pain or tightness, chills,
      cough or hoarseness, fever with or without chills, general feeling of tiredness
      or weakness, headache, lower back or side pain, painful or difficult urination,
      sore throat, sores, ulcers, or white spots in the mouth, swollen or painful
      glands, trouble breathing, unusual bleeding or bruising, or unusual tiredness
      or weakness. These maybe symptoms of serious blood problems (eg, agranulocytosis,
      aplastic anemia).
  - type: paragraph
    text: Receiving this medicine together with aspirin may cause change or loss of
      consciousness, loss of appetite, rapid shallow breathing, trouble breathing,
      or weight loss. Talk with your doctor if you have any concerns about this.
  - type: paragraph
    text: This medicine may cause eye or vision problems (eg, choroidal effusion,
      choroidal detachment). Check with your doctor right away if you have change
      in vision, flashes of light, or floaters in vision.
  - type: paragraph
    text: This medicine may cause changes in your blood sugar levels. Check with your
      doctor if you have these problems or if you notice a change in the results of
      your blood or urine sugar tests.
  - type: paragraph
    text: This medicine may cause electrolyte imbalance (eg, hyponatremia, hypokalemia,
      metabolic acidosis). Check with your doctor right away if you have coma, confusion,
      decreased urine output, dizziness, drowsiness, dry mouth, fast or irregular
      heartbeat, headache, increased thirst, loss of appetite, muscle pain or cramps,
      muscle tremors, nausea or vomiting, numbness or tingling in the hands, feet,
      or lips, restlessness, seizures, stomach cramps, trouble breathing, swelling
      of the face, ankles, or hands, or unusual tiredness or weakness.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      you have surgery or medical tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - anxiety
      - black, tarry stools
      - blistering, peeling, or loosening of the skin
      - blood in the urine
      - bloody nose
      - blurred vision
      - bone fractures, especially of the femur
      - change in consciousness
      - changes in vision
      - chest pain or tightness
      - chills
      - clay-colored stools
      - cold sweats
      - coma
      - confusion
      - cool, pale skin
      - cough or hoarseness
      - dark urine
      - depression
      - diarrhea
      - difficulty swallowing
      - dizziness
      - drowsiness
      - dry mouth
      - fast heartbeat
      - feeling of warmth
      - fever
      - flashes of light
      - floaters in vision
      - frequent urination
      - headache
      - heavier menstrual periods
      - hives, itching, skin rash
      - hostility
      - increased hunger
      - increased thirst
      - increased volume of pale, dilute urine
      - irritability
      - itching
      - joint or muscle pain
      - lethargy
      - loss of appetite
      - loss of consciousness
      - lower back or side pain
      - mood changes
      - muscle tremors
      - nausea
      - nervousness
      - no muscle tone or movement
      - numbness or tingling in the hands, feet, or lips
      - painful or difficult urination
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the face, lips, or tongue
      - rapid weight gain
      - rash
      - red irritated eyes
      - red skin lesions, often with a purple center
      - restlessness
      - shakiness
      - slurred speech
      - seizures
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach pain or cramps
      - stupor
      - sudden decrease in amount of urine
      - sugar in the urine
      - swollen or painful glands
      - trouble breathing
      - unpleasant breath odor
      - unusual bleeding or bruising
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
      - unusual tiredness or weakness
      - vomiting of blood
      - weight loss
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - changes in vision
      - continuing ringing or buzzing or other unexplained noise in the ears
      - general feeling of discomfort or illness
      - hearing loss
      - increased sensitivity of skin to sunlight
      - redness or other discoloration of the skin
      - severe sunburn
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
