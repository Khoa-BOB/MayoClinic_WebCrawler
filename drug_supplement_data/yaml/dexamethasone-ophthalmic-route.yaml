title: Dexamethasone (ophthalmic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Dextenza
    - type: paragraph
      text: Maxidex
    - type: paragraph
      text: Ocu-Dex
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Dexamethasone eye drops are used to treat inflammation of the eyes caused
      by allergies and certain conditions, including damage caused by chemical and
      thermal burns.
  - type: paragraph
    text: Dexamethasone eye insert is used to treat eye pain and swelling after eye
      surgery. It is also used to treat itching of the eye caused by a condition known
      as allergic conjunctivitis.
  - type: paragraph
    text: Dexamethasone belongs to the group of medicines known as corticosteroids
      (steroids or cortisone-like medicines) that is used to relieve the redness,
      itching, and swelling caused by eye infections and other conditions or procedures
      (eg, eye surgery).
  - type: paragraph
    text: Dextenza® is to be given only by your doctor. Maxidex® is available only
      with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
    - Insert, Extended Release
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of dexamethasone eye insert in children
        to treat eye pain and swelling after eye surgery and in children 2 years of
        age and older to treat eye itching caused by allergic conjunctivitis . Safety
        and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of dexamethasone eye drops in children.
        Safety and efficacy have been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of dexamethasone eye drops or eye
        insert in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Artemether
      - Desmopressin
      - Mifepristone
      - Praziquantel
      - Ranolazine
      - Rilpivirine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Aldesleukin
      - Alfentanil
      - Amiodarone
      - Amlodipine
      - Apalutamide
      - Aspirin
      - Atogepant
      - Avacopan
      - Balofloxacin
      - Bemiparin
      - Benzhydrocodone
      - Besifloxacin
      - Boceprevir
      - Buprenorphine
      - Bupropion
      - Carbamazepine
      - Cariprazine
      - Ceritinib
      - Cholestyramine
      - Ciprofloxacin
      - Clarithromycin
      - Cobicistat
      - Codeine
      - Conivaptan
      - Cosyntropin
      - Cyclosporine
      - Dabrafenib
      - Daclatasvir
      - Darunavir
      - Desogestrel
      - Dienogest
      - Dihydrocodeine
      - Diltiazem
      - Dordaviprone
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Dronedarone
      - Drospirenone
      - Efavirenz
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Alcuronium
      - Aminoglutethimide
      - Aprepitant
      - Atracurium
      - Auranofin
      - Caspofungin
      - Fluindione
      - Fosaprepitant
      - Fosnetupitant
      - Gallamine
      - Hexafluorenium
      - Licorice
      - Metocurine
      - Netupitant
      - Ospemifene
      - Pancuronium
      - Rifapentine
      - Rotavirus Vaccine, Live
      - Saiboku-To
      - Vecuronium
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Cataract or
      - Cornea (part of the eye) problems, history of or
      - Glaucoma or
      - Sclera (part of the eye) problems, history of—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Cataract surgery—Use with caution. The eye insert may cause delayed healing
        and increase the risk of unwanted effects.
    - type: list
      ordered: false
      items:
      - Bacterial eye infection, acute, untreated or
      - Fungal eye infection or
      - Herpes simplex eye infection or
      - Mycobacterial eye infection or
      - Vaccinia (smallpox) eye infection or
      - Varicella (chickenpox) eye infection—Should not be used in patients with these
        conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your eye doctor (ophthalmologist) will give you Dextenza® eye insert in
      a medical facility. It is inserted inside the lower part of your eye. Dextenza®
      eye insert will release the medicine for up to 30 days. The insert will be absorbed
      by the eye and does not require removal.
  - type: paragraph
    text: Use Maxidex® only as directed by your doctor . Do not use more of it, do
      not use it more often, and do not use it for a longer time than your doctor
      ordered. To do so may increase the chance of too much medicine being absorbed
      into the body and the chance of side effects.
  - type: paragraph
    text: 'To use the eye drops:'
  - type: list
    ordered: false
    items:
    - Wash your hands first with soap and water.
    - Shake the bottle well before each use.
    - Tilt your head back and, pressing your finger gently on the skin just beneath
      the lower eyelid, pull the lower eyelid away from the eye to make a space. Drop
      the medicine into this space.
    - Let go of the eyelid and gently close your eye. Do not blink. Keep the eye closed
      and apply pressure to the inner corner of your eye with your finger for 1 or
      2 minutes to allow the medicine to be absorbed by the eye.
    - If you think you did not get the drop of medicine into your eye properly, use
      another drop.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Keep the bottle tightly closed and upright
      when you are not using it.
  - type: paragraph
    text: If you are wearing contact lenses, remove them before putting the drops
      in your eyes.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic dosage form (eye drops): For inflammation of the eye: Adults—Instill
        one or two drops in the affected eye 4 to 6 times a day. Your doctor may adjust
        your dose as needed. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For inflammation of the eye: Adults—Instill one or two drops in the affected
        eye 4 to 6 times a day. Your doctor may adjust your dose as needed. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Instill one or two drops in the affected eye 4 to 6 times a day. Your
        doctor may adjust your dose as needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your eye doctor (ophthalmologist) check your or
      your child's progress at regular visits to make sure the medicine is working
      properly and to check for unwanted effects, especially if you will be using
      Maxidex® for 10 days or longer.
  - type: paragraph
    text: Steroid eye drops may cause glaucoma (increased pressure inside the eye)
      or posterior subcapsular cataracts (a rare type of cataract) if used too long.
      Slow or delayed healing may also occur while you are using this medicine after
      cataract surgery. You will need to have regular eye exams with your doctor to
      check for these problems.
  - type: paragraph
    text: If you wear contact lenses, remove them before you put the drops into your
      eyes. Wait at least 15 minutes after using Maxidex® eye drops before you put
      your contact lenses back in.
  - type: paragraph
    text: If your symptoms do not improve or if they become worse, check with your
      eye doctor (ophthalmologist) right away.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - decreased vision or other changes in vision
      - eye pain or redness
      - sensitivity of the eye to light
      - throbbing pain of the eye
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Loss of vision
      - redness of the white part of the eyes or inside of the eyelids
      - swelling of the eye
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, dry, or itching eyes
      - delayed eye wound healing
      - difficulty seeing at night
      - discharge, excessive tearing
      - eye irritation
      - redness, pain, or swelling of the eye, eyelid, or inner lining of the eyelid
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty in breathing or swallowing
      - drooping of the upper eyelids
      - fast heartbeat
      - skin itching, rash, or redness
      - swelling of the face, throat, or tongue
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Crusting in the corner of the eye
      - feeling of having something in the eye
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bigger, dilated, or enlarged pupils
      - dizziness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
