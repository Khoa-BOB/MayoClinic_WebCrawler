    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose of terbinafine tablets , take it as soon as you can.
        If your next regular dose is less than 4 hours away, wait until then to use
        the medicine and skip the missed dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check the progress of you or your child
      at regular visits to make sure that this medicine is working properly. Blood
      tests may be needed to check for any unwanted effects.
  - type: paragraph
    text: If your or your child's symptoms do not improve, or if they become worse,
      check with your doctor. You may need to take this medicine for several weeks
      or months before your infection gets better.
  - type: paragraph
    text: This medicine may cause a serious type of allergic reaction called anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you have a skin rash, itching, hives, trouble
      with breathing or swallowing, or any swelling of your hands, face, or mouth
      while you or your child are using this medicine.
  - type: paragraph
    text: This medicine may cause serious liver problems, including liver failure.
      Check with your doctor right away if you start having nausea or vomiting, dark
      urine, light-colored stools, stomach pain, or yellow eyes or skin while you
      or your child are using this medicine.
  - type: paragraph
    text: This medicine may cause problems with your sense of taste or smell. Tell
      your doctor right away if you or your child have change or loss of sense of
      smell, change in taste or loss of taste, poor appetite, or weight loss.
  - type: paragraph
    text: You may become depressed when taking this medicine. Tell your doctor right
      away if you or your child thinks this medicine is causing changes in your mood
      or behavior. Other symptoms include feeling very sad or empty, irritable, lack
      of appetite, loss of interest or pleasure, restlessness, trouble concentrating,
      or trouble sleeping.
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Check with your doctor
      right away if you have blistering, peeling, or loosening of the skin, red skin
      lesions, severe acne or skin rash, sores or ulcers on the skin, or fever or
      chills while you or your child are using this medicine.
  - type: paragraph
    text: This medicine can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. If you can, avoid people
      with infections. Check with your doctor immediately if you think you are getting
      an infection or if you or your child get a fever or chills, cough or hoarseness,
      lower back or side pain, or painful or difficult urination.
  - type: paragraph
    text: This medicine may make your skin more sensitive to sunlight. Tell your doctor
      right away if you or your child have a red, scaly skin rash or unusual sensitivity
      of the skin to the sun. Use a sunscreen when you are outdoors. Avoid sunlamps
      and tanning beds.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - chills
      - cough
      - diarrhea
      - difficulty with breathing
      - ear congestion
      - general feeling of discomfort or illness
      - headache
      - joint pain
      - loss of appetite
      - loss of voice
      - nasal congestion
      - nausea
      - runny nose
      - shivering
      - skin rash or itching
      - sneezing
      - sore throat
      - sweating
      - trouble with sleeping
      - unusual tiredness or weakness
      - upper abdominal or stomach pain
      - vomiting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dark urine
      - difficulty with swallowing
      - pale skin
      - pale stools
      - redness, blistering, peeling, or loosening of the skin
      - stomach pain
      - unusual bleeding or bruising
      - yellow skin or eyes
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - bloating
      - blood in the urine or stools
      - chest pain
      - constipation
      - cough or hoarseness
      - dizziness
      - fast heartbeat
      - feeling of discomfort
      - flu-like symptoms
      - general feeling of tiredness or weakness
      - hair loss
      - high fever
      - hives
      - indigestion
      - inflammation of the joints
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - light-colored stools
      - lower back or side pain
      - muscle aches
      - painful or difficult urination
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - persistent loss of appetite
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - red, scaling, or crusted skin
      - sores, ulcers, or white spots on the lips or in the mouth
      - sores, welting, or blisters
      - stomach pain, continuing
      - swollen glands
      - swollen lymph glands
      - tightness in the chest
      - troubled breathing with exertion
      - ulcers, sores, or white spots in the mouth
      - unexplained bleeding or bruising
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Stomach pain (mild)
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - bad, unusual, or unpleasant (after) taste
      - belching
      - change of taste or loss of taste
      - heartburn
      - toothache
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased vision
      - difficulty with moving
      - discouragement
      - feeling sad or empty
      - irritability
      - lack of appetite
      - loss of interest or pleasure
      - loss of sense of smell
      - muscle cramps or spasms
      - muscle stiffness
      - tiredness
      - trouble concentrating
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
