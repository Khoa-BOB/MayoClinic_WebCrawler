title: Terbinafine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: LamISIL
    - type: paragraph
      text: Terbinex
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Terbinafine belongs to the group of medicines called antifungals. It is
      used to treat fungus infections of the scalp, body, groin (jock itch), feet
      (athlete's foot), fingernails, and toenails.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of terbinafine oral granules in children younger than 4 years
        of age with fungal infections of the scalp. Safety and efficacy have not been
        established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of terbinafine tablets in children with fungal infections of
        the fingernails or toenails. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of terbinafine
        oral granules have not been performed in the geriatric population. Safety
        and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of terbinafine tablets in the elderly.
        However, elderly patients are more likely to have age-related liver, kidney,
        or heart problems, which may require caution in patients receiving terbinafine
        tablets .
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Pimozide
      - Ranolazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amlodipine
      - Amphetamine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Atogepant
      - Azathioprine
      - Benzphetamine
      - Brexpiprazole
      - Cariprazine
      - Clomipramine
      - Clozapine
      - Cyclosporine
      - Deutetrabenazine
      - Dextroamphetamine
      - Dihydrocodeine
      - Donepezil
      - Doxepin
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Eliglustat
      - Fenfluramine
      - Fluoxetine
      - Haloperidol
      - Hydroxyamphetamine
      - Levoketoconazole
      - Lisdexamfetamine
      - Mercaptopurine
      - Methadone
      - Methamphetamine
      - Methotrexate
      - Metoclopramide
      - Metoprolol
      - Nebivolol
      - Nifedipine
      - Oliceridine
      - Oxycodone
      - Pitolisant
      - Risperidone
      - Sofpironium
      - Tizanidine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Dextromethorphan
      - Lofexidine
      - Nortriptyline
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood problems (eg, neutropenia) or
      - Systemic lupus erythematosus or SLE or
      - Weakened immune system—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease, active or chronic—Should not be used in patients with this
        condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Terbinafine tablets may be taken with food or on an empty stomach. However,
      it is best to take terbinafine oral granules with food.
  - type: paragraph
    text: To help clear up your infection completely, it is very important that you
      keep using this medicine for the full time of treatment , even if your symptoms
      begin to clear up or you begin to feel better after a few days. Since fungal
      infections may be very slow to clear up, you may need to take this medicine
      for several weeks or months. If you stop taking this medicine too soon, your
      symptoms may return.
  - type: paragraph
    text: This medicine works best when there is a constant amount in the blood. To
      help keep the amount constant, do not miss any doses. Also, it is best to take
      the doses at the same times every day. If you need help in planning the best
      time to take your medicine, check with your doctor.
  - type: paragraph
    text: If you are using the oral granules , you may sprinkle the contents on a
      spoonful of pudding or other soft, non-acidic food such as mashed potatoes.
      This mixture must be swallowed immediately without chewing. Do not use applesauce
      or fruit-based foods. If you will need two packets of oral granules with each
      dose, you may sprinkle the content of both packets on one spoonful or two spoonfuls
      of non-acidic food.
  - type: paragraph
    text: Avoid caffeine (coffee, soda, chocolate) while you are using this medicine.
      Terbinafine may cause caffeine to stay in your body longer than usual.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (granules): For tinea capitis (fungus infections of
        the scalp): Adults—Dose is based on body weight and must be determined by
        your doctor. The dose is usually 250 milligrams (mg) once a day for 6 weeks.
        Children 4 years of age and older and weighing over 35 kilograms (kg)—Dose
        is based on body weight and must be determined by your doctor. The dose is
        usually 250 mg once a day for 6 weeks. Children 4 years of age and older and
        weighing 25 kg to 35 kg—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 187.5 mg once a day for 6 weeks. Children
        4 years of age and older and weighing less than 25 kg—Dose is based on body
        weight and must be determined by your doctor. The dose is usually 125 mg once
        a day for 6 weeks. Children younger than 4 years of age—Use and dose must
        be determined by the doctor.'
      - 'For oral dosage form (tablets): For onychomycosis (fungus infections of the
        fingernails): Adults—250 milligrams (mg) once a day for 6 weeks. Children—Use
        and dose must be determined by the doctor. For onychomycosis (fungus infections
        of the toenails): Adults—250 milligrams (mg) once a day for 12 weeks. Children—Use
        and dose must be determined by the doctor. For tinea corporis (ringworm of
        the body): Adults and teenagers—250 milligrams (mg) once a day for 2 to 4
        weeks. Children—Use and dose must be determined by the doctor. For tinea cruris
        (ringworm of the groin; jock itch): Adults and teenagers—250 milligrams (mg)
        once a day for 2 to 4 weeks. Children—Use and dose must be determined by the
        doctor. For tinea pedis (ringworm of the foot; athlete''s foot): Adults and
        teenagers—250 milligrams (mg) once a day for 2 to 6 weeks. Children—Use and
        dose must be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - 'For tinea capitis (fungus infections of the scalp): Adults—Dose is based
        on body weight and must be determined by your doctor. The dose is usually
        250 milligrams (mg) once a day for 6 weeks. Children 4 years of age and older
        and weighing over 35 kilograms (kg)—Dose is based on body weight and must
        be determined by your doctor. The dose is usually 250 mg once a day for 6
        weeks. Children 4 years of age and older and weighing 25 kg to 35 kg—Dose
        is based on body weight and must be determined by your doctor. The dose is
        usually 187.5 mg once a day for 6 weeks. Children 4 years of age and older
        and weighing less than 25 kg—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 125 mg once a day for 6 weeks. Children
        younger than 4 years of age—Use and dose must be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Dose is based on body weight and must be determined by your doctor.
        The dose is usually 250 milligrams (mg) once a day for 6 weeks.
