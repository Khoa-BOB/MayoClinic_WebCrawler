title: Isradipine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Dynacirc
    - type: paragraph
      text: Dynacirc CR
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Isradipine is used alone or together with other medicines (such as hydrochlorothiazide)
      to treat high blood pressure (hypertension). High blood pressure adds to the
      workload of the heart and arteries. If it continues for a long time, the heart
      and arteries may not function properly. This can damage the blood vessels of
      the brain, heart, and kidneys, resulting in a stroke, heart failure, or kidney
      failure. High blood pressure may also increase the risk of heart attacks. These
      problems may be less likely to occur if blood pressure is controlled .
  - type: paragraph
    text: Isradipine is a calcium channel blocker. It works by affecting the movement
      of calcium into the cells of the heart and blood vessels. As a result, isradipine
      relaxes blood vessels and increases the supply of blood and oxygen to the heart
      while reducing its workload .
  - type: paragraph
    text: This medicine is available only with your doctor's prescription .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of isradipine in the pediatric population. Safety and efficacy
        have not been established .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatrics-specific
        problems that would limit the usefulness of isradipine in the elderly. However,
        elderly patients are more likely to have liver or kidney problems which may
        require an adjustment of dose in patients receiving isradipine .
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Mefloquine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acecainide
      - Acetophenazine
      - Ajmaline
      - Amiodarone
      - Amitriptyline
      - Amoxapine
      - Aprindine
      - Arsenic Trioxide
      - Astemizole
      - Azimilide
      - Bretylium
      - Carbamazepine
      - Ceritinib
      - Chloral Hydrate
      - Chloroquine
      - Chlorpromazine
      - Clonidine
      - Clopidogrel
      - Dantrolene
      - Darunavir
      - Desipramine
      - Dibenzepin
      - Digoxin
      - Disopyramide
      - Dofetilide
      - Dolasetron
      - Doxepin
      - Dronedarone
      - Droperidol
      - Encainide
      - Enflurane
      - Epirubicin
      - Erythromycin
      - Ethopropazine
      - Flecainide
      - Fluconazole
      - Fluoxetine
      - Fluphenazine
      - Foscarnet
      - Gemifloxacin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Amprenavir
      - Dalfopristin
      - Indinavir
      - Magnesium
      - Quinupristin
      - Rifampin
      - Rifapentine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bowel blockage or
      - Congestive heart failure—Use with caution. May make these conditions worse
        .
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects of isradipine may be increased
        because of the slower removal of the medicine from the body .
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium. Your doctor will tell you which of these are most important
      for you. You should check with your doctor before changing your diet .
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well .
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure, but
      it does help control it. You must continue to take it as directed if you expect
      to lower your blood pressure and keep it down. You may have to take high blood
      pressure medicine for the rest of your life. If high blood pressure is not treated,
      it can cause serious problems such as heart failure, blood vessel disease, stroke,
      or kidney disease .
  - type: paragraph
    text: Swallow the extended-release tablet whole with a full glass of water. Do
      not break, crush, or chew it .
  - type: paragraph
    text: If you are taking the extended-release tablets , part of the tablet may
      pass into your stools after your body has absorbed the medicine. This is normal
      and is nothing to worry about .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: For oral dosage form (capsules): Adults—At first,
        2.5 milligrams (mg) twice a day. Your doctor may increase your dose if needed.
        Children—Use and dose must be determined by your doctor . For oral dosage
        form (extended-release tablets): Adults—At first, 5 milligrams (mg) once a
        day. Your doctor may increase your dose if needed. Children—Use and dose must
        be determined by your doctor .'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): Adults—At first, 2.5 milligrams (mg) twice
        a day. Your doctor may increase your dose if needed. Children—Use and dose
        must be determined by your doctor .'
    - type: list
      ordered: false
      items:
      - Adults—At first, 2.5 milligrams (mg) twice a day. Your doctor may increase
        your dose if needed.
      - Children—Use and dose must be determined by your doctor .
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets): Adults—At first, 5 milligrams
        (mg) once a day. Your doctor may increase your dose if needed. Children—Use
        and dose must be determined by your doctor .'
    - type: list
      ordered: false
      items:
      - Adults—At first, 5 milligrams (mg) once a day. Your doctor may increase your
        dose if needed.
      - Children—Use and dose must be determined by your doctor .
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and to check for unwanted effects
      .
  - type: paragraph
    text: 'Low blood pressure (hypotension) may occur while taking this medicine.
      Check with your doctor right away if you have the following symptoms: blurred
      vision; confusion; severe dizziness, faintness, or lightheadedness when getting
      up from a lying or sitting position suddenly; sweating; or unusual tiredness
      or weakness .'
  - type: paragraph
    text: This medicine may cause fluid retention (edema) in some patients. Tell your
      doctor right away if you have bloating or swelling of face, arms, hands, lower
      legs, or feet; tingling of hands or feet; or unusual weight gain or loss .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of face, arms, hands, lower legs, or feet
      - tingling of hands or feet
      - unusual weight gain or loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - difficult or labored breathing
      - dizziness
      - fast, irregular, pounding, or racing heartbeat or pulse
      - feeling of warmth
      - full or bloated feeling
      - nausea
      - pressure in the stomach
      - redness of the face, neck, arms and occasionally, upper chest
      - shortness of breath
      - swelling of abdominal or stomach area
      - tightness in chest
      - unusual tiredness or weakness
      - vomiting
      - wheezing
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of Overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - dizziness, faintness, or lightheadedness when getting up from a lying or sitting
        position suddenly
      - flushing
      - sweating
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - difficulty having a bowel movement (stool)
      - rash
      - stomach soreness or discomfort
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
