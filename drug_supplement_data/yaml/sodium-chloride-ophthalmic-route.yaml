- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Hypertonic sodium chloride eye ointment and eye drops are used to draw water
      out of a swollen cornea. The extra water in the cornea can cause your vision
      to be poor. You may also see halos or rings around point light sources. The
      cornea is the clear cover over the colored part of your eye.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
    - Ointment
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of sodium chloride eye ointment or eye drops in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of sodium chloride eye ointment or eye drops in geriatric patients.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your eye doctor will tell you how much of this medicine to use and how often
      . Do not use more medicine or use it more often than your doctor tells you to.
      This medicine is not for long-term use.
  - type: paragraph
    text: Follow the instructions on the medicine label if you are using this medicine
      without a prescription.
  - type: paragraph
    text: 'To use the eye drops :'
  - type: list
    ordered: false
    items:
    - The bottle is only partially full to provide proper drop control.
    - First, wash your hands. Then tilt the head back and pull the lower eyelid away
      from the eye to form a pouch. Drop the medicine into the pouch and gently close
      the eyes. Do not blink. Keep the eyes closed for 1 or 2 minutes to allow the
      medicine to be absorbed.
    - If you think you did not get the drop of medicine into your eye properly, use
      another drop.
    - Immediately after using the eye drops, wash your hands to remove any medicine
      that may be on them.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
      Serious damage to the eye and possible loss of vision may result from using
      contaminated eye drops.
  - type: paragraph
    text: 'To use the eye ointment :'
  - type: list
    ordered: false
    items:
    - Hold the tip of the tube close to your eye with the other hand.
    - Avoid touching the tip of the tube to your eye or finger.
    - Squeeze a small amount (1/4 inch) of ointment into the pocket between your lower
      lid and eyeball. Close your eyes for 1 to 2 minutes.
    - Wipe the tip with a clean tissue and close the tube tightly. Keep the tube tightly
      closed when you are not using it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For swelling of the cornea: For ophthalmic dosage form (eye drops): Adults—Use
        1 or 2 drops every 3 or 4 hours, or as directed by your doctor. Children—Use
        and dose must be determined by your doctor. For ophthalmic dosage form (eye
        ointment): Adults—Apply small amount (1/4 inch) to the inside of the eyelids
        every 3 or 4 hours, or as directed by your doctor. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For ophthalmic dosage form (eye drops): Adults—Use 1 or 2 drops every 3 or
        4 hours, or as directed by your doctor. Children—Use and dose must be determined
        by your doctor.'
      - 'For ophthalmic dosage form (eye ointment): Adults—Apply small amount (1/4
        inch) to the inside of the eyelids every 3 or 4 hours, or as directed by your
        doctor. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Use 1 or 2 drops every 3 or 4 hours, or as directed by your doctor.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—Apply small amount (1/4 inch) to the inside of the eyelids every 3
        or 4 hours, or as directed by your doctor.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your eye doctor will check your eyes at regular visits to make sure it is
      working properly and is not causing unwanted effects.
  - type: paragraph
    text: If your symptoms do not improve within a few days or if they become worse,
      check with your doctor.
  - type: paragraph
    text: While applying the medicine, your eyes will probably sting or burn for a
      short time. This is to be expected.
  - type: paragraph
    text: If you experience eye pain, changes in vision, continued redness or irritation
      of the eye, or if your symptoms continue for more than 3 days or become worse,
      check with your doctor.
  - type: paragraph
    text: Talk with your doctor right away if you hurt your eye, develop an eye infection,
      or need to have eye surgery. You may need to change your medicine or stop using
      it.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in vision
      - red eyes
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Temporary burning sensation of the eye
      - temporary eye irritation
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
