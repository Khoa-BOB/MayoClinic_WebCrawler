title: Neomycin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Neo-Fradin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Oral neomycin is used to help lessen the symptoms of hepatic coma, a complication
      of liver disease. In addition, it may be used with another medicine before any
      surgery affecting the bowels to help prevent infection during surgery.
  - type: paragraph
    text: Neomycin is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Damage to hearing, sense of balance, and kidneys is more likely to occur
        in premature infants and neonates, who are more sensitive than adults to the
        effects of neomycin.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Serious side effects, such as damage to hearing, sense of balance, and
        kidneys may occur in elderly patients, who are usually more sensitive than
        younger adults to the effects of neomycin.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alcuronium
      - Aspirin
      - Atracurium
      - Bumetanide
      - Cidofovir
      - Cisatracurium
      - Colistimethate Sodium
      - Decamethonium
      - Doxacurium
      - Emtricitabine
      - Ethacrynic Acid
      - Fazadinium
      - Foscarnet
      - Furosemide
      - Gallamine
      - Hexafluorenium
      - LetibotulinumtoxinA-wlbg
      - Methotrexate
      - Metocurine
      - Mivacurium
      - Pancuronium
      - Pipecuronium
      - Rapacuronium
      - Rocuronium
      - Sorafenib
      - Tacrolimus
      - Teicoplanin
      - Tenofovir Alafenamide
      - Tubocurarine
      - Vancomycin
      - Vecuronium
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Digoxin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blockage of the bowel
    - type: list
      ordered: false
      items:
      - Eighth-cranial-nerve disease (loss of hearing and/or balance)—Oral neomycin
        may increase the chance of hearing loss and/or balance problems
    - type: list
      ordered: false
      items:
      - Kidney disease—Patients with kidney disease may have an increased chance of
        side effects
    - type: list
      ordered: false
      items:
      - Myasthenia gravis or
      - Parkinson's disease—Patients with myasthenia gravis or Parkinson's disease
        may have an increased chance of developing muscular weakness
    - type: list
      ordered: false
      items:
      - Ulcers of the bowel—Patients with ulcers of the bowel may have an increased
        chance of side effects since more neomycin may be absorbed by the body
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine may be taken on a full or empty stomach.
  - type: paragraph
    text: 'For patients taking the oral liquid form of neomycin:'
  - type: list
    ordered: false
    items:
    - Use a specially marked measuring spoon or other device to measure each dose
      accurately. The average household teaspoon may not hold the right amount of
      liquid.
  - type: paragraph
    text: Keep taking this medicine for the full time of treatment. Do not miss any
      doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (solution, tablets): For patients in a coma from liver
        disease: Adults and teenagers—1 to 3 grams every six hours for five or six
        days. Children—Dose is based on body size (not weight) and must be determined
        by your doctor. That dose is given every six hours for five or six days. For
        cleaning the bowel before surgery: Adults and teenagers—1 gram every hour
        for four hours, then 1 gram every four hours for the rest of a twenty-four
        hour period; or 1 gram nineteen hours before surgery, 1 gram eighteen hours
        before surgery, and 1 gram nine hours before surgery. Children—Dose is based
        on body weight. The usual dose is 14.7 milligrams (mg) per kilogram (kg) (6.7
        mg per pound) of body weight every four hours for three days.'
    - type: list
      ordered: false
      items:
      - 'For patients in a coma from liver disease: Adults and teenagers—1 to 3 grams
        every six hours for five or six days. Children—Dose is based on body size
        (not weight) and must be determined by your doctor. That dose is given every
        six hours for five or six days.'
      - 'For cleaning the bowel before surgery: Adults and teenagers—1 gram every
        hour for four hours, then 1 gram every four hours for the rest of a twenty-four
        hour period; or 1 gram nineteen hours before surgery, 1 gram eighteen hours
        before surgery, and 1 gram nine hours before surgery. Children—Dose is based
        on body weight. The usual dose is 14.7 milligrams (mg) per kilogram (kg) (6.7
        mg per pound) of body weight every four hours for three days.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—1 to 3 grams every six hours for five or six days.
      - Children—Dose is based on body size (not weight) and must be determined by
        your doctor. That dose is given every six hours for five or six days.
    - type: list
      ordered: false
      items:
      - Adults and teenagers—1 gram every hour for four hours, then 1 gram every four
        hours for the rest of a twenty-four hour period; or 1 gram nineteen hours
        before surgery, 1 gram eighteen hours before surgery, and 1 gram nine hours
        before surgery.
      - Children—Dose is based on body weight. The usual dose is 14.7 milligrams (mg)
        per kilogram (kg) (6.7 mg per pound) of body weight every four hours for three
        days.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Any loss of hearing
      - clumsiness
      - diarrhea
      - difficulty in breathing
      - dizziness
      - drowsiness
      - greatly decreased frequency of urination or amount of urine
      - increased amount of gas
      - increased thirst
      - light-colored, frothy, fatty-appearing stools
      - ringing or buzzing or a feeling of fullness in the ears
      - skin rash
      - unsteadiness
      - weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Irritation or soreness of the mouth or rectal area
      - nausea or vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
