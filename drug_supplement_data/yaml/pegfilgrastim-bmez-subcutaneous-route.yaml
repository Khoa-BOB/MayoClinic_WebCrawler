    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: This medicine needs to be given on a fixed schedule. If you miss a dose
        or forget to use your medicine, call your doctor or pharmacist for instructions.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Keep this medicine in its original carton. Throw away any medicine stored
        at room temperature for more than 72 hours. If frozen, thaw it in the refrigerator
        before using. Throw away any medicine if it has been frozen more than once.
    - type: paragraph
      text: Throw away used needles in a hard, closed container where the needles
        cannot poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you or your child's progress
      at regular visits to make sure that this medicine is working properly. Blood
      and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: If you or your child have left upper stomach pain or shoulder pain, contact
      your doctor right away . This could be a symptom of a serious side effect with
      the spleen.
  - type: paragraph
    text: Check with your doctor right away at the first sign of any infection, including
      fever, chills, cough, sore throat, or redness, swelling, or pain around a cut
      or sore.
  - type: paragraph
    text: Check with your doctor right away if you or your child develop a fever,
      chest pain or tightness, fast breathing, or trouble breathing. These could be
      symptoms of a serious lung condition called acute respiratory distress syndrome
      (ARDS).
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you or your child have a rash, itching, swelling of
      the face, tongue, or throat, trouble breathing, or chest pain after you receive
      this medicine.
  - type: paragraph
    text: You should not use this medicine for 14 days before and up to 24 hours after
      you receive cancer medicines.
  - type: paragraph
    text: This medicine may cause kidney problems. Call your doctor right away if
      you or your child have swelling in the face or ankles, blood in the urine, or
      a decrease in how much or how often you urinate.
  - type: paragraph
    text: This medicine lowers the number of some types of blood cells in your body.
      Because of this, you may bleed more easily. Wash your hands often. Stay away
      from rough sports or other situations where you could be bruised, cut, or injured.
      Brush and floss your teeth gently. Be careful when using sharp objects, including
      razors and fingernail clippers. Check with your doctor right away if you or
      your child have black or tarry stools, bleeding gums, blood in the urine or
      stools, pinpoint red spots on the skin, or unusual bleeding or bruising after
      receiving this medicine.
  - type: paragraph
    text: This medicine may cause a condition called capillary leak syndrome. It can
      cause fluid to leak from the blood vessels into your body's tissues. Call your
      doctor right away if you have swelling or puffiness and are urinating less often,
      trouble breathing, feeling of fullness, dizziness, or feeling faint.
  - type: paragraph
    text: This medicine may cause blood or bone marrow problems (eg, myelodysplastic
      syndrome, acute myeloid leukemia) in patients with breast or lung cancer. Check
      with your doctor right away if you have chest pain, chills, cough or hoarseness,
      fever, lower back or side pain, painful or difficult urination, sores, ulcers,
      or white spots on the lips or in the mouth, swollen glands, unusual bleeding
      or bruising, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause aortitis (inflammation of the aorta, the largest
      artery in the body). Check with your doctor right away if you have fever, stomach
      pain, unusual tiredness or weakness, or back pain.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect the results of certain medical tests
      (eg, bone tests).
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - bloody or cloudy urine
      - blue lips, fingernails, or skin
      - chest pain or tightness
      - chills
      - cloudy urine
      - cough
      - decrease or increase in the amount of urine
      - difficult or fast breathing
      - difficulty swallowing
      - dizziness
      - eye pain
      - fainting or lightheadedness
      - fast heartbeat
      - fever
      - general feeling of illness
      - headache
      - hives, itching, or skin rash
      - lower back or side pain
      - nausea
      - painful or difficult urination
      - pain spreading to the left shoulder
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach pain
      - swelling of the face, feet, or lower legs
      - swelling of the hands, ankles, feet, or lower legs
      - swollen glands
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bone, arm, or leg pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
