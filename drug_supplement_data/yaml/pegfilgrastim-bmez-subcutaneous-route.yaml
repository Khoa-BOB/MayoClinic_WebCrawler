title: Pegfilgrastim-bmez (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: ZIEXTENZO
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Pegfilgrastim-bmez injection is used to treat neutropenia (low white blood
      cells) that is caused by cancer medicines. It is a synthetic (man-made) form
      of a substance that is naturally produced in your body called a colony stimulating
      factor. Pegfilgrastim-bmez helps the bone marrow to make new white blood cells.
  - type: paragraph
    text: Pegfilgrastim-bmez injection is also used to treat acute radiation syndrome
      (radiation sickness) in patients who have been exposed to high levels (myelosuppressive
      doses) of radiation. Myelosuppression is a bone marrow problem that can lead
      to a decrease in blood cell counts.
  - type: paragraph
    text: When certain cancer medicines are used to fight cancer cells, they also
      affect the white blood cells that fight infections. Pegfilgrastim-bmez is used
      to reduce the risk of infection while you are being treated with cancer medicines.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of pegfilgrastim-bmez injection in
        the pediatric population.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of pegfilgrastim-bmez in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bone marrow cancer or other bone marrow problems or
      - Glomerulonephritis (kidney disease) or
      - Leukocytosis (high white blood cell count) or
      - Lung disease or breathing problems or
      - Sickle cell disease (red blood cell disease) or
      - Thrombocytopenia (low platelets in the blood)—Use with caution. May make these
        conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional may give you this medicine.
      It is given as a shot under the skin of your upper arm, upper outer buttock,
      stomach, or thigh.
  - type: paragraph
    text: You may be taught how to give this medicine at home. Make sure you understand
      all of the instructions before giving yourself an injection. Do not use more
      medicine or use it more often than your doctor tells you to.
  - type: paragraph
    text: 'This medicine comes with a patient information leaflet and patient instructions.
      Read and follow these instructions carefully. Ask your doctor if you have any
      questions about:'
  - type: list
    ordered: false
    items:
    - How to prepare the injection.
    - The proper use of disposable syringes.
    - How to give the injection.
    - How long the injection can be stored at home.
  - type: paragraph
    text: Allow the medicine to warm to room temperature for 15 to 30 minutes before
      you inject it. If the medicine in the prefilled syringe has changed color, looks
      cloudy, or if you see particles in it, do not use it. Do not shake. Use the
      syringe only once. Do not save leftover medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injectable dosage form (solution): To increase white blood cell count:
        Adults—6 milligrams (mg) as a single injection under the skin once every cancer
        treatment cycle. Children weighing less than 45 kilograms (kg)—Dose is based
        on body weight and must be determined by your doctor. Weighing 31 kg to 44
        kg—4 milligrams (mg) as a single injection under the skin once every cancer
        treatment cycle. Weighing 21 kg to 30 kg—2.5 mg as a single injection under
        the skin once every cancer treatment cycle. Weighing 10 kg to 20 kg—1.5 mg
        as a single injection under the skin once every cancer treatment cycle. Weighing
        less than 10 kg—0.1 mg per kg body weight as a single injection under the
        skin once every cancer treatment cycle. Treatment of acute radiation syndrome:
        Adults—12 milligrams (mg) (2 doses of 6 mg) injected under the skin one week
        apart. Children weighing less than 45 kilograms (kg)—Dose is based on body
        weight and must be determined by your doctor. Weighing 31 kg to 44 kg—4 milligrams
        (mg) injected under the skin one week apart. Weighing 21 kg to 30 kg—2.5 mg
        injected under the skin one week apart. Weighing 10 kg to 20 kg—1.5 mg injected
        under the skin one week apart. Weighing less than 10 kg—0.1 mg per kg body
        weight injected under the skin one week apart.'
    - type: list
      ordered: false
      items:
      - 'To increase white blood cell count: Adults—6 milligrams (mg) as a single
        injection under the skin once every cancer treatment cycle. Children weighing
