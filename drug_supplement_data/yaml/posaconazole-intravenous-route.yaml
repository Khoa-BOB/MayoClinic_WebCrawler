    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Lorazepam
      - Topiramate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Green Tea
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart disease, history of or
      - Heart rhythm problems (eg, arrhythmia, QT prolongation) or
      - High blood pressure or
      - Liver disease or
      - Mineral imbalance (low potassium, magnesium, or calcium in the blood)—These
        conditions may cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate to severe—Use is not recommended.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. This medicine is given through an IV placed in one of your veins.
      The medicine must be injected slowly, so your IV will need to stay in place
      for 30 to 90 minutes.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to decide if you should continue to take it. Blood and urine tests will be needed
      to check for unwanted effects.
  - type: paragraph
    text: You should not use atorvastatin (Lipitor®), lovastatin (Mevacor®), pimozide
      (Orap®), quinidine (Quinaglute®), simvastatin (Zocor®), sirolimus (Rapamune®),
      venetoclax (Venclexta®), or ergotamine medicines (eg, bromocriptine, dihydroergotamine,
      ergonovine, ergotamine, methylergonovine, methysergide, Cafergot®, Ergomar®,
      Wigraine®). Using any of them together with this medicine may increase the chance
      of unwanted effects .
  - type: paragraph
    text: This medicine can cause changes in heart rhythms, including QT prolongation
      and torsades de pointes. Check with your doctor right away if you have chest
      pain or discomfort, fainting, irregular or slow heart rate, or trouble breathing.
  - type: paragraph
    text: This medicine may cause pseudoaldosteronism, including new or worsening
      high blood pressure and hypokalemia (low potassium in the blood). Check with
      your doctor right away if you have blurred vision, decrease urine output, dizziness,
      dry mouth, increased thirst, irregular heartbeat, loss of appetite, mood change,
      muscle pain or cramps, nausea or vomiting, nervousness, numbness or tingling
      in the hands, feet, or lips, pounding in the ears, seizures, slow or fast heartbeat,
      trouble breathing, or unusual tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow skin or eyes. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: Check with your doctor right away if you have severe diarrhea or vomiting
      while using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - blurred vision
      - decreased urine
      - dizziness
      - fever or chills
      - headache
      - increased thirst
      - irregular heartbeat
      - loss of appetite
      - mood or mental changes
      - muscle pain, cramps, spasms, or twitching
      - nausea or vomiting
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - pale skin
      - pinpoint red spots on the skin
      - pounding in the ears
      - slow or fast heartbeat
      - swelling of the hands, ankles, feet, or lower legs
      - trembling
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry mouth
      - seizures
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - diarrhea
      - difficulty having a bowel movement (stool)
      - rash
      - small red or purple spots on the skin
      - upper stomach pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
