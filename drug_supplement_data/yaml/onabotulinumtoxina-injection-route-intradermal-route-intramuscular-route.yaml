title: Onabotulinumtoxina (injection route, intradermal route, intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Botox
    - type: paragraph
      text: Botox Cosmetic
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: OnabotulinumtoxinA is used to treat certain eye conditions, such as blepharospasm
      (a condition where the eyelid will not stay open because of a muscle spasm)
      or strabismus (a condition where the eyes do not line up properly).
  - type: paragraph
    text: OnabotulinumtoxinA is also used to treat the abnormal head position and
      neck pain that result from cervical dystonia (severe muscle spasms of the neck)
      and some types of axillary hyperhidrosis (severe sweating of the armpits).
  - type: paragraph
    text: OnabotulinumtoxinA is used to treat increased muscle stiffness in the elbow,
      wrist, and finger muscles or ankle and toe muscles in adults with upper or lower
      limb spasticity or in children 2 to 17 years of age with upper and lower limb
      spasticity.
  - type: paragraph
    text: OnabotulinumtoxinA is also used to prevent headaches in patients with chronic
      migraine (severe headaches for 15 or more days a month lasting 4 or more hours
      a day).
  - type: paragraph
    text: OnabotulinumtoxinA is used cosmetically to temporarily improve the appearance
      of moderate to severe frown lines between the eyebrows (glabellar lines), forehead
      lines, crow's feet lines (lateral canthal lines), and vertical bands connecting
      the jaw and neck (platysma bands).
  - type: paragraph
    text: OnabotulinumtoxinA is also used to treat urinary incontinence (loss of bladder
      control) in patients with an overactive bladder caused by nervous system disorders
      (eg, multiple sclerosis, spinal cord injury). It is also used to treat an overactive
      bladder caused by a nervous system disorder or overactive bladder with symptoms,
      such as loss of bladder control, increased urge to urinate, and frequent need
      to urinate in patients who have failed treatment with other medicines (eg, anticholinergics).
  - type: paragraph
    text: OnabotulinumtoxinA is a botulinum toxin A product. It works on the nervous
      system to relax the muscles.
  - type: paragraph
    text: OnabotulinumtoxinA is injected into the affected muscles. Depending on your
      condition, more than one treatment may be required.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription and will
      be administered by your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of onabotulinumtoxinA in children.
        However, safety and effectiveness have not been established in children younger
        than 2 years of age for upper limb spasticity and lower limb spasticity (except
        spasms caused by cerebral palsy) , in children younger than 5 years of age
        for overactive bladder caused by a nervous system disorder , in children younger
        than 12 years of age for blepharospasm or strabismus , in children younger
        than 16 years of age for cervical dystonia , or in children younger than 18
        years of age for chronic migraine, hyperhidrosis, or overactive bladder with
        symptoms . Use of onabotulinumtoxinA to treat glabellar lines, forehead lines,
        lateral canthal lines, and platysma bands is not recommended in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of onabotulinumtoxinA in the elderly.
        However, elderly patients are more likely to have age-related liver, kidney,
        or heart problems, which may require caution and an adjustment in the dose
        for patients receiving onabotulinumtoxinA.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - LetibotulinumtoxinA-wlbg
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Amyotrophic lateral sclerosis (Lou Gehrig's disease) or
      - Dermatochalasis (a skin problem) or
      - Diabetes or
      - Lambert-Eaton syndrome (nerve-muscle disorder) or
      - Motor neuropathy (muscle or nerve problem) or
      - Myasthenia gravis (severe muscle weakness) or
      - Sebaceous skin, thick (oily or fatty skin) or
      - Surgery on the face, history of—May increase risk for more serious side effects.
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Breathing problems (eg, asthma, emphysema) or
      - Dysarthria (trouble with speaking) or
      - Dysphagia (trouble with swallowing) or
      - Dysphonia (voice problem) or
      - Heart attack, recent or history of or
      - Heart or blood vessel disease or
      - Heart rhythm problems or
      - Lung problems (eg, bronchitis) or
      - Ptosis (droopy eyelid) or
      - Urinary incontinence (problems passing urine)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Infection at the injection site or
      - Urinary retention (not able to urinate) or
      - Urinary tract infection—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your doctor will give you this medicine in a medical facility. It is given
      as a shot under your skin or into one of your muscles.
  - type: paragraph
    text: You may be given medicine to numb the area where the shot will be injected.
      If you receive the medicine around your eyes, you may be given eye drops or
      ointment to numb the area. After your injection, you may need to wear a protective
      contact lens or eye patch.
  - type: paragraph
    text: If you are being treated for bladder problems , you may also receive medicine
      to help prevent urinary tract infection before, during, or after treatment with
      this medicine.
  - type: paragraph
    text: If you are treated for excessive sweating , shave your underarms but do
      not use deodorant for 24 hours before your injection. Avoid exercise, hot foods
      or liquids, or anything else that could make you sweat for 30 minutes before
      your injection.
  - type: paragraph
    text: This medicine works slowly. For neck disorders , you should have improvement
      within 2 to 6 weeks after your injection. For upper arm stiffness , you should
      have improvement within 4 to 6 weeks after your injection. Eyelid disorders
      should improve within 3 days to 2 weeks after your injection. Strabismus should
      improve within 1 or 2 days after the injection, and the improvement should last
      for 2 to 6 weeks. Once your condition has improved, the medicine will last about
      3 months, then the effects of the medicine will slowly go away. You might need
      more injections when the effects of the medicine wear off. The recommended re-treatment
      schedule for chronic migraine is every 12 weeks.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Your doctor will only use onabotulinumtoxinA (Botox® or Botox® Cosmetic)
      to treat your condition. Other botulinum toxin products may not work the same
      way and require a different dose.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits . This will allow your doctor to see if the medicine is working
      properly and to decide if you should continue to receive it. Blood and urine
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Serious muscle reactions have occurred within hours to weeks after receiving
      this medicine. If you start to have muscle weakness, loss of bladder control,
      or trouble with swallowing, talking, or breathing, call your doctor right away.
      In some patients, these problems could be life-threatening and may require an
      immediate treatment in a hospital or clinic.
  - type: paragraph
    text: This medicine may make your muscles weak and cause vision problems (eg,
      bleeding inside the eye). Do not drive or do anything else that could be dangerous
      until you know how this medicine affects you .
  - type: paragraph
    text: This medicine may reduce blinking of the eye which can lead to an increased
      risk of eye problems (eg, corneal exposure and ulcers). Tell your doctor right
      away if you have a reduced blinking of the eye.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are receiving this medicine.
  - type: paragraph
    text: After you have received this medicine and your vision or muscle spasms are
      better, you may find that you are a lot more active than you were before. You
      should slowly increase your activities to allow time for your body to get stronger.
      Also, before you start an exercise program, check with your doctor.
  - type: paragraph
    text: This medicine may increase your chances of having bronchitis or upper respiratory
      tract infections when given for upper limb spasticity. Tell your doctor right
      away if you have trouble breathing, sneezing, sore throat, coughing, or a fever.
  - type: paragraph
    text: This medicine may cause a condition called autonomic dysreflexia in patients
      with nervous system disorders (eg, spinal cord injury). It can be a life-threatening
      condition and requires immediate medical attention. Call your doctor right away
      if you have headache, increased sweating, slow heartbeat, warmth or redness
      in your face, neck, or arm, or have problems in urinating while using this medicine.
  - type: paragraph
    text: This medicine is made from donated human blood. Some human blood products
      have transmitted viruses to people who have received them, although the risk
      is low. Human donors and donated blood are both tested for viruses to keep the
      transmission risk low. Talk with your doctor about this risk if you are concerned.
  - type: paragraph
    text: Check with your doctor right away if you have difficulty urinating or a
      burning sensation while urinating after receiving this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with swallowing
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with breathing or speaking
      - muscle weakness
    subsections: []
  - heading: More common—for blepharospasm
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dryness of the eyes
      - inability to close the eyelids completely
    subsections: []
  - heading: More common—for upper limb spasticity
    level: 3
