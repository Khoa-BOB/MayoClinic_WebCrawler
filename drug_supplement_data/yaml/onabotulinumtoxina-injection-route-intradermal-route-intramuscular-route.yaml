      - Body aches or pain
      - chills
      - cough
      - ear congestion
      - fever
      - headache
      - loss of voice
      - runny or stuffy nose
      - sneezing
      - sore throat
      - unusual tiredness or weakness
    subsections: []
  - heading: More common—for urinary incontinence caused by an overactive bladder
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - difficult, burning, or painful urination
      - frequent urge to urinate
      - lower back or side pain
    subsections: []
  - heading: Less common—for blepharospasm
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased blinking
      - irritation of the cornea (colored portion) of the eyes
      - turning outward or inward of the edge of the eyelids
    subsections: []
  - heading: Less common—for forehead lines
    level: 3
