title: Hydralazine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Apresoline
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Hydralazine is used to treat high blood pressure (hypertension). It is also
      used to control high blood pressure in a mother during pregnancy (pre-eclampsia
      or eclampsia) or in emergency situations when blood pressure is extremely high
      (hypertensive crisis).
  - type: paragraph
    text: High blood pressure adds to the workload of the heart and arteries. If it
      continues for a long time, the heart and arteries may not function properly.
      This can damage the blood vessels of the brain, heart, and kidneys, resulting
      in a stroke, heart failure, or kidney failure. Lowering blood pressure can decrease
      the risk of heart attacks and strokes.
  - type: paragraph
    text: Hydralazine works by relaxing the blood vessels and increasing the supply
      of blood and oxygen to the heart while reducing its workload.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of hydralazine
        have not been performed in the pediatric population. However, no pediatric-specific
        problems have been documented to date.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of hydralazine in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Clomipramine
      - Dextroamphetamine
      - Haloperidol
      - Lisdexamfetamine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Enteral Nutrition
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (severe chest pain) or
      - Blood disease or
      - Heart attack, history of or
      - Heart rhythm problems or
      - Hypotension (low blood pressure) or
      - Peripheral neuritis (nerve problem) or
      - Stroke, history of or
      - Systemic lupus erythematosus—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Coronary artery disease or
      - Mitral valvular rheumatic heart disease—Should not be used in patients with
        these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Phenylketonuria—The oral solution contains aspartame, which can make this
        condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      or less of it, and do not take it more often than your doctor ordered. Your
      dose may need to be changed several times in order to find out what works best
      for you.
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these are most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure, but
      it does help control it. You must continue to take it as directed if you expect
      to lower your blood pressure and keep it down. You may have to take high blood
      pressure medicine for the rest of your life . If high blood pressure is not
      treated, it can cause serious problems such as heart failure, blood vessel disease,
      stroke, or kidney disease.
  - type: paragraph
    text: It is best to take your medicine on an empty stomach, 1 hour before or 2
      hours after meals.
  - type: paragraph
    text: 'For patients taking the oral liquid :'
  - type: list
    ordered: false
    items:
    - The oral solution may be mixed with fruit juice or applesauce. If mixed with
      fruit juice or applesauce, take immediately after mixing. Be sure to take all
      of the mixture to get the full dose of the medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: For oral dosage form (oral solution): Adults—40
        to 200 milligrams (mg) per day, divided into two or four doses. Children—Dose
        is based on body weight and must be determined by your doctor. The dose is
        usually 0.75 to 7.5 milligram (mg) per kilogram (kg) of body weight per day,
        divided into two or four doses. For oral dosage form (tablets): Adults—At
        first, 10 milligrams (mg) four times a day. Your doctor may adjust your dose
        as needed. However, the dose is usually not more than 50 mg four times a day.
        Children—Dose is based on body weight and must be determined by your doctor.
        The starting dose is usually 0.75 milligram (mg) per kilogram (kg) of body
        weight per day, divided into four doses. The doctor may adjust the dose as
        needed. However, the dose is usually not more than 7.5 mg per kg of body weight
        per day or 200 mg per day.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (oral solution): Adults—40 to 200 milligrams (mg) per
        day, divided into two or four doses. Children—Dose is based on body weight
        and must be determined by your doctor. The dose is usually 0.75 to 7.5 milligram
        (mg) per kilogram (kg) of body weight per day, divided into two or four doses.'
      - 'For oral dosage form (tablets): Adults—At first, 10 milligrams (mg) four
        times a day. Your doctor may adjust your dose as needed. However, the dose
        is usually not more than 50 mg four times a day. Children—Dose is based on
        body weight and must be determined by your doctor. The starting dose is usually
        0.75 milligram (mg) per kilogram (kg) of body weight per day, divided into
        four doses. The doctor may adjust the dose as needed. However, the dose is
        usually not more than 7.5 mg per kg of body weight per day or 200 mg per day.'
    - type: list
      ordered: false
      items:
      - Adults—40 to 200 milligrams (mg) per day, divided into two or four doses.
      - Children—Dose is based on body weight and must be determined by your doctor.
        The dose is usually 0.75 to 7.5 milligram (mg) per kilogram (kg) of body weight
        per day, divided into two or four doses.
    - type: list
      ordered: false
      items:
      - Adults—At first, 10 milligrams (mg) four times a day. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 50 mg four
        times a day.
      - Children—Dose is based on body weight and must be determined by your doctor.
        The starting dose is usually 0.75 milligram (mg) per kilogram (kg) of body
        weight per day, divided into four doses. The doctor may adjust the dose as
        needed. However, the dose is usually not more than 7.5 mg per kg of body weight
        per day or 200 mg per day.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Hydralazine may cause some people to have headaches or to feel dizzy. Make
      sure you know how you react to this medicine before you drive, use machines,
      or do anything else that could be dangerous if you are dizzy or not alert .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes over-the-counter (nonprescription) medicines for appetite
      control, asthma, colds, cough, hay fever, or sinus problems, since they may
      tend to increase your blood pressure.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm, back, or jaw pain
      - chest pain or discomfort
      - chest tightness or heaviness
      - fast, pounding, or irregular heartbeat or pulse
      - nausea
      - shortness of breath
      - sweating
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blindness or vision changes
      - blisters on the skin
      - blurred vision
      - burning of the face or mouth
      - burning, crawling, itching, numbness, painful, prickling, "pins and needles",
        or tingling feelings
      - chills
      - clumsiness or unsteadiness
      - confusion
      - cough
      - difficult or labored breathing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fever and sore throat
      - general feeling of discomfort or illness or weakness
      - joint pain
      - lower back or side pain
      - muscle pain
      - numbness, tingling, pain, or weakness in the hands or feet
      - painful or difficult urination
      - pale skin
      - shakiness in the legs, arms, hands, or feet
      - skin rash or itching
      - swelling of the feet or lower legs
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
      - tightness in the chest
      - trembling or shaking of the hands or feet
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - weakness in hands or feet
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dark urine
      - light-colored stools
      - upper right abdominal or stomach pain
      - yellow eyes and skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Feeling of warmth
      - headache
      - redness of the face, neck, arms, and occasionally, upper chest
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - loss of appetite
      - weight loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - difficulty with moving
      - dizziness
      - feeling anxious or depressed
      - muscle cramps, pain, or stiffness
      - pain in the joints
      - rash, hives, welts, or itching
      - stuffy nose
      - watery eyes
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
