title: Iobenguane i 131 (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Azedra
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Iobenguane I 131 injection is a radiopharmaceutical. Radiopharmaceuticals
      are radioactive agents that may be used to find and treat certain diseases or
      to study the function of the body's organs.
  - type: paragraph
    text: Iobenguane I 131 injection is used to treat iobenguane scan positive, advanced
      or metastatic (cancer that has spread) pheochromocytoma (cancer of the adrenal
      glands) or paraganglioma in patients who cannot be treated by surgery and who
      require systemic cancer treatment.
  - type: paragraph
    text: When very small doses of radioiodinated iobenguane are given, the radioactivity
      taken up by the adrenal glands helps find the tumors. An image of the gland
      on film or on a computer screen can be provided to help with the diagnosis.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor with specialized training in nuclear medicine or radiation oncology.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of iobenguane I 131 injection in
        children 12 years of age and older. Safety and efficacy have been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of iobenguane I 131 injection in
        the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amineptine
      - Amitriptyline
      - Amitriptylinoxide
      - Amoxapine
      - Amphetamine
      - Apraclonidine
      - Armodafinil
      - Benzphetamine
      - Brimonidine
      - Bupropion
      - Carteolol
      - Carvedilol
      - Citalopram
      - Clomipramine
      - Clonidine
      - Cocaine
      - Desipramine
      - Desvenlafaxine
      - Dexmedetomidine
      - Dexmethylphenidate
      - Dextroamphetamine
      - Dibenzepin
      - Diethylpropion
      - Doxepin
      - Duloxetine
      - Ephedrine
      - Escitalopram
      - Fluoxetine
      - Fluvoxamine
      - Furazolidone
      - Guanabenz
      - Guanfacine
      - Imipramine
      - Iproniazid
      - Labetalol
      - Levobunolol
      - Levomilnacipran
      - Linezolid
      - Lisdexamfetamine
      - Lofepramine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Hypertension (high blood pressure) or
      - Hypothyroidism (underactive thyroid)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Infection—May decrease your body's ability to fight an infection.
    - type: list
      ordered: false
      items:
      - Kidney disease, mild or moderate—Use with caution. The effects may be increased
        because of the slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. This medicine is given through a needle placed into one
      of your veins.
  - type: paragraph
    text: Drink at least 2 liters of water a day, starting at least 1 day before and
      continuing for 1 week after each dose of this medicine.
  - type: paragraph
    text: You may also be given anti-vomiting medicine 30 minutes before receiving
      this medicine and iodine at least 24 hours before and up to 10 days after each
      dose of this medicine.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you and your child's progress
      at regular visits to make sure this medicine is working properly. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Receiving this medicine while you are pregnant can harm your unborn baby.
      It may also cause birth defects if the father is receiving it when his sexual
      partner becomes pregnant. Female patients should use effective birth control
      during treatment with this medicine and for 7 months after the last dose. Male
      patients who have female partners should use effective birth control during
      treatment with this medicine and for 4 months after the last dose. If you think
      you have become pregnant while receiving this medicine, tell your doctor right
      away.
  - type: paragraph
    text: You or your child will be exposed to radiation when this medicine is given.
      Talk with your doctor if you have concerns about this.
  - type: paragraph
    text: 'This medicine is passed mainly in the urine where radioactivity is present.
      Follow these guidelines after receiving iobenguane I 131 injection, to help
      reduce the chance of contaminating other persons or the environment with radiation:'
  - type: list
    ordered: false
    items:
    - Use a normal toilet, if available, instead of a urinal.
    - To prevent contamination of your home environment, flush the toilet several
      times after using.
    - Wipe any spilled urine with a tissue and flush it away.
    - Wash your hands after using or cleaning the toilet.
    - Wash your clothes and bed linens right away if they become soiled with your
      urine or blood. Wash them separately from other clothes.
    - If you cut yourself, was h away any spilled blood.
  - type: paragraph
    text: This medicine may lower the number of some types of blood cells in your
      body. Because of this, you or your child may bleed or get infections more easily.
      To help with these problems, avoid being near people who are sick or have infections.
      Wash your hands often. Stay away from rough sports or other situations where
      you could be bruised, cut, or injured. Brush and floss your teeth gently. Be
      careful when using sharp objects, including razors and fingernail clippers.
  - type: paragraph
    text: Check with your doctor right away if you or your child have bloody urine,
      a decrease in frequency or amount of urine, an increase in blood pressure, increased
      thirst, loss of appetite, lower back or side pain, nausea, swelling of the face,
      fingers, or lower legs, troubled breathing, unusual tiredness or weakness, vomiting,
      or weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: This medicine may cause swelling of the lungs (pneumonitis), which can be
      life-threatening and requires immediate medical attention. Check with your doctor
      right away if you or your child have new or worsening cough, fever, or trouble
      breathing.
  - type: paragraph
    text: If you plan to have children, talk with your doctor before receiving this
      medicine. Some men and women receiving this medicine have become infertile (unable
      to have children).
  - type: paragraph
    text: Do not take other medicines until at least 7 days after each dose of iobenguane
      I 131 injection or unless they have been discussed with your doctor. This includes
      prescription or nonprescription (over-the-counter [OTC]) medicines and herbal
      (eg, ma huang, St. John’s Wort, yohimbine) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bladder pain
      - bleeding gums
      - bleeding under the skin
      - blood in the urine or stools
      - blurred vision
      - body aches or pain
      - chest pain
      - chills
      - cloudy urine
      - confusion
      - cough
      - decreased frequency or amount of urine
      - difficult or labored breathing
      - difficult, burning, or painful urination
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dry mouth
      - ear congestion
      - fast, pounding, or irregular heartbeat or pulse
      - fever
      - frequent urge to urinate
      - headache
      - heartburn
      - hoarseness
      - increased thirst
      - loss of appetite
      - loss of voice
      - lower back or side pain
      - nasal congestion
      - nausea
      - nervousness
      - nosebleed
      - pale skin
      - pinpoint red spots on the skin
      - pounding in the ears
      - rapid breathing
      - runny nose
      - slow heartbeat
      - sneezing
      - sore throat
      - sunken eyes
      - swelling of the face, fingers, or lower legs
      - tightness in the chest
      - troubled breathing with exertion ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
      - weight gain
      - wrinkled skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - depressed mood
      - dry skin and hair
      - feeling cold
      - hair loss
      - muscle cramps and stiffness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - belching
      - change in taste
      - decreased weight
      - diarrhea
      - difficulty in moving
      - increased sweating
      - indigestion
      - joint pain
      - loss of taste mouth, throat, or jaw pain
      - muscle pain, spasm, or stiffness
      - neck pain
      - pain at the injection site
      - pain in the arms or legs
      - rash
      - stomach discomfort, upset, or pain
      - stomach distension
      - tenderness of the salivary glands
      - thinning of the hair
      - trouble sleeping
      - trouble swallowing
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
