    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Bitter Orange
      - Blueberry
      - Cranberry Juice
      - Ethanol
      - Grapefruit Juice
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Breast cancer, prolactin-dependent, history of or
      - Chest pain or
      - Heart or blood vessel disease, severe or
      - Hyperprolactinemia (high prolactin in the blood) or
      - Hypotension (low blood pressure) or
      - Mania or
      - Neuroleptic malignant syndrome, history of or
      - Seizures or epilepsy, history of—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Central nervous system depression, severe or
      - Coma or
      - Dementia in the elderly or
      - Lewy body dementia or
      - Parkinson's disease—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Heart rhythm problems (eg, familial long QT syndrome), history of or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood) or
      - Hypothyroidism (underactive thyroid) or
      - Lung disease (eg, bronchopneumonia) or
      - Thyrotoxicosis (overactive thyroid)—May increase risk for more serious side
        effects.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of the
        slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given as a shot into one of your muscles.
  - type: paragraph
    text: Your doctor may give you a few doses of this medicine until your condition
      improves, and then switch you to an oral medicine that works the same way. If
      you have any concerns about this, talk to your doctor.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress while you receive
      this medicine to allow for changes in your dose and help reduce any unwanted
      effects.
  - type: paragraph
    text: Do not stop receiving Haldol® suddenly without asking your doctor. You may
      need to slowly decrease your dose before stopping it completely.
  - type: paragraph
    text: This medicine may cause serious allergic reactions (eg, anaphylaxis, angioedema,
      dermatitis exfoliative), which can be life-threatening and require immediate
      medical attention. Tell your doctor right away if you have a cracks in the skin,
      loss of heat from the body, rash, itching, hoarseness, red, swollen skin, scaly
      skin, trouble breathing, trouble swallowing, or any swelling of your hands,
      face, or mouth after receiving this medicine.
  - type: paragraph
    text: Contact your doctor as soon as possible if you have chest pain or discomfort,
      a fast heartbeat, trouble with breathing, or fever and chills. These may be
      symptoms of a very serious problem with your heart.
  - type: paragraph
    text: This medicine may cause tardive dyskinesia (a movement disorder). Check
      with your doctor right away if you have a lip smacking or puckering, puffing
      of the cheeks, rapid or worm-like movements of the tongue, uncontrolled chewing
      movements, or uncontrolled movements of the arms and legs.
  - type: paragraph
    text: Check with your doctor right away if you have seizures, difficulty with
      breathing, a fast heartbeat, a high fever, high or low blood pressure, increased
      sweating, loss of bladder control, severe muscle stiffness, unusually pale skin,
      or tiredness. These could be symptoms of a serious condition called neuroleptic
      malignant syndrome (NMS).
  - type: paragraph
    text: This medicine will often make you sweat less, causing your body temperature
      to increase. Use extra care not to become overheated during exercise or hot
      weather while you are receiving this medicine, since overheating may result
      in heat stroke. Also, hot baths or saunas may make you feel dizzy or faint while
      you are receiving this medicine.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, drowsy, or may cause
      trouble with thinking or controlling body movements, which may lead to falls,
      fractures or other injuries. Do not drive or do anything else that could be
      dangerous until you know how this medicine affects you .
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up suddenly from a lying or sitting position. Getting up slowly may help. If
      this problem continues or gets worse, check with your doctor.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for allergies or colds, sedatives, tranquilizers,
      or sleeping medicine, prescription pain medicine or narcotics, medicine for
      seizures or barbiturates, muscle relaxants, or anesthetics, including some dental
      anesthetics. Check with your doctor before taking any of the above while you
      are receiving this medicine .
  - type: paragraph
    text: Haloperidol can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. If you can, avoid people
      with infections. Check with your doctor right away if you think you are getting
      an infection, or if you have a fever or chills, a cough or hoarseness, lower
      back or side pain, or painful or difficult urination.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
