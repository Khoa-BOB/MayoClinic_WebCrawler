    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Phendimetrazine is used for weight reduction in patients with obesity who
      have not been able to lose weight with diet and exercise alone. This medicine
      works by suppressing your appetite.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule, Extended Release
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of phendimetrazine extended-release capsules in children younger
        than 17 years of age. Safety and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of phendimetrazine tablets in the pediatric population. Safety
        and efficacy have not been established.
    - type: paragraph
      text: Use of phendimetrazine slow-release capsules is not recommended in children
        younger than 12 years of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of phendimetrazine extended-release
        capsules in the elderly. However, elderly patients are more likely to have
        age-related liver, kidney, or heart problems, which may require caution and
        an adjustment in the dose for patients receiving phendimetrazine extended-release
        capsules .
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of phendimetrazine slow release capsules and tablets in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Brofaromine
      - Clorgyline
      - Furazolidone
      - Iproniazid
      - Isocarboxazid
      - Lazabemide
      - Linezolid
      - Moclobemide
      - Nialamide
      - Pargyline
      - Phenelzine
      - Procarbazine
      - Rasagiline
      - Selegiline
      - Sibutramine
      - Toloxatone
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Iobenguane I 131
      - Venlafaxine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Agitation or anxiety, severe or
      - Drug use disorder or dependence, history of or
      - Glaucoma or
      - Heart or blood vessel disease (eg, arrhythmia, congestive heart failure, coronary
        artery disease, stroke), history of or
      - Heart problems (eg, heart murmur, valvular heart disease) or
      - Hypertension (high blood pressure), uncontrolled, history of or
      - Hyperthyroidism (overactive thyroid) or
      - Pulmonary hypertension, history of—Should not be used in patients with these
        conditions.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hypertension (high blood pressure), controlled—Use with caution. May make
        these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. If too much is taken, it may become habit-forming (causing mental
      or physical dependence).
  - type: paragraph
    text: 'This medicine is available in 3 forms: extended-release capsules , slow-release
      capsules , and tablets . Ask your doctor which dosage form is right for you.'
  - type: paragraph
    text: Swallow the extended-release capsule whole. Do not crush, break, or chew
      it.
  - type: paragraph
    text: Carefully follow your doctor's instructions for a reduced-calorie diet plan
      and regular exercise. Talk with your doctor before starting any exercise program.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For weight loss: For oral dosage form (extended-release capsules): Adults
        and children 17 years of age and older—One capsule once a day, taken 30 to
        60 minutes before the morning meal. Children younger than 17 years of age—Use
        and dose must be determined by your doctor. For oral dosage form (slow-release
        capsules): Adults and teenagers—One capsule or 105 milligrams (mg) once a
        day, taken 30 to 60 minutes before the morning meal. Children younger than
        12 years of age—Use is not recommended. For oral dosage form (tablets): Adults—One
        tablet, or 35 milligrams (mg), 2 or 3 times a day, taken 1 hour before meals.
        Your doctor may adjust your dose as needed. However, the dose is usually not
        more than two tablets 3 times a day. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release capsules): Adults and children 17
        years of age and older—One capsule once a day, taken 30 to 60 minutes before
        the morning meal. Children younger than 17 years of age—Use and dose must
        be determined by your doctor.'
      - 'For oral dosage form (slow-release capsules): Adults and teenagers—One capsule
        or 105 milligrams (mg) once a day, taken 30 to 60 minutes before the morning
        meal. Children younger than 12 years of age—Use is not recommended.'
      - 'For oral dosage form (tablets): Adults—One tablet, or 35 milligrams (mg),
        2 or 3 times a day, taken 1 hour before meals. Your doctor may adjust your
        dose as needed. However, the dose is usually not more than two tablets 3 times
        a day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 17 years of age and older—One capsule once a day, taken
        30 to 60 minutes before the morning meal.
      - Children younger than 17 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - Adults and teenagers—One capsule or 105 milligrams (mg) once a day, taken
        30 to 60 minutes before the morning meal.
      - Children younger than 12 years of age—Use is not recommended.
    - type: list
      ordered: false
      items:
      - Adults—One tablet, or 35 milligrams (mg), 2 or 3 times a day, taken 1 hour
        before meals. Your doctor may adjust your dose as needed. However, the dose
        is usually not more than two tablets 3 times a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Do not use phendimetrazine if you are also using similar medicines, such
      as benzphetamine, diethylpropion, mazindol, phentermine, Didrex®, or Suprenza™.
      Also, do not use this medicine if you have used an MAO inhibitor (MAOI) such
      as Eldepryl®, Marplan®, Nardil®, or Parnate® within the past 14 days. Using
      these medicines together may cause serious unwanted effects .
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may be habit-forming. If you think this medicine is not working
      properly after you have taken it for a few weeks, do not increase the dose .
      Instead, check with your doctor.
  - type: paragraph
    text: This medicine may cause pulmonary hypertension (increased blood pressure
      in the lungs). Serious heart or blood vessel problems (eg, valvular heart disease)
      may also occur if you take more of it, if you take it for a longer time, or
      if you are taking other medicine that reduces appetite (eg, dexfenfluramine
      (Redux®), fenfluramine (Fintepla®)). Check with your doctor right away if you
      have chest pain, decreased ability to exercise, fainting, swelling of the feet
      or lower legs, or trouble breathing.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, lightheaded, or less
      alert than they are normally. Do not drive or do anything else that could be
      dangerous until you know how this medicine affects you .
  - type: paragraph
    text: If you will be taking this medicine for a long time, do not stop taking
      it without first checking with your doctor . Your doctor may want you to gradually
      reduce the amount you are taking before stopping completely.
  - type: paragraph
    text: 'Symptoms of an overdose include : confusion, panic state, restlessness,
      or seeing, hearing, or feeling things that are not there.'
  - type: paragraph
    text: 'For diabetic patients : This medicine may affect blood sugar levels. If
      you notice a change in the results of your blood or urine sugar tests, or if
      you have any questions, check with your doctor.'
  - type: paragraph
    text: Avoid drinking alcohol while using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription and nonprescription (over-the-counter) medicines,
      dietary supplements, herbal remedies, or medicines for appetite control, asthma,
      colds, cough, hay fever, and sinus problems.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Seeing, hearing, or feeling things that are not there
      - severe mental changes
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - burning while urinating
      - chest pain or discomfort
      - decreased ability to exercise
      - difficult or painful urination
      - dizziness
      - dry mouth
      - fainting
      - fast, irregular, pounding, or racing heartbeat or pulse
      - feeling of warmth
      - headache
      - hyperventilation
      - increased need to urinate
      - irritability
      - nausea
      - numbness or tingling in the arms or legs
      - pain or discomfort in the arms, jaw, back, or neck
      - passing urine more often
      - redness of the face, neck, arms, and occasionally, upper chest
      - restlessness
      - shakiness in the legs, arms, hands, or feet
      - sweating
      - swelling of the feet or lower legs
      - trembling or shaking of the hands or feet
      - trouble breathing
      - trouble sleeping
      - trouble with thinking, speaking, or walking
      - vomiting
      - weakness
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - change in consciousness
      - diarrhea
      - discouragement
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fast, slow, or irregular heartbeat
      - feeling sad or empty
      - lack of appetite
      - lightheadedness
      - loss of consciousness
      - loss of interest or pleasure
      - overactive reflexes
      - panic
      - physical attempt to injure
      - pounding in the ears
      - rapid breathing
      - seizures
      - stomach cramps
      - sweating
      - tiredness
      - trouble with concentrating
      - unusual tiredness or weakness
      - violent actions
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased interest in sexual intercourse
      - difficulty having a bowel movement (stool)
      - inability to have or keep an erection
      - increased in sexual ability, desire, drive, or performance
      - increased interest in sexual intercourse
      - loss in sexual ability, desire, drive, or performance
      - sleeplessness
      - stomach pain
      - unable to sleep
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
