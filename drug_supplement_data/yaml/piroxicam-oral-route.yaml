    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Bleeding problems or
      - Blood clots or
      - Congestive heart failure or
      - Dehydration or
      - Edema (fluid retention or body swelling) or
      - Heart attack, recent or
      - Heart or blood vessel disease or
      - Hyperkalemia (high levels of potassium in the blood) or
      - Hypertension (high blood pressure) or
      - Kidney disease or
      - Liver disease or
      - Stomach or intestinal ulcers or bleeding, history of or
      - Stroke, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Aspirin-sensitive asthma, history of or
      - Aspirin sensitivity, history of or
      - Kidney disease, severe—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Hypovolemia (low blood volume)—Must be corrected first before using this medicine.
    - type: list
      ordered: false
      items:
      - Heart surgery (eg, coronary artery bypass graft [CABG] surgery)—Should not
        be used to relieve pain right before or after the surgery.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: For safe and effective use of this medicine, do not use more of it, do not
      use it more often, and do not use it for a longer time than your doctor ordered
      . Using too much of this medicine may increase the chance of unwanted effects.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the capsule whole. Do not crush, break, or chew it.
  - type: paragraph
    text: When used for severe or continuing arthritis, this medicine must be taken
      regularly as ordered by your doctor in order for it to help you. This medicine
      usually begins to work within 1 week, but in severe cases up to two weeks or
      even longer may pass before you begin to feel better. Also, several weeks may
      pass before you feel the full effects of this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For osteoarthritis and rheumatoid arthritis:
        Adults—20 milligrams (mg) once a day or 10 mg 2 times a day. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For osteoarthritis and rheumatoid arthritis: Adults—20 milligrams (mg) once
        a day or 10 mg 2 times a day. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—20 milligrams (mg) once a day or 10 mg 2 times a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to decide if you should continue to use it. Blood and urine tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: This medicine may raise your risk of having a heart attack, heart failure,
      blood clot, or stroke. This is more likely in people who already have heart
      disease. People who use this medicine for a long time might also have a higher
      risk. Check with your doctor right away if you are having chest pain or discomfort,
      nausea or vomiting, pain or discomfort in the arms, jaw, back, or neck, trouble
      breathing, slurred speech, or weakness.
  - type: paragraph
    text: This medicine may cause bleeding in your stomach or bowels. These problems
      can happen without warning signs. This is more likely if you have had a stomach
      ulcer in the past, if you smoke or drink alcohol regularly, are over 60 years
      of age, are in poor health, or using certain other medicines (eg, steroid medicine,
      blood thinner). Call your doctor right away if you have severe stomach pain,
      black, tarry stools, or are vomiting blood or material that looks like coffee
      grounds.
  - type: paragraph
    text: Check with your doctor right away if you have any symptoms of liver problems
      including dark-colored urine or pale stools, nausea, vomiting, loss of appetite,
      pain in your upper stomach, or yellow skin or eyes.
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. You might need to measure
      your blood pressure at home. If you think your blood pressure is too high, call
      your doctor right away.
  - type: paragraph
    text: Some possible warning signs of serious side effects that can occur during
      treatment with this medicine may include black, tarry stools, decreased urination,
      severe stomach pain, skin rash, swelling of the face, fingers, feet, or lower
      legs, unusual bleeding or bruising, unusual weight gain, vomiting of blood or
      material that looks like coffee grounds, or yellow skin or eyes. Also, signs
      of serious heart problems could occur such as chest pain or tightness, fast
      or irregular heartbeat, unusual flushing or warmth of the skin, weakness, or
      slurring of speech. Check with your doctor immediately if you notice any of
      these warning signs .
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, trouble breathing, unusual tiredness or weakness, vomiting, or
      weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have stomach pain, confusion,
      difficulty with breathing, irregular heartbeat, nausea or vomiting, nervousness,
      numbness or tingling in the hands, feet, or lips, or weakness or heaviness of
      the legs.
  - type: paragraph
    text: This medicine may also cause serious allergic reaction called anaphylaxis,
      which can be life-threatening and requires medical attention. Although this
      is rare, it may occur more often in patients who are allergic to aspirin or
      to any of the nonsteroidal anti-inflammatory drugs (NSAIDs). Tell your doctor
      right away if you have a rash, itching, hoarseness, trouble breathing, trouble
      swallowing, or any swelling of your hands, face, or mouth after using this medicine.
  - type: paragraph
    text: Serious skin reactions, including exfoliative dermatitis, Stevens-Johnson
      syndrome, toxic epidermal necrolysis, fixed drug eruption (FDE), and generalized
      bullous fixed drug eruption (GBFDE) can occur with this medicine. Check with
      your doctor right away if you have blistering, peeling, or loosening of the
      skin, chills, cough, diarrhea, itching, joint or muscle pain, red irritated
      eyes, red skin lesions, sore throat, sores, ulcers, or white spots in the mouth
      or on the lips, or unusual tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have black, tarry stools, chest
      pain, chills, cough, fever, painful or difficult urination, sore throat, sores,
      ulcers, or white spots in the mouth or on the lips, swollen glands, unusual
      bleeding or bruising, or unusual tiredness or weakness. These may be symptoms
      of a serious skin reaction called drug reaction with eosinophilia and systemic
      symptoms (DRESS).
  - type: paragraph
    text: Using this medicine during the later part of a pregnancy can harm your unborn
      baby. If you think you have become pregnant while using the medicine, tell your
      doctor right away.
  - type: paragraph
    text: This medicine may cause a delay in ovulation for women and may affect their
      ability to have children. If you plan to have children, talk with your doctor
      before using this medicine.
  - type: paragraph
    text: Check with your doctor immediately if blurred vision, difficulty in reading,
      or any other change in vision occurs during or after your treatment. Your doctor
      may want you to have your eyes checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: Before having any kind of surgery or medical tests, tell your doctor that
      you are using this medicine. It may be necessary for you to stop treatment for
      a while, or to change to a different nonsteroidal anti-inflammatory drug before
      your procedure.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
