title: Haemophilus b polysaccharide vaccine (intramuscular route, injection route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Haemophilus b polysaccharide vaccine is an active immunizing agent used
      to prevent infection by Haemophilus influenzae type b (Hib) bacteria. The vaccine
      works by causing your body to produce its own protection (antibodies) against
      the disease.
  - type: paragraph
    text: The following information applies only to the Haemophilus b polysaccharide
      vaccine.
  - type: paragraph
    text: Infection by Haemophilus influenzae type b (Hib) bacteria can cause life-threatening
      illnesses, such as meningitis, which affects the brain; epiglottitis, which
      can cause death by suffocation; pericarditis, which affects the heart; pneumonia,
      which affects the lungs; and septic arthritis, which affects the bones and joints.
      Hib meningitis causes death in 5 to 10% of children who are infected. Also,
      approximately 30% of children who survive Hib meningitis are left with some
      type of serious permanent damage, such as intellectual disability, deafness,
      epilepsy, or partial blindness.
  - type: paragraph
    text: 'Immunization against Hib is recommended for all children 24 months up to
      5 years of age (i.e., up to the 5th birthday). In addition, immunization is
      recommended for children 18 to 24 months of age, especially:'
  - type: list
    ordered: false
    items:
    - Children attending day-care facilities.
    - Children with chronic illnesses associated with increased risk of Hib disease.
      These illnesses include asplenia, sickle cell disease, antibody deficiency syndromes,
      immunosuppression, and Hodgkin's disease.
    - Children 18 to 24 months of age who have already had Hib disease. These children
      may get the disease again if they are not immunized. Children who developed
      Hib disease when 24 months of age or older do not need to be immunized, since
      most children in this age group will develop antibodies against the disease.
    - Children with human immunodeficiency virus (HIV) infection or acquired immunodeficiency
      syndrome (AIDS).
    - Children of certain racial groups, such as American Indian and Alaskan Eskimo.
      Children in these groups seem to be at increased risk of Hib disease.
    - Children living close together with groups of other persons. Close living conditions
      increase a child's risk of being exposed to persons who have Hib infection or
      who carry the bacteria.
  - type: paragraph
    text: It is recommended that children immunized when they were 18 to 24 months
      of age receive a second dose of vaccine, since these children may not produce
      enough antibodies to fully protect them from Hib disease. Children who were
      first immunized when they were 24 months of age or older do not need to be reimmunized.
  - type: paragraph
    text: This vaccine is available only from your doctor or other authorized health
      care professional.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This vaccine is not recommended for children less than 18 months of age.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atidarsagene Autotemcel
      - Elivaldogene Autotemcel
      - Ocrelizumab
      - Teplizumab-mzwv
      - Ublituximab-xiiy
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Fever or
      - Serious illness—The symptoms of the condition may be confused with the possible
        side effects of the vaccine
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: For prevention of Haemophilus influenzae type
        b infection: Adults and children 5 years of age and older—Use is not recommended.
        Children up to 18 months of age—Use is not recommended. Children 18 to 24
        months of age—Use and dose must be determined by your doctor. Children 24
        months to 5 years of age—One dose injected under the skin or into a muscle.'
    - type: list
      ordered: false
      items:
      - 'For prevention of Haemophilus influenzae type b infection: Adults and children
        5 years of age and older—Use is not recommended. Children up to 18 months
        of age—Use is not recommended. Children 18 to 24 months of age—Use and dose
        must be determined by your doctor. Children 24 months to 5 years of age—One
        dose injected under the skin or into a muscle.'
    - type: list
      ordered: false
      items:
      - Adults and children 5 years of age and older—Use is not recommended.
      - Children up to 18 months of age—Use is not recommended.
      - Children 18 to 24 months of age—Use and dose must be determined by your doctor.
      - Children 24 months to 5 years of age—One dose injected under the skin or into
        a muscle.
    subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Symptoms of allergic reaction
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty in breathing or swallowing
      - hives
      - itching (especially of feet or hands)
      - reddening of skin (especially around ears)
      - swelling of eyes, face, or inside of nose
      - unusual tiredness or weakness (sudden and severe)
    - type: paragraph
      text: 'Check with your doctor immediately if any of the following side effects
        occur:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Convulsions (seizures)
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - fever up to 102 °F (39 °C) (usually lasts less than 48 hours)
      - irritability
      - lack of appetite
      - lack of interest
      - redness at place of injection
      - reduced physical activity
      - tenderness at place of injection
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever over 102 °F (39 °C) (usually lasts less than 48 hours)
      - hard lump at place of injection
      - itching
      - joint aches or pains
      - skin rash
      - swelling at place of injection
      - trouble in sleeping
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
