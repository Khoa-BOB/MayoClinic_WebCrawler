      - increased sensitivity of the skin to sunlight
      - irritability
      - lack of appetite
      - lack of interest or pleasure
      - lack or loss of strength
      - redness or other discoloration of the skin
      - sensation of spinning
      - severe sunburn
      - sleepiness
      - trouble concentrating
      - trouble sleeping
    subsections: []
  - heading: Rare
