    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Asthma or
      - Bleeding problems or
      - Blood clots or
      - Congestive heart failure or
      - Edema (fluid retention or body swelling) or
      - Heart attack, history of or
      - Hyperkalemia (high potassium in the blood) or
      - Hypertension (high blood pressure) or
      - Kidney disease or
      - Liver disease (eg, hepatitis) or
      - Stomach or intestinal ulcers or bleeding, history of or
      - Stroke, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Aspirin-sensitive asthma, history of or
      - Aspirin (or other NSAIDs) sensitivity, history of or
      - Kidney disease, severe or
      - Stomach ulcers, active—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Hypovolemia (low blood volume)—Must be corrected first before using this medicine.
    - type: list
      ordered: false
      items:
      - Heart surgery (eg, coronary artery bypass graft [CABG] surgery)—Should not
        be used for pain right before or after surgery.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. To do so may increase the chance for side effects.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: If this medicine upsets your stomach, take it with food or milk.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For menstrual cramps: Adults and children
        14 years of age and older—At first, 500 milligrams (mg), then 250 mg every
        6 hours as needed, for 2 to 3 days. Children younger than 14 years of age—Use
        and dose must be determined by your doctor. For mild to moderate pain: Adults
        and children 14 years of age and older—At first, 500 milligrams (mg), then
        250 mg every 6 hours as needed, for not more than 1 week. Children younger
        than 14 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For menstrual cramps: Adults and children 14 years of age and older—At first,
        500 milligrams (mg), then 250 mg every 6 hours as needed, for 2 to 3 days.
        Children younger than 14 years of age—Use and dose must be determined by your
        doctor.'
      - 'For mild to moderate pain: Adults and children 14 years of age and older—At
        first, 500 milligrams (mg), then 250 mg every 6 hours as needed, for not more
        than 1 week. Children younger than 14 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 14 years of age and older—At first, 500 milligrams (mg),
        then 250 mg every 6 hours as needed, for 2 to 3 days.
      - Children younger than 14 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - Adults and children 14 years of age and older—At first, 500 milligrams (mg),
        then 250 mg every 6 hours as needed, for not more than 1 week.
      - Children younger than 14 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . to make sure this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may raise your risk of having a heart attack, heart failure,
      or stroke. This is more likely in people who already have heart disease or in
      people who use this medicine for a long time. Check with your doctor right away
      if you are having chest pain or discomfort, nausea or vomiting, pain or discomfort
      in the arms, jaw, back, or neck, trouble breathing, slurred speech, or weakness.
  - type: paragraph
    text: This medicine may cause bleeding in your stomach or intestines. These problems
      can happen without warning signs. This is more likely if you have had a stomach
      ulcer in the past, if you smoke or drink alcohol regularly, are over 60 years
      of age, are in poor health, or using certain other medicines (eg, steroid medicine,
      blood thinner). Call your doctor right away if you have severe stomach pain,
      black, tarry stools, or are vomiting blood or material that looks like coffee
      grounds.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. You might need to measure
      your blood pressure at home. If you think your blood pressure is too high, call
      your doctor right away.
  - type: paragraph
    text: Serious skin reactions, including exfoliative dermatitis, Stevens-Johnson
      syndrome, toxic epidermal necrolysis, fixed drug eruption (FDE), and generalized
      bullous fixed drug eruption (GBFDE) can occur with this medicine. Check with
      your doctor right away if you have blistering, peeling, or loosening of the
      skin, chills, cough, diarrhea, itching, joint or muscle pain, red irritated
      eyes, red skin lesions, sore throat, sores, ulcers, or white spots in the mouth
      or on the lips, swollen glands, unusual bleeding or bruising, or unusual tiredness
      or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have black, tarry stools, chest
      pain, chills, cough, fever, painful or difficult urination, sore throat, sores,
      ulcers, or white spots on the lips or in the mouth, swollen glands, trouble
      breathing, unusual bleeding or bruising, or unusual tiredness or weakness. These
      may be symptoms of a serious skin reaction including drug reaction with eosinophilia
      and systemic symptoms (DRESS).
  - type: paragraph
    text: Some possible warning signs of some serious side effects that can occur
      during treatment with this medicine may include swelling of the face, fingers,
      feet, or lower legs, severe stomach pain, black, tarry stools, or vomiting of
      blood or material that looks like coffee grounds, unusual weight gain, yellow
      skin or eyes, decreased urination, bleeding or bruising, or skin rash. Also,
      signs of serious heart problems could occur including chest pain or tightness,
      fast or irregular heartbeat, unusual flushing or warmth of skin, weakness, or
      slurring of speech. Check with your doctor immediately if you notice any of
      these warning signs .
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, trouble breathing, unusual tiredness or weakness, vomiting, or
      weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have stomach pain, confusion,
      difficulty with breathing, irregular heartbeat, nausea or vomiting, nervousness,
      numbness or tingling in the hands, feet, or lips, or weakness or heaviness of
      the legs.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction called anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth after using
      this medicine.
  - type: paragraph
    text: This medicine may cause a delay in ovulation for women and may affect their
      ability to have children. If you plan to have children, talk with your doctor
      before using this medicine.
  - type: paragraph
    text: Using this medicine during the later part of a pregnancy can harm your unborn
      baby. If you think you have become pregnant while using this medicine, tell
      your doctor right away.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect the results of certain medical tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
