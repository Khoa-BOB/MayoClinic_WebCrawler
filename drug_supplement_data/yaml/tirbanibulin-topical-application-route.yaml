title: Tirbanibulin (topical application route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Klisyri
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Tirbanibulin topical is used to treat actinic keratosis on the face or scalp.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Ointment
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of tirbanibulin topical in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of tibranibulin topical in the elderly.
        However, elderly patients are more sensitive to the effects of this medicine
        than younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Other skin problems (eg, patients who have received treatment with other medicine,
        procedure, or surgery)—Should not be used until your skin has healed from
        other treatments.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine only as directed by your
      doctor . Do not use more of it, do not use it more often, and do not use it
      for a longer time than your doctor ordered. To do so may cause your skin to
      become irritated.
  - type: paragraph
    text: This medicine is for use on the skin only . Do not get any of this medicine
      near or around your eyes, mouth, or lips. If it does get on these areas, rinse
      it off with water and check with your doctor right away, especially if you have
      red, sore eyes.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions in the leaflet carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: 'To use the ointment :'
  - type: list
    ordered: false
    items:
    - Use 1 single-dose packet with each application.
    - Wash your hands with soap and water before and after using this medicine.
    - Apply a thin, even layer of the medicine to cover the affected area (up to 100
      cm2) on the face or scalp.
    - Do not bandage or otherwise wrap the skin being treated unless directed to do
      so by your doctor.
    - Do not wash or touch the treated area for at least 8 hours after application.
      You may wash the area with mild soap and water after 8 hours.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (ointment): For actinic keratosis on the face or
        scalp: Adults—Apply to the affected area once a day for 5 consecutive days.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For actinic keratosis on the face or scalp: Adults—Apply to the affected
        area once a day for 5 consecutive days. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply to the affected area once a day for 5 consecutive days.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away any open packet after use even if there is still medicine left
        in it.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      for any unwanted effects that may be caused by this medicine.
  - type: paragraph
    text: If your condition does not improve or if it become worse, check with your
      doctor.
  - type: paragraph
    text: This medicine may cause serious skin reactions. Check with your doctor right
      away if you have blisters, peeling, pus, ulcers, cracking, redness, flaking,
      scaling, crusting, or swelling of the skin.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cracking of the skin
      - crusting of the skin
      - dryness and peeling of the skin
      - flushing, redness of the skin
      - redness, blistering, peeling, or loosening of the skin
      - skin ulcers
      - swelling
      - unusually warm skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, stinging, or pain at the application site
      - itching skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
