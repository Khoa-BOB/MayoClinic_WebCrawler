title: Trazodone (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Desyrel
    - type: paragraph
      text: Desyrel Dividose
    - type: paragraph
      text: Oleptro
    - type: paragraph
      text: Raldesy
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Trazodone is used to treat depression. It is thought to work by increasing
      the activity of serotonin in the brain. Trazodone is an antidepressant.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of trazodone in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of trazodone extended-release tablets
        in the elderly. However, elderly patients are more likely to have hyponatremia
        (low sodium in the blood), which may require caution in patients receiving
        trazodone.
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of trazodone regular tablets in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Bromopride
      - Cisapride
      - Dronedarone
      - Fluconazole
      - Isocarboxazid
      - Ketoconazole
      - Levoketoconazole
      - Linezolid
      - Mesoridazine
      - Methylene Blue
      - Ozanimod
      - Phenelzine
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Procarbazine
      - Rasagiline
      - Safinamide
      - Saquinavir
      - Selegiline
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Tranylcypromine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Abciximab
      - Aceclofenac
      - Acemetacin
      - Acenocoumarol
      - Adagrasib
      - Alfentanil
      - Alfuzosin
      - Almotriptan
      - Alprazolam
      - Amineptine
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amitriptylinoxide
      - Amobarbital
      - Amoxapine
      - Amphetamine
      - Amtolmetin Guacil
      - Anagrelide
      - Anileridine
      - Apalutamide
      - Apixaban
      - Apomorphine
      - Aprobarbital
      - Ardeparin
      - Argatroban
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Aspirin
      - Astemizole
      - Atazanavir
      - Avacopan
      - Azithromycin
      - Baclofen
      - Barbital
      - Bedaquiline
      - Bemiparin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Foxglove
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Behavior or mood changes (eg, aggression, panic attacks) or
      - Bipolar disorder (mood disorder with mania and depression), or risk of or
      - Glaucoma (angle closure type) or
      - Heart rhythm problems (eg, QT prolongation) or
      - Hyponatremia (low sodium in the blood) or
      - Hypotension (low blood pressure) or
      - Mania or hypomania (mood disorders), history of or
      - Priapism (painful or prolonged erection of the penis)—Use with caution. May
        make these conditions worse.
    - type: list
      ordered: false
      items:
      - Heart attack, recent—Use is not recommended in patients with this condition.
    - type: list
      ordered: false
      items:
      - Heart disease or
      - Heart rhythm problems (eg, QT prolongation), family history of or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood)—Use with caution. May cause side
        effects to become worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: To lessen stomach upset and to reduce dizziness and lightheadedness, take
      the regular tablet with or shortly after a meal or light snack.
  - type: paragraph
    text: Take the extended-release tablet at the same time each day, preferably at
      bedtime, without food.
  - type: paragraph
    text: The tablet can be swallowed whole or given as a half tablet by breaking
      the tablet along the score line. Do not break the tablet unless your doctor
      tells you to. Do not crush or chew the tablet.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For depression: For oral dosage form (extended-release tablets): Adults—At
        first, 150 milligrams (mg) per day as a single dose. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 375 mg per
        day. Children—Use and dose must be determined by your doctor. For oral dosage
        form (tablets): Adults—At first, 150 milligrams (mg) per day, given in divided
        doses. Your doctor may adjust your dose as needed. However, the dose is usually
        not more than 400 mg per day. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets): Adults—At first, 150 milligrams
        (mg) per day as a single dose. Your doctor may adjust your dose as needed.
        However, the dose is usually not more than 375 mg per day. Children—Use and
        dose must be determined by your doctor.'
      - 'For oral dosage form (tablets): Adults—At first, 150 milligrams (mg) per
        day, given in divided doses. Your doctor may adjust your dose as needed. However,
        the dose is usually not more than 400 mg per day. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 150 milligrams (mg) per day as a single dose. Your doctor
        may adjust your dose as needed. However, the dose is usually not more than
        375 mg per day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—At first, 150 milligrams (mg) per day, given in divided doses. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than 400 mg per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      , to allow for changes in your dose and to help manage any unwanted effects.
  - type: paragraph
    text: Do not take trazodone with a monoamine oxidase (MAO) inhibitor (eg, isocarboxazid
      [Marplan®], linezolid (Zyvox®), methylene blue, phenelzine [Nardil®], selegiline
      [Eldepryl®], tranylcypromine [Parnate®]). Do not start taking trazodone during
      the 2 weeks after you stop a MAO inhibitor and wait 2 weeks after stopping trazodone
      before you start taking a MAO inhibitor. If you take them together or do not
      wait 2 weeks, you may develop confusion, agitation, restlessness, stomach or
      intestinal symptoms, a sudden high body temperature, an extremely high blood
      pressure, or severe convulsions.
  - type: paragraph
    text: Trazodone may cause a serious condition called serotonin syndrome if taken
      together with some medicines. Do not use trazodone with buspirone (Buspar®),
      fentanyl (Abstral®, Duragesic®), lithium (Eskalith®, Lithobid®), tryptophan,
      St. John's wort, or some pain or migraine medicines (eg, sumatriptan, tramadol,
      Frova®, Maxalt®, Relpax®, Zomig®).
  - type: paragraph
    text: For some teenagers and young adults, this medicine can increase thoughts
      of suicide. Tell your doctor right away if you start to feel more depressed
      or have thoughts about hurting yourself or others. Report any unusual thoughts
      or behaviors that trouble you, especially if they are new or get worse quickly.
      Make sure the doctor knows if you have trouble sleeping, get upset easily, have
      a big increase in energy, or start to act reckless. Also tell the doctor if
      you have sudden or strong feelings, such as feeling nervous, angry, restless,
      violent, or scared. Let the doctor know if you or anyone in your family have
      bipolar disorder (manic-depressive disorder) or have tried to commit suicide.
  - type: paragraph
    text: Check with your doctor right away if you have anxiety, restlessness, a fast
      heartbeat, fever, sweating, muscle spasms, twitching, nausea, vomiting, diarrhea,
      or see or hear things that are not there. These may be symptoms of serious conditions
      called serotonin syndrome and neuroleptic malignant syndrome-like reactions.
      Your risk may be higher if you also take certain other medicines that affect
      serotonin levels in your body.
  - type: paragraph
    text: Contact your doctor right away if you have any changes in your heart rhythm
      such as feeling dizzy or faint, or having a fast, pounding, or uneven heartbeat.
      These could be symptoms of a heart problem called QT prolongation.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up suddenly from a lying or sitting position. Getting up slowly may help. If
      this problem continues or gets worse, check with your doctor.
  - type: paragraph
    text: Do not stop taking this medicine without first checking with your doctor
      . Your doctor may want you to gradually reduce the amount you are using before
      stopping it completely. This may help prevent a worsening of your condition
      and reduce the possibility of withdrawal symptoms such as anxiety, irritability,
      restlessness, or trouble sleeping.
  - type: paragraph
    text: This medicine may cause some people to become drowsy or less alert than
      they are normally. Make sure you know how you react to this medicine before
      you drive, use machines, or do anything else that could be dangerous if you
      are not alert .
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for allergies or colds, sedatives, tranquilizers
      or sleeping medicine, prescription pain medicine or narcotics, medicine for
      seizures or barbiturates, muscle relaxants, or anesthetics, including some dental
      anesthetics. Check with your doctor before taking any of the above while you
      are using this medicine .
  - type: paragraph
    text: Before having any kind of surgery, dental treatment, or emergency treatment,
      tell the medical doctor or dentist in charge that you are using this medicine.
      Taking trazodone together with anesthetic medicines (numbing medicines) that
      are used during surgery, dental treatments, or emergency treatments may cause
      an increase in CNS depressant effects.
  - type: paragraph
    text: Trazodone may cause dry mouth. For temporary relief, use sugarless gum or
      candy, melt bits of ice in your mouth, or use a saliva substitute. However,
      if your mouth continues to feel dry for more than 2 weeks, check with your medical
      doctor or dentist. Continuing dryness of the mouth may increase the chance of
      dental disease, including tooth decay, gum disease, and fungus infections.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - dizziness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - lightheadedness
      - sweating
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - confusion about identity, place, and time
      - decreased concentration
      - fainting
      - general feeling of discomfort or illness
      - headache
      - lack of coordination
      - muscle tremors
      - nervousness
      - pounding in the ears
      - shortness of breath
      - slow or fast heartbeat
      - swelling
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin rash
      - unusual excitement
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry mouth (usually mild)
      - muscle or bone pain
      - trouble sleeping
      - trouble with remembering
      - unpleasant taste
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - continuing ringing or buzzing or other unexplained noise in the ears
      - diarrhea
      - hearing loss
      - muscle aches or pains
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
