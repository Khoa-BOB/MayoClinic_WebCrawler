title: Latanoprost (ophthalmic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Xalatan
    - type: paragraph
      text: Xelpros
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Latanoprost eye drops is used to treat certain kinds of glaucoma. It is
      also used to treat a condition called hypertension of the eyealone or together
      with other medicines to lower pressure inside the eye that is caused by open-angle
      glaucoma or ocular (eye) hypertension. Latanoprost appears to work by increasing
      the outflow of fluid from the eye. This lowers the pressure in the eye.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
    - Emulsion
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of latanoprost eye drops in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of latanoprost eye drops in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Aphakia (no lens in the eyes) or
      - Eye inflammation (eg, iritis or uveitis), history of or
      - Herpes simplex eye infection, history of or
      - Patients with torn artificial lenses—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Eye infection or inflammation, active—Should not be used in patients with
        this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use if for a longer time than your doctor
      ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: 'To use the eye drops:'
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and water before and after you use this medicine.
    - Shake well just before each use.
    - Tilt your head back. Press your finger gently on the skin just beneath the lower
      eyelid and pull it away from the eye to make a space. Drop the medicine into
      this space. Let go of the eyelid and gently close the eyes. Do not blink. Keep
      the eyes closed and apply pressure to the inner corner of the eye with your
      finger for 1 or 2 minutes to allow the medicine to be absorbed by the eye.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
      Serious damage to the eye and possible loss of vision may result from using
      contaminated eye medicines.
  - type: paragraph
    text: You should not use this medicine if you have contact lenses in your eyes.
      Remove your contact lenses before using it. Wait at least 15 minutes after you
      use the medicine before putting the contact lenses back in.
  - type: paragraph
    text: If you will be using latanoprost with other eye medicines, use them at least
      5 minutes apart from each other.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic emulsion dosage form (eye drops): For glaucoma or hypertension
        of the eye: Adults—One drop in the affected eye once a day in the evening.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For glaucoma or hypertension of the eye: Adults—One drop in the affected
        eye once a day in the evening. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—One drop in the affected eye once a day in the evening.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: 'Xalatan® : Store the unopened bottle in the refrigerator. You may keep
        the opened bottle in the refrigerator or at room temperature for up to 6 weeks.'
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: If itching, redness, swelling, or other signs of eye or eyelid irritation
      occur, check with your doctor. These signs may mean that you are allergic to
      this medicine.
  - type: paragraph
    text: This medicine may cause blurred vision or other vision problems. If these
      occur, do not drive, use machines, or do anything else that could be dangerous
      if you are not able to see well. If these eye changes are bothersome, check
      with your doctor.
  - type: paragraph
    text: While you are using latanoprost, the iris (colored part) of your treated
      eye may slowly become more brown in color. This is more likely to happen if
      you have blue-brown, gray-brown, green-brown, or yellow-brown eyes. You may
      notice this change usually within several months or years from the start of
      treatment. You may also have darkening of the eyelid skin color or longer, thicker,
      and darker eyelashes. These changes to the iris, eyelid, and lashes may be permanent
      even if you stop using latanoprost. However, any of these changes will affect
      only the eye being treated with latanoprost. Check with your doctor if you have
      any concerns about this.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Eye pain or stinging
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased vision
      - painful irritation of the clear front part of the eye
      - swelling or redness of the eye and the lining of the eyelid
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm, back, or jaw pain
      - blistering, peeling, or loosening of the skin
      - blurred vision or other change in vision
      - burning, dry, or itching eyes
      - chest pain or discomfort
      - chest tightness or heaviness
      - chills
      - cough
      - diarrhea
      - difficulty breathing
      - discharge, excessive tearing
      - fast, irregular, pounding, or racing heartbeat or pulse
      - itching
      - joint or muscle pain
      - noisy breathing
      - red skin lesions, often with a purple center
      - sensitivity of the eye to light
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - tearing
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Drainage from the eyes
      - longer and thicker eyelashes
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Eyelash discoloration
      - feeling of having something in the eye
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Darkening of the eyelid skin color
      - dizziness
      - headache
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
