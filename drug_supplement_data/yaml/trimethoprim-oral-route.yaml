title: Trimethoprim (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Primsol
    - type: paragraph
      text: Proloprim
    - type: paragraph
      text: Trimpex
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Trimethoprim is used to treat infections of the urinary tract. It may also
      be used for other problems as determined by your doctor. It will not work for
      colds, flu, or other virus infections.
  - type: paragraph
    text: Trimethoprim is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been used in a limited number of children 2 months of
        age or older, and tested in children 12 years of age or older. In effective
        doses, the medicine has not been shown to cause different side effects or
        problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Elderly people may be more sensitive to the effects of trimethoprim. Blood
        problems may be more likely to occur in elderly patients who are taking diuretics
        (water pills) along with this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Dofetilide
      - Levomethadyl
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acecainide
      - Ajmaline
      - Amiloride
      - Amiodarone
      - Amitriptyline
      - Amoxapine
      - Aprindine
      - Arsenic Trioxide
      - Astemizole
      - Azathioprine
      - Azilsartan
      - Azilsartan Medoxomil
      - Azimilide
      - Benazepril
      - Bretylium
      - Candesartan Cilexetil
      - Captopril
      - Chloral Hydrate
      - Chloroquine
      - Chlorpromazine
      - Cholera Vaccine, Live
      - Clarithromycin
      - Cyclosporine
      - Desipramine
      - Dibenzepin
      - Digoxin
      - Disopyramide
      - Dolasetron
      - Doxepin
      - Dronedarone
      - Droperidol
      - Enalapril
      - Enalaprilat
      - Enflurane
      - Eplerenone
      - Eprosartan
      - Erythromycin
      - Exenatide
      - Flecainide
      - Fluconazole
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Amantadine
      - Anisindione
      - Didanosine
      - Repaglinide
      - Rosiglitazone
      - Tolbutamide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia—Patients with anemia may have an increased chance of side effects affecting
        the blood
    - type: list
      ordered: false
      items:
      - Kidney disease—Patients with kidney disease may have an increased chance of
        side effects
    - type: list
      ordered: false
      items:
      - Liver disease—Patients with liver disease may have an increased chance of
        side effects
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Do not give this medicine to infants or children under 12 years of age unless
      otherwise directed by your doctor.
  - type: paragraph
    text: Trimethoprim may be taken on an empty stomach or, if it upsets your stomach,
      it may be taken with food.
  - type: paragraph
    text: To help clear up your infection completely, keep taking this medicine for
      the full time of treatment even if you begin to feel better after a few days.
      If you stop taking this medicine too soon, your symptoms may return.
  - type: paragraph
    text: This medicine works best when there is a constant amount in the body. To
      help keep the amount constant, do not miss any doses. Also, it is best to take
      the doses at evenly spaced times day and night. For example, if you are to take
      2 doses a day, the doses should be spaced about 12 hours apart. If this interferes
      with your sleep or other daily activities, or if you need help in planning the
      best times to take your medicine, check with your health care professional.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For the treatment of urinary tract infections : Adults and children 12 years
        of age and older: 100 milligrams every twelve hours for ten days, or 200 milligrams
        once a day for ten days. Children up to 12 years of age: Dose must be determined
        by the doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults and children 12 years of age and older: 100 milligrams every twelve
        hours for ten days, or 200 milligrams once a day for ten days.'
      - 'Children up to 12 years of age: Dose must be determined by the doctor.'
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits if
      you will be taking this medicine for a long time. This will allow your doctor
      to check for any unwanted effects that may be caused by this medicine.
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: If this medicine causes anemia, your doctor may want you to take folic acid
      (a vitamin) every day to help clear up the anemia. If so, it is important to
      take folic acid every day along with this medicine; do not miss any doses.
  - type: paragraph
    text: Trimethoprim may cause blood problems. These problems may result in a greater
      chance of certain infections, slow healing, and bleeding of the gums. Therefore,
      you should be careful when using regular toothbrushes, dental floss, and toothpicks.
      Dental work should be delayed until your blood counts have returned to normal.
      Check with your medical doctor or dentist if you have any questions about proper
      oral hygiene (mouth care) during treatment.
  - type: paragraph
    text: 'Some people who take trimethoprim may become more sensitive to sunlight
      than they are normally. Exposure to sunlight, even for brief periods of time,
      may cause severe sunburn or skin rash, redness, itching, or discoloration. When
      you begin taking this medicine:'
  - type: list
    ordered: false
    items:
    - Stay out of direct sunlight, especially between the hours of 10:00 a.m. and
      3:00 p.m., if possible.
    - Apply a sun block product that has a skin protection factor (SPF) of at least
      15. Some patients may require a product with a higher SPF number, especially
      if they have a fair complexion. If you have any questions about this, check
      with your health care professional.
    - Do not use a sunlamp or tanning bed or booth.
  - type: paragraph
    text: If you have a severe reaction from the sun, check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin rash or itching
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blood in urine or stools
      - bluish fingernails, lips, or skin
      - changes in facial skin color
      - chills
      - difficult breathing or shortness of breath
      - fever with or without chills
      - general feeling of discomfort or illness
      - headache
      - joint or muscle pain
      - nausea
      - neck stiffness
      - pale skin
      - pinpoint red spots on skin
      - redness, blistering, burning, tenderness, peeling, or loosening of skin or
        mucous membranes
      - redness, swelling, or soreness of tongue
      - red skin lesions, often with a purple center
      - sore throat
      - swelling
      - thickened or scaly skin
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - loss of appetite
      - nausea or vomiting
      - stomach cramps or pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
