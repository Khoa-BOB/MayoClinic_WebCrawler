title: Mupirocin (nasal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Bactroban
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Mupirocin nasal ointment is used to treat or prevent infections in the nose
      due to certain strains of Staphylococcus aureus bacteria. This medicine works
      by killing bacteria or preventing their growth.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Ointment
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of mupirocin nasal ointment in children. Safety has not been
        established in children younger than 12 years of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of mupirocin nasal ointment in the geriatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diarrhea—Use with caution. May make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine only as directed by your
      doctor . Do not use more of it, do not use it more often, and do not use it
      for a longer time than your doctor ordered. This medicine is not for long-term
      use .
  - type: paragraph
    text: This medicine is for use only in the nose . Do not get any of it in your
      eyes or on your skin. If it does get on these areas, rinse well with water right
      away.
  - type: paragraph
    text: To help clear up your skin infection completely, keep using mupirocin for
      the full time of treatment , even if your symptoms have disappeared. Do not
      miss any doses.
  - type: paragraph
    text: To use the nasal ointment
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and water before and after using this medicine.
    - Apply approximately 1/2 of the ointment from the single-use tube directly from
      the tube into one nostril. Then apply the remainder of the ointment directly
      into the other nostril.
    - Close your nostrils by pressing the sides of the nose together and then releasing
      them. Do this over and over again for approximately 1 minute. You may also press
      the sides of the nose together and gently massage the nose. These will help
      spread the medicine throughout the inside of the nostrils.
    - Throw away the tube after each use.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For nasal dosage form (ointment): For Staphylococcus aureus ("staph") infections
        in the nose: Adults and children 12 years of age and older—Apply approximately
        1/2 of the ointment from a single-use tube squeezed into each nostril two
        times a day (morning and evening) for 5 days. Children younger than 12 years
        of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For Staphylococcus aureus ("staph") infections in the nose: Adults and children
        12 years of age and older—Apply approximately 1/2 of the ointment from a single-use
        tube squeezed into each nostril two times a day (morning and evening) for
        5 days. Children younger than 12 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—Apply approximately 1/2 of the
        ointment from a single-use tube squeezed into each nostril two times a day
        (morning and evening) for 5 days.
      - Children younger than 12 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Do not refrigerate.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your nasal infection does not improve or if it becomes worse, check with
      your doctor.
  - type: paragraph
    text: This medicine may cause diarrhea, and in some cases it can be severe. It
      may occur 2 months or more after you stop using this medicine. Do not take any
      medicine to treat diarrhea without first checking with your doctor. If you have
      any questions or if mild diarrhea continues or gets worse, check with your doctor.
  - type: paragraph
    text: Do not use any other medicine in your nose without first checking with your
      doctor.
  - type: paragraph
    text: If severe irritation occurs in your nose, stop using this medicine and tell
      your doctor right away.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody nose
      - rash
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach tenderness
      - cough
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - fever
      - hives or welts, itching, or skin rash
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness of the skin
      - severe abdominal or stomach cramps and pain
      - tightness in the chest
      - unusual tiredness or weakness
      - watery and severe diarrhea, which may also be bloody
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - ear pain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning or stinging in the nose
      - change in taste
      - itching
      - sore throat
      - stuffy or runny nose
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
