      - Asenapine
      - Astemizole
      - Atazanavir
      - Azathioprine
      - Azithromycin
      - Bedaquiline
      - Buprenorphine
      - Buserelin
      - Ceritinib
      - Chloroquine
      - Chlorpromazine
      - Cholera Vaccine
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
