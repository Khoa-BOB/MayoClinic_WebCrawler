    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Docetaxel
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Congestive heart failure or
      - Heart attack, recent or
      - Heart disease, unstable or
      - Hypertension (high blood pressure) or
      - Liver disease (eg, hepatitis) or
      - Stomach or bowel perforation (tear or hole) or
      - Thyroid problems—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Electrolyte imbalance (eg, high or low calcium, magnesium, or potassium levels
        in the blood) or
      - Heart rhythm problems (eg, QT prolongation, slow heartbeat)—Use with caution.
        May increase risk for more serious side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before using this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the tablet whole with water. Do not crush, break, or chew it.
  - type: paragraph
    text: Take the tablet on an empty stomach, at least 1 hour before or 2 hours after
      a meal.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For kidney, liver, or thyroid cancer: Adults—400
        milligrams (mg) 2 times a day. Your doctor may adjust your dose as needed
        and tolerated. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For kidney, liver, or thyroid cancer: Adults—400 milligrams (mg) 2 times
        a day. Your doctor may adjust your dose as needed and tolerated. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—400 milligrams (mg) 2 times a day. Your doctor may adjust your dose
        as needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. It
      may also cause birth defects if the father is using it when his sexual partner
      becomes pregnant. Female patients should use effective birth control during
      treatment with this medicine and for at least 6 months after the last dose.
      Male patients who have female partners should use effective birth control during
      treatment with this medicine and for at least 3 months after the last dose.
      If you think you have become pregnant while using this medicine, tell your doctor
      right away.
  - type: paragraph
    text: 'Your blood pressure should be checked weekly, especially during the first
      6 weeks after starting this medicine. Your doctor may need to treat you if you
      develop high blood pressure while you are using this medicine. Symptoms of high
      blood pressure include: blurred vision, dizziness, nervousness, headache, pounding
      in the ears, or a slow or fast heartbeat.'
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Check with your doctor
      right away if you have redness, blistering, peeling, or loosening of the skin,
      red skin lesions, redness, pain, swelling, or blisters on the palms of your
      hands or soles of your feet, severe acne or skin rash, sores or ulcers on the
      skin, or fever or chills while you are using this medicine.
  - type: paragraph
    text: This medicine may cause serious heart problems, including heart failure
      or heart attack. Check with your doctor right away if you are having chest pain
      or discomfort, nausea, pain or discomfort in your arms, jaw, back, or neck,
      troubled breathing, sweating, or vomiting.
  - type: paragraph
    text: Check with your doctor right away if you have severe burning, cramps, or
      pain in the stomach area, bloody or black, tarry stools, trouble breathing,
      heartburn, indigestion, nausea, or vomiting of material that looks like coffee
      grounds. These could be symptoms of a serious bowel problem.
  - type: paragraph
    text: This medicine may increase your chance of bleeding and cause a delay in
      wound healing. To help with this problem, stay away from rough sports or other
      situations where you could be bruised, cut, or injured. Brush and floss your
      teeth gently. Be careful when using sharp objects, including razors and fingernail
      clippers.
  - type: paragraph
    text: This medicine can cause changes in your heart rhythm, such as a condition
      called QT prolongation. It may change the way your heart beats and cause fainting
      or serious side effects in some patients. Call your doctor right away if you
      have any symptoms of heart rhythm problems, such as a fast, pounding, or irregular
      heartbeat.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver condition
      called hepatitis.
  - type: paragraph
    text: If you plan to have children, talk with your doctor before using this medicine.
      Some men using this medicine have become infertile (unable to have children).
  - type: paragraph
    text: Make sure any doctor who treats you knows that you are using this medicine.
      You may need to stop using this medicine several days before having surgery.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are using this medicine. The results of some tests may be affected by this
      medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
