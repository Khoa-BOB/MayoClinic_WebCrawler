      - unpleasant breath odor
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - weight gain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - diarrhea
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - red skin lesions, often with a purple center
      - red, irritated eyes
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, tingling, numbness or pain in the hands, arms, feet, or legs
      - numbness, pain, tingling, or unusual sensations in palms of the hands or bottom
        of the feet
      - sensation of pins and needles
      - stabbing pain
      - thinning of the hair
      - weight loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acne
      - belching
      - burning, itching, and pain in hairy areas
      - cracked lips
      - cracks in the skin
      - decreased appetite
      - decreased interest in sexual intercourse
      - discouragement
      - dry mouth
      - feeling of warmth
      - feeling sad or empty
      - flushing or red skin
      - gas
      - general feeling of discomfort or illness
      - heartburn
      - inability to have or keep an erection
      - irritability
      - lack or loss of strength
      - loss in sexual ability, desire, drive, or performance
      - loss of heat from the body
      - loss of interest or pleasure
      - mouth pain
      - pus at the root of the hair
      - red face, neck, arms, and occasionally, upper chest
      - red, swollen skin
      - runny nose
      - scaly skin
      - sunken eyes
      - swelling of the breasts or breast soreness in both men and women
      - swelling or inflammation of the mouth
      - tenderness in the stomach area
      - thirst
      - trouble concentrating
      - trouble sleeping
      - unusually warm skin
      - wrinkled skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
