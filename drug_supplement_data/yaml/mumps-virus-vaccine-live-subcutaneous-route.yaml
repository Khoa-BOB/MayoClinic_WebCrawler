title: Mumps virus vaccine, live (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Mumpsvax
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Mumps Virus Vaccine Live is an active immunizing agent used to prevent infection
      by the mumps virus. It works by causing your body to produce its own protection
      (antibodies) against the virus infection.
  - type: paragraph
    text: Mumps is an infection that can cause serious problems, such as encephalitis
      and meningitis, which affect the brain. In addition, adolescent boys and men
      are very susceptible to a condition called orchitis, which causes pain and swelling
      in the testicles and scrotum and, in rare cases, sterility. Also, mumps infection
      can cause spontaneous abortion in women during the first 3 months of pregnancy.
  - type: paragraph
    text: Immunization against mumps is recommended for all persons 12 months of age
      or older.
  - type: paragraph
    text: Immunization against mumps is not recommended for infants less than 12 months
      of age, because antibodies they received from their mothers before birth may
      interfere with the effectiveness of the vaccine. Children who were immunized
      against mumps before 12 months of age should be immunized again.
  - type: paragraph
    text: 'You can be considered to be immune to mumps only if you:'
  - type: list
    ordered: false
    items:
    - received mumps vaccine on or after your first birthday and have the medical
      record to prove it, or
    - have a doctor's diagnosis of a previous mumps infection, or
    - have had a laboratory test that shows that you are immune to mumps.
  - type: paragraph
    text: This vaccine is to be administered only by or under the supervision of your
      doctor or other health care professional.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use is not recommended for infants up to 12 months of age. Children who
        received the vaccine when less than 12 months of age should receive another
        dose of the vaccine at 12 months of age.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is not recommended.
        Your doctor may decide not to use this vaccine or change some of the other
        medicines you take.
    - type: list
      ordered: false
      items:
      - Abarelix
      - Abemaciclib
      - Abiraterone
      - Acalabrutinib
      - Adagrasib
      - Ado-Trastuzumab Emtansine
      - Afamitresgene Autoleucel
      - Afatinib
