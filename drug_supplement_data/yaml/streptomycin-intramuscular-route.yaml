title: Streptomycin (intramuscular route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Streptomycin injection is used to treat moderate to severe bacterial infections
      in many different parts of the body.
  - type: paragraph
    text: Streptomycin belongs to the class of medicines known as aminoglycoside antibiotics.
      It works by killing bacteria or preventing their growth. However, this medicine
      will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: Streptomycin injection is usually used for serious bacterial infections
      for which other medicines may not work. However, it may also cause some serious
      side effects, including damage to your hearing and sense of balance. These side
      effects may be more likely to occur in elderly patients and newborn infants.
      You and your doctor should talk about the benefits of this medicine as well
      as the risks .
  - type: paragraph
    text: This medicine is to be administered only by or under the immediate supervision
      of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of streptomycin injection in children.
        However, this medicine should be used with caution in young infants.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of streptomycin injection in geriatric patients. However, elderly patients
        are more likely to have kidney problems, which may require caution and an
        adjustment in the dose for patients receiving streptomycin injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Ataluren
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alcuronium
      - Ascorbic Acid
      - Aspirin
      - Atracurium
      - Bumetanide
      - Cholera Vaccine, Live
      - Cidofovir
      - Cisatracurium
      - Colistimethate Sodium
      - Decamethonium
      - Doxacurium
      - Emtricitabine
      - Ethacrynic Acid
      - Fazadinium
      - Foscarnet
      - Furosemide
      - Gallamine
      - Hexafluorenium
      - LetibotulinumtoxinA-wlbg
      - Lysine
      - Metocurine
      - Mivacurium
      - Pancuronium
      - Pipecuronium
      - Rapacuronium
      - Rocuronium
      - Succinylcholine
      - Tacrolimus
      - Teicoplanin
      - Tenofovir Alafenamide
      - Tubocurarine
      - Vancomycin
      - Vecuronium
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease (e.g., prerenal azotemia)—Higher blood levels of streptomycin
        may result, which increases the risk of serious side effects.
    - type: list
      ordered: false
      items:
      - Hearing problems or
      - Muscle problems or
      - Nerve problems—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given as a shot into one of your muscles (usually in the buttocks,
      middle thighs, or upper arms).
  - type: paragraph
    text: To help clear up your infection completely, keep using this medicine for
      the full time of treatment , even if you begin to feel better after a few days.
      Also, this medicine works best when there is a constant amount in the blood.
      To help keep the amount constant, you must receive this medicine on a regular
      schedule.
  - type: paragraph
    text: To keep your kidneys working well and help prevent kidney problems, drink
      extra fluids so you will pass more urine while you are receiving this medicine.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your progress closely while you or your child are
      receiving this medicine . This will allow your doctor to see if the medicine
      is working properly and to decide if you or your child should continue to receive
      it. Blood, urine, nerve, and hearing tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: You will need to see your doctor after finishing this medicine to make sure
      your infection is gone. You may also need to see your doctor again in four months
      to have a repeat blood test done for other infections such as syphilis.
  - type: paragraph
    text: If your or your child's symptoms do not improve within a few days, or if
      they become worse, check with your doctor.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you or your child have itching; hives; hoarseness;
      shortness of breath; trouble breathing; trouble swallowing; or any swelling
      of your hands, face, or mouth after you receive this medicine.
  - type: paragraph
    text: High doses of streptomycin injection may cause serious reactions (e.g.,
      syndrome of CNS depression) for a young infant. Infants should not receive a
      dose of this medicine that is higher than the recommended dose.
  - type: paragraph
    text: Stop using this medicine and check with your doctor right away if you or
      your child have sudden decrease in hearing or loss of hearing, which may be
      accompanied by dizziness and ringing in the ears . Tell your doctor if you or
      your child have dizziness or lightheadedness; feeling of constant movement of
      self or surroundings; or sensation of spinning. These may be symptoms of damage
      to your hearing or sense of balance.
  - type: paragraph
    text: Make sure your doctor knows that you or your child are using this medicine
      before having a surgery or other procedures that require you to receive a numbing
      medicine (e.g., anesthetics, neuromuscular blocking agents). Using streptomycin
      injection together with numbing medicines may increase your risk of having difficulty
      in breathing, drowsiness, inability to breath without assistance, or unusual
      tiredness or weakness.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chest pain
      - chills
      - clumsiness
      - cough
      - dizziness or lightheadedness
      - feeling of constant movement of self or surroundings
      - fever
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - nausea
      - painful or difficult urination
      - sensation of spinning
      - shortness of breath
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swollen glands
      - unsteadiness
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back, leg, or stomach pains
      - bleeding gums
      - bloody or cloudy urine
      - blurred vision
      - change in vision
      - dark urine
      - deafness
      - difficulty with breathing
      - difficulty with swallowing
      - dry mouth
      - fast heartbeat
      - general body swelling
      - headache
      - hives
      - impaired vision
      - itching
      - loss of appetite
      - muscle weakness
      - nosebleeds
      - pain in lower back or side
      - pale skin
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - skin rash
      - thirst
      - tightness in the chest
      - wheezing
      - yellowing of the eyes or skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in the frequency of urination or amount of urine
      - drowsiness
      - increased thirst
      - swelling of the feet or lower legs
      - weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hives or welts
      - redness of the skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Impaired vision
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
