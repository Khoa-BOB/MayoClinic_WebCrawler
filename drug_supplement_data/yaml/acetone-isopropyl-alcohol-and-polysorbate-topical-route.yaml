title: Acetone, isopropyl alcohol, and polysorbate (topical route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Alcohol and acetone combination is used to clean oily or greasy skin associated
      with acne or other oily skin conditions.
  - type: paragraph
    text: This medicine is available without a prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine should not be used on children up to 8 years of age. In
        older children, although there is no specific information comparing use of
        alcohol and acetone with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older children than it does
        in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been tested in older people. Therefore, it may
        not be known whether they work exactly the same way they do in younger adults.
        Although there is no specific information comparing use of alcohol and acetone
        in the elderly with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Burns or wounds—Alcohol and acetone combination may cause severe irritation
        if applied to burns or wounds.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Keep this medicine away from the eyes, the inside of the nose, and the lips
      .
  - type: paragraph
    text: This medicine is flammable. Do not use near heat, near open flame, or while
      smoking.
  - type: paragraph
    text: 'To use the lotion form of this medicine:'
  - type: list
    ordered: false
    items:
    - Put a small amount of this medicine on a gauze pad or cotton ball and apply
      by wiping or rubbing over the face and other affected areas to remove dirt and
      surface oil.
  - type: paragraph
    text: 'To use the pledget form of this medicine:'
  - type: list
    ordered: false
    items:
    - Apply by wiping or rubbing over the face and other affected areas to remove
      dirt and surface oil.
  - type: paragraph
    text: After applying this medicine, do not rinse the affected areas with water,
      since this will remove the medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage forms (detergent lotion or pledgets): For acne or oily
        skin: Adults and children 8 years of age and older—Apply to the affected area(s)
        of the skin two to four times a day as needed. Children up to 8 years of age—Use
        is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For acne or oily skin: Adults and children 8 years of age and older—Apply
        to the affected area(s) of the skin two to four times a day as needed. Children
        up to 8 years of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children 8 years of age and older—Apply to the affected area(s)
        of the skin two to four times a day as needed.
      - Children up to 8 years of age—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: 'When using alcohol and acetone combination, do not use any of the following
      preparations on the same affected area, unless otherwise directed by your doctor:'
  - type: list
    ordered: false
    items:
    - Abrasive soaps or cleaners
    - Any other topical acne preparation or preparation containing a peeling agent
      (for example, benzoyl peroxide, resorcinol, salicylic acid, sulfur, or tretinoin
      [vitamin A acid])
    - Cosmetics or soaps that dry the skin
    - Medicated cosmetics
    - Other alcohol-containing preparations
    - Other topical medicine for the skin
  - type: paragraph
    text: To use any of the above preparations on the same affected area as this medicine
      may cause severe irritation of the skin
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  - type: list
    ordered: false
    items:
    - Irritation, pain, redness, or swelling of skin
    - skin infection
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  - type: list
    ordered: false
    items:
    - Burning or stinging of skin
  - type: paragraph
    text: Other side effects not listed may also occur in some patients. If you notice
      any other effects, check with your healthcare professional.
  - type: paragraph
    text: Call your doctor for medical advice about side effects. You may report side
      effects to the FDA at 1-800-FDA-1088.
