title: Copper (intrauterine route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Miudella
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Intrauterine copper contraceptive is a device that contains the copper.
      It is placed in the uterus where it slowly releases the hormone to prevent pregnancy
      for up to 3 years for Miudella® and 10 years for Paragard® . It works by stopping
      a woman's egg from fully developing each month. The egg can no longer accept
      a sperm and fertilization (pregnancy) is prevented.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
      Miudella® is available only under a restricted distribution program called the
      Miudella® REMS (Risk Evaluation and Mitigation Strategy) program.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Device
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of intrauterine copper contraceptive
        in teenage females. This medicine may be used for birth control in teenage
        females but is not recommended before the start of menstruation.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of intrauterine
        copper contraceptive have not been performed in the geriatric population.
        This medicine is not recommended for use in elderly women.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Abnormal or unusual vaginal bleeding or
      - Abnormally-shaped uterus or uterine fibroids or
      - Cancer of the uterus or cervix, known or suspected or
      - Genital tract infections (eg, bacterial vaginosis, cervicitis, endometritis,
        vaginitis), acute and untreated or
      - IUD that has not been removed, previous or
      - Pelvic infection (active or untreated), history of or
      - Pelvic inflammatory disease (a serious pelvic infection) or endometritis,
        or history of or
      - Wilson's disease (disorder in how the body handles copper)—Should not be used
        in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Bradycardia (slow heartbeat) or
      - Dizziness or
      - Infection (eg, HIV or AIDS) or
      - Seizures—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Post-coital contraception—Should not be used as emergency contraception.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your doctor will give you this medicine in a hospital or clinic. This intrauterine
      device (IUD) is inserted into your uterus.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: It is very important that you understand the requirements of the Miudella®
      REMS program, and become familiar with the Miudella® patient information leaflet.
      Read and follow these instructions carefully. Ask your doctor if you have any
      questions. Ask your pharmacist for the medication guide if you do not have one.
  - type: paragraph
    text: Your doctor may want to do tests to make sure you do not have an infection
      before putting in an IUD. The IUD is usually inserted during your monthly period,
      immediately after a miscarriage or an abortion in the first trimester of your
      pregnancy, or after giving birth.
  - type: paragraph
    text: 'Your IUD has a thread. You cannot see this string, and it will not cause
      problems when you have sex. Check your IUD after each monthly period. You may
      not be protected against pregnancy if you cannot feel the thread Do the following
      to check the placement of your IUD:'
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and warm water.
    - Check by reaching up to the top of your vagina with clean fingers to feel the
      2 threads. Never pull on the string.
  - type: paragraph
    text: You will need to have your device replaced every 3 years for Miudella® and
      10 years for Paragard® , or sooner if it comes out of your uterus unexpectedly.
  - type: paragraph
    text: If you are using Miudella® and want to stop, your doctor can remove it at
      any time. However, you may become pregnant as soon as it is removed. Use another
      form of birth control (eg, condoms, spermicides) at least 7 days before removal
      to keep from getting pregnant.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and does not cause unwanted effects.
  - type: paragraph
    text: There is a small chance that you could get pregnant when using an IUD, just
      as there is with any birth control. If you get pregnant, your doctor may remove
      your IUD to lower the risk of miscarriage or other problems.
  - type: paragraph
    text: Call your doctor right away if you think you have become pregnant while
      you are using this medicine. You may have a higher risk of an ectopic pregnancy
      (occurs outside the uterus) if you get pregnant while your IUD is in place.
      This can be a serious and life-threatening condition. It can also cause problems
      that may make it harder for you to become pregnant in the future.
  - type: paragraph
    text: An IUD can slip partly or all the way out of your uterus without you knowing.
      If this happens, you will have no protection against getting pregnant or you
      may have an increased risk for serious problems. This is more likely during
      the first year that you have your IUD, but it can happen at any time. Regularly
      checking the string of your IUD can tell you if it is still in place.
  - type: paragraph
    text: Using this device can increase your risk for severe infections, including
      sepsis. This is a rare and life-threatening condition that requires immediate
      medical attention. Talk to your doctor if you have concerns about this risk.
  - type: paragraph
    text: An IUD can increase your risk of having a serious infection of the female
      organs, called pelvic inflammatory disease (PID) or endometritis, which can
      be serious, even life threatening. This infection could cause scarring of the
      female organs, which may make it hard for you to become pregnant in the future,
      and can increase your risk of ectopic pregnancy.
  - type: paragraph
    text: Call your doctor right away if you have flu-like symptoms, fever, chills,
      cramps, pain, bleeding, or fluid leaking from your vagina. These may be signs
      of an infection.
  - type: paragraph
    text: This medicine may cause perforation (hole in the wall of your uterus), embedment
      (attached to the wall of the uterus), or expulsion (partially or completely
      fall out of the uterus) which can damage other organs. Check with your doctor
      right away if you have excessive pain, vaginal bleeding, pain or bleeding that
      gets worse after inserting the IUD, or not being able to feel the threads of
      the IUD.
  - type: paragraph
    text: You may have heavier and longer periods with spotting in between. Check
      with your doctor right away if it still continues.
  - type: paragraph
    text: You could have less bleeding or even stop having periods by the end of the
      first year. Call your doctor if you have a change from your regular bleeding
      pattern after you have had your IUD for awhile, including more bleeding or if
      you miss a period (and you were having periods even with your IUD).
  - type: paragraph
    text: You may have dizziness, slow heart rate, or seizures immediately after placing
      or removing Paragard®. Tell your doctor if you had these conditions before.
  - type: paragraph
    text: This device will not protect you from getting HIV/AIDS, herpes, or other
      sexually transmitted diseases. Tell your doctor if you or your partner begins
      to have sexual intercourse with other people, or you or your partner tests positive
      for a sexually transmitted disease. If this is a concern for you, talk with
      your doctor.
  - type: paragraph
    text: It is important to tell your doctor that you are using this medicine before
      you have a medical procedure, such as magnetic resonance imaging or MRI.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Absent, missed, or irregular menstrual periods
      - blistering, peeling, or loosening of the skin
      - chills
      - confusion
      - cough
      - diarrhea
      - difficulty in breathing or swallowing
      - dizziness, lightheadedness
      - dull or aching stomach pain
      - fainting
      - fast heartbeat
      - fast ,weak pulse
      - fever
      - foul-smelling vaginal discharge
      - full or bloated feeling
      - increased urge to urinate
      - joint or muscle pain
      - pale, cold clammy skin
      - pressure in the stomach
      - rapid, shallow breathing
      - red irritated eyes
      - red skin lesions, often with a purple center
      - shivering
      - skin itching, rash, or redness
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach cramps
      - stopping of menstrual bleeding
      - sudden increase in stomach or shoulder pain
      - sweating
      - swelling of the face, throat, or tongue
      - swelling of the stomach area
      - unusual or large amount of vaginal bleeding
      - unusual tiredness or weakness
      - unusual vaginal bleeding
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Muscle spasms
      - nausea
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
