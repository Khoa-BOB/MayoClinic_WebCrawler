    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (severe chest pain), unstable or
      - Heart attack, recent or
      - Heart disease (eg, cardiomyopathy) or
      - Heart rhythm problems (eg, prolonged QT, uncontrolled arrhythmia), history
        of or
      - Hypocalcemia (low calcium in the blood) or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood) or
      - Hyponatremia (low sodium level in the blood) or
      - Withdrawal from alcohol or benzodiazepines—May increase risk for seizures,
        arrhythmia, or kidney problems.
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Dehydration or
      - Fainting, history of or
      - Inflammatory bowel disease or
      - Kidney problems or
      - Seizures, history of or
      - Stomach or bowel blockage or perforation or
      - Trouble swallowing or
      - Ulcerative colitis, active and severe—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Fluid and electrolyte imbalance—Use with caution. These conditions may increase
        risk for more side effects and must be corrected first before using this medicine.
    - type: list
      ordered: false
      items:
      - Gastric retention (problems with emptying of food or fluid from the stomach)
        or
      - Kidney disease, severe or
      - Stomach or bowel problems (eg, blockage, ileus, perforation) or
      - Toxic colitis or megacolon (a very dilated intestine)—Should not be used in
        patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease, mild to moderate—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. You
      must read, understand, and follow these instructions carefully. Ask your doctor
      if you have any questions.
  - type: paragraph
    text: 'You may take this medicine in two dosing regimens: Split-Dose dosing regimen
      and Day-Before dosing regimen. Your doctor will tell you how to take this medicine
      depending on your colonoscopy schedule, distance traveled, and other personal
      circumstances .'
  - type: paragraph
    text: You may drink clear liquid (eg, black coffee or tea without milk, cream,
      soy, or nondairy creamer, clear broth or bouillon, clear juices without pulp,
      frozen juice bars, ginger ale, other sodas, plain gelatin, plain or flavored
      water, sports drinks) up until 2 hours before your colonoscopy. Do not drink
      red or purple liquids.
  - type: paragraph
    text: Do not eat solid foods or drink alcohol, dairy, drinks, juices with pulp,
      soy milk, or any drinks, gelatin, or other liquids that are red or purple a
      day before your colonoscopy.
  - type: paragraph
    text: 'To use Clenpiq® :'
  - type: list
    ordered: false
    items:
    - This medicine is available in a ready-to-drink bottle and is equal to one dose.
      You will need two doses of this medicine. Drink all of this medicine straight
      from the bottle.
    - Drink five or more 8 ounce cups of clear liquids after the first dose of this
      medicine and drink four or more 8 ounce cups after the second dose.
    - You may have bloating or an upset stomach before the loose stools start.
  - type: paragraph
    text: 'To use Prepopik® :'
  - type: list
    ordered: false
    items:
    - One dose of this medicine consists of 2 packets of powder. Each packet is mixed
      with cold water (5 ounces) for 2 to 3 minutes and taken at separate dosing times.
      Drink the liquid right away after mixing. Do not prepare the solution in advance.
    - Do not take the powder directly without mixing it with cold water. Doing so,
      may increase risk of side effects.
    - Use the supplied medicine cup when preparing the solution.
    - Drink at least five 8 ounce cups of clear liquids over the next 5 hours after
      the first dose and drink at least three 8 ounce cups of clear liquids 2 hours
      before your colonoscopy after the second dose.
    - You may have bloating or an upset stomach before the loose stools start.
  - type: paragraph
    text: Avoid taking other laxatives while you are taking this medicine.
  - type: paragraph
    text: Do not take any medicine by mouth within 1 hour before using citric acid,
      magnesium oxide, and sodium picosulfate combination . Oral medicines may not
      be absorbed completely.
  - type: paragraph
    text: Take chlorpromazine, digoxin, iron supplement, penicillamine, or antibiotics
      (eg, fluoroquinolone, tetracycline) at least 2 hours before or not less than
      6 hours after taking this medicine.
  - type: paragraph
    text: Do not drink anything at least 2 hours before the colonoscopy.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For cleansing of the colon: For oral dosage form (powder for solution): Adults
        and children 9 years of age and older—Your doctor will prescribe your dosing
        regimen to be taken the day or night before your colonoscopy. Split-dose dosing
        regimen: Take your first packet the night before colonoscopy, and the second
        dose the next day, in the morning or at least 5 hours before your colonoscopy.
        Day-Before dosing regimen: Take your first packet in the afternoon or early
        evening, and the second dose at least 6 hours after the first dose, the night
        before colonoscopy. Children younger than 9 years of age—Use and dose must
        be determined by your doctor. For oral dosage form (solution): Adults and
        children 9 years of age and older—Your doctor will prescribe your dosing regimen
        to be taken the day or night before your colonoscopy. Split-dose dosing regimen:
        Take your first bottle the night before colonoscopy, and the second dose the
        next day, in the morning or at least 5 hours before your colonoscopy. Day-Before
        dosing regimen: Take your first bottle in the afternoon or early evening,
        and the second dose at least 6 hours after the first dose, the night before
        colonoscopy. Children younger than 9 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
