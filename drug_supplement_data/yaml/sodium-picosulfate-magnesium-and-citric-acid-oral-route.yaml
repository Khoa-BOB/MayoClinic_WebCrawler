    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Do not refrigerate or freeze Clenpiq® or the mixed Prepopik® .
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your or your child's progress closely
      for any problems or unwanted effects that may be caused by this medicine. Blood
      and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Contact your doctor right away if you or your child have decreased urination,
      dizziness, headache, or vomiting. These could be symptoms of a loss of too much
      body fluid (dehydration).
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you had a heart rhythm problem, including
      QT prolongation.
  - type: paragraph
    text: This medicine may increase your risk for seizures. This is more likely to
      occur if you take medicine for depression, if you are withdrawing from alcohol
      or benzodiazepine use, or if you have low sodium level in the blood (hyponatremia).
      Talk to your doctor if you have any concerns.
  - type: paragraph
    text: If you or your child have severe bloating, distension, or abdominal or stomach
      pain after taking the first dose, stop taking this medicine or delay taking
      the second dose until your symptoms improve.
  - type: paragraph
    text: This medicine may cause serious stomach or bowel problems (eg, colon ulcers,
      ischemic colitis). Check with your doctor right away if you have stomach pain
      and tenderness, bloody stools, or rectal bleeding.
  - type: paragraph
    text: Fainting may occur during treatment with this medicine, which may increase
      risk of falls, head injuries, and fractures. Your doctor may ask you to drink
      more clear liquids.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding of the rectum
      - bloody stools
      - chest tightness
      - confusion
      - cough
      - decreased urine output
      - diarrhea
      - dizziness or fainting
      - dry mouth
      - fast, slow, or irregular heartbeat
      - fever
      - headache
      - hives, itching, skin rash
      - increased thirst
      - jerking or shaking of the muscles
      - joint pain, stiffness, or swelling
      - loss of bowel control
      - loss of consciousness
      - muscle pain or cramps
      - nausea
      - numbness or tingling in the hands, feet, or lips
      - pinpoint red or purple spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - seizures
      - stomach pain and tenderness
      - swelling of the eyelids, face, lips, ankles, hands, or feet
      - trouble breathing or swallowing
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain in the rectum
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
