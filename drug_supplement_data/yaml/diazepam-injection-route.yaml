      - Nomegestrol
      - Norethindrone
      - Norgestimate
      - Norgestrel
      - Quinupristin
      - Rifapentine
      - Roxithromycin
      - St John's Wort
      - Theophylline
      - Troleandomycin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol intoxication or
      - Glaucoma, acute narrow-angle or
      - Loss of consciousness (coma) or
      - Shock—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Alcohol or drug abuse or dependence, or history of—Dependence on diazepam
        injection may develop.
    - type: list
      ordered: false
      items:
      - Breathing problems or lung disease or
      - Heart or blood vessel disease or
      - Hypotension (low blood pressure) or
      - Muscle weakness—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given through a needle placed in one of your veins or as a
      shot into one of your muscles.
  - type: paragraph
    text: After you receive a shot of this medicine, your doctor will watch you closely
      to make sure it is working properly and to check for unwanted effects.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child at regular visits to see if the medicine is working properly. Blood tests
      may be needed to check for any unwanted effects.
  - type: paragraph
    text: Tell your doctor if you are pregnant or planning to become pregnant. Using
      this medicine during the later pregnancy may cause problems in your newborn
      baby (eg, sedation or withdrawal symptoms). Tell your doctor right away if your
      baby has an abnormal sleep pattern, diarrhea, feeding problems, a high-pitched
      cry, irritability, low muscle tone, restlessness, shakiness or tremors, sluggishness,
      trouble breathing, weight loss, vomiting, or fails to gain weight. If you think
      you have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause dizziness or drowsiness, or trouble with thinking.
      Do not drive or do anything else that could be dangerous until you know how
      this medicine affects you .
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other central nervous
      system (CNS) depressants. CNS depressants are medicines that slow down the nervous
      system, which may cause drowsiness or make you less alert. Some examples of
      CNS depressants are antihistamines or medicine for hay fever, allergies, or
      colds, sedatives, tranquilizers, or sleeping medicine, prescription pain medicine
      or narcotics, barbiturates (used for seizures), muscle relaxants, or anesthetics
      (numbing medicines), including some dental anesthetics. This effect may last
      for a few days after you or your child stop taking this medicine. Check with
      your doctor before taking any of the above while you or your child are using
      this medicine .
  - type: paragraph
    text: 'Symptoms of an overdose include: change or loss of consciousness, confusion,
      dizziness, faintness, or lightheadedness when getting up suddenly from a lying
      or sitting position, irregular, fast or slow, or shallow breathing, lack of
      coordination, loss of strength or energy, muscle pain or weakness, pale or blue
      lips, fingernails, or skin, shakiness and unsteady walk, unsteadiness, trembling,
      or other problems with muscle control or coordination, sweating, trouble breathing,
      unusual drowsiness, dullness, tiredness, weakness or feeling of sluggishness,
      or unusual weak feeling . Call your doctor right away if you notice these symptoms.'
  - type: paragraph
    text: This medicine may cause respiratory depression (serious breathing problem
      that can be life-threatening), especially when used with narcotic pain medicines.
      Tell your doctor if you are using any narcotic medicine.
  - type: paragraph
    text: Do not stop taking it without checking with your doctor first . Your doctor
      may want you or your child to gradually reduce the amount you are using before
      stopping it completely. This may help prevent a worsening of your condition
      and reduce the possibility of withdrawal symptoms, including hallucinations,
      seizures, stomach or muscle cramps, tremors, or unusual behavior.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Shakiness and unsteady walk
      - tenderness, pain, swelling, warmth, skin discoloration, and prominent superficial
        veins over affected area
      - unsteadiness, trembling, or other problems with muscle control or coordination
    subsections: []
  - heading: Less common
