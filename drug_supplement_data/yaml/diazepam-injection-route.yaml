      - Carisoprodol
      - Carphenazine
      - Cetirizine
      - Chloral Hydrate
      - Chlordiazepoxide
      - Chlorpromazine
      - Chlorzoxazone
      - Clarithromycin
      - Clobazam
      - Clomipramine
      - Clonazepam
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Amitriptyline
      - Amprenavir
      - Dalfopristin
      - Desogestrel
      - Dienogest
      - Disulfiram
      - Drospirenone
      - Erythromycin
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Fluoxetine
      - Gestodene
      - Ginkgo
      - Levonorgestrel
