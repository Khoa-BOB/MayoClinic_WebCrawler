title: Diazepam (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Valium
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Diazepam injection is used to relieve symptoms of anxiety and alcohol withdrawal.
      It is also used to relieve anxiety before surgery or certain procedures. When
      diazepam is used before surgery, the patient will not remember some of the details
      about the procedure.
  - type: paragraph
    text: Diazepam injection is also used to treat seizures, including status epilepticus.
      It may also be used to help relax muscle or relieve muscle spasms.
  - type: paragraph
    text: Diazepam injection is a benzodiazepine. Benzodiazepines belong to the group
      of medicines called central nervous system (CNS) depressants, which are medicines
      that slow down the nervous system.
  - type: paragraph
    text: This medicine is given only by or under the direct supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of diazepam injection in newborn babies (30 days of age and
        younger). Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of diazepam injection in the elderly.
        However, elderly patients are more likely to have trouble breathing, heart
        attack, or age-related liver, kidney, heart, or lung problems, which may require
        caution and an adjustment in the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Flumazenil
      - Isocarboxazid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Acepromazine
      - Alfentanil
      - Alprazolam
      - Amobarbital
      - Anileridine
      - Apalutamide
      - Aprepitant
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Asenapine
      - Avacopan
      - Baclofen
      - Benperidol
      - Benzhydrocodone
      - Bromazepam
      - Bromopride
      - Buprenorphine
      - Buspirone
      - Butabarbital
      - Butalbital
      - Butorphanol
      - Calcifediol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
