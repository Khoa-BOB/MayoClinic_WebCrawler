title: Vidarabine (ophthalmic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Vira-A
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Vidarabine ophthalmic preparations are used to treat virus infections of
      the eye.
  - type: paragraph
    text: Vidarabine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of vidarabine
        in children with use in other age groups, it is not expected to cause different
        side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of vidarabine in the elderly
        with use in other age groups.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: 'To use:'
  - type: list
    ordered: false
    items:
    - First, wash your hands. Then pull the lower eyelid away from the eye to form
      a pouch. Squeeze a thin strip of ointment into the pouch. A 1.25-cm (approximately
      ½-inch) strip of ointment is usually enough unless otherwise directed by your
      doctor. Gently close the eyes and keep them closed for 1 or 2 minutes to allow
      the medicine to come into contact with the infection.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). After using vidarabine eye ointment, wipe
      the tip of the ointment tube with a clean tissue and keep the tube tightly closed.
  - type: paragraph
    text: Do not use this medicine more often or for a longer time than your doctor
      ordered. To do so may cause problems in the eyes. If you have any questions
      about this, check with your doctor.
  - type: paragraph
    text: To help clear up your infection completely, keep using this medicine for
      the full time of treatment, even if your symptoms have disappeared. Do not miss
      any doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic ointment dosage forms: For virus eye infection: Adults and
        children—Use in each eye every three hours (five times a day). After healing
        has occurred, the dose may be reduced to two times a day for seven days more.'
    - type: list
      ordered: false
      items:
      - 'For virus eye infection: Adults and children—Use in each eye every three
        hours (five times a day). After healing has occurred, the dose may be reduced
        to two times a day for seven days more.'
    - type: list
      ordered: false
      items:
      - Adults and children—Use in each eye every three hours (five times a day).
        After healing has occurred, the dose may be reduced to two times a day for
        seven days more.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: After application, eye ointments usually cause your vision to blur for a
      few minutes.
  - type: paragraph
    text: It is very important that you keep your appointments with your doctor. If
      your symptoms become worse, check with your doctor sooner.
  - type: paragraph
    text: This medicine may cause your eyes to become more sensitive to light than
      they are normally. Wearing sunglasses and avoiding too much exposure to bright
      light may help lessen the discomfort.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  - type: list
    ordered: false
    items:
    - Increased sensitivity of eyes to light
    - itching, redness, swelling, pain, burning, or other sign of irritation not present
      before use of this medicine
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  - type: list
    ordered: false
    items:
    - Excess flow of tears
    - feeling of something in the eye
  - type: paragraph
    text: Other side effects not listed may also occur in some patients. If you notice
      any other effects, check with your healthcare professional.
  - type: paragraph
    text: Call your doctor for medical advice about side effects. You may report side
      effects to the FDA at 1-800-FDA-1088.
