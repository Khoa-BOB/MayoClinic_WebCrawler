title: Sevoflurane (inhalation route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Sojourn
    - type: paragraph
      text: Ultane
    - type: paragraph
