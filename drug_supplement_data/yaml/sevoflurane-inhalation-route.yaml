    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Inhaled sevoflurane is used to cause general anesthesia (loss of consciousness)
      before and during surgery. It belongs to the group of medicines known as general
      anesthetics.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Liquid
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of inhaled sevoflurane in children.
        However, children are more likely to have unwanted side effects, including
        brain or nerve problems or heart problems, which may require caution in patients
        receiving this medicine.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of inhaled sevoflurane in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Isocarboxazid
      - Levoketoconazole
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adagrasib
      - Alfentanil
      - Alfuzosin
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Anagrelide
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Atracurium
      - Azithromycin
      - Bedaquiline
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Ceritinib
      - Chloroquine
      - Chlorpromazine
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
      - Crizotinib
      - Cyclobenzaprine
      - Dabrafenib
      - Dasatinib
      - Degarelix
      - Delamanid
      - Desflurane
      - Desipramine
      - Deslorelin
      - Deutetrabenazine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Alcuronium
      - Doxacurium
      - Metocurine
      - Mivacurium
      - Pipecuronium
      - Rocuronium
      - Tubocurarine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Down syndrome—Use with caution. May cause serious heart problems (eg, slow
        heartbeat, cardiac arrest) in patients with this condition.
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease or
      - Heart rhythm problems or
      - Hyperkalemia (high potassium in the blood) or
      - Hypotension (low blood pressure) or
      - Hypovolemia (low blood volume) or
      - Kidney disease or
      - Liver disease or
      - Lung or breathing problems (eg, respiratory depression)—Use with caution.
        May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Hereditary problems (eg, high risk for malignant hyperthermia)—Should not
        be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine
      in a hospital. You will inhale the medicine through a mask placed over your
      mouth and nose.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check you closely after receiving this medicine . This
      will allow your doctor to see if the medicine is working properly. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Hyperkalemia may occur rarely after receiving this medicine. Tell your doctor
      right away if you have confusion, irregular heartbeat, nausea or vomiting, numbness
      or tingling in the hands, feet, or legs, or trouble breathing after receiving
      this medicine.
  - type: paragraph
    text: This medicine may cause malignant hyperthermia (high body temperature).
      Check with your doctor right away if you have fast heartbeat, high fever, or
      rigid muscles.
  - type: paragraph
    text: Check with your doctor right away if you have black, tarry stools, chills,
      dark urine, dizziness, fever, general tiredness or weakness, headache, itching,
      light-colored stools, loss of appetite, nausea and vomiting, upper right stomach
      pain, vomiting of blood, or yellow eyes and skin. These may be symptoms of a
      serious liver problem.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you had a heart rhythm problem, including
      QT prolongation.
  - type: paragraph
    text: This medicine may cause severe bradycardia (slow heartbeat) in patients
      with Down syndrome. Check with your doctor right away if you or your child has
      chest pain or discomfort, lightheadedness, dizziness, or fainting, slow or irregular
      heartbeat, trouble breathing, or unusual tiredness.
  - type: paragraph
    text: General anesthetics may cause some people to feel drowsy, tired, or weak.
      They may also cause problems with coordination and one's ability to think. Therefore,
      after receiving a general anesthetic, do not drive, use machines, or do anything
      else that could be dangerous if you are not alert .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain, tightness, or discomfort
      - choking
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fast, pounding, or irregular heartbeat or pulse
      - lightheadedness, dizziness, or fainting
      - slow or irregular heartbeat
      - sweating
      - trouble breathing
      - unable to speak
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Low body temperature
      - not breathing
      - pale or blue lips, fingernails, or skin
      - weak or feeble pulse
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - blood in the urine or stools
      - body aches or pain
      - chills
      - cough
      - coughing up blood
      - decrease in frequency of urination
      - decrease in urine volume
      - difficulty in swallowing
      - difficulty in passing urine (dribbling)
      - extremely shallow or slow breathing
      - eye pain
      - fainting
      - general feeling of illness
      - headache
      - hoarseness
      - increased menstrual flow or vaginal bleeding
      - nausea
      - noisy breathing
      - nosebleeds
      - painful urination
      - paralysis
      - pinpoint red spots on skin
      - prolonged bleeding from cuts
      - red or dark brown urine
      - red or black, tarry stools
      - sore throat
      - stuffy or runny nose
      - tender, swollen glands in the neck
      - trouble in swallowing
      - unusual bleeding or bruising
      - voice changes
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion as to time, place, or person
      - dark urine
      - hallucinations
      - high fever
      - hives, itching, or skin rash
      - holding false beliefs that cannot be changed by fact
      - increased blood pressure
      - increased thirst
      - light-colored stools
      - lower back or side pain
      - no blood pressure or pulse
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - restlessness
      - rigid muscles
      - seizures
      - shakiness
      - sleepiness
      - slow to respond
      - slurred speech
      - stomach pain, continuing
      - stopping of the heart
      - swelling of the face, fingers, lower legs
      - unconsciousness
      - unpleasant breath odor
      - unusual excitement, nervousness, or restlessness
      - upper right abdominal or stomach pain
      - vomiting of blood
      - yellow eyes and skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Shivering
      - sleepiness or unusual drowsiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Clumsiness
      - problems with movement
      - watering of the mouth
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, dry, or itching eyes
      - change in vision
      - discharge, excessive tearing
      - hiccups
      - impaired vision
      - lack or loss of strength
      - redness, pain, swelling of the eye, eyelid, or inner lining of eyelid
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
