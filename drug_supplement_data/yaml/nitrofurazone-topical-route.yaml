title: Nitrofurazone (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Furacin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Nitrofurazone is used to treat burns that have become infected. It is also
      used to treat skin infections due to skin grafts. It works by killing bacteria
      or preventing their growth.
  - type: paragraph
    text: Nitrofurazone may be applied directly to the skin or placed on a gauze pad
      that will cover the skin.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of nitrofurazone in children with
        use in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of nitrofurazone in the elderly
        with use in other age groups.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease—Certain ingredients (polyethylene glycols) in the topical solution
        and the soluble dressing may be absorbed through the skin and may not be eliminated
        from the body normally in patients with kidney function impairment, which
        may increase the chance of side effects. Nitrofurazone cream does not contain
        polyethylene glycol.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Apply sufficient medication to affected area or place medication on gauze
      and cover the affected area.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For cream dosage form: Burns or skin infections: Adults—Apply directly to
        the lesion, or place on gauze that will cover the lesion, once daily or every
        few days, depending on the usual dressing technique of the affected area.
        Children—Use and dose must be determined by your doctor.'
      - 'For soluble dressing dosage form: Burns or skin infections: Adults—Apply
        directly to the lesion or place on gauze that will cover the lesion, depending
        on the usual dressing technique of the affected area. Children—Use and dose
        must be determined by your doctor.'
      - 'For topical solution dosage form: Burns: Adults—Apply directly to the burn.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'Burns or skin infections: Adults—Apply directly to the lesion, or place on
        gauze that will cover the lesion, once daily or every few days, depending
        on the usual dressing technique of the affected area. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply directly to the lesion, or place on gauze that will cover the
        lesion, once daily or every few days, depending on the usual dressing technique
        of the affected area.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'Burns or skin infections: Adults—Apply directly to the lesion or place on
        gauze that will cover the lesion, depending on the usual dressing technique
        of the affected area. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply directly to the lesion or place on gauze that will cover the
        lesion, depending on the usual dressing technique of the affected area.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'Burns: Adults—Apply directly to the burn. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply directly to the burn.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Keep away from alkaline materials, such as soap and ammonia.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your burn or skin infection does not improve, or if it becomes worse,
      check with your health care professional.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Itching
      - rash
      - swelling
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
