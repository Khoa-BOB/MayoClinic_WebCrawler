title: Mafenide (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Sulfamylon
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Mafenide, a sulfa medicine, is used to prevent and treat bacterial or fungus
      infections. It works by preventing growth of the fungus or bacteria.
  - type: paragraph
    text: Mafenide cream is applied to the skin and/or burned area(s) to prevent and
      treat bacterial or fungus infections that may occur in burns.
  - type: paragraph
    text: Other medicines are used along with this medicine for burns. Patients with
      severe burns or burns over a large area of the body must be treated in a hospital.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Cream
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use of mafenide is not recommended in premature or newborn infants up
        to 2 months of age. Sulfa medicines may cause liver problems in these infants.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been tested in older people. Therefore, it may
        not be known whether they work exactly the same way they do in younger adults
        or if they cause different side effects or problems in older people. There
        is no specific information comparing use of mafenide in the elderly with use
        in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Methenamine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Articaine
      - Insulin Aspart, Recombinant
      - Lidocaine
      - Methotrexate
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aminolevulinic Acid
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood problems—Use of mafenide may make the condition worse.
    - type: list
      ordered: false
      items:
      - Glucose-6-phosphate dehydrogenase deficiency (lack of G6PD enzyme)—Use of
        mafenide in persons with this condition may result in hemolytic anemia.
    - type: list
      ordered: false
      items:
      - Kidney problems or
      - Lung problems or
      - Metabolic acidosis—Use of mafenide in persons with any of these conditions
        may increase the risk of a side effect called metabolic acidosis.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: 'To use:'
  - type: list
    ordered: false
    items:
    - Before applying this medicine, cleanse the affected area(s). Remove dead or
      burned skin and other debris.
    - Wear a sterile glove to apply this medicine. For the topical creak, apply a
      thin layer (about 1/16 inch) of mafenide to the affected area(s). For the topical
      solution, the solution is applied to the dressing covering the affected area(s).
      Keep the affected area(s) covered with the medicine at all times.
    - If this medicine is rubbed off the affected area(s) by moving around or if it
      is washed off during bathing, showering, or the use of a whirlpool bath, reapply
      the medicine.
    - After this medicine has been applied, the treated area(s) may be covered with
      a dressing or left uncovered as desired.
  - type: paragraph
    text: To help clear up your skin and/or burn infection completely, keep using
      mafenide for the full time of treatment. You should keep using this medicine
      until the burn area has healed or is ready for skin grafting. Do not miss any
      doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (cream): For bacterial or fungus infection: Adults
        and children 2 months of age and over—Use one or two times a day. Infants
        and children up to 2 months of age—Use is not recommended.'
      - 'For topical dosage form (solution): For bacterial or fungus infection: Adults
        and children 3 months of age and over—Use every 4 to 8 hours each day as needed
        to keep the dressing wet. Infants and children up to 3 months of age—Use is
        not recommended.'
    - type: list
      ordered: false
      items:
      - 'For bacterial or fungus infection: Adults and children 2 months of age and
        over—Use one or two times a day. Infants and children up to 2 months of age—Use
        is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children 2 months of age and over—Use one or two times a day.
      - Infants and children up to 2 months of age—Use is not recommended.
    - type: list
      ordered: false
      items:
      - 'For bacterial or fungus infection: Adults and children 3 months of age and
        over—Use every 4 to 8 hours each day as needed to keep the dressing wet. Infants
        and children up to 3 months of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children 3 months of age and over—Use every 4 to 8 hours each day
        as needed to keep the dressing wet.
      - Infants and children up to 3 months of age—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits.
  - type: paragraph
    text: If your skin infection or burn does not improve within a few days or if
      your more serious burns or burns over larger areas do not improve within a few
      weeks, or if they become worse, check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Itching
      - skin rash or redness
      - swelling of face or skin
      - wheezing or troubled breathing
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding or oozing of skin
      - drowsiness
      - fast, deep breathing
      - nausea
    subsections: []
  - heading: Incidence unknown
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chest pain
      - chills
      - cough or hoarseness
      - dark urine
      - dizziness
      - fever
      - fluid-filled skin blisters
      - light-colored stools
      - lower back or side pain
      - numbness to feet, hands and around mouth
      - painful or difficult urination
      - rapid shallow breathing
      - sensitivity to the sun
      - shortness of breath
      - skin thinness
      - sore throat
      - sores, ulcers, or white spots on lips or in mouth
      - swollen glands
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain or burning feeling on treated area(s)
    subsections: []
  - heading: Incidence unknown
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blisters
      - flushing
      - raised red swellings on the skin, lips, tongue, or in the throat
      - redness of skin
      - skin rash
      - softening of the skin
      - swelling
      - unusually warm skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
