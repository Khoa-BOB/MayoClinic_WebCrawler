title: Galantamine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Razadyne
    - type: paragraph
      text: Razadyne ER
    - type: paragraph
      text: Razadyne IR
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Galantamine is used to treat mild to moderate dementia (memory loss and
      mental changes) that is a sign of Alzheimer's disease. Galantamine will not
      cure Alzheimer's disease, and it will not stop the disease from getting worse.
      However, galantamine can improve the thinking ability in some patients with
      Alzheimer's disease.
  - type: paragraph
    text: In Alzheimer's disease, many chemical changes take place in the brain. One
      of the earliest and biggest changes is that there is less of a chemical called
      acetylcholine (ACh). ACh helps the brain to work properly. Galantamine slows
      the breakdown of ACh, so it can build up and have a greater effect. However,
      as Alzheimer's disease gets worse, there will be less and less ACh, so galantamine
      may not work as well.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
    - Capsule, Extended Release
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of galantamine in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of galantamine in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Levoketoconazole
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adagrasib
      - Amiodarone
      - Amisulpride
      - Anagrelide
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Atazanavir
      - Azithromycin
      - Bedaquiline
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Ceritinib
      - Chloroquine
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
      - Crizotinib
      - Cyclobenzaprine
      - Dabrafenib
      - Dasatinib
      - Degarelix
      - Delamanid
      - Desflurane
      - Deslorelin
      - Deutetrabenazine
      - Dexmedetomidine
      - Domperidone
      - Donepezil
      - Dordaviprone
      - Doxepin
      - Efavirenz
      - Encorafenib
      - Entrectinib
      - Escitalopram
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Amitriptyline
      - Fluvoxamine
      - Oxybutynin
      - Quinidine
      - Tolterodine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma (severe), history of or
      - Lung disease (eg, obstructive pulmonary disease) or
      - Seizures or
      - Stomach bleeding or ulcers, or history of or
      - Urinary bladder blockage—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Heart rhythm problems—May increase risk for more serious side effects.
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate or
      - Liver disease, moderate—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease, severe—Use is not recommended in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Stomach blockage or
      - Stomach or bowel surgery, recent—Use is not recommended in patients with these
        conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: 'If you are taking the extended-release capsules :'
  - type: list
    ordered: false
    items:
    - Take it with your morning meal.
    - Swallow the extended-release capsule whole. Do not crush, break, or chew it.
  - type: paragraph
    text: 'If you are taking the oral liquid :'
  - type: list
    ordered: false
    items:
    - Follow the instruction sheet for the proper dosing of the oral liquid. Ask your
      doctor or pharmacist if you have any questions.
    - Measure your dose with a marked measuring spoon, oral syringe, or medicine cup.
      The average household teaspoon may not hold the right amount of liquid.
  - type: paragraph
    text: Take the oral liquid or tablets with morning or evening meals.
  - type: paragraph
    text: Drink extra fluids so you will pass more urine while you are using this
      medicine. This may help prevent kidney problems.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For treatment of Alzheimer''s disease: For oral dosage form (extended-release
        capsules): Adults—At first, 8 milligrams (mg) once a day with food. Your doctor
        may increase your dose to 16 mg per day after at least 4 weeks, and then to
        24 mg per day after at least another 4 weeks. Children—Use and dose must be
        determined by your doctor. For oral dosage forms (oral solution or tablets):
        Adults—At first, 4 milligrams (mg) two times a day. Your doctor may increase
        your dose to 8 mg two times a day after at least of 4 weeks, and then to 12
        mg two times a day after at least 4 weeks. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release capsules): Adults—At first, 8 milligrams
        (mg) once a day with food. Your doctor may increase your dose to 16 mg per
        day after at least 4 weeks, and then to 24 mg per day after at least another
        4 weeks. Children—Use and dose must be determined by your doctor.'
      - 'For oral dosage forms (oral solution or tablets): Adults—At first, 4 milligrams
        (mg) two times a day. Your doctor may increase your dose to 8 mg two times
        a day after at least of 4 weeks, and then to 12 mg two times a day after at
        least 4 weeks. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 8 milligrams (mg) once a day with food. Your doctor may increase
        your dose to 16 mg per day after at least 4 weeks, and then to 24 mg per day
        after at least another 4 weeks.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—At first, 4 milligrams (mg) two times a day. Your doctor may increase
        your dose to 8 mg two times a day after at least of 4 weeks, and then to 12
        mg two times a day after at least 4 weeks.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you missed your dose for more than 3 days, call your doctor right away.
        You may need to go back to a lower dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to check for unwanted effects.
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Check with your doctor
      right away if you have blistering, peeling, or loose skin, red skin lesions,
      severe acne or skin rash, sores or ulcers on the skin, or fever or chills while
      you are using this medicine.
  - type: paragraph
    text: Galantamine may cause stomach or bowel problems. Check with your doctor
      right away if you have nausea, vomiting, diarrhea, stomach pain, loss of appetite,
      or weight loss.
  - type: paragraph
    text: If you think you or someone else may have taken an overdose of galantamine,
      get emergency help at once. Taking an overdose of galantamine may lead to convulsions
      (seizures) or shock. Some signs of shock are large pupils, irregular breathing,
      and fast weak pulse. Other signs of an overdose are severe nausea and vomiting,
      increasing muscle weakness, greatly increased sweating, and greatly increased
      watering of the mouth.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes nonprescription medicines, such as aspirin, and medicines
      for appetite control, asthma, colds, cough, hay fever, or sinus problems.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or discomfort
      - lightheadedness, dizziness, or fainting
      - shakiness in the legs, arms, hands, or feet
      - shortness of breath
      - slow or irregular heartbeat
      - unusual tiredness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - decreased urination
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dry mouth
      - fainting
      - fast, irregular, pounding, or racing heartbeat or pulse
      - feeling of warmth
      - rapid breathing
      - redness of the face, neck, arms, and occasionally, upper chest
      - sunken eyes
      - sweating
      - thirst
      - troubled breathing
      - unusual tiredness or weakness
      - wrinkled skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - chills
      - cough
      - dark urine
      - fever
      - general tiredness and weakness
      - headache
      - hoarseness
      - irritation
      - joint pain, stiffness, or swelling
      - light-colored stools
      - nausea and vomiting
      - nervousness
      - pounding in the ears
      - rash, hives, or itching skin
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - redness of the skin
      - swelling of the eyelids, face, lips, hands, or feet
      - tightness in the chest
      - troubled swallowing
      - upper right abdominal or stomach pain
      - yellow eyes and skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - convulsions
      - irregular, fast or slow, or shallow breathing
      - muscle weakness
      - pale or blue lips, fingernails, or skin
      - severe nausea
      - stomach cramps
      - sweating
      - tearing of the eyes
      - twitches of the muscle visible under the skin
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased appetite
      - weight loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - discouragement
      - feeling sad or empty
      - general feeling of discomfort or illness
      - heartburn
      - increased sweating
      - indigestion
      - irritability
      - lack of appetite
      - lack or loss of strength
      - loss of interest or pleasure
      - muscle spasms
      - stomach discomfort, upset, or pain
      - trouble concentrating
      - trouble sleeping
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - change in taste
      - dry heaves
      - loss of taste
      - unusually deep sleep
      - unusually long duration of sleep
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Continuing ringing or buzzing or other unexplained noise in the ears
      - hearing loss
      - seeing, hearing, or feeling things that are not there
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
