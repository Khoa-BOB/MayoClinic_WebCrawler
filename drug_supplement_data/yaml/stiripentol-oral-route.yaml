title: Stiripentol (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Diacomit
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Stiripentol is used with clobazam to treat seizures in patients with Dravet
      syndrome.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of stiripentol in children 6 months
        of age and older and weighing 7 kilograms (kg) or more. Safety and efficacy
        have not been established in children younger than 6 months of age or weighing
        less than 7 kg.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of stiripentol in the elderly. However,
        elderly patients are more likely to have age-related liver or kidney problems,
        which may require caution for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amlodipine
      - Belzutifan
      - Brexpiprazole
      - Calcifediol
      - Cannabidiol
      - Carbamazepine
      - Citalopram
      - Dihydroergotamine
      - Dordaviprone
      - Enzalutamide
      - Fenfluramine
      - Fosphenytoin
      - Hydroxychloroquine
      - Lumacaftor
      - Mavacamten
      - Methadone
      - Mitotane
      - Orlistat
      - Phenytoin
      - Pimozide
      - Remibrutinib
      - Rifampin
      - Rilzabrutinib
      - Selumetinib
      - St John's Wort
      - Voriconazole
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Clopidogrel
      - Ginkgo
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate to severe or
      - Liver disease, moderate to severe—Use is not recommended.
    - type: list
      ordered: false
      items:
      - Phenylketonuria (PKU)—The oral liquid contains phenylalanine, which can make
        this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow these instructions carefully. Ask your doctor or pharmacist if you
      have any questions.
  - type: paragraph
    text: Swallow the capsule whole with a glass of water during a meal. Do not break
      or open it.
  - type: paragraph
    text: Mix the powder for suspension with a glass of water (100 mL) and drink it
      right away during a meal. Add a small amount of water (25 mL) to the drinking
      glass and drink all of the mixture to make sure there is no medicine left in
      the glass.
  - type: paragraph
    text: Stiripentol is used together with another seizure medicine (clobazam). Keep
      using all of your medicines unless your doctor tells you to stop.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules or powder for suspension): For seizures:
        Adults—Dose is based on body weight and must be determined by your doctor.
        The dose is 50 milligrams (mg) per kilogram (kg) of body weight per day given
        in 2 or 3 divided doses. Your doctor may adjust your dose as needed. However,
        the dose is usually not more than 3000 mg per day. Children 1 year of age
        and older—Dose is based on body weight and must be determined by your doctor.
        Weighing 10 kilograms (kg) or more—50 milligrams (mg) per kilogram (kg) of
        body weight per day given in 2 or 3 divided doses. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 3000 mg per
        day. Weighing 7 kg to less than 10 kg—50 mg per kg of body weight per day
        given in 2 divided doses. Children 6 months to less than 1 year of age weighing
        7 kilograms (kg) or more—Dose is based on body weight and must be determined
        by your doctor. The dose is 50 mg per kg of body weight per day given in 2
        divided doses. Children younger than 6 months of age or weighing less than
        7 kg—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For seizures: Adults—Dose is based on body weight and must be determined
        by your doctor. The dose is 50 milligrams (mg) per kilogram (kg) of body weight
        per day given in 2 or 3 divided doses. Your doctor may adjust your dose as
        needed. However, the dose is usually not more than 3000 mg per day. Children
        1 year of age and older—Dose is based on body weight and must be determined
        by your doctor. Weighing 10 kilograms (kg) or more—50 milligrams (mg) per
        kilogram (kg) of body weight per day given in 2 or 3 divided doses. Your doctor
        may adjust your dose as needed. However, the dose is usually not more than
        3000 mg per day. Weighing 7 kg to less than 10 kg—50 mg per kg of body weight
        per day given in 2 divided doses. Children 6 months to less than 1 year of
        age weighing 7 kilograms (kg) or more—Dose is based on body weight and must
        be determined by your doctor. The dose is 50 mg per kg of body weight per
        day given in 2 divided doses. Children younger than 6 months of age or weighing
        less than 7 kg—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Dose is based on body weight and must be determined by your doctor.
        The dose is 50 milligrams (mg) per kilogram (kg) of body weight per day given
        in 2 or 3 divided doses. Your doctor may adjust your dose as needed. However,
        the dose is usually not more than 3000 mg per day.
      - Children 1 year of age and older—Dose is based on body weight and must be
        determined by your doctor. Weighing 10 kilograms (kg) or more—50 milligrams
        (mg) per kilogram (kg) of body weight per day given in 2 or 3 divided doses.
        Your doctor may adjust your dose as needed. However, the dose is usually not
        more than 3000 mg per day. Weighing 7 kg to less than 10 kg—50 mg per kg of
        body weight per day given in 2 divided doses.
      - Children 6 months to less than 1 year of age weighing 7 kilograms (kg) or
