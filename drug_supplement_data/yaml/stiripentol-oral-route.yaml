        dose is 50 mg per kg of body weight per day given in 2 divided doses.
      - Children younger than 6 months of age or weighing less than 7 kg—Use and dose
        must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Weighing 10 kilograms (kg) or more—50 milligrams (mg) per kilogram (kg) of
        body weight per day given in 2 or 3 divided doses. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 3000 mg per
        day.
      - Weighing 7 kg to less than 10 kg—50 mg per kg of body weight per day given
        in 2 divided doses.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the medicine in its original container. Do not store the mixed oral
        liquid . Take it right away after mixing.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood tests
      may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may make you or your child drowsy. Do not drive or do anything
      else that could be dangerous until you know how this medicine affects you .
  - type: paragraph
    text: Check with your doctor before using this medicine with alcohol or other
      medicines that affect the central nervous system (CNS) . The use of alcohol
      or other medicines that affect the CNS with stiripentol may worsen the side
      effects of this medicine, such as dizziness, poor concentration, drowsiness,
      unusual dreams, and trouble with sleeping. Some examples of medicines that affect
      the CNS are antihistamines or medicine for allergies or colds, sedatives, tranquilizers,
      or sleeping medicines, medicine for depression, medicine for anxiety, prescription
      pain medicine or narcotics, medicine for attention deficit and hyperactivity
      disorder, medicine for seizures or barbiturates, muscle relaxants, or anesthetics,
      including some dental anesthetics.
  - type: paragraph
    text: Stiripentol may lower the number of some types of blood cells in your body.
      Because of this, you may bleed or get infections more easily. To help with these
      problems, avoid being near people who are sick or have infections. Wash your
      hands often. Stay away from rough sports or other situations where you could
      be bruised, cut, or injured. Brush and floss your teeth gently. Be careful when
      using sharp objects, including razors and fingernail clippers.
  - type: paragraph
    text: Do not stop using this medicine without first checking with your doctor
      . Your doctor may want you to gradually reduce the amount you are using before
      stopping completely.
  - type: paragraph
    text: Stiripentol may cause some people to be agitated, irritable, or display
      other abnormal behaviors. It may also cause some people to have suicidal thoughts
      and tendencies or to become more depressed. Also tell your doctor if you or
      your child have sudden or strong feelings, such as feeling nervous, angry, restless,
      violent, or scared. If you or your caregiver notice any of these side effects,
      tell your doctor right away.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Aggression
      - anxiety
      - chest tightness
      - cough producing mucus
      - dry mouth
      - fever
      - headache
      - irregular heartbeat
      - irritability
      - loss of strength or energy
      - muscle pain or weakness
      - nervousness
      - restlessness
      - shakiness and unsteady walk
      - sleepiness or unusual drowsiness
      - slurred speech
      - sore throat
      - stuffy or runny nose
      - trouble breathing
      - trouble sleeping
      - trouble speaking
      - unsteadiness, trembling, or other problems with muscle control or coordination
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased appetite
      - increased watering of the mouth
      - nausea
      - vomiting
      - weight changes
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
