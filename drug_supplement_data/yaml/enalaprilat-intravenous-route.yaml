title: Enalaprilat (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Vasotec I.V.
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Enalaprilat injection is used to treat high blood pressure (hypertension).
      High blood pressure adds to the workload of the heart and arteries. If it continues
      for a long time, the heart and arteries may not function properly. This can
      damage the blood vessels of the brain, heart, and kidneys, resulting in a stroke,
      heart failure, or kidney failure. High blood pressure may also increase the
      risk of heart attacks. These problems may be less likely to occur if blood pressure
      is controlled .
  - type: paragraph
    text: Enalaprilat works by blocking an enzyme in the body that is necessary to
      produce a substance that causes blood vessels to tighten. As a result, the blood
      vessels relax. This lowers blood pressure and increases the supply of blood
      and oxygen to the heart .
  - type: paragraph
    text: This medicine is available only with your doctor's prescription .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of enalaprilat in the pediatric population. Safety and efficacy
        have not been established .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of enalaprilat in geriatric patients. However, elderly patients are more likely
        to have age-related kidney problems, which may require an adjustment of dose
        in patients receiving enalaprilat .
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Aliskiren
      - Sacubitril
      - Valsartan
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Allopurinol
      - Alteplase, Recombinant
      - Amiloride
      - Aspirin
      - Azathioprine
      - Azilsartan
      - Azilsartan Medoxomil
      - Candesartan
      - Canrenoate
      - Cyclosporine
      - Eplerenone
      - Eprosartan
      - Everolimus
      - Furosemide
      - Interferon Alfa-2a
      - Irbesartan
      - Levoketoconazole
      - Lithium
      - Losartan
      - Melphalan
      - Mercaptopurine
      - Methotrexate
      - Olmesartan
      - Oxypurinol
      - Potassium Citrate
      - Potassium Phosphate
      - Sirolimus
      - Spironolactone
      - Tacrolimus
      - Telmisartan
      - Temsirolimus
      - Triamterene
      - Trimethoprim
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aceclofenac
      - Acemetacin
      - Amtolmetin Guacil
      - Bromfenac
      - Bufexamac
      - Bumetanide
      - Bupivacaine
      - Bupivacaine Liposome
      - Capsaicin
      - Celecoxib
      - Choline Salicylate
      - Clomipramine
      - Clonixin
      - Dexibuprofen
      - Dexketoprofen
      - Diclofenac
      - Diflunisal
      - Dipyrone
      - Droxicam
      - Ethacrynic Acid
      - Etodolac
      - Etofenamate
      - Etoricoxib
      - Etozolin
      - Felbinac
      - Fenoprofen
      - Fepradinol
      - Feprazone
      - Floctafenine
      - Flufenamic Acid
      - Flurbiprofen
      - Gold Sodium Thiomalate
      - Ibuprofen
      - Indomethacin
      - Ketoprofen
      - Ketorolac
      - Lornoxicam
      - Loxoprofen
      - Lumiracoxib
      - Meclofenamate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angioedema, history of—May increase the risk of this condition occurring again
        .
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Diarrhea or
      - Heart failure or
      - Hyponatremia (low sodium in the blood) or
      - Kidney disease—These conditions may cause the blood pressure to fall too low
        with enalaprilat .
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium. Your doctor will tell you which of these are most important
      for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure but it
      does help control it. Therefore, you must continue to take it as directed if
      you expect to lower your blood pressure and keep it down. You may have to take
      high blood pressure medicine for the rest of your life . If high blood pressure
      is not treated, it can cause serious problems such as heart failure, blood vessel
      disease, stroke, or kidney disease.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and to check for unwanted effects
      .
  - type: paragraph
    text: Stop using this medicine and call your doctor right away if you have swelling
      of the face, arms, legs, eyes, lips, or tongue, or problems with swallowing
      or breathing. These are symptoms of a condition called angioedema .
  - type: paragraph
    text: You may experience lightheadedness during the first few days with this medicine.
      If this becomes severe and you faint, talk to your doctor right away .
  - type: paragraph
    text: Tell your doctor immediately if you have any signs of infection such as
      chills, sore throat, or fever. These may be symptoms of an immune system condition
      called neutropenia .
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you think you have become pregnant while using the medicine, tell your doctor
      right away .
  - type: paragraph
    text: Check with your doctor right away if you have symptoms of jaundice (yellow
      skin or eyes) because these may be signs of a serious liver condition .
  - type: paragraph
    text: This medicine may increase the amount of potassium in your blood. Do not
      use salt substitutes containing potassium without first checking with your doctor
      .
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery or medical tests .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - dizziness, faintness, or lightheadedness when getting up from a lying or sitting
        position suddenly
      - sweating
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or discomfort
      - nausea
      - pain or discomfort in arms, jaw, back or neck
      - shortness of breath
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty having a bowel movement (stool)
      - dizziness
      - fever
      - rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
