    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - food
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Chronic obstructive pulmonary disease (COPD) or
      - Edema (body swelling or fluid retention) or
      - Heart attack, history of or
      - Heart disease (eg, ischemic disease, valve problems) or
      - Heart rhythm problems or
      - High blood pressure—Use with caution. May increase the risk for more serious
        side effects.
    - type: list
      ordered: false
      items:
      - Congestive heart failure—Use with caution. Tolsura® may make this condition
        worse.
    - type: list
      ordered: false
      items:
      - Congestive heart failure or history of—Should not be used to treat fungal
        infection of the fingernails or toenails in patients with this condition.
    - type: list
      ordered: false
      items:
      - Cystic fibrosis or
      - Hypochlorhydria (low level of acid in the stomach) in HIV-infected patients
        or
      - Patients who have had an organ transplant—Absorption from the stomach may
        change.
    - type: list
      ordered: false
      items:
      - Elevated liver enzymes or
      - Kidney disease or
      - Liver disease, active or history of—Use with caution. May make these conditions
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you feel
      better after the first few doses. Your infection may not clear up if you stop
      using the medicine too soon.
  - type: paragraph
    text: Itraconazole capsules and tablets should be taken with a full meal. The
      oral liquid is best taken on an empty stomach.
  - type: paragraph
    text: Take the tablets at the same time each day.
  - type: paragraph
    text: Measure the oral liquid with a marked measuring spoon or medicine cup. If
      you have thrush in the mouth or throat, place 10 milliliters (mL) of the liquid
      in your mouth, swish for several seconds, then swallow. Repeat these steps if
      your total dose is more than 10 mL.
  - type: paragraph
    text: If you are using antacids (eg, Maalox®, Mylanta®, Pepcid® Complete, Rolaids®,
      or Tums®) or other stomach medicine (eg, H2 blocker, proton pump inhibitor),
      take them at least 2 hours before or 2 hours after using itraconazole. You may
      also take itraconazole with an acidic beverage (eg, non-diet cola) if you are
      taking it with an antacid.
  - type: paragraph
    text: Use only the brand and the dosage form of this medicine that your doctor
      prescribed. Different brands and dosage forms may not work the same way.
  - type: paragraph
    text: Sporanox® oral liquid works differently than itraconazole Sporanox® capsules
      , even at the same dose (number of milligrams). Do not switch from the capsules
      to the oral liquid unless your doctor tells you to .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For aspergillosis: Adults: Sporanox®—200
        to 400 milligrams (mg) per day. Tolsura®—130 mg (two capsules) once or 2 times
        a day. Children—Use and dose must be determined by your doctor. For blastomycosis
        or histoplasmosis: Adults: Sporanox®—200 milligrams (mg) (two capsules) once
        a day. Your doctor may increase your dose as needed. However, the dose is
        usually not more than 400 mg per day. Tolsura®—130 mg (two capsules) once
        a day. Your doctor may increase your dose as needed. However, the dose is
        usually not more than 260 mg per day. Children—Use and dose must be determined
        by your doctor. For onychomycosis of the fingernails: Adults—200 milligrams
        (mg) 2 times a day for 1 week, followed by a no treatment period of 3 weeks,
        then 200 mg 2 times a day for 1 week. Children—Use and dose must be determined
        by your doctor. For onychomycosis of the toenails: Adults—200 milligrams (mg)
        once a day for 12 weeks in a row. Children—Use and dose must be determined
        by your doctor.'
      - 'For oral dosage form (liquid): For esophageal candidiasis: Adults—100 milligrams
        (mg) or 10 milliliters (mL) once a day for a minimum of 3 weeks. Your doctor
        may increase your dose as needed. Children—Use and dose must be determined
        by your doctor. For oropharyngeal candidiasis: Adults—200 milligrams (mg)
        or 20 milliliters (mL) once a day for 1 to 2 weeks. Children—Use and dose
        must be determined by your doctor.'
      - 'For oral dosage form (tablets): For onychomycosis of the toenails: Adults—200
        milligrams (mg) once a day for 12 weeks in a row. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For aspergillosis: Adults: Sporanox®—200 to 400 milligrams (mg) per day.
        Tolsura®—130 mg (two capsules) once or 2 times a day. Children—Use and dose
        must be determined by your doctor.'
      - 'For blastomycosis or histoplasmosis: Adults: Sporanox®—200 milligrams (mg)
        (two capsules) once a day. Your doctor may increase your dose as needed. However,
        the dose is usually not more than 400 mg per day. Tolsura®—130 mg (two capsules)
        once a day. Your doctor may increase your dose as needed. However, the dose
        is usually not more than 260 mg per day. Children—Use and dose must be determined
