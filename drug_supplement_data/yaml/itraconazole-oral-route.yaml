    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: If your symptoms do not improve, or if they become worse, check with your
      doctor. You may need to take this medicine for several weeks or months before
      your infection gets better.
  - type: paragraph
    text: Do not use avanafil (Stendra™), cisapride (Propulsid®), disopyramide (Norpace®),
      dofetilide (Tikosyn®), dronedarone (Multaq®), eliglustat (Cerdelga™), eplerenone
      (Inspra®), felodipine (Plendil®), finerenone (Kerendia®), irinotecan (Camptosar®),
      isavuconazole (Cresemba®), ivabradine (Corlanor®), lomitapide (Juxtapid™), lurasidone
      (Latuda®), methadone (Dolophine®), naloxegol (Movantik®), nisoldipine (Sular®),
      oral midazolam (Versed®), pimozide (Orap®), quinidine (Cardioquin®, Quinaglute®),
      ranolazine (Ranexa®), ticagrelor (Brilinta®), triazolam (Halcion®), venetoclax
      (Venclexta®), voclosporin (Lupkynis®), an ergot medicine (eg, dihydroergotamine,
      ergometrine, ergotamine, methylergometrine, Cafergot®, Ergomar®, Wigraine®),
      or certain medicines to lower cholesterol (eg, lovastatin, simvastatin, Mevacor®,
      Zocor®) during and 2 weeks after treatment with itraconazole. Do not use colchicine
      (Colcrys®), fesoterodine (Toviaz®), solifenacin (Vesicare®), or telithromycin
      (Ketek®) during and 2 weeks after treatment with itraconazole, if you have kidney
      or liver disease. Using these medicines together may increase your risk for
      serious side effects .
  - type: paragraph
    text: Make sure your doctor knows if you are pregnant or planning to get pregnant
      before you start using this medicine for a fingernail or toenail infection.
      The capsule or tablet should not be used to treat onychomycosis in pregnant
      patients or those who are planning to get pregnant . Use a highly effective
      form of birth control while you are using this medicine and for 2 months after
      your last dose. If you think you have become pregnant while using the medicine,
      tell your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you are having chest pain or tightness,
      decreased urine output, dilated neck veins, extreme fatigue, irregular breathing,
      an irregular heartbeat, swelling of the face, fingers, feet, or lower legs,
      trouble breathing, or weight gain. These could be symptoms of congestive heart
      failure.
  - type: paragraph
    text: This medicine may cause pseudoaldosteronism, including symptoms of new or
      worsening high blood pressure and hypokalemia (low potassium in the blood).
      Check with your doctor right away if you have blurred vision, decreased urine
      output, dizziness, dry mouth, increased thirst, irregular heartbeat, loss of
      appetite, mood change, muscle pain or cramps, nausea or vomiting, nervousness,
      numbness or tingling in the hands, feet, or lips, pounding in the ears, seizures,
      slow or fast heartbeat, trouble breathing, or unusual tiredness or weakness.
  - type: paragraph
    text: Rarely, this medicine may cause severe liver problems. Check with your doctor
      right away if you have stomach pain or tenderness, clay-colored stools, dark
      urine, decreased appetite, fever, headache, itching, loss of appetite, nausea,
      vomiting, skin rash, swelling of the feet or lower legs, unusual tiredness or
      weakness, or yellow eyes or skin.
  - type: paragraph
    text: This medicine may cause nerve problems. Call your doctor right away if your
      skin feels like it is burning, crawling, itching, or if you have numbness, prickling,
      "pins and needles", or a tingling feeling after using itraconazole.
  - type: paragraph
    text: Temporary or permanent hearing loss may occur while you are using this medicine.
      Check with your doctor right away if you have any changes in your hearing.
  - type: paragraph
    text: This medicine may make you feel dizzy or have blurred or double vision.
      Do not drive or do anything else that could be dangerous until you know how
      this medicine affects you .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased urine output
      - dry mouth
      - fever
      - increased thirst
      - irregular heartbeat
      - loss of appetite
      - mood changes
      - muscle pain or cramps
      - nausea
      - numbness or tingling in the hands, feet, or lips
      - seizures
      - trouble breathing
      - unusual tiredness or weakness
      - vomiting
    subsections: []
