title: Ensifentrine (inhalation route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ohtuvayre
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ensifentrine is used to treat chronic obstructive pulmonary disease (COPD),
      including bronchitis and emphysema. This medicine helps improve and reduce the
      number of flare-ups of the symptoms of COPD.
  - type: paragraph
    text: Ensifentrine helps the muscles in the lungs stay relaxed and prevents wheezing,
      coughing, chest tightness, and trouble breathing. It helps decrease swelling
      in the lungs.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of ensifentrine in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of ensifentrine in the elderly. However,
        elderly patients are more sensitive to the effects of this medicine than younger
        adults
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased in patients with
        moderate or severe liver disease.
    - type: list
      ordered: false
      items:
      - Mental health problems (eg, depression, suicidal thoughts), history of—Use
        with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it
      and do not use it more often than your doctor ordered. Also, do not stop using
      this medicine without telling your doctor. To do so may increase the chance
      of side effects.
  - type: paragraph
    text: This medicine comes with patient information leaflet and patient instructions.
      Read the directions carefully before using this medicine. If you do not understand
      the directions or you are not sure how to use the nebulizer, ask your doctor
      for help. Also, ask your doctor to regularly check how you use the nebulizer
      to make sure you are using it properly.
  - type: paragraph
    text: 'To use this medicine:'
  - type: list
    ordered: false
    items:
    - Ensifentrine should be used with a standard jet nebulizer with a mouthpiece
      that is connected to an air compressor. An air compressor is used with a nebulizer
      to turn the medicine into a fine spray. You will breathe in the spray through
      your mouth.
    - This medicine comes in an ampule that is sealed in a foil pouch. Each ampule
      contains one full dose of ensifentrine. Do not mix it with other medicines.
    - Remove the ampule from the foil pouch. Shake the ampule until the contents are
      mixed thoroughly. It will appear cloudy and yellow to pale yellow.
    - Twist open the top of the ampule and use it right away. Squeeze all the medicine
      from the ampule into the nebulizer cup or reservoir.
    - Connect the mouthpiece to the nebulizer, then connect the nebulizer to the compressor.
    - Sit in an upright position. Place the mouthpiece in your mouth and close your
      lips around the mouthpiece.
    - Use the nebulizer for about 5 to 7 minutes, or until no more mist is seen in
      the nebulizer reservoir.
    - Follow the manufacturer's directions for care and cleaning of the nebulizer
      and compressor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For inhalation dosage form (suspension): For maintenance treatment of COPD:
        Adults—3 milligrams (mg) (one ampule) 2 times a day, once in the morning and
        once in the evening. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For maintenance treatment of COPD: Adults—3 milligrams (mg) (one ampule)
        2 times a day, once in the morning and once in the evening. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—3 milligrams (mg) (one ampule) 2 times a day, once in the morning and
        once in the evening.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to check for any unwanted effects.
  - type: paragraph
    text: This medicine should not be used if you are having a severe COPD attack,
      or if symptoms of a COPD attack has already started. Your doctor may prescribe
      another medicine for you to use in case of an acute COPD attack. If the other
      medicine does not work as well, tell your doctor right away.
  - type: paragraph
    text: Talk to your doctor or get medical care right away if your symptoms do not
      improve after using this medicine within a few days or if they become worse,
      or your short-acting inhaler does not seem to be working as well as usual and
      you need to use it more often.
  - type: paragraph
    text: This medicine may cause paradoxical bronchospasm, which may be life-threatening.
      Check with your doctor right away if you have coughing, difficulty breathing,
      or trouble breathing after using this medicine.
  - type: paragraph
    text: This medicine may cause some teenagers and young adults to be agitated,
      irritable, or display other abnormal behaviors. It may also cause some people
      to have suicidal thoughts and tendencies or to become more depressed. Some people
      may have trouble sleeping, get upset easily, have a big increase in energy,
      or start to act reckless. If you or your caregiver notice any of these unwanted
      effects, tell your doctor right away. Let the doctor know if you or anyone in
      your family has bipolar disorder (manic-depressive) or has tried to commit suicide.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - blurred vision
      - difficult, burning, or painful urination
      - dizziness
      - frequent urge to urinate
      - headache
      - lower back or side pain
      - nervousness
      - pounding in the ears
      - slow or fast heartbeat
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - discouragement
      - feeling sad or empty
      - lack of appetite
      - loss of interest or pleasure
      - thoughts of killing oneself changes in behavior
      - tiredness
      - trouble breathing
      - trouble concentrating
      - trouble sleeping
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - diarrhea
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
