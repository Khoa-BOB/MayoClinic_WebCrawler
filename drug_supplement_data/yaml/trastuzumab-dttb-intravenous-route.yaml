title: Trastuzumab-dttb (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ontruzant
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Trastuzumab-dttb injection is used to treat HER2-overexpressing node positive
      or node negative (ER/PR negative or with one high risk feature) breast cancer.
      It can be used alone after a previous treatment with an anthracycline medicine
      or with other cancer medicines (eg, carboplatin, cyclophosphamide, docetaxel,
      doxorubicin, paclitaxel).
  - type: paragraph
    text: Trastuzumab-dttb injection is also used alone to treat HER2-overexpressing
      metastatic (cancer that has spread) breast cancer in patients who have previously
      received one or more cancer treatments. It is also used together with paclitaxel
      for the first-line treatment of HER2-overexpressing metastatic breast cancer.
  - type: paragraph
    text: Trastuzumab-dttb injection is also used in combination with cisplatin and
      capecitabine or 5-fluorouracil to treat HER2-overexpressing metastatic (cancer
      that has spread to other parts of the body) stomach cancer called gastric or
      gastroesophageal junction (GEJ) adenocarcinoma in patients who have not previously
      received treatment.
  - type: paragraph
    text: Trastuzumab-dttb prevents the growth of some tumors that produce extra amounts
      of a certain substance known as the HER2 protein. It should only be used in
      patients whose tumors have been shown to produce extra amounts of this protein
      (HER2 overexpression) . Your doctor will test for the presence of this protein.
  - type: paragraph
    text: Trastuzumab-dttb is a monoclonal antibody. It interferes with the growth
      of cancer cells, which are eventually destroyed by the body. Since the growth
      of normal body cells may also be affected by trastuzumab-dttb, other effects
      will also occur. Some of these may be serious and must be reported to your doctor.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of trastuzumab-dttb injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of trastuzumab-dttb injection in
        the elderly. However, elderly patients are more likely to have age-related
        heart problems, which may require caution in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Daunorubicin
      - Daunorubicin Citrate Liposome
      - Daunorubicin Liposome
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Ebola Zaire Vaccine, Live
      - Epirubicin
      - Idarubicin
      - Influenza Virus Vaccine, Live
      - Pirarubicin
      - Pixantrone
      - Rotavirus Vaccine, Live
      - Valrubicin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Heart disease (eg, cardiomyopathy) or
      - Heart rhythm problems (eg, arrhythmia) or
      - Hypertension (high blood pressure) or
      - Lung disease (eg, interstitial pneumonitis, pulmonary fibrosis, lung tumor)—Use
        with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Infection—May decrease your body's ability to fight infection.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine.
      It is given through an IV catheter that is placed into one of your veins. This
      medicine must be given slowly, so the IV will have to stay in place for at least
      30 to 90 minutes. The injection is usually given every 3 weeks.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: Receiving this medicine while you are pregnant can harm your unborn baby.
      If you can get pregnant, your doctor may do tests to make sure you are not pregnant
      before receiving this medicine. Use an effective form of birth control to keep
      from getting pregnant during treatment and for 7 months after the last dose.
      If you think you have become pregnant while receiving the medicine, tell your
      doctor right away.
  - type: paragraph
    text: Your doctor may test your heart before you start receiving trastuzumab-dttb
      injection and while you are getting treatments with this medicine. This medicine
      may cause heart problems (eg, heart failure, heart rhythm problems, heart muscle
      problems, and high blood pressure). Check with your doctor right away if you
      have blurred vision, chest pain or tightness, decreased urine output, dilated
      neck veins, dizziness, extreme fatigue, fainting, fast or slow heartbeat, headache,
      irregular breathing, irregular heartbeat, nervousness, pounding in the ears,
      swelling of the face, fingers, feet, or lower legs, trouble breathing, or weight
      gain.
  - type: paragraph
    text: This medicine may cause infusion reactions, which can be life-threatening
      and require immediate medical attention. Check with your doctor right away if
      you have blurred vision, confusion, dizziness, faintness, or lightheadedness
      when getting up suddenly from a lying or sitting position, facial swelling,
      fever or chills, headache, nausea or vomiting, skin rash, sweating, trouble
      breathing, or unusual tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have chest pain or tightness, confusion,
      cough, dizziness, fast heartbeat, fever, trouble breathing, or unusual tiredness
      or weakness. These may be symptoms of serious lung problems.
  - type: paragraph
    text: 'This medicine can temporarily lower the number of white blood cells in
      your blood, increasing the chance of getting an infection. It can also lower
      the number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in urine or stools, or pinpoint red spots on your
      skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects, such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: Do not use an anthracycline medicine for up to 7 months after stopping treatment
      with medicines containing trastuzumab.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - bloody urine
      - body aches or pain
      - chest pain or tightness
      - chills
      - cough
      - decreased frequency or amount of urine
      - diarrhea
      - difficulty in breathing
      - dilated neck veins
      - dry mouth
      - dryness or soreness of the throat
      - ear congestion
      - fever
      - general feeling of discomfort or illness
      - headache
      - hoarseness
      - increased blood pressure
      - increased cough
      - increased thirst
      - irregular breathing
      - irregular heartbeat
      - joint pain
      - loss of appetite
      - loss of voice
      - lower back or side pain
      - mood changes
      - muscle pain or cramps
      - nausea
      - numbness or tingling in the hands, feet, or lips
      - pain or tenderness around the eyes and cheekbones
      - painful or difficult urination
      - pale skin
      - pinpoint red spots on the skin
      - rapid weight gain
      - seizures
      - shivering
      - sneezing
      - sore throat
      - stuffy or runny nose
      - sweating
      - tender, swollen glands in the neck
      - trouble breathing
      - trouble in swallowing
      - trouble sleeping
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - unusual weight gain or loss
      - voice changes
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - blindness or vision changes
      - blurred vision
      - burning of the face or mouth
      - burning, crawling, itching, numbness, painful, prickling, "pins and needles",
        or tingling feelings
      - cloudy urine
      - clumsiness or unsteadiness
      - dizziness
      - fast, pounding, or irregular heartbeat or pulse
      - frequent urge to urinate
      - nervousness
      - nosebleed
      - painful cold sores or blisters on the lips, nose, eyes, or genitals
      - pounding in the ears
      - slow heartbeat
      - weakness in the hands or feet
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased ability to exercise
      - fainting
      - hives, itching, skin rash
      - irritation
      - joint stiffness or swelling
      - neck tenderness or swelling
      - redness of the skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - bone pain
      - change in or loss of taste
      - cracked lips
      - depression
      - difficulty in moving
      - lack or loss of strength
      - stomach pain
      - swelling or inflammation of the mouth
      - weight decreased
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - heartburn
      - indigestion
      - muscle spasm
      - stabbing pain
      - stomach discomfort or upset
      - upper stomach pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
