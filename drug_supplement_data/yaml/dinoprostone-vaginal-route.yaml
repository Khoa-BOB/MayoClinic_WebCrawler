title: Dinoprostone (vaginal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cervidil
    - type: paragraph
      text: Prepidil
    - type: paragraph
      text: Prostin E2
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Dinoprostone works by causing the cervix to thin and dilate (open) and the
      uterus to contract (cramp) the way it does during labor.
  - type: paragraph
    text: Dinoprostone may also be used for other purposes as determined by your doctor.
  - type: paragraph
    text: Dinoprostone is to be administered only by or under the immediate care of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Gel/Jelly
    - Insert, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Ephedrine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia (or history of)—Dinoprostone, when used in doses that stimulate the
        uterus to contract, may result in loss of blood in some patients that may
        require a blood transfusion
    - type: list
      ordered: false
      items:
      - Asthma (or history of, including childhood asthma) or
      - Lung disease—Dinoprostone may cause narrowing of the blood vessels in the
        lungs or narrowing of the lung passages, especially when it is used in doses
        that stimulate the uterus to contract
    - type: list
      ordered: false
      items:
      - Epilepsy (or history of)—Rarely, seizures have occurred with dinoprostone
        when it is used in doses that stimulate the uterus to contract
    - type: list
      ordered: false
      items:
      - Glaucoma—Rarely, the pressure within the eye has increased and constriction
        of the pupils has occurred during the use of medicines like dinoprostone;
        this may also be a problem with dinoprostone when it is used in doses that
        stimulate the uterus to contract
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease (or history of) or
      - High blood pressure (or history of) or
      - Low blood pressure (history of)—Dinoprostone may cause changes in heart function
        or blood pressure changes; two patients with a history of heart disease had
        heart attacks when dinoprostone was used in doses that stimulated the uterus
        to contract
    - type: list
      ordered: false
      items:
      - Kidney disease (or history of) or
      - Liver disease (or history of)—The body may not remove dinoprostone from the
        blood stream at the usual rate, which may make the dinoprostone work longer
        or cause an increased chance of side effects, especially when dinoprostone
        is used in doses that stimulate the uterus to contract
    - type: list
      ordered: false
      items:
      - Problems during delivery, history of or
      - Surgery of uterus (history of) or
      - Unusual vaginal bleeding—There is an increased risk of problems occurring
        with dinoprostone when it is used in doses that stimulate the uterus to contract
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: After dinoprostone is given, you will need to lie down for 10 minutes to
      2 hours so that the medicine can be absorbed. The length of time you must remain
      lying down will depend on what form of the medicine you are using.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For cervical dosage form (gel): To thin and widen the opening of the cervix
        just before labor: Adults and teenagers—Your doctor will insert 0.5 milligram
        (mg) (one application) of dinoprostone into the canal of your cervix. You
        should remain lying on your back for at least ten to thirty minutes after
        it has been applied.'
      - 'For vaginal dosage form (gel): To cause the uterus to contract for labor:
        Adults and teenagers—Your doctor will insert 1 milligram (mg) (one applicatorful)
        of dinoprostone into your vagina. You should remain lying on your back for
        at least thirty minutes after it has been applied. You may need another dose
        of 1 to 2 mg six hours after the first dose.'
      - 'For vaginal dosage form (suppositories): To cause the uterus to contract
        to abort a pregnancy: Adults and teenagers—Your doctor will insert 20 milligrams
        (mg) (one suppository) into your vagina every three to five hours as needed.
        You should remain lying on your back for at least ten minutes after it has
        been inserted.'
      - 'For vaginal dosage form (system): To thin and widen the opening of the cervix
        just before labor: Adults and teenagers—Your doctor will insert 10 milligrams
        (mg) (one system) into your vagina. You should remain lying on your back for
        at least two hours after it has been inserted.'
    - type: list
      ordered: false
      items:
      - 'To thin and widen the opening of the cervix just before labor: Adults and
        teenagers—Your doctor will insert 0.5 milligram (mg) (one application) of
        dinoprostone into the canal of your cervix. You should remain lying on your
