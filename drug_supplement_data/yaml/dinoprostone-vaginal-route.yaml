- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fast or slow heartbeat
      - hives
      - increased pain of the uterus
      - pale, cool, blotchy skin on arms or legs
      - pressing or painful feeling in chest
      - shortness of breath
      - swelling of face, inside the nose, and eyelids
      - tightness in chest
      - trouble in breathing
      - weak or absent pulse in arms or legs
      - wheezing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps
      - diarrhea
      - fever
      - nausea
      - vomiting
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills or shivering
      - constipation
      - flushing
      - headache
      - swelling of the genital area (vulva)
      - tender or mildly bloated abdomen or stomach
    - type: paragraph
      text: 'This procedure may still result in some effects, which occur after the
        procedure is completed, that need medical attention. Check with your doctor
        if any of the following side effects occur:'
    - type: list
      ordered: false
      items:
      - Chills or shivering (continuing)
      - fever (continuing)
      - foul-smelling vaginal discharge
      - pain in lower abdomen
      - unusual increase in bleeding of the uterus
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
