title: Ritlecitinib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Litfulo
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ritlecitinib is used to treat severe alopecia areata (autoimmune disorder
      that causes patchy hair loss). This medicine is a Janus kinase 3 (JAK3) and
      tyrosine kinase inhibitor that works on the immune system.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of ritlecitinib in children younger than 12 years of age. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of ritlecitinib in the elderly. However,
        elderly patients are more likely to have unwanted effects (eg, infection),
        which may require caution and adjustment in the dose for patients receiving
        ritlecitinib.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Fezolinetant
      - Flibanserin
      - Lomitapide
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abemaciclib
      - Acalabrutinib
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Alfentanil
      - Alosetron
      - Amlodipine
      - Apalutamide
      - Aprepitant
      - Atazanavir
      - Atorvastatin
      - Avanafil
      - Avapritinib
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Bedaquiline
      - Benzhydrocodone
      - Bosutinib
      - Brexpiprazole
      - Brotizolam
      - Budesonide
      - Buspirone
      - Capivasertib
      - Carbamazepine
      - Cariprazine
      - Cholera Vaccine, Live
      - Clomipramine
      - Cobimetinib
      - Codeine
      - Colchicine
      - Conivaptan
      - Crizotinib
      - Cyclosporine
      - Daridorexant
      - Darifenacin
      - Darunavir
      - Dasatinib
      - Defactinib
      - Dengue Tetravalent Vaccine, Live
      - Deutivacaftor
      - Dihydrocodeine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Heart or blood vessel disease or
      - Hepatitis B, history of or
      - Hepatitis C, history of or
      - Herpes zoster infection or
      - Tuberculosis, history of or
      - Weakened immune system—May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Infection, active or
      - Liver disease, severe or
      - Tuberculosis, active—Use is not recommended in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Smoker, current or past—May increase risk for serious side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      or less of it, do not take it more often, and do not take it for a longer time
      than your doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the capsule whole. Do not chew, crush, or split it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsule): For alopecia areata: Adults and children
        12 years of age and older—50 milligrams (mg) once a day. Children younger
        than 12 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For alopecia areata: Adults and children 12 years of age and older—50 milligrams
        (mg) once a day. Children younger than 12 years of age—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—50 milligrams (mg) once a day.
      - Children younger than 12 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If it is less than 8 hours before your next dose, skip the missed dose
        and go back to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if this medicine is working properly and
      to decide whether you should continue to use it. Blood tests are needed to check
      for unwanted effects.
  - type: paragraph
    text: You will need to have a skin test for tuberculosis before you start using
      this medicine. Tell your doctor if you or anyone in your home has ever had a
      positive reaction to a tuberculosis skin test.
  - type: paragraph
    text: Your body's ability to fight infections may be reduced while you are using
      ritlecitinib. It is very important that you call your doctor at the first sign
      of an infection. Check with your doctor right away if you have a fever, chills,
      cough, flu-like symptoms, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may increase your risk of serious heart or blood vessel problems
      (eg, heart attack, stroke), especially in patients with rheumatoid arthritis
      who are 50 years of age and older and with a heart or blood vessel disease.
      Call your doctor right away if you have chest pain or discomfort, confusion,
      difficulty in speaking, double vision, headache, inability to move arms, legs,
      or facial muscles, nausea, pain or discomfort in the arms, jaw, back, or neck,
      sweating, trouble breathing, or vomiting.
  - type: paragraph
    text: This medicine may increase your risk of cancer (eg, lymphoma, lung cancer,
      non-melanoma skin cancer). Tell your doctor right away if you have black, tarry
      stools, general feeling of illness, swollen glands, weight loss, yellow skin
      and eyes, persistent non-healing sore, reddish patch or irritated area, shiny
      bump, pink growth, or white, yellow or waxy scar-like area on the skin.
  - type: paragraph
    text: This medicine may increase your risk of developing blood clots (eg, arterial
      thrombosis, deep vein thrombosis, pulmonary embolism), especially in patients
      with rheumatoid arthritis who are 50 years of age and older and with a heart
      or blood vessel disease. Check with your doctor right away if you have anxiety,
      chest pain, cough, dizziness, lightheadedness, or fainting, fast heartbeat,
      pain, redness, or swelling in the arm or leg, pains in the chest, groin, or
      legs, especially calves of the legs, severe headaches, sudden loss of coordination,
      sudden onset of slurred speech, sudden vision changes, or trouble breathing.
  - type: paragraph
    text: While you are being treated with ritlecitinib, and after you stop treatment
      with it, do not have any immunizations (vaccines) without your doctor's approval.
      Ritlecitinib may lower your body's resistance and there is a chance you might
      get the infection the vaccine is meant to prevent. In addition, you should not
      be around other persons living in your household who receive live virus vaccines
      because there is a chance they could pass the virus on to you. Some examples
      of live vaccines include measles, mumps, influenza (nasal flu vaccine), poliovirus
      (oral form), rotavirus, and rubella. Do not get close to them and do not stay
      in the same room with them for very long. If you have questions about this,
      talk to your doctor.
  - type: paragraph
    text: This medicine can cause serious allergic reaction, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Check
      with your doctor right away if you have chest tightness, cough, difficulty swallowing,
      dizziness, fast heartbeat, hives, itching, skin rash, puffiness or swelling
      of the eyelids or around the eyes, face, lips, or tongue, or unusual tiredness
      or weakness.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, itching, and pain in hairy areas, pus at the root of hair
      - painful blisters on the trunk of the body
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - black, tarry stools
      - chest pain, discomfort, or tightness
      - confusion
      - cough or hoarseness
      - coughing or spitting up blood
      - difficulty breathing
      - difficulty in speaking
      - dizziness or lightheadedness
      - double vision
      - fainting
      - fast heartbeat
      - fever or chills
      - general feeling of illness
      - headache
      - hives, itching, skin rash
      - inability to move the arms, legs, or facial muscles
      - inability to speak
      - lower back or side pain
      - muscle aches
      - nausea
      - night sweats
      - pain, redness, or swelling in the arm or leg
      - pain or discomfort in the arms, jaw, back, or neck
      - painful or difficult urination
      - persistent non-healing sore
      - pink growth
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - reddish patch or irritated area
      - shiny bump
      - slow speech
      - sore throat
      - sudden high fever or low grade fever for months
      - sweating
      - swollen glands
      - tenderness, pain, swelling, warmth, skin discoloration, and prominent superficial
        veins over the affected area
      - unusual tiredness or weakness
      - vomiting
      - weight loss
      - white, yellow, or waxy scar-like area
      - yellow skin and eyes
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blemishes on the skin
      - pimples
      - swelling or inflammation of the mouth
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
