title: Succimer (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Chemet
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Succimer is used in the treatment of acute lead poisoning to remove excess
      lead from the body, especially in small children.
  - type: paragraph
    text: Succimer combines with lead in the blood stream. The combination of lead
      and succimer is then removed from the body by the kidneys. By removing the excess
      lead, the medicine lessens damage to various organs and tissues of the body.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested in children over the age of 1 year and,
        in effective doses, has not been shown to cause different side effects or
        problems than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of succimer in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Dehydration—Before and while taking succimer, you must drink plenty of fluids
        and urinate regularly
    - type: list
      ordered: false
      items:
      - Kidney disease—The combination of lead and succimer may not be removed from
        the body as quickly as it normally would
      - Liver disease—This condition may be made worse; your doctor should perform
        liver function tests regularly while you are taking succimer
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Children who have too much lead in their bodies should be removed from the
      lead-containing environment (for example, home, school, or other areas where
      the child has been exposed to lead) until the lead has been removed from the
      environment. If this is not possible, the environment should be made as safe
      as possible for the child.
  - type: paragraph
    text: Your doctor may want to put your child in the hospital while he or she is
      receiving succimer. This will allow the doctor to check your child's condition
      while the lead can be removed from the child's environment.
  - type: paragraph
    text: When opening your bottle of succimer, you may notice an unpleasant odor.
      However, this is a normal odor for these capsules and does not affect how the
      medicine works.
  - type: paragraph
    text: If the capsules cannot be swallowed, the contents of the capsule may be
      sprinkled on food and eaten immediately. The contents may also be given on a
      spoon and followed by a fruit drink.
  - type: paragraph
    text: It is important to drink plenty of fluids while taking succimer.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For the oral dosage form (capsules): For treatment of lead poisoning: For
        adults and children 12 years of age or older—Dose is based on body weight.
        The usual dose is 10 milligrams (mg) of succimer per kilogram (kg) (4.5 mg
        per pound) of body weight every eight hours for five days. For children 1
        to 11 years of age—Dose is based on body weight. The usual dose is 10 mg of
        succimer per kg (4.5 mg per pound) of body weight every eight hours for five
        days. The same dose is then given every twelve hours for the next fourteen
        days, for a total of nineteen days of therapy. For children up to 1 year of
        age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of lead poisoning: For adults and children 12 years of age
        or older—Dose is based on body weight. The usual dose is 10 milligrams (mg)
        of succimer per kilogram (kg) (4.5 mg per pound) of body weight every eight
        hours for five days. For children 1 to 11 years of age—Dose is based on body
        weight. The usual dose is 10 mg of succimer per kg (4.5 mg per pound) of body
        weight every eight hours for five days. The same dose is then given every
        twelve hours for the next fourteen days, for a total of nineteen days of therapy.
        For children up to 1 year of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - For adults and children 12 years of age or older—Dose is based on body weight.
        The usual dose is 10 milligrams (mg) of succimer per kilogram (kg) (4.5 mg
        per pound) of body weight every eight hours for five days.
      - For children 1 to 11 years of age—Dose is based on body weight. The usual
        dose is 10 mg of succimer per kg (4.5 mg per pound) of body weight every eight
        hours for five days. The same dose is then given every twelve hours for the
        next fourteen days, for a total of nineteen days of therapy.
      - For children up to 1 year of age—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      make sure that this medicine is working properly and to prevent unwanted effects.
      Certain blood and urine tests must be done regularly to determine how long you
      need to take succimer.
  - type: paragraph
    text: If you think you are getting an infection or if you get a fever or chills,
      contact your doctor as soon as possible. You will need certain tests. Based
      on the results of the tests, your doctor may advise you to temporarily stop
      taking succimer to prevent serious side effects from occurring.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - fever
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - loose stools
      - loss of appetite
      - nausea and vomiting
      - skin rash
    - type: paragraph
      text: Succimer may cause your urine, sweat, and feces to have an unpleasant
        odor.
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
