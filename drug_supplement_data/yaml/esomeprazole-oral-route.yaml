        (mg) once a day for 4 to 8 weeks. Your doctor may adjust your dose as needed.
        Children 1 to 11 years of age and weighing 20 kilograms (kg) or more—10 or
        20 mg once a day for 8 weeks. Your doctor may adjust your dose as needed.
        Children 1 to 11 years of age and weighing less than 20 kg—10 mg once a day
        for 8 weeks. Your doctor may adjust your dose as needed. Children 1 month
        to less than 1 year of age and weighing more than 7.5 kg to 12 kg—10 mg once
        a day for up to 6 weeks. Your doctor may adjust your dose as needed. Children
        1 month to less than 1 year of age and weighing more than 5 kg to 7.5 kg—5
        mg once a day for up to 6 weeks. Your doctor may adjust your dose as needed.
        Children 1 month to less than 1 year of age and weighing 3 kg to 5 kg—2.5
        mg once a day for up to 6 weeks. Your doctor may adjust your dose as needed.
        Infants younger than 1 month of age—Use and dose must be determined by your
        doctor.'
      - 'To treat gastroesophageal reflux disease (GERD): Adults—20 milligrams (mg)
        once a day for 4 weeks. Your doctor may adjust your dose as needed. Children
        12 to 17 years of age—20 milligrams (mg) once a day for 4 weeks. Your doctor
        may adjust your dose as needed. Children 1 to 11 years of age—10 milligrams
        (mg) once a day for up to 8 weeks. Your doctor may adjust your dose as needed.
        Children younger than 1 year of age—Use and dose must be determined by your
        doctor.'
      - 'To treat Zollinger-Ellison syndrome: Adults—40 milligrams (mg) 2 times a
        day. Your doctor may adjust your dose as needed. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—20 or 40 milligrams (mg) once a day for up to 6 months. Your doctor
        may adjust your dose if as needed.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—40 milligrams (mg) once a day for 10 days. The dose is usually taken
