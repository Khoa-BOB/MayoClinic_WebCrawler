title: Esomeprazole (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: NexIUM
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Esomeprazole is used to treat conditions where there is too much acid in
      the stomach. It is used to treat duodenal and gastric ulcers, erosive esophagitis,
      gastroesophageal reflux disease (GERD), and Zollinger-Ellison syndrome, a condition
      wherein the stomach produces too much acid. Esomeprazole is also used with antibiotics
      (eg, amoxicillin, clarithromycin) to treat ulcers that are caused by the H.
      pylori bacteria. This medicine is also used to prevent stomach ulcers and stomach
      irritation in patients taking NSAIDs (eg, aspirin, ibuprofen) for long periods
      of time.
  - type: paragraph
    text: Esomeprazole is a proton pump inhibitor (PPI). It works by decreasing the
      amount of acid that is produced by the stomach.
  - type: paragraph
    text: This medicine is available both over-the-counter (OTC) and with your doctor’s
      prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule, Delayed Release
    - Packet
    - Tablet, Delayed Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of esomeprazole for GERD in children.
        However, safety and efficacy have not been established for children younger
        than 1 month of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of esomeprazole in the elderly. However,
        elderly patients are more sensitive to the effects of this medicine than younger
        adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Rilpivirine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acalabrutinib
      - Amphetamine
      - Apalutamide
      - Atazanavir
      - Atezolizumab
      - Belumosudil
      - Belzutifan
      - Benzphetamine
      - Bosutinib
      - Cannabidiol
      - Capecitabine
      - Carbamazepine
      - Cefuroxime Axetil
      - Cilostazol
      - Citalopram
      - Clopidogrel
      - Dacomitinib
      - Dasatinib
      - Defactinib
      - Dextroamphetamine
      - Erlotinib
      - Escitalopram
      - Eslicarbazepine Acetate
      - Finerenone
      - Gefitinib
      - Haloperidol
      - Infigratinib
      - Ketoconazole
      - Ledipasvir
      - Levoketoconazole
      - Lisdexamfetamine
      - Lonafarnib
      - Mavacamten
      - Methadone
      - Methamphetamine
      - Methotrexate
      - Methylergonovine
      - Methylphenidate
      - Mifepristone
      - Mycophenolate Mofetil
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Itraconazole
      - Levothyroxine
      - Risedronate
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Cranberry
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diarrhea or
      - Hypomagnesemia (low magnesium in the blood), history of or
      - Osteoporosis (thinning of the bones) or
      - Seizures, history of or
      - Vitamin B12 deficiency—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Take this medicine at least 1 hour before a meal and for the full time of
      treatment, even if you begin to feel better after a few days.
  - type: paragraph
    text: If you are taking this medicine to treat an ulcer caused by an H. pylori
      infection, take it together with the antibiotics (eg, amoxicillin, clarithromycin)
      at the same time of day.
  - type: paragraph
    text: 'To use the capsule :'
  - type: list
    ordered: false
    items:
    - Swallow the capsule whole. Do not crush or chew it.
    - If the capsule cannot be swallowed, open it and sprinkle the contents on one
      tablespoonful of applesauce.
    - Swallow  the mixture right away. Do not chew or crush the granules.
  - type: paragraph
    text: 'To use the capsule with a nasogastric (NG) tube :'
  - type: list
    ordered: false
    items:
    - Open the capsule and empty the granules into a 60 mL catheter-tipped syringe
      and mix it with 50 mL of water.
    - Shake the syringe well for 15 seconds.
    - Inject or pour the mixture into the nasogastric tube.
    - Refill the syringe with a small amount of water and shake.
    - Flush the tube to rinse all of the medicine into the stomach.
  - type: paragraph
    text: 'To use the oral suspension :'
  - type: list
    ordered: false
    items:
    - Empty the contents of a 2.5 mg or 5 mg packet into a container with 5 mL of
      water.
    - Empty the contents of a 10 mg, 20 mg, or 40 mg packet into a container with
      15 mL of water.
    - Stir and leave it for 2 to 3 minutes to thicken.
    - Stir well and drink within 30 minutes.
    - If any medicine remains after drinking, add more water, stir, and drink immediately.
  - type: paragraph
    text: 'To use the oral suspension with a nasogastric or gastric tube :'
  - type: list
    ordered: false
    items:
    - Add 5 mL of water to a catheter-tipped syringe and add the contents of a 2.5
      mg or 5 mg packet.
    - Add 15 mL of water to a catheter-tipped syringe and add the contents of a 10
      mg, 20 mg, or 40 mg packet.
    - Shake the syringe right away and leave it for 2 to 3 minutes to thicken.
    - Shake the syringe again and inject or pour the mixture into the tube within
      30 minutes.
    - Refill the syringe with 15 mL of water and shake.
    - Flush the tube to rinse all of the medicine into the stomach.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules or suspension): To prevent NSAID-associated
        gastric ulcer: Adults—20 or 40 milligrams (mg) once a day for up to 6 months.
        Your doctor may adjust your dose if as needed. Children—Use and dose must
        be determined by your doctor. To treat duodenal ulcers with H. pylori infection:
        Adults—40 milligrams (mg) once a day for 10 days. The dose is usually taken
        together with amoxicillin and clarithromycin. Your doctor may adjust your
        dose as needed. Children—Use and dose must be determined by your doctor. To
        treat erosive esophagitis: Adults—20 or 40 milligrams (mg) once a day for
        4 to 8 weeks. Your doctor may adjust your dose as needed. To prevent erosive
        esophagitis from coming back, your doctor may want you to take 20 mg once
        a day for up to 6 months. Children 12 to 17 years of age—20 or 40 milligrams
        (mg) once a day for 4 to 8 weeks. Your doctor may adjust your dose as needed.
        Children 1 to 11 years of age and weighing 20 kilograms (kg) or more—10 or
        20 mg once a day for 8 weeks. Your doctor may adjust your dose as needed.
        Children 1 to 11 years of age and weighing less than 20 kg—10 mg once a day
        for 8 weeks. Your doctor may adjust your dose as needed. Children 1 month
        to less than 1 year of age and weighing more than 7.5 kg to 12 kg—10 mg once
        a day for up to 6 weeks. Your doctor may adjust your dose as needed. Children
        1 month to less than 1 year of age and weighing more than 5 kg to 7.5 kg—5
        mg once a day for up to 6 weeks. Your doctor may adjust your dose as needed.
        Children 1 month to less than 1 year of age and weighing 3 kg to 5 kg—2.5
        mg once a day for up to 6 weeks. Your doctor may adjust your dose as needed.
        Infants younger than 1 month of age—Use and dose must be determined by your
        doctor. To treat gastroesophageal reflux disease (GERD): Adults—20 milligrams
        (mg) once a day for 4 weeks. Your doctor may adjust your dose as needed. Children
        12 to 17 years of age—20 milligrams (mg) once a day for 4 weeks. Your doctor
        may adjust your dose as needed. Children 1 to 11 years of age—10 milligrams
        (mg) once a day for up to 8 weeks. Your doctor may adjust your dose as needed.
        Children younger than 1 year of age—Use and dose must be determined by your
        doctor. To treat Zollinger-Ellison syndrome: Adults—40 milligrams (mg) 2 times
        a day. Your doctor may adjust your dose as needed. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'To prevent NSAID-associated gastric ulcer: Adults—20 or 40 milligrams (mg)
        once a day for up to 6 months. Your doctor may adjust your dose if as needed.
        Children—Use and dose must be determined by your doctor.'
      - 'To treat duodenal ulcers with H. pylori infection: Adults—40 milligrams (mg)
