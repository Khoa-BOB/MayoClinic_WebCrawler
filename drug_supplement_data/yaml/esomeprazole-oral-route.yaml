      - Adults—20 milligrams (mg) once a day for 14 days.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits . This will allow your doctor to see if the medicine is working
      properly and to decide if you should continue to take it. Blood, urine, and
      other laboratory tests may be needed to check for unwanted effects. If your
      condition does not improve, or if it becomes worse, check with your doctor.
  - type: paragraph
    text: Do not use esomeprazole if you are also using medicines containing rilpivirine
      (Edurant®, Complera®). Using these medicines together may cause unwanted side
      effects .
  - type: paragraph
    text: Esomeprazole may cause a serious type of allergic reaction when used in
      patients with conditions treated with antibiotics. Call your doctor right away
      if you or your child has itching, trouble breathing or swallowing, or any swelling
      of your hands, face, or mouth.
  - type: paragraph
    text: This medicine is sometimes given together with amoxicillin (Amoxil®) and
      clarithromycin (Biaxin®) to treat ulcers caused by H. pylori infection. Be sure
      you understand the risks and proper use of any other medicines your doctor prescribes.
  - type: paragraph
    text: Check with your doctor right away if you have a change in frequency of urination
      or amount of urine, blood in the urine, fever, joint pain, loss of appetite,
      nausea, skin rash, swelling of the body, feet, or ankles, unusual tiredness
      or weakness, or unusual weight gain after using this medicine. These could be
      symptoms of a serious kidney problem called acute tubulointerstitial nephritis.
  - type: paragraph
    text: Taking this medicine for a long time may make it harder for your body to
      absorb vitamin B12. Tell your doctor if you have concerns about vitamin B12
      deficiency.
  - type: paragraph
    text: Serious stomach conditions may occur while taking this medicine alone or
      together with antibiotics. Check with your doctor immediately if you or your
      child has stomach cramps, bloated feeling, watery and severe diarrhea which
      may also be bloody sometimes, fever, nausea or vomiting, or unusual tiredness
      or weakness.
  - type: paragraph
    text: This medicine may increase your risk of having fractures of the hip, wrist,
      and spine. This is more likely if you are 50 years of age and older, use high
      doses, or use it for one year or more. Call your doctor right away if you have
      severe bone pain or are unable to walk or sit normally.
  - type: paragraph
    text: This medicine may cause serious skin reactions, including Stevens-Johnson
      syndrome, toxic epidermal necrolysis, acute generalized exanthematous pustulosis,
      and drug reaction with eosinophilia and systemic symptoms (DRESS). Check with
      your doctor right away if you have black, tarry stools, blistering, peeling,
      or loosening of the skin, chest pain, chills, cough, diarrhea, itching, joint
      or muscle pain, painful or difficult urination, red irritated eyes, red skin
      lesions, often with a purple center, sore throat, sores, ulcers, or white spots
      in the mouth or on the lips, swollen glands, unusual bleeding or bruising, or
      unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause hypomagnesemia (low magnesium in the blood). This
      is more likely to occur if you are using this medicine for more than one year,
      or if you are using it together with digoxin (Lanoxin®) or certain diuretics
      (water pills). Check with your doctor right away if you have convulsions (seizures),
      a fast, racing, or uneven heartbeat, muscle spasms (tetany), tremors, or unusual
      tiredness or weakness.
  - type: paragraph
    text: Cutaneous or systemic lupus erythematosus may occur or gets worse in lupus
      patients and are taking PPI. Call your doctor right away if you or your child
      have a joint pain or skin rash on your cheeks or arms that gets worse when exposed
      in the sun.
  - type: paragraph
    text: This medicine may increase your risk for fundic gland polyps (abnormal tissue
      growth in the upper part of your stomach). This is more likely if you are using
      this medicine for more than 1 year. Talk to your doctor if you have concerns.
  - type: paragraph
    text: Do not stop using this medicine without first checking with your doctor,
      or unless told to do so by your doctor.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you or your child
      are using this medicine. This medicine may affect the results of certain medical
      tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription (eg, clopidogrel, atazanavir, nelfinavir, Plavix®,
      Reyataz®, Viracept®) or nonprescription (over-the-counter [OTC]) medicines and
      herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blistering, peeling, or loosening of the skin
      - bloating
      - chest pain or tightness
      - chills
      - confusion
      - constipation
      - cough
      - darkened urine
      - decreased urine
      - difficulty with swallowing
      - dizziness
      - drowsiness
      - dry mouth
      - fast heartbeat
      - fever
      - indigestion
      - joint or muscle pain
      - loss of appetite
      - mood or mental changes
      - muscle cramps in the hands, arms, feet, legs, or face
      - muscle spasms (tetany) or twitching
      - nausea
      - numbness and tingling around the mouth, fingertips, or feet
      - painful or difficult urination
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - seizures
      - skin rash, hives, itching
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach cramps
      - swollen glands
      - trouble breathing
      - trembling
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bad, unusual, or unpleasant (after) taste
      - change in taste
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sleepiness or unusual drowsiness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acne
      - back pain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - decreased interest in sexual intercourse
      - excess air or gas in the stomach or bowels
      - full feeling
      - inability to have or keep an erection
      - increased sensitivity of the skin to sunlight
      - loss in sexual ability, desire, drive, or performance
      - loss or thinning of the hair
      - muscular weakness
      - passing gas
      - redness or other discoloration of the skin
      - seeing, hearing, or feeling things that are not there
      - severe sunburn
      - swelling of the breasts or breast soreness in both females and males
      - swelling or inflammation of the mouth
      - swollen joints
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
    - type: paragraph
