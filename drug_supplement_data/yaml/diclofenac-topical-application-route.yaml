title: Diclofenac (topical application route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Flector
    - type: paragraph
      text: Klofensaid II
    - type: paragraph
      text: Licart
    - type: paragraph
      text: Pennsaid
    - type: paragraph
      text: Rexaphenac
    - type: paragraph
      text: Solaraze
    - type: paragraph
      text: Voltaren
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Diclofenac is used to treat pain and other symptoms of arthritis of the
      joints (eg, osteoarthritis), such as inflammation, swelling, stiffness, and
      joint pain. However, this medicine does not cure osteoarthritis and will help
      you only as long as you continue to use it. Diclofenac is a nonsteroidal anti-inflammatory
      drug (NSAID).
  - type: paragraph
    text: Diclofenac topical 3% gel is also used to treat actinic keratosis, a skin
      problem that may become cancerous if not treated. The exact way that topical
      diclofenac helps this condition is unknown.
  - type: paragraph
    text: Diclofenac topical solution is used to treat pain and swelling caused by
      osteoarthritis of the knees.
  - type: paragraph
    text: Diclofenac topical patch and topical system is used to treat acute pain
      caused by minor strains, sprains, and contusions (bruises).
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: This medicine is available without a prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Patch, Extended Release
    - Solution
    - Gel/Jelly
    - Cream
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of diclofenac topical gel, patch, or solution in children and
        diclofenac topical system in children younger than 6 years of age. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of diclofenac topical in the elderly.
        However, elderly patients are more likely to have age-related kidney, heart,
        or stomach problems, which may require caution and an adjustment in the dose
        for patients receiving diclofenac topical.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Ketorolac
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abciximab
      - Acenocoumarol
      - Amiloride
      - Amineptine
      - Amitriptyline
      - Amitriptylinoxide
      - Amoxapine
      - Anagrelide
      - Apalutamide
      - Apixaban
      - Ardeparin
      - Argatroban
      - Aspirin
      - Azathioprine
      - Bemetizide
      - Bemiparin
      - Bendroflumethiazide
      - Benzthiazide
      - Betrixaban
      - Bivalirudin
      - Budesonide
      - Bumetanide
      - Cangrelor
      - Capecitabine
      - Ceritinib
      - Certoparin
      - Chlorothiazide
      - Chlorthalidone
      - Cilostazol
      - Citalopram
      - Clomipramine
      - Clopamide
      - Clopidogrel
      - Cyclopenthiazide
      - Cyclosporine
      - Cyclothiazide
      - Dabigatran Etexilate
      - Dalteparin
      - Danaparoid
      - Deferiprone
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acebutolol
      - Atenolol
      - Azilsartan
      - Azilsartan Medoxomil
      - Benazepril
      - Betaxolol
      - Bisoprolol
      - Candesartan
      - Captopril
      - Carteolol
      - Carvedilol
      - Celiprolol
      - Ciprofloxacin
      - Enalapril
      - Enalaprilat
      - Eprosartan
      - Esmolol
      - Fosinopril
      - Irbesartan
      - Labetalol
      - Levobunolol
      - Lisinopril
      - Losartan
      - Metipranolol
      - Metoprolol
      - Moexipril
      - Nadolol
      - Nebivolol
      - Olmesartan
      - Oxprenolol
      - Penbutolol
      - Perindopril
      - Pindolol
      - Propranolol
      - Quinapril
      - Ramipril
      - Sotalol
      - Spirapril
      - Telmisartan
      - Timolol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Bleeding problems or
      - Blood clots or
      - Congestive heart failure or
      - Edema (fluid retention or body swelling) or
      - Heart attack, recent or history of or
      - Heart disease or
      - Hyperkalemia (high potassium in the blood) or
      - Hypertension (high blood pressure) or
      - Kidney disease, mild to moderate or
      - Stomach ulcers or bleeding, history of or
      - Stroke, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Aspirin-sensitive asthma or
      - Aspirin (or other NSAIDs) sensitivity, history of or
      - Kidney disease, severe—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Damaged or non-intact skin caused by skin diseases (eg, exudative dermatitis,
        eczema, infection lesions), burns, or wounds (for skin patch and topical system
        only)—Should not be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Hypovolemia—Must be corrected first before using this medicine.
    - type: list
      ordered: false
      items:
      - Heart surgery (eg, coronary artery bypass graft [CABG] surgery)—Should not
        be used to relieve pain right before or after the surgery.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Keep using this medicine for the full time of treatment . However, do not
      use this medicine more often or for a longer time than your doctor ordered.
      This medicine is not for long-term use.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Follow the instructions on the medicine label if you are using this medicine
      without a prescription.
  - type: paragraph
    text: 'To use the skin patch or topical system :'
  - type: list
    ordered: false
    items:
    - Use this medicine exactly as directed by your doctor. It will work only if applied
      correctly.
    - Wash your hands with soap and water before and after applying a patch or topical
      system. Do not touch your eyes until after you have washed your hands. If it
      gets into your eyes, wash the eyes right away with water or saline. If eye irritation
      persists for more than one hour, call your doctor.
    - Apply the patch or topical system right away after removing it from the protective
      pouch. Do not cut it into smaller pieces and do not touch the sticky surface
      of the patch or topical system.
    - Apply the patch or topical system to a clean, dry, intact skin area. Choose
      an area with little or no hair and free of scars, cuts, or irritation. Avoid
      putting the patch or topical system on areas where it could be rubbed off by
      tight clothing.
    - Press the patch or topical system firmly in place with your fingertips to make
      sure that the edges stick well. If the patch or topical system begins to peel
      off, the edges may be taped down.
    - If the patch or topical system still peels off, it may be used with a mesh netting
      sleeve (eg, Curad® Hold Tite™, Surgilast® Tubular Elastic Dressing) to hold
      the patch or topical system applied to the ankles, knees, or elbows. The mesh
      netting sleeve must not be occlusive and must allow air to pass through.
    - Do not use the patch or topical system when you take a bath or shower.
    - To help you remember to use your medicine, try to get into the habit of using
      it at regular times. If you are using the skin patch, try to change it at the
      same time and day of the week.
  - type: paragraph
    text: 'To use the topical gel :'
  - type: list
    ordered: false
    items:
    - Wash your hands before and after using this medicine.
    - 'For Voltaren® 1% topical gel: Use the enclosed dosing card to measure the correct
      dose. The gel should be applied within the oblong area of the dosing card up
      to the 2 or 4 gram line (2 grams for each elbow, wrist, or hand, and 4 grams
      for each knee, ankle, or foot).'
    - Apply the medicine very carefully to clean, dry skin, and avoid getting any
      in your eyes, nose, or mouth.
    - Do not apply this medicine to areas with broken skin or open wounds, infection,
      or severely peeling skin.
    - Apply enough medicine each time to cover the entire affected area.
    - Do not use heating pads or cover the treated area with a bandage unless your
      doctor has told you to.
    - Do not use cosmetics (eg, makeup or sunscreens) or other skin care products
      on the same skin areas where you have applied this medicine.
    - 'For Voltaren® 1% topical gel: After applying this medicine, do not shower,
      bathe, or wash the affected area for at least 1 hour. Wait for at least 10 minutes
      before covering the treated skin with gloves or clothing.'
  - type: paragraph
    text: 'To use the topical solution :'
  - type: list
    ordered: false
    items:
    - Use this medicine exactly as directed by your doctor. It will work only if applied
      correctly. Do not apply this medicine anywhere on your body other than where
      your doctor tells you.
    - Wash your hands with soap and water before and after applying the solution.
      If you get this medicine into your eyes, wash the eyes right away with water
      or saline. If eye irritation persists for more than 1 hour, call your doctor.
    - Apply the solution to a clean, dry, intact skin area. Choose an area free of
      open wounds scars, cuts, or irritation.
    - Put 10 drops of the solution at a time on your hand or directly to your knee.
      Apply the solution evenly on the front, back, and sides of your knee.
    - After using the Pennsaid® solution, wait for at least 30 minutes before showering
      or bathing.
    - Do not use external heat or dressings to the treated knee. Avoid wearing clothing
      or applying skin care products, such as sunscreen, insect repellant, lotion,
      moisturizer, or cosmetics, over the treated knee until the skin is completely
      dry.
    - Avoid skin-to-skin contact between other people and the treated knee until the
      skin is completely dry.
    - Protect the treated knee from sunlight.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (gel): For actinic keratosis using Solaraze® 3% gel:
        Adults—Apply to affected skin area 2 times a day. Children—Use and dose must
        be determined by your doctor. For osteoarthritis of the hands, elbows, or
        wrists using Voltaren® 1% gel: Adults—Apply 2 grams (g) to the affected skin
        areas four times a day (a total of 8 g each day). However, the total dose
        should not exceed 32 g per day over all affected joints. Use the enclosed
        dosing card to measure the appropriate dose. Children—Use and dose must be
        determined by your doctor. For osteoarthritis of the knees, ankles, or feet
        using Voltaren® 1% gel: Adults—Apply 4 grams (g) to the affected skin areas
        four times a day (a total of 16 g each day). However, the total dose should
        not exceed 32 g per day over all affected joints. Use the enclosed dosing
        card to measure the appropriate dose. Children—Use and dose must be determined
        by your doctor.'
      - 'For topical dosage form (solution): For osteoarthritis of the knee: Adults—40
        drops (10 drops at a time) on each affected knee 4 times a day. Children—Use
        and dose must be determined by your doctor.'
      - 'For transdermal dosage form (skin patch): For acute pain: Adults—One patch
        applied to the painful area 2 times a day. Children—Use and dose must be determined
        by your doctor.'
      - 'For transdermal dosage form (topical system): For acute pain: Adults and
        children 6 years of age and older—One topical system applied to the most painful
        area 2 times a day. Children younger than 6 years of age—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For actinic keratosis using Solaraze® 3% gel: Adults—Apply to affected skin
        area 2 times a day. Children—Use and dose must be determined by your doctor.'
      - 'For osteoarthritis of the hands, elbows, or wrists using Voltaren® 1% gel:
        Adults—Apply 2 grams (g) to the affected skin areas four times a day (a total
        of 8 g each day). However, the total dose should not exceed 32 g per day over
        all affected joints. Use the enclosed dosing card to measure the appropriate
        dose. Children—Use and dose must be determined by your doctor.'
      - 'For osteoarthritis of the knees, ankles, or feet using Voltaren® 1% gel:
        Adults—Apply 4 grams (g) to the affected skin areas four times a day (a total
        of 16 g each day). However, the total dose should not exceed 32 g per day
        over all affected joints. Use the enclosed dosing card to measure the appropriate
        dose. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply to affected skin area 2 times a day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—Apply 2 grams (g) to the affected skin areas four times a day (a total
        of 8 g each day). However, the total dose should not exceed 32 g per day over
        all affected joints. Use the enclosed dosing card to measure the appropriate
        dose.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—Apply 4 grams (g) to the affected skin areas four times a day (a total
        of 16 g each day). However, the total dose should not exceed 32 g per day
        over all affected joints. Use the enclosed dosing card to measure the appropriate
        dose.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For osteoarthritis of the knee: Adults—40 drops (10 drops at a time) on each
        affected knee 4 times a day. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - Adults—40 drops (10 drops at a time) on each affected knee 4 times a day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For acute pain: Adults—One patch applied to the painful area 2 times a day.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—One patch applied to the painful area 2 times a day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For acute pain: Adults and children 6 years of age and older—One topical
        system applied to the most painful area 2 times a day. Children younger than
        6 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 6 years of age and older—One topical system applied to
        the most painful area 2 times a day.
      - Children younger than 6 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    - type: paragraph
      text: If you forget to wear or change a patch, put one on as soon as you can.
        If it is almost time to put on your next patch, wait until then to apply a
        new patch and skip the one you missed. Do not apply extra patches to make
        up for a missed dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: After removing a used patch , fold the patch in half with the sticky sides
        together. Make sure to dispose of it out of the reach of children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits . This will allow your doctor to make sure this medicine is
      working properly and to decide if you should continue to use it. Blood and urine
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may increase your risk of having a heart attack or stroke.
      This is more likely in people who already have heart disease or in people who
      use this medicine for a long time.
  - type: paragraph
    text: This medicine may cause bleeding in your stomach or bowels. These problems
      can happen without warning signs. This is more likely if you have had a stomach
      ulcer in the past, if you smoke or drink alcohol regularly, are over 60 years
      of age, are in poor health, or are using certain other medicines (eg, other
      NSAIDs, steroid medicine, blood thinners).
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Serious skin reactions, including Stevens-Johnson syndrome, exfoliative
      dermatitis, toxic epidermal necrolysis, fixed drug eruption (FDE), and generalized
      bullous fixed drug eruption (GBFDE) can occur during treatment with this medicine.
      Check with your doctor right away if you have blistering, peeling, or loosening
      of the skin, chills, cough, diarrhea, itching, joint or muscle pain, red irritated
      eyes, red skin lesions, sore throat, sores, ulcers, or white spots in the mouth
      or on the lips, or unusual tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have black, tarry stools, chest
      pain, chills, cough, fever, painful or difficult urination, sore throat, sores,
      ulcers, or white spots in the mouth or on the lips, swollen glands, unusual
      bleeding or bruising, or unusual tiredness or weakness. These may be symptoms
      of serious skin reaction called drug reaction with eosinophilia and systemic
      symptoms (DRESS).
  - type: paragraph
    text: Some possible warning signs of serious side effects that can occur during
      treatment with this medicine may include black, tarry stools, decreased urination,
      severe stomach pain, skin rash, swelling of the face, fingers, feet, or lower
      legs, unusual bleeding or bruising, unusual weight gain, vomiting of blood or
      material that looks like coffee grounds, or yellow skin or eyes. Also, signs
      of serious heart problems could occur including chest pain or tightness, fast
      or irregular heartbeat, unusual flushing or warmth of skin, weakness, or slurring
      of speech. Check with your doctor right away if you notice any of these warning
      signs .
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, trouble breathing, unusual tiredness or weakness, vomiting, or
      weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have stomach pain, confusion,
      difficulty with breathing, irregular heartbeat, nausea or vomiting, nervousness,
      numbness or tingling in the hands, feet, or lips, or weakness or heaviness of
      the legs.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction called anaphylaxis,
      which can be life-threatening and requires immediate medical attention. It may
      occur often in patients who are allergic to aspirin or other nonsteroidal anti-inflammatory
      drugs. Call your doctor right away if you have a rash, itching, trouble breathing
      or swallowing, or any swelling of your hands, face, or mouth while you are using
      this medicine.
  - type: paragraph
    text: Using this medicine during the later part of pregnancy can harm your unborn
      baby. If you think you have become pregnant while using the medicine, tell your
      doctor right away.
  - type: paragraph
    text: If your symptoms become worse, check with your doctor.
  - type: paragraph
    text: Diclofenac may cause redness, soreness, scaling, and peeling of the affected
      skin. Do not stop using this medicine without first checking with your doctor
      . If the reaction is very uncomfortable, check with your doctor.
  - type: paragraph
    text: 'While using this medicine, your skin may become more sensitive to sunlight
      than usual, and too much sunlight may increase the effects of the medicine.
      During this period of time:'
  - type: list
    ordered: false
    items:
    - Stay out of direct sunlight, especially between the hours of 10 AM and 3 PM,
      if possible.
    - Wear protective clothing, including a hat and sunglasses.
    - Do not use a sunlamp or tanning bed or booth.
    - Make sure you have discussed the use of a sun block product with your doctor.
  - type: paragraph
    text: If you have a severe reaction from the sun, check with your doctor.
  - type: paragraph
    text: This medicine may cause a delay in ovulation for women and may affect their
      ability to have children. If you plan to have children, talk with your doctor
      before using this medicine.
  - type: paragraph
    text: Before having any kind of surgery or medical tests, tell your doctor that
      you are using this medicine. It may be necessary for you to stop treatment for
      awhile, or to change to a different nonsteroidal antiinflammatory drug before
      your procedure.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, itching, redness, skin rash, swelling, or soreness at the application
        site
      - itching skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blood in the urine
      - chest pain or tightness
      - cough
      - dry, itching, or burning eyes
      - eye pain
      - headaches, including migraines
      - increased sensitivity of the skin to sunlight
      - pain or tenderness around the eyes and cheekbones
      - redness of the skin
      - redness or swelling of the eyes
      - runny or stuffy nose
      - skin rash other than at the application site
      - sore throat
      - trouble breathing
      - ulcers or sores on the skin, other than at the application site
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chills
      - fever
      - painful or difficult urination
      - sores, ulcers, or white spots on lips or in mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
