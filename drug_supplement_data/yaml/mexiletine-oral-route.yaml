title: Mexiletine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Mexitil
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Mexiletine belongs to the group of medicines known as antiarrhythmics. It
      is used to correct irregular heartbeats to a normal rhythm.
  - type: paragraph
    text: Mexiletine produces its helpful effects by slowing nerve impulses in the
      heart and making the heart tissue less sensitive.
  - type: paragraph
    text: Mexiletine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of mexiletine in children with use
        in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of mexiletine in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Fezolinetant
      - Levomethadyl
      - Mavorixafor
      - Vernakalant
      - Viloxazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Adagrasib
      - Amiodarone
      - Anagrelide
      - Atazanavir
      - Bendamustine
      - Berotralstat
      - Bupropion
      - Cannabidiol
      - Capmatinib
      - Carbamazepine
      - Celecoxib
      - Clomipramine
      - Clozapine
      - Cobicistat
      - Dacomitinib
      - Darunavir
      - Dasabuvir
      - Desvenlafaxine
      - Diazoxide
      - Dihydroartemisinin
      - Disopyramide
      - Duloxetine
      - Enasidenib
      - Epinephrine
      - Escitalopram
      - Etravirine
      - Fedratinib
      - Fluoxetine
      - Fosphenytoin
      - Imatinib
      - Lacosamide
      - Lidocaine
      - Ombitasvir
      - Pacritinib
      - Paritaprevir
      - Paroxetine
      - Peginterferon Alfa-2b
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Fluvoxamine
      - Rifapentine
      - Ritonavir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Low blood pressure—Mexiletine may make these conditions worse
    - type: list
      ordered: false
      items:
      - Heart attack (severe) or
      - Liver disease—Effects may last longer because of slower removal of mexiletine
        from the body
    - type: list
      ordered: false
      items:
      - Seizures (history of)—Mexiletine can cause seizures
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take mexiletine exactly as directed by your doctor, even though you may
      feel well. Do not take more medicine than ordered.
  - type: paragraph
    text: To lessen the possibility of stomach upset, mexiletine should be taken with
      food or immediately after meals or with milk or an antacid.
  - type: paragraph
    text: This medicine works best when there is a constant amount in the blood. To
      help keep this amount constant, do not miss any doses. Also it is best to take
      the doses at evenly spaced times day and night. For example, if you are to take
      3 doses a day, the doses should be spaced about 8 hours apart. If this interferes
      with your sleep or other daily activities, or if you need help in planning the
      best times to take your medicine, check with your health care professional.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For irregular heartbeat (arrhythmias): Adults—At
        first, 200 milligrams (mg) every eight hours. Then, your doctor may raise
        or lower your dose as needed. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - 'For irregular heartbeat (arrhythmias): Adults—At first, 200 milligrams (mg)
        every eight hours. Then, your doctor may raise or lower your dose as needed.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 200 milligrams (mg) every eight hours. Then, your doctor
        may raise or lower your dose as needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      make sure the medicine is working properly. This will allow for changes to be
      made in the amount of medicine you are taking, if necessary.
  - type: paragraph
    text: Your doctor may want you to carry a medical identification card or bracelet
      stating that you are using this medicine.
  - type: paragraph
    text: Before having any kind of surgery (including dental surgery) or emergency
      treatment, tell the medical doctor or dentist in charge that you are taking
      this medicine.
  - type: paragraph
    text: Mexiletine may cause some people to become dizzy, lightheaded, or less alert
      than they are normally. Make sure you know how you react to this medicine before
      you drive, use machines, or do anything else that could be dangerous if you
      are dizzy or are not alert.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - fast or irregular heartbeat
      - shortness of breath
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Convulsions (seizures)
      - fever or chills
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness or lightheadedness
      - heartburn
      - nausea and vomiting
      - nervousness
      - trembling or shaking of the hands
      - unsteadiness or difficulty in walking
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - constipation or diarrhea
      - headache
      - numbness or tingling of fingers and toes
      - ringing in the ears
      - skin rash
      - slurred speech
      - trouble in sleeping
      - unusual tiredness or weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
