title: Lorazepam (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ativan
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Lorazepam injection is used before certain medical procedures, including
      surgery, to relieve anxiety. When lorazepam is used before surgery, the patient
      will not remember some of the details about the procedure. It is also used to
      treat seizures, including status epilepticus.
  - type: paragraph
    text: Lorazepam is a benzodiazepine. Benzodiazepines belong to the group of medicines
      called central nervous system (CNS) depressants, which are medicines that slow
      down the nervous system.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of lorazepam injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of lorazepam injection in the elderly.
        However, elderly patients are more likely to have severe drowsiness, or age-related
        heart, liver, or kidney problems, which may require an adjustment in the dose
        in patients receiving lorazepam injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Flumazenil
      - Isocarboxazid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alfentanil
      - Alprazolam
      - Amobarbital
      - Anileridine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Benzhydrocodone
      - Bromazepam
      - Bromopride
      - Buprenorphine
      - Butabarbital
      - Butalbital
      - Butorphanol
      - Calcifediol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Carisoprodol
      - Cetirizine
      - Chloral Hydrate
      - Chlorzoxazone
      - Clobazam
      - Clomipramine
      - Clonazepam
      - Codeine
      - Cyclobenzaprine
      - Cyproheptadine
      - Dantrolene
      - Daridorexant
      - Desflurane
      - Dexmedetomidine
      - Dezocine
      - Diacetylmorphine
      - Diazepam
      - Difenoxin
      - Dihydrocodeine
      - Diphenoxylate
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Desogestrel
      - Dienogest
      - Drospirenone
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Gestodene
      - Levonorgestrel
      - Mestranol
      - Nomegestrol
      - Norethindrone
      - Norgestimate
      - Norgestrel
      - Posaconazole
      - Pyrimethamine
      - Rifapentine
      - St John's Wort
      - Theophylline
      - Tizanidine
      - Valproic Acid
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol or drug abuse or dependence, or history of or
      - Breathing problems or lung disease, mild to moderate—Use with caution. May
        make these conditions worse.
    - type: list
      ordered: false
      items:
      - Glaucoma, acute narrow-angle or
      - Lung disease, severe or
      - Sleep apnea (temporary stopping of breathing during sleep)—Should not be used
        in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given through a needle placed in one of your veins or given
      as a shot into one of your muscles.
  - type: paragraph
    text: After you receive this medicine, your doctor will watch you closely to make
      sure it is working properly and to check for unwanted effects.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress after you receive
      this medicine to make sure it is working properly and to check for any unwanted
      effects.
  - type: paragraph
    text: Tell your doctor if you are pregnant or planning to become pregnant. Using
      this medicine during the later pregnancy may cause problems in your newborn
      baby (eg, sedation or withdrawal symptoms). Tell your doctor right away if your
      baby has an abnormal sleep pattern, diarrhea, feeding problems, a high-pitched
      cry, irritability, low muscle tone, restlessness, shakiness or tremors, sluggishness,
      trouble breathing, weight loss, vomiting, or fails to gain weight. If you think
      you have become pregnant, tell your doctor right away.
  - type: paragraph
    text: This medicine contains benzyl alcohol which may cause serious reactions
      to newborn, premature, or low-birthweight infants. Discuss this with your doctor
      if you are concerned.
  - type: paragraph
    text: This medicine may cause drowsiness, trouble with thinking, trouble with
      controlling movements, or trouble with seeing clearly. Make sure you know how
      you react to this medicine before you drive, use machines, or do anything else
      that could be dangerous if you are not alert or able to think or see well.
  - type: paragraph
    text: If you develop any unusual or strange thoughts and behavior while taking
      lorazepam injection, be sure to discuss it with your doctor. Some changes that
      have occurred in people taking this medicine are like those seen in people who
      drink too much alcohol. Other changes might be confusion, agitation, and hallucinations
      (seeing, hearing, or feeling things that are not there).
  - type: paragraph
    text: 'Symptoms of an overdose include: blurred vision, change in consciousness,
      confusion, dizziness, faintness, or lightheadedness when getting up suddenly
      from a lying or sitting position, loss of consciousness, loss of strength or
      energy, muscle pain or weakness, shakiness and unsteady walk, sweating, unsteadiness,
      trembling, or other problems with muscle control or coordination, unusual excitement,
      nervousness, restlessness, or irritability, or unusual tiredness or weakness
      . Call your doctor right away if you notice these symptoms.'
  - type: paragraph
    text: This medicine may cause respiratory depression (serious breathing problem
      that can be life-threatening), especially when used with narcotic pain medicines.
      Tell your doctor if you are using any narcotic medicine.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other central nervous
      system (CNS) depressants. CNS depressants are medicines that slow down the nervous
      system, which may cause drowsiness or make you less alert. Some examples of
      CNS depressants are antihistamines or medicine for hay fever, allergies, or
      colds, sedatives, tranquilizers, or sleeping medicine, prescription pain medicine
      or narcotics, barbiturates (used for seizures), muscle relaxants, or anesthetics
      (numbing medicines), including some dental anesthetics. This effect may last
      for a few days after you stop taking this medicine. Check with your doctor before
      taking any of the above while you are using this medicine .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blue lips, fingernails, or skin
      - blurred vision
      - confusion
      - difficult or trouble breathing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - irregular, fast or slow, or shallow breathing
      - sleepiness or unusual drowsiness
      - sweating
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased awareness or responsiveness
      - not breathing
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of skin, feeling of
        pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - bloody or cloudy urine
      - blurred vision
      - change in consciousness
      - cough or hoarseness
      - deep or fast breathing with dizziness
      - difficult, burning, or painful urination
      - dizziness
      - extremely shallow or slow breathing
      - false beliefs that cannot be changed by facts
      - fever or chills
      - frequent urge to urinate
      - headache
      - loss of consciousness
      - lower back or side pain
      - nervousness
      - numbness of feet, hands and around mouth
      - painful or difficult urination
      - poor insight and judgement
      - pounding in the ears
      - problems with memory or speech
      - problems with movement, walking, or speech
      - seizures
      - slow or fast heartbeat
      - trouble thinking and planning
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - chest pain or discomfort
      - dark urine
      - fast, pounding, or irregular heartbeat or pulse
      - high fever
      - light-colored stools
      - loss of bladder control
      - loss of memory
      - paralysis
      - pinpoint red spots on the skin
      - sever muscle stiffness
      - stomach pain or bloating
      - sudden onset of severe breathing difficulty
      - unusual bleeding or bruising
      - unusually pale skin
      - yellow eyes or skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - changes in patterns and rhythms of speech
      - confusion
      - excitement
      - irritability
      - loss of strength or energy
      - muscle pain or weakness
      - restlessness
      - shakiness and unsteady walk
      - slurred speech
      - talkativeness
      - trouble speaking
      - unsteadiness, trembling, or other problems with muscle control or coordination
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
      - unusual weak feeling
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
