title: Tedizolid (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Sivextro
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Tedizolid injection is used to treat acute bacterial skin and skin structure
      infections (ABSSSI). It belongs to the class of drugs called antibiotics. Tedizolid
      works by killing bacteria or preventing their growth.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of tedizolid injection in children younger than 26 weeks gestational
        age and weighing less than 1 kilogram (kg). Safety and efficacy have not been
        established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of tedizolid injection in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Cholera Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diarrhea—Use with caution. May make this condition worse.
    - type: list
      ordered: false
      items:
      - Neutropenia (low white blood cell count)—Tedizolid may not work as well in
        patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through an IV catheter that is placed into
      one of your veins. The medicine must be given slowly, so the IV will have to
      remain in place for at least 1 hour.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      closely while you are receiving this medicine . This will allow your doctor
      to see if the medicine is working properly and to check for any unwanted effects.
  - type: paragraph
    text: This medicine may cause diarrhea, and in some cases it can be severe. It
      may also occur 2 months or more after you or your child stop receiving this
      medicine. If you or your child have diarrhea that continues or gets worse, check
      with your doctor. Do not take any medicine to treat diarrhea without checking
      first with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish color of the skin
      - blurred vision
      - chest tightness
      - diarrhea
      - dizziness
      - fast, slow, pounding, or irregular heartbeat or pulse
      - fever
      - headache
      - hives or welts, itching, or skin rash
      - hoarseness
      - irritation
      - itching of the vagina or genitals
      - joint pain, stiffness, or swelling
      - nervousness
      - pain or tenderness of the skin
      - pale skin
      - pounding in the ears
      - redness of the skin
      - severe stomach cramps and pain
      - sore mouth or tongue
      - stomach tenderness
      - swelling of the eyelids, face, lips, hands, legs, or feet
      - thick, white vaginal discharge with mild or no odor
      - trouble breathing or swallowing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - watery or severe diarrhea, which may also be bloody
      - white patches in the mouth or on the tongue
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blood in the urine or stools
      - chills
      - cough
      - lower back or side pain
      - painful or difficult urination
      - pinpoint red spots on the skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, discoloration of the skin, infection, itching,
        lumps, numbness, pain, redness, soreness, stinging, swelling, tenderness,
        tingling, ulceration, or warmth at the injection site
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - double vision
      - feeling of warmth
      - feeling that you cannot keep your eyes open
      - increased sensitivity of the eyes to light
      - redness of the face, neck, arms, and occasionally, upper chest
      - seeing floating spots before the eyes
      - sore neck, shoulders, or back
      - sore, tired, burning, or itching eyes
      - trouble concentrating
      - trouble sleeping
      - vomiting
      - watery or dry eyes
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
