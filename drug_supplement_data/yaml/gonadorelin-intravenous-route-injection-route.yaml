      - Disopyramide
      - Dofetilide
      - Dolasetron
      - Domperidone
      - Donepezil
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Gonadotropin-releasing hormone adenoma—Although this condition is rare, use
        of gonadorelin when this condition exists may cause problems in the pituitary
        gland and could result in sudden blindness
      - Any condition that may be made worse by estrogens, progestins, or androgens,
        such as a hormone-dependent tumor—The increase of estrogens and progestins
        in women or androgens in men that can result from use of multiple doses of
        gonadorelin may make a tumor worse if the tumor depends on estrogens, progestins,
        or androgens for growth
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: If you are having a test done with gonadorelin, one or more samples of your
      blood will be taken. Then gonadorelin is given by an intravenous (into a vein)
      or a subcutaneous (under the skin) injection. At regular times after the medicine
      is given, more blood samples will be taken. Then the results of the test will
      be studied.
  - type: paragraph
    text: Some medicines given by injection or by injection pump may sometimes be
      given at home to patients who do not need to be in the hospital. If you are
      using this medicine at home, make sure you clearly understand and carefully
      follow your doctor's instructions.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form (for Lutrepulse pump): For treating amenorrhea
        or infertility in women caused by pituitary or hypothalamus problems: Adults—5
        microgram (mcg) injected by the pump into a vein or under the skin slowly
        over 1 minute, every ninety minutes for twenty-one days. As determined by
        doctor, dose may be changed slowly, decreased to 1 mcg or increased to 20
        mcg if needed. Children up to 18 years of age—Use and dose must be determined
        by the doctor.'
    - type: list
      ordered: false
      items:
      - 'For treating amenorrhea or infertility in women caused by pituitary or hypothalamus
        problems: Adults—5 microgram (mcg) injected by the pump into a vein or under
        the skin slowly over 1 minute, every ninety minutes for twenty-one days. As
        determined by doctor, dose may be changed slowly, decreased to 1 mcg or increased
        to 20 mcg if needed. Children up to 18 years of age—Use and dose must be determined
        by the doctor.'
    - type: list
      ordered: false
      items:
      - Adults—5 microgram (mcg) injected by the pump into a vein or under the skin
        slowly over 1 minute, every ninety minutes for twenty-one days. As determined
        by doctor, dose may be changed slowly, decreased to 1 mcg or increased to
        20 mcg if needed.
      - Children up to 18 years of age—Use and dose must be determined by the doctor.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form (single-dose injection): For testing the hypothalamus
        and pituitary glands: Adults—0.1 milligram (mg) injected once as a single
        dose under the skin or into a vein. Children 12 years of age and older—2 micrograms
        (mcg) per kilogram (kg) (0.9 mcg per pound) of body weight, not to exceed
        a single dose of 100 mcg, injected once under the skin or into vein. Children
        up to 12 years of age—Use and dose must be determined by doctor.'
    - type: list
      ordered: false
      items:
      - 'For testing the hypothalamus and pituitary glands: Adults—0.1 milligram (mg)
        injected once as a single dose under the skin or into a vein. Children 12
        years of age and older—2 micrograms (mcg) per kilogram (kg) (0.9 mcg per pound)
        of body weight, not to exceed a single dose of 100 mcg, injected once under
        the skin or into vein. Children up to 12 years of age—Use and dose must be
        determined by doctor.'
    - type: list
      ordered: false
      items:
      - Adults—0.1 milligram (mg) injected once as a single dose under the skin or
        into a vein.
      - Children 12 years of age and older—2 micrograms (mcg) per kilogram (kg) (0.9
        mcg per pound) of body weight, not to exceed a single dose of 100 mcg, injected
