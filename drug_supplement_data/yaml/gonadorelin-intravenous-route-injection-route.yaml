      - Children up to 12 years of age—Use and dose must be determined by doctor.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: For Lutrepulse pump— It is very important that your doctor check your progress
      at regular visits . This will allow the doctor to see if the medicine is working
      properly and to decide if you should continue to use it.
  - type: paragraph
    text: If you are using gonadorelin to help you become pregnant, closely follow
      your doctor's advice on the best times to have sexual intercourse . Your doctor
      can help you decide when having sexual intercourse will not result in a pregnancy
      with twins or triplets.
  - type: paragraph
    text: Tell your doctor when you suspect your are pregnant .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: With repeated doses
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty in breathing
      - flushing (continuing)
      - rapid heartbeat
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: With repeated doses
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hardening of skin at place of injection
      - hives
    subsections: []
  - heading: With single or repeated doses
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Itching, pain, redness or swelling of skin at place of injection
      - skin rash (at place of injection or over entire body)
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content: []
    subsections: []
  - heading: With single dose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach discomfort
      - flushing (lasting only a short time)
      - headaches
      - lightheadedness
      - nausea
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
