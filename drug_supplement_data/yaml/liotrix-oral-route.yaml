    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits.
      This will allow your doctor to see if the medicine is working properly and to
      decide if you should continue to take it. Blood and urine tests will be needed
      to check for unwanted effects .
  - type: paragraph
    text: Liotrix should not be used for the treatment of obesity or for the purpose
      of losing weight. This medicine is ineffective for weight reduction and when
      taken in larger amount, it may cause more serious medical conditions .
  - type: paragraph
    text: Hypothyroidism can sometimes cause infertility in men and women. Liotrix
      should not be used for the treatment of infertility unless it is caused by hypothyroidism
      .
  - type: paragraph
    text: Call your doctor right away if you start to have chest pain, fast or irregular
      heartbeat, excessive sweating, heat intolerance, nervousness, or any other unusual
      medical condition .
  - type: paragraph
    text: For patients with diabetes, it is very important that you keep track of
      your blood or urine sugar levels as instructed by your doctor. Check with your
      doctor immediately if you notice any changes in your sugar levels .
  - type: paragraph
    text: A temporary loss of hair may occur during the first few months of liotrix
      therapy. Ask your doctor about this if you have any concerns .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not determined
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - constipation
      - depressed mood
      - difficulty in moving
      - discouragement
      - dryness of the eye
      - dry skin and hair
      - fast, irregular, pounding, or racing heartbeat or pulse
      - fear, nervousness
      - feeling cold
      - feeling sad or empty
      - fever
      - headache
      - hives or welts
      - hoarseness or husky voice
      - increased sweating
      - increased weight
      - increase in blood pressure
      - irritability
      - irritation
      - itching skin
      - joint pain, stiffness or swelling
      - lack of appetite
      - lack or loss of strength
      - loss of interest or pleasure
      - muscle aching or cramping
      - muscle pain or stiffness
      - nausea
      - redness of skin
      - shakiness in legs, arms, hands, feet
      - shortness of breath
      - skin rash
      - sleeplessness
      - slowed heartbeat
      - sluggishness
      - swelling of eyelids, face, lips, hands, or feet
      - swollen joints
      - tightness in chest
      - tiredness
      - trembling or shaking of hands or feet
      - trouble concentrating
      - troubled breathing or swallowing
      - trouble sleeping
      - unable to sleep
      - unusual tiredness or weakness
      - weight gain
      - wheezing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not determined
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hair loss, thinning of hair
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
