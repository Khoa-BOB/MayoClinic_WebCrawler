title: Liotrix (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Euthroid
    - type: paragraph
      text: Thyrolar
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Liotrix is used to treat hypothyroidism, a condition where the thyroid gland
      does not produce enough thyroid hormone. It is also used to help decrease the
      size of enlarged thyroid glands (known as goiter) and to treat thyroid cancer
      .
  - type: paragraph
    text: Liotrix is also used in some medical tests to help diagnose problems with
      the thyroid gland .
  - type: paragraph
    text: This medicine is available only with your doctor's prescription .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatrics-specific
        problems that would limit the usefulness of liotrix in children .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatrics-specific
        problems that would limit the usefulness of liotrix in the elderly. However,
        elderly patients are more likely to have age-related heart and blood vessel
        problems, which may require caution in patients receiving liotrix .
    subsections: []
  - heading: Breastfeeding
    level: 3
    content: []
    subsections: []
  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Digitalis
      - Digoxin
      - Epinephrine
      - Furosemide
      - Insulin Aspart, Recombinant
      - Iomeprol
      - Iopromide
      - Ketamine
      - Midodrine
      - Orlistat
      - Rifampin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Afatinib
      - Alectinib
      - Aluminum Carbonate, Basic
      - Aluminum Hydroxide
      - Aluminum Phosphate
      - Amiodarone
      - Baricitinib
      - Calcium Acetate
      - Calcium Carbonate
      - Calcium Citrate
      - Calcium Silicate
      - Capmatinib
      - Chlorotrianisene
      - Cholestyramine
      - Chromium
      - Ciprofloxacin
      - Colesevelam
      - Conjugated Estrogens
      - Conjugated Estrogens Synthetic A
      - Conjugated Estrogens Synthetic B
      - Dexlansoprazole
      - Dienestrol
      - Diethylstilbestrol
      - Dihydroxyaluminum Aminoacetate
      - Dihydroxyaluminum Sodium Carbonate
      - Esomeprazole
      - Esterified Estrogens
      - Estradiol
      - Estramustine
      - Estriol
      - Estropipate
      - Ethinyl Estradiol
      - Fosphenytoin
      - Fostamatinib
      - Gefitinib
      - Imatinib
      - Iron
      - Kelp
      - Lansoprazole
      - Lanthanum Carbonate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Dietary Fiber
      - Grapefruit Juice
      - Soybean
      - Walnut
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Coffee
      - Enteral Nutrition
      - Milk
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Adrenal insufficiency (untreated) or
      - Thyrotoxicosis (untreated, overactive thyroid)—This medicine should NOT be
        used in patients with any of these conditions .
    - type: list
      ordered: false
      items:
      - Clotting disorder or
      - Diabetes or
      - Heart disease (history of) or
      - Other adrenal gland problems—Use with caution. Dosage adjustment may be needed
        .
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine usually needs to be taken for the rest of your life. Do not
      stop taking this medicine or change your doses without first checking with your
      doctor. It may take several weeks before you start to notice an improvement
      in your symptoms .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablet): For the treatment of hypothyroidism: Adults—At
        first, one tablet of liotrix (Thyrolar-1/2) containing 6.25 microgram (mcg)
        of liothyronine and 25 mcg of levothyroxine once a day. Your doctor may increase
        your dose by one tablet of liotrix (Thyrolar-1/4) containing 3.1 mcg of liothyronine
        and 12.5 mcg of levothyroxine every 2 to 3 weeks. However, the dose is usually
        not more than one tablet of liotrix (Thyrolar-3) containing 37.5 mcg of liothyronine
        and 150 mcg of levothyroxine once a day. Children—Follow dosing for the treatment
        of congenital hypothyroidism . For the treatment of congenital hypothyroidism:
        Children 0 to 6 months of age—At first, 3.1 mcg of liothyronine and 12.5 mcg
        of levothyroxine once a day. Doses may be increased as needed. However, the
        dose is usually not more than 6.25 mcg of liothyronine and 25 mcg of levothyroxine
        once a day. Children 6 to 12 months of age—At first, 6.25 mcg of liothyronine
        and 25 mcg of levothyroxine once a day. Doses may be increased as needed.
        However, the dose is usually not more than 9.35 mcg of liothyronine and 37.5
        mcg of levothyroxine once a day. Children 1 to 5 years of age—At first, 9.35
        mcg of liothyronine and 37.5 mcg of levothyroxine once a day. Doses may be
        increased as needed. However, the dose is usually not more than 12.5 mcg of
        liothyronine and 50 mcg of levothyroxine once a day. Children 6 to 12 years
        of age—At first, 12.5 mcg of liothyronine and 50 mcg of levothyroxine once
        a day. Doses may be increased as needed. However, the dose is usually not
        more than 18.75 mcg of liothyronine and 75 mcg of levothyroxine once a day.
        Children over 12 years of age—The usual dose is 18.75 mcg of liothyronine
        and 75 mcg of levothyroxine once a day. Doses may be increased as needed .'
    - type: list
      ordered: false
      items:
      - 'For the treatment of hypothyroidism: Adults—At first, one tablet of liotrix
        (Thyrolar-1/2) containing 6.25 microgram (mcg) of liothyronine and 25 mcg
