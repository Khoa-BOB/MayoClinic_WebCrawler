title: Evinacumab-dgnb (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Evkeeza
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Evinacumab-dgnb injection is used together with other medicines to treat
      homozygous familial hypercholesterolemia (HoFH). This medicine is an ANGPTL3
      (angiopoietin-like protein 3) inhibitor.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of evinacumab-dgnb injection in children younger than 1 year
        of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of evinacumab-dgnb injection in the
        elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through an IV catheter that is placed into
      one of your veins. It must be given slowly, so the IV will have to remain in
      place for at least 60 minutes. It is usually given once a month (every 4 weeks).
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to see if the medicine is working properly to lower your cholesterol level and
      to decide if you should continue to use it. Blood tests may be needed to check
      for unwanted effects.
  - type: paragraph
    text: Receiving this medicine while you are pregnant can harm your unborn baby.
      If you are a woman who can get pregnant, your doctor may do tests to make sure
      you are not pregnant before starting treatment. Use an effective form of birth
      control to keep from getting pregnant during treatment and for at least 5 months
      after your last dose. If you think you have become pregnant while receiving
      the medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Check
      with your doctor right away if you or your child have chest tightness, cough,
      difficulty swallowing, dizziness, fast heartbeat, hives, itching, puffiness
      or swelling of the eyelids or around the eyes, face, lips, or tongue, skin rash,
      trouble breathing, or unusual tiredness or weakness.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - cough
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - hives, itching, skin rash
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - trouble breathing
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - diarrhea
      - fever
      - general feeling of discomfort or illness
      - headache
      - itching at the injection site
      - joint pain
      - loss of appetite
      - muscle aches, pains, or weakness
      - nausea
      - shivering
      - sore throat
      - stuffy or runny nose
      - sweating
      - trouble sleeping
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - constipation
      - ear congestion
      - lack or loss of strength
      - loss of voice
      - pain in the arms or legs
      - sneezing
      - stomach pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
