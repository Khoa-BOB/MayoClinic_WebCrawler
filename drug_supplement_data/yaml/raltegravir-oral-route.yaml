    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the chewable tablets and film-coated tablets in its original package
        with the bottle tightly closed. Do not open the foil packet of the powder
        for suspension until you are ready to use it.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Serious skin and allergic reactions (eg, Stevens-Johnson Syndrome, toxic
      epidermal necrosis) can occur with this medicine. These could be life-threatening
      and require immediate medical attention. Check with your doctor right away if
      you have a severe rash, blistering, peeling, or loosening skin, fever or chills,
      muscle or joint pain, sores or ulcers on the skin, swelling of the face, lips,
      tongue, or throat, unusual tiredness or weakness, or yellow eyes or skin while
      you or your child are using this medicine.
  - type: paragraph
    text: Your immune system may get stronger when you start taking HIV medicines.
      Tell your doctor right away if you or your child notice any changes in your
      health. Sometimes the immune system will start to fight infections that were
      hidden in your body, such as pneumonia, herpes, or tuberculosis. Autoimmune
      disorders (eg, Graves' disease, polymyositis, Guillain-Barré syndrome) may also
      occur.
  - type: paragraph
    text: Tell your doctor right away if you or your child have unexplained muscle
      pain, tenderness, or weakness, especially if you also have unusual tiredness
      or a fever. These could be symptoms of a serious muscle problem called myopathy.
  - type: paragraph
    text: Check with your doctor right away if you or your child have dark urine,
      fever, muscle cramps or spasms, muscle pain or stiffness, or unusual tiredness
      or weakness. These could be symptoms of a serious muscle problem called rhabdomyolysis,
      which can cause kidney problems.
  - type: paragraph
    text: This medicine will not keep you from giving HIV to your partner during sex.
      Make sure you understand this and practice safe sex, even if your partner also
      has HIV, by using a latex condom or other barrier method. This medicine will
      also not keep you from giving HIV to other people if they are exposed to your
      blood. Do not re-use or share needles with anyone.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blood in the urine
      - burning or stinging of the skin
      - dark urine
      - decreased frequency or amount of urine
      - fast heartbeat
      - fever
      - hoarseness
      - increased thirst
