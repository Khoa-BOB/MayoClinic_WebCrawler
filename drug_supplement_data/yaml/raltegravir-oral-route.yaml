title: Raltegravir (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Isentress
    - type: paragraph
      text: Isentress HD
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Raltegravir is used together with other medicines for the treatment of the
      infection caused by human immunodeficiency virus (HIV). HIV is the virus that
      causes acquired immune deficiency syndrome (AIDS). This medicine is usually
      given to patients who have already received HIV medicines in the past.
  - type: paragraph
    text: Raltegravir will not cure or prevent HIV infection or AIDS. It helps keep
      HIV from reproducing and appears to slow down the destruction of the immune
      system. This may help delay problems that are usually related to AIDS or HIV
      disease from occurring. Raltegravir will not keep you from spreading HIV to
      other people. People who receive this medicine may continue to have other problems
      usually related to AIDS or HIV disease.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Powder for Suspension
    - Tablet, Chewable
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Isentress® film-coated tablets,
        chewable tablets, or oral suspension in children weighing 2 kilograms (kg)
        or more. Safety and efficacy have not been established in children weighing
        less than 2 kg.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Isentress HD® film-coated tablets
        in children weighing 40 kilograms (kg) or more. Safety and efficacy have not
        been established in children weighing less than 40 kg.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of raltegravir in the elderly. However,
        elderly patients are more likely to have age-related kidney, liver, or heart
        problems, which may require caution and an adjustment in the dose for patients
        receiving raltegravir.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Ranolazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aluminum
      - Aluminum Carbonate, Basic
      - Aluminum Hydroxide
      - Aluminum Phosphate
      - Amlodipine
      - Amprenavir
      - Atidarsagene Autotemcel
      - Atogepant
      - Azathioprine
      - Cabotegravir
      - Calcium
      - Cariprazine
      - Dihydroxyaluminum Aminoacetate
      - Dihydroxyaluminum Sodium Carbonate
      - Fosamprenavir
      - Iron
      - Levoketoconazole
      - Magaldrate
      - Magnesium
      - Magnesium Carbonate
      - Magnesium Hydroxide
      - Magnesium Oxide
      - Magnesium Trisilicate
      - Mercaptopurine
      - Methotrexate
      - Nifedipine
      - Orlistat
      - Sucralfate
      - Voriconazole
      - Zinc
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Etravirine
      - Omeprazole
      - Rifampin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use with caution. This medicine has not been studied
        in patients with severe liver problems.
    - type: list
      ordered: false
      items:
      - Myopathy (muscle weakness), history of or
      - Rhabdomyolysis (muscle problem that could lead to kidney problem), history
        of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Phenylketonuria (PKU)—The chewable tablet contains phenylalanine, which can
        make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. Also, do not change the dose or stop using this medicine
      without checking first with your doctor . When your supply of this medicine
      is running low, contact your doctor or pharmacist ahead of time. Do not allow
      yourself to run out of this medicine.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Read it again each time you refill your prescription
      in case there is new information. Ask your doctor if you have any questions.
  - type: paragraph
    text: Keep using raltegravir for the full time of treatment , even if you begin
      to feel better. It is also important to take this medicine together with other
      medicines for HIV. Be sure to take all of the medicines your doctor ordered
      at the right times.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: You may chew or swallow the chewable tablets whole. However, the film-coated
      tablets must be swallowed whole.
  - type: paragraph
    text: 'If you have trouble chewing the 25-mg chewable tablet :'
  - type: list
    ordered: false
    items:
    - Place the tablet in a clean cup and add 5 milliliters (ml) of liquid (including
      water, juice, or breast milk).
    - Use a spoon to crush any remaining tablet and take the medicine right away.
    - You may add another 5 ml of liquid if any part of the medicine is left in the
      cup, mix and drink right away.
  - type: paragraph
    text: 'If you are using the oral suspension :'
  - type: list
    ordered: false
    items:
    - Pour the contents of one single-use packet in 10 milliliters (mL) of water and
      mix by swirling the mixing cup carefully and slowly in a circle for 45 seconds.
      Do not shake the cup.
    - Use the dosing syringe that comes with the package to measure the right dose.
    - The dose should be taken within 30 minutes after mixing the suspension.
    - Throw away any remaining suspension.
  - type: paragraph
    text: Do not substitute the chewable tablets or oral suspension with the film-coated
      tablets . Ask your doctor or pharmacist if you have any questions.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For treatment of HIV infection (patient already had HIV treatment): For oral
        dosage form (Isentress® film-coated tablets): Adults—400 milligrams (mg) two
        times a day. For patients who are also taking rifampin, the dose is usually
        800 mg (two 400 mg tablets) two times a day. Children—Use and dose must be
        determined by your doctor.'
      - 'For treatment of HIV infection (patient never had HIV treatment): For oral
        dosage form (chewable tablets): Children weighing 40 kilograms (kg) or more—300
        milligrams (mg) (three 100 mg tablets) two times a day. Children weighing
        less than 40 kg—Dose is based on body weight and must be determined by your
        doctor: Weighing 28 to less than 40 kg—The dose is usually 200 mg (two 100
        mg tablets) two times a day. Weighing 25 to less than 28 kg—The dose is usually
        150 mg (one and a half 100 mg tablets) two times a day. Children 4 weeks of
        age and older—Dose is based on body weight and must be determined by your
        doctor: Weighing 20 to less than 25 kg—The dose is usually 150 mg (one and
        a half 100 mg tablets) two times a day. Weighing 14 to less than 20 kg—The
        dose is usually 100 mg two times a day. Weighing 10 to less than 14 kg—The
        dose is usually 75 mg (three 25 mg tablets) two times a day. Children 4 weeks
