        7 to 10 days.
      - Knee surgery—75 International Units (IU) per kilogram (kg) of body weight
        given after surgery once a day for 7 to 10 days.
    - type: list
      ordered: false
      items:
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For treatment of deep venous thrombosis (leg clots) with or without pulmonary
        embolism (lung clots): Adults—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 175 International Units (IU) per kilogram
        (kg) of body weight injected under the skin once a day for 6 to 7 days. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Dose is based on body weight and must be determined by your doctor.
        The dose is usually 175 International Units (IU) per kilogram (kg) of body
        weight injected under the skin once a day for 6 to 7 days.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away used needles in a hard, closed container that the needles cannot
        poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests will be needed to
      check for unwanted effects. Be sure to keep all appointments.
  - type: paragraph
    text: This medicine may cause a serious type of allergic reaction called anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Tell your doctor right away if you have a rash; itching; swelling of the face,
      tongue, and throat; trouble breathing; or chest pain after you receive this
      medicine.
  - type: paragraph
    text: Make sure your doctor knows if you have had an allergic reaction to heparin,
      sulfites, benzyl alcohol, or pork products.
  - type: paragraph
    text: Tinzaparin may increase your chance of bleeding or bruising. This risk is
      higher if you have a catheter in your back for pain medicine or anesthesia (sometimes
      called an "epidural"), or if you have kidney problems. The risk of bleeding
      increases as the severity of your kidney problems increases. Check with your
      doctor right away if you notice any unusual bleeding or bruising; black, tarry
      stools; bleeding gums; blood in the urine or stools; or pinpoint red spots on
      your skin.
  - type: paragraph
    text: You may bleed and bruise more easily while you are using this medicine.
      Stay away from rough sports or other situations where you could be bruised,
      cut, or injured. Be careful when using sharp objects, including razors and fingernail
      clippers. Avoid nose picking and forceful nose blowing.
  - type: paragraph
    text: Be careful when using a regular toothbrush, dental floss, or toothpick.
      Your medical doctor, dentist, or nurse may recommend other ways to clean your
      teeth and gums. Check with your medical doctor before having any dental work
      done.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using tinzaparin several days before having
      surgery or medical tests.
  - type: paragraph
    text: This medicine contains benzyl alcohol which may cause serious reactions
      to newborn or premature infants. Discuss this with your doctor if you are concerned.
  - type: paragraph
    text: Do not take or discontinue other medicines unless they have been discussed
      with your doctor. This includes prescription or nonprescription (over-the-counter
      [OTC]) medicines, and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Deep, dark purple bruise, pain, or swelling at the place of injection
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bleeding gums
      - blood in the urine
      - bloody or cloudy urine
      - blurred vision
      - chest pain
      - chest tightness
      - chills
      - confusion
      - cough
      - coughing up blood
      - difficulty with breathing or swallowing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fast, slow, or irregular heartbeat
      - fever
      - frequent urge to urinate
      - headache
      - increased menstrual flow or vaginal bleeding
      - lower back or side pain
      - nosebleeds
      - pain or burning while urinating
      - painful or difficult urination
      - pale skin
      - palpitations
      - paralysis
      - pounding in the ears
      - prolonged bleeding from cuts
      - red or black, tarry stools
      - red or dark brown urine
      - severe or continuing dull nervousness
      - shortness of breath
      - skin rash
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - sweating
      - swollen glands
      - troubled breathing, exertional
      - unexplained pain, swelling, or discomfort, especially in the chest, abdomen
        or stomach, joints, or muscles
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting of blood or material like coffee grounds
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blue-green to black skin discoloration
      - bowel or bladder dysfunction
      - hives
      - itching
      - leg weakness
      - numbness
      - pain, redness, or sloughing of the skin at the place of injection
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - wheezing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - accumulation of pus
      - break in the skin, especially associated with blue-black discoloration, swelling,
        or drainage of fluid
      - change in vision
      - clay-colored stools
      - collection of blood under the skin
      - diarrhea
      - excessive thirst
      - general feeling of discomfort or illness
      - hoarseness
      - large, flat, blue or purplish patches in the skin
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss of appetite
      - muscle cramps
      - numbness and tingling of the face, fingers, or toes
      - pain in the arms, legs, or lower back, especially pain in the calves or heels
        upon exertion
      - pain, redness, or swelling
      - painful knees and ankles
      - pale, bluish-colored, or cold hands or feet
      - problems with vision or hearing
      - raised, red swellings on the skin, buttocks, legs or ankles
      - red or irritated eyes
      - redness, tenderness, burning, blistering, or peeling of the skin (usually
        on the backs of arms and the fronts of legs, mouth, eyes, hands, or feet)
      - seeing floating spots before the eyes
      - swollen, red, or tender area of infection
      - unpleasant breath odor
      - weak or absent pulses in the legs
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - nausea and vomiting
      - prolonged, painful, or inappropriate erection of the penis
      - trouble with sleeping
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hives or welts
      - redness of the skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
