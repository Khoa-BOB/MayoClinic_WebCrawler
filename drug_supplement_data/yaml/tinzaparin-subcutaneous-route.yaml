title: Tinzaparin (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Innohep
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Tinzaparin is used for the treatment of deep venous thrombosis, a condition
      in which harmful blood clots form in the blood vessels of the legs. These blood
      clots can travel to the lungs and can become lodged in the blood vessels of
      the lungs, causing a condition called pulmonary embolism. Tinzaparin is used
      for several days after surgery, while you are unable to walk. It is during this
      time that blood clots are most likely to form. Tinzaparin also may be used for
      other conditions as determined by your doctor.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of tinzaparin in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of tinzaparin in the elderly. However,
        elderly patients are more likely to have age-related kidney problems, which
        may require an adjustment in the dose for patients receiving tinzaparin.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Defibrotide
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abciximab
      - Aceclofenac
      - Acemetacin
      - Acenocoumarol
      - Alipogene Tiparvovec
      - Alteplase, Recombinant
      - Amtolmetin Guacil
      - Anagrelide
      - Anistreplase
      - Antithrombin, Recombinant
      - Apixaban
      - Argatroban
      - Aspirin
      - Bemiparin
      - Betrixaban
      - Bivalirudin
      - Bromfenac
      - Bufexamac
      - Caplacizumab-yhdp
      - Celecoxib
      - Choline Salicylate
      - Citalopram
      - Clonixin
      - Clopidogrel
      - Collagenase, Clostridium histolyticum
      - Curcumin
      - Dabigatran Etexilate
      - Dalteparin
      - Danaparoid
      - Desvenlafaxine
      - Dexibuprofen
      - Dexketoprofen
      - Dextran
      - Diclofenac
      - Diflunisal
      - Dipyridamole
      - Dipyrone
      - Donanemab-azbt
      - Doxycycline
      - Drotrecogin Alfa
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Major bleeding, active or
      - Thrombocytopenia, heparin-induced (or history of)—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Blood disease or bleeding problems or
      - Catheter insertion in your spine or
      - Eye problems caused by diabetes or high blood pressure or
      - Heart infection or
      - Hypertension (high blood pressure), severe and uncontrolled or
      - Liver disease or
      - Stomach or intestinal ulcer, active or history of or
      - Stroke, recent or
      - Surgery (e.g., surgery of the eye, brain, or spine), recent or history of
        or
      - Thrombocytopenia—Use with caution. The risk of bleeding may be increased.
    - type: list
      ordered: false
      items:
      - Kidney disease—Effects of tinzaparin may be increased because of slower removal
        of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Prosthetic heart valve—Tinzaparin may not protect these patients from developing
        a blood clot.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given as a shot under your skin, usually in the abdomen.
  - type: paragraph
    text: If you are using tinzaparin at home, your doctor will teach you how to inject
      yourself with the medicine. Be sure to follow the directions carefully. Check
      with your doctor if you have any problems using the medicine.
  - type: paragraph
    text: You will be shown the body areas where this shot can be given. Use a different
      body area each time you give yourself a shot. Keep track of where you give each
      shot to make sure you rotate body areas. This will help prevent skin problems
      from the injections.
  - type: paragraph
    text: If the medicine in the vial (glass container) has changed color, or if you
      see particles in it, do not use it.
  - type: paragraph
    text: Put used syringes in a puncture-resistant, disposable container, or dispose
      of them as directed by your doctor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: For prevention of deep venous thrombosis (leg
        clots) due to surgery: Adults General surgery—3500 International Units (IU)
        given 2 hours before surgery then 3500 IU once a day for 7 to 10 days. Hip
        surgery—50 International Units (IU) per kilogram (kg) of body weight given
        2 hours before surgery then 50 IU per kg of body weight once a day for 7 to
        10 days, or 75 IU per kg of body weight given after surgery once a day for
        7 to 10 days. Knee surgery—75 International Units (IU) per kilogram (kg) of
        body weight given after surgery once a day for 7 to 10 days. Children—Use
        and dose must be determined by your doctor. For treatment of deep venous thrombosis
        (leg clots) with or without pulmonary embolism (lung clots): Adults—Dose is
        based on body weight and must be determined by your doctor. The dose is usually
        175 International Units (IU) per kilogram (kg) of body weight injected under
        the skin once a day for 6 to 7 days. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For prevention of deep venous thrombosis (leg clots) due to surgery: Adults
        General surgery—3500 International Units (IU) given 2 hours before surgery
        then 3500 IU once a day for 7 to 10 days. Hip surgery—50 International Units
        (IU) per kilogram (kg) of body weight given 2 hours before surgery then 50
        IU per kg of body weight once a day for 7 to 10 days, or 75 IU per kg of body
        weight given after surgery once a day for 7 to 10 days. Knee surgery—75 International
        Units (IU) per kilogram (kg) of body weight given after surgery once a day
        for 7 to 10 days. Children—Use and dose must be determined by your doctor.'
    subsections: []
  - heading: Adults
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - General surgery—3500 International Units (IU) given 2 hours before surgery
        then 3500 IU once a day for 7 to 10 days.
      - Hip surgery—50 International Units (IU) per kilogram (kg) of body weight given
        2 hours before surgery then 50 IU per kg of body weight once a day for 7 to
