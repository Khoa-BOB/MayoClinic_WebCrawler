title: Oxytocin (intravenous route, intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Pitocin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Oxytocin is a hormone used to help start or continue labor and to control
      bleeding after delivery. It is also sometimes used to help milk secretion in
      breast-feeding.
  - type: paragraph
    text: Oxytocin may also be used for other conditions as determined by your doctor.
  - type: paragraph
    text: In general, oxytocin should not be used to start labor unless there are
      specific medical reasons. Be sure you have discussed this with your doctor before
      receiving this medicine.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: Novartis Pharmaceuticals removed Syntocinon® nasal spray from the market
      in March 1995.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of oxytocin in the pediatric population. Safety and efficacy have not been
        established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of oxytocin in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies suggest that this medication may alter milk production or composition.
        If an alternative to this medication is not prescribed, you should monitor
        the infant for side effects and adequate milk intake.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Ephedrine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems (e.g., subarachnoid hemorrhage) or
      - Hypertension (high blood pressure)—May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Cephalopelvic disproportion or
      - Cervical cancer or
      - Fetal distress or
      - Grand multiparity (giving birth more than five times) or
      - Major surgery on the cervix or uterus (e.g., caesarean delivery), history
        of or
      - Overdistended uterus or
      - Premature fetus or
      - Problems with uterine contraction (e.g., uterine atony, strong uterine contractions)
        or
      - Toxemia, severe or
      - Unfavorable fetal position (e.g., transverse lies) or
      - Other conditions that may require caesarean delivery (e.g., cord prolapse,
        total placenta previa, vasa previa, or during an emergency)—Should not be
        used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. Effects may be increased because of slower
        removal of this medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given through a needle placed in one of your veins or as a
      shot into one of your muscles.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Oxytocin can be very useful for helping labor. However, there are certain
      risks with using it. Oxytocin causes contractions of the uterus. In women who
      are unusually sensitive to its effects, these contractions may become too strong.
      In rare cases, this may lead to tearing of the uterus. Also, if contractions
      are too strong, the supply of blood and oxygen to the fetus may be decreased.
  - type: paragraph
    text: Oxytocin may cause jaundice and eye problems such as retinal hemorrhage
      in some newborn infants. If you have concerns about this, ask your doctor.
  - type: paragraph
    text: This medicine may cause a serious condition called water intoxication. Tell
      your doctor right away if you start having have confusion, drowsiness, headache,
      or seizures while you are receiving this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - convulsions (seizures)
      - difficulty in breathing
      - dizziness
      - fast or irregular heartbeat
      - headache (continuing or severe)
      - hives
      - pelvic or abdominal pain (severe)
      - skin rash or itching
      - vaginal bleeding (increased or continuing)
      - weakness
      - weight gain (rapid)
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal pain or cramping
      - blood clotting problem that causes prolonged bleeding
      - chest pain or discomfort
      - cough
      - difficulty swallowing
      - extra heartbeats
      - fainting
      - lightheadedness
      - pounding or rapid pulse
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - severe bleeding after giving birth
      - shortness of breath
      - tightness in the chest
      - unusual tiredness or weakness
      - wheezing
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Restlessness
      - shakiness
      - sleepiness
      - slow to respond
      - slurred speech
      - unconsciousness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
