      - Amitriptylinoxide
      - Amoxapine
      - Amphetamine
      - Anileridine
      - Apraclonidine Hydrochloride
      - Arformoterol Tartrate
      - Armodafinil
      - Artesunate
      - Asenapine
      - Atomoxetine Hydrochloride
      - Benzhydrocodone
      - Benzphetamine
      - Benzthiazide
      - Berotralstat
      - Brimonidine Tartrate
      - Brompheniramine
      - Buprenorphine
      - Bupropion
      - Buspirone
      - Butorphanol
      - Calcium Carbonate
      - Capivasertib
      - Carbamazepine
      - Celecoxib
      - Chlorothiazide
      - Chlorpheniramine
      - Chlorpromazine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Agitation, severe or
      - Alcohol or drug abuse, history of or
      - Anxiety, severe or
      - Heart attack, recent or
      - Heart failure or
      - Heart rhythm problems (eg, arrhythmia, ventricular arrhythmia), or family
        history of or
      - Hypertension (high blood pressure), moderate to severe or
      - Bipolar disorder (manic-depressive illness), or a family history of or
      - Blood vessel problems (eg, Raynaud disease) or
      - Depression, or a family history of or
      - Hypertension (high blood pressure), mild or
      - Mania, history of or
      - Psychosis (mental illness), history of or
      - Seizures, history of or
      - Stroke, history of or
      - Tourette syndrome, or family history of—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease (eg, cardiomyopathy, coronary artery disease)
        or
      - Heart rhythm problems, severe—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe (eg, end stage kidney disease)—Use with caution. The
        effects may be increased because of slower removal of the medicine from the
        body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use it for a longer time than your doctor
      ordered.
  - type: paragraph
    text: This medicine should come with a Medication Guide and patient instructions.
      Read and follow these instructions carefully. Ask your doctor if you have any
      questions. Ask your pharmacist for the Medication Guide if you do not have one.
  - type: paragraph
    text: 'To use the skin patch:'
  - type: list
    ordered: false
    items:
    - Make sure you wash your hands with soap and water after applying the patch.
      Do not use a hand sanitizer in place of soap and water.
    - Do not use the patch if it is cut or damaged. When handling the skin patch,
      be careful not to touch the adhesive (sticky) surface with your hand. The adhesive
      part of the system contains some dextroamphetamine which can be absorbed into
      your body too fast through the skin of your hand. Wash your hands with soap
      and water if you accidentally touch the sticky side of the patch. Apply the
      patch right away after removing it from the protective pouch.
    - Apply the patch 2 hours before the needed effect and remove it after 9 hours.
      Do not wear patches for longer than 9 hours a day total. Choose a different
      place on your skin to apply the new patch. Do not put a new patch in the same
      place for at least one day (24 hours). Do not leave the patch on for more than
      9 hours. It will not work as well after that time and it may irritate your skin.
    - Apply the patch to a clean, dry, and healthy skin area on your chest, hip, flank
      (side of the waist), upper arm, or upper back. Choose an area that is free of
      scars, cuts, burns, rashes, that has very little to no hair, or any other skin
      irritation. Avoid putting the patch on areas where it could be rubbed by tight
      clothing (eg, waistbands or straps). Do not shave the skin where you will apply
      the patch. You may cut the hair with a pair of scissors.
    - Remove the liner covering the sticky side of the skin patch. Place the sticky
      side against the skin. Slowly peel the clear liner while applying gentle pressure
      with fingers of your other hand to smooth the patch firmly in place, press the
      patch firmly with the palm of your hands to make sure there is good contact
      with your skin, especially around the edges of the patch.
    - Do not put lotion, gel, oil, or powder on the skin area where the patch will
      be placed. Do not expose the application site to direct heat (including hair
      dryer, heating pad or electric blankets, heat lamps, saunas, hot tubs, and heated
      water beds).
    - The patch might come off if you go swimming or take a bath or shower. If the
      edges lift, smooth down the patch and press firmly with the palm of your hand.
      Do not reapply with dressings, tape, or other adhesives. If the patch falls
      off after applying it, throw it away and apply a new patch in a different area.
    - You may apply oil-based product or water and soap to remove any glue on your
      skin.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For transdermal dosage form (skin patch): For attention-deficit hyperactivity
        disorder (ADHD): Adults—At first, 9 milligrams (mg) for 9 hours per day. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than 18 mg for 9 hours per day. Children 6 years of age and older—At first,
        4.5 mg for 9 hours per day. Your doctor may adjust your dose as needed. However,
        the dose is usually not more than 18 mg for 9 hours per day. Children younger
        than 6 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For attention-deficit hyperactivity disorder (ADHD): Adults—At first, 9 milligrams
        (mg) for 9 hours per day. Your doctor may adjust your dose as needed. However,
        the dose is usually not more than 18 mg for 9 hours per day. Children 6 years
        of age and older—At first, 4.5 mg for 9 hours per day. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 18 mg for
        9 hours per day. Children younger than 6 years of age—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 9 milligrams (mg) for 9 hours per day. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 18 mg for
        9 hours per day.
      - Children 6 years of age and older—At first, 4.5 mg for 9 hours per day. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than 18 mg for 9 hours per day.
      - Children younger than 6 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you forget to wear or change a patch, put one on as soon as you can.
        If it is almost time to put on your next patch, wait until then to apply a
        new patch and skip the one you missed. Do not apply extra patches to make
        up for a missed dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the patches in the original package.
    - type: paragraph
      text: After removing a used patch, fold the patch in half with the sticky sides
        together. Make sure to dispose of it out of the reach of children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood tests
      may be needed to check for any unwanted effects.
  - type: paragraph
    text: Do not use this medicine if you are using or have used an MAO inhibitor
      (MAOI), including isocarboxazid [Marplan®], linezolid [Zyvox®], phenelzine [Nardil®],
      selegiline [Eldepryl®], tranylcypromine [Parnate®]), within the past 14 days.
  - type: paragraph
    text: This medicine may cause serious heart or blood vessel problems. This may
      be more likely in patients who have a family history of heart disease. Check
      with your doctor right away if you or your child have chest pain, trouble breathing,
      or fainting while taking this medicine.
  - type: paragraph
    text: You or your child will also need to have your blood pressure and heart rate
      measured before starting this medicine and while you are using it. If you notice
      any change in your blood pressure, call your doctor right away. If you have
      questions about this, talk to your doctor.
  - type: paragraph
    text: This medicine may cause some people to feel a false sense of well-being
      or to become dizzy, lightheaded, or less alert than they are normally. It may
      also cause blurred vision or other vision problems. Do not drive or do anything
      else that could be dangerous until you or your child know how this medicine
      affects you .
  - type: paragraph
    text: 'If you or your child have been using this medicine for a long time and
      you think you may have become mentally or physically dependent on it, check
      with your doctor. Some signs that you may be dependent on dextroamphetamine
      are:'
  - type: list
    ordered: false
    items:
    - A strong desire or need to continue taking the medicine.
    - A need to increase the dose to receive the effects of the medicine.
    - Withdrawal effects (for example, mental depression, nausea or vomiting, stomach
      cramps or pain, trembling, unusual tiredness or weakness) that occur after the
      medicine is stopped.
  - type: paragraph
    text: Tell your doctor right away if you or your family notices any unusual changes
      in behavior, such as an increase in aggression, hostility, agitation, irritability,
      or suicidal thinking or behaviors. Also tell your doctor if you or your child
      have hallucinations or any unusual thoughts, especially if they are new or getting
      worse quickly .
  - type: paragraph
    text: 'Symptoms of an overdose include: aggressive, agitation, angry, blurred
      vision, change in consciousness, chest pain or discomfort, confusion, dark urine,
      diarrhea, dizziness, faintness, or lightheadedness when getting up suddenly
      from a lying or sitting position, fast, pounding, or irregular heartbeat or
      pulse, fever, headache, inability to speak, loss of consciousness, muscle cramps,
      spasms, pains, or stiffness, nausea, nervousness, overactive reflexes, pain
      or discomfort in the arms, jaw, back, or neck, pale, clammy skin, palpitations,
      panic state, pounding in the ears, restlessness, seeing, hearing, or feeling
      things that are not there, seizures, shakiness in the legs, arms, hands, or
      feet, shivering, slow or fast heartbeat, slurred speech, sweating, talking or
      acting with excitement you cannot control, temporary blindness, thirst, trembling
      or shaking of hands or feet,  trouble breathing, unusual tiredness or weakness,
      vomiting, or weakness in the arm or leg on one side of the body, sudden and
      severe . Call your doctor right away if you notice these symptoms.'
  - type: paragraph
    text: This medicine may cause slow growth and weight loss in children. If your
      child is using this medicine, the doctor will need to keep track of your child's
      height and weight to make sure that your child is growing properly.
  - type: paragraph
    text: This medicine may cause Raynaud's phenomenon, which is a problem with blood
      circulation in the fingers or toes. Tell your doctor if you or your child have
      tingling or pain, a cold feeling, paleness, or skin color changes in the fingers
      or toes, especially when exposed to cold temperatures. Call your doctor right
      away if you have unexplained sores or ulcers on your fingers or toes .
  - type: paragraph
    text: Check with your doctor right away if you or your child have anxiety, restlessness,
      a fast heartbeat, fever, sweating, muscle spasms, twitching, nausea, vomiting,
      diarrhea, or see or hear things that are not there. These may be symptoms of
      a serious condition called serotonin syndrome. Your risk may be higher if you
      also take certain other medicines that affect serotonin levels in your body.
  - type: paragraph
    text: This medicine may cause skin site reactions, including allergic contact
      dermatitis. Check with your doctor right away if you have blistering, burning,
      crusting, dryness, or flaking of the skin or itching, scaling, severe redness,
      soreness, or swelling of the skin where the patch is applied.
  - type: paragraph
    text: Keep the patch away from heat, including hair dryer, heating pads, electric
      blankets, or water beds.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines,
      herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
