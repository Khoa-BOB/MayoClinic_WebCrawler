title: Dextroamphetamine (transdermal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Xelstrym
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Dextroamphetamine transdermal patch is used to treat attention-deficit hyperactivity
      disorder (ADHD). It belongs to the group of medicines called central nervous
      system (CNS) stimulants.
  - type: paragraph
    text: Dextroamphetamine works in the treatment of ADHD by increasing attention
      and decreasing restlessness in children and adults who are overactive, cannot
      concentrate for very long, or are easily distracted and impulsive. This medicine
      is used as part of a total treatment program that also includes social, educational,
      and psychological treatment.
  - type: paragraph
    text: This medicine is available only with a doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Patch, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of dextroamphetamine transdermal patch in children younger
        than 6 years of age. However, children are more likely to have unwanted effects
        (eg, weight loss, slow growth). Use in children younger than 6 years of age
        is not recommended.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of dextroamphetamine transdermal
        patch in the elderly. However, elderly patients are more likely to have age-related
        kidney, liver, or heart problems, which may require caution and an adjustment
        in the dose for patients receiving dextroamphetamine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
      - Linezolid
      - Methylene Blue
      - Ozanimod
      - Phenelzine
      - Pimozide
      - Procarbazine
      - Rasagiline
      - Safinamide
      - Selegiline
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Acetazolamide
      - Adagrasib
      - Albuterol Sulfate
      - Alfentanil
      - Almotriptan
