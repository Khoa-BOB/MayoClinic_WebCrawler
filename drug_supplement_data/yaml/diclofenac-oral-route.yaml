      - red irritated eyes
      - red skin lesions, often with a purple center
      - redness, soreness, or itching skin
      - sensation of spinning
      - shakiness in the legs, arms, hands, or feet
      - sleepiness or unusual drowsiness
      - stiff neck or back
      - trembling or shaking of the hands or feet
      - trouble concentrating
      - trouble sleeping
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - blurred vision
      - change in consciousness
      - change in the ability to see colors, especially blue or yellow
      - confusion
      - depression
      - difficult or trouble breathing
      - hives
      - hostility
      - irregular, fast or slow, or shallow breathing
      - irritability
      - loss of consciousness
      - muscle twitching
      - nervousness
      - pain or discomfort in the chest, upper stomach, or throat
      - pale or blue lips, fingernails, or skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid weight gain
      - seizures
      - sleepiness
      - slow or fast heartbeat
      - stupor
      - swelling of the face, ankles, or hands
      - tightness in the chest
      - trouble sleeping
      - unusual drowsiness, dullness, or feeling of sluggishness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
