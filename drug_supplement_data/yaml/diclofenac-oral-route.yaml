    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to bovine protein—Zipsor® capsule contains gelatin and should not
        be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Anemia or
      - Bleeding problems or
      - Blood clots or
      - Congestive heart failure or
      - Edema (fluid retention) or
      - Heart attack, history of or
      - Heart or blood vessel disease or
      - Hypertension (high blood pressure) or
      - Kidney disease or
      - Porphyria (blood disorder) or
      - Stomach ulcers or bleeding, history of or
      - Stroke, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Aspirin-sensitive asthma, history of or
      - Aspirin sensitivity, history of or
      - Kidney disease, severe—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Hypovolemia—Must be corrected first before using this medicine.
    - type: list
      ordered: false
      items:
      - Heart surgery (eg, coronary artery bypass graft [CABG] surgery)—Should not
        be used to relieve pain right before or after the surgery.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Keep using this medicine for the full time of treatment . However, do not
      use this medicine more often or for a longer time than your doctor ordered.
      This medicine is not for long-term use.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: When used for severe or continuing arthritis , this medicine must be taken
      every day as ordered by your doctor in order for it to help you. This medicine
      usually begins to work within one week, but in severe cases up to two weeks
      or longer may pass before you begin to feel better. Several weeks may pass before
      you feel the full effects of this medicine.
  - type: paragraph
    text: You may take this medicine with or without food. However, diclofenac capsules
      should be taken on an empty stomach.
  - type: paragraph
    text: 'To use the oral solution :'
  - type: list
    ordered: false
    items:
    - Open the packet of medicine right before you use it.
    - Empty the contents of the packet into a cup with 1 to 2 ounces (30 to 60 milliliters
      [mL]) of water. Do not use any liquid other than water for mixing the medicine.
    - Mix well and drink it immediately on an empty stomach.
  - type: paragraph
    text: Use only the brand of this medicine that your doctor prescribed. Different
      brands may not work the same way.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (Zipsor® capsules): For acute pain: Adults and children
        12 years of age and older—25 milligrams (mg) 4 times a day. Children younger
        than 12 years of age—Use and dose must be determined by your doctor.'
      - 'For oral dosage form (Zorvolex® capsules): For acute pain: Adults—18 or 35
        milligrams (mg) 3 times a day. Children—Use and dose must be determined by
        your doctor. For osteoarthritis: Adults—35 milligrams (mg) 3 times a day.
        Children—Use and dose must be determined by your doctor.'
      - 'For oral dosage forms (delayed-release tablets, enteric-coated tablets):
        For ankylosing spondylitis: Adults—25 milligrams (mg) 4 times a day, with
        an extra 25 mg dose at bedtime if necessary. Children—Use and dose must be
        determined by your doctor. For osteoarthritis: Adults—50 milligrams (mg) 2
        or 3 times a day, or 75 mg two times a day. Children—Use and dose must be
        determined by your doctor. For rheumatoid arthritis: Adults—50 milligrams
        (mg) 3 or 4 times a day, or 75 mg two times a day. Children—Use and dose must
        be determined by your doctor.'
      - 'For oral dosage form (immediate-release tablets): For osteoarthritis: Adults—50
        milligrams (mg) 2 or 3 times a day. Children—Use and dose must be determined
        by your doctor. For pain or menstrual cramps: Adults—50 milligrams (mg) 3
        times a day. Your doctor may direct you to take 100 mg for the first dose
        only. Children—Use and dose must be determined by your doctor. For rheumatoid
        arthritis: Adults—50 milligrams (mg) 3 or 4 times a day. Children—Use and
        dose must be determined by your doctor.'
      - 'For oral dosage form (solution): For migraine headaches: Adults—One packet
        (50 milligrams) as a single, one time dose. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For acute pain: Adults and children 12 years of age and older—25 milligrams
        (mg) 4 times a day. Children younger than 12 years of age—Use and dose must
        be determined by your doctor.'
    - type: list
