title: Memantine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Namenda
    - type: paragraph
      text: Namenda XR
    - type: paragraph
      text: Namenda XR Titration Pack
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Memantine is used to treat moderate to severe Alzheimer's disease. Memantine
      is not a cure for Alzheimer's disease but it can help people with the disease.
      Memantine will not cure Alzheimer's disease, and it will not stop the disease
      from getting worse.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Solution
    - Capsule, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of memantine
        have not been performed in the pediatric population.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of memantine in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acetazolamide
      - Amantadine
      - Azathioprine
      - Brinzolamide
      - Bupropion
      - Dextromethorphan
      - Dorzolamide
      - Ketamine
      - Levoketoconazole
      - Mercaptopurine
      - Methazolamide
      - Methotrexate
      - Sodium Bicarbonate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Epilepsy or seizures or
      - Urinary tract problems (e.g., bladder problems, difficulty with urination)—Use
        with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions in the insert carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the extended-release capsules whole. Do not break, crush, or chew
      them.
  - type: paragraph
    text: If you cannot swallow the extended-release capsule , you may open it and
      pour the medicine into a small amount of soft food such as applesauce. Stir
      this mixture well and swallow it without chewing.
  - type: paragraph
    text: 'For patients taking the oral liquid :'
  - type: list
    ordered: false
    items:
    - Remove the oral dosing syringe along with the cap and plastic tube from the
      bag and attach to tube to the cap.
    - Open the child-resistant cap on the bottle by pushing down on the cap while
      turning the cap counter-clockwise (to the left) and remove the cap and seal
      from the bottle.
    - Insert the plastic tube fully into the bottle and screw the cap tightly onto
      the bottle by turning the cap clockwise (to the right).
    - Keeping the bottle upright on the table, remove the lid to uncover the opening
      on the top of the cap. With the plunger fully depressed, insert the tip of the
      syringe firmly into the opening of the cap.
    - While holding the syringe, gently pull the plunger of the syringe up to draw
      medicine into the syringe.
    - Remove the syringe from the cap opening. Invert the syringe (point tip upwards)
      and slowly press the plunger to a level that pushed out any large air bubbles
      that may be present. Keep the plunger in this position.
    - Re-insert the tip of the syringe into the cap opening. While holding the syringe,
      continue to gently pull out the plunger until the bottom of the black ring of
      the plunger reaches the appropriate mark on the syringe that corresponds to
      the dose prescribed.
    - Remove the syringe from the bottle and swallow the oral solution directly from
      the syringe. Do not mix with any other liquid.
    - After use, reseal the bottle by snapping the attached lid closed.
    - Rinse the empty syringe by inserting the open end of the syringe into a glass
      of water, pulling the plunger out to draw in water, and pushing the plunger
      in to remove the water. Repeat several times. Allow the syringe to air dry.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For treatment of Alzheimer''s disease: For oral dosage form (extended-release
        capsules): Adults—At first, 7 milligrams (mg) once a day. Your doctor may
        gradually increase your dose as needed. However, the dose is usually not more
        than 28 mg per day. Children—Use and dose must be determined by your doctor.
        For oral dosage form (solution and tablets): Adults—At first, 5 milligrams
        (mg) once a day. Your doctor may gradually increase your dose as needed. However,
        the dose is usually not more than 10 mg two times a day. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release capsules): Adults—At first, 7 milligrams
        (mg) once a day. Your doctor may gradually increase your dose as needed. However,
        the dose is usually not more than 28 mg per day. Children—Use and dose must
        be determined by your doctor.'
      - 'For oral dosage form (solution and tablets): Adults—At first, 5 milligrams
        (mg) once a day. Your doctor may gradually increase your dose as needed. However,
        the dose is usually not more than 10 mg two times a day. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 7 milligrams (mg) once a day. Your doctor may gradually increase
        your dose as needed. However, the dose is usually not more than 28 mg per
        day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—At first, 5 milligrams (mg) once a day. Your doctor may gradually increase
        your dose as needed. However, the dose is usually not more than 10 mg two
        times a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly and to check for unwanted
      effects.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - blurred vision
      - dizziness
      - headache
      - nervousness
      - pounding in the ears
      - rapid weight gain
      - slow or fast heartbeat
      - tingling of the hands or feet
      - unusual weight gain or loss
    subsections: []
