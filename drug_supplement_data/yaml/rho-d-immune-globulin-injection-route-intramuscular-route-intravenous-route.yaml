- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Rho(D) immune globulin is used to treat immune thrombocytopenic purpura
      (ITP) in patients with Rh-positive blood. ITP is a type of blood disorder where
      the person has a very low number of platelets. Platelets help to clot the blood.
      Rho(D) immune globulin is also used to prevent antibodies from forming after
      a person with Rh-negative blood receives a transfusion with Rh-positive blood,
      or during pregnancy when a mother has Rh-negative blood and the baby is Rh-positive.
      It belongs to a group of medicines called immunizing agents. Rho(D) immune globulin
      works to boost the immune system and prevent excessive bleeding.
  - type: paragraph
    text: The Rh factor is one part of the red blood cell. A person has either Rh-positive
      or Rh-negative blood. If you receive the opposite type of blood, your body will
      create antibodies that can destroy the red blood cells. When a pregnant woman
      is Rh-negative and her baby is Rh-positive, the baby's blood can get into her
      system and cause her to make antibodies. When the same woman has a second baby
      with Rh-positive blood, the antibodies will destroy the red blood cells in the
      baby. Rho(D) immune globulin is given to these women during pregnancy or after
      delivery to prevent them from making antibodies.
  - type: paragraph
    text: This medicine is to be administered only by or under the supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Rho(D) immune globulin in children.
        It is not recommended for an infant with Rh-positive blood whose mother is
        Rh-negative.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of Rho(D) immune globulin have not been performed in the geriatric population,
        geriatric-specific problems are not expected to limit the usefulness of Rho(D)
        immune globulin in the elderly. However, elderly patients are more likely
        to have age-related heart, kidney, or liver problems, and might have conditions
        that require an adjustment in the dose for patients receiving Rho(D) immune
        globulin.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia, severe or
      - Blood clotting problems, history of or
      - Breathing problems, severe or
      - Disseminated intravascular coagulation (blood clotting problem) or
      - Kidney problems or
      - Pulmonary edema (fluid in the lungs), history of—Use with caution. May make
        these conditions worse.
    - type: list
      ordered: false
      items:
      - Atherosclerosis (hardening of the arteries), history of or
      - Heart or blood vessel problems or
      - Hyperviscosity (thick blood), history of or
      - Stroke—Use with caution. May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Autoimmune hemolytic anemia (bleeding problem) or
      - Hemolysis, active (red blood cells are being destroyed) or
      - Immunoglobulin A (IgA) deficiency with antibodies against IgA—Should not be
        used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Diabetes—The liquid form of WinRho® contains maltose. Some glucose testing
        systems will not work properly if maltose is in the blood. Discuss this with
        your doctor.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. This medicine is given through a needle placed in one of your
      veins or as a shot into one of your muscles.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child at regular visits for any problems or unwanted effects that may be caused
      by this medicine. Blood and urine tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: Check with your doctor right away if you or your child have back pain; shaking
      chills; a fever; dark urine; a decreased amount of urine; a sudden weight gain;
      swelling of the hands or feet; or shortness of breath after receiving this medicine.
      These may be symptoms of a serious blood problem called intravascular hemolysis
      (IVH).
  - type: paragraph
    text: This medicine is made from donated human blood. Some human blood products
      have transmitted certain viruses to people who have received them. The risk
      of getting a virus from medicines made from human blood has been greatly reduced
      in recent years. This is the result of required testing of human donors for
      certain viruses, and testing during the making of these medicines. Although
      the risk is low, talk with your doctor if you have concerns.
  - type: paragraph
    text: This medicine may cause serious types of allergic reactions, including anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Tell your doctor right away if you or your child have itching, a rash, hives,
      chest pain, dizziness or lightheadedness, trouble breathing, or any swelling
      of your hands, face, or mouth after you receive this medicine.
  - type: paragraph
    text: This medicine may cause blood clots, especially in patients with a history
      of blood clotting problems, heart disease, and atherosclerosis (hardening of
      the arteries) or circulation problems. Patients who stay in bed for a long time
      because of surgery or illness may also have blood clots. Check with your doctor
      right away if you or your child suddenly have chest pain, shortness of breath,
      a severe headache, leg pain, or problems with vision, speech, or walking.
  - type: paragraph
    text: This medicine may cause a rare and serious lung problem a few hours after
      it is given. Tell your doctor right away if you or your child have any breathing
      problems with or without a fever after you receive the medicine.
  - type: paragraph
    text: While you are being treated with Rho(D) immune globulin, do not have any
      immunizations (vaccines) without your doctor's approval. Live virus vaccines
      should not be given for 3 months after receiving Rho(D) immune globulin.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody urine
      - decreased frequency of urination or amount of urine
      - fever
      - increased blood pressure
      - increased thirst
      - loss of appetite
      - lower back pain
      - nausea or vomiting
      - pale skin
      - swelling of the face, fingers, or lower legs
      - troubled breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Soreness at the place of injection
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
