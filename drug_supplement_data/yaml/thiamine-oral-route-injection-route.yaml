title: Thiamine (oral route, injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Thiamilate
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Vitamins are compounds that you must have for growth and health. They are
      needed in small amounts only and are usually available in the foods that you
      eat. Thiamine (vitamin B 1) is needed for the breakdown of carbohydrates.
  - type: paragraph
    text: 'Some conditions may increase your need for thiamine. These include:'
  - type: list
    ordered: false
    items:
    - Alcoholism
    - Burns
    - Diarrhea (continuing)
    - Fever (continuing)
    - Illness (continuing)
    - Intestinal disease
    - Liver disease
    - Overactive thyroid
    - Stress (continuing)
    - Surgical removal of stomach
  - type: paragraph
    text: 'Also, the following groups of people may have a deficiency of thiamine:'
  - type: list
    ordered: false
    items:
    - Patients using an artificial kidney (on hemodialysis)
    - Individuals who do heavy manual labor on a daily basis
  - type: paragraph
    text: Increased need for thiamine should be determined by your health care professional.
  - type: paragraph
    text: Lack of thiamine may lead to a condition called beriberi. Signs of beriberi
      include loss of appetite, constipation, muscle weakness, pain or tingling in
      arms or legs, and possible swelling of feet or lower legs. In addition, if severe,
      lack of thiamine may cause mental depression, memory problems, weakness, shortness
      of breath, and fast heartbeat. Your health care professional may treat this
      by prescribing thiamine for you.
  - type: paragraph
    text: Thiamine may also be used for other conditions as determined by your health
      care professional.
  - type: paragraph
    text: Claims that thiamine is effective for treatment of skin problems, chronic
      diarrhea, tiredness, mental problems, multiple sclerosis, nerve problems, and
      ulcerative colitis (a disease of the intestines), or as an insect repellant
      or to stimulate appetite have not been proven.
  - type: paragraph
    text: Injectable thiamine is administered only by or under the supervision of
      your health care professional. Other forms of thiamine are available without
      a prescription.
  subsections:
  - heading: Importance Of Diet
    level: 3
    content:
    - type: paragraph
      text: For good health, it is important that you eat a balanced and varied diet.
        Follow carefully any diet program your health care professional may recommend.
        For your specific dietary vitamin and/or mineral needs, ask your health care
        professional for a list of appropriate foods. If you think that you are not
        getting enough vitamins and/or minerals in your diet, you may choose to take
        a dietary supplement.
    - type: paragraph
      text: Thiamine is found in various foods, including cereals (whole-grain and
        enriched), peas, beans, nuts, and meats (especially pork and beef). Some thiamine
        in foods is lost with cooking.
    - type: paragraph
      text: Vitamins alone will not take the place of a good diet and will not provide
        energy. Your body also needs other substances found in food such as protein,
        minerals, carbohydrates, and fat. Vitamins themselves often cannot work without
        the presence of other foods.
    - type: paragraph
      text: The daily amount of thiamine needed is defined in several different ways.
    subsections: []
  - heading: For U.S.—
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Recommended Dietary Allowances (RDAs) are the amount of vitamins and minerals
        needed to provide for adequate nutrition in most healthy persons. RDAs for
        a given nutrient may vary depending on a person's age, sex, and physical condition
        (e.g., pregnancy).
      - Daily Values (DVs) are used on food and dietary supplement labels to indicate
        the percent of the recommended daily amount of each nutrient that a serving
        provides. DV replaces the previous designation of United States Recommended
        Daily Allowances (USRDAs).
    subsections: []
  - heading: For Canada—
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Recommended Nutrient Intakes (RNIs) are used to determine the amounts of vitamins,
        minerals, and protein needed to provide adequate nutrition and lessen the
        risk of chronic disease.
    - type: paragraph
      text: 'Normal daily recommended intakes in milligrams (mg) for thiamine are
        generally defined as follows:'
    - type: paragraph
      text: 'This product is available in the following dosage forms:'
    - type: list
      ordered: false
      items:
      - Suspension
      - Capsule
      - Tablet
      - Solution
    subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'If you are taking this dietary supplement without a prescription, carefully
      read and follow any precautions on the label. For this supplement, the following
      should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Problems in children have not been reported with intake of normal daily
        recommended amounts.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Problems in older adults have not been reported with intake of normal
        daily recommended amounts. Studies have shown that older adults may have lower
        blood levels of thiamine than younger adults. Your health care professional
        may recommend that you take a vitamin supplement that contains thiamine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this dietary supplement,
        it is especially important that your healthcare professional know if you are
        taking any of the medicines listed below. The following interactions have
        been selected on the basis of their potential significance and are not necessarily
        all-inclusive.
    - type: paragraph
      text: Using this dietary supplement with any of the following medicines may
        cause an increased risk of certain side effects, but using both drugs may
        be the best treatment for you. If both medicines are prescribed together,
        your doctor may change the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Capecitabine
      - Doxifluridine
      - Fluorouracil
      - Tegafur
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (tablets, oral solution): To prevent deficiency, the
        amount taken by mouth is based on normal daily recommended intakes: For the
        U.S. Adult and teenage males—1.2 to 1.5 milligrams (mg) per day. Adult and
        teenage females—1 to 1.1 mg per day. Pregnant females—1.5 mg per day. Breast-feeding
        females—1.6 mg per day. Children 7 to 10 years of age—1 mg per day. Children
        4 to 6 years of age—0.9 mg per day. Children birth to 3 years of age—0.3 to
        0.7 mg per day. For Canada Adult and teenage males—0.8 to 1.3 mg per day.
        Adult and teenage females—0.8 to 0.9 mg per day. Pregnant females—0.9 to 1
        mg per day. Breast-feeding females—1 to 1.2 mg per day. Children 7 to 10 years
        of age—0.8 to 1 mg per day. Children 4 to 6 years of age—0.7 mg per day. Children
        birth to 3 years of age—0.3 to 0.6 mg per day. To treat deficiency: Adults
        and teenagers—Treatment dose is determined by prescriber for each individual
        based on the severity of deficiency. The following dosage has been established:
        Beriberi—Oral, 5 to 10 mg three times a day. Children—Treatment dose is determined
        by prescriber for each individual based on the severity of deficiency. The
        following dosage has been established: Beriberi—Oral, 10 a day.'
    - type: list
      ordered: false
      items:
      - 'To prevent deficiency, the amount taken by mouth is based on normal daily
        recommended intakes: For the U.S. Adult and teenage males—1.2 to 1.5 milligrams
