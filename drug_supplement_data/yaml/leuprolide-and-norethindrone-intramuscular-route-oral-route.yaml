        ulceration, or warmth at the injection site
      - blemishes on the skin
      - bloated or full feeling
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - changes in appetite
      - decreased interest in sexual intercourse
      - diarrhea
      - difficulty having a bowel movement (stool)
      - excess air or gas in the stomach or intestines
      - feeling of constant movement of self or surroundings
      - hair loss or thinning of the hair
      - headache, severe and throbbing
      - heartburn
      - inability to have or keep an erection
      - indigestion
      - lack or loss of strength
      - loss in sexual ability, desire, drive, or performance
      - pain or tenderness from the breasts
      - passing gas
      - pimples
      - sensation of spinning
      - stomach discomfort, upset, or pain
      - weight gain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Absent missed or irregular menstrual periods
      - itching of the vagina or genital area
      - pain during sexual intercourse
      - stopping of menstrual bleeding
      - thick, white vaginal discharge with no odor or with a mild odor
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
