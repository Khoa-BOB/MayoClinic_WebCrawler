      - Valdecoxib
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Abnormal uterine bleeding, not diagnosed or
      - Blood clotting disorders, or history of or
      - Breast cancer or other hormone-sensitive cancer, known, suspected, or history
        of or
      - Heart attack, recent or
      - Liver disease or tumors or
      - Stroke—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Alcohol abuse or
      - Blood clotting problems, family history of or
      - Cigarette smoking or
      - Diabetes or
      - Hypercholesterolemia (high cholesterol in the blood) or
      - Hypertension (high blood pressure) or
      - Obesity—Use with caution. May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Asthma, history of or
      - Depression, history of or
      - Epilepsy (seizures) or
      - Fluid retention (body swelling) or
      - Heart or blood vessel disease or
      - Kidney disease or
      - Migraine headache or
      - Papilledema (swelling of the optic disc of the eyes) or
      - Osteoporosis (thinning of the bones) or
      - Retinal vascular lesions (eye problem)—Use with caution. May make these conditions
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: 'Lupaneta Pack® is a kit that contains two medicines: leuprolide injection
      and norethindrone tablets.'
  - type: paragraph
    text: Leuprolide injection is given as a shot into a muscle by a nurse or other
      trained health professional in a hospital or clinic. It is a long acting form
      (depot) that may be given once every month or once every 3 months for up to
      6 months of treatment.
  - type: paragraph
    text: Norethindrone tablets are to be taken by mouth every day for up to 6 months
      after you receive your leuprolide injection.
  - type: paragraph
    text: This medicine usually comes with a patient information leaflet. Read the
      information carefully and make sure you understand them before receiving this
      medicine. If you have any questions, ask your doctor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For pain due to endometriosis: Adults—5 mg
        once a day, for up to 6 months. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For pain due to endometriosis: Adults—5 mg once a day, for up to 6 months.
        Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—5 mg once a day, for up to 6 months.
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the your progress at regular
      visits to make sure that this medicine is working properly.
  - type: paragraph
    text: You should not receive this medicine if you are pregnant or may become pregnant
      . Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control (eg, diaphragm with spermicide, condoms with
      spermicide, IUD) to keep from getting pregnant. If you think you have become
      pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are using this medicine.
  - type: paragraph
    text: This medicine can cause your bone mineral density to decrease, which may
      lead to osteoporosis or weakened bones. Talk with your doctor about how this
      risk will affect you.
  - type: paragraph
    text: Using this medicine may increase your risk of having seizures. Check with
      your doctor right away if you start to have muscle spasm or jerking of the arms
      or legs, sudden loss of consciousness, or loss of bladder control.
  - type: paragraph
    text: This medicine may cause depression. Check with your doctor right away if
      you have discouragement, feeling sad or empty, irritability, lack or appetite,
      loss of interest or pleasure, tiredness, trouble concentrating, or trouble sleeping.
  - type: paragraph
    text: Call your doctor right away if you have sudden loss of vision, double vision,
      bulging eyes, or a migraine headache.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Crying
      - depersonalization
      - dysphoria
      - euphoria
      - feeling of warmth
      - mental depression
      - paranoia
      - quick to react or overreact emotionally
      - rapidly changing moods
      - redness of the face, neck, arms, and occasionally, upper chest
      - sudden sweating
      - swelling
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - bladder pain
      - bloody or cloudy urine
      - blurred vision
      - chest pain or tightness
      - confusion
      - cough
      - dark urine
      - difficult, burning, or painful urination
      - difficulty speaking
      - difficulty swallowing
      - dizziness or lightheadedness
      - double vision
      - fainting
