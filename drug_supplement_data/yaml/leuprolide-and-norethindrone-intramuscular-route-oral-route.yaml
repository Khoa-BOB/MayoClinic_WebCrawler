      - flu-like symptoms
      - frequent urge to urinate
      - headache
      - hives or welts
      - inability to move the arms, legs, or facial muscles
      - increased sensitivity of the skin to sunlight
      - itching
      - joint or muscle pain or stiffness
      - lower back or side pain
      - nausea and vomiting
      - numbness or tingling in the face, arms, or legs
      - pain in the groin or genitals
      - pain, redness, or swelling in the arm or leg
      - pounding in the ears
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness of the skin
      - seizures
      - severe sunburn
      - sharp back pain just below the ribs
      - skin rash
      - slow or fast heartbeat
      - slow speech
      - stomach tenderness
      - sudden shortness of breath or trouble breathing
      - sweating
      - thoughts or attempts at killing oneself
      - trouble breathing
      - trouble sleeping
      - trouble thinking or walking
      - unusual tiredness or weakness
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - being forgetful
      - belching
      - bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
