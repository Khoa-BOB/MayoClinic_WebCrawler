    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Bleeding problems or
      - Congestive heart failure or
      - Crohn's disease, history of or
      - Dehydration or
      - Edema (fluid retention or swelling) or
      - Heart attack, recent or history of or
      - Heart or blood vessel disease or
      - Hyperkalemia (high potassium in the blood) or
      - Hypertension (high blood pressure) or
      - Hypovolemia (low amount of blood) or
      - Liver disease or
      - Stomach ulcers or bleeding, history of or
      - Stroke, history of or
      - Systemic lupus erythematosus (autoimmune disease) or
      - Ulcerative colitis, history of—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Aspirin-sensitive asthma or
      - Aspirin sensitivity, history of or
      - Kidney disease, severe—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Hypovolemia—Must be corrected first before using this medicine.
    - type: list
      ordered: false
      items:
      - Heart surgery (eg, coronary artery bypass graft [CABG])—Should not be used
        to relieve pain right before or after the surgery.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of famotidine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine exactly as ordered by your doctor . Do not use more of
      it, do not use it more often, and do not use it for a longer time than ordered
      by your doctor. To do so may increase the chance of unwanted effects, especially
      in elderly patients.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: Swallow the tablet whole. Do not break, crush, divide, or chew it.
  - type: paragraph
    text: This medicine contains ibuprofen. Do not take this medicine with other products
      containing ibuprofen.
  - type: paragraph
    text: Do not substitute this medicine with single-ingredient products of ibuprofen
      and famotidine. Use only the brand of this medicine that your doctor prescribed.
      Different brands may not work the same way.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For rheumatoid arthritis and osteoarthritis:
        Adults—1 tablet (800 milligrams (mg) ibuprofen and 26.6 mg famotidine) 3 times
        a day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For rheumatoid arthritis and osteoarthritis: Adults—1 tablet (800 milligrams
        (mg) ibuprofen and 26.6 mg famotidine) 3 times a day. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—1 tablet (800 milligrams (mg) ibuprofen and 26.6 mg famotidine) 3 times
        a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      while you are using this medicine. This will allow your doctor to see if the
      medicine is working properly and to decide if you should continue to use it.
      Blood and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Ibuprofen may increase your risk of having a heart attack or stroke. This
      is more likely in people who already have heart disease. People who use this
      medicine for a long time might also have a higher risk. Check with your doctor
      right away if you are having chest pain or discomfort, nausea or vomiting, pain
      or discomfort in the arms, jaw, back, or neck, trouble breathing, slurred speech,
      or weakness.
  - type: paragraph
    text: Ibuprofen may cause bleeding in your stomach or intestines. This problem
      can happen without warning signs. This is more likely if you have had a stomach
      ulcer in the past, if you smoke or drink alcohol regularly, if you are over
      60 years of age, are in poor health, or are using certain other medicines (eg,
      steroids or a blood thinner).
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. You might need to measure
      your blood pressure at home. If you think your blood pressure is too high, call
      your doctor right away.
  - type: paragraph
    text: If you are rapidly gaining weight, trouble breathing, chest pain or discomfort,
      extreme tiredness or weakness, irregular breathing, irregular heartbeat, or
      excessive swelling of the hands, wrist, ankles, or feet, check with your doctor
      immediately. These may be symptoms of heart problems or your body keeping too
      much water.
  - type: paragraph
    text: Check with your doctor right away if you have blood in the urine, decrease
      in the frequency or amount of urine, an increase in blood pressure, increased
      thirst, loss of appetite, lower back or side pain, nausea, swelling of the face,
      fingers, or lower legs, trouble breathing, unusual tiredness or weakness, vomiting,
      or weight gain. These may be symptoms of a serious kidney problem.
  - type: paragraph
    text: Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have stomach pain, confusion,
      difficulty with breathing, irregular heartbeat, nausea or vomiting, nervousness,
      numbness or tingling in the hands, feet, or lips, or weakness or heaviness of
      the legs.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction called anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are using this medicine.
  - type: paragraph
    text: Serious skin reactions, including exfoliative dermatitis, Stevens-Johnson
      syndrome, toxic epidermal necrolysis, fixed drug eruption (FDE), and generalized
      bullous fixed drug eruption (GBFDE) can occur with this medicine. Check with
      your doctor right away if you have blistering, peeling, or loosening of the
      skin, chills, cough, diarrhea, itching, joint or muscle pain, red irritated
      eyes, red skin lesions, often with a purple center, sore throat, sores, ulcers,
      or white spots on the lips or in the mouth, or unusual tiredness and weakness.
  - type: paragraph
    text: Check with your doctor right away if you have black, tarry stools, chest
      pain, chills, cough, fever, painful or difficult urination, sore throat, sores,
      ulcers, or white spots in the mouth or on the lips, swollen glands, unusual
      bleeding or bruising, or unusual tiredness or weakness. These may be symptoms
      of serious skin reaction called drug reaction with eosinophilia and systemic
      symptoms (DRESS).
  - type: paragraph
    text: Using this medicine during the later part of pregnancy can harm your unborn
      baby. If you think you have become pregnant while using this medicine, tell
      your doctor right away.
  - type: paragraph
    text: This medicine may cause a delay in ovulation for women and may affect their
      ability to have children. If you plan to have children, talk with your doctor
      before using this medicine.
  - type: paragraph
    text: Some people who have used this medicine had symptoms of meningitis. If you
      have fever, headache, nausea, vomiting, and stiff neck or back while using this
      medicine, check with your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if blurred vision, difficulty with reading,
      or any other change in vision occurs during or after your treatment. Your doctor
      may want your eyes be checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: Before having any kind of surgery or medical tests, tell your doctor that
      you are using this medicine. It may be necessary for you to stop the medicine
      for a while, or to change to a different medicine before your procedure.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
