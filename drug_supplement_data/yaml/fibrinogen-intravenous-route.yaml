title: Fibrinogen (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: RiaSTAP
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fibrinogen injection is used as a supplement in bleeding patients with acquired
      fibrinogen deficiency. It is also used to treat acute bleeding episodes in patients
      with congenital fibrinogen deficiency, including afibrinogenemia and hypofibrinogenemia.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of fibrinogen injection in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of fibrinogen
        injection have not been performed in the geriatric population. However, no
        geriatric-specific problems have been documented to date.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine.
      This medicine is given through an IV catheter that is placed into one of your
      veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you closely while you are receiving
      this medicine to make sure it is working properly. Blood tests will be needed
      to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you have a rash, itching, trouble swallowing, dizziness,
      a fast heartbeat, lightheadedness or fainting, restlessness, trouble breathing,
      swelling in your face, hands, tongue, or throat, or chest pain after you receive
      the medicine.
  - type: paragraph
    text: This medicine may increase your chance of having blood clotting problems.
      Tell your doctor right away if you have a sudden or severe headache, problems
      with vision or speech, chest pain, or numbness or weakness while you are receiving
      this medicine.
  - type: paragraph
    text: This medicine is made from donated human blood. Some human blood products
      have transmitted certain viruses to people who have received them, although
      the risk is low. Human donors and donated blood are both tested for viruses
      to keep the transmission risk low. Talk with your doctor about this risk if
      you are concerned.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - chest pain
      - confusion
      - decreased urine output
      - depression
      - dizziness or lightheadedness
      - fainting
      - fast or irregular heartbeat
      - fever
      - hallucinations
      - headache
      - increased blood pressure
      - increased thirst
      - lethargy
      - loss of appetite
      - lower back or side pain
      - muscle twitching
      - nausea
      - numbness or tingling in the hands or feet
      - pale skin
      - rapid weight gain
      - seizures
      - swelling of the face, ankles, or hands
      - trouble breathing
      - unusual bleeding or bruising
      - unusual excitement, nervousness, or restlessness
      - unusual tiredness or weakness
      - vomiting
      - weight gain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - chest tightness
      - pinpoint red spots on the skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - chest discomfort
      - chills
      - cough
      - difficult or labored breathing
      - difficulty with swallowing
      - pain or discomfort in the arms, jaw, back, or neck
      - pain, redness, or swelling in the arm or leg
      - pains in the groin or legs, especially in the calves of the legs
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - severe headaches of sudden onset
      - skin rash, hives, or itching
      - sudden loss of coordination
      - sudden onset of slurred speech
      - sudden vision changes
      - sweating
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
