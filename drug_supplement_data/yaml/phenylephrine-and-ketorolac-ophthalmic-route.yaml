      - Clopidogrel
      - Dabigatran Etexilate
      - Dalteparin
      - Danaparoid
      - Deflazacort
      - Desirudin
      - Desvenlafaxine
      - Dexamethasone
      - Dipyridamole
      - Duloxetine
      - Edoxaban
      - Emtricitabine
      - Enoxaparin
      - Epoprostenol
      - Eptifibatide
