title: Meningococcal vaccine group b (intramuscular route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Meningococcal vaccine is an active immunizing agent used to prevent infection
      caused by certain groups (A, B, C, W, and Y) of meningococcal bacteria ( Neisseria
      meningitidis ). The vaccine works by causing your body to produce its own protection
      (antibodies) against the disease.
  - type: paragraph
    text: Meningococcal infection can cause life-threatening illnesses, including
      meningococcal meningitis, which affects the brain, and meningococcemia, which
      affects the blood. These diseases are more likely to occur in young children
      and in persons with certain diseases or conditions that make them more susceptible
      to a meningococcal infection or more likely to develop serious problems from
      a meningococcal infection.
  - type: paragraph
    text: 'Immunization against meningococcal disease is recommended for persons who
      are at risk of getting the disease because:'
  - type: list
    ordered: false
    items:
    - They have certain diseases or conditions that make them more susceptible to
      a meningococcal infection or more likely to develop serious problems from a
      meningococcal infection.
    - They are living in, working in, or visiting an area where there is a strong
      possibility of contracting meningococcal disease.
  - type: paragraph
    text: This vaccine is recommended for use in patients 10 to 25 years of age.
  - type: paragraph
    text: This vaccine is to be given only by or under the supervision of your doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Penmenvy® vaccine in children younger than 10 years of age.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Penmenvy® vaccine in geriatric patients. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atidarsagene Autotemcel
      - Elivaldogene Autotemcel
      - Measles Virus Vaccine, Live
      - Ocrelizumab
      - Teplizumab-mzwv
      - Ublituximab-xiiy
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Immune system problems—This condition may decrease the useful effects of the
        vaccine.
    - type: list
      ordered: false
      items:
      - Nerve problem (eg, Guillain-Barré syndrome), history of—Use with caution.
        May make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given as a shot into one of your muscles.
  - type: paragraph
    text: This vaccine is given in 2 doses at least 6 months apart.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Be sure to notify your doctor of any side effects that occur after you receive
      this vaccine.
  - type: paragraph
    text: This vaccine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you have a rash, itching, a fast heartbeat, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      after receiving the vaccine.
  - type: paragraph
    text: Fainting may occur after you receive this vaccine. Your doctor may want
      you to be observed after you get the injection to prevent and manage fainting.
  - type: paragraph
    text: This vaccine may not protect everyone who receives it. It will not treat
      symptoms of meningococcal infection if you already have the disease.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bone pain
      - chest tightness
      - cough
      - difficulty swallowing
      - dizziness
      - fainting
      - fast heartbeat
      - hives, itching, skin rash
      - inability to move the arms and legs
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - seizures
      - sudden numbness and weakness in the arms and legs
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
      - trouble breathing
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of skin, feeling of
        pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - chills
      - difficulty in moving
      - eye swelling
      - falls
      - fever
      - headache
      - head injury
      - joint pain
      - mouth and throat pain
      - muscle pain or stiffness
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
