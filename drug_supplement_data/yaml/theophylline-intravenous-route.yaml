    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Cor pulmonale (heart condition) or
      - Fever of 102 degrees F or higher for 24 hours or more or
      - Hypothyroidism (underactive thyroid) or
      - Infection, severe (e.g., sepsis) or
      - Kidney disease in infants younger than 3 months of age or
      - Liver disease (e.g., cirrhosis, hepatitis) or
      - Pulmonary edema (lung condition) or
      - Shock (serious condition with very little blood flow in the body)—Use with
        caution. The effects may be increased because of slower removal of the medicine
        from the body.
    - type: list
      ordered: false
      items:
      - Heart rhythm problems (e.g., arrhythmia) or
      - Seizures, or history of or
      - Stomach ulcer—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. This medicine is given through a needle placed in one of your
      veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child while you receive this medicine. Blood tests may be needed to check for
      unwanted effects.
  - type: paragraph
    text: 'A change in your usual behavior or physical well-being may affect the way
      this medicine works in your body. Tell your doctor if you or your child :'
  - type: list
    ordered: false
    items:
    - Have had a fever of 102 degrees F or higher for at least 24 hours or more.
    - Have started or stopped smoking tobacco or marijuana in the last few weeks.
    - Have started or stopped taking another medicine in the last few weeks.
    - Have changed your diet in the last few weeks.
  - type: paragraph
    text: 'Check with your doctor right away if you or your child have the following
      symptoms after using this medicine: nausea or vomiting that continues, headaches,
      trouble with sleeping, seizures, or irregular heartbeats.'
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you or your child are using this medicine. The results of some tests may be
      affected by this medicine.
  - type: paragraph
    text: This medicine may add to the central nervous system (CNS) stimulant effects
      of caffeine-containing foods or beverages, such as chocolate, cocoa, tea, coffee,
      and cola drinks. Avoid eating or drinking large amounts of these foods or beverages
      while using this medicine. If you have questions about this, check with your
      doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      for appetite control, asthma, colds, cough, hay fever, or sinus problems, and
      herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain or discomfort
      - cough
      - dizziness
      - fainting
      - fast, slow, or irregular heartbeat
      - headache
      - increase in urine volume
      - infection at the injection site
      - lightheadedness
      - pain or redness at the site of injection
      - pale skin at the site of injection
      - persistent vomiting
      - pounding or rapid pulse
      - rapid breathing
      - seizures
      - shakiness
      - shortness of breath
      - swelling of the lower legs or arms
      - tenderness, pain, swelling, warmth, skin discoloration, and prominent superficial
        veins over the affected area
      - weight gain
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - confusion
      - confusion about identity, place, and time
      - dark-colored urine
      - decrease in frequency of urination
      - decreased urine
      - diarrhea
      - difficulty in passing urine (dribbling)
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dry mouth
      - fast, pounding, or irregular heartbeat or pulse
      - fever
      - increased thirst
      - irregular heartbeat
      - loss of appetite
      - mood changes
      - muscle cramps or spasms
      - muscle pain or stiffness
      - nausea or vomiting
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - pain or discomfort in the arms, jaw, back, or neck
      - painful urination
      - shakiness in the legs, arms, hands, or feet
      - shortness of breath
      - sweating
      - unusual tiredness or weakness
      - vomiting of blood or material that looks like coffee grounds
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - irritability
      - restlessness
      - sleeplessness
      - trouble sleeping
      - unable to sleep
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
