title: Theophylline (intravenous route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Theophylline injection is used together with other medicines to treat the
      acute symptoms of asthma, bronchitis, emphysema, and other lung diseases in
      a hospital setting.
  - type: paragraph
    text: Theophylline belongs to a group of medicines known as bronchodilators. Bronchodilators
      are medicines that relax the muscles in the bronchial tubes (air passages) of
      the lungs. They relieve cough, wheezing, shortness of breath, and troubled breathing
      by increasing the flow of air through the bronchial tubes.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of theophylline injection in children.
        However, children younger than 1 year of age are more likely to have serious
        side effects, which may require caution and an adjustment in the dose for
        patients receiving theophylline injection.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of theophylline injection in the
        elderly. However, elderly patients may be more sensitive to the effects of
        theophylline injection than younger adults, which may require caution and
        an adjustment in the dose for patients receiving theophylline injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Riociguat
      - Viloxazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Adalimumab
      - Adenosine
      - Amifampridine
      - Bupropion
      - Cannabidiol
      - Capmatinib
      - Cimetidine
      - Ciprofloxacin
