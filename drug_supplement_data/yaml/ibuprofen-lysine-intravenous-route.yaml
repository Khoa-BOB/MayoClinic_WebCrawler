    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems, active (eg, intracranial hemorrhage, stomach or bowel bleeding)
        or
      - Blood clotting problems or
      - Congenital heart disease or
      - Infection, untreated or
      - Kidney disease, severe or
      - Stomach or bowel problems (eg, necrotizing enterocolitis) or
      - Thrombocytopenia (low platelets in the blood)—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Hyperbilirubinemia (high bilirubin in the blood)—May cause this condition
        to get worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give your child this medicine
      in a hospital. It is given through a needle placed into one of your child's
      veins. This medicine must be given slowly, so the IV tube will need to stay
      in place for at least 15 minutes.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your child's progress closely
      while you are receiving this medicine to make sure that it is working properly.
      Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may increase your child's risk for infection. Check with your
      doctor right away if your child has fever or chills, cough or hoarseness, lower
      back or side pain, or painful or difficult urination.
  - type: paragraph
    text: This medicine may cause serious skin reactions, including Stevens-Johnson
      syndrome, toxic epidermal necrolysis, exfoliative dermatitis, and acute generalized
      exanthematous pustulosis (AGEP). Check with your doctor right away if your child
      has blistering, peeling, or loosening of the skin, chills, cough, cracks in
      the skin, diarrhea, itching, joint or muscle pain, red irritated eyes, red skin
      lesions, often with a purple center, scaly skin, sore throat, sores, ulcers,
      or white spots in the mouth or on the lips, or unusual tiredness or weakness.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
