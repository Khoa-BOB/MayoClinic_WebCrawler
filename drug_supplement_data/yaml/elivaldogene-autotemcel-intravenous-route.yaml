title: Elivaldogene autotemcel (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Skysona
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Elivaldogene autotemcel injection is used to treat early, active cerebral
      adrenoleukodystrophy (CALD) without an available human leukocyte antigen (HLA)-matched
      donor for allogeneic hematopoietic stem cell transplant (HSCT) in males 4 to
      17 years of age.
  - type: paragraph
    text: Cerebral adrenoleukodystrophy (CALD) is a genetic disease caused by mutations
      in the ABCD1 gene that lead to the buildup of very long fatty acids (VLCFAs)
      in the brain. These fatty acids may cause brain and nerve damage. The damage
      can be seen on magnetic resonance imaging (MRI) scans of the brain. Elivaldogene
      autotemcel injection is recommended if the damage is determined to be early
      and if the brain disease is active. It will help the body to break down the
      fatty acids to slow the progression of damage to the brain and slow the decline
      in nerve function.
  - type: paragraph
    text: This medicine is to be given only by or under the immediate supervision
      of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of elivaldogene autotemcel injection in children younger than
        4 years of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of elivaldogene autotemcel injection in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Anthrax Vaccine Adsorbed
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Cholera Vaccine
      - Cholera Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Diphtheria Toxoid, Adsorbed
      - Ebola Zaire Vaccine, Live
      - Haemophilus B Vaccine
      - Hepatitis A Vaccine, Inactivated
      - Hepatitis B Vaccine
      - Human Papillomavirus Vaccine
      - Influenza Virus Vaccine
      - Influenza Virus Vaccine, Live
      - Japanese Encephalitis Virus Vaccine
      - Measles Virus Vaccine, Live
      - Meningococcal Vaccine
      - Mumps Virus Vaccine, Live
      - Pertussis Vaccine
      - Pneumococcal Vaccine
      - Pneumococcal Vaccine, Diphtheria Conjugate
      - Pneumococcal Vaccine Polyvalent
      - Poliovirus Vaccine, Inactivated
      - Poliovirus Vaccine, Live
      - Rabies Vaccine
      - Rotavirus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - SARS-COV-2 (COVID-19) Vaccine, Adenovirus 26 Vector (Janssen)
      - SARS-COV-2 (COVID-19) Vaccine, mRNA (Moderna)
      - SARS-COV-2 (COVID-19) Vaccine, mRNA (Pfizer)
      - SARS-COV-2 (COVID-19) Vaccine, Protein Subunit, Adjuvanted (Novavax)
      - SARS-COV-2 (COVID-19) Vaccine, Protein Subunit, Adjuvanted (Sanofi)
      - Smallpox Monkeypox Vaccine
      - Tetanus Toxoid
      - Tick-Borne Encephalitis Vaccine
      - Typhoid Vaccine
      - Typhoid Vaccine, Live
      - Typhoid Vi Polysaccharide Vaccine
      - Varicella Virus Vaccine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to dimethyl sulfoxide (DMSO), history of—Use with caution. May increase
        the risk of an allergic reaction.
    - type: list
      ordered: false
      items:
      - Infections, active—Should not be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. This medicine has not been studied in patients
        with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine
      in a hospital. It is given through an IV catheter that is placed in a vein.
      This medicine must be given slowly, so your IV will need to stay in place for
      at least 60 minutes.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: You may also receive other medicines (eg, cancer medicine, fever medicine,
      allergy medicine, or medicine to prevent nausea or vomiting) before receiving
      this medicine.
  - type: paragraph
    text: This medicine is made specifically for each patient, using the patient's
      own blood cells. Your doctor will collect your blood through a procedure called
      mobilization and apheresis. Talk with your doctor if you have any concerns about
      this.
  - type: paragraph
    text: Your doctor will also want you to stay in the hospital or center for at
      least 2 months after your infusion.
  - type: paragraph
    text: Do not use medicine to treat HIV for at least 1 month before having a procedure
      to collect your blood.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests are needed
      every 3 months for at least 15 years to check for unwanted effects.
  - type: paragraph
    text: Male patients with female partners should use an effective form of birth
      control before having a procedure to collect your blood and for at least 6 months
      after the last dose.
  - type: paragraph
    text: This medicine may cause blood cancer (eg, myelodysplastic syndrome, acute
      myeloid leukemia). Check with your doctor right away if you have chest pain,
      chills, cough or hoarseness, fever, lower back or side pain, painful or difficult
      urination, sores, ulcers, or white spots on the lips or in the mouth, swollen
      glands, unusual bleeding or bruising, or unusual tiredness or weakness.
  - type: paragraph
    text: Elivaldogene autotemcel will lower the number of some types of blood cells
      in your body. Because of this, you may bleed or get infections more easily.
      To help with these problems, avoid being near people who are sick or have infections.
      Wash your hands often. Stay away from rough sports or other situations where
      you could be bruised, cut, or injured. Brush and floss your teeth gently. Be
      careful when using sharp objects, including razors and fingernail clippers.
      Call your doctor right away if you have fever, chills, or any signs or symptoms
      of an infection.
  - type: paragraph
    text: This medicine may cause serious allergic reaction, including anaphylaxis,
      which may be life-threatening and requires immediate medical attention. Check
      with your doctor right away if you have a rash, itching, dizziness, fainting,
      fast heartbeat, trouble breathing or swallowing, or chest tightness while you
      are using this medicine.
  - type: paragraph
    text: While you are being treated with elivaldogene autotemcel, do not have any
      immunizations (vaccinations) without your doctor's approval. Live virus vaccinations
      should not be given for at least 6 weeks before start of treatment, during treatment,
      and until recovery following the last cycle of this medicine.
  - type: paragraph
    text: Do not donate blood, organs, tissues, or cells during treatment with this
      medicine.
  - type: paragraph
    text: Before you have any medical tests (eg, HIV test), tell the medical doctor
      in charge that you are taking this medicine. The results of some tests may be
      affected by this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - blurred vision
      - chest pain
      - chills
      - cough or hoarseness
      - dizziness
      - fast, pounding, or irregular heartbeat or pulse
      - fever
      - headache
      - lower back or side pain
      - nervousness
      - painful or difficult urination
      - pale skin
      - pinpoint red spots on the skin
      - pounding in the ears
      - seizures
      - slow or fast heartbeat
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swollen glands
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - difficulty swallowing
      - hives, itching, or skin rash
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - bloody nose
      - constipation
      - cracked lips
      - darkening of the skin
      - decreased appetite
      - diarrhea
      - fear
      - flushing
      - irritation or soreness of the mouth
      - loss or thinning of the hair
      - nausea
      - stomach pain
      - swelling or inflammation of the mouth
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
