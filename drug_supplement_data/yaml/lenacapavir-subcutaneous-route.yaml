      - Cyclosporine
      - Dabigatran Etexilate
      - Dabrafenib
      - Daridorexant
      - Darifenacin
      - Darolutamide
      - Darunavir
      - Dasatinib
      - Defactinib
      - Deutivacaftor
      - Dexamethasone
      - Digoxin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional may give you this medicine.
      It is given as a shot under your skin, usually in the stomach.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Treatment with this medicine contains injections and tablets . There are
      also 2 options in starting this treatment. Your doctor will decide which option
      is best for you.
  - type: paragraph
    text: Your doctor will ask you to stay under their care during your treatment
      with this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form (solution) and oral dosage form (tablets): For
        treatment of HIV infection: Option 1: Adults—At first, 927 milligrams (mg)
        (2 vials) injected under the skin and 600 mg (2 tablets) once a day on Day
        1. Followed by 600 mg (2 tablets) once a day on Day 2. For maintenance, 927
        mg (2 vials) injected under the skin once a day every 6 months (26 weeks).
        Children—Use and dose must be determined by your doctor. Option 2: Adults—At
        first, 600 milligrams (mg) (2 tablets) once a day on Days 1 and 2. Followed
        by 300 mg (1 tablet) once a day on Day 8. Then, 927 mg (2 vials) injected
        under the skin on Day 15. For maintenance, 927 mg (2 vials) injected under
        the skin once a day every 6 months (26 weeks). Children—Use and dose must
        be determined by your doctor.'
    - type: list
