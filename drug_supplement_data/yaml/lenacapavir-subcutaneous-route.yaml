    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    - type: paragraph
      text: If you plan to miss a scheduled every 6-month injection by more than 2
        weeks, you may take the tablet form of this medicine. Take 300 mg (1 tablet)
        every 7 days for up to 6 months. Resume the maintenance injection dose within
        7 days after the last oral dose.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Do not use this medicine together with carbamazepine (Tegretol®), phenytoin
      (Dilantin®), rifampin (Rifadin®), or St. John’s wort.
  - type: paragraph
    text: Your immune system may get stronger when you start using HIV medicines.
      Tell your doctor right away if you notice any changes in your health. Sometimes
      the immune system will start to fight infections that were hidden in your body,
      including pneumonia, herpes, or tuberculosis. Autoimmune disorders (eg, Graves
      disease, polymyositis, and Guillain-Barré syndrome) may also occur.
  - type: paragraph
    text: This medicine may cause injection site reactions. Check with your doctor
      right away if you have bleeding, blistering, burning, coldness, discoloration
      of skin, feeling of pressure, hives, infection, inflammation, itching, lumps,
      numbness, pain, rash, redness, scarring, soreness, stinging, swelling, tenderness,
      tingling, ulceration, or warmth at the injection site.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      The side effects for this medicine are usually mild and do not often result
      in a need to change treatment.
  - type: paragraph
    text: 'Talk with your doctor if you have any questions about the following possible
      side effects:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - 'Mild injection site reaction: swelling, pain, redness, lump, thickened skin,
        and itching'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - nausea
