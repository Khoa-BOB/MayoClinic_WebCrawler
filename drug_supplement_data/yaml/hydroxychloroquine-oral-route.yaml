    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: Check with your doctor immediately if blurred vision, difficulty with reading,
      or any other change in vision occurs during or after treatment. Your doctor
      may want your eyes be checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you had a heart rhythm problem, including
      QT prolongation.
  - type: paragraph
    text: This medicine may cause muscle and nerve problems. Check with your doctor
      right away if you have muscle weakness, pain, or tenderness while using this
      medicine.
  - type: paragraph
    text: Hydroxychloroquine may cause some people to be agitated, irritable, or display
      other abnormal behaviors within the first month after the start of treatment.
      It may also cause some people to have suicidal thoughts and tendencies, or to
      become more depressed. If you or your caregiver notice any of these side effects,
      tell your doctor right away.
  - type: paragraph
    text: This medicine may cause hypoglycemia (low blood sugar). This is more common
      when this medicine is taken together with certain medicines. Low blood sugar
      must be treated before it causes you to pass out (unconsciousness). People feel
      different symptoms of low blood sugar . It is important that you learn which
      symptoms you usually have so you can treat it quickly. Talk to your doctor about
      the best way to treat low blood sugar.
  - type: paragraph
    text: This medicine lowers the number of some types of blood cells in your body.
      Because of this, you may bleed or get infections more easily. To help with these
      problems, avoid being near people who are sick or have infections. Wash your
      hands often. Stay away from rough sports or other situations where you could
      be bruised, cut, or injured. Brush and floss your teeth gently. Be careful when
      using sharp objects, including razors and fingernail clippers. Check with your
      doctor immediately if you think you are getting an infection or if you get a
      fever, chills, cough or hoarseness, lower back or side pain, or painful or difficult
      urination.
  - type: paragraph
    text: Serious skin reactions, including Stevens-Johnson syndrome, toxic epidermal
      necrolysis, drug reaction with eosinophilia and systemic symptoms (DRESS), and
      acute generalized exanthematous pustulosis can occur during treatment with this
      medicine. Check with your doctor right away if you or your child have black,
      tarry stools, blistering, peeling, or loosening of the skin, chest pain, chills,
      cough, diarrhea, itching, joint or muscle pain, painful or difficult urination,
      red irritated eyes, red skin lesions, often with a purple center, severe acne
      or skin rash, sore throat, sores, ulcers, or white spots in the mouth or on
      the lips, swollen glands, unusual bleeding or bruising, or unusual tiredness
      or weakness while you are using this medicine.
  - type: paragraph
    text: If your symptoms do not improve within a few days (or a few weeks or months
      for arthritis), or if they become worse, check with your doctor.
  - type: paragraph
    text: 'Malaria is spread by the bites of certain kinds of infected female mosquitoes.
      If you are living in or will be traveling to an area where there is a chance
      of getting malaria, the following mosquito-control measures will help to prevent
      infection:'
  - type: list
    ordered: false
    items:
    - If possible, avoid going out between dusk and dawn because it is at these times
      that mosquitoes most commonly bite.
    - Remain in air-conditioned or well-screened rooms to reduce contact with mosquitoes.
    - Wear long-sleeved shirts or blouses and long trousers to protect your arms and
      legs, especially from dusk through dawn when mosquitoes are out.
    - Apply insect repellant, preferably one containing DEET, to uncovered areas of
      the skin from dusk through dawn when mosquitoes are out.
    - If possible, sleep in a screened or air-conditioned room or under mosquito netting
      preferably netting coated or soaked with pyrethrum, to avoid being bitten by
      malaria-carrying mosquitoes.
    - Use mosquito coils or sprays to kill mosquitoes in living and sleeping quarters
      during evening and nighttime hours.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines)
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - black, tarry stools
      - bleeding gums
      - blindness
      - blistering, peeling, loosening of the skin
