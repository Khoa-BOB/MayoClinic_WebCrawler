title: Hydroxychloroquine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Plaquenil
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Hydroxychloroquine is used to treat malaria. It is also used to prevent
      malaria infection in areas or regions where there is no known medicine (eg,
      chloroquine) resistance.
  - type: paragraph
    text: Using this medicine alone or with other medicines (eg, azithromycin) may
      increase your risk of heart rhythm problems (eg, QT prolongation, ventricular
      fibrillation, ventricular tachycardia). Do not take any medicine that contains
      hydroxychloroquine unless prescribed by your doctor.
  - type: paragraph
    text: Hydroxychloroquine belongs to a group of medicines known as antimalarials.
      It works by preventing or treating malaria, a red blood cell infection transmitted
      by the bite of a mosquito. However, this medicine is not used to treat severe
      or complicated malaria.
  - type: paragraph
    text: Hydroxychloroquine is used to treat discoid lupus erythematosus (DLE) or
      systemic lupus erythematosus (SLE or lupus). It is also used to treat acute
      and chronic rheumatoid arthritis.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of hydroxychloroquine to prevent
        and treat malaria in children. However, use is not recommended in children
        weighing less than 31 kilograms (kg) for Plaquenil® tablets and in children
        weighing less than 23 kg for Sovuna® tablets . Safety and efficacy of hydroxychloroquine
        to treat lupus and arthritis have not been established in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of hydroxychloroquine in the elderly.
        However, elderly patients are more likely to have age-related kidney, liver,
        or heart problems, which may require caution and an adjustment in the dose
        for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Aurothioglucose
      - Bepridil
      - Cisapride
      - Dronedarone
      - Levoketoconazole
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Acetazolamide
      - Acetazolamide Sodium
      - Acetophenazine
      - Aclidinium
      - Acrivastine
      - Acyclovir
      - Adagrasib
      - Albiglutide
      - Alcaftadine
      - Alfentanil
      - Alfuzosin
      - Alogliptin
      - Aluminum Carbonate, Basic
      - Aluminum Hydroxide
      - Aluminum Phosphate
      - Ambenonium
      - Amdinocillin
      - Amineptine
      - Aminophylline
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amitriptylinoxide
      - Amoxapine
      - Amphotericin B
      - Ampicillin
      - Anagrelide
      - Anisotropine
      - Antazoline
      - Apomorphine
      - Aripiprazole
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
