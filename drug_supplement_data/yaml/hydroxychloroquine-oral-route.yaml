      - Atovaquone
      - Atropine
      - Azatadine
      - Azathioprine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to 4-aminoquinoline compounds (eg, chloroquine)—Should not be used
        in patients with this condition.
    - type: list
      ordered: false
      items:
      - Blood or bone marrow problems or
      - Diabetes or
      - Eye or vision problems or
      - Muscle problems or
      - Nerve problems or
      - Porphyria (blood disorder) or
      - Psoriasis (skin disease) or
      - Stomach or bowel problems–Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Glucose-6-phosphate dehydrogenase (G6PD) deficiency—May cause hemolytic anemia
        in patients with this condition.
    - type: list
      ordered: false
      items:
      - Heart disease (eg, heart attack, heart failure) or
      - Heart rhythm problems (eg, bradycardia, ventricular dysrhythmia), or history
        of or
      - Hypokalemia (low potassium in the blood), uncorrected or
      - Hypomagnesemia (low magnesium in the blood), uncorrected—Use with caution.
        May prolong the QT interval.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of the
        slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Swallow the tablet whole. Do not crush, break, or chew it. Take this medicine
      with meals or milk to lessen stomach upset, unless otherwise directed by your
      doctor.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you feel
      better after the first few doses. Your infection may not clear up if you stop
      using the medicine too soon.
  - type: paragraph
    text: 'For patients taking hydroxychloroquine to prevent malaria :'
  - type: list
    ordered: false
    items:
    - Your doctor may want you to start taking this medicine 2 weeks before you travel
      to an area where there is a chance of getting malaria. This will help you to
      see how you react to the medicine. Also, it will allow time for your doctor
      to change to another medicine if you have a reaction to this medicine.
    - Also, you should keep taking this medicine while you are in the area and for
      4 weeks after you leave the area. No medicine will protect you completely from
      malaria. However, to protect you as completely as possible, it is important
      to keep taking this medicine for the full time your doctor ordered. Also, if
      fever develops during your travels or within 2 months after you leave the area,
      check with your doctor immediately.
  - type: paragraph
    text: If you are also taking kaolin or antacids, take them at least 4 hours before
      or after using hydroxychloroquine .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For prevention of malaria: For oral dosage form (Plaquenil® tablets): Adults—400
        mg once a week on the same day of each week starting 2 weeks before traveling
        to an area where malaria occurs, and continued for 4 weeks after leaving the
        area. Children weighing 31 kilograms (kg) or more—Dose is based on body weight
        and must be determined by your doctor. At first, 6.5 mg per kilogram (kg)
        of body weight, not to exceed 400 mg, once weekly on the same day of the week
        starting 2 weeks before traveling to an area where malaria occurs, and continued
        for 4 weeks after leaving the area. Children weighing less than 31 kg—Use
        is not recommended. For oral dosage form (Sovuna® tablets): Adults—400 mg
        once a week on the same day of each week starting 2 weeks before traveling
        to an area where malaria occurs, and continued for 4 weeks after leaving the
        area. Children weighing 23 kilograms (kg) or more—Dose is based on body weight
        and must be determined by your doctor. At first, 6.5 mg per kilogram (kg)
        of body weight, not to exceed 400 mg, once weekly on the same day of the week
        starting 2 weeks before traveling to an area where malaria occurs, and continued
        for 4 weeks after leaving the area. Children weighing less than 23 kg—Use
        is not recommended.'
    - type: list
