    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angioedema (an allergic reaction) with other blood pressure medicines (eg,
        benazepril, enalapril, lisinopril, Lotrel®, Vasotec®, Zestoretic®, Zestril®),
        history of—Use may cause this condition to reoccur.
    - type: list
      ordered: false
      items:
      - Anuria (not able to create urine) or
      - Diabetic patients who are also taking aliskiren (Tekturna®) or
      - Sulfa drug allergy, history of—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Asthma, history of—May increase likelihood of having an allergic reaction.
    - type: list
      ordered: false
      items:
      - Congestive heart failure, severe—Use may lead to kidney problems.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Electrolyte imbalances (eg, high or low calcium, magnesium, potassium, or
        sodium in the body) or
      - Fluid imbalances (caused by dehydration, vomiting, or diarrhea) or
      - Gallstones, or history of or
      - Glaucoma, angle-closure or
      - Gout or
      - Hypercholesterolemia (high cholesterol in the blood) or
      - Hypertriglyceridemia (high triglycerides or fats in the blood) or
      - Kidney disease, severe or
      - Myopia (changes in the eyeball causing vision problems) or
      - Systemic lupus erythematosus (an autoimmune disorder)—Use with caution. May
        make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: In addition to using this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these is most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure but it
      does help control it. You must continue to take it as directed if you expect
      to lower your blood pressure and keep it down. You might have to take high blood
      pressure medicine for the rest of your life . If high blood pressure is not
      treated, it can cause serious problems such as heart failure, blood vessel disease,
      strokes, or kidney disease.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions in the insert carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the tablet whole. Do not break, crush, or chew it. You may take
      this medicine with or without food.
  - type: paragraph
    text: If you also use cholestyramine or colestipol, take these at least 4 to 6
      hours before or 4 hours after you take this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For high blood pressure: Adults—One tablet
        once a day. Your doctor may adjust the dose as needed. However, the dose is
        usually not more than valsartan 320 milligrams (mg) and hydrochlorothiazide
        25 mg per day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—One tablet once a day. Your doctor may adjust
        the dose as needed. However, the dose is usually not more than valsartan 320
        milligrams (mg) and hydrochlorothiazide 25 mg per day. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—One tablet once a day. Your doctor may adjust the dose as needed. However,
        the dose is usually not more than valsartan 320 milligrams (mg) and hydrochlorothiazide
        25 mg per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby, especially
      in your second or third trimester. Use an effective form of birth control to
      keep from getting pregnant. If you think you have become pregnant while using
      this medicine, tell your doctor right away. You may need to stop using this
      medicine.
  - type: paragraph
    text: This medicine may cause dizziness, lightheadedness, or fainting, especially
      when you get up suddenly from a lying or sitting position. Make sure you know
      how you react to this medicine before you drive, use machines, or do anything
      else that could be dangerous if you are dizzy . If you feel dizzy, lie down
      so you do not faint. Then sit for a few moments before standing to prevent the
      dizziness from returning. If you faint, call your doctor right away .
  - type: paragraph
    text: Check with your doctor right away if you become sick while taking this medicine,
      especially if you have severe nausea, vomiting, or diarrhea that does not stop.
      These conditions may cause you to lose too much water and lead to low blood
      pressure. You can also lose water by sweating, so drink plenty of water during
      exercise or in hot weather.
  - type: paragraph
    text: Check with your doctor right away if blurred vision, difficulty with reading,
      eye pain, or any other change in vision occurs during or after treatment. This
      could be a sign of a serious eye problem. Your doctor may want an eye doctor
      to check your eyes.
  - type: paragraph
    text: This medicine may affect blood sugar levels. Diabetic patients may notice
      a change in the results of blood or urine glucose tests. Talk to your doctor
      if you have any questions.
  - type: paragraph
    text: Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have stomach pain, confusion,
      irregular heartbeat, nausea or vomiting, nervousness, numbness or tingling in
      the hands, feet, or lips, trouble breathing, or weakness or heaviness of the
      legs. Do not use medicines, supplements, or salt substitutes containing potassium
      without first checking with your doctor .
  - type: paragraph
    text: This medicine may increase your risk of getting skin cancer (eg, non-melanoma
      skin cancer). Avoid sun exposure. Use a sunscreen when you are outdoors. Avoid
      sunlamps and tanning beds. Talk to your doctor if you have concerns about this
      risk.
  - type: paragraph
    text: Alcohol, narcotic pain relievers, or sleeping pills may cause you to feel
      more lightheaded, dizzy, or faint when used with this medicine. Tell your doctor
      if you are drinking alcohol or using pain relievers or sleeping pills.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes prescription or nonprescription (over-the-counter [OTC])
      medicines for appetite control, asthma, colds, cough, hay fever, or sinus problems,
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cold or flu-like symptoms
      - difficulty with swallowing
      - sore throat
      - tender or swollen lymph nodes in the neck
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or stomach pain
      - blurred vision
      - chills
      - eye pain
      - fainting
      - fever
      - flushing
      - itching, pain, redness, or swelling of the eye or eyelid
      - joint stiffness or swelling, especially if sudden
      - nausea
      - skin rash or hives
      - trouble breathing
      - vomiting
      - watering of the eyes
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - dark urine
      - decreased urine output
      - dizziness
      - drowsiness
      - dry mouth
      - fast or irregular heartbeat
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - light-colored stools
      - lightheadedness
      - muscle cramps, spasms, pain, or stiffness
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - persistent non-healing sore
      - pink growth
      - reddish patch or irritated area
      - seizures
      - shiny bump
      - thirst
      - weakness or heaviness of the legs
      - white, yellow or waxy scar-like area
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - diarrhea (mild)
      - headache
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - increased sensitivity to sunlight
      - increased sweating
      - redness of the face or neck
      - reduced sexual performance or drive
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hair loss or thinning of the hair
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
