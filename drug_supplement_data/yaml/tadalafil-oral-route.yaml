    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Abnormal penis, including curved penis and birth defects of the penis (eg,
        angulation, cavernosal fibrosis, or Peyronie’s disease) or
      - Leukemia (blood related cancer) or
      - Multiple myeloma (blood related cancer) or
      - Sickle-cell anemia (blood disorder)—Use with caution. May increase risk of
        unwanted side effects (eg, prolonged erection of the penis).
    - type: list
      ordered: false
      items:
      - Age greater than 50 years or
      - Coronary artery disease or
      - Crowded optic disc or low cup to disc ratio in the eye (an eye disorder) or
      - Diabetes or
      - Hyperlipidemia (high lipids or fats in the blood) or
      - Hypertension (high blood pressure) or
      - Non-arteritic anterior ischemic optic neuropathy or NAION (serious eye condition),
        history of or
      - Smoking—Use with caution. May increase risk for non–arteritic anterior ischemic
        optic neuropathy (NAION).
    - type: list
      ordered: false
      items:
      - Angina (severe chest pain) or
      - Arrhythmia (irregular heartbeat), uncontrolled or
      - Blood vessel problems (eg, aortic stenosis, idiopathic subaortic stenosis)
        or
      - Heart attack (within the last 3 months) or
      - Heart failure (within the last 6 months) or
      - Hypertension (high blood pressure), uncontrolled or
      - Hypotension (low blood pressure) or
      - Retinal disorders (eye problem) or
      - Retinitis pigmentosa (an inherited eye disorder) or
      - Stroke (within the last 6 months)—Should not be used in patients with these
        conditions.
    - type: list
      ordered: false
      items:
      - Bleeding disorders or
      - Stomach ulcers—Use must be determined by your doctor. May increase your risk
        of bleeding.
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease or
      - Pulmonary veno-occlusive disease or PVOD (a type of lung disease)—Use with
        caution. May make this condition worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, mild or moderate or
      - Liver disease, mild or moderate—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use tadalafil exactly as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use it for a longer time than your doctor
      ordered. Also, do not stop taking this medicine without checking first with
      your doctor.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      these instructions carefully. Read it again each time you refill your prescription
      in case there is new information. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the tablet whole. Do not split, break, chew, or crush it.
  - type: paragraph
    text: 'Chewable tablets : Chew the tablet completely before swallowing. Do not
      swallow it whole. Do not break or split it.'
  - type: paragraph
    text: When using this medicine for erectile dysfunction , the ability to have
      sexual activity may be improved for up to 36 hours after taking the tablet.
  - type: paragraph
    text: Use only the brand of this medicine that your doctor prescribed. Different
      brands may not work the same way.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine. Grapefruit and grapefruit juice may change the amount of this medicine
      that is absorbed in the body.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of benign prostatic hyperplasia
        (daily use): Adults—5 milligrams (mg) as a single dose, no more than once
        a day, taken at the same time each day. Children—Use is not recommended. For
        treatment of erectile dysfunction (as needed): Adults—10 milligrams (mg) as
        a single dose, no more than once a day, taken 30 minutes before you think
        sexual activity may occur. Your doctor may adjust your dose as needed. Children—Use
        is not recommended. For treatment of erectile dysfunction (daily use): Adults—2.5
        milligrams (mg) once a day, taken at the same time each day, without regard
        for the timing of sexual activity. Your doctor may adjust your dose as needed.
        Children—Use is not recommended. For treatment of erectile dysfunction and
        benign prostatic hyperplasia (daily use): Adults—5 milligrams (mg) once a
        day, taken at the same time each day, without regard for the timing of sexual
        activity. Children—Use is not recommended. For treatment of pulmonary arterial
        hypertension: Adults—40 milligrams (mg) (two 20 mg tablets) taken once a day.
        Take both tablets at the same time each day. Do not divide the 40 mg dose.
        Your doctor may adjust your dose as needed. Children—Use and dose must be
        determined by your doctor.'
    - type: list
