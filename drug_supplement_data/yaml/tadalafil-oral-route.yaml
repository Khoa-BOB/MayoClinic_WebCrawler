    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that you tell all of your doctors that you take tadalafil
      . If you need emergency medical care for a heart problem, it is important that
      your doctor knows when you last took tadalafil.
  - type: paragraph
    text: If you will be taking this medicine for pulmonary arterial hypertension,
      it is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to decide if you should continue to take it. Blood and urine tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: If you take tadalafil for pulmonary arterial hypertension , do not take
      Cialis® or other PDE5 inhibitors, including sildenafil (Revatio® or Viagra®)
      or vardenafil (Levitra®). Cialis® also contains tadalafil. If you take too much
      tadalafil or take it together with these medicines, the chance for side effects
      will be higher.
  - type: paragraph
    text: If you experience a prolonged erection for more than 4 hours or a painful
      erection for more than 6 hours, contact your doctor immediately . This condition
      may require prompt medical treatment to prevent serious and permanent damage
      to your penis.
  - type: paragraph
    text: This medicine does not protect you against sexually transmitted diseases
      (including HIV or AIDS). Use protective measures and ask your doctor if you
      have any questions about this.
  - type: paragraph
    text: It is important to tell your doctor about any heart problems you have now
      or may have had in the past. This medicine can cause serious side effects in
      patients with heart problems.
  - type: paragraph
    text: Do not use this medicine if you are also using riociguat (Adempas®) or a
      nitrate medicine, often used to treat angina (chest pain). Nitrate medicines
      include nitroglycerin, isosorbide, Imdur®, Nitro-Bid®, Nitrostat®, Nitro-Dur®,
      Transderm Nitro®, Nitrol® Ointment, and Nitrolingual® Spray. Some illegal ("street")
      drugs called "poppers" (such as amyl nitrate, butyl nitrate, or nitrite) also
      contain nitrates. If you need to use a nitrate medicine, take it at least 48
      hours after your last dose of tadalafil.
  - type: paragraph
    text: Do not drink excessive amounts of alcohol (eg, 5 or more glasses of wine
      or 5 or more shots of whiskey) when taking tadalafil. When taken in excess,
      alcohol can increase your chances of getting a headache or dizziness, increase
      your heart rate, or lower your blood pressure.
  - type: paragraph
    text: If you experience sudden loss of vision in one or both eyes, contact your
      doctor immediately .
  - type: paragraph
    text: Check with your doctor right away if you have a sudden decrease in hearing
      or loss of hearing, which may be accompanied by dizziness and ringing in the
      ears .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm, back, or jaw pain
      - blurred vision
      - chest pain, discomfort, tightness, or heaviness
      - chills
      - cold sweats
      - confusion
      - dizziness
      - fainting
      - faintness or lightheadedness when getting up suddenly from a lying or sitting
        position
      - fast or irregular heartbeat
      - headache
      - hearing loss
      - increased erection
      - nausea
      - nervousness
      - pain or discomfort in the arms, jaw, back, or neck
      - pounding in the ears
      - slow or fast heartbeat
      - spontaneous penile erection
      - sweating
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Painful or prolonged erection of the penis
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blindness
      - blistering, peeling, or loosening of the skin
      - cough
      - cracks in the skin
      - decrease or change in vision
      - diarrhea
      - difficulty with speaking
      - double vision
      - fast, irregular, pounding, or racing heartbeat or pulse
      - headache, severe and throbbing
      - hives or welts, itching, skin rash
      - inability to move the arms, legs, or facial muscles
      - inability to speak
      - joint or muscle pain
      - loss of heat from the body
      - numbness or tingling of the face, hands, or feet
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - red, swollen skin
      - redness of the skin
      - redness or soreness of the eyes
      - scaly skin
      - slow speech
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach pain
      - sudden cardiac death
      - swelling of the feet or lower legs
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
