- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Tadalafil is used to treat men who have erectile dysfunction (also called
      sexual impotence). Tadalafil belongs to a group of medicines called phosphodiesterase
      5 (PDE5) inhibitors. These medicines prevent an enzyme called phosphodiesterase
      type-5 from working too quickly. The penis is one of the areas where this enzyme
      works.
  - type: paragraph
    text: Erectile dysfunction is a condition where the penis does not harden and
      expand when a man is sexually excited, or when he cannot keep an erection. When
      a man is sexually stimulated, his body's normal response is to increase blood
      flow to his penis to produce an erection. By controlling the enzyme, tadalafil
      helps to maintain an erection after the penis is stroked by increasing blood
      flow to the penis. Without physical action to the penis, such as that occurring
      during sexual intercourse, tadalafil will not work to cause an erection.
  - type: paragraph
    text: Tadalafil is also used to treat men who have signs and symptoms of benign
      prostatic hyperplasia (BPH). BPH is caused by an enlarged prostate. Men with
      BPH usually have difficulty urinating, a decreased flow of urination, hesitation
      at the beginning of urination, and a need to get up at night to urinate. Tadalafil
      will make these symptoms less severe and reduce the chance that prostate surgery
      will be needed. This medicine is also used to treat erectile dysfunction and
      signs and symptoms of BPH.
  - type: paragraph
    text: Tadalafil is also used in both men and women to treat the symptoms of pulmonary
      arterial hypertension to improve your ability to exercise. This is high blood
      pressure that occurs in the main artery that carries blood from the right side
      of the heart (the ventricle) to the lungs. When the smaller blood vessels in
      the lungs become more resistant to blood flow, the right ventricle must work
      harder to pump enough blood through the lungs. Tadalafil works on the PDE5 enzyme
      in the lungs to relax the blood vessels. This will increase the supply of blood
      to the lungs and reduce the workload of the heart.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription. .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use of Cialis® and Chewtadzy® tablet is not indicated for use in the pediatric
        population. Safety and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Adcirca® and Alyq™ tablet in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of tadalafil in the elderly. However,
        elderly patients are more sensitive to the effects of this medicine than younger
        adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Amyl Nitrite
      - Boceprevir
      - Erythrityl Tetranitrate
      - Isosorbide
      - Isosorbide Dinitrate
      - Isosorbide Mononitrate
      - Nitroglycerin
      - Pentaerythritol Tetranitrate
      - Propatyl Nitrate
      - Riociguat
      - Telaprevir
      - Vericiguat
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
