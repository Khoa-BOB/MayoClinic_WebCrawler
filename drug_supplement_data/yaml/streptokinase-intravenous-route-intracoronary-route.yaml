title: Streptokinase (intravenous route, intracoronary route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Streptase
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Streptokinase is used to dissolve blood clots that have formed in the blood
      vessels. It is used immediately after symptoms of a heart attack occur to improve
      patient survival. This medicine may also be used to treat blood clots in the
      lungs (pulmonary embolism) and in the legs (deep venous thrombosis) .
  - type: paragraph
    text: Streptokinase is also used to dissolve blood clots in tubes (catheters)
      that are inserted in blood vessels .
  - type: paragraph
    text: This medicine is available only with your doctor's prescription .
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of streptokinase in the pediatric population. Safety and efficacy
        have not been established .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of streptokinase in geriatric patients .
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Defibrotide
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acenocoumarol
      - Alteplase, Recombinant
      - Anistreplase
      - Apixaban
      - Ardeparin
      - Argatroban
      - Bemiparin
      - Betrixaban
      - Bivalirudin
      - Certoparin
      - Dabigatran Etexilate
      - Dalteparin
      - Danaparoid
      - Desirudin
      - Dipyridamole
      - Donanemab-azbt
      - Edoxaban
      - Enoxaparin
      - Fondaparinux
      - Heparin
      - Lecanemab-irmb
      - Lepirudin
      - Nadroparin
      - Parnaparin
      - Pentosan Polysulfate Sodium
      - Phenindione
      - Phenprocoumon
      - Protein C
      - Remibrutinib
      - Reteplase, Recombinant
      - Reviparin
      - Rivaroxaban
      - Tenecteplase
      - Ticagrelor
      - Tinzaparin
      - Urokinase
      - Warfarin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aspirin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems or a history of bleeding in any part of the body or
      - Blood clotting disorder, uncontrolled or
      - Brain disease or tumor or
      - High blood pressure, uncontrolled or
      - Stroke, recent (within two months) or
      - Surgery or injury to the brain or spine, recent (within two months)—This medicine
        should NOT be used in these conditions .
    - type: list
      ordered: false
      items:
      - Catheter (tube) infection or
      - Diabetes mellitus, uncontrolled or
      - Eye problems from diabetes (e.g., hemorrhagic retinopathy) or high blood pressure
        or
      - Heart disease or infections (e.g., mitral stenosis or endocarditis) or
      - Injections into a blood vessel or
      - Kidney disease, severe or
      - Liver disease, severe or
      - Lung disease (e.g., tuberculosis or severe bronchitis) or
      - Pancreatitis or
      - Placement of any tube into the body or
      - Surgery or injury of any kind, major and recent—The chance of serious bleeding
        may be increased .
    - type: list
      ordered: false
      items:
      - Heart rhythm problems or
      - Hypotension—These conditions may get worse .
    - type: list
      ordered: false
      items:
      - Streptococcal infection, recent (within 6 months) (e.g., sore throat, rheumatic
        fever)—This medicine may not be effective .
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine.
      This medicine is given through a needle or tube placed into one of your blood
      vessels .
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Streptokinase can cause bleeding that usually is not serious. However, serious
      bleeding may occur in some people. To help prevent serious bleeding, carefully
      follow any instructions given by your doctor. Move around as little as possible,
      and do not get out of bed on your own, unless your doctor tells you it is all
      right to do so .
  - type: paragraph
    text: Watch for any bleeding or oozing on your skin, such as around the place
      of injection or where blood was drawn from your arm. Also, check for blood in
      your urine or bowel movements. If you have any bleeding or injuries, tell your
      doctor or nurse right away .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - dizziness, faintness, or lightheadedness when getting up from a lying or sitting
        position suddenly
      - fever
      - sweating
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blood in stool
      - blood in urine
      - nose bleeds
      - red or purple spots on skin
      - unusual bruising
      - vomiting blood
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal pain or swelling
      - back pain or backaches
      - black, tarry stools
      - burning, itching, redness, or soreness of skin
      - cloudy urine
      - cold clammy skin
      - constipation
      - cough
      - coughing up blood
      - difficulty with breathing
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - fast, weak pulse
      - feeling of warmth
      - greatly decreased frequency of urination or amount of urine
      - headaches
      - hives or welts
      - large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
        feet, or sex organs
      - lightheadedness
      - muscle or bone pain
      - nausea and vomiting
      - noisy breathing
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness of the face, neck, arms, and occasionally, upper chest
      - shortness of breath
      - skin rash
      - tightness in chest
      - wheezing
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
