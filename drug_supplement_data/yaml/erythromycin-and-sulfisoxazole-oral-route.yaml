title: Erythromycin and sulfisoxazole (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: E.S.P.
    - type: paragraph
      text: Eryzole
    - type: paragraph
      text: Pediazole
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Erythromycin and sulfisoxazole is a combination antibiotic used to treat
      ear infections in children. It also may be used for other problems as determined
      by your doctor. It will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: Erythromycin and sulfisoxazole combination is available only with your doctor's
      prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested in children over the age of 2 months and
        has not been shown to cause different side effects or problems than it does
        in adults. This medicine should not be given to infants under 2 months of
        age unless directed by the child's doctor, because it may cause unwanted effects.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: This medicine is intended for use in children and is not generally used
        in adult patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Astemizole
      - Bepridil
      - Cisapride
      - Colchicine
      - Dihydroergotamine
      - Dronedarone
      - Flibanserin
      - Fluconazole
      - Grepafloxacin
      - Ketoconazole
      - Levoketoconazole
