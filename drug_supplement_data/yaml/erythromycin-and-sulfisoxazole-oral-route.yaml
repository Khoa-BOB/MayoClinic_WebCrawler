    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you at regular visits for any
      blood problems that may be caused by this medicine, especially if you will be
      taking this medicine for a long time.
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: 'Erythromycin and sulfisoxazole may cause your skin to be more sensitive
      to sunlight than it is normally. Exposure to sunlight, even for brief periods
      of time, may cause a skin rash, itching, redness or other discoloration of the
      skin, or a severe sunburn. When you begin taking this medicine:'
  - type: list
    ordered: false
    items:
    - Stay out of direct sunlight, especially between the hours of 10:00 a.m. and
      3:00 p.m., if possible.
    - Wear protective clothing, including a hat. Also, wear sunglasses.
    - Apply a sun block product that has a skin protection factor (SPF) of at least
      15. Some patients may require a product with a higher SPF number, especially
      if they have a fair complexion. If you have any questions about this, check
      with your health care professional.
    - Apply a sun block lipstick that has an SPF of at least 15 to protect your lips.
    - Do not use a sunlamp or tanning bed or booth.
  - type: paragraph
    text: If you have a severe reaction from the sun, check with your doctor.
  - type: paragraph
    text: Erythromycin and sulfisoxazole combination may cause blood problems. These
      problems may result in a greater chance of infection, slow healing, and bleeding
      of the gums. Therefore, you should be careful when using regular toothbrushes,
      dental floss, and toothpicks. Dental work should be delayed until your blood
      counts have returned to normal. Check with your medical doctor or dentist if
      you have any questions about proper oral hygiene (mouth care) during treatment.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Itching
      - skin rash
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Aching of joints and muscles
      - difficulty in swallowing
      - nausea or vomiting
      - pale skin
      - redness, blistering, peeling, or loosening of skin
      - skin rash
      - sore throat and fever
      - stomach pain, severe
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - yellow eyes or skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blood in urine
      - dark or amber urine
      - irregular or slow heartbeat
      - temporary loss of hearing (with kidney disease and high doses)
      - lower back pain
      - pain or burning while urinating
      - pale stools
      - recurrent fainting
      - severe stomach pain
      - swelling of front part of neck
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Increased sensitivity to sunlight
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramping and discomfort
      - diarrhea
      - headache
      - loss of appetite
      - nausea or vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sore mouth or tongue
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
