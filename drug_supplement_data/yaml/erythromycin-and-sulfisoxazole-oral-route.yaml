    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or other blood problems or
      - Glucose-6-phosphate dehydrogenase (G6PD) deficiency—Erythromycin and sulfisoxazole
        may increase the chance of blood problems
    - type: list
      ordered: false
      items:
      - Heart disease—High doses of erythromycin and sulfisoxazole may increase the
        chance of side effects in patients with a history of an irregular heartbeat
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Patients with liver or kidney disease may have an increased
        chance of side effects
    - type: list
      ordered: false
      items:
      - Loss of hearing—High doses of erythromycin and sulfisoxazole may increase
        the chance for hearing loss in some patients
    - type: list
      ordered: false
      items:
      - Porphyria—Erythromycin and sulfisoxazole may increase the chance of a porphyria
        attack
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Erythromycin and sulfisoxazole combination is best taken with extra amounts
      of water and may be taken with food. Additional amounts of water should be taken
      several times every day, unless otherwise directed by your doctor. Drinking
      extra water will help to prevent some unwanted effects (e.g., kidney stones)
      of sulfa medicines.
  - type: paragraph
    text: Do not give this medicine to infants under 2 months of age, unless otherwise
      directed by your doctor. Sulfa medicines may cause liver problems in these infants.
  - type: paragraph
    text: Use a specially marked measuring spoon or other device to measure each dose
      accurately. The average household teaspoon may not hold the right amount of
      liquid.
  - type: paragraph
    text: Do not use after the expiration date on the label. The medicine may not
      work properly after that date. Check with your pharmacist if you have any questions
      about this.
  - type: paragraph
    text: To help clear up your infection completely, keep taking this medicine for
      the full time of treatment, even if you begin to feel better after a few days.
      If you stop taking this medicine too soon, your symptoms may return.
  - type: paragraph
    text: This medicine works best when there is a constant amount in the blood. To
      help keep the amount constant, do not miss any doses. Also, it is best to take
      the doses at evenly spaced times, day and night. For example, if you are to
      take 4 doses a day, the doses should be spaced about 6 hours apart. If this
      interferes with your sleep or other daily activities, or if you need help in
      planning the best times to take your medicine, check with your health care professional.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (suspension): For infections caused by bacteria: Adults
        and teenagers—This medicine is used only in children. Children up to 2 months
        of age—Use is not recommended. Children 2 months of age and older—Dose is
        based on body weight: For the four-times-a-day dosing schedule Children weighing
        less than 8 kilograms (kg) (under 18 pounds): Dose must be determined by your
        doctor. Children weighing 8 to 16 kg (18 to 35 pounds): 1/2 teaspoonful (2.5
        milliliters [mL]) every six hours for ten days. Children weighing 16 to 24
        kg (35 to 53 pounds): 1 teaspoonful (5 mL) every six hours for ten days. Children
        weighing 24 to 32 kg (53 to 70 pounds): 1 1/2 teaspoonfuls (7.5 mL) every
        six hours for ten days. Children weighing more than 32 kg (over 70 pounds):
        2 teaspoonfuls (10 mL) every six hours for ten days. For the three-times-a-day
        dosing schedule Children weighing less than 6 kg (under 13 pounds): Dose must
        be determined by your doctor. Children weighing 6 to 12 kg (13 to 26 pounds):
        1/2 teaspoonful (2.5 mL) every eight hours for ten days. Children weighing
        12 to 18 kg (26 to 40 pounds): 1 teaspoonful (5 mL) every eight hours for
        ten days. Children weighing 18 to 24 kg (40 to 53 pounds): 1 1/2 teaspoonfuls
        (7.5 mL) every eight hours for ten days. Children weighing 24 to 30 kg (53
        to 66 pounds): 2 teaspoonfuls (10 mL) every eight hours for ten days. Children
        weighing more than 30 kg (over 66 pounds): 2 1/2 teaspoonfuls (12.5 mL) every
        eight hours for ten days.'
    - type: list
