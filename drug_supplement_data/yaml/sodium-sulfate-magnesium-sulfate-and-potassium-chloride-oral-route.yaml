        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Delafloxacin
      - Felodipine
      - Isradipine
      - Licorice
      - Nicardipine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (chest pain), unstable or
      - Congestive heart failure or
      - Electrolyte imbalance (eg, low calcium, magnesium, potassium, sodium in the
        blood) or
      - Heart attack, recent or
      - Heart disease (eg, cardiomyopathy) or
      - Heart rhythm problems (eg, prolonged QT interval, uncontrolled arrhythmia),
        history of or
      - Withdrawal from alcohol or benzodiazepines—May increase risk for seizures,
        arrhythmia, or kidney problems.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Inflammatory bowel disease or
      - Kidney disease or
      - Seizures, history of or
      - Trouble swallowing or
      - Ulcerative colitis, active and severe—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Gastric retention (problems with emptying of food or fluid from the stomach)
        or
      - Stomach or bowel problems (eg, blockage, ileus, perforation) or
      - Toxic colitis or megacolon (a very dilated intestine)—Should not be used in
        patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your doctor may have special instructions for you, depending on the schedule
      of your colonoscopy you are going to have. If you have not received such instructions,
      or if you do not understand them, check with your doctor in advance.
  - type: paragraph
    text: Take this medicine exactly as directed . Otherwise, the test you are going
      to have may not work and may have to be done again.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. You
      must read, understand, and follow these instructions carefully. Ask your doctor
      if you have any questions.
  - type: paragraph
    text: It is best if you do not eat any solid food before taking this medicine
      and until after your colonoscopy.
  - type: paragraph
    text: You may eat a low-residue breakfast (eg, eggs, white bread, cottage cheese,
      yogurt, grits, coffee, or tea) on the day before your colonoscopy.
  - type: paragraph
    text: You may drink only clear liquids (eg, coffee or tea without cream or nondairy
      creamer, fruit juices without pulp, gelatin desserts without fruit or topping,
      water, chicken broth, clear soda) all day and the next day until 2 hour before
      your colonoscopy. Do not drink anything colored red or purple. Do not drink
      milk or alcohol .
  - type: paragraph
    text: 'To use the Sutab®:'
  - type: list
    ordered: false
    items:
    - The Sutab® contains 2 bottles (12 tablets each bottle), taken as a 2-day regimen
      (Split-dose method).
    - Early in the evening before the colonoscopy, open one bottle of 12 tablets.
      Remove and throw away the drying agent (desiccant) canister from both bottles.
      Use the second bottle for the second dose on the morning of the colonoscopy.
    - Fill the given container with 16 ounces of water (up to the fill line). Swallow
      1 tablet at a time with a sip of water and drink the entire amount over 15 to
      20 minutes.
    - One hour after swallowing the last tablet, fill the container for the second
      time with 16 ounces of water (up to the fill line) and drink the entire amount
      over 30 minutes. After 30 minutes, repeat the same step and drink over 30 minutes.
    - Then, on the morning of colonoscopy (5 to 8 hours before the test and at least
      4 hours after the first dose), repeat the same steps and complete all Sutab®
      tablets and required amount of water at least 2 hours before the test.
    - If you have nausea, bloating, or cramping, you may pause or slow the rate of
      drinking the additional water until your symptoms stopped.
    - Do not eat or drink anything 2 hours prior to your colonoscopy, unless your
      doctor provides you with different instructions.
  - type: paragraph
    text: Avoid taking other laxatives (eg, bisacodyl, sodium picosulfate) while you
      are taking this medicine. Do not take any medicine by mouth within 1 hour before
      taking this medicine .
  - type: paragraph
    text: If you are taking chlorpromazine (Thorazine®), digoxin (Lanoxin®), iron
      supplements, penicillamine (Cuprimine®, Depen®), or tetracycline or fluoroquinolone
      antibiotics, take these medicines at least 2 hours before or 6 hours after taking
      Sutab® .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For cleansing the colon: For oral dosage form (tablet): Adults— Dose 1: One
        bottle (12 tablets) taken early in the evening before colonoscopy. Dose 2:
        One bottle (12 tablets) taken in the morning of the test, 5 to 8 hours before
        the colonoscopy. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablet): Adults— Dose 1: One bottle (12 tablets) taken
        early in the evening before colonoscopy. Dose 2: One bottle (12 tablets) taken
        in the morning of the test, 5 to 8 hours before the colonoscopy. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults— Dose 1: One bottle (12 tablets) taken early in the evening before
        colonoscopy. Dose 2: One bottle (12 tablets) taken in the morning of the test,
        5 to 8 hours before the colonoscopy.'
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'Dose 1: One bottle (12 tablets) taken early in the evening before colonoscopy.'
      - 'Dose 2: One bottle (12 tablets) taken in the morning of the test, 5 to 8
        hours before the colonoscopy.'
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Each bottle contains a drying agent (desiccant) canister that helps protect
        the tablets from moisture.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check you closely for any problems that
      may be caused by this medicine. Blood and urine tests may be needed to check
      for unwanted effects.
  - type: paragraph
    text: Call your doctor right away if you have decreased urination, dizziness,
      headache, or vomiting. These could be symptoms of a loss of too much body fluid
      (dehydration).
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you had a heart rhythm problem, including
      QT prolongation.
  - type: paragraph
    text: This medicine may increase your risk for seizures. This is more likely to
      occur if you take medicine for depression, if you are withdrawing from alcohol
      or benzodiazepine use, or if you electrolyte imbalances (eg, low sodium, potassium,
      calcium, or magnesium in the blood). Talk to your doctor if you have any concerns.
  - type: paragraph
    text: Keep yourself hydrated before, during, and after using this medicine. Drink
      extra fluids so you will pass more urine. This may help prevent kidney problems.
  - type: paragraph
    text: This medicine may cause serious stomach or bowel problems (eg, colon ulcers,
      ischemic colitis). Check with your doctor right away if you have stomach pain
      and tenderness, bloody stools, or rectal bleeding.
  - type: paragraph
    text: This medicine may cause serious allergic reactions (eg, anaphylaxis, angioedema,
      dyspnea, rash), which can be life-threatening and require immediate medical
      attention. Check with your doctor right away if you or your child have a cough,
      difficulty swallowing, dizziness, fast heartbeat, large, hive-like swelling
      on the face, eyelids, lips, tongue, throat, hands, legs, feet, or sex organs,
      rash, itching, trouble breathing, or unusual tiredness or weakness after using
      this medicine.
  - type: paragraph
    text: This medicine may increase the risk of stomach or bowel problems or choking
      if drying agent (desiccant) canister is not removed from the bottle.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - fainting
      - fast, slow, or uneven heartbeat
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody stools
      - burning feeling in the chest or stomach
      - chest tightness
      - confusion
      - cough
      - decreased urination
      - diarrhea
      - difficulty swallowing
      - drowsiness
      - dry mouth
      - fainting
      - hives, itching, skin rash
      - increase in heart rate
      - indigestion
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - lightheadedness
      - loss of appetite
      - mood or mental changes
      - nausea
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid breathing
      - rectal bleeding
      - seizures
      - stomach pain, tenderness, or upset
      - sunken eyes
      - swelling of the eyelids, face, lips, ankles, hands, or feet
      - thirst
      - trouble breathing
      - unusual tiredness or weakness
      - vomiting
      - wrinkled skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Full or bloated feeling
      - pressure in the stomach
      - swelling of the stomach area
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
