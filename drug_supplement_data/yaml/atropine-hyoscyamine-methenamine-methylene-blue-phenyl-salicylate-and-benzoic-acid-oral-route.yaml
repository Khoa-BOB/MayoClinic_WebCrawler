title: Atropine, hyoscyamine, methenamine, methylene blue, phenyl salicylate, and
  benzoic acid (oral route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Atropine , hyoscyamine , methenamine , methylene blue, phenyl salicylate
      , and benzoic acid combination medicine is an anticholinergic, anti-infective,
      and analgesic. It is given by mouth to help relieve the discomfort caused by
      urinary tract infections; however, it will not cure the infection itself. This
      combination medicine may also be used for other conditions as determined by
      your doctor.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Unusual excitement, nervousness, restlessness or irritability, and unusual
        warmth, dryness, and flushing of skin are more likely to occur in children,
        who are usually more sensitive to the effects of atropine and hyoscyamine
        (contained in this combination medicine). Also, when atropine and hyoscyamine
        are given to children during hot weather, a rapid increase in body temperature
        may occur. In infants and children, especially those with spastic paralysis
        or brain damage, this medicine may be more likely to cause severe side effects.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Confusion or memory loss, constipation, difficult urination, excitement,
        agitation, drowsiness, or dryness of mouth may be more likely to occur in
        elderly patients, who are usually more sensitive than younger adults to the
        effects of atropine and hyoscyamine. Also, this combination medicine may cause
        eye pain in patients who have untreated glaucoma.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content: []
    subsections: []
  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Substance Name
    level: 3
    content: []
    subsections: []
  - heading: Substance Name
    level: 3
    content: []
    subsections: []
  - heading: Substance Name
    level: 3
    content: []
    subsections: []
  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
