    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems (severe)—This combination medicine may increase heart rate,
        which would make bleeding problems worse
    - type: list
      ordered: false
      items:
      - Brain damage (in children)—May increase the central nervous system (CNS) effects
        of this combination medicine
    - type: list
      ordered: false
      items:
      - Colitis (severe) or
      - Dryness of mouth (severe or continuing) or
      - Enlarged prostate or
      - Fever or
      - Glaucoma or
      - Heart disease or
      - Hernia (hiatal) or
      - High blood pressure or
      - Intestinal blockage or other intestinal or stomach problems or
      - Lung disease or
      - Myasthenia gravis or
      - Toxemia of pregnancy or
      - Urinary tract blockage or difficult urination—This combination medicine may
        make these conditions worse
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Kidney disease or
      - Liver disease—Higher levels of medicine may result and increase the risk of
        side effects
    - type: list
      ordered: false
      items:
      - Overactive thyroid—May increase the heart rate
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: While you are taking this combination medicine, it is important for your
      urine to be acidic. To do this, your doctor may recommend that you eat more
      protein and such foods as cranberries (especially cranberry juice with vitamin
      C added), plums, or prunes. You should avoid foods that make the urine more
      alkaline, such as most fruits (especially citrus fruits and juices), milk, and
      other dairy products.
  - type: paragraph
    text: Take this medicine only as directed. Do not take more of it, do not take
      it more often, and do not take it for a longer time than your doctor ordered.
      To do so may increase the chance of side effects.
  - type: paragraph
    text: Each dose should be taken with a full glass (8 ounces) of water or other
      liquid (except citrus juices and milk). Drink plenty of water or other liquids
      every day, unless otherwise directed by your doctor. Drinking enough liquids
      will help your kidneys work better and lessen your discomfort.
  - type: paragraph
    text: To help clear up your infection completely, keep taking this medicine for
      the full time of treatment even if you begin to feel better after a few days.
      Do not miss any doses.
  - type: paragraph
    text: 'In order for this medicine to work well, your urine must be acid (pH 5.5
      or below). To make sure that your urine is acid:'
  - type: list
    ordered: false
    items:
    - Before you start taking this medicine, check your urine with phenaphthazine
      paper or another test to see if it is acid. If you have any questions about
      this, check with your health care professional.
    - You may need to change your diet; however, check with your doctor first if you
      are on a special diet (for example, for diabetes). To help make your urine more
      acid you should avoid most fruits (especially citrus fruits and juices), milk
      and other dairy products, and other foods which make the urine more alkaline.
      Eating more protein and foods such as cranberries (especially cranberry juice
      with vitamin C added), plums, or prunes may also help. If your urine is still
      not acid enough, check with your doctor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For relief of urinary tract symptoms: Adults
        and children 12 years of age and older—1 to 2 tablets four times a day. Children
        6 to 12 years of age—Dose must be determined by the doctor. Children up to
        6 years of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For relief of urinary tract symptoms: Adults and children 12 years of age
        and older—1 to 2 tablets four times a day. Children 6 to 12 years of age—Dose
        must be determined by the doctor. Children up to 6 years of age—Use is not
        recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—1 to 2 tablets four times a
        day.
      - Children 6 to 12 years of age—Dose must be determined by the doctor.
      - Children up to 6 years of age—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve within a few days or if they become worse,
      check with your doctor.
  - type: paragraph
    text: These medicines may make you sweat less, causing your body temperature to
      increase. Use extra care not to become overheated during exercise or hot weather
      while you are taking this medicine, since overheating may result in heat stroke.
      Also, hot baths or saunas may make you dizzy or faint while you are taking this
      medicine.
  - type: paragraph
    text: This medicine may cause some people to have blurred vision. Make sure you
      know how you react to this medicine before you drive, use machines, or do anything
      else that could be dangerous if you are not able to see well. If your vision
      continues to be blurred, check with your doctor.
  - type: paragraph
    text: This medicine may cause dryness of the mouth. For temporary relief, use
      sugarless candy or gum, melt bits of ice in your mouth, or use a saliva substitute.
      However, if your mouth continues to feel dry for more than 2 weeks, check with
      your dentist. Continuing dryness of the mouth may increase the chance of dental
      disease, including tooth decay, gum disease, and fungus infections.
  - type: paragraph
    text: Do not take this medicine within 2 or 3 hours of taking antacids or medicine
      for diarrhea. Taking antacids or antidiarrhea medicines and this medicine too
      close together may prevent this medicine from working properly.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - eye pain
      - skin rash or hives
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blood in urine and/or stools
      - diarrhea
      - dizziness
      - drowsiness (severe)
      - fast heartbeat
      - flushing or redness of face
      - headache (severe or continuing)
      - lower back pain
      - pain or burning while urinating
      - ringing or buzzing in the ears
      - shortness of breath or troubled breathing
      - sweating
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficult urination (more common with large doses taken over a prolonged period
        of time)
      - dryness of mouth, nose, or throat
      - nausea or vomiting
      - stomach upset or pain (more common with large doses taken over a prolonged
        period of time)
    - type: paragraph
      text: This medicine may cause your urine and/or stools to turn blue or blue-green.
        This is to be expected while you are taking this medicine.
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
