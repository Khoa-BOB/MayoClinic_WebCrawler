title: Metronidazole (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Flagyl I.V.
    - type: paragraph
      text: Flagyl I.V. RTU
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Metronidazole injection is used to treat serious bacterial infections in
      different areas of the body. It is also used to prevent infections in the bowels
      before and after surgery for some patients.
  - type: paragraph
    text: Metronidazole belongs to the class of medicines known as antibiotics. It
      works by killing bacteria or preventing their growth. However, this medicine
      will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of metronidazole injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of metronidazole injection in the
        elderly. However, elderly patients are more likely to have unwanted effects
        and age-related liver, kidney, or heart problems, which may require caution
        and an adjustment in the dose for patients receiving metronidazole injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Amprenavir
      - Bepridil
      - Cisapride
      - Disulfiram
      - Dronabinol
      - Dronedarone
      - Levoketoconazole
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acenocoumarol
      - Adagrasib
      - Alfuzosin
      - Amiodarone
      - Amitriptyline
      - Anagrelide
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Azithromycin
      - Bedaquiline
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Busulfan
      - Capecitabine
      - Ceritinib
      - Chloroquine
      - Chlorpromazine
      - Cholera Vaccine, Live
      - Cimetidine
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
      - Crizotinib
      - Cyclobenzaprine
      - Dabrafenib
      - Dasatinib
      - Degarelix
      - Delamanid
      - Desflurane
      - Desipramine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Carbamazepine
      - Cholestyramine
      - Cyclosporine
      - Milk Thistle
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood or bone marrow problems, or history of or
      - Brain disease (eg, aseptic meningitis, encephalopathy) or
      - Edema (too much fluid in the body) or
      - Leukopenia (low white blood cells), history of or
      - Optic neuropathy (eye disease with vision changes), history of or
      - Oral thrush (Candida infection) or
      - Peripheral neuropathy (nerve problem), history of or
      - Seizures, history of or
      - Vaginal yeast infection (Candida infection)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, end-stage or
      - Liver disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. It is given through a needle placed into one of your veins.
  - type: paragraph
    text: Your doctor will give you a few doses of this medicine until your condition
      improves, and then switch you to an oral medicine that works the same way. If
      you have any concerns about this, talk to your doctor.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress while you are receiving
      this medicine . This is to make sure that the infection is cleared up. Blood
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: You should not receive metronidazole if you have taken disulfiram (Antabuse®)
      within the last 2 weeks. Using these medicines together may cause serious unwanted
      effects .
  - type: paragraph
    text: Drinking alcoholic beverages while you are receiving this medicine may cause
      stomach pain, nausea, vomiting, headache, or flushing or redness of the face.
      Other alcohol-containing preparations (eg, elixirs, cough syrups, tonics) may
      also cause problems. This medicine may also cause alcoholic beverages to taste
      different. You should not drink alcoholic beverages or take other alcohol-containing
      preparations while you are receiving this medicine and for at least 3 days after
      stopping it .
  - type: paragraph
    text: Check with your doctor right away if you have dizziness, problems with muscle
      control or coordination, shakiness or an unsteady walk, slurred speech, or trouble
      with speaking. These may be symptoms of a serious brain condition called encephalopathy.
  - type: paragraph
    text: Check with your doctor right away if you are having burning, numbness, tingling,
      or painful sensations in the arms, hands, legs, or feet. These could be symptoms
      of a condition called peripheral neuropathy.
  - type: paragraph
    text: Call your doctor right away if you have confusion, drowsiness, fever, a
      general feeling of illness, a headache, loss of appetite, nausea, a stiff neck
      or back, or vomiting. These could be symptoms of a serious condition called
      aseptic meningitis.
  - type: paragraph
    text: This medicine may increase your risk of having serious liver problems, which
      may be life-threatening. This is more likely if you have Cockayne syndrome (rare
      form of dwarfism). Check with your doctor right away if you have pain or tenderness
      in the upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin.
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Check with your doctor
      right away if you have blistering, peeling, or loosening of the skin, red skin
      lesions, severe acne or a skin rash, sores or ulcers on the skin, or fever or
      chills with this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - back pain
      - blindness
      - blurred vision
      - burning, crawling, itching, numbness, pain, prickling, "pins and needles",
        or tingling feelings
      - change in taste
      - clay-colored stools
      - confusion
      - dark-colored urine
      - decreased vision
      - dizziness
      - drowsiness
      - eye pain
      - fever
      - headache
      - irritability
      - itching of the vagina or outside genitals
      - light-colored stools
      - loss of appetite
      - loss of taste
      - mood or mental changes
      - nausea
      - pain during sexual intercourse
      - seeing or hearing things that are not there
      - seizures
      - stiff neck or back
      - stomach pain
      - thick, white curd-like vaginal discharge without odor or with mild odor
      - uncontrolled eye movements
      - unpleasant breath odor
      - unsteadiness or awkwardness
      - unusual tiredness or weakness
      - vomiting
      - vomiting of blood
      - weakness in the arms, hands, legs, or feet
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blistering, peeling, or loosening of the skin
      - changes in skin color
      - changes in speech patterns
      - chest pain
      - chills
      - cough
      - diarrhea
      - fainting
      - fast, pounding, or irregular heartbeat or pulse
      - feeling of warmth
      - itching
      - joint or muscle pain
      - lower back or side pain
      - pain, tenderness, or swelling of the foot or leg
      - painful or difficult urination
      - pale skin
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - redness of the face, neck, arms, and occasionally, upper chest
      - shakiness and unsteady walk
      - slurred speech
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - trouble with speaking
      - unsteadiness, trembling, or other problems with muscle control or coordination
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry mouth
      - hives or welts, skin rash
      - redness of the skin
      - ''
      - stomach discomfort
      - stuffy nose
      - unpleasant metallic taste
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
