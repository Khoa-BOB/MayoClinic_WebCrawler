    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Trimethobenzamide is used to treat nausea and vomiting .
  - type: paragraph
    text: This medicine is available only with your doctor's prescription .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of intramuscular trimethobenzamide in the pediatric population. However, because
        of this medication's toxicity, use in children is contraindicated. Intramuscular
        trimethobenzamide should never be used in children .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on whether the risk of trimethobenzamide-induced
        adverse effects is increased in the elderly. However, because of this medication's
        toxicity, it should be used with caution, after less toxic alternatives have
        been considered and/or found ineffective. Recommended doses should not be
        exceeded, and the patient should be carefully monitored during therapy .
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bromopride
      - Potassium Chloride
      - Potassium Citrate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Electrolyte imbalance (high or low levels of minerals in the blood) or
      - High fever or
      - Intestinal infection, severe—May cause side effects to become worse .
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Trimethobenzamide is only used to relieve or prevent nausea and vomiting.
      A nurse or other trained health professional will give you this medicine. This
      medicine is given as a shot into one of your muscles .
  - type: paragraph
    text: Your doctor may only give you a few doses of this medicine until your condition
      improves, and then may switch you to an oral medicine that works the same way.
      If you have any concerns about this, talk to your doctor .
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Trimethobenzamide will add to the effects of alcohol and other CNS depressants
      (medicines that make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicines for hay fever, other allergies, or colds; sedatives,
      tranquilizers, or sleeping medicines; prescription pain medicines or narcotics;
      barbiturates; medicine for seizures; muscle relaxants; or anesthetics, including
      some dental anesthetics. Check with your doctor before taking any of these medicines
      while you are using trimethobenzamide .
  - type: paragraph
    text: This medicine may cause some people to become dizzy, lightheaded, drowsy,
      or less alert than they are normally. Make sure you know how you react to this
      medicine before you drive, use machines, or do anything else that could be dangerous
      if you are dizzy or not alert .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body spasm, with head and heels bent backward and body bowed forward
      - convulsions (seizures)
      - depression
      - shakiness or tremors
      - skin rash
      - sore throat or fever
      - unusual tiredness
      - vomiting (severe or continuing)
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Drowsiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - diarrhea
      - dizziness
      - headache
      - muscle cramps
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
