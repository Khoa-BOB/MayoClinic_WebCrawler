title: Sevelamer (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Renagel
    - type: paragraph
      text: Renvela
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Sevelamer is used to treat hyperphosphatemia (too much phosphate in the
      blood) in patients with chronic kidney disease who are on dialysis.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Suspension
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Renagel® in the pediatric population. Safety and efficacy
        have not been established.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Renvela® in children 6 years of
        age and older. Safety and efficacy have not been established in children younger
        than 6 years of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of sevelamer in the elderly. However,
        elderly patients may start at a lower dose.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Erdafitinib
      - Mycophenolate Mofetil
      - Mycophenolic Acid
      - Vadadustat
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Ciprofloxacin
      - Levothyroxine
      - Liothyronine
      - Tecovirimat
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bowel blockage—Should not be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Difficulty with swallowing or other swallowing problems or
      - Major surgery on the gastrointestinal tract or
      - Stomach or bowel problems (eg, constipation), severe—Use with caution. May
        cause serious side effects if the tablet cannot be swallowed completely and
        properly absorbed.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Take this medicine with meals.
  - type: paragraph
    text: Follow carefully any diet program your doctor may recommend.
  - type: paragraph
    text: 'To use the oral liquid:'
  - type: list
    ordered: false
    items:
    - Pour the entire contents of the packet in an empty cup.
    - Mix the powder with 2 tablespoons of water for the 0.4-gram dose or the 0.8-gram
      dose or 4 tablespoons of water for the 2.4-gram dose.
    - Stir the mixture vigorously and drink it as soon as you can or within 30 minutes.
      Be sure to stir the mixture again before drinking if you decide to wait.
  - type: paragraph
    text: Use only the brand of this medicine that your doctor prescribed. Different
      brands may not work the same way.
  - type: paragraph
    text: If you are taking any other medicines, you may be asked to take them at
      least 1 hour before or 3 hours after you take sevelamer. If you need help deciding
      the best times to take your other medicines, ask your doctor or pharmacist.
  - type: paragraph
    text: Take ciprofloxacin at least 2 hours before or 6 hours after this medicine.
  - type: paragraph
    text: Take mycophenolate mofetil at least 2 hours before this medicine.
  - type: paragraph
    text: Your doctor may tell you to take vitamins D, E, and K and folic acid supplements
      during treatment with this medicine, especially if you are pregnant.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For high phosphorus levels in the blood: For oral dosage forms (suspension
        or tablets): For patients not taking a phosphate binder: Renagel®: Adults—At
        first, 800 to 1600 milligrams (mg) (1 to 2 tablets) three times a day with
        meals, depending on your blood phosphorus level. Your doctor will adjust your
        dose as needed. Children—Use and dose must be determined by your doctor. Renvela®:
        Adults—At first, 800 to 1600 mg (1 to 2 tablets) or 0.8 to 1.6 grams (g) of
        powder for suspension three times a day with meals depending on your blood
        phosphorus level. Your doctor will adjust your dose as needed. Children 6
        years of age and older—Dose is based on body surface area (BSA) and must be
        determined by your doctor: 1.2 square meter (m2) or more of BSA—At first,
        1.6 g of powder for suspension three times a day with meals depending on your
        blood phosphorus level. Your doctor will adjust your dose as needed. 0.75
        to less than 1.2 m2 of BSA—At first, 0.8 g of powder for suspension three
        times a day with meals depending on your blood phosphorus level. Your doctor
        will adjust your dose as needed. Children younger than 6 years of age—Use
        and dose must be determined by your doctor. For patients switching from Renagel®
        tablets to Renvela® powder for suspension or tablets: Adults—Use the same
        dose in grams. Your doctor will adjust your dose as needed. Children—Use and
        dose must be determined by your doctor. For patients switching from calcium
        acetate to sevelamer, your doctor will determine the best dose for you and
        adjust as needed.'
