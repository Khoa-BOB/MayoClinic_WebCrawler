    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: If your symptoms do not improve or if they get worse, call your doctor.
  - type: paragraph
    text: This medicine may cause serious stomach or bowel problems, including blockage,
      bleeding, ulcers, colitis (severe diarrhea), necrosis, or perforation (tear
      or hole). Check with your doctor right away if you have bloating, bloody, black,
      or tarry stools, constipation, diarrhea, fever, heartburn, indigestion, nausea
      and vomiting, stomach pain, cramping, burning, or tenderness, or vomiting of
      material that looks like coffee grounds.
  - type: paragraph
    text: Many people with kidney problems need to be on a special diet. To keep your
      kidney disease from getting worse, it is very important that you follow your
      special diet and take your medicines regularly, even if you are feeling better.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating
      - bloody, black, or tarry stools
      - constipation
      - diarrhea
      - fast heartbeat
      - fever
      - heartburn
      - hives, itching, rash
      - hoarseness
      - indigestion
      - irritation
      - joint pain, stiffness, or swelling
      - nausea or vomiting
      - redness of the skin
      - stomach pain, cramping, burning, or tenderness
      - swelling of the eyelids, face, lips, hands, or feet
      - tightness in the chest
      - troubled breathing or swallowing
      - vomiting of material that looks like coffee grounds, severe and continuing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - excess air or gas in the stomach or intestines
      - full feeling
      - passing gas
      - stomach discomfort or upset
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
