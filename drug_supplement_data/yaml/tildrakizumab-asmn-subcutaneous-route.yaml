title: Tildrakizumab-asmn (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ilumya
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Tildrakizumab-asmn injection is used to treat moderate to severe plaque
      psoriasis, which is a skin disease with red patches and white scales that do
      not go away. It is given to patients who may receive other types of treatment,
      including pills, injections, or phototherapy (light treatment).
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of tildrakizumab-asmn injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of tildrakizumab-asmn injection in
        the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abatacept
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Anifrolumab-fnia
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Cholera Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Ebola Zaire Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Poliovirus Vaccine, Live
      - Rotavirus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine, Live
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
      - Zoster Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Infection, active—Use is not recommended in patients with this condition.
    - type: list
      ordered: false
      items:
      - Tuberculosis infection, inactive—Should be treated first before starting treatment
        with this medicine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given as a shot under your skin (eg, stomach, thighs,
      upper arm) at weeks 0 and 4 and every 12 weeks thereafter.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly and to check for unwanted
      effects. Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: You will need to have a skin test for tuberculosis before you start receiving
      this medicine. Tell your doctor if you or anyone in your home has ever had a
      positive reaction to a tuberculosis skin test.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including angioedema,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you have a rash, itching, or large, hive-like swelling
      on the face, eyelids, lips, tongue, throat, hands, legs, feet, or sex organs
      after receiving this medicine.
  - type: paragraph
    text: 'Your body''s ability to fight infection may be reduced while you are being
      treated with tildrakizumab-asmn. It is very important that you call your doctor
      at the first signs of any infection. Check with your doctor right away if you
      have any of the following symptoms while using this medicine: fever, chills,
      cough or hoarseness, flu-like symptoms, lower back or side pain, painful or
      difficult urination, or unusual tiredness or weakness.'
  - type: paragraph
    text: While you are being treated with tildrakizumab-asmn, and after you stop
      treatment with it, do not have any immunizations (vaccines) without your doctor's
      approval. Tildrakizumab-asmn may lower your body's resistance and the vaccine
      may not work as well or you might get the infection the vaccine is meant to
      prevent. In addition, you should not be around other persons living in your
      household who receive live virus vaccines because there is a chance they could
      pass the virus on to you. Some examples of live vaccines include measles, mumps,
      influenza (nasal flu vaccine), poliovirus (oral form), rotavirus, and rubella.
      If you have questions about this, talk to your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - chills
      - cough
      - difficulty in breathing
      - ear congestion
      - fever
      - headache
      - loss of voice
      - nasal congestion
      - runny nose
      - sneezing
      - sore throat
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Itching skin
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of skin, feeling of
        pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - diarrhea
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm or leg pain
      - dizziness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
