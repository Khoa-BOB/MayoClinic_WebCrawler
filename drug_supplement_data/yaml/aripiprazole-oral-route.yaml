    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Tizanidine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse, history of or
      - Depression or
      - Diabetes, or family history of or
      - Drug abuse or dependence, history of or
      - Hyperglycemia (high blood sugar) or
      - Neuroleptic malignant syndrome (NMS), history of or
      - Neutropenia (low white blood cells) or
      - Seizures, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Blood vessel disease or
      - Dehydration or
      - Heart attack or stroke, history of or
      - Heart disease or
      - Heart failure or
      - Heart rhythm problems or
      - Hypotension (low blood pressure) or
      - Hypovolemia (decrease in blood volume) or
      - Ischemic heart disease, history of or
      - Trouble with swallowing—Use with caution. May cause side effects to become
        worse.
    - type: list
      ordered: false
      items:
      - Phenylketonuria (PKU)—The orally disintegrating tablet contains phenylalanine,
        which can make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: If you are using the orally disintegrating tablet , make sure your hands
      are dry before you handle the tablet. Do not open the blister pack that contains
      the tablet until you are ready to take it. Remove the tablet from the blister
      pack by peeling back the foil, then taking the tablet out. Do not push the tablet
      through the foil. Do not break or split the tablet. Place the tablet in your
      mouth. It should melt quickly. After the tablet has melted, you may swallow
      or take a sip of water.
  - type: paragraph
    text: Swallow the tablets whole. Do not break, crush, or chew them.
  - type: paragraph
    text: Abilify Mycite® has a sensor in the tablet, which helps track it inside
      the stomach or bowels. The Abilify Mycite® System comes with a patch (wearable
      sensor), a smartphone application (app), and a web-based portal. Follow your
      doctor's instructions on how to use the medicine.
  - type: paragraph
    text: The Abilify Mycite® tablet is usually detected within 30 minutes after you
      take it, but there may be a delay of more than 2 hours for the smartphone app
      and web portal to detect that you have taken the medicine, and sometimes it
      might not be detected at all.
  - type: paragraph
    text: 'To apply the Abilify Mycite® patch :'
  - type: list
    ordered: false
    items:
    - The app will tell you when to apply or remove the patch. It should be changed
      weekly or sooner as needed.
    - Place the patch to the left side of your body just above the lower edge of your
      rib cage. Do not put the patch in areas where the skin is scraped, cracked,
      inflamed, or irritated, or near the area where you had removed the previous
      patch. The app will help you place the patch in the correct location.
    - You may keep the patch on when showering, swimming, or exercising.
  - type: paragraph
    text: Aripiprazole may be taken with or without food. If your doctor tells you
      to take it a certain way, follow your doctor's instructions.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
