    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If the Abilify Mycite® tablet is not detected on the app or portal after
        you take it, do not repeat the dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to allow for changes in your dose and to make sure this medicine is working
      properly. Blood and urine tests may be needed to check for any unwanted effects.
  - type: paragraph
    text: For some patients, this medicine can increase thoughts of suicide. Tell
      your doctor right away if you start to feel more depressed and have thoughts
      about hurting yourself. Report any unusual thoughts or behaviors that trouble
      you, especially if they are new or are getting worse quickly. Make sure the
      doctor knows if you have trouble sleeping, get upset easily, have a big increase
      in energy, or start to act reckless. Also tell the doctor if you have sudden
      or strong feelings, such as feeling nervous, angry, restless, violent, or scared.
      Let the doctor know if you or anyone in your family has bipolar disorder (manic-depressive
      illness) or has tried to commit suicide.
  - type: paragraph
    text: This medicine may add to the effects of alcohol and other central nervous
      system (CNS) depressants (medicines that make you drowsy or less alert). Some
      examples of CNS depressants are antihistamines or medicines for hay fever, other
      allergies, or colds, sedatives, tranquilizers, or sleeping medicines, prescription
      pain medicines or narcotics, medicines for seizures or barbiturates, muscle
      relaxants, or anesthetics, including some dental anesthetics. Check with your
      doctor before taking any CNS depressants while you are taking this medicine
      .
  - type: paragraph
    text: Aripiprazole may cause drowsiness, trouble with thinking, or trouble with
      controlling movements, which may lead to falls, fractures or other injuries.
      Do not drive or do anything else that could be dangerous unless you know how
      this medicine affects you .
  - type: paragraph
    text: 'Check with your doctor right away if you have any of the following symptoms
      while using this medicine: convulsions (seizures), difficulty with breathing,
      a fast heartbeat, a high fever, high or low blood pressure, increased sweating,
      loss of bladder control, severe muscle stiffness, unusually pale skin, or tiredness.
      These could be symptoms of a serious condition called neuroleptic malignant
      syndrome (NMS).'
  - type: paragraph
    text: 'This medicine may cause tardive dyskinesia (a movement disorder) especially
      in elderly women. Check with your doctor right away if you have any of the following
      symptoms while taking this medicine: lip smacking or puckering, puffing of the
      cheeks, rapid or worm-like movements of the tongue, uncontrolled chewing movements,
      or uncontrolled movements of the arms and legs.'
  - type: paragraph
    text: Some people who have used this medicine had unusual changes in their behavior.
      Talk with your doctor right away if you start having unusual urges, such as
      gambling urges, binge or compulsive eating, compulsive shopping, or sexual urges
      while using this medicine.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up from a lying or sitting position. Getting up slowly may help. If this problem
      continues or gets worse, check with your doctor.
  - type: paragraph
    text: This medicine may make it more difficult for your body to cool down. It
      might reduce how much you sweat. Your body could get too hot if you do not sweat
      enough. If your body gets too hot, you might feel dizzy, weak, tired, or confused.
      You might have an upset stomach or vomit. Call your doctor if drinking cool
      water and moving away from the heat does not cool you down.
  - type: paragraph
    text: This medicine may increase the amount of sugar in your blood. Also, the
      oral liquid form contains sugar. Check with your doctor right away if you have
      increased thirst or increased urination. If you have diabetes, you may notice
      a change in the results of your urine or blood sugar tests. If you have any
      questions, check with your doctor.
  - type: paragraph
    text: This medicine can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. If you can, avoid people
      with infections. Check with your doctor immediately if you think you are getting
      an infection or if you get a fever or chills, cough or hoarseness, lower back
      or side pain, or painful or difficult urination.
  - type: paragraph
    text: This medicine may increase your weight. Your doctor may need to check your
      weight on a regular basis while you are using this medicine.
  - type: paragraph
    text: Do not change the dose or stop taking this medicine without checking first
      with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines)
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with speaking
      - drooling
      - loss of balance control
      - muscle trembling, jerking, or stiffness
      - restlessness
      - shuffling walk
      - stiffness of the limbs
      - twisting movements of the body
      - uncontrolled movements, especially of the face, neck, and back
