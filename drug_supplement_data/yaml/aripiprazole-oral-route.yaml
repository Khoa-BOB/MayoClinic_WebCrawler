        mania: Abilify® and Abilify Discmelt®: Adults—At first, 15 milligrams (mg)
        once a day. When it is given with lithium or valproate, the starting dose
        is 10 to 15 mg once a day. Your doctor may adjust your dose as needed. However,
        the dose is usually not more than 30 mg per day. Children 10 years of age
        and older—At first, 2 mg once a day. The dose will be gradually increased
        to 10 mg once a day. Your doctor may adjust your dose again as needed. However,
        the dose is usually not more than 30 mg per day. Children younger than 10
        years of age—Use and dose must be determined by your doctor. Abilify Mycite®:
        Adults—At first, 15 milligrams (mg) once a day. When it is given with lithium
        or valproate, the starting dose is 10 to 15 mg once a day. Your doctor may
        adjust your dose as needed. However, the dose is usually not more than 30
        mg per day. Children—Use and dose must be determined by your doctor. For depression:
        Adults—At first, 2 to 5 milligrams (mg) once a day. Your doctor may adjust
