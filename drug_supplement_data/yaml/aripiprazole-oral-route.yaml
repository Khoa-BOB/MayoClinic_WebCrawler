- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Aripiprazole is used alone or together with other medicines to treat mental
      conditions such as bipolar I disorder (manic-depressive illness), major depressive
      disorder, and schizophrenia. It is also used in children to treat irritability
      associated with autistic disorder and Tourette syndrome. Aripiprazole works
      in the brain to change how certain chemicals affect patients. It is an antipsychotic
      agent.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.  Abilify®
      oral solution was withdrawn from the market on May 15, 2015 and this dose form
      is not marketed by any generic manufacturers.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Disintegrating
    - Tablet
    - Film
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of aripiprazole in children younger than 13 years of age with
        schizophrenia and in children younger than 10 years of age with bipolar disorder
        . Safety and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Abilify Mycite® in children. Safety and efficacy have not
        been established.
    - type: paragraph
      text: Aripiprazole is not approved for use in children or teenagers with major
        depression .
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of aripiprazole in children 6 to
        17 years of age with autistic disorder .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of aripiprazole in elderly patients
        who have schizophrenia, depression, or bipolar disorder. This medicine should
        not be used to treat behavioral problems in elderly patients who have dementia
        or Alzheimer disease.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Bromopride
      - Cisapride
