title: Aripiprazole (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Abilify
    - type: paragraph
      text: Abilify Discmelt
    - type: paragraph
      text: Abilify Mycite
    - type: paragraph
