    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Once the powder medicine has been mixed with the liquid, this mixture
        may be stored at room temperature, away from direct light. You must use this
        mixture within 3 hours. Throw away any leftover mixture.
    - type: paragraph
      text: Throw away used needles in a hard, closed container that the needles cannot
        poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Your body's ability to fight an infection may be reduced while you are being
      treated with rilonacept. It is very important that you call your doctor right
      away if you or your child have a fever, chills, cough, hoarseness, lower back
      or side pain, or painful or difficult urination.
  - type: paragraph
    text: While you are being treated with rilonacept, do not have any immunizations
      (vaccinations) without your doctor's approval . Rilonacept may lower your body's
      resistance and there is a chance you might get the infection the immunization
      is meant to prevent. Tell your doctor about any vaccinations you have received
      in the past. Ask your doctor whether you should receive any vaccinations, including
      pneumonia and flu shots, before receiving rilonacept.
  - type: paragraph
    text: You will need to have a skin test for tuberculosis before you start using
      this medicine. Tell your doctor if you or anyone in your home has ever had a
      positive reaction to a tuberculosis test.
  - type: paragraph
    text: Using this medicine may increase your risk of certain types of cancer. Talk
      with your doctor about this risk.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction. Check with your doctor
      right away if you have a rash, itching, swelling of the face, tongue, and throat,
      trouble breathing, or chest pain after you get the injection.
  - type: paragraph
    text: Do not take adalimumab (Humira®), anakinra (Kineret®), etanercept (Enbrel®),
      or infliximab (Remicade®) while you are being treated with this medicine, unless
      your doctor says it is okay
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of skin, feeling of
        pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at site
      - body aches or pain
      - chills
      - cough
      - difficulty in breathing
      - ear congestion
      - fever
      - headache
      - loss of voice
      - runny or stuffy nose
      - sneezing
      - sore throat
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - diarrhea
      - difficult, burning, or painful urination
      - frequent urge to urinate
      - lower back or side pain
      - stomach discomfort or pain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody or black, tarry stools
      - constipation
      - cough producing mucus
      - lower back or side pain
      - pain or tenderness around eyes and cheekbones
      - painful or difficult urination
      - severe stomach pain
      - tenderness
      - tightness of chest
      - trouble breathing
      - vomiting of blood or material that looks like coffee grounds
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
