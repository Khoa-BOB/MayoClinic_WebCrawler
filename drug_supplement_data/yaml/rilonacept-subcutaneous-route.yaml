title: Rilonacept (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Arcalyst
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Rilonacept injection is used to treat cryopyrin-associated periodic syndromes
      (CAPS), including familial cold autoinflammatory syndrome (FCAS) and Muckle-Wells
      syndrome (MWS). Rilonacept can help lessen the signs and symptoms of CAPS, including
      rash, joint pain, fever, and tiredness. It is also used to treat recurrent pericarditis
      (RP) and reduce the risk of recurrence.
  - type: paragraph
    text: Rilonacept injection is also used to maintain control of symptoms of deficiency
      of interleukin-1 receptor antagonist (DIRA).
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of rilonacept to treat CAPS or RP in children younger than
        12 years of age and to maintain control of symptoms of DIRA in children weighing
        less than 10 kilograms (kg). Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatrics-specific
        problems that would limit the usefulness of rilonacept in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adalimumab
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Anakinra
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Etanercept
      - Infliximab
      - Influenza Virus Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Poliovirus Vaccine, Live
      - Rotavirus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine, Live
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
      - Zoster Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma or
      - Diabetes or
      - Infection (eg, hepatitis B, hepatitis C, HIV or AIDS), active or history of
        or
      - Weak immune system—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Infection, active or chronic—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Tuberculosis, latent—May increase risk of this condition to become active
        again.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine is given as a shot under your skin. Rilonacept may sometimes
      be given at home to patients who do not need to be in the hospital. If you are
      using this medicine at home, your doctor will teach you how to prepare and inject
      the medicine. Be sure that you understand exactly how the medicine is prepared
      and injected.
  - type: paragraph
    text: This medicine comes with a patient instructions. Read and follow the instructions
      in the insert carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Use a new needle and syringe each time you inject your medicine.
  - type: paragraph
    text: You will be shown the body areas where this shot can be given. Use a different
      body area each time you give yourself a shot. Keep track of where you give each
      shot to make sure you rotate body areas. This will help prevent skin problems
      from the injections. Do not inject into skin areas that are bruised, red, tender,
      or hard.
  - type: paragraph
    text: This powder medicine must be mixed with the liquid provided in your dose
      kit. Mix the medicine only when you are ready to use it. Do not use if it is
      cloudy or has specks floating in it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form (vial): For cryopyrin-associated periodic syndromes
        and recurrent pericarditis: Adults—At first, 320 milligrams (mg) given as
        two, 2-milliliter (mL) doses of 160 mg injected under the skin on the same
        day at 2 different sites. Your dose will be adjusted to 160 mg once a week,
        given as a single, 2 mL injection. Children 12 to 17 years of age—Dose is
        based on body weight and must be determined by your doctor. At first, 4.4
        milligrams (mg) per kilogram (kg) of body weight up to 320 mg given as one
        or two, 2 mL doses injected under the skin. Your dose will be adjusted to
        2.2 mg per kg of body weight up to 160 mg once a week, given as a single,
        2 mL injection. Children younger than 12 years of age—Use and dose must be
        determined by your doctor. For deficiency of IL-1 receptor antagonist: Adults—320
        milligrams (mg) given as two, 2-milliliter (mL) doses of 160 mg injected under
        the skin on the same day at 2 different sites once a week. Children weighing
        10 kilograms (kg) or more—Dose is based on body weight and must be determined
        by your doctor. At first, 4.4 milligrams (mg) per kilogram (kg) of body weight
        up to 320 mg given as one or two, 2 mL doses injected under the skin on the
        same day at 2 different sites once a week. Children weighing less than 10
        kg—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For cryopyrin-associated periodic syndromes and recurrent pericarditis: Adults—At
        first, 320 milligrams (mg) given as two, 2-milliliter (mL) doses of 160 mg
        injected under the skin on the same day at 2 different sites. Your dose will
        be adjusted to 160 mg once a week, given as a single, 2 mL injection. Children
        12 to 17 years of age—Dose is based on body weight and must be determined
