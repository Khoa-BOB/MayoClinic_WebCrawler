        week, given as a single, 2 mL injection. Children younger than 12 years of
        age—Use and dose must be determined by your doctor.'
      - 'For deficiency of IL-1 receptor antagonist: Adults—320 milligrams (mg) given
        as two, 2-milliliter (mL) doses of 160 mg injected under the skin on the same
        day at 2 different sites once a week. Children weighing 10 kilograms (kg)
        or more—Dose is based on body weight and must be determined by your doctor.
        At first, 4.4 milligrams (mg) per kilogram (kg) of body weight up to 320 mg
        given as one or two, 2 mL doses injected under the skin on the same day at
        2 different sites once a week. Children weighing less than 10 kg—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 320 milligrams (mg) given as two, 2-milliliter (mL) doses
