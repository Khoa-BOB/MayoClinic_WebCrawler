title: Sunitinib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Sutent
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Auro-SUNItinib
    - type: paragraph
      text: Taro-SUNItinib
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Sunitinib is used to treat a gastrointestinal stromal tumor (GIST) after
      other medicines (eg, imatinib) did not work very well. It may also be used when
      patients are not able to take imatinib. GIST is a group of cancer cells that
      start growing in the wall of the stomach, bowels, or rectum. Sunitinib is also
      used to treat advanced (late-stage) kidney cancer and as additional treatment
      in patients at high risk for kidney cancer after surgical removal of the kidney.
  - type: paragraph
    text: Sunitinib is also used to treat a type of pancreatic cancer called pancreatic
      neuroendocrine tumor (pNET), that cannot be surgically removed and is locally
      advanced or metastatic (cancer that has spread).
  - type: paragraph
    text: Sunitinib belongs to the group of medicines known as antineoplastics. It
      interferes with the growth of cancer cells, which are eventually destroyed.
      Since the growth of normal body cells may also be affected by sunitinib, other
      effects will also occur. Some of these may be serious and must be reported to
      your doctor. Other effects, like hair loss, may not be serious but may cause
      concern. Some effects may not occur for months or years after the medicine is
      used.
  - type: paragraph
    text: Before you begin treatment with sunitinib, you should talk to your doctor
      about the benefits as well as the risks of using this medicine.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of sunitinib in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of sunitinib in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Bepridil
      - Cisapride
      - Colchicine
      - Dengue Tetravalent Vaccine, Live
      - Dronedarone
      - Fluconazole
      - Ketoconazole
