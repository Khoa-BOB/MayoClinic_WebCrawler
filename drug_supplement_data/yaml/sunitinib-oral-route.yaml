      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is less than 12 hours from your regular time,
        take it as soon as possible. If you miss a dose and it is more than 12 hours
        , skip the missed dose and take your next dose at the regular time.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to see if the medicine is working properly. Blood and urine tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. It
      may also cause birth defects if the father is using it when his sexual partner
      becomes pregnant. If you are a woman who can get pregnant, your doctor may do
      tests to make sure you are not pregnant before starting sunitinib treatment.
      Female patients should use an effective form of birth control during treatment
      with this medicine and for 4 weeks after the last dose. Male patients who have
      female partners should use effective birth control during treatment with this
      medicine and for 7 weeks after the last dose. If you think you have become pregnant
      while using the medicine, tell your doctor right away.
  - type: paragraph
    text: If you plan to have children, talk with your doctor before using this medicine.
      Some men and women using this medicine have become infertile (unable to have
      children).
  - type: paragraph
    text: Cancer medicines can cause nausea or vomiting in most people, sometimes
      even after receiving medicines to prevent it. Ask your doctor or nurse about
      other ways to control these unwanted effects.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: This medicine may cause serious heart problems (eg, heart attack, heart
      failure, cardiomyopathy). Tell your doctor if you have chest pain, decreased
      urine output, dilated neck veins, dizziness, faintness, irregular breathing,
      irregular heartbeat, nausea, pain or discomfort in arms, jaw, back or neck,
      sweating, swelling of face, fingers, feet, or lower legs, tightness in the chest,
      trouble breathing, unusual tiredness or weakness, vomiting, or weight gain.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or have a fast, pounding, or uneven heartbeat.
      Make sure your doctor knows if you or anyone in your family has ever had a heart
      rhythm problem such as QT prolongation.
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. You might need to measure
      your blood pressure at home. If you think your blood pressure is too high, call
      your doctor right away.
  - type: paragraph
    text: This medicine may also increase your risk of bleeding and cause delay in
      wound healing. Check with your doctor right away if you notice any unusual bleeding
      or bruising, black, tarry stools, blood in the urine or stools, or pinpoint
      red spots on your skin.
  - type: paragraph
    text: It is important that you check with your doctor before having any dental
      procedures or surgeries done, or are receiving bisphosphonates (eg, alendronate,
      ibandronate, risedronate, Actonel®, Boniva®, Fosamax®, Zometa®) while you are
      using sunitinib. Tell your doctor right away if you have jaw tightness, swelling,
      numbing, or pain or a loose tooth. This could be symptoms of a severe jaw problem.
  - type: paragraph
    text: This medicine may cause a serious type of reaction called tumor lysis syndrome.
      Your doctor may give you medicine to help prevent this. Call your doctor right
      away if you have a decrease or change in the amount of urine, joint pain, stiffness,
      or swelling, lower back, side, or stomach pain, a rapid weight gain, swelling
      of the feet or lower legs, or unusual tiredness or weakness.
  - type: paragraph
    text: Thrombotic microangiopathy (damage in the smallest blood vessels) may occur
      while you are using this medicine. Tell your doctor right away if you have a
      fever, tiredness, confusion, loss of vision, or seizures.
  - type: paragraph
    text: Serious skin reactions, including erythema multiforme (EM), Stevens-Johnson
      syndrome (SJS), necrotizing fasciitis, and toxic epidermal necrolysis (TEN)
      can occur with this medicine. Check with your doctor right away if you have
      blistering, peeling, or loosening of the skin, red skin lesions, severe acne
      or skin rash, sores or ulcers on the skin, red irritated eyes, unusual tiredness
      and weakness, or fever or chills while you are using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have back pain, blurred vision,
      confusion, dizziness, drowsiness, fever, headache, seizures, or unusual tiredness
      or weakness. These may be symptoms of a rare and serious brain condition called
      reversible posterior leukoencephalopathy syndrome (RPLS).
  - type: paragraph
    text: This medicine may cause thyroid problems (eg, hyperthyroidism or hypothyroidism).
      Tell your doctor if you have nervousness, sensitivity to heat, sweating, trouble
      sleeping, weight loss, constipation, depressed mood, dry skin and hair, feeling
      cold, hair loss, hoarseness or husky voice, muscle cramps and stiffness, slowed
      heartbeat, weight gain, unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause hypoglycemia (low blood sugar). Tell your doctor
      right away if you notice changes in your blood sugar or you have shaking, trembling,
      sweating, fast or pounding heartbeat, faintness or lightheadedness, hunger,
      or confusion.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery or medical tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - bloating or swelling of the face, arms, hands, fingers, lower legs, or feet
      - blurred vision
      - chest pain
      - chills
      - confusion
      - constipation
      - coughing up blood
      - cracked lips
      - decreased urine output and frequency
      - diarrhea
      - difficulty swallowing
      - dilated neck veins
      - dizziness
      - dry mouth
      - fainting
      - fast, slow, or irregular heartbeat
      - fever
      - headache
      - increased menstrual flow or vaginal bleeding
      - irregular breathing
      - lightheadedness
      - nervousness
      - nosebleeds
      - paralysis
      - pounding in the ears
      - prolonged bleeding from cuts
      - rapid breathing
      - rapid weight gain
      - red or black, tarry stools
      - red or dark brown urine
      - sores, ulcers, or white spots on the lips, tongue, or inside the mouth
      - sunken eyes
      - swelling or inflammation of the mouth
      - thirst
      - tightness in the chest
      - tingling of the hands or feet
      - trouble breathing
      - unusual tiredness or weakness
      - unusual weight gain or loss
      - wrinkled skin
      - yellow eyes or skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding from the rectum
      - bleeding from wounds
      - depressed mood
      - dry skin and hair
      - excessive sweating
      - feeling cold
      - hair loss
      - hoarseness or husky voice
      - indigestion
      - loss of appetite
      - muscle cramps and stiffness
      - nausea
      - pain in the chest, groin, or legs, especially the calves
      - pain in the stomach, side, or abdomen, possibly radiating to the back
      - severe, sudden headache
      - slurred speech
      - sudden loss of coordination
      - sudden, severe weakness or numbness in the arm or leg
      - vision changes
      - vomiting
      - vomiting of blood or material that looks like coffee grounds
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - chest discomfort
      - cloudy or bloody urine
      - darkening of the skin
      - drowsiness
      - general feeling of tiredness or weakness
      - light-colored stools
      - mental depression
      - seizures
      - skin rash
      - stomach pain, continuing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - cough
      - dark-colored urine
      - heavy feeling of the jaw
      - increased thirst
      - itching
      - joint pain, stiffness, or swelling
      - loosening of a tooth
      - lower back or side pain
      - muscle cramps or spasms
      - muscular pain, tenderness, wasting, or weakness
      - pain, swelling, or numbness in the mouth or jaw
      - painful or difficult urination
      - pale skin
      - red skin lesions, often with a purple center
      - sores, ulcers, or white spots on lips or tongue or inside the mouth
      - sore throat
      - sudden, severe chest pain
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - blistering, peeling, redness, or swelling of the palms, hands, or bottoms
        of the feet
      - change in color of the treated skin
      - change in taste
      - difficulty with moving
      - discouragement
      - excess air or gas in the stomach or bowels
      - feeling of fullness
      - feeling sad or empty
      - hair color changes
      - hair loss or thinning of the hair
      - heartburn
      - irritability
      - lack or loss of strength
      - loss of interest or pleasure
      - loss of taste
      - muscle aches or pains
      - numbness, pain, tingling, or unusual sensations in the palms of the hands
        or bottoms of the feet
      - pain or burning in the throat
      - passing gas
      - stomach discomfort or upset
      - swelling or inflammation of the mouth
      - swollen joints
      - trouble concentrating
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
