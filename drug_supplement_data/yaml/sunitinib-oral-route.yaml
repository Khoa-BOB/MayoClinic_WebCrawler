      - 'For treatment of kidney cancer after surgical removal of kidney: Adults—50
        milligrams (mg) once a day for 4 weeks. This is followed by 2 weeks without
        medicine for nine 6-week cycles. Your doctor may adjust your dose as needed
        and tolerated. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—37.5 milligrams (mg) once a day. Your doctor may increase your dose
        as needed and tolerated. However, the dose is usually not more than 50 mg
        per day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—50 milligrams (mg) once a day for 4 weeks. This is followed by 2 weeks
