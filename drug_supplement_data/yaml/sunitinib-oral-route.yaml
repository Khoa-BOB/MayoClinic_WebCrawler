    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Bradycardia (very slow heart beat), history of or
      - Congestive heart failure, history of or
      - Diabetes or
      - Heart attack, recent or
      - Heart disease (eg, cardiomyopathy, myocardial ischemia, history of or
      - Heart rhythm problems (eg, QT prolongation), history of or
      - Hypertension (high blood pressure) or
      - Kidney disease (other than cancer) or
      - Liver disease or
      - Proteinuria (protein in the urine) or
      - Seizures or
      - Stomach problems (eg, perforation, ulcers) or
      - Thyroid problems—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Dental or tooth problems or
      - Dental procedures or
      - Dental surgery—May increase risk for severe jaw problems.
    - type: list
      ordered: false
      items:
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood)—May cause side effects to become
        worse.
    - type: list
      ordered: false
      items:
      - Infection, severe or
      - Surgery or
      - Trauma—These conditions may cause adrenal gland problems.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your doctor will tell you how much of this medicine to use and how often.
      Your dose may need to be changed several times in order to find out what works
      best for you. Do not take more medicine, do not take it more often, and do not
      take it for a longer time than your doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food. Do not open the capsules.
  - type: paragraph
    text: Grapefruit and grapefruit juice may cause you to have too much of this medicine
      in the blood. You should not eat grapefruit or drink grapefruit juice while
      you are taking this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For the treatment of advanced pancreatic
        cancer or pancreatic neuroendocrine tumor (pNET): Adults—37.5 milligrams (mg)
        once a day. Your doctor may increase your dose as needed and tolerated. However,
        the dose is usually not more than 50 mg per day. Children—Use and dose must
        be determined by your doctor. For the treatment of GIST and kidney cancer:
        Adults—50 milligrams (mg) once a day for 4 weeks. This is followed by 2 weeks
        without medicine. Your doctor may tell you to repeat this cycle. Children—Use
        and dose must be determined by your doctor. For treatment of kidney cancer
        after surgical removal of kidney: Adults—50 milligrams (mg) once a day for
        4 weeks. This is followed by 2 weeks without medicine for nine 6-week cycles.
        Your doctor may adjust your dose as needed and tolerated. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For the treatment of advanced pancreatic cancer or pancreatic neuroendocrine
        tumor (pNET): Adults—37.5 milligrams (mg) once a day. Your doctor may increase
        your dose as needed and tolerated. However, the dose is usually not more than
        50 mg per day. Children—Use and dose must be determined by your doctor.'
      - 'For the treatment of GIST and kidney cancer: Adults—50 milligrams (mg) once
        a day for 4 weeks. This is followed by 2 weeks without medicine. Your doctor
        may tell you to repeat this cycle. Children—Use and dose must be determined
