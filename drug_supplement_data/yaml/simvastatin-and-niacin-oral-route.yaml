    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: 'Do not use niacin/simvastatin if you are also using the following medicines:
      boceprevir (Victrelis®), cyclosporine (Gengraf®, Neoral®, Sandimmune®), danazol
      (Danocrine®), gemfibrozil (Lopid®), nefazodone (Serzone®), telaprevir (Incivek®),
      certain antibiotics (such as clarithromycin, erythromycin, itraconazole, ketoconazole,
      posaconazole, telithromycin, Nizoral®), certain blood pressure medicines (such
      as diltiazem, verapamil, Calan®, Cardizem®, Verelan®), or certain medicines
      to treat HIV/AIDS (such as atazanavir, indinavir, nelfinavir, ritonavir, saquinavir,
      Crixivan®, Kaletra®, Lexiva®, Norvir®, Prezista®, Reyataz®). Using these medicines
      together can cause serious side effects .'
  - type: paragraph
    text: Call your doctor right away if you have unexplained muscle pain, tenderness,
      or weakness. These may be symptoms of serious muscle problems, such as myopathy
      or immune-mediated necrotizing myopathy (IMNM). Myopathy is more common when
      high doses of simvastatin (e.g., 80 milligrams) are used, but some people get
      myopathy with lower doses.
  - type: paragraph
    text: Call your doctor right away if you have dark-colored urine, diarrhea, a
      fever, muscle cramps or spasms, muscle pain or stiffness, or feel very tired
      or weak. These could be symptoms of a serious muscle problem called rhabdomyolysis,
      which can cause kidney problems.
  - type: paragraph
    text: Chinese patients who are taking large amounts of niacin (greater than or
      equal to 1 gram or 1000 milligrams per day) together with simvastatin may have
      an increased risk for muscle injury. Talk to your doctor if you are Chinese
      or have Chinese ancestry and take large amounts of niacin (Niacor®, Niaspan®).
      Your doses of niacin/simvastatin should not be more than 1000 mg/20 mg per day.
  - type: paragraph
    text: Make sure your doctor or dentist knows that you are using this medicine.
      Stop using this medicine several days before having surgery or medical tests.
      This medicine may affect the results of certain medical tests. You may also
      need to stop using this medicine if you have a major surgery, a major injury,
      or you develop other serious health problems.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of liver damage.
  - type: paragraph
    text: This medicine may affect blood sugar levels. This is important if you are
      diabetic or prediabetic. If you notice a change in the results of your blood
      or urine sugar tests, or if you have any questions, check with your doctor.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, lightheaded, drowsy,
      or less alert than they are normally. Make sure you know how you react to this
      medicine before you drive, use machines, or do anything else that could be dangerous
      if you are not alert . Change positions slowly when getting up from a sitting
      or lying position.
  - type: paragraph
    text: This medicine should not be taken with vitamins containing niacin or nicotinamide.
  - type: paragraph
    text: This medicine may cause a side effect called flushing. Flushing is a feeling
      of warmth or redness on the face, neck, arms, and occasionally, on the upper
      chest. To avoid flushing, alcohol, hot beverages, and spicy foods should be
      avoided around the time you take this medicine. Additionally, your doctor may
      recommend that you take aspirin 30 minutes before taking this medicine to prevent
      flushing.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain, severe
      - black, tarry stools
      - chills
      - dark-colored urine
      - dizziness
      - fever
      - headache
      - light-colored stools
      - loss of appetite
      - muscle cramps or spasms
      - muscle pain or stiffness
      - muscular tenderness, wasting, or weakness
      - nausea or vomiting
      - rash
      - unpleasant breath odor
      - unusual tiredness or weakness
      - vomiting of blood
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Feeling of warmth
      - redness of the face, neck, arms, and occasionally, upper chest
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - diarrhea
      - itching skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
