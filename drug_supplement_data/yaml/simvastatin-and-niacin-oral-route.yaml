title: Simvastatin and niacin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Simcor
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Simvastatin and niacin combination is used together with a proper diet to
      lower cholesterol and triglyceride (fat) levels in the blood. This medicine
      may help prevent medical problems caused by clogged blood vessels, such as heart
      attacks and strokes.
  - type: paragraph
    text: Simvastatin and niacin work together to treat cholesterol and lipid (fat)
      disorders. Niacin is vitamin B3, which reduces the amount of cholesterol in
      the blood. Simvastatin belongs to the group of medicines called HMG-CoA inhibitors
      or statins. It works to reduce the amount of cholesterol in the blood by blocking
      an enzyme that is needed to make cholesterol.
  - type: paragraph
    text: This medicine was available only with your doctor's prescription. The Simcor(R)
      product will no longer be marketed in the United States as of April 18, 2016.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of simvastatin and niacin combination in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of simvastatin and niacin combination
        in the elderly. However, elderly patients are more likely to have muscle problems,
        which may require caution in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Amprenavir
      - Atazanavir
      - Boceprevir
