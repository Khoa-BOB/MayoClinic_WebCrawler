    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Cranberry Juice
      - Grapefruit Juice
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse, or history of or
      - Chinese ancestry or
      - Hypothyroidism (an underactive thyroid), not well-controlled or
      - Kidney disease, severe or
      - Liver disease, history of—Use with caution. May cause side effects to become
        worse.
    - type: list
      ordered: false
      items:
      - Bleeding, arterial (coming from an artery) or
      - Liver disease, active or
      - Liver enzymes, elevated or
      - Peptic ulcer disease, active—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Electrolyte disorders, severe or
      - Endocrine disorders, severe or
      - Epilepsy (seizures), not well-controlled or
      - Hypotension (low blood pressure) or
      - Major surgery or trauma, recent or
      - Metabolic disorders, severe or
      - Sepsis (severe infection in the blood)—Patients with these conditions may
        be at risk for muscle or kidney problems.
    - type: list
      ordered: false
      items:
      - Diabetes—This medicine may increase blood sugar levels.
    - type: list
      ordered: false
      items:
      - Gout—Use with caution. May make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not use more of
      it, do not use it more often, and do not use it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: In addition to this medicine, your doctor may change your diet to one that
      is low in fat, sugar, and cholesterol. Carefully follow your doctor's orders
      about any special diet .
  - type: paragraph
    text: Swallow the extended-release tablet whole. Do not break, crush, or chew
      it.
  - type: paragraph
    text: It is best to take this medicine at bedtime, with a low-fat meal or snack.
  - type: paragraph
    text: Do not change your dose without checking first with your doctor. The 80
      mg dose of simvastatin may increase your risk to have serious muscle problems.
  - type: paragraph
    text: If you are taking amiodarone (Cordarone®), amlodipine (Norvasc®), or ranolazine
      (Ranexa®) together with niacin/simvastatin, your niacin/simvastatin dose should
      not exceed 1000 mg/20 mg per day, unless directed otherwise by your doctor .
      When used together, these medicines may increase your risk of muscle injury
      which can lead to kidney failure, particularly at higher doses of simvastatin.
  - type: paragraph
    text: If you are also using cholestyramine (Questran®) or colestipol (Colestid®),
      take it at least 4 to 6 hours before or after you take this medicine.
  - type: paragraph
    text: Tell your doctor if you regularly drink grapefruit juice. Drinking large
      amounts of grapefruit juice (more than 1 quart each day) while taking this medicine
      may increase the amount of simvastatin in the body which may increase your risk
      of muscle injury and could result in kidney failure.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets): For high cholesterol: For
        patients not on niacin or simvastatin therapy: Adults—One tablet once a day
        in the evening. Your doctor may adjust your dose if needed. However, the dose
        is usually not more than 2000 milligrams (mg) of niacin and 40 mg of simvastatin.
        Children—Use and dose must be determined by your doctor. For patients on niacin
        therapy: Adults—One tablet (500 milligrams [mg] of niacin and 20 mg of simvastatin)
        once a day in the evening. Your doctor may adjust your dose if needed. However,
        the dose is usually not more than 2000 mg of niacin and 40 mg of simvastatin.
        Children—Use and dose must be determined by your doctor. For patients on simvastatin
        therapy: Adults—One tablet (500 milligrams [mg] of niacin and 40 mg of simvastatin)
        once a day in the evening. Your doctor may adjust your dose if needed. However,
        the dose is usually not more than 2000 mg of niacin and 40 mg of simvastatin.
        Children—Use and dose must be determined by your doctor.'
    - type: list
