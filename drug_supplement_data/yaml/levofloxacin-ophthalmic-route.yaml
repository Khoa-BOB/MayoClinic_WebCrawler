title: Levofloxacin (ophthalmic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Iquix
    - type: paragraph
      text: Quixin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ophthalmic levofloxacin is used in the eye to treat bacterial infections
      of the eye. Ophthalmic levofloxacin works by killing bacteria.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use is not recommended in infants under 1 year of age. In children older
        than 1 year, this medicine is not expected to cause different side effects
        or problems than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of levofloxacin
        in the elderly with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Levoketoconazole
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Acecainide
      - Acenocoumarol
      - Adagrasib
      - Albiglutide
      - Alfuzosin
      - Alogliptin
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Anagrelide
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Atorvastatin
      - Azathioprine
      - Azithromycin
      - Bedaquiline
      - Betamethasone
      - Bretylium
      - Budesonide
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Canagliflozin
      - Ceritinib
      - Chloroquine
      - Chlorpromazine
      - Chlorpropamide
      - Cholera Vaccine, Live
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aminolevulinic Acid
      - Lanthanum Carbonate
      - Phenytoin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: paragraph
      text: 'To use levofloxacin ophthalmic solution (eye drops):'
    - type: list
      ordered: false
      items:
      - First, wash your hands. Then tilt the head back and pull the lower eyelid
        away from the eye to form a pouch. Drop the medicine into the pouch and gently
        close the eyes. Do not blink. Keep the eyes closed for 1 or 2 minutes to allow
        the medicine to come into contact with the infection.
      - If you think you did not get the drop of medicine into your eyes properly,
        use another drop.
      - To keep the medicine as germ-free as possible, do not touch the applicator
        tip to any surface (including the eye). Also, keep the container tightly closed.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic solution dosage form: For bacterial conjunctivitis: Adults
        and children 1 year of age and older—Days 1 and 2: Put one to two drops in
        the affected eye(s) every two hours while awake. Do not put drops in more
        than 8 times a day. Days 3 through 7: Put one to two drops in the affected
        eye(s) every 4 hours while awake. Do not put drops in more than 4 times a
        day. Infants and children up to 1 year of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For bacterial conjunctivitis: Adults and children 1 year of age and older—Days
        1 and 2: Put one to two drops in the affected eye(s) every two hours while
        awake. Do not put drops in more than 8 times a day. Days 3 through 7: Put
        one to two drops in the affected eye(s) every 4 hours while awake. Do not
        put drops in more than 4 times a day. Infants and children up to 1 year of
        age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults and children 1 year of age and older—Days 1 and 2: Put one to two
        drops in the affected eye(s) every two hours while awake. Do not put drops
        in more than 8 times a day. Days 3 through 7: Put one to two drops in the
        affected eye(s) every 4 hours while awake. Do not put drops in more than 4
        times a day.'
      - Infants and children up to 1 year of age—Use and dose must be determined by
        your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your eye infection does not improve within a few days, or if it becomes
      worse, check with your doctor.
  - type: paragraph
    text: This medicine may cause your eyes to become more sensitive to light than
      they are normally. Wearing sunglasses and avoiding too much exposure to bright
      light may help lessen the discomfort.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - voice changes
    - type: list
      ordered: false
      items:
      - body aches or pain
      - congestion
      - dryness or soreness of throat
      - runny nose
      - swelling of the eyelid
      - tender, swollen glands in neck
      - trouble in swallowing
    - type: list
      ordered: false
      items:
      - Itching, pain, redness or swelling of eye or eyelid
      - watering of eyes
      - decreased vision
      - fever
      - feeling of having something in the eye
      - headache
      - hoarseness
      - eye burning, dryness, itching, or pain
      - increased sensitivity of eyes to light
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
