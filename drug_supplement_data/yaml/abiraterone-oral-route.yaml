title: Abiraterone (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Yonsa
    - type: paragraph
      text: Zytiga
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: 'Note: Women of childbearing potential should not use or handle abiraterone
      tablets without protection (eg, gloves) .'
  - type: paragraph
    text: Abiraterone is used in combination with prednisone to treat patients with
      metastatic castration-resistant prostate cancer (prostate cancer that is resistant
      to medical or surgical treatments that lower testosterone and has already spread
      to other parts of the body) and metastatic high-risk castration-sensitive prostate
      cancer.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Abiraterone is not indicated for use in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of abiraterone in the elderly. However,
        elderly patients are more sensitive to the effects of this medicine than younger
        adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Acarbose
      - Albiglutide
      - Alogliptin
      - Amiodarone
      - Amphetamine
      - Apalutamide
      - Apixaban
      - Aripiprazole
      - Atomoxetine
      - Avacopan
      - Benzphetamine
      - Brexpiprazole
      - Canagliflozin
      - Carbamazepine
      - Carvedilol
      - Cerivastatin
      - Chlorpropamide
      - Cilostazol
      - Clarithromycin
      - Clomipramine
      - Clozapine
      - Codeine
      - Conivaptan
      - Dabigatran Etexilate
      - Dabrafenib
      - Dapagliflozin
      - Desipramine
      - Desloratadine
      - Deutetrabenazine
      - Dextroamphetamine
      - Dihydrocodeine
      - Domperidone
      - Donepezil
      - Doxepin
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Dulaglutide
      - Duloxetine
      - Edoxaban
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Dextromethorphan
      - Repaglinide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Adrenal or pituitary problems, history of or
      - Diabetes or
      - Heart attack, recent or
      - Heart failure or
      - Heart or blood vessel disease, history of or
      - Heart rhythm problems (eg, ventricular arrhythmia) or
      - Hypertension (high blood pressure) or
      - Hypokalemia (low potassium in the blood)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease, moderate—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Should not be used in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have questions.
  - type: paragraph
    text: Swallow the tablet whole with water. Do not break, crush, or chew it.
  - type: paragraph
    text: Take this medicine on an empty stomach. Do not eat food 2 hours before or
      1 hour after taking this medicine.
  - type: paragraph
    text: Your doctor may also give you other medicines (eg, gonadotropin-releasing
      hormone medicine) during treatment with abiraterone or you should have had surgical
      removal of the testes before using this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For castration-resistant prostate cancer:
        Adults—1000 milligrams (mg) (two 500 mg tablets or four 250 mg tablets) once
        a day, taken together with 5 mg oral prednisone 2 times a day. Children—Use
        is not recommended. For high-risk castration-sensitive prostate cancer: Adults—1000
        milligrams (mg) (two 500 mg tablets or four 250 mg tablets) once a day, taken
        together with 5 mg oral prednisone once a day. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For castration-resistant prostate cancer: Adults—1000 milligrams (mg) (two
        500 mg tablets or four 250 mg tablets) once a day, taken together with 5 mg
        oral prednisone 2 times a day. Children—Use is not recommended.'
      - 'For high-risk castration-sensitive prostate cancer: Adults—1000 milligrams
        (mg) (two 500 mg tablets or four 250 mg tablets) once a day, taken together
        with 5 mg oral prednisone once a day. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—1000 milligrams (mg) (two 500 mg tablets or four 250 mg tablets) once
        a day, taken together with 5 mg oral prednisone 2 times a day.
      - Children—Use is not recommended.
    - type: list
      ordered: false
      items:
      - Adults—1000 milligrams (mg) (two 500 mg tablets or four 250 mg tablets) once
        a day, taken together with 5 mg oral prednisone once a day.
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you missed a dose of this medicine, take your normal dose the following
        day. If more than one daily dose is missed, call your doctor.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests will
      be needed to check for any unwanted effects that may be caused by this medicine.
  - type: paragraph
    text: Women and children should not use this medicine. Pregnant women or women
      who may become pregnant should not handle or touch the tablets without protection
      (eg, gloves) . This medicine may also cause birth defects if the father is using
      it when his sexual partner becomes pregnant. You must use a condom and another
      effective method of birth control during treatment with this medicine and for
      3 weeks after the last dose. If a pregnancy occurs while you are using this
      medicine, tell your doctor right away.
  - type: paragraph
    text: You will also need to have your blood pressure measured before starting
      this medicine and while you are using it. If you notice any changes to your
      recommended blood pressure, call your doctor right away. If you have questions
      about this, talk to your doctor.
  - type: paragraph
    text: Do not interrupt or stop using this medicine together with prednisone without
      first asking your doctor . This may increase your risk of having adrenal gland
      problems. Talk to your doctor if you have darkening of the skin, diarrhea, dizziness,
      fainting, loss of appetite, mental depression, nausea, skin rash, unusual tiredness
      or weakness, or vomiting.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: Abiraterone and prednisone/prednisolone may increase your risk for bone
      fractures and death when used together with radium 223 dichloride (radiation
      treatment). Tell your doctor if you are having any other treatment for your
      prostate cancer.
  - type: paragraph
    text: This medicine may cause hypoglycemia (low blood sugar), especially if you
      have diabetes and take certain medicines for diabetes. Check with your doctor
      right away if you have anxiety, blurred vision, chills, cold sweats, coma, confusion,
      cool, pale skin, depression, dizziness, fast heartbeat, headache, increased
      hunger, nausea, nervousness, nightmares, seizures, shakiness, slurred speech,
      or unusual tiredness or weakness.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - bloody or cloudy urine
      - blurred vision
      - bone pain or fracture
      - chest pain or discomfort
      - decreased urine
      - difficult, burning, or painful urination
      - dry mouth
      - fainting
      - fast, pounding, or irregular heartbeat or pulse
      - feeling of warmth
      - frequent urge to urinate
      - headache
      - increased thirst
      - increased urge to urinate during the night
      - lightheadedness, dizziness, or fainting
      - loss of appetite
      - lower back or side pain
      - mood changes
      - muscle pain or cramps
      - nausea
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - pain or swelling in the arms or legs without any injury
      - passing urine more often
      - pounding in the ears
      - rapid weight gain
      - redness of the face, neck, arms, and occasionally, upper chest
      - seizures
      - slow heartbeat
      - sudden sweating
      - swelling
      - swelling with pits or depressions on the skin
      - trouble breathing
      - unusual tiredness or weakness
      - unusual weight gain or loss
      - vomiting
      - waking to urinate at night
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm, back, or jaw pain
      - chest tightness or heaviness
      - clay-colored stools
      - cool, sweaty skin
      - dark urine
      - decreased urine output
      - difficulty with breathing
      - dilated neck veins
      - extreme tiredness or weakness
      - fever
      - irregular breathing
      - itching skin or rash
      - light-colored stools
      - stomach pain or tenderness
      - sweating
      - weakness
      - weight gain
      - yellow eyes or skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Darkening of the skin
      - diarrhea
      - mental depression
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - chills
      - cold sweats
      - coma
      - confusion
      - cool, pale skin
      - cough
      - difficulty swallowing
      - general feeling of discomfort or illness
      - hives
      - increased hunger
      - irregular heartbeat, recurrent
      - muscle pain, spasms, stiffness, tenderness, wasting, or weakness
      - nightmares
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - shakiness
      - slurred speech
      - stomach pain, continuing
      - thickening of bronchial secretions
      - unpleasant breath odor
      - unusual tiredness or weakness
      - vomiting of blood
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - body aches or pain
      - difficulty with moving
      - ear congestion
      - heartburn
      - indigestion
      - joint pain
      - loss of voice
      - runny or stuffy nose
      - sneezing
      - sore throat
      - stomach discomfort or upset
      - swelling or stiffness of the joints
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
