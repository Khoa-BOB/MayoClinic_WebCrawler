      - Azathioprine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atazanavir
      - Cobicistat
      - Darunavir
      - Indinavir
      - Nelfinavir
      - Tenofovir Disoproxil Fumarate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Fanconi syndrome (kidney disease), history of or
      - Hemophilia (a bleeding problem) or
      - Hyperglycemia (high blood sugar) or
      - Kidney failure, history of or
      - Liver disease (including hepatitis B or C) or
      - Sulfa allergy—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease, severe—Use is not recommended in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      these instructions carefully. Read it again each time you refill your prescription
      in case there is new information. Ask your doctor if you have any questions.
  - type: paragraph
    text: Do not change the dose or stop using this medicine without checking first
      with your doctor . When your supply of this medicine is running low, contact
      your doctor or pharmacist ahead of time. Do not allow yourself to run out of
      this medicine.
  - type: paragraph
    text: If you are also using didanosine (Videx®), take it 1 hour before or 2 hours
      after taking Prezcobix®.
  - type: paragraph
    text: Darunavir and cobicistat contains a fixed amount of medicine in each tablet.
  - type: paragraph
    text: Take this medicine with food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of HIV infection: Adults and
        children weighing 40 kilograms (kg) or more—One tablet once a day. Each tablet
        contains 800 milligrams (mg) of darunavir and 150 mg of cobicistat. Children
        weighing 25 kg to less than 40 kg—One tablet once a day. Each tablet contains
        675 mg of darunavir and 150 mg of cobicistat. Children weighing less than
        25 kg—Use and dose must be determined by your doctor. Children younger than
        3 years of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For treatment of HIV infection: Adults and children weighing 40 kilograms
        (kg) or more—One tablet once a day. Each tablet contains 800 milligrams (mg)
        of darunavir and 150 mg of cobicistat. Children weighing 25 kg to less than
        40 kg—One tablet once a day. Each tablet contains 675 mg of darunavir and
        150 mg of cobicistat. Children weighing less than 25 kg—Use and dose must
        be determined by your doctor. Children younger than 3 years of age—Use is
        not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children weighing 40 kilograms (kg) or more—One tablet once a day.
        Each tablet contains 800 milligrams (mg) of darunavir and 150 mg of cobicistat.
      - Children weighing 25 kg to less than 40 kg—One tablet once a day. Each tablet
        contains 675 mg of darunavir and 150 mg of cobicistat.
      - Children weighing less than 25 kg—Use and dose must be determined by your
        doctor.
      - Children younger than 3 years of age—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      , especially during the first few weeks that you take this medicine, to make
      sure it is working properly. Blood and urine tests may be needed to check for
      any unwanted effects.
  - type: paragraph
    text: This medicine should not be used together with alfuzosin (Uroxatral®), carbamazepine
      (Tegretol®), cisapride (Propulsid®), dronedarone (Multaq®), elbasvir/grazoprevir
      (Zepatier®), ivabradine (Corlaonor®), lomitapide (Juxtapid®, Lojuxta®), lovastatin
      (Mevacor®), lurasidone (Latuda®), naloxegol (Movantik®, Moventig®), oral midazolam
      (Versed®), phenobarbital (Luminal®), phenytoin (Dilantin®), pimozide (Orap®),
      ranolazine (Ranexa®), rifampin (Rifadin®, Rimactane®), sildenafil (Revatio®),
      simvastatin (Zocor®), St. John's wort, triazolam (Halcion®), or ergot medicines
      (eg, dihydroergotamine, ergotamine, methylergonovine, Cafergot®, Ergomar®, Wigraine®).
      Do not use this medicine together with colchicine (Colcrys®) if you have kidney
      or liver disease.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Birth
      control pills may not work as well to prevent pregnancy when used with this
      medicine. Use another form of birth control (eg, condoms, spermicide) along
      with your pills to keep from getting pregnant during treatment with this medicine.
      If you think you have become pregnant while using this medicine, tell your doctor
      right away.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: 'Serious skin reactions (eg, Stevens-Johnson syndrome, toxic epidermal necrolysis,
      drug rash with eosinophilia and systemic symptoms, and acute generalized exanthematous
      pustulosis) can occur with this medicine. Check with your doctor right away
      if you have any of the following symptoms: severe rash, blistering, peeling,
      or loosening of the skin, chills, cough, diarrhea, itching, joint or muscle
      pain, red skin lesions, often with a purple center, skin rash, sore throat,
      sores, ulcers, or white spots in the mouth or on the lips, or unusual tiredness
      or weakness.'
  - type: paragraph
    text: This medicine may increase your risk for kidney problems, including acute
      kidney failure or Fanconi syndrome (when used together with tenofovir DF). Check
      with your doctor right away if you have changes in how much you urinate, decreased
      mental sharpness, nausea, vomiting, loss of appetite, or muscle twitches or
      cramps.
  - type: paragraph
    text: This medicine may increase blood sugar levels. Check with your doctor if
      you notice a change in the results of your blood or urine sugar tests.
  - type: paragraph
    text: This medicine may cause you to have excess body fat. Tell your doctor if
      you notice changes in your body shape, such as an increased amount of fat in
      the upper back and neck, or around the chest and stomach area. You might also
      lose fat from the legs, arms, and face.
  - type: paragraph
    text: Your immune system may get stronger when you start taking HIV medicines.
      Tell your doctor right away if you notice any changes in your health. Sometimes
      the immune system will start to fight infections that were hidden in your body,
      such as pneumonia, herpes, or tuberculosis. Autoimmune disorders (eg, Graves'
      disease, polymyositis, Guillain-Barré syndrome, and autoimmune hepatitis) may
      also occur.
  - type: paragraph
    text: This medicine does not decrease the risk of transmitting the HIV infection
      to others through sexual contact or by contaminated blood. Make sure you understand
      and practice safe sex, even if your partner also has HIV. Avoid sharing needles
      with anyone.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or non-prescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - blistering, peeling, or loosening of the skin
      - chills
      - clay-colored stools
      - confusion
      - cough
      - dark urine
      - decreased appetite
      - decreased awareness or responsiveness
      - decreased urine output
      - depression
      - diarrhea
      - dizziness
      - fever
      - headache
      - irritability
      - itching, skin rash
      - joint or muscle pain
      - loss of appetite
      - loss of consciousness
      - lower back pain
      - muscle cramps, spasms, stiffness, or twitching
      - nausea
      - pain or burning while urinating
      - rapid weight gain
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - seizures
      - severe sleepiness
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach pain or tenderness
      - swelling of the face, hands, feet, lower legs, or ankles
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
      - vomiting
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Increased amount of fat in the upper back and neck, or around the chest and
        stomach area
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
