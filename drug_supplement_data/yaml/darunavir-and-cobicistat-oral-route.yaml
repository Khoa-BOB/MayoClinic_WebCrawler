title: Darunavir and cobicistat (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Prezcobix
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Darunavir and cobicistat combination is used together with other medicines
      to treat human immunodeficiency virus (HIV) infection. HIV is the virus that
      causes acquired immune deficiency syndrome (AIDS).
  - type: paragraph
    text: Darunavir and cobicistat combination will not cure or prevent HIV infection
      or AIDS. It works by lowering the amount of HIV in the blood and it will also
      help your immune system. This may help delay some of the medical conditions
      that are usually result from AIDS or HIV disease. This medicine will not keep
      you from spreading HIV to other people.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of darunavir and cobicistat combination
        in children weighing 25 kilograms (kg) or more. However, safety and efficacy
        have not been established in children weighing less than 25 kg. Use is not
        recommended in children younger than 3 years of age because of darunavir's
        toxicity.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of atazanavir and cobicistat combination
        in the elderly. However, elderly patients are more likely to have age-related
        liver problems, which may require caution for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Alfuzosin
      - Alprazolam
      - Astemizole
      - Bromocriptine
      - Carbamazepine
      - Cisapride
      - Colchicine
      - Conivaptan
      - Crizotinib
      - Dihydroergotamine
      - Domperidone
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Dronedarone
      - Drospirenone
      - Elbasvir
      - Eletriptan
      - Eplerenone
      - Ergoloid Mesylates
      - Ergonovine
      - Ergotamine
      - Finerenone
