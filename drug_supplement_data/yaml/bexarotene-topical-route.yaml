title: Bexarotene (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Targretin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Bexarotene belongs to the group of medicines known as retinoids (RET-i-noyds).
      When applied to the skin, it is used to treat a form a cancer called cutaneous
      T-cell lymphoma (CTCL). It acts by interfering with the growth of cells of the
      tumor. It may be used after other drugs have been tried, and the tumor is still
      a problem.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Gel/Jelly
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies of this medicine have been done only in adult patients, and there
        is no specific information comparing the use of bexarotene in children with
        use in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested in patients 65 years of age or older and
        has not been shown to cause different side effects or problems in older people
        than it does in younger adults. However, elderly patients may be more sensitive
        to the effects of bexarotene.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Ranolazine
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Amlodipine
      - Atogepant
      - Azathioprine
      - Cariprazine
      - Chlortetracycline
      - Cholera Vaccine
      - Demeclocycline
      - Desogestrel
      - Dienogest
      - Doxycycline
      - Drospirenone
      - Ebola Zaire Vaccine, Live
      - Efavirenz
      - Eravacycline
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Etonogestrel
      - Gemfibrozil
      - Gestodene
      - Influenza Virus Vaccine, Live
      - Levoketoconazole
      - Levonorgestrel
      - Lymecycline
      - Meclocycline
      - Medroxyprogesterone
      - Mercaptopurine
      - Mestranol
      - Methacycline
      - Methotrexate
      - Minocycline
      - Nifedipine
      - Nomegestrol
      - Norelgestromin
      - Norethindrone
      - Norgestimate
      - Norgestrel
      - Omadacycline
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atorvastatin
      - Erythromycin
      - Fosphenytoin
      - Ketoconazole
      - Phenobarbital
      - Phenytoin
      - Rifampin
      - Vitamin A
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease—May increase the risk of side effects
      - Liver disease—Effects of bexarotene may be increased because of slower removal
        from the body
      - Photosensitivity—Bexarotene may cause increased sensitivity of the skin to
        sunlight
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Apply enough bexarotene to cover the lesion with a generous coating. Use
      a cotton tipped applicator or your fingertips to apply the medicine to your
      skin. If you apply this medicine with your fingertips, make sure you wash your
      hands immediately afterwards, to prevent any of the medicine from accidentally
      getting into your eyes or mouth.
  - type: paragraph
    text: Avoid getting the medicine on the surrounding unaffected skin. Do not apply
      the medicine near mucosal areas (the inside of your mouth, eyes, nose, rectum
      or vagina).
  - type: paragraph
    text: Do not cover with bandages or dressings, unless directed to do so by your
      doctor. Allow the bexarotene to dry before covering with clothing.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: paragraph
      text: Use this medicine exactly as directed by your doctor. Do not use more
        or less of it, and do not use it more often than your doctor ordered. The
        exact amount of medicine you need has been carefully worked out. Using too
        much will increase the risk of side effects, while using too little may not
        improve your condition.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (gel): For cutaneous T-cell lymphoma Adults—The usual
        dose is started at applying once every other day for the first week. On week
        two, the dose may be increased to apply once a day. It may be increased to
        apply twice a day, on week three. On week four, it may be increased to apply
        three times a day. Finally, increased to apply four times a day on week five.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - For cutaneous T-cell lymphoma Adults—The usual dose is started at applying
        once every other day for the first week. On week two, the dose may be increased
        to apply once a day. It may be increased to apply twice a day, on week three.
        On week four, it may be increased to apply three times a day. Finally, increased
        to apply four times a day on week five. Children—Use and dose must be determined
        by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—The usual dose is started at applying once every other day for the
        first week. On week two, the dose may be increased to apply once a day. It
        may be increased to apply twice a day, on week three. On week four, it may
        be increased to apply three times a day. Finally, increased to apply four
        times a day on week five.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: Every Other Day Application:Apply as soon as possible if you remember
        it on the day it should be used. However, if you do not remember the missed
        dose until the next day, apply it at that time. Then skip a day and start
        applying every other day. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you at regular visits to make
      sure that this medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: 'Bexarotene may cause your skin to be more sensitive to sunlight than it
      is normally. Exposure to sunlight, even for brief periods of time, may cause
      a skin rash, itching, redness or other discoloration of the skin, or a severe
      sunburn. When you begin taking this medicine:'
  - type: list
    ordered: false
    items:
    - Stay out of direct sunlight, especially between the hours of 10:00 a.m. and
      3:00 p.m., if possible.
    - Wear protective clothing, including a hat. Also, wear sunglasses.
    - Apply a sun block product that has a skin protection factor (SPF) of at least
      15. Some patients may require a product with a higher SPF number, especially
      if they have a fair complexion. If you have any questions about this, check
      with your health care professional.
    - Apply a sun block lipstick that has an SPF of at least 15 to protect your lips.
    - Do not use a sunlamp or tanning bed or booth.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Some side effects will have signs or symptoms that you can see or feel. Your
      doctor may watch for others by doing certain tests. Since the medication is
      applied externally to the skin, in general, these side effect are less common.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of face, hands, lower legs and/or feet
      - chills, fever, or general feeling of discomfort or illness
      - decreased urination
      - lack or loss of strength
      - rapid or unusual weight gain
      - skin rash, blisters, redness, or irritation
      - sticky or tacky sensation
      - thickened, scaly skin
      - tingling or “pins and needles” sensation
      - sore throat
      - swollen, painful or tender lymph glands in neck, armpit, or groin
      - unusual bruising
      - unusual tiredness or weakness.
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More Common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal or excessive sweating
      - blistering, burning, crusting, dryness, flaking, itching, scaling, severe
        redness, soreness, or swelling of skin or lesion
      - headache
      - increased cough
      - lower back or side pain
      - painful or difficult urination
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
