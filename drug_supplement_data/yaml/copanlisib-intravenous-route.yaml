title: Copanlisib (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Aliqopa
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Copanlisib injection is used to treat follicular lymphoma that has come
      back after treatment with at least two previous medicines that did not work
      well.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of copanlisib injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of copanlisib injection in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Apalutamide
      - Avacopan
      - Boceprevir
      - Carbamazepine
      - Cholera Vaccine
      - Clarithromycin
      - Cobicistat
      - Conivaptan
      - Ebola Zaire Vaccine, Live
      - Enzalutamide
      - Fedratinib
      - Fexinidazole
      - Fosnetupitant
      - Fosphenytoin
      - Idelalisib
      - Indinavir
      - Influenza Virus Vaccine, Live
      - Itraconazole
      - Ketoconazole
      - Letermovir
      - Lopinavir
      - Lumacaftor
      - Mifepristone
      - Mitotane
      - Nefazodone
      - Nelfinavir
      - Netupitant
      - Omaveloxolone
      - Phenobarbital
      - Phenytoin
      - Posaconazole
      - Primidone
      - Rifampin
      - Ritonavir
      - Rotavirus Vaccine, Live
      - Saquinavir
      - St John's Wort
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hypertension (high blood pressure) or
      - Infections (eg, pneumonia, cytomegalovirus), or history of or
      - Lung or breathing problems or
      - Neutropenia (blood problem)—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Infection—May decrease your body's ability to fight an infection.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital or cancer treatment center. This medicine is given through an
      intravenous (IV) catheter placed into one of your veins. It must be given slowly,
      so the IV catheter will have to remain in place for 1 hour.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Do not drink grapefruit juice while you are receiving this medicine.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you are a woman who can get pregnant, your doctor may do tests to make sure
      you are not pregnant before starting treatment. This medicine may also cause
      birth defects if the father is using it when his sexual partner becomes pregnant.
      Female patients should use an effective form of birth control during treatment
      with this medicine and for 1 month after the last dose. Male patients who have
      female partners should use an effective birth control during treatment with
      this medicine and for 1 month after the last dose. If you think you have become
      pregnant or your partner has become pregnant while using this medicine, tell
      your doctor right away.
  - type: paragraph
    text: Call your doctor right away if you have fever or chills, cough or hoarseness,
      lower back or side pain, or painful or difficult urination. These may be symptoms
      of an infection.
  - type: paragraph
    text: This medicine may increase your blood sugar levels. Check with your doctor
      right away if you have blurred vision, dry mouth, fatigue, flushed, dry skin,
      fruit-like breath odor, increased hunger, increased thirst, increased urination,
      nausea, stomach pain, sweating, trouble breathing, unexplained weight loss,
      or vomiting.
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. You might need to measure
      your blood pressure at home. If you think your blood pressure is too high, call
      your doctor right away.
  - type: paragraph
    text: This medicine may cause swelling of the lungs (pneumonitis). Check with
      your doctor right away if you have new or worsening cough, fever, or trouble
      breathing.
  - type: paragraph
    text: Copanlisib scan temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. If you can, avoid people
      with infections. Check with your doctor immediately if you think you are getting
      an infection or if you get a fever or chills, cough or hoarseness, lower back
      or side pain, or painful or difficult urination.
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Check with your doctor
      right away if you have blistering, peeling, or loosening of the skin, red skin
      lesions, severe acne or a skin rash, sores or ulcers on the skin, or fever or
      chills with this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - blood in the urine or stools
      - blurred vision
      - chest pain or tightness
      - chills
      - cough
      - cracks in the skin
      - dizziness
      - dry mouth
      - fatigue
      - flushed, dry skin
      - fruit-like breath odor
      - headache
      - increased hunger
      - increased thirst
      - increased urination
      - loss of heat from the body
      - lower back or side pain
      - nausea
      - nervousness
      - painful or difficult urination
      - pale skin
      - pinpoint red spots on the skin
      - pounding in the ears
      - red, swollen skin
      - scaly skin
      - slow or fast heartbeat
      - sneezing
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach pain
      - sweating
      - swollen glands
      - trouble breathing
      - unexplained weight loss
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - cracked lips
      - diarrhea
      - difficulty in swallowing
      - lack or loss of strength
      - swelling or inflammation of the mouth
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
