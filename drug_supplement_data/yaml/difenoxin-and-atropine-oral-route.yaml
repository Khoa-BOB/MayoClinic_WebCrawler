title: Difenoxin and atropine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Motofen
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Difenoxin and atropine combination medicine is used along with other measures
      to treat severe diarrhea in adults. Difenoxin helps stop diarrhea by slowing
      down the movements of the intestines.
  - type: paragraph
    text: Since difenoxin is chemically related to some narcotics, it may be habit-forming
      if taken in doses that are larger than prescribed. To help prevent possible
      abuse, atropine (an anticholinergic) has been added. If higher-than-normal doses
      of the combination are taken, the atropine will cause unpleasant effects, making
      it unlikely that such doses will be taken again.
  - type: paragraph
    text: Difenoxin and atropine combination medicine should not be used in children.
      Children with diarrhea should be given solutions of carbohydrates (sugars) and
      electrolytes (important salts) to replace the water and important salts that
      are lost from the body during diarrhea.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine should not be used in children. Children, especially very
        young children, are very sensitive to the effects of difenoxin and atropine.
        This may increase the chance of side effects during treatment. Also, the fluid
        loss caused by diarrhea may result in a severe condition. For this reason,
        it is very important that a sufficient amount of liquids be given to replace
        the fluid lost by the body. If you have any questions about this, check with
        your health care professional.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Shortness of breath or difficulty in breathing may be more likely to occur
        in elderly patients, who are usually more sensitive than younger adults to
        the effects of difenoxin. Also, the fluid loss caused by diarrhea may result
        in a severe condition. For this reason, elderly persons should not take this
        medicine without first checking with their doctor. It is also very important
        that a sufficient amount of liquids be taken to replace the fluid lost by
        the body. If you have any questions about this, check with your health care
        professional.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Ambenonium
      - Isocarboxazid
      - Naltrexone
      - Phenelzine
      - Potassium Chloride
      - Potassium Citrate
      - Safinamide
      - Samidorphan
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alfentanil
      - Alprazolam
      - Amantadine
      - Amifampridine
      - Amphetamine
      - Benzhydrocodone
      - Benzphetamine
      - Bromazepam
      - Bromopride
      - Buprenorphine
      - Bupropion
      - Butalbital
      - Butorphanol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Cetirizine
      - Citalopram
      - Clobazam
      - Clomipramine
      - Clonazepam
      - Clopidogrel
      - Clozapine
      - Codeine
      - Cyclobenzaprine
      - Cyproheptadine
      - Daridorexant
      - Desmopressin
      - Desvenlafaxine
      - Dexmedetomidine
      - Dextroamphetamine
      - Dextromethorphan
      - Diazepam
      - Dihydrocodeine
      - Donepezil
      - Doxepin
      - Doxylamine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Arbutamine
      - Desflurane
      - Tizanidine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse (or history of) or
      - Drug abuse (history of)—There is a greater chance that this medicine may become
        habit-forming
    - type: list
      ordered: false
      items:
      - Colitis (severe)—A more serious problem of the colon may develop if you use
        this medicine
    - type: list
      ordered: false
      items:
      - Down's syndrome—Side effects may be more likely and severe in these patients
    - type: list
      ordered: false
      items:
      - Dysentery—This condition may get worse; a different kind of treatment may
        be needed
    - type: list
      ordered: false
      items:
      - Emphysema, asthma, bronchitis, or other chronic lung disease—There is a greater
        chance that this medicine may cause breathing problems in patients who have
        any of these conditions
    - type: list
      ordered: false
      items:
      - Enlarged prostate or
      - Urinary tract blockage or difficult urination—Problems with urination may
        develop with the use of this medicine
    - type: list
      ordered: false
      items:
      - Gallbladder disease or gallstones—Use of this medicine may cause spasms of
        the biliary tract and make the condition worse
    - type: list
      ordered: false
      items:
      - Glaucoma—Severe pain in the eye may occur with the use of this medicine; however,
        the chance of this happening is low
    - type: list
      ordered: false
      items:
      - Heart disease—This medicine may have some effects on the heart, which may
        make the condition worse
    - type: list
      ordered: false
      items:
      - Hiatal hernia—The atropine in this medicine may make this condition worse;
        however, the chance of this happening is low
    - type: list
      ordered: false
      items:
      - High blood pressure (hypertension)—The atropine in this medicine may cause
        an increase in blood pressure; however, the chance of this happening is low
    - type: list
      ordered: false
      items:
      - Intestinal blockage—This medicine may make the condition worse
    - type: list
      ordered: false
      items:
      - Kidney disease—The atropine in this medicine may build up in the body and
        cause side effects
    - type: list
      ordered: false
      items:
      - Liver disease—The chance of central nervous system (CNS) side effects, including
        coma, may be greater in patients who have this condition
    - type: list
      ordered: false
      items:
      - Myasthenia gravis—This medicine may make the condition worse
    - type: list
      ordered: false
      items:
      - Overactive or underactive thyroid—Unwanted effects on breathing and heart
        rate may occur
    - type: list
      ordered: false
      items:
      - Overflow incontinence—This medicine may make the condition worse
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: If this medicine upsets your stomach, your doctor may want you to take it
      with food.
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. If too much is taken, it may become habit-forming.
  - type: paragraph
    text: 'Importance of diet and fluids while treating diarrhea:'
  - type: list
    ordered: false
    items:
    - In addition to using medicine for diarrhea, it is very important that you replace
      the fluid lost by the body and follow a proper diet. For the first 24 hours
      you should eat gelatin and drink plenty of caffeine-free clear liquids, such
      as ginger ale, decaffeinated cola, decaffeinated tea, and broth. During the
      next 24 hours you may eat bland foods, such as cooked cereals, bread, crackers,
      and applesauce. Fruits, vegetables, fried or spicy foods, bran, candy, caffeine,
      and alcoholic beverages may make the condition worse.
    - 'If too much fluid has been lost by the body due to the diarrhea a serious condition
      may develop. Check with your doctor as soon as possible if any of the following
      symptoms of too much fluid loss occur: Decreased urination Dizziness and lightheadedness
      Dryness of mouth Increased thirst Wrinkled skin'
  - type: list
    ordered: false
    items:
    - Decreased urination
    - Dizziness and lightheadedness
    - Dryness of mouth
    - Increased thirst
    - Wrinkled skin
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For severe diarrhea: Adults and teenagers—The
        first dose is usually 2 milligrams (mg). After that, the dose is 1 mg taken
        after each loose stool or every three or four hours as needed. Do not take
        more than 8 mg in any twenty-four-hour period. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For severe diarrhea: Adults and teenagers—The first dose is usually 2 milligrams
        (mg). After that, the dose is 1 mg taken after each loose stool or every three
        or four hours as needed. Do not take more than 8 mg in any twenty-four-hour
        period. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—The first dose is usually 2 milligrams (mg). After that,
        the dose is 1 mg taken after each loose stool or every three or four hours
        as needed. Do not take more than 8 mg in any twenty-four-hour period.
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor should check your progress at regular visits if you will be
      taking this medicine regularly for a long time.
  - type: paragraph
    text: Check with your doctor if your diarrhea does not stop after 2 days or if
      you develop a fever.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that slow down the nervous system, possibly causing drowsiness).
      Some examples of CNS depressants are antihistamines or medicine for hay fever,
      other allergies, or colds; sedatives, tranquilizers, or sleeping medicine; prescription
      pain medicine or narcotics; barbiturates; medicine for seizures; muscle relaxants;
      or anesthetics, including some dental anesthetics. Check with your doctor before
      taking any of the above while you are taking this medicine.
  - type: paragraph
    text: If you think you or someone else in your home may have taken an overdose
      of this medicine, get emergency help at once. Taking an overdose of this medicine
      may lead to unconsciousness and possibly death. Symptoms of overdose include
      severe drowsiness; fast heartbeat; shortness of breath or troubled breathing;
      and unusual warmth, dryness, and flushing of skin.
  - type: paragraph
    text: Before having any kind of surgery (including dental surgery) or emergency
      treatment, tell the medical doctor or dentist in charge that you are using this
      medicine.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, drowsy, or less alert
      than they are normally. Even if taken at bedtime, it may cause some people to
      feel drowsy or less alert on arising. Make sure you know how you react to this
      medicine before you drive, use machines, or do anything else that could be dangerous
      if you are dizzy or are not alert.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  - type: list
    ordered: false
    items:
    - Bloating
    - constipation
    - loss of appetite
    - stomach pain (severe) with nausea and vomiting
  - type: paragraph
    text: 'Get emergency help immediately if any of the following symptoms of overdose
      occur:'
  - type: list
    ordered: false
    items:
    - Blurred vision (continuing) or changes in near vision
    - drowsiness (severe)
    - dryness of mouth, nose, and throat (severe)
    - fast heartbeat
    - shortness of breath or troubled breathing (severe)
    - unusual excitement, nervousness, restlessness, or irritability
    - unusual warmth, dryness, and flushing of skin
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - difficult urination
      - dizziness or lightheadedness
      - drowsiness
      - dryness of skin and mouth
      - fever
      - headache
      - trouble in sleeping
      - unusual tiredness or weakness
    - type: paragraph
      text: 'After you stop using this medicine, it may still produce some side effects
        that need attention. During this period of time, check with your doctor immediately
        if you notice the following side effects:'
    - type: list
      ordered: false
      items:
      - Increased sweating
      - muscle cramps
      - nausea or vomiting
      - shivering or trembling
      - stomach cramps
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
