      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose with the extended-release tablets and it is less than
        12 hours since your regular time, take it as soon as you can and take your
        next dose at the normal time. If you miss a dose and it is more than 12 hours
        since your regular time, skip the missed dose and take your next dose at the
        normal time.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This is to allow for changes in your dose and to check for any unwanted effects.
  - type: paragraph
    text: Do not change your dose or stop taking this medicine without first checking
      with your doctor . Your doctor may want you to gradually reduce the amount you
      are taking before stopping it completely. Stopping this medicine suddenly may
      cause anxiety, discouragement, feeling sad or empty, irritability, lack of appetite,
      lack of feeling or emotion, loss of interest or pleasure, sweating, tiredness,
      trouble concentrating, trouble sleeping, uncaring, or unusual tiredness or weakness.
  - type: paragraph
    text: People taking pramipexole have reported falling asleep without warning during
      activities of daily living, including driving, which sometimes resulted in accidents.
      This may happen as late as one year after taking the medicine. Make sure you
      know how you react to this medicine before you drive, use machines, or do anything
      else that could be dangerous if you are not alert, well-coordinated, or able
      to think or see well .
  - type: paragraph
    text: Check with your doctor before using this medicine with alcohol or other
      medicines that affect the central nervous system (CNS) . This medicine will
      add to the effects of alcohol and other CNS depressants (medicines that make
      you drowsy or less alert). Some examples of CNS depressants are antihistamines
      or medicine for hay fever or colds, sedatives, tranquilizers, or sleeping medicine,
      prescription pain medicine or narcotics, barbiturates or medicine for seizures,
      muscle relaxants, or anesthetics, including some dental anesthetics. .
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur , especially when you
      get up suddenly from a lying or sitting position. These symptoms are more likely
      to occur when you begin taking this medicine, or when the dose is increased.
      Getting up slowly may help. If you have this problem, talk to your doctor.
  - type: paragraph
    text: Hallucinations (seeing, hearing, or feeling things that are not there) may
      occur in some patients. This is more common with elderly patients. If you have
      hallucinations, check with your doctor.
  - type: paragraph
    text: This medicine may cause posture changes that you cannot control. Tell your
      doctor right away if you have your neck bending forward, bending forward at
      the waist, or tilting sideways when you sit, stand, or walk.
  - type: paragraph
    text: Check with your doctor right away if you have dark-colored urine, fever,
      muscle cramps or spasms, muscle pain or stiffness, or unusual tiredness or weakness.
      These may be symptoms of a condition called rhabdomyolysis (muscle disease that
      can lead to kidney problems).
  - type: paragraph
    text: Some people who have used this medicine had unusual changes in their thoughts
      or behavior, including an urge to gamble, spend money, binge eat, or an increased
      sex drive. Talk with your doctor if this is a concern for you.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness, lightheadedness, or fainting, especially when standing up suddenly
        from a sitting/lying position
      - drowsiness
      - nausea
      - seeing, hearing, or feeling things that are not there
      - trouble sleeping
      - twitching, twisting, or other unusual body movements
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - confusion
      - cough
      - difficulty with swallowing
      - double vision or other changes in vision
      - falling asleep without warning
      - fearfulness, suspiciousness, or other mental changes
      - fever
      - frequent urination
      - memory loss
      - muscle or joint pain
      - muscle weakness
      - restlessness or need to keep moving
      - swelling of the body
      - trouble breathing
      - writhing, twisting, or other unusual body movements
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal thinking
      - anxiety
      - bloody or cloudy urine
      - chest pain
      - difficult, burning, or painful urination
      - dizziness
      - frequent urge to urinate
      - loss of bladder control
      - swelling of the arms or legs
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Discouragement
      - feeling sad or empty
      - lack of appetite
      - lack of feeling or emotion
      - loss of interest or pleasure
      - sweating
      - trouble concentrating
      - uncaring
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - dryness of the mouth
      - headache
      - heartburn, indigestion, or acid stomach
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal dreams
      - decreased sexual drive or ability
      - general feeling of discomfort or illness
      - increased cough
      - increased sweating
      - joint pain
      - loss of appetite
      - runny nose
      - skin rash, itching
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
