title: Pramipexole (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Mirapex
    - type: paragraph
      text: Mirapex ER
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Pramipexole is used to treat Parkinson disease. It may be used alone or
      in combination with other medicines (eg, levodopa). Pramipexole is a dopamine
      agonist that works on the nervous system to help treat the symptoms of Parkinson
      disease.
  - type: paragraph
    text: Pramipexole is also used to treat Restless Legs Syndrome (RLS). RLS is a
      neurologic disorder that affects sensation and movement in the legs and causes
      the legs to feel uncomfortable. This results in an irresistible feeling of wanting
      to move your legs to make them comfortable.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Extended Release
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of pramipexole in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of pramipexole in the elderly. However,
        elderly patients are more likely to develop hallucinations (seeing, hearing,
        or feeling things that are not there), which may require caution in patients
        receiving pramipexole.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Sulpiride
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Haloperidol
      - Metoclopramide
      - Olanzapine
      - Paliperidone
      - Risperidone
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Cimetidine
      - Kava
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Dyskinesia (trouble with muscle control) or
      - Hallucinations or
      - Hypotension (low blood pressure) or
      - Postural hypotension (lightheadedness or fainting when getting up suddenly
        from a lying or sitting position)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Sleep disorders or
      - Sleepiness, history of—May cause side effects to become worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not use more of
      it, do not use it more often, and do not use it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Read the patient information leaflet carefully before you take this medicine.
      Talk to your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food. Taking this medicine with
      food may reduce nausea.
  - type: paragraph
    text: Swallow the extended-release tablet whole. Do not break, crush, or chew
      it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets): For Parkinson disease: Adults—At
        first, 0.375 milligram (mg) once a day. Your doctor may adjust your dose as
        needed. However, the dose is usually not more than 4.5 mg per day. Children—Use
        and dose must be determined by your doctor.'
      - 'For oral dosage form (tablets): For Parkinson disease: Adults—At first, 0.125
        milligram (mg) 3 times a day. Your doctor may adjust your dose as needed.
        However, the dose is usually not more than 4.5 mg per day. Children—Use and
        dose must be determined by your doctor. For Restless Legs Syndrome: Adults—At
        first, 0.125 milligram (mg) once a day 2 to 3 hours before bedtime. Your doctor
        may adjust your dose as needed. However, the dose is usually not more than
        0.5 mg per day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For Parkinson disease: Adults—At first, 0.375 milligram (mg) once a day.
        Your doctor may adjust your dose as needed. However, the dose is usually not
        more than 4.5 mg per day. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 0.375 milligram (mg) once a day. Your doctor may adjust your
        dose as needed. However, the dose is usually not more than 4.5 mg per day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For Parkinson disease: Adults—At first, 0.125 milligram (mg) 3 times a day.
