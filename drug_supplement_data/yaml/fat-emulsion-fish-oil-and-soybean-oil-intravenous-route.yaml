title: Fat emulsion, fish oil, and soybean oil (intravenous route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fat emulsion, fish oil, and soybean oil combination injection is used to
      provide nutritional support in patients who are unable to get enough fat in
      their diet. Fats are used by the body for energy and to form substances needed
      for normal body functions.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Emulsion
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of fat emulsion injection, fish oil,
        and soybean oil combination injection in children. However, children are more
        likely to have kidney problems, which may require caution in patients receiving
        this medicine.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of fat emulsion injection, fish oil,
        and soybean oil combination injection in the elderly. However, elderly patients
        are more sensitive to the effects of this medicine than younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acenocoumarol
      - Phenprocoumon
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to egg, fish, soybean, or peanut proteins or
      - Hypertriglyceridemia (high triglycerides in the blood)—Should not be used
        in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Metabolic disorder or
      - Obesity—Use with caution. May increase risk of developing hypertriglyceridemia.
    - type: list
      ordered: false
      items:
      - Infection—May decrease your body's ability to fight infections.
    - type: list
      ordered: false
      items:
      - Kidney disease—Giving this medicine for a long time in preterm babies may
        increase risk for aluminum toxicity.
    - type: list
      ordered: false
      items:
      - Undernourished patients, severely—May cause refeeding syndrome. Monitor and
        increase nutrient intake slowly for the patients.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this medicine in a medical facility. It is given through a needle placed into
      one of your veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      closely while you are receiving this medicine . This will allow your doctor
      to see if the medicine is working properly. Blood and urine tests will be needed
      to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause parenteral nutrition-associated liver disease (PNALD).
      This usually occurs in patients who have been receiving parenteral nutrition
      for a long time, especially pre-term infants. Check with your doctor right away
      if you have chills, clay-colored stools, dark urine, diarrhea, dizziness, fever,
      headache, itching, loss of appetite, nausea, rash, unpleasant breath odor, unusual
      tiredness or weakness, vomiting of blood, or yellow eyes or skin.
  - type: paragraph
    text: This medicine may cause acute respiratory distress syndrome and metabolic
      acidosis in newborns and infants after rapid infusion. Check with your doctor
      right away if your child has blue lips, fingernails, or skin, difficult, confusion,
      drowsiness, fast breathing, muscle tremors, nausea, restlessness, stomach cramps,
      or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause a rare condition called fat overload syndrome. Tell
      your doctor right away if you or your child have a fever, chills, cough, sore
      throat, upper right abdominal or stomach pain and fullness, or unusual bleeding,
      bruising, or weakness.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction, which can be life-threatening
      and requires immediate medical attention. Tell your doctor right away if you
      have a rash, itching, hoarseness, trouble breathing, trouble swallowing, or
      any swelling of your hands, face, or mouth after using this medicine.
  - type: paragraph
    text: This medicine may increase your risk of developing infections. Avoid being
      near people who are sick or have infections while you or your child are receiving
      this medicine. Wash your hands often. Tell your doctor if you have any kind
      of infection before you start receiving this medicine. Also tell your doctor
      if you have ever had an infection that would not go away or an infection that
      kept coming back.
  - type: paragraph
    text: Call your doctor right away if you or your child start to have a cough that
      will not go away, weight loss, night sweats, fever, chills, or flu-like symptoms,
      such as a runny or stuffy nose, headache, blurred vision, or feeling generally
      ill. These may be signs that you have an infection.
  - type: paragraph
    text: This medicine may cause aluminum toxicity (too much aluminum in the blood),
      which may damage the brain and can be life-threatening. Talk to your doctor
      if you have concerns.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are receiving this medicine. The results of some tests may be affected by
      this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - dry mouth
      - flushed, dry skin
      - fruit-like breath odor
      - increased hunger
      - increased thirst
      - increased urination
      - nausea
      - sweating
      - trouble breathing
      - unexplained weight loss
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - chills
      - confusion
      - difficult, burning, or painful urination
      - dizziness
      - fainting
      - fever
      - frequent urge to urinate
      - headache
      - lower back or side pain
      - nervousness
      - pale skin
      - pounding in the ears
      - rapid, shallow breathing
      - slow or fast heartbeat
      - unusual bleeding or bruising
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or tightness
      - changes in skin color
      - clay-colored stools
      - cough
      - dark urine
      - eye pain
      - general feeling of illness
      - itching, skin rash
      - loss of appetite
      - pain, tenderness, or swelling of the foot or leg
      - sneezing
      - sore throat
      - unpleasant breath odor
      - vomiting of blood
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - blue lips, fingernails, or skin
      - bluish color
      - chest tightness
      - confusion
      - difficulty in swallowing
      - irregular heartbeat
      - muscle cramps, pain, or tremors
      - numbness, tingling, pain, or weakness in the hands or feet
      - pinpoint red spots on the skin
      - problems with bleeding or clotting
      - restlessness
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach cramps
      - swelling of the face, throat, or tongue
      - swollen glands
      - trouble breathing
      - upper right abdominal or stomach pain and fullness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - bloated
      - excess air or gas in the stomach or intestines
      - full feeling
      - heartburn
      - indigestion
      - passing gas
      - stomach discomfort or upset
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in taste
      - loss of taste
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Increased sweating
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
