title: Lamivudine and zidovudine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Combivir
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Lamivudine and zidovudine combination is used in the treatment of human
      immunodeficiency virus (HIV) infection. HIV is the virus that causes acquired
      immune deficiency syndrome (AIDS).
  - type: paragraph
    text: Lamivudine and zidovudine combination will not cure or prevent HIV infection
      or the symptoms of AIDS. This medicine helps keep HIV from reproducing, and
      appears to slow down the destruction of the immune system. This may help delay
      the development of serious health problems usually related to AIDS or HIV infection.
      Lamivudine and zidovudine combination will not keep you from spreading HIV to
      other people. People who receive this medicine may continue to have other problems
      usually related to AIDS or HIV infection.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Lamivudine and zidovudine combination contains a fixed amount of each
        medicine that cannot be decreased. Therefore, this medicine is not recommended
        for patients who weigh less than 30 kilograms because the amounts of lamivudine
        and zidovudine in this product cannot be adjusted for smaller body sizes.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of this medicine in the elderly.
        However, elderly patients are more likely to have age-related liver, kidney,
        or heart problems which may require caution and an adjustment in the dose
        for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Atidarsagene Autotemcel
      - Azathioprine
      - Bupropion
      - Cabotegravir
      - Clarithromycin
      - Clomipramine
      - Dapsone
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Fluconazole
      - Flucytosine
      - Horsetail
      - Hydroxychloroquine
      - Levoketoconazole
      - Mercaptopurine
      - Methotrexate
      - Nirmatrelvir
      - Orlistat
      - Pexidartinib
      - Pyrazinamide
      - Pyrimethamine
      - Ribavirin
      - Rifampin
      - Ritonavir
      - Sorbitol
      - Stavudine
      - Tacrolimus
      - Valproic Acid
      - Vinblastine
      - Vincristine
      - Vincristine Sulfate Liposome
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acetaminophen
      - Interferon Beta-1a
      - Methadone
      - Nelfinavir
      - Probenecid
      - Rifabutin
      - Rifapentine
      - Tipranavir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood problems (eg, anemia, decreased bone marrow production) or
      - Pancreatitis (inflammation of the pancreas), or history of—Use with caution.
        May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Hepatitis B infection or
      - Hepatitis C infection—May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. Also, do not stop taking lamivudine and zidovudine combination
      without checking with your doctor first.
  - type: paragraph
    text: Keep taking lamivudine and zidovudine combination for the full time of treatment
      , even if you begin to feel better.
  - type: paragraph
    text: This medicine works best when there is a constant amount in the blood. To
      help keep the amount constant, do not miss any doses. If you need help in planning
      the best times to take your medicine, check with your doctor.
  - type: paragraph
    text: Only take medicine that your doctor has prescribed specifically for you.
      Do not share your medicine with others.
  - type: paragraph
    text: Lamivudine and zidovudine combination contains a fixed amount of each medicine.
  - type: paragraph
    text: Lamivudine and zidovudine combination may be taken with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For human immunodeficiency virus (HIV) infection:
        Adults and children who weigh at least 30 kilograms (kg)—One tablet two times
        a day. Children who weigh less than 30 kg—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For human immunodeficiency virus (HIV) infection: Adults and children who
        weigh at least 30 kilograms (kg)—One tablet two times a day. Children who
        weigh less than 30 kg—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children who weigh at least 30 kilograms (kg)—One tablet two times
        a day.
      - Children who weigh less than 30 kg—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child at regular visits to make sure that this medicine is working properly.
      Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not take any other medicine containing emtricitabine, lamivudine, or
      zidovudine (eg, Atripla®, Complera®, Emtriva®, Epivir®, Epzicom®, Retrovir®,
      Trizivir®, or Truvada®).
  - type: paragraph
    text: Do not take any other medicines without checking with your doctor first
      . To do so may increase the chance of side effects from lamivudine and zidovudine
      combination.
  - type: paragraph
    text: If you or your child have both HIV and hepatitis B virus (HBV) infections,
      liver disease can become worse when lamivudine and zidovudine treatment is stopped.
      Discuss any changes in your treatment and medicines with your doctor.
  - type: paragraph
    text: Zidovudine may cause some serious side effects, including blood or bone
      marrow problems. Symptoms of a blood or bone marrow problem include fever, chills,
      sore throat, pale skin, or unusual tiredness or weakness. These problems may
      require blood transfusion or temporarily stopping treatment with lamivudine
      and zidovudine combination. Check with your doctor if any new health problems
      or symptoms occur while you or your child are taking lamivudine and zidovudine
      combination.
  - type: paragraph
    text: 'Two rare but serious reactions to this medicine are lactic acidosis (too
      much acid in the blood) and liver toxicity. These are more common if you are
      female, very overweight (obese), or have been taking anti-HIV medicines for
      a long time. Call your doctor right away if you or your child have more than
      one of these symptoms: abdominal discomfort or cramping, dark urine, decreased
      appetite, diarrhea, general feeling of discomfort, light-colored stools, muscle
      cramping or pain, nausea, unusual tiredness or weakness, trouble breathing,
      vomiting, or yellow eyes or skin.'
  - type: paragraph
    text: Tell your doctor if you or your child have severe muscle pain, tenderness,
      or weakness, especially if you take this medicine for a long time.
  - type: paragraph
    text: When you or your child start taking HIV medicines, your immune system may
      get stronger. If you have infections that are hidden in your body (eg, pneumonia
      or tuberculosis), you may notice new symptoms when your body tries to fight
      them. If this occurs, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause a decrease or loss of body fat, especially in your
      face, arms, legs, or buttocks, when it is used for a long time. Talk to your
      doctor if you have concerns.
  - type: paragraph
    text: This medicine does not decrease the risk of transmitting the HIV infection
      to others through sexual contact or by contaminated blood. Make sure you understand
      and practice safe sex, even if your partner also has HIV. Avoid sharing needles
      with anyone.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - fever
      - pale skin
      - sore throat
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, tingling, numbness, or pain in the hands, arms, feet, or legs
      - muscle tenderness and weakness
      - nausea
      - severe stomach pain
      - skin rash
      - vomiting
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - canker sores
      - chest discomfort or pain
      - chills
      - convulsions
      - dark urine
      - decreased appetite
      - difficulty with breathing
      - difficulty with swallowing
      - dizziness
      - faintness
      - fast, irregular, or pounding heartbeat
      - fast, shallow breathing
      - feeling of fullness
      - general feeling of discomfort
      - general tiredness and weakness
      - hives or welts, itching
      - itching, puffiness, or swelling of the eyelids or around the eyes, face, lips,
        or tongue
      - jerking of all extremities
      - joint or muscle pain
      - light-colored stools
      - loss of bladder control
      - muscle pain, spasms, stiffness, or cramping
      - red skin lesions often with a purple center
      - red, irritated eyes
      - redness, soreness, or itching skin
      - sensation of pins and needles
      - sleepiness
      - sores, ulcers, or white spots in the mouth or on the lips or tongue
      - sores, welting or blisters
      - stabbing pain
      - sudden loss of consciousness
      - swelling of the feet or lower legs
      - tingling, burning, numbness, or pain in the hands, arms, feet, or legs
      - tightness in the chest
      - troubled with breathing
      - unsteadiness or awkwardness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Coughing
      - decreased appetite
      - diarrhea
      - dizziness
      - mild stomach pain
      - trouble sleeping
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - body fat redistribution or accumulation
      - darkening of the skin and mucous membranes
      - dry mouth
      - flushed, dry skin
      - fruit-like breath odor
      - hair loss
      - increased hunger
      - increased thirst
      - increased urination
      - sweating
      - swelling of the breasts or breast soreness in both females and males
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
      - thinning of the hair
      - troubled breathing, unexplained
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
