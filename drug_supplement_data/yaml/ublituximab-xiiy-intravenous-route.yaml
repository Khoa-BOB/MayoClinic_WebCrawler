title: Ublituximab-xiiy (intravenous route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ublituximab-xiiy injection is used to treat the relapsing forms (including
      clinically isolated syndrome, relapsing-remitting disease, and active secondary
      progressive disease) of multiple sclerosis (MS). This medicine will not cure
      MS, but it may slow some of the disabling effects and decrease the number of
      relapses of the disease.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of ublituximab-xiiy injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of ublituximab-xiiy injection in
        the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Anthrax Vaccine Adsorbed
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Cholera Vaccine
      - Cholera Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Diphtheria Toxoid, Adsorbed
      - Ebola Zaire Vaccine, Live
      - Haemophilus B Vaccine
      - Hepatitis A Vaccine, Inactivated
      - Hepatitis B Vaccine
      - Human Papillomavirus Vaccine
      - Influenza Virus Vaccine
      - Influenza Virus Vaccine, Live
      - Japanese Encephalitis Virus Vaccine
      - Measles Virus Vaccine, Live
      - Meningococcal Vaccine
      - Mumps Virus Vaccine, Live
      - Pertussis Vaccine
      - Pneumococcal Vaccine
      - Pneumococcal Vaccine, Diphtheria Conjugate
      - Pneumococcal Vaccine Polyvalent
      - Poliovirus Vaccine, Inactivated
      - Poliovirus Vaccine, Live
      - Rabies Vaccine
      - Rotavirus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - SARS-COV-2 (COVID-19) Vaccine, Adenovirus 26 Vector (Janssen)
      - SARS-COV-2 (COVID-19) Vaccine, mRNA (Moderna)
      - SARS-COV-2 (COVID-19) Vaccine, mRNA (Pfizer)
      - SARS-COV-2 (COVID-19) Vaccine, Protein Subunit, Adjuvanted (Novavax)
      - SARS-COV-2 (COVID-19) Vaccine, Protein Subunit, Adjuvanted (Sanofi)
      - Smallpox Monkeypox Vaccine
      - Tetanus Toxoid
      - Tick-Borne Encephalitis Vaccine
      - Typhoid Vaccine
      - Typhoid Vaccine, Live
      - Typhoid Vi Polysaccharide Vaccine
      - Varicella Virus Vaccine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Hepatitis B infection, active or
      - Infusion reaction, history of—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Hepatitis B infection, history of or
      - Liver disease, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Infection, active—Should be treated first before receiving this medicine.
    - type: list
      ordered: false
      items:
      - Weak immune system—Use with caution. May increase risk for more serious side
        effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins.
  - type: paragraph
    text: You will receive the first dose of this medicine that will last for at least
      4 hours. Your second dose will be given 2 weeks after your first dose for at
      least 1 hour. You will receive your next doses as 1 infusion every 24 weeks
      that will last for at least 1 hour.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Your doctor may give you other medicines (eg, allergy medicine, fever medicine,
      steroid) 30 to 60 minutes before receiving this medicine to prevent unwanted
      effects (eg, infusion reactions). Your doctor may also want you to stay for
      at least 1 hour after the first 2 infusions to check for unwanted effects.
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed before starting and during treatment with this medicine to check for
      any unwanted effects.
  - type: paragraph
    text: Receiving this medicine while you are pregnant can harm your unborn baby.
      If you are a woman who can get pregnant, your doctor may do tests to make sure
      you are not pregnant before receiving this medicine. Use an effective form of
      birth control to keep from getting pregnant during treatment with this medicine
      and for 6 months after the last dose. If you think you have become pregnant
      while receiving this medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause infusion reaction, which can be life-threatening
      and requires immediate medical attention. Tell your doctor right away if you
      start to have chest tightness, chills, cough, difficulty swallowing, dizziness,
      fever, headache, nausea, fast, pounding, or irregular heartbeat or pulse, lightheadedness
      or faintness, puffiness or swelling of the eyelids or around the eyes, face,
      lips, or tongue, sore throat, swelling in your face or hands, skin itching,
      redness, rash, or hives, trouble breathing, or unusual tiredness or weakness
      while you are receiving this medicine.
  - type: paragraph
    text: This medicine may increase your risk of developing infections. Avoid being
      near people who are sick or have infections while you are using this medicine.
      Wash your hands often. Also tell your doctor if you have ever had an infection
      that would not go away or an infection that kept coming back.
  - type: paragraph
    text: This medicine may cause hepatitis B virus reactivation and liver injury.
      Tell your doctor right away if you have yellow skin or eyes, dark brown-colored
      urine, right-sided stomach pain, fever, or severe tiredness.
  - type: paragraph
    text: This medicine may increase your risk of developing infections, including
      a rare and serious brain infection called progressive multifocal leukoencephalopathy
      (PML). This is more likely to occur if you have JCV infection. Check with your
      doctor if you have weakness on one side of the body, clumsiness, blurred vision,
      changes in thinking, memory problems, confusion, or personality changes.
  - type: paragraph
    text: While you are being treated with ublituximab-xiiy, and after you stop treatment
      with it, do not have any immunizations (vaccinations) without your doctor's
      approval. Complete any required live or live-attenuated vaccines at least 4
      weeks, or non-live vaccines at least 2 weeks, before starting this medicine.
      This medicine may lower your body's resistance and there is a chance you might
      get the infection the immunization is meant to prevent. In addition, other persons
      living in your household should not take oral polio vaccine since there is a
      chance they could pass the polio virus on to you. Also, avoid persons who have
      taken oral polio vaccine within the last several months. Do not get close to
      them, and do not stay in the same room with them for very long. If you cannot
      take these precautions, you should consider wearing a protective face mask that
      covers the nose and mouth.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - chest pain or tightness
      - chills
      - cough
      - cough producing mucus
      - diarrhea
      - dizziness
      - dryness or soreness of the throat
      - ear congestion
      - facial swelling
      - fever or chills
      - general feeling of discomfort or illness
      - headache
      - hoarseness
      - joint pain
      - loss of voice
      - muscle aches and pains
      - nausea or vomiting
      - pain or tenderness around the eyes and cheekbones
      - skin rash
      - sneezing
      - stuffy or runny nose
      - sweating
      - tender, swollen glands in the neck
      - trouble breathing
      - trouble in swallowing
      - trouble sleeping
      - unusual tiredness or weakness
      - voice changes
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - blurred vision
      - confusion
      - dark urine
      - drowsiness
      - light-colored stools
      - seizures
      - upper right abdominal or stomach pain
      - yellow eyes and skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain in the arms or legs
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
