- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fluorometholone is used to treat eye conditions caused by inflammation (swelling).
      This medicine is a corticosteroid (steroid medicine) that helps reduce the swelling
      in the eye.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of fluorometholone in the pediatric population. Safety and
        efficacy have not been established in children younger than 2 years of age.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Flarex® eye drops in the pediatric population. Safety and
        efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of fluorometholone in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Cataracts or
      - Cornea problems, history of or
      - Glaucoma or
      - Herpes simplex infection, history of or
      - Sclera problems, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Cataract surgery—Use with caution. May cause delayed healing.
    - type: list
      ordered: false
      items:
      - Fungal eye infection or
      - Herpes simplex eye infection or
      - Mycobacterial (tuberculosis) eye infection or
      - Vaccinia (smallpox) eye infection or
      - Varicella (chickenpox) eye infection—Should not be used in patients with these
        conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your eye doctor will tell you how much of this medicine to use and how often
      . Do not use more medicine or use it more often than your doctor tells you to.
      This medicine is not for long-term use.
  - type: paragraph
    text: Wash your hands with soap and water before and after using this medicine.
  - type: paragraph
    text: 'To use the eye drops :'
  - type: list
    ordered: false
    items:
    - Shake the bottle well just before each use.
    - Lie down or tilt your head back and, pressing your finger gently on the skin
      just beneath the lower eyelid, pull the eyelid away from the eye to make a space.
      Drop the medicine into this space.
    - Let go of the eyelid and gently close the eye. Do not blink. Keep the eye closed
      for 1 or 2 minutes to allow the medicine to be absorbed by the eye.
    - If you think you did not get the drop of medicine into your eye properly, repeat
      the process with another drop.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
      Serious damage to the eye and possible loss of vision may result from using
      contaminated eye medicines.
  - type: paragraph
    text: Remove contact lenses before you use the eye drops. Wait at least 15 minutes
      before putting the contact lenses back in.
  - type: paragraph
    text: 'To use the eye ointment :'
  - type: list
    ordered: false
    items:
    - Hold the tip of the tube close to your eye with the other hand. Avoid touching
      the tip of the tube to your eye or finger.
    - Lie down or tilt your head back. With your index finger, pull down the lower
      lid of your eye to form a pocket.
    - Squeeze a small amount (1/2 inch ribbon) of ointment into the pocket between
      your lower lid and eyeball.
    - Close your eyes for 1 to 2 minutes.
    - Wipe the tip with a clean tissue and close the tube tightly. Keep the tube tightly
      closed when you are not using it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For eye conditions caused by swelling: For ophthalmic dosage form (Flarex®
        eye drops): Adults—One to two drops in the affected eye(s) 4 times a day.
        Your doctor may adjust your dose as needed. Children—Use and dose must be
        determined by your doctor. For ophthalmic dosage form (FML® eye drops and
        FML® Forte eye drops): Adults—One drop in the affected eye two to four times
        a day. During the first 24 to 48 hours, you may use this medicine every 4
        hours, as directed by your doctor. Children 2 years of age and older—Dose
        must be determined by your doctor. Children younger than 2 years of age—Use
        and dose must be determined by your doctor. For ophthalmic dosage form (eye
        ointment): Adults—Use a small amount (1/2 inch ribbon) in the affected eye
        one to three times a day. During the first 24 to 48 hours, you may use this
        medicine every 4 hours, as directed by your doctor. Children 2 years of age
        and older—Dose must be determined by your doctor. Children younger than 2
        years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For ophthalmic dosage form (Flarex® eye drops): Adults—One to two drops in
        the affected eye(s) 4 times a day. Your doctor may adjust your dose as needed.
        Children—Use and dose must be determined by your doctor.'
      - 'For ophthalmic dosage form (FML® eye drops and FML® Forte eye drops): Adults—One
        drop in the affected eye two to four times a day. During the first 24 to 48
        hours, you may use this medicine every 4 hours, as directed by your doctor.
        Children 2 years of age and older—Dose must be determined by your doctor.
        Children younger than 2 years of age—Use and dose must be determined by your
        doctor.'
      - 'For ophthalmic dosage form (eye ointment): Adults—Use a small amount (1/2
        inch ribbon) in the affected eye one to three times a day. During the first
        24 to 48 hours, you may use this medicine every 4 hours, as directed by your
        doctor. Children 2 years of age and older—Dose must be determined by your
        doctor. Children younger than 2 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—One to two drops in the affected eye(s) 4 times a day. Your doctor
        may adjust your dose as needed.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—One drop in the affected eye two to four times a day. During the first
        24 to 48 hours, you may use this medicine every 4 hours, as directed by your
        doctor.
      - Children 2 years of age and older—Dose must be determined by your doctor.
      - Children younger than 2 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - Adults—Use a small amount (1/2 inch ribbon) in the affected eye one to three
        times a day. During the first 24 to 48 hours, you may use this medicine every
        4 hours, as directed by your doctor.
      - Children 2 years of age and older—Dose must be determined by your doctor.
      - Children younger than 2 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Fluorometholone eye drops may be refrigerated. Keep from freezing.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your eye doctor will want to examine your eye(s) at regular visits to make
      sure the medicine is working properly and is not causing unwanted effects, especially
      if you will be using this medicine for 10 days or longer.
  - type: paragraph
    text: This medicine is not for long-term use. Steroid eye drops may cause an increased
      pressure in the eye, which can damage the optic (eye) nerve, and other eye problems
      (eg, glaucoma, cataracts). Slow or delayed healing may also occur while you
      are using this medicine after cataract surgery. You will need to have regular
      eye exams with your doctor to check for these problems.
  - type: paragraph
    text: If you hurt your eye or develop an eye infection, talk with your doctor
      right away. You may need to change your medicine or stop using it.
  - type: paragraph
    text: If your symptoms do not improve within 2 days or if they becomes worse,
      check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bigger, dilated, or enlarged pupils (black part of the eye)
      - blurred vision or other change in vision
      - burning, dry, or itching eyes
      - decreased vision
      - delayed wound healing
      - discharge from eye
      - headache
      - increased sensitivity of the eyes to light
      - loss of vision
      - nausea or vomiting
      - redness, pain, swelling of the eye, eyelid, or inner lining of the eyelid
      - tearing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning and stinging sensation when medicine is applied
      - change or loss of taste
      - drooping upper eyelids
      - feeling of having something in the eye
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
