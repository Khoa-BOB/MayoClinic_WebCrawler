title: Ardeparin (subcutaneous route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ardeparin is used to prevent deep venous thrombosis, a condition in which
      harmful blood clots form in the blood vessels of the legs. These blood clots
      can travel to the lungs and can become lodged in the blood vessels of the lungs,
      causing a condition called pulmonary embolism. Ardeparin is used for several
      days after knee replacement surgery, while you are unable to walk. It is during
      this time that blood clots are most likely to form. Ardeparin also may be used
      for other conditions as determined by your doctor.
  - type: paragraph
    text: Ardeparin is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of ardeparin in children with use
        in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested and has not been shown to cause different
        side effects or problems in older people than it does in younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Defibrotide
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abciximab
      - Aceclofenac
      - Acemetacin
      - Alipogene Tiparvovec
      - Alteplase, Recombinant
      - Amtolmetin Guacil
      - Anagrelide
      - Anistreplase
      - Antithrombin, Recombinant
      - Apixaban
      - Aspirin
      - Bemiparin
      - Betrixaban
      - Bromfenac
      - Bufexamac
      - Caplacizumab-yhdp
      - Celecoxib
      - Choline Salicylate
      - Citalopram
      - Clonixin
      - Clopidogrel
      - Collagenase, Clostridium histolyticum
      - Curcumin
      - Dabigatran Etexilate
      - Desvenlafaxine
      - Dexibuprofen
      - Dexketoprofen
      - Diclofenac
      - Diflunisal
      - Dipyridamole
      - Dipyrone
      - Donanemab-azbt
      - Doxycycline
      - Droxicam
      - Duloxetine
      - Edoxaban
      - Eptifibatide
      - Escitalopram
      - Etodolac
      - Etofenamate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Eye problems caused by diabetes or high blood pressure or
      - Heart infection or
      - High blood pressure (hypertension) or
      - Kidney disease or
      - Liver disease or
      - Stomach or intestinal ulcer (active) or
      - Stroke—The risk of bleeding may be increased
    - type: paragraph
      text: Also, tell your doctor if you have received ardeparin or heparin before
        and had a reaction to either of them called thrombocytopenia (a low platelet
        count in the blood), or if new blood clots formed while you were receiving
        the medicine.
    - type: paragraph
      text: In addition, tell your doctor if you have recently had medical surgery.
        This may increase the risk of serious bleeding when you are taking ardeparin.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: If you are using ardeparin at home, your health care professional will teach
      you how to inject yourself with the medicine. Be sure to follow the directions
      carefully. Check with your health care professional if you have any problems
      using the medicine.
  - type: paragraph
    text: Put used syringes in a puncture-resistant, disposable container, or dispose
      of them as directed by your health care professional.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: For prevention of deep venous thrombosis (leg
        clots) and pulmonary embolism (lung clots): Adults—The dose is given every
        twelve hours for up to fourteen days after surgery. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For prevention of deep venous thrombosis (leg clots) and pulmonary embolism
        (lung clots): Adults—The dose is given every twelve hours for up to fourteen
        days after surgery. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—The dose is given every twelve hours for up to fourteen days after
        surgery.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Tell all your medical doctors and dentists that you are using this medicine.
  - type: paragraph
    text: 'Check with your doctor immediately if you notice any of the following side
      effects:'
  - type: list
    ordered: false
    items:
    - Bruising or bleeding, especially bleeding that is hard to stop. Bleeding inside
      the body sometimes appears as bloody or black, tarry stools, or faintness.
    - Back pain; burning, pricking, tickling, or tingling sensation; leg weakness;
      numbness; paralysis; or problems with bowel or bladder function.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Stop taking this medicine and get emergency help immediately if any of
      the following effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - coughing up blood
      - deep, dark purple bruise, pain, or swelling at the place of injection
      - difficulty with breathing or swallowing
      - dizziness
      - headache
      - increased menstrual flow or vaginal bleeding
      - nosebleeds
      - paralysis
      - prolonged bleeding from cuts
      - red or black, tarry stools
      - red or dark brown urine
      - shortness of breath
      - unexplained pain, swelling, or discomfort, especially in the chest, abdomen,
        joints, or muscles
      - unusual bruising
      - vomiting of blood or coffee ground material
      - weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - burning, pricking, tickling, or tingling sensation
      - leg weakness
      - numbness
      - problems with bowel or bladder function
      - rash consisting of pinpoint, purple-red spots, often beginning on the legs
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin rash, hives, or itching
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea
      - pain at the injection site
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
