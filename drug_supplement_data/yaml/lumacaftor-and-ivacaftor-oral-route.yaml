    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Cataracts or
      - Hypertension (high blood pressure) or
      - Lung or breathing problems or
      - Organ transplant, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - High vitamin A levels—Use with caution. May increase risk for intracranial
        hypertension (increased pressure in the head).
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease, moderate to severe—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Take this medicine with fat-containing foods including avocados, butter,
      cheese pizza, eggs, nuts, peanut butter, breast milk, baby formula, or whole-milk
      dairy products (eg, whole milk, cheese, yogurt).
  - type: paragraph
    text: If you are using the granules , mix all the content of each packet with
      1 teaspoon (5 milliliters [mL]) of cool to room temperature soft food (eg, puréed
      fruits, flavored yogurt, pudding, applesauce) or liquid (eg, water, milk, breast
      milk, baby formula, or juice). Take this mixture within 1 hour after mixing.
  - type: paragraph
    text: Tell your doctor if you stopped taking this medicine for more than 1 week.
      Your doctor may need to change your dose of Orkambi® or other medicines you
      take.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (granules, tablets): For cystic fibrosis: Adults and
        children 12 years of age and older—2 tablets every 12 hours, taken with fat-containing
        food. Each tablet contains 200 milligrams (mg) lumacaftor and 125 mg ivacaftor.
        Children 6 to 11 years of age—2 tablets every 12 hours, taken with fat-containing
        food. Each tablet contains 100 mg lumacaftor and 125 mg ivacaftor. Children
        2 to 5 years of age—Dose is based on your body weight and must be determined
        by your doctor. Weighing 14 kilograms (kg) or more—1 packet of granules every
        12 hours, taken with fat-containing food. Each packet contains 150 mg lumacaftor
        and 188 mg ivacaftor. Weighing less than 14 kg—1 packet of granules every
        12 hours, taken with fat-containing food. Each packet contains 100 mg lumacaftor
        and 125 mg ivacaftor. Children 1 to 2 years of age—Dose is based on your body
        weight and must be determined by your doctor. Weighing 14 kilograms (kg) or
        more—1 packet of granules every 12 hours, taken with fat-containing food.
        Each packet contains 150 milligrams (mg) lumacaftor and 188 mg ivacaftor.
        Weighing 9 to less than 14 kg—1 packet of granules every 12 hours, taken with
        fat-containing food. Each packet contains 100 mg lumacaftor and 125 mg ivacaftor.
        Weighing 7 to less than 9 kg—1 packet of granules every 12 hours, taken with
        fat-containing food. Each packet contains 75 mg lumacaftor and 94 mg ivacaftor.
        Children younger than 1 year of age—Use and dose must be determined by your
        doctor.'
    - type: list
