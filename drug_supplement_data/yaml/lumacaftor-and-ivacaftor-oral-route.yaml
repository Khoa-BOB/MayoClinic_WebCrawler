    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is 6 hours or less from the time you normally
        take your medicine, take a dose as soon as you can. If it is more than 6 hours
        , wait until then to use the medicine and skip the missed dose. Do not take
        extra medicine to make up for a missed dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure that this medicine is working properly. Blood
      tests will be needed to check for unwanted effects. You may also need to monitor
      your blood pressure at home. If you notice any changes to your normal blood
      pressure, call your doctor right away.
  - type: paragraph
    text: Birth control pills and other forms of hormone-based contraceptives (eg,
      patches, rings, implants, and injections) may not work while you are using this
      medicine. To keep from getting pregnant, use another form of birth control (eg,
      condoms, diaphragm, or a contraceptive foam or jelly) while using Orkambi®.
  - type: paragraph
    text: Liver problems may be more likely to occur if you already have an existing
      liver problem (eg, cirrhosis). Check with your doctor right away if you or your
      child has pain or tenderness in the upper stomach, pale stools, dark urine,
      loss of appetite, nausea, vomiting, or yellow eyes or skin.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Check with your doctor right away if you have chest tightness, cough,
      difficulty swallowing, dizziness, fast heartbeat, hives, itching, skin rash,
      large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
      legs, feet, or sex organs, puffiness or swelling of the eyelids or around the
      eyes, face, lips, or tongue, trouble breathing, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may increase pressure in your head (intracranial hypertension).
      Check with your doctor right away if you have blurred vision, confusion, headache,
      severe nausea, vomiting, or vision changes.
  - type: paragraph
    text: Check with your doctor right away if you or your child has cough, trouble
      breathing, chest tightness, or any type of breathing problem when starting treatment
      with this medicine.
  - type: paragraph
    text: This medicine may cause eye problem, including cataracts. Check with your
      doctor right away if you or your child has blindness, blurred vision, or decreased
      vision.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - chest tightness
      - chills
      - cough
      - difficult or labored breathing
      - ear congestion
      - fever
      - headache
      - loss of voice
      - muscle aches
      - sneezing
      - sore throat
      - stuffy or runny nose
      - unusual tiredness or weakness
      - upper abdominal or stomach pain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - change in ability to see colors, especially blue or yellow
      - dark urine
      - difficulty swallowing
      - discomfort in the upper right stomach area
      - dizziness
      - fast heartbeat
      - general feeling of tiredness or weakness
      - hives, itching, skin rash
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - light-colored stools
      - loss of appetite
      - nausea
      - nervousness
      - pounding in the ears
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - slow or fast heartbeat
      - stomach pain, continuing
      - vomiting
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Absent, missed, or irregular menstrual periods
      - bloated feeling
      - cough producing mucus
      - cramps
      - diarrhea
      - excess air or gas in the stomach or bowels
      - feeling of fullness
      - heavy bleeding
      - increased sputum production
      - longer or heavier menstrual periods
      - loss of voice
      - passing gas
      - rash
      - stopping of menstrual bleeding
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
