title: Podofilox (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Condylox
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Condyline
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Podofilox is used to remove certain types of warts on the outside skin of
      the genital areas (penis or vulva). The gel is used also to treat warts between
      the genitals and the rectum, the solution is not. Neither the gel nor the solution
      is used to treat warts that occur inside the rectum, vagina, or urine passageways
      inside the penis (male) or the vulva (female). Podofilox works by destroying
      the skin of the wart.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Gel/Jelly
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies of this medicine have been done only in adult patients, and there
        is no specific information comparing use of podofilox in children with use
        in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of podofilox in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A paper with information for the patient will be given to you with your
      filled prescription and will provide many details concerning the use of podofilox.
      Read this paper carefully and ask your health care professional if you need
      additional information.
  - type: paragraph
    text: Also, keep podofilox away from the eyes and mucous membranes, such as the
      inside of the penis, rectum, or vagina. This medicine may cause severe irritation.
      If you get this medicine in your eyes or on one of these areas, immediately
      flush the area with water for 15 minutes.
  - type: paragraph
    text: Use podofilox only as directed, no more than 3 days a week and no more than
      4 treatment cycles. Do not use more of it, do not use it more often, and do
      not use it for a longer time than your doctor ordered. To do so may increase
      the chances that this medicine is absorbed into the body and that side effects
      could occur.
  - type: paragraph
    text: Do not apply the medicine to any other wart until you discuss it with your
      doctor. The total dose of podofilox used on all warts should not exceed that
      which would cover an area measuring 1.6 square inches (10 square centimeters),
      about the size of a dollar coin.
  - type: paragraph
    text: 'To use:'
  - type: list
    ordered: false
    items:
    - To apply the solution, use the applicators that come with the solution or a
      cotton-tipped applicator. To apply the gel, use a cotton-tipped applicator or
      your finger. Never reuse an applicator or dip a used applicator into the bottle.
    - Apply podofilox only to the wart(s) discussed with your doctor.
    - Podofilox can cause severe irritation of normal skin. If you get medicine on
      normal skin, wash it off immediately.
    - Make sure the treated area is dry before allowing the treated skin to come in
      contact with normal, untreated skin.
    - Immediately after applying this medicine, wash your hands to remove any medicine.
      Properly discard used applicator(s).
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (gel): For warts on penis or vulva (genitals) or
        on skin between genitals and rectum: Adults—Apply to the wart(s) two times
        a day for three days in a row using an applicator tip or finger. Skip four
        days by not applying any medicine for four days in a row. If the wart can
        still be seen, this application cycle may be repeated each week for up to
        four weeks, until the wart is gone. No more than 0.5 grams of gel should be
        used each day of treatment. Children—Use and dose must be determined by the
        doctor.'
      - 'For topical dosage form (solution): For warts on penis or vulva (genitals)
        only: Adults—Apply to the wart(s) two times a day (every twelve hours) for
        three days in a row using applicator tip. Skip four days by not applying any
        medicine for four days in a row. If the wart can still be seen, this application
        cycle may be repeated each week for up to four weeks, until the wart is gone.
        No more than 0.5 milliliters of solution should be used each day of treatment.
        Children—Use and dose must be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - 'For warts on penis or vulva (genitals) or on skin between genitals and rectum:
        Adults—Apply to the wart(s) two times a day for three days in a row using
        an applicator tip or finger. Skip four days by not applying any medicine for
        four days in a row. If the wart can still be seen, this application cycle
        may be repeated each week for up to four weeks, until the wart is gone. No
        more than 0.5 grams of gel should be used each day of treatment. Children—Use
        and dose must be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply to the wart(s) two times a day for three days in a row using
        an applicator tip or finger. Skip four days by not applying any medicine for
        four days in a row. If the wart can still be seen, this application cycle
        may be repeated each week for up to four weeks, until the wart is gone. No
        more than 0.5 grams of gel should be used each day of treatment.
      - Children—Use and dose must be determined by the doctor.
    - type: list
      ordered: false
      items:
      - 'For warts on penis or vulva (genitals) only: Adults—Apply to the wart(s)
        two times a day (every twelve hours) for three days in a row using applicator
        tip. Skip four days by not applying any medicine for four days in a row. If
        the wart can still be seen, this application cycle may be repeated each week
        for up to four weeks, until the wart is gone. No more than 0.5 milliliters
        of solution should be used each day of treatment. Children—Use and dose must
        be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply to the wart(s) two times a day (every twelve hours) for three
        days in a row using applicator tip. Skip four days by not applying any medicine
        for four days in a row. If the wart can still be seen, this application cycle
        may be repeated each week for up to four weeks, until the wart is gone. No
        more than 0.5 milliliters of solution should be used each day of treatment.
      - Children—Use and dose must be determined by the doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Podofilox may not be able to prevent previously healed warts from reappearing
      or stop new warts from growing.
  - type: paragraph
    text: This medicine contains alcohol and therefore may be flammable. Do not use
      near heat, near open flame, or while smoking.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bad odor (solution only)
      - bleeding of treated skin
      - blistering, crusting, or scabbing of treated skin
      - bloody urine (solution only)
      - burning feeling of treated skin
      - dizziness (solution only)
      - headache (gel only)
      - itching of treated skin
      - pain during sexual intercourse (solution only)
      - pain of treated skin
      - problems with foreskin of penis (solution only)
      - redness or swelling of treated skin
      - scarring of treated skin (solution only)
      - skin ulcers of treated skin
      - vomiting (solution only)
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea
      - vomiting
      - diarrhea
      - chills
      - fever
      - sore throat
      - unusual bleeding or bruising
      - oral ulcers
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dryness of treated skin
      - peeling of treated skin
      - soreness or tenderness of treated skin
      - stinging or tingling of treated skin
      - trouble in sleeping (solution only)
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in color of treated skin (gel only)
      - skin rash (gel only)
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
