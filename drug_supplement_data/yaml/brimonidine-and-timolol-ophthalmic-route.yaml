    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma, or history of or
      - Bradycardia (slow heartbeat) or
      - Cardiogenic shock (shock caused by heart attack) or
      - Chronic obstructive pulmonary disease (COPD), severe or
      - Heart block or
      - Heart failure—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Bacterial eye infection (e.g., keratitis) or
      - Blood vessel disorders (e.g., cerebral or coronary insufficiency, Raynaud's
        phenomenon, thromboangiitis obliterans) or
      - Cornea (part of the eye) problems, history of or
      - Depression or
      - Eye surgery, recent or
      - Heart disease or
      - Lung disease or
      - Orthostatic hypotension (dizziness, faintness, or lightheadedness when getting
        up from lying or sitting position) or
      - Stroke, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hyperthyroidism (overactive thyroid) or
      - Hypoglycemia (low blood sugar)—May cover up some of the signs and symptoms
        of these diseases, such as a fast heartbeat.
    - type: list
      ordered: false
      items:
      - Myasthenia gravis—May worsen symptoms of this condition, such as muscle weakness.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your eye doctor will tell you how much of this medicine to use and how often.
      Do not use more medicine or use it more often than your doctor tells you to.
  - type: paragraph
    text: 'To use the eye drops:'
  - type: list
    ordered: false
    items:
    - Shake the medicine well just before each use.
    - First, wash your hands. Tilt the head back and, pressing your finger gently
      on the skin just beneath the lower eyelid, pull the lower eyelid away from the
      eye to make a space. Drop the medicine into this space. Let go of the eyelid
      and gently close the eyes. Do not blink. Keep the eyes closed and apply pressure
      to the inner corner of the eye with your finger for 1 or 2 minutes to allow
      the medicine to be absorbed by the eye.
    - Immediately after using the eye drops, wash your hands to remove any medicine
      that may be on them.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
      Serious damage to the eye and possible loss of vision may result from using
      contaminated eye medicines.
  - type: paragraph
    text: Remove your contact lenses before using this medicine. Wait at least for
      15 minutes before putting the contact lenses back in.
  - type: paragraph
    text: If your doctor ordered two different eye medicines to be used together,
      wait at least 5 minutes before using the second medicine. This will help prevent
      the second medicine from “washing out” the first one.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic dosage form (eye drops): For glaucoma or hypertension of the
        eye: Adults and children 2 years of age and older—Use one drop in the affected
        eye(s) two times a day, at least 12 hours apart. Children younger than 2 years
        of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For glaucoma or hypertension of the eye: Adults and children 2 years of age
        and older—Use one drop in the affected eye(s) two times a day, at least 12
        hours apart. Children younger than 2 years of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children 2 years of age and older—Use one drop in the affected
        eye(s) two times a day, at least 12 hours apart.
      - Children younger than 2 years of age—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your the progress at regular
      visits to make sure this medicine is working properly and to check for unwanted
      effects.
  - type: paragraph
    text: If itching, redness, swelling, or other signs of eye or eyelid irritation
      occur, stop using this medicine and check with your doctor. These signs may
      mean that you are allergic to this medicine.
  - type: paragraph
    text: This medicine may cause heart failure in some patients. Check with your
      doctor right away if you are having chest pain or discomfort, dilated neck veins,
      extreme fatigue, irregular breathing, an irregular heartbeat, shortness of breath,
      swelling of the face, fingers, feet, or lower legs, weight gain, or wheezing.
  - type: paragraph
    text: This medicine may cause changes in your blood sugar levels. Also, this medicine
      may cover up signs of low blood sugar, such as a rapid pulse rate. Check with
      your doctor if you have these problems or if you notice a change in the results
      of your blood or urine sugar tests.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery.
  - type: paragraph
    text: This medicine may cause blurred vision or other vision problems that may
      last for several minutes after you put them in your eye. If any of these occur,
      do not drive, use machines, or do anything else that could be dangerous if you
      are not able to see well . If these eye changes are bothersome, check with your
      doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, dry, or itching eyes
      - discharge or excessive tearing
      - redness, pain, swelling of the eye, eyelid, or inner lining of the eyelid
      - stinging in the eyes
      - tiny bumps on lining of the eyelid
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred or loss of vision
      - disturbed color perception
      - dizziness
      - double vision
      - feeling of having something in the eye
      - halos around lights
      - headache
      - nervousness
      - night blindness
      - pounding in the ears
      - sensitivity of the eyes to light
      - slow, fast, or irregular heartbeat
      - tunnel vision
      - watery eyes
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or discomfort
      - cough
      - difficulty breathing
      - lightheadedness, dizziness or fainting
      - no blood pressure or pulse
      - noisy breathing
      - stopping of heart
      - tightness in the chest
      - unconsciousness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry mouth
      - feeling sad or empty
      - irritability
      - lack of appetite
      - lack or loss of strength
      - loss of interest or pleasure
      - sleepiness or unusual drowsiness
      - trouble concentrating
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
