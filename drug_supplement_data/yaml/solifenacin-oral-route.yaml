    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose of the oral liquid and it is less than 12 hours from
        your regular schedule, take the dose as soon as you can. If you miss a dose
        and it is more than 12 hours , skip the missed dose and go back to your regular
        dosing schedule.
    - type: paragraph
      text: If you miss a dose of the tablet , skip the missed dose and go back to
        your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Dispose any unused oral liquid 28 days after first opening the bottle.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to check for unwanted effects.
  - type: paragraph
    text: Solifenacin may cause serious types of allergic reactions called angioedema
      and anaphylaxis, which may be life-threatening and require immediate medical
      attention. Check with your doctor right away if you have a rash, itching, a
      large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
      legs, feet, or sex organs, trouble breathing, or chest tightness while you are
      using this medicine.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, drowsy, or have blurred
      vision. Do not drive or do anything else that could be dangerous until you know
      how this medicine affects you .
  - type: paragraph
    text: This medicine may make you sweat less, causing your body temperature to
      increase. Use extra care not to become overheated during exercise or hot weather
      while you are taking this medicine, since overheating may result in heat stroke.
  - type: paragraph
    text: This medicine may cause constipation. Call your doctor if you get severe
      stomach pain or become constipated for 3 or more days.
  - type: paragraph
    text: This medicine may cause dry mouth. For temporary relief of mouth dryness,
      use sugarless candy or gum, melt bits of ice in your mouth, or use a saliva
      substitute. However, if your mouth continues to feel dry for more than 2 weeks,
      check with your medical doctor or dentist.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - stomach pain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - blurred vision
      - chills
      - decrease in the frequency of urination
      - decrease in urine volume
      - difficult, burning, or painful urination
      - dizziness
      - dry eyes
      - fever
      - frequent urge to urinate
      - headache
      - lower back or side pain
      - nervousness
      - pounding in the ears
      - slow or fast heartbeat
      - swelling of the lower legs
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - body aches or pain
      - chest pain or discomfort
      - confusion
      - cough
      - decreased or increased sweating
      - diarrhea
      - discouragement
      - dry skin
      - fainting
      - feeling sad or empty
      - general feeling of discomfort or illness
      - hives or welts, itching, skin rash
      - hoarseness
      - irregular heartbeat recurrent
      - irritability
      - joint pain
      - lack of appetite
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss of interest or pleasure
      - muscle aches and pains
      - redness of the skin
      - runny or stuffy nose
      - seeing, hearing, or feeling things that are not there
      - shivering
      - sore throat
      - tender, swollen glands in the neck
      - tingling of the hands or feet
      - trouble concentrating
      - trouble with sleeping
      - trouble with swallowing
      - unusual weight gain or loss
      - voice changes
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry mouth
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - heartburn
      - indigestion
      - nausea
      - stomach discomfort or upset
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
