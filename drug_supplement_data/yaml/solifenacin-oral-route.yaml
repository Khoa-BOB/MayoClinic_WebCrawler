    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Glaucoma, narrow-angle and controlled or
      - Heart rhythm problem (eg, QT prolongation), history of or
      - Stomach or bowel problems (eg, constipation) or
      - Urinary blockage—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Glaucoma, narrow-angle and uncontrolled or
      - Liver disease, severe or
      - Stomach problems (eg, gastric retention) or
      - Urinary problems (eg, urinary retention)—Should not be used in patients with
        these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease, moderate—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. To do so may increase the chance for side effects.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions in the insert carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the tablet whole with water. Do not crush, break, or chew it. You
      may take it with or without food.
  - type: paragraph
    text: 'To use the oral liquid:'
  - type: list
    ordered: false
    items:
    - Shake the bottle well just before taking each dose.
    - Measure the oral liquid medicine with a marked measuring spoon, oral syringe,
      or medicine cup.
    - It is best to drink water or milk after taking this medicine. Do not take it
      at the same with food or other drinks, as it may cause a bitter taste.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (suspension): For neurogenic detrusor overactivity:
        Children 2 years of age and older—Dose is based on body and must be determined
        by your doctor: Weighing more than 60 kilograms (kg)—At first, 5 milliliters
        (mL) once a day. Your doctor may adjust your dose as needed and tolerated.
        However, the dose is usually not more than 10 mL per day. Weighing more than
        45 to 60 kg—At first, 4 mL once a day. Your doctor may adjust your dose as
        needed and tolerated. However, the dose is usually not more than 8 mL per
        day. Weighing more than 30 to 45 kg—At first, 3 mL once a day. Your doctor
        may adjust your dose as needed and tolerated. However, the dose is usually
        not more than 6 mL per day. Weighing more than 15 to 30 kg—At first, 3 mL
        once a day. Your doctor may adjust your dose as needed and tolerated. However,
        the dose is usually not more than 5 mL per day. Weighing 9 to 15 kg—At first,
        2 mL once a day. Your doctor may adjust your dose as needed and tolerated.
        However, the dose is usually not more than 4 mL per day. Children younger
        than 2 years of age or weighing less than 9 kg—Use and dose must be determined
        by your doctor.'
      - 'For oral dosage form (tablets): For symptoms of an overactive bladder: Adults—At
