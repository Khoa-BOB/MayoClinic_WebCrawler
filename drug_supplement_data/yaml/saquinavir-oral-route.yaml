    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your and your child's progress
      at regular visits to make sure this medicine is working properly. Blood tests
      may be needed to check for unwanted effects.
  - type: paragraph
    text: You should not take this medicine if you are also using alfuzosin (Uroxatral®),
      atazanavir (Reyataz®), cisapride (Propulsid®), clozapine (Clozaril®), dapsone,
      dasatinib (Sprycel®), haloperidol (Haldol®), lurasidone (Latuda®), oral midazolam
      (Versed®), pimozide (Orap®), quinine, rifampin (Rifadin®), sertindole, sildenafil
      (Revatio®), sunitinib (Sutent®), tacrolimus (Prograf®), trazodone (Desyrel®,
      Oleptro®), triazolam (Halcion®), ziprasidone (Geodon®), ergotamine medicines
      (eg, dihydroergotamine, ergonovine, ergotamine, methylergonovine, Cafergot®,
      Ergomar®, Wigraine®), medicine for heart rhythm problems (eg, amiodarone, bepridil,
      disopyramide, dofetilide, flecainide, lidocaine, propafenone, quinidine, Cordarone®,
      Tambocor®, Tikosyn®), medicine to lower cholesterol (eg, lovastatin, simvastatin,
      Advicor®, Altoprev®, Mevacor®, Simcor®, Vytorin®, Zocor®), medicine to treat
      an infection (eg, clarithromycin, erythromycin, halofantrine, pentamidine, Biaxin®,
      Nebupent®), or phenothiazine medicines (eg, chlorpromazine, thioridazine, Mellaril®,
      Thorazine®). Taking any of these together with this medicine may increase the
      chance for serious side effects .
  - type: paragraph
    text: Do not use this medicine together with rilpivirine (Edurant®). Do not switch
      rilpivirine to saquinavir/ritonavir without a washout period of at least 2 weeks.
  - type: paragraph
    text: This medicine may decrease the effects of some oral contraceptives (birth
      control pills). To keep from getting pregnant, use an additional form of birth
      control together with your pills, such as condoms, a diaphragm, contraceptive
      foam or jelly.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you or anyone in your family has ever
      had a heart rhythm problem such as PR or QT prolongation.
  - type: paragraph
    text: This medicine may increase blood sugar levels. Diabetic patients should
      check with their doctor if they notice a change in blood or urine sugar tests.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: Your immune system may get stronger when you start taking HIV medicines.
      Tell your doctor right away if you notice any changes in your health. Sometimes
      the immune system will start to fight infections that were hidden in your body,
      such as pneumonia, herpes, or tuberculosis. Autoimmune disorders, such as Graves'
      disease, polymyositis, and Guillain-Barré syndrome may also occur.
  - type: paragraph
    text: This medicine may cause you to have excess body fat. Tell your doctor if
      you notice changes in your body shape, such as an increased amount of fat in
      the upper back and neck, or around the chest and stomach area, or a loss of
      fat from the legs, arms, and face.
  - type: paragraph
    text: This medicine will not keep you from giving HIV to your partner during sex.
      Make sure you understand this and practice safe sex, even if your partner also
      has HIV, by using a latex condom or other barrier method. This medicine will
      also not keep you from giving HIV to other people if they are exposed to your
      blood. Do not re-use or share needles with anyone.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort, garlic capsules) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - chills
      - cough
      - fever
      - increased amount of fat in the upper back and neck, or around the chest and
        stomach area
      - loss of fat from the legs, arms, and face
      - sneezing
      - sore throat
      - tightness in the chest
      - trouble breathing
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - cough-producing mucus
      - diarrhea
      - dry mouth
      - flushed, dry skin
      - fruit-like breath odor
      - general feeling of discomfort or illness
      - headache
      - increased hunger
      - increased thirst
      - increased urination
      - joint pain
      - loss of appetite
      - loss of consciousness
      - muscle aches and pains
      - nausea
      - runny nose
      - shivering
      - skin rash
      - sore throat
      - stomachache
      - sweating
      - trouble sleeping
      - unexplained weight loss
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning or prickling sensation
      - confusion
      - dehydration
      - dry or itchy skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - belching
      - bloated or full feeling
      - change in taste
      - decreased interest in sexual intercourse
      - difficulty having a bowel movement
      - discouragement
      - excess air or gas in the stomach or bowels
      - fear
      - feeling sad or empty
      - headache
      - heartburn
      - inability to have or keep an erection
      - indigestion
      - irritability
      - lack of appetite
      - loss in sexual ability, desire, drive, or performance
      - loss of interest or pleasure
      - mouth ulcers
      - nervousness
      - pain or tenderness around the eyes and cheekbones
      - passing gas
      - skin rash, encrusted, scaly, and oozing
      - skin warts
      - stomach upset, discomfort, or pain
      - stuffy nose
      - tiredness
      - trouble concentrating
      - weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
