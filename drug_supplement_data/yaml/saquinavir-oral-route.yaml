title: Saquinavir (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Invirase
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Saquinavir is used together with ritonavir (Norvir®) and other antiviral
      medicines for the treatment of human immunodeficiency virus (HIV) infection.
      HIV is the virus that causes acquired immune deficiency syndrome (AIDS).
  - type: paragraph
    text: Saquinavir will not cure or prevent HIV infection or AIDS. It helps keep
      HIV from reproducing and slows the destruction of the immune system. This may
      help delay problems related to AIDS or HIV disease from occurring. Saquinavir
      will not keep you from spreading HIV to other people.
  - type: paragraph
    text: This medicine (tablet) is available only with your doctor's prescription.
      The capsules are not currently being marketed .
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of saquinavir in children 16 years of age and younger. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of saquinavir in the elderly. However,
        elderly patients are more likely to have age-related liver, kidney, or heart
        problems, which may require caution in patients receiving saquinavir.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
