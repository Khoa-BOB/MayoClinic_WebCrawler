      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Cerivastatin
      - Cimetidine
      - Flunarizine
      - Gallopamil
      - Lacidipine
      - Nilvadipine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcoholism, history of or
      - Arrhythmia (abnormal heart beat), history of or
      - Congestive heart failure, history of or
      - Heart disease, history of or
      - Heart rhythm problems, history of or
      - Hemophilia (a bleeding problem) or
      - Hyperlipidemia (high cholesterol in the blood) or
      - Liver disease (eg, hepatitis B or C)—Use with caution. May increase your chance
        for serious side effects.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hyperglycemia (high blood sugar)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Galactose intolerance (rare hereditary problem) or
      - Glucose-galactose malabsorption (rare hereditary problem) or
      - Lapp lactase deficiency (rare hereditary problem) or
      - Lactose intolerance—Use is not recommended. Saquinavir contains lactose (milk
        sugar), which can make these conditions worse.
    - type: list
      ordered: false
      items:
      - Heart block, without a pacemaker or
      - Heart rhythm problems (eg, congenital long QT syndrome), history of or
      - Liver disease, severe—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. Also, do not stop using this medicine without checking
      first with your doctor.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and carefully follow
      the instructions before starting treatment and each time you get a refill. Ask
      your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: It is important that this medicine be taken with food. Take it within 2
      hours after a meal.
  - type: paragraph
    text: Saquinavir (Invirase®) should always be taken together, and at the same
      time, with ritonavir (Norvir®) . Take all other medicines your doctor has prescribed
      at the right time of day.
  - type: paragraph
    text: Do not crush the tablets.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms ( tablets): For treatment of HIV infection: For patients
        who have not taken HIV medicines: Adults and children older than 16 years
        of age—At first, 500 milligrams (mg) with ritonavir 100 mg 2 times a day for
        the first 7 days. Then, your doctor will increase your dose to 1000 mg with
        ritonavir 100 mg 2 times a day. Children 16 years of age and younger—Use and
        dose must be determined by your doctor. For patients switching from another
        ritonavir or NNRTI-containing regimen (not including delavirdine or rilpivirine):
        Adults and children older than 16 years of age—At first, 1000 milligrams (mg)
        (2 tablets) taken with ritonavir 100 mg 2 times a day. Children 16 years of
        age and younger—Use and dose must be determined by your doctor. For patients
        switching from delavirdine or rilpivirine-containing regimen: Adults and children
        older than 16 years of age—At first, 500 milligrams (mg) with ritonavir 100
        mg 2 times a day for the first 7 days. Children 16 years of age and younger—Use
        and dose must be determined by your doctor.'
