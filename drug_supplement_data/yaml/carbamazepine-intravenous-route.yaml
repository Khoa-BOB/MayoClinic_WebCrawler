    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
      - Ethanol
      - Grapefruit Juice
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Black Tea
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Behavior or mood problems or
      - Depression, history of or
      - Glaucoma, or history of or
      - Hyponatremia (low sodium in the blood) or
      - Liver disease, or history of or
      - Porphyria (an inherited disease)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Asian ancestry (eg, Filipino, Chinese, Japanese, Korean, Taiwanese)—May increase
        the risk for serious skin reactions. Your doctor may order a special test
        before prescribing this medicine.
    - type: list
      ordered: false
      items:
      - Bone marrow depression or
      - Kidney disease, moderate to severe—Should not be used in patients with this
        condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. This medicine is given through a needle placed in one of your
      veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress closely while
      you are receiving this medicine . Your doctor may want to have certain tests
      done to see if you are receiving the right amount of medicine or if certain
      side effects may be occurring without you knowing it. Also, the amount of medicine
      you are receiving may have to be changed often.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: Do not use carbamazepine together with a monoamine oxidase inhibitor (MAOI)
      or during the first 14 days after you stop taking a MAOI. MAOIs are used for
      depression and some examples are isocarboxazid (Marplan®), phenelzine (Nardil®),
      selegiline (Eldepryl®), or tranylcypromine (Parnate®). Do not use this medicine
      together with boceprevir (Victrelis®), delavirdine (Rescriptor®), and nefazodone
      (Serzone®).
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Check with your doctor
      right away if you have blistering, peeling, or loose skin, red skin lesions,
      severe acne or skin rash, sores or ulcers on the skin, a fever, or chills while
      you are using this medicine.
  - type: paragraph
    text: Check with your doctor right away if a fever, sore throat, rash, ulcers
      in the mouth, nosebleeds, bleeding gums, swollen glands, or small red or purple
      spots on the skin occur. These could be symptoms of a serious blood problem.
  - type: paragraph
    text: 'Carbamazepine may cause serious allergic reactions affecting multiple body
      organs (eg, liver or kidney). Check with your doctor right away if you have
      the following symptoms: a fever, dark urine, headache, rash, stomach pain, unusual
      tiredness, or yellow eyes or skin.'
  - type: paragraph
    text: Carbamazepine may cause some people to be agitated, irritable, or display
      other abnormal behaviors. It may also cause some people to have suicidal thoughts
      and tendencies or to become more depressed. If you or your caregiver notice
      any of these unwanted effects, tell your doctor right away.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that cause drowsiness). Some examples of CNS depressants are antihistamines
      or medicine for hay fever, other allergies, or colds, sedatives, tranquilizers,
      or sleeping medicine, prescription pain medicine or narcotics, medicine for
      seizures (eg, barbiturates), muscle relaxants, or anesthetics, including some
      dental anesthetics. Check with your doctor before taking any of the above while
      you are using this medicine .
  - type: paragraph
    text: This medicine may cause some people to become drowsy, dizzy, lightheaded,
      or less alert than they are normally, especially when they are starting treatment
      or increasing the dose. It may also cause blurred or double vision, weakness,
      or loss of muscle control in some people. Make sure you know how you react to
      this medicine before you drive, use machines, or do anything else that could
      be dangerous if you are not alert and well-coordinated or able to see well .
  - type: paragraph
    text: Check with your doctor immediately if blurred vision, difficulty in reading,
      or any other change in vision occurs during or after treatment. Your doctor
      may want you to have your eyes checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: Do not stop using this medicine without first checking with your doctor.
      Your doctor may want you to gradually reduce the amount you are using before
      stopping it completely . This may help prevent worsening of seizures and reduce
      the possibility of withdrawal symptoms.
  - type: paragraph
    text: Birth control pills containing estrogen may not work properly if you take
      them while you are using carbamazepine. Unplanned pregnancies may occur. Use
      a different or additional means of birth control while you are taking carbamazepine.
      If you have any questions about this, check with your doctor.
  - type: paragraph
    text: Grapefruit and grapefruit juice may increase the effects of this medicine
      by increasing the amount in the body. You should not eat grapefruit or drink
      grapefruit juice while you are receiving this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - chest tightness
      - chills
      - fever
      - flushing
      - headache
      - nausea and vomiting
      - pale skin
      - trouble breathing
      - troubled breathing with exertion
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Coma
      - confusion
      - convulsions
      - decreased urine output
      - dizziness
      - fast or irregular heartbeat
      - increased thirst
      - muscle pain or cramps
      - swelling of the face, ankles, or hands
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - blistering, peeling, or loosening of the skin
      - blood in the urine or stools
      - bloody, black, or tarry stools
      - changes in behavior
      - chest pain
      - cough or hoarseness
      - dark-colored urine
      - decreased urine output
      - diarrhea
      - fainting
      - general feeling of tiredness or weakness
      - high fever
      - itching
      - joint or muscle pain
      - light-colored stools
      - lightheadedness
      - lower back or side pain
      - painful or difficult urination
      - pinpoint red spots on the skin
      - rapid, shallow breathing
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stiff neck or back
      - stomach pain, continuing
      - swelling of the face, ankles, or hands
      - swollen or painful glands
      - thoughts of killing oneself
      - tightness in the chest
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sleepiness or unusual drowsiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Double vision
      - seeing double
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - burning, dry, or itching eyes
      - diarrhea
      - difficulty having a bowel movement (stool)
      - discharge, excessive tearing
      - dry mouth
      - loss of appetite
      - redness, pain, or swelling of the eye, eyelid, or inner lining of the eyelid
      - redness, swelling, or soreness of the tongue
      - swelling or inflammation of the mouth
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
