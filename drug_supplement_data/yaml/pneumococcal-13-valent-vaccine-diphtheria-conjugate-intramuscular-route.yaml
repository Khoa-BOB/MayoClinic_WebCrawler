title: Pneumococcal 13-valent vaccine, diphtheria conjugate (intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Prevnar 13
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Prevnar
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Pneumococcal 13-valent diphtheria conjugate vaccine is an active immunizing
      agent used to prevent infection by pneumococcal bacteria. It works by causing
      your body to produce its own protection (antibodies) against the disease.
  - type: paragraph
    text: Pneumococcal infection can cause serious problems, such as pneumonia, which
      affects the lungs; meningitis, which affects the brain; and bacteremia, which
      is a severe infection in the blood. Pneumococcal infection is also an important
      cause of ear infections in children.
  - type: paragraph
    text: Unless otherwise contraindicated, immunization (vaccination) against pneumococcal
      disease is recommended for infants and young children 6 weeks to 5 years of
      age (prior to the 6th birthday), children 6 to 17 years of age (prior to the
      18th birthday), or to adults 18 years of age and older.
  - type: paragraph
    text: For infants and young children, immunization requires 1 to 4 doses of the
      vaccine, depending on the age at the first dose. This vaccine can be given at
      the same time as other routine vaccinations.
  - type: paragraph
    text: This vaccine is to be given only by or under the supervision of your doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: The pneumococcal 13-valent diphtheria conjugate vaccine is generally well-tolerated
        and effective in children. The safety and effectiveness in children younger
        than 6 weeks of age have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of pneumococcal 13-valent diphtheria
        conjugate vaccine in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acetaminophen
      - Atidarsagene Autotemcel
      - Elivaldogene Autotemcel
      - Ocrelizumab
      - Teplizumab-mzwv
      - Ublituximab-xiiy
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines may cause an
        increased risk of certain side effects, but using both drugs may be the best
        treatment for you. If both medicines are prescribed together, your doctor
        may change the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Pneumococcal 20-Valent Vaccine, Diphtheria Conjugate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Apnea in premature babies (breathing stops for short periods)—Use with caution.
        May make this condition worse.
    - type: list
      ordered: false
      items:
      - Immune system problems (eg, cancer, HIV, kidney or spleen problems, stem cell
        transplant)—This vaccine may not work as well in patients with a weak immune
        system.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this vaccine. This vaccine is given as a shot into one of the muscles, usually
      in the thigh or upper arm.
  - type: paragraph
    text: 'For infants and young children 6 weeks to 5 years of age (prior to the
      6th birthday) : This vaccine is usually given as 4 separate shots over several
      months. Your child''s doctor will tell you the correct number of shots that
      are needed and the schedule to be followed for the vaccine.'
  - type: paragraph
    text: 'For children 6 to 17 years of age (prior to 18th birthday) : This vaccine
      is given as a single dose. If your child just recently received a dose of this
      vaccine, the next dose should be given at least 8 weeks later.'
  - type: paragraph
    text: 'For adults 18 years of age and older : This vaccine is given as a single
      dose.'
  - type: paragraph
    text: It is very important for your child to receive all of the shots for the
      vaccine.
  - type: paragraph
    text: The vaccine needs to be given on a fixed schedule. Try to keep all of the
      scheduled appointments. If your child misses a dose, call your child’s doctor
      for another appointment.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your child return to your doctor’s office at the
      right time for all of the doses. Be sure to notify your doctor of any side effects
      that occur after your child receives this vaccine.
  - type: paragraph
    text: This vaccine may cause a serious type of allergic reaction called anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Tell your doctor right away if you or your child has a rash, itching, swelling
      of the tongue and throat, or trouble breathing after receiving the vaccine.
  - type: paragraph
    text: The pneumococcal 13-valent diphtheria conjugate vaccine will not protect
      you or your child against all types of pneumococcal infections. It will also
      not treat an active infection.
  - type: paragraph
    text: Make sure the doctor knows if you are receiving a treatment or using a medicine
      that causes a weak immune system. This includes radiation treatment, steroid
      medicines (eg, hydrocortisone, methylprednisolone, prednisolone, prednisone),
      or cancer medicines. .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - chills
      - coughing
      - difficult or labored breathing
      - difficulty with swallowing
      - fast heartbeat
      - noisy breathing
      - seizures
      - skin itching, rash, or redness
      - sneezing
      - sore throat
      - swelling of the face, throat, or tongue
      - tightness in the chest
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - blistering, peeling, or loosening of the skin
      - bloody or cloudy urine
      - bluish lips or skin
      - body aches or pain
      - choking
      - confusion
      - decreased urine output
      - diarrhea
      - difficult, burning, or painful urination
      - dilated neck veins
      - ear congestion
      - extreme fatigue
      - fainting
      - frequent urge to urinate
      - general feeling of discomfort or illness
      - headache
      - hives or itching
      - irregular breathing
      - irregular heartbeat
      - joint or muscle pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - lightheadedness
      - loss of appetite
      - loss of voice
      - lower back or side pain
      - muscle aches and pains
      - nasal congestion
      - nausea
      - not breathing
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid, shallow breathing
      - red, irritated eyes
      - runny nose
      - shivering
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - sweating
      - swelling of the face, fingers, feet, or lower legs
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
      - trouble sleeping
      - unusual tiredness or weakness
      - vomiting
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased appetite
      - decreased sleep
      - irritability
      - red streaks on the skin
      - swelling, tenderness, or pain at the injection site
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - crying
      - weakness
      - welts
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, rash,
        redness, scarring, soreness, stinging, tingling, ulceration, or warmth at
        the injection site
      - burning, dry, or itching eyes
      - eye discharge or excessive tearing
      - pain
      - stomach cramps
      - tenderness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
