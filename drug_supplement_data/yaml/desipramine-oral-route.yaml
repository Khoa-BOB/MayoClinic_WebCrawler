      - Ritonavir
      - S-Adenosylmethionine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol or drug use disorder, history of or
      - Behavior and mood changes or
      - Diabetes or
      - Glaucoma, angle-closure or history of or
      - Heart rhythm problems (eg, arrhythmia) or
      - Schizophrenia (mental illness) or
      - Seizures, history of or
      - Urinary retention (trouble urinating), history of—Use with caution. May make
        these conditions worse.
    - type: list
      ordered: false
      items:
      - Bipolar disorder (mood disorder with mania and depression), or risk of or
      - Heart attack, recent—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease or
      - Thyroid disease—Use with caution. May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: Tell your doctor if you are also using other medicine to treat depression,
      including amitriptyline, citalopram, fluoxetine, nortriptyline, paroxetine,
      or sertraline. You must wait at least 5 weeks after you stop using fluoxetine
      before you can start using desipramine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For depression: Adults—100 to 200 milligrams
        (mg) once a day or in divided doses during the day. Your doctor may adjust
        your dose if needed. However, the dose is usually not more than 300 mg per
        day. Older adults and teenagers—25 to 100 mg once a day or in divided doses
        during the day. Your doctor may adjust your dose if needed. However, the dose
        is usually not more than 150 mg per day. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For depression: Adults—100 to 200 milligrams (mg) once a day or in divided
        doses during the day. Your doctor may adjust your dose if needed. However,
        the dose is usually not more than 300 mg per day. Older adults and teenagers—25
        to 100 mg once a day or in divided doses during the day. Your doctor may adjust
        your dose if needed. However, the dose is usually not more than 150 mg per
        day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—100 to 200 milligrams (mg) once a day or in divided doses during the
        day. Your doctor may adjust your dose if needed. However, the dose is usually
        not more than 300 mg per day.
      - Older adults and teenagers—25 to 100 mg once a day or in divided doses during
        the day. Your doctor may adjust your dose if needed. However, the dose is
        usually not more than 150 mg per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to allow your doctor to see if the medicine is working properly and to decide
      if you should continue to take it. Blood tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: Desipramine may cause some people to be agitated, irritable, or display
      other abnormal behaviors. It may also cause some children, teenagers, and young
      adults to have suicidal thoughts and tendencies or to become more depressed.
      Some people may have trouble sleeping, get upset easily, have a big increase
      in energy, or start to act reckless. Tell the doctor if you have sudden or strong
      feelings, such as feeling nervous, angry, restless, violent, or scared. Let
      the doctor know if you or anyone in your family has bipolar disorder (manic-depressive)
      or has tried to commit suicide.
  - type: paragraph
    text: Do not take desipramine with a monoamine oxidase (MAO) inhibitor (eg, isocarboxazid
      [Marplan®], phenelzine [Nardil®], selegiline [Eldepryl®], tranylcypromine [Parnate®]).
      Do not start taking desipramine during the 2 weeks after you stop a MAO inhibitor
      and wait 2 weeks after stopping desipramine before you start taking a MAO inhibitor.
      If you take them together or do not wait 2 weeks, you may develop confusion,
      agitation, restlessness, stomach or intestinal symptoms, a sudden high body
      temperature, an extremely high blood pressure, or seizures.
  - type: paragraph
    text: Desipramine may cause a serious condition called serotonin syndrome if taken
      together with some medicines. Do not use desipramine with buspirone (Buspar®),
      fentanyl (Abstral®, Duragesic®), linezolid (Zyvox®), lithium (Eskalith®, Lithobid®),
      methylene blue injection, tryptophan, St. John's wort, or some pain or migraine
      medicines (eg, sumatriptan, tramadol, Frova®, Maxalt®, Relpax®, Zomig®). Check
      with your doctor first before taking any other medicines with desipramine .
  - type: paragraph
    text: Do not stop taking this medicine without first checking with your doctor
      . Your doctor may want you to reduce gradually the amount you are using before
      stopping completely. This may help prevent a possible worsening of your condition
      and reduce the possibility of withdrawal symptoms such as headache, nausea,
      or a general feeling of discomfort or illness.
  - type: paragraph
    text: 'Symptoms of an overdose include: blurred vision, confusion, difficulty
      sleeping, disorientation, dizziness, faintness, or lightheadedness when getting
      up suddenly from a lying or sitting position, fast, slow, or irregular heartbeat,
      hallucinations, headache, loss of consciousness, mood or other mental changes,
      seeing, hearing, or feeling things that are not there, nightmares, seizures,
      sweating, trouble breathing, trouble sleeping, unusual drowsiness, dullness,
      tiredness, weakness, or feeling of sluggishness, or unusual excitement, nervousness,
      restlessness, or irritability . Call your doctor right away if you notice these
      symptoms.'
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other central nervous
      system (CNS) depressants (medicines that cause drowsiness). Some examples of
      CNS depressants are antihistamines or medicine for hay fever, other allergies
      or colds, sedatives, tranquilizers, or sleeping medicines, prescription pain
      medicine or narcotics, medicine for seizures or barbiturates, muscle relaxants,
      or anesthetics, including some dental anesthetics. Check with your doctor before
      taking any of the above while you are using this medicine .
  - type: paragraph
    text: This medicine may raise or lower your blood sugar. If you are diabetic and
      notice a change in the results of your blood or urine sugar tests, check with
      your doctor.
  - type: paragraph
    text: Before having any kind of surgery, tell the medical doctor in charge that
      you are using this medicine. Taking desipramine together with medicines used
      during surgery may increase the risk of side effects.
  - type: paragraph
    text: This medicine may cause hyponatremia (low sodium level in the blood). Check
      with your doctor right away if you have coma, confusion, decreased urine output,
      dizziness, fast or irregular heartbeat, headache, increased thirst, muscle pain
      or cramps, nausea or vomiting, seizures, swelling of the face, ankles, or hands,
      trouble breathing, or unusual tiredness or weakness.
  - type: paragraph
    text: Check with your doctor immediately if you have blurred vision, difficulty
      reading, or eye pain, during or after treatment. Your doctor may want your eyes
      be checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: This medicine may cause some people to become drowsy or less alert than
      they are normally. Make sure you know how you react to this medicine before
      you drive, use machines, or do anything else that could be dangerous if you
      are drowsy or not alert .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - black, tarry stools
      - blurred or double vision
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chest pain or discomfort
      - coma
      - confusion about identity, place, and time
      - cough or hoarseness
      - dark urine
      - decreased urine output
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dry mouth
      - fainting
      - fast, irregular, pounding, or racing heartbeat or pulse
      - headache
      - inability to move the arms, legs, or facial muscles
      - inability to speak
      - increased thirst
      - irritability
      - light-colored stools
      - lightheadedness
      - loss of appetite
      - loss of bladder control
      - muscle spasms or jerking of all extremities
      - nausea
      - nightmares
      - pain or discomfort in the arms, jaw, back, or neck
      - painful or difficult urination
      - pinpoint red or purple spots on the skin
      - pounding in the ears
      - rash
      - restlessness
      - seeing, hearing, or feeling things that are not there
      - seizures
      - shakiness and unsteady walk
      - slow speech
      - sore throat and fever
      - sores, ulcers, or white spots on the lips or in the mouth
      - stiffness of the limbs
      - stomach pain
      - sudden loss of consciousness
      - sweating
      - swelling
      - swelling of the face, ankles, or hands
      - swollen glands
      - talking, feeling, and acting with excitement
      - trouble breathing
      - trouble sleeping
      - twisting body movements
      - unsteadiness, trembling, or problems with muscle control or coordination
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
      - yellow eyes and skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bigger, dilated, or enlarged pupils (black part of the eye)
      - bloating
      - constipation
      - decrease in the frequency of urination
      - decrease in urine volume
      - decreased interest in sexual intercourse
      - diarrhea
      - difficulty in passing urine (dribbling)
      - hair loss or thinning of the hair
      - inability to have or keep an erection
      - increased in sexual ability, desire, drive, or performance
      - increased interest in sexual intercourse
      - increased sensitivity of the eyes to light
      - loss in sexual ability, desire, drive, or performance
      - painful urination
      - stomach cramps
      - swelling of the breasts or breast soreness in both females and males
      - swelling or inflammation of the mouth
      - unexpected or excess milk flow from breasts in females
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
