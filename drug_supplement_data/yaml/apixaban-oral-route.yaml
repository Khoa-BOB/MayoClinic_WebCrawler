      into the mouth with the tip along either cheek. Slowly push the plunger all
      the way down to give all of the medicine.
    - If there is medicine remaining in the cup, you may add about 5 mL of water,
      infant formula, or apple juice. Give the mixture within 2 hours after mixing.
  - type: list
    ordered: false
    items:
    - Tap the packet. Cut the dotted line on the packet to open it. Do not swallow
      the tablet.
    - Empty the tablets inside the packet into a medicine cup. Use a small spoon to
      stir the tablets into the applesauce. Give the mixture right away.
    - 'If you are using nasogastric tube or gastrotomy tube: Empty the tablets in
      the packet and prepare the medicine as directed. Place the mixture into the
      tube. Flush the tube with additional water or infant formula.'
  - type: paragraph
    text: If you are taking another medicine to thin the blood (eg, heparin, warfarin,
      Coumadin®, Jantoven®), your doctor will give you very specific instructions
      about how to switch to apixaban. Carefully follow the instructions and ask your
      doctor if you have any questions.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For prevention of deep venous thrombosis
        (hip replacement surgery): Adults—2.5 milligrams (mg) 2 times a day for 35
        days. The first dose should be taken 12 to 24 hours after surgery. Children—Use
        and dose must be determined by your doctor. For prevention deep venous thrombosis
        (knee replacement surgery): Adults—2.5 milligrams (mg) 2 times a day for 12
        days. The first dose should be taken 12 to 24 hours after surgery. Children—Use
        and dose must be determined by your doctor. For prevention of reoccurring
        deep venous thrombosis and pulmonary embolism: Adults—2.5 milligrams (mg)
        2 times a day after at least 6 months of treatment for deep venous thrombosis
        or pulmonary embolism. Children—Use and dose must be determined by your doctor.
        For prevention of strokes and blood clots in patients with nonvalvular atrial
        fibrillation: Adults—5 milligrams (mg) 2 times a day. Adults 80 years of age
        and older, weighing 60 kilograms (kg) or less, or with kidney problems—2.5
        mg 2 times a day. Children—Use and dose must be determined by your doctor.
        For treatment and prevention of venous thromboembolism: Children—Dose is base
        on weight and must be determined by your doctor. Weighing 35 kilograms (kg)
        or more—At first, 10 milligrams (mg) 2 times a day on Days 1 to 7, followed
        by 5 mg 2 times a day on Days 8 and beyond. Weighing 25 kg to less than 35
        kg—At first, 8 mg 2 times a day for Days 1 to 7, followed by 4 mg 2 times
        a day on Days 8 and beyond. Weighing 18 kg to less than 25 kg—At first, 6
        mg 2 times a day for Days 1 to 7, followed by 3 mg 2 times a day on Days 8
        and beyond. Weighing 12 kg to less than 18 kg—At first, 4 mg 2 times a day
        for Days 1 to 7, followed by 2 mg 2 times a day on Days 8 and beyond. Weighing
        9 kg to less than 12 kg—At first, 3 mg 2 times a day for Days 1 to 7, followed
        by 1.5 mg 2 times a day on Days 8 and beyond. Weighing 6 kg to less than 9
        kg—At first, 2 mg 2 times a day for Days 1 to 7, followed by 1 mg 2 times
        a day on Days 8 and beyond. Weighing 4 kg to less than 6 kg—At first, 1 mg
        2 times a day for Days 1 to 7, followed by 0.5 mg 2 times a day on Days 8
        and beyond. Children weighing 2.6 kilograms (kg) to less than 4 kg—Use of
        sprinkle is recommended. For treatment of deep venous thrombosis and pulmonary
        embolism: Adults—At first, 10 milligrams (mg) 2 times a day for the first
        7 days. Then, 5 mg 2 times a day. Children—Use and dose must be determined
        by your doctor.'
      - 'For oral dosage form (capsule): For treatment and prevention of venous thromboembolism:
        Children weighing 2.6 kilograms (kg) to less than 4 kg—At first, 0.3 milligrams
        (mg) 2 times a day on Days 1 to 7, followed by 0.15 mg 2 times a day on Days
        8 and beyond. Children weighing less than 2.6 kg—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For prevention of deep venous thrombosis (hip replacement surgery): Adults—2.5
        milligrams (mg) 2 times a day for 35 days. The first dose should be taken
        12 to 24 hours after surgery. Children—Use and dose must be determined by
