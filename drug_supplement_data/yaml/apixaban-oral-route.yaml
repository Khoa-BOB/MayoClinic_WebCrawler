    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: 'Oral liquid : If your child vomits or spits up right after or within
        30 minutes after taking the medicine, give another dose. If it is more than
        30 minutes, give the next dose at the regular time. Call your doctor right
        away if your child vomits or spits out the medicine repeatedly.'
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: You may store the crushed tablet with water, 5% dextrose in water (D5W),
        apple juice, and applesauce mixture for up to 4 hours.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly and to decide if you should
      continue to take it. Blood and urine tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: Make sure your doctor knows if you are pregnant or planning to become pregnant
      during treatment with this medicine.
  - type: paragraph
    text: Make sure any doctor who treats you knows that you are using this medicine.
      You may need to stop using this medicine for several days before having surgery,
      including dental procedures.
  - type: paragraph
    text: Do not suddenly stop using this medicine without asking your doctor . You
      might have a higher risk of stroke after you stop using this medicine.
  - type: paragraph
    text: You may bleed and bruise more easily while you are using this medicine.
      Be extra careful to avoid injuries. Stay away from rough sports or other situations
      where you could be bruised, cut, or injured. Gently brush and floss your teeth.
      Be careful when using sharp objects, including razors and fingernail clippers.
      Avoid picking your nose. If you need to blow your nose, blow it gently.
  - type: paragraph
    text: This medicine may cause bleeding problems. This risk is higher if you have
      a catheter in your back for pain medicine or anesthesia (called an epidural),
      or if you have kidney problems. The risk of bleeding increases if your kidney
      problems get worse. Check with your doctor right away if you have any unusual
      bleeding or bruising, black, tarry stools, bleeding gums, blood in the urine
      or stools, tingling, numbness, or weakness of the lower legs, or pinpoint red
      spots on your skin.
  - type: paragraph
    text: This medicine may increase the risk of forming blood clots in the spine
      or epidural area, which may lead to long-term or permanent paralysis. This is
      more likely to occur if you have an epidural catheter placed in your back, are
      taking NSAID or blood clotting medicine, a history of repeated epidural punctures
      or problems with your spine, or have had surgery on your spine. Tell your doctor
      right away if you have back pain, loss of bladder or bowel control, tingling,
      numbness, or muscle weakness, especially in your legs and feet.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - blood in the eyes
      - blood in the urine
      - bloody or black, tarry stools
      - bruising or purple areas on the skin
      - chest tightness
      - confusion
      - constipation
      - coughing up blood
      - decreased alertness
      - difficulty swallowing
      - dizziness
      - fainting
      - fast heartbeat
      - headache
      - hives, itching, skin rash
      - increased menstrual flow or vaginal bleeding
      - joint pain or swelling
      - nausea and vomiting
