title: Apixaban (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Eliquis
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Apixaban is used to treat or prevent deep venous thrombosis, a condition
      in which harmful blood clots form in the blood vessels of the legs. These blood
      clots can travel to the lungs and can become lodged in the blood vessels of
      the lungs, causing a condition called pulmonary embolism. This medicine is used
      for several days after hip or knee replacement surgery while you are unable
      to walk. It is during this time that blood clots are most likely to form.
  - type: paragraph
    text: Apixaban is also used to prevent stroke and blood clots in patients with
      certain heart rhythm problem (eg, nonvalvular atrial fibrillation). It is also
      used to treat or reduce the risk of venous thromboembolism (VTE) after receiving
      at least 5 days of medicine to treat blood clots.
  - type: paragraph
    text: Apixaban is a factor Xa inhibitor, an anticoagulant. It works by decreasing
      the clotting ability of the blood and helps preventing harmful clots from forming
      in the blood vessels.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Powder for Suspension
    - Tablet for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of apixaban to treat and prevent
        venous thromboembolism in children . Safety and efficacy have been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of apixaban in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Defibrotide
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Abciximab
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Aceclofenac
      - Acemetacin
      - Acenocoumarol
      - Adagrasib
      - Alipogene Tiparvovec
      - Alteplase, Recombinant
      - Amiodarone
      - Amtolmetin Guacil
      - Anagrelide
      - Anistreplase
      - Apalutamide
      - Ardeparin
      - Argatroban
      - Aspirin
      - Atazanavir
      - Avacopan
      - Bemiparin
      - Berotralstat
      - Betrixaban
      - Bivalirudin
      - Boceprevir
      - Bromfenac
      - Bufexamac
      - Cangrelor
      - Caplacizumab-yhdp
      - Capmatinib
      - Carbamazepine
      - Celecoxib
      - Ceritinib
      - Certoparin
      - Choline Salicylate
      - Cilostazol
      - Citalopram
      - Clonixin
      - Clopidogrel
      - Cobicistat
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Betamethasone
      - Clarithromycin
      - Dexamethasone
      - Hydrocortisone
      - Methylprednisolone
      - Prednisolone
      - Prednisone
      - Triamcinolone
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Antiphospholipid syndrome or
      - Bleeding, active or
      - Liver disease, severe or
      - Prosthetic (artificial) heart valve—Should not be used in patients with these
        conditions.
    - type: list
      ordered: false
      items:
      - Bleeding problems, history of or
      - Catheter insertion in the spine or
      - Liver disease, mild to moderate or
      - Surgery (eg, spine), recent or history of—Use with caution. The risk of bleeding
        may be increased.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. When your supply of this medicine is running low, contact
      your doctor or pharmacist ahead of time. Do not allow yourself to run out of
      this medicine .
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. It
      is very important that you read and understand this information. Be sure to
      ask your doctor if you have any questions.
  - type: paragraph
    text: 'If you are unable to swallow the tablet whole :'
  - type: list
    ordered: false
    items:
    - The 2.5 milligram (mg) and 5 mg tablets may be crushed and mixed with water,
      5% dextrose in water (D5W), apple juice, or applesauce.
    - 'If you are using nasogastric tube: The 2.5 mg and 5 mg tablets may be crushed
      and mixed with 60 milliliters (mL) of water or D5W before giving it via the
      tube. Flush the tube with another 20 mL of water or D5W.'
  - type: paragraph
    text: 'To use the Eliquis® Sprinkle :'
  - type: list
    ordered: false
    items:
    - Hold the capsule with the colored end up. Tap the clear end to get the medicine
      into the clear end.
    - Twist both ends of the capsule and slowly pull it apart. Sprinkle the contents
      into a medicine cup. Check the capsule shells to make sure they are empty. Do
      not swallow the capsule.
    - Add 5 milliliters (mL) of water or infant formula into the medicine cup. Do
      not use any other liquid. Stir the mixture until the powder particles can no
      longer be seen.
    - Push the plunger all the way down. Place the syringe tip into the cup and pull
      up the mixture. Make sure your child is sitting upright. Place the oral syringe
      into the mouth with the tip along either cheek. Slowly push the plunger all
      the way down to give all of the medicine.
    - If there is medicine remaining in the cup, you may add about 5 mL of water or
      infant formula. Give the mixture within 2 hours after mixing.
  - type: paragraph
    text: 'To use the tablets for suspension :'
  - type: list
    ordered: false
    items:
    - 'Liquid mixing method: Tap the packet. Cut the dotted line on the packet to
      open it. Do not swallow the tablet. Empty the tablets inside the packet into
      a medicine cup. Add 10 milliliters (mL) of water, infant formula, or apple juice
      into the medicine cup. Do not use any other liquid. Use a small spoon to crush
      and stir the medicine in the liquid. Stir continuously until the tablets are
      no longer visible in the liquid. It will take about 5 to 7 minutes. Push the
      plunger all the way down. Place the syringe tip into the cup and pull up the
      mixture. Make sure your child is sitting upright. Place the oral syringe into
      the mouth with the tip along either cheek. Slowly push the plunger all the way
      down to give all of the medicine. If there is medicine remaining in the cup,
      you may add about 5 mL of water, infant formula, or apple juice. Give the mixture
      within 2 hours after mixing.'
    - 'Food mixing method: Tap the packet. Cut the dotted line on the packet to open
      it. Do not swallow the tablet. Empty the tablets inside the packet into a medicine
      cup. Use a small spoon to stir the tablets into the applesauce. Give the mixture
      right away. If you are using nasogastric tube or gastrotomy tube: Empty the
      tablets in the packet and prepare the medicine as directed. Place the mixture
      into the tube. Flush the tube with additional water or infant formula.'
  - type: list
    ordered: false
    items:
    - Tap the packet. Cut the dotted line on the packet to open it. Do not swallow
      the tablet.
    - Empty the tablets inside the packet into a medicine cup. Add 10 milliliters
      (mL) of water, infant formula, or apple juice into the medicine cup. Do not
      use any other liquid.
    - Use a small spoon to crush and stir the medicine in the liquid. Stir continuously
