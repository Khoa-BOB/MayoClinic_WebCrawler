title: Candesartan and hydrochlorothiazide (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Atacand HCT
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Candesartan and hydrochlorothiazide combination is used to treat high blood
      pressure (hypertension). High blood pressure adds to the workload of the heart
      and arteries. If it continues for a long time, the heart and arteries may not
      function properly. This can damage the blood vessels of the brain, heart, and
      kidneys, resulting in a stroke, heart failure, or kidney failure. Lowering blood
      pressure reduces the risk of stroke and heart attack.
  - type: paragraph
    text: Candesartan is an angiotensin II receptor blocker (ARB). It works by blocking
      the action of a substance in the body that causes the blood vessels to tighten.
      As a result, candesartan relaxes the blood vessels. This lowers blood pressure
      and increases the supply of blood and oxygen to the heart.
  - type: paragraph
    text: Hydrochlorothiazide is a thiazide diuretic (water pill). It reduces the
      amount of water in the body by increasing the flow of urine, which helps lower
      the blood pressure.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of candesartan and hydrochlorothiazide combination in the pediatric
        population. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of candesartan and hydrochlorothiazide
        combination in the elderly. However, elderly patients are more likely to have
        age-related kidney problems, which may require caution and an adjustment in
        the dose for patients receiving candesartan and hydrochlorothiazide combination.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Dofetilide
      - Isocarboxazid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Aceclofenac
      - Acemetacin
      - Acetyldigoxin
      - Albiglutide
      - Albuterol
      - Alogliptin
      - Amphetamine
      - Amtolmetin Guacil
      - Arsenic Trioxide
      - Aspirin
      - Benzhydrocodone
      - Benzphetamine
      - Bromfenac
      - Bromocriptine
      - Bufexamac
      - Buprenorphine
      - Canagliflozin
      - Cefepime
      - Celecoxib
      - Chlorpropamide
      - Choline Salicylate
      - Clonixin
      - Codeine
      - Dapagliflozin
      - Deslanoside
      - Desmopressin
      - Dexibuprofen
      - Dexketoprofen
      - Dextroamphetamine
      - Diazoxide
      - Diclofenac
      - Diflunisal
      - Digitalis
      - Digitoxin
      - Digoxin
      - Dihydrocodeine
      - Dipyrone
      - Droperidol
      - Droxicam
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aminolevulinic Acid
      - Bepridil
      - Carbamazepine
      - Cholestyramine
      - Ginkgo
      - Gossypol
      - Licorice
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anuria (not able to pass urine) or
      - Diabetic patients who are also taking aliskiren (Tekturna®) or
      - Patients with kidney disease who are also taking aliskiren (Tekturna®) or
      - Sulfa drug allergy, history of—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Asthma, history of—May increase likelihood of having an allergic reaction.
    - type: list
      ordered: false
      items:
      - Congestive heart failure (severe) or
      - Dehydration or
      - Diarrhea or
      - Heart or blood vessel disease or
      - Hyponatremia (low sodium in the blood) or
      - Hypovolemia (low blood volume) or
      - Kidney problems or
      - Major surgery or anesthesia—Use with caution. These conditions may cause the
        blood pressure to fall too low with this medicine.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Edema (swelling or fluid in the body) or
      - Electrolyte imbalance (eg, low levels of magnesium, potassium, salt or sodium
        in the body) or
      - Fluid imbalance (due to excessive perspiration, vomiting, diarrhea) or
      - Glaucoma, secondary angle closure or
      - Gout or
      - Hypercalcemia (high calcium in the blood) or
      - Hyperlipidemia (high cholesterol or fats in the blood) or
      - Hypertriglyceridemia (high triglycerides in the blood) or
      - Liver disease or
      - Myopia, acute (changes in the eyeball causing vision problems) or
      - Systemic lupus erythematosus (SLE)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine should not be the first medicine you use to treat your condition
      . It is meant to be used only after you have tried other medicines that have
      not worked or have caused unwanted side effects.
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these are most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure but it
      does help control it. Therefore, you must continue to take it as directed if
      you expect to lower your blood pressure and keep it down. You may have to take
      high blood pressure medicine for the rest of your life . If high blood pressure
      is not treated, it can cause serious problems such as heart failure, blood vessel
      disease, stroke, or kidney disease.
  - type: paragraph
    text: Swallow the tablet whole. Do not break, crush, or chew it. This medicine
      may be taken with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For high blood pressure: Adults—At first,
        16 milligrams (mg) candesartan and 12.5 mg hydrochlorothiazide once a day.
        Your doctor may adjust your dose as needed. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—At first, 16 milligrams (mg) candesartan
        and 12.5 mg hydrochlorothiazide once a day. Your doctor may adjust your dose
        as needed. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 16 milligrams (mg) candesartan and 12.5 mg hydrochlorothiazide
        once a day. Your doctor may adjust your dose as needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby, especially
      in your second or third trimester. Use an effective form of birth control to
      keep from getting pregnant. If you think you have become pregnant while using
      this medicine, tell your doctor right away. You may need to stop using this
      medicine.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur after the first dose,
      especially if you have been taking a diuretic (water pill). Make sure you know
      how you react to this medicine before you drive, use machines, or do anything
      else that could be dangerous if you dizzy or not alert . If you feel dizzy,
      lie down so you do not faint. Then sit for a few moments before standing to
      prevent the dizziness from returning.
  - type: paragraph
    text: Check with your doctor right away if you experience confusion, dizziness,
      muscle pain, weakness, or a fast heartbeat. Drink more fluids when you exercise
      or if the weather is hot. Heavy sweating or diarrhea and vomiting can cause
      dehydration (loss of too much water) or electrolyte imbalances (loss of sodium
      in the body). Check with your doctor if you become sick with severe nausea,
      vomiting, or diarrhea.
  - type: paragraph
    text: Check with your doctor immediately if blurred vision, difficulty in reading,
      eye pain, or any other change in vision occurs during or after treatment. Your
      doctor may want an eye doctor to check your eyes.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery or medical tests.
  - type: paragraph
    text: Alcohol, narcotic pain relievers, or sleeping pills may cause you to feel
      more lightheaded, dizzy, or faint when used with this medicine. Tell your doctor
      if you are drinking alcohol or using pain relievers or sleeping pills.
  - type: paragraph
    text: This medicine may affect blood sugar levels. Diabetic patients may notice
      a change in the results of your blood or urine sugar tests. Talk to your doctor
      if you have any questions.
  - type: paragraph
    text: Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have stomach pain, confusion,
      irregular heartbeat, nausea or vomiting, nervousness, numbness or tingling in
      the hands, feet, or lips, trouble breathing, or weakness or heaviness of the
      legs. Do not use medicines, supplements, or salt substitutes containing potassium
      without first checking with your doctor .
  - type: paragraph
    text: This medicine may increase your risk of getting skin cancer (eg, non-melanoma
      skin cancer). Avoid sun exposure. Use a sunscreen when you are outdoors. Avoid
      sunlamps and tanning beds. Talk to your doctor if you have concerns about this
      risk.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes prescription or over-the-counter (nonprescription)
      medicines for appetite control, asthma, colds, cough, hay fever, or sinus problems,
      and herbal or vitamin supplements, since they may tend to increase your blood
      pressure.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - dizziness
      - dryness of the mouth
      - fever
      - increased thirst
      - irregular heartbeat
      - lightheadedness
      - muscle cramps
      - nausea
      - sore throat
      - unusual tiredness
      - vomiting
      - weak pulse
      - weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm pain
      - chest pain or tightness
      - fast heartbeat
      - large, hive like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - trouble breathing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chills
      - confusion
      - lower back or side pain
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - painful or difficult urination
      - pale skin
      - persistent non-healing sore
      - pink growth
      - reddish patch or irritated area
      - shiny bump
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach pain
      - swelling of the face, ankles, or hands
      - unusual bleeding or bruising
      - weakness or heaviness of the legs
      - white, yellow or waxy scar-like area
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - diarrhea
      - headache
      - joint pain
      - loss of appetite
      - muscle aches and pains
      - runny nose
      - sneezing
      - sweating
      - trouble sleeping
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, loosening of skin
      - decreased interest in sexual intercourse
      - hair loss, thinning of the hair
      - hives or welts, itching, skin rash
      - inability to have or keep an erection
      - increased sensitivity of the skin to sunlight
      - loss in sexual ability, desire, drive, or performance
      - redness of the skin
      - redness or other discoloration of the skin
      - red irritated eyes
      - red skin lesions, often with a purple center
      - severe sunburn
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
