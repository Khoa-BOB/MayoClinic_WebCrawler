    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to decide if you should continue to take it. Blood and urine tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Eslicarbazepine may cause some people to be agitated, irritable, or display
      other abnormal behaviors, such as feeling sad or hopeless, getting upset easily,
      or feeling nervous, restless, or hostile. It may also cause some people to have
      suicidal thoughts and tendencies or to become more depressed. If you notice
      any of these side effects, tell your doctor right away.
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Check with your doctor
      right away if you have blistering, peeling, or loosening of the skin, red skin
      lesions, severe acne or skin rash, sores or ulcers on the skin, or fever or
      chills while you are using this medicine.
  - type: paragraph
    text: 'This medicine may cause serious allergic reactions affecting multiple body
      organs (eg, liver, kidneys). Check with your doctor right away if you have the
      following symptoms: a fever, dark urine, headache, rash, stomach pain, swollen,
      painful, or tender lymph glands in neck, armpit, or groin, unusual tiredness,
      or yellow eyes or skin.'
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema. These can be life-threatening and require immediate medical
      attention. Call your doctor right away if you have a rash, itching, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      while you are using this medicine.
  - type: paragraph
    text: This medicine may cause hyponatremia (low sodium in the blood). Check with
      your doctor right away if you have confusion, decreased urine output, dizziness,
      fast or irregular heartbeat, headache, muscle pain or cramps, nausea, vomiting,
      swelling of the face, ankles, or hands, or unusual tiredness or weakness while
      you are using this medicine.
  - type: paragraph
    text: Eslicarbazepine may make you dizzy, drowsy, clumsy, tired, or have vision
      changes. Do not drive or do anything else that could be dangerous until you
      or your child know how this medicine affects you . If these reactions are especially
      bothersome, check with your doctor.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Do not suddenly stop taking this medicine without checking first with your
      doctor . Your doctor may want you to gradually reduce the amount you are using
      before stopping it completely. This may help decrease your chance of having
      more seizures.
  - type: paragraph
    text: This medicine may increase your risk of having blood problems (eg, pancytopenia,
      agranulocytosis, leukopenia). Talk to your doctor about this risk.
  - type: paragraph
    text: Some birth control pills may not work as well while you are using this medicine.
      You might need additional forms of birth control with your pills to avoid getting
      pregnant. Talk to your doctor if you have concerns.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are taking this medicine. The results of some tests may be affected by this
      medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - confusion
      - decreased urine output
      - dizziness
      - fast or irregular heartbeat
      - fever
      - increased in seizure frequency or severity
      - muscle pain or cramps
      - nausea
      - severe thirst
      - swelling of the face, ankles, or hands
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - bloating of the abdomen or stomach
      - changes in behavior
      - discouragement
      - difficulty breathing
      - difficulty swallowing
      - feeling sad or empty
      - hives, rash, or itching skin
      - joint or muscle pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid, shallow breathing
      - red skin lesions, often with a purple center
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach pain
      - thoughts or attempts at killing oneself
      - upper right abdominal or stomach pain
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - chest pain
      - cough
      - hoarseness
      - decreased awareness or responsiveness
      - fainting spells
      - general feeling of tiredness or weakness
      - headache
      - high fever
      - hostility
      - irregular heartbeat
      - irritability
      - loss of consciousness
      - lower back or side pain
      - muscle twitching
      - painful or difficult urination
      - pale skin
      - pinpoint red spots on the skin
      - rapid weight gain
      - severe sleepiness
      - sore throat
      - unusual bleeding or bruising
      - unusual drowsiness, dullness, or feeling of sluggishness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - double vision
      - sensation of spinning or constant movement
      - sleepiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in patterns and rhythms of speech
      - heartburn
      - indigestion
      - loss of interest or pleasure
      - shakiness and unsteady walk
      - shakiness in the legs, arms, hands, or feet
      - tingling of the hands or feet
      - trembling or shaking of the hands or feet
      - trouble concentrating
      - unusual weight gain or loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
