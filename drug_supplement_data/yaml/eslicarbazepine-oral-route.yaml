title: Eslicarbazepine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Aptiom
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Eslicarbazepine is used alone or together with other medicines to control
      partial seizures (convulsions) in the treatment of epilepsy.
  - type: paragraph
    text: Eslicarbazepine belongs to a class of medicines called anticonvulsants.
      It acts in the brain to prevent seizures. However, this medicine cannot cure
      epilepsy and will only work to control seizures as long as you continue to take
      it.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of eslicarbazepine in children younger than 4 years of age.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of eslicarbazepine in the elderly.
        However, elderly patients are more likely to have age-related kidney problems,
        which may require caution and an adjustment in the dose for patients receiving
        eslicarbazepine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Phenelzine
      - Ranolazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alfentanil
      - Amiodarone
      - Amitriptyline
      - Amlodipine
      - Atazanavir
      - Atogepant
      - Belzutifan
      - Benzhydrocodone
      - Buprenorphine
      - Calcifediol
      - Cariprazine
      - Carisoprodol
      - Ceritinib
      - Cilostazol
      - Citalopram
      - Clobazam
      - Clomipramine
      - Cobicistat
      - Codeine
      - Cyclophosphamide
      - Cyclosporine
      - Desogestrel
      - Diazepam
      - Dienogest
      - Dihydrocodeine
      - Diltiazem
      - Dolutegravir
      - Doxepin
      - Drospirenone
      - Escitalopram
      - Esomeprazole
      - Estetrol
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Etonogestrel
      - Fentanyl
      - Fexinidazole
      - Fosphenytoin
      - Gestodene
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Carbamazepine
      - Clopidogrel
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Depression, history of or
      - Hyponatremia (low sodium in the blood) or
      - Mental illness, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use of eslicarbazepine is not recommended.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may crush the tablets or swallow them whole. You may take this medicine
      with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For seizures: Adults—At first, 400 milligrams
        (mg) once per day. Your doctor may adjust your dose as needed. However, the
        dose is usually not more than 1600 mg once per day. Children 4 to 17 years
        of age—Dose is based in body weight and must be determined by your doctor.
        Weighs more than 38 kilograms (kg)—At first, 400 mg once per day. Your doctor
        may adjust your dose as needed. However, the dose is usually not more than
        1200 mg once per day. Weighs 32 to 38 kg—At first, 300 mg once per day. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than 900 mg once per day. Weighs 22 to 31 kg—At first, 300 mg once per day.
        Your doctor may adjust your dose as needed. However, the dose is usually not
        more than 800 mg once per day. Weighs 11 to 21 kg—At first, 200 mg once per
        day. Your doctor may adjust your dose as needed. However, the dose is usually
        not more than 600 mg once per day. Children younger than 4 years of age—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For seizures: Adults—At first, 400 milligrams (mg) once per day. Your doctor
