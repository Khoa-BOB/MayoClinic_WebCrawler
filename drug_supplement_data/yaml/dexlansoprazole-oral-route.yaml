title: Dexlansoprazole (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Dexilant
    - type: paragraph
      text: Dexilant SoluTab
    - type: paragraph
      text: Kapidex
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Dexlansoprazole is used to treat certain conditions in which there is too
      much acid in the stomach. It is used to treat erosive esophagitis or "heartburn"
      caused by gastroesophageal reflux disease (GERD), a condition where the acid
      in the stomach washes back up into the esophagus.
  - type: paragraph
    text: Dexlansoprazole is a proton pump inhibitor (PPI). It works by decreasing
      the amount of acid produced by the stomach.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: On October 17, 2017, Dexilant Solutab® (delayed-release disintegrating tablets)
      was withdrawn from the US market. Dexilant® and Kapidex® (delayed-release capsules)
      are still available.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule, Delayed Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of dexlansoprazole in children younger than 12 years of age.
        Safety and efficacy have not been established. Dexilant is not recommended
        in children younger than 2 years of age and may increase the risk for heart
        problems (eg, heart valve thickening).
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of dexlansoprazole in the elderly.
        However, elderly patients are more sensitive to the effects of this medicine
        than younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Rilpivirine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acalabrutinib
      - Amphetamine
      - Apalutamide
      - Atazanavir
      - Atezolizumab
      - Belumosudil
      - Benzphetamine
      - Bosutinib
      - Cannabidiol
      - Capecitabine
      - Carbamazepine
      - Cefuroxime Axetil
      - Dacomitinib
      - Dasatinib
      - Defactinib
      - Dextroamphetamine
      - Erlotinib
      - Fedratinib
      - Fluconazole
      - Gefitinib
      - Infigratinib
      - Ketoconazole
      - Ledipasvir
      - Levoketoconazole
      - Lisdexamfetamine
      - Lonafarnib
      - Methamphetamine
      - Methotrexate
      - Methylphenidate
      - Mycophenolate Mofetil
      - Nelfinavir
      - Neratinib
      - Nilotinib
      - Nirogacestat
      - Nivolumab
      - Octreotide
      - Palbociclib
      - Paltusotine
      - Pazopanib
      - Pexidartinib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Clopidogrel
      - Itraconazole
      - Levothyroxine
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Cranberry
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diarrhea or
      - Hypomagnesemia (low magnesium in the blood), history of or
      - Osteoporosis (bone problem) or
      - Seizures, history of or
      - Systemic lupus erythematosus (SLE)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Liver disease, moderate—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: 'If you are taking the delayed-release capsule :'
  - type: list
    ordered: false
    items:
    - You may take this medicine with or without food.
    - Swallow it whole. If you cannot swallow the capsule whole, you may open it and
      pour the contents into a tablespoon of applesauce. Swallow the mixture right
      away without chewing. Do not store the mixed medicine for later use.
    - 'If Dexilant® is given through an oral syringe: Open the capsule and pour the
      medicine into a clean container with 20 milliliters (mL) of water. Use an oral
      syringe to draw up the water and granule mixture. Swirl the syringe gently to
      keep the granules from settling. Give the mixture directly into the mouth right
      away. Do not store the mixed medicine for later use. To rinse any leftover medicine
      in the syringe, refill the syringe with 10 mL of water, swirl gently and swallow
      the water. Repeat with an additional 10 mL of water.'
    - 'If Dexilant® is given through a feeding tube: Open the capsule and pour the
      medicine into a clean container with 20 mL of water. Get the mixed medicine
      into a catheter-tip syringe. Swirl the syringe gently to keep the granules from
      settling, and inject the medicine into the NG tube right away. Refill the syringe
      with the 10 mL of water. Swirl it gently, and inject it into the tube to rinse
      any leftover medicine through the tube. Repeat with an additional 10 mL of water.'
  - type: paragraph
    text: Use only the brand of this medicine that your doctor prescribed. Different
      brands may not work the same way.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (delayed-release capsules): For treatment of erosive
        esophagitis (EE): Adults and children 12 years of age and older—60 milligrams
        (mg) once a day for up to 8 weeks. To prevent erosive esophagitis from coming
        back and for relief of heartburn, your doctor may want you to take 30 mg once
        a day for up to 6 months. Children younger than 12 years of age—Use and dose
        must be determined by your doctor. Children younger than 2 years of age—Use
        of Dexilant is not recommended. For treatment of gastroesophageal reflux disease
        (GERD): Adults and children 12 years of age and older—30 milligrams (mg) once
        a day for 4 weeks. Children younger than 12 years of age—Use and dose must
        be determined by your doctor. Children younger than 2 years of age—Use of
        Dexilant is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For treatment of erosive esophagitis (EE): Adults and children 12 years of
        age and older—60 milligrams (mg) once a day for up to 8 weeks. To prevent
        erosive esophagitis from coming back and for relief of heartburn, your doctor
        may want you to take 30 mg once a day for up to 6 months. Children younger
        than 12 years of age—Use and dose must be determined by your doctor. Children
        younger than 2 years of age—Use of Dexilant is not recommended.'
      - 'For treatment of gastroesophageal reflux disease (GERD): Adults and children
        12 years of age and older—30 milligrams (mg) once a day for 4 weeks. Children
        younger than 12 years of age—Use and dose must be determined by your doctor.
        Children younger than 2 years of age—Use of Dexilant is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—60 milligrams (mg) once a day
        for up to 8 weeks. To prevent erosive esophagitis from coming back and for
        relief of heartburn, your doctor may want you to take 30 mg once a day for
        up to 6 months.
      - Children younger than 12 years of age—Use and dose must be determined by your
        doctor.
      - Children younger than 2 years of age—Use of Dexilant is not recommended.
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—30 milligrams (mg) once a day
        for 4 weeks.
      - Children younger than 12 years of age—Use and dose must be determined by your
        doctor.
      - Children younger than 2 years of age—Use of Dexilant is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your or your child's progress at
      regular visits . This will allow your doctor to see if this medicine is working
      properly and to decide if you should continue to take it. Blood, urine, and
      other laboratory tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not take this medicine if you are also using products that contain rilpivirine
      (Complera®, Edurant®). Using these medicines together may cause unwanted side
      effects .
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Check
      with your doctor right away if you have a rash, itching, hoarseness, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      while you are using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you or your child has a change in frequency
      of urination or amount of urine, blood in the urine, fever, joint pain, loss
      of appetite, skin rash, swelling of the body, feet, or ankles, unusual tiredness
      or weakness, or unusual weight gain after receiving this medicine. These could
      be symptoms of a serious kidney problem called acute tubulointerstitial nephritis.
  - type: paragraph
    text: Taking this medicine for a long time may make it harder for your body to
      absorb vitamin B12. Tell your doctor if you have concerns about vitamin B12
      deficiency.
  - type: paragraph
    text: Serious stomach conditions may occur while taking this medicine. Check with
      your doctor immediately if you or your child has stomach cramps, bloated feeling,
      watery and severe diarrhea which may also be bloody sometimes, fever, nausea
      or vomiting, or unusual tiredness or weakness.
  - type: paragraph
    text: Dexlansoprazole may increase your risk of having fractures of the hip, wrist,
      and spine. This is more likely if you are 50 years of age and older, if you
      receive high doses of this medicine, or use it for one year or more. Call your
      doctor right away if you have severe bone pain or are unable to walk or sit
      normally.
  - type: paragraph
    text: Cutaneous or systemic lupus erythematosus may occur or get worse in patients
      receiving a PPI. Call your doctor right away if you have joint pain or a skin
      rash on your cheeks or arms that gets worse when exposed to the sun.
  - type: paragraph
    text: This medicine may cause serious skin reactions, including Stevens-Johnson
      syndrome, toxic epidermal necrolysis, acute generalized exanthematous pustulosis,
      and drug reaction with eosinophilia and systemic symptoms (DRESS). Check with
      your doctor right away if you have black, tarry stools, blistering, peeling,
      or loosening of the skin, chest pain, chills, cough, diarrhea, itching, joint
      or muscle pain, painful or difficult urination, red irritated eyes, red skin
      lesions, often with a purple center, sore throat, sores, ulcers, or white spots
      in the mouth or on the lips, swollen glands, unusual bleeding or bruising, or
      unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause hypomagnesemia (low magnesium in the blood). This
      is more likely to occur if you are taking this medicine for more than 1 year,
      or if you are taking this medicine together with digoxin (Lanoxin®) or certain
      diuretics (water pills). Check with your doctor right away if you have convulsions
      (seizures), fast, racing, or uneven heartbeat, muscle spasms (tetany), tremors,
      or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may increase your risk for fundic gland polyps (abnormal tissue
      growth in the upper part of your stomach). This is more likely if you are receiving
      this medicine for more than 1 year. Talk to your doctor if you have concerns.
  - type: paragraph
    text: Do not stop taking this medicine without first checking with your doctor,
      or unless told to do so by your doctor.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      you have medical tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription (eg, atazanavir, nelfinavir, Reyataz®, Viracept®)
      or nonprescription (over-the-counter [OTC]) medicines and herbal (eg, St. John's
      wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chest pain, discomfort, tightness, or heaviness
      - confusion
      - continuing stomach pain
      - diarrhea
      - difficult or labored breathing
      - fast, irregular, pounding, or racing heartbeat or pulse
      - fever
      - headache
      - incoherent speech
      - joint pain, stiffness, or swelling
      - lightheadedness, dizziness, or fainting
      - muscle pain, cramps, or weakness
      - nausea
      - numbness or tingling in the hands, feet, or lips
      - pain or discomfort in the arms, jaw, leg, back, or neck
      - pounding in the ears
      - rash, hives
      - shakiness in the legs, arms, hands, or feet
      - sweating
      - swelling of the eyelids, face, lips, hands, or feet
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
      - unusual bleeding or bruising
      - vomiting
      - vomiting of blood or material that looks like coffee grounds
      - watery or bloody diarrhea
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blistering, peeling, or loosening of the skin
      - blood in the urine
      - bloody nose
      - bone fracture
      - chills
      - confusion
      - cough
      - decreased urine output
      - drowsiness
      - dry mouth
      - heavier menstrual periods
      - increased thirst
      - itching
      - joint or muscle pain
      - loss of appetite
      - mood or mental changes
      - muscle cramps in the hands, arms, feet, legs, or face
      - muscle spasms (tetany) or twitching
      - numbness and tingling around the mouth, fingertips, or feet
      - painful or difficult urination
      - pinpoint red spots on the skin
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - seizures
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach cramps
      - swelling of the body, feet, or ankles
      - swollen glands
      - trembling
      - trouble speaking, thinking or walking
      - unusual tiredness or weakness
      - unusual weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal dreams
      - body aches or pain
      - bloated or full feeling
      - burning or itching around the anus
      - change in taste or bad, unusual, or unpleasant (after) taste
      - continuing ringing or buzzing or other unexplained noise in the ears
      - difficult or painful urination
      - difficulty with moving
      - ear congestion
      - ear pain
      - excess air or gas in the stomach or bowels
      - falls
      - feeling of constant movement of self or surroundings
      - loss in sexual ability, desire, drive, or performance
      - loss of voice
      - metallic taste
      - muscle or bone pain
      - passing gas
      - redness of the face, neck, arms, and occasionally, upper chest
      - runny or stuffy nose
      - sensation of spinning
      - sneezing
      - sunburn
      - trouble sleeping
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - decreased interest in sexual intercourse
      - inability to have or keep an erection
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
