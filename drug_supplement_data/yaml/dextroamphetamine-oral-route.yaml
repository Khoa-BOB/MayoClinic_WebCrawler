      - Blurred vision
      - chest discomfort or pain
      - constipation
      - diarrhea
      - difficulty breathing
      - dizziness
      - faintness
      - false or unusual sense of well-being
      - fast, pounding, or irregular heartbeat or pulse
      - headache
      - nausea
      - pounding in the ears
      - shakiness in the legs, arms, hands, or feet
      - stomach pain
      - swelling of the feet or lower legs
      - trembling or shaking of the hands or feet
      - twitching, twisting, or uncontrolled repetitive movements of the tongue, lips,
        face, arms, or legs
      - unable to sleep
      - uncontrolled vocal outbursts and/or tics (uncontrolled repeated body movements)
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Aggressive
      - agitation
      - angry
      - blurred vision
      - change in consciousness
      - chest pain or discomfort
      - confusion
      - dark urine
      - diarrhea
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
