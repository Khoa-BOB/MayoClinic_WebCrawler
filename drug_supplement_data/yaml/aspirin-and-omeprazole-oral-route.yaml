    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Cranberry
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse or history of or
      - Bleeding problems (eg, hemophilia) or
      - Cutaneous lupus erythematosus or
      - Diarrhea or
      - Hypomagnesemia (low magnesium in the blood), history of or
      - Kidney disease or
      - Osteoporosis (bone problem) or
      - Stomach ulcers or bleeding, history of or
      - Systemic lupus erythematosus (SLE)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Aspirin-sensitive asthma or
      - Aspirin sensitivity, history of or
      - Kidney disease (eg, kidney failure), severe or
      - Liver disease or
      - Viral infections in children, suspected—Should not be used in patients with
        these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Take this medicine at least 60 minutes before a meal.
  - type: paragraph
    text: Swallow the delayed-release tablet whole with liquid. Do not split, chew,
      crush, or dissolve it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (delayed release tablets): To prevent heart and blood
        vessel problems and who are at risk of developing stomach ulcers caused by
        aspirin: Adults—1 tablet once a day. Each tablet contains 81 or 325 milligrams
        (mg) of aspirin and 40 mg of omeprazole. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'To prevent heart and blood vessel problems and who are at risk of developing
        stomach ulcers caused by aspirin: Adults—1 tablet once a day. Each tablet
        contains 81 or 325 milligrams (mg) of aspirin and 40 mg of omeprazole. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—1 tablet once a day. Each tablet contains 81 or 325 milligrams (mg)
        of aspirin and 40 mg of omeprazole.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits .
      This will allow your doctor to see if the medicine is working properly and to
      decide if you should continue to take it. Blood, urine, and other laboratory
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not use this medicine if you are also using medicines containing rilpivirine
      (Edurant®, Complera®, Odefsey®). Using these medicines together may cause unwanted
      side effects .
  - type: paragraph
    text: Tell your doctor if you are of Asian descent, such as Filipino, Chinese,
      Japanese, Korean, or Taiwanese. You may need a lower dose of this medicine.
  - type: paragraph
    text: Serious stomach conditions may occur while using this medicine. Check with
      your doctor immediately if you have stomach cramps, bloated feeling, watery
      and severe diarrhea which may also be bloody sometimes, fever, nausea or vomiting,
      or unusual tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have a bloody urine, change in
      frequency of urination or amount of urine, a fever, joint pain, loss of appetite,
      skin rash, swelling of the body, feet, or ankles, unusual tiredness or weakness,
      or unusual weight gain after using this medicine. These may be symptoms of a
      serious kidney problem called acute tubulointerstitial nephritis.
  - type: paragraph
    text: This medicine may increase your risk of having fractures of the hip, wrist,
      and spine. This is more likely if you are 50 years of age and older, if you
      receive high doses of this medicine, or use it for one year or more.
  - type: paragraph
    text: Cutaneous or systemic lupus erythematosus may occur or gets worse in lupus
      patients and are taking PPI. Call your doctor right away if you have a joint
      pain or skin rash on your cheeks or arms that gets worse when exposed in the
      sun.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Drinking alcohol while using this medicine may increase your risk of liver
      damage. If you drink 3 or more alcoholic drinks every day, tell your doctor.
  - type: paragraph
    text: Taking this medicine for a long time may make it harder for your body to
      absorb vitamin B12. Tell your doctor if you have concerns about vitamin B12
      deficiency.
  - type: paragraph
    text: This medicine may cause hypomagnesemia (low magnesium in the blood). This
      is more likely to occur if you are taking this medicine for more than one year,
      or if you are taking this medicine together with digoxin (Lanoxin®) or certain
      diuretics or "water pills". Check with your doctor right away if you have convulsions
      (seizures), fast, racing, or uneven heartbeat, muscle spasms (tetany), tremors,
      or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may increase your risk for fundic gland polyps (abnormal tissue
      growth in the upper part of your stomach). This is more likely if you are receiving
      this medicine for more than 1 year. Talk to your doctor if you have concerns.
  - type: paragraph
    text: Do not stop using this medicine suddenly without asking your doctor . You
      may need to slowly decrease your dose before stopping it completely.
  - type: paragraph
    text: Using this medicine during the later part of pregnancy can harm your unborn
      baby. If you think you have become pregnant while using this medicine, tell
      your doctor right away.
  - type: paragraph
    text: This medicine may cause a delay in ovulation for women and may affect their
      ability to have children. If you plan to have children, talk with your doctor
      before using this medicine.
  - type: paragraph
    text: This medicine may cause serious skin reactions, including exfoliative dermatitis,
      Stevens-Johnson syndrome, toxic epidermal necrolysis, acute generalized exanthematous
      pustulosis, fixed drug eruption (FDE), and generalized bullous fixed drug eruption
      (GBFDE). Check with your doctor right away if you have blistering, peeling,
      or loosening of the skin, chills, cough, diarrhea, itching, joint or muscle
      pain, red irritated eyes, red skin lesions, often with a purple center, sore
      throat, sores, ulcers, or white spots in the mouth or on the lips, or unusual
      tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have black, tarry stools, chest
      pain, chills, cough, fever, painful or difficult urination, sore throat, sores,
      ulcers, or white spots on the lips or in the mouth, swollen glands, trouble
      breathing, unusual bleeding or bruising, or unusual tiredness or weakness. These
      may be symptoms of serious skin reaction including drug reaction with eosinophilia
      and systemic symptoms (DRESS).
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      you have medical tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning feeling in the chest or stomach
      - indigestion
      - stomach upset or tenderness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chest pain
      - diarrhea
      - vomiting of blood or material that looks like coffee grounds
    subsections: []
