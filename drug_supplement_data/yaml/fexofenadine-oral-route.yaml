title: Fexofenadine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Allegra
    - type: paragraph
      text: Allegra ODT
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fexofenadine is an antihistamine. It is used to relieve the symptoms of
      hay fever (seasonal allergic rhinitis) and hives of the skin (chronic idiopathic
      urticaria) .
  - type: paragraph
    text: Antihistamines work by preventing the effects of a substance called histamine,
      which is produced by the body. Histamine can cause itching, sneezing, runny
      nose, and watery eyes. Also, in some people histamine can close up the bronchial
      tubes (air passages of the lungs) and make breathing difficult. Histamine can
      also cause some people to have hives, with severe itching of the skin .
  - type: paragraph
    text: This medicine is available only with your doctor's prescription .
  - type: paragraph
    text: Do not give any over-the-counter (OTC) cough and cold medicine to a baby
      or child under 4 years of age. Using these medicines in very young children
      might cause serious or possibly life-threatening side effects .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Suspension
    - Tablet, Disintegrating
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of fexofenadine in children below 6 months of age. Safety and
        efficacy have not been established .
    - type: paragraph
      text: Do not give any cough and cold medicine to a baby or child under 4 years
        of age. Using these medicines in very young children might cause serious or
        possibly life-threatening side effects .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatrics-specific
        problems that would limit the usefulness of fexofenadine in the elderly. However,
        elderly patients are more likely to have age-related kidney problems, which
        may require an adjustment in the dose for patients receiving fexofenadine
        .
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Levoketoconazole
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Apalutamide
      - Apomorphine
      - Berotralstat
      - Cabergoline
      - Capmatinib
      - Ceftobiprole Medocaril
      - Darolutamide
      - Elexacaftor
      - Eltrombopag
      - Epinephrine
      - Foslevodopa
      - Itraconazole
      - Lenacapavir
      - Leniolisib
      - Levodopa
      - Pitolisant
      - Simeprevir
      - Venetoclax
      - Vimseltinib
      - Voclosporin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aluminum Carbonate, Basic
      - Aluminum Hydroxide
      - Aluminum Phosphate
      - Dihydroxyaluminum Aminoacetate
      - Dihydroxyaluminum Sodium Carbonate
      - Magaldrate
      - Magnesium Carbonate
      - Magnesium Hydroxide
      - Magnesium Oxide
      - Magnesium Trisilicate
      - St John's Wort
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Apple Juice
      - Grapefruit Juice
      - Orange Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body .
    - type: list
      ordered: false
      items:
      - Phenylketonuria—Use with caution. The oral disintegrating tablets contain
        phenylalanine .
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: You should always take this medicine with water . Do not take it with juice
      such as grapefruit, orange, or apple juice .
  - type: paragraph
    text: You should NOT take antacids that contain aluminum or magnesium hydroxide
      within 15 minutes of taking this medicine. If you are uncertain about this,
      ask your doctor or pharmacist .
  - type: paragraph
    text: 'For patients using the oral disintegrating tablet form of this medicine:'
  - type: list
    ordered: false
    items:
    - Make sure your hands are dry.
    - Do not push the tablet through the foil backing of the package. Instead, gently
      peel back the foil backing and remove the tablet.
    - Immediately place the tablet on top of the tongue. Do not chew or break the
      tablet.
    - The tablet will dissolve in seconds, and you may swallow it with your saliva.
      You may drink a glass of water after the tablet has dissolved.
    - Always take this tablet on an empty stomach .
  - type: paragraph
    text: Shake the oral liquid well before using it. Measure the liquid with a marked
      measuring spoon, oral syringe, or medicine cup .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For symptoms of hay fever: For oral dosage form (capsules, tablets): Adults
        and children 12 years of age and older—60 milligrams (mg) two times a day,
        or 180 mg once a day. Children 6 to 11 years of age—30 mg two times a day.
        Children 4 to 6 years of age—Use and dose must be determined by your doctor
        . Children and infants up to 4 years of age—Use is not recommended . For oral
        dosage form (disintegrating tablets): Children 6 to 11 years of age—30 milligrams
        (mg) two times a day, on an empty stomach. Children 4 to 6 years of age—Use
        and dose must be determined by your doctor . Children and infants up to 4
        years of age—Use is not recommended . For oral dosage form (suspension): Children
        4 to 11 years of age—30 milligrams (mg) or 5 milliliters (mL) two times a
        day. Children younger than 4 years of age—Use and dose must be determined
        by your doctor .'
    - type: list
      ordered: false
