title: Potassium bicarbonate and citric acid (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Effer-K
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Potassium bicarbonate and citric acid is used to treat and prevent hypokalemia
      (low potassium in the blood).
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Effervescent
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of potassium bicarbonate and citric acid combination in the
        pediatric population. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of potassium bicarbonate and citric acid combination in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies suggest that this medication may alter milk production or composition.
        If an alternative to this medication is not prescribed, you should monitor
        the infant for side effects and adequate milk intake.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Aclidinium
      - Amantadine
      - Amiloride
      - Amitriptyline
      - Amoxapine
      - Anisotropine
      - Atropine
      - Belladonna
      - Benztropine
      - Biperiden
      - Bornaprine
      - Brompheniramine
      - Butylscopolamine
      - Canrenoate
      - Canrenone
      - Carbinoxamine
      - Carisoprodol
      - Chlorpheniramine
      - Chlorpromazine
      - Cimetropium
      - Clemastine
      - Clidinium
      - Clomipramine
      - Clozapine
      - Cyclobenzaprine
      - Cyclopentolate
      - Cyproheptadine
      - Darifenacin
      - Desipramine
      - Dicyclomine
      - Dimenhydrinate
      - Diphenhydramine
      - Doxepin
      - Emepronium
      - Eplerenone
      - Fesoterodine
      - Flavoxate
      - Fluphenazine
      - Glycopyrrolate
      - Glycopyrronium Tosylate
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aceclofenac
      - Acemetacin
      - Alacepril
      - Aliskiren
      - Amiloride
      - Amtolmetin Guacil
      - Aspirin
      - Azilsartan
      - Azilsartan Medoxomil
      - Benazepril
      - Bromfenac
      - Bufexamac
      - Candesartan
      - Canrenoate
      - Captopril
      - Celecoxib
      - Choline Salicylate
      - Cilazapril
      - Clonixin
      - Delapril
      - Dexibuprofen
      - Dexketoprofen
      - Diclofenac
      - Diflunisal
      - Dipyrone
      - Droxicam
      - Enalapril
      - Enalaprilat
      - Eprosartan
      - Etodolac
      - Etofenamate
      - Etoricoxib
      - Felbinac
      - Fenoprofen
      - Fepradinol
      - Feprazone
      - Floctafenine
      - Flufenamic Acid
      - Flurbiprofen
      - Fosinopril
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Licorice
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes, uncontrolled or
      - Electrolyte imbalance (eg, metabolic acidosis) or
      - Kidney disease (eg, chronic renal failure) or
      - Stomach or bowel problems (eg, blockage, ulcer)—Use with caution. May increase
        risk for serious side effects.
    - type: list
      ordered: false
      items:
      - Heart disease (eg, heart block) or
      - Nerve or muscle problems (eg, familial periodic paralysis, myotonia congenita)—Use
        with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Hyperkalemia (high potassium in the blood)—Should not be used in patients
        with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: Take this medicine with food or right away after a meal. You may sip the
      medicine slowly for 5 to 10 minutes.
  - type: paragraph
    text: 'To use Effer-K® 10 mEq tablets :'
  - type: list
    ordered: false
    items:
    - 'Flavored (Cherry Vanilla): Dissolve the tablet completely in 2 to 3 ounces
      (58 to 85 ml) of cold or ice water.'
    - 'Unflavored: Dissolve the tablet completely in 2 to 3 ounces (58 to 85 ml) of
      cold juice.'
  - type: paragraph
    text: 'To use Effer-K® 20 mEq tablets :'
  - type: list
    ordered: false
    items:
    - 'Flavored (Orange Cream): Dissolve the tablet completely in 3 to 4 ounces (85
      to 115 ml) of cold or ice water.'
    - 'Unflavored: Dissolve the tablet completely in 3 to 4 ounces (85 to 115 ml)
      of cold juice.'
  - type: paragraph
    text: 'To use Effer-K® 25 mEq tablets :'
  - type: list
    ordered: false
    items:
    - 'Flavored (Orange, Lemon Citrus, or Cherry Berry): Dissolve the tablet completely
      in 4 ounces of cold or ice water.'
    - 'Unflavored: Dissolve the tablet completely in 12 to 16 ounces of cold juice.'
  - type: paragraph
    text: Tell your doctor if you are on a low-salt diet or if you are also using
      salt substitutes.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (effervescent tablet): For treatment and prevention
        of hypokalemia: Adults—One tablet 1 to 4 times a day. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment and prevention of hypokalemia: Adults—One tablet 1 to 4 times
        a day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—One tablet 1 to 4 times a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the tablet in the foil pouch until you are ready to use it.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      see if the medicine is working properly and to decide if you should continue
      to take it. Blood, urine, and other laboratory tests may be needed to check
      for unwanted effects.
  - type: paragraph
    text: This medicine may cause hyperkalemia. Check with your doctor right away
      if you have confusion, irregular heartbeat, nausea or vomiting, nervousness,
      numbness or tingling in the hands, feet, or lips, stomach pain, trouble breathing,
      or weakness or heaviness of the legs.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - diarrhea
      - irregular heartbeat
      - nausea or vomiting
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - stomach pain
      - trouble breathing
      - weakness or heaviness of the legs
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody or black, tarry stools
      - constipation
      - vomiting of blood or material that looks like coffee grounds
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Most common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Stomach discomfort
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
