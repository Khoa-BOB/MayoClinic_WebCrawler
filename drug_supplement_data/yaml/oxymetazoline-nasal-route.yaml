      - Protriptyline
      - Rasagiline
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Dryness in nose or
      - High blood pressure or
      - Tachycardia (fast heart rate) or
      - Trouble urinating from an enlarged prostate—May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: 'To use the nose drops:'
  - type: list
    ordered: false
    items:
    - Blow your nose gently. Tilt the head back while standing or sitting up, or lie
      down on a bed and hang the head over the side. Place the drops into each nostril
      and keep the head tilted back for a few minutes to allow the medicine to spread
      throughout the nose.
    - Rinse the dropper with hot water and dry with a clean tissue. Replace the cap
      right after use.
    - To avoid spreading a cold or infection, do not use the container for more than
      one person and throw the container away after your cold is better.
  - type: paragraph
    text: 'To use the nose spray:'
  - type: list
    ordered: false
    items:
    - Blow your nose gently. With the head upright, spray the medicine into each nostril.
      Sniff briskly while squeezing the bottle quickly and firmly. If needed, blow
      the nose gently again and repeat the spray process until the total dose is used.
    - Rinse the tip of the spray bottle with hot water, taking care not to suck water
      into the bottle, and dry with a clean tissue. Replace the cap right after use.
    - To avoid spreading a cold or infection, do not use the container for more than
      one person and throw the container away after your cold is better.
  - type: paragraph
    text: Use this medicine only as directed. Do not use more of it, do not use it
      more often, and do not use it for longer than 3 days without checking with your
      doctor. To do so may make your runny or stuffy nose worse and may increase the
      chance of side effects.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For nasal dosage form (nose drops or spray): For nasal congestion or stuffiness:
        Adults and children 6 years of age and older—Use 2 or 3 drops or sprays of
        0.05% solution in each nostril every ten to twelve hours. Do not use more
        than two times in twenty four hours. Children up to 6 years of age—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For nasal congestion or stuffiness: Adults and children 6 years of age and
        older—Use 2 or 3 drops or sprays of 0.05% solution in each nostril every ten
        to twelve hours. Do not use more than two times in twenty four hours. Children
        up to 6 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 6 years of age and older—Use 2 or 3 drops or sprays of
        0.05% solution in each nostril every ten to twelve hours. Do not use more
        than two times in twenty four hours.
      - Children up to 6 years of age—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  - type: list
    ordered: false
    items:
    - Blurred vision
    - fast, irregular, or pounding heartbeat
    - headache, dizziness, drowsiness, or lightheadedness
    - high blood pressure
    - increase in runny or stuffy nose
    - nervousness
    - trembling
    - trouble in sleeping
    - weakness
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  - type: list
    ordered: false
    items:
    - Burning, dryness, or stinging inside of nose
    - sneezing
  - type: paragraph
    text: Other side effects not listed may also occur in some patients. If you notice
      any other effects, check with your healthcare professional.
  - type: paragraph
    text: Call your doctor for medical advice about side effects. You may report side
      effects to the FDA at 1-800-FDA-1088.
