title: Sargramostim (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Leukine
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Sargramostim injection is used to help the bone marrow make new white blood
      cells. It is a synthetic (man-made) form of a substance that is naturally produced
      in your body called a colony stimulating factor.
  - type: paragraph
    text: When certain cancer medicines are used to fight cancer cells, they also
      affect the white blood cells that fight infections. Sargramostim is used to
      prevent or reduce the risk of infection while you are being treated with cancer
      medicines. It is also used to help the bone marrow recover faster after a bone
      marrow transplant or after a peripheral blood progenitor cell collection in
      cancer patients having stem cell transplant. This medicine is also used to improve
      survival in cancer patients who have been exposed to radiation.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of sargramostim injection in children younger than 2 years
        of age. Safety and efficacy have not been established, except for use in children
        exposed to radiation.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of sargramostim injection in the
        elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alclometasone
      - Aldosterone
      - Amcinonide
      - Beclomethasone
      - Betamethasone
      - Budesonide
      - Ciclesonide
      - Clobetasol
      - Clobetasone
      - Clocortolone
      - Cortisone
      - Deflazacort
      - Desonide
      - Desoximetasone
      - Dexamethasone
      - Diflorasone
      - Diflucortolone
      - Difluprednate
      - Flucloronide
      - Fludrocortisone
      - Flumethasone
      - Flunisolide
      - Fluocinolone
      - Fluocinonide
      - Fluocortin
      - Fluocortolone
      - Fluorometholone
      - Flurandrenolide
      - Fluticasone
      - Halcinonide
      - Halobetasol
      - Hydrocortisone
      - Loteprednol
      - Medrysone
      - Methylprednisolone
      - Mometasone
      - Paramethasone
      - Prednicarbate
      - Prednisolone
      - Prednisone
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Edema (fluid retention) or
      - Heart disease or
      - Heart rhythm problems, history of or
      - Hypoxia (decreased oxygen in the tissues) or
      - Kidney disease or
      - Liver disease or
      - Lung disease or breathing problems or
      - Pericardial effusion (fluid around the heart) or
      - Pleural effusion (fluid around the lungs)—Use with caution. May make these
        conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional may give you this medicine.
      It is given through a needle placed into one of your veins or as a shot under
      your skin (usually in the stomach, thigh, or outer part of the upper arm). .
  - type: paragraph
    text: You may be taught how to give this medicine at home. Make sure you understand
      all of the instructions before giving yourself an injection. Do not use more
      medicine or use it more often than your doctor tells you to.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor or pharmacist if you have any
      questions.
  - type: paragraph
    text: This medicine is available in a powder form. You must mix the powder with
      another liquid before using it.
  - type: paragraph
    text: 'To use this medicine as a shot under your skin:'
  - type: list
    ordered: false
    items:
    - You will be shown the body areas where this shot can be given. Use a different
      body area each time you give yourself a shot. Keep track of where you give each
      shot to make sure you rotate body areas. This will help prevent skin problems
      from the injections. Do not inject into areas where the skin is tender, bruised,
      red, hard, or has scars or stretch marks.
    - Check the mixed liquid inside the vial. It should be clear and colorless. Do
      not use it if it is cloudy, discolored, or has particles in it. Do not shake.
    - Use a new needle and syringe each time you inject your medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form (powder for solution): To increase white blood
        cell count: Adults and children 2 years of age and older—Dose is based on
        body weight and must be determined by your doctor. The dose is usually 250
        micrograms per square meter (mcg/m2) injected under the skin once a day. Your
        doctor may adjust your dose as needed. Children younger than 2 years of age—Use
        and dose must be determined by your doctor. To increase survival in patients
        who have been exposed to radiation: Adults and children weighing more than
        40 kilograms (kg)—Dose is based on body weight and must be determined by your
        doctor. The dose is usually 7 micrograms per kilogram (mcg/kg) injected under
        the skin once a day. Children weighing 15 kg to 40 kg—Dose is based on body
        weight and must be determined by your doctor. The dose is usually 10 mcg/kg
        injected under the skin once a day. Children weighing less than 15 kg—Dose
        is based on body weight and must be determined by your doctor. The dose is
        usually 12 mcg/kg injected under the skin once a day.'
    - type: list
      ordered: false
      items:
      - 'To increase white blood cell count: Adults and children 2 years of age and
        older—Dose is based on body weight and must be determined by your doctor.
        The dose is usually 250 micrograms per square meter (mcg/m2) injected under
        the skin once a day. Your doctor may adjust your dose as needed. Children
        younger than 2 years of age—Use and dose must be determined by your doctor.'
      - 'To increase survival in patients who have been exposed to radiation: Adults
        and children weighing more than 40 kilograms (kg)—Dose is based on body weight
        and must be determined by your doctor. The dose is usually 7 micrograms per
        kilogram (mcg/kg) injected under the skin once a day. Children weighing 15
        kg to 40 kg—Dose is based on body weight and must be determined by your doctor.
        The dose is usually 10 mcg/kg injected under the skin once a day. Children
        weighing less than 15 kg—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 12 mcg/kg injected under the skin once
        a day.'
    - type: list
      ordered: false
      items:
      - Adults and children 2 years of age and older—Dose is based on body weight
        and must be determined by your doctor. The dose is usually 250 micrograms
        per square meter (mcg/m2) injected under the skin once a day. Your doctor
        may adjust your dose as needed.
      - Children younger than 2 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - Adults and children weighing more than 40 kilograms (kg)—Dose is based on
        body weight and must be determined by your doctor. The dose is usually 7 micrograms
