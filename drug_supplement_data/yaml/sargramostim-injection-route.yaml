    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: This medicine needs to be given on a fixed schedule. If you miss a dose
        or forget to use your medicine, call your doctor or pharmacist for instructions.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Keep this medicine in its original container. The mixed liquid has different
        storage directions based on what kind of liquid it was mixed with.
    - type: paragraph
      text: Throw away used needles in a hard, closed container where the needles
        cannot poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you and your child's progress
      at regular visits to make sure that this medicine is working properly. Blood
      tests are needed to check for unwanted effects.
  - type: paragraph
    text: Tell your doctor about all the other medicines you are using, especially
      if you are being treated for cancer. This medicine should not be given at the
      same time as chemotherapy (cancer medicines) or radiation treatment or within
      24 hours before or after you receive your cancer treatment.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you or your child have a rash, itching, swelling of
      the face, tongue, or throat, trouble breathing, or chest pain after you receive
      the medicine.
  - type: paragraph
    text: This medicine may cause infusion-related reactions, which can be life-threatening
      and requires immediate medical attention. Tell your doctor right away if you
      start to have a fever, chills or shaking, dizziness, trouble breathing, itching
      or rash, lightheadedness or fainting after receiving this medicine.
  - type: paragraph
    text: This medicine may cause a condition called capillary leak syndrome. It can
      cause fluid to leak from the blood vessels into your body's tissues. Call your
      doctor right away if you have swelling or puffiness, urinating less often, trouble
      breathing, feeling of fullness, dizziness, or feeling faint.
  - type: paragraph
    text: This medicine may cause heart rhythm problems. Tell your doctor right away
      if you or your child gets dizzy or lightheaded, have fast or irregular heart
      beats, or feels like fainting.
  - type: paragraph
    text: This medicine may increase your risk of having cancer and the number of
      white blood cells in the blood. Talk to your doctor if you have concerns.
  - type: paragraph
    text: This medicine contains benzyl alcohol, which can be harmful to infants and
      unborn babies.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - blood in the eye
      - bloody nose
      - blurred vision
      - body aches or pain
      - bone pain
      - chest pain or tightness
      - cloudy urine
      - cough
      - decrease in urine output or decrease in urine-concentrating ability
      - difficult or labored breathing
      - drowsiness
      - dry mouth
      - dryness or soreness of the throat
      - eye pain
      - fast, pounding, or irregular heartbeat or pulse
      - fever
      - flushed, dry skin
      - fruit-like breath odor
      - hoarseness
      - increased hunger
      - increased thirst
      - increased urination
      - irregular heartbeat
      - large amount of cholesterol in the blood
      - loss of appetite
      - mood or mental changes
      - muscle spasms
      - nausea
      - rapid weight gain
      - redness in whites of eyes
      - stomach pain
      - stuffy or runny nose
      - sweating
      - tender, swollen glands in the neck
      - tingling of the hands or feet
      - trouble with swallowing
      - trembling
      - twitching
      - unusual tiredness or weakness
      - unusual weight gain or loss
      - voice changes
      - vomiting
      - vomiting of blood or material that looks like coffee grounds
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - general feeling of illness
      - headache
      - pain in the chest, groin, or legs, especially the calves
      - severe, sudden headache
      - slurred speech
      - sudden loss of coordination
      - sudden, severe weakness or numbness in the arm or leg
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - difficulty in moving
      - fear or nervousness
      - itching skin
      - lack or loss of strength
      - muscle pain or stiffness
      - pain in the joints
      - trouble sleeping
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of skin, feeling of
        pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - feeling of warmth
      - redness of the face, neck, arms, and occasionally, upper chest
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
