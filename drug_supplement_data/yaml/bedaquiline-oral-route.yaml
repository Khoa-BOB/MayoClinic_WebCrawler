title: Bedaquiline (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Sirturo
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Bedaquiline is used in combination with other medicines to treat pulmonary
      tuberculosis of the lungs caused by Mycobacterium tuberculosis that is resistant
      to other medicines (eg, rifampin, isoniazid). Bedaquiline prevents the growth
      of tuberculosis in the body.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of bedaquiline in children 2 years
        of age and older and weighing at least 8 kilograms (kg). Safety and efficacy
        have not been established in children younger than 2 years of age or weighing
        less than 8 kg.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of bedaquiline
        have not been performed in the geriatric population, no geriatric-specific
        problems have been documented to date.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Fluconazole
      - Ketoconazole
      - Levoketoconazole
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Adagrasib
      - Alfuzosin
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amprenavir
      - Anagrelide
      - Apalutamide
      - Apomorphine
      - Aprepitant
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Artemether
      - Asenapine
      - Astemizole
      - Atazanavir
      - Avacopan
      - Azithromycin
      - Berotralstat
      - Boceprevir
      - Bosentan
      - Buprenorphine
      - Buserelin
      - Capivasertib
      - Carbamazepine
      - Cenobamate
      - Ceritinib
      - Chloroquine
      - Chlorpromazine
      - Chlorzoxazone
      - Cilostazol
      - Cimetidine
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart failure, history of or
      - Heart rhythm problems (eg, slow heart rate, long QT syndrome), history of
        or
      - Hypocalcemia (low calcium in the blood) or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood) or
      - Hypothyroidism (underactive thyroid), history of—Use with caution. May cause
        side effects to become worse.
    - type: list
      ordered: false
      items:
      - HIV infection—Safety and efficacy have not been established to treat MDR-TB
        in patients with this condition.
    - type: list
      ordered: false
      items:
      - Infections caused by non-tuberculous mycobacteria or
      - Other types of tuberculosis (eg, latent, extrapulmonary, or drug-sensitive
        TB)—Should not be use to treat patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe (eg, patients receiving dialysis)—Use with caution.
        The effects may be increased because of slower removal of the medicine from
        the body.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. May make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: Bedaquiline is given by directly observed therapy (DOT). It must always
      be taken with at least 3 other medicines for TB . Carefully follow your doctor's
      instructions.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: It is best to take this medicine with food.
  - type: paragraph
    text: Swallow the 100-mg tablet whole with water. Do not crush, break, or chew
      it. Take this medicine with food.
  - type: paragraph
    text: 'If you can swallow the 20-mg tablet whole:'
  - type: list
    ordered: false
    items:
    - Swallow the tablet whole with water.
    - You may also split it in half at the score line (middle of the tablet) and swallow
      each half-tablets (10 mg each) with water.
  - type: paragraph
    text: 'If you cannot swallow the 20-mg tablet whole:'
  - type: list
    ordered: false
    items:
    - Mix a maximum of 5 tablets into 1 teaspoon (5 milliliters) of water in a drinking
      cup. Swallow the mixture right away. To help with taking the mixture, you may
      add at least 1 more teaspoon (5 mL) of beverage (eg, water, milk products, carbonated
      beverage, or apple, orange, or cranberry juice) or soft food (eg, yogurt, applesauce,
      mashed banana, or porridge) and mix, then swallow it right away. Make sure no
      medicine is left in the drinking cup, rinse with beverage or soft food and swallow
      it right away. If you need more than 5 tablets to get your total dose, repeat
      these steps until you reach the desired dose.
    - Crush the tablets and mix with soft food (eg, yogurt, applesauce, mashed banana,
      or porridge), then swallow the mixture right away. Make sure no medicine is
      left in the container, add more soft food and swallow it right away.
  - type: list
    ordered: false
    items:
    - Swallow the mixture right away.
    - To help with taking the mixture, you may add at least 1 more teaspoon (5 mL)
      of beverage (eg, water, milk products, carbonated beverage, or apple, orange,
      or cranberry juice) or soft food (eg, yogurt, applesauce, mashed banana, or
      porridge) and mix, then swallow it right away.
    - Make sure no medicine is left in the drinking cup, rinse with beverage or soft
      food and swallow it right away.
    - If you need more than 5 tablets to get your total dose, repeat these steps until
      you reach the desired dose.
  - type: paragraph
    text: The 20-mg tablet may also be given through a feeding tube by your doctor
      or nurse.
  - type: paragraph
    text: This medicine is taken for a total of 24 weeks. On the first 2 weeks, you
      will take the medicine every day. On the 3rd to 24th week, you have to take
      it at the same time on the same 3 days (eg, Monday, Wednesday, and Friday) at
      least 48 hours apart each week.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you feel
      better after the first few doses. Your infection may not clear up if you stop
      using the medicine too soon.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of multi-drug resistant tuberculosis:
        Adults and children 2 years of age and older weighing at least 30 kilograms
        (kg)— Weeks 1 and 2: 400 milligrams (mg) (4 tablets of 100 mg or 20 tablets
        of 20 mg) once a day. Weeks 3 to 24: 200 mg (2 tablets of 100 mg or 10 tablets
        of 20 mg) 3 times per week (with at least 48 hours between doses), for a total
        of 600 mg per week. Children 2 years of age and older weighing less than 30
        kg—Dose is based on body weight and must be determined by your doctor: Weighing
        15 kg to less than 30 kg— Weeks 1 and 2: 200 mg (2 tablets of 100 mg or 10
        tablets of 20 mg) once a day. Weeks 3 to 24: 100 mg (1 tablet of 100 mg or
        5 tablets of 20 mg) 3 times per week (with at least 48 hours between doses),
        for a total of 300 mg per week. Weighing 10 kg to less than 15 kg— Weeks 1
        and 2: 120 mg (6 tablets of 20 mg) once a day. Weeks 3 to 24: 60 mg (3 tablets
        of 20 mg) 3 times per week (with at least 48 hours between doses), for a total
        of 300 mg per week. Weighing 8 kg to less than 10 kg— Weeks 1 and 2: 80 mg
        (4 tablets of 20 mg) once a day. Weeks 3 to 24: 40 mg (2 tablets of 20 mg)
        3 times per week (with at least 48 hours between doses), for a total of 300
        mg per week. Children younger than 2 years of age or weighing less than 8
        kg—Use and dose must be determined by your doctor.'
