title: Ivermectin (topical application route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Sklice
    - type: paragraph
      text: Soolantra
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ivermectin 0.5% topical lotion is used to treat head lice infestations.
  - type: paragraph
    text: Ivermectin 1% topical cream is used to treat lesions of rosacea. Rosacea
      is a skin disease that causes redness and pimples on your nose, cheeks, chin,
      and forehead.
  - type: paragraph
    text: This medicine is available over-the-counter.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Cream
    - Lotion
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of ivermectin topical lotion in children
        6 months of age and older. However, use is not recommended in infants younger
        than 6 months of age.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of ivermectin topical cream in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of ivermectin topical lotion or cream
        in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Skin problems or sensitivities—Use with caution.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine exactly as directed by your doctor . Do not use more of
      it, do not use it more often, and do not use it for a longer time than your
      doctor tells you. Do not change your treatment without checking first with your
      doctor.
  - type: paragraph
    text: This medicine comes with a patient information leaflet and patient instructions.
      Read and follow these instructions carefully. Ask your doctor or pharmacist
      if you have any questions.
  - type: paragraph
    text: 'To use Sklice® topical lotion :'
  - type: list
    ordered: false
    items:
    - Use Sklice® on the hair and scalp only. Keep the medicine out of your eyes,
      nose, mouth, and vagina. Keep your eyes tightly closed and protect them with
      a washcloth or towel. If the medicine gets in your eyes, rinse them well with
      water.
    - Wash your hands before and after using this medicine.
    - Apply the medicine directly to the scalp and dry hair closest to the scalp and
      then apply outwards to the ends of your hair.
    - Completely cover your scalp and hair (up to 1 tube). Leave the medicine on the
      hair and scalp for 10 minutes.
    - After 10 minutes, rinse your hair with warm water and dry with a clean towel.
      Comb hair with a fine-toothed comb to remove any nits (eggs) or nit shells.
      They look like small white dots.
    - If live lice are seen 7 days after using this medicine, tell your doctor right
      away.
    - Do not use this medicine again without talking first with your doctor.
    - Children will need an adult to apply the medicine for them.
    - If you are breastfeeding, do not put the lotion on your breast.
    - Throw away any unused medicine left in the tube after each use.
    - It is best to wait for 24 hours before applying shampoo on the treated hair
      and scalp areas. Do not use cosmetics and other hair products on these areas
      as well.
  - type: paragraph
    text: 'To use Soolantra® topical cream :'
  - type: list
    ordered: false
    items:
    - This medicine is for use on the skin only. Do not get it in your eyes, mouth,
      or vagina. Do not use it on skin areas that have cuts or scrapes. If it does
      get on these areas, rinse it off right away.
    - Wash your hands before and after using this medicine.
    - Use a pea-sized amount for each affected area of the face (forehead, chin, nose,
      cheeks).
    - Spread a thin layer and avoid the eyes and lips.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (cream): For rosacea: Adults—Apply to the affected
        area(s) of the face once a day. Children—Use and dose must be determined by
        your doctor.'
      - 'For topical dosage form (lotion): For head lice: Adults and children 6 months
        of age and older—Apply directly to dry hair and scalp one time only. Children
        younger than 6 months of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For rosacea: Adults—Apply to the affected area(s) of the face once a day.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply to the affected area(s) of the face once a day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For head lice: Adults and children 6 months of age and older—Apply directly
        to dry hair and scalp one time only. Children younger than 6 months of age—Use
        is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children 6 months of age and older—Apply directly to dry hair and
        scalp one time only.
      - Children younger than 6 months of age—Use is not recommended.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Do not freeze Sklice® topical lotion .
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: 'For patients using Sklice® :'
  - type: list
    ordered: false
    items:
    - Head lice can easily spread from one person to another by direct contact with
      clothing, hats, bandannas, scarves, bedding, towels, washcloths, ribbons, hair
      bands, helmets, hairbrushes and combs, or hairs from infected persons. All members
      of your household should be checked for head lice and should receive treatment
      if they are found to be infected. If you have any questions about this, check
      with your doctor.
    - 'To prevent the spread of lice: Dry-clean or wash your clothes, bedding, and
      personal items (including washcloths, towels, hats, scarves, combs, brushes,
      hairpieces, and wigs) in hot, soapy water. Tumble dry in a hot dryer for 20
      minutes.'
    - Call your doctor right away if you have trouble breathing, eye irritation, skin
      or scalp irritation, or rash.
    - Do not use this medicine for a hair or scalp problem that has not been checked
      by your doctor.
    - Do not use this medicine to treat lice in the eyebrows or eyelashes. If you
      have lice in these areas, check with your doctor.
  - type: paragraph
    text: 'For patients using Soolantra® :'
  - type: list
    ordered: false
    items:
    - If your skin problem does not improve within a few days or if it becomes worse,
      check with your doctor.
    - Do not use this medicine for a skin problem that has not been checked by your
      doctor.
    - If you have any questions about this, check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin rash
      - trouble breathing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, itching, redness, or stinging of the skin
      - burning, dry, or itching eyes
      - dandruff
      - discharge or excessive tearing
      - dry skin
      - redness, pain, or swelling of the eye, eyelid, or inner lining of the eyelid
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
