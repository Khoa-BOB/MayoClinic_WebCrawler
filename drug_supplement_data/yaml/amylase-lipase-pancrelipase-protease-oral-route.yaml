      - 'For oral dosage form (Pertzye® delayed-release capsules): Adults and children
        4 years of age and older—500 lipase units per kilograms (kg) per meal. Your
        doctor may adjust your dose as needed and tolerated. Children 12 months to
        younger than 4 years of age—1000 lipase units per kg per meal. Your doctor
        may adjust your dose as needed and tolerated. Children from birth to 12 months
        of age—4000 lipase units per 120 milliliters (mL) of formula or per breastfeeding.'
      - 'For oral dosage form (tablets): Adults—At first, 500 lipase units per kilograms
        (kg) per meal. Your doctor may adjust your dose as needed and tolerated. Children—Use
        and dose must be determined by your doctor.'
