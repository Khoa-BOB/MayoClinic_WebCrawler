    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: You may store repacked Zenpep® for up to 6 months.
    - type: paragraph
      text: Throw away unused Pertzye® mixture.
    - type: paragraph
      text: Do not eat or throw away the drying agent (desiccant) in your medicine
        bottle. The drying agent will protect your medicine from moisture.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause a serious bowel disorder called fibrosing colonopathy,
      especially if taken at a high dose for a long time in children with cystic fibrosis.
      Check with your doctor right away if you have bloating, constipation, diarrhea,
      nausea, stomach pain, or vomiting.
  - type: paragraph
    text: This medicine may increase the uric acid levels in the blood (hyperuricemia).
      Check with your doctor right away if you have joint pain, stiffness, or swelling,
      lower back, side, or stomach pain, or swelling of the feet or lower legs.
  - type: paragraph
    text: This medicine is made from the pancreas of pigs. Some pigs organs have transmitted
      certain viruses to people who have received them, although the risk is low.
      All are tested for viruses to keep the transmission risk low. Talk with your
      doctor if you have concerns about this risk.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and asthma, which can be life-threatening and require immediate medical attention.
      Tell your doctor right away if you have a rash, itching, hoarseness, or trouble
      breathing or swallowing after using this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blurred vision
      - chills
      - cold sweats
      - coma
      - confusion
      - cool, pale skin
      - depression
      - dizziness
      - dry mouth
      - fast heartbeat
      - increased hunger
      - increased thirst
      - increased urination
      - nausea
      - nervousness
      - nightmares
      - seizures
      - shakiness
      - slurred speech
      - stomach pain
      - sweating
      - trouble breathing
      - unexplained weight loss
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - cold flu-like symptoms
      - cough or hoarseness
      - fever
      - indigestion
      - pale skin
      - rapid weight gain
      - stomach bloating
      - tingling of the hands or feet
      - unusual bleeding or bruising
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - constipation
      - diarrhea
      - difficulty swallowing
      - excess air or gas in the stomach or intestines
      - full feeling
      - hives, itching, skin rash
      - inflammation of the mouth
      - passing gas
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - burning or itching around the anus
      - headache
      - heartburn
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty in moving
      - joint pain or swelling
      - muscle aches, cramps, pains, or stiffness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
