title: Amylase/lipase/pancrelipase/protease (oral route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Pancrelipase is used to treat patients who cannot digest food normally because
      their pancreas does not make enough enzymes (exocrine pancreatic insufficiency).
      Pancrelipase tablet is used in combination with a proton pump inhibitor (PPI)
      in patients who have long-term swelling of the pancreas (chronic pancreatitis)
      or who have had some or all of their pancreas removed (pancreatectomy).
  - type: paragraph
    text: Pancrelipase contains a mixture of digestive enzymes (eg, lipases, proteases,
      and amylases) needed for the digestion of proteins, starches, and fats.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of pancrelipase delayed-release capsules
        in children. Safety and efficacy have been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of pancrelipase tablets in the pediatric population. This medicine
        may cause unwanted effects (eg, weight gain, malnutrition) in children. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of pancrelipase in the elderly.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to pork products or
      - Fibrosing colonopathy (scarring or thickening of your bowel wall), history
        of or
      - Gout or
      - Hyperuricemia (high uric acid levels in the blood) or
      - Intestinal blockage, history of or
      - Kidney disease or
      - Lactose intolerant—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine should come with a Medication Guide and patient instructions.
      Read and follow these instructions carefully. Ask your doctor or pharmacist
      if you have any questions.
  - type: paragraph
    text: Take this medicine with food.
  - type: paragraph
    text: Swallow the capsule or tablet whole with enough fluid (eg, water or juice)
      to prevent irritation of the mouth. Do not crush or chew it.
  - type: paragraph
    text: 'For patients taking the tablets :'
  - type: list
    ordered: false
    items:
    - Viokace™ tablet is used in combination with certain medicines for stomach ulcer
      called proton pump inhibitors (eg, esomeprazole, lansoprazole, omeprazole, Nexium®,
      Prevacid®, Prilosec®).
    - Swallow the tablets quickly with some liquid, without chewing, to avoid mouth
      irritation.
  - type: paragraph
    text: 'For patients taking the delayed-release capsules :'
  - type: list
    ordered: false
    items:
    - Swallow the capsule whole.
    - Do not crush, break, or chew before swallowing. Do not hold the capsule in your
      mouth.
    - When given to adults or children who can not swallow the capsule, the capsule
      may be opened and sprinkled onto a small amount (about 10 mL or less) of soft
      acidic food (eg, applesauce, bananas, or plain Greek yogurt). Mix the contents
      evenly. Do not crush the capsule contents while mixing. This mixture must be
      swallowed immediately and followed with a glass of water or juice. This will
      ensure complete swallowing of the contents of the capsule and avoid mouth irritation.
    - When given to infants, the contents of the capsule may be put directly into
      the infant's mouth or mixed with a small amount (about 10 mL or less) of soft
      acidic food (eg, applesauce, pureed bananas, or pears), followed by 4 ounces
      (120 mL) of formula or breastfeeding. Do not mix the contents of the capsule
      directly into a bottle of breast milk or formula. This could reduce the effect
      of the medicine.
    - Pertzye® capsules may also be given through a gastrostomy tube with a diameter
      of 14 French or larger. Mix the contents of the capsule with soft food (eg,
      applesauce). Remove the plunger and carefully spoon the mixture into the syringe.
      Replace the plunger partially back. Connect the syringe into the tube feeding
      port and inject the medicine for 10 to 12 seconds. Flush the tube with 10 mL
      of water to rinse all of the medicine into the stomach.
    - Throw away any unused portions of the mixture. Do not save for later use.
  - type: list
    ordered: false
    items:
    - Mix the contents of the capsule with soft food (eg, applesauce).
    - Remove the plunger and carefully spoon the mixture into the syringe. Replace
      the plunger partially back.
    - Connect the syringe into the tube feeding port and inject the medicine for 10
      to 12 seconds.
    - Flush the tube with 10 mL of water to rinse all of the medicine into the stomach.
  - type: paragraph
    text: Do not change the brands or dosage forms of pancrelipase without first checking
      with your doctor. Different products may not work in the same way. If you refill
      your medicine and it looks different, check with your pharmacist.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For the treatment patients who cannot digest food normally: For oral dosage
        form (Creon® and Zenpep® delayed-release capsules): Adults and children 4
        years of age and older—500 lipase units per kilograms (kg) per meal. Your
        doctor may adjust your dose as needed and tolerated. Children 12 months to
        younger than 4 years of age—1000 lipase units per kg per meal. Your doctor
        may adjust your dose as needed and tolerated. Children from birth to 12 months
        of age—3000 lipase units per 120 milliliters (mL) of formula or per breastfeeding.
        For oral dosage form (Pancreaze® delayed-release capsules): Adults and children
        4 years of age and older—500 lipase units per kilograms (kg) per meal. Your
        doctor may adjust your dose as needed and tolerated. Children 12 months to
        younger than 4 years of age—1000 lipase units per kg per meal. Your doctor
        may adjust your dose as needed and tolerated. Children from birth to 12 months
        of age—2600 lipase units per 120 milliliters (mL) of formula or per breastfeeding.
        For oral dosage form (Pertzye® delayed-release capsules): Adults and children
        4 years of age and older—500 lipase units per kilograms (kg) per meal. Your
        doctor may adjust your dose as needed and tolerated. Children 12 months to
        younger than 4 years of age—1000 lipase units per kg per meal. Your doctor
        may adjust your dose as needed and tolerated. Children from birth to 12 months
        of age—4000 lipase units per 120 milliliters (mL) of formula or per breastfeeding.
        For oral dosage form (tablets): Adults—At first, 500 lipase units per kilograms
        (kg) per meal. Your doctor may adjust your dose as needed and tolerated. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (Creon® and Zenpep® delayed-release capsules): Adults
        and children 4 years of age and older—500 lipase units per kilograms (kg)
        per meal. Your doctor may adjust your dose as needed and tolerated. Children
        12 months to younger than 4 years of age—1000 lipase units per kg per meal.
        Your doctor may adjust your dose as needed and tolerated. Children from birth
