title: Sirolimus protein-bound (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Fyarro
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Sirolimus protein-bound injection is used to treat perivascular epithelioid
      cell tumor (PEComa) that has spread or grown and cannot be removed by surgery.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of sirolimus protein-bound injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of sirolimus protein-bound injection
        in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Amiodarone
      - Amprenavir
      - Apalutamide
      - Aprepitant
      - Atazanavir
      - Boceprevir
      - Carbamazepine
      - Carvedilol
      - Cholera Vaccine
      - Cimetidine
      - Ciprofloxacin
      - Clarithromycin
      - Cobicistat
      - Conivaptan
      - Crizotinib
      - Cyclosporine
      - Darunavir
      - Delavirdine
      - Diltiazem
      - Dronedarone
      - Ebola Zaire Vaccine, Live
      - Elagolix
      - Enzalutamide
      - Erythromycin
      - Flibanserin
      - Fluconazole
      - Fluvoxamine
      - Fosamprenavir
      - Fosaprepitant
      - Fosnetupitant
      - Fosphenytoin
      - Idelalisib
      - Imatinib
      - Indinavir
      - Influenza Virus Vaccine, Live
      - Itraconazole
      - Ivacaftor
      - Ketoconazole
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Liver disease, mild to moderate—Use with caution. May increase the risk of
        serious side effects.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use is not recommended in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      It is given through a needle placed into one of your veins. It must be given
      slowly, so the needle will have to remain in place for at least 30 minutes.
      The infusion will be given on Days 1 and 8 of each 21-day cycle.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are receiving
      this medicine.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: Receiving this medicine while you are pregnant can harm your unborn baby.
      If you are a woman who can get pregnant, your doctor may do tests to make sure
      you are not pregnant before starting treatment. Use an effective form of birth
      control to keep from getting pregnant during treatment with this medicine and
      for at least 12 weeks after the last dose. Males with female partners must use
      effective birth control during treatment and for at least 12 weeks after the
      last dose of this medicine. If you think you have become pregnant while receiving
      the medicine, tell your doctor right away.
  - type: paragraph
    text: Stomatitis (swelling or inflammation of the mouth) may occur during treatment
      with this medicine. Tell your doctor right away if you have sores, ulcers, or
      white spots on the lips or tongue or inside the mouth.
  - type: paragraph
    text: This medicine lowers the number of some types of blood cells in your body.
      Because of this, you may bleed or get infections more easily. To help with these
      problems, avoid being near people who are sick or have infections. Wash your
      hands often. Stay away from rough sports or other situations where you could
      be bruised, cut, or injured. Brush and floss your teeth gently. Be careful when
      using sharp objects, including razors and fingernail clippers.
  - type: paragraph
    text: This medicine may cause serious infections (eg, urinary tract infections,
      upper respiratory tract infections, and sinusitis). Check with your doctor right
      away if you have bladder pain, bloody or cloudy urine, chest tightness, chills,
      cough, difficult, burning, or painful urination, ear congestion, fever, frequent
      urge to urinate, headache, loss of voice, lower back or side pain, pain or tenderness
      around eyes and cheekbones, sneezing, sore throat, stuffy or runny nose, trouble
      breathing, or unusual tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have decreased urine, dry mouth,
      irregular heartbeat, increased thirst, loss of appetite, mood changes, muscle
      pain or cramps, nausea or vomiting, numbness or tingling in the hands, feet,
      or lips, trouble breathing, or unusual tiredness or weakness. These may be symptoms
      of hypokalemia (low potassium in the blood).
  - type: paragraph
    text: This medicine may increase your blood sugar levels. Check with your doctor
      right away if you have blurred vision, dry mouth, fatigue, flushed, dry skin.
      fruit-like breath odor, increased hunger, increased thirst, increased urination,
      nausea, sweating, trouble breathing, unexplained weight loss, or vomiting. If
      you notice a change in the results of your urine or blood sugar tests, or if
      you have any questions, check with your doctor.
  - type: paragraph
    text: Check with your doctor right away if you have chest pain, cough, difficult
      breathing, fever, general feeling of discomfort or illness, or thickening of
      bronchial secretions. These may be symptoms of serious lung or breathing problems,
      including interstitial lung disease or pneumonitis.
  - type: paragraph
    text: This medicine may cause serious bleeding problems. Check with your doctor
      right away if you have bleeding gums, coughing up blood, difficulty in breathing
      or swallowing, dizziness, headache, increased menstrual flow or vaginal bleeding,
      nosebleeds, paralysis, prolonged bleeding from cuts, red or dark brown urine,
      red or black, tarry stools, or trouble breathing.
  - type: paragraph
    text: This medicine may cause serious types of allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Call your doctor right away if you have a rash, itching, large, hive-like
      swelling on the face, eyelids, lips, tongue, throat, hands, legs, feet, or sex
      organs, red, swollen skin, trouble breathing, trouble swallowing, or chest tightness
      while you are using this medicine.
  - type: paragraph
    text: This medicine could cause infertility. Talk with your doctor before using
      this medicine if you plan to have children.
  - type: paragraph
    text: While you are being treated with sirolimus protein-bound injection, do not
      have any immunizations (live vaccines) without your doctor's approval .
  - type: paragraph
    text: This medicine is made from donated human blood. Some human blood products
      have transmitted certain viruses (eg, Creutzfeldt-Jakob disease) to people who
      have received them, although the risk is low. Human donors and donated blood
      are both tested for viruses to keep the transmission risk low. Talk with your
      doctor if you have concerns about this risk.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - blood in the urine or stools
      - blurred vision
      - chest pain
      - chills
      - confusion
      - cough
      - coughing up blood
      - cracked lips
      - decreased urine
      - diarrhea
      - difficulty in swallowing
      - dizziness
      - dry mouth
      - fever
      - flushed, dry skin
      - fruit-like breath odor
      - general feeling of discomfort or illness
      - headache
      - increased hunger
      - increased menstrual flow or vaginal bleeding
      - increased thirst
      - increased urination
      - irritation or soreness of the mouth
      - lightheadedness
      - loss of appetite
      - mood changes
      - muscle pain or cramps
      - nausea or vomiting
      - nervousness
      - nosebleeds
      - numbness or tingling in hands, feet, or lips
      - painful or difficult urination
      - pale skin
      - paralysis
      - pinpoint red spots on the skin
      - pounding in the ears
      - prolonged bleeding from cuts
      - red or dark brown urine
      - red or black, tarry stools
      - slow, fast, or irregular heartbeat
      - sore throat
      - sores, ulcers, or white spots on the lips, tongue, or inside the mouth
      - stomach pain
      - sunken eyes
      - sweating
      - swelling of the hands, ankles, feet, or lower legs
      - thickening of bronchial secretions
      - trouble breathing
      - unexplained weight loss
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - wrinkled skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding after defecation
      - burning, numbness, tingling, or painful sensations
      - constipation
      - discoloration of the fingernails or toenails
      - dry skin
      - loss or thinning of the hair
      - muscle or bone pain
      - trouble sleeping
      - uncomfortable swelling around the anus
      - unsteadiness or awkwardness
      - weakness in arms, hands, legs, or feet
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
