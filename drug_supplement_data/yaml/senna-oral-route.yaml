- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Senna is used to relieve occasional constipation in adults and children.
      This medicine is a laxative. It generally produces bowel movement in 6 to 12
      hours.
  - type: paragraph
    text: This medicine is available without your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Liquid
    - Syrup
    - Tablet
    - Capsule
    - Tablet, Chewable
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of senna in children. However, safety
        and efficacy of senna chewable tablets have not been established in children
        younger than 6 years of age, or senna oral liquid and tablets in children
        younger than 2 years of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of senna in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Licorice
      - Magnesium Sulfate
      - Polyethylene Glycol 3350
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Stomach or bowel problems (including abdominal or stomach pain, nausea, vomiting,
        or a sudden change in bowel habits lasting for more than 2 weeks)—Use with
        caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine exactly as directed by your doctor . Do not use more of
      it, do not use it more often, and do not use it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Follow the instructions on the medicine label if you are using this medicine
      without a prescription.
  - type: paragraph
    text: Take this medicine preferably at bedtime, or as directed by your doctor.
  - type: paragraph
    text: Shake the oral liquid before use. Measure the dose correctly using the marked
      measuring spoon that comes with the package. Rinse the dosing spoon with water
      after each use.
  - type: paragraph
    text: If you are taking other medicines, take senna 2 or more hours after these
      medicines.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For relief of constipation: For oral dosage form (chewable tablets): Adults
        and children 12 years of age and older—2 tablets one or two times a day. Children
        6 to 11 years of age—1 tablet one or two times a day. Children younger than
        6 years of age—Use and dose must be determined by a doctor. For oral dosage
        form (oral liquid): Adults and children 12 years of age and older—At first,
        2 to 3 teaspoonfuls once a day. Your doctor may increase your dose as needed.
        However, the dose is usually not more than 3 teaspoonfuls two times a day.
        Children 6 to 11 years of age—At first, 1 to 1 1/2 teaspoonfuls once a day.
        Your doctor may increase your dose as needed. However, the dose is usually
        not more than 1 1/2 teaspoonfuls two times a day. Children 2 to 6 years of
        age—At first, 1/2 to 3/4 teaspoonfuls once a day. Your doctor may increase
        your dose as needed. However, the dose is usually not more than 3/4 teaspoonfuls
        once a day. Children younger than 2 years of age—Use and dose must be determined
        by your doctor. For oral dosage form (oral powder): Adults and children 12
        years of age and older—1/2 to 1 teaspoonful once or two times a day. Children
        6 to 11 years of age—1/4 to 1/2 teaspoonful once or two times a day. Children
        younger than 6 years of age—1/4 to 1/2 teaspoonful once or two times a day.
        For oral dosage form (tablets): Adults and children 12 years of age and older—At
        first, 2 tablets once a day. Your doctor may increase your dose as needed.
        However, the dose is usually not more than 4 tablets two times a day. Children
        6 to 11 years of age—At first, 1 tablet once a day. Your doctor may increase
        your dose as needed. However, the dose is usually not more than 2 tablets
        two times a day. Children 2 to 5 years of age—At first, 1/2 tablet once a
        day. Your doctor may increase your dose as needed. However, the dose is usually
        not more than 1 tablet two times a day. Children younger than 2 years of age—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
