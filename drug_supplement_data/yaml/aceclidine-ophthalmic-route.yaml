title: Aceclidine (ophthalmic route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Aceclidine eye drops is used to treat presbyopia (age-related eye or vision
      problem).
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Aceclidine eye drops is not indicated for use in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of aceclidine eye drops in the elderly.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Eye disease (eg, iritis, retinal problems)—Use with caution. May make these
        conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use it for a longer time than your doctor
      ordered. To do so may increase the chance of too much medicine being absorbed
      into the body and the chance of side effects.
  - type: paragraph
    text: 'To use the eye drops:'
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and water before and after using this medicine.
    - Tilt your head back and, pressing your finger gently on the skin just beneath
      the lower eyelid, pull the eyelid away from the eye to make a space. Drop the
      medicine into this space.
    - Let go of the eyelid and gently close the eye. Do not blink. Keep the eye closed
      for 1 or 2 minutes to allow the medicine to be absorbed by the eye.
    - If you think you did not get the drop of medicine into your eye properly, repeat
      the process with another drop.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
      Serious damage to the eye and possible loss of vision may result from using
      contaminated eye medicines.
  - type: paragraph
    text: If you wear contact lenses, take them out before you use this medicine.
      Wait at least 10 minutes before you put your contact lenses back in.
  - type: paragraph
    text: If you are using more than one eye product, apply these medicines at least
      5 minutes apart.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic dosage form (eye drops): For presbyopia: Adults—Instill one
        drop in each eye. Wait 2 minutes and instill another drop in each eye once
        a day from the same single-dose vial. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For presbyopia: Adults—Instill one drop in each eye. Wait 2 minutes and instill
        another drop in each eye once a day from the same single-dose vial. Children—Use
        is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—Instill one drop in each eye. Wait 2 minutes and instill another drop
        in each eye once a day from the same single-dose vial.
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Once the pouch or vial is removed from the refrigerator, you may store
        it at room temperature and use within 30 days. Throw away opened vials after
        use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If you will be using this medicine for more than a few weeks, your eye doctor
      will check your eyes at regular visits to make sure it is working properly and
      is not causing unwanted effects.
  - type: paragraph
    text: This medicine may cause blurred vision and may make you have trouble seeing
      at night or in dim light. Do not drive or do anything else that could be dangerous
      until you know how this medicine affects you.
  - type: paragraph
    text: Serious eye or vision problems (eg, retinal detachment, retinal tear) may
      occur during treatment with this medicine. Check with your doctor right away
      if you are seeing flashes or sparks of light, seeing floating spots before the
      eyes, or a veil or curtain appearing across part of your vision.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Eye irritation
      - headache
      - redness of the white part of eyes or inside of eyelids
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - eye pain
      - seeing flashes or sparks of light
      - seeing floating spots before the eyes, or a veil or curtain appearing across
        part of vision
      - sensitivity to light
      - watering of the eyes
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
