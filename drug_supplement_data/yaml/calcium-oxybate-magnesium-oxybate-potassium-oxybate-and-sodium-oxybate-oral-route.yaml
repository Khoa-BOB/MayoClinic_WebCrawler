    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss the second dose, skip that dose and do not take any more medicine
        until the next night. Do not use extra medicine to make up for a missed dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Pour any unused medicine down the sink drain after 24 hours. Use a marker
        to cross out the label on the bottle, then throw it in the trash.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure the medicine is working properly and to check
      for any unwanted effects.
  - type: paragraph
    text: Do not use this medicine if you are also taking another sedative or hypnotic
      medicine (eg, Ambien®, Phenergan®, Seconal®). Also, do not drink alcohol while
      you are using this medicine . Doing so may increase the risk for serious unwanted
      effects.
  - type: paragraph
    text: It is against the law and dangerous for anyone else to use your medicine.
      Keep your unused medicine in a safe and secure place. People who are addicted
      to drugs might want to steal this medicine.
  - type: paragraph
    text: Check with your doctor before using this medicine with alcohol or other
      medicines that affect the central nervous system (CNS) . The use of alcohol
      or other medicines that affect the CNS with Xywav® may worsen the side effects
      of this medicine, such as dizziness, poor concentration, drowsiness, unusual
      dreams, and trouble with sleeping. Some examples of medicines that affect the
      CNS are antihistamines or medicine for allergies or colds, sedatives, tranquilizers,
      or sleeping medicines, medicine for depression, medicine for anxiety, prescription
      pain medicine or narcotics, medicine for attention deficit and hyperactivity
      disorder, medicine for seizures or barbiturates, muscle relaxants, or anesthetics,
      including some dental anesthetics.
  - type: paragraph
    text: This medicine may make you dizzy, drowsy, or less alert than you are normally.
      Do not drive or do anything else that could be dangerous for at least 6 hours
      after taking this medicine .
  - type: paragraph
    text: 'Do not use more of this medicine or take it more often than your doctor
      tells you to. This can be life-threatening. Symptoms of an overdose include:
      extreme dizziness or weakness, slow heartbeat or breathing, seizures, trouble
      breathing, or cold, clammy skin . Call your doctor right away if you notice
      these symptoms.'
  - type: paragraph
    text: This medicine may cause some people to be agitated, irritable, or display
      other abnormal behaviors. It may also cause some people to have suicidal thoughts
      and tendencies or to become more depressed. Make sure the doctor knows if you
      have trouble sleeping, get upset easily, have a big increase in energy, or start
      to act reckless. Also tell the doctor if you have sudden or strong feelings,
      such as feeling nervous, angry, restless, violent, or scared. If you or your
      caregiver notice any of these side effects, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause unusual behavior while you are sleeping. Other people
      living in your house should monitor you for the possibility of sleep-related
      problems, including sleepwalking, sleep talking, sleep eating, or bedwetting.
      Tell your doctor if any of these occur.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or non-prescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bedwetting
      - sleepiness or unusual drowsiness
      - sleepwalking
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - confusion about identity, place, and time
      - discouragement
      - feeling sad or empty
      - irritability
      - lack of appetite
      - loss of interest or pleasure
      - pain in the arm or leg
      - seeing, feeling, or hearing things that are not there
      - sleep paralysis
      - thoughts of killing oneself
      - tremor
      - trouble breathing
      - trouble concentrating
      - trouble sleeping
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Being forgetful
      - blurred vision
      - chest tightness
      - decrease in the amount of urine
      - dizziness
      - falls
      - fever
      - headache
      - hives, itching, skin rash
      - hoarseness
      - increased urge to urinate during the night
      - irritation
      - joint pain, stiffness, or swelling
      - nervousness
      - noisy, rattling breathing
      - pounding in the ears
      - redness of the skin
      - swelling of the face, fingers, hands, feet, or lower legs
      - trouble swallowing
      - waking to urinate at night
      - weight gain
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - chest pain or discomfort
      - clumsiness
      - drowsiness
      - lightheadedness, dizziness, or fainting
      - loss of consciousness
      - loss of strength or energy
      - low body temperature
      - muscle pain or weakness
      - seizures
      - shakiness and unsteady walk
      - shivering
      - slow or irregular heartbeat
      - unsteadiness, trembling, or other problems with muscle control or coordination
      - unusual weak feeling
      - weak or feeble pulse
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased weight
      - diarrhea
      - dry mouth
      - increased sweating
      - nausea
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Clenching, gnashing, or grinding teeth
      - feeling drunk
      - snoring
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty in moving
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
