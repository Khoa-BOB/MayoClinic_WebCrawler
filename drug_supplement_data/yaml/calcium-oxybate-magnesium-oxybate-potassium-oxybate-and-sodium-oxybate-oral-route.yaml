title: Calcium oxybate, magnesium oxybate, potassium oxybate, and sodium oxybate (oral
  route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Xywav
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Calcium oxybate, magnesium oxybate, potassium oxybate, and sodium oxybate
      combination is used to treat cataplexy (weak or paralyzed muscles) or excessive
      daytime sleepiness (EDS) in patients with narcolepsy. Narcolepsy is an uncontrollable
      desire for sleep or a sudden attack of deep sleep. This medicine is also used
      to treat idiopathic hypersomnia (IH).
  - type: paragraph
    text: This medicine is available only under a restricted distribution program
      called Xywav® and Xyrem® REMS (Risk Evaluation and Mitigation Strategy) Program.
      You can only get it from one central pharmacy.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of calcium oxybate, magnesium oxybate, potassium oxybate, and
        sodium oxybate combination to treat idiopathic hypersomnia in children and
        to treat cataplexy or excessive daytime sleepiness in children younger than
        7 years of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of sodium
        oxybate have not been performed in the geriatric population. However, elderly
        patients are more likely to have unwanted effects (eg, headache) or age-related
        liver, kidney, or heart problems, which may require caution and an adjustment
        in the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Carbinoxamine
      - Chloral Hydrate
      - Chlormezanone
      - Diphenhydramine
      - Doxylamine
      - Eszopiclone
      - Ethchlorvynol
      - Glutethimide
      - Hydroxyzine
      - Isocarboxazid
      - Promethazine
      - Propiomazine
      - Ramelteon
      - Zaleplon
      - Zolpidem
      - Zopiclone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
