title: Tolvaptan (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Jynarque
    - type: paragraph
      text: Samsca
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Tolvaptan is used to treat hyponatremia (low sodium in the blood) in patients
      with heart failure or syndrome of inappropriate antidiuretic hormone (SIADH).
  - type: paragraph
    text: Tolvaptan is also used to slow kidney function decline in adults who are
      at risk of rapidly progressing autosomal dominant polycystic kidney disease
      (ADPKD).
  - type: paragraph
    text: Sodium is a chemical that the body needs for it to function well. If you
      have a low sodium blood level, your body will not function normally and you
      may not feel well. Tolvaptan works in the kidneys to help maintain the right
      amount of sodium for the body.
  - type: paragraph
    text: Samsca® is available only with your doctor's prescription. Jynarque™ is
      available only under a restricted distribution program called the Jynarque™
      REMS (Risk Evaluation and Mitigation Strategy) Program.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of tolvaptan in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of tolvaptan in the elderly. However,
        elderly patients are more likely to have age-related liver, kidney, or heart
        problems, which may require caution and an adjustment in the dose for patients
        receiving tolvaptan.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Boceprevir
      - Ceritinib
      - Clarithromycin
      - Cobicistat
      - Colchicine
      - Delavirdine
      - Elagolix
      - Idelalisib
      - Indinavir
      - Itraconazole
      - Ketoconazole
      - Levoketoconazole
      - Lonafarnib
      - Mifepristone
      - Nefazodone
      - Nelfinavir
      - Nirmatrelvir
      - Posaconazole
      - Ribociclib
      - Ritonavir
      - Saquinavir
      - Telaprevir
      - Telithromycin
      - Tipranavir
      - Troleandomycin
      - Voriconazole
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abrocitinib
      - Adagrasib
      - Alpelisib
      - Amobarbital
      - Amprenavir
      - Apalutamide
      - Aprepitant
      - Asciminib
      - Atazanavir
      - Avacopan
      - Azathioprine
      - Belumosudil
      - Belzutifan
      - Berotralstat
      - Butabarbital
      - Capmatinib
      - Carbamazepine
      - Ciprofloxacin
      - Conivaptan
      - Crizotinib
      - Cyclosporine
      - Dabigatran Etexilate
      - Dabrafenib
      - Danicopan
      - Daridorexant
      - Desmopressin
      - Deutivacaftor
      - Digoxin
      - Diltiazem
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Dronedarone
