      - Erdafitinib
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcoholism, chronic or
      - Cirrhosis (liver disease) or
      - Liver disease, severe or
      - Malnutrition (poor nutrition or undernourished condition)—May increase risk
        for more serious side effects.
    - type: list
      ordered: false
      items:
      - Anuria (not able to pass urine) or
      - Bladder blockage, uncorrected or
      - Hypovolemic hyponatremia (low blood sodium with low blood fluid) or
      - Kidney disease, severe or
      - Liver disease, severe, history of or
      - Not able to sense or respond to thirst or
      - Patients with sodium blood levels that must be increased right away—Should
        not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Hyperkalemia (high potassium in the blood) or
      - Hypovolemia (low blood volume) or
      - Stomach or bowel bleeding—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: It is important that you take your first dose or restart your treatment
      with this medicine in a hospital or medical facility . This will allow your
      doctor to check your response to this medicine and monitor any unwanted problems
      that may occur.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: This medicine is not for long-term use. You should not take Samsca® for
      more than 30 days to lessen your risk of having liver injury.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For hyponatremia: Adults—At first, 15 milligrams
        (mg) once a day. Your doctor will adjust your dose as needed. However, the
        dose is usually not more than 60 mg per day. Children—Use and dose must be
        determined by your doctor. For slowing kidney function decline in patients
        who are at risk of autosomal dominant polycystic kidney disease (ADPKD): Adults—At
        first, 60 milligrams (mg) per day (45 mg upon waking, then 15 mg taken 8 hours
        after). Your doctor will adjust your dose as needed and tolerated. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For hyponatremia: Adults—At first, 15 milligrams (mg) once a day. Your doctor
        will adjust your dose as needed. However, the dose is usually not more than
        60 mg per day. Children—Use and dose must be determined by your doctor.'
      - 'For slowing kidney function decline in patients who are at risk of autosomal
        dominant polycystic kidney disease (ADPKD): Adults—At first, 60 milligrams
        (mg) per day (45 mg upon waking, then 15 mg taken 8 hours after). Your doctor
        will adjust your dose as needed and tolerated. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 15 milligrams (mg) once a day. Your doctor will adjust your
        dose as needed. However, the dose is usually not more than 60 mg per day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—At first, 60 milligrams (mg) per day (45 mg upon waking, then 15 mg
        taken 8 hours after). Your doctor will adjust your dose as needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose of Jynarque™ , skip the missed dose, and go back to
        your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and to decide if you should continue
      to use it. Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: You should not use tolvaptan together with clarithromycin (Biaxin®), indinavir
      (Crixivan®), itraconazole (Sporanox®), ketoconazole (Nizoral®), nefazodone (Serzone®),
      nelfinavir (Viracept®), ritonavir (Norvir®), saquinavir (Fortovase®, Invirase®),
      or telithromycin (Ketek®). Using these medicines together may increase risk
      for more serious side effects .
  - type: paragraph
    text: Check with your doctor right away if you have drowsiness, confusion, mood
      changes, muscle weakness in the arms or legs, seizures (convulsions), or trouble
      with speaking, swallowing, or controlling body movements. These may be symptoms
      of a serious and rare condition called osmotic demyelination syndrome (ODS).
      This may occur if the sodium blood level rises too fast.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Certain medicines or illnesses, such as vomiting or diarrhea, may cause
      you to lose too much body water (dehydration). If you think you are dehydrated,
      tell your doctor right away. Always have water available to drink if you are
      thirsty, unless your doctor tells you otherwise.
  - type: paragraph
    text: Ask your doctor first before you use any medicine or salt substitutes that
      contain potassium .
  - type: paragraph
    text: You should not eat grapefruit or drink grapefruit juice while you are using
      this medicine. Grapefruit or grapefruit juice may increase the effects of tolvaptan
      in your body.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - dry mouth
      - flushed, dry skin
      - frequent urination
      - fruit-like breath odor
      - increased hunger
      - increased thirst
      - increased urination
      - increased volume of pale, dilute urine
      - nausea
      - stomach pain
      - sweating
      - thirst
      - troubled breathing
      - unexplained weight loss
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blood in the urine
      - bloody stools
      - blue lips, fingernails, or skin
      - bruising
      - chest pain
      - confusion
      - cough
      - coughing or vomiting blood
      - dark urine
      - dizziness or lightheadedness
      - fainting
      - fast, slow, irregular, or shallow heartbeat
      - fever
      - irregular, fast or slow, or shallow breathing
      - loss of consciousness
      - muscle cramp, spasm, pain, or stiffness
      - pain, redness, or swelling in the arm or leg
      - persistent bleeding or oozing from puncture sites, mouth, or nose
      - pink or red urine
      - rash
      - rectal bleeding
      - stomach tenderness
      - troubled breathing
      - sweating
      - vaginal bleeding
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty swallowing
      - general feeling of tiredness or weakness
      - headache
      - high blood pressure
      - hives, itching, skin rash
      - irritability
      - light-colored stools
      - muscle twitching
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - restlessness
      - seizures
      - stomach pain, continuing
      - swelling of the feet or lower legs
      - tightness in the chest
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty having a bowel movement
      - lack or loss of strength
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Loss of appetite
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
