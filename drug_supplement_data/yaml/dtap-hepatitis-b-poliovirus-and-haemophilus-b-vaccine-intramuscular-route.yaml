title: Dtap, hepatitis b, poliovirus, and haemophilus b vaccine (intramuscular route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: DTaP, Hepatitis B, Poliovirus, and Haemophilus b combination vaccine is
      an active immunizing agent used to prevent infections caused by diphtheria,
      tetanus (lockjaw), pertussis (whooping cough), hepatitis B virus, poliovirus,
      and Haemophilus influenza type b (Hib) bacteria. The vaccine works by causing
      your body to produce its own protection (antibodies) against the disease.
  - type: paragraph
    text: Diphtheria, tetanus, pertussis, hepatitis B, poliomyelitis, and Hib bacterial
      infection (eg, pneumonia, meningitis, epiglottitis, pericarditis, septic arthritis)
      are serious diseases that can cause life-threatening illnesses. Although some
      serious side effects can occur after a dose of Vaxelis™ (usually from the pertussis
      vaccine part), this rarely happens. The chance of your child catching one of
      these diseases, and being permanently injured or dying as a result, is much
      greater than the chance of your child getting a serious side effect from the
      vaccine.
  - type: paragraph
    text: This vaccine is recommended for children 6 weeks through 4 years of age
      (before the child's 5th birthday).
  - type: paragraph
    text: This vaccine is to be given only by or under the direct supervision of your
      doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Vaxelis™ in children 6 weeks to
        4 years of age. Safety and efficacy have been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Vaxelis™ is not for use in adult or geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
