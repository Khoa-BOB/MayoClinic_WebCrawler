    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Substance Name
    level: 3
    content: []
    subsections: []
  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atidarsagene Autotemcel
      - Elivaldogene Autotemcel
      - Ocrelizumab
      - Teplizumab-mzwv
      - Ublituximab-xiiy
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Brain disease (eg, encephalopathy)—This includes a loss of consciousness or
        seizures lasting a long time. Children who have these symptoms within 7 days
        of receiving a vaccine with pertussis should not get this vaccine.
    - type: list
      ordered: false
      items:
      - Guillain-Barré syndrome (severe nerve and muscle problem), history of after
        a vaccine with tetanus toxoid—Your doctor will decide if you should receive
        this vaccine.
    - type: list
      ordered: false
      items:
      - Previous serious reaction to a vaccine—If your child had a serious reaction
        to this vaccine or another vaccine with pertussis in it, you should talk to
        your doctor about the potential benefits and possible risks of getting this
        vaccine. Some serious reactions include being less responsive than normal,
        crying continuously without stopping for 3 hours or more, having a seizure
        with or without a fever, or having a fever that was 105 degrees F or higher.
    - type: list
      ordered: false
      items:
      - Progressive neurologic disorder, history of—This includes infantile spasms,
        progressive brain disease, or uncontrolled seizures. This vaccine should not
        be given until these conditions are treated and under control.
    - type: list
      ordered: false
      items:
      - Weakened immune system—May not work as well in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give your child this vaccine
      in a medical facility. It is given as a shot into a muscle.
  - type: paragraph
    text: This vaccine is usually given as a series of 3 shots. It is important that
      your child receive all of the shots in this series. Try to keep all scheduled
      appointments. Make another appointment as soon as possible if your child misses
      a dose of this vaccine.
  - type: paragraph
    text: After the 3-dose series of this vaccine, you may need another dose of a
      pertussis vaccine to complete the primary series to prevent whooping cough.
  - type: paragraph
    text: This vaccine is used to complete the first 3 doses of the 5-dose DTaP series
      in babies and young children who have received 1 or 2 doses of other vaccines
      (eg, Pentacel® or Daptace®).
  - type: paragraph
    text: This vaccine is given to babies with HBsAg-negative mothers and who have
      received a dose of any hepatitis B vaccine, before or at 1 month of age. It
      may also be used to complete the hepatitis B vaccination series after 1 or 2
      doses of other hepatitis B vaccines.
  - type: paragraph
    text: This vaccine is given to infants and young children who have received 1
      or 2 doses of inactivated poliovirus and Haemophilus influenzae type b conjugate
      vaccine.
  - type: paragraph
    text: Your child may also receive other vaccines at the same time as this one.
      You should receive information sheets on all of the vaccines. Make sure you
      understand all of the information given to you.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your child return to your doctor’s office at the
      right time for each dose . Be sure to notify your doctor of any unwanted effects
      that occur after your child receives this vaccine.
  - type: paragraph
    text: Check with your doctor right away if your child has sudden weakness in the
      arms and legs or numbness or tingling of the arms. This could be a sign of a
      serious condition called Guillain-Barré syndrome or brachial neuritis.
  - type: paragraph
    text: This vaccine will not treat an active infection. If your child has an infection
      due to diphtheria, tetanus, pertussis, hepatitis, poliovirus, or Hib bacteria,
      your child will need medicines to treat these infections.
  - type: paragraph
    text: Be sure to tell your child's doctor about any side effects that occur after
      your child receives the vaccine. This may include seizures, a high fever, crying
      that will not stop, or severe redness or swelling where the shot was given.
  - type: paragraph
    text: This vaccine may cause apnea (breathing stops for short periods) in some
      premature babies. Talk with your child's doctor if you have concerns.
  - type: paragraph
    text: Make sure any doctor who treats your child knows that he or she is using
      this medicine. This medicine may affect the results of certain medical tests.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever over 100.4 degrees F (38 degrees C)
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Prolonged crying lasting more than 3 hours
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish lips or skin
      - chills
      - confusion
      - dizziness
      - drowsiness
      - fainting
      - fast heartbeat
      - fever
      - headache
      - lightheadedness
      - loss of consciousness
      - pale skin
      - rapid, shallow breathing
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cold, clammy skin
      - fast, weak pulse
      - hives, itching, skin rash
      - hoarseness
      - irritation
      - joint pain, stiffness, or swelling
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - redness of the skin
      - seizures
      - sweating
      - swelling of the eyelids, face, lips, hands, or feet
      - tightness in the chest
      - troubled breathing or swallowing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - decreased appetite
      - sleepiness
      - vomiting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever less than 100.4 degrees F (38 degrees C)
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
