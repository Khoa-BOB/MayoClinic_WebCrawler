title: Cefepime (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Maxipime
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cefepime injection is used to treat bacterial infections in many different
      parts of the body. It belongs to the class of medicines known as cephalosporin
      antibiotics. It works by killing bacteria or preventing their growth. However,
      this medicine will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of cefepime injection in children.
        However, safety and efficacy have not been established in children younger
        than 2 months of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of cefepime injection in the elderly.
        However, elderly patients are more likely to have age-related kidney problems,
        which may require caution and an adjustment in the dose for patients receiving
        cefepime injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amiloride
      - Bemetizide
      - Bendroflumethiazide
      - Benzthiazide
      - Bumetanide
      - Canrenoate
      - Canrenone
      - Chlorothiazide
      - Chlorthalidone
      - Cholera Vaccine, Live
      - Clopamide
      - Cyclopenthiazide
      - Cyclothiazide
      - Diazoxide
      - Eplerenone
      - Ethacrynic Acid
      - Etozolin
      - Furosemide
      - Hydrochlorothiazide
      - Hydroflumethiazide
      - Indapamide
      - Methyclothiazide
      - Metolazone
      - Piretanide
      - Polythiazide
      - Quinethazone
      - Spironolactone
      - Torsemide
      - Triamterene
      - Trichlormethiazide
      - Warfarin
      - Xipamide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Brain disease (e.g., encephalopathy, severe confusion) or
      - Colitis (inflammation in the gut), history of or
      - Diarrhea (severe), history of or
      - Myoclonus (muscle twitching or jerking) or
      - Seizures—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. You may need a lower dose of this medicine,
        as this may increase risk of having seizures.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this medicine. This medicine is given as a shot into a muscle or into a vein.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: Cefepime injection may cause diarrhea, and in some cases it can be severe.
      It may occur 2 months or more after you or your child stop using this medicine.
      Do not take any medicine or give medicine to your child to treat diarrhea without
      first checking with your doctor. Diarrhea medicines may make the diarrhea worse
      or make it last longer. If you have any questions about this or if mild diarrhea
      continues or gets worse, check with your doctor.
  - type: paragraph
    text: 'Tell your doctor right away if you or your child have any of the following
      symptoms while receiving this medicine: confusion, loss of consciousness, jerking
      or twitching of the muscles, seizures, seeing, hearing, or feeling things that
      are not there, or severe sleepiness.'
  - type: paragraph
    text: Before you or your child have any medical tests, tell the medical doctor
      in charge that you are receiving this medicine. The results of some tests may
      be affected by this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps
      - back, leg, or stomach pains
      - bleeding gums, nosebleeds
      - confusion
      - convulsions
      - dark urine
      - difficulty with breathing
      - fever, chills
      - general body swelling
      - headache
      - irregular heartbeats
      - loss of appetite
      - mood or mental changes
      - muscle cramps in the hands, arms, feet, legs, or face
      - nausea or vomiting
      - numbness and tingling around the mouth, fingertips, or feet
      - tremor
      - yellowing of the eyes or skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish color
      - pain, tenderness
      - swelling of the foot or leg
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - inflammation or swelling
      - watery or bloody diarrhea
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - blistering, peeling, or loosening of the skin
      - bloody or cloudy urine
      - bloody, black, or tarry stools
      - blurred vision
      - change in consciousness
      - chest pain
      - cough or hoarseness
      - difficult or painful urination
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - general feeling of tiredness or weakness
      - itching, hives
      - muscle twitching or jerking
      - paralysis
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red skin lesions, often with a purple center
      - rhythmic movement of the muscles
      - seeing, hearing, or feeling things that are not there
      - seizures
      - severe sleepiness
      - stiff neck
      - sudden decrease in the amount of urine
      - swollen or painful glands
      - unpleasant breath odor
      - unusual bleeding or bruising
      - vomiting of blood
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Red streaks on the skin
      - swelling, tenderness, or pain at the injection site
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Itching of the vagina or genital area
      - pain during sexual intercourse
      - redness of the skin
      - sore mouth or tongue
      - thick, white vaginal discharge with no odor or with a mild odor
      - white patches in the mouth, tongue, or throat
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
