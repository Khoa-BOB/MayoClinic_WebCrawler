    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you vomit after taking your medicine, do not take an extra dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep the bottle closed when you are not using it. Keep it in the refrigerator.
        Do not freeze.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away any unused medicine 14 days after opening the bottle.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly.
  - type: paragraph
    text: This medicine may cause severe diarrhea. Check with your doctor right away
      if you have fever, pain, stomach cramps, tenderness, or watery or bloody diarrhea.
      Your doctor will give you medicines to help prevent diarrhea during treatment
      with this medicine. Drink extra fluids to help prevent dehydration.
  - type: paragraph
    text: This medicine may cause weight loss. Talk to your doctor if you notice you
      are losing weight during treatment with this medicine.
  - type: paragraph
    text: This medicine may cause vomiting, which can lead to serious lung problems
      (eg, aspiration pneumonia). Check with your doctor right away if you have chest
      pain or tightness, cough, fever or chills, sore throat, trouble breathing, or
      unusual tiredness or weakness.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - chest pain or tightness
      - decreased appetite
      - diarrhea
      - fever or chills
      - headache
      - muscle aches
      - seizures
      - sore throat
      - stuffy or runny nose
      - trouble breathing
      - unusual tiredness or weakness
      - vomiting
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
