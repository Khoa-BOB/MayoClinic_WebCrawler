title: Trofinetide (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Daybue
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Trofinetide is used to treat Rett syndrome. Rett syndrome is a rare genetic
      disorder that affects the way the brain develops.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of trofinetide in children younger than 2 years of age. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of trofinetide in the elderly. However,
        elderly patients are more likely to have age-related kidney problems, which
        may require caution in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abemaciclib
      - Acalabrutinib
      - Alfentanil
      - Atazanavir
      - Atogepant
      - Avanafil
      - Avapritinib
      - Bedaquiline
      - Benzhydrocodone
      - Bosutinib
      - Budesonide
      - Buspirone
      - Cobimetinib
      - Codeine
      - Colchicine
      - Conivaptan
      - Cyclosporine
      - Daridorexant
      - Darifenacin
      - Darunavir
      - Dasatinib
      - Digoxin
      - Dihydrocodeine
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Dronedarone
      - Elacestrant
      - Eletriptan
      - Elvitegravir
      - Entrectinib
      - Eplerenone
      - Everolimus
      - Felodipine
      - Finerenone
      - Fluticasone
      - Fosaprepitant
      - Gepirone
      - Haloperidol
      - Hydrocodone
      - Ibrexafungerp
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate or severe—Use is not recommended.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Measure the oral liquid medicine with a marked oral syringe or medicine
      cup. Do not use a household measuring cup.
  - type: paragraph
    text: You may also give this medicine using a gastrostomy tube.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Do not take laxatives before starting treatment with this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (solution): For Rett syndrome: Adults and children 2
        years of age and older—Dose is based on body weight and must be determined
        by your doctor. Weighing 50 kilograms (kg) or more—12,000 milligrams (mg)
        or 60 milliliters (mL) 2 times a day. Your doctor may adjust your dose as
        needed. Weighing 35 kg to less than 50 kg—10,000 mg or 50 mL 2 times a day.
        Your doctor may adjust your dose as needed. Weighing 20 kg to less than 35
        kg—8,000 mg or 40 mL 2 times a day. Your doctor may adjust your dose as needed.
        Weighing 12 kg to less than 20 kg—6,000 mg or 30 mL 2 times a day. Your doctor
        may adjust your dose as needed. Weighing 9 kg to less than 12 kg—5,000 mg
        or 25 mL 2 times a day. Your doctor may adjust your dose as needed. Children
        younger than 2 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For Rett syndrome: Adults and children 2 years of age and older—Dose is based
        on body weight and must be determined by your doctor. Weighing 50 kilograms
        (kg) or more—12,000 milligrams (mg) or 60 milliliters (mL) 2 times a day.
        Your doctor may adjust your dose as needed. Weighing 35 kg to less than 50
        kg—10,000 mg or 50 mL 2 times a day. Your doctor may adjust your dose as needed.
        Weighing 20 kg to less than 35 kg—8,000 mg or 40 mL 2 times a day. Your doctor
        may adjust your dose as needed. Weighing 12 kg to less than 20 kg—6,000 mg
        or 30 mL 2 times a day. Your doctor may adjust your dose as needed. Weighing
        9 kg to less than 12 kg—5,000 mg or 25 mL 2 times a day. Your doctor may adjust
        your dose as needed. Children younger than 2 years of age—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 2 years of age and older—Dose is based on body weight
        and must be determined by your doctor. Weighing 50 kilograms (kg) or more—12,000
        milligrams (mg) or 60 milliliters (mL) 2 times a day. Your doctor may adjust
        your dose as needed. Weighing 35 kg to less than 50 kg—10,000 mg or 50 mL
        2 times a day. Your doctor may adjust your dose as needed. Weighing 20 kg
        to less than 35 kg—8,000 mg or 40 mL 2 times a day. Your doctor may adjust
        your dose as needed. Weighing 12 kg to less than 20 kg—6,000 mg or 30 mL 2
        times a day. Your doctor may adjust your dose as needed. Weighing 9 kg to
