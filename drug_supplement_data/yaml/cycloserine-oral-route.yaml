title: Cycloserine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Seromycin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cycloserine belongs to the family of medicines called antibiotics. It is
      used to treat tuberculosis (TB). When cycloserine is used for TB, it is given
      with other medicines for TB. Cycloserine may also be used for other conditions
      as determined by your doctor.
  - type: paragraph
    text: To help clear up your tuberculosis (TB) completely, you must keep taking
      this medicine for the full time of treatment, even if you begin to feel better.
      This is very important. It is also important that you do not miss any doses.
  - type: paragraph
    text: Cycloserine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of cycloserine
        in children with use in other age groups, this medicine is not expected to
        cause different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of cycloserine
        in the elderly with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Ethionamide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse (or history of) or
      - Convulsive disorders such as seizures or epilepsy—Cycloserine may increase
        the risk of seizures in patients who drink alcohol or have a history of seizures
    - type: list
      ordered: false
      items:
      - Kidney disease—Cycloserine is removed from the body through the kidneys, and
        patients with kidney disease may need an adjustment in dose or the medicine
        may need to be discontinued
    - type: list
      ordered: false
      items:
      - Mental disorders such as mental depression, psychosis, or severe anxiety—Cycloserine
        may cause anxiety, mental depression, or psychosis
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Cycloserine may be taken after meals if it upsets your stomach.
  - type: paragraph
    text: To help clear up your infection completely, it is very important that you
      keep taking this medicine for the full time of treatment , even if you begin
      to feel better after a few weeks. If you are taking this medicine for TB, you
      may have to take it every day for as long as 1 to 2 years or more. If you stop
      taking this medicine too soon, your symptoms may return.
  - type: paragraph
    text: This medicine works best when there is a constant amount in the blood or
      urine. To help keep the amount constant, do not miss any doses. Also, it is
      best to take the doses at evenly spaced times day and night. For example, if
      you are to take 2 doses a day, the doses should be spaced about 12 hours apart.
      If this interferes with your sleep or other daily activities, or if you need
      help in planning the best times to take your medicine, check with your health
      care professional.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For the oral dosage form (capsules): For treatment of tuberculosis: Adults
        and teenagers—250 milligrams (mg) two times a day to start. Your doctor may
        slowly increase your dose up to 250 mg three or four times a day. This medicine
        must be taken along with other medicines to treat tuberculosis. Children—Use
        and dose must be determined by your doctor. Doses of 10 to 20 mg per kilogram
        (4.5 to 9.1 mg per pound) of body weight per day have been used. This medicine
        must be taken along with other medicines to treat tuberculosis.'
    - type: list
      ordered: false
      items:
      - 'For treatment of tuberculosis: Adults and teenagers—250 milligrams (mg) two
        times a day to start. Your doctor may slowly increase your dose up to 250
        mg three or four times a day. This medicine must be taken along with other
        medicines to treat tuberculosis. Children—Use and dose must be determined
        by your doctor. Doses of 10 to 20 mg per kilogram (4.5 to 9.1 mg per pound)
        of body weight per day have been used. This medicine must be taken along with
        other medicines to treat tuberculosis.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—250 milligrams (mg) two times a day to start. Your doctor
        may slowly increase your dose up to 250 mg three or four times a day. This
        medicine must be taken along with other medicines to treat tuberculosis.
      - Children—Use and dose must be determined by your doctor. Doses of 10 to 20
        mg per kilogram (4.5 to 9.1 mg per pound) of body weight per day have been
        used. This medicine must be taken along with other medicines to treat tuberculosis.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits.
  - type: paragraph
    text: If your symptoms do not improve within 2 to 3 weeks, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: If cycloserine causes you to feel very depressed or to have thoughts of
      suicide, check with your doctor immediately. Your doctor will probably want
      to change your medicine.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, drowsy, or less alert
      than they are normally. Make sure you know how you react to this medicine before
      you drive, use machines, or do anything else that could be dangerous if you
      are dizzy or are not alert. If these reactions are especially bothersome, check
      with your doctor.
  - type: paragraph
    text: Some of cycloserine's side effects (for example, convulsions [seizures])
      may be more likely to occur if you drink alcoholic beverages regularly while
      you are taking this medicine. Therefore, you should not drink alcoholic beverages
      while you are taking this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - confusion
      - dizziness
      - drowsiness
      - increased irritability
      - increased restlessness
      - mental depression
      - muscle twitching or trembling
      - nervousness
      - nightmares
      - other mood or mental changes
      - speech problems
      - thoughts of suicide
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Convulsions (seizures)
      - numbness, tingling, burning pain, or weakness in the hands or feet
      - skin rash
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
