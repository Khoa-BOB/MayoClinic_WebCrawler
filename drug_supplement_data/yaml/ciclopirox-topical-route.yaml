title: Ciclopirox (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ciclodan
    - type: paragraph
      text: CNL8
    - type: paragraph
      text: Loprox
    - type: paragraph
      text: Loprox TS
    - type: paragraph
      text: Penlac
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ciclopirox is used to treat infections caused by fungus. It works by killing
      the fungus or preventing its growth.
  - type: paragraph
    text: 'Ciclopirox cream, gel, or lotion are applied to the skin to treat:'
  - type: list
    ordered: false
    items:
    - ringworm of the body (tinea corporis);
    - ringworm of the foot (tinea pedis; athlete's foot);
    - ringworm of the groin (tinea cruris; jock itch);
    - “sun fungus” (tinea versicolor; pityriasis versicolor); and
    - certain other fungus infections, such as Candida (Monilia) infections.
  - type: paragraph
    text: Ciclopirox gel or shampoo may also be applied to the scalp to treat seborrheic
      dermatitis.
  - type: paragraph
    text: Ciclopirox topical solution (nail lacquer) is applied to the nails to treat
      ringworm of the nails (tinea unguium).
  - type: paragraph
    text: Ciclopirox is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
    - Shampoo
    - Suspension
    - Cream
    - Gel/Jelly
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of ciclopirox in children under the
        age of 10 with use in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of ciclopirox
        in the elderly with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: 'For patients using the cream, gel, or lotion form of this medicine:'
  - type: list
    ordered: false
    items:
    - Keep this medicine away from the eyes.
    - Apply enough ciclopirox to cover the affected and surrounding skin or scalp
      areas and rub in gently.
  - type: paragraph
    text: 'For patients using the shampoo form of this medicine:'
  - type: list
    ordered: false
    items:
    - Keep this medicine away from the eyes.
    - Apply shampoo to wet hair. Lather and leave on hair and scalp for 3 minutes.
      A timer may be used. Rinse off.
  - type: paragraph
    text: 'For patients using the topical solution form of this medicine:'
  - type: list
    ordered: false
    items:
    - Keep this medicine away from the eyes and mucous membranes
    - This medicine comes with a patient instruction sheet. Read this sheet carefully
      and follow the directions. If you have any questions on how to use this medicine,
      be sure to ask your health care professional.
    - In addition to daily application of this medicine, you will need to trim your
      nails as directed, and visit your healthcare professional at regular intervals
      to have the unattached infected nails removed.
    - Do not use nail polish or other nail cosmetic products on the treated nails.
    - Do not use near heat or open flame.
  - type: paragraph
    text: When ciclopirox is used to treat certain types of fungus infections of the
      skin, an occlusive dressing (airtight covering, such as kitchen plastic wrap)
      should not be applied over the medicine. To do so may irritate the skin. Do
      not apply an airtight covering over this medicine unless you have been directed
      to do so by your doctor.
  - type: paragraph
    text: To help clear up your infection completely, it is very important that you
      keep using ciclopirox for the full time of treatment , even if your symptoms
      begin to clear up after a few days. Since fungus infections may be very slow
      to clear up, you may have to continue using this medicine every day for several
      weeks or more. If you stop using this medicine too soon, your symptoms may return.
      Do not miss any doses .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical cream and lotion dosage forms: Fungus infections (treatment):
        Adults and children 10 years of age and over—Apply two times a day, morning
        and evening. Children up to 10 years of age—Use and dose must be determined
        by your doctor. For topical gel dosage form: Fungus infections (treatment)
        or seborrheic dermatitis (treatment): Adults and children 16 years of age
        and over—Apply two times a day, morning and evening. Children up to 16 years
        of age—Use and dose must be determined by your doctor. For shampoo dosage
        form: Seborrheic dermatitis (treatment): Adults and children 16 years of age
        and over—Apply 1 teaspoon (or up to 2 teaspoons for long hair) two times a
        week for four weeks with at least three days between each application. Children
        up to 16 years of age—Use and dose must be determined by your doctor. For
        topical solution dosage form: Fungus infections (treatment): Adults —Apply
        once daily, preferably at bedtime or eight hours before washing. Children
        up to 18 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'Fungus infections (treatment): Adults and children 10 years of age and over—Apply
        two times a day, morning and evening. Children up to 10 years of age—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 10 years of age and over—Apply two times a day, morning
        and evening.
      - Children up to 10 years of age—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'Fungus infections (treatment) or seborrheic dermatitis (treatment): Adults
        and children 16 years of age and over—Apply two times a day, morning and evening.
        Children up to 16 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 16 years of age and over—Apply two times a day, morning
        and evening.
      - Children up to 16 years of age—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'Seborrheic dermatitis (treatment): Adults and children 16 years of age and
        over—Apply 1 teaspoon (or up to 2 teaspoons for long hair) two times a week
        for four weeks with at least three days between each application. Children
        up to 16 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 16 years of age and over—Apply 1 teaspoon (or up to 2
        teaspoons for long hair) two times a week for four weeks with at least three
        days between each application.
      - Children up to 16 years of age—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'Fungus infections (treatment): Adults —Apply once daily, preferably at bedtime
        or eight hours before washing. Children up to 18 years of age—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults —Apply once daily, preferably at bedtime or eight hours before washing.
      - Children up to 18 years of age—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your skin problem does not improve within 2 to 4 weeks, or if it becomes
      worse, check with your doctor.
  - type: paragraph
    text: Inform your doctor right away if the area where you applied the medicine
      shows signs of increased irritation (e.g., redness, itching, burning, blistering,
      swelling, or oozing) because it could be an allergic reaction.
  - type: paragraph
    text: Nail problems treated with the topical solution form of this medicine may
      take up to 6 months to start improving.
  - type: paragraph
    text: To help clear up your infection completely and to help make sure it does
      not return, good health habits are also required. The following measures will
      help reduce chafing and irritation and will also help keep the area cool and
      dry.
  - type: list
    ordered: false
    items:
    - 'For patients using ciclopirox for ringworm of the groin (tinea cruris): Avoid
      wearing underwear that is tight-fitting or made from synthetic materials (for
      example, rayon or nylon). Instead, wear loose-fitting, cotton underwear. Use
      a bland, absorbent powder (for example, talcum powder) or an antifungal powder
      (for example, tolnaftate) on the skin. It is best to use the powder between
      applications of ciclopirox.'
    - 'For patients using ciclopirox for ringworm of the foot (tinea pedis): Carefully
      dry the feet, especially between the toes, after bathing. Avoid wearing socks
      made from wool or synthetic materials (for example, rayon or nylon). Instead,
      wear clean, cotton socks and change them daily or more often if the feet sweat
      freely. Wear sandals or well-ventilated shoes (for example, shoes with holes
      on top or on the side). Use a bland, absorbent powder (for example, talcum powder)
      or an antifungal powder (for example, tolnaftate) between the toes, on the feet,
      and in socks and shoes freely once or twice a day. It is best to use the powder
      between applications of ciclopirox.'
  - type: list
    ordered: false
    items:
    - Avoid wearing underwear that is tight-fitting or made from synthetic materials
      (for example, rayon or nylon). Instead, wear loose-fitting, cotton underwear.
    - Use a bland, absorbent powder (for example, talcum powder) or an antifungal
      powder (for example, tolnaftate) on the skin. It is best to use the powder between
      applications of ciclopirox.
  - type: list
    ordered: false
    items:
    - Carefully dry the feet, especially between the toes, after bathing.
    - Avoid wearing socks made from wool or synthetic materials (for example, rayon
      or nylon). Instead, wear clean, cotton socks and change them daily or more often
      if the feet sweat freely.
    - Wear sandals or well-ventilated shoes (for example, shoes with holes on top
      or on the side).
    - Use a bland, absorbent powder (for example, talcum powder) or an antifungal
      powder (for example, tolnaftate) between the toes, on the feet, and in socks
      and shoes freely once or twice a day. It is best to use the powder between applications
      of ciclopirox.
  - type: paragraph
    text: If you have any questions about these measures, check with your health care
      professional.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fainting
      - fast, pounding, or irregular heartbeat or pulse
      - palpitations
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, itching, redness, swelling, or other signs of irritation not present
        before use of this medicine
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dandruff
      - headache
      - itching skin or scalp
      - oily skin
      - rash
      - skin disorder
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
