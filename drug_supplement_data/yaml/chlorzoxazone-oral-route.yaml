title: Chlorzoxazone (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Lorzone
    - type: paragraph
      text: Parafon Forte DSC
    - type: paragraph
      text: Remular-S
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Chlorzoxazone is used to relax certain muscles in your body and relieve
      the discomfort caused by acute (short-term), painful muscle or bone conditions.
      However, this medicine does not take the place of rest, exercise, physical therapy,
      or other treatments that your doctor may recommend for your medical condition.
  - type: paragraph
    text: Chlorzoxazone is a skeletal muscle relaxant. It acts on the central nervous
      system (CNS) to relax muscles.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of chlorzoxazone in the pediatric population. Safety and efficacy have not
        been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of chlorzoxazone in geriatric patients. However, elderly patients are more
        likely to have age-related liver problems, which may require caution in patients
        receiving chlorzoxazone.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alfentanil
      - Alprazolam
      - Amobarbital
      - Aprobarbital
      - Azathioprine
      - Bedaquiline
      - Benzhydrocodone
      - Bromazepam
      - Buprenorphine
      - Butabarbital
      - Butalbital
      - Butorphanol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Carisoprodol
      - Cetirizine
      - Chloral Hydrate
      - Chlordiazepoxide
      - Clobazam
      - Clomipramine
      - Clonazepam
      - Clorazepate
      - Codeine
      - Colchicine
      - Cyclobenzaprine
      - Cyproheptadine
      - Dantrolene
      - Daridorexant
      - Dexmedetomidine
      - Diazepam
      - Dihydrocodeine
      - Doxepin
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Doxylamine
      - Eliglustat
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - St John's Wort
      - Tizanidine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. May increase the risk of serious side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For relaxing muscles: Adults—500 milligrams
        (mg) three or four times a day. Your doctor may adjust your dose if needed.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For relaxing muscles: Adults—500 milligrams (mg) three or four times a day.
        Your doctor may adjust your dose if needed. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—500 milligrams (mg) three or four times a day. Your doctor may adjust
        your dose if needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly and to check for unwanted
      effects.
  - type: paragraph
    text: 'Liver problems may occur while you are using this medicine. Stop using
      this medicine and check with your doctor right away if you are having more than
      one of these symptoms: abdominal pain or tenderness; clay-colored stools; dark
      urine; decreased appetite; fever; headache; itching; loss of appetite; nausea
      and vomiting; skin rash; swelling of the feet or lower legs; unusual tiredness
      or weakness; or yellow eyes or skin.'
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for hay fever, allergies, or colds; sedatives,
      tranquilizers, or sleeping medicine; prescription pain medicine or narcotics;
      barbiturates; medicine for seizures; or anesthetics, including some dental anesthetics.
      Check with your medical doctor or dentist before taking any of these medicines
      while you are taking chlorzoxazone.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody or black, tarry stools
      - clay-colored stools
      - constipation
      - cough
      - dark urine
      - decreased appetite
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - fever
      - headache
      - hives
      - itching
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss of appetite
      - nausea and vomiting
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - severe stomach pain
      - shortness of breath
      - skin rash
      - swelling of the feet or lower legs
      - tightness in the chest
      - unusual tiredness or weakness
      - vomiting of blood or material that looks like coffee grounds
      - wheezing
      - yellow eyes or skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - difficult or troubled breathing
      - drowsiness
      - general feeling of discomfort or illness
      - headache
      - irregular, fast or slow, or shallow breathing
      - lightheadedness
      - nausea
      - pale or blue lips, fingernails, or skin
      - sluggishness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bruising
      - large, flat, blue, or purplish patches in the skin
      - small red or purple spots on the skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
