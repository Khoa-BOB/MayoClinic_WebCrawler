    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood circulation problems or
      - Bradycardia (slow heartbeat) or
      - Heart block or
      - Heart failure, moderate to severe or
      - Sick-sinus syndrome (heart rhythm problem)—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hyperthyroidism (overactive thyroid) or
      - Hypoglycemia (low blood sugar)—May cover up some of the signs and symptoms
        of these diseases, such as a fast heartbeat.
    - type: list
      ordered: false
      items:
      - Hypotension (low blood pressure) or
      - Ischemic heart disease or
      - Lung disease (eg, asthma, bronchitis, emphysema) or
      - Pheochromocytoma (adrenal gland tumor)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given through a needle placed in one of your veins.
  - type: paragraph
    text: Your doctor will only give you a few doses of this medicine until your condition
      improves, and then you will be switched to an oral medicine that works the same
      way. If you have any concerns about this, talk to your doctor.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you closely to make sure this
      medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: Metoprolol injection may worsen the symptoms of heart failure in some patients.
      Tell your doctor right away if you are having chest pain or discomfort, dilated
      neck veins, extreme fatigue, irregular breathing, an irregular heartbeat, shortness
      of breath, swelling of the face, fingers, feet, or lower legs, weight gain,
      or wheezing.
  - type: paragraph
    text: This medicine may cause changes in your blood sugar levels. Also, this medicine
      may cover up signs of low blood sugar, such as a rapid pulse rate. Check with
      your doctor if you have these problems or if you notice a change in the results
      of your blood or urine sugar tests.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop receiving this medicine several days before
      having surgery.
  - type: paragraph
    text: This medicine may cause some people to become less alert than they are normally.
      if this side effect occurs, do not drive, use machines, or do anything else
      that could be dangerous if you are not alert while using metoprolol injection.
  - type: paragraph
    text: Dizziness, lightheadedness, or even fainting may occur when you get up suddenly
      from a lying or sitting position. Getting up slowly may help lessen this problem.
      Also, lying down for a while may relieve dizziness or lightheadedness.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain or discomfort
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - shortness of breath
      - slow or irregular heartbeat
      - sweating
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - cough
      - decreased urine output
      - difficult or labored breathing
      - dilated neck veins
      - disturbed color perception
      - double vision
      - extreme fatigue
      - fast, pounding, or racing heartbeat or pulse
      - halos around lights
      - irregular breathing
      - loss of vision
      - mental confusion
      - night blindness
      - noisy breathing
      - overbright appearance of lights
      - pain, tension, and weakness upon walking that subsides during periods of rest
      - paleness or cold feeling in the fingertips and toes
      - rapid weight gain
      - seeing, hearing, or feeling things that are not there
      - short-term memory loss
      - swelling of the face, fingers, feet, or lower legs
      - tightness in the chest
      - tingling of the hands or feet
      - tingling or pain in the fingers or toes when exposed to cold
      - troubled breathing
      - tunnel vision
      - unusual weight gain or loss
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish color skin of the fingers or toes
      - chills
      - clay-colored stools
      - continuing loss of appetite
      - continuing or severe abdominal or stomach pain
      - continuing or severe nausea and vomiting
      - dark urine
      - difficulty with moving
      - fever
      - general tiredness and weakness
      - headache
      - hoarseness
      - increased frequency of urination
      - itching skin
      - light-colored stools
      - lower back or side pain
      - muscle pain or stiffness
      - numbness of the fingers or toes
      - pain, swelling, or redness in the joints
      - painful or difficult urination
      - rash
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - unpleasant breath odor
      - unusual bleeding or bruising
      - upper right abdominal or stomach pain
      - vomiting of blood
      - weakness
      - yellow eyes and skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish color of the fingernails, lips, skin, palms, or nail beds
      - change in consciousness
      - loss of consciousness
      - no blood pressure or pulse
      - stopping of heart
      - unconsciousness
      - very drowsy or sleepy
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - bloated
      - decreased interest in sexual intercourse
      - difficulty having a bowel movement (stool)
      - discouragement
      - dry mouth
      - excess air or gas in the stomach or intestines
      - feeling of constant movement of self or surroundings
      - feeling of indigestion
      - feeling sad or empty
      - full feeling
      - inability to have or keep an erection
      - irritability
      - loss in sexual ability, desire, drive, or performance
      - loss of interest or pleasure
      - nightmares
      - pain in the chest below the breastbone
      - passing gas
      - redness or other discoloration of the skin
      - sensation of spinning
      - tiredness
      - trouble concentrating
      - trouble sleeping
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bone pain
      - continuing ringing or buzzing or other unexplained noise in the ears
      - hearing loss
      - increased sensitivity of the skin to sunlight
      - pain of penis on erection
      - severe sunburn
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
