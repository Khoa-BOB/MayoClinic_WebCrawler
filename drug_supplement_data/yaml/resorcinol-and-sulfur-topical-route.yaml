title: Resorcinol and sulfur (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Acne-Aid Gel
    - type: paragraph
