title: Saxagliptin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Onglyza
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Saxagliptin is used with proper diet and exercise to treat high blood sugar
      levels in patients with type 2 diabetes. Saxagliptin helps to control blood
      sugar levels by increasing substances in the body that make the pancreas release
      more insulin. It also signals the liver to stop producing sugar (glucose) when
      there is too much sugar in the blood. This medicine does not help patients who
      have insulin-dependent or type 1 diabetes.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of saxagliptin in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of saxagliptin in the elderly. However,
        elderly patients are more likely to have age-related kidney problems, which
        may require an adjustment in the dose for patients receiving saxagliptin.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Acarbose
      - Apalutamide
      - Atazanavir
      - Avacopan
      - Boceprevir
      - Carbamazepine
      - Ceritinib
      - Chloroquine
      - Chlorothiazide
      - Chlorpropamide
      - Chlorthalidone
      - Ciprofloxacin
      - Clarithromycin
      - Cobicistat
      - Conivaptan
      - Delafloxacin
      - Enoxacin
      - Fedratinib
      - Fexinidazole
      - Fosnetupitant
      - Furosemide
      - Gatifloxacin
      - Gemifloxacin
      - Glimepiride
      - Glipizide
      - Glyburide
      - Grepafloxacin
      - Hydrochlorothiazide
      - Hydroflumethiazide
      - Hydroxychloroquine
      - Idelalisib
      - Indapamide
      - Indinavir
      - Insulin
      - Insulin Aspart, Recombinant
      - Insulin Bovine
      - Insulin Degludec
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acebutolol
      - Atenolol
      - Betaxolol
      - Bisoprolol
      - Carteolol
      - Carvedilol
      - Celiprolol
      - Esmolol
      - Glecaprevir
      - Labetalol
      - Levobunolol
      - Metipranolol
      - Metoprolol
      - Nadolol
      - Nebivolol
      - Oxprenolol
      - Penbutolol
      - Pibrentasvir
      - Pindolol
      - Practolol
      - Propranolol
      - Sotalol
      - Timolol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol use disorder, history of or
      - Gallstones or
      - Hypertriglyceridemia (high triglycerides or fats in the blood) or
      - Pancreatitis (swelling of the pancreas)—Use with caution. May cause side effects
        to become worse.
    - type: list
      ordered: false
      items:
      - Angioedema (swelling of the face, lips, tongue, throat, arms, or legs), history
        with other dipeptidyl peptidase-4 (DPP-4) inhibitors—Use with caution. May
        increase the risk of this condition occurring again.
    - type: list
      ordered: false
      items:
      - Diabetic ketoacidosis (high ketones and acid in the blood) or
      - Type 1 diabetes—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Heart failure, history of or
      - Kidney disease—May increase risk for heart failure.
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate or severe—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of unwanted effects.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Carefully follow the special meal plan your doctor gave you . This is the
      most important part of controlling your condition, and is necessary if the medicine
      is to work properly. Exercise regularly and test for sugar in your blood or
      urine as directed.
  - type: paragraph
    text: Swallow the tablet whole. Do not cut, crush, or chew it. Take this medicine
      with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For Type 2 diabetes: Adults—2.5 or 5 milligrams
        (mg) once a day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For Type 2 diabetes: Adults—2.5 or 5 milligrams (mg) once a day. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—2.5 or 5 milligrams (mg) once a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: Pancreatitis (swelling and inflammation of the pancreas) may occur while
      you are using this medicine. Check with your doctor right away if you have sudden
      and severe stomach pain, chills, constipation, nausea, vomiting, fever, or lightheadedness.
  - type: paragraph
    text: Check with your doctor right away if you have chest pain or tightness, decreased
      urine output, dilated neck veins, extreme fatigue, irregular breathing, irregular
      heartbeat, swelling of the face, fingers, feet, or lower legs, trouble breathing,
      or weight gain. These may be symptoms of heart failure.
  - type: paragraph
    text: This medicine may cause hypoglycemia (low blood sugar). This is more common
      when this medicine is taken together with certain medicines. Low blood sugar
      must be treated before it causes you to pass out (unconsciousness). People feel
      different symptoms of low blood sugar . It is important that you learn which
      symptoms you usually have so you can treat it quickly. Talk to your doctor about
      the best way to treat low blood sugar.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      angioedema, and serious skin reactions. These conditions may be life-threatening
      and require immediate medical attention. Check with your doctor right away if
      you have a rash, itching, a large, hive-like swelling on the face, eyelids,
      lips, tongue, throat, hands, legs, feet, or sex organs, skin flaking or peeling,
      trouble breathing, or chest tightness while you are using this medicine.
  - type: paragraph
    text: Hyperglycemia (high blood sugar) may occur if you do not take enough or
      skip a dose of your medicine, overeat or do not follow your meal plan, have
      a fever or infection, or do not exercise as much as usual. High blood sugar
      can be very serious and must be treated right away . It is important that you
      learn which symptoms you have in order to treat it quickly. Talk to your doctor
      about the best way to treat high blood sugar.
  - type: paragraph
    text: This medicine may cause severe and disabling joint pain. Call your doctor
      right away if you have severe joint pain while using this medicine.
  - type: paragraph
    text: This medicine may cause bullous pemphigoid. Tell your doctor if you have
      large, hard skin blisters while using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - bladder pain
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - bloody or cloudy urine
      - blurred vision
      - body aches or pain
      - chills
      - cold sweats
      - confusion
      - cool, pale skin
      - cough
      - depression
      - difficult, burning, or painful urination
      - difficulty with breathing
      - dizziness
      - ear congestion
      - fast heartbeat
      - fever
      - frequent urge to urinate
      - headache
      - increased hunger
      - loss of voice
      - lower back or side pain
      - nasal congestion
      - nausea
      - nightmares
      - rapid weight gain
      - seizures
      - shakiness
      - slurred speech
      - sneezing
      - sore throat
      - stuffy or runny nose
      - tingling of the hands or feet
      - unusual tiredness or weakness
      - unusual weight gain or loss
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or tightness
      - constipation
      - darkened urine
      - decreased urine output
      - difficulty with swallowing
      - dilated neck veins
      - flaking or peeling of the skin
      - hives or skin rash
      - indigestion
      - irregular breathing
      - irregular heartbeat
      - large, hard skin blisters
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss of appetite
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - severe joint pain
      - swelling of face, fingers, feet, or lower leg
      - trouble breathing
      - vomiting
      - weight gain
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - pain or tenderness around the eyes and cheekbones
      - redness of the skin
      - weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
