title: Tocilizumab (intravenous route, subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Actemra
    - type: paragraph
      text: Avtozma
    - type: paragraph
      text: Tofidence
    - type: paragraph
      text: Tyenne
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Tocilizumab injection is used alone or together with other medicines to
      reduce the signs and symptoms of moderate to severe active rheumatoid arthritis.
      This medicine helps keep joint damage from getting worse after other medicines
      (eg, adalimumab, etanercept, infliximab) have been used and did not work well.
      It is a monoclonal antibody.
  - type: paragraph
    text: Tocilizumab injection is also used alone or together with glucocorticoids
      (steroid medicine) to treat giant cell arteritis (inflammation of the arteries).
      It can be used alone after stopping treatment with glucocorticoids.
  - type: paragraph
    text: Tocilizumab injection is also used to slow the rate of decline in lung function
      in patients with systemic sclerosis-associated interstitial lung disease (SSc-ILD).
  - type: paragraph
    text: Tocilizumab injection is also used alone or together with methotrexate to
      treat polyarticular juvenile idiopathic arthritis (PJIA) and systemic juvenile
      idiopathic arthritis (SJIA) in children 2 years of age and older. It is also
      used to treat severe or life-threatening cytokine release syndrome (CRS) in
      adults and children 2 years of age and older.
  - type: paragraph
    text: Tocilizumab injection is also used to treat coronavirus disease 2019 (COVID-19)
      in hospitalized adults and children 2 years of age and older who are receiving
      systemic corticosteroids and requiring supplemental oxygen and mechanical ventilation.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of tocilizumab injection in children
        2 years of age and older with PJIA , SJIA , CRS , and COVID-19 . However,
        safety and efficacy have not been established for other conditions and in
        children younger than 2 years of age with PJIA , SJIA , CRS , and COVID-19
        .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of tocilizumab injection in the elderly.
        However, elderly patients are more likely to have serious infections, which
        may require caution in patients receiving tocilizumab injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abatacept
      - Abemaciclib
      - Acalabrutinib
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Alfentanil
      - Anifrolumab-fnia
      - Astemizole
