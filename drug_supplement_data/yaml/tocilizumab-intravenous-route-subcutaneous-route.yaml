    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Protect this medicine from direct light. Keep it in its original package
        until you are ready to use it.
    - type: paragraph
      text: Throw away used syringes in a hard, closed container where the needles
        cannot poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure that this medicine is working properly. Blood
      and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: You or your child will need to have a skin test for tuberculosis before
      you start using this medicine. Tell your doctor if you or anyone in your home
      has ever had a positive reaction to a tuberculosis skin test.
  - type: paragraph
    text: This medicine will lower the number of some types of blood cells in your
      body. Because of this, you may bleed or get infections more easily. To help
      with these problems, avoid being near people who are sick or have infections.
      Wash your hands often. Stay away from rough sports or other situations where
      you could be bruised, cut, or injured. Brush and floss your teeth gently. Be
      careful when using sharp objects, including razors and fingernail clippers.
      Tell your doctor if you have any kind of infection before you start using this
      medicine. Also tell your doctor if you have ever had an infection that would
      not go away or an infection that keeps coming back.
  - type: paragraph
    text: Call your doctor right away if you or your child start to have a cough that
      would not go away, weight loss, night sweats, fever, chills, or flu-like symptoms,
      such as a runny or stuffy nose, headache, blurred vision, or feeling generally
      ill. These may be signs that you have an infection.
  - type: paragraph
    text: This medicine may cause serious stomach and bowel problems, especially if
      you have a history of ulcers or diverticulosis. Check with your doctor right
      away if you or your child start having severe stomach cramps or pain, black,
      tarry stools, diarrhea, fever, or vomiting that is severe and sometimes bloody
      while being treated with this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Using this medicine may increase your risk of having certain cancers. Talk
      to your doctor if you have unusual bleeding, bruising, or weakness, swollen
      lymph nodes in the neck, underarms, or groin, or unexplained weight loss. Also,
      check with your doctor right away if your skin has red, scaly patches, or raised
      bumps that are filled with pus.
  - type: paragraph
    text: Tocilizumab may cause headaches and skin reactions, such as a rash or itching,
      while you are receiving the injection or within 24 hours after you receive it.
      Check with your doctor or nurse right away if you or your child have any of
      these symptoms.
  - type: paragraph
    text: This medicine may cause serious types of allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you or your child have a rash, itching, hoarseness,
      trouble breathing, trouble swallowing, or any swelling of your hands, face,
      or mouth after using this medicine.
  - type: paragraph
    text: While you or your child are being treated with tocilizumab, and after you
      stop treatment with it, it is important to see your doctor about the immunizations
      (vaccinations) you should receive. Do not get any immunizations (vaccines) without
      your doctor's approval . Tocilizumab may lower your body's resistance, and there
      is a chance you might get the infection the vaccine is meant to prevent. In
      addition, you should not be around other persons living in your household who
      receive live virus vaccines because there is a chance that they could pass the
      virus on to you. Some examples of live vaccines include measles, mumps, influenza
      (nasal flu vaccine), poliovirus (oral form), rotavirus, and rubella. Do not
      get close to them and do not stay in the same room with them for very long.
      If you have questions about this, talk to your doctor.
  - type: paragraph
    text: This medicine may increase the amounts of cholesterol and fats in your blood.
      If this condition occurs, your doctor may give you some medicines that can lower
      their amounts. Talk to your doctor if you or your child have concerns.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
