      - swelling of the foot or leg
      - weight loss
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, loosening of the skin
      - bloating
      - dilated neck veins
