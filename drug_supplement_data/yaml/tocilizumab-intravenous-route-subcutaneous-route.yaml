    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Chronic inflammatory demyelinating polyneuropathy (nerve problem) or
      - Hyperlipidemia (high fats in the blood) or
      - Liver disease, history of or
      - Multiple sclerosis or
      - Neutropenia (low level of white blood cells) or
      - Stomach or bowel problems (eg, diverticulitis, perforations, ulcers) or
      - Thrombocytopenia (low number of platelets) or
      - Weak immune system (eg, HIV, cancer, or steroid use)—Use with caution. May
        make these conditions worse.
    - type: list
      ordered: false
      items:
      - Herpes zoster, history of or
      - Tuberculosis, history of—Use with caution. May cause infections to come back
        (reactivate).
    - type: list
      ordered: false
      items:
      - Infections (eg, hepatitis B, bacteria, virus, fungus), active or recurring
        or
      - Liver disease, active—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins to treat rheumatoid arthritis, giant cell arteritis, PJIA, SJIA, CRS,
      or COVID-19. It must be given slowly, so the needle will have to remain in place
      for at least 1 hour.
  - type: paragraph
    text: Tocilizumab injection may also be given as a shot under your skin to treat
      rheumatoid arthritis, SSc-ILD, PJIA, SJIA, or giant cell arteritis. It may sometimes
      be given at home to patients who do not need to be in the hospital or clinic.
      If you are using this medicine at home, your doctor or nurse will teach you
      how to inject the medicine. Be sure that you understand exactly how to use this.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow these instructions carefully. Ask your doctor or pharmacist if you
      have any questions.
  - type: paragraph
    text: This medicine is available in 2 forms. You may use a prefilled syringe or
      an autoinjector .
  - type: paragraph
    text: If you use this medicine at home, you will be shown the body areas where
      this shot can be given. Use a different body area each time you give yourself
      a shot. Keep track of where you give each shot to make sure you rotate body
      areas. This will help prevent skin problems. Do not inject into scars, moles,
      or skin areas that are red, bruised, tender, hard, or not intact.
  - type: paragraph
    text: Allow the prefilled syringe to warm to room temperature 30 minutes or the
      autoinjector for 45 minutes before using it. Do not warm it in any other way.
  - type: paragraph
    text: Check the liquid in the prefilled syringe or autoinjector. It should be
      clear and colorless or slightly yellow. Do not use it if it is cloudy, discolored,
      or has particles in it.
  - type: paragraph
    text: Use all of the medicine in each prefilled syringe or autoinjector. Use each
      prefilled syringe and autoinjector only one time. Do not save an open syringe
      or autoinjector.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form (prefilled syringe): For giant cell arteritis:
        Adults—162 milligrams (mg) injected under the skin once a week or once every
        other week. Your doctor may adjust your dose as needed and tolerated. Children—Use
        and dose must be determined by your doctor. For moderate to severe rheumatoid
        arthritis: Adults weighing 100 kilograms (kg) or more—162 milligrams (mg)
        injected under the skin once a week. Your doctor may adjust your dose as needed
        and tolerated. Adults weighing less than 100 kg—At first, 162 mg injected
        under the skin once every other week. Your doctor may increase the dose to
        162 mg once a week as needed and tolerated. Children—Use and dose must be
        determined by your doctor. For systemic sclerosis-associated interstitial
        lung disease: Adults—162 milligrams (mg) injected under the skin once a week.
        Your doctor may adjust your dose as needed and tolerated. Children—Use and
        dose must be determined by your doctor. For polyarticular juvenile idiopathic
        arthritis: Adults and children 2 years of age and older weighing 30 kilograms
        (kg) or more—162 milligrams (mg) injected under the skin once every 2 weeks.
        Children 2 years of age and older weighing less than 30 kg—162 milligrams
        (mg) injected under the skin once every 3 weeks. Children younger than 2 years
        of age—Use and dose must be determined by your doctor. For systemic juvenile
        idiopathic arthritis: Adults and children 2 years of age and older weighing
        30 kilograms (kg) or more—162 milligrams (mg) injected under the skin once
        a week. Children 2 years of age and older weighing less than 30 kg—162 milligrams
        (mg) injected under the skin once every 2 weeks. Children younger than 2 years
        of age—Use and dose must be determined by your doctor.'
    - type: list
