    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood vessel disease or
      - Diabetes—Use with caution. May cause severe redness or ulceration, especially
        on the hands or feet.
    - type: list
      ordered: false
      items:
      - Inflammation, irritation, or infection of the skin—Use of this medicine may
        cause severe irritation if applied to inflamed, irritated, or infected area
        of the skin.
    - type: list
      ordered: false
      items:
      - Influenza (flu) or
      - Varicella (chicken pox)—Should not be used in children and teenagers with
        the flu or chicken pox. There is a risk of Reye's syndrome.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Using this medicine for a long time over large areas could result
        in unwanted effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use it for a longer time than recommended
      on the label, unless otherwise directed by your doctor. To do so may increase
      the chance of absorption through the skin and the chance of salicylic acid poisoning.
  - type: paragraph
    text: This medicine is for use only on the skin. Do not get any of it in your
      eyes, nose, or mouth . Rinse it off with water right away if it does get on
      these areas.
  - type: paragraph
    text: Before using an OTC acne product for the first time, apply a small amount
      to one or two small affected areas of the skin for 3 days. If no discomfort
      occurs, follow the directions on the drug facts label of the product.
  - type: paragraph
    text: If your doctor has ordered an occlusive dressing (airtight covering, such
      as kitchen plastic wrap) to be applied over this medicine, make sure you know
      how to apply it. Since an occlusive dressing will increase the amount of medicine
      absorbed through your skin and the possibility of salicylic acid poisoning,
      use it only as directed. If you have any questions about this, check with your
      doctor.
  - type: paragraph
    text: Keep this medicine away from the eyes and other mucous membranes, such as
      the mouth and inside of the nose. If you should accidentally get some in your
      eyes or on other mucous membranes, immediately flush them with water for 15
      minutes.
  - type: paragraph
    text: 'To use the cream, lotion, or ointment :'
  - type: list
    ordered: false
    items:
    - Apply enough medicine to cover the affected area, and rub in gently.
  - type: paragraph
    text: 'To use the gel :'
  - type: list
    ordered: false
    items:
    - Before using salicylic acid gel, apply wet packs to the affected areas for at
      least 5 minutes. If you have any questions about this, check with your doctor.
    - Apply enough gel to cover the affected areas, and rub in gently.
  - type: paragraph
    text: 'To use the pad :'
  - type: list
    ordered: false
    items:
    - Wipe the pad over the affected areas.
    - Do not rinse off medicine after treatment.
  - type: paragraph
    text: 'To use the plaster for warts, corns, or calluses:'
  - type: list
    ordered: false
    items:
    - This medicine comes with patient instructions. Read them carefully before using.
    - Do not use this medicine on irritated skin or on any area that is infected or
      reddened. Also, do not use this medicine if you are a diabetic or if you have
      poor blood circulation.
    - Do not use this medicine on warts with hair growing from them or on warts on
      the face, in or on the genital (sex) organs, or inside the nose or mouth. Also
      do not use on moles or birthmarks. To do so may cause severe irritation.
    - Wash the area to be treated and dry thoroughly. Warts may be soaked in warm
      water for 5 minutes before drying.
    - Cut the plaster to fit the wart, corn, or callus and apply.
    - 'For corns and calluses: Repeat every 48 hours as needed for up to 14 days,
      or as directed by your doctor, until the corn or callus is removed. Corns or
      calluses may be soaked in warm water for 5 minutes to help in their removal.'
    - 'For warts: Depending on the product, either: Apply plaster and repeat every
      48 hours as needed, or Apply plaster at bedtime, leave in place for at least
      8 hours, remove plaster in the morning, and repeat every 24 hours as needed.
      Repeat for up to 12 weeks as needed, or as directed by your doctor, until wart
      is removed.'
    - If discomfort gets worse during treatment or continues after treatment, or if
      the wart spreads, check with your doctor.
  - type: list
    ordered: false
    items:
    - Repeat every 48 hours as needed for up to 14 days, or as directed by your doctor,
      until the corn or callus is removed.
    - Corns or calluses may be soaked in warm water for 5 minutes to help in their
      removal.
  - type: list
    ordered: false
    items:
    - 'Depending on the product, either: Apply plaster and repeat every 48 hours as
      needed, or Apply plaster at bedtime, leave in place for at least 8 hours, remove
      plaster in the morning, and repeat every 24 hours as needed.'
    - Repeat for up to 12 weeks as needed, or as directed by your doctor, until wart
      is removed.
  - type: list
    ordered: false
    items:
    - Apply plaster and repeat every 48 hours as needed, or Apply plaster at bedtime,
      leave in place for at least 8 hours, remove plaster in the morning, and repeat
      every 24 hours as needed.
  - type: list
    ordered: false
    items:
    - Apply plaster at bedtime, leave in place for at least 8 hours, remove plaster
      in the morning, and repeat every 24 hours as needed.
  - type: paragraph
    text: 'To use the shampoo :'
  - type: list
    ordered: false
    items:
    - Before applying this medicine, wet the hair and scalp with lukewarm water. Apply
      enough medicine to work up a lather and rub well into the scalp for 2 or 3 minutes,
      then rinse. Apply the medicine again and rinse thoroughly.
  - type: paragraph
    text: 'To use the soap :'
  - type: list
    ordered: false
    items:
    - Work up a lather with the soap, using hot water, and scrub the entire affected
      area with a washcloth or facial sponge or mitt.
    - If you are to use this soap in a foot bath, work up rich suds in hot water and
      soak the feet for 10 to 15 minutes. Then pat dry without rinsing.
  - type: paragraph
    text: 'To use the topical solution :'
  - type: list
    ordered: false
    items:
    - Wet a cotton ball or pad with the topical solution and wipe the affected areas.
    - Do not rinse off medicine after treatment.
  - type: paragraph
    text: 'To use the topical solution for warts, corns, or calluses:'
  - type: list
    ordered: false
    items:
    - This medicine comes with patient instructions. Read them carefully before using.
    - This medicine is flammable. Do not use it near heat or open flame or while smoking.
    - Do not use this medicine on irritated skin or on any area that is infected or
      reddened. Also, do not use this medicine if you are a diabetic or if you have
      poor blood circulation.
    - Do not use this medicine on warts with hair growing from them or on warts on
      the face, in or on the genital (sex) organs, or inside the nose or mouth. Also
      do not use on moles or birthmarks. To do so may cause severe irritation.
    - Avoid breathing in the vapors from the medicine.
    - Wash the area to be treated and dry thoroughly. Warts may be soaked in warm
      water for 5 minutes before drying.
    - Apply the medicine one drop at a time to completely cover each wart, corn, or
      callus. Let dry.
    - For warts—Repeat one or two times a day as needed for up to 12 weeks, or as
      directed by your doctor, until wart is removed.
    - For corns and calluses—Repeat one or two times a day as needed for up to 14
      days, or as directed by your doctor, until the corn or callus is removed.
    - Corns and calluses may be soaked in warm water for 5 minutes to help in their
      removal.
    - If discomfort gets worse during treatment or continues after treatment, or if
      the wart spreads, check with your doctor.
  - type: paragraph
    text: Unless your hands are being treated, wash them immediately after applying
      this medicine to remove any medicine that may be on them.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (cream): For corns and calluses: Adults—Use the 2
        to 10% cream as needed. Use the 25 to 60% cream once every 3 to 5 days. Children
        2 years of age and older—Use the 2 to 10% cream as needed. Use the 25 to 60%
        cream once every 3 to 5 days. Children younger than 2 years of age—Use is
        not recommended.'
      - 'For topical dosage form (gel): For acne: Adults—Use the 0.5 to 5% gel once
        a day. Children 2 years of age and older—Use the 0.5 to 5% gel once a day.
        Children younger than 2 years of age—Use is not recommended. For psoriasis:
        Adults—Use the 5% gel once a day. Children 2 years of age and older—Use the
        5% gel once a day. Children younger than 2 years of age—Use is not recommended.
        For common warts: Adults—Use the 5 to 26% gel one time a day. Children 2 years
        of age and older—Use the 5 to 26% gel one time a day. Children younger than
        2 years of age—Use is not recommended.'
      - 'For topical dosage form (lotion): For acne: Adults—Use the 1 to 2% lotion
        one to three times a day. Children 2 years of age and older—Use the 1 to 2%
        lotion one to three times a day Children younger than 2 years of age—Use is
        not recommended. For dandruff and antiseborrhic dermatitis of the scalp: Adults—Use
        the 1.8 to 2% lotion on the scalp one or two times a day. Children 2 years
        of age and older—Use the 1.8 to 2% lotion on the scalp one or two times a
        day. Children younger than 2 years of age—Use is not recommended.'
      - 'For topical dosage form (ointment): For acne: Adults—Use the 3 to 6% ointment
        as needed. Children 2 years of age and older—Use the 3 to 6% ointment as needed.
        Children younger than 2 years of age—Use is not recommended. For psoriasis
        and seborrheic dermatitis: Adults—Use the 3 to 10% ointment as needed. Children
        2 years of age and older—Use the 3 to 10% ointment as needed. Children younger
        than 2 years of age—Use is not recommended. For common warts: Adults—Use the
        3 to 10% ointment as needed. Use the 25 to 60% ointment one time every 3 to
        5 days. Children 2 years of age and older—Use the 3 to 10% ointment as needed.
        Use the 25 to 60% ointment one time every 3 to 5 days. Children younger than
        2 years of age—Use is not recommended.'
      - 'For pads dosage form: For acne: Adults—Use one to three times a day. Children
        2 years of age and older—Use one to three times a day. Children younger than
        2 years of age—Use is not recommended.'
      - 'For plaster dosage form: For corns, calluses, common warts, or plantar warts:
        Adults—Use once a day or once every other day. Children 2 years of age and
        older—Use once a day or once every other day. Children younger than 2 years
        of age—Use is not recommended.'
      - 'For shampoo dosage form: For dandruff or seborrheic dermatitis of the scalp:
        Adults—Use on the scalp one or two times a week. Children 2 years of age and
        older—Use on the scalp one or two times a week. Children younger than 2 years
        of age—Use is not recommended.'
      - 'For soap dosage form: For acne: Adults—Use as needed. Children 2 years of
        age and older—Use as needed. Children younger than 2 years of age—Use is not
        recommended.'
      - 'For topical solution dosage form: For acne: Adults—Use the 0.5 to 2% topical
        solution one to three times a day. Children 2 years of age and older—Use the
        0.5 to 2% topical solution one to three times a day. Children younger than
        2 years of age—Use is not recommended. For common warts and plantar warts:
        Adults—Use the 5 to 27% topical solution one or two times a day. Children
        2 years of age and older—Use the 5 to 27% topical solution one or two times
        a day. Children younger than 2 years of age—Use is not recommended. For corns
        and calluses: Adults—Use the 12 to 27% topical solution one or two times a
        day. Children 2 years of age and older—Use the 12 to 27% topical solution
        one or two times a day. Children younger than 2 years of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For corns and calluses: Adults—Use the 2 to 10% cream as needed. Use the
