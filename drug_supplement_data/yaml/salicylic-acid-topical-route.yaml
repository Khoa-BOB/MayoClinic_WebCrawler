    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if it become worse,
      check with your doctor.
  - type: paragraph
    text: 'When using salicylic acid, do not use any of the following preparations
      on the same affected area as this medicine , unless otherwise directed by your
      doctor:'
  - type: list
    ordered: false
    items:
    - Abrasive soaps or cleansers
    - Alcohol-containing preparations
    - Any other topical acne preparation or preparation containing a peeling agent
      (eg, benzoyl peroxide, resorcinol, sulfur, or tretinoin [vitamin A acid])
    - Cosmetics or soaps that dry the skin
    - Medicated cosmetics
    - Other topical medicine for the skin
  - type: paragraph
    text: To use any of the above preparations on the same affected area as salicylic
      acid may cause severe irritation of the skin.
  - type: paragraph
    text: This medicine may cause a serious condition called salicylate toxicity.
      This is more likely to occur especially in children, or if you have kidney disease
      or liver disease. Check with your doctor right away if you have nausea, vomiting,
      dizziness, loss of hearing, tinnitus, lethargy hyperpnea, diarrhea, and psychic
      disturbances.
  - type: paragraph
    text: Certain over-the-counter (OTC) acne products may cause rare and life-threatening
      allergic reactions. Check with your doctor right away if you have hives, itching,
      trouble breathing, swelling of the eyes, face, lips, or tongue, tightness in
      the throat, or feeling faint while using these products.
  - type: paragraph
    text: Do not use an OTC acne product again if you have developed a serious allergic
      reaction from it.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin irritation not present before use of this medicine (moderate or severe)
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficult breathing
      - dryness and peeling of skin
      - fainting
      - hives or itching
      - redness of the skin
      - swelling of the eyes, face, lips, or tongue
      - tightness in the throat
      - unusually warm skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - diarrhea
      - dizziness
      - fast or deep breathing
      - headache (severe or continuing)
      - hearing loss
      - lightheadedness
      - nausea
      - rapid breathing
      - ringing or buzzing in the ears (continuing)
      - severe drowsiness
      - stomach pain
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin irritation not present before use of this medicine (mild)
      - stinging
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
