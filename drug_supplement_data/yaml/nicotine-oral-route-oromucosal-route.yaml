    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Wrap used pieces of gum in paper and throw them away in the trash. If
        you remove a lozenge before it dissolves, wrap it in paper and throw it away
        in the trash. Make sure the gum or lozenge is out of the reach of children
        and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important to finish the program completely . If you need to use oral
      nicotine for a longer period of time, talk to your doctor.
  - type: paragraph
    text: Pregnant women should only use this medicine as directed by a doctor. Cigarette
      smoke can seriously harm your child. Try to stop smoking without using medicine.
      Although this medicine is believed to be safer than smoking, the risks to your
      child from this medicine are not fully known.
  - type: paragraph
    text: Nicotine products must be kept out of the reach of children and pets. Small
      amounts of nicotine can cause serious unwanted effects in children, and used
      gum or lozenges may contain enough nicotine to cause problems. If the gum or
      lozenges are swallowed, contact your doctor or poison control center at once.
  - type: paragraph
    text: If the chewing gum sticks to your dental work or causes loose fillings,
      check with your medical doctor or dentist.
  - type: paragraph
    text: This medicine contains sodium. Talk to your doctor if you are on a sodium-restricted
      diet.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - dizziness
      - headache
      - nervousness
      - pounding in the ears
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fast or irregular heartbeat
      - hives, itching, rash, redness, or swelling of the skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - fast heartbeat
      - nausea or vomiting
      - weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Mouth sores, blisters, or irritation
      - nausea or vomiting
      - sore throat
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - diarrhea
      - dizziness
      - heartburn
      - hiccups
      - mouth, tooth, jaw, or neck pain
      - problems with teeth
      - unusual tiredness or weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
