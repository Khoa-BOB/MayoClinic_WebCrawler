- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Nicotine oral chewing gum and lozenges are used to help you stop smoking.
      Nicotine is absorbed from the gum or lozenge in the mouth and enters the blood
      stream. This replaces the nicotine you would get from smoking and makes the
      withdrawal effects from not smoking less severe. The amount of nicotine is decreased
      over time until use is stopped.
  - type: paragraph
    text: This medicine is available without a prescription, but proof of age (18
      years or older) is required.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Gum
    - Lozenge/Troche
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of oral nicotine in the pediatric population. Safety and efficacy
        have not been established. Small amounts of nicotine can cause serious unwanted
        effects in children, and lozenges or gum contain enough nicotine to cause
        problems, including used pieces.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of oral nicotine in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Heart or blood vessel disease or
      - Hypertension (high blood pressure), uncontrolled or
      - Irritation of mouth or throat or
      - Loose dental fillings (gum only) or
      - Stomach ulcer—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Phenylketonuria (metabolic disorder)—Some of the lozenges contain phenylalanine,
        which may make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine exactly as directed in the dosing section on the label.
      Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: This medicine comes with a patient instruction booklet. Read and follow
      these instructions carefully.
  - type: paragraph
    text: It is also important to use a stop-smoking program that may include education,
      counseling, and psychological support. This may make it easier for you to stop
      smoking.
  - type: paragraph
    text: Begin using this medicine on your "quit" day, even if you are not able to
      stop smoking immediately.
  - type: paragraph
    text: 'Chewing gum :'
  - type: list
    ordered: false
    items:
    - If you have the urge to smoke, slowly chew one piece of gum until you notice
      a peppery taste or feel a slight tingling in your mouth.
    - Stop chewing and place (“park”) the gum between your cheek and gum. When the
      taste or tingling is almost gone, slowly chew the gum again until you taste
      it.
    - Continue chewing and “parking” the gum for about 30 minutes to get the full
      dose.
    - Do not chew too fast or chew more than one piece at a time.
    - Do not drink acidic beverages, such as citrus fruit juices, coffee, soft drinks,
      or tea within 15 minutes before or while chewing a piece of gum.
    - As your urge to smoke becomes less frequent, gradually reduce the pieces of
      gum used. Follow the dosing instructions on the label.
  - type: paragraph
    text: 'Lozenges :'
  - type: list
    ordered: false
    items:
    - Do not eat or drink for 15 minutes before using a lozenge.
    - If you have the urge to smoke, slowly suck one lozenge until it dissolves.
    - Do not bite or chew the lozenge like hard candy. Do not swallow the lozenge.
      Try not to swallow most of the dissolved medicine.
    - Do not use more than one lozenge at a time or many lozenges one after another.
    - As your urge to smoke becomes less frequent, gradually reduce the number of
      lozenges used. Follow the dosing instructions on the label.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'To help you stop smoking: For oral dosage form (gum): Adults and teenagers
        18 years or older—The dose will be provided on the label and is based on the
        number of cigarettes you smoke per day. Do not chew more than one piece (2
        milligrams (mg) or 4 mg) at a time. Do not use more than 24 pieces of gum
        per day. The amount of nicotine is decreased over time when you use fewer
        pieces. If you need to use the gum for a longer period of time than recommended
        on the label, talk to your doctor. Children—Use is not recommended. For oral
        dosage form (lozenge): Adults and teenagers 18 years or older—The dose will
        be provided on the label and is based on the number of cigarettes you smoke
        per day. Do not use more than one lozenge (2 milligrams (mg) or 4 mg) at a
        time. Do not use more than 5 lozenges in 6 hours or more than 20 lozenges
        per day. The amount of nicotine is decreased over time when you use fewer
        pieces. If you need to use the lozenges for a longer period of time than recommended
        on the label, talk to your doctor. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (gum): Adults and teenagers 18 years or older—The dose
        will be provided on the label and is based on the number of cigarettes you
        smoke per day. Do not chew more than one piece (2 milligrams (mg) or 4 mg)
        at a time. Do not use more than 24 pieces of gum per day. The amount of nicotine
        is decreased over time when you use fewer pieces. If you need to use the gum
        for a longer period of time than recommended on the label, talk to your doctor.
        Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers 18 years or older—The dose will be provided on the label
        and is based on the number of cigarettes you smoke per day. Do not chew more
        than one piece (2 milligrams (mg) or 4 mg) at a time. Do not use more than
