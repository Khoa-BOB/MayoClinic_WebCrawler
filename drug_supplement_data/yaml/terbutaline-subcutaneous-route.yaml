title: Terbutaline (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Brethine
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Terbutaline injection is used to prevent bronchospasm in patients 12 years
      of age and older with asthma, bronchitis, emphysema, and other lung diseases.
  - type: paragraph
    text: Terbutaline belongs to the family of medicines known as bronchodilators.
      Bronchodilators are medicines that relax the muscles in the bronchial tubes
      (air passages) of the lungs. They relieve cough, wheezing, shortness of breath,
      and troubled breathing by increasing the flow of air through the bronchial tubes.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use of terbutaline injection in children younger than 12 years of age
        is not recommended.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of terbutaline injection in the elderly.
        However, elderly patients are more likely to have age-related kidney, liver,
        or heart problems, which may require caution and an adjustment in the dose
        for patients receiving terbutaline injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acebutolol
      - Amphetamine
      - Arotinolol
      - Atenolol
      - Befunolol
      - Betaxolol
      - Bevantolol
      - Bisoprolol
      - Bopindolol
      - Bucindolol
      - Bupranolol
      - Carteolol
      - Carvedilol
      - Celiprolol
      - Dextroamphetamine
      - Dilevalol
      - Esmolol
      - Insulin Aspart, Recombinant
      - Iobenguane I 123
      - Labetalol
      - Landiolol
      - Levobunolol
      - Lisdexamfetamine
      - Mepindolol
      - Methacholine
      - Metipranolol
      - Metoprolol
      - Nadolol
      - Nebivolol
      - Oxprenolol
      - Penbutolol
      - Pindolol
      - Practolol
      - Propranolol
      - Sotalol
      - Talinolol
      - Tertatolol
      - Timolol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Heart or blood vessel disease or
      - Heart rhythm problems (e.g., arrhythmia) or
      - Hypertension (high blood pressure) or
      - Hyperthyroidism (overactive thyroid) or
      - Hypokalemia (low potassium in the blood) or
      - Ketoacidosis (high ketones in the blood) or
      - Seizures—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given as a shot under your skin (usually into the shoulder
      area).
  - type: paragraph
    text: This medicine may sometimes be given at home to patients who do not need
      to be in a hospital or clinic. If you are using this medicine at home, your
      doctor will teach you or someone who cares for you how to prepare and inject
      the medicine. Be sure that you understand exactly how the medicine is prepared
      and injected .
  - type: paragraph
    text: Use this medicine only as directed . Do not use more of it and do not use
      it more often than your doctor ordered. To do so may increase the chance of
      side effects.
  - type: paragraph
    text: If you are using this medicine for asthma, you should use another medicine
      that works faster for an asthma attack that has already started. If you do not
      have another medicine to use for an acute attack or if you have any questions
      about this, check with your doctor .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: For prevention of bronchospasm: Adults and teenagers—0.25
        milligrams (mg) injected under your skin. Your doctor may increase your dose
        as needed. However, the dose is usually not more than 0.5 mg within 4 hours.
        Children younger than 12 years of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For prevention of bronchospasm: Adults and teenagers—0.25 milligrams (mg)
        injected under your skin. Your doctor may increase your dose as needed. However,
        the dose is usually not more than 0.5 mg within 4 hours. Children younger
        than 12 years of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—0.25 milligrams (mg) injected under your skin. Your doctor
        may increase your dose as needed. However, the dose is usually not more than
        0.5 mg within 4 hours.
      - Children younger than 12 years of age—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store unopened vials of this medicine at room temperature, away from heat
        and direct light. Do not freeze. An open vial of medicine must be used right
        away.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away used needles in a hard, closed container that the needles cannot
        poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child at regular visits . This will allow your doctor to see if the medicine
      is working properly and to check for any unwanted effects caused by the medicine.
  - type: paragraph
    text: Using this medicine to prevent or treat preterm labor can harm pregnant
      women. This medicine may increase risk of heart problems and other serious side
      effects when given to a pregnant woman for a long time. Use an effective form
      of birth control to keep from getting pregnant. If you think you have become
      pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: Check with your doctor at once if difficulty with breathing continues after
      using a dose of this medicine or if your condition gets worse.
  - type: paragraph
    text: You may also be taking an anti-inflammatory medicine (e.g., corticosteroids)
      for asthma along with this medicine. Do not stop taking the anti-inflammatory
      medicine even if your asthma seems better, unless you are told to do so by your
      doctor.
  - type: paragraph
    text: If you develop a skin rash, hives, or any allergic reaction to this medicine,
      stop using the medicine and check with your doctor right away.
  - type: paragraph
    text: 'Hypokalemia may occur while you are using this medicine. Check with your
      doctor right away if you have more than one of the following symptoms: convulsions;
      decreased urine; dry mouth; increased thirst; irregular heartbeat; loss of appetite;
      mood changes; muscle pain or cramps; nausea or vomiting; numbness or tingling
      in the hands, feet, or lips; shortness of breath; or unusual tiredness or weakness.'
  - type: paragraph
    text: This medicine may affect blood sugar levels. If you are diabetic and notice
      a change in the results of your blood or urine sugar tests, check with your
      doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      for appetite control, asthma, colds, cough, hay fever, or sinus problems, and
      herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fast, irregular, pounding, or racing heartbeat or pulse
      - nervousness
      - shakiness in the legs, arms, hands, or feet
      - trembling or shaking of the hands or feet
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest discomfort
      - difficult or labored breathing
      - feeling of warmth
      - redness of the face, neck, arms, and occasionally, upper chest
      - shortness of breath
      - sweating
      - tightness in the chest
      - wheezing
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm, back, or jaw pain
      - blurred vision
      - chest pain
      - chest tightness or heaviness
      - confusion
      - convulsions
      - decreased urine
      - dizziness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dry mouth
      - fainting
      - general feeling of discomfort or illness
      - headache
      - increased thirst
      - loss of appetite
      - mood changes
      - muscle pain or cramps
      - nausea or vomiting
      - numbness or tingling in the hands, feet, or lips
      - seizures
      - sleeplessness
      - trouble sleeping
      - unable to sleep
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Drowsiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain at the injection site
      - weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - fever
      - redness, soreness, or itching skin
      - sores, welting, or blisters
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
