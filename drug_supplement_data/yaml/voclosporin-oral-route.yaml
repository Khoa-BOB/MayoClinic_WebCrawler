    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart rhythm problems or
      - Hyperkalemia (high levels of potassium in the blood) or
      - Hypertension (high blood pressure)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease, mild or moderate—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Avoid use in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. Do not stop taking or change your dose without checking first
      with your doctor.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the capsule whole. Do not crush, break, chew, or dissolve it.
  - type: paragraph
    text: It is best to take this medicine on an empty stomach, either 1 hour before
      or 2 hours after a meal.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For active lupus nephritis: Adults—23.7
        milligrams (mg) 2 times a day at least 12 hours apart. Do not take it less
        than 8 hours apart. Your doctor may adjust your dose as needed and tolerated.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For active lupus nephritis: Adults—23.7 milligrams (mg) 2 times a day at
        least 12 hours apart. Do not take it less than 8 hours apart. Your doctor
        may adjust your dose as needed and tolerated. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—23.7 milligrams (mg) 2 times a day at least 12 hours apart. Do not
        take it less than 8 hours apart. Your doctor may adjust your dose as needed
        and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is less than 4 hours , take it as soon as possible.
        If you miss a dose and it is more than 4 hours , skip the missed dose and
        take your next dose at the regular time.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep this medicine in its original container.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: Do not use this medicine if you are also using cyclophosphamide or medicine
      to treat infections (eg, clarithromycin, itraconazole, ketoconazole, (Biaxin®,
      Sporanox®, Nizoral®).
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant during treatment.
      If you think you have become pregnant while using the medicine, tell your doctor
      right away.
  - type: paragraph
    text: This medicine may increase your risk for certain cancers, including lymphoma
      or skin cancer. Avoid sun exposure. Use a sunscreen when you are outdoors. Avoid
      sunlamps and tanning beds. Talk to your doctor if you have concerns about this
      risk.
  - type: paragraph
    text: Your body's ability to fight infection may be reduced while you are being
      treated with voclosporin. It is very important that you call your doctor at
      the first signs of any infection. Check with your doctor right away if you or
      your child have fever, chills, cough or hoarseness, flu-like symptoms, lower
      back or side pain, painful or difficult urination, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause serious kidney problems. Check with your doctor
      right away if you have blood in your urine, change in frequency of urination
      or amount of urine, difficulty in breathing, drowsiness, increased thirst, loss
      of appetite, nausea or vomiting, swelling of the feet or lower legs, or weakness.
  - type: paragraph
    text: This medicine may cause high blood pressure. Check with your doctor right
      away if you have blurred vision, dizziness, headache, nervousness, pounding
      in the ears, or slow or fast heartbeat.
  - type: paragraph
    text: This medicine may cause serious nervous system problems (eg, posterior reversible
      encephalopathy syndrome). Check with your doctor right away if you have blurred
      or double vision, difficulty in walking, headache, jaw pain, numbness or tingling
      in the fingers and toes, pain in the fingers and toes, pain the testicles, or
      weakness.
  - type: paragraph
    text: Tell your doctor right away if you have confusion, difficult breathing,
      irregular heartbeat, nausea or vomiting, nervousness, numbness or tingling in
      the hands, feet, or lips, stomach pain, or weakness or heaviness of the legs.
      These may be symptoms of hyperkalemia.
  - type: paragraph
    text: This medicine may cause heart rhythm problems (eg, QT prolongation). Check
      with your doctor right away if you have chest pain or discomfort, fainting,
      irregular or slow heart rate, or trouble breathing.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Check with your doctor right away if you have chest tightness, cough,
      difficulty swallowing, dizziness, fast heartbeat, hives, itching, skin rash,
      large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
      legs, feet, or sex organs, puffiness or swelling of the eyelids or around the
      eyes, face, lips, or tongue, trouble breathing, or unusual tiredness or weakness.
  - type: paragraph
    text: While you are being treated with voclosporin, and after you stop treatment
      with it, do not have any immunizations (vaccinations) without your doctor's
      approval. Voclosporin may lower your body's resistance and there is a chance
      you might get the infection the immunization is meant to prevent. In addition,
      other persons living in your household should not take or should not have taken
      oral polio vaccine within the last several months since there is a chance they
      could pass the polio virus on to you. Also, avoid other persons who have taken
      oral polio vaccine. Do not get close to them and do not stay in the same room
      with them for very long. If you cannot take these precautions, you should consider
      wearing a protective face mask that covers the nose and mouth.
  - type: paragraph
    text: This medicine may cause a blood disorder called pure red cell aplasia. Check
      with your doctor right away if you have fever, sore throat, pale skin, unusual
      bleeding or bruising, or unusual tiredness or weakness.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - anxiety
      - back pain
      - black, tarry stools
      - bloody or cloudy urine
      - blurred vision
      - body aches or pain
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - change in frequency of urination or amount of urine
      - chest pain or discomfort
      - chills
      - coma
      - confusion
      - cough
      - decreased urine output
      - diarrhea
      - difficult, burning, or painful urination
      - dizziness
      - drowsiness
      - dry mouth
      - ear congestion
      - fainting
      - fever
      - frequent urge to urinate
      - general feeling of illness
      - hallucinations
      - headache
      - hostility
      - increased thirst
      - irregular or slow heart rate
      - irritability
      - loss of appetite
      - loss of voice
      - lower back or side pain
      - mood or mental changes
      - muscle twitching
      - nausea or vomiting
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - painful blisters on trunk of body
      - pale skin
      - pounding in the ears
      - rapid weight gain
      - restlessness
      - seizures
      - slow or fast heartbeat
      - sneezing
      - sore throat
      - stiff neck
      - stomach pain
      - stuffy or runny nose
      - swelling of the face, feet, lower legs, ankles, or hands
      - swollen glands
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - weakness or heaviness of the legs
      - weight loss
      - yellow skin and eyes
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Persistent non-healing sore
      - pink growth
      - reddish patch or irritated area
      - shakiness in the legs, arms, hands, feet
      - shiny bump
      - trembling or shaking of the hands or feet
      - white, yellow or waxy scar-like area
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - difficulty swallowing
      - hives, itching, skin rash
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - hair loss, thinning of hair
      - heartburn
      - indigestion
      - stomach discomfort or upset
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased appetite
      - irritation or soreness of the mouth
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
