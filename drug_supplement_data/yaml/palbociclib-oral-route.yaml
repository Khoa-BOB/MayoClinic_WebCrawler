title: Palbociclib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ibrance
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Palbociclib is used to treat hormone receptor (HR)-positive, HER-2 negative
      advanced or metastatic (cancer that has spread) breast cancer. This medicine
      is used in combination with an aromatase inhibitor (eg, letrozole) as first
      hormonal based treatment or with fulvestrant in patients with disease progression
      following hormonal treatment.
  - type: paragraph
    text: Palbociclib is also used in combination with other medicines (eg, inavolisib,
      fulvestrant) to treat hormone receptor (HR)-positive, HER-2 negative, and PIK3CA-mutated
      locally advanced or metastatic (cancer that has spread) breast cancer in patients
      with disease progression during or after hormonal treatment.
  - type: paragraph
    text: Palbociclib belongs to the group of medicines called antineoplastics. It
      interferes with the growth of cancer cells, which are eventually destroyed.
      Since the growth of normal cells may also be affected by the medicine, other
      unwanted effects will also occur. Some of these may be serious and must be reported
      to your doctor.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of palbociclib in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of palbociclib in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Abemaciclib
      - Acalabrutinib
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Alfentanil
      - Alprazolam
      - Amiodarone
      - Apalutamide
      - Astemizole
      - Atorvastatin
      - Avacopan
      - Axitinib
      - Bedaquiline
      - Benzhydrocodone
      - Boceprevir
      - Bosutinib
      - Brigatinib
      - Budesonide
      - Buprenorphine
      - Carbamazepine
      - Ceritinib
      - Cholera Vaccine
      - Cisapride
      - Clarithromycin
      - Clindamycin
      - Clozapine
      - Cobicistat
      - Cobimetinib
      - Codeine
      - Colchicine
      - Conivaptan
      - Crizotinib
      - Cyclosporine
      - Dasatinib
      - Dexlansoprazole
      - Dihydrocodeine
      - Dihydroergotamine
      - Docetaxel
      - Dofetilide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Infection—May decrease your body's ability to fight infection.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use with caution. The effects may be increased because
        of the slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Lung problems (eg, interstitial lung disease, pneumonitis)—Use with caution.
        May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before using this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Palbociclib is given together with letrozole or fulvestrant, or inavolisib
      and fulvestrant. It is important that you take each medicine at the right time
      . Follow your doctor's instructions on when to take these medicines.
  - type: paragraph
    text: Your doctor may also give you other medicines (eg, luteinizing hormone-releasing
      hormone agonists) in combination with palbociclib plus letrozole or fulvestrant,
      or inavolisib and fulvestrant if you are a pre/perimenopausal woman or a man.
  - type: paragraph
    text: Swallow the capsule or tablet whole. Do not open, crush, break, or chew
      it.
  - type: paragraph
    text: Take the oral capsules with food. Take the oral tablets with or without
      food.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules or tablets): For breast cancer: Adults—125
        milligrams (mg) once a day for 21 days, followed by 7 days without medicine.
        Your doctor may adjust your dose as needed and tolerated. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For breast cancer: Adults—125 milligrams (mg) once a day for 21 days, followed
        by 7 days without medicine. Your doctor may adjust your dose as needed and
        tolerated. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—125 milligrams (mg) once a day for 21 days, followed by 7 days without
        medicine. Your doctor may adjust your dose as needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose or vomit after you take this medicine, do not take
        another dose on the same day. Wait until your next dose and take it when you
        normally would.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Women
      must have a pregnancy test before using this medicine. Use an effective form
      of birth control to keep from getting pregnant during treatment and for at least
      3 weeks after your last dose. Males who are using this medicine with female
      partners who can become pregnant must use effective birth control during treatment
      and for at least 3 months after the last dose. If you think you or your partner
      have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: If you plan to have children, talk with your doctor before using this medicine.
      Some men using this medicine have become infertile (unable to have children).
  - type: paragraph
    text: Palbociclib can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. If you can, avoid people
      with infections. Check with your doctor immediately if you think you are getting
      an infection or if you get a fever or chills, cough or hoarseness, lower back
      or side pain, or painful or difficult urination.
  - type: paragraph
    text: Interstitial lung disease or pneumonitis can occur while using this medicine.
      This can be life-threatening and requires immediate medical attention. Check
      with your doctor right away if you have chest pain, cough, difficulty with breathing,
      fever or chills while using this medicine.
  - type: paragraph
    text: Do not change your dose or stop using this medicine without checking first
      with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bladder pain
      - bleeding gums
      - blood in the urine or stools
      - bloody or cloudy urine
      - chest pain
      - chills
      - cough
      - diarrhea
      - difficult, burning, or painful urination
      - difficulty breathing
      - fever
      - frequent urge to urinate
      - hoarseness
      - headache
      - loss of taste or smell
      - loss of voice
      - lower back or side pain
      - nausea or vomiting
      - nosebleeds
      - painful or difficult urination
      - pale skin
      - pinpoint red spots on the skin
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stuffy or runny nose
      - swelling or inflammation of the mouth
      - swollen glands
      - trouble breathing
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - General feeling of discomfort or illness
      - redness, swelling, or pain of the skin
      - scaling of the skin on the hands and feet
      - thickening of bronchial secretions
      - tingling of the hands and feet
      - ulceration of the skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - decreased appetite
      - dry skin
      - hair loss or thinning of the hair
      - increased tearing
      - lack or loss of strength
      - loss of or change in taste
      - skin rash
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry eye
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
