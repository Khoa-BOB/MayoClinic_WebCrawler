title: Cetirizine and pseudoephedrine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: ZyrTEC-D
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cetirizine and pseudoephedrine is a combination of an antihistamine and
      a decongestant used to treat the symptoms of seasonal or yearly allergies. Antihistamines
      work by preventing the effects of a substance called histamine, which is produced
      by the body. Histamine can cause itching, sneezing, runny nose, and watery eyes.
      Decongestants produce a narrowing of blood vessels. This leads to clearing of
      nasal congestion, but it may also cause an increase in blood pressure in patients
      who have high blood pressure.
  - type: paragraph
    text: This medicine is available without a prescription.
  - type: paragraph
    text: Do not give any over-the-counter (OTC) cough and cold medicine to a baby
      or child under 4 years of age. Using these medicines in very young children
      might cause serious or possibly life-threatening side effects .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use is not recommended in infants and children up to 12 years of age.
        In children 12 years of age and older, this medicine is not expected to cause
        different side effects or problems than it does in adults.
    - type: paragraph
      text: Do not give any over-the-counter (OTC) cough and cold medicine to a baby
        or child under 4 years of age. Using these medicines in very young children
        might cause serious or possibly life-threatening side effects .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of cetirizine and pseudoephedrine
        in the elderly with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Dihydroergotamine
      - Furazolidone
      - Iproniazid
      - Isocarboxazid
      - Linezolid
      - Methylene Blue
      - Moclobemide
      - Nialamide
      - Phenelzine
      - Procarbazine
      - Rasagiline
      - Safinamide
      - Selegiline
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acepromazine
      - Alfentanil
      - Alprazolam
      - Amobarbital
      - Amphetamine
      - Anileridine
      - Aripiprazole
      - Asenapine
      - Baclofen
      - Benperidol
      - Benzhydrocodone
      - Bromazepam
      - Buprenorphine
      - Buspirone
      - Butabarbital
      - Butalbital
      - Butorphanol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Carisoprodol
      - Carphenazine
      - Chloral Hydrate
      - Chlordiazepoxide
      - Chlorpromazine
      - Chlorzoxazone
      - Clobazam
      - Clomipramine
      - Clonazepam
      - Clorazepate
      - Clozapine
      - Codeine
      - Cyclobenzaprine
      - Cyproheptadine
      - Daridorexant
      - Dexmedetomidine
      - Dextroamphetamine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease—Removal of cetirizine and pseudoephedrine from the body may
        be reduced
    subsections: []
  - heading: For cetirizine
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Liver disease—May be worsened by cetirizine
    subsections: []
  - heading: For pseudoephedrine
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Heart disease or
      - High blood pressure or
      - Inner eye pressure or
      - Narrow-angle glaucoma or
      - Urination difficulties or
      - Prostate, enlarged or
      - Thyroid problems—May be worsened by pseudoephedrine
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: paragraph
      text: Swallow the extended-release tablet whole. Do not crush, break, or chew
        before swallowing.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended release tablets): For relief of symptoms from
        seasonal or yearly allergies: Adults and children 12 years of age and older—Take
        one tablet two times a day with or without food. Children 4 to 12 years of
        age—Use and dose must be determined by your doctor. Children and infants up
        to 4 years of age—Use is not recommended .'
    - type: list
      ordered: false
      items:
      - 'For relief of symptoms from seasonal or yearly allergies: Adults and children
        12 years of age and older—Take one tablet two times a day with or without
        food. Children 4 to 12 years of age—Use and dose must be determined by your
        doctor. Children and infants up to 4 years of age—Use is not recommended .'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—Take one tablet two times a
        day with or without food.
      - Children 4 to 12 years of age—Use and dose must be determined by your doctor.
      - Children and infants up to 4 years of age—Use is not recommended .
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: The antihistamine in this medicine will add to the effects of alcohol and
      other CNS depressants including tricyclic antidepressants (medicines that slow
      down the nervous system, possibly causing drowsiness). Some examples of CNS
      depressants are other antihistamines or medicine for hay fever, other allergies,
      or colds; sedatives, tranquilizers, or sleeping medicine; prescription pain
      medicine or narcotics; barbiturates; medicine for seizures; muscle relaxants;
      or anesthetics, including some dental anesthetics. Examples of Tricyclic antidepressants
      are amitriptyline [e.g. Elavil], amoxapine [e.g. Asendin], clomipramine [e.g.
      Anafranil], desipramine [e.g. Pertofrane], doxepine [e.g. Sinequan], imipramine
      [e.g. Tofranil], nortriptyline [e.g. Aventyl], protriptyline [Vivactil], trimipramine
      [e.g. Surmontil]. Check with your doctor before taking any of the above while
      you are taking this medicine.
  - type: paragraph
    text: The antihistamine in this medicine may cause some people to become drowsy,
      dizzy, or less alert than they are normally. Make sure you know how you react
      to this medicine before you drive, use machines, or do anything else that could
      be dangerous if you are dizzy or are not alert.
  - type: paragraph
    text: Antihistamines may cause dryness of the mouth, nose, and throat. For temporary
      relief, use sugarless candy or gum, melt bits of ice in your mouth, or use a
      saliva substitute. However, if your mouth continues to feel dry for more than
      2 weeks, check with your dentist. Continuing dryness of the mouth may increase
      the chance of dental disease, including tooth decay, gum disease, and fungus
      infections.
  - type: paragraph
    text: The decongestant in this medicine may cause some people to be nervous or
      restless or to have trouble in sleeping. If you have trouble in sleeping, take
      the last dose of this medicine for each day a few hours before bedtime. If you
      have any questions about this, check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Get emergency help immediately if any of the following symptoms of overdose
      occur:'
  subsections:
  - heading: Symptoms of Overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in mood, irrational behavior, depersonalization hallucinations
      - convulsions (seizures)
      - extreme sleepiness or unusual drowsiness
      - fast, slow, pounding, or irregular heartbeat or pulse
      - feeling anxious
      - giddiness
      - headache
      - irritability
      - muscle weakness or tenderness
      - nausea
      - restlessness
      - shallow, irregular, fast, or slow breathing
      - sleeplessness or trouble in sleeping
      - abdominal and/or chest pain
      - thirst
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Breathing, troubled
      - back, leg, or stomach pain
      - blurred vision
      - bloody, cloudy, or dark urine, sudden decrease in amount of urine
      - black, tarry stools, diarrhea, light-colored stools
      - confusion
      - dizziness, feeling faint, or lightheaded
      - fever or chills
      - increased blood pressure
      - rapid weight gain
      - skin rash or hives
      - swelling of face, mouth, throat, fingers, glands, feet, and/or lower legs
      - stillbirth
      - twitching, twisting, or uncontrolled repetitive movements of the face
      - sudden sweating
      - vomiting blood, bleeding gums, nosebleeds, unusual bleeding or bruising
      - pale or yellow eyes or skin
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More Common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sleepiness or unusual drowsiness, extreme tiredness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry mouth
      - weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - sore throat
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
