title: Sodium phenylbutyrate (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Buphenyl
    - type: paragraph
      text: Olpruva
    - type: paragraph
      text: Pheburane
    - type: paragraph
      text: SPB11
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Sodium phenylbutyrate is used together with a proper diet to help treat
      urea cycle disorders, including carbamylphosphate synthetase deficiency (CPS),
      ornithine transcarbamylase deficiency (OTC), or argininosuccinate synthetase
      (AS).
  - type: paragraph
    text: Ammonia is formed from the breakdown of protein in the body. If the ammonia
      cannot be removed by the body, then a buildup may cause serious unwanted effects.
      This medicine works by helping to reduce high levels of ammonia in the blood.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Packet
    - Powder
    - Tablet
    - Pellet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Olpruva™ in children weighing
        20 kilograms (kg) or more and with a body surface area (BSA) of 1.2 square
        meter (m 2 ). Safety and efficacy have been established. Use is not recommended
        to treat acute hyperammonemia in children, in children weighing less than
        20 kg, and in children weighing 20 kg or more with a BSA of less than 1.2
        m 2 .
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Pheburane® in children. Safety
        and efficacy have been established. Use is not recommended to treat acute
        hyperammonemia in children.
    - type: paragraph
      text: Because of Buphenyl® s toxicity, use in children weighing less than 20
        kilograms (44 pounds) is not recommended.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Pheburane® and Olpruva™ in the
        elderly. However, elderly patients are more likely to have age-related liver,
        kidney, or heart problems, which may require caution and an adjustment in
        the dose for patients receiving this medicine.
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of Buphenyl® in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Probenecid
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Edema (swelling from excess fluids in the body) or
      - Fructose intolerance, history of or
      - Glucose-galactose malabsorption, history of or
      - Heart disease or
      - Heart failure or
      - Kidney disease, severe or
      - Sucrase-isomaltase insufficiency, history of—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects. Also,
      do not stop using this medicine without checking first with your doctor.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions in the insert carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: 'For patients taking the powder form of this medicine:'
  - type: list
    ordered: false
    items:
    - Sodium phenylbutyrate should be mixed with water or any food (solid or liquid).
      If the medicine is mixed with food, it should be taken right away. However,
      if it is mixed with water, the solution can be stored for up to one week at
      room temperature or in the refrigerator.
    - Shake the mixed solution lightly before each use. Measure the dose with the
      level teaspoon or tablespoon that comes together with the package of this medicine.
  - type: paragraph
    text: Take this medicine with food.
  - type: paragraph
    text: 'To use the Olpruva™ oral liquid:'
  - type: list
    ordered: false
    items:
    - Pour the entire contents of the Mix-Aid packet into 4 ounces of water in a cup
      and stir with spoon for 30 seconds to make the water thicker.
    - Add the Olpruva™ in the mixture and stir for 15 seconds. Take the mixture within
      5 minutes to prevent the coating from dissolving.
    - Pour another 4 ounces of water in the cup to make sure you get full dose.
    - Throw away the mixture if you have not taken it within 30 minutes of mixing.
    - Do not give this medicine through a feeding tube.
  - type: paragraph
    text: 'To use the Pheburane® oral pellets:'
  - type: list
    ordered: false
    items:
    - Measure the medicine with a marked measuring spoon.
    - You may swallow the oral pellets with a drink (eg, water, fruit juices, protein-free
      infant formulas) or you may sprinkle the pellets with apple sauce or carrot
      puree. Take the mixture right away.
    - Do not chew the pellets directly or mix with liquids.
  - type: paragraph
    text: It is important that you follow any special instructions from your doctor,
      such as following a low-protein diet. Also, your doctor may recommend that you
      take amino acid supplements. If you have any questions about this, check with
      your doctor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For the treatment of urea cycle disorders: For oral dosage form (pellets):
        Adults and children weighing 20 kilograms (kg) or more—Dose is based on body
        size and must be determined by your doctor. The dose is usually 9.9 to 13
        grams (g) per square meter (m[2]) per day divided into 3 to 6 doses. However,
        the dose is usually not more than 20 g per day. Children weighing less than
        20 kg—Dose is based on weight and must be determined by your doctor. The dose
        is usually 450 to 600 milligrams per kilogram (mg/kg) of body weight per day
        divided into 3 to 6 doses. However, the dose is usually not more than 20 g
        per day. For oral dosage form (powder for solution): Adults, teenagers, and
        children weighing 20 kilograms (kg) (44 pounds) or more—The dose is based
        on body size and must be determined by your doctor. It is usually given 4
        to 6 times a day. However, the dose is usually not more than 20 grams a day.
        Children weighing up to 20 kg (44 pounds)—The dose is based on body weight
        and must be determined by your doctor. The usual dose is 450 to 600 milligrams
        (mg) per kilogram (kg) (205 to 273 mg per pound) of body weight per day. The
        dose is divided in equal amounts and given 3 to 6 times a day. However, the
        dose is usually not more than 20 grams a day. For oral dosage form (suspension):
        Adults and children weighing 20 kilograms (kg) or more—The dose is based on
        body size and must be determined by your doctor. The usual dose is 9.9 to
        13 grams (g) per square meter (m[2]) per day divided into 3 to 6 doses. However,
        the dose is usually not more than 20 g per day. Children weighing less than
        20 kg—Use of the suspension is not recommended. For oral dosage form (tablets):
        Adults, teenagers, and children weighing 20 kg (44 pounds) or more—The dose
        is based on body size and must be determined by your doctor. It is usually
        given 3 times a day. However, the dose is usually not more than 20 grams (40
        tablets) a day. Children weighing up to 20 kg (44 pounds)—Use of the tablets
        is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (pellets): Adults and children weighing 20 kilograms
        (kg) or more—Dose is based on body size and must be determined by your doctor.
        The dose is usually 9.9 to 13 grams (g) per square meter (m[2]) per day divided
        into 3 to 6 doses. However, the dose is usually not more than 20 g per day.
        Children weighing less than 20 kg—Dose is based on weight and must be determined
        by your doctor. The dose is usually 450 to 600 milligrams per kilogram (mg/kg)
        of body weight per day divided into 3 to 6 doses. However, the dose is usually
        not more than 20 g per day.'
      - 'For oral dosage form (powder for solution): Adults, teenagers, and children
        weighing 20 kilograms (kg) (44 pounds) or more—The dose is based on body size
        and must be determined by your doctor. It is usually given 4 to 6 times a
        day. However, the dose is usually not more than 20 grams a day. Children weighing
        up to 20 kg (44 pounds)—The dose is based on body weight and must be determined
        by your doctor. The usual dose is 450 to 600 milligrams (mg) per kilogram
        (kg) (205 to 273 mg per pound) of body weight per day. The dose is divided
        in equal amounts and given 3 to 6 times a day. However, the dose is usually
        not more than 20 grams a day.'
      - 'For oral dosage form (suspension): Adults and children weighing 20 kilograms
        (kg) or more—The dose is based on body size and must be determined by your
        doctor. The usual dose is 9.9 to 13 grams (g) per square meter (m[2]) per
        day divided into 3 to 6 doses. However, the dose is usually not more than
        20 g per day. Children weighing less than 20 kg—Use of the suspension is not
        recommended.'
      - 'For oral dosage form (tablets): Adults, teenagers, and children weighing
        20 kg (44 pounds) or more—The dose is based on body size and must be determined
        by your doctor. It is usually given 3 times a day. However, the dose is usually
        not more than 20 grams (40 tablets) a day. Children weighing up to 20 kg (44
        pounds)—Use of the tablets is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children weighing 20 kilograms (kg) or more—Dose is based on body
        size and must be determined by your doctor. The dose is usually 9.9 to 13
        grams (g) per square meter (m[2]) per day divided into 3 to 6 doses. However,
