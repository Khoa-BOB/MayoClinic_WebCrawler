      - Children weighing up to 20 kg (44 pounds)—Use of the tablets is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: 'Pheburane® oral pellets : If you have less than 3 hours before your next
        scheduled dose, skip the missed dose and go back to your regular dosing schedule.'
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away unused Pheburane® oral pellets 45 days after opening the bottle.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause nervous system problems. Check with your doctor
      right away if you have confusion, headache, lightheadedness, nausea, sleepiness,
      tiredness, or vomiting.
  - type: paragraph
    text: In case of emergency—There may be a time when you need emergency help for
      a problem caused by your urea cycle disorders. You need to be prepared for these
      emergencies. It is a good idea to wear a Medic Alert tag at all times. Also,
      carry an ID card in your wallet or purse that says you have this disease and
      a list of all of your medicines.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in the frequency of breathing
      - lack of or irregular menstruation
      - lower back, side, or stomach pain
      - mood or mental changes
      - muscle pain or twitching
      - nausea or vomiting
      - nervousness or restlessness
      - swelling of the feet or lower legs
      - unpleasant taste
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Absent, missed, or irregular menstrual periods
      - black, tarry stools
      - bleeding gums
      - bloating
      - blood in the urine or stools
      - bone pain
      - burning, tingling, numbness or pain in the hands, arms, feet, or legs
      - chest pain or tightness
      - chills
      - constipation
      - cough
      - darkened urine
      - discouragement
      - dizziness
      - fainting
      - fast heartbeat
      - feeling sad or empty
      - fever
      - headache
      - indigestion
      - irritability
      - joint pain, stiffness, or swelling
      - large, flat, blue or purplish patches in the skin
      - loss of appetite
      - loss of interest or pleasure
      - mood changes
      - muscle pain, cramps, or twitching
      - numbness or tingling in hands, feet, or lips
      - pains in stomach, side, or abdomen, possibly radiating to the back
      - painful or difficult urination
      - pinpoint red spots on the skin
      - rectal bleeding
      - seizures
      - sensation of pins and needles
      - severe or continuing stomach pain
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stabbing pain
      - stopping of menstrual bleeding
      - swelling of the feet or lower legs
      - swollen or painful glands
      - trouble breathing
      - trouble concentrating
      - trouble sleeping
      - uneven heartbeat
      - unusual bleeding or bruising
      - yellow eyes or skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dryness of the mouth
      - fast, slow, or irregular heartbeat
      - increased thirst
      - swelling of the face
      - unusual weight gain
      - weak pulse
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body odor
      - burning feeling in the chest or stomach
      - decreased appetite
      - increased weight
      - skin rash
      - stomach pain or upset
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in taste
      - loss of taste
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
