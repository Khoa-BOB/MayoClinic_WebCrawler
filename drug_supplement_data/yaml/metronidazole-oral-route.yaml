title: Metronidazole (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Flagyl
    - type: paragraph
      text: Flagyl ER
    - type: paragraph
      text: Likmez
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Metronidazole is used to treat bacterial infections in different areas of
      the body. It is also used to treat infections caused by protozoa (eg, trichomoniasis
      and amebiasis) and infections caused by bacteria that do not need oxygen to
      survive. The extended-release tablets are used to treat women with vaginal infections
      (bacterial vaginosis).
  - type: paragraph
    text: Metronidazole belongs to the class of medicines known as antibiotics. It
      works by killing bacteria or preventing their growth. However, this medicine
      will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
    - Tablet
    - Capsule
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of metronidazole capsules , oral liquid , and tablets in the
        pediatric population, except for the treatment of amebiasis. Safety and efficacy
        have not been established.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of metronidazole extended-release
        tablets to treat bacterial vaginosis in teenage females, but should not be
        used before the start of menstruation.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of metronidazole in the elderly.
        However, elderly patients are more likely to have unwanted effects and age-related
        liver problems, which may require caution and an adjustment in the dose for
        patients receiving metronidazole.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Amprenavir
      - Bepridil
      - Cisapride
      - Disulfiram
      - Dronabinol
      - Dronedarone
      - Levoketoconazole
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acenocoumarol
      - Adagrasib
      - Alfuzosin
      - Amiodarone
      - Amitriptyline
      - Anagrelide
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Azithromycin
      - Bedaquiline
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Busulfan
      - Capecitabine
      - Ceritinib
      - Chloroquine
      - Chlorpromazine
      - Cholera Vaccine, Live
      - Cimetidine
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
      - Crizotinib
      - Cyclobenzaprine
      - Dabrafenib
      - Dasatinib
      - Degarelix
      - Delamanid
      - Desflurane
      - Desipramine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Carbamazepine
      - Cholestyramine
      - Cyclosporine
      - Milk Thistle
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood or bone marrow problems, or history of or
      - Brain disease (eg, aseptic meningitis, encephalopathy) or
      - Leukopenia (low white blood cells), history of or
      - Optic neuropathy (eye disease with vision changes), history of or
      - Oral thrush (Candida infection) or
      - Peripheral neuropathy (nerve problem), history of or
      - Seizures, history of or
      - Vaginal yeast infection (Candida infection)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Cockayne syndrome (genetic disorder)—Should not be used in patients with this
        condition.
    - type: list
      ordered: false
      items:
      - Kidney disease, end-stage or
      - Liver disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: The capsules can be taken with or without food. If the medicine upsets your
      stomach, it is best to take it with a meal or snack.
  - type: paragraph
    text: The extended–release tablet must be taken without food, 1 hour before or
      2 hours after a meal.
  - type: paragraph
    text: Swallow the extended-release tablet whole. Do not break, crush, or chew
      it.
  - type: paragraph
    text: 'To use the suspension : Shake the bottle well before using. Measure the
      oral liquid medicine with a marked oral syringe or medicine cup. Do not use
      a household measuring cup.'
  - type: paragraph
    text: To help clear up your infection completely, keep using this medicine for
      the full time of treatment , even if you begin to feel better after a few days.
      If you stop using this medicine too soon, your infection may return.
  - type: paragraph
    text: This medicine works best when there is a constant amount in the blood. To
      help keep the amount constant, do not miss any doses. Also, it is best to take
      the doses at evenly spaced times during the day. If you need help planning the
      best times to take your medicine, check with your doctor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules or tablets): For amebiasis: Adults— For acute
        intestinal amebiasis: 750 milligrams (mg) 3 times a day for 5 to 10 days.
        For amebic liver abscess: 500 to 750 mg 3 times a day for 5 to 10 days. Children—Dose
        is based on body weight and must be determined by your doctor. The dose is
        usually 35 to 50 milligrams per kilogram of body weight (mg/kg) per day, divided
        into 3 doses, for 10 days. For bacterial infections: Adults—Dose is based
        on body weight and must be determined by your doctor. The dose is usually
        7.5 milligrams per kilogram of body weight (mg/kg) every 6 hours for 7 to
        10 days. Your doctor may increase your dose as needed. However, the dose is
        usually not more than 4 grams (g) per day. Children—Use and dose must be determined
        by your doctor. For trichomoniasis infections: Adults— Capsule: 375 milligrams
        (mg) 2 times a day for 7 days. Tablet: One-day treatment: 2 grams (g) given
        as a single dose or 1 g given in 2 doses per day. 7-day course treatment:
        250 mg 3 times a day for 7 days. Children—Use and dose must be determined
        by your doctor.'
      - 'For oral dosage form (extended-release tablets): For bacterial vaginosis:
        Adults—750 milligrams (mg) once a day for 7 days. Children—Use and dose must
        be determined by your doctor.'
      - 'For oral dosage form (suspension): For amebiasis: Adults— For acute intestinal
        amebiasis: 750 milligrams (mg) or 7.5 milliliters (mL) 3 times a day for 5
        to 10 days. For amebic liver abscess: 500 to 750 mg or 5 to 7.5 mL 3 times
        a day for 5 to 10 days. Children—Dose is based on body weight and must be
        determined by your doctor. The dose is usually 35 to 50 milligrams per kilogram
        of body weight (mg/kg) per day, divided into 3 doses, for 10 days. However,
        the dose is usually not more than 2250 mg per day. For bacterial infections:
        Adults—Dose is based on body weight and must be determined by your doctor.
        The dose is usually 7.5 milligrams per kilogram of body weight (mg/kg) every
        6 hours for 7 to 10 days. However, the dose is usually not more than 4 grams
        or 40 mL per day. Children—Use and dose must be determined by your doctor.
        For trichomoniasis: Adults— One-day treatment: 2 grams (g) or 20 milliliters
        (mL) given as a single dose or 1 g or 10 mL given in 2 divided doses per day.
        7-day course treatment: 250 milligrams (mg) or 2.5 milliliters (mL) 3 times
        a day for 7 days. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
