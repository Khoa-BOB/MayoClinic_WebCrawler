    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      make sure that the infection is cleared up. Blood tests may be needed to check
      for unwanted effects.
  - type: paragraph
    text: If your symptoms do not improve within a few days after you start this medicine
      or if they become worse, check with your doctor.
  - type: paragraph
    text: Do not take metronidazole if you have taken disulfiram (Antabuse®) within
      the last 2 weeks. Using these medicines together may cause serious unwanted
      effects .
  - type: paragraph
    text: Drinking alcoholic beverages while using this medicine may cause stomach
      pain, nausea, vomiting, headache, or flushing or redness of the face. Other
      alcohol-containing preparations (eg, elixirs, cough syrups, tonics) may also
      cause problems. These problems may last for at least one day after you stop
      using metronidazole. This medicine may also cause alcoholic beverages to taste
      different. You should not drink alcoholic beverages or take other alcohol-containing
      preparations while you are using this medicine and for at least 3 days after
      stopping it .
  - type: paragraph
    text: 'If you have trichomoniasis : Using this medicine while you are pregnant
      (especially during the first 3 months of pregnancy) can harm your unborn baby.
      Use an effective form of birth control to keep from getting pregnant. If you
      think you have become pregnant while using the medicine, tell your doctor right
      away.'
  - type: paragraph
    text: If you are using this medicine for trichomoniasis (an infection of the sex
      organs), your doctor may want to treat your sexual partner at the same time
      you are being treated, even if he or she has no symptoms. Also, it may be desirable
      to use a condom during sexual intercourse. These measures will help to keep
      you from getting the infection back again from your partner. If you have any
      questions about this, talk with your doctor.
  - type: paragraph
    text: Check with your doctor right away if you have burning, numbness, tingling,
      or painful sensations in the arms, hands, legs, or feet. These could be symptoms
      of a condition called peripheral neuropathy.
  - type: paragraph
    text: Check with your doctor right away if you have dizziness, problems with muscle
      control or coordination, shakiness or an unsteady walk, slurred speech, or trouble
      speaking. These may be symptoms of a serious brain condition called encephalopathy.
  - type: paragraph
    text: Call your doctor right away if you have confusion, drowsiness, fever, a
      general feeling of illness, a headache, loss of appetite, nausea, a stiff neck
      or back, or vomiting. These could be symptoms of a serious condition called
      aseptic meningitis.
  - type: paragraph
    text: This medicine may increase your risk of having serious liver problems, which
      may be life-threatening. This is more likely if you have Cockayne syndrome (rare
      form of dwarfism). Check with your doctor right away if you have pain or tenderness
      in the upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin.
  - type: paragraph
    text: Metronidazole may cause dry mouth, an unpleasant or sharp metallic taste,
      and a change in taste sensation. For temporary relief of dry mouth, use sugarless
      candy or gum, melt bits of ice in your mouth, or use a saliva substitute. If
      your mouth continues to feel dry for more than 2 weeks, check with your medical
      doctor or dentist. Continuing dryness of the mouth may increase the chance of
      dental disease, including tooth decay, gum disease, and fungus infections.
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Check with your doctor
      right away if you have blistering, peeling, or loosening of the skin, red skin
      lesions, severe acne or a skin rash, sores or ulcers on the skin, or fever or
      chills with this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - back pain
      - blindness
      - blurred vision
      - burning, numbness, tingling, or painful sensations in the hands or feet
      - changes in speech patterns
      - confusion
      - decreased vision
      - depression
      - dizziness
      - drowsiness
      - eye pain
      - fever
      - headache
      - irritability
      - lack of coordination
      - nausea
      - seeing or hearing things that are not there
      - seizures
      - shakiness and unsteady walk
      - slurred speech
      - stiff neck or back
      - trouble speaking
      - unsteadiness, trembling, or other problems with muscle control or coordination
      - unusual tiredness or weakness
      - vomiting
      - weakness in the arms, hands, legs, or feet
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blood in the urine
      - body aches or pain
      - burning while urinating
      - chills
      - clumsiness or unsteadiness
      - difficulty with breathing
      - ear congestion
      - fainting
      - feeling of pelvic pressure
      - frequent or painful urination
      - irregular heartbeat
      - loss of voice
      - nasal congestion
      - pinpoint red spots on the skin
      - runny nose
      - skin rash, hives, redness, itching
      - sneezing
      - stomach and back pain (severe)
      - unusual bleeding or bruising
      - vaginal irritation, discharge, or dryness not present before taking the medicine
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - bloating
      - chest pain
      - constipation
      - cough
      - dark urine
      - fast heartbeat
      - indigestion
      - loss of appetite
      - painful or difficult urination
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swollen glands
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - bloody or cloudy urine
      - burning while urinating
      - continuing diarrhea
      - continuing stomach pain
      - diarrhea
      - feeling of warmth
      - increased volume of pale, dilute urine
      - joint or muscle pain
      - loss of bladder control
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - redness of the face, neck, arms, and occasionally, upper chest
      - redness of the skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
