title: Nitroglycerin (rectal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Rectiv
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Nitroglycerin rectal ointment is used to relieve moderate to severe pain
      caused by chronic anal fissures. An anal fissure is a tear in the skin around
      the opening for bowel movements, also known as the anus or rectal area. Nitroglycerin
      belongs to the group of medicines called nitrates. It works to relax the muscles
      around the anus so there is less pressure in the area.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Ointment
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of nitroglycerin in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of nitroglycerin in the elderly.
        However, elderly patients are more likely to have unwanted effects such as
        lightheadedness, dizziness, or fainting, which may require caution and an
        adjustment in the dose for patients receiving nitroglycerin.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Avanafil
      - Riociguat
      - Sildenafil
      - Tadalafil
      - Vardenafil
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alteplase, Recombinant
      - Articaine
      - Lidocaine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acetylcysteine
      - Apomorphine
      - Aspirin
      - Dihydroergotamine
      - Pancuronium
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia, severe or
      - Increased pressure in the head from an injury or bleeding—Should not be used
        in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Heart attack, recent or
      - Heart or blood vessel disease (eg, cardiomyopathy) or
      - Hypotension (low blood pressure) or
      - Hypovolemia (low amount of blood)—Use with caution. May cause side effects
        to become worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use it for a longer time than your doctor
      ordered.
  - type: paragraph
    text: This medicine is for rectal use only . Do not get it in your eyes, nose,
      mouth, or vagina. If it does get in these areas, rinse it off right away.
  - type: paragraph
    text: 'To apply the ointment:'
  - type: list
    ordered: false
    items:
    - Wash your hands before using the medicine.
    - Cover your finger with a plastic wrap, disposable surgical glove, or finger
      cot.
    - Lay the covered finger next to the dosing line on the side of the medicine box.
      The tip of your finger should be at one end of the dosing line.
    - Squeeze the ointment onto your finger. The amount of medicine should be the
      same length as the dosing line.
    - Gently insert your finger with the ointment into the anal canal. Do not push
      your finger past the first finger joint.
    - Carefully apply the ointment around the inner sides of the anal canal.
    - If you have too much pain in the anal canal, apply the ointment directly to
      the skin on the outside.
    - Throw the finger covering in the garbage and wash your hands.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For rectal dosage form (ointment): For pain caused by anal fissures: Adult—Apply
        1 inch into the anus every 12 hours. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For pain caused by anal fissures: Adult—Apply 1 inch into the anus every
        12 hours. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adult—Apply 1 inch into the anus every 12 hours.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the tube tightly closed after you use the medicine. Throw away any
        unused medicine 8 weeks after opening the tube for the first time.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: Do not take sildenafil (Viagra®), tadalafil (Cialis®), or vardenafil (Levitra®)
      while you are using this medicine. Using these medicines together may cause
      blurred vision, dizziness, lightheadedness, low blood pressure, or fainting.
  - type: paragraph
    text: This medicine may cause headaches. The headaches are a sign that the medicine
      is working. Do not stop using the medicine or change how you use it to avoid
      the headaches. If you have questions about this, talk with your doctor.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up quickly from a lying or sitting position. Getting up slowly will help. You
      should also limit the amount of alcohol you drink to prevent more dizziness.
      If you have questions about this, talk with your doctor.
  - type: paragraph
    text: This medicine may make you dizzy or lightheaded. Avoid driving, using machines,
      or doing anything else that could be dangerous if you are dizzy .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish-colored lips, fingernails, or palms
      - dark urine
      - difficulty with breathing
      - difficulty with swallowing
      - fast heartbeat
      - feeling of warmth
      - fever
      - hives
      - itching
      - pale skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness of the face, neck, arms, and occasionally, upper chest
      - shortness of breath
      - skin rash
      - tightness in the chest
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - wheezing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - sweating
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness or lightheadedness
      - headache
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cracks in the skin
      - loss of heat from the body
      - red, swollen skin
      - scaly skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
