title: Pentamidine (inhalation route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Nebupent
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Pentamidine is used to try to prevent Pneumocystis carinii pneumonia (PCP),
      a very serious type of pneumonia. This type of pneumonia occurs commonly in
      patients whose immune systems are not working normally, such as patients with
      acquired immune deficiency syndrome (AIDS). Inhaled pentamidine does not prevent
      illness in parts of the body outside the lungs. This medicine may also be used
      for other conditions as determined by your doctor.
  - type: paragraph
    text: Pentamidine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of pentamidine inhalation in children
        with use in other age groups. However, pentamidine inhalation is recommended
        in children 5 years of age and older who cannot tolerate other medicines.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of pentamidine inhalation in
        the elderly with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Grepafloxacin
      - Levoketoconazole
      - Levomethadyl
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acecainide
      - Acetophenazine
      - Adagrasib
      - Ajmaline
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amoxapine
      - Anagrelide
      - Apomorphine
      - Aprindine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Artemether
      - Astemizole
      - Atazanavir
      - Azimilide
      - Azithromycin
      - Bedaquiline
      - Bretylium
      - Buprenorphine
      - Buserelin
      - Ceritinib
      - Chloral Hydrate
      - Chloroquine
      - Chlorpromazine
      - Cidofovir
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
      - Crizotinib
      - Cyclobenzaprine
      - Dabrafenib
      - Dasatinib
      - Degarelix
      - Delamanid
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma—Patients with asthma may have an increase in coughing or difficulty
        in breathing while receiving pentamidine inhalation
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: To help prevent the development or return of pneumocystis pneumonia, you
      must receive pentamidine inhalation on a regular basis, even if you are feeling
      well.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For the inhalation dosage form: For the prevention of Pneumocystis carinii
        pneumonia (PCP): Adults and children 5 years of age and older—300 milligrams
        (mg) by oral inhalation once every four weeks. Children younger than 5 years
        of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For the prevention of Pneumocystis carinii pneumonia (PCP): Adults and children
        5 years of age and older—300 milligrams (mg) by oral inhalation once every
        four weeks. Children younger than 5 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 5 years of age and older—300 milligrams (mg) by oral inhalation
        once every four weeks.
      - Children younger than 5 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If you are also using the inhalation form of a bronchodilator (medicine
      used to help relieve breathing problems), use the pentamidine inhalation at
      least 5 to 10 minutes after the bronchodilator, unless otherwise directed by
      your doctor. This will help to reduce the possibility of side effects. Do not
      use the bronchodilator or any medicine other than pentamidine in the nebulizer.
  - type: paragraph
    text: A bitter or metallic taste may occur during use of this medicine. Sucking
      on a hard candy after each treatment can help reduce this problem.
  - type: paragraph
    text: Cigarette smoking can increase the chance of coughing and difficulty in
      breathing during pentamidine inhalation therapy.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: On rare occasions, pneumocystis infections have occurred in parts of the
      body outside the lungs in patients receiving pentamidine inhalation therapy.
      You should discuss this possible problem with your doctor.
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning pain, dryness, or sensation of lump in throat
      - chest pain or congestion
      - coughing
      - difficulty in breathing
      - difficulty in swallowing
      - skin rash
      - wheezing
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea and vomiting
      - pain in upper abdomen, possibly radiating to the back
      - pain in side of chest (severe)
      - shortness of breath (sudden and severe)
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - chills
      - cold sweats
      - cool, pale skin
      - decreased urination
      - headache
      - increased hunger
      - loss of appetite
      - nausea and vomiting
      - nervousness
      - shakiness
      - stomach pain
      - unusual tiredness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
