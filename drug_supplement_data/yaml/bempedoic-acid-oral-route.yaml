title: Bempedoic acid (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Nexletol
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Bempedoic acid is used together with diet and other cholesterol-lowering
      medicines to reduce bad cholesterol (LDL) in patients with primary hyperlipidemia
      (high blood cholesterol), including heterozygous familial hypercholesterolemia
      (HeFH).
  - type: paragraph
    text: Bempedoic acid is also used to lower the risk of heart attack and heart
      procedures (eg, stent placement or bypass surgery) in patients who are unable
      to take or are not taking a cholesterol-lowering medicine (eg, statin), who
      have heart disease or who are at high risk for heart disease.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of bempedoic acid in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of bempedoic acid in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Atogepant
      - Atrasentan
      - Pravastatin
      - Simvastatin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Gout or
      - Muscle problems or
      - Tendon problems, or history of—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Heart problems, including heart attack or
      - Liver disease, severe or
      - Patients with end-stage kidney disease receiving dialysis or
      - Stroke—Use has not been studied in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not use more of
      it, do not use it more often, and do not use it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor or pharmacist if you have any
      questions.
  - type: paragraph
    text: Take this medicine with or without food.
  - type: paragraph
    text: Carefully follow your doctor's orders about any special diet .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): To reduce bad cholesterol (LDL) in patients
        with primary hyperlipidemia and to lower the risk of heart attack and heart
        procedures: Adults—180 milligrams (mg) once a day. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'To reduce bad cholesterol (LDL) in patients with primary hyperlipidemia and
        to lower the risk of heart attack and heart procedures: Adults—180 milligrams
        (mg) once a day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—180 milligrams (mg) once a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may increase the uric acid levels in the blood (hyperuricemia),
      which can lead to gout. This can occur within 4 weeks of using this medicine.
      Check with your doctor right away if you have joint pain, stiffness, or swelling,
      lower back, side, or stomach pain, or swelling of the feet or lower legs.
  - type: paragraph
    text: Tendon problems, including swelling, inflammation, or rupture can occur
      in the shoulder (rotator cuff), upper arm (biceps tendon), or Achilles tendon
      at the back of the ankle, within days or months after starting treatment with
      bempedoic acid. If you hear or feel a snap or pop, have bruising right after
      an injury, or are unable to move or put weight in an affected tendon area, check
      with your doctor right away . Avoid using and exercising the affected area.
  - type: paragraph
    text: Using this medicine together with simvastatin or pravastatin may increase
      your risk of developing muscle pain or weakness. Talk to your doctor if you
      have any concerns.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody urine
      - decreased amount of urine
      - increased blood pressure
      - increased thirst
      - loss of appetite
      - lower back or side pain
      - nausea
      - pale skin
      - swelling of the face, fingers, or lower legs
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Ankle, knee, or great toe joint pain
      - arm, back, or leg pain
      - body aches or pain
      - chest tightness
      - chills
      - cough
      - cough producing mucus
      - difficulty urinating
      - dizziness
      - ear congestion
      - fainting
      - fast or irregular heartbeat
      - fever
      - frequent urination
      - gaseous stomach pain
      - headache
      - joint pain, stiffness, or swelling
      - loss of voice
      - muscle spasms
      - runny or stuffy nose
      - sneezing
      - sore throat
      - stomach fullness
      - swelling of the feet or lower legs
      - trouble breathing
      - yellow eyes or skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bone pain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Stomach pain or discomfort
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
