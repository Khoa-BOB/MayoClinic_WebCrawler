    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to nonsteroidal anti-inflammatory drugs (NSAIDs) or
      - Asthma with nasal polyps and rhinitis, history of or
      - Stomach ulcers or bleeding—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease, severe—Avoid use in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Take the capsule with a full glass of water at the same time each day.
  - type: paragraph
    text: Swallow the extended-release capsule whole. Do not crush, break, or chew
      it.
  - type: paragraph
    text: Do not take Durlaza™ 2 hours before or 1 hour after drinking alcohol.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release capsules): To lower risk of heart
        attack and stroke: Adults—162.5 milligrams (mg) (one capsule) once a day.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'To lower risk of heart attack and stroke: Adults—162.5 milligrams (mg) (one
        capsule) once a day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—162.5 milligrams (mg) (one capsule) once a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress while you are
      using this medicine . This will allow your doctor to see if the medicine is
      working properly and to decide if you should continue to take it.
  - type: paragraph
    text: This medicine can not be used for treatment of a heart attack. Use an immediate-release
      aspirin in such an event.
  - type: paragraph
    text: Make sure your doctor knows if you are pregnant or breastfeeding. Do not
      use this medicine during the later part of a pregnancy unless your doctor tells
      you to.
  - type: paragraph
    text: This medicine may increase risk for bleeding problems, including stomach
      ulcers or bleeding. This usually occurs if you are taking aspirin with certain
      medicines (eg, NSAIDs, blood thinner). Check with your doctor right away if
      you have black, tarry stools, severe or continuing stomach pain, unusual bleeding,
      bruising, or weakness, or vomiting of blood or material that looks like coffee
      grounds.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain, cramping, or burning
      - black, tarry stools
      - bloody or cloudy urine
      - change in consciousness
      - chest pain or discomfort
      - confusion
      - constipation
      - convulsions, severe or continuing
      - dark urine
      - decreased frequency or amount of urine
      - diarrhea
      - difficult breathing
      - drowsiness
      - fainting
      - fast breathing
      - feeling that something terrible will happen
      - fever
      - general tiredness and weakness
      - greatly decreased frequency of urination or amount of urine
      - headache
      - heartburn
      - increased thirst
      - indigestion
      - irregular heartbeat
      - light-colored stools
      - loss of appetite
      - loss of consciousness
      - lower back or side pain
      - muscle cramping and weakness
      - muscle tremors
      - nausea or vomiting
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - panic
      - rapid, deep breathing
      - restlessness
      - seizures
      - skin rash
      - stomach cramps
      - swelling of the face, fingers, or lower legs
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - upper right abdominal or stomach
      - vomiting of blood or material that looks like coffee grounds
      - weakness or heaviness of the legs
      - weight gain
      - yellow eyes and skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - anxiety
      - belching
      - dizziness
      - dry mouth
      - hyperventilation
      - irritability
      - shaking
      - stomach discomfort, upset, or pain
      - trouble sleeping
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
