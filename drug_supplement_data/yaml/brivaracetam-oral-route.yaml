    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away any unused oral liquid 5 months after first opening the bottle.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits , especially for the first few months you are taking this
      medicine to allow for a change in the dose and to check for any unwanted effects.
  - type: paragraph
    text: Brivaracetam may cause changes in mood or behavior, problems with coordination,
      or unusual tiredness or weakness. Tell your doctor right away if you start to
      feel depressed, anxious, angry, getting upset easily, restless, or have thoughts
      about hurting yourself. Report any unusual thoughts or behavior that trouble
      you, especially if they are new or getting worse quickly.
  - type: paragraph
    text: This medicine may make you dizzy, drowsy, tired, or less alert than you
      are normally. Do not drive or do anything else that could be dangerous until
      you know how this medicine affects you .
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including bronchospasm
      and angioedema. Tell your doctor if you have difficulty in breathing or swallowing,
      a fever, large, hive-like swelling on the face, eyelids, lips, tongue, throat,
      hands, legs, feet, or genitals, nausea, reddening of the skin, especially around
      the ears, swelling of the eyes, face, or inside of the nose, or unusual tiredness
      or weakness.
  - type: paragraph
    text: Do not stop using brivaracetam without first checking with your doctor .
      Stopping the medicine suddenly may cause your seizures to return or to occur
      more often. Your doctor may want you to gradually reduce the amount you are
      using before stopping it completely.
  - type: paragraph
    text: This medicine may cause serious skin reactions (eg, Stevens-Johnson syndrome,
      toxic epidermal necrolysis). Check with your doctor right away if you have blistering,
      peeling, or loosening of the skin, chills, cough, diarrhea, itching, joint or
      muscle pain, red irritated eyes, red skin lesions, often with a purple center,
      sore throat, sores, ulcers, or white spots in the mouth or on the lips, or unusual
      tiredness or weakness.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - changes in behavior
      - chest pain or discomfort
      - deep or fast breathing with dizziness
      - dizziness or lightheadedness
      - double vision
      - drowsiness
      - dry mouth
      - general feeling of discomfort or illness
      - irregular heartbeat
      - irritability
      - nausea
      - numbness of feet, hands, and around mouth
      - restlessness
      - seeing double
      - sensation of spinning
      - sleepiness or unusual drowsiness
      - thoughts of killing oneself
      - trouble sleeping
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
      - unusually deep sleep
      - unusually long duration of sleep
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Shakiness and unsteady walk
      - uncontrolled eye movements
      - unsteadiness, trembling, or other problems with muscle control or coordination
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - chills
      - cough
      - diarrhea
      - difficulty breathing or swallowing
      - fever
      - hives, itching, skin rash
      - joint or muscle pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - noisy breathing
      - red irritated eyes
      - red skin lesions, often with a purple center
      - reddening of the skin, especially around the ears
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - swelling of the eyes, face, or inside of the nose
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty having a bowel movement
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
