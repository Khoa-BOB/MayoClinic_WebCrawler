title: Brivaracetam (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Briviact
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Brivaracetam is used to help control partial onset seizures in the treatment
      of epilepsy. This medicine cannot cure epilepsy and will only work to control
      seizures for as long as you continue to use it.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of brivaracetam in children 1 month
        of age and older. However, safety and efficacy have not been established in
        children younger than 1 month of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of brivaracetam have not been performed in the geriatric population, no geriatric-specific
        problems have been documented to date. However, elderly patients are more
        likely to have age-related liver, kidney, or heart problems, which may require
        caution and an adjustment in the dose for patients receiving brivaracetam.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Ranolazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amlodipine
      - Atogepant
      - Calcifediol
      - Carbamazepine
      - Cariprazine
      - Hydroxychloroquine
      - Nifedipine
      - Orlistat
      - Pimozide
      - Rifampin
      - Voriconazole
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol or drug use disorder, history of or
      - Depression, or history of or
      - Mental illness, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe (eg, end-stage) having dialysis—Use is not recommended
        in patients with this condition.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. Also, do not change your dose without checking first with your
      doctor.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the tablet whole with liquid. Do not crush, break, or chew it.
  - type: paragraph
    text: Measure the oral liquid with a marked measuring spoon, dropper, oral syringe,
      or medicine cup. The average household teaspoon may not hold the right amount
      of liquid. You may also take the oral liquid using a nasogastric tube or gastrostomy
      tube.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (solution or tablets): For partial onset seizures:
        Adults and children 16 years of age and older—At first, 50 milligrams (mg)
        2 times a day. Your doctor may adjust your dose as needed and tolerated. However,
        the dose is usually not more than 100 mg 2 times a day. Children 1 month to
        less than 16 years of age—Dose is based on body weight and must be determined
        by your doctor: Weighing 50 kilograms (kg) or more—At first, 25 to 50 mg 2
        times a day. Your doctor may adjust your dose as needed and tolerated. However,
        the dose is usually not more than 100 mg 2 times a day. Weighing 20 kg to
        less than 50 kg—At first, 0.5 to 1 milligram per kilogram (mg/kg) of body
        weight 2 times a day. Your doctor may adjust your dose as needed and tolerated.
        However, the dose is usually not more than 2 mg/kg 2 times a day. Weighing
        11 kg to less than 20 kg—At first, 0.5 to 1.25 mg/kg of body weight 2 times
        a day. Your doctor may adjust your dose as needed and tolerated. However,
        the dose is usually not more than 2.5 mg/kg 2 times a day. Weighing less than
        11 kg—At first, 0.75 to 1.5 mg/kg of body weight 2 times a day. Your doctor
        may adjust your dose as needed and tolerated. However, the dose is usually
        not more than 3 mg/kg 2 times a day. Children younger than 1 month of age—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For partial onset seizures: Adults and children 16 years of age and older—At
