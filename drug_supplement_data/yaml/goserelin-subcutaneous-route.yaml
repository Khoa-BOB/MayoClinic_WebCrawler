      - Dexmedetomidine
      - Disopyramide
      - Dofetilide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse or
      - Osteoporosis, family history of or
      - Tobacco cigarette smoking—May increase risk for osteoporosis (thinning of
        the bones).
    - type: list
      ordered: false
      items:
      - Depression, history of or
      - Diabetes or
      - Electrolyte imbalance or
      - Heart attack, recent or
      - Heart or blood vessel problems or
      - Heart rhythm problems (eg, long QT syndrome), family history of or
      - Hypercalcemia (high calcium in the blood) or
      - Hyperglycemia (high blood sugar) or
      - Stroke, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Nerve problems caused by bone lesions in the spine (in treatment of cancer
        of the prostate) or
      - Problems in passing urine (in treatment of cancer of the prostate)—Conditions
        may get worse for a short time after goserelin treatment is started.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given as a shot under your skin near your stomach. This medicine
      may be given once every 28 days or once every 3 months. Your schedule depends
      on the reason you are using this medicine. To stay on the right schedule with
      the medicine, make sure you keep all appointments.
  - type: paragraph
    text: It is very important that you continue to receive the medicine, even after
      you begin to feel better.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly and to check for unwanted
      effects.
  - type: paragraph
    text: 'For female patients: You should not receive this medicine if you are pregnant
      or may become pregnant. Using this medicine while you are pregnant can harm
      your unborn baby. Your birth control pills may not work as well while you are
      receiving this medicine. Use a nonhormonal form of birth control together with
      your pills to keep from getting pregnant while you are receiving this medicine
      and for at least 12 weeks after treatment. Nonhormonal birth control includes
      vaginal spermicides, condoms, diaphragms, and cervical caps. If you think you
      have become pregnant while using the medicine, tell your doctor right away.'
  - type: paragraph
    text: 'For female patients: During the time you are receiving goserelin, your
      menstrual period may not be regular or you may not have a menstrual period at
      all. This is to be expected when being treated with this medicine. If regular
      menstrual periods continue during treatment or do not begin within 2 to 3 months
      after you stop using this medicine, check with your doctor.'
  - type: paragraph
    text: When you first start using this medicine for cancer treatment, some of your
      symptoms might get worse for a short time. You might also have new symptoms.
      You might have bone pain, back pain, or trouble urinating. These symptoms should
      improve within a few weeks. Tell your doctor if you have any new symptoms or
      your symptoms get worse.
  - type: paragraph
    text: 'For male patients: This medicine may affect blood sugar levels. If you
      are diabetic and notice a change in the results of your blood or urine sugar
      tests, check with your doctor.'
  - type: paragraph
    text: 'For male patients: This medicine may increase risk of having a heart attack
      or stroke. Check with your doctor right away if you have chest pain or discomfort,
      confusion, double vision, headache, nausea or vomiting, slow speech, sweating,
      trouble speaking, or trouble moving the arms, legs, or facial muscles.'
  - type: paragraph
    text: This medicine can cause decreases in bone mineral density, which may lead
      to osteoporosis or weakened bones. Talk with your doctor about how this risk
      will affect you.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are using this medicine.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you or anyone in your family has ever
      had a heart rhythm problem including QT prolongation.
  - type: paragraph
    text: Injection site injury (eg, pain, hematoma, hemorrhage, and hemorrhage shock)
      may occur after receiving this medicine. Call your doctor right away if you
      have abdominal or stomach pain, bloated or full feeling, lightheadedness, dizziness,
      or fainting, or trouble breathing.
  - type: paragraph
    text: This medicine may cause depression especially in women. Check with your
      doctor right away if you have discouragement, feeling sad or empty, irritability,
      lack of appetite, loss of interest or pleasure, tiredness, trouble concentrating,
      or trouble sleeping.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are using this medicine. The results of some tests may be affected by this
      medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
