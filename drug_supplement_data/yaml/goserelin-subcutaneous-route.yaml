title: Goserelin (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Zoladex
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: 'Goserelin is a hormone similar to the one normally released from the hypothalamus
      gland in the brain. It is used to treat a number of medical problems. These
      include:'
  - type: list
    ordered: false
    items:
    - Cancer of the prostate in men
    - Cancer of the breast in women if it develops before or around the time of menopause
    - Endometriosis, a painful condition caused by extra tissue growing inside or
      outside of the uterus, and
    - Thinning of the lining of the uterus before surgery on the uterus.
  - type: paragraph
    text: When given regularly as an implant, goserelin works every day to decrease
      the amount of estrogen and testosterone in the blood.
  - type: paragraph
    text: Reducing the amount of estrogen in the body is one way of treating endometriosis
      and cancer of the breast, and can help thin the uterus lining before surgery.
      Goserelin prevents the growth of tissue associated with endometriosis in adult
      women during treatment and for up to 6 months after treatment is discontinued.
  - type: paragraph
    text: Reducing the amount of testosterone in the body is one way of treating cancer
      of the prostate.
  - type: paragraph
    text: Suppressing estrogen can thin the bones or slow their growth. This is a
      problem for adult women whose bones are no longer growing like the bones of
      children. This is why goserelin is used only for up to 6 months in adult women
      treated for endometriosis.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Implant
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of goserelin in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of goserelin in elderly men. However,
        safety and efficacy have not been established for elderly women.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Bepridil
      - Cisapride
      - Dengue Tetravalent Vaccine, Live
      - Dronedarone
      - Levoketoconazole
      - Measles Virus Vaccine, Live
      - Mesoridazine
      - Mumps Virus Vaccine, Live
      - Pimozide
      - Piperaquine
      - Rubella Virus Vaccine, Live
      - Saquinavir
      - Smallpox Monkeypox Vaccine
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adagrasib
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Alfuzosin
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Anagrelide
      - Apomorphine
