title: Aminobenzoate potassium (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: M2 Potassium
    - type: paragraph
      text: Potaba
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Aminobenzoate potassium is used to treat fibrosis, a condition in which
      the skin and underlying tissues tighten and become less flexible. This condition
      occurs in such diseases as dermatomyositis, morphea, Peyronie's disease, scleroderma,
      and linear scleroderma.
  - type: paragraph
    text: Aminobenzoate potassium is also used to treat a certain type of inflammation
      (nonsuppurative inflammation) that occurs in such diseases as dermatomyositis,
      pemphigus, and Peyronie's disease.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of aminobenzoate
        potassium in children with use in other age groups, this medicine is not expected
        to cause different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Elderly people may be more sensitive to certain symptoms of the low blood
        sugar side effect. These symptoms include confusion, difficulty in concentration,
        and headache. In addition, these symptoms may be harder to detect in elderly
        persons than in younger adults. This may increase the chance of problems during
        treatment with this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes mellitus (sugar diabetes) or
      - Hypoglycemia (low blood sugar)��The risk of the medicine causing hypoglycemia
        (low blood sugar) may be increased
    - type: list
      ordered: false
      items:
      - Kidney disease—Aminobenzoate potassium is removed from the body by the kidneys;
        higher blood levels of the medicine may occur if kidney disease is present,
        which may increase the chance of side effects
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Make certain your health care professional knows if you are on any special
      diet, such as a low-sodium or low-sugar diet.
  - type: paragraph
    text: Take this medicine with meals or snacks to lessen the possibility of stomach
      upset. If stomach upset continues, check with your doctor.
  - type: paragraph
    text: 'For patients taking the capsule or tablet form of aminobenzoate potassium:'
  - type: list
    ordered: false
    items:
    - Take each dose with a full glass (8 ounces) of water or milk to lessen the possibility
      of stomach upset.
    - Patients using the tablets should dissolve them in water before taking. This
      will help lessen the possibility of stomach upset.
  - type: paragraph
    text: 'For patients using the powder form of this medicine:'
  - type: list
    ordered: false
    items:
    - This medicine should never be taken in its dry form. Instead, always mix it
      with water or citrus juice, as directed.
    - To cover up the taste of aminobenzoate potassium, you may dissolve the powder
      in citrus drinks instead of in water. However, if you do dissolve the powder
      in water, drinking a citrus juice or a carbonated beverage immediately after
      each dose of medicine will also help cover up the taste.
    - The flavor of this medicine is improved if the solution is chilled before you
      take it.
    - 'For patients using the two-gram individual packets of powder: Dissolve one
      packet (2 grams) of aminobenzoate potassium in a full glass (8 ounces) of water
      or citrus juice. Stir well to dissolve the powder.'
    - 'For patients using the bulk powder form of this medicine: Use a specially marked
      measuring spoon or other device to measure out the correct amount of medicine.
      Your health care professional can help you with this. To make a 10-percent solution
      of this medicine: Choose a container that is resistant to light, such as an
      amber glass container, a metal container, or a plastic container that you cannot
      see through. Make sure the container is large enough to measure one liter (approximately
      one quart). Place 100 grams (approximately 3 ounces) of aminobenzoate potassium
      powder in the container. Add enough water or citrus juice to make one liter
      (approximately one quart) of solution and stir well. Store the solution in a
      container that is resistant to light, such as an amber glass container, a metal
      container, or a plastic container that you cannot see through. Keep the solution
      refrigerated. Stir well before pouring each dose. Discard the unused portion
      after one week.'
  - type: list
    ordered: false
    items:
    - Dissolve one packet (2 grams) of aminobenzoate potassium in a full glass (8
      ounces) of water or citrus juice.
    - Stir well to dissolve the powder.
  - type: list
    ordered: false
    items:
    - Use a specially marked measuring spoon or other device to measure out the correct
      amount of medicine. Your health care professional can help you with this.
    - 'To make a 10-percent solution of this medicine: Choose a container that is
      resistant to light, such as an amber glass container, a metal container, or
      a plastic container that you cannot see through. Make sure the container is
      large enough to measure one liter (approximately one quart). Place 100 grams
      (approximately 3 ounces) of aminobenzoate potassium powder in the container.
      Add enough water or citrus juice to make one liter (approximately one quart)
      of solution and stir well. Store the solution in a container that is resistant
      to light, such as an amber glass container, a metal container, or a plastic
      container that you cannot see through. Keep the solution refrigerated. Stir
      well before pouring each dose. Discard the unused portion after one week.'
  - type: list
    ordered: false
    items:
    - Choose a container that is resistant to light, such as an amber glass container,
      a metal container, or a plastic container that you cannot see through. Make
      sure the container is large enough to measure one liter (approximately one quart).
    - Place 100 grams (approximately 3 ounces) of aminobenzoate potassium powder in
      the container.
    - Add enough water or citrus juice to make one liter (approximately one quart)
      of solution and stir well.
    - Store the solution in a container that is resistant to light, such as an amber
      glass container, a metal container, or a plastic container that you cannot see
      through.
    - Keep the solution refrigerated. Stir well before pouring each dose. Discard
      the unused portion after one week.
  - type: paragraph
    text: For this medicine to be effective, it must be taken every day as ordered
      by your doctor. It may take 3 or more months before you begin to see an improvement
      in your condition.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules, powder for oral solution, and tablets):
        For fibrosis: Adults—12 grams a day, divided into four to six doses and taken
        with meals or snacks. Children—Dose is based on body weight and must be determined
        by your doctor. The usual dose is 220 milligrams (mg) per kilogram (kg) (100
        mg per pound) of body weight a day. This is divided into four to six doses
        and taken with meals or snacks.'
    - type: list
      ordered: false
      items:
      - 'For fibrosis: Adults—12 grams a day, divided into four to six doses and taken
        with meals or snacks. Children—Dose is based on body weight and must be determined
        by your doctor. The usual dose is 220 milligrams (mg) per kilogram (kg) (100
        mg per pound) of body weight a day. This is divided into four to six doses
        and taken with meals or snacks.'
    - type: list
      ordered: false
      items:
      - Adults—12 grams a day, divided into four to six doses and taken with meals
        or snacks.
      - Children—Dose is based on body weight and must be determined by your doctor.
        The usual dose is 220 milligrams (mg) per kilogram (kg) (100 mg per pound)
        of body weight a day. This is divided into four to six doses and taken with
        meals or snacks.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the bottle closed when you are not using it. Keep it in the refrigerator.
        Do not freeze.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Store the liquid form of this medicine in a container that is resistant
        to light, such as an amber glass container, a metal container, or a plastic
        container that you cannot see through. Discard the unused portion of the liquid
        form of this medicine.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: While you are taking this medicine, it is important that your doctor check
      your progress at regular visits.
  - type: paragraph
    text: Check with your doctor right away if you cannot eat normally while taking
      this medicine because of nausea, loss of appetite, or for any other reason.
      Taking this medicine when you have not been eating normally for several days
      may cause low blood sugar (hypoglycemia).
  - type: paragraph
    text: If symptoms of low blood sugar (hypoglycemia) appear, stop taking this medicine,
      eat or drink something containing sugar, and check with your doctor right away.
      Good sources of sugar are table sugar mixed in water, sugar cubes, orange juice,
      corn syrup, or honey. One popular source of sugar is a glassful of orange juice
      containing 2 or 3 teaspoonfuls of table sugar.
  - type: list
    ordered: false
    items:
    - Tell someone ahead of time to take you to your doctor or to a hospital right
      away if you begin to feel that you may pass out. If you do pass out, emergency
      help should be gotten at once.
    - Even if you correct the symptoms of low blood sugar by eating or drinking something
      with sugar, it is very important to call your doctor right away. The effects
      this medicine has on low blood sugar may last for a few days, and the symptoms
      may return often during this period of time.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - fever
      - skin rash
      - sore throat
    subsections: []
  - heading: Symptoms of low blood sugar
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - chills
      - cold sweats
      - confusion
      - cool pale skin
      - difficulty in concentration
      - drowsiness
      - excessive hunger
      - fast heartbeat
      - headache
      - nervousness
      - shakiness
      - unsteady walk
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Loss of appetite
      - nausea
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
