title: Cefixime (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Suprax
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cefixime is used to treat bacterial infections in many different parts of
      the body. It belongs to the class of medicines known as cephalosporin antibiotics.
      It works by killing bacteria or preventing their growth. However, this medicine
      will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of cefixime in children. However,
        safety and efficacy have not been established in children younger than 6 months
        of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of cefixime have not been performed in the geriatric population, no geriatric-specific
        problems have been documented to date.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Cholera Vaccine, Live
      - Desogestrel
      - Dienogest
      - Drospirenone
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Exenatide
      - Gestodene
      - Levonorgestrel
      - Mestranol
      - Methotrexate
      - Nomegestrol
      - Norethindrone
      - Norgestimate
      - Norgestrel
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to penicillins, or history of or
      - Bleeding problems—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Phenylketonuria—The chewable tablet contains phenylalanine, which can make
        this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Swallow the capsule whole. Do not cut, break, or chew it.
  - type: paragraph
    text: You may split or cut the tablet in half. The chewable tablet should be crushed
      or chewed before swallowing.
  - type: paragraph
    text: Shake the oral liquid well before each use. Measure the medicine with a
      marked measuring spoon, oral syringe, or medicine cup. The average household
      teaspoon may not hold the right amount of liquid.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you feel
      better after the first few doses. Your infection may not clear up if you stop
      using the medicine too soon.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules, suspension, chewable tablets, or tablets):
        For infections: Adults and children older than 12 years of age and weighing
        more than 50 kilograms (kg)—400 milligrams (mg) once a day or 200 mg every
        12 hours. Children 6 months to 12 years of age—Dose is based on body weight
        and must be determined by your doctor. The dose is usually 8 milligrams (mg)
        per kilogram (kg) of body weight per day, taken as a single dose or divided
        in two doses (4 mg/kg of body weight every 12 hours). Children up to 6 months
        of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For infections: Adults and children older than 12 years of age and weighing
        more than 50 kilograms (kg)—400 milligrams (mg) once a day or 200 mg every
        12 hours. Children 6 months to 12 years of age—Dose is based on body weight
        and must be determined by your doctor. The dose is usually 8 milligrams (mg)
        per kilogram (kg) of body weight per day, taken as a single dose or divided
        in two doses (4 mg/kg of body weight every 12 hours). Children up to 6 months
        of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children older than 12 years of age and weighing more than 50 kilograms
        (kg)—400 milligrams (mg) once a day or 200 mg every 12 hours.
      - Children 6 months to 12 years of age—Dose is based on body weight and must
        be determined by your doctor. The dose is usually 8 milligrams (mg) per kilogram
        (kg) of body weight per day, taken as a single dose or divided in two doses
        (4 mg/kg of body weight every 12 hours).
      - Children up to 6 months of age—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the oral liquid either at room temperature or in the refrigerator.
        Throw away any unused medicine after 14 days. Keep it tightly closed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your or your child's symptoms do not improve within a few days, or if
      they become worse, check with your doctor.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you or your child has a rash, itching, hoarseness,
      trouble breathing, trouble swallowing, or any swelling of your hands, face,
      or mouth while you are using this medicine.
  - type: paragraph
    text: Cefixime may cause diarrhea, and in some cases it can be severe. Do not
      take any medicine or give medicine to your child to treat diarrhea without first
      checking with your doctor. Diarrhea medicines may make the diarrhea worse or
      make it last longer. If you have any questions about this or if mild diarrhea
      continues or gets worse, check with your doctor.
  - type: paragraph
    text: Before you or your child has any medical tests, tell the medical doctor
      in charge that you are using this medicine. The results of some tests may be
      affected by this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - loose or frequent stools
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - agitation
      - black, tarry stools
      - bleeding gums
      - blistering, peeling, or loosening of the skin
      - blood in the urine or stools
      - chest pain
      - chills
      - clay-colored stools
      - coma
      - confusion
      - cough
      - dark urine
      - decreased urine output
      - depression
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - feeling of discomfort
      - fever
      - general tiredness and weakness
      - headache
      - hives, itching, or skin rash
      - hostility
      - inflammation of the joints
      - irritability
      - joint or muscle pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - lethargy
      - light-colored stools
      - loss of appetite
      - lower back or side pain
      - muscle aches
      - muscle twitching
      - nausea and vomiting
      - painful or difficult urination
      - pale skin
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid weight gain
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - seizures
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stupor
      - swelling of the face, ankles, or hands
      - swollen glands
      - swollen lymph glands
      - tightness in the chest
      - unpleasant breath odor
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - upper right abdominal or stomach pain
      - vomiting of blood
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps or tenderness
      - back, leg, or stomach pains
      - cough or hoarseness
      - coughing up blood
      - diarrhea, watery and severe, which may also be bloody
      - general body swelling
      - increased menstrual flow or vaginal bleeding
      - increased thirst
      - nosebleeds
      - paralysis
      - prolonged bleeding from cuts
      - red or black, tarry stools
      - red or dark brown urine
      - sudden decrease in the amount of urine
      - unpleasant breath odor
      - unusual weight loss
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - bloated
      - excess air or gas in the stomach or intestines
      - full feeling
      - heartburn
      - hives or welts
      - indigestion
      - itching of the vagina or genital area itching or pain of the genital area
      - pain during sexual intercourse
      - passing gas
      - redness of the skin
      - stomach discomfort, upset, or pain
      - thick, white vaginal discharge with no odor or with a mild odor
      - white patches in the mouth or throat or on the tongue
      - white patches with diaper rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
