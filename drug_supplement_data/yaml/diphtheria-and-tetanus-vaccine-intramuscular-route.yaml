title: Diphtheria and tetanus vaccine (intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Decavac
    - type: paragraph
      text: Tenivac
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Diphtheria and tetanus vaccine is a combination vaccine that is given to
      protect against infections caused by diphtheria and tetanus (lockjaw). The vaccine
      works by causing the body to produce its own protection (antibodies) against
      these diseases. This vaccine is given to children 6 weeks of age and older,
      teenagers, and adults.
  - type: paragraph
    text: Diphtheria is a serious illness that can cause breathing problems, heart
      problems, nerve damage, pneumonia, and possibly death. The risk for serious
      illness is greater in very young children and the elderly.
  - type: paragraph
    text: Tetanus (also known as lockjaw) is a very serious illness that causes severe
      muscle spasms that make the muscles very rigid or stiff. The muscle spasms can
      be strong enough to cause bone fractures in the spine. The disease can also
      cause breathing problems, swallowing problems, seizures, and possibly death.
  - type: paragraph
    text: This vaccine is to be administered only by or under the direct supervision
      of a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Diphtheria and Tetanus Toxoids Vaccine for Pediatric Use
        in children 7 years of age and older. Safety and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Decavac® vaccine in children younger than 7 years of age.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of Decavac® vaccine have not been performed in the geriatric population, no
        geriatric-specific problems have been documented to date.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atidarsagene Autotemcel
      - Elivaldogene Autotemcel
      - Ocrelizumab
      - Teplizumab-mzwv
      - Ublituximab-xiiy
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergic reaction to a tetanus vaccine (eg, Arthus-type reaction) or
      - Guillain-Barré syndrome (nerve disease that causes paralysis) after a tetanus
        vaccine, history of—Your doctor will decide if you should receive this vaccine.
    - type: list
      ordered: false
      items:
      - Immunodeficiency disorder (low blood counts for white cells or platelets)
        or
      - Weakened immune system—May not work as well in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this vaccine. This vaccine is given as a shot into one of your muscles, usually
      in the upper leg for infants or in the shoulder for older children, teenagers,
      and adults.
  - type: paragraph
    text: Depending on the age of the child, this vaccine is given as a series of
      3 or 4 doses. Teenagers and adults will receive a total of 3 doses.
  - type: paragraph
    text: After the first set of shots, you or your child should get a booster shot
      every 10 years.
  - type: paragraph
    text: It is important that you or your child receive all of the doses of vaccine
      in this series. Try to keep all of your scheduled appointments. If you miss
      a dose, make another appointment as soon as possible.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that you or your child return to your doctor’s office
      at the right time for the next dose . Be sure to notify your doctor of any unwanted
      effects that occur after you receive the vaccine.
  - type: paragraph
    text: If you or your child develop a skin rash, hives, or any allergic reaction
      after receiving this vaccine, tell your doctor right away.
  - type: paragraph
    text: Tell your doctor right away if you or your child are allergic to latex rubber.
      The prefilled syringes or bottle of vaccine may contain natural rubber latex.
      This may cause an allergic reaction in patients who are sensitive to latex.
  - type: paragraph
    text: This vaccine will not treat an active infection. If you or your child have
      an infection due to diphtheria or tetanus, you will need medicine to treat the
      infection.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever
      - general feeling of discomfort or illness
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chills
      - convulsions
      - cough
      - difficulty with swallowing
      - dizziness
      - fainting
      - fast heartbeat
      - hives
      - itching
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid weight gain
      - shortness of breath
      - skin rash
      - swelling or puffiness of the face
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
      - tightness in the chest
      - tingling of the hands or feet
      - unusual weight gain or loss
      - wheezing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hard lumps, redness, tenderness, or warmth at the injection site
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with moving
      - joint pain
      - lack or loss of strength
      - muscle aching or cramping
      - muscle stiffness
      - nausea
      - pain in the arms or legs
      - swollen joints
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
