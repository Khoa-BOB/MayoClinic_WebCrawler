    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: This medicine needs to be given on a fixed schedule. If you miss a dose
        or forget to use your medicine, call your doctor or pharmacist for instructions.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store unopened vials, cartridges, and injection devices of Nutropin® and
        Nutropin AQ® in the refrigerator, away from heat and direct light. Do not
        freeze.
    - type: paragraph
      text: Store unopened vials of Saizen® and Zorbtive® at room temperature, away
        from heat and direct light. Do not freeze.
    - type: paragraph
      text: Store the medicine that has been mixed in the refrigerator. The Nutropin®
        or Saizen® vials and Zorbtive® that has been mixed should be used within 14
        days. The Saizen® click.easy® cartridge that has been mixed should be used
        within 21 days. Nutropin AQ® pen cartridge and injection device should be
        used within 28 days. Make sure you understand how long you can store the medicine
        after it has been mixed . Throw away any mixed medicine that has not been
        used within this time.
    - type: paragraph
      text: You may store mixed Zomacton® in the refrigerator for up to 28 days. Do
        not freeze.
    - type: paragraph
      text: Throw away used needles in a hard, closed container that the needles cannot
        poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If you will be taking this medicine for a long time, it is very important
      that your doctor check your or your child's progress at regular visits . Blood
      and urine tests may be needed to check for any problems or unwanted effects
      that may be caused by this medicine.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Tell your doctor right away if you or your child have a rash, itching,
      swelling of the face, tongue, or throat, trouble breathing, or chest pain after
      receiving the medicine.
  - type: paragraph
    text: Using this medicine may increase your or your child's risk of getting cancer.
      Talk to your doctor if you have concerns about this risk.
  - type: paragraph
    text: This medicine may cause slipped capital femoral epiphysis (hip bone dislocation),
      which may lead to osteonecrosis (bone tissue dies caused by lack of blood supply).
      Check with your child's doctor right away if your child has a limp or pain in
      the hip or knee.
  - type: paragraph
    text: Pancreatitis (inflammation of the pancreas) has occurred rarely in some
      patients receiving somatropin. Tell your doctor right away if you or your child
      have sudden and severe stomach pain, chills, constipation, nausea, vomiting,
      fever, or lightheadedness.
  - type: paragraph
    text: This medicine may affect blood sugar levels. Check with your doctor if you
      or your child notice a change in the results of your blood or urine sugar tests
      or if you have any questions.
  - type: paragraph
    text: This medicine may cause an increased pressure in the head. Check with your
      doctor immediately if headache, nausea, vomiting, blurred vision, or any other
      change in vision occurs during treatment. Your doctor may want you or your child
      to have your eyes checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: This medicine may cause fluid retention (extra water in the body). Tell
      your doctor if you or your child have burning, numbness, pain, or tingling in
      all fingers except smallest finger, swelling of the hands and feet, or pain,
      swelling, or stiffness of the muscles. Your doctor may adjust your dose to reduce
      these side effects.
  - type: paragraph
    text: Check with your doctor right away if you have darkening of skin, diarrhea,
      dizziness, fainting, loss of appetite, mental depression, nausea, skin rash,
      unusual tiredness or weakness, or vomiting. These may be symptoms of an adrenal
      gland problem (hypoadrenalism).
  - type: paragraph
    text: This medicine is usually mixed with Bacteriostatic Water for Injection .
      You should not use Bacteriostatic Water for Injection if you have had an allergic
      reaction to benzyl alcohol. If this is a concern, ask your doctor about other
      ways to mix this medicine.
  - type: paragraph
    text: Before you have any medical tests, tell healthcare providers that you are
      using this medicine. The results of some tests may be affected by this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
