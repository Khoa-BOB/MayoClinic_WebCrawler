title: Somatropin, mammalian derived (injection route, subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Saizen
    - type: paragraph
      text: Serostim
    - type: paragraph
      text: Zorbtive
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Nutropin
    - type: paragraph
      text: Nutropin Aq
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Somatropin injection is used to treat growth hormone deficiency (inability
      to produce enough growth hormone), chronic kidney disease, idiopathic short
      stature (unexplained shortness), Turner syndrome, short stature homeobox-containing
      gene (SHOX) deficiency, and short stature born small for gestational age (SGA)
      with no catch-up growth by age 2 to 4 years of age. This medicine is a man-made
      version of the human growth hormone. Growth hormone is naturally produced by
      the pituitary gland and is necessary to stimulate growth in children.
  - type: paragraph
    text: Somatropin injection is also used together with a proper diet to treat short
      bowel syndrome (SBS), which is a condition that prevents the intestine or gut
      from absorbing food properly.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of somatropin injection in children
        with growth hormone deficiency.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of somatropin injection in children with short bowel syndrome.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of somatropin injection in the elderly.
        However, elderly patients are more sensitive to the effects of somatropin,
        which may require an adjustment of dosage in patients receiving somatropin
        injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Insulin Aspart, Recombinant
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Brain tumor or
      - Cancer, active or
      - Closed epiphyses (normal bone growth stopped) in children or
      - Diabetic retinopathy (eye condition) or
      - Prader-Willi syndrome (a genetic disorder), if severely overweight or have
        severe breathing problems or
      - Severe illness after surgery or major medical emergency (eg, open heart surgery,
        abdominal surgery, accidental trauma, or respiratory failure)—Should not be
        used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Cancer, history of or
      - Fluid retention, history of or
      - Hypopituitarism (pituitary gland produces low hormone levels) or
      - Hypothyroidism (underactive thyroid gland) or
      - Otitis media (ear infection) in children, history of or
      - Pancreatitis (inflammation or swelling of the pancreas) or
      - Scoliosis (abnormally curved spine)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Diabetes, or a family history of—Use with caution. May prevent insulin or
        other drugs for diabetes from working properly. .
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Turner syndrome—Use with caution. May increase risk of having serious problems
        (eg, pancreas, thyroid, or heart and blood vessel problems, ear or hearing
        disorders, diabetes, increased pressure in the head, and bone problems including
        dislocation in the hip bone or scoliosis).
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine is given as a shot under your skin in the stomach, buttock,
      upper arm, or thigh area, or into your muscle. Somatropin may sometimes be given
      at home to patients who do not need to be in the hospital. If you are using
      this medicine at home, your doctor will teach you how to prepare and inject
      the medicine. Be sure that you understand exactly how the medicine is prepared
      and injected .
  - type: paragraph
    text: If you are using this medicine to treat short bowel syndrome , carefully
      follow your doctor's instructions about any special diet. Take all other medicines
      or supplements your doctor has prescribed as part of your combination treatment.
  - type: paragraph
    text: This medicine comes with a patient information leaflet and patient instructions.
      Read and follow the instructions in the insert carefully. Ask your doctor if
      you have any questions.
  - type: paragraph
    text: There are many different forms (eg, vial, cartridge, injection device) available
      for this medicine. Read all instructions carefully to be sure you know how to
      use your device.
  - type: paragraph
    text: Each time you get your medicine, check to be sure you have received the
      proper device. Talk to your pharmacist if you have questions about the device
      that you were given.
  - type: paragraph
    text: You will be shown the body areas where this shot can be given. Use a different
      body area each time you give yourself a shot . Keep track of where you give
      each shot to make sure you rotate body areas. This will help prevent skin problems
      from the injections.
  - type: paragraph
    text: Use a new needle, unopened vial, or syringe each time you inject your medicine.
  - type: paragraph
    text: You might not use all of the medicine in each vial (glass container). Use
      each vial only one time. Do not save an open vial. If the medicine in the vial
      has changed color, or if you see particles in it, do not use it.
  - type: paragraph
    text: Use only the brand of this medicine that your doctor prescribed. Different
      brands may not work the same way.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: For treatment of growth hormone deficiency: Adults—
        Nutropin® or Nutropin AQ®: Non-weight based: At first, the usual dose is 0.15
        to 0.3 milligrams (mg) injected under the skin once a day. Your doctor may
        adjust your dose if needed. Weight-based: Dose is based on body weight and
        must be determined by your doctor. At first, the usual dose is not more than
        0.006 milligram (mg) per kilogram (kg) of body weight injected under the skin
        once a day. Your doctor may adjust your dose if needed. However, the dose
        is usually not more than 0.025 to 0.0125 mg per kg of body weight per day.
        Saizen®: Dose is based on body weight and must be determined by your doctor.
        At first, the usual dose is not more than 0.005 mg per kg of body weight injected
        under the skin once a day. Your doctor may adjust your dose if needed. Zomacton®:
        Non-weight based: At first, the usual dose is 0.15 to 0.3 milligrams (mg)
        injected under the skin once a day. Your doctor may adjust your dose if needed.
        Weight-based: Dose is based on body weight and must be determined by your
        doctor. At first, the usual dose is 0.006 milligram (mg) per kilogram (kg)
        of body weight injected under the skin once a day. Your doctor may adjust
        your dose if needed. However, the dose is usually not more than 0.0125 mg
        per kg of body weight per day. Children— Nutropin® or Nutropin AQ®: Dose is
        based on body weight and must be determined by your doctor. The weekly dose
        is up to 0.3 to 0.7 mg per kg of body weight injected under the skin and divided
        into daily doses. Your doctor may adjust your dose if needed. Saizen®: Dose
        is based on body weight and must be determined by your doctor. The usual dose
        is 0.06 mg per kg of body weight, given 3 times per week and injected under
        the skin or into a muscle. Your doctor may adjust your dose if needed. Zomacton®:
        Dose is based on body weight and must be determined by your doctor. The weekly
