title: Fluocinolone (intraocular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Iluvien
    - type: paragraph
      text: Retisert
    - type: paragraph
      text: Yutiq
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fluocinolone acetonide intravitreal implant is used in diabetic patients
      who have diabetic macular edema (DME). Macular edema is swelling in the back
      of the eye and may cause vision loss. This medicine is used in patients who
      already have received steroid medicines and did not have an increase in intraocular
      pressure.
  - type: paragraph
    text: Fluocinolone acetonide intravitreal implant is also used to treat chronic
      non-infectious uveitis (redness, pain, or swelling of the eye that is not caused
      by infection) of the back part of the eye.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Implant
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of fluocinolone acetonide implant in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of fluocinolone acetonide implant
        in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Desmopressin
      - Mifepristone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aspirin
      - Bemiparin
      - Carbamazepine
      - Cosyntropin
      - Ethinyl Estradiol
      - Fosphenytoin
      - Insulin Aspart, Recombinant
      - Macimorelin
      - Nadroparin
      - Phenytoin
      - Rabies Vaccine
      - Sargramostim
      - Somatrogon-ghla
      - Upadacitinib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Cataract or
      - Detached retina (eye disorder) or
      - Endophthalmitis (inflammation of the eye) or
      - Glaucoma (increased pressure in the eye) or
      - Herpes infection of the eye, history of—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Eye infection caused by a virus, fungus, or bacteria or
      - Fungal eye infection or
      - Glaucoma or
      - Herpes simplex infection of the eye or
      - Mycobacterial eye infection or
      - Vaccinia (smallpox) eye infection or
      - Varicella (chickenpox) eye infection—Should not be used in patients with these
        conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your eye doctor (ophthalmologist) will give you this medicine in a hospital
      or clinic. This medicine is an implant that is placed into your eye. It will
      stay into your eye and will not need to be removed for up to 3 years.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your eye doctor will want to check your progress at regular visits , especially
      during the first few weeks after you receive this medicine, to make sure this
      medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: Serious eye or vision problems (eg, eye infection or swelling, retinal detachment)
      may occur after receiving this medicine. Check with your eye doctor right away
      if you have a change in vision or the eye becomes red, sensitive to light, or
      painful, or if you are seeing flashes or sparks of light or seeing floating
      spots before the eyes, or a veil or curtain appearing across part of vision
      . Also, tell your doctor if you feel an increased pressure in the eye.
  - type: paragraph
    text: Cataracts may occur after receiving this medicine. Check with your doctor
      right away if you have blurred vision, decreased vision, or loss of vision.
  - type: paragraph
    text: This medicine may cause temporary blurred vision. Do not drive or do anything
      else that could be dangerous until you know how this medicine affects you .
  - type: paragraph
    text: This implant could move into a different part of your eye if the back part
      of your lens is missing or torn. Talk to your doctor if you have concerns.
  - type: paragraph
    text: If your symptoms do not improve or if they become worse, check with your
      eye doctor right away.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blindness
      - bloody eye
      - blurred vision
      - burning, dry, or itching eyes
      - change in color vision
      - decreased vision
      - difficulty seeing at night
      - discharge or excessive tearing
      - increased sensitivity of the eyes to sunlight
      - redness, pain, or swelling of the eye, eyelid, or inner lining of the eyelid
      - seeing flashes or sparks of light
      - seeing floating spots before the eyes, or a veil or curtain appearing across
        part of vision
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Feeling of having something in the eye
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
