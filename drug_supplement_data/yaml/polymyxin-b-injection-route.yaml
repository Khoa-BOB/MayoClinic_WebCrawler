title: Polymyxin b (injection route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Polymyxin B injection is used to treat bacterial infections in many different
      parts of the body.
  - type: paragraph
    text: Polymyxin B belongs to the group of medicines known as antibiotics. It works
      by killing bacteria or preventing their growth. However, this medicine will
      not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of polymyxin B injection in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of polymyxin B injection in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alcuronium
      - Atracurium
      - Cisatracurium
      - Doxacurium
      - Fazadinium
      - Gallamine
      - Hexafluorenium
      - Metocurine
      - Mivacurium
      - Pancuronium
      - Pipecuronium
      - Rapacuronium
      - Rocuronium
      - Tubocurarine
      - Vecuronium
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this medicine. This medicine is given as a shot into a muscle or a vein. It
      can also be given as a shot into your back.
  - type: paragraph
    text: Drink extra fluids so you will pass more urine while you or your child are
      using this medicine. This will keep your kidneys working well and help prevent
      kidney problems.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your or your child's progress during
      and after treatment . This is to make sure that the infection is cleared up
      completely, and to allow your doctor to check for any unwanted effects. Blood
      and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: If your or your child's symptoms do not improve within a few days, or if
      they become worse, check with your doctor.
  - type: paragraph
    text: Polymyxin B injection may cause diarrhea, and in some cases it can be severe.
      It may occur 2 months or more after you stop using this medicine. Do not take
      any medicine to treat diarrhea without first checking with your doctor. Diarrhea
      medicines may make the diarrhea worse or make it last longer. If you have any
      questions about this or if mild diarrhea continues or gets worse, check with
      your doctor.
  - type: paragraph
    text: Check with your doctor right away if you feel weak, irritable, drowsy, trouble
      seeing, numbness or tingling of the arms or legs, or other problems with muscle
      control.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - drowsiness
      - fever
      - headache
      - numbness or tingling in hands or feet
      - pain in the lower back or side
      - shakiness and unsteady walk
      - stiff neck
      - unsteadiness, trembling, or other problems with muscle control or coordination
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in skin color, pain, tenderness, or swelling at the injection site
      - face is warm or hot to touch
      - hives or welts
      - itching
      - redness of the skin
      - skin rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
