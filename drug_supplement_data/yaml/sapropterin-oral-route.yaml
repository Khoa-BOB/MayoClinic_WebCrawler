title: Sapropterin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Kuvan
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Sapropterin is used to lower phenylalanine levels in the blood of patients
      with phenylketonuria (PKU). High levels of phenylalanine (an amino acid) in
      the blood can cause severe brain damage, including intellectual disability,
      seizures, tremors, or decreased learning ability. This medicine is usually given
      along with a special diet.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Tablet, Disintegrating
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of sapropterin in children younger than 1 month of age. Safety
        and efficacy have not been established. .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of sapropterin
        have not been performed in the geriatric population. Safety and efficacy have
        not been established.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Levodopa
      - Methotrexate
      - Pemetrexed
      - Proguanil
      - Pyrimethamine
      - Trimethoprim
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Brain disease or
      - Seizures—May make these conditions worse if taken with levodopa.
    - type: list
      ordered: false
      items:
      - Eating disorder (eg, anorexia) or
      - Malnutrition—Proper diet is important while taking this medicine.
    - type: list
      ordered: false
      items:
      - Fever or any illness—May increase phenylalanine levels in your blood. Your
        doctor may need to change your dose of this medicine.
    - type: list
      ordered: false
      items:
      - Hypotension (low blood pressure) or
      - Liver disease—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. This medicine has not been tested in patients
        with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine should come with a patient information insert. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: It is best to take this medicine with food at the same time each day.
  - type: paragraph
    text: Carefully follow your doctor's instructions about any special diet . It
      is important that you maintain a diet with restricted amounts of phenylalanine.
  - type: paragraph
    text: 'Patients who weigh more than 10 kilograms who are using the powder for
      oral solution : Pour the contents of the 100 mg- or 500 mg- packet in 4 to 8
      ounces (1/2 to 1 cup) of water or apple juice. Mix thoroughly. Drink this mixture
      within 30 minutes. You may also add it in a small amount of food, such as applesauce
      or pudding before taking.'
  - type: paragraph
    text: 'Patients who weigh more than 10 kilograms who are using the tablets : You
      may swallow the tablets whole or mix them in 4 to 8 ounces (1/2 to 1 cup) of
      water or apple juice before taking. It may take a few minutes for the tablets
      to dissolve. To make the tablets dissolve faster, you may stir or crush them.
      Drink this mixture within 15 minutes. You may also crush the tablets and mix
      in a small amount of soft food, such as apple sauce or pudding before taking.'
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (solution or tablets): Adults and children 7 years
        of age and older—Dose is based on body weight and must be determined by your
        doctor. The starting dose is usually 10 to 20 milligrams (mg) per kilogram
        (kg) of body weight per day. Your doctor may adjust your dose if needed. Children
        1 month to 6 years of age—Dose is based on body weight and must be determined
        by your doctor. The starting dose is usually 10 mg per kg of body weight per
        day. Your doctor may adjust your dose if needed. Children younger than 1 month
        of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 7 years of age and older—Dose is based on body weight
        and must be determined by your doctor. The starting dose is usually 10 to
        20 milligrams (mg) per kilogram (kg) of body weight per day. Your doctor may
        adjust your dose if needed.
      - Children 1 month to 6 years of age—Dose is based on body weight and must be
        determined by your doctor. The starting dose is usually 10 mg per kg of body
        weight per day. Your doctor may adjust your dose if needed.
      - Children younger than 1 month of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the bottle tightly closed. Keep the medicine in the original bottle
        that you were given at the pharmacy.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood tests
      may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you have a rash, itching, lightheadedness or
      fainting, trouble breathing, trouble swallowing, or any swelling of your hands,
      face, or mouth while you or your child are using this medicine.
  - type: paragraph
    text: This medicine may cause esophagitis (inflammation of the esophagus) and
      gastritis (inflammation of the stomach). Check with your doctor right away if
      you or your child have a burning feeling in the chest or stomach, heartburn,
      indigestion, pain or burning in the throat, stomach upset, tenderness in the
      stomach area, trouble swallowing.
  - type: paragraph
    text: 'This medicine may cause hyperactivity (too much or constant activity).
      Tell your doctor if you or your child have any signs of the following: fidgeting
      or moving around too much or talking too much.'
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning feeling in the chest or stomach
      - cough
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - fidgeting or moving around too much
      - heartburn
      - indigestion
      - pain or burning in the throat
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - skin rash, hives, or itching
      - sores, ulcers, or white spots on lips or tongue or inside the mouth
      - stomach upset
      - talking too much
      - tenderness in the stomach area
      - tightness in the chest
      - trouble swallowing
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - headache
      - runny nose
      - sore throat
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Stuffy nose
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
