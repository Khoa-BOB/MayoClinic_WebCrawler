title: Albuterol (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Proventil
    - type: paragraph
      text: Proventil Repetabs
    - type: paragraph
      text: Ventolin
    - type: paragraph
      text: Volmax
    - type: paragraph
      text: VoSpire ER
    subsections: []
  - heading: Canadian Brand Name
    level: 3
