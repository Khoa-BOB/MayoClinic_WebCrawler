title: Levamlodipine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Conjupri
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Levamlodipine is used alone or together with other medicines to lower hypertension
      (high blood pressure) in adults and children. High blood pressure adds to the
      workload of the heart and arteries. If it continues for a long time, the heart
      and arteries may not function properly. This can damage the blood vessels of
      the brain, heart, and kidneys, resulting in a stroke, heart failure, or kidney
      failure. Lowering blood pressure can reduce the risk of strokes and heart attacks.
  - type: paragraph
    text: Levamlodipine is a calcium channel blocker. It affects the movement of calcium
      into the cells of the heart and blood vessels. This relaxes the blood vessels
      and lowers blood pressure. A lower blood pressure will increase the supply of
      blood and oxygen to the heart.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of levamlodipine to lower blood pressure in children younger
        than 6 years of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of levamlodipine in the elderly.
        However, elderly patients are more likely to have age-related kidney, liver,
        or heart problems, which may require caution and an adjustment in the dose
        for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Avacopan
      - Clarithromycin
      - Conivaptan
      - Cyclosporine
      - Fedratinib
      - Fexinidazole
      - Itraconazole
      - Letermovir
      - Mifepristone
      - Omaveloxolone
      - Phenobarbital
      - Primidone
      - Simvastatin
      - Tacrolimus
      - Tazemetostat
      - Voriconazole
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (chest pain) or
      - Heart attack, acute or
      - Heart or blood vessel disease (eg, coronary artery disease) or
      - Hypotension (low blood pressure)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Aortic stenosis (heart valve problem), severe or
      - Heart or blood vessel disease—Use with caution. May cause side effects to
        become worse.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these are most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: It is very important that you take your medicine exactly as directed and
      that you keep your appointments with your doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure, but
      it does help control it. Therefore, you must continue to take it as directed
      if you expect to lower your blood pressure and keep it down. You might have
      to take high blood pressure medicine for the rest of your life . If high blood
      pressure is not treated, it can cause serious problems such as heart failure,
      blood vessel disease, strokes, or kidney disease.
  - type: paragraph
    text: You may take this medicine with or without food. Take it at the same time
      each day.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For high blood pressure: Adults—At first,
        2.5 milligrams (mg) once a day. Some patients may be started on 1.25 mg once
        a day. Your doctor may adjust your dose as needed. However, the dose is usually
        not more than 5 mg per day. Children 6 to 17 years of age—1.25 to 2.5 mg once
        a day. Children younger than 6 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—At first, 2.5 milligrams (mg) once a day.
        Some patients may be started on 1.25 mg once a day. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 5 mg per day.
        Children 6 to 17 years of age—1.25 to 2.5 mg once a day. Children younger
        than 6 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 2.5 milligrams (mg) once a day. Some patients may be started
        on 1.25 mg once a day. Your doctor may adjust your dose as needed. However,
        the dose is usually not more than 5 mg per day.
      - Children 6 to 17 years of age—1.25 to 2.5 mg once a day.
      - Children younger than 6 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood tests
      may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause angina (chest pain) or a heart attack in certain
      patients with severe heart or blood vessel disease. Check with your doctor right
      away if you are having chest pain or discomfort, fast or irregular heartbeat,
      nausea or vomiting, pain or discomfort in the arms, jaw, back, or neck, trouble
      breathing, or sweating.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may also occur, especially when
      you get up suddenly from a lying or sitting position. If you feel dizzy, lie
      down so you do not faint. Then sit for a few moments before standing to prevent
      the dizziness from returning. If you faint, call your doctor right away.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may also occur if you exercise or
      if the weather is hot. Heavy sweating can cause loss of too much water and result
      in low blood pressure. Use extra care during exercise or hot weather.
  - type: paragraph
    text: Check with your doctor right away if you or your child have pain or tenderness
      in the upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: If you have been using this medicine regularly for several weeks, do not
      suddenly stop using it . Stopping suddenly may cause your chest pain or high
      blood pressure to come back or get worse. Check with your doctor for the best
      way to reduce gradually the amount you are taking before stopping completely.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes prescription or nonprescription (over-the-counter [OTC])
      medicines for appetite control, asthma, colds, cough, hay fever, or sinus problems,
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - fast, irregular, pounding, or racing heartbeat or pulse
      - feeling of warmth
      - redness of the face, neck, arms, and occasionally, upper chest
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - cough
      - difficulty with swallowing
      - dizziness
      - fainting
      - hives, itching, rash
      - increased sweating
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - slow heartbeat
      - tightness in the chest
      - trouble breathing
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - clay-colored stools
      - dark urine
      - fever or chills
      - headache
      - loss of appetite
      - nausea
      - unpleasant breath odor
      - vomiting of blood yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sleepiness or unusual drowsiness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - bleeding gums
      - bloated
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - burning, dry, or itching eyes
      - continuing ringing or buzzing or other unexplained noise in the ears
      - decreased sexual performance or desire
      - difficulty having a bowel movement (stool)
      - difficulty in moving
      - discharge, excessive tearing
      - double vision
      - dry mouth
      - excess air or gas in the stomach or intestines
      - eye pain
      - feeling of constant movement of self or surroundings
      - full feeling
      - hearing loss
      - irritation in the mouth
      - lack or loss of strength
      - muscle pain or stiffness
      - pain in the joints
      - passing gas
      - redness and swelling of the gums
      - redness, pain, or swelling of the eye, eyelid, or inner lining of the eyelid
      - redness, soreness, or itching skin
      - seeing double
      - sensation of spinning
      - shakiness in the legs, arms, hands, or feet
      - sores, welting, or blisters
      - trouble sleeping
      - vomiting
      - weight changes
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
