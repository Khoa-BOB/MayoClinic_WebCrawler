        not more than 6 mg per day. Weighing 19.5 kg to 25.4 kg—800 mcg once a day.
        Your doctor may adjust your dose as needed and tolerated. However, the dose
        is usually not more than 6 mg per day. Weighing less than 19.5 kg—Use of oral
        pellets is recommended. Children younger than 3 months of age—Use and dose
        must be determined by your doctor.'
