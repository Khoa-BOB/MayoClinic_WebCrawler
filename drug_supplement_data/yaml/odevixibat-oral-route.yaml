title: Odevixibat (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Bylvay
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Odevixibat is used to treat pruritus (skin itching) in patients with progressive
      familial intrahepatic cholestasis (PFIC) and alagille syndrome (ALGS).
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
    - Pellet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of odevixibat in children younger than 3 months of age with
        progressive familial intrahepatic cholestasis (PFIC) and in children younger
        than 12 months of age with alagille syndrome (ALGS) . Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of odevixibat in geriatric patients. Safety and efficacy have
        not been established.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Fat-soluble vitamin ( vitamins A, D, E, and K) deficiency or
      - Liver disease—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: Take this medicine in the morning with food.
  - type: paragraph
    text: 'To use the capsule:'
  - type: list
    ordered: false
    items:
    - Swallow the capsule whole with a glass of water. Do not chew or crush it.
    - If you are not able to swallow the capsule whole, you may open, sprinkle, and
      mix it with a small amount of soft food (eg, apple sauce, oatmeal, banana or
      carrot puree, chocolate or rice pudding) or liquid (eg, breast milk, infant
      formula, or water).
    - Take the mixture right away and drink water. Do not store for future use.
  - type: paragraph
    text: You may mix the oral pellets into soft food or liquid. Do not swallow the
      capsule shell whole.
  - type: paragraph
    text: 'To use the oral pellets with soft food:'
  - type: list
    ordered: false
    items:
    - Mix the medicine in a small amount of soft food (eg, apple sauce, oatmeal, banana
      or carrot puree, chocolate or rice pudding).
    - Place a small amount (at least 2 tablespoons) of soft food in a bowl. Keep it
      at room temperature or cooler.
    - Open the shell and empty the contents into the bowl of soft food. Gently mix
      it with a spoon.
    - Take the mixture right away and drink water, breast milk, or infant formula.
      Do not store for later use.
  - type: paragraph
    text: 'To use the oral pellets with liquid:'
  - type: list
    ordered: false
    items:
    - Open the shell and empty the contents into a small mixing cup.
    - Add 1 teaspoon or 5 milliliters (mL) of liquid (eg, breast milk, infant formula,
      or water). Let the pellets sit in the liquid for 5 minutes to allow complete
      wetting.
    - Measure the mixture with the oral dosing syringe.
    - Place the tip of the oral syringe in the mouth between the tongue and the side
      of the mouth. Swallow the mixture and drink water, breast milk, or infant formula.
    - Do not squirt the mixture in the back of the throat to avoid gagging or choking.
      Do not give using a bottle or sippy cup.
  - type: paragraph
    text: Take this medicine at least 4 hours before or 4 hours after using bile acid
      sequestrants (eg, cholestyramine, colesevelam, colestipol).
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For cholestatic pruritus in patients in
        alagille syndrome (ALGS): Adults and children 12 months of age and older weighing
        19.5 kilograms or more—Dose is base on weight and must be determined by your
        doctor. The dose is usually 120 micrograms per kilogram (mcg/kg) of body weight
        once a day. Weighing 55.5 kilograms (kg) or more—7200 micrograms (mcg) once
        a day. Your doctor may adjust your dose as needed and tolerated. Weighing
        45.5 kg to 55.4 kg—6000 mcg once a day. Your doctor may adjust your dose as
        needed and tolerated. Weighing 35.5 kg to 45.4 kg—4800 mcg once a day. Your
        doctor may adjust your dose as needed and tolerated. Weighing 25.5 kg to 35.4
        kg—3600 mcg once a day. Your doctor may adjust your dose as needed and tolerated.
        Weighing 19.5 kg to 25.4 kg—2400 mcg once a day. Your doctor may adjust your
        dose as needed and tolerated. Weighing less than 19.5 kg—Use of oral pellets
        is recommended. Children younger than 12 months of age—Use and dose must be
        determined by your doctor. For pruritus in patients with progressive familial
        intrahepatic cholestasis: Adults and children 3 months of age and older weighing
        19.5 kilograms (kg) or more—Dose is base on weight and must be determined
        by your doctor. The dose is usually 40 micrograms per kilogram (mcg/kg) of
        body weight once a day. Weighing 55.5 kilograms (kg) or more—2400 micrograms
        (mcg) once a day. Your doctor may adjust your dose as needed and tolerated.
        However, the dose is usually not more than 6 milligrams (mg) per day. Weighing
        45.5 kg to 55.4 kg—2000 mcg once a day. Your doctor may adjust your dose as
        needed and tolerated. However, the dose is usually not more than 6 mg per
