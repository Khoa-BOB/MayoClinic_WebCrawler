title: Carbol-fuchsin solution (topical route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Carbol-fuchsin is used to treat postoperative phenol nail procedures. It
      may also be used as a first aid antiseptic drying agent in skin conditions where
      there is too much moisture. This medicine may also be used for other infections
      as determined by your doctor.
  - type: paragraph
    text: This medicine is available without a prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: If you are treating an infant or child with eczema, do not use carbol-fuchsin
        more than once a day. Although there is no specific information comparing
        use of carbol-fuchsin in children treated for other conditions with use in
        other age groups, this medicine is not expected to cause different side effects
        or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of carbol-fuchsin in the elderly
        with use in other age groups.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Carbol-fuchsin is a poison if swallowed. Use only on the affected areas
      as directed. Do not swallow this medicine. Do not use near the eyes or over
      large areas of the body. Do not use on deep wounds, puncture wounds, animal
      bites, or serious burns.
  - type: paragraph
    text: Before applying this medicine, wash the affected areas with soap and water,
      and dry thoroughly.
  - type: paragraph
    text: Using an applicator or swab, apply this medicine only to the affected areas.
      Do not bandage the area.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (solution): For postoperative phenol nail procedures
        or as a first aid antiseptic drying agent: Adults and children—Apply to the
        affected area(s) of the skin one to three times a day. Do not use this medicine
        for more than one week unless your doctor tells you to do so.'
    - type: list
      ordered: false
      items:
      - 'For postoperative phenol nail procedures or as a first aid antiseptic drying
        agent: Adults and children—Apply to the affected area(s) of the skin one to
        three times a day. Do not use this medicine for more than one week unless
        your doctor tells you to do so.'
    - type: list
      ordered: false
      items:
      - Adults and children—Apply to the affected area(s) of the skin one to three
        times a day. Do not use this medicine for more than one week unless your doctor
        tells you to do so.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your skin problem does not improve within 1 week, or if it becomes worse,
      check with your doctor.
  - type: paragraph
    text: This medicine will stain skin and clothing. Avoid getting it on your clothes.
      The stain will slowly wear off your skin.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  - type: list
    ordered: false
    items:
    - Skin irritation not present before use of this medicine
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  - type: list
    ordered: false
    items:
    - Mild, temporary stinging
  - type: paragraph
    text: Other side effects not listed may also occur in some patients. If you notice
      any other effects, check with your healthcare professional.
  - type: paragraph
    text: Call your doctor for medical advice about side effects. You may report side
      effects to the FDA at 1-800-FDA-1088.
