title: Naloxegol (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Movantik
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Naloxegol is used to treat constipation that is caused by opioids (narcotic
      pain medicines) in adults with long-lasting pain that is not caused by cancer,
      or in patients with long-lasting pain caused by a previous cancer or its treatment
      who do not need weekly increases in opioid dosage.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of naloxegol in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of naloxegol in the elderly. However,
        elderly patients are more sensitive to the effects of this medicine than younger
        adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Boceprevir
      - Ceritinib
      - Clarithromycin
      - Cobicistat
      - Darunavir
      - Idelalisib
      - Indinavir
      - Itraconazole
      - Ketoconazole
      - Levoketoconazole
      - Lonafarnib
      - Mifepristone
      - Nefazodone
      - Nelfinavir
      - Nirmatrelvir
      - Paritaprevir
      - Posaconazole
      - Ribociclib
      - Ritonavir
      - Saquinavir
      - Telaprevir
      - Telithromycin
      - Troleandomycin
      - Tucatinib
      - Voriconazole
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Adagrasib
      - Alvimopan
      - Apalutamide
      - Aprepitant
      - Atazanavir
      - Avacopan
      - Carbamazepine
      - Ciprofloxacin
      - Conivaptan
      - Crizotinib
      - Dabrafenib
      - Diltiazem
      - Dronedarone
      - Duvelisib
      - Encorafenib
      - Enzalutamide
      - Erythromycin
      - Etravirine
      - Fedratinib
      - Fexinidazole
      - Fluconazole
      - Fosaprepitant
      - Fosnetupitant
      - Fosphenytoin
      - Imatinib
      - Ivosidenib
      - Larotrectinib
      - Lefamulin
      - Lenacapavir
      - Letermovir
      - Lorlatinib
      - Lumacaftor
      - Methylnaltrexone
      - Miconazole
      - Mitotane
      - Nalorphine
      - Naloxone
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Crohn's disease or
      - Diverticulitis or
      - Ogilvie's syndrome or
      - Peptic ulcer or
      - Stomach or bowel cancer—May increase risk for more serious side effects.
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate to severe—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Patients at increased risk of stomach blockage or
      - Stomach or bowel blockage, known or suspected—Should not be used in patients
        with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Take this medicine on an empty stomach at least 1 hour before the first
      meal of the day or 2 hours after a meal.
  - type: paragraph
    text: Swallow the tablet whole. Do not crush, break, or chew it.
  - type: paragraph
    text: Stop taking other laxatives before starting treatment with naloxegol. Also,
      you should stop taking naloxegol if you have stopped taking narcotic pain medicines.
  - type: paragraph
    text: If you have trouble swallowing the tablet, you may crush and mix it with
      120 milliliters (mL) (4 ounces) of water and drink it right away. Refill the
      glass with the same amount of water, stir, and drink it right away to make sure
      you get the full dose of this medicine.
  - type: paragraph
    text: 'If you have trouble swallowing the tablet, it may also be given through
      a nasogastric tube :'
  - type: list
    ordered: false
    items:
    - Draw up 30 mL (1 ounce) of water into a 60 mL syringe and flush it down the
      nasogastric tube.
    - Crush the tablet and mix it with 60 mL (2 ounces) of water.
    - Draw up the mixture using the 60 mL syringe and give it through the tube.
    - Add 60 mL of water to the mixture and use the same syringe to flush the tube
      for any remaining medicine to get the full dose of this medicine.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For constipation caused by opioids: Adults—25
        milligrams (mg) once a day in the morning for at least 4 weeks (together with
        narcotic pain medicines). Your doctor may adjust your dose as needed. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For constipation caused by opioids: Adults—25 milligrams (mg) once a day
        in the morning for at least 4 weeks (together with narcotic pain medicines).
        Your doctor may adjust your dose as needed. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—25 milligrams (mg) once a day in the morning for at least 4 weeks (together
        with narcotic pain medicines). Your doctor may adjust your dose as needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to decide if you should continue to take it.
  - type: paragraph
    text: Do not take this medicine together with clarithromycin, itraconazole, or
      ketoconazole. Using these medicines together may cause or worsen opioid withdrawal
      symptoms, such as anxiety, chills, diarrhea, irritability, stomach pain, sweating,
      and yawning .
  - type: paragraph
    text: Call your doctor right away if you have severe stomach pain or diarrhea
      while you are using this medicine.
  - type: paragraph
    text: This medicine may cause a tear (perforation) in your stomach or bowels.
      Check with your doctor right away if you have a severe stomach pain that does
      not go away.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - chills
      - diarrhea
      - increased sweating
      - irritability
      - stomach pain
      - yawning
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody, black or tarry stools
      - heartburn
      - indigestion
      - nausea
      - severe abdominal or stomach pain, cramping, or burning
      - trouble breathing
      - vomiting of material that looks like coffee grounds, severe and continuous
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloated
      - excess air or gas in the stomach or bowels
      - full feeling
      - passing of gas
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
