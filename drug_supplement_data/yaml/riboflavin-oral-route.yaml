        4 to 6 years of age—0.9 mg per day. Children birth to 3 years of age—0.3 to
        0.7 mg per day.'
      - 'To treat deficiency: Adults and teenagers—Treatment dose is determined by
        prescriber for each individual based on the severity of deficiency.'
