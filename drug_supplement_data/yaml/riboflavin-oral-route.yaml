    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Vitamins are compounds that you must have for growth and health. They are
      needed in small amounts only and are usually available in the foods that you
      eat. Riboflavin (vitamin B 2) is needed to help break down carbohydrates, proteins,
      and fats. It also makes it possible for oxygen to be used by your body.
  - type: paragraph
    text: Lack of riboflavin may lead to itching and burning eyes, sensitivity of
      eyes to light, sore tongue, itching and peeling skin on the nose and scrotum,
      and sores in the mouth. Your doctor may treat this condition by prescribing
      riboflavin for you.
  - type: paragraph
    text: 'Some conditions may increase your need for riboflavin. These include:'
  - type: list
    ordered: false
    items:
    - Alcoholism
    - Burns
    - Cancer
    - Diarrhea (continuing)
    - Fever (continuing)
    - Illness (continuing)
    - Infection
    - Intestinal diseases
    - Liver disease
    - Overactive thyroid
    - Serious injury
    - Stress (continuing)
    - Surgical removal of stomach
  - type: paragraph
    text: In addition, riboflavin may be given to infants with high blood levels of
      bilirubin (hyperbilirubinemia).
  - type: paragraph
    text: Increased need for riboflavin should be determined by your health care professional.
  - type: paragraph
    text: Claims that riboflavin is effective for treatment of acne, some kinds of
      anemia (weak blood), migraine headaches, and muscle cramps have not been proven.
  - type: paragraph
    text: Oral forms of riboflavin are available without a prescription.
  subsections:
  - heading: Importance Of Diet
    level: 3
    content:
    - type: paragraph
      text: For good health, it is important that you eat a balanced and varied diet.
        Follow carefully any diet program your health care professional may recommend.
        For your specific dietary vitamin and/or mineral needs, ask your health care
        professional for a list of appropriate foods. If you think that you are not
        getting enough vitamins and/or minerals in your diet, you may choose to take
        a dietary supplement.
    - type: paragraph
      text: Riboflavin is found in various foods, including milk and dairy products,
        fish, meats, green leafy vegetables, and whole grain and enriched cereals
        and bread. It is best to eat fresh fruits and vegetables whenever possible
        since they contain the most vitamins. Food processing may destroy some of
        the vitamins, although little riboflavin is lost from foods during ordinary
        cooking.
    - type: paragraph
      text: Vitamins alone will not take the place of a good diet and will not provide
        energy. Your body also needs other substances found in food such as protein,
        minerals, carbohydrates, and fat. Vitamins themselves often cannot work without
        the presence of other foods.
    - type: paragraph
      text: The daily amount of riboflavin needed is defined in several different
        ways.
    subsections: []
  - heading: For U.S.—
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Recommended Dietary Allowances (RDAs) are the amount of vitamins and minerals
        needed to provide for adequate nutrition in most healthy persons. RDAs for
        a given nutrient may vary depending on a person's age, sex, and physical condition
        (e.g., pregnancy).
      - Daily Values (DVs) are used on food and dietary supplement labels to indicate
        the percent of the recommended daily amount of each nutrient that a serving
        provides. DV replaces the previous designation of United States Recommended
        Daily Allowances (USRDAs).
    subsections: []
  - heading: For Canada—
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Recommended Nutrient Intakes (RNIs) are used to determine the amounts of vitamins,
        minerals, and protein needed to provide adequate nutrition and lessen the
        risk of chronic disease.
    - type: paragraph
      text: 'Normal daily recommended intakes for riboflavin are generally defined
        as follows:'
    - type: paragraph
      text: 'This product is available in the following dosage forms:'
    - type: list
      ordered: false
      items:
      - Tablet
      - Capsule
      - Suspension
    subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'If you are taking this dietary supplement without a prescription, carefully
      read and follow any precautions on the label. For this supplement, the following
      should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Problems in children have not been reported with intake of normal daily
        recommended amounts.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Problems in older adults have not been reported with intake of normal
        daily recommended amounts.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): To prevent deficiency, the amount taken by
        mouth is based on normal daily recommended intakes: For the U.S. Adults and
        teenage males—1.4 to 1.8 milligrams (mg) per day. Adults and teenage females—1.2
        to 1.3 mg per day. Pregnant females—1.6 mg per day. Breast-feeding females—1.7
        to 1.8 mg per day. Children 7 to 10 years of age—1.2 mg per day. Children
        4 to 6 years of age—1.1 mg per day. Children birth to 3 years of age—0.4 to
        0.8 mg per day. For Canada Adults and teenage males—1 to 1.6 mg per day. Adults
        and teenage females—1 to 1.1 mg per day. Pregnant females—1.1 to 1.4 mg per
        day. Breast-feeding females—1.4 to 1.5 mg per day. Children 7 to 10 years
        of age—1 to 1.3 mg per day. Children 4 to 6 years of age—0.9 mg per day. Children
        birth to 3 years of age—0.3 to 0.7 mg per day. To treat deficiency: Adults
        and teenagers—Treatment dose is determined by prescriber for each individual
        based on the severity of deficiency.'
    - type: list
      ordered: false
      items:
      - 'To prevent deficiency, the amount taken by mouth is based on normal daily
        recommended intakes: For the U.S. Adults and teenage males—1.4 to 1.8 milligrams
        (mg) per day. Adults and teenage females—1.2 to 1.3 mg per day. Pregnant females—1.6
