  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the dietary supplement in a closed container at room temperature,
        away from heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a dietary supplement may cause some unwanted
      effects. Riboflavin may cause urine to have a more yellow color than normal,
      especially if large doses are taken. This is to be expected and is no cause
      for alarm. Usually, however, riboflavin does not cause any side effects. Check
      with your health care professional if you notice any other unusual effects while
      you are using it.
