title: Pyrithione (topical route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Pyrithione is used to help control the symptoms of dandruff and seborrheic
      dermatitis of the scalp.
  - type: paragraph
    text: This medicine is available without a prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Cream
    - Spray
    - Shampoo
    - Soap
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of pyrithione
        in children with use in other age groups, this medicine is not expected to
        cause different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of pyrithione
        in the elderly with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: For best results, use this medicine at least 2 times a week or as directed
      by your doctor.
  - type: paragraph
    text: 'To use:'
  - type: list
    ordered: false
    items:
    - Before applying this shampoo, wet the hair and scalp with lukewarm water.
    - Apply enough shampoo to the scalp to work up a lather and rub in well, then
      rinse.
    - Apply the shampoo again and rinse thoroughly.
  - type: paragraph
    text: Keep this medicine away from the eyes. If you should accidentally get some
      in your eyes, flush them thoroughly with water.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For bar dosage form: For dandruff and seborrheic dermatitis: Adults and children—Apply
        to the affected skin of body, face, or scalp once a day at least two times
        a week. Lather, massage into affected area, rinse, and repeat.'
    - type: list
      ordered: false
      items:
      - 'For dandruff and seborrheic dermatitis: Adults and children—Apply to the
        affected skin of body, face, or scalp once a day at least two times a week.
        Lather, massage into affected area, rinse, and repeat.'
    - type: list
      ordered: false
      items:
      - Adults and children—Apply to the affected skin of body, face, or scalp once
        a day at least two times a week. Lather, massage into affected area, rinse,
        and repeat.
    - type: list
      ordered: false
      items:
      - 'For cream dosage forms: For dandruff or seborrheic dermatitis: Adults and
        children—Apply one to three times a day to affected skin on the body, face,
        or scalp or as directed by the doctor. For Brylcreem Antidandruff—Adults:
        Apply to scalp once a day after shampooing and toweling hair dry. Massage
        into scalp for one minute. Children—Use and dose must be determined by the
        doctor.'
    - type: list
      ordered: false
      items:
      - 'For dandruff or seborrheic dermatitis: Adults and children—Apply one to three
        times a day to affected skin on the body, face, or scalp or as directed by
        the doctor. For Brylcreem Antidandruff—Adults: Apply to scalp once a day after
        shampooing and toweling hair dry. Massage into scalp for one minute. Children—Use
        and dose must be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children—Apply one to three times a day to affected skin on the
        body, face, or scalp or as directed by the doctor.
      - 'For Brylcreem Antidandruff—Adults: Apply to scalp once a day after shampooing
        and toweling hair dry. Massage into scalp for one minute.'
      - Children—Use and dose must be determined by the doctor.
    - type: list
      ordered: false
      items:
      - 'For lotion dosage form: For dandruff and seborrheic dermatitis: For DermaZinc
        Scalp: Adults—Apply to scalp one to three times a day or as directed by the
        doctor. For DermaZinc Spray: Adults—Apply one spray to affected skin of body,
        face, or scalp one to three times a day or as directed by the doctor. Medicine
        should cover a three-inch-square area. Treatment should continue for one week
        after symptoms lessen. For DermaZinc Baby: Children—Apply to affected skin
        of face, body, or scalp one to four times a day or as directed by the doctor.'
    - type: list
      ordered: false
      items:
      - 'For dandruff and seborrheic dermatitis: For DermaZinc Scalp: Adults—Apply
        to scalp one to three times a day or as directed by the doctor. For DermaZinc
        Spray: Adults—Apply one spray to affected skin of body, face, or scalp one
        to three times a day or as directed by the doctor. Medicine should cover a
        three-inch-square area. Treatment should continue for one week after symptoms
        lessen. For DermaZinc Baby: Children—Apply to affected skin of face, body,
        or scalp one to four times a day or as directed by the doctor.'
    - type: list
      ordered: false
      items:
      - 'For DermaZinc Scalp: Adults—Apply to scalp one to three times a day or as
        directed by the doctor.'
      - 'For DermaZinc Spray: Adults—Apply one spray to affected skin of body, face,
        or scalp one to three times a day or as directed by the doctor. Medicine should
        cover a three-inch-square area. Treatment should continue for one week after
        symptoms lessen.'
      - 'For DermaZinc Baby: Children—Apply to affected skin of face, body, or scalp
        one to four times a day or as directed by the doctor.'
    - type: list
      ordered: false
      items:
      - 'For lotion shampoo dosage forms: For dandruff and seborrheic dermatitis:
        Adults and children up to 2 years of age—Use once a day as a shampoo on the
        scalp at least two times a week; however, may be used every day. Apply to
        wet hair and leave on the scalp for several minutes or massage into scalp
        vigorously before rinsing. Children up to 2 years of age—Use and dose must
        be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - 'For dandruff and seborrheic dermatitis: Adults and children up to 2 years
        of age—Use once a day as a shampoo on the scalp at least two times a week;
        however, may be used every day. Apply to wet hair and leave on the scalp for
        several minutes or massage into scalp vigorously before rinsing. Children
        up to 2 years of age—Use and dose must be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children up to 2 years of age—Use once a day as a shampoo on the
        scalp at least two times a week; however, may be used every day. Apply to
        wet hair and leave on the scalp for several minutes or massage into scalp
        vigorously before rinsing.
      - Children up to 2 years of age—Use and dose must be determined by the doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your condition does not get better after regular use of this medicine,
      or if it gets worse, check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Irritation of skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
