title: Methoxsalen (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Oxsoralen
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ultramop
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Methoxsalen belongs to the group of medicines called psoralens. It is used
      along with ultraviolet light (found in sunlight and some special lamps) in a
      treatment called psoralen plus ultraviolet light A (PUVA) to treat vitiligo,
      a disease in which skin color is lost. Methoxsalen may also be used for other
      conditions as determined by your doctor.
  - type: paragraph
    text: Methoxsalen is available only with a prescription and is to be administered
      by or under the direct supervision of your doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  - type: paragraph
    text: Methoxsalen is a very strong medicine that increases the skin's sensitivity
      to sunlight. In addition to causing serious sunburns if not properly used, it
      has been reported to increase the chance of skin cancer. Also, like too much
      sunlight, PUVA can cause premature aging of the skin. Therefore, methoxsalen
      should be used only as directed and should not be used simply for suntanning.
      Before using this medicine, be sure that you have discussed its use with your
      doctor.
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of methoxsalen in children up to
        12 years of age with use in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of topical methoxsalen in the
        elderly with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Fezolinetant
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Anagrelide
      - Clomipramine
      - Melatonin
      - Pimozide
      - Tegafur
      - Tizanidine
      - Vorasidenib
      - Warfarin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Fosphenytoin
      - Phenytoin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to sunlight (or family history of) or
      - Infection or
      - Lupus erythematosus or
      - Porphyria or
      - Skin cancer (history of) or
      - Skin conditions (other)—Use of PUVA may make the condition worse
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease (severe)—The heat or prolonged standing associated
        with each light treatment may make the condition worse
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Eating certain foods while you are using methoxsalen may increase your skin's
      sensitivity to sunlight. To help prevent this, avoid eating limes, figs, parsley,
      parsnips, mustard, carrots, and celery while you are being treated with this
      medicine.
  - type: paragraph
    text: Use this medicine only under the direct supervision of your doctor.
  - type: paragraph
    text: After UVA exposure, wash the treated area of skin with soap and water. Then
      use a sunscreen or wear protective clothing to protect the area.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical solution dosage form: For vitiligo: Adults and children 12 years
        of age and over—Apply to the affected area of the skin and allow to dry for
        one to two minutes, then apply again within two to two and one-half hours
        before UVA exposure. Children under 12 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For vitiligo: Adults and children 12 years of age and over—Apply to the affected
        area of the skin and allow to dry for one to two minutes, then apply again
        within two to two and one-half hours before UVA exposure. Children under 12
        years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and over—Apply to the affected area of
        the skin and allow to dry for one to two minutes, then apply again within
        two to two and one-half hours before UVA exposure.
      - Children under 12 years of age—Use and dose must be determined by your doctor.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that you visit your doctor as directed for treatments and
      to have your progress checked.
  - type: paragraph
    text: This medicine increases the sensitivity of the treated areas of your skin
      to sunlight. Therefore, exposure to the sun, even through window glass or on
      a cloudy day, could cause a serious burn. After each light treatment, thoroughly
      wash the treated areas of your skin. Also, if you must go out during daylight
      hours, cover the treated areas of your skin for at least 12 to 48 hours following
      treatment by wearing protective clothing or a sun block product that has a skin
      protection factor (SPF) of at least 15. Some patients may require a product
      with a higher SPF number, especially if they have a fair complexion. If you
      have any questions about this, check with your health care professional.
  - type: paragraph
    text: The treated areas of your skin may continue to be sensitive to sunlight
      for some time after treatment with this medicine. Use extra caution for at least
      72 hours following each treatment if you plan to spend any time in the sun.
      In addition, do not sunbathe anytime during your course of treatment with methoxsalen.
  - type: paragraph
    text: This medicine may cause your skin to become dry or itchy. However, check
      with your doctor before applying anything to your skin to treat this problem.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  - type: list
    ordered: false
    items:
    - Blistering and peeling of skin
    - reddened, sore skin
    - swelling, especially of the feet or lower legs
  - type: paragraph
    text: There is an increased risk of developing skin cancer after use of methoxsalen.
      You should check the treated areas of your body regularly and show your doctor
      any skin sores that do not heal, new skin growths, and skin growths that have
      changed in the way they look or feel.
  - type: paragraph
    text: Premature aging of the skin may occur as a result of prolonged methoxsalen
      therapy. This effect is permanent and is similar to the result of sunbathing
      for long periods of time.
  - type: paragraph
    text: Other side effects not listed may also occur in some patients. If you notice
      any other effects, check with your healthcare professional.
  - type: paragraph
    text: Call your doctor for medical advice about side effects. You may report side
      effects to the FDA at 1-800-FDA-1088.
