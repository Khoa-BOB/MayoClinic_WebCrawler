        not occur. Children 6 months to 1 year of age—The usual dose is 5 to 10 mL
        (1 to 2 teaspoonfuls). One-half to one full glass (120 to 240 mL) of water
        should be taken right before or right after the dose. The dose may be repeated
        one time after twenty to thirty minutes if vomiting does not occur. Children
        up to 6 months of age—Ipecac must be given only under the direction of your
        doctor.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—The usual dose is 15 to 30 milliliters (mL) (1 to 2 tablespoonfuls),
        followed immediately by one full glass (240 mL) of water. The dose may be
