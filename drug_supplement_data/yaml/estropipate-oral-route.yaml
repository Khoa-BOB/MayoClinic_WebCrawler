      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and does not cause unwanted effects.
      Blood tests, pelvic exam, breast exam, and mammogram (breast x-ray) may be needed
      to check for unwanted effects, unless your doctor tells you otherwise. Be sure
      to keep all appointments.
  - type: paragraph
    text: It is unlikely that a postmenopausal woman may become pregnant. But, you
      should know that using this medicine while you are pregnant could harm your
      unborn baby. If you think you have become pregnant while using the medicine,
      tell your doctor right away.
  - type: paragraph
    text: Using this medicine may increase your risk for having blood clots, strokes,
      or heart attacks. This risk may continue even after you stop using the medicine.
      Your risk for these serious problems is even greater if you have high blood
      pressure, high cholesterol in your blood, diabetes or are overweight or smoke
      cigarettes. Contact your doctor immediately if you experience chest pain, confusion,
      difficulty speaking, double vision, headaches, an inability to move arms, legs
      or facial muscle, or an inability to speak.
  - type: paragraph
    text: Using this medicine may increase your risk of endometrial cancer, breast
      cancer, or uterine cancer. Talk with your doctor about this risk. Do not use
      this medicine if you have had your uterus (womb) removed (hysterectomy). Check
      with your doctor immediately if your experience abnormal vaginal bleeding.
  - type: paragraph
    text: Using this medicine may increase your risk of dementia, especially in women
      65 years of age and older.
  - type: paragraph
    text: Check with your doctor immediately if severe headache or sudden loss of
      vision or any other change in vision occurs while you are using this medicine.
      Your doctor may want you to have your eyes checked by an ophthalmologist (eye
      doctor).
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine before you have surgery
      or if you need to stay in bed for an extended time. This medicine may affect
      the results of certain medical tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - anxiety
      - backache
      - belching
      - breast discharge, swelling, or pain
      - change in vaginal discharge
      - changes in skin color, pain, tenderness
      - chest pain or discomfort
      - chills
      - clay-colored stools
      - confusion
      - constipation
      - cough
      - cramps
      - darkened urine
      - diarrhea
      - difficulty speaking
      - difficulty swallowing
      - dizziness or lightheadedness
      - double vision
      - fainting
      - fast heartbeat
      - fever
      - full or bloated feeling or pressure in the stomach
      - headache
      - heartburn
      - heavy bleeding
      - hives, itching, skin rash
      - inability to move the arms, legs, or facial muscles
      - inability to speak
      - indigestion
      - itching of the vagina or outside genitals
      - loss of appetite
      - nausea
      - pain during sexual intercourse
      - pain or discomfort in the arms, jaw, back, or neck
      - pain or feeling of pressure in the pelvis
      - pains in stomach, side, or abdomen, possibly radiating to the back
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - slow speech
      - stomach discomfort, upset, or pain
      - sudden shortness of breath or troubled breathing
      - sweating
      - swelling of the abdominal or stomach area
      - tightness in the chest
      - unpleasant breath odor
      - unusual tiredness or weakness
      - unusually heavy or unexpected menstrual bleeding
      - vaginal yeast infection
      - vaginal bleeding or spotting
      - vomiting
      - vomiting of blood
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hair loss
      - inability to have or keep an erection
      - increased hair growth, especially on the face
      - loss in sexual ability, desire, drive, or performance
      - patchy brown or dark brown discoloration of the skin
      - swelling of the breasts or breast soreness in males
      - trouble wearing contact lenses
      - weight gain or loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
