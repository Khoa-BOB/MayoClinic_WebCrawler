title: Estropipate (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ogen .625
    - type: paragraph
      text: Ogen 1.25
    - type: paragraph
      text: Ogen 2.5
    - type: paragraph
      text: Ortho-Est
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Estropipate is used to treat moderate to severe symptoms of menopause. It
      is also used to treat changes in and around the vagina (such as vaginal dryness,
      itching, and burning) caused by low estrogen levels or menopause. This medicine
      is also used to treat certain conditions in women before menopause if their
      ovaries do not make enough estrogens naturally, and prevent osteoporosis after
      menopause.
  - type: paragraph
    text: Estropipate is an estrogen hormone that works by preventing symptoms, such
      as feelings of warmth in the face, neck, and chest, or sudden strong feelings
      of heat and sweating (hot flashes) in women during menopause.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use of estropipate is not indicated in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of estropipate have not been performed in the geriatric population, no geriatric-specific
        problems have been documented to date. However, elderly patients are more
        likely to have breast cancer, strokes, or dementia, which may require caution
        in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies suggest that this medication may alter milk production or composition.
        If an alternative to this medication is not prescribed, you should monitor
        the infant for side effects and adequate milk intake.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amifampridine
      - Bupropion
      - Cosyntropin
      - Donepezil
      - Fosphenytoin
      - Hydroxychloroquine
      - Insulin Aspart, Recombinant
      - Phenytoin
      - Somatrogon-ghla
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Ginseng
      - Levothyroxine
      - Licorice
      - Tipranavir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Abnormal or unusual vaginal bleeding or
      - Blood clots (eg, deep vein thrombosis, pulmonary embolism), active or history
        of or
      - Breast cancer, known or suspected, or a history of or
      - Heart attack, history of or
      - Liver disease or
      - Protein C, protein S, or other known blood clotting disorders or
      - Stroke, history of or
      - Tumors (estrogen-dependent), known or suspected—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Asthma or
      - Bone problems or
      - Diabetes or
      - Edema (fluid retention or body swelling) or
      - Endometriosis or
      - Epilepsy (seizures) or
      - Gallbladder disease or
      - Hereditary angioedema (swelling of the face, lips, tongue, or throat) or
      - Hypercalcemia (high calcium in the blood) or
      - Hypocalcemia (low calcium in the blood) or
      - Hypothyroidism (an underactive thyroid) or
      - Jaundice during pregnancy or from using hormonal therapy in the past or
      - Liver tumors or
      - Migraine headache or
      - Porphyria (an enzyme problem) or
      - Systemic lupus erythematosus (SLE)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Heart disease or
      - Hypercholesterolemia (high cholesterol or fats in the blood) or
      - Hypertension (high blood pressure) or
      - Hypertriglyceridemia (high triglycerides or fats in the blood) or
      - Obesity, or history of or
      - Prolonged periods of immobilization—Use with caution. These conditions may
        increase risk for more serious side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine exactly as directed by your
      doctor . Do not use more of it, do not use it more often, and do not use it
      for a longer time than your doctor ordered. To do so may cause unwanted side
      effects.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine. Grapefruit and grapefruit juice may change the amount of this medicine
      that is absorbed in the body.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For hot flashes and other symptoms caused
        by menopause: Adults—One Ogen® 0.625 (0.75 mg estropipate) tablet to two Ogen®
        2.5 (3 mg estropipate) tablets per day. Children—Use is not recommended. For
        treatment of changes in and around the vagina (such as vaginal dryness, itching,
        and burning) caused by low estrogen levels or menopause. Adults—One Ogen®
        0.625 (0.75 mg estropipate) tablet to two Ogen® 2.5 (3 mg estropipate) tablets
        per day. Children—Use is not recommended. For female hypogonadism, female
        castration, or primary ovarian failure: Adults—One Ogen® 1.25 (1.5 mg estropipate)
        tablet to three Ogen® 2.5 (3 mg estropipate) tablets per day may be given
        for the first 3 weeks of a cycle, followed by a rest period of 8 to 10 days.
        Your doctor may adjust your dose as needed and tolerated. Children—Use is
        not recommended. For prevention of osteoporosis after menopause: Adults—One
        Ogen® 0.625 (0.75 mg estropipate) tablet for 25 days of a 31-day cycle per
        month. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For hot flashes and other symptoms caused by menopause: Adults—One Ogen®
        0.625 (0.75 mg estropipate) tablet to two Ogen® 2.5 (3 mg estropipate) tablets
        per day. Children—Use is not recommended.'
      - For treatment of changes in and around the vagina (such as vaginal dryness,
        itching, and burning) caused by low estrogen levels or menopause. Adults—One
        Ogen® 0.625 (0.75 mg estropipate) tablet to two Ogen® 2.5 (3 mg estropipate)
        tablets per day. Children—Use is not recommended.
      - 'For female hypogonadism, female castration, or primary ovarian failure: Adults—One
        Ogen® 1.25 (1.5 mg estropipate) tablet to three Ogen® 2.5 (3 mg estropipate)
        tablets per day may be given for the first 3 weeks of a cycle, followed by
        a rest period of 8 to 10 days. Your doctor may adjust your dose as needed
        and tolerated. Children—Use is not recommended.'
      - 'For prevention of osteoporosis after menopause: Adults—One Ogen® 0.625 (0.75
        mg estropipate) tablet for 25 days of a 31-day cycle per month. Children—Use
        is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—One Ogen® 0.625 (0.75 mg estropipate) tablet to two Ogen® 2.5 (3 mg
        estropipate) tablets per day.
      - Children—Use is not recommended.
    - type: list
      ordered: false
      items:
      - Adults—One Ogen® 0.625 (0.75 mg estropipate) tablet to two Ogen® 2.5 (3 mg
        estropipate) tablets per day.
      - Children—Use is not recommended.
    - type: list
      ordered: false
      items:
      - Adults—One Ogen® 1.25 (1.5 mg estropipate) tablet to three Ogen® 2.5 (3 mg
        estropipate) tablets per day may be given for the first 3 weeks of a cycle,
