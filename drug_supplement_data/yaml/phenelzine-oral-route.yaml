      - fear or nervousness
      - fever
      - general feeling of discomfort, illness, or weakness
      - headache
      - high blood pressure
      - increased sweating
      - irregular, fast or slow, or shallow breathing
      - irritability
      - itching
      - lack of emotion or feelings
      - loss of appetite
      - loss of consciousness
      - loud or fast speech
      - low blood pressure
      - muscle tremors
      - muscle twitching
      - nausea or vomiting
      - nervousness
      - no emotion or expression in speech
      - painful urination
