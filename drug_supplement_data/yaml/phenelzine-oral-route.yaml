      - trouble sleeping
      - unable to sleep
      - unusually deep sleep
      - unusually long duration of sleep
      - weight gain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blindness
      - blurred vision
      - decreased vision
      - eye pain
      - redness, swelling, or soreness of the tongue
      - tearing
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
