    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
      - Dopamine Containing Food
      - Ethanol
      - Tyramine Containing Food
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Avocado
      - Bitter Orange
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bipolar disorder (manic-depressive illness) or
      - Congestive heart failure or
      - Kidney disease, severe or
      - Liver disease, history of or
      - Pheochromocytoma (an adrenal problem)—Should not be used in patients with
        these conditions.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hypotension (low blood pressure) or
      - Schizophrenia—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine should come with a medication guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For depression: Adults—At first, 15 milligrams
        (mg) three times a day. Your doctor may adjust your dose as needed. However,
        the dose is usually not more than 90 mg per day. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For depression: Adults—At first, 15 milligrams (mg) three times a day. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than 90 mg per day. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 15 milligrams (mg) three times a day. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 90 mg per
        day.
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to allow for changes in your dose and to check for any unwanted effects.
  - type: paragraph
    text: You will also need to have your blood pressure measured before starting
      this medicine and while you are using it. If you notice any change to your recommended
      blood pressure, call your doctor right away. If you have questions about this,
      talk to your doctor.
  - type: paragraph
    text: 'When taken with certain foods, drinks, or other medicines, phenelzine can
      cause very dangerous reactions, such as sudden high blood pressure (also called
      hypertensive crisis). To avoid such reactions, follow these rules of caution:'
  - type: list
    ordered: false
    items:
    - Do not eat foods that have dopamine and a high tyramine content (most common
      in foods that are aged or fermented to increase their flavor), such as cheese
      (especially strong or aged kinds), caviar, sour cream, liver, canned figs, soy
      sauce, sauerkraut, fava beans, yeasts, and yogurt. Avoid smoked or pickled meat,
      poultry, or fish, such as sausage, pepperoni, salami, anchovies, or herring.
      Do not eat dried fruit (such as raisins), bananas, avocados, raspberries, or
      very ripe fruit.
    - Do not drink alcoholic beverages. This includes Chianti wine, sherry, beer,
      non-alcohol or low alcohol beer and wine, and liqueurs.
    - Do not eat or drink too much caffeine. Caffeine can be found in coffee, cola,
      chocolate, tea, and many other foods and drinks. Ask your doctor how much caffeine
      is safe to use.
  - type: paragraph
    text: Phenelzine may cause some people to be agitated, irritable, or display other
      abnormal behaviors. It may also cause some people to have suicidal thoughts
      and tendencies or to become more depressed. If you or your caregiver notice
      any of these adverse effects, tell your doctor right away.
  - type: paragraph
    text: Call your doctor or hospital emergency room right away if you have a severe
      headache, stiff or sore neck, chest pains, fast heartbeat, sweating, dizziness,
      or nausea and vomiting while you are taking this medicine. These may be symptoms
      of a serious side effect called hypertensive crisis.
  - type: paragraph
    text: This medicine may cause blurred vision or make some people drowsy or less
      alert than they are normally. Make sure you know how you react to this medicine
      before you drive, use machines, or do anything else that could be dangerous
      if you are unable to see well or not alert.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that slow down the nervous system, possibly causing drowsiness).
      Some examples of CNS depressants are antihistamines or medicine for hay fever,
      allergies, or colds; sedatives, tranquilizers, or sleeping medicine; prescription
      pain medicine or narcotics; medicine for seizures or barbiturates; muscle relaxants;
      or anesthetics, including some dental anesthetics. Check with your doctor before
      taking any of the above while you are using this medicine .
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur , especially when you
      get up suddenly from a lying or sitting position. Getting up slowly may help.
      When you get up from lying down, sit on the edge of the bed with your feet dangling
      for 1 or 2 minutes, then stand up slowly. If the problem continues or gets worse,
      check with your doctor.
  - type: paragraph
    text: Do not stop taking this medicine without checking first with your doctor.
      Your doctor may want you to gradually reduce the amount you are using before
      stopping it completely.
  - type: paragraph
    text: Before having any kind of surgery, dental treatment, or emergency treatment,
      tell the medical doctor or dentist in charge that you are using this medicine
      or have used it within the past 10 days . Taking phenelzine together with medicines
      that are used during surgery, dental, or emergency treatments may increase the
      risk of serious side effects.
  - type: paragraph
    text: Your doctor may want you to carry an identification card stating that you
      are using this medicine.
  - type: paragraph
    text: This medicine may affect blood sugar levels. If you are diabetic, be especially
      careful in testing for sugar in your blood or urine. If you have any questions
      about this, check with your doctor.
  - type: paragraph
    text: After you stop using this medicine, you must continue to exercise caution
      for at least 2 weeks with your foods, drinks, and other medicines, since these
      items may continue to react with phenelzine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - cold sweats
      - confusion
      - dizziness, faintness, or lightheadedness when getting up from a lying or sitting
        position
      - overactive reflexes
      - shakiness in the legs, arms, hands, or feet
      - sudden jerky movements of the body
      - swelling
      - trembling or shaking of the hands or feet
    subsections: []
