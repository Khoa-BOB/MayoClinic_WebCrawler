      - Domperidone
      - Donepezil
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Abnormal or unusual vaginal bleeding—Should not be used in patients with this
        condition.
    - type: list
      ordered: false
      items:
      - Alcohol abuse or
      - Cigarette smoking or
      - Conditions that increase the chances of developing thinning bones or
      - Osteoporosis (brittle bones), or history of—Increases your risk of developing
        osteoporosis.
    - type: list
      ordered: false
      items:
      - Brain tumors, history of or
      - Seizures or epilepsy, history of or—Use with caution. May increase risk for
        seizures.
    - type: list
      ordered: false
      items:
      - Depression, history of or
      - Mental problems, history of or
      - Polycystic ovarian disease (PCOD) or
      - Pituitary gland problem or
      - Rhinitis (swelling or irritation of the nose)—Use with caution. May make these
        conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use it for a longer time than your doctor
      ordered. Do not change your dose or stop using this medicine without checking
      first with your doctor.
  - type: paragraph
    text: 'This medicine comes with patient instructions. Read and follow these instructions
      carefully and make sure you understand:'
  - type: list
    ordered: false
    items:
    - How to prepare the nasal spray.
    - How to use the spray.
    - How long the spray can be stored.
  - type: paragraph
    text: This medicine is only used in the nose . Do not get it in your eyes or on
      your skin. If it does get on these areas, rinse them with water right away and
      call your doctor.
  - type: paragraph
    text: 'To use nafarelin spray:'
  - type: list
    ordered: false
    items:
    - Before you use each new bottle of nafarelin, the spray pump needs to be primed
      first. To do this, point the bottle away from you and pump the bottle firmly
      about 7 times until a fine mist spray appears. This only needs to be done once
      for each new bottle of nafarelin. Be careful not to breathe in this spray. You
      could inhale extra doses of nafarelin, since the medicine is dissolved in the
      spray.
    - Before you use nafarelin spray, blow your or your child's nose gently to clear
      the nostrils. You can also use a bulb syringe to clean your child's nose.
    - 'For central precocious puberty: Tilt your child''s head back slightly. Put
      the tip of the bottle into your child''s nostril. Close the other nostril with
      your finger. At the same time, let your child sniff in the spray as you pump
      the bottle once. Allow 30 seconds between sprays in the same nostril. Keep your
      child''s head tilted back for a few seconds after spraying this medicine to
      let the spray get onto the back of the nose.'
    - 'For endometriosis: Lean your head forward. Put the spray tip into one nostril.
      Aim the tip toward the back and outside of your nostril. You do not need to
      put the tip too far into your nose. Close your other nostril with your finger.
      At the same time, sniff in the spray as you pump the bottle once. Do not spray
      this medicine in your other nostril unless your doctor tells you to. Tilt your
      head backwards for a few seconds after spraying this medicine to let the spray
      get onto the back of your nose.'
    - Repeat these steps for each dose of the medicine.
    - Each time you use the spray bottle, wipe off the tip with a clean tissue or
      cloth. Keep the white safety clip and plastic cap on the bottle when you are
      not using it.
    - Be sure to clean the tip of the spray bottle before and after every use. To
      do this, hold the bottle sideways. Rinse the tip with warm water, while wiping
      the tip with your finger or a soft cloth for about 15 seconds. Dry the tip with
      a soft cloth or tissue. Replace the cap right after use. Be careful not to get
      water into the bottle, since this could dilute the medicine.
    - Do not try to make the tiny hole in the spray tip larger. Doing so, may deliver
      a wrong dose of the medicine.
  - type: list
    ordered: false
    items:
    - Tilt your child's head back slightly. Put the tip of the bottle into your child's
      nostril.
    - Close the other nostril with your finger. At the same time, let your child sniff
      in the spray as you pump the bottle once.
    - Allow 30 seconds between sprays in the same nostril.
    - Keep your child's head tilted back for a few seconds after spraying this medicine
      to let the spray get onto the back of the nose.
  - type: list
    ordered: false
    items:
    - Lean your head forward. Put the spray tip into one nostril. Aim the tip toward
      the back and outside of your nostril. You do not need to put the tip too far
      into your nose.
    - Close your other nostril with your finger. At the same time, sniff in the spray
      as you pump the bottle once.
    - Do not spray this medicine in your other nostril unless your doctor tells you
      to.
    - Tilt your head backwards for a few seconds after spraying this medicine to let
      the spray get onto the back of your nose.
  - type: paragraph
    text: If you are also using a nasal decongestant, do not use it at the same time
      you are using this medicine. Wait at least 2 hours after using nafarelin spray
      before using the nasal decongestant.
  - type: paragraph
    text: Avoid sneezing when spraying and immediately after using the medicine. If
      you sneeze, the medicine may not be absorbed as well.
  - type: paragraph
    text: Many boys and girls who have central precocious puberty will not feel sick
      or will not understand the importance of taking this medicine regularly. Nafarelin
      must be given on a regular schedule.
  - type: paragraph
    text: Women with endometriosis should start using this medicine between the 2nd
      and 4th day of their menstrual period, unless instructed otherwise by your doctor.
      This medicine is used for six months.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For nasal dosage form (spray): For treatment of central precocious puberty:
        Children—Two sprays in each nostril 2 times a day, in the morning and in the
        evening. This provides a total dose of 8 sprays a day. Some patients may need
        a larger dose by using 3 sprays in alternating nostrils 3 times a day to provide
        a total of 9 sprays per day. For treatment of endometriosis: Adults—One spray
        into one nostril in the morning and one spray into the other nostril in the
        evening, taken for 6 months. Start your treatment between Days 2 and 4 of
        your menstrual period. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of central precocious puberty: Children—Two sprays in each
        nostril 2 times a day, in the morning and in the evening. This provides a
        total dose of 8 sprays a day. Some patients may need a larger dose by using
        3 sprays in alternating nostrils 3 times a day to provide a total of 9 sprays
        per day.'
      - 'For treatment of endometriosis: Adults—One spray into one nostril in the
        morning and one spray into the other nostril in the evening, taken for 6 months.
        Start your treatment between Days 2 and 4 of your menstrual period. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Children—Two sprays in each nostril 2 times a day, in the morning and in the
        evening. This provides a total dose of 8 sprays a day. Some patients may need
        a larger dose by using 3 sprays in alternating nostrils 3 times a day to provide
        a total of 9 sprays per day.
    - type: list
      ordered: false
      items:
      - Adults—One spray into one nostril in the morning and one spray into the other
        nostril in the evening, taken for 6 months. Start your treatment between Days
        2 and 4 of your menstrual period.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the bottle upright. Do not freeze. After you prime the bottle, there
        will only be 60 doses or sprays. Keep track of the number of sprays you use.
        Throw the bottle away after you use 60 sprays (for 30 days) even if some liquid
        remains.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child at regular visits to make sure that this medicine is working properly.
      Blood tests may be needed to check for unwanted effects. Be sure to keep all
      appointments.
  - type: paragraph
    text: 'For female patients : You should not use this medicine if you are pregnant
      or may become pregnant. Using this medicine while you are pregnant can harm
      your unborn baby. Use an effective form of birth control to keep from getting
      pregnant during treatment with this medicine. If you think you have become pregnant
      while using the medicine, tell your doctor right away.'
  - type: paragraph
    text: 'For children using nafarelin spray for central precocious puberty (CPP)
      : This medicine can cause a brief increase in blood levels of some hormones.
      During this time, you may notice more signs of puberty in your child, including
      light vaginal bleeding and breast enlargement in girls. If your child''s symptoms
      do not improve within 4 weeks, or if they get worse, call your doctor.'
  - type: paragraph
    text: 'For adult women using nafarelin spray for endometriosis :'
  - type: list
    ordered: false
    items:
    - For the first few days of treatment, the symptoms of your condition may get
      worse. This is normal. Do not stop using this medicine. Talk with your doctor
      if you have concerns about this.
    - During the time you are using nafarelin, your menstrual period may not be regular
      or you may not have a menstrual period at all. This is to be expected when being
      treated with this medicine. If regular menstruation does not begin within 2
      to 3 months after you stop using this medicine, check with your doctor.
    - During the time you are using nafarelin spray, you should use birth control
      methods that do not contain hormones, such as condoms, IUD, a diaphragm or a
      cervical cap with a spermicide. If you have any questions about this, check
      with your doctor.
    - Use a water-based vaginal lubricant product if dryness of the vagina causes
      problems, such as pain during sexual intercourse. Make sure the lubricant you
      choose can be used with a latex birth control device if you are using one. Some
      lubricants contain oils, which can break down the latex rubber of condoms, a
      cervical cap, or a diaphragm, and cause them to rip or tear.
    - This medicine can cause your bone mineral density to decrease, which may lead
      to osteoporosis or weakened bones. Talk with your doctor about how this risk
      will affect you.
    - If you suspect you may have become pregnant, stop using this medicine and check
      with your doctor right away. There is a chance that continued use of nafarelin
      during pregnancy could cause birth defects or a miscarriage.
  - type: paragraph
    text: This medicine may cause depression especially in women. Check with your
      doctor right away if you have discouragement, feeling sad or empty, irritability,
      lack of appetite, loss of interest or pleasure, tiredness, trouble concentrating,
      or trouble sleeping.
  - type: paragraph
    text: This medicine may cause some people to be agitated, irritable, or display
      other abnormal behaviors. Make sure the doctor knows if you have trouble sleeping,
      get upset easily, have a big increase in energy, or start to act reckless. Also
      tell the doctor if you have sudden or strong feelings, such as feeling nervous,
      angry, restless, violent, or scared. If you or your caregiver notice any of
      these side effects, tell your doctor right away.
  - type: paragraph
    text: Using this medicine may increase your risk of having seizures. Check with
      your doctor right away if you start to have muscle spasm or jerking of all extremities,
      seizures, sudden loss of consciousness, or loss of bladder control.
  - type: paragraph
    text: Nafarelin spray can increase your risk of having cysts in the ovaries. Talk
      to your doctor about this risk.
  - type: paragraph
    text: This medicine may cause intracranial hypertension or pseudotumor cerebri
      (increased pressure in the head) in children. Check with your doctor right away
      if your child have blurred or double vision, change in ability to see colors,
      especially blue or yellow, continuing ringing or buzzing or other unexplained
      noise in the ears, dizziness, eye pain, hearing loss, nausea and vomiting, or
      severe headache.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are using this medicine. The results of some tests may be affected by this
      medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
