title: Nafarelin (nasal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Synarel
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: 'Nafarelin nasal spray is a synthetic (man-made) hormone that is similar
      to a natural hormone that is produced in the brain. It is used for the treatment
      of:'
  - type: list
    ordered: false
    items:
    - Central precocious puberty (CPP), a condition which causes early puberty in
      boys (before 9 years of age) and in girls (before 8 years of age), or
    - Endometriosis, a painful condition caused by extra tissue growing inside or
      outside of the uterus (womb).
  - type: paragraph
    text: When given regularly to boys and girls experiencing early puberty, nafarelin
      slows down the development of genital areas in both sexes. It will also slow
      breast development in girls. This medicine will delay puberty as long as the
      child continues to use it.
  - type: paragraph
    text: When given regularly to women, nafarelin decreases estrogen levels which
      helps treat endometriosis. It prevents the growth of tissue caused by endometriosis
      in adult women during treatment and for 6 months after treatment is discontinued.
  - type: paragraph
    text: Suppressing estrogen can cause thinning of the bones or slowing of growth.
      This is a problem for adult women whose bones are no longer growing. Slowing
      the growth of bones is a positive effect for girls and boys whose bones grow
      too fast when puberty begins too early. Boys and girls may benefit by adding
      inches to their adult height when nafarelin causes their bones to grow at the
      proper and expected rate for children.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Spray
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of nafarelin nasal spray in children.
        Nafarelin will stop having an effect on a child treated for central precocious
        puberty soon after the child stops using it, and puberty will advance normally.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of nafarelin nasal spray for the treatment of endometriosis
        in the pediatric population. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of nafarelin nasal spray in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Levoketoconazole
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adagrasib
      - Alfuzosin
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Anagrelide
