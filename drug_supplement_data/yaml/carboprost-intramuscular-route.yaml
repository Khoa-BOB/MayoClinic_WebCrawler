title: Carboprost (intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Hemabate
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Carboprost is given by injection to cause abortion. It is an oxytocic, which
      means it acts by causing the uterus to contract the way it does during labor
      and also helps the cervix to dilate.
  - type: paragraph
    text: Carboprost may also be used for other purposes as determined by your doctor.
  - type: paragraph
    text: Carboprost is to be administered only by or under the immediate care of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Adrenal gland disease (history of)—Carboprost stimulates the body to produce
        steroids
    - type: list
      ordered: false
      items:
      - Anemia—In some patients, abortion with carboprost may result in loss of blood
        that may require a transfusion
    - type: list
      ordered: false
      items:
      - Asthma (or history of) or
      - Lung disease—Carboprost may cause narrowing of the blood vessels in the lungs
        or narrowing of the lung passages
    - type: list
      ordered: false
      items:
      - Type 2 diabetes mellitus (history of)
    - type: list
      ordered: false
      items:
      - Epilepsy (or history of)—Rarely, seizures have occurred with use of carboprost
    - type: list
      ordered: false
      items:
      - Fibroid tumors of the uterus or
      - Uterus surgery (history of)—There is an increased risk of rupture of the uterus
    - type: list
      ordered: false
      items:
      - Glaucoma—Rarely, the pressure within the eye has increased during use of carboprost
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease (or history of) or
      - High blood pressure (or history of) or
      - Low blood pressure (or history of)—Carboprost may cause changes in heart function
        or blood pressure changes
    - type: list
      ordered: false
      items:
      - Jaundice (history of)
    - type: list
      ordered: false
      items:
      - Kidney disease (or history of)
    - type: list
      ordered: false
      items:
      - Liver disease (or history of)—The body may not get carboprost out of the bloodstream
        at the usual rate, which may make the medicine work longer or cause toxic
        effects
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: For causing an abortion in the second trimester
        of pregnancy (13th to 24th week): Adults—At first, 100 to 250 micrograms (mcg)
        injected deep into a muscle. Then, 250 to 500 mcg every one and one-half to
        three and one-half hours for up to two days. For bleeding of the uterus after
        pregnancy: Adults—250 mcg injected deep into a muscle. Your doctor may repeat
        this dose every fifteen to ninety minutes as needed.'
    - type: list
      ordered: false
      items:
      - 'For causing an abortion in the second trimester of pregnancy (13th to 24th
        week): Adults—At first, 100 to 250 micrograms (mcg) injected deep into a muscle.
        Then, 250 to 500 mcg every one and one-half to three and one-half hours for
        up to two days.'
      - 'For bleeding of the uterus after pregnancy: Adults—250 mcg injected deep
        into a muscle. Your doctor may repeat this dose every fifteen to ninety minutes
        as needed.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 100 to 250 micrograms (mcg) injected deep into a muscle.
        Then, 250 to 500 mcg every one and one-half to three and one-half hours for
        up to two days.
    - type: list
      ordered: false
      items:
      - Adults—250 mcg injected deep into a muscle. Your doctor may repeat this dose
        every fifteen to ninety minutes as needed.
    - type: paragraph
      text: .
    subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fast or slow heartbeat
      - headache (severe and continuing)
      - hives or skin rash
      - increased pain of the uterus
      - pale, cool, blotchy skin on arms or legs
      - pressing or painful feeling in chest
      - shortness of breath
      - swelling of face, inside the nose, and eyelids
      - tightness in chest
      - trouble in breathing
      - weak or absent pulse in arms or legs
      - wheezing
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    - type: list
      ordered: false
      items:
      - Constipation
      - pain or inflammation at place of injection
      - tender or mildly bloated abdomen or stomach
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - nausea
      - vomiting
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills or shivering
      - dizziness
      - fever (temporary)
      - flushing or redness of face
      - headache
      - stomach cramps or pain
    - type: paragraph
      text: 'This procedure may result in some effects, which occur after the procedure
        is completed, that need medical attention. Check with your doctor if you notice
        any of the following:'
    - type: list
      ordered: false
      items:
      - Chills or shivering (continuing)
      - fever (continuing)
      - foul-smelling vaginal discharge
      - increase in uterus bleeding
      - pain in lower abdomen
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
