title: Alglucerase (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ceredase
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Alglucerase is used to treat Gaucher's disease caused by the lack of a certain
      enzyme, glucocerebrosidase, in the body. This enzyme is necessary for your body
      to use fats.
  - type: paragraph
    text: Alglucerase is made from human placenta tissue that is collected after a
      baby is born. Before it is used, the tissue is tested for hepatitis and human
      immunodeficiency virus (HIV). This is similar to the testing that a blood bank
      does on donated blood before it is given to anyone else.
  - type: paragraph
    text: Alglucerase is available with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested in a limited number of children. In effective
        doses, the medicine has not been shown to cause different side effects or
        problems than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of alglucerase in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine will not cure Gaucher's disease but it does help control it.
      Therefore, you must continue to receive it if you expect to keep your condition
      under control. You may have to receive alglucerase for the rest of your life.
      If Gaucher's disease is not treated, it can cause serious blood, liver, skeletal,
      or spleen problems.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For Gaucher''s disease: For injection dosage form: Adults and children—The
        dose is based on body weight. It is injected slowly into a vein over one to
        two hours. To start, some patients may receive 1.15 Units per kilogram (kg)
        (0.52 Units per pound) of body weight three times a week. Other patients may
        receive up to 60 Units per kg (27 Units per pound) of body weight as often
        as once a week or as seldom as every four weeks. Later, your doctor may raise
        or lower your dose.'
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: Adults and children—The dose is based on body
        weight. It is injected slowly into a vein over one to two hours. To start,
