title: Diphtheria, tetanus, acellular pertussis, hepatitis b, and polio vaccine (intramuscular
  route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Pediarix
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Diphtheria and tetanus toxoids and pertussis vaccine (also known as DTP
      vaccine) combined with hepatitis B and poliovirus vaccine (also known as HepB
      and IPV) is a combination immunizing agent used to prevent illness caused by
      diphtheria, tetanus (lockjaw), pertussis (whooping cough), hepatitis B, and
      poliovirus. The vaccine works by causing the body to produce its own protection
      (antibodies) against these diseases. This vaccine is given only to infants and
      children who are 6 weeks to 6 years of age, and is given before the child’s
      7th birthday.
  - type: paragraph
    text: This vaccine combines five agents into one vaccine. In order to complete
      the series, you must get three injections of this vaccine at separate intervals.
      Because there are many different diseases you will need to be vaccinated against,
      make sure to follow your doctor's directions about your vaccination schedule.
  - type: paragraph
    text: Diphtheria is a serious illness that can cause breathing difficulties, heart
      problems, nerve damage, pneumonia, and possibly death. The risk of serious complications
      is greater in very young children and the elderly.
  - type: paragraph
    text: Tetanus (also known as lockjaw) is a very serious illness that causes convulsions
      (seizures) and severe muscle spasms that can be strong enough to cause bone
      fractures of the spine. Tetanus causes death in 30% to 40% of cases. The disease
      continues to occur almost exclusively among people who do not get vaccinated
      or do not have enough protection from previous vaccines.
  - type: paragraph
    text: Pertussis (also known as whooping cough) is a serious disease that causes
      severe spells of coughing that can interfere with breathing. Pertussis can also
      cause pneumonia, long-lasting bronchitis, seizures, brain damage, and death.
  - type: paragraph
    text: Hepatitis B infection is a major cause of serious liver diseases, including
      liver cancer. You get hepatitis B by being exposed to someone else's body fluids.
      Pregnant women who have hepatitis B infection or are carriers of hepatitis B
      virus can give the disease to their babies when they are born. These babies
      often suffer serious long-term illnesses from the disease. People who have the
      virus can give it to others without them knowing it.
  - type: paragraph
    text: Polio is a very serious infection that causes paralysis of the muscles,
      including the muscles that enable you to walk and breathe. A polio infection
      may leave a person unable to breathe without the help of a breathing machine.
      It may also leave a person unable to walk without leg braces or being confined
      to a wheelchair. There is no cure for polio.
  - type: paragraph
    text: This vaccine is to be administered only by or under the direct supervision
      of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of this vaccine in infants younger than 6 weeks of age and
        children 7 years of age and older. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: This vaccine is not recommended for use in adult patients.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atidarsagene Autotemcel
      - Elivaldogene Autotemcel
      - Ocrelizumab
      - Teplizumab-mzwv
      - Ublituximab-xiiy
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Encephalopathy (a brain disease), history of after a vaccine with pertussis—Should
        not be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Fever, high or
      - Moderate or severe illness, with or without fever—This vaccine may make these
        conditions worse or may increase the chance of side effects.
    - type: list
      ordered: false
      items:
      - Guillain-Barre syndrome (nerve disease that causes paralysis), history of—If
        your child had this condition after getting a vaccine with tetanus in it,
        you should talk to your doctor about the potential benefits and possible risks
        of getting this vaccine.
    - type: list
      ordered: false
      items:
      - Immunodeficiency disorder—If you have an immune system disorder, this vaccine
        may not work well for you.
    - type: list
      ordered: false
      items:
      - Previous side effects, history of after a vaccine with pertussis—If your child
        has had certain side effects to this vaccine or another vaccine with pertussis
        in it, you should talk to your doctor about the potential benefits and possible
        risks of getting this vaccine. Some serious reactions include being less responsive
        than normal, crying continuously without stopping for 3 hours or more, having
        a seizure with or without a fever, or having a fever that is 105 degrees F
        or higher.
    - type: list
      ordered: false
      items:
      - Progressive neurologic disorders—This includes infantile spasms, progressive
        brain disease, or uncontrolled epilepsy (seizures). This vaccine should not
        be given until these conditions are under control.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give your child this vaccine.
      This vaccine is given as a shot into one of your child’s muscles, usually in
      the shoulder muscle or thighs.
  - type: paragraph
    text: This vaccine is usually given as three shots. The first dose may be given
      as early as 6 weeks of age. You will need another dose at 4 and 6 months after
      the first dose, unless your doctor tells you otherwise.
  - type: paragraph
    text: Your child may receive other vaccines at the same time as this one, but
      in a different body area. You should receive information sheets about all of
      the vaccines your child receives. Make sure you understand all of the information
      that is given to you.
  - type: paragraph
    text: Your child may also receive a medicine to help prevent or treat some of
      the minor side effects of the vaccine, such as fever and soreness.
  - type: paragraph
    text: It is important that your child receive all of the doses of vaccine in this
      series. Try to keep all of your scheduled appointments. If your child does miss
      a dose of this vaccine, make another appointment as soon as possible.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your child return to your doctor's office for
      the second and third dose of this vaccine . Be sure to notify your doctor or
      clinic of any side effects that may occur after your child has received the
      vaccine.
  - type: paragraph
    text: If your child develops a skin rash, hives, or any allergic reaction after
      receiving this vaccine, tell your child's doctor right away.
  - type: paragraph
    text: Tell your child’s doctor about all other vaccines your child has had, especially
      if those vaccines were part of a series. This vaccine might be used to finish
      a series of vaccines.
  - type: paragraph
    text: Make sure your doctor knows if your child is allergic to latex rubber. One
      of the prefilled syringes for this vaccine contains dry natural latex rubber.
      This may cause an allergic reaction in children who are sensitive to latex.
  - type: paragraph
    text: This vaccine may cause apnea (breathing problem) in some premature infants.
      The doctor will decide if your child should receive this vaccine.
  - type: paragraph
    text: This vaccine will not treat an active infection. If your child have a diphtheria,
      tetanus, pertussis, hepatitis B, or polio infection, you will need medicine
      to treat the infection.
  - type: paragraph
    text: Be sure to tell your child’s doctor about any serious side effects that
      occur after your child receives the vaccine. This may include fainting, seizures,
      a high fever, crying that will not stop, or severe redness or swelling where
      the shot was given.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a vaccine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention. It is very important that you tell your doctor about
      any side effect that occurs after a dose of DTaP-HepB-IPV vaccine, even if the
      side effect goes away without treatment. Some types of side effects may mean
      that your child should not receive any more doses of DTaP-HepB-IPV vaccine.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
