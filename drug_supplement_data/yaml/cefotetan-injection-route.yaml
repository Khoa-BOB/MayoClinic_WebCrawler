title: Cefotetan (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cefotan
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cefotetan injection is used to treat bacterial infections in many different
      parts of the body. This medicine is also given before certain types of surgery
      to prevent infections.
  - type: paragraph
    text: Cefotetan injection belongs to the class of medicines known as cephalosporin
      antibiotics. It works by killing bacteria or preventing their growth. However,
      this medicine will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of cefotetan injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of cefotetan injection in the elderly.
        However, elderly patients are more likely to have age-related kidney problems,
        which may require caution and an adjustment in the dose for patients receiving
        cefotetan injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Cholera Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Colitis (inflammation in gut), history of or
      - Diarrhea, severe, history of or
      - Hemolytic anemia or
      - Seizures—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. Effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given as a shot into one of your muscles, or through a needle
      placed in one of your veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: Hemolytic anemia may occur while you are using this medicine. Stop using
      this medicine and check with your doctor right away if you have back, leg, or
      stomach pains; bleeding gums; chills; dark urine; difficulty with breathing;
      fever; general body swelling; headache; loss of appetite; nausea or vomiting;
      nosebleeds; pale skin; sore throat; unusual tiredness or weakness; or yellowing
      of the eyes or skin.
  - type: paragraph
    text: Cefotetan injection may cause diarrhea, and in some cases it can be severe.
      Do not take any medicine to treat diarrhea without first checking with your
      doctor. Diarrhea medicines may make the diarrhea worse or make it last longer.
      If you have any questions about this or if mild diarrhea continues or gets worse,
      check with your doctor.
  - type: paragraph
    text: Do not drink alcohol while you are receiving cefotetan injection and for
      3 days (72 hours) after your last dose. Drinking alcohol during this period
      may cause flushing; headache; sweating; and fast, pounding, or irregular heartbeat.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are receiving this medicine. The results of some tests may be affected by
      this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps or tenderness
      - back, leg, or stomach pains
      - black, tarry stools
      - bleeding gums
      - bloating
      - chest pain
      - chills
      - cough
      - dark urine
      - diarrhea
      - diarrhea, watery and severe, which may also be bloody
      - difficulty with breathing
      - fever
      - general body swelling
      - headache
      - increased thirst
      - loss of appetite
      - nausea or vomiting
      - nosebleeds
      - pain
      - painful or difficult urination
      - pale skin
      - shortness of breath
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swollen glands
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - unusual weight loss
      - yellowing of the eyes or skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blood in the urine
      - bluish color
      - change in frequency of urination or amount of urine
      - changes in skin color
      - drowsiness
      - increased thirst
      - swelling of the feet or lower legs
      - tenderness
      - weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - cough or hoarseness
      - coughing up blood
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - fever with or without chills
      - general feeling of tiredness or weakness
      - high fever
      - increased menstrual flow or vaginal bleeding
      - itching
      - itching of the vagina or genital area
      - joint or muscle pain
      - lower back or side pain
      - nosebleeds
      - pain during sexual intercourse
      - paralysis
      - pinpoint red spots on the skin
      - prolonged bleeding from cuts
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rash
      - red or black, tarry stools
      - red or dark brown urine
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - seizures
      - skin rash
      - sudden decrease in the amount of urine
      - swollen or painful glands
      - thick, white vaginal discharge with no odor or with a mild odor
      - tightness in the chest
      - unpleasant breath odor
      - vomiting of blood
      - wheezing
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
