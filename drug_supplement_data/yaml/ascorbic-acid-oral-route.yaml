        scurvy: 100 to 300 mg a day for at least 2 weeks.'
    - type: paragraph
      text: 'For those individuals taking the oral liquid form of vitamin C:'
    - type: list
      ordered: false
      items:
      - This preparation is to be taken by mouth even though it comes in a dropper
        bottle.
      - This dietary supplement may be dropped directly into the mouth or mixed with
        cereal, fruit juice, or other food.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss taking a vitamin for one or more days there is no cause for
        concern, since it takes some time for your body to become seriously low in
        vitamins.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the dietary supplement in a closed container at room temperature,
        away from heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Vitamin C is not stored in the body. If you take more than you need, the
      extra vitamin C will pass into your urine. Very large doses may also interfere
      with tests for sugar in diabetics and with tests for blood in the stool.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Side or lower back pain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - dizziness or faintness (with the injection only)
      - flushing or redness of skin
      - headache
      - increase in urination (mild)
      - nausea or vomiting
      - stomach cramps
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
