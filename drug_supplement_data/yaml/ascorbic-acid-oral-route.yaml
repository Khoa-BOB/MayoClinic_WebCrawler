- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'If you are taking this dietary supplement without a prescription, carefully
      read and follow any precautions on the label. For this supplement, the following
      should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Problems in children have not been reported with intake of normal daily
        recommended amounts.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Problems in older adults have not been reported with intake of normal
        daily recommended amounts.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this dietary supplement,
        it is especially important that your healthcare professional know if you are
        taking any of the medicines listed below. The following interactions have
        been selected on the basis of their potential significance and are not necessarily
        all-inclusive.
    - type: paragraph
      text: Using this dietary supplement with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Amygdalin
      - Deferoxamine
    - type: paragraph
      text: Using this dietary supplement with any of the following medicines may
        cause an increased risk of certain side effects, but using both drugs may
        be the best treatment for you. If both medicines are prescribed together,
        your doctor may change the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Indinavir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this dietary
        supplement. Make sure you tell your doctor if you have any other medical problems,
        especially:'
    - type: list
      ordered: false
      items:
      - Blood problems—High doses of vitamin C may cause certain blood problems
    - type: list
      ordered: false
      items:
      - Type 2 diabetes mellitus—Very high doses of vitamin C may interfere with tests
        for sugar in the urine
    - type: list
      ordered: false
      items:
      - Glucose-6-phosphate dehydrogenase (G6PD) deficiency—High doses of vitamin
        C may cause hemolytic anemia
    - type: list
      ordered: false
      items:
      - Kidney stones (history of)—High doses of vitamin C may increase risk of kidney
        stones in the urinary tract
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules, tablets, oral solution, syrup): To prevent
        deficiency, the amount taken by mouth is based on normal daily recommended
        intakes: For the U.S. Adult and teenage males—50 to 60 milligrams (mg) per
        day. Adult and teenage females—50 to 60 mg per day. Pregnant females—70 mg
        per day. Breast-feeding females—90 to 95 mg per day. Smokers—100 mg per day.
        Children 4 to 10 years of age—45 mg per day. Children birth to 3 years of
        age—30 to 40 mg per day. For Canada Adult and teenage males—25 to 40 mg per
        day. Adult and teenage females—25 to 30 mg per day. Pregnant females—30 to
        40 mg per day. Breast-feeding females—55 mg per day. Smokers—45 to 60 mg per
        day. Children 4 to 10 years of age—25 mg per day. Children birth to 3 years
        of age—20 mg per day. To treat deficiency: Adults and teenagers—Treatment
        dose is determined by prescriber for each individual based on the severity
        of deficiency. The following dose has been determined for scurvy: 500 mg a
        day for at least 2 weeks. Children—Treatment dose is determined by prescriber
        for each individual based on the severity of deficiency. The following dose
        has been determined for scurvy: 100 to 300 mg a day for at least 2 weeks.'
    - type: list
      ordered: false
      items:
      - 'To prevent deficiency, the amount taken by mouth is based on normal daily
        recommended intakes: For the U.S. Adult and teenage males—50 to 60 milligrams
        (mg) per day. Adult and teenage females—50 to 60 mg per day. Pregnant females—70
        mg per day. Breast-feeding females—90 to 95 mg per day. Smokers—100 mg per
        day. Children 4 to 10 years of age—45 mg per day. Children birth to 3 years
        of age—30 to 40 mg per day. For Canada Adult and teenage males—25 to 40 mg
        per day. Adult and teenage females—25 to 30 mg per day. Pregnant females—30
        to 40 mg per day. Breast-feeding females—55 mg per day. Smokers—45 to 60 mg
        per day. Children 4 to 10 years of age—25 mg per day. Children birth to 3
        years of age—20 mg per day.'
      - 'To treat deficiency: Adults and teenagers—Treatment dose is determined by
        prescriber for each individual based on the severity of deficiency. The following
        dose has been determined for scurvy: 500 mg a day for at least 2 weeks. Children—Treatment
        dose is determined by prescriber for each individual based on the severity
        of deficiency. The following dose has been determined for scurvy: 100 to 300
        mg a day for at least 2 weeks.'
    subsections: []
  - heading: For the U.S.
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Adult and teenage males—50 to 60 milligrams (mg) per day.
      - Adult and teenage females—50 to 60 mg per day.
      - Pregnant females—70 mg per day.
      - Breast-feeding females—90 to 95 mg per day.
      - Smokers—100 mg per day.
      - Children 4 to 10 years of age—45 mg per day.
