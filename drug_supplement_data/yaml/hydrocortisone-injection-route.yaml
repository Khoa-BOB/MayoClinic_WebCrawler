title: Hydrocortisone (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: A-Hydrocort
    - type: paragraph
      text: SoluCORTEF
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Hydrocortisone is used to treat certain medical conditions, such as inflammation
      (swelling), severe allergic reactions, kidney diseases, adrenal problems, arthritis,
      blood or bone marrow problems, eye or vision problems, lung or breathing problems
      (eg, asthma), lupus, skin conditions, and ulcerative colitis.
  - type: paragraph
    text: Hydrocortisone is a corticosteroid (cortisone-like medicine or steroid).
      It works on the immune system to help relieve swelling, redness, itching, and
      allergic reactions.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of hydrocortisone injection in children
        older than 1 month of age. However, safety and efficacy have not been established
        in children 1 month of age and younger.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of hydrocortisone injection in the
        elderly. However, elderly patients are more likely to have age-related liver,
        kidney, or heart problems, which may require caution in the dose for patients
        receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Desmopressin
      - Mifepristone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Aldesleukin
      - Apalutamide
      - Aspirin
      - Atazanavir
      - Avacopan
      - Balofloxacin
      - Balsalazide Disodium
      - Bemiparin
      - Besifloxacin
      - Bupropion
      - Carbamazepine
      - Ciprofloxacin
      - Clarithromycin
      - Cobicistat
      - Conivaptan
      - Cosyntropin
      - Cyclosporine
      - Darunavir
      - Desogestrel
      - Dienogest
      - Drospirenone
      - Enoxacin
      - Estetrol
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Fedratinib
      - Fexinidazole
      - Fleroxacin
      - Flumequine
      - Fosnetupitant
      - Fosphenytoin
      - Gatifloxacin
      - Gemifloxacin
      - Gestodene
      - Insulin Aspart, Recombinant
      - Itraconazole
      - Lenacapavir
      - Letermovir
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Alcuronium
      - Atracurium
      - Auranofin
      - Colestipol
      - Gallamine
      - Hexafluorenium
      - Licorice
      - Metocurine
      - Rifapentine
      - Rotavirus Vaccine, Live
      - Saiboku-To
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problem (eg, idiopathic thrombocytopenic purpura) or
      - Fungal infections��Should not be given in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Cancer (eg, blood cancer, solid tumor) or
      - Cataracts or
      - Congestive heart failure or
      - Cushing's syndrome (adrenal gland problem) or
      - Diabetes or
      - Eye infection (eg, herpes infection of the eyes) or
      - Glaucoma or
      - Hyperglycemia (high blood sugar) or
      - Hypertension (high blood pressure) or
      - Hyperthyroidism (overactive thyroid) or
      - Hypothyroidism (underactive thyroid) or
      - Infection (eg, bacteria, virus) or
      - Infestation (eg, worm, larva) or
      - Kidney disease or
      - Liver disease (including cirrhosis) or
      - Mental health problems, history of or
      - Mood changes, including depression or
      - Myasthenia gravis (severe muscle weakness) or
      - Osteoporosis (weak bones) or
      - Peptic ulcer, active or history of or
      - Pheochromocytoma (adrenal tumor) or
      - Stomach or intestinal problems (eg, diverticulitis, ulcerative colitis) or
      - Tuberculosis, inactive or
      - Weak immune system (eg, Kaposi sarcoma)—Use with caution. May make these conditions
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine
      in a hospital. This medicine is given through a needle placed in a vein or as
      a shot into a muscle.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child closely while you are receiving this medicine to make sure that this medicine
      is working properly. Blood and urine tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you have a rash, itching, trouble breathing, trouble
      swallowing, or any swelling of your hands, face, or mouth while you are using
      this medicine.
  - type: paragraph
    text: 'Using too much of this medicine or using it for a long time may increase
      your risk of having adrenal gland problems. Talk to your doctor right away if
      you have more than one of these symptoms while you are using this medicine:
      blurred vision, dizziness or fainting, a fast, irregular, or pounding heartbeat,
      increased thirst or urination, irritability, or unusual tiredness or weakness.'
  - type: paragraph
    text: This medicine may cause you to get more infections than usual. Avoid people
      who are sick or have infections and wash your hands often. If you are exposed
      to chickenpox or measles, tell your doctor right away. If you start to have
      fever, chills, sore throat, or any other signs of an infection, call your doctor
      right away.
  - type: paragraph
    text: If you are using this medicine for a long time, tell your doctor about any
      extra stress or anxiety in your life, including other health concerns and emotional
      stress. Your dose of this medicine might need to be changed for a short time
      while you have extra stress.
  - type: paragraph
    text: This medicine may increase your risk of having broken bones (fractures)
      or slow growth in children if used for a long time. Tell your doctor if you
      have any bone pain or if you have an increased risk for osteoporosis. If your
      child is using this medicine, tell the doctor if you think your child is not
      growing properly.
  - type: paragraph
    text: Check with your doctor right away if blurred vision, difficulty in reading,
      eye pain, or any other change in vision occurs during or after treatment. Your
      doctor may want you to have your eyes checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: This medicine may increase your risk for cancer, including Kaposi's sarcoma.
      Tell your doctor right away if you have flat, painless spots that are red or
      purple on white skin or bluish, brownish, or black on dark skin.
  - type: paragraph
    text: While you are being treated with hydrocortisone, do not have any immunizations
      (vaccines) without your doctor's approval . Hydrocortisone may lower your body's
      resistance and the vaccine may not work as well or you might get the infection
      the vaccine is meant to prevent. In addition, you should not be around other
      persons living in your household who receive live virus vaccines because there
      is a chance they could pass the virus on to you. Some examples of live vaccines
      include measles, mumps, influenza (nasal flu vaccine), poliovirus (oral form),
      rotavirus, and rubella. If you have questions about this, talk to your doctor.
  - type: paragraph
    text: This medicine may cause changes in mood or behavior for some patients. Tell
      your doctor right away if you have depression, mood swings, a false or unusual
      sense of well-being, trouble with sleeping, or personality changes while using
      this medicine.
  - type: paragraph
    text: Check with your doctor right away if you feel muscle pain, tenderness, and
      an increase in muscle weakness while using this medicine.
  - type: paragraph
    text: This medicine may cause a serious type of reaction called tumor lysis syndrome.
      Call your doctor right away if you have a decrease or change in the amount of
      urine you pass, joint pain, stiffness, or swelling, lower back, side, or stomach
      pain, rapid weight gain, swelling of the feet or lower legs, or unusual tiredness
      or weakness.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect the results of certain skin tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acne
      - back pain
      - bloody or black tarry stools
      - bone pain, tenderness, or aching
      - chest pain, discomfort, or tightness
      - chills
      - cough
      - darkening or lightening of skin color
      - discouragement
      - eye pain and blurred vision
      - facial hair growth in females
      - fast, pounding, or irregular heartbeat or pulse
      - fast, slow, or irregular breathing
      - feeling sad or empty
      - fever
      - fractures
      - full or round face, neck, or trunk
      - general feeling of illness
      - headache
      - heartburn, indigestion
      - increased appetite
      - increased fat deposits on the face, neck, and trunk
      - increased hair growth on the face, forehead, back, arms, and legs
      - increased sweating, thirst, urination
      - irritability
      - itching
      - joint pain, stiffness, or swelling
      - lightheadedness, dizziness, or fainting
      - loss of appetite
      - loss of interest or pleasure
      - loss of sexual desire or ability
      - lower back or side pain
      - menstrual irregularities
      - muscle wasting and weakness
      - seizures
      - severe and continuing nausea
      - skin rash
      - slow wound healing
      - sore throat
      - stomach pain and cramping
      - swelling of the eyes or eyelids
      - swelling of the feet or lower legs
      - thinning of the scalp hair
      - trouble concentrating
      - trouble in breathing
      - unusual tiredness or weakness
      - unusual weight loss
      - vomit that looks like coffee grounds
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
