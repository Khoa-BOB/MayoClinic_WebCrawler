title: Linvoseltamab-gcpt (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Lynozyfic
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Linvoseltamab-gcpt injection is used to treat relapsed (cancer that has
      come back) or refractory (cancer that did not respond to treatment) multiple
      myeloma in patients who have received at least 4 previous treatments. These
      previous treatments include a proteasome inhibitor, an immunomodulatory agent,
      and an anti-CD38 monoclonal antibody.
  - type: paragraph
    text: This medicine is available only under a restricted distribution program
      called Lynozyfic™ REMS (Risk Evaluation and Mitigation Strategy) Program.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of linvoseltamab-gcpt injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of linvoseltamab-gcpt injection in
        the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Liver disease or
      - Serious infection—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through an IV catheter the is placed into
      one of your veins.
  - type: paragraph
    text: It is very important that you understand the requirements of the Lynozyfic™
      REMS program, and become familiar with the Lynozyfic™ medication guide. Read
      and follow these instructions carefully. Ask your doctor if you have any questions.
      Ask your pharmacist for the medication guide if you do not have one.
  - type: paragraph
    text: You will receive this medicine on a "step-up dosing schedule" on Days 1
      and 8, followed by the first treatment dose on Day 15. After you receive your
      first treatment dose, this medicine is usually given once a week from Week 4
      to Week 13 for 10 treatment doses. Starting at week 14, your dose is usually
      given once every 2 weeks. Your doctor will ask you to stay for 24 hours after
      receiving the step-up doses.
  - type: paragraph
    text: You may also receive other medicines (eg, allergy medicine, fever medicine,
      steroid) 30 to 60 minutes or 1 to 3 hours before receiving this medicine to
      help prevent unwanted reactions to the injection.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests are needed
      to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you can get pregnant, your doctor may do tests to make sure you are not pregnant
      before starting treatment. Use an effective form of birth control to keep from
      getting pregnant during treatment and for 3 months after the last dose. If you
      think you have become pregnant while using this medicine, tell your doctor right
      away.
  - type: paragraph
    text: This medicine may cause cytokine release syndrome (CRS) and nervous system
      problems, including immune effector cell-associated neurotoxicity syndrome (ICANS).
      These may be life-threatening and require immediate attention. Tell your doctor
      right away if you have agitation, back pain, blurred vision, burning, throbbing,
      or stabbing pain, coma, confusion, double vision, drowsiness, feeling restless,
      fever, chills, hallucinations, headache, hearing loss, irritability, jerking
      movements, mood or mental changes, muscle spasms, nausea, lightheadedness, dizziness,
      fainting, rigid muscles, seizures, skin rash, stiff neck, tremor, trouble breathing,
      trouble speaking, unusual tiredness or weakness, or vomiting.
  - type: paragraph
    text: Ask your doctor for a patient wallet card. This card will list the symptoms
      of cytokine release syndrome and nervous system problems. Carry the card with
      you at all times during treatment. You will need to show the card to any doctor
      who treats you.
  - type: paragraph
    text: This medicine may cause serious infections. Check with your doctor right
      away if you have fever or chills, confusion, cough or hoarseness, lower back
      or side pain, or painful or difficult urination.
  - type: paragraph
    text: This medicine lowers the number of some types of blood cells in your body.
      Because of this, you may get infections more easily. To help with these problems,
      avoid being near people who are sick or have infections. Wash your hands often.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: This medicine may cause dizziness, confusion, sleepiness, or tremors. Do
      not drive or do anything else that could be dangerous during and for 48 hours
      after receiving this medicine until you know how this medicine affects you .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - back pain
      - being forgetful
      - bladder pain
      - bloody or cloudy urine
      - blurred vision
      - body aches or pain
      - chest pain or tightness
      - chills
      - coma
      - confusion
      - cough
      - decreased urine output
      - depression
      - diarrhea
      - difficult, burning, or painful urination
      - dizziness
      - drowsiness
      - ear congestion
      - fainting
      - fever
      - frequent urge to urinate
      - hallucinations
      - headache
      - hostility
      - irritability
      - lethargy
      - lightheadedness
      - loss of memory
      - loss of taste or smell
      - loss of voice
      - lower back or side pain
      - mood or mental changes
      - muscle or bone pain
      - muscle twitching
      - nausea
      - nervousness
      - pounding in the ears
      - problems with memory
      - rapid or irregular heartbeat
      - rapid weight gain
      - seizures
      - sneezing
      - sore throat
      - stiff neck
      - stuffy or runny nose
      - stupor
      - swelling
      - swelling of the face, ankles, or hands
      - trouble breathing
      - trembling and shaking of the hands
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - dark urine
      - loss of appetite
      - pale skin
      - stomach pain, severe
      - unusual bleeding or bruising
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - skin rash
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
