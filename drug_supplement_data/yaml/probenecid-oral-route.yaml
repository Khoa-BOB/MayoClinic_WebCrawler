title: Probenecid (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Benemid
    - type: paragraph
      text: Probalan
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Probenecid is used in the treatment of chronic gout or gouty arthritis.
      These conditions are caused by too much uric acid in the blood. The medicine
      works by removing the extra uric acid from the body. Probenecid does not cure
      gout, but after you have been taking it for a few months it will help prevent
      gout attacks. This medicine will help prevent gout attacks only as long as you
      continue to take it.
  - type: paragraph
    text: Probenecid is also used to prevent or treat other medical problems that
      may occur if too much uric acid is present in the body.
  - type: paragraph
    text: Probenecid is sometimes used with certain kinds of antibiotics to make them
      more effective in the treatment of infections.
  - type: paragraph
    text: Probenecid is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Probenecid has been tested in children 2 to 14 years of age for use together
        with antibiotics. It has not been shown to cause different side effects or
        problems than it does in adults. Studies on the effects of probenecid in patients
        with gout have been done only in adults. Gout is very rare in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. There is no specific information comparing use of probenecid in the
        elderly with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Aspirin
      - Balsalazide
      - Bismuth
      - Diflunisal
      - Ketorolac
      - Ketorolac Tromethamine
      - Magnesium Salicylate
      - Mesalamine
      - Olsalazine
      - Olsalazine Sodium
      - Salicylic Acid
      - Salsalate
      - Sodium Salicylate
      - Sulfasalazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acetaminophen
      - Amoxicillin
      - Avibactam
      - Aztreonam
      - Baricitinib
      - Belinostat
      - Bictegravir
      - Bumetanide
      - Cephalexin
      - Deferiprone
      - Doripenem
      - Furosemide
      - Glimepiride
      - Glipizide
      - Indomethacin
      - Irinotecan
      - Irinotecan Liposome
      - Ketoprofen
      - Lorazepam
      - Meclofenamate
      - Methotrexate
      - Mycophenolate Mofetil
      - Naproxen
      - Pegloticase
      - Pexidartinib
      - Phenobarbital
      - Piperacillin
      - Primidone
      - Sacituzumab Govitecan-hziy
      - Seladelpar
      - Sodium Phenylbutyrate
      - Sulbactam
      - Sulopenem
      - Tazobactam
      - Tolbutamide
      - Vadadustat
      - Zalcitabine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Bismuth Subsalicylate
      - Cefditoren Pivoxil
      - Cefotaxime
      - Cefpodoxime Proxetil
      - Cefprozil
      - Choline Magnesium Trisalicylate
      - Ciprofloxacin
      - Enprofylline
      - Ertapenem
      - Gatifloxacin
      - Meropenem
      - Norfloxacin
      - Phenprocoumon
      - Piretanide
      - Pralatrexate
      - Sodium Thiosalicylate
      - Zidovudine
      - Zomepirac
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood disease or
      - Cancer being treated by antineoplastics (cancer medicine) or radiation (x-rays)
        or
      - Kidney disease or stones (or history of) or
      - Stomach ulcer (history of)—The chance of side effects may be increased
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: If probenecid upsets your stomach, it may be taken with food. If this does
      not work, an antacid may be taken. If stomach upset (nausea, vomiting, or loss
      of appetite) continues, check with your doctor.
  - type: paragraph
    text: 'For patients taking probenecid for gout:'
  - type: list
    ordered: false
    items:
    - After you begin to take probenecid, gout attacks may continue to occur for a
      while. However, if you take this medicine regularly as directed by your doctor,
      the attacks will gradually become less frequent and less painful than before.
      After you have been taking probenecid for several months, they may stop completely.
    - This medicine will help prevent gout attacks but it will not relieve an attack
      that has already started. Even if you take another medicine for gout attacks,
      continue to take this medicine also. If you have any questions about this, check
      with your doctor.
  - type: paragraph
    text: 'For patients taking probenecid for gout or to help remove uric acid from
      the body:'
  - type: list
    ordered: false
    items:
    - When you first begin taking probenecid, the amount of uric acid in the kidneys
      is greatly increased. This may cause kidney stones or other kidney problems
      in some people. To help prevent this, your doctor may want you to drink at least
      10 to 12 full glasses (8 ounces each) of fluids each day, or to take another
      medicine to make your urine less acid. It is important that you follow your
      doctor's instructions very carefully.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For treating gout or removing uric acid from the body: Adults: 250 mg (one-half
        of a 500-mg tablet) two times a day for about one week, then 500 mg (one tablet)
        two times a day for a few weeks. After this, the dose will depend on the amount
        of uric acid in your blood or urine. Most people need 2, 3, or 4 tablets a
        day, but some people may need higher doses. Children: It is not likely that
        probenecid will be needed to treat gout or to remove uric acid from the body
        in children. If a child needs this medicine, however, the dose would have
        to be determined by the doctor.'
      - 'For helping antibiotics work better: Adults: The amount of probenecid will
        depend on the condition being treated. Sometimes, only one dose of 2 tablets
        is needed. Other times, the dose will be 1 tablet four times a day. Children:
        The dose will have to be determined by the doctor. It depends on the child''s
        weight, as well as on the condition being treated. Older children and teenagers
        may need the same amount as adults.'
    - type: list
      ordered: false
      items:
      - 'Adults: 250 mg (one-half of a 500-mg tablet) two times a day for about one
        week, then 500 mg (one tablet) two times a day for a few weeks. After this,
        the dose will depend on the amount of uric acid in your blood or urine. Most
        people need 2, 3, or 4 tablets a day, but some people may need higher doses.'
      - 'Children: It is not likely that probenecid will be needed to treat gout or
        to remove uric acid from the body in children. If a child needs this medicine,
        however, the dose would have to be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults: The amount of probenecid will depend on the condition being treated.
        Sometimes, only one dose of 2 tablets is needed. Other times, the dose will
        be 1 tablet four times a day.'
      - 'Children: The dose will have to be determined by the doctor. It depends on
        the child''s weight, as well as on the condition being treated. Older children
        and teenagers may need the same amount as adults.'
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If you will be taking probenecid for more than a few weeks, your doctor
      should check your progress at regular visits.
  - type: paragraph
    text: Before you have any medical tests, tell the person in charge that you are
      taking this medicine. The results of some tests may be affected by probenecid.
  - type: paragraph
    text: 'For diabetic patients:'
  - type: list
    ordered: false
    items:
    - Probenecid may cause false test results with copper sulfate urine sugar tests
      (Clinitest®), but not with glucose enzymatic urine sugar tests (Clinistix®).
      If you have any questions about this, check with your health care professional.
  - type: paragraph
    text: 'For patients taking probenecid for gout or to help remove uric acid from
      the body:'
  - type: list
    ordered: false
    items:
    - Taking aspirin or other salicylates may lessen the effects of probenecid. This
      will depend on the dose of aspirin or other salicylate that you take, and on
      how often you take it. Also, drinking too much alcohol may increase the amount
      of uric acid in the blood and lessen the effects of this medicine. Therefore,
      do not take aspirin or other salicylates or drink alcoholic beverages while
      taking this medicine, unless you have first checked with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fast or irregular breathing
      - puffiness or swellings of the eyelids or around the eyes
      - shortness of breath, troubled breathing, tightness in chest, or wheezing
      - changes in the skin color of the face occurring together with any of the other
        side effects listed here
      - or skin rash, hives, or itching occurring together with any of the other side
        effects listed here
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody urine
      - difficult or painful urination
      - lower back or side pain (especially if severe or sharp)
      - skin rash, hives, or itching (occurring without other signs of an allergic
        reaction)
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cloudy urine
      - cough or hoarseness
      - fast or irregular breathing
      - fever
      - pain in back and/or ribs
      - sores, ulcers, or white spots on lips or in mouth
      - sore throat and fever with or without chills
      - sudden decrease in the amount of urine
      - swelling of face, fingers, feet, and/or lower legs
      - swollen and/or painful glands
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - yellow eyes or skin
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - joint pain, redness, or swelling
      - loss of appetite
      - nausea or vomiting (mild)
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - flushing or redness of face (occurring without any signs of an allergic reaction)
      - frequent urge to urinate
      - sore gums
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
