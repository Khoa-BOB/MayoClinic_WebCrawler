    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Digoxin
      - Metoprolol
      - Midazolam
      - Phenytoin
      - Repaglinide
      - Theophylline
      - Verapamil
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bradycardia (slow heartbeat) or
      - Heart rhythm problems or
      - Hypokalemia (low potassium in the blood), uncorrected or
      - Hypomagnesemia (low magnesium in the blood), uncorrected or
      - QTc prolongation (rare heart rhythm problem), or family history of—Use with
        caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Hepatitis, history of or
      - Jaundice, history of or
      - Myasthenia gravis (severe muscle weakness)—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine comes with a Medication Guide. It is very important that you
      read and understand this information. Be sure to ask your doctor about anything
      you do not understand.
  - type: paragraph
    text: Telithromycin may be taken with or without food. Swallow the tablet whole.
      Do not crush, break, or chew it.
  - type: paragraph
    text: To help clear up your infection completely, keep taking telithromycin for
      the full time of treatment , even if you begin to feel better after a few days.
      If you stop taking this medicine too soon, your symptoms may return.
  - type: paragraph
    text: Take this medicine at the same time every day. Do not take more than one
      dose in 24 hours.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For community-acquired pneumonia: Adults—800
        milligrams (mg) once a day for 7 to 10 days. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For community-acquired pneumonia: Adults—800 milligrams (mg) once a day for
        7 to 10 days. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—800 milligrams (mg) once a day for 7 to 10 days.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Telithromycin should not be taken with cisapride (Propulsid®), colchicine,
      or pimozide (Orap®) . Doing so may increase the risk of serious side effects.
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: Stop taking telithromycin and contact your doctor right away if you have
      symptoms of liver disease . These symptoms include tiredness, body aches, loss
      of appetite, nausea, yellow skin and eyes, dark urine, light-colored stools,
      itchy skin, or severe stomach pains. Severe liver problems and liver failure
      have been reported, and in some cases, liver injury developed quickly and after
      only a few doses.
  - type: paragraph
    text: This medicine may cause fainting, blurred vision, or other vision problems.
      If any of these occur, do not drive, use machines, or do anything else that
      could be dangerous if you are not able to see well or if you feel lightheaded
      . If these side effects occur and they bother you, check with your doctor.
  - type: paragraph
    text: This medicine may cause diarrhea, and in some cases it can be severe. It
      may occur up to 2 months or more after you stop taking this medicine. Do not
      take any medicine to treat diarrhea without first checking with your doctor.
      If you have any questions or if mild diarrhea continues or gets worse, check
      with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - blistering, peeling, or loosening of the skin
      - blurred vision
      - chest pain or discomfort
      - chills
      - confusion
      - convulsions
      - cough
      - dark urine
      - decreased urine
      - difficulty with breathing, chewing, swallowing, or talking
      - dizziness
      - double vision
      - drooping eyelids
      - dry mouth
      - fainting
      - faintness or lightheadedness when getting up suddenly from a lying or sitting
        position
      - fast, slow, or irregular heartbeat
      - fever with or without chills
      - increased thirst
      - itching
      - joint pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - light-colored stools
      - loss of appetite
      - mood changes
      - muscle pain or cramps
      - muscle weakness
      - nausea
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - red, irritated eyes
      - shortness of breath
      - skin rash
      - sores, ulcers, or white spots in the mouth or on the lips or tongue
      - stomach cramps, tenderness, or pain
      - sweating
      - tightness in the chest
      - unusual tiredness or weakness
      - upper right abdominal or stomach pain
      - vomiting
      - watery or bloody diarrhea
      - weakness or heaviness of the legs
      - wheezing
      - yellow eyes and skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - clay-colored stools
      - continuous vomiting
      - dark-colored urine
      - decreased appetite
      - general feeling of tiredness or weakness
      - swelling of the feet or lower legs
      - unpleasant breath odor
      - vomiting of blood
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal dreams
      - acid or sour stomach
      - belching
      - bloated, full feeling, or pressure in the stomach
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - burning feeling in the chest or stomach
      - change in color, amount, or odor of vaginal discharge
      - change in sense of smell
      - change in taste
      - difficulty focusing the eyes
      - difficulty having a bowel movement (stool)
      - disturbed attention span
      - dry lips
      - dry skin
      - excess air or gas in the stomach or intestines
      - feeling of constant movement of self or surroundings
      - feeling of warmth, redness of the face, neck, arms, and occasionally, upper
        chest
      - frequent urination
      - headache
      - heartburn
      - increased amount of pale, dilute urine
      - indigestion
      - itching of the vagina or outside genitals
      - lack or loss of strength
      - lightheadedness
      - loose stools
      - loss of appetite
      - loss of sense of taste
      - pain during sexual intercourse
      - pain or tenderness around the eyes and cheekbones
      - passing gas more often than usual
      - redness of the skin
      - redness, swelling, or soreness of the tongue
      - sensation of spinning
      - shakiness in the legs, arms, hands, or feet
      - skin rash, encrusted, scaly, and oozing
      - sleeplessness
      - sore mouth or tongue
      - sore throat
      - stomach upset or pain
      - stuffy or runny nose
      - swelling or puffiness of the face
      - tenderness in the stomach area
      - thick, white curd-like vaginal discharge, without odor or with mild odor
      - tooth discoloration
      - trouble sleeping
      - weight loss
      - white patches in the mouth and on the tongue
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
