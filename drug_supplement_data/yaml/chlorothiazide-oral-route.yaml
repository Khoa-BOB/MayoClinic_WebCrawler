title: Chlorothiazide (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Diuril
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Chlorothiazide is used to treat fluid retention (edema) that is caused by
      congestive heart failure, severe liver disease (cirrhosis), kidney disease,
      or from treatment with a steroid or hormone medicine.
  - type: paragraph
    text: Chlorothiazide is also used alone or together with other medicines to treat
      high blood pressure (hypertension). High blood pressure adds to the workload
      of the heart and arteries. If it continues for a long time, the heart and arteries
      may not function properly. This can damage the blood vessels of the brain, heart,
      and kidneys, resulting in a stroke, heart failure, or kidney failure. High blood
      pressure may also increase the risk of heart attacks. These problems may be
      less likely to occur if the blood pressure is controlled.
  - type: paragraph
    text: Chlorothiazide is a thiazide diuretic (water pill). It reduces the amount
      of water in the body by increasing the flow of urine, which helps to lower blood
      pressure and remove excess fluid (edema).
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of chlorothiazide
        have not been performed in the pediatric population. However, pediatric-specific
        problems that would limit the usefulness of this medicine in children are
        not expected, and no problems have been documented to date.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of chlorothiazide in the elderly.
        However, elderly patients are more likely to have age-related liver, kidney,
        or heart problems, which may require an adjustment in the dose for patients
        receiving chlorothiazide.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies suggest that this medication may alter milk production or composition.
        If an alternative to this medication is not prescribed, you should monitor
        the infant for side effects and adequate milk intake.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Aceclofenac
      - Acemetacin
      - Acetyldigoxin
      - Albiglutide
      - Albuterol
      - Alogliptin
      - Amphetamine
      - Amtolmetin Guacil
      - Arsenic Trioxide
      - Aspirin
      - Benzhydrocodone
      - Benzphetamine
      - Bepridil
      - Bromfenac
      - Bromocriptine
      - Bufexamac
      - Buprenorphine
      - Canagliflozin
      - Cefepime
      - Celecoxib
      - Chlorpropamide
      - Choline Salicylate
      - Clonixin
      - Codeine
      - Dapagliflozin
      - Deslanoside
      - Desmopressin
      - Dexibuprofen
      - Dexketoprofen
      - Dextroamphetamine
      - Diazoxide
      - Diclofenac
      - Diflunisal
      - Digitalis
      - Digitoxin
      - Digoxin
      - Dihydrocodeine
      - Dipyrone
      - Dofetilide
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aminolevulinic Acid
      - Calcium
      - Ginkgo
      - Gossypol
      - Licorice
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anuria (not able to form urine)—Should not be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Asthma or
      - Diabetes or
      - Gout or
      - Hypercalcemia (high calcium in the blood) or
      - Hypercholesterolemia (high cholesterol in the blood) or
      - Hyperuricemia (high uric acid in the blood) or
      - Hypochloremia (low chloride in the blood) or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood) or
      - Hyponatremia (low sodium in the blood) or
      - Liver disease or
      - Systemic lupus erythematosus—Use with caution. This medicine may make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects of the medicine may be increased
        because of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium or potassium. Your doctor will tell you which of these
      are most important for you. You should check with your doctor before changing
      your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many patients feel normal. It is very important that you
      take your medicine exactly as directed and that you keep your appointments with
      your doctor even if you feel well.
  - type: paragraph
    text: This medicine will not cure your high blood pressure, but it does help control
      it. You must continue to receive it as directed if you expect to lower your
      blood pressure and keep it down. You may have to take high blood pressure medicine
      for the rest of your life. If high blood pressure is not treated, it can cause
      serious problems, such as heart failure, blood vessel disease, stroke, or kidney
      disease.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For fluid retention (edema): For oral dosage forms (suspension): Adults—The
        usual dose is 10 to 20 milliliters (mL) once or twice a day. Your doctor may
        adjust how often you take your dose. Children—Dose is based on body weight
        and must be determined by your doctor. For oral dosage forms (tablets): Adults—The
        usual dose is 500 to 1000 milligrams (mg) once or twice a day. Your doctor
        may adjust how often you take your dose. Children—Dose is based on body weight
        and must be determined by your doctor.'
      - 'For high blood pressure: For oral dosage forms (suspension): Adults—The usual
        dose is 10 to 20 milliliters (mL) once a day as a single dose or in divided
        doses. Your doctor may adjust your dose if needed. Children—Dose is based
        on body weight and must be determined by your doctor. For oral dosage forms
        (tablets): Adults—The usual dose is 500 to 1000 milligrams (mg) once a day
        as a single dose or in divided doses. Your doctor may adjust your dose if
        needed. Children—Dose is based on body weight and must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (suspension): Adults—The usual dose is 10 to 20 milliliters
        (mL) once or twice a day. Your doctor may adjust how often you take your dose.
        Children—Dose is based on body weight and must be determined by your doctor.'
      - 'For oral dosage forms (tablets): Adults—The usual dose is 500 to 1000 milligrams
