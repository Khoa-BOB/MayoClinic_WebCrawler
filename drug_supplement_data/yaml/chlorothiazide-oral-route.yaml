    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: 'Check with your doctor right away if you have any of the following symptoms
      while taking this medicine: convulsions or seizures; decreased urine; drowsiness;
      dry mouth; excessive thirst; muscle pains or cramps; nausea or vomiting; increased
      heart rate or pulse; or unusual tiredness or weakness. These may be symptoms
      of a condition called hypokalemia or low potassium.'
  - type: paragraph
    text: This medicine may cause some people to become dizzy. Do not drive, use machines,
      or do anything else that could be dangerous if you are dizzy .
  - type: paragraph
    text: Drinking alcoholic beverages may also make the dizziness worse. While you
      are taking this medicine, be careful to limit the amount of alcohol you drink.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are taking this medicine. The results of some tests (e.g., tests for parathyroid
      function) may be affected by this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
