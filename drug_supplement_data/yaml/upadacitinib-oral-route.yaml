      - Weighing 20 kg to less than 30 kg—4 mg or 4 mL 2 times a day.
      - Weighing 10 kg to less than 20 kg—3 mg or 3 mL 2 times a day.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away unused oral liquid 60 days after opening.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if this medicine is working properly and
      to decide whether you should continue to use it. Blood tests are needed to check
      for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you can get pregnant, your doctor may give you a pregnancy test before you start
      using this medicine to make sure you are not pregnant. Use an effective form
      of birth control to keep from getting pregnant during treatment and for at least
      4 weeks after the last dose. If you think you have become pregnant while using
      this medicine, tell your doctor right away.
  - type: paragraph
    text: Using this medicine together with azathioprine or cyclosporine is not recommended
      .
  - type: paragraph
    text: You will need to have a skin test for tuberculosis before you start using
      this medicine. Tell your doctor if you or anyone in your home has ever had a
      positive reaction to a tuberculosis skin test.
  - type: paragraph
    text: Your body's ability to fight infections may be reduced while you are using
      upadacitinib. It is very important that you call your doctor at the first sign
      of an infection. Check with your doctor right away if you have a fever, chills,
      cough, flu-like symptoms, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may increase your risk of serious heart or blood vessel problems
      (eg, heart attack, stroke), especially in patients with rheumatoid arthritis
      who are 50 years of age and older and with a heart or blood vessel disease.
      Call your doctor right away if you have chest pain or discomfort, confusion,
      difficulty in speaking, double vision, headache, inability to move arms, legs,
      or facial muscles, nausea, pain or discomfort in the arms, jaw, back, or neck,
      sweating, trouble breathing, or vomiting.
  - type: paragraph
    text: This medicine may increase your risk of cancer (eg, lymphoma, lung cancer,
      non-melanoma skin cancer). Tell your doctor right away if you have black, tarry
      stools, general feeling of illness, swollen glands, weight loss, yellow skin
      and eyes, persistent non-healing sore, reddish patch or irritated area, shiny
      bump, pink growth, or white, yellow or waxy scar-like area on the skin.
  - type: paragraph
    text: This medicine may increase your risk of developing blood clots (eg, arterial
      thrombosis, deep vein thrombosis, pulmonary embolism), especially in patients
      with rheumatoid arthritis who are 50 years of age and older and with a heart
      or blood vessel disease. Check with your doctor right away if you have anxiety,
      chest pain, cough, dizziness, lightheadedness, or fainting, fast heartbeat,
      pain, redness, or swelling in the arm or leg, pains in the chest, groin, or
      legs, especially calves of the legs, severe headaches, sudden loss of coordination,
      sudden onset of slurred speech, sudden vision changes, or trouble breathing.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Check with your doctor right away if you have chest tightness, cough,
      difficulty swallowing, dizziness, fast heartbeat, hives, itching, skin rash,
      large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
      feet, or sex organs, puffiness or swelling of the eyelids or around the eyes,
      face, lips, or tongue, trouble breathing, or unusual tiredness or weakness.
  - type: paragraph
    text: 'Upadacitinib can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. If this occurs, there
      are certain precautions you can take, especially when your blood count is low,
      to reduce the risk of infection:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor right away
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor right away if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects, such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: This medicine may make your skin more sensitive to sunlight. Use a sunscreen
      when you are outdoors. Avoid sunlamps and tanning beds.
  - type: paragraph
    text: Before treatment with upadacitinib, while you are being treated with it,
      and after you stop treatment with it, do not have any immunizations (vaccines)
      without your doctor's approval. Upadacitinib may lower your body's resistance
      and there is a chance you might get the infection the vaccine is meant to prevent.
      In addition, you should not be around other persons living in your household
      who receive live virus vaccines because there is a chance they could pass the
      virus on to you. Some examples of live vaccines include measles, mumps, influenza
      (nasal flu vaccine), poliovirus (oral form), rotavirus, and rubella. If you
      have questions about this, talk to your doctor.
  - type: paragraph
    text: This medicine may increase the level of cholesterol and fat in your blood.
      Talk to your doctor if you have concerns.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - body aches or pain
      - chills
      - cough
      - ear congestion
      - fever
      - headache
      - itching, pain, redness, swelling, tenderness, warmth on the skin
      - loss of voice
      - rapid weight gain
      - runny or stuffy nose
      - sneezing
      - sore throat
      - tingling of the hands or feet
      - unusual tiredness or weakness
      - unusual weight gain or loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - burning or stinging of the skin
      - chest tightness
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - hives, itching, skin rash
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - lower back or side pain
      - painful blisters on the trunk of the body
      - painful cold sores or blisters on the lips, nose, eyes, or genitals
      - painful or difficult urination
      - pale skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - ulcers, sores, or white spots in the mouth or tongue
      - unusual bleeding or bruising
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Coughing or spitting up blood
      - difficulty with breathing
      - heartburn
      - indigestion
      - muscle aches
      - nausea
      - night sweats
      - pale skin
      - persistent non-healing sore
      - pink growth
      - reddish patch or irritated area
      - severe stomach pain, cramping, or burning
      - shiny bump
      - sudden high fever or low-grade fever for months
      - trouble breathing
      - vomiting of material that looks like coffee grounds, severe and continuing
      - white, yellow or waxy scar-like area
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or discomfort
      - confusion
      - difficulty in speaking
      - double vision
      - inability to move the arms, legs, or facial muscles
      - inability to speak
      - no blood pressure or pulse
      - pain or discomfort in the arms, jaw, back, or neck
      - slow speech
      - stopping of heart
      - sweating
      - unconsciousness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
