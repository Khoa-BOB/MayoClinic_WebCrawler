        mg or 4 mL 2 times a day. Weighing 10 kg to less than 20 kg—3 mg or 3 mL 2
        times a day. Children younger than 2 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Children 2 years of age and older—Dose is based on body weight and must be
        determined by your doctor. Weighing 30 kilograms (kg) or more—6 milligrams
        (mg) or 6 milliliters (mL) 2 times a day. Weighing 20 kg to less than 30 kg—4
        mg or 4 mL 2 times a day. Weighing 10 kg to less than 20 kg—3 mg or 3 mL 2
