    - type: list
      ordered: false
      items:
      - Adults—15 milligrams (mg) once a day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—At first, 45 milligrams (mg) once a day for 8 weeks, then 15 mg once
        a day. Your doctor may adjust your dose as needed.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For polyarticular juvenile idiopathic arthritis and psoriatic arthritis:
        Children 2 years of age and older—Dose is based on body weight and must be
