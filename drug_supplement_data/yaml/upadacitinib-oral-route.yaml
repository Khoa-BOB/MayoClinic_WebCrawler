title: Upadacitinib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Rinvoq
    - type: paragraph
      text: Rinvoq LQ
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Upadacitinib is used to treat moderate to severe active rheumatoid arthritis,
      active psoriatic arthritis, ankylosing spondylitis, non-radiographic axial spondyloarthritis
      (a type of arthritis in the spine) with objective signs of swelling, and polyarticular
      juvenile idiopathic arthritis (PJIA) in patients who have used other medicines
      (eg, tumor necrosis factor [TNF] blockers) that did not work well or cannot
      be tolerated.
  - type: paragraph
    text: Upadacitinib is also used to treat moderate to severe atopic dermatitis
      (eczema) in patients who have used other medicines that did not work well and
      whose condition is not well controlled with other treatments (eg, pills or injections),
      including biologic medicines, or the use of other pills or injections is not
      recommended. This medicine is also used to treat giant cell arteritis.
  - type: paragraph
    text: Upadacitinib is also used to treat moderate to severe ulcerative colitis
      and Crohn's disease in patients who have used other medicines (eg, tumor necrosis
      factor [TNF] blockers) that did not work well or cannot be tolerated, or in
      patients who have used other treatments (eg, pills or injections) when TNF blockers
      are not recommended.
  - type: paragraph
    text: Upadacitinib is a Janus kinase (JAK) inhibitor that works on the immune
      system.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Extended Release
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of upadacitinib extended-release tablets to treat rheumatoid
        arthritis, ankylosing spondylitis, non-radiographic axial spondyloarthritis,
        ulcerative colitis, Crohn's disease, and giant cell arteritis in children,
        to treat psoriatic arthritis and PJIA in children younger than 2 years of
        age, and to treat atopic dermatitis in children younger than 12 years of age.
        Safety and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of upadacitinib oral solution to treat atopic dermatitis, rheumatoid
        arthritis, ankylosing spondylitis, non-radiographic axial spondyloarthritis,
        ulcerative colitis, Crohn's disease, and giant cell arteritis in children
        and to treat psoriatic arthritis and PJIA in children younger than 2 years
        of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of upadacitinib in the elderly. However,
        elderly patients are more likely to have serious infections and cancer, which
        may require caution in patients receiving upadacitinib.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Ranolazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Abatacept
      - Aceclofenac
      - Acemetacin
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Alclometasone
      - Aldosterone
      - Amcinonide
      - Amlodipine
      - Amtolmetin Guacil
      - Apalutamide
      - Aspirin
      - Atogepant
      - Avacopan
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Baricitinib
      - Beclomethasone
      - Betamethasone
      - Boceprevir
      - Bromfenac
      - Budesonide
      - Bufexamac
      - Carbamazepine
      - Cariprazine
      - Celecoxib
      - Cholera Vaccine, Live
      - Choline Salicylate
      - Ciclesonide
      - Clarithromycin
      - Clobetasol
      - Clobetasone
      - Clocortolone
      - Clonixin
      - Cobicistat
      - Conivaptan
      - Cortisone
      - Deflazacort
      - Dengue Tetravalent Vaccine, Live
      - Desonide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia (blood condition) or
      - Cancer or
      - Diabetes or
      - Hyperlipidemia (high cholesterol in the blood) or
      - Infection, history of or
      - Lung disease or
      - Neutropenia (blood disease) or
      - Stomach or bowel problems (eg, diverticulitis, perforation, ulcers), history
        of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease or
      - Hepatitis B, history of or
      - Hepatitis C, history of or
      - Herpes zoster infection or
      - Tuberculosis, active or history of or
      - Weakened immune system—May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Infection, active or
      - Kidney disease, end stage or
      - Liver disease, severe—Use is not recommended in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe—Use with caution in patients with atopic dermatitis,
        Crohn's disease, or ulcerative colitis. The effects may be increased because
        of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Smoking, current or past—May increase risk for serious side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      or less of it, do not take it more often, and do not take it for a longer time
      than your doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the extended-release tablet whole with water. Do not cut, crush,
      break, or chew it.
  - type: paragraph
    text: 'To use the oral liquid :'
  - type: list
    ordered: false
    items:
    - Use this medicine with the provided press-in bottle adapter and oral dosing
      syringe.
    - Press down and twist the cap to remove it from the bottle. Do not throw away
      the cap. While holding the bottle firmly, use your thumb to push the adapter
      all the way down to the rim of the bottle. Do not remove the adapter after it
      is inserted.
    - Insert the tip of the syringe into the adapter. With the syringe attached to
      the bottle, turn the bottle upside down.
    - Slowly pull the plunger down. Check the syringe for large air bubbles. If you
      see air bubbles, flick the sides off the syringe to send large air bubbles to
      the tip. Move the plunger up and down to return air bubbles back into the bottle.
    - Move the plunger until it is even with the prescribed dose. Turn the bottle
      upright and remove the syringe. Hold the middle of the syringe and carefully
      remove it from the bottle.
    - Place the syringe against the inside of the child's cheek. Push the plunger
      to give the entire dose and give water.
  - type: paragraph
    text: Do not switch between extended-release tablet and oral liquid unless your
      doctor yells you to.
  - type: paragraph
    text: A part of the extended-release tablet may pass into your stools. This is
      normal and is nothing to worry about.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets): For atopic dermatitis: Adults
        and children 12 years of age and older weighing at least 40 kilograms (kg)—At
        first, 15 milligrams (mg) once a day. Your doctor may adjust your dose as
        needed. Children younger than 12 years of age—Use and dose must be determined
        by your doctor. For Crohn''s disease: Adults—At first, 45 milligrams (mg)
        once a day for 12 weeks, then 15 mg once a day. Your doctor may adjust your
        dose as needed. Children—Use and dose must be determined by your doctor. For
        giant cell arteritis: Adults—15 milligrams (mg) once a day in combination
        with a decreasing dose of a steroid medicine. Then, 15 mg once a day alone
        after stopping treatment with a steroid medicine. Children—Use and dose must
        be determined by your doctor. For polyarticular juvenile idiopathic arthritis
        and psoriatic arthritis: Adults and children 2 years of age and older weighing
        30 kilograms (kg) or more—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 15 milligrams (mg) once a day. Children
        2 years of age and older weighing less than 30 kg—Use of oral liquid is recommended.
        Children younger than 2 years of age—Use and dose must be determined by your
        doctor. For rheumatoid arthritis, ankylosing spondylitis, and non-radiographic
        axial spondyloarthritis: Adults—15 milligrams (mg) once a day. Children—Use
        and dose must be determined by your doctor. For ulcerative colitis: Adults—At
        first, 45 milligrams (mg) once a day for 8 weeks, then 15 mg once a day. Your
        doctor may adjust your dose as needed. Children—Use and dose must be determined
        by your doctor.'
      - 'For oral dosage form (solution): For polyarticular juvenile idiopathic arthritis
        and psoriatic arthritis: Children 2 years of age and older—Dose is based on
        body weight and must be determined by your doctor. Weighing 30 kilograms (kg)
        or more—6 milligrams (mg) or 6 milliliters (mL) 2 times a day. Weighing 20
        kg to less than 30 kg—4 mg or 4 mL 2 times a day. Weighing 10 kg to less than
        20 kg—3 mg or 3 mL 2 times a day. Children younger than 2 years of age—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For atopic dermatitis: Adults and children 12 years of age and older weighing
        at least 40 kilograms (kg)—At first, 15 milligrams (mg) once a day. Your doctor
        may adjust your dose as needed. Children younger than 12 years of age—Use
        and dose must be determined by your doctor.'
      - 'For Crohn''s disease: Adults—At first, 45 milligrams (mg) once a day for
        12 weeks, then 15 mg once a day. Your doctor may adjust your dose as needed.
        Children—Use and dose must be determined by your doctor.'
      - 'For giant cell arteritis: Adults—15 milligrams (mg) once a day in combination
        with a decreasing dose of a steroid medicine. Then, 15 mg once a day alone
        after stopping treatment with a steroid medicine. Children—Use and dose must
        be determined by your doctor.'
      - 'For polyarticular juvenile idiopathic arthritis and psoriatic arthritis:
        Adults and children 2 years of age and older weighing 30 kilograms (kg) or
        more—Dose is based on body weight and must be determined by your doctor. The
        dose is usually 15 milligrams (mg) once a day. Children 2 years of age and
        older weighing less than 30 kg—Use of oral liquid is recommended. Children
        younger than 2 years of age—Use and dose must be determined by your doctor.'
      - 'For rheumatoid arthritis, ankylosing spondylitis, and non-radiographic axial
        spondyloarthritis: Adults—15 milligrams (mg) once a day. Children—Use and
        dose must be determined by your doctor.'
      - 'For ulcerative colitis: Adults—At first, 45 milligrams (mg) once a day for
        8 weeks, then 15 mg once a day. Your doctor may adjust your dose as needed.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older weighing at least 40 kilograms
        (kg)—At first, 15 milligrams (mg) once a day. Your doctor may adjust your
        dose as needed.
      - Children younger than 12 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - Adults—At first, 45 milligrams (mg) once a day for 12 weeks, then 15 mg once
        a day. Your doctor may adjust your dose as needed.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—15 milligrams (mg) once a day in combination with a decreasing dose
