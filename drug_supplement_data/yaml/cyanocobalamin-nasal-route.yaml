title: Cyanocobalamin (nasal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: CaloMist
    - type: paragraph
      text: Nascobal
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cyanocobalamin nasal spray is used to maintain normal vitamin B12 blood
      levels in patients with pernicious anemia who have achieved healthy vitamin
      B12 levels after receiving vitamin B12 shots and do not have nervous system
      problems.
  - type: paragraph
    text: Cyanocobalamin is also used to prevent vitamin B12 deficiency in adults
      who require higher amounts of vitamin B12. It is also used to treat vitamin
      B12 deficiency caused by certain food limitations (eg, strict vegetarians),
      medicines, or malabsorption-related problems. Cyanocobalamin is a man-made form
      of vitamin B12.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Spray
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of cyanocobalamin nasal spray in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of cyanocobalamin nasal spray have not been performed in the geriatric population,
        no geriatric-specific problems have been documented to date.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Chloramphenicol
      - Omeprazole
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergic rhinitis or hay fever (unexplained runny nose or sneezing) or
      - Nasal congestion (stuffy nose) or
      - Upper respiratory tract infection (eg, chills, fever, difficulty breathing)—Cyanocobalamin
        may not be effective when used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Allergy to cobalt—Should not be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Bone marrow problems or
      - Folic acid deficiency or
      - Iron deficiency—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Leber's disease (genetic eye disease)—Use is not recommended in patients with
        this condition.
    - type: list
      ordered: false
      items:
      - Megaloblastic anemia, severe—May increase risk for hypokalemia (low potassium
        level in the blood) or thrombocytosis (excess number of platelets in the blood).
    - type: list
      ordered: false
      items:
      - Polycythemia vera (bone marrow disorder)—Using this medicine may mask or hide
        the signs of polycythemia vera.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed . Do not use more of it, do not use it
      more often, and do not use it for a longer time than your doctor ordered. To
      do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine comes with a patient information leaflet and patient instructions.
      Read and follow these instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: This medicine is only used in the nose . Do not get it into your eyes or
      on your skin. If it does get on these areas, rinse it off right away and call
      your doctor.
  - type: paragraph
    text: Some patients may need a test dose of vitamin B12 injection before using
      Nascobal® nasal spray. This is to check if you have an allergic reaction to
      cyanocobalamin.
  - type: paragraph
    text: Carefully follow your doctor's instructions about diet and oral vitamin
      supplements (pills).
  - type: paragraph
    text: If you are using this medicine to treat pernicious anemia , you will need
      to use the medicine for the rest of your life.
  - type: paragraph
    text: Do not drink hot liquids or eat a hot meal for at least 1 hour before or
      1 hour after using this medicine.
  - type: paragraph
    text: This medicine contains only 1 spray. Use each nasal spray device only one
      time. You do not need to prime the device before using it.
  - type: paragraph
    text: 'To use the nasal spray :'
  - type: list
    ordered: false
    items:
    - Gently blow your nose to clear the nostrils before you use this medicine.
    - Hold the nasal spray device with your thumb on the bottom and your pointer finger
      and middle finger on either side of the nozzle.
    - Close 1 nostril with your other index finger, then insert the nozzle into the
      open nostril about half an inch or as far as it feels comfortable. Tilt your
      head slightly forward.
    - Breathe in gently through your nose, close your mouth, and at the same time
      press the plunger firmly upwards with your thumb.
    - Remove the nozzle from your nostril. At the same time, keep your head straight
      for 10 to 20 seconds while gently breathing in through your nose and breathing
      out through your mouth.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For nasal dosage form (spray): For pernicious anemia and vitamin B12 deficiency:
        Adults—One spray into one nostril once a week. Each spray contains 500 micrograms
        (mcg). Your doctor may adjust your dose as needed. Children—Dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For pernicious anemia and vitamin B12 deficiency: Adults—One spray into one
        nostril once a week. Each spray contains 500 micrograms (mcg). Your doctor
        may adjust your dose as needed. Children—Dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—One spray into one nostril once a week. Each spray contains 500 micrograms
        (mcg). Your doctor may adjust your dose as needed.
      - Children—Dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: This medicine needs to be given on a fixed schedule. If you miss a dose
        or forget to use your medicine, call your doctor or pharmacist for instructions.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the medicine in its original container until you are ready to use
        it.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly. Blood
      and other laboratory tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not use folic acid in place of cyanocobalamin to treat your condition.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever
      - chills
      - cough
      - hoarseness
      - lower back or side pain
      - painful or difficult urination
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Runny nose
      - sneezing
      - sore throat
      - stuffy nose
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - headache
      - lack or loss of strength
      - nausea
      - redness, swelling, or soreness of the tongue
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
