title: Clonidine (epidural route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Duraclon
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Clonidine injection is used with injected pain medicine to treat pain in
      cancer patients.
  - type: paragraph
    text: Clonidine is to be started under the immediate supervision of your doctor.
      After your doctor has seen how you respond to clonidine, you may be able to
      receive this medicine at home.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of clonidine in
        children with use in other age groups, this medicine is not expected to cause
        different side effects or problems in children than it does in adults. This
        medicine is usually used in children only when the pain is severe and other
        pain medicines did not help.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of clonidine in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
      - Phenelzine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acebutolol
      - Amineptine
      - Amitriptyline
      - Amitriptylinoxide
      - Amlodipine
      - Amoxapine
      - Amphetamine
      - Aranidipine
      - Atenolol
      - Bepridil
      - Betaxolol
      - Bevantolol
      - Bisoprolol
      - Carteolol
      - Carvedilol
      - Celiprolol
      - Ceritinib
      - Cilnidipine
      - Clevidipine
      - Clomipramine
      - Crizotinib
      - Desipramine
      - Dextroamphetamine
      - Dibenzepin
      - Digoxin
      - Dilevalol
      - Diltiazem
      - Dothiepin
      - Doxepin
      - Esmolol
      - Felodipine
      - Imipramine
      - Iobenguane I 131
      - Isradipine
      - Labetalol
      - Landiolol
      - Lercanidipine
      - Levobunolol
      - Lisdexamfetamine
      - Lofepramine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Cyclosporine
      - Fluphenazine
      - Mepivacaine
      - Naloxone
      - Yohimbine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anticoagulant therapy or
      - Bleeding problems—Bleeding into the area around the spinal cord is possible
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease—Clonidine may make these conditions worse
    - type: list
      ordered: false
      items:
      - Infection at the place of injection or catheter (tube)—The risk of developing
        meningitis or an abscess is increased
    - type: list
      ordered: false
      items:
      - Kidney disease—Effects of clonidine may be increased because of slower removal
        of clonidine from the body
    - type: list
      ordered: false
      items:
      - Pain associated with surgery or
      - Pain during or following childbirth—The ability to tolerate some of the potential
        side effects of clonidine may be decreased
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Clonidine is given continuously as an epidural infusion (run around the
      spinal cord) using an infusion pump. The pump and its tube should be checked
      regularly to make sure the clonidine flow has not stopped accidentally. The
      injection or catheter site should also be checked regularly for signs of infection.
  - type: paragraph
    text: If you are using this medicine at home, make sure you understand exactly
      how to use it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: For pain: Adults—30 mcg per hour given as a continuous
        infusion. Children—Dosage is based on body weight and must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - 'For pain: Adults—30 mcg per hour given as a continuous infusion. Children—Dosage
        is based on body weight and must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—30 mcg per hour given as a continuous infusion.
      - Children—Dosage is based on body weight and must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    - type: paragraph
      text: Tell your doctor immediately if you think the clonidine has stopped for
        any reason.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: This medicine should not be stopped without the doctor's supervision. Serious
      side effects may occur if clonidine is stopped suddenly.
  - type: paragraph
    text: This medicine may add to the effects of alcohol and other CNS depressants
      (medicine that may make you drowsy or less alert). Check with your doctor before
      taking any such depressants while you are using this medicine.
  - type: paragraph
    text: Dizziness, light-headedness, or fainting may occur, especially when you
      get up from a lying or sitting position. Getting up slowly may help.
  - type: paragraph
    text: This medicine may cause some people to become drowsy or less alert than
      they are normally. Make sure you know how you react to this medicine before
      you drive, use machines, or do other jobs that require you to be alert.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness, light-headedness, or fainting
      - slow heartbeat
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - extremely shallow or slow breathing
      - fast heartbeat
      - fever
      - hallucinations (seeing, feeling, or hearing things that are not there)
      - mental depression
      - sleepiness (excessive)
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - confusion
      - dry mouth
      - nausea
      - sleepiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - ringing, buzzing, or other unexplained noises in the ears
      - sweating, unusual
      - weakness
    - type: paragraph
      text: 'After you stop using this medicine, it may still produce some side effects
        that need attention. During this period of time, check with your doctor immediately
        if you notice the following side effects:'
    - type: list
      ordered: false
      items:
      - Agitation
      - headache
      - nervousness
      - pounding heartbeat
      - shaking or trembling
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
