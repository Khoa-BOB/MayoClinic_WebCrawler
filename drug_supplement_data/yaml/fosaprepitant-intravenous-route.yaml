title: Fosaprepitant (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Emend
    - type: paragraph
      text: Fosinvez
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fosaprepitant injection is used with other medicines to prevent nausea and
      vomiting caused by cancer treatment (chemotherapy). It acts in the brain to
      prevent nausea.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of fosaprepitant injection in children younger than 6 months
        of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of fosaprepitant injection in the
        elderly. However, elderly patients are more likely to have liver, kidney,
        or heart problems, which may require caution in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Flibanserin
      - Levoketoconazole
      - Lomitapide
      - Pimozide
      - Ranolazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adagrasib
      - Alfentanil
      - Alprazolam
      - Amiodarone
      - Amprenavir
      - Apalutamide
      - Atazanavir
      - Avacopan
      - Bedaquiline
      - Benzhydrocodone
      - Boceprevir
      - Budesonide
      - Buprenorphine
      - Carbamazepine
      - Ceritinib
      - Cilostazol
      - Cimetidine
      - Ciprofloxacin
      - Clarithromycin
      - Clofazimine
      - Clozapine
      - Cobicistat
      - Cobimetinib
      - Codeine
      - Colchicine
      - Conivaptan
      - Crizotinib
      - Cyclosporine
      - Dabrafenib
      - Darunavir
      - Desogestrel
      - Diazepam
      - Dienogest
      - Dihydrocodeine
      - Diltiazem
      - Docetaxel
      - Domperidone
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Dronedarone
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Dexamethasone
      - Methylprednisolone
      - Midazolam
      - Quetiapine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins. The medicine must be given slowly, so the needle will have to remain
      for 30 minutes in adults, 30 minutes in children 12 to 17 years of age, and
      60 minutes in children 6 months to 12 years of age.
  - type: paragraph
    text: This medicine is usually given on the first day of your chemotherapy along
      with other medicines (eg, dexamethasone, ondansetron) about 30 minutes before
      the start of treatment. Your child may receive this medicine on Days 1, 2, and
      3 of chemotherapy. Your child may also receive Emend® or aprepitant capsules
      or oral liquid instead of Emend® or Focinvez® injection on Days 2 and 3 of chemotherapy.
      Fosaprepitant is not for long-term use, but you may need to use this medicine
      again if you have more chemotherapy in the future.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions carefully. Ask your doctor if you have concerns.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: You should not receive fosaprepitant if you are also using pimozide (Orap®).
      Using these medicines together may cause serious unwanted effects .
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Tell
      your doctor or nurse right away if you have itching, hives, a rash, trouble
      breathing, trouble swallowing, warmth or redness in your face, neck, arms, or
      upper chest, or any swelling of your hands, face, or mouth while you are receiving
      this medicine.
  - type: paragraph
    text: This medicine may cause infusion-related reactions, which can be life-threatening
      and require immediate medical attention. Tell your doctor right away if you
      start to have a fever, chills or shaking, dizziness, trouble breathing, itching
      or rash, lightheadedness or fainting after receiving this medicine.
  - type: paragraph
    text: If you are also using a blood thinner called warfarin (Coumadin®, Jantoven®),
      your doctor will need to check your blood after receiving this medicine.
  - type: paragraph
    text: Birth control pills may not work as well while you are receiving fosaprepitant.
      To keep from getting pregnant, use another form of birth control together with
      your pills during treatment and for 1 month after your last dose. Other forms
      include condoms, spermicides, a diaphragm, and contraceptive foam or jelly.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blurred vision
      - chest tightness
      - chills
      - confusion
      - cough
      - decreased urination
      - difficult or labored breathing
      - dizziness
      - dry mouth
      - fainting
      - fever
      - increase in heart rate
      - lightheadedness
      - lower back or side pain
      - nervousness
      - pain, swelling, or redness at the injection site
      - painful or difficult urination
      - pale skin
      - pounding in the ears
      - rapid breathing
      - slow or fast heartbeat
      - sore throat
      - sunken eyes
      - tenderness, swelling, warmth, or skin discoloration at the injection site
      - thirst
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - wrinkled skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hard lump at the injection site
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blood in the urine
      - changes in patterns and rhythms of speech
      - changes in skin color
      - chest pain or discomfort
      - fast, slow, irregular, pounding, or racing heartbeat or pulse
      - general feeling of discomfort or illness
      - headache
      - increased sweating
      - increased thirst
      - lightheadedness, dizziness, or fainting
      - loss of consciousness
      - muscle pain or cramps
      - nausea
      - pain, tenderness, or swelling of the foot or leg
      - seizures
      - slurred speech
      - swelling
      - swelling of the face, ankles, or hands
      - trouble with speaking
      - trouble breathing
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - difficulty with swallowing
      - hives or welts, itching
      - joint pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - redness of the skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - continuing ringing or buzzing or other unexplained noise in ears
      - difficulty having a bowel movement
      - dizziness
      - feeling of indigestion
      - hair loss or thinning of the hair
      - hearing loss
      - hiccups
      - indigestion
      - lack or loss of strength
      - loss of appetite
      - pain in the chest below the breastbone
      - stomach discomfort, upset, or pain
      - swelling or inflammation of the mouth
      - weight loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Feeling of warmth
      - pain or discomfort in chest, upper stomach, or throat
      - redness of the face, neck, arms, and occasionally, upper chest
      - sudden sweating
      - unusually warm skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal dreams
      - blemishes on the skin
      - bumps on the skin
      - burning, dry, or itching eyes
      - change in taste
      - change in walking and balance
      - clumsiness or unsteadiness
      - confusion about identity, place, and time
      - difficulty with moving
      - discharge, excessive tearing
      - excess air or gas in the stomach
      - extreme thirst
      - false or unusual sense of well-being
      - flushed, dry skin
      - frequent urination
      - fruit-like breath odor
      - full feeling
      - heartburn
      - increased hunger
      - increased sensitivity of the skin to sunlight
      - increased urination
      - increased volume of pale, dilute urine
      - muscle ache, cramp, stiffness, or weakness
      - oily skin
      - passing gas
      - pimples
      - redness or other discoloration of the skin
      - redness, pain, or swelling of the eye, eyelid, or inner lining of the eyelid
      - severe constipation
      - severe sunburn
      - sleepiness
      - stomach distension
      - sweating
      - swollen joints
      - trouble performing routine tasks
      - trouble sleeping
      - unexplained weight loss
      - unusual drowsiness, dullness, or feeling of sluggishness
      - weight gain
      - white patches with diaper rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
