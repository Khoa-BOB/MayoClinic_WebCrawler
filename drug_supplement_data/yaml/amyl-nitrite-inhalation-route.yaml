title: Amyl nitrite (inhalation route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Amyl nitrite is related to the nitrate medicines and is used by inhalation
      to relieve the pain of angina attacks. It works by relaxing blood vessels and
      increasing the supply of blood and oxygen to the heart while reducing its workload.
  - type: paragraph
    text: Amyl nitrite may also be used for other conditions as determined by your
      doctor.
  - type: paragraph
    text: This medicine comes in a glass capsule covered by a protective cloth. The
      cloth covering allows you to crush the glass capsule between your fingers without
      cutting yourself.
  - type: paragraph
    text: On the street, this medicine and others like it are sometimes called "poppers."
      They have been used by some people to cause a "high" or to improve sex. Use
      in this way is not recommended. Amyl nitrite can cause serious harmful effects
      if too much is inhaled.
  - type: paragraph
    text: Amyl nitrite is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients and there
        is no specific information comparing use of amyl nitrite in children with
        use in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Dizziness or lightheadedness may be more likely to occur in the elderly,
        who are usually more sensitive to the effects of amyl nitrite.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Avanafil
      - Riociguat
      - Sildenafil
      - Tadalafil
      - Vardenafil
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Articaine
      - Lidocaine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia (severe)
    - type: list
      ordered: false
      items:
      - Glaucoma—Amyl nitrite may make this condition worse
    - type: list
      ordered: false
      items:
      - Overactive thyroid
    - type: list
      ordered: false
      items:
      - Recent stroke, heart attack, or head injury
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: 'To use amyl nitrite:'
  - type: list
    ordered: false
    items:
    - When you begin to feel an attack of angina starting (chest pains or a tightness
      or squeezing in the chest), sit down. Then crush the cloth-covered glass capsule
      containing amyl nitrite between your finger and thumb. Pass it back and forth
      close to your nose and inhale the vapor several (1 to 6) times. Since you may
      become dizzy, lightheaded, or faint soon after using amyl nitrite, it is best
      to sit or lie down rather than stand while the medicine is working. If you become
      dizzy or faint while sitting, take several deep breaths of air and either bend
      forward with your head between your knees or lie down with your feet elevated.
    - Remain calm and you should feel better in a few minutes.
  - type: paragraph
    text: Use this medicine exactly as directed by your doctor , and do not use more
      than your doctor ordered. Using too much amyl nitrite may cause a dangerous
      overdose. If the medicine does not seem to be working as well after you have
      used it for a while, check with your doctor. Do not increase the dose on your
      own.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For inhalation dosage form: Adults: 0.3 milliliter (1 ampul) taken by inhaling
        the vapor of amyl nitrite through the nose. Dose may be repeated within 1
        to 5 minutes if pain is not relieved. If you still have chest pain after a
        total of 2 doses in a 10-minute period, contact your doctor or have someone
        take you to a hospital emergency room without delay.'
    - type: list
      ordered: false
      items:
      - 'Adults: 0.3 milliliter (1 ampul) taken by inhaling the vapor of amyl nitrite
        through the nose. Dose may be repeated within 1 to 5 minutes if pain is not
        relieved. If you still have chest pain after a total of 2 doses in a 10-minute
        period, contact your doctor or have someone take you to a hospital emergency
        room without delay.'
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Do not take sildenafil (e.g., Viagra) if you are taking this medicine. When
      sildenafil is taken with amyl nitrite, the combination can lower blood pressure
      and cause dizziness, lightheadedness, or fainting. In some cases, sildenafil
      taken with the related nitrates has caused death.
  - type: paragraph
    text: Amyl nitrite is extremely flammable. Keep it away from heat or any open
      flame, especially when crushing the capsule. Amyl nitrite can catch fire very
      easily and cause serious burns.
  - type: paragraph
    text: Dizziness or lightheadedness may occur, especially when you get up from
      a lying or sitting position. Getting up slowly may help, but if the problem
      continues or gets worse, check with your doctor.
  - type: paragraph
    text: Drinking alcohol while you are taking this medicine may make the dizziness
      or lightheadedness worse and may cause a serious drop in blood pressure. Check
      with your doctor before drinking alcoholic beverages.
  - type: paragraph
    text: After using a dose of amyl nitrite, you may get a mild headache that lasts
      for a short time. This is a common side effect and is no cause for alarm. However,
      if this effect continues, or if the headaches are severe, check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin rash
      - unusual tiredness or weakness
    subsections: []
  - heading: Signs and symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish-colored lips, fingernails, or palms of hands
      - dizziness (extreme) or fainting
      - feeling of extreme pressure in head
      - shortness of breath
      - unusual tiredness or weakness
      - weak and fast heartbeat
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness or lightheadedness, especially when getting up from a lying or sitting
        position
      - fast pulse
      - flushing of face and neck
      - headache (mild)
      - nausea or vomiting
      - restlessness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
