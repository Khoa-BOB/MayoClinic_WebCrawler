- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Pilocarpine is used to treat glaucoma and other eye conditions. Vuity® eye
      drops and Qlosi™ eye drops are used to treat presbyopia (age-related eye or
      vision problem).
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Vuity® eye drops and Qlosi™ eye drops are not indicated for use in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of pilocarpine
        eye drops have not been performed in the geriatric population. However, geriatric-specific
        problems that would limit the usefulness of this medicine in the elderly are
        not expected.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Tegafur
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma or
      - Eye disease (eg, retinal problems)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Iritis (swelling of the colored part of the eye)—Use is not recommended in
        patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use it for a longer time than your doctor
      ordered. To do so may increase the chance of too much medicine being absorbed
      into the body and the chance of side effects.
  - type: paragraph
    text: 'To use the eye drops:'
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and water before and after using this medicine.
    - Tilt your head back and, pressing your finger gently on the skin just beneath
      the lower eyelid, pull the eyelid away from the eye to make a space. Drop the
      medicine into this space.
    - Let go of the eyelid and gently close the eye. Do not blink. Keep the eye closed
      for 1 or 2 minutes to allow the medicine to be absorbed by the eye.
    - If you think you did not get the drop of medicine into your eye properly, repeat
      the process with another drop.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
      Serious damage to the eye and possible loss of vision may result from using
      contaminated eye medicines.
  - type: paragraph
    text: 'To use the eye gel:'
  - type: list
    ordered: false
    items:
    - First, wash your hands. Tilt the head back and, pressing your finger gently
      on the skin just beneath the lower eyelid, pull the lower eyelid away from the
      eye to make a space. Squeeze a thin strip of gel into this space. A 1½-cm (approximately
      ½-inch) strip of gel is usually enough, unless you have been told by your doctor
      to use a different amount. Let go of the eyelid and gently close the eyes. Keep
      the eyes closed for 1 or 2 minutes to allow the medicine to be absorbed by the
      eye.
    - Immediately after using the eye gel, wash your hands to remove any medicine
      that may be on them.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). After using the eye gel, wipe the tip of
      the gel tube with a clean tissue and keep the tube tightly closed.
  - type: paragraph
    text: 'To use the eye insert:'
  - type: list
    ordered: false
    items:
    - This medicine usually comes with patient directions. Read them carefully before
      using this medicine.
    - If you think this medicine unit may be damaged, do not use it. If you have any
      questions about this, check with your health care professional.
    - If the unit seems to be releasing too much medicine into your eye, remove it
      and replace with a new unit. If you have any questions about this, check with
      your doctor.
  - type: paragraph
    text: If you wear contact lenses, take them out before you use this medicine.
      Wait at least 10 minutes before you put your contact lenses back in.
  - type: paragraph
    text: If you are using more than one eye product, apply these medicines at least
      5 minutes apart.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic dosage form (eye drops): For chronic glaucoma: Adults and
        children—Instill one drop 1 to 4 times a day. For acute angle-closure glaucoma:
        Adults and children—Instill one drop every 5 to 10 minutes for three to six
        doses. Then one drop every one to three hours until eye pressure is reduced.
        For presbyopia: Adults— Qlosi™: Instill one drop in each eye. You may instill
        another drop in each eye 2 to 3 hours after the first dose. This medicine
        can be used every day, up to 2 times each day. Vuity®: Instill one drop in
        each eye once a day. You may instill another drop in each eye 3 to 6 hours
        after the first dose. Children—Use is not recommended.'
      - 'For ophthalmic dosage form (eye gel): For glaucoma: Adults and teenagers—Use
        once a day at bedtime. Children—Use and dose must be determined by your doctor.'
      - 'For ophthalmic dosage form (eye insert): For glaucoma: Adults and children—Insert
        one ocular system every seven days. Infants—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For chronic glaucoma: Adults and children—Instill one drop 1 to 4 times a
        day.'
      - 'For acute angle-closure glaucoma: Adults and children—Instill one drop every
        5 to 10 minutes for three to six doses. Then one drop every one to three hours
        until eye pressure is reduced.'
      - 'For presbyopia: Adults— Qlosi™: Instill one drop in each eye. You may instill
        another drop in each eye 2 to 3 hours after the first dose. This medicine
        can be used every day, up to 2 times each day. Vuity®: Instill one drop in
        each eye once a day. You may instill another drop in each eye 3 to 6 hours
        after the first dose. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children—Instill one drop 1 to 4 times a day.
    - type: list
      ordered: false
      items:
      - Adults and children—Instill one drop every 5 to 10 minutes for three to six
