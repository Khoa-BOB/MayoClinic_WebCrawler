    - type: list
      ordered: false
      items:
      - 'For glaucoma: Adults and teenagers—Use once a day at bedtime. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—Use once a day at bedtime.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For glaucoma: Adults and children—Insert one ocular system every seven days.
        Infants—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children—Insert one ocular system every seven days.
      - Infants—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the Qlosi™ vial in the refrigerator. Once the pouch is open, you
        may store it at room temperature and use within 30 days. Throw away opened
        vials after use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If you will be using this medicine for more than a few weeks, your eye doctor
      will check your eyes at regular visits to make sure it is working properly and
      is not causing unwanted effects.
  - type: paragraph
    text: Serious eye or vision problems (eg, retinal detachment, retinal tear) may
      occur during treatment with this medicine. Check with your doctor right away
      if you are seeing flashes or sparks of light, seeing floating spots before the
      eyes, or a veil or curtain appearing across part of your vision.
  - type: paragraph
    text: 'For patients using the eye drops or eye gel :'
  - type: list
    ordered: false
    items:
    - This medicine may cause blurred vision and may make you have trouble seeing
      at night or in dim light. Do not drive, use machines, or do anything else that
      could be dangerous if you are not able to see clearly.
  - type: paragraph
    text: 'For patients using the eye insert :'
  - type: list
    ordered: false
    items:
    - For the first several hours after you insert this unit in the eye, your vision
      may be blurred or there may be a change in your near or far vision, especially
      at night. Therefore, insert this unit in the eye at bedtime, unless otherwise
      directed by your doctor. If this unit is inserted in the eye at any other time
      of the day, make sure your vision is clear before you drive, use machines, or
      do anything else that could be dangerous if you are not able to see well.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Increased sweating
      - muscle tremors
      - nausea, vomiting, or diarrhea
      - redness of the white part of the eyes or inside of the eyelids
      - trouble breathing
      - watering of mouth
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - eye irritation or pain
      - watering of the eyes
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - fast heartbeat
      - fever
      - hives, itching, skin rash
      - irritation
      - joint pain, stiffness, or swelling
      - redness of the skin
      - seeing flashes or sparks of light
      - seeing floating spots before the eyes, or a veil or curtain appearing across
        part of vision
      - swelling of the eyelids, face, lips, hands, or feet
      - trouble breathing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decrease in night vision
      - headache
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
