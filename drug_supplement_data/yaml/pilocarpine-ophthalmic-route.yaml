      items:
      - 'Adults— Qlosi™: Instill one drop in each eye. You may instill another drop
        in each eye 2 to 3 hours after the first dose. This medicine can be used every
        day, up to 2 times each day. Vuity®: Instill one drop in each eye once a day.
        You may instill another drop in each eye 3 to 6 hours after the first dose.'
      - Children—Use is not recommended.
    - type: list
      ordered: false
      items:
      - 'Qlosi™: Instill one drop in each eye. You may instill another drop in each
        eye 2 to 3 hours after the first dose. This medicine can be used every day,
        up to 2 times each day.'
      - 'Vuity®: Instill one drop in each eye once a day. You may instill another
