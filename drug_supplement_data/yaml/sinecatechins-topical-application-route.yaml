title: Sinecatechins (topical application route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Veregen
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Sinecatechins is used to treat external warts around the genital and rectal
      areas called condylomata acuminata. It is not used to treat warts that occur
      inside the vagina, penis, or rectum .
  - type: paragraph
    text: This medicine is available only with your doctor's prescription .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Ointment
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of sinecatechins in the pediatric population. Safety and efficacy
        have not been established .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Insufficient information is available on the relationship of age to the
        effects of sinecatechins in geriatric patients. It may not be known whether
        they work exactly the same way they do in younger adults or if they cause
        different side effects or problems in older people .
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Inflamed, irritated, or infected skin—Use with caution. This medicine may
        make this condition worse .
    - type: list
      ordered: false
      items:
      - Weakened immune system—It is not known if this medicine is safe to use with
        this condition .
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use the medicine only as directed by your doctor. Do not use more of it,
      do not use it more often, and do not use it longer than directed .
  - type: paragraph
    text: Wash your hands with soap and water before and after using this medicine
      .
  - type: paragraph
    text: This medicine is for use on the skin only. Do not get it inside your eyes,
      nose, mouth, vagina, or anus. Do not use on open wounds or on skin areas that
      have cuts or scrapes. If it does get on these areas, rinse it off right away
      .
  - type: paragraph
    text: Do not use this medicine on moles, birthmarks, or any other warts until
      you discuss it with your doctor .
  - type: paragraph
    text: Women using tampons should insert the tampon first before applying the ointment.
      If the tampon needs to be changed while the ointment is on the skin, avoid getting
      the ointment into the vagina .
  - type: paragraph
    text: Men who are not circumcised and treating genital warts under the foreskin
      should draw back the foreskin and clean the area daily .
  - type: paragraph
    text: Do not wash off the ointment from the treated area before you apply the
      next dose. When you wash the treatment area or bathe, apply the ointment afterwards
      .
  - type: paragraph
    text: Do not cover the treated area with a bandage unless your doctor has told
      you to. You may wear loose-fitting underwear after applying this medicine .
  - type: paragraph
    text: Keep using this medicine until all the warts have cleared up. However, you
      should not use this medicine for longer than 16 weeks .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (ointment): For warts on the genital or rectal areas:
        Adults—Apply a thin layer (about an 0.5 cm strand) to the affected area three
        times a day. Rub it in gently. Children—Use and dose must be determined by
        your doctor .'
    - type: list
      ordered: false
      items:
      - 'For warts on the genital or rectal areas: Adults—Apply a thin layer (about
        an 0.5 cm strand) to the affected area three times a day. Rub it in gently.
        Children—Use and dose must be determined by your doctor .'
    - type: list
      ordered: false
      items:
      - Adults—Apply a thin layer (about an 0.5 cm strand) to the affected area three
        times a day. Rub it in gently.
      - Children—Use and dose must be determined by your doctor .
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: This medicine may make your skin more sensitive to sunlight. Do not expose
      the area being treated with this medicine to sunlight, sunlamps, or tanning
      beds .
  - type: paragraph
    text: Avoid having genital, oral, or anal sex while the medicine is on your skin.
      Make sure you wash the ointment off your skin before you engage in any sexual
      activity. Also, the medicine contains oils that can weaken latex (rubber) condoms,
      or diaphragms causing them not to work properly .
  - type: paragraph
    text: Sinecatechins will not keep you from spreading genital warts to other people.
      Talk with your doctor about safe sex practices .
  - type: paragraph
    text: This medicine is not a cure for genital or anal warts. You may still develop
      new warts during or after your treatment .
  - type: paragraph
    text: This medicine may stain your clothes and bedding .
  - type: paragraph
    text: Do not use cosmetics or any other skin care products on the same skin area
      on which you use this medicine, unless directed otherwise by your doctor .
  - type: paragraph
    text: If your condition does not improve within 16 weeks, or if it becomes worse,
      check with your doctor .
  - type: paragraph
    text: Many patients experience redness, swelling, sores or blisters, burning,
      or itching after using this medicine. If you experience a severe skin reaction,
      remove the ointment by washing the area with mild soap and water and contact
      your doctor right away .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - breakdown of skin
      - burning of skin
      - cracking of skin
      - flushing, redness of skin
      - hardening or thickening of skin
      - irritation of skin
      - itching skin
      - pain or discomfort in skin
      - swelling of skin
      - unusually warm skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding of skin
      - blood in urine
      - break in the skin, especially associated with blue-black discoloration, swelling,
        or drainage of fluid
      - burning or itching around anus
      - changes in skin coloring
      - discharge from skin
      - dryness of skin
      - increased frequency of urination
      - increased sensitivity to pain
      - increased sensitivity to touch
      - pain or burning during urination
      - peeling of one area of skin
      - pelvic pain
      - problems with foreskin of penis
      - rash with flat lesions or small raised lesions on the skin
      - scarring of skin
      - skin rash, encrusted, scaly and oozing
      - skin rash on the face
      - swollen, painful, or tender lymph glands in neck, armpit, or groin
      - tingling in the hands and feet
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
