title: Pozelimab-bbfg (intravenous route, subcutaneous route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Pozelimab-bbfg injection is used to treat a type of disease called CD55-deficient
      protein-losing enteropathy (PLE), also known as CHAPLE disease. This medicine
      is a monoclonal antibody that works on the immune system.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of pozelimab-bbfg injection in children younger than 1 year
        of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of pozelimab-bbfg injection in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Immune Globulin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Infection (eg, gonorrhea, influenza, pneumonia)—Use with caution. This medicine
        may decrease your body’s ability to fight infection.
    - type: list
      ordered: false
      items:
      - Meningococcal infection—Should not be given to patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this medicine in a medical facility. The first dose is given through a needle
      placed in a vein. It must be given slowly, so the needle will have to remain
      in place for at least 1 hour. You will then receive this medicine as a shot
      under your skin, usually in the stomach, thighs, or upper arms once a week starting
      on Day 8 after the first dose.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: Make sure you have received a vaccine to prevent meningococcus infections
      at least 2 weeks before you receive this medicine. You may also be given antibiotic
      medicines to prevent infections if you are to receive this medicine right away.
      If you have already received the meningococcal vaccine in the past, your doctor
      will decide if you need another dose.
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure that this medicine is working properly. Blood
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may increase your chance of having serious infections, including
      a meningococcal infection. Avoid people who are sick or have infections. Tell
      your doctor right away if you or your child develop headaches, nausea, vomiting,
      fever, a stiff neck or back, rash, confusion, muscle aches, or if your eyes
      have become sensitive to light.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Check
      with your doctor right away if you have chest tightness, cough, difficulty swallowing,
      dizziness, fast heartbeat, hives, itching, skin rash, puffiness or swelling
      of the eyelids or around the eyes, face, lips, or tongue, trouble breathing,
      or unusual tiredness or weakness.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blood in the urine
      - body aches or pain
      - chills
      - confusion
      - cough
      - drowsiness
      - ear congestion
      - fever
      - headache
      - loss of voice
      - muscle tremors
      - nausea
      - pain or swelling in the arms or legs without any injury
      - restlessness
      - sneezing
      - sore throat
      - stomach cramps
      - stuffy or runny nose
      - trouble breathing
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - cloudy urine
      - difficulty swallowing
      - fast heartbeat
      - general feeling of illness
      - hives, itching, skin rash
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - stiff neck or back
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - loss or thinning of the hair
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of skin, feeling of
        pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
