title: Influenza virus vaccine, adjuvanted (intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Fluad
    - type: paragraph
      text: Fluad 2017-2018 Formula
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Influenza virus vaccine, adjuvanted is used to prevent an infection caused
      by influenza virus subtypes A and types B in elderly patients 65 years of age
      and older. The vaccine works by causing your body to produce its own protection
      (antibodies) against the disease.
  - type: paragraph
    text: This vaccine is to be given only by or under the supervision of your doctor
      or other health care professional.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Emulsion
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of influenza virus vaccine, adjuvanted in children younger
        than 6 months of age or older than 72 months (6 years) of age. Safety and
        efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of influenza virus vaccine, adjuvanted
        in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to egg proteins, history of—Should not be used in patients with this
        condition.
    - type: list
      ordered: false
      items:
      - Guillain-Barré syndrome (severe nerve and muscle problem), history of—Use
        with caution. May cause the symptoms of this condition to return.
    - type: list
      ordered: false
      items:
      - Immune system problems—May not work as well in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this vaccine.
      This vaccine is given as a shot into one of your muscles, usually in the upper
      arm.
  - type: paragraph
    text: You need to get the flu vaccine every year to protect you from the flu.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Be sure to notify your doctor of any side effects that occur after you receive
      this vaccine.
  - type: paragraph
    text: This vaccine may cause a serious allergic reaction, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you have a rash, itching, a fast heartbeat, trouble
      breathing or swallowing, or any swelling of your hands, face, or mouth after
      receiving the vaccine.
  - type: paragraph
    text: This vaccine may not protect everyone who receives it. The vaccine will
      not treat flu symptoms if you already have the virus.
  - type: paragraph
    text: Fainting may occur after you receive this vaccine. You may need to be monitored
      for a short period of time after you get the injection.
  - type: paragraph
    text: Tell your doctor if you are using a medicine or treatment that weakens your
      immune system, such as a steroid, radiation, or cancer treatment. This vaccine
      may not work as well if you are also using these medicines. However, your doctor
      may still want you to get the vaccine because it can give you some protection.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - joint or muscle pain
      - pain at the injection site
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever or chills
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm or leg pain
      - black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chest tightness
      - cough
      - difficulty swallowing
      - dizziness
      - fainting
      - fast heartbeat
      - general feeling of discomfort or illness
      - hives, itching, or rash
      - inability to move the arms and legs
      - increase or decrease in urination
      - lack or loss of strength
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - nerve pain
      - numbness or tingling of the hands, feet, or face
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - seizures
      - sudden numbness and weakness in the arms and legs
      - swelling of feet or lower legs
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain at the injection site
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - loss of appetite
      - nausea or vomiting
      - redness or swelling at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
