title: Aztreonam (intravenous route, injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Azactam
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Aztreonam is an antibiotic that is used to treat infections caused by bacteria.
      It works by killing bacteria or preventing their growth.
  - type: paragraph
    text: Aztreonam is used to treat bacterial infections in many different parts
      of the body. It is sometimes given with other antibiotics. This medicine will
      not work for colds, flu, or other viral infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies have been done in children and have shown that aztreonam is effective
        in treating certain bacterial infections and that side effects in children
        are similar to those experienced by adults. Elevations of liver enzymes and
        reductions in white blood cell counts were seen in children who were given
        high doses of this medicine or who had more serious infections.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Aztreonam has been tested in a limited number of patients 65 years of
        age or older and has not been shown to cause different side effects or problems
        in older people than it does in younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Bupropion
      - Cholera Vaccine, Live
      - Clomipramine
      - Gemfibrozil
      - Hydroxychloroquine
      - Nitisinone
      - Probenecid
      - Teriflunomide
      - Vadadustat
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Liver disease—Patients receiving high doses of aztreonam for a long time,
        who also have severe liver disease, may have an increased chance of side effects
    - type: list
      ordered: false
      items:
      - Kidney disease—Patients with kidney disease may have an increased chance of
        side effects
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: To help clear up your infection completely, aztreonam must be given for
      the full time of treatment, even if you begin to feel better after a few days.
      Also, this medicine works best when there is a constant amount in the blood
      or urine. To help keep the amount constant, aztreonam must be given on a regular
      schedule.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: Adults and children 16 years of age and older:
        1 to 2 grams injected slowly into a vein over a twenty- to sixty-minute period.
        This is repeated every six to twelve hours. Children up to 16 years of age:
        Dosage is based on body weight and must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults and children 16 years of age and older: 1 to 2 grams injected slowly
        into a vein over a twenty- to sixty-minute period. This is repeated every
        six to twelve hours.'
      - 'Children up to 16 years of age: Dosage is based on body weight and must be
        determined by your doctor.'
    subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blood in urine or stools
      - burning or itching of vagina
      - chest pain
      - chills
      - confusion
      - convulsions (seizures)
      - cough
      - dark urine
      - diarrhea
      - difficulty in breathing
      - discharge from vagina
      - discomfort, inflammation, or swelling at the injection site
      - dizziness
      - eye pain
      - fever
      - flu-like symptoms
      - general feeling of illness
      - headache
      - hives
      - light gray-colored stools
      - loss of appetite
      - numbness of tongue
      - pinpoint red spots on skin
      - seeing double
      - skin rash, redness, or itching
      - sore throat
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - yellow skin or eyes
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps
      - altered sense of taste
      - bad breath
      - breast tenderness
      - burning or prickling feeling of skin
      - flushing
      - increased sweating
      - mouth ulcers
      - muscular aches
      - nasal congestion
      - nausea or vomiting
      - ringing, buzzing, or noise in ear
      - small, nonraised, round, purplish or red spots on skin
      - sneezing
      - trouble in sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
