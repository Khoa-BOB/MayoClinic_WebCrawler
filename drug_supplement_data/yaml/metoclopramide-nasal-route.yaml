        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Didanosine
      - Mivacurium
      - Succinylcholine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma, history of or
      - Breast cancer, prolactin-dependent or
      - Cirrhosis (liver disease) or
      - Congestive heart failure or
      - Depression or history of or
      - Diabetes or
      - Heart rhythm problems (eg, arrhythmia) or
      - Hypertension (high blood pressure) or
      - Neuroleptic malignant syndrome, history of or
      - Parkinson's disease—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - CYP2D6 poor metabolizers or
      - Kidney disease, moderate or severe or
      - Liver disease, moderate or severe—Use is not recommended in patients with
        these conditions.
    - type: list
      ordered: false
      items:
      - G6PD deficiency (an enzyme problem) or
      - NADH cytochrome reductase deficiency (an enzyme problem)—May increase the
        risk for blood problems (eg, methemoglobinemia, sulfhemoglobinemia, hemolytic
        anemia).
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Pheochromocytoma (adrenal gland tumor) or
      - Seizures or epilepsy or
      - Stomach or bowel problems (eg, bleeding, blockage, perforation) or
      - Tardive dyskinesia, history of—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine should come with a Medication Guide and patient instructions.
      Read and follow the instructions carefully. Ask your doctor if you have questions.
  - type: paragraph
    text: Take this medicine at least 30 minutes before each meal and at bedtime.
  - type: paragraph
    text: This medicine is for use only in the nose. Do not get any of it in your
      eyes or on your skin. If it does get on these areas, rinse it off right away.
  - type: paragraph
    text: 'To use the spray bottle:'
  - type: list
    ordered: false
    items:
    - Prime the nasal spray bottle before using it for the first time or if it has
      been 2 weeks since you last used it.
    - To prime, place your index and middle finger on each side of the finger flange
      and your thumb on the bottom of the bottle. Turning the nozzle away from your
      face, press down on the flange 10 times until a spray appears. Do not spray
      into your eyes.
    - Insert the nozzle tip under one of your nostrils, then tilt your head slightly
      forward so the nozzle tip is aimed away from the center of your nose.
    - Close the other nostril with your other index finger and press down firmly on
      the flange until it stops moving to deliver a full dose.
    - Release the flange and breathe in gently through the open nostril.
    - Remove the nozzle tip and breathe out slowly through your mouth.
    - After using the nasal spray, wipe the tip of the nozzle with a clean tissue
      and put the cap back on.
    - If the nozzle becomes clogged, pull it up from the bottle and soak it in warm
      water. Do not insert a pin or other sharp object to unblock the nozzle. Dry
      the nozzle at room temperature then place it back on the bottle.
  - type: paragraph
    text: Do not use this medicine for longer than 8 weeks . If you are taking any
      other medicine containing metoclopramide, do not use it for longer than 12 weeks
      .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For nasal dosage form (spray): For diabetic gastroparesis: Adults less than
        65 years of age—1 spray in one nostril 4 times a day for 2 to 8 weeks. Each
        spray contains 15 milligrams (mg) of metoclopramide. Adults 65 years of age
        and older and children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For diabetic gastroparesis: Adults less than 65 years of age—1 spray in one
        nostril 4 times a day for 2 to 8 weeks. Each spray contains 15 milligrams
        (mg) of metoclopramide. Adults 65 years of age and older and children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults less than 65 years of age—1 spray in one nostril 4 times a day for
        2 to 8 weeks. Each spray contains 15 milligrams (mg) of metoclopramide.
      - Adults 65 years of age and older and children—Use and dose must be determined
        by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you are unsure that the spray entered the nose, do not repeat the dose.
        Take the next dose at the scheduled time.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away any unused medicine 4 weeks after opening the bottle.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause tardive dyskinesia (a movement disorder). Check
      with your doctor right away if you have lip smacking or puckering, puffing of
      the cheeks, rapid or worm-like movements of the tongue, uncontrolled chewing
      movements, or uncontrolled movements of the arms and legs. The risk of tardive
      dyskinesia is higher if you use this medicine for longer than 8 weeks or if
      you take other medicines containing metoclopramide for more than 12 weeks. Treatment
      for longer than 12 weeks should be avoided in all but rare cases.
  - type: paragraph
    text: Tell your doctor right away if you have inability to move the eyes, increased
      blinking or spasms of the eyelid, trouble with breathing, speaking, or swallowing,
      uncontrolled tongue movements, uncontrolled twisting movements of the neck,
      trunk, arms, or legs, unusual facial expressions, or weakness of the arms and
      legs.
  - type: paragraph
    text: Check with your doctor right away if you have seizures, difficulty with
      breathing, fast heartbeat, high fever, high or low blood pressure, increased
      sweating, loss of bladder control, severe muscle stiffness, unusually pale skin,
      or tiredness. These could be symptoms of a serious condition called neuroleptic
      malignant syndrome (NMS).
  - type: paragraph
    text: Metoclopramide may cause some people to be agitated, irritable, or display
      other abnormal behaviors. It may also cause some people to have suicidal thoughts
      and tendencies or to become more depressed. Also tell your doctor if you have
      sudden or strong feelings, such as feeling nervous, angry, restless, violent,
      or scared. If you or your caregiver notice any of these side effects, tell your
      doctor right away.
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. You might need to measure
      your blood pressure at home. If you think your blood pressure is too high, call
      your doctor right away.
  - type: paragraph
    text: This medicine may increases your risk of having fluid retention (swelling)
      and volume overload, especially if you have cirrhosis (liver disease) or heart
      failure. Check with your doctor right away if you have a decrease in the amount
      of urine, noisy, rattling breathing, swelling of the fingers, hands, feet, or
      lower legs, trouble breathing at rest, or weight gain.
  - type: paragraph
    text: This medicine may increase prolactin blood levels if used for a long time.
      Check with your doctor if you have breast swelling or soreness, unusual breast
      milk production, absent, missed, or irregular menstrual periods, stopping of
      menstrual bleeding, loss in sexual ability, desire, drive, or performance, decreased
      interest in sexual intercourse, or an inability to have or keep an erection.
  - type: paragraph
    text: Check with your doctor before using this medicine with alcohol or other
      medicines that affect the central nervous system (CNS) . The use of alcohol
      or other medicines that affect the CNS with metoclopramide may worsen the side
      effects of this medicine, such as dizziness, poor concentration, drowsiness,
      unusual dreams, and trouble with sleeping. Some examples of medicines that affect
      the CNS are antihistamines or medicine for allergies or colds, sedatives, tranquilizers,
      or sleeping medicines, medicine for depression, medicine for anxiety, prescription
      pain medicine or narcotics, medicine for attention deficit and hyperactivity
      disorder, medicine for seizures or barbiturates, muscle relaxants, or anesthetics,
      including some dental anesthetics.
  - type: paragraph
    text: This medicine may make you dizzy, drowsy, or have trouble with thinking
      or controlling body movements. Do not drive or do anything else that could be
      dangerous until you know how this medicine affects you .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
