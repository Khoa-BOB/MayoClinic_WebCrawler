    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: 'Vitamin A is stored in the body; therefore, when you take more than the
      body needs, it will build up in the body. This may lead to poisoning and even
      death. Problems are more likely to occur in:'
  - type: list
    ordered: false
    items:
    - Adults taking 7500 RE (25,000 Units) a day for 8 months in a row, or 450,000
      RE (1,500,000 Units) all at once; or
    - Children taking 5400 RE (18,000 Units) to 15,000 RE (50,000 Units) a day for
      several months in a row, or 22,500 RE (75,000 Units) to 105,100 RE (350,000
      Units) all at once.
    - Pregnant women taking more than 1800 RE (6000 Units) a day.
  - type: paragraph
    text: Remember that the total amount of vitamin A you get every day includes what
      you get from foods that you eat and what you take as a supplement.
  - type: paragraph
    text: High doses and/or prolonged use of vitamin A may cause bleeding from the
      gums; dry or sore mouth; or drying, cracking, or peeling of the lips.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  - type: list
    ordered: false
    items:
    - Bleeding from gums or sore mouth
    - bulging soft spot on head (in babies)
    - confusion or unusual excitement
    - diarrhea
    - dizziness or drowsiness
    - double vision
    - headache (severe)
    - irritability (severe)
    - peeling of skin, especially on lips and palms
    - vomiting (severe)
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  - type: list
    ordered: false
    items:
    - Bone or joint pain
    - convulsions (seizures)
    - drying or cracking of skin or lips
    - dry mouth
    - fever
    - general feeling of discomfort or illness or weakness
    - headache
    - increased sensitivity of skin to sunlight
    - increase in frequency of urination, especially at night, or in amount of urine
    - irritability
    - loss of appetite
    - loss of hair
    - stomach pain
    - unusual tiredness
    - vomiting
    - yellow-orange patches on soles of feet, palms of hands, or skin around nose
      and lips
  - type: paragraph
    text: Other side effects not listed may also occur in some patients. If you notice
      any other effects, check with your healthcare professional.
  - type: paragraph
    text: Call your doctor for medical advice about side effects. You may report side
      effects to the FDA at 1-800-FDA-1088.
