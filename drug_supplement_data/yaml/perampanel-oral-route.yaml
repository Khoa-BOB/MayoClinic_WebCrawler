title: Perampanel (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Fycompa
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Perampanel is used alone or together with other medicines to treat certain
      types of epilepsy, such as partial onset seizures and generalized tonic-clonic
      seizures. It works in the brain to prevent seizures. Perampanel will not cure
      epilepsy and will only control the seizures as long as you continue to take
      it.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of perampanel to treat partial onset seizures in children younger
        than 4 years of age or to treat generalized tonic-clonic seizures in children
        younger than 12 years of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of perampanel in the elderly. However,
        elderly patients are more likely to have unwanted effects, which may require
        an adjustment in the dose for patients receiving perampanel.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Alfentanil
      - Alprazolam
      - Apalutamide
      - Avacopan
      - Benzhydrocodone
      - Bosentan
      - Bromazepam
      - Buprenorphine
      - Butalbital
      - Butorphanol
      - Calcifediol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Ceritinib
      - Cetirizine
      - Clobazam
      - Clomipramine
      - Clonazepam
      - Codeine
      - Conivaptan
      - Cyclobenzaprine
      - Cyproheptadine
      - Daridorexant
      - Dexmedetomidine
      - Dihydrocodeine
      - Doxepin
      - Doxylamine
      - Efavirenz
      - Enzalutamide
      - Esketamine
      - Eslicarbazepine Acetate
      - Etravirine
      - Fedratinib
      - Fentanyl
      - Fexinidazole
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Levonorgestrel
      - Tizanidine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Behavior or mood changes (eg, aggression, anger) or
      - Coordination problems (eg, walking, balance) or
      - Depression or
      - Dizziness—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease, severe or
      - Patients receiving hemodialysis—Use is not recommended in patients with these
        conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Measure the oral liquid with the bottle adapter and oral syringe provided.
      Shake the bottle well before each use.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (suspension or tablets): For generalized tonic-clonic
        seizures: Adults and children 12 years of age and older—At first, 2 milligrams
        (mg) once a day, taken at bedtime. Your doctor may increase your dose as needed
        and tolerated. However, the dose is usually not more than 12 mg per day. Children
        younger than 12 years of age—Use and dose must be determined by your doctor.
        For partial-onset seizures: Adults and children 4 years of age and older—At
        first, 2 milligrams (mg) once a day, taken at bedtime. Your doctor may increase
        your dose as needed and tolerated. However, the dose is usually not more than
        12 mg per day. Children younger than 4 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For generalized tonic-clonic seizures: Adults and children 12 years of age
        and older—At first, 2 milligrams (mg) once a day, taken at bedtime. Your doctor
        may increase your dose as needed and tolerated. However, the dose is usually
        not more than 12 mg per day. Children younger than 12 years of age—Use and
        dose must be determined by your doctor.'
      - 'For partial-onset seizures: Adults and children 4 years of age and older—At
        first, 2 milligrams (mg) once a day, taken at bedtime. Your doctor may increase
        your dose as needed and tolerated. However, the dose is usually not more than
        12 mg per day. Children younger than 4 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—At first, 2 milligrams (mg)
        once a day, taken at bedtime. Your doctor may increase your dose as needed
        and tolerated. However, the dose is usually not more than 12 mg per day.
      - Children younger than 12 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - Adults and children 4 years of age and older—At first, 2 milligrams (mg) once
        a day, taken at bedtime. Your doctor may increase your dose as needed and
        tolerated. However, the dose is usually not more than 12 mg per day.
      - Children younger than 4 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: Call your doctor if you miss more than one dose of this medicine.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away any unused oral liquid 90 days after the bottle is opened for
        the first time.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to decide if you should continue to take it.
  - type: paragraph
    text: This medicine may cause some people to be agitated, irritable, or display
      other abnormal behaviors. It may also cause some people to have suicidal thoughts
      and tendencies or to become more depressed. Also tell your doctor if you or
      your child have sudden or strong feelings, such as feeling nervous, angry, restless,
      violent, or scared. If you, your child, or your caregiver notice any of these
      side effects, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, drowsy, clumsy, faint,
      unsteady, or less alert than they are normally. It may also cause trouble with
      controlling body movements, which may lead to falls, fractures, or other injuries.
      Do not drive or do anything else that could be dangerous until you know how
      this medicine affects you .
  - type: paragraph
    text: Check with your doctor right away if you have a fever, chills, cough, sore
      throat, swollen, painful, or tender lymph glands in the neck, armpit, or groin,
      or yellow skin or eyes while using this medicine. These could be symptoms of
      a serious condition, called drug reaction with eosinophilia and systemic symptoms
      (DRESS).
  - type: paragraph
    text: This medicine may be habit-forming. If you feel that the medicine is not
      working as well, do not use more than your prescribed dose. Call your doctor
      for instructions.
  - type: paragraph
    text: Do not stop taking this medicine without checking first with your doctor
      . Stopping the medicine suddenly may cause your seizures to return or to occur
      more often. Your doctor may want you to gradually reduce the amount you are
      taking before stopping it completely.
  - type: paragraph
    text: Birth control pills containing levonorgestrel may not work as well while
      you are using this medicine. Use another form of birth control together with
      your pills during treatment and for at least 1 month after the last dose to
      avoid getting pregnant. Talk to your doctor if you have questions.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines, medicines for hay fever, allergies or colds, sedatives,
      tranquilizers, or sleeping medicines, prescription pain medicines or narcotics,
      and other medicines for seizures. Check with your doctor before taking any of
      these medicines together with perampanel .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Aggression or anger
      - anxiety
      - clumsiness or unsteadiness
      - deep or fast breathing with dizziness
      - dry mouth
      - irregular heartbeat
      - irritability
      - numbness of the feet, hands, and around the mouth
      - restlessness
      - shakiness
      - sleepiness or unusual drowsiness
      - trouble sleeping
      - unsteadiness, trembling, or other problems with muscle control or coordination
      - unsteady walk
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal or decreased touch sensation
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in behavior
      - depression
      - thoughts of killing oneself
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness or lightheadedness
      - feeling of constant movement of self or surroundings
      - headache
      - nausea
      - sensation of spinning
      - stomach pain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - blurred vision
      - body aches or pain
      - bone pain
      - changes in speech patterns
      - chills
      - confusion
      - cough
      - decreased urine output
      - difficulty having a bowel movement
      - difficulty with moving
      - double vision
      - ear congestion
      - fast or irregular heartbeat
      - fever
      - increased thirst
      - lack or loss of strength
      - loss of voice
      - muscle pain, cramps, or stiffness
      - nasal congestion
      - pain in the arms, joints, or legs
      - runny nose
      - slurred speech
      - sneezing
      - sore throat
      - trouble remembering
      - trouble with speaking
      - unusual weight gain or loss
      - unusually deep sleep
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
