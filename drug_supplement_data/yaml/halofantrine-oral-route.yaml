title: Halofantrine (oral route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Halofantrine belongs to a group of medicines known as antimalarials. It
      is used to treat malaria, a red blood cell infection transmitted by the bite
      of a mosquito.
  - type: paragraph
    text: Malaria transmission occurs in large areas of Central and South America,
      Hispaniola, sub-Saharan Africa, the Indian subcontinent, Southeast Asia, the
      Middle East, and Oceania. Country-specific information on malaria can be obtained
      from the Centers for Disease Control and Prevention (CDC) or from the CDC's
      web site at http://www.cdc.gov/travel/yellowbk.
  - type: paragraph
    text: This medicine may cause serious side effects. Therefore, it usually is used
      to treat serious malaria infections in areas where it is known that other medicines
      may not work.
  - type: paragraph
    text: Halofantrine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of halofantrine
        in children with use in other age groups, this medicine is not expected to
        cause different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of halofantrine in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Aurothioglucose
      - Bepridil
      - Cisapride
      - Dronedarone
      - Fluconazole
      - Ketoconazole
      - Levoketoconazole
      - Levomethadyl
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acecainide
      - Adagrasib
      - Ajmaline
      - Alfuzosin
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amoxapine
      - Anagrelide
      - Apalutamide
      - Apomorphine
      - Aprindine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Avacopan
      - Azimilide
      - Azithromycin
      - Bedaquiline
      - Bretylium
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Carbamazepine
      - Ceritinib
      - Chloral Hydrate
      - Chloroquine
      - Chlorpromazine
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
      - Conivaptan
      - Crizotinib
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Cola Nut
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart problems, especially abnormal heartbeat or
      - Thiamine deficiency or
      - Unexplained sudden fainting—These conditions increase the chance of side effects
        affecting the heart, including fast irregular heartbeat
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Halofantrine is best taken on an empty stomach to decrease the chance of
      side effects.
  - type: paragraph
    text: To help clear up your infection completely, take this medicine exactly as
      directed by your doctor for the full time of treatment. Your symptoms may come
      back if you stop your treatment too early. Your doctor may instruct you to take
      a second course of treatment after 1 week.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (oral suspension and tablets): Adults and children
        over 37 kilograms (81 pounds) of body weight—500 mg, taken on an empty stomach
        every six hours three times a day for one day. Treatment may need to be repeated
        after one week. Children—Dose is based on body weight and must be determined
        by your doctor. Treatment may need to be repeated after one week. Up to 23
        kilograms (51 pounds) of body weight: Dose must be determined by your doctor.
        23 to 31 kilograms (51 to 68 pounds) of body weight: 250 mg, taken on an empty
        stomach every six hours three times a day for one day. 32 to 37 kilograms
        (70 to 81 pounds) of body weight: 375 mg, taken on an empty stomach every
        six hours three times a day for one day.'
    - type: list
      ordered: false
      items:
      - Adults and children over 37 kilograms (81 pounds) of body weight—500 mg, taken
        on an empty stomach every six hours three times a day for one day. Treatment
        may need to be repeated after one week.
      - 'Children—Dose is based on body weight and must be determined by your doctor.
        Treatment may need to be repeated after one week. Up to 23 kilograms (51 pounds)
        of body weight: Dose must be determined by your doctor. 23 to 31 kilograms
        (51 to 68 pounds) of body weight: 250 mg, taken on an empty stomach every
        six hours three times a day for one day. 32 to 37 kilograms (70 to 81 pounds)
        of body weight: 375 mg, taken on an empty stomach every six hours three times
        a day for one day.'
    - type: list
      ordered: false
      items:
      - 'Up to 23 kilograms (51 pounds) of body weight: Dose must be determined by
        your doctor.'
      - '23 to 31 kilograms (51 to 68 pounds) of body weight: 250 mg, taken on an
        empty stomach every six hours three times a day for one day.'
      - '32 to 37 kilograms (70 to 81 pounds) of body weight: 375 mg, taken on an
        empty stomach every six hours three times a day for one day.'
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Keep the liquid form of this medicine from freezing.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress after treatment. This
      is to make sure that the infection is cleared up completely, and to allow your
      doctor to check for any unwanted effects.
  - type: paragraph
    text: If your symptoms do not improve after you have taken this medicine for the
      full course of treatment, or if they become worse, check with your doctor.
  - type: paragraph
    text: 'Malaria is spread by the bites of certain kinds of infected female mosquitoes.
      If you are living in, or will be traveling to, an area where there is a chance
      of getting malaria, the following mosquito-control measures will help to prevent
      infection:'
  - type: list
    ordered: false
    items:
    - If possible, avoid going out between dusk and dawn because it is at these times
      that mosquitoes most commonly bite.
    - Wear long-sleeved shirts and long trousers to protect your arms and legs, especially
      from dusk through dawn when mosquitoes are out.
    - Apply insect repellant, preferably one containing DEET, to uncovered areas of
      the skin from dusk through dawn when mosquitoes are out.
    - If possible, sleep in a screened or air-conditioned room or under mosquito netting
      sprayed with insecticide to avoid being bitten by malaria-carrying mosquitoes.
    - Use mosquito coils or sprays to kill mosquitoes in living and sleeping quarters
      during evening and nighttime hours.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Coughing
      - noisy, rattling, or troubled breathing
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal pain
      - chest pain
      - confusion
      - convulsions (seizures)
      - diarrhea
      - difficulty in breathing or swallowing
      - hives
      - itching, especially of feet or hands
      - nausea
      - pounding heartbeat
      - reddening of skin, especially around ears
      - swelling of eyes, face or inside of nose
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More Common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Aches and pain in joints
      - constipation
      - frequent urination
      - indigestion
      - loss of appetite
      - skin itching or rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
