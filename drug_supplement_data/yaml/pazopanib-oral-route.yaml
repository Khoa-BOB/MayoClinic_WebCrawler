    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - food
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (severe chest pain), history of or
      - Blood clotting problems (eg, pulmonary embolism, venous thrombosis), history
        of or
      - Congestive heart failure or
      - Gilbert syndrome (a genetic liver disease) or
      - Heart attack, history of or
      - Heart disease or
      - Heart rhythm problems (eg, QT prolongation), history of or
      - Hypertension (high blood pressure) or
      - Hypothyroidism (underactive thyroid) or
      - Lung problems (eg, interstitial lung disease, pneumonitis) or
      - Stomach or bowel problems (eg, fistula, perforation, tear), history of or
      - Stroke, history of or
      - Transient ischemic attack, history of—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Infection—May decrease your body's ability to fight an infection.
    - type: list
      ordered: false
      items:
      - Liver disease, moderate—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: It is best to take this medicine on an empty stomach, at least 1 hour before
      or 2 hours after a meal.
  - type: paragraph
    text: Swallow the tablet whole. Do not break, crush, or chew it.
  - type: paragraph
    text: Take antacids several hours before or after you take pazopanib.
  - type: paragraph
    text: Do not use grapefruit products with this medicine . Grapefruit products
      may change the amount of medicine that is absorbed in the body.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For advanced kidney cancer and soft tissue
        sarcoma: Adults—800 milligrams (mg) once per day. Your doctor may adjust your
        dose if needed. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For advanced kidney cancer and soft tissue sarcoma: Adults—800 milligrams
        (mg) once per day. Your doctor may adjust your dose if needed. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—800 milligrams (mg) once per day. Your doctor may adjust your dose
        if needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is less than 12 hours before your next scheduled
        dose, skip the missed dose and take your next dose at the normal time.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      for any unwanted effects from the medicine . Blood and urine tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Your blood pressure should be checked regularly during treatment with this
      medicine. Your doctor may need to treat you if you develop high blood pressure.
      Symptoms of high blood pressure are blurred vision, dizziness, nervousness,
      headache, pounding in the ears, or a slow or fast heartbeat.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. It
      may also cause birth defects if the father is using it when his sexual partner
      becomes pregnant. Men and women should use an effective form of birth control
      to keep from getting pregnant during treatment with this medicine and for at
      least 2 weeks after the last dose. If you think you have become pregnant while
      using the medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine could cause infertility (unable to have children). Talk with
      your doctor before using this medicine if you plan to have children.
  - type: paragraph
    text: Cancer medicines can cause diarrhea, nausea, vomiting, or stomach pain in
      most people, sometimes even after receiving medicines to prevent it. Ask your
      doctor or nurse about other ways to control these unwanted effects.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea and vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you had a heart rhythm problem (eg,
      QT prolongation, Torsades de pointes).
  - type: paragraph
    text: Pazopanib may cause heart problems. Check with your doctor right away if
      you have chest pain or tightness, decreased urine output, dilated neck veins,
      extreme fatigue, irregular heartbeat, swelling of the face, fingers, feet, or
      lower legs, trouble breathing, or weight gain.
  - type: paragraph
    text: This medicine may increase your risk of having bleeding problems. Tell your
      doctor right away if you start to notice any signs of bleeding.
  - type: paragraph
    text: This medicine may affect the way your body heals from cuts and wounds. Make
      sure any doctor who treats you knows that you are using this medicine. You may
      need to stop using this medicine at least 7 days before having a surgery.
  - type: paragraph
    text: Check with your doctor right away if you have new chest pain, trouble breathing,
      leg pain, swelling of the arms, hands, legs, or feet, or a cool or pale arm
      or leg. These may be symptoms of a blood clotting problem.
  - type: paragraph
    text: Check with your doctor right away if you start having severe stomach burning,
      cramps, or pains, bloody or black, tarry stools, trouble breathing, heartburn,
      indigestion, nausea, or vomiting of material that looks like coffee grounds.
      These could be symptoms of a serious bowel problem.
  - type: paragraph
    text: This medicine may cause swelling of the lungs (pneumonitis) or interstitial
      lung disease. These are life-threatening conditions and require immediate medical
      attention. The symptoms may be similar to the symptoms of lung cancer. Check
      with your doctor right away if you have new or worsening cough, fever, or trouble
      breathing.
  - type: paragraph
    text: This medicine may increase your chance of having a brain condition called
      reversible posterior leukoencephalopathy syndrome (RPLS). Check with your doctor
      right away if you have headaches, seizures, extreme drowsiness, confusion, or
      vision problems while using this medicine.
  - type: paragraph
    text: This medicine may cause hypothyroidism (underactive thyroid). Check with
      your doctor right away if you have depressed mood, dry skin and hair, feeling
      cold, hair loss, hoarseness or a husky voice, muscle cramps and stiffness, slowed
      heartbeat, weight gain, or unusual tiredness or weakness.
  - type: paragraph
    text: Pazopanib may cause serious side effects in the developing organs of children
      younger than 2 years of age. Check with your doctor if you have any concerns.
  - type: paragraph
    text: Pazopanib may cause kidney problems, including proteinuria or nephrotic
      syndrome. Check with your doctor right away if you have a cloudy or bloody urine,
      high blood pressure, or swelling of the face, feet or lower legs.
  - type: paragraph
    text: This medicine may also cause a serious reaction called tumor lysis syndrome
      (TLS). Call your doctor right away if you have a change in how much or how often
      you urinate, rapid weight gain, muscle or joint pain, swelling of the feet or
      lower legs, or unusual tiredness or weakness.
  - type: paragraph
    text: Call your doctor right away if you have a cough that would not go away,
      weight loss, night sweats, fever, chills, or flu-like symptoms, such as a runny
      or stuffy nose, headache, blurred vision, or you feel generally ill. These may
      be symptoms of an infection.
  - type: paragraph
    text: This medicine may cause diarrhea, and in some cases it can be severe. Do
      not take any medicine to treat diarrhea without first checking with your doctor.
      Diarrhea medicines may make the diarrhea worse or make it last longer. If you
      have any questions about this or if mild diarrhea continues or gets worse, check
      with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
