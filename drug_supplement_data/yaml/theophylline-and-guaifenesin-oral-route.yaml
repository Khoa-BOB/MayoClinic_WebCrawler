      - Prazepam
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
      - food
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Convulsions (seizures)—Theophylline may make this condition worse
    - type: list
      ordered: false
      items:
      - Heart failure or
      - Liver disease or
      - Underactive thyroid—The effects of theophylline may be increased
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine works best when taken with a glass of water on an empty stomach
      (either 30 minutes to 1 hour before meals or 2 hours after meals) since that
      way it will get into the blood sooner. However, in some cases your doctor may
      want you to take this medicine with meals or right after meals to lessen stomach
      upset. If you have any questions about how you should be taking this medicine,
      check with your doctor.
  - type: paragraph
    text: Take this medicine only as directed. Do not take more of it, do not take
      it more often, and do not take it for a longer time than your doctor ordered.
      To do so may increase the chance of serious side effects.
  - type: paragraph
    text: In order for this medicine to help your medical problem, it must be taken
      every day in regularly spaced doses as ordered by your doctor . This is necessary
      to keep a constant amount of this medicine in the blood. To help keep the amount
      constant, do not miss any doses.
  - type: paragraph
    text: Make certain your health care professional knows if you are on any special
      diet, such as a high-protein, low-carbohydrate or low-protein, high-carbohydrate
      diet.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: paragraph
      text: After you begin taking theophylline and guaifenesin combination, it is
        very important that your doctor check your blood level of theophylline at
        regular intervals to find out if your dose of theophylline and guaifenesin
        combination needs to be changed. Do not change your dose of theophylline and
        guaifenesin combination unless your doctor tells you to do so.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor should check your progress at regular visits, especially for
      the first few weeks after you begin taking this medicine. A blood test may be
      taken to help your doctor decide whether the dose of this medicine should be
      changed.
  - type: paragraph
    text: The theophylline in this medicine may add to the central nervous system
      stimulant effects of caffeine-containing foods or beverages such as chocolate,
      cocoa, tea, coffee, and cola drinks. Avoid eating or drinking large amounts
      of these foods or beverages while taking this medicine . If you have any questions
      about this, check with your doctor.
  - type: paragraph
    text: 'A change in your usual behavior or physical well-being may affect the way
      this medicine works in your body. Check with your doctor if you:'
  - type: list
    ordered: false
    items:
    - have a fever of 102 °F or higher for at least 24 hours or higher than 100 °F
      for longer than 24 hours.
    - start or stop smoking.
    - start or stop taking another medicine.
    - change your diet for a long time.
  - type: paragraph
    text: Before you have myocardial perfusion studies (a medical test that shows
      how well blood is flowing to your heart), tell the medical doctor in charge
      that you are taking this medicine. The results of the test may be affected by
      this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Heartburn and/or vomiting
    subsections: []
  - heading: Symptoms of toxicity
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal pain, continuing or severe
      - confusion or change in behavior
      - convulsions (seizures)
      - dark or bloody vomit
      - diarrhea
      - dizziness or lightheadedness
      - fast and/or irregular heartbeat, continuing
      - nervousness or restlessness, continuing
      - trembling, continuing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fast heartbeat
      - headache
      - increased urination
      - nausea
      - nervousness
      - trembling
      - trouble in sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
