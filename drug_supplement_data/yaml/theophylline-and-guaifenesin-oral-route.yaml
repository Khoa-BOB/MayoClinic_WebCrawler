title: Theophylline and guaifenesin (oral route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Theophylline and guaifenesin combination is used to treat or prevent the
      symptoms of asthma or to treat chronic bronchitis and emphysema. This medicine
      relieves cough, wheezing, shortness of breath, and troubled breathing. It works
      by opening up the bronchial tubes (air passages) of the lungs and increasing
      the flow of air through them.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: The side effects of theophylline are more likely to occur in newborn infants,
        who are usually more sensitive to the effects of this medicine.
    - type: paragraph
      text: Although there is no specific information about the use of guaifenesin
        in children, it is not expected to cause different side effects or problems
        in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Patients older than 60 years of age are likely to require a lower dose
        than younger adults. If the amount of theophylline is too high, side effects
        are more likely to occur. Your doctor may want to take blood samples to determine
        whether a dose change is needed.
    - type: paragraph
      text: Although there is no specific information about the use of guaifenesin
        in the elderly, it is not expected to cause different side effects or problems
        in older people than it does in younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content: []
    subsections: []
  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Riociguat
      - Viloxazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Adalimumab
      - Adenosine
      - Amifampridine
      - Bupropion
      - Cannabidiol
      - Capmatinib
      - Cimetidine
      - Ciprofloxacin
      - Clarithromycin
      - Clomipramine
      - Deferasirox
      - Desogestrel
      - Diazoxide
      - Dienogest
      - Dihydroartemisinin
      - Donepezil
      - Drospirenone
      - Enasidenib
      - Enoxacin
      - Erythromycin
      - Estetrol
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Etintidine
      - Etonogestrel
      - Febuxostat
      - Fluconazole
      - Fluvoxamine
      - Fosphenytoin
      - Gestodene
      - Givosiran
      - Halothane
      - Hydroxychloroquine
      - Idrocilamide
      - Imipenem
      - Infliximab
      - Isoniazid
      - Ketamine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Adinazolam
      - Alprazolam
      - Aminoglutethimide
      - Amiodarone
      - Azithromycin
      - Bentazepam
