title: Segesterone acetate and ethinyl estradiol (vaginal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Annovera
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Segesterone acetate and ethinyl estradiol combination is used to prevent
      pregnancy. It is a flexible birth control vaginal system (in the shape of a
      ring) that contains two types of hormones, segesterone acetate and ethinyl estradiol.
      It works by stopping a woman's egg from fully developing each month. The egg
      can no longer accept a sperm and fertilization (pregnancy) is prevented.
  - type: paragraph
    text: No contraceptive method is 100 percent effective. Birth control methods
      such as having surgery to become sterile or not having sex are more effective
      than vaginal systems. Discuss your options for birth control with your doctor.
  - type: paragraph
    text: This medicine will not prevent HIV infection or other sexually transmitted
      diseases. It will not help as emergency contraception, such as after unprotected
      sexual contact.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Insert, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of segesterone
        acetate and ethinyl estradiol combination have not been performed in the pediatric
        population. However, pediatric-specific problems that would limit the usefulness
        of this medicine in teenagers are not expected. This medicine may be used
        for birth control in teenage females but should not be used before the start
        of menstruation.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of segesterone
        acetate and ethinyl estradiol combination have not been performed in the geriatric
        population. This medicine is not indicated for use in elderly women.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Dasabuvir
      - Fezolinetant
      - Ombitasvir
      - Paritaprevir
      - Ritonavir
      - Tranexamic Acid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alclometasone
      - Aldosterone
      - Amcinonide
      - Amifampridine
      - Amobarbital
      - Amoxicillin
      - Ampicillin
      - Amprenavir
      - Anagrelide
      - Apalutamide
      - Aprepitant
      - Armodafinil
      - Artemether
      - Avapritinib
      - Bacampicillin
      - Beclomethasone
      - Belzutifan
      - Betamethasone
      - Bexarotene
      - Boceprevir
      - Bosentan
      - Budesonide
      - Bupropion
      - Butabarbital
      - Butalbital
      - Carbamazepine
      - Carbenicillin
      - Cefaclor
      - Cefadroxil
      - Cefdinir
      - Cefditoren
      - Cefixime
      - Cefpodoxime
      - Cefprozil
      - Ceftazidime
      - Ceftibuten
      - Cefuroxime
      - Cenobamate
      - Ceritinib
      - Chlortetracycline
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Amitriptyline
      - Atazanavir
      - Atorvastatin
      - Diazepam
      - Doxepin
      - Etoricoxib
      - Ginseng
      - Imipramine
      - Lamotrigine
      - Leflunomide
      - Levothyroxine
      - Licorice
      - Liothyronine
      - Lorazepam
      - Parecoxib
      - Roflumilast
      - Selegiline
      - Temazepam
      - Teriflunomide
      - Tipranavir
      - Triazolam
      - Valdecoxib
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Abnormal or unusual vaginal bleeding or
      - Blood clots (eg, deep vein thrombosis, pulmonary embolism), or history of
        or
      - Blood disorder (eg, hypercoagulopathy), acquired or inherited or
      - Breast cancer, or history of or
      - Diabetes with kidney, eye, nerve, or blood vessel damage or
      - Heart attack, history of or
      - Heart or blood vessel disease (eg, coronary artery disease, heart valve problems),
        or history of or
      - Hypertension (high blood pressure), uncontrolled or
      - Jaundice during pregnancy or from using hormonal therapy in the past or
      - Liver disease (eg, cirrhosis, hepatitis), including tumors or cancer or
      - Major surgery in near future, with prolonged periods of immobilization or
      - Migraine headache or
      - Stroke, history of or
      - Tumors (estrogen-dependent), known or suspected—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Angioedema (swelling of the face, tongue, or throat), inherited or
      - Chloasma gravidarum (skin disorder during pregnancy), history of or
      - Cholestasis (bile problem) during pregnancy, history of or
      - Cervical cancer or
      - Depression, history of or
      - Gallbladder disease or
      - Hypertension (high blood pressure) or
      - Toxic shock syndrome, history of or
      - Vaginal or cervical erosion or ulcers—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hyperlipidemia (high cholesterol or fats in the blood), or family history
        of or
      - Kidney disease or
      - Obesity, or history of—Use with caution. These conditions may increase the
        risk for more serious side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine exactly as directed by your doctor . Do not use more of
      it, do not use it more often, and do not use it for a longer time than your
      doctor ordered. To do so may cause unwanted side effects.
  - type: paragraph
    text: This medicine is to be used only in the vagina . This combination medicine
      is contained in a vaginal system that is placed into your vagina. The vaginal
      system will slowly release small amounts of the medicine for your body to absorb.
  - type: paragraph
    text: This medicine comes with a patient information leaflet and patient instructions.
      Read and follow these instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: This medicine is used in a 4 week cycle for 13 cycles (1 year). You may
      start using the vaginal system between the second and fifth day of your menstrual
      period, keeping it in place for 3 weeks.
  - type: paragraph
    text: Once the vaginal system is in place inside your vagina, you should not be
      able to feel it. If you feel uncomfortable, it may not be inserted far enough.
      Gently push the vaginal system farther into your vagina. If you feel pain, talk
      to your doctor.
  - type: paragraph
    text: The vaginal system may move down accidently. This can happen if you remove
      a tampon, during sex, or strain to have a bowel movement. Gently push it back
      into place. If the vaginal system comes all the way out, wash it with mild soap
      and warm water, pat it dry with a clean cloth towel or paper towel, and put
      it back inside. Call your doctor if the vaginal system comes out several times.
  - type: paragraph
    text: Remove the vaginal system after 3 weeks on the same day of the week and
      time it was inserted. During the 1-week break, you will usually have your menstrual
      period. Wash the vaginal system with mild soap and warm water, pat it dry with
      a clean cloth towel or paper towel, and keep it inside the case that comes with
      it. Reinsert it after a week.
  - type: paragraph
    text: While using this medicine, you may need to use an additional form of birth
      control method (eg, condom, spermicide) during the first 7 days to prevent pregnancy,
      especially if you have an irregular menstrual cycle or if you start using this
      vaginal system more than 5 days from your last menstrual bleeding.
  - type: paragraph
    text: If you need to remove the vaginal system, hook your finger through it and
      pull it out.
  - type: paragraph
    text: If you are switching from a combination hormonal method (eg, pills, patch)
      to Annovera™ , start using this medicine on any day. Do not use this medicine
      after more than 7 hormone-free days.
  - type: paragraph
    text: If you are switching from a progestin-only method (eg, progestin-only implant,
      injection, intrauterine system, pill) to Annovera™ , start using it on the day
      after you used your last progestin-only pill, or on the day your implant or
      IUD is removed, or on the day you would have your next injection. You must also
      use an additional barrier method of birth control (eg, male condom with spermicide)
      for the first 7 days.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine. Grapefruit and grapefruit juice may change the amount of this medicine
      that is absorbed in the body.
  - type: paragraph
    text: Do not use this medicine together with oil-based vaginal creams, gels, lubricants,
      or suppositories. Ask your doctor before you use other products or medicines
      into your vagina.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For vaginal dosage form (vaginal system): For contraception (to prevent pregnancy):
        Adults—One vaginal system inserted into the vagina for 21 days (3 weeks),
        followed by a 1 week vaginal system-free interval. It is then reinserted 1
        week after. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For contraception (to prevent pregnancy): Adults—One vaginal system inserted
        into the vagina for 21 days (3 weeks), followed by a 1 week vaginal system-free
        interval. It is then reinserted 1 week after. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—One vaginal system inserted into the vagina for 21 days (3 weeks),
        followed by a 1 week vaginal system-free interval. It is then reinserted 1
        week after.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    - type: paragraph
      text: If the vaginal system has slipped out and it has been out for 2 hours
        or less , wash it with mild soap and warm water, pat it dry with a clean cloth
        towel or paper towel, and reinsert it. You should still be protected from
        pregnancy. If the vaginal system has been out for more than 2 hours (including
        multiple removals), use an additional form of birth control (including condoms
        or spermicide) until the vaginal system has been in the vagina for 7 days
        in a row.
    - type: paragraph
      text: If you forget to reinsert the vaginal system after the vaginal system-free
        week, use an additional form of birth control (including condoms or spermicide)
        until the vaginal system has been in the vagina for 7 days in a row.
    - type: paragraph
      text: If you leave the vaginal system inside the vagina for more than 21 days,
        remove it for 7 days and then reinsert it for 21 days to go back to the regular
        schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Do not use the vaginal system for more than 13 cycles (1 year). Place
        the used vaginal system inside the case that comes with it. Throw it in the
        trash. Do not flush the vaginal system down the toilet.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular annual
      visits to make sure this medicine is working properly. Blood tests may be needed
      to check for unwanted effects. Your doctor may also want to check your blood
      pressure while using this medicine.
  - type: paragraph
    text: Although you are using this medicine to prevent pregnancy, you should know
      that using this medicine while you are pregnant could harm your unborn baby.
      If you think you have become pregnant while using this medicine, tell your doctor
      right away. You may start using this medicine 4 weeks after giving birth and
      if you are not breastfeeding.
  - type: paragraph
    text: Vaginal bleeding of various amounts may occur between your regular menstrual
      periods during the first month of use. This is sometimes called spotting when
      lighter, or breakthrough bleeding when heavier.
  - type: list
    ordered: false
    items:
    - If this should occur, continue using Annovera™.
    - The bleeding usually stops within 1 week. Check with your doctor if the bleeding
      continues for more than 1 week.
    - If the bleeding continues after you have been taking hormonal contraceptives
      on schedule, check with your doctor.
  - type: paragraph
    text: Do not use this medicine together with medicine to treat hepatitis C virus
      infection, including ombitasvir/paritaprevir/ritonavir, with or without dasabuvir
      (Technivie®, Viekira Pak®).
  - type: paragraph
    text: Do not use this medicine if you smoke cigarettes or if you are over 35 years
      of age If you smoke while using Annovera™, you increase your risk of having
      a blood clot, heart attack, or stroke. Your risk is even higher if you are over
      age 35, if you have diabetes, high blood pressure, high cholesterol, or if you
      are overweight. Talk with your doctor about ways to stop smoking. Keep your
      diabetes under control. Ask your doctor about diet and exercise to control your
      weight and blood cholesterol level.
  - type: paragraph
    text: Using this medicine may increase your risk of having blood clotting problems.
      Check with your doctor right away if you have pain in the chest, groin, or legs,
      especially the calves, difficulty with breathing, a sudden, severe headache,
      slurred speech, a sudden, unexplained shortness of breath, a sudden loss of
      coordination, or vision changes while using this medicine.
  - type: paragraph
    text: Check with your doctor immediately if blurred vision, difficulty in reading,
      or any other change in vision occurs during or after treatment. Your doctor
      may want an eye doctor (ophthalmologist) to check your eyes.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, dark urine, pale stools, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. You might need to measure
      your blood pressure at home. If you think your blood pressure is too high, call
      your doctor right away.
  - type: paragraph
    text: This medicine may increase your risk of having gallbladder disease. Check
      with your doctor if you start to have stomach pains, nausea, and vomiting.
  - type: paragraph
    text: Using this medicine may increase your risk of cervical cancer. Talk with
      your doctor about this risk. Check with your doctor immediately if you experience
      abnormal vaginal bleeding.
  - type: paragraph
    text: This medicine may cause skin discoloration. Use a sunscreen when you are
      outdoors. Avoid sunlamps and tanning beds.
  - type: paragraph
    text: 'Toxic shock syndrome (TSS) may occur while using this medicine. Call your
      doctor right away if you have any of the following symptoms: sudden high fever,
      diarrhea, dizziness, fainting, vomiting, muscle aches, or a sunburn-like rash.'
  - type: paragraph
    text: Check with your doctor before refilling an old prescription, especially
      after a pregnancy. You will need another physical examination and your doctor
      may change your prescription.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. The results of some medical tests may be affected by this medicine.
      You may also need to stop using this medicine at least 4 weeks before and 2
      weeks after having major surgery.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - chills
      - difficult, burning, or painful urination
      - fever
      - frequent or painful urination
      - headache, severe and throbbing
      - itching of the vagina or outside the genitals
      - lower back or side pain
      - pain during sexual intercourse
      - stomach pain
      - thick, white curd-like vaginal discharge without odor or with mild odor
      - upper or lower abdominal pain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - back pain
      - chest pain
      - confusion
      - cough
      - dizziness or lightheadedness
      - expulsion of tissue with clots from your vagina
      - fainting
      - fast heartbeat
      - hives, itching, skin rash
      - hoarseness
      - irritation
      - joint pain, stiffness or swelling
      - mental depression
      - mood or other mental changes
      - numbness of the hands
      - pain, redness, or swelling in the arm or leg
      - redness of the skin
      - severe stomach pain
      - swelling of the eyelids, face, lips, hands, or feet
      - tightness in the chest
      - troubled breathing or swallowing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cramps
      - diarrhea
      - heavy bleeding
      - nausea
      - normal menstrual bleeding occurring earlier, possibly lasting longer than
        expected
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
