    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed. Do not use it more often than recommended
      on the label, unless otherwise directed by your doctor.
  - type: paragraph
    text: Keep this medicine away from the eyes. If you should accidentally get some
      in your eyes, flush them thoroughly with water.
  - type: paragraph
    text: Before using this medicine, wet the hair and scalp with lukewarm water.
      Then apply a generous amount to the scalp and work up a rich lather. Rub the
      lather into the scalp for 5 minutes, then rinse. Apply the medicine again and
      rinse thoroughly.
  - type: paragraph
    text: Immediately after using this medicine, wash your hands to remove any medicine
      that may be on them.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For dandruff, seborrheic dermatitis, and psoriasis of the scalp: For cream
        shampoo and lotion shampoo dosage forms: Adults and children—Use on the scalp
        one or two times a week.'
    - type: list
      ordered: false
      items:
      - 'For cream shampoo and lotion shampoo dosage forms: Adults and children—Use
        on the scalp one or two times a week.'
    - type: list
      ordered: false
      items:
      - Adults and children—Use on the scalp one or two times a week.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Do not use any topical mercury-containing preparation, such as ammoniated
      mercury ointment, on the same affected area as this medicine . To do so may
      cause a foul odor, may be irritating to the skin, and may stain the skin black.
      If you have any questions about this, check with your health care professional.
  - type: paragraph
    text: This medicine may temporarily discolor blond, bleached, or tinted hair.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: In animal studies, coal tar (contained in this combination medicine) has
      been shown to increase the chance of skin cancer.
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  - type: list
    ordered: false
    items:
    - Skin irritation not present before use of this medicine
  - type: paragraph
    text: Other side effects not listed may also occur in some patients. If you notice
      any other effects, check with your healthcare professional.
  - type: paragraph
    text: Call your doctor for medical advice about side effects. You may report side
      effects to the FDA at 1-800-FDA-1088.
