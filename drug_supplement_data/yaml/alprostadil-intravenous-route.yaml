title: Alprostadil (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Prostin VR Pediatric
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Alprostadil injection is used to treat certain heart, lung, and blood vessel
      problems in infants. It is used to temporarily keep the ductus arteriosus (blood
      vessel in the heart) open before having a surgery.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your child's
      doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of alprostadil injection in newborn
        babies.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Use of this medicine is not indicated for geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Heparin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Blood vessel problems (eg, aneurysm) or
      - Heart disease or
      - Lung disease or breathing problems (eg, respiratory distress syndrome) or
      - Stomach blockage—Use with caution. May increase risk for more serious side
        effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other health provider will give your baby this medicine. It is
      given through a needle or a catheter placed in a vein. It may also be given
      through a catheter in your baby's umbilical cord.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: The doctor will check your child's progress closely while your child is
      receiving this medicine . This will allow the doctor to see if the medicine
      is working properly and to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause apnea (temporary stopping of breathing) in newborn
      babies. Tell the doctor right away if your child has bluish lips or skin or
      not breathing after receiving the medicine.
  - type: paragraph
    text: Using this medicine for a long time may cause unwanted effects (eg, bone
      problems). Ask your doctor if you have concerns about this.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish lips or skin
      - chest pain or discomfort
      - feeling of warmth
      - fever
      - lightheadedness, dizziness, or fainting
      - not breathing
      - redness of the face, neck, arms, and occasionally, upper chest
      - slow or irregular heartbeat
      - unusual tiredness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blood in the urine or stools
      - bruising
      - confusion
      - convulsions
      - coughing or vomiting blood
      - decreased urine
      - dry mouth
      - fast, pounding, or irregular heartbeat or pulse
      - increased thirst
      - loss of appetite
      - mood changes
      - no blood pressure or pulse
      - persistent bleeding or oozing from puncture sites, mouth, or nose
      - rash
      - seizures
      - unconsciousness
      - vomiting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - anxiety
      - black, tarry stools
      - bleeding gums
      - clumsiness
      - cold clammy skin
      - difficult or troubled breathing
      - dilated neck veins
      - fainting
      - low body temperature
      - neck is bent backward
      - pale or blue lips, fingernails, or skin
      - pale skin
      - pinpoint red spots on the skin
      - restlessness
      - shivering or chills
      - slow to respond
      - sweating
      - swelling of the face, fingers, feet, or lower legs
      - unusual bleeding or bruising
      - unusual drowsiness, dullness, tiredness, weakness, or sleepiness
      - unusually irritable
      - weak or feeble pulse
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
