title: Isoniazid (oral route, intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Nydrazid
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Pms-Isoniazid
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Isoniazid is used to treat tuberculosis (TB) or prevent its return (reactivation).
      It may be given alone, or in combination with other medicines, to treat TB or
      to prevent its return (reactivation). This medicine may also be used for other
      problems as determined by your doctor.
  - type: paragraph
    text: This medicine may cause some serious side effects, including damage to the
      liver. Liver damage is more likely to occur in patients over 50 years of age.
      You and your doctor should talk about the good this medicine will do, as well
      as the risks of taking it.
  - type: paragraph
    text: 'If you are being treated for active tuberculosis (TB): To help clear up
      your TB infection completely, you must keep taking this medicine for the full
      time of treatment, even if you begin to feel better. This is very important.
      It is also important that you do not miss any doses.'
  - type: paragraph
    text: Isoniazid is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Isoniazid can cause serious side effects in any patient. Therefore, it
        is especially important that you discuss with the child's doctor the good
        that this medicine may do as well as the risks of using it.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Hepatitis may be especially likely to occur in patients over 50 years
        of age, who are usually more sensitive than younger adults to the effects
        of isoniazid.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acetaminophen
      - Aluminum Carbonate, Basic
      - Aluminum Hydroxide
      - Aluminum Phosphate
      - Amifampridine
      - Azathioprine
      - Belzutifan
      - Bupropion
      - Calcium Carbonate
      - Calcium Silicate
      - Carbamazepine
      - Clomipramine
      - Diazepam
      - Dihydroxyaluminum Aminoacetate
      - Dihydroxyaluminum Sodium Carbonate
      - Domperidone
      - Donepezil
      - Enflurane
      - Finerenone
      - Foslevodopa
      - Fosphenytoin
      - Glimepiride
      - Haloperidol
      - Hydroxychloroquine
      - Insulin Aspart, Recombinant
      - Itraconazole
      - Ketoconazole
      - Levodopa
      - Levoketoconazole
      - Magaldrate
      - Magnesium Carbonate
      - Magnesium Hydroxide
      - Magnesium Oxide
      - Magnesium Peroxide
      - Magnesium Trisilicate
      - Mavacamten
      - Mercaptopurine
      - Methotrexate
      - Methylergonovine
      - Mifepristone
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aminosalicylic Acid
      - Clopidogrel
      - Disulfiram
      - Meperidine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
      - Histamine Containing Food
      - Tyramine Containing Food
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse (or history of) or
      - Liver disease—There may be an increased chance of hepatitis with daily drinking
        of alcohol or in patients with liver disease
    - type: list
      ordered: false
      items:
      - Kidney disease (severe)—There may be an increased chance of side effects in
        patients with severe kidney disease
    - type: list
      ordered: false
      items:
      - Seizure disorders such as epilepsy—There may be an increased chance of seizures
        (convulsions) in some patients
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Make certain your health care professional knows if you are on a low-sodium,
      low-sugar, or any other special diet. Most medicines contain more than just
      the active ingredient, and many liquid medicines contain alcohol.
  - type: paragraph
    text: If you are taking isoniazid by mouth and it upsets your stomach, take it
      with food. Antacids may also help. However, do not take aluminum-containing
      antacids within 1 hour of taking isoniazid. They may keep this medicine from
      working properly.
  - type: paragraph
    text: 'For patients taking the oral liquid form of isoniazid:'
  - type: list
    ordered: false
    items:
    - Use a specially marked measuring spoon or other device to measure each dose
      accurately. The average household teaspoon may not hold the right amount of
      liquid.
  - type: paragraph
    text: To help clear up your tuberculosis (TB) completely, it is very important
      that you keep taking this medicine for the full time of treatment, even if you
      begin to feel better after a few weeks. You may have to take it every day for
      as long as 6 months to 2 years. It is important that you do not miss any doses.
  - type: paragraph
    text: Your doctor may also want you to take pyridoxine (e.g., Hexa-Betalin, vitamin
      B 6) every day to help prevent or lessen some of the side effects of isoniazid.
      This is not usually needed in children, who receive enough pyridoxine in their
      diet. If it is needed, it is very important to take pyridoxine every day along
      with this medicine. Do not miss any doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (tablets, syrup): For preventing the return (reactivation)
        of tuberculosis: Adults and teenagers—300 milligrams (mg) once a day. Children—Dose
        is based on body weight. The usual dose is 10 mg per kilogram (kg) (4.5 mg
        per pound) of body weight, up to 300 mg, once a day. For treatment of tuberculosis:
        Adults and teenagers—300 mg once a day; or 15 mg per kg (6.8 mg per pound)
        of body weight, up to 900 mg, two times a week or three times a week, depending
        on the schedule your doctor chooses for you. Children—Dose is based on body
        weight. The usual dose is 10 to 20 mg per kg (4.5 to 9.1 mg per pound) of
        body weight, up to 300 mg, once a day; or 20 to 40 mg per kg (9.1 to 18.2
        mg per pound) of body weight, up to 900 mg, two times a week or three times
        a week, depending on the schedule your doctor chooses for you.'
      - 'For injection dosage form: For preventing the return (reactivation) of tuberculosis:
        Adults and teenagers—300 mg once a day. Children—Dose is based on body weight.
        The usual dose is 10 mg per kg (4.5 mg per pound) of body weight, up to 300
        mg, once a day. For treatment of tuberculosis: Adults and teenagers—300 mg
        once a day; or 15 mg per kg (6.8 mg per pound) of body weight, up to 900 mg,
        two times a week or three times a week, depending on the schedule your doctor
        chooses for you. Children—Dose is based on body weight. The usual dose is
        10 to 20 mg per kg (4.5 to 9.1 mg per pound) of body weight, up to 300 mg,
        once a day; or 20 to 40 mg per kg (9.1 to 18.2 mg per pound) of body weight,
        up to 900 mg, two times a week or three times a week, depending on the schedule
        your doctor chooses for you.'
    - type: list
      ordered: false
      items:
      - 'For preventing the return (reactivation) of tuberculosis: Adults and teenagers—300
