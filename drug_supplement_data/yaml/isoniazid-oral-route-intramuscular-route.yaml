    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits.
      Also, check with your doctor immediately if blurred vision or loss of vision,
      with or without eye pain, occurs during treatment. Your doctor may want you
      to have your eyes checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: If your symptoms do not improve within 2 to 3 weeks, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: Certain foods such as cheese (Swiss or Cheshire) or fish (tuna, skipjack,
      or Sardinella) may rarely cause reactions in some patients taking isoniazid.
      Check with your doctor if redness or itching of the skin, hot feeling, fast
      or pounding heartbeat, sweating, chills or clammy feeling, headache, or lightheadedness
      occurs while you are taking this medicine.
  - type: paragraph
    text: Liver problems may be more likely to occur if you drink alcoholic beverages
      regularly while you are taking this medicine. Also, the regular use of alcohol
      may keep this medicine from working properly. Therefore, you should strictly
      limit the amount of alcoholic beverages you drink while you are taking this
      medicine.
  - type: paragraph
    text: If this medicine causes you to feel very tired or very weak; or causes clumsiness;
      unsteadiness; a loss of appetite; nausea; numbness, tingling, burning, or pain
      in the hands and feet; or vomiting, check with your doctor immediately. These
      may be early warning signs of more serious liver or nerve problems that could
      develop later.
  subsections:
  - heading: 'For diabetic patients:'
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - This medicine may cause false test results with some urine sugar tests. Check
        with your doctor before changing your diet or the dosage of your diabetes
        medicine.
    subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Clumsiness or unsteadiness
      - dark urine
      - loss of appetite
      - nausea or vomiting
      - numbness, tingling, burning, or pain in hands and feet
      - unusual tiredness or weakness
      - yellow eyes or skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision or loss of vision, with or without eye pain
      - convulsions (seizures)
      - fever and sore throat
      - joint pain
      - mental depression
      - mood or other mental changes
      - skin rash
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - stomach pain
    subsections: []
  - heading: For injection form
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Irritation at the place of injection
    - type: paragraph
      text: Dark urine and yellowing of the eyes or skin (signs of liver problems)
        are more likely to occur in patients over 50 years of age.
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
