    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood and
      urine tests may be needed to check for unwanted effects. You may also need to
      have your eyes tested on a regular basis.
  - type: paragraph
    text: This medicine may add to the effects of alcohol and other CNS depressants
      (medicines that make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for hay fever, other allergies, or colds, sedatives,
      tranquilizers, or sleeping medicine, prescription pain medicine or narcotics,
      medicine for seizures or barbiturates, muscle relaxants, or anesthetics, including
      some dental anesthetics. Check with your doctor before taking any of the above
      while you are using quetiapine .
  - type: paragraph
    text: For some patients, this medicine can increase thoughts of suicide. Tell
      your doctor right away if you start to feel more depressed and have thoughts
      about hurting yourself. Report any unusual thoughts or behaviors that trouble
      you, especially if they are new or are getting worse quickly. Make sure the
      doctor knows if you have trouble sleeping, get upset easily, have a big increase
      in energy, or start to act reckless. Also tell the doctor if you have sudden
      or strong feelings, such as feeling nervous, angry, restless, violent, or scared.
      Let the doctor know if you or anyone in your family has bipolar disorder (manic-depressive
      illness) or has tried to commit suicide.
  - type: paragraph
    text: Quetiapine may cause drowsiness, trouble with thinking, trouble with controlling
      body movements, or trouble with your vision (especially during the first week
      of use), which may lead to falls, fractures, or other injuries. Do not drive
      or do anything else that could be dangerous until you know how this medicine
      affects you .
  - type: paragraph
    text: This medicine may increase the amount of sugar in your blood. Check with
      your doctor right away if you have increased thirst or urination. If you have
      diabetes, the results of your urine or blood sugar tests may change. Check your
      blood sugar closely and talk with your doctor if you have any questions.
  - type: paragraph
    text: Check with your doctor right away if you have convulsions (seizures), difficulty
      breathing, a fast heartbeat, high fever, high or low blood pressure, increased
      sweating, loss of bladder control, severe muscle stiffness, unusually pale skin,
      or tiredness. These could be symptoms of a serious condition called neuroleptic
      malignant syndrome (NMS).
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up suddenly from a lying or sitting position. Getting up slowly may help. If
      the problem continues or gets worse, check with your doctor.
  - type: paragraph
    text: 'Quetiapine can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. It can also lower the
      number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: This medicine may cause tardive dyskinesia (a movement disorder). Check
      with your doctor right away if you have lip smacking or puckering, puffing of
      the cheeks, rapid or worm-like movements of the tongue, uncontrolled chewing
      movements, or uncontrolled movements of the arms and legs.
  - type: paragraph
    text: Quetiapine may increase your cholesterol and fats in the blood. If this
      condition occurs, your doctor may give you medicine to lower the cholesterol
      and fats in the blood.
  - type: paragraph
    text: This medicine may increase your weight. Your doctor may need to check your
      weight on a regular basis while you are using this medicine.
  - type: paragraph
    text: You will need to have your blood pressure measured before starting this
      medicine and while you are using it. If you notice any changes to your recommended
      blood pressure, call your doctor right away. If you have questions about this,
      talk to your doctor.
  - type: paragraph
    text: This medicine can cause changes in your heart rhythm, such as a condition
      called QT prolongation. It may change the way your heart beats and cause fainting
      or serious side effects. Contact your doctor right away if you have symptoms
      of heart rhythm problems, such as a fast, pounding, or uneven heartbeat.
  - type: paragraph
    text: Quetiapine may make it more difficult for your body to cool down. It might
      reduce how much you sweat. Your body could get too hot if you do not sweat enough.
      If your body gets too hot, you might feel dizzy, weak, tired, or confused. You
      might vomit or have an upset stomach. Do not get too hot while you are exercising.
      Avoid places that are very hot. Call your doctor if you are too hot and can
      not cool down.
  - type: paragraph
    text: Do not suddenly stop taking this medicine without checking first with your
      doctor . Your doctor may want you to gradually reduce the amount you are using
      before stopping it completely. This will decrease the chance of having withdrawal
      symptoms such as nausea, vomiting, insomnia, dizziness, irritability, or headache.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are taking this medicine. The results of some tests (eg, urine drug screens)
      may be affected by this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - cold sweats
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - sleepiness or unusual drowsiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blurred vision
      - changes in patterns and rhythms of speech
      - chest pain
      - cough
