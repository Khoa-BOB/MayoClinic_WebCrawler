      - Amisulpride
      - Amitriptyline
      - Amoxapine
      - Anagrelide
      - Apalutamide
      - Apomorphine
      - Aripiprazole
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Atropine
      - Avacopan
      - Azithromycin
      - Bedaquiline
      - Belladonna
      - Benzhydrocodone
      - Benztropine
      - Biperiden
      - Boceprevir
      - Bromazepam
      - Brompheniramine
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Butalbital
      - Butorphanol
      - Cabergoline
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aprepitant
      - Fosaprepitant
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood vessel or circulation problems or
      - Dehydration or
      - Heart attack or stroke, history of or
      - Heart disease (eg, heart hypertrophy) or
      - Heart failure or
      - Heart rhythm problems (eg, QT prolongation), or
      - Hypotension (low blood pressure) or
      - Hypovolemia (low blood volume)—May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Bradycardia (slow heartbeat), history of or
      - Constipation or
      - Diabetes, or family history of or
      - Enlarged prostate or
      - Heart rhythm problem (eg, congenital long QT interval) or
      - Hyperglycemia (high blood sugar) or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood) or
      - Increased pressure in the eye or
      - Trouble urinating, or history of—May increase risk for more serious side effects.
    - type: list
      ordered: false
      items:
      - Breast cancer, prolactin dependent or
      - Cataracts or
      - Hyperlipidemia (high blood cholesterol or fats) or
      - Hyperprolactinemia (high prolactin in the blood) or
      - Hypertension (high blood pressure) or
      - Hypothyroidism (underactive thyroid) or
      - Liver disease or
      - Seizures, history of or
      - Trouble swallowing—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor to benefit your condition
      as much as possible. Do not take more of it, do not take it more often, and
      do not take it for a longer time than your doctor ordered.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow the instructions
      carefully. Read it again each time you refill your prescription in case there
      is new information. Ask your doctor if you have any questions.
  - type: paragraph
    text: Quetiapine tablets may be taken with or without food on a full or empty
      stomach. However, if your doctor tells you to take it a certain way, take it
      as directed.
  - type: paragraph
    text: Swallow the extended-release tablets whole. Do not break, crush, or chew
      it. It is best to take this medicine without food or with a light meal (approximately
      300 calories).
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets): For treatment of depression
        with bipolar disorder: Adults—At first, 50 milligrams (mg) once a day in the
        evening. Your doctor may adjust your dose as needed. However, the dose is
        usually not more than 300 mg per day. Children—Use and dose must be determined
        by the doctor. For treatment of mania with bipolar disorder: Adults—At first,
        300 milligrams (mg) once a day in the evening. Your doctor may adjust your
        dose as needed. However, the dose is usually not more than 800 mg per day.
        Children 10 to 17 years of age—At first, 50 mg once a day in the evening.
        Your doctor may adjust your dose as needed. However, the dose is usually not
        more than 600 mg per day. Children younger than 10 years of age—Use and dose
        must be determined by the doctor. For treatment of major depressive disorder
        (MDD): Adults—At first, 50 milligrams (mg) once a day in the evening. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than 300 mg per day. Children—Use and dose must be determined by the doctor.
        For treatment of schizophrenia: Adults—At first, 300 milligrams (mg) once
        a day in the evening. Your doctor may adjust your dose as needed. However,
        the dose is usually not more than 800 mg per day. Children 13 to 17 years
        of age—At first, 50 mg once a day in the evening. Your doctor may adjust your
        dose as needed. However, the dose is usually not more than 800 mg per day.
        Children younger than 13 years of age—Use and dose must be determined by the
        doctor.'
      - 'For oral dosage form (tablets): For treatment of depression with bipolar
        disorder: Adults—At first, 50 milligrams (mg) once a day at bedtime. Your
        doctor may adjust your dose as needed. However, the dose is usually not more
        than 300 mg per day. Children—Use and dose must be determined by the doctor.
        For treatment of mania with bipolar disorder: Adults—At first, 50 milligrams
        (mg) 2 times a day. Your doctor may adjust your dose as needed. However, the
        dose is usually not more than 800 mg per day. Children 10 to 17 years of age—At
