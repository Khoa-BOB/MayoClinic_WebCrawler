        not more than 750 mg per day. Children 13 to 17 years of age—At first, 25
        milligrams (mg) 2 times a day. Your doctor may adjust your dose as needed.
        However, the dose is usually not more than 800 mg per day. Children younger
        than 13 years of age—Use and dose must be determined by the doctor.'
