title: Scorpion (centruroides) immune f(ab)2 (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Anascorp
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Scorpion (Centruroides) immune F(ab)2 injection is used to treat scorpion
      stings. A scorpion sting may cause abnormal eye movements, increased watering
      of the mouth, loss of muscle control, shortness of breath, slurred speech, troubled
      breathing, or vomiting. This medicine is made from horse proteins that have
      been immunized with the scorpion’s venom.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of scorpion (Centruroides) immune
        F(ab)2 injection in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of scorpion (Centruroides) immune F(ab)2 injection have not been performed
        in the geriatric population, no geriatric-specific problems have been documented
        to date.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to horse protein or
      - Prior use of an antivenom containing horse protein���Use with caution. May
        increase the likelihood for an allergic reaction.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. This medicine is given through a needle placed in one of your
      veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your or your child's progress closely while you are
      receiving this medicine. This will allow your doctor to see if the medicine
      is working properly and to decide if you should continue to receive it.
  - type: paragraph
    text: This medicine may cause serious types of allergic reactions, including anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you or your child have a rash; itching; hoarseness;
      trouble breathing; trouble swallowing; or any swelling of your hands, face,
      or mouth while you are receiving this medicine.
  - type: paragraph
    text: Call your doctor or the emergency department right away if you or your child
      have a delayed allergic reaction or serum sickness, which may occur up to 14
      days after receiving this medicine . The symptoms may include a rash, itching
      skin, fever, general feeling of discomfort or illness, joint or muscle pain,
      unusual tiredness or weakness, or swollen, painful, or tender lymph glands in
      the neck, armpit, or groin.
  - type: paragraph
    text: This medicine is made from horse blood. Some horse blood products have transmitted
      certain viruses to people who have received them. The risk of getting a virus
      from medicines made from horse blood has been greatly reduced in recent years.
      This is the result of required testing of horses for certain viruses, and testing
      during the making of these medicines. Although the risk is low, talk with your
      doctor if you have concerns.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - confusion
      - cough
      - dizziness
      - fast heartbeat
      - feeling of discomfort
      - fever or chills
      - inflammation of the joints
      - itching
      - muscle aches
      - rash
      - shakiness and unsteady walk
      - shortness of breath
      - sneezing
      - sore throat
      - swelling of the eye
      - swollen lymph glands
      - tightness in the chest
      - troubled breathing
      - unsteadiness, trembling, or other problems with muscle control or coordination
      - weakness
      - wheezing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fast, irregular, pounding, or racing heartbeat or pulse
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - difficulty with moving
      - headache
      - joint pain
      - muscle cramping
      - muscle pains or stiffness
      - nausea
      - runny nose
      - swollen joints
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
