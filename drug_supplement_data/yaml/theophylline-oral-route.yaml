    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
      - food
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Cor pulmonale (heart condition) or
      - Fever of 102 degrees F or higher for 24 hours or more or
      - Hypothyroidism (underactive thyroid) or
      - Infection, severe (e.g., sepsis) or
      - Kidney disease in infants younger than 3 months of age or
      - Liver disease (e.g., cirrhosis, hepatitis) or
      - Pulmonary edema (lung condition) or
      - Shock (serious condition with very little blood flow in the body)—Use with
        caution. The effects may be increased because of slower removal of the medicine
        from the body.
    - type: list
      ordered: false
      items:
      - Heart rhythm problems (e.g., arrhythmia) or
      - Seizures, or history of or
      - Stomach ulcer—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it and do not take it more often than your doctor ordered. This medicine
      works best if there is a constant amount in the blood. To keep the blood level
      constant, take this medicine at the same time each day and do not miss any doses.
  - type: paragraph
    text: After you or your child begin taking theophylline, it is very important
      that your doctor check the level of the medicine in the blood at regular intervals
      to decide if the dose needs to be changed. Keep all appointments for testing
      the blood level.
  - type: paragraph
    text: Take the extended-release capsule or tablet every morning at the same time
      each day. You may take your second dose 10 to 12 hours after the morning dose
      and before the evening meal, unless your doctor tells you otherwise.
  - type: paragraph
    text: Swallow the extended-release tablet whole. Do not break, crush, or chew
      it. You may take  the extended-release tablet with or without food.
  - type: paragraph
    text: It is best to take the extended-release capsule one hour before a high-fat
      meal or without food.
  - type: paragraph
    text: Measure the oral liquid with a marked measuring spoon, oral syringe, or
      medicine cup. The average household teaspoon may not hold the right amount of
      liquid.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'To treat symptoms of asthma, bronchitis, and emphysema: For oral dosage form
        (elixir or tablets): Adults, teenagers, and children above 1 year of age weighing
        more than 45 kilograms (kg)—At first, 300 milligrams (mg) per day, divided
        and given every 6 to 8 hours. Your doctor may adjust your dose as needed.
        However, the total dose is usually not more than 600 mg per day. Older adults—The
        dose must be determined by your doctor. However, the total dose is usually
        not more than 400 milligrams per day, divided and given every 6 to 8 hours.
        Children and teenagers 1 to 15 years of age weighing less than 45 kilograms
        (kg)—Dose is based on body weight and must be determined by your doctor. At
        first, the dose is 12 to 14 milligrams (mg) per kg of body weight per day,
        divided and given every 4 to 6 hours. Your doctor may adjust your dose as
        needed. However, the total dose is usually not more than 20 mg per kg of body
        weight per day or 600 mg per day. Infants younger than 1 year of age—Dose
        is based on body weight and age and must be determined by your doctor. For
        oral dosage form (extended-release capsules): Adults, teenagers, and children
        12 years of age and older weighing more than 45 kilograms (kg)—At first, 300
        to 400 milligrams (mg) as a single dose, usually in the morning, or divided
        and given two times per day. Your doctor may adjust your dose as needed. However,
        the total dose is usually not more than 600 mg per day. Older adults—The dose
        must be determined by your doctor. However, the total dose is usually not
        more than 400 milligrams per day as a single dose, usually in the morning,
        or divided and given two times per day. Children and teenagers 12 to 15 years
        of age weighing less than 45 kilograms (kg)—Dose is based on body weight and
        must be determined by your doctor. At first, the dose is 12 to 14 milligrams
        (mg) per kg of body weight per day as a single dose, usually in the morning,
        or divided and given two times per day. Your doctor may adjust your dose as
        needed. However, the total dose is usually not more than 20 mg per kg of body
        weight per day or 600 mg per day. Children younger than 12 years of age—Use
        and dose must be determined by your doctor. For oral dosage form (extended-release
        tablets): Adults, teenagers, and children 6 years of age and older weighing
        more than 45 kilograms (kg)—At first, 300 milligrams (mg) per day, divided
        and given every 12 hours. Your doctor may adjust your dose as needed. However,
