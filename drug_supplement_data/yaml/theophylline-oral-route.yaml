    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child at regular visits , especially for the first few weeks after you begin
      using this medicine. Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: 'A change in your usual behavior or physical well-being may affect the way
      this medicine works in your body. Tell your doctor if you or your child :'
  - type: list
    ordered: false
    items:
    - Have had a fever of 102 degrees F or higher for at least 24 hours or more.
    - Have started or stopped smoking tobacco or marijuana in the last few weeks.
    - Have started or stopped taking another medicine in the last few weeks.
    - Have changed your diet in the last few weeks.
  - type: paragraph
    text: 'Stop using this medicine and check with your doctor right away if you or
      your child have the following symptoms while using this medicine: nausea or
      vomiting that continues, headaches, trouble with sleeping, seizures, or irregular
      heartbeats.'
  - type: paragraph
    text: Do not stop or change the dose of this medicine without checking first with
      your doctor.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you or your child are using this medicine. The results of some tests may be
      affected by this medicine.
  - type: paragraph
    text: This medicine may add to the central nervous system (CNS) stimulant effects
      of caffeine-containing foods or beverages such as chocolate, cocoa, tea, coffee,
      and cola drinks. Avoid eating or drinking large amounts of these foods or beverages
      while using this medicine. If you have questions about this, check with your
      doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      for appetite control, asthma, colds, cough, hay fever, or sinus problems, and
      herbal (e.g., St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or discomfort
      - dizziness
      - fainting
      - fast, slow, or irregular heartbeat
      - increase in urine volume
      - lightheadedness
      - persistent vomiting
      - pounding or rapid pulse
      - seizures
      - shakiness
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - blurred vision
      - confusion
      - confusion about identity, place, and time
      - dark-colored urine
      - decrease in frequency of urination
      - decreased urine
      - diarrhea
      - difficulty in passing urine (dribbling)
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dry mouth
      - fast, pounding, or irregular heartbeat or pulse
      - fever
      - increased thirst
      - irregular heartbeat
      - loss of appetite
      - mood changes
      - muscle cramps or spasms
      - muscle pain or stiffness
      - nausea or vomiting
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - pain or discomfort in the arms, jaw, back, or neck
      - painful urination
      - shakiness in the legs, arms, hands, or feet
      - shortness of breath
      - sweating
      - unusual tiredness or weakness
      - vomiting of blood or material that looks like coffee grounds
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - irritability
      - restlessness
      - sleeplessness
      - trouble sleeping
      - unable to sleep
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
