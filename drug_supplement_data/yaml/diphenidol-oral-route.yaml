title: Diphenidol (oral route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Diphenidol is used to relieve or prevent nausea, vomiting, and dizziness
      caused by certain medical problems.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: There is no specific information comparing use of diphenidol for dizziness
        in children with use in other age groups. Also, there is no specific information
        about the use of diphenidol for nausea and vomiting in children who weigh
        less than 22.8 kilograms (50 pounds).
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of diphenidol in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Enlarged prostate or
      - Glaucoma or
      - Intestinal blockage or
      - Low blood pressure or
      - Stomach ulcer—Diphenidol may make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Urinary tract blockage—Higher blood levels of diphenidol may occur, increasing
        the chance of side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: If you are taking diphenidol to prevent nausea and vomiting, it may be taken
      with food or a glass of water or milk to lessen stomach irritation, unless otherwise
      directed by your doctor. However, if you are already suffering from nausea and
      vomiting, it is best to keep the stomach empty, and this medicine should be
      taken only with a small amount of water.
  - type: paragraph
    text: Take this medicine only as directed. Do not take more of it and do not take
      it more often than directed by your doctor. To do so may increase the chance
      of side effects.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): Adults: 25 to 50 milligrams (mg) every four
        hours as needed. Children: The dose is based on body weight and must be determined
        by the doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults: 25 to 50 milligrams (mg) every four hours as needed.'
      - 'Children: The dose is based on body weight and must be determined by the
        doctor.'
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for hay fever, other allergies, or colds; sedatives,
      tranquilizers, or sleeping medicine; prescription pain medicine or narcotics;
      barbiturates; medicine for seizures; muscle relaxants; or anesthetics, including
      some dental anesthetics. Check with your doctor before taking any of the above
      while you are using this medicine.
  - type: paragraph
    text: This medicine may cause some people to have blurred vision or to become
      dizzy, drowsy, or less alert than they are normally. Make sure you know how
      you react to this medicine before you drive, use machines, or do anything else
      that could be dangerous if you are dizzy or are not alert or able to see well.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - hallucinations (seeing, hearing, or feeling things that are not there)
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Drowsiness (severe)
      - shortness of breath or trouble with breathing
      - unusual tiredness or weakness (severe)
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Drowsiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - dizziness
      - dry mouth
      - headache
      - heartburn
      - nervousness, restlessness, or trouble with sleeping
      - skin rash
      - stomach upset or pain
      - unusual tiredness or weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
