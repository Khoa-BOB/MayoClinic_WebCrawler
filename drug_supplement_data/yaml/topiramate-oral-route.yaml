    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If your next regular dose of Topamax® capsule or tablet or Eprontia® oral
        solution is within 6 hours away, wait until then to use the medicine and skip
        the missed dose.
    - type: paragraph
      text: If you miss more than 1 dose of Topamax® capsule or tablet or Eprontia®
        oral solution , contact your doctor for instructions about how to restart
        it.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away any unused Eprontia® oral solution 60 days after first opening.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to see if the medicine is working properly. Blood and urine
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: Birth control pills containing estrogen may not work properly if you take
      them with topiramate. To keep from getting pregnant, use an additional form
      of birth control (eg, condoms, spermicide) together with your birth control
      pill. If you have any questions about this, check with your doctor or pharmacist.
  - type: paragraph
    text: This medicine may cause vision changes, clumsiness or unsteadiness, dizziness,
      drowsiness, or trouble with thinking or speaking. Make sure you know how you
      or your child react to this medicine before you drive, use machines, climb in
      high places, swim, or do anything else that could be dangerous if you are not
      alert, well-coordinated, or able to think or see well .
  - type: paragraph
    text: Check with your doctor before using this medicine with alcohol or other
      medicines that affect the central nervous system . The use of alcohol or other
      medicines that affect the CNS with topiramate may worsen the side effects of
      this medicine, such as dizziness, poor concentration, drowsiness, unusual dreams,
      and trouble with sleeping. Some examples of medicines that affect the CNS are
      antihistamines or medicine for allergies or colds, sedatives, tranquilizers,
      or sleeping medicines, medicine for depression, medicine for anxiety, prescription
      pain medicine or narcotics, medicine for attention deficit and hyperactivity
      disorder, medicine for seizures or barbiturates, muscle relaxants, or anesthetics,
      including some dental anesthetics.
  - type: paragraph
    text: Check with your doctor right away if you or your child have changes in vision
      or pain around the eyes during and after treatment with this medicine. Your
      doctor may want your eyes to be checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: This medicine may make you sweat less which will cause your body temperature
      to increase. Use extra care not to become overheated during exercise or hot
      weather with this medicine. Overheating may result in heat stroke and hot baths
      or saunas may make you dizzy or feel faint.
  - type: paragraph
    text: Topiramate may cause some people to be agitated, irritable, or display other
      abnormal behaviors. It may also cause some people to have suicidal thoughts
      and tendencies or to become more depressed. Make sure the doctor knows if you
      have trouble sleeping, get upset easily, have a big increase in energy, or start
      to act reckless. Also tell the doctor if you have sudden or strong feelings,
      such as feeling nervous, angry, restless, violent, or scared. If you, your child,
      or your caregiver notice any of these side effects, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause nausea, muscle tremors, breathing problems, eating
      problems, a fast heartbeat, restlessness, and stomach pain. Tell your doctor
      right away if you or your child have any of these symptoms. You might have a
      serious condition called metabolic acidosis (too much acid in the blood).
  - type: paragraph
    text: This medicine may decrease the density of bones, which can make your bones
      weak. Talk with your doctor if you have any concerns about this.
  - type: paragraph
    text: This medicine may cause slow growth. For children, the doctor will need
      to keep track of height and weight to make sure that the child is growing properly.
  - type: paragraph
    text: Do not suddenly stop using this medicine without checking first with your
      doctor . Stopping the medicine suddenly may cause your seizures to return or
      to occur more often. Your doctor may want you or your child to gradually reduce
      the amount you are using before stopping it completely.
  - type: paragraph
    text: Serious skin reactions (eg, Stevens-Johnson syndrome, toxic epidermal necrolysis)
      can occur with Topamax® , Trokendi XR® , and Eprontia® . Check with your doctor
      right away if you have blistering, peeling, or loosening of the skin, chills,
      cough, diarrhea, itching, joint or muscle pain, red irritated eyes, red skin
      lesions, often with a purple center, sore throat, sores, ulcers, or white spots
      in the mouth or on the lips, or unusual tiredness or weakness with this medicine.
  - type: paragraph
    text: Check with your doctor right away if you or your child are having unusual
      drowsiness, dullness, tiredness, weakness, feelings of sluggishness, mental
      depression or anxiety, nightmares or unusually vivid dreams, or vomiting. These
      may be symptoms of a serious condition called hyperammonemic encephalopathy.
  - type: paragraph
    text: Check with your doctor right away if you or your child have sudden back
      pain, stomach pain, pain while urinating, or bloody or dark urine. These may
      be symptoms of kidney stones.
  - type: paragraph
    text: Tell your doctor if your or your child's skin feels like it is burning,
      crawling, itching, or if you have numbness, prickling, "pins and needles", or
      tingling feeling after using topiramate.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - burning, prickling, or tingling sensations
      - clumsiness or unsteadiness
      - confusion
      - continuous, uncontrolled back-and-forth or rolling eye movements
      - dizziness
      - double vision
      - drowsiness
      - eye redness or pain
      - generalized slowing of mental and physical activity
      - increased eye pressure
      - memory problems
      - menstrual changes or pain
      - nervousness
      - speech or language problems
      - trouble in concentrating or paying attention
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Aggression
      - agitation
      - chest pain
      - chills
      - discouragement
      - feeling sad or empty
      - fever
      - irritability
      - lack of feeling or emotion
      - lessening of sensations or perception
      - loss of appetite
      - loss of interest or pleasure
      - red, irritated, or bleeding gums
      - sore throat
      - stomach pain
      - trouble sleeping
      - weight loss
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blood in the urine
      - difficult or painful urination
      - frequent urination
      - hearing loss
      - itching, skin rash
      - loss of bladder control
      - lower back or side pain
      - nosebleeds
      - pale skin
      - ringing or buzzing in the ears
      - swelling
      - trouble breathing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - bloating
      - bone fractures, especially of the thigh bone
      - bone pain, tenderness, or aching
      - clay-colored stools
      - constipation
      - cough
      - decrease in height
      - diarrhea
      - increased rate of breathing
      - joint or muscle pain
      - muscle weakness
      - pain in the back, ribs, arms, or legs
      - pain or tenderness in the upper stomach
      - red skin lesions, often with a purple center
      - sores, ulcers, or white spots in the mouth or on the lips
      - yellow eyes or skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased awareness or responsiveness
      - dizziness, fainting, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - severe sleepiness
      - unusual drowsiness, dullness, or feeling of sluggishness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Breast pain in women
      - tremors
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - feeling of warmth
      - heartburn
      - increased sweating
      - redness of the face, neck, arms, and occasionally, upper chest
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decrease in sexual performance or desire
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
