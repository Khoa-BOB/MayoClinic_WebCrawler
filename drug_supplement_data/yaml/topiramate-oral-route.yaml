title: Topiramate (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Eprontia
    - type: paragraph
      text: Qudexy XR
    - type: paragraph
      text: Topamax
    - type: paragraph
      text: Topiragen
    - type: paragraph
      text: Trokendi XR
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Topiramate is used alone or together with other medicines to help treat
      certain types of seizures (eg, partial seizures, tonic-clonic seizures, or Lennox-Gastaut
      syndrome). This medicine will not cure epilepsy and will only work to control
      seizures for as long as you continue to take it. It is also used to help prevent
      migraine headaches.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Capsule, Extended Release
    - Solution
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of topiramate capsules, oral solution, or tablets , or Qudexy®
        extended-release capsules to treat seizures in children younger than 2 years
        of age (when used alone or together with other medicines). However, children
        are more likely to have unwanted effects (eg, rickets, slow growth, and increased
        risk of kidney stones) to this medicine. Safety and efficacy have not been
        established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Trokendi XR® extended-release capsules for the treatment
        of seizures in children younger than 6 years of age.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of topiramate capsules, extended-release capsules, tablets,
        or oral solution for the prevention of migraine headaches in children younger
        than 12 years of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of topiramate have not been performed in the geriatric population, geriatric-specific
        problems are not expected to limit the usefulness of topiramate in the elderly.
        However, elderly patients are more likely to have age-related kidney problems,
        which may require caution and an adjustment in the dose for patients receiving
        topiramate.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
      - Ranolazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acepromazine
      - Acetazolamide
      - Alfentanil
      - Alprazolam
      - Amitriptyline
      - Amlodipine
      - Amobarbital
      - Anileridine
      - Apixaban
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Asenapine
      - Atogepant
      - Baclofen
      - Benperidol
      - Benzhydrocodone
      - Brinzolamide
      - Bromazepam
      - Buprenorphine
      - Buspirone
      - Butabarbital
      - Butalbital
      - Butorphanol
      - Calcifediol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Cariprazine
      - Carisoprodol
      - Carphenazine
      - Cetirizine
      - Chloral Hydrate
      - Chlordiazepoxide
      - Chlorpromazine
      - Chlorzoxazone
      - Citalopram
      - Clobazam
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Ginkgo
      - Phenobarbital
      - Posaconazole
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bone problems (eg, osteoporosis, osteomalacia, osteopenia) or
      - Depression, history of or
      - Eye or vision problems (eg, glaucoma) or
      - Mood disorder, history of or
      - Metabolic acidosis (too much acid in the blood), or history of—Use with caution.
        May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Diarrhea or
      - Lung or breathing problems or
      - Patients on ketogenic diet or
      - Status epilepticus (prolonged seizure)—May increase risk for metabolic acidosis.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Patients with metabolic acidosis who are also taking metformin—Should not
        be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Patients undergoing hemodialysis—Use with caution. The effects of Topamax®,
        Trokendi XR®, or Eprontia® may be lessened because of its faster removal from
        the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not use more of
      it, do not use it more often, and do not use it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Topiramate may be taken with or without food.
  - type: paragraph
    text: Swallow the Trokendi XR® extended-release capsule whole. Do not open, crush,
      chew, or sprinkle on food.
  - type: paragraph
    text: Measure the Eprontia® oral solution with a marked measuring spoon, oral
      syringe, or medicine cup.
  - type: paragraph
    text: Avoid drinking alcohol with Eprontia®, Qudexy® XR, or Topamax® , or avoid
      for 6 hours before and 6 hours after taking the Trokendi XR® capsule .
  - type: paragraph
    text: Swallow the tablet whole. Do not break, crush, or chew it. The tablet may
      taste bitter if it is held in the mouth or chewed.
  - type: paragraph
    text: The Topamax® sprinkle capsule or Qudexy® XR extended-release capsule may
      be swallowed whole or opened and sprinkled on a small amount (1 teaspoon) of
      soft food (eg, applesauce). Swallow the food mixture right away without chewing.
      Do not save for later use.
  - type: paragraph
    text: Drink extra water with this medicine to help prevent kidney stones.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release capsules): For seizures (taken with
        other medicines): Adults—At first, 25 to 50 milligrams (mg) once a day. Your
        doctor may adjust the dose as needed. However, the dose is usually not more
        than 400 mg per day. Children— Qudexy®: Children 2 years of age and older—Dose
        is based on body weight and must be determined by your doctor. The usual starting
        dose is 25 milligrams (mg) once a day in the evening. Your doctor may adjust
        the dose as needed. However, the dose is usually not more than 5 to 9 mg per
        kilogram (kg) of body weight per day. Children younger than 2 years of age—Use
        is not recommended. Trokendi XR®: Children 6 to 16 years of age and older—At
        first, 25 mg once a day in the evening. Your doctor may adjust the dose as
        needed. However, the dose is usually not more than 5 to 9 mg per kilogram
        (kg) of body weight per day. Children younger than 6 years of age—Use is not
        recommended. For seizures (taken alone): Qudexy®: Adults and children 10 years
        of age and older—At first, 50 milligrams (mg) once a day. Your doctor may
        increase the dose as needed. However, the dose is usually not more than 400
        mg per day. Children 2 to 10 years of age—Dose is based on body weight and
        must be determined by your doctor. The starting dose is usually 25 mg once
        a day, in the evening. Your doctor may increase the dose as needed and tolerated.
        However, the dose is usually not more than 400 mg per day. Children younger
        than 2 years of age—Use and dose must be determined by your doctor. Trokendi
        XR®: Adults and children 10 years of age and older—At first, 50 milligrams
        (mg) once a day. Your doctor may increase the dose each week until it reaches
        400 mg once a day. The dose is usually not more than 400 mg once a day. Children
