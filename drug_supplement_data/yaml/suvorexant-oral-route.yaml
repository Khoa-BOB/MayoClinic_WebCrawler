title: Suvorexant (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Belsomra
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Suvorexant is used to treat insomnia (trouble sleeping). It belongs to the
      group of medicines called central nervous system (CNS) depressants. These medicines
      will slow down the nervous system. Suvorexant will help you get to sleep faster
      and sleep through the night. In most cases, sleep medicines should only be used
      for short periods of time, such as 1 or 2 days, and for no longer than 1 or
      2 weeks.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of suvorexant in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of suvorexant in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Colchicine
      - Isocarboxazid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Alfentanil
      - Alprazolam
      - Apalutamide
      - Aprepitant
      - Atazanavir
      - Avacopan
      - Benzhydrocodone
      - Boceprevir
      - Bromazepam
      - Buprenorphine
      - Butalbital
      - Butorphanol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Cetirizine
      - Ciprofloxacin
      - Clarithromycin
      - Clobazam
      - Clomipramine
      - Clonazepam
      - Cobicistat
      - Codeine
      - Conivaptan
      - Crizotinib
      - Cyclobenzaprine
      - Cyclosporine
      - Cyproheptadine
      - Dabigatran Etexilate
      - Daridorexant
      - Dexmedetomidine
      - Dihydrocodeine
      - Diltiazem
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Dronedarone
      - Ensartinib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Tizanidine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse, history of or
      - Drug abuse, history of—Dependence on suvorexant may be more likely to develop.
    - type: list
      ordered: false
      items:
      - Breathing or lung problems (eg, COPD, sleep apnea) or
      - Cataplexy (sudden onset of muscle weakness), history of or
      - Depression, history of or
      - Mental illness, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Narcolepsy (uncontrollable desire for sleep or a sudden attack of deep sleep)—Should
        not be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Obese patients (especially in obese women)—Use with caution. The effects may
        be increased because of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. If too much is taken, it may become habit-forming (causing mental
      or physical dependence).
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Take suvorexant within 30 minutes before going to bed, when you are ready
      to go to sleep. This medicine works very quickly to put you to sleep.
  - type: paragraph
    text: This medicine should not be taken with food or right after a meal. It will
      work faster if you take it on an empty stomach. However, if your doctor tells
      you to take the medicine a certain way, take it exactly as directed.
  - type: paragraph
    text: Do not take this medicine when your schedule does not permit you to get
      a full night's sleep (at least 7 hours) . If you must wake up before this, you
      may continue to feel drowsy and may experience memory problems, because the
      effects of the medicine have not had time to wear off.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of insomnia: Adults—10 milligrams
        (mg) at bedtime. Your doctor may increase your dose as needed. However, the
        dose is usually not more than 20 mg per day. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of insomnia: Adults—10 milligrams (mg) at bedtime. Your doctor
        may increase your dose as needed. However, the dose is usually not more than
        20 mg per day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—10 milligrams (mg) at bedtime. Your doctor may increase your dose as
        needed. However, the dose is usually not more than 20 mg per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: Use this medicine only when you cannot sleep. You do not need to keep
        a regular schedule for taking it.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Protect the tablets from moisture and do not remove from the blister pack
        until you are ready to use them.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: If you think you need to take suvorexant for more than 7 to 10 days, be
      sure to discuss it with your doctor. Insomnia that lasts longer than this may
      be a sign of another medical problem.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for hay fever, other allergies, or colds, sedatives,
      tranquilizers, or sleeping medicine, prescription pain medicine or narcotics,
      medicine for seizures or barbiturates, muscle relaxants, or anesthetics, including
      some dental anesthetics. Check with your doctor before taking any of the above
      while you are using this medicine .
  - type: paragraph
    text: This medicine may cause some people to become drowsy or less alert than
      they are normally. Even though suvorexant is taken at bedtime, it may cause
      some people to feel drowsy or less alert on arising. Make sure you know how
      you react to suvorexant before you drive, use machines, or do anything else
      that could be dangerous if you are not alert .
  - type: paragraph
    text: If you develop any unusual and strange thoughts or behavior while you are
      taking suvorexant, be sure to discuss it with your doctor. Some changes that
      have occurred in people taking this medicine are like those seen in people who
      drink alcohol and then act in a manner that is not normal. Other changes may
      be more unusual and extreme, such as confusion, worsening of depression, hallucinations
      (seeing, hearing, or feeling things that are not there), suicidal thoughts,
      and unusual excitement, nervousness, or irritability.
  - type: paragraph
    text: This medicine may cause you to do things while you are still asleep that
      you may not remember the next morning. You could drive a car, sleepwalk, have
      sex, make phone calls, or prepare and eat food while you are asleep or not fully
      awake. Tell your doctor right away if any of these things occur.
  - type: paragraph
    text: This medicine may cause sleep paralysis (temporary inability to move or
      talk for up to several minutes while you are going to sleep or wake up) or have
      cataplexy-like symptoms (temporary weakness in your legs). Tell your doctor
      right away if you have these symptoms while you are using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sleepiness or unusual drowsiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Unusual or abnormal dreams
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in behavior
      - discouragement
      - fear or nervousness
      - feeling sad or empty
      - irritability
      - lack of appetite
      - loss of interest or pleasure
      - loss of memory
      - problems with memory
      - seeing, hearing, or feeling things that are not there
      - temporary inability to move or talk for up to several minutes while you are
        going to sleep or wake up
      - temporary weakness in your legs
      - thoughts of killing oneself
      - tiredness
      - trouble concentrating
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - chills
      - cough
      - diarrhea
      - difficulty with breathing
      - dizziness
      - dry mouth
      - ear congestion
      - fever
      - loss of voice
      - nasal congestion
      - runny nose
      - sneezing
      - sore throat
      - unusual tiredness or weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
