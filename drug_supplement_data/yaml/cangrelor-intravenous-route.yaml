title: Cangrelor (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Kengreal
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cangrelor injection is used in patients undergoing percutaneous coronary
      intervention (PCI) to lower the risk of blood clots and heart attack.
  - type: paragraph
    text: A heart attack or stroke may occur when a blood vessel in the heart or brain
      is blocked by a blood clot. Cangrelor reduces the chance that a harmful blood
      clot will form by preventing certain cells in the blood from clumping together.
      This effect of cangrelor may also increase the chance of serious bleeding in
      some people.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of cangrelor injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of cangrelor injection in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Abrocitinib
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aceclofenac
      - Acemetacin
      - Acenocoumarol
      - Amtolmetin Guacil
      - Apixaban
      - Argatroban
      - Betrixaban
      - Bivalirudin
      - Bromfenac
      - Bufexamac
      - Caplacizumab-yhdp
      - Celecoxib
      - Choline Salicylate
      - Citalopram
      - Clonixin
      - Clopidogrel
      - Dabigatran Etexilate
      - Danaparoid
      - Desirudin
      - Desvenlafaxine
      - Dexibuprofen
      - Dexketoprofen
      - Diclofenac
      - Diflunisal
      - Dipyrone
      - Droxicam
      - Duloxetine
      - Edoxaban
      - Escitalopram
      - Etodolac
      - Etofenamate
      - Etoricoxib
      - Felbinac
      - Fenoprofen
      - Fepradinol
      - Feprazone
      - Floctafenine
      - Flufenamic Acid
      - Fluoxetine
      - Flurbiprofen
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding, active—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. This medicine is given through a needle placed in one of your
      veins. It is given before the start of PCI.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you closely while you are receiving
      this medicine . This will allow your doctor to see if the medicine is working
      properly and to check for unwanted effects. Blood tests may be needed to check
      for unwanted effects.
  - type: paragraph
    text: This medicine may increase your chance of bleeding and bruising. Check with
      your doctor right away if you notice any unusual bleeding or bruising, black,
      tarry stools, blood in the urine or stools, or pinpoint red spots on your skin.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain or swelling
      - back pain
      - black, tarry stools
      - blood in the eyes
      - blood in the urine
      - bruising or purple areas on the skin
      - coughing up blood
      - decreased alertness
      - dizziness
      - headache
      - joint pain or swelling
      - nosebleeds
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficult or labored breathing
      - tightness in the chest
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - difficulty with swallowing
      - fast heartbeat
      - hives, itching, or rash
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - noisy breathing
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - unusual tiredness or weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
