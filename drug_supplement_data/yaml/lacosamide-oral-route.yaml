    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Do not freeze the oral liquid . Throw away any unused medicine after 6
        months of first opening the bottle.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: If you or your child develop any unusual or strange thoughts and behavior
      while taking lacosamide, be sure to discuss it with your doctor. Some changes
      that have occurred in people taking this medicine are like those seen in people
      who drink too much alcohol. Other changes might be confusion, worsening of depression,
      hallucinations (seeing, hearing, or feeling things that are not there), suicidal
      thoughts, and unusual excitement, nervousness, or irritability.
  - type: paragraph
    text: This medicine may cause blurred vision, double vision, clumsiness, unsteadiness,
      dizziness, drowsiness, sleepiness, or trouble with thinking. Do not drive or
      do anything else that could be dangerous until you know how this medicine affects
      you . If these side effects are especially bothersome, check with your doctor.
  - type: paragraph
    text: This medicine can cause changes in heart rhythms, including a condition
      called PR prolongation. It may change the way your heart beats and cause lightheadedness,
      fainting, or serious side effects in some patients. Contact your doctor right
      away if you have any symptoms of heart rhythm problems, including a fast, slow,
      or irregular heartbeat.
  - type: paragraph
    text: Do not stop taking this medicine without first checking with your doctor
      . Stopping the medicine suddenly may cause your seizures to return or to occur
      more often. Your doctor may want you to gradually reduce the amount you are
      using before stopping it completely.
  - type: paragraph
    text: Lacosamide may cause a condition called drug reaction with eosinophilia
      and systemic symptoms (DRESS), which is a serious allergic reaction affecting
      multiple body organs (eg, liver or kidney). Check with your doctor right away
      if you have fever, dark urine, headache, rash, stomach pain, swollen, painful,
      or tender lymph glands in the neck, armpit, or groin, unusual tiredness, or
      yellow eyes or skin.
  - type: paragraph
    text: Breastfeeding during treatment with this medicine may cause your baby to
      be more sleepy. Talk with your doctor if you have concerns.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - false or unusual sense of well-being
      - shakiness and unsteady walk
      - sleepiness or unusual drowsiness
      - trembling or shaking of the hands or feet
      - unsteadiness, trembling, or other problems with muscle control or coordination
