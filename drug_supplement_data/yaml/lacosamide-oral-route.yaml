title: Lacosamide (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Motpoly XR
    - type: paragraph
      text: Vimpat
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Lacosamide is used to treat partial-onset seizures. It is also used with
      other medicines to treat primary generalized tonic-clonic seizures. It acts
      on the central nervous system (CNS) to reduce the number and severity of seizures.
      However, this medicine cannot cure epilepsy and will only work to control seizures
      for as long as you continue to take it.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Solution
    - Capsule, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Motpoly XR® in children weighing less than 50 kilograms
        (kg). Safety and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Vimpat® in children younger than 4 years of age to treat
        primary generalized tonic-clonic seizures and in children younger than 1 month
        of age to treat partial-onset seizures . Safety and efficacy have not been
        established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of lacosamide in the elderly. However,
        elderly patients are more likely to have age-related liver, kidney, or heart
        problems, which may require caution and an adjustment in the dose for patients
        receiving lacosamide.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acebutolol
      - Acecainide
      - Acepromazine
      - Ajmaline
      - Alfentanil
      - Alprazolam
      - Amiodarone
      - Amitriptyline
      - Amlodipine
      - Amobarbital
      - Anileridine
      - Aprindine
      - Aranidipine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Asenapine
      - Atazanavir
      - Atenolol
      - Baclofen
      - Benperidol
      - Benzhydrocodone
      - Bepridil
      - Betaxolol
      - Bisoprolol
      - Bretylium
      - Bromazepam
      - Buprenorphine
      - Buspirone
      - Butabarbital
      - Butorphanol
      - Calcifediol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbinoxamine
      - Carisoprodol
      - Carphenazine
      - Carteolol
      - Carvedilol
      - Celiprolol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Brugada syndrome (genetic disease) or
      - Depression, history of or
      - Drug or alcohol abuse or dependence, history of or
      - Heart attack or
      - Heart block or
      - Heart disease (eg, heart failure, myocardial ischemia) or
      - Heart rhythm problems (eg, prolonged PR interval) or
      - Mental illness, history of or
      - Sick sinus syndrome (type of abnormal heart rhythm), without pacemaker—Use
        with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Diabetic neuropathy (nerve problem caused by diabetes) or
      - Heart or blood vessel disease—May increase risk for more serious side effects.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease, mild to moderate—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Should not be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Phenylketonuria (PKU)—The oral liquid contains aspartame (a source of phenylalanine),
        which can make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the tablet or the extended-release capsule whole with liquid. Do
      not open, crush, break, or chew it.
  - type: paragraph
    text: Measure the oral liquid with a marked measuring spoon, oral syringe, or
      medicine cup. The average household teaspoon may not hold the right amount of
      liquid.
  - type: paragraph
    text: The oral liquid may also be given using a nasogastric tube or gastrostomy
      tube.
  - type: paragraph
    text: Lacosamide may be used together with other seizure medicines. Keep using
      all of your medicines unless your doctor tells you to stop.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (solution and tablets): For partial-onset seizures
        or primary generalized tonic-clonic seizures: For patients taking lacosamide
        alone: Adults and children 17 years of age and older—At first, 100 milligrams
        (mg) 2 times a day. Some patients may have a starting dose of 200 mg taken
        as a single dose, followed approximately 12 hours later by 100 mg 2 times
        a day. Your doctor will slowly increase your dose as needed and tolerated.
        However, the dose is usually not more than 400 mg per day. Children 4 to 16
        years of age—Dose is based on body weight and must be determined by your doctor.
        Weighing 50 kilograms (kg) or more—At first, 50 milligrams (mg) 2 times a
        day. Your doctor will slowly increase your dose as needed and tolerated. However,
        the dose is usually not more than 400 mg per day. Weighing 30 kg to less than
        50 kg—At first, 1 milligram per kilogram (mg/kg) body weight 2 times a day.
        Your doctor will slowly increase your dose as needed and tolerated. However,
        the dose is usually not more than 8 mg/kg body weight per day. Weighing 6
        kg to less than 30 kg—At first, 1 milligram per kilogram (mg/kg) body weight
        2 times a day. Your doctor will slowly increase your dose as needed and tolerated.
        However, the dose is usually not more than 12 mg/kg body weight per day. Weighing
        less than 6 kg—At first, 1 milligram per kilogram (mg/kg) body weight 2 times
        a day. Your doctor will slowly increase your dose as needed and tolerated.
        However, the dose is usually not more than 15 mg/kg body weight per day. Children
        younger than 4 years of age—Use and dose must be determined by your doctor.
        For patients switching from other seizure medicines: Adults and children 17
        years of age and older—At first, 150 to 200 milligrams (mg) 2 times a day.
        Children younger than 17 years of age—Use and dose must be determined by your
        doctor. For patients who are taking lacosamide together with other seizures
        medicines: Adults and children 17 years of age and older—At first, 50 milligrams
