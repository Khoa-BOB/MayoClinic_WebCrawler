title: Trastuzumab-dkst (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ogivri
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Trastuzumab-dkst injection is used alone or together with other cancer medicines
      (eg, carboplatin, cyclophosphamide, docetaxel, doxorubicin, paclitaxel) to treat
      HER2-overexpressing new or metastatic (cancer that has spread) breast cancer.
  - type: paragraph
    text: Trastuzumab-dkst injection is also used in combination with cisplatin and
      capecitabine or 5-fluorouracil to treat HER2-overexpressing metastatic (cancer
      that has spread) stomach and gastroesophageal (stomach and esophagus) cancer.
  - type: paragraph
    text: Trastuzumab-dkst prevents the growth of some tumors that produce extra amounts
      of a certain substance known as the HER2 protein. It should only be used in
      patients whose tumors have been shown to produce extra amounts of this protein
      (HER2 overexpression) .
  - type: paragraph
    text: Trastuzumab-dkst is a monoclonal antibody. It interferes with the growth
      of cancer cells, which are eventually destroyed by the body. Since the growth
      of normal body cells may also be affected by trastuzumab-dkst, other effects
      will also occur. Some of these may be serious and must be reported to your doctor.
      Other effects, such as a skin rash, may not be serious but may cause concern.
      Some effects do not occur until months or years after the medicine is used.
  - type: paragraph
    text: This medicine is to be given only by or under the immediate supervision
      of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of trastuzumab-dkst injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of trastuzumab-dkst injection in
        the elderly. However, elderly patients are more likely to have age-related
        heart problems, which may require caution in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Daunorubicin
      - Daunorubicin Citrate Liposome
      - Daunorubicin Liposome
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Ebola Zaire Vaccine, Live
      - Epirubicin
      - Idarubicin
      - Influenza Virus Vaccine, Live
      - Pirarubicin
      - Pixantrone
      - Rotavirus Vaccine, Live
      - Valrubicin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Heart disease (eg, cardiomyopathy) or
      - Heart rhythm problems (eg, arrhythmia) or
      - Hypertension (high blood pressure) or
      - Lung disease (eg, interstitial pneumonitis, pulmonary fibrosis)—Use with caution.
        May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine.
      It is given through a needle placed into one of your veins. It must be given
      slowly, so the needle should remain in place for at least 30 to 90 minutes.
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: This medicine needs to be given on a fixed schedule. If you miss a dose,
        call your doctor, home health caregiver, or treatment clinic for instructions.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant during treatment
      with this medicine and for 7 months after the last dose. If you think you have
      become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: Your doctor may test your heart before you start receiving trastuzumab-dkst
      injection and while you are getting treatments with this medicine. Contact your
      doctor right away if you experience any chest pain, increased coughing, trouble
      with breathing, a sudden difficulty with breathing at night, rapid weight gain,
      or abnormal swelling in your ankles or legs. These could be symptoms of a serious
      heart problem.
  - type: paragraph
    text: This medicine may cause infusion-related reactions, which can be life-threatening
      and require immediate medical attention. Tell your doctor right away if you
      start to have a fever, chills or shaking, dizziness, trouble breathing, itching
      or rash, or lightheadedness or fainting after receiving this medicine.
  - type: paragraph
    text: Serious lung or breathing problems may occur after you receive this medicine.
      Call your doctor right away if have changes in your breathing, chest tightness,
      or any type of breathing problem.
  - type: paragraph
    text: Trastuzumab-dkst can temporarily lower the number of some types of blood
      cells in your body. Because of this, you may bleed or get infections more easily.
      To help with these problems, avoid being near people who are sick or have infections.
      Wash your hands often. Stay away from rough sports or other situations where
      you could be bruised, cut, or injured. Brush and floss your teeth gently. Be
      careful when using sharp objects, including razors and fingernail clippers.
  - type: paragraph
    text: Do not use an anthracycline medicine for up to 7 months after stopping treatment
      with medicines containing trastuzumab.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - chest pain
      - chills
      - cough
      - cracked lips
      - decreased frequency or amount of urine
      - diarrhea
      - difficult or labored breathing
      - difficulty in swallowing
      - dry mouth
      - fever
      - headache
      - hoarseness
      - increased blood pressure
      - increased thirst
      - irregular heartbeat
      - loss of appetite
      - lower back or side pain
      - mood changes
      - muscle aches, pain, or cramps
      - nausea
      - numbness or tingling in the hands, feet, or lips
      - painful or difficult urination
      - pale skin
      - peeling of the skin
      - pinpoint red spots on the skin
      - seizures
      - sore throat
      - sores, ulcers, or white spots on the lips, tongue, or inside the mouth
      - stuffy or runny nose
      - swelling of the face, fingers, or lower legs
      - swollen glands
      - tightness in the chest
      - troubled breathing
      - troubled breathing with exertion
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
      - weight gain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody nose
      - blurred vision
      - body aches or pain
      - burning or stinging of the skin
      - cloudy urine
      - dilated neck veins
      - dizziness
      - ear congestion
      - extreme tiredness or weakness
      - fainting
      - fast, irregular, pounding, or racing heartbeat or pulse
      - frequent urge to urinate
      - general feeling of discomfort or illness
      - irregular breathing
      - joint pain
      - loss of voice
      - nasal congestion
      - nervousness
      - pain or tenderness around the eyes and cheekbones
      - painful cold sores or blisters on the lips, nose, eyes, or genitals
      - pounding in the ears
      - shivering
      - sneezing
      - sweating
      - trouble sleeping
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest discomfort
      - hives, itching, skin rash
      - joint stiffness or swelling
      - neck tenderness or swelling
      - redness of the skin
      - tightness in the chest
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - difficulty in moving
      - feeling of warmth
      - muscle stiffness
      - redness of the face, neck, arms and occasionally, upper chest
      - sudden sweating
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acne
      - back pain
      - belching
      - bone pain
      - constipation
      - discoloration of the fingernails or toenails
      - heartburn
      - indigestion
      - lack or loss of strength
      - muscle spasm
      - stomach upset or pain
      - upper stomach pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
