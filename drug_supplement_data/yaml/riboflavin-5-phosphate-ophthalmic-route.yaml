title: Riboflavin 5-phosphate (ophthalmic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Epioxa/Epioxa HD
    - type: paragraph
      text: Photrexa
    - type: paragraph
      text: Photrexa Viscous
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Riboflavin 5-Phosphate eye drops is a photoenhancer used in combination
      with the KXL® System or O 2 n™ System and Boost Goggles® in corneal collagen
      cross-linking for the treatment of progressive keratoconus and corneal ectasia
      following refractive surgery. Keratoconus is a degenerative eye disease that
      cause progressive thinning and distortion of the cornea.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Photrexa® or Photrexa® Viscous in children younger than
        14 years of age. Safety and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Epioxa™ or Epioxa™ HD in children younger than 13 years
        of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of riboflavin 5-phosphate eye drops in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Aphakia (no lens in the eyes) or
      - Pseudophakia (have artificial lens in the eyes)—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Eye or corneal problems (eg, keratitis, herpetic keratitis), or history of—Use
        with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given as eye drops and must be used with the KXL® System or
      O2n System and Boost Goggles only. Your doctor will perform an eye procedure
      after you receive this medicine.
  - type: paragraph
    text: Do not rub your eyes for the first 5 days after your eye procedure.
  - type: paragraph
    text: If the bandage contact lens that was placed on your eye falls out or becomes
      dislodged, do not replace it and call your doctor right away.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your progress closely while you are receiving this
      medicine . This will allow your doctor to see if the medicine is working properly
      and to check for unwanted effects.
  - type: paragraph
    text: Contact your doctor right away if you have severe eye pain or if you notice
      any sudden change in your vision after receiving this medicine.
  - type: paragraph
    text: This medicine may cause your eyes to become more sensitive to light than
      they are normally. Wearing sunglasses and avoiding too much exposure to bright
      light may help lessen the discomfort.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blindness
      - blurred vision
      - change in color vision
      - decreased vision
      - difficulty seeing at night
      - eye pain, irritation or redness, or inflammation
      - feeling of having something in the eye
      - increased sensitivity of the eyes to sunlight
      - painful irritation of the clear front part of the eye
      - redness of the white part of eyes or inside of eyelids
      - swelling of the eyelids
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Drainage from the eyes
      - eye discomfort
      - seeing flashes or sparks of light
      - seeing floating spots before the eyes, or a veil or curtain appearing across
        part of vision
      - sensitivity of the eyes to light
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry eyes
      - headache
      - watering of the eyes
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Double vision
      - redness, swelling, or itching of the eyelid
      - seeing double
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
