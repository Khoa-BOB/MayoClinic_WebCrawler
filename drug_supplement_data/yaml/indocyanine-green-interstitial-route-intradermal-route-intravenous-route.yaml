title: Indocyanine green (interstitial route, intradermal route, intravenous route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Indocyanine green injection is used to help diagnose or find problems in
      your blood vessels, blood flow and tissue perfusion before, during, and after
      a surgery or transplant, bile ducts, eyes during medical procedures (eg, ophthalmic
      angiography), or lymph nodes and lymph vessels in the breast, cervix, or uterus
      in women with solid tumors.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of IC-Green® in children 1 month
        of age and older for images of blood vessels and blood flow, in children 12
        years and older for images of the bile ducts, or in children for images of
        the eyes. Safety and efficacy have not been established in children younger
        than 1 month of age to see images of the blood vessels or blood flow , in
        children younger than 12 years to see images of the bile ducts , and in children
        to see images of the lymph nodes in the cervix or uterus .
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Spy Agent® Green in children 1
        month of age and older for images of blood vessels and blood flow, or in children
        12 years and older for images of the bile ducts. Safety and efficacy have
        not been established in children younger than 1 month of age to see images
        of the blood vessels or blood flow , in children younger than 12 years to
        see images of the bile ducts , and in children to see images of the lymph
        nodes in the breast, cervix, or uterus .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of indocyanine green injection in
        the elderly. However, elderly patients are more likely to have age-related
        liver, kidney, or heart problems, which may require caution and an adjustment
        in the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to iodides, history of—Should not be given in patients with this condition.
        This medicine contains iodine or sodium iodide, which may increase the risk
        of having allergic reactions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your doctor or other trained health professional will give you this medicine
      in a medical facility. It is given through an IV placed into one of your veins
      or under your skin in the breast area. Spy Agent® Green may also be injected
      into a space (interstitial) in the cervix.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      to make sure this medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you have a rash, itching, swelling of the face, tongue,
      and throat, trouble breathing or swallowing, or chest pain after you receive
      this medicine.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are receiving
      this medicine. This medicine may affect the results of certain medical tests.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - cough
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - hives or welts, itching, skin rash
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness of the skin
      - unusual tiredness or weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
