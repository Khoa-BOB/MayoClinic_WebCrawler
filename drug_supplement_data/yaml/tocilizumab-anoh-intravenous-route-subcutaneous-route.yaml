title: Tocilizumab-anoh (intravenous route, subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Avtozma
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Tocilizumab-anoh injection is used alone or together with other medicines
      to treat moderate to severe active rheumatoid arthritis in patients who have
      been previously treated with other medicines that did not work well.
  - type: paragraph
    text: Tocilizumab-anoh injection is also used while tapering off glucocorticoids
      (steroid medicine) to treat giant cell arteritis (inflammation of the arteries).
      It can be used alone after stopping treatment with glucocorticoids.
  - type: paragraph
    text: Tocilizumab-anoh injection is also used alone or together with methotrexate
      to treat polyarticular juvenile idiopathic arthritis (PJIA) and systemic juvenile
      idiopathic arthritis (SJIA) in children 2 years of age and older. This medicine
      is also used to treat severe or life-threatening cytokine release syndrome (CRS)
      in adults and children 2 years of age and older.
  - type: paragraph
    text: Tocilizumab-anoh injection is also used to treat coronavirus disease 2019
      (COVID-19) in hospitalized patients who are receiving systemic corticosteroids
      and require supplemental oxygen, mechanical ventilation, or extracorporeal membrane
      oxygenation (ECMO).
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of tocilizumab-anoh injection in
        children 2 years of age and older with PJIA , SJIA , and CRS . However, safety
        and efficacy have not been established for other conditions and in children
        younger than 2 years of age with PJIA , SJIA , and CRS .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of tocilizumab-anoh injection in
        the elderly. However, elderly patients are more likely to have serious infections,
        which may require caution in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abatacept
      - Abemaciclib
      - Acalabrutinib
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Alfentanil
      - Anifrolumab-fnia
      - Astemizole
      - Atorvastatin
      - Axitinib
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Baricitinib
      - Bosutinib
      - Brigatinib
      - Cannabidiol
      - Ceritinib
      - Cholera Vaccine, Live
      - Cisapride
      - Clindamycin
      - Cobimetinib
      - Colchicine
      - Conivaptan
      - Crizotinib
      - Cyclosporine
      - Dasatinib
      - Dengue Tetravalent Vaccine, Live
      - Desipramine
      - Desogestrel
      - Dienogest
      - Dihydroergotamine
      - Docetaxel
      - Dofetilide
      - Dronedarone
      - Drospirenone
      - Ebola Zaire Vaccine, Live
      - Entrectinib
      - Ergotamine
      - Estetrol
      - Estradiol
      - Ethinyl Estradiol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Chronic inflammatory demyelinating polyneuropathy (nerve problem) or
      - Hyperlipidemia (high fats in the blood) or
      - Liver disease, history of or
      - Multiple sclerosis or
      - Neutropenia (low level of white blood cells) or
      - Stomach or bowel problems (eg, diverticulitis, perforations, ulcers) or
      - Thrombocytopenia (low number of platelets) or
      - Weak immune system (eg, HIV, cancer, or steroid use)—Use with caution. May
        make these conditions worse.
    - type: list
      ordered: false
      items:
      - Herpes zoster, history of or
      - Tuberculosis, history of—Use with caution. May cause infections to come back
        (reactivate).
    - type: list
      ordered: false
      items:
      - Infections (eg, hepatitis B, bacteria, virus, fungus), active or recurring
        or
      - Liver disease, active—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine is available in 3 forms. A vial , a prefilled syringe , and
      an autoinjector .
  - type: paragraph
    text: 'Vial : A nurse or other trained health professional will give you this
      medicine in a medical facility. It is given through an IV catheter that is placed
      into one of your veins to treat rheumatoid arthritis, giant cell arteritis,
      PJIA, SJIA, CRS, or COVID-19. It must be given slowly, so the IV will have to
      remain in place for at least 1 hour.'
  - type: paragraph
    text: 'Prefilled syringe or autoinjector : Tocilizumab-anoh injection may also
      be given as a shot under you skin to treat rheumatoid arthritis, PJIA, SJIA,
      or giant cell arteritis. It may sometimes be given at home to patients who do
      not need to be in the hospital or clinic. If you are using this medicine at
      home, your doctor or nurse will teach you how to inject the medicine. Be sure
      that you understand exactly how to use it.'
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow these instructions carefully. Ask your doctor or pharmacist if you
      have any questions.
  - type: paragraph
    text: If you use this medicine at home, you will be shown the body areas where
      this shot can be given. Use a different body area each time you give yourself
      a shot. Keep track of where you give each shot to make sure you rotate body
      areas. This will help prevent skin problems. Do not inject into skin areas that
      are red, bruised, tender, hard, not intact, or skin that has moles or scars.
  - type: paragraph
    text: Allow the prefilled syringe to warm to room temperature for 30 minutes or
      the autoinjector for 45 minutes before using it. Do not warm it in any other
      way (eg, microwave, hot water, or direct sunlight).
  - type: paragraph
    text: Check the liquid in the prefilled syringe or autoinjector. It should be
      clear to slightly pearly and colorless to yellow. Do not use if it is cloudy,
      discolored, or has particles or flakes in it. Do not use if it has been dropped,
      damaged, or has leaked.
  - type: paragraph
    text: Never share your prefilled syringe or autoinjector with others under any
      circumstances . It is not safe for one prefilled syringe or autoinjector to
      be used for more than one person. Sharing needles can result in transmission
      of infection.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form (prefilled syringe or autoinjector): For giant
        cell arteritis: Adults—162 milligrams (mg) injected under the skin once a
        week or once every other week. Your doctor may adjust your dose as needed
        and tolerated. Children—Use and dose must be determined by your doctor. For
        moderate to severe rheumatoid arthritis: Adults weighing 100 kilograms (kg)
        or more—162 milligrams (mg) injected under the skin once a week. Your doctor
        may adjust your dose as needed and tolerated. Adults weighing less than 100
        kg—At first, 162 mg injected under the skin once every other week. Your doctor
        may increase the dose to 162 mg once a week as needed and tolerated. Children—Use
        and dose must be determined by your doctor. For polyarticular juvenile idiopathic
        arthritis: Adults and children 2 years of age and older weighing 30 kilograms
        (kg) or more—162 milligrams (mg) injected under the skin once every 2 weeks.
        Children 2 years of age and older weighing less than 30 kg—162 mg injected
        under the skin once every 3 weeks. Children younger than 2 years of age—Use
        and dose must be determined by your doctor. For systemic juvenile idiopathic
        arthritis: Adults and children 2 years of age and older weighing 30 kilograms
        (kg) or more—162 milligrams (mg) injected under the skin once a week. Children
        2 years of age and older weighing less than 30 kg—162 mg injected under the
        skin once every 2 weeks. Children younger than 2 years of age—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For giant cell arteritis: Adults—162 milligrams (mg) injected under the skin
        once a week or once every other week. Your doctor may adjust your dose as
        needed and tolerated. Children—Use and dose must be determined by your doctor.'
      - 'For moderate to severe rheumatoid arthritis: Adults weighing 100 kilograms
