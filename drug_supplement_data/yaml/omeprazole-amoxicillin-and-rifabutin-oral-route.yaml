title: Omeprazole, amoxicillin, and rifabutin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Talicia
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: 'Talicia® is a product containing three components: omeprazole, amoxicillin,
      and rifabutin. This medicine is used to treat patients with H. pylori infection.'
  - type: paragraph
    text: Omeprazole is a proton pump inhibitor (PPI). It works by decreasing the
      amount of acid produced by the stomach. Amoxicillin and rifabutin both belong
      to the class of medicines known as antibiotics. They work by killing bacteria
      or preventing their growth. However, this medicine will not work for colds,
      flu, or other virus infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule, Delayed Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Talicia® in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Talicia® in the elderly. However,
        elderly patients are more likely to have kidney problems, which may require
        caution and an adjustment in the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Artemether
      - Cabotegravir
      - Delamanid
      - Delavirdine
      - Lonafarnib
      - Lumefantrine
      - Mavacamten
      - Nifedipine
      - Ranolazine
      - Rilpivirine
      - Voriconazole
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Acalabrutinib
      - Acenocoumarol
      - Alfentanil
      - Amiodarone
      - Amlodipine
      - Amphetamine
      - Amprenavir
      - Apalutamide
      - Atazanavir
      - Atezolizumab
      - Atogepant
      - Atovaquone
      - Atrasentan
      - Avacopan
      - Avapritinib
      - Bedaquiline
      - Belumosudil
      - Belzutifan
      - Benzhydrocodone
      - Benzphetamine
      - Berotralstat
      - Bictegravir
      - Boceprevir
      - Bosutinib
      - Brigatinib
      - Buprenorphine
      - Cabozantinib
      - Cannabidiol
      - Capecitabine
      - Capivasertib
      - Capmatinib
      - Carbamazepine
      - Cariprazine
      - Cefuroxime Axetil
      - Ceritinib
      - Chlortetracycline
      - Cholera Vaccine, Live
      - Cilostazol
      - Citalopram
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Armodafinil
      - Azithromycin
      - Cyanocobalamin
      - Didanosine
      - Disulfiram
      - Ginkgo Biloba
      - Iron
      - Khat
      - Levothyroxine
      - Ospemifene
      - Raltegravir
      - Sirolimus
      - Tipranavir
      - Triazolam
      - Trimetrexate
      - Zidovudine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Cranberry
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to penicillin, history of—May increase risk for more severe reactions.
    - type: list
      ordered: false
      items:
      - Diarrhea or
      - Eye or vision problems (eg, uveitis) or
      - Kidney problems or
      - Systemic lupus erythematosus (SLE)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease—Use is not recommended in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Swallow the delayed-release capsules whole with a full glass of water. Do
      not crush, chew, or open it. Take it with food.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you feel
      better after the first few doses. Your infection may not clear up if you stop
      using the medicine too soon.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (delayed-release capsules): For treatment of H. pylori
        infections: Adults—4 capsules 3 times a day at least 4 hours apart for 14
        days, to be taken with food. Each capsule of Talicia® contains 12.5 milligrams
        (mg) of rifabutin, 250 mg of amoxicillin, and 10 mg of omeprazole. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of H. pylori infections: Adults—4 capsules 3 times a day at
        least 4 hours apart for 14 days, to be taken with food. Each capsule of Talicia®
        contains 12.5 milligrams (mg) of rifabutin, 250 mg of amoxicillin, and 10
        mg of omeprazole. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—4 capsules 3 times a day at least 4 hours apart for 14 days, to be
        taken with food. Each capsule of Talicia® contains 12.5 milligrams (mg) of
        rifabutin, 250 mg of amoxicillin, and 10 mg of omeprazole.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is more than 4 hours until your next scheduled
        dose, take it as soon as possible, and then go back to your regular schedule.
        If you miss a dose and it is less than 4 hours until your next scheduled dose,
        skip the missed dose and take your next dose at the regular time.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the medicine in its original container. Keep the bottle tightly
        closed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits .
      This will allow your doctor to see if the medicine is working properly and to
      decide if you should continue to use it. Blood, urine, and other laboratory
      tests may be needed to check for unwanted effects. If your condition does not
      improve, or if it becomes worse, discuss this with your doctor.
  - type: paragraph
    text: Do not use this medicine together with delavirdine (Rescriptor®), rilpivirine
      ((Edurant®) or products containing rilpivirine (eg, Complera®, Odefsey®), or
      voriconazole (Vfend®). Using these medicines together may increase risk for
      more serious side effects .
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      birth control pills together with another form of birth control (eg, condom,
      diaphragm, or contraceptive foam or jelly) to keep from getting pregnant. If
      you think you have become pregnant while using the medicine, tell your doctor
      right away.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Call your doctor right away if you have chest tightness, rash, itching,
      fast heartbeat, trouble breathing or swallowing, or large, hive-like swelling
      of the face, eyelids, lips, tongue, throat, hands, legs, feet, or sex organs
      while you are using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have blistering, peeling, or loosening
      of the skin, chills, cough, diarrhea, itching, joint or muscle pain, red irritated
      eyes, red skin lesions, often with a purple center, sore throat, sores, ulcers,
      or white spots in the mouth or on the lips, or unusual tiredness or weakness.
      These may be symptoms of serious skin reactions, including Stevens-Johnson syndrome,
      acute generalized exanthematous pustulosis (AGEP), toxic epidermal necrolysis,
      and drug reaction with eosinophilia and systemic symptoms (DRESS).
  - type: paragraph
    text: This medicine may cause stomach or bowel problems, including drug-induced
      enterocolitis syndrome (DIES). DIES may occur 1 to 4 hours after taking this
      medicine. Check with your doctor right away if you have blurred vision, cold
      clammy skin, confusion, dizziness, faintness, or lightheadedness when getting
      up suddenly from a lying or sitting position, fever, pale skin, stomach pain,
      cramps, or tenderness, sweating, unusual drowsiness, dullness, tiredness, weakness
      or feeling sluggish, unusual tiredness or weakness, or watery or bloody diarrhea.
  - type: paragraph
    text: This medicine may cause diarrhea, and in some cases it can be severe. Diarrhea
      may occur 2 months or more after you stop taking this medicine. Do not take
      any medicine to treat diarrhea without first checking with your doctor. If you
      have any questions or if the diarrhea gets worse, check with your doctor.
  - type: paragraph
    text: Check with your doctor right away if you have a change in frequency of urination
      or amount of urine, blood in the urine, fever, joint pain, loss of appetite,
      skin rash, swelling of the body, feet, or ankles, unusual tiredness or weakness,
      or unusual weight gain after taking this medicine. These could be symptoms of
      acute tubulointerstitial nephritis.
  - type: paragraph
    text: Cutaneous or systemic lupus erythematosus may occur or get worse in patients
      receiving a PPI. Call your doctor right away if you have joint pain or a skin
      rash on your cheeks or arms that gets worse when exposed to the sun.
  - type: paragraph
    text: Check with your doctor immediately if blurred vision, difficulty reading,
      or any other change in vision occurs during or after treatment. Your doctor
      may want you to have your eyes checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect the results of certain medical tests.
  - type: paragraph
    text: Talk with your doctor before using this medicine if you plan to have children.
      Some men who use this medicine have become infertile (unable to have children).
  - type: paragraph
    text: Avoid taking this medicine with alcohol.
  - type: paragraph
    text: This medicine may cause your skin, tears, saliva, sweat, urine, or bowel
      movements to turn a brownish-orange color. Your contact lenses could become
      permanently discolored.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blistering, peeling, loosening of the skin
      - blood in the urine or stools
      - blurred vision or other change in vision
      - chest pain or tightness
      - chills
      - cloudy urine
      - confusion
      - cough
      - cracks in the skin
      - decreased urine
      - diarrhea
      - difficulty in moving
      - difficulty with swallowing
      - dizziness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dry mouth
      - eye pain
      - fast heartbeat
      - fever
      - greatly decreased frequency of urination or amount of urine
      - hives, itching, or skin rash
      - increased thirst
      - joint or muscle pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss of heat from the body
      - mood or mental changes
      - muscle aches, cramps, pains, or stiffness
      - muscle cramps in the hands, arms, feet, legs, or face
      - numbness and tingling around the mouth, fingertips, or feet
      - painful or difficult urination
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips or tongue
      - red, irritated eyes
      - red skin lesions, often with a purple center
      - red, swollen skin
      - scaly skin
      - seizures
      - sensitivity of the eye to light
      - severe stomach cramps and pain
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach tenderness
      - sweating
      - swelling of the breasts or breast soreness in both females and males
      - swelling of the feet or lower legs
      - tearing
      - trembling
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - watery and severe diarrhea, which may also be bloody
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - back pain
      - belching
      - change or loss of taste
      - difficulty having a bowel movement (stool)
      - heartburn
      - indigestion
      - itching of the vagina or genitals
      - loss of appetite
      - stomach discomfort or upset
      - thick, white vaginal discharge with mild or no odor
      - trouble sleeping
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in taste bad unusual or unpleasant (after) taste
      - continuing ringing or buzzing or other unexplained noise in ears
      - decreased interest in sexual intercourse
      - dry skin
      - hair loss or thinning of the hair
      - hearing loss
      - inability to have or keep an erection
      - increased sweating
      - loss in sexual ability, desire, drive, or performance
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
