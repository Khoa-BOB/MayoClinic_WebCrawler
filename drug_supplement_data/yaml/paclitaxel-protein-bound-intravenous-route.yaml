title: Paclitaxel protein-bound (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Abraxane
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: PACLitaxel
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Paclitaxel protein-bound injection is used to treat metastatic breast cancer
      (cancer that has already spread) after other treatments have failed. It is used
      together with carboplatin, a cancer medicine, to treat advanced or metastatic
      non-small cell lung cancer in patients who cannot receive radiation therapy
      or have surgery. Paclitaxel protein-bound is used together with gemcitabine,
      a cancer medicine, to treat metastatic pancreas cancer.
  - type: paragraph
    text: Paclitaxel belongs to the group of medicines called antineoplastics (cancer
      medicines). It interferes with the growth of cancer cells, which are eventually
      destroyed by the body. Since the growth of normal body cells may also be affected
      by paclitaxel, other unwanted effects will also occur.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of paclitaxel protein-bound injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of paclitaxel protein-bound injection
        in the elderly. However, elderly patients are more likely to have unwanted
        effects which may require caution in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mifepristone
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Amiodarone
      - Amodiaquine
      - Amprenavir
      - Apalutamide
      - Armodafinil
      - Atazanavir
      - Belzutifan
      - Boceprevir
      - Bosentan
      - Capivasertib
      - Capmatinib
      - Carbamazepine
      - Cenobamate
      - Chlorzoxazone
      - Cholera Vaccine
      - Cilostazol
      - Cimetidine
      - Ciprofloxacin
      - Cisplatin
      - Clarithromycin
      - Clofazimine
      - Clopidogrel
      - Clotrimazole
      - Cobicistat
      - Crizotinib
      - Cyclosporine
      - Dabrafenib
      - Darunavir
      - Deferasirox
      - Delavirdine
      - Dexamethasone
      - Dicloxacillin
      - Diltiazem
      - Dipyrone
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Infection—May decrease body's ability to fight infection.
    - type: list
      ordered: false
      items:
      - Liver disease, moderate to severe—Should not be used to treat pancreas cancer
        in patients with this condition.
    - type: list
      ordered: false
      items:
      - Neutropenia (low white blood cells) or
      - Sensory neuropathy (tingling, numbness of arms, hands, legs, or feet)—Use
        with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: You will receive this medicine while you are in a hospital or cancer treatment
      center. A nurse or other trained health professional will give you this medicine.
      This medicine is given through a needle placed in one of your veins.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions carefully. Ask your doctor if you have any questions.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: Men who are receiving this medicine should not father a child . This medicine
      can harm the unborn baby of your partner.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Tell your doctor right away if you have a rash, itching, hoarseness, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      while you are receiving this medicine.
  - type: paragraph
    text: 'Paclitaxel can temporarily lower the number of white blood cells in your
      blood, which will increase the chance of getting an infection. It can also lower
      the number of platelets in your blood, which are necessary for proper blood
      clotting. If this occurs, these are the precautions you can take to reduce the
      risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection, or if you get a fever or chills,
      cough or hoarseness, lower back or side pain, or have painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in your urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects, such as a safety
      razor, fingernail clippers, or toenail clippers.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: This medicine is made from donated human blood. Although the risk is low,
      some people have received viruses from human blood products. Human donors and
      donated blood are both tested for viruses before the medicine is prepared. Talk
      with your doctor if this concerns you.
  - type: paragraph
    text: Check with your doctor right away if you have burning, numbness, tingling,
      or painful sensations in the arms, hands, legs, or feet. These could be symptoms
      of a condition called sensory neuropathy.
  - type: paragraph
    text: Lung or breathing problems may occur if you are receiving this medicine
      together with gemcitabine. Tell your doctor right away if you have shortness
      of breath, trouble breathing, or a persistent dry cough.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - blurred or double vision
      - chest pain
      - chills
      - cough
      - fever
      - loss of taste
      - lower back or side pain
      - painful or difficult urination
      - pale skin
      - rapid weight gain
      - sneezing
      - sore mouth, tongue, or throat
      - tightness in the chest
      - tingling of the hands or feet
      - troubled breathing with exertion
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual weight gain or loss
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - bleeding
      - blood in the urine or stools
      - burning, tingling, numbness or pain in the hands, arms, feet, or legs
      - confusion
      - difficulty with swallowing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fast, pounding, slow, or irregular heartbeat or pulse
      - general feeling of discomfort or illness
      - inability to move the arms, legs, or facial muscles
      - inability to speak
      - pain in the chest, groin, or legs, especially the calves
      - pinpoint red spots on the skin
      - rapid, shallow breathing
      - sensation of pins and needles
      - severe, sudden headache
      - skin itching, rash, or redness
      - slurred or slow speech
      - stabbing pain
      - sudden loss of coordination
      - sudden, severe weakness or numbness in the arms or legs
      - sudden, unexplained shortness of breath
      - sweating
      - swelling of the face, throat, or tongue
      - thickening of bronchial secretions
      - trouble thinking or walking
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cracked lips
      - decreased appetite
      - diarrhea
      - difficulty with moving
      - headache
      - lack or loss of strength
      - loss of hair
      - muscle pain or stiffness
      - nausea
      - pain in the joints
      - swelling
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, a feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nail changes
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
