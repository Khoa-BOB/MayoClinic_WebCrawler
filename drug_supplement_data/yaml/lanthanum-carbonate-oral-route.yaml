title: Lanthanum carbonate (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Fosrenol
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Lanthanum is used to treat hyperphosphatemia (too much phosphate in the
      blood) in patients with end stage kidney disease who are on dialysis.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Chewable
    - Powder
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of lanthanum in the pediatric population. Safety and efficacy
        have not been established. Use is not recommended in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of lanthanum in the elderly.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Erdafitinib
      - Mycophenolate Mofetil
      - Mycophenolic Acid
      - Vadadustat
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Balofloxacin
      - Besifloxacin
      - Ciprofloxacin
      - Enoxacin
      - Flumequine
      - Gatifloxacin
      - Gemifloxacin
      - Levofloxacin
      - Levothyroxine
      - Lomefloxacin
      - Moxifloxacin
      - Nadifloxacin
      - Norfloxacin
      - Ofloxacin
      - Pazufloxacin
      - Pefloxacin
      - Prulifloxacin
      - Rufloxacin
      - Sparfloxacin
      - Tecovirimat
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bowel blockage (eg, ileus) or
      - Fecal impaction (blockage in the rectum)—Should not be used in patients with
        these conditions.
    - type: list
      ordered: false
      items:
      - Bowel or stomach surgery, history of or
      - Colon cancer, history of or
      - Colon problems (eg, diverticular disease, peritonitis) or
      - Constipation or
      - Diabetes—May increase risk for stomach or bowel blockage.
    - type: list
      ordered: false
      items:
      - Crohn's disease or
      - Peptic ulcer or
      - Ulcerative colitis—Use of lanthanum has not been studied in patients with
        these medical problems.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: It is best to take this medicine with or immediately right after meals.
  - type: paragraph
    text: Chew or crush the tablet completely before swallowing. Do not swallow the
      tablet whole.
  - type: paragraph
    text: If you cannot chew the tablets, use the oral powder form of this medicine.
      Sprinkle it on a small quantity of applesauce or other similar food. Mix and
      take it immediately. Do not mix it with water or other liquid. Do not store
      mixture for later use.
  - type: paragraph
    text: Follow carefully any diet program your doctor may recommend.
  - type: paragraph
    text: If you take levothyroxine, an antacid that contains aluminum, calcium, or
      magnesium, an antibiotic medicine (eg, ampicillin, tetracycline), blood pressure
      medicine, statins, or anti-malarials, take them 2 hours before or after taking
      lanthanum.
  - type: paragraph
    text: If you are taking antibiotic medicines (eg, ciprofloxacin or levofloxacin),
      take them at least 1 hour before or 4 hours after you take lanthanum. If you
      need help deciding the best time to take your other medicines, ask your doctor
      or pharmacist.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (chewable tablets or powder): For high phosphorus levels
        in the blood: Adults—At first, 1500 milligrams (mg) per day, divided into
        small doses. Your dose will be determined and adjusted by your doctor depending
        on how high your blood phosphorus level is. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For high phosphorus levels in the blood: Adults—At first, 1500 milligrams
        (mg) per day, divided into small doses. Your dose will be determined and adjusted
        by your doctor depending on how high your blood phosphorus level is. Children—Use
        is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 1500 milligrams (mg) per day, divided into small doses. Your
        dose will be determined and adjusted by your doctor depending on how high
        your blood phosphorus level is.
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests will be needed
      to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious stomach or bowel problems, including blockage
      or perforation (tear or hole), or severe constipation. Check with your doctor
      right away if you have black, tarry stools, constipation, diarrhea, fever, nausea,
      severe vomiting, sometimes with blood, or stomach cramps or pain.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. It may affect the results of certain medical tests (eg, stomach
      x-ray).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Stomach pain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody, black, or tarry stools
      - bone pain
      - constipation, severe
      - difficulty having a bowel movement
      - itching, skin rash
      - loss of appetite
      - seizures
      - severe stomach pain, cramping, or burning
      - trouble breathing
      - unusual tiredness or weakness
      - vomiting of material that looks like coffee grounds, severe and continuous
      - vomiting, severe
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - heartburn
      - indigestion
      - stomach discomfort or upset
      - tooth injury
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
