title: Cabotegravir (intramuscular route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cabotegravir injection is used for pre-exposure prophylaxis (PrEP) to reduce
      the risk of human immunodeficiency virus type 1 (HIV-1) infection. HIV is the
      virus that causes acquired immune deficiency syndrome (AIDS). Your doctor may
      do tests to make sure you are negative from HIV-1 infection before receiving
      this medicine for HIV-1 PrEP.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of cabotegravir injection in children younger than 12 years
        of age or weighing less than 35 kilograms (kg). Safety and efficacy have not
        been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of cabotegravir injection in the
        elderly. However, elderly patients are more likely to have age-related kidney,
        liver, or heart problems, which may require caution for patients receiving
        this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Carbamazepine
      - Oxcarbazepine
      - Phenobarbital
      - Phenytoin
      - Rifabutin
      - Rifampin
      - Rifapentine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abacavir
      - Aluminum Carbonate, Basic
      - Aluminum Hydroxide
      - Aluminum Phosphate
      - Amprenavir
      - Atazanavir
      - Atidarsagene Autotemcel
      - Calcium Carbonate
      - Darunavir
      - Delavirdine
      - Didanosine
      - Dihydroxyaluminum Aminoacetate
      - Dihydroxyaluminum Sodium Carbonate
      - Dolutegravir
      - Doravirine
      - Efavirenz
      - Elvitegravir
      - Emtricitabine
      - Enfuvirtide
      - Etravirine
      - Fosamprenavir
      - Fostemsavir
      - Ibalizumab-uiyk
      - Indinavir
      - Lamivudine
      - Lopinavir
      - Magaldrate
      - Magnesium Carbonate
      - Magnesium Hydroxide
      - Magnesium Oxide
      - Magnesium Trisilicate
      - Maraviroc
      - Nelfinavir
      - Nevirapine
      - Raltegravir
      - Ritonavir
      - Saquinavir
      - Sodium Bicarbonate
      - Stavudine
      - Tenofovir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Depression or
      - Liver disease—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - HIV-1 infection, positive or unknown status—Should not be used in patients
        with this condition.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or end-stage—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given as a shot into a muscle, usually at your buttocks. It
      is usually given once a month for the first 2 months, then once every 2 months.
  - type: paragraph
    text: This medicine comes with a patient information leaflet and instructions
      for use. Read and follow the instructions carefully. Read it again each time
      you receive the injection in case there is new information. Ask your doctor
      if you have any questions.
  - type: paragraph
    text: Your doctor may tell you to take 1 tablet of cabotegravir once a day for
      at least 28 days before receiving your first injection. This will allow your
      doctor to see how well you will tolerate this medicine.
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your progress closely while you are receiving this
      medicine to make sure this medicine is working properly. Blood tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: You should not receive this medicine together with a seizure medicine (eg,
      carbamazepine, oxcarbazepine, phenobarbital, phenytoin, Dilantin®, Tegretol®,
      Trileptal®) or medicine to treat tuberculosis (eg, rifampin, rifapentine, Priftin®,
      Rifadin®, Rimactane®). Using these medicines together may make cabotegravir
      less effective.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, which can be life-threatening
      and require immediate medical attention. Check with your doctor right away if
      you have a rash, fever, general feeling of discomfort or illness, muscle or
      joint aches, redness or swelling of the eyes, sores or blisters in the mouth,
      swelling of the mouth, face, lips, or tongue, trouble breathing, or unusual
      tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have dark urine, clay-colored stools,
      stomach pain, or yellow eyes or skin. These may be symptoms of a serious liver
      problem.
  - type: paragraph
    text: Tell your doctor right away if you start to feel depressed. Report any unusual
      thoughts or behaviors that trouble you (including suicidal thoughts), especially
      if they are new or get worse quickly.
  - type: paragraph
    text: HIV may be acquired from or spread to others through infected body fluids,
      including blood, vaginal fluid, or semen. If you have sex, always wear (or have
      your partner wear) a condom. Only use condoms made of latex or polyurethane
      and use them every time you have contact with semen, vaginal secretions, or
      blood. Also, do not share needles or equipment with anyone or use dirty needles.
      If you have any questions about this, check with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in behavior
      - dark urine
      - discouragement
      - feeling sad or empty
      - loss of appetite
      - loss of interest or pleasure
      - nausea or vomiting
      - stomach pain, severe
      - thoughts of hurting oneself
      - trouble concentrating
      - trouble sleeping
      - unusual tiredness or weakness
      - yellow eyes or skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Rash
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chest pain
      - chills
      - cough
      - large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
        feet, or sex organs
      - painful or difficult urination
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swollen glands
      - trouble breathing
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of skin, feeling of
        pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloated
      - body aches or pain
      - diarrhea
      - difficulty in moving
      - dizziness
      - ear congestion
      - excess air or gas in the stomach or intestines
      - fever
      - full feeling
      - headache
      - increased weight
      - joint pain
      - loss of voice
      - muscle aches, cramps, pains, or stiffness
      - passing gas
      - sleepiness or unusual drowsiness
      - sneezing
      - stuffy or runny nose
      - swollen joints
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, dry, or itching eyes
      - discharge, excessive tearing
      - redness, pain, swelling of the eye, eyelid, or inner lining of eyelid
      - swelling or puffiness of the face
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
