title: Iron sucrose (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Venofer
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Iron sucrose injection is an iron replacement product that is used to treat
      iron deficiency anemia (not enough iron in the blood) in patients with chronic
      kidney disease (CKD).
  - type: paragraph
    text: Iron is a mineral that the body needs to produce red blood cells. When the
      body does not get enough iron, it cannot produce the number of normal red blood
      cells needed to keep you in good health. This condition is called iron deficiency
      (iron shortage) or iron deficiency anemia.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of iron sucrose injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of iron sucrose injection in the
        elderly. However, elderly patients are more likely to have age-related kidney,
        liver, or heart problems, which may require caution and an adjustment in the
        dose for patients receiving iron sucrose injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Baloxavir Marboxil
      - Bictegravir
      - Dimercaprol
      - Eltrombopag
      - Erdafitinib
      - Magnesium Sulfate
      - Raltegravir
      - Technetium Tc 99m Medronate
      - Technetium Tc 99m Oxidronate
      - Technetium Tc 99m Pyrophosphate
      - Vadadustat
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Delafloxacin
      - Minocycline
      - Zinc
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Phytic Acid Containing Food
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Hypotension (low blood pressure)—Use with caution. May make this condition
        worse.
    - type: list
      ordered: false
      items:
      - Iron overload—Use is not recommended in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given through a needle placed in one of your veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you closely while you are receiving
      this medicine. Blood tests may be needed to check for unwanted effects. You
      may also need to monitor your blood pressure at home. If you notice any changes
      to your normal blood pressure, call your doctor right away.
  - type: paragraph
    text: This medicine may cause serious types of allergic reactions, including anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you have a rash, itching, swelling of the face,
      tongue, and throat, trouble breathing, or chest pain after you receive the medicine.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up from a lying or sitting position suddenly. These symptoms are more likely
      to occur when you begin using this medicine, or when the dose is increased.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - blurred vision
      - chest pain or tightness in the chest
      - confusion
      - difficult or labored breathing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - headache
      - nervousness
      - pounding in the ears
      - rapid weight gain
      - slow or fast heartbeat
      - sweating
      - tingling of the hands or feet
      - unusual tiredness or weakness
      - unusual weight gain or loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest discomfort
      - difficulty swallowing
      - hives or itching
      - increased sweating
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss of consciousness
      - noisy breathing
      - slow or irregular heartbeat
      - swelling of the joints
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in taste
      - diarrhea
      - muscle cramps
      - nausea or vomiting
      - pain in the arms or legs
      - pain or burning sensation in the injection site
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - ankle, knee, or great toe joint pain
      - body aches or pain
      - chills
      - difficulty with moving
      - ear congestion or pain
      - flushed, dry skin
      - fruit-like breath odor
      - increased hunger or thirst
      - increased urination
      - lack or loss of strength
      - pain or redness at the injection site
      - pale skin at the injection site
      - runny nose, sneezing
      - sore throat
      - unexplained weight loss
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, dry, or itching eyes
      - discharge or excessive tearing
      - redness, pain, or swelling of the eye, eyelid, or inner lining of the eyelid
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
