title: Emtricitabine, rilpivirine, and tenofovir (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Complera
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Emtricitabine, rilpivirine, and tenofovir combination is used to treat human
      immunodeficiency virus (HIV) infection. HIV is the virus that causes acquired
      immune deficiency syndrome (AIDS). This medicine is usually given to patients
      who have not received any HIV treatment in the past or to replace their current
      antiviral medicines provided that they meet certain requirements.
  - type: paragraph
    text: This medicine will not cure HIV infection or AIDS. It works by lowering
      the amount of HIV in the blood and it will also help your immune system. This
      may help delay some of the medical conditions that usually result from AIDS
      or HIV disease. It will not keep you from spreading HIV to other people.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of emtricitabine, rilpivirine, and tenofovir combination in
        children weighing less than 35 kilograms. Safety and efficacy have not been
        established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of emtricitabine, rilpivirine, and
        tenofovir combination in the elderly. However, elderly patients are more likely
        to have age-related kidney, liver, or heart problems, which may require caution
        and an adjustment in the dose for patients receiving emtricitabine, rilpivirine,
        and tenofovir combination.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Carbamazepine
      - Cisapride
      - Dexamethasone
      - Dexlansoprazole
      - Dronedarone
      - Esomeprazole
      - Fluconazole
      - Fosphenytoin
      - Ketoconazole
      - Lansoprazole
      - Levoketoconazole
      - Mesoridazine
      - Omeprazole
      - Oxcarbazepine
      - Pantoprazole
      - Phenobarbital
      - Phenytoin
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Primidone
      - Rabeprazole
      - Rifabutin
      - Rifampin
      - Rifapentine
      - Saquinavir
      - Sparfloxacin
      - St John's Wort
      - Terfenadine
      - Thioridazine
      - Vonoprazan
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Aceclofenac
      - Acemetacin
      - Acyclovir
      - Adagrasib
      - Alfuzosin
      - Aluminum Carbonate, Basic
      - Aluminum Hydroxide
      - Aluminum Phosphate
      - Amikacin
      - Amikacin Liposome
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amtolmetin Guacil
      - Anagrelide
      - Apalutamide
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Aspirin
      - Astemizole
      - Atazanavir
      - Atidarsagene Autotemcel
      - Avacopan
