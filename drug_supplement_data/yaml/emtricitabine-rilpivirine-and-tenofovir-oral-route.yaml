      - Celecoxib
      - Ceritinib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Boceprevir
      - Darunavir
      - Lopinavir
      - Ritonavir
      - Tipranavir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bone fracture, history of or
      - Depression, history of or
      - Fanconi syndrome (kidney disease), history of or
      - Heart rhythm problems (eg, QT prolongation) or
      - Hepatitis B or C infection, history of or
      - Kidney failure, history of or
      - Osteomalacia (soft bones), history of or
      - Osteoporosis (weak or brittle bones), history of—Use with caution. May make
        these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate or severe—Use is not recommended in patients with
        this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not use more
      of it, do not use it more often, and do not use it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Keep taking this medicine for the full time of treatment , even if you begin
      to feel better. Do not stop taking it without checking first with your doctor.
      When your supply of the medicine is running low, contact your doctor or pharmacist
      ahead of time. Do not allow yourself to run out of the medicine.
  - type: paragraph
    text: It is best to take this medicine with food.
  - type: paragraph
    text: If you are taking antacids that contain aluminum, magnesium, or calcium,
      take the antacid at least 2 hours before or 4 hours after this medicine.
  - type: paragraph
    text: If you are taking a stomach medicine for heartburn or ulcers , such as cimetidine,
      famotidine, nizatidine, Axid®, Pepcid®, or Tagamet®), take the heartburn medicine
      at least 12 hours before or 4 hours after this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of HIV infection: Adults and
        children weighing 35 kilograms (kg) or more—1 tablet once a day with food.
        Each tablet contains 200 milligrams (mg) emtricitabine, 25 mg rilpivirine,
        and 300 mg tenofovir disoproxil fumarate. Children weighing less than 35 kg—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of HIV infection: Adults and children weighing 35 kilograms
        (kg) or more—1 tablet once a day with food. Each tablet contains 200 milligrams
        (mg) emtricitabine, 25 mg rilpivirine, and 300 mg tenofovir disoproxil fumarate.
        Children weighing less than 35 kg—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children weighing 35 kilograms (kg) or more—1 tablet once a day
        with food. Each tablet contains 200 milligrams (mg) emtricitabine, 25 mg rilpivirine,
        and 300 mg tenofovir disoproxil fumarate.
      - Children weighing less than 35 kg—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: Wait until your next regularly scheduled dose if it has been more than
        12 hours since you missed your last dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the bottle tightly closed. Keep the medicine in the original bottle
        that you were given at the pharmacy.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine does not decrease the risk of transmitting HIV infection to
      others through sexual contact or by contamination through blood. HIV may be
      acquired from or spread to others through infected body fluids, including blood,
      vaginal fluid, or semen. If you are infected, it is best to avoid any sexual
      activity involving an exchange of body fluids with other people. If you do have
      sex, always wear (or have your partner wear) a condom (“rubber”). Only use condoms
      made of latex or polyurethane and use them every time you have contact with
      semen, vaginal secretions, or blood. Also, do not share needles or equipment
      with anyone or use dirty needles. If you have any questions about this, check
      with your doctor.
  - type: paragraph
    text: This medicine should not be used together with adefovir (Hepsera®), dexamethasone
      (Decadron®), lamivudine (Combivir®, Epivir®, Epivir-HBV®, Epzicom®, Triumeq®,
      Trizivir®), certain seizure medicines (eg, carbamazepine, oxcarbazepine, phenobarbital,
      phenytoin, Dilantin®, Tegretol®, Trileptal®), medicines for tuberculosis (eg,
      rifampin, rifapentine, Priftin®, Rifadin®, Rimactane®), certain stomach medicines
      (eg, dexlansoprazole, esomeprazole, lansoprazole, omeprazole, pantoprazole,
      rabeprazole, Aciphex®, Dexilant®, Nexium®, Prevacid®, Prilosec®), or St. John's
      wort.
  - type: paragraph
    text: The medicines in this combination tablet are also available as Atripla®,
      Descovy®, Edurant®, Emtriva®, Genvoya®, Odefsey®, Stribild®, Truvada®, Vemlidy®,
      and Viread®. Do not take the emtricitabine, rilpivirine, and tenofovir combination
      with any of these medicines .
  - type: paragraph
    text: 'This medicine may cause a rare, but serious, unwanted effect called lactic
      acidosis (too much acid in the blood). Call your doctor right away if you or
      your child have more than one of these symptoms: abdominal or stomach discomfort,
      decreased appetite, diarrhea, fast, shallow breathing, general feeling of discomfort,
      muscle pain or cramping, nausea, sleepiness, or unusual tiredness or weakness.'
  - type: paragraph
    text: 'This medicine may cause rare, but serious, liver problems. This may occur
      in patients with a history of hepatitis B infection. Check with your doctor
      right away if you or your child have more than one of these symptoms: clay-colored
      stools, dark urine, decreased appetite, fever, headache, itching, nausea and
      vomiting, skin rash, stomach pain or tenderness, swelling of the feet or lower
      legs, unusual tiredness or weakness, or yellow eyes or skin.'
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Check with your doctor
      right away if you or your child have blistering, peeling, or loosening of the
      skin, red skin lesions, severe acne or skin rash, sores or ulcers on the skin,
      or fever or chills with this medicine.
  - type: paragraph
    text: This medicine may cause serious types of allergic reactions, including anaphylaxis
      and drug reaction with eosinophilia and systemic symptoms (DRESS syndrome).
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you or your child have a rash, itching, hoarseness,
      lightheadedness or dizziness, trouble breathing, trouble swallowing, or any
      swelling of your hands, face, or mouth with this medicine.
  - type: paragraph
    text: Tell your doctor right away if you or your child start to feel depressed
      and have thoughts about hurting yourself. Report any unusual thoughts or behavior
      that troubles you, especially if they are new or get worse quickly.
  - type: paragraph
    text: This medicine may cause your bones to get weak and brittle. This could increase
      your risk for broken bones (fractures). Ask your doctor about this if you have
      any concerns.
  - type: paragraph
    text: Your immune system may get stronger when you start taking HIV medicines.
      Tell your doctor right away if you or your child notice any changes in your
      health. Sometimes the immune system will start to fight infections that were
      hidden in your body, such as pneumonia, herpes, or tuberculosis. Autoimmune
      disorders such as Graves disease, polymyositis, and Guillain-Barré syndrome
      may also occur.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you or your child are taking this medicine. The results of some tests may be
      affected by this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Discouragement
      - feeling sad or empty
      - irritability
      - lack of appetite
      - loss of interest or pleasure
      - mental depression
      - thoughts of killing oneself
      - tiredness
      - trouble concentrating
      - trouble sleeping
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chest pain
      - chills
      - cough
      - difficulty with breathing
      - ear congestion
      - fever
      - headache
      - loss of voice
      - runny or stuffy nose
      - sneezing
      - sore throat
      - tightness in the chest
      - unsteadiness or awkwardness
      - unusual tiredness or weakness
      - weakness in the arms, hands, legs, or feet
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - bloating
      - bloody or cloudy urine
      - bone pain
      - confusion
      - constipation
      - dark urine
      - decreased appetite
      - decreased urination
      - diarrhea
      - difficulty swallowing
      - dizziness
      - dry mouth
      - fast heartbeat
      - fast, shallow breathing
      - frequent urination
      - hostility
      - increased thirst
      - indigestion
      - irritability
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - light-colored stools
      - muscle pain or cramps
      - muscle tenderness, wasting, or weakness
      - nausea
      - pain in the stomach, side, or abdomen, possibly radiating to the back
      - rapid weight gain
      - seizures
      - skin rash, hives, itching
      - sleepiness
      - stomach discomfort
      - swelling of the face, ankles, hands, feet, or lower legs
      - unusual drowsiness, dullness, or feeling of sluggishness
      - vomiting
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal dreams
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - belching
      - difficulty with moving
      - heartburn
      - pain in the joints
      - pain or tenderness around the eyes and cheekbones
      - stomach discomfort or upset
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Lack or loss of strength
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
