title: Pemetrexed (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Alimta
    - type: paragraph
      text: Axtle
    - type: paragraph
      text: Pemfexy
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Pemetrexed injection is used in combination with pembrolizumab and platinum-containing
      chemotherapy as first treatment for non-squamous non-small cell lung cancer
      (NSCLC) that has spread (metastatic) in patients whose tumors do not have an
      abnormal EGFR or ALK gene. This medicine is also used in combination with cisplatin
      as first treatment for non-squamous NSCLC that has spread (locally advanced
      or metastatic).
  - type: paragraph
    text: Pemetrexed injection is also used alone as maintenance treatment of locally
      advanced or metastatic non-squamous NSCLC that has not progressed after a previous
      4-cycle treatment with platinum cancer medicines. It is also used alone to treat
      recurrent (cancer has come back) or metastatic non-squamous NSCLC in patients
      who previously received chemotherapy.
  - type: paragraph
    text: Pemetrexed injection is also used together with cisplatin as the first treatment
      of malignant pleural mesothelioma (cancer that affects the inside lining of
      the lungs and chest wall) that cannot be removed by surgery. Pemetrexed belongs
      to the group of medicines called antineoplastics. v
  - type: paragraph
    text: This medicine is given only by or under the direct supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of pemetrexed
        injection have not been performed in the pediatric population. Safety and
        effectiveness have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of pemetrexed injection in the elderly.
        However, elderly patients are more likely to have unwanted effects (eg, anemia,
        thrombocytopenia, high blood pressure, neutropenia) or age-related kidney
        problems, which may require caution and an adjustment in the dose for patients
        receiving pemetrexed injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aceclofenac
      - Acemetacin
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Amtolmetin Guacil
      - Aspirin
      - Bromfenac
      - Bufexamac
      - Celecoxib
      - Cholera Vaccine
      - Choline Salicylate
      - Clonixin
      - Dexibuprofen
      - Dexketoprofen
      - Diclofenac
      - Diflunisal
      - Dipyrone
      - Droxicam
      - Ebola Zaire Vaccine, Live
      - Etodolac
      - Etofenamate
      - Etoricoxib
      - Felbinac
      - Fenoprofen
      - Fepradinol
      - Feprazone
      - Floctafenine
      - Flufenamic Acid
      - Flurbiprofen
      - Ibuprofen
      - Indomethacin
      - Influenza Virus Vaccine, Live
      - Ketoprofen
      - Ketorolac
      - Lornoxicam
      - Loxoprofen
      - Lumiracoxib
      - Meclofenamate
      - Mefenamic Acid
      - Meloxicam
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia (low red blood cells) or
      - Bone marrow problems or
      - Lung or breathing problems or
      - Neutropenia (low while blood cells) or
      - Thrombocytopenia (low platelets in the blood)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through an IV catheter placed into one of
      your veins. The medicine must be given slowly, so the IV will have to stay in
      place for at least 10 minutes.
  - type: paragraph
    text: Your doctor will give you other medicines (eg, folic acid, vitamin B12,
      steroid medicine) before you receive this medicine and during treatment to help
      prevent unwanted effects. Follow your doctor's instructions on how and when
      to take these medicines.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: Receiving this medicine while you are pregnant can harm your unborn baby.
      If you are female and can get pregnant, your doctor will do tests to make sure
      you are not pregnant before receiving this medicine. It may also cause birth
      defects if the father is using it when his sexual partner becomes pregnant.
      Female patients should use effective birth control during treatment with this
      medicine and for at least 6 months after the last dose. Male patients who have
      female partners should use effective birth control during treatment with this
      medicine and for at least 3 months after the last dose. If you think you have
      become pregnant while receiving this medicine, tell your doctor right away.
  - type: paragraph
    text: Pemetrexed and cisplatin can sometimes cause nausea and vomiting. However,
      it is very important that you continue to receive the medicine, even if you
      begin to feel ill. You can get medicines to help control the nausea and vomiting.
      Talk with your doctor if you get any of these symptoms.
  - type: paragraph
    text: 'Pemetrexed can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. It can also lower the
      number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, diarrhea, lower back or side pain, mouth sores, or painful or
      difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, trouble breathing, unusual tiredness or weakness, vomiting, or
      weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: Serious skin reactions (eg, Stevens-Johnson syndrome and toxic epidermal
      necrolysis) can occur with this medicine. Check with your doctor right away
      if you have blistering, peeling, or loosening of the skin, red skin lesions,
      severe acne or a skin rash, sores or ulcers on the skin, or fever or chills
      with this medicine.
  - type: paragraph
    text: Serious lung or breathing problems (eg, interstitial pneumonitis) may occur
      after you receive this medicine. Call your doctor right away if have any changes
      in your breathing after you receive this medicine.
  - type: paragraph
    text: Tell your doctor if you have received radiation treatment in the past. You
      may be more sensitive to the effects of this medicine (eg, pain and redness
      of the skin at the place of earlier radiation treatment).
  - type: paragraph
    text: If you have kidney problems, make sure your doctor knows if you are using
      an NSAID or pain or arthritis medicine, especially ibuprofen. Do not take ibuprofen
      at least 2 days before or 2 days after receiving this medicine. Taking ibuprofen
      during treatment with this medicine may increase your risks for bone marrow,
      kidney, and stomach or bowel problems.
  - type: paragraph
    text: If you plan to have children, talk with your doctor before using this medicine.
      Some men receiving this medicine have become infertile (unable to have children).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - chest pain
      - chills
      - cough
      - fever
      - loss of coordination
      - lower back or side pain
      - painful or difficult urination
      - pains in the chest, groin, or legs, especially calves of the legs
      - pale skin
      - pinpoint red spots on the skin
      - severe headaches of sudden onset
      - sore throat
      - sudden onset of slurred speech
      - sudden vision changes
      - swollen glands
      - trouble breathing
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody urine or bloody stools
      - chest tightness
      - decreased frequency or amount of urine
      - fainting or loss of consciousness
      - fast or irregular breathing
      - increased blood pressure
      - increased thirst
      - itching, skin rash
      - loss of appetite
      - nausea
      - swelling of the eyes, eyelids, face, fingers, or lower legs
      - vomiting
      - weight gain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - joint or muscle pain
      - pain and redness of the skin in the area of earlier radiation treatment
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - stomach cramps, tenderness, or pain
      - watery diarrhea
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, tingling, numbness, or pain in the hands, arms, feet, or legs
      - confusion
      - constipation
      - cough
      - diarrhea
      - difficulty with moving
      - difficulty with swallowing
      - discouragement
      - dizziness
      - dry mouth
      - feeling sad or empty
      - hair loss
      - headache
      - heartburn
      - hoarseness
      - increase in heart rate
      - irritability
      - lightheadedness
      - loss of interest or pleasure
      - mood changes
      - muscle ache, cramp, or stiffness
      - pain or burning in the throat
      - pain produced by swallowing
      - rapid breathing
      - sensation of pins and needles
      - stabbing pain
      - stuffy or runny nose
      - sunken eyes
      - swelling or inflammation of the mouth
      - swollen joints
      - thinning of the hair
      - thirst
      - tiredness
      - trouble concentrating
      - trouble sleeping
      - weight loss
      - wrinkled skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
