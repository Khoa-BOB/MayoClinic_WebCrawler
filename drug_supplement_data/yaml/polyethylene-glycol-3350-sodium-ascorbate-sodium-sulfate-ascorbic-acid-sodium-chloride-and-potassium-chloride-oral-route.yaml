  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Aclidinium
      - Amantadine
      - Amitriptyline
      - Amoxapine
      - Anisotropine
      - Atropine
      - Belladonna
      - Benztropine
      - Biperiden
      - Bornaprine
      - Brompheniramine
      - Butylscopolamine
      - Carbinoxamine
      - Carisoprodol
      - Chlorpheniramine
      - Chlorpromazine
      - Cimetropium
      - Clemastine
      - Clidinium
      - Clomipramine
      - Clozapine
      - Cyclobenzaprine
      - Cyclopentolate
      - Cyproheptadine
      - Darifenacin
      - Desipramine
      - Dicyclomine
      - Dimenhydrinate
      - Diphenhydramine
      - Doxepin
      - Emepronium
      - Eplerenone
      - Fesoterodine
      - Flavoxate
      - Fluphenazine
      - Glycopyrrolate
      - Glycopyrronium Tosylate
      - Homatropine
      - Hydroxyzine
      - Hyoscyamine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alacepril
      - Amiloride
      - Amygdalin
      - Benazepril
      - Bisacodyl
      - Canrenoate
      - Captopril
      - Cilazapril
      - Deferoxamine
      - Delapril
      - Fosinopril
      - Imidapril
      - Indomethacin
      - Licorice
      - Lisinopril
      - Moexipril
      - Pentopril
      - Perindopril
      - Quinapril
      - Ramipril
      - Senna
      - Sodium Picosulfate
      - Sparsentan
      - Spirapril
      - Spironolactone
      - Temocapril
      - Trandolapril
      - Triamterene
      - Zofenopril
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Indinavir
      - Licorice
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (chest pain), unstable or
      - Heart attack, recent or
      - Heart disease (eg, cardiomyopathy) or
      - Heart rhythm problems (eg, prolonged QT interval, uncontrolled arrhythmia),
        history of or
      - Hypocalcemia (low calcium in the blood) or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood) or
      - Hyponatremia (low sodium level in the blood) or
      - Withdrawal from alcohol or benzodiazepines (eg, alprazolam, clonazepam, diazepam,
        lorazepam, Xanax®)—May increase risk for seizures, arrhythmia, or kidney problems.
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Dehydration or
      - Inflammatory bowel disease or
      - Kidney disease or
      - Seizures, history of or
      - Trouble swallowing or
      - Ulcerative colitis, active and severe—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Fluid and electrolyte imbalance—Must be corrected first before starting treatment
        with this medicine.
    - type: list
      ordered: false
      items:
      - Gastric retention (problems with emptying of food or fluid from the stomach)
        or
      - Stomach or bowel problems (eg, blockage, ileus, perforation) or
      - Toxic megacolon (a very dilated intestine)—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Glucose-6-phosphate dehydrogenase (G6PD) deficiency with an infection, or
        a history of hemolysis—Use with caution. This medicine contains sodium ascorbate
        and ascorbic acid which may cause serious unwanted effects in patients with
        this condition.
    - type: list
      ordered: false
      items:
      - Phenylketonuria—Use with caution. This medicine contains phenylalanine which
        may cause serious unwanted effects in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide and patient instructions. Read
      and follow these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: 'To prepare the mixture :'
  - type: list
    ordered: false
    items:
    - Empty the contents of the packet (Dose 1) into the mixing container.
    - Add at least 16 ounces (oz) of water to the fill line. Do not add any other
      liquid or starch-based thickeners to the medicine.
    - Mix with a spoon or put the lid on the container and shake for about 2 to 3
      minutes until the mixture is completely dissolved.
    - Rinse the mixing container with water and refill it with clear liquids (16 oz)
      within 30 minutes.
    - For Dose 2, repeat the steps for Dose 1, but you should empty the contents of
      the two dose pouches (A and B) into the mixing container at the same time.
  - type: paragraph
    text: It is best if you do not eat any solid food before taking this medicine
      and until after your colonoscopy .
  - type: paragraph
    text: You may drink clear liquids (eg, water) up until 2 hours before the time
      of the test. However, check first with your doctor. Do not eat or drink alcohol,
      milk, or anything red or purple liquids or foods with pulp.
  - type: paragraph
    text: If you take other medicines, take them at least 1 hour before you start
      this medicine.
  - type: paragraph
    text: 'You may take this medicine 2 ways: the One-Day Morning Dosing schedule
      or the Two-Day Split Dosing schedule.'
  - type: list
    ordered: false
    items:
    - 'One-Day Morning Dosing: You may eat a light breakfast and lunch one day before
      the procedure. You may also have clear broth soup or plain yogurt for dinner
      (about 8 PM). You should not eat the morning of your colonoscopy.'
    - 'Two-Day Split Dosing: You may eat a light breakfast and lunch one day before
      the procedure. You should finish eating your lunch at least 3 hours before you
      start using this medicine.'
  - type: list
    ordered: false
    items:
    - You may eat a light breakfast and lunch one day before the procedure. You may
      also have clear broth soup or plain yogurt for dinner (about 8 PM). You should
      not eat the morning of your colonoscopy.
  - type: list
    ordered: false
    items:
    - You may eat a light breakfast and lunch one day before the procedure. You should
      finish eating your lunch at least 3 hours before you start using this medicine.
  - type: paragraph
    text: You should have your first loose stool or mild diarrhea about 1 to 2 hours
      after you drink the medicine. This is how the medicine cleans out your bowels.
      You may have bloating or an upset stomach before the loose stools start.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (powder for solution): For cleansing the bowels: Adults—Your
        doctor will tell you how to use this medicine, either by the One-Day Morning
        Dosing option or the Two-Day Split Dosing option. One-Day Morning Dosing:
        Take the first dose the morning of your colonoscopy (between 3 AM and 7 AM),
        then the second dose about 2 hours after. You should have taken the second
        dose at least 2 hours before your colonoscopy. Two-Day Split Dosing: Take
        the first dose in the evening (between 4 PM and 8 PM), then the second dose
        12 hours after. You should have taken the second dose at least 2 hours before
        your colonoscopy. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For cleansing the bowels: Adults—Your doctor will tell you how to use this
        medicine, either by the One-Day Morning Dosing option or the Two-Day Split
        Dosing option. One-Day Morning Dosing: Take the first dose the morning of
        your colonoscopy (between 3 AM and 7 AM), then the second dose about 2 hours
        after. You should have taken the second dose at least 2 hours before your
        colonoscopy. Two-Day Split Dosing: Take the first dose in the evening (between
        4 PM and 8 PM), then the second dose 12 hours after. You should have taken
        the second dose at least 2 hours before your colonoscopy. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults—Your doctor will tell you how to use this medicine, either by the
        One-Day Morning Dosing option or the Two-Day Split Dosing option. One-Day
        Morning Dosing: Take the first dose the morning of your colonoscopy (between
        3 AM and 7 AM), then the second dose about 2 hours after. You should have
        taken the second dose at least 2 hours before your colonoscopy. Two-Day Split
        Dosing: Take the first dose in the evening (between 4 PM and 8 PM), then the
        second dose 12 hours after. You should have taken the second dose at least
        2 hours before your colonoscopy.'
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'One-Day Morning Dosing: Take the first dose the morning of your colonoscopy
        (between 3 AM and 7 AM), then the second dose about 2 hours after. You should
        have taken the second dose at least 2 hours before your colonoscopy.'
      - 'Two-Day Split Dosing: Take the first dose in the evening (between 4 PM and
        8 PM), then the second dose 12 hours after. You should have taken the second
        dose at least 2 hours before your colonoscopy.'
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: You may store the unopened medicine and the oral liquid at room temperature
        or in the refrigerator. You may use this medicine within 6 hours after mixing
        it with water. Throw away any unused oral liquid after 6 hours.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress to make sure that
      this medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: Do not use this medicine together with other laxatives (eg, bisacodyl [Dulcolax®]
      or sodium picosulfate [Dulcolax® Pico, CitraFleet®]).
  - type: paragraph
    text: Contact your doctor right away if you have decreased urination, dizziness,
      headache, or vomiting. These could be symptoms of a loss of too much body fluid
      (dehydration).
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you had a heart rhythm problem, including
      QT prolongation.
  - type: paragraph
    text: This medicine may increase your risk for seizures. This is more likely to
      occur if you take medicine for depression, if you are withdrawing from alcohol
      or benzodiazepine use, or if you have low sodium level in the blood (hyponatremia).
      Talk to your doctor if you have any concerns.
  - type: paragraph
    text: This medicine may cause serious bowel problems (eg, colon ulcers, ischemic
      colitis). Check with your doctor right away if you have stomach pain and tenderness,
      bloody stools, or rectal bleeding.
  - type: paragraph
    text: Keep yourself hydrated before, during, and after using this medicine. Drink
      extra fluids so you will pass more urine. This may help prevent kidney problems.
      Check with your doctor right away if you have bloody urine, a decrease in frequency
      or amount of urine, an increase in blood pressure, increased thirst, loss of
      appetite, lower back or side pain, nausea, swelling of the face, fingers, or
      lower legs, trouble breathing, unusual tiredness or weakness, vomiting, or weight
      gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Tell your doctor right away if you have a rash, itching, hoarseness,
      trouble breathing, trouble swallowing, or large, hive-like swelling on the face,
      eyelids, lips, tongue, throat, hands, legs, feet, or genitals after using this
      medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - decreased urination
      - dizziness
      - dry mouth
      - fainting
      - full or bloated feeling
      - headache
      - heartburn
      - increase in heart rate
      - irregular heartbeat
      - lightheadedness
      - muscle cramps or pain
      - nervousness
      - numbness, tingling, pain, or weakness in the hands or feet
      - pounding in the ears
      - pressure in the stomach
      - rapid breathing
      - seizures
      - slow or fast heartbeat
      - stomach pain or discomfort
      - sunken eyes
      - swelling of the stomach area
      - thirst
      - trembling
      - unusual tiredness or weakness
      - vomiting
      - weakness and heaviness of the legs
      - wrinkled skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - fast, irregular, pounding, or racing heartbeat or pulse
      - fever
      - hives, itching, rash
      - hoarseness
      - irritation
      - joint pain, stiffness, or swelling
      - redness of the skin
      - swelling of the eyelids, face, lips, hands, or feet
      - trouble breathing or swallowing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody or black, tarry stools
      - blue lips and fingernails
      - chest pain
      - constipation
      - coughing that sometimes produces a pink frothy sputum
      - difficult, fast, noisy breathing
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - pale skin
      - rapid weight gain
      - severe stomach pain
      - swelling in the legs and ankles
      - swelling of the neck
      - throat tightness
      - tingling of the hands or feet
      - tremor
      - unusual weight gain or loss
      - vomiting of blood or material that looks like coffee grounds
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sore throat
      - stuffy or runny nose
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Discomfort in the anus or rectum
      - feeling of warmth
      - headache, severe and throbbing
      - lack or loss of strength
      - redness of the face, neck, arms and occasionally, upper chest
      - sleepiness or unusual drowsiness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
