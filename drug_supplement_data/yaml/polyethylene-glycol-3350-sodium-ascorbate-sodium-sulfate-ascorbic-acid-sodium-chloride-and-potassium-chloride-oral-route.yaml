title: Polyethylene glycol 3350, sodium ascorbate, sodium sulfate, ascorbic acid,
  sodium chloride, and potassium chloride (oral route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Polyethylene glycol 3350, sodium ascorbate, sodium sulfate, ascorbic acid,
      sodium chloride, and potassium chloride combination is used to cleanse the bowels
      before a procedure called colonoscopy. This medicine is a laxative. It works
      by causing you to have diarrhea to clean your colon. Cleaning your colon will
      help your doctor see the inside of your colon more clearly during colonoscopy
      or other procedures.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of polyethylene glycol 3350, sodium ascorbate, sodium sulfate,
        ascorbic acid, sodium chloride, and potassium chloride combination in the
        pediatric population. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of polyethylene glycol 3350, sodium
        ascorbate, sodium sulfate, ascorbic acid, sodium chloride, and potassium chloride
        combination in the elderly. However, elderly patients are more likely to have
        unwanted effects and age-related liver, kidney, or heart problems, which may
        require caution for patients receiving this medicine.
    subsections: []
