title: Ertugliflozin and sitagliptin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Steglujan
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ertugliflozin and sitagliptin combination is used with proper diet and exercise
      to treat high blood sugar levels caused by type 2 diabetes.
  - type: paragraph
    text: Ertugliflozin works in the kidneys to prevent absorption of glucose (blood
      sugar). This helps lower the blood sugar level. Sitagliptin helps to control
      blood sugar levels by increasing substances in the body that make the pancreas
      release more insulin. It also signals the liver to stop producing sugar (glucose)
      when there is too much sugar in the blood. This medicine does not help patients
      who have insulin-dependent or type 1 diabetes. Type 1 diabetic patients must
      use insulin injections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of ertugliflozin and sitagliptin combination in the pediatric
        population. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of ertugliflozin and sitagliptin
        combination in the elderly. However, elderly patients are more likely to have
        kidney problems, which may require caution in the dose for patients receiving
        ertugliflozin and sitagliptin combination.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Acarbose
      - Cannabidiol
      - Chloroquine
      - Chlorothiazide
      - Chlorpropamide
      - Chlorthalidone
      - Ciprofloxacin
      - Delafloxacin
      - Enoxacin
      - Furosemide
      - Gatifloxacin
      - Gemifloxacin
      - Glimepiride
      - Glipizide
      - Glyburide
      - Grepafloxacin
      - Hydrochlorothiazide
      - Hydroflumethiazide
      - Hydroxychloroquine
      - Indapamide
      - Insulin
      - Insulin Aspart, Recombinant
      - Insulin Bovine
      - Insulin Degludec
      - Insulin Detemir
      - Insulin Glargine, Recombinant
      - Insulin Glulisine
      - Insulin Lispro, Recombinant
      - Lanreotide Acetate
      - Levofloxacin
      - Lithium
      - Lomefloxacin
      - Meloxicam
      - Metformin
      - Metolazone
      - Moxifloxacin
      - Nateglinide
      - Norfloxacin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acebutolol
      - Atenolol
      - Betaxolol
      - Bisoprolol
      - Carteolol
      - Carvedilol
      - Celiprolol
      - Esmolol
      - Glecaprevir
      - Labetalol
      - Levobunolol
      - Metipranolol
      - Metoprolol
      - Nadolol
      - Nebivolol
      - Oxprenolol
      - Penbutolol
      - Pibrentasvir
      - Pindolol
      - Practolol
      - Propranolol
      - Sotalol
      - Timolol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse, history of or
      - Congestive heart failure, history of or
      - Dehydration, severe or
      - Pancreatic insulin deficiency (eg, pancreatitis, pancreatic surgery), history
        of or
      - Decrease in eating due to illness, surgery or
      - Weakened physical condition—May increase risk for more serious side effects.
    - type: list
      ordered: false
      items:
      - Blood vessel disease or
      - Diabetic foot ulcer or
      - Leg amputation (leg removal surgery), history of or
      - Neuropathy (nerve problem) of the leg—May increase the risk of leg amputations.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Diabetic ketoacidosis or metabolic acidosis (high ketones and acid in the
        blood) or
      - Genital yeast (fungus) infection (eg, balanitis, balanoposthitis, vulvovaginitis),
        history of or
      - Hypotension (low blood pressure) or
      - Hypovolemia (low blood volume) or
      - Kidney disease or
      - Pancreatitis (swelling of the pancreas), history of or
      - Urinary tract infections (eg, pyelonephritis, urosepsis), history of—Use with
        caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Fever or
      - Infection or
      - Surgery or
      - Trauma—Use with caution. These conditions may cause problems with blood sugar
        control.
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate to severe (eg, end-stage kidney disease) or
      - Liver disease, severe or
      - Patients receiving dialysis or
      - Type I diabetes—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Tell your doctor if you are on a low-salt or sodium diet.
  - type: paragraph
    text: Carefully follow the special meal plan your doctor gave you . This is the
      most important part of controlling your diabetes, and will help the medicine
      work properly. Exercise regularly and check your blood sugar as directed.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For type 2 diabetes: Adults—At first, one
        tablet once a day, in the morning. Your doctor may increase your dose as needed
        and tolerated. However, the dose is usually not more than 15 milligrams (mg)
        of ertugliflozin and 100 mg of sitagliptin once a day. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For type 2 diabetes: Adults—At first, one tablet once a day, in the morning.
        Your doctor may increase your dose as needed and tolerated. However, the dose
        is usually not more than 15 milligrams (mg) of ertugliflozin and 100 mg of
        sitagliptin once a day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, one tablet once a day, in the morning. Your doctor may increase
        your dose as needed and tolerated. However, the dose is usually not more than
        15 milligrams (mg) of ertugliflozin and 100 mg of sitagliptin once a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the medicine dry and in its original container.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      , especially during the first few weeks that you take this medicine. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine during the second and later part of a pregnancy can
      harm your unborn baby. If you think you have become pregnant while using this
      medicine, tell your doctor right away.
  - type: paragraph
    text: 'It is very important to follow carefully any instructions from your doctor
      about:'
  - type: list
    ordered: false
    items:
    - Alcohol—Drinking alcohol may cause severe high blood sugar. Discuss this with
      your doctor.
    - Other medicines—Do not take other medicines unless they have been discussed
      with your doctor. This especially includes nonprescription medicines such as
      aspirin, and medicines for appetite control, asthma, colds, cough, hay fever,
      or sinus problems.
    - Counseling—Other family members need to learn how to prevent side effects or
      help with side effects if they occur. Also, patients with diabetes may need
      special counseling about the changes in the dosing of their diabetes medicine
      that might occur because of lifestyle changes, such as changes in exercise,
      diet, and illness. Furthermore, counseling on contraception and pregnancy may
      be needed because of the problems that can occur in patients with diabetes during
      pregnancy.
    - Travel—Keep a recent prescription and your medical history with you. Be prepared
      for an emergency as you would normally. Make allowances for changing time zones
      and keep your meal times as close as possible to your usual meal times.
    - In case of emergency—There may be a time when you need emergency help for a
      problem caused by your diabetes. You need to be prepared for these emergencies.
      It is a good idea to wear a medical identification (ID) bracelet or neck chain
      at all times. Also, carry an ID card in your wallet or purse that says that
      you have diabetes and a list of all of your medicines.
  - type: paragraph
    text: Pancreatitis (swelling of the pancreas) may occur while you are using this
      medicine. Check with your doctor right away if you have a sudden and severe
      stomach pain, chills, constipation, nausea, vomiting, loss of appetite, fever,
      or lightheadedness.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur with this medicine. This
      is more common if you have kidney disease, low blood pressure, or if you are
      taking a diuretic (water pill). Drinking plenty of fluids each day may help.
      Drink plenty of water during exercise or in hot weather. Check with your doctor
      if you have severe nausea, vomiting, or diarrhea that does not stop. This may
      cause you to lose too much water.
  - type: paragraph
    text: Diabetic ketoacidosis (high ketones and acid in the blood) may occur while
      you are using this medicine. This can be life-threatening and requires immediate
      medical attention. Your doctor may give you insulin, fluid, and carbohydrate
      replacement to treat this condition. Tell your doctor right away if you have
      nausea, vomiting, trouble breathing, or increased thirst or urination.
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, decrease in
      how much or how often you urinate, an increase in blood pressure, increased
      thirst, loss of appetite, lower back or side pain, nausea, swelling of the face,
      fingers, or lower legs, trouble breathing, unusual tiredness or weakness, vomiting,
      or weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: This medicine may increase your risk of having urinary tract infections,
      including pyelonephritis or urosepsis. Check with your doctor right away if
      you have bladder pain, bloody or cloudy urine, difficult, burning, or painful
      urination, or lower back or side pain.
  - type: paragraph
    text: This medicine may increase your risk of having lower leg or foot amputation
      (leg removal surgery). Check with your doctor right away if you have pain, tenderness,
      sores or ulcers, or infections on your leg or foot.
  - type: paragraph
    text: Check with your doctor right away if you have chest pain or tightness, decreased
      urine output, dilated neck veins, extreme fatigue, irregular breathing, irregular
      heartbeat, swelling of the face, fingers, feet, or lower legs, trouble breathing,
      or weight gain. These may be symptoms of heart failure.
  - type: paragraph
    text: This medicine may cause hypoglycemia (low blood sugar). This is more common
      when this medicine is taken together with other diabetes medicines (eg, insulin,
      glipizide, or glyburide). Low blood sugar must be treated before it causes you
      to pass out (unconsciousness) . People feel different symptoms of low blood
      sugar. It is important that you learn which symptoms you usually have so you
      can treat it quickly. Talk to your doctor about the best way to treat low blood
      sugar.
  - type: paragraph
    text: Hyperglycemia (high blood sugar) may occur if you do not take enough or
      skip a dose of your diabetes medicine, overeat or do not follow your diet plan,
      have a fever or infection, or do not exercise as much as usual. Some symptoms
      of high blood sugar include blurred vision, drowsiness, dry mouth, flushed and
      dry skin, a fruit-like breath odor, increased frequency and amount of urination,
      ketones in the urine, loss of appetite, nausea or vomiting, rapid and deep breathing,
      tiredness, or unusual thirst. If symptoms of high blood sugar occur, check your
      blood sugar level and call your doctor for instructions.
  - type: paragraph
    text: This medicine may cause vaginal yeast infections in women and yeast infections
      of the penis in men. This is more common in patients who have a history of genital
      yeast infections or in men who are not circumcised. Women may have a vaginal
      discharge, itching, or odor. Men may have redness, itching, swelling, or pain
      around the penis, or a discharge with a strong odor from the penis. Check with
      your doctor right away if you have any of these symptoms.
  - type: paragraph
    text: This medicine may cause a rare but serious bacterial infection, called necrotizing
      fasciitis of the perineum or Fournier's gangrene, which can cause damage to
      the skin tissue in the area between and around the anus and genitals (perineum).
      Fournier's gangrene may lead to hospitalization, multiple surgeries, or death.
      Check with your doctor right away if you have fever, unusual tiredness or weakness,
      or pain, tenderness, redness, or swelling of the area between and around your
      anus and genitals.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      angioedema, or certain skin conditions (Stevens-Johnson syndrome), which can
      be life-threatening and require immediate medical attention. Call your doctor
      right away if you have a blistering, peeling, or loosening of the skin. chills,
      cough, diarrhea, joint or muscle pain. red irritated eyes, red skin lesions,
      often with a purple center, rash, sore throat, sores, ulcers, or white spots
      in the mouth or on the lips, , trouble breathing or swallowing, or any swelling
      of your hands, face, mouth, or throat while you are using this medicine.
  - type: paragraph
    text: This medicine may cause severe and disabling joint pain. Call your doctor
      right away if you have severe joint pain while using this medicine.
  - type: paragraph
    text: This medicine may cause bullous pemphigoid. Tell your doctor if you have
      large, hard skin blisters while using this medicine.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine 4 days before you have
      surgery or other procedures that require fasting. This medicine may also affect
      the results of certain medical tests (eg, urine glucose tests may not be accurate).
  - type: paragraph
    text: Limit the amount of alcohol you drink while you are using this medicine.
      Heavy alcohol use or binge drinking can increase your chances of serious side
      effects.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blurred vision
      - chills
      - cold sweats
      - confusion
      - cool, pale skin
      - depression
      - dizziness
      - fast heartbeat
      - headache
      - increased hunger
      - itching of the vagina or outside of the genitals
      - loss of consciousness
      - nausea
      - nervousness
      - seizures
      - shakiness
      - slurred speech
      - unusual tiredness or weakness
      - vaginal discharge without odor or with mild odor
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - blurred vision
      - decreased frequency or amount of urine
      - difficult, burning, or painful urination
      - discharge with a strong odor from the penis
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dry mouth
      - fainting
      - frequent urge to urinate
      - increase in heart rate
      - increased blood pressure
      - increased thirst
      - increased urination
      - loss of appetite
      - lower back or side pain
      - pain in the skin around the penis
      - rapid breathing
      - redness, itching, or swelling of the penis
      - sunken eyes
      - swelling of the face, fingers, or lower legs
      - trouble breathing
      - vomiting
      - weight gain
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Flushed, dry skin
      - fruit-like breath odor
      - stomach pain
      - unexplained weight loss
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - blistering, peeling, or loosening of the skin
      - bloating
      - chest tightness
      - constipation
      - cough
      - dark urine
      - decreased awareness or responsiveness
      - decreased urine output
      - diarrhea
      - difficulty in moving
      - difficulty swallowing
      - fever
      - hives, itching, skin rash
      - indigestion
      - irritability
      - joint or muscle pain
      - large, hard skin blisters
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss of appetite
      - muscle aching or cramping
      - muscle pain, stiffness, or twitching
      - pain, tenderness, redness, or swelling of the area between the anus and genitals
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid weight gain
      - red, irritated eyes
      - red skin lesions, often with a purple center
      - severe joint pain
      - severe sleepiness
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - swelling of the face, ankles, or hands
      - swollen joints
      - unusual drowsiness, dullness, or feeling of sluggishness
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - decreased weight
      - stuffy or runny nose
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain in the arms or legs
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
