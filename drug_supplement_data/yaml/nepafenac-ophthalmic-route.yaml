    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your eye doctor will check your or your child's eyes at regular visits to
      make sure it is working properly and is not causing unwanted effects.
  - type: paragraph
    text: If your or your child's symptoms do not improve within a few days or if
      they become worse, check with your doctor.
  - type: paragraph
    text: Slow or delayed healing may occur while you or your child are using this
      medicine. Ask your doctor before using this medicine together with a topical
      corticosteroid (eg, betamethasone, hydrocortisone).
  - type: paragraph
    text: Using this medicine may increase risk of having corneal (front part of the
      eye) problems, including keratitis. Check with your eye doctor right away if
      you or your child have blurred vision, changes in vision, or eye redness, irritation,
      or pain while using this medicine.
  - type: paragraph
    text: Make sure your doctor knows if you are pregnant. Do not use this medicine
      during the later part of a pregnancy, unless your doctor tells you to.
  - type: paragraph
    text: If you hurt your eye or develop an eye infection, talk with your doctor
      right away. You may need to change your medicine or stop using it.
  - type: paragraph
    text: Do not use other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - change in vision
      - decrease in vision
      - loss of vision
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Eye pain
      - itching of the eye
      - swelling and/or redness of the eye and lining of the eyelid
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Feeling of having something in the eye
      - sticky sensation of the eyelids
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in color vision
      - cough
      - crusting in the corner of the eye
      - difficulty seeing at night
      - dizziness
      - dry eyes
      - fever
      - headache
      - increased sensitivity of the eyes to sunlight
      - nausea or vomiting
      - nervousness
      - pounding in the ears
      - seeing flashes or sparks of light
      - seeing floating spots before the eyes, or a veil or curtain appearing across
        part of vision
      - slow or fast heartbeat
      - stuffy or runny nose
      - tenderness around the eyes and cheekbones
      - tightness of the chest or wheezing
      - troubled breathing
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
