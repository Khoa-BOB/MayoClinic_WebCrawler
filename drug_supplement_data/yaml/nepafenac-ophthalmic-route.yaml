    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to NSAIDs (eg, aspirin, celecoxib, diclofenac, etodolac, ibuprofen,
        indomethacin, nabumetone, naproxen, piroxicam, rofecoxib, valdecoxib, Advil®,
        Aleve®, Celebrex®, Ecotrin®, Motrin®, Voltaren®), history of—Should not be
        used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Bleeding problems—Use with caution. May make this condition worse.
    - type: list
      ordered: false
      items:
      - Corneal (front part of the eye) denervation or
      - Corneal (front part of the eye) epithelial defects or
      - Diabetes or
      - Ocular (eye) surface diseases (eg, dry eye syndrome) or
      - Ocular (eye) surgeries, complicated or
      - Ocular (eye) surgeries, multiple within a short period of time or
      - Rheumatoid arthritis—Use with caution. May increase the risk of having serious
        eye problems.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your eye doctor will tell you how much of this medicine to use and how often
      . Do not use more medicine or use it more often than your doctor tells you to.
      This medicine is not for long-term use.
  - type: paragraph
    text: Keep using this medicine for at least 2 weeks unless your doctor tells you
      otherwise.
  - type: paragraph
    text: This medicine can be used with other eye medicines. Wait at least 5 minutes
      before using another eye medicine.
  - type: paragraph
    text: If you or your child are wearing contact lenses, remove them while you are
      using this medicine. Talk to your eye doctor about this if you have questions.
  - type: paragraph
    text: 'To use the eye drops:'
  - type: list
    ordered: false
    items:
    - Shake the bottle well before each use.
    - First, wash your hands. Tilt the head back and, pressing your finger gently
      on the skin just beneath the lower eyelid away from the eye to make a space.
      Drop the medicine into this space. Let go of the eyelid and gently close the
      eyes. Do not blink. Keep the eyes closed and apply pressure to the inner corner
      of the eye with your finger for 1 or 2 minutes to allow the medicine to be absorbed
      by the eye.
    - Immediately after using the eye drops, wash your hands to remove any medicine
      that may be on them.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, always keep the container tightly
      closed. Serious damage to the eye and possible loss of vision may result from
      using contaminated eye drops.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic dosage form (eye drops): For eye pain or swelling following
        cataract surgery: Adults, teenagers, and children 10 years of age and older—
        Ilevro™: Use one drop in the affected eye once a day beginning 1 day before
        cataract surgery, continued on the day of surgery, and for 2 weeks after the
        surgery. An additional drop should be given 30 to 120 minutes before surgery.
        Nevanac®: Use one drop in the affected eye three times a day beginning 1 day
        before cataract surgery, continued on the day of surgery, and for 2 weeks
        after the surgery. Children younger than 10 years of age—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For eye pain or swelling following cataract surgery: Adults, teenagers, and
        children 10 years of age and older— Ilevro™: Use one drop in the affected
        eye once a day beginning 1 day before cataract surgery, continued on the day
        of surgery, and for 2 weeks after the surgery. An additional drop should be
        given 30 to 120 minutes before surgery. Nevanac®: Use one drop in the affected
        eye three times a day beginning 1 day before cataract surgery, continued on
        the day of surgery, and for 2 weeks after the surgery. Children younger than
        10 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults, teenagers, and children 10 years of age and older— Ilevro™: Use one
        drop in the affected eye once a day beginning 1 day before cataract surgery,
        continued on the day of surgery, and for 2 weeks after the surgery. An additional
        drop should be given 30 to 120 minutes before surgery. Nevanac®: Use one drop
        in the affected eye three times a day beginning 1 day before cataract surgery,
        continued on the day of surgery, and for 2 weeks after the surgery.'
      - Children younger than 10 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - 'Ilevro™: Use one drop in the affected eye once a day beginning 1 day before
        cataract surgery, continued on the day of surgery, and for 2 weeks after the
        surgery. An additional drop should be given 30 to 120 minutes before surgery.'
      - 'Nevanac®: Use one drop in the affected eye three times a day beginning 1
