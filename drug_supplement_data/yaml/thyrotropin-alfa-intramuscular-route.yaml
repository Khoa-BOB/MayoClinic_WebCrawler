title: Thyrotropin alfa (intramuscular route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Thyrotropin alfa injection is a form of human thyroid stimulating hormone
      (TSH). It is used with or without radioactive iodine imaging to test the presence
      of thyroglobulin (Tg) in patients with thyroid cancer.
  - type: paragraph
    text: Thyrotropin alfa injection is also used with radioactive iodine to remove
      any remaining diseased thyroid tissue in patients with thyroid cancer who have
      had most or all of their thyroid gland removed.
  - type: paragraph
    text: This medicine is to be given only by or under the immediate supervision
      of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of thyrotropin alfa injection in children. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of thyrotropin alfa injection in
        the elderly. However, elderly patients are more likely to have thyroid problems
        (eg, hyperthyroidism) which may require caution in patients receiving this
        medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart disease, history of or
      - Metastatic thyroid cancer (cancer that has already spread to different parts
        of the body) or
      - Migraine headaches, history of or
      - Nerve problems or
      - Patients who did not undergo thyroidectomy (surgery to remove thyroid gland)
        or
      - Residual thyroid tissue, significant or
      - Stroke, history of—Use with caution. May increase the risk for serious side
        effects.
    - type: list
      ordered: false
      items:
      - Kidney disease, end-stage or
      - Patients undergoing dialysis—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Before receiving this medicine, make sure you understand all the risks and
      benefits. It is important for you to work closely with your doctor during your
      treatment.
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. This medicine is given as a shot into a muscle of the
      buttocks.
  - type: paragraph
    text: Drink extra fluids before treatment with this medicine.
  - type: paragraph
    text: For your doctor to properly treat your medical condition, you must receive
      2 doses of this medicine . After the last dose, your doctor may want to perform
      certain tests that are very important.
  - type: paragraph
    text: Your doctor may have special instructions for you to get ready for your
      treatment. If you have not received such instructions or you do not understand
      them, check with your doctor ahead of time.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you closely while you are receiving
      this medicine. This will allow your doctor to see if the medicine is working
      properly and to decide if you should continue to receive it. Blood tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: Thyrotropin alfa may be given together with radioiodine. You will be exposed
      to radiation while receiving radioiodine. Talk with your doctor about precautions
      that you should take for yourself and for the people around you.
  - type: paragraph
    text: This medicine may increase you risk of having a stroke. Call your doctor
      right away if you have an inability to move the legs or arms, or paralysis of
      one side of the body after receiving this medicine. Tell your doctor if you
      smoke or take birth control pills.
  - type: paragraph
    text: Tell your doctor right away if you have sudden, rapid, and painful enlargement
      of thyroid tumors, loss of vision, troubled breathing, or voice changes. Your
      doctor may want you to receive glucocorticoids (steroids) before receiving this
      medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Inability to move the legs or arms
      - paralysis of one side of the body
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Faintness
      - feeling of warmth
      - skin rash, hives, welts, itching, or redness
      - itching, redness, or swelling at the injection site
      - loss of vision
      - redness of the face, neck, arms, and occasionally, upper chest
      - tightness of the throat
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - confusion
      - coughing
      - difficult or labored breathing
      - difficulty with speaking
      - difficulty with swallowing
      - dizziness
      - double vision
      - fast, slow, or irregular heartbeat
      - fever
      - headache
      - hoarseness
      - inability to move the facial muscles
      - muscle or joint pain
      - sore throat
      - voice changes
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fast or irregular heartbeat
      - increased sweating
      - irritability
      - nausea
      - nervousness
      - sweating
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Frequent urge to urinate
      - stomach discomfort
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - diarrhea
      - lack or loss of strength
      - stuffy or runny nose
      - trouble sleeping
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of skin, feeling of
        pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
