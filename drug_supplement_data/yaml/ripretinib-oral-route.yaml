title: Ripretinib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Qinlock
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ripretinib is used to treat gastrointestinal stromal tumor (GIST) in patients
      who have received treatment with at least 3 other medicines (eg, imatinib).
      GIST is a group of cancer cells that start growing in the wall of the stomach,
      bowels, or rectum.
  - type: paragraph
    text: Ripretinib belongs to the group of medicines known as antineoplastics (cancer
      medicines). It works by interfering with the growth of cancer cells, which are
      eventually destroyed.
  - type: paragraph
    text: Before you begin treatment with ripretinib, you should talk to your doctor
      about the benefits as well as the risks of using this medicine.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of ripretinib in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of ripretinib in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Apalutamide
      - Avacopan
      - Bosentan
      - Carbamazepine
      - Cenobamate
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Efavirenz
      - Enzalutamide
      - Etravirine
      - Fedratinib
      - Fexinidazole
      - Fosphenytoin
      - Influenza Virus Vaccine, Live
      - Letermovir
      - Lorlatinib
      - Lumacaftor
      - Mifepristone
      - Mitotane
      - Modafinil
      - Nafcillin
      - Omaveloxolone
      - Phenobarbital
      - Phenytoin
      - Primidone
      - Rifabutin
      - Rifampin
      - Rotavirus Vaccine, Live
      - St John's Wort
      - Tazemetostat
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart disease or
      - Skin problems (eg, skin cancer)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Hypertension (high blood pressure), uncontrolled—This condition must be corrected
        first before using and during treatment with this medicine.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease, moderate or severe—Use with caution. This medicine has not
        been studied in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Surgery, recent—Use with caution. May cause side effects to become worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before using this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine comes with patient information insert. Read and follow these
      instructions carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: Take this medicine at the same time each day. You may take it with or without
      food.
  - type: paragraph
    text: Swallow the tablet whole. Do not crush, break, or chew it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For gastrointestinal stromal tumor (GIST):
        Adults—150 milligrams (mg) once a day. Your doctor may adjust your dose as
        needed and tolerated. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For gastrointestinal stromal tumor (GIST): Adults—150 milligrams (mg) once
        a day. Your doctor may adjust your dose as needed and tolerated. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—150 milligrams (mg) once a day. Your doctor may adjust your dose as
        needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is less than 8 hours of your scheduled dose,
        take it as soon as possible and then go back to your regular dosing schedule.
        If you miss a dose and it is more than 8 hours of your scheduled dose, skip
        the missed dose and go back to your regular dosing schedule. If you vomit
        after taking a dose, take the next dose at the regular time.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you are a woman who can bear children, your doctor may give you a pregnancy
      test before you start using this medicine to make sure you are not pregnant.
      Female patients should use an effective form of birth control during treatment
      with this medicine and for at least 1 week after the last dose. Male patients
      who have female partners should use effective birth control during treatment
      with this medicine and for at least 1 week after the last dose. If you think
      you have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: Ripretinib may cause a serious skin problem called hand-foot syndrome or
      palmar-plantar erythrodysesthesia syndrome. Tell your doctor right away if you
      have a rash that does not go away or redness, pain, swelling, bleeding, or blisters
      on the palms of your hands or soles of your feet.
  - type: paragraph
    text: This medicine may increase your risk for new skin cancers (eg, cutaneous
      squamous cell carcinoma, melanoma). Check with your doctor right away if you
      have a new wart, skin sore or reddish bump that bleeds or does not heal, or
      change in size or color of a mole.
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. If you think your blood
      pressure is too high, call your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you have chest pain or discomfort,
      dilated neck veins, irregular breathing, irregular heartbeat, swelling of the
      face, fingers, feet, or lower legs, unusual tiredness or weakness, or weight
      gain. These could be symptoms of a heart problem (eg, cardiac failure, acute
      left ventricular failure, diastolic dysfunction, ventricular hypertrophy).
  - type: paragraph
    text: This medicine may affect the way your body heals from cuts and wounds. Make
      sure any doctor who treats you knows that you are using this medicine. You may
      need to stop using this medicine several days before and after having surgery.
  - type: paragraph
    text: This medicine may make your skin more sensitive to sunlight. Use a sunscreen
      when you are outdoors. Avoid exposure to direct sunlight, sunlamps, or other
      ultraviolet radiation during treatment and for at least 1 week after the last
      dose.
  - type: paragraph
    text: If you plan to have children, talk with your doctor before using this medicine.
      Some men using this medicine have become infertile (unable to have children).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, loosening of the skin
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - blurred vision
      - chest tightness
      - constipation
      - diarrhea
      - difficult or labored breathing
      - dizziness
      - headache
      - nausea or vomiting
      - nervousness
      - pounding in the ears
      - rash, redness, swelling, pain, or ulceration of the skin
      - scaling of the skin on the hands and feet
      - slow or fast heartbeat
      - stomach pain
      - tingling of the hands or feet
      - unusual weight gain or loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in size, shape, or color of existing mole
      - chest pain or discomfort
      - decreased urine output
      - dilated neck veins
      - irregular breathing
      - irregular heartbeat
      - mole that leaks fluid or bleeds
      - new mole
      - pale skin
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Increased sensitivity of the skin to sunlight
      - redness or other discoloration of the skin
      - severe sunburn
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty in moving
      - dry or itching skin
      - joint pain or swelling
      - lack or loss of strength
      - loss of appetite
      - loss or thinning of the hair
      - muscle pains or stiffness
      - swelling or inflammation of the mouth
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
