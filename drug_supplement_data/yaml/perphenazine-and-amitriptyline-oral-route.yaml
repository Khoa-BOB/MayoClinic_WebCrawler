title: Perphenazine and amitriptyline (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Duo-Vil 2-10
    - type: paragraph
      text: Duo-Vil 2-25
    - type: paragraph
      text: Etrafon
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Perphenazine and amitriptyline combination is used to treat certain mental
      and emotional conditions.
  - type: paragraph
    text: This combination is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Certain side effects, such as muscle spasms of the face, neck, and back,
        tic-like or twitching movements, inability to move the eyes, twisting of the
        body, or weakness of the arms and legs, are more likely to occur in children,
        who are usually more sensitive than adults to some of the side effects of
        perphenazine and amitriptyline combination.
    - type: paragraph
      text: The perphenazine and amitriptyline combination must be used with caution
        in children with depression. Studies have shown occurrences of children thinking
        about suicide or attempting suicide in clinical trials for this medicine.
        More study is needed to be sure the perphenazine and amitriptyline combination
        is safe and effective in children
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Confusion, vision problems, dizziness or fainting, drowsiness, dryness
        of mouth, constipation, problems in urinating, trembling of the hands and
        fingers, and symptoms of tardive dyskinesia (such as uncontrolled movements
        of the mouth, tongue, jaw, arms, and/or legs) are especially likely to occur
        in elderly patients. Older patients are usually more sensitive than younger
        adults to the effects of perphenazine and amitriptyline combination.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Bromopride
      - Cisapride
      - Clorgyline
      - Dronedarone
      - Droperidol
      - Furazolidone
      - Grepafloxacin
      - Iproniazid
      - Isocarboxazid
      - Levoketoconazole
      - Levomethadyl
      - Mavorixafor
      - Mesoridazine
      - Methylene Blue
      - Metoclopramide
      - Moclobemide
      - Nialamide
      - Pargyline
      - Phenelzine
      - Pimozide
      - Piperaquine
      - Potassium Chloride
      - Potassium Citrate
      - Procarbazine
