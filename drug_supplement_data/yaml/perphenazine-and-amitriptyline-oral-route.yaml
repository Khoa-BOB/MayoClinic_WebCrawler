    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse—Certain side effects such as heat stroke may be more likely
        to occur
    - type: list
      ordered: false
      items:
      - Asthma (history of) or other lung disease or
      - Bipolar disorder (manic-depressive illness) or
      - Blood disease or
      - Breast cancer or
      - Difficult urination or
      - Enlarged prostate or
      - Epilepsy or other seizure disorders or
      - Glaucoma or
      - Heart or blood vessel disease or
      - Mental illness (severe) or
      - Parkinson's disease or
      - Stomach or intestinal problems—Perphenazine and amitriptyline combination
        may make the condition worse
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Higher blood levels of perphenazine and amitriptyline may occur,
        increasing the chance of side effects
    - type: list
      ordered: false
      items:
      - Overactive thyroid—Perphenazine and amitriptyline combination may cause an
        increased chance of serious effects on the heart
    - type: list
      ordered: false
      items:
      - Reye's syndrome—There may be an increased chance of unwanted effects on the
        liver
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: To lessen stomach upset, take this medicine immediately after meals or with
      food, unless your doctor has told you to take it on an empty stomach.
  - type: paragraph
    text: Do not take more of this medicine and do not take it more often than your
      doctor ordered. This is particularly important for elderly patients, since they
      are more sensitive to the effects of this medicine.
  - type: paragraph
    text: Sometimes perphenazine and amitriptyline combination must be taken for several
      weeks before its full effect is reached.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For certain mental and emotional conditions:
        Adults—At first, 1 tablet taken three or four times a day. Your doctor may
        increase your dose if needed. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - 'For certain mental and emotional conditions: Adults—At first, 1 tablet taken
        three or four times a day. Your doctor may increase your dose if needed. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 1 tablet taken three or four times a day. Your doctor may
        increase your dose if needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor should check your progress at regular visits to allow dose adjustments
      and help reduce side effects.
  - type: paragraph
    text: Do not stop taking this medicine without first checking with your doctor.
      Your doctor may want you to reduce gradually the amount you are taking before
      stopping completely. This is to prevent side effects and to prevent your condition
      from becoming worse.
  - type: paragraph
    text: Do not take this medicine within two hours of taking antacids or medicine
      for diarrhea. Taking these products too close together may make this medicine
      less effective.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that cause drowsiness). Some examples of CNS depressants are antihistamines
      or medicine for hay fever, other allergies, or colds; sedatives, tranquilizers,
      or sleeping medicine; prescription pain medicine or narcotics; barbiturates;
      medicine for seizures; or anesthetics, including some dental anesthetics. Check
      with your doctor before taking any of the above while you are using this medicine.
  - type: paragraph
    text: Before having any kind of surgery, dental treatment, or emergency treatment,
      tell the medical doctor or dentist in charge that you are taking this medicine.
      Taking perphenazine and amitriptyline combination together with medicines that
      are used during surgery or dental or emergency treatments may increase the CNS
      depressant effects.
  - type: paragraph
    text: The perphenazine and amitriptyline combination may cause some people to
      be agitated, irritable or display other abnormal behaviors. It may also cause
      some people to have suicidal thoughts and tendencies or to become more depressed.
      If you or your caregiver notice any of these adverse effects, tell your doctor
      right away.
  - type: paragraph
    text: This medicine may cause some people to become drowsy or less alert than
      they are normally, especially during the first few weeks of treatment. Even
      if this medicine is taken only at bedtime, it may cause some people to feel
      drowsy or less alert on arising. Make sure you know how you react to this medicine
      before you drive, use machines, or do anything else that could be dangerous
      if you are not alert.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up from a lying or sitting position. Getting up slowly may help. If the problem
      continues or gets worse, check with your doctor.
  - type: paragraph
    text: This medicine may make you sweat less, causing your body temperature to
      increase. Use extra care not to become overheated during exercise or hot weather
      while you are taking this medicine, since overheating may result in heat stroke.
      Also, hot baths or saunas may make you feel dizzy or faint.
  - type: paragraph
    text: Perphenazine and amitriptyline combination may cause dryness of the mouth.
      For temporary relief, use sugarless gum or candy, melt bits of ice in your mouth,
      or use a saliva substitute. However, if your mouth continues to feel dry for
      more than 2 weeks, check with your medical doctor or dentist. Continuing dryness
      of the mouth may increase the chance of dental disease, including tooth decay,
      gum disease, and fungus infections.
  - type: paragraph
    text: 'Perphenazine may cause your skin to be more sensitive to sunlight than
      it is normally. Exposure to sunlight, even for brief periods of time, may cause
      a skin rash, itching, redness or other discoloration of the skin, or a severe
      sunburn. When you begin taking this medicine:'
  - type: list
    ordered: false
    items:
    - Stay out of direct sunlight, especially between the hours of 10:00 a.m. and
      3:00 p.m., if possible.
    - Wear protective clothing, including a hat. Also, wear sunglasses.
    - Apply a sun block product that has a skin protection factor (SPF) of at least
      15. Some patients may require a product with a higher SPF number, especially
      if they have a fair complexion. If you have any questions about this, check
      with your health care professional.
    - Apply a sun block lipstick that has an SPF of at least 15 to protect your lips.
    - Do not use a sunlamp or tanning bed or booth.
  - type: paragraph
    text: If you have a severe reaction from the sun, check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, perphenazine (included in this combination
      medicine) can sometimes cause serious side effects. Tardive dyskinesia (a movement
      disorder) may occur and may not go away after you stop using the medicine. Signs
      of tardive dyskinesia include fine, worm-like movements of the tongue, or other
      uncontrolled movements of the mouth, tongue, cheeks, jaw, or arms and legs.
      Other serious but rare side effects may also occur. These include severe muscle
      stiffness, fever, unusual tiredness or weakness, fast heartbeat, difficult breathing,
      increased sweating, loss of bladder control, and seizures (neuroleptic malignant
      syndrome). You and your doctor should discuss the good this medicine will do
      as well as the risks of taking it.
  - type: paragraph
    text: 'Stop taking this medicine and get emergency help immediately if any of
      the following effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Convulsions (seizures)
      - difficulty in breathing
      - fast heartbeat
      - fever
      - high or low blood pressure
      - increased sweating
      - loss of bladder control
      - muscle stiffness (severe)
      - unusual tiredness or weakness
      - unusually pale skin
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision or any change in vision
      - difficulty in speaking or swallowing
      - fainting
      - inability to move eyes
      - lip smacking or puckering
      - loss of balance control
      - mask-like face
      - muscle spasms, especially of face, neck, and back
      - nervousness, restlessness, or need to keep moving
      - puffing of cheeks
      - rapid or fine, worm-like movements of tongue
      - shuffling walk
      - stiffness of arms and legs
      - trembling and shaking of fingers and hands
      - tic-like or twitching movements
      - twisting movements of body
      - uncontrolled chewing movements
      - uncontrolled movements of arms or legs
      - weakness of arms and legs
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - constipation
      - difficult urination
      - eye pain
      - hallucinations (seeing, hearing, or feeling things that are not there)
      - increased skin sensitivity to sun
      - shakiness
      - slow pulse or irregular heartbeat
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - aching muscles or joints
      - back or leg pain
      - fever and chills
      - hair loss
      - hot, dry skin or lack of sweating
      - irritability
      - loss of appetite
      - muscle weakness or twitching
      - nausea, vomiting, or diarrhea
      - nosebleeds
      - prolonged, painful, inappropriate penile erection
      - ringing, buzzing, or other unexplained noises in ears
      - skin discoloration
      - skin rash and itching
      - sore throat and fever
      - swelling of face and tongue
      - swelling of testicles
      - unusual bleeding or bruising
      - yellow eyes or skin
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - confusion
      - convulsions (seizures)
      - drowsiness (severe)
      - enlarged pupils
      - fast, slow, or irregular heartbeat
      - fever
      - hallucinations (seeing, hearing, or feeling things that are not there)
      - shortness of breath or troubled breathing
      - unusual tiredness or weakness (severe)
      - vomiting (severe)
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased sweating
      - dizziness
      - drowsiness
      - dryness of mouth
      - headache
      - increased appetite for sweets
      - nasal congestion
      - tiredness or weakness (mild)
      - unpleasant taste
      - weight gain (unusual)
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in menstrual period
      - decreased sexual ability
      - heartburn
      - increased sweating
      - swelling or pain in breasts or unusual secretion of milk
    - type: paragraph
      text: 'After you stop using this medicine, it may still produce some side effects
        that need attention. During this period of time, check with your doctor immediately
        if you notice the following side effects:'
    - type: list
      ordered: false
      items:
      - Dizziness
      - nausea or vomiting
      - stomach pain
      - trembling of fingers and hands
      - symptoms of tardive dyskinesia, including lip smacking or puckering, puffing
        of cheeks, rapid or fine, worm-like movements of tongue, uncontrolled chewing
        movements, or uncontrolled movements of arms or legs
    - type: paragraph
      text: 'After you stop using this medicine, it may still produce some side effects
        that need attention. During this period of time, check with your doctor immediately
        if you notice the following side effects:'
    - type: list
      ordered: false
      items:
      - Diarrhea
      - headache
      - irritability
      - restlessness
      - trouble in sleeping, with vivid dreams
      - unusual excitement
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
