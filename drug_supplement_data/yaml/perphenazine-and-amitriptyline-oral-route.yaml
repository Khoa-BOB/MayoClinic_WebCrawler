      - Saquinavir
      - Selegiline
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Toloxatone
      - Tranylcypromine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Acecainide
      - Aceclofenac
      - Acemetacin
      - Adagrasib
      - Albuterol
      - Alfentanil
      - Alfuzosin
      - Almotriptan
      - Alprazolam
      - Amantadine
      - Amiodarone
      - Amisulpride
      - Amobarbital
      - Amoxapine
      - Amphetamine
      - Amtolmetin Guacil
      - Anagrelide
      - Apomorphine
      - Aprindine
