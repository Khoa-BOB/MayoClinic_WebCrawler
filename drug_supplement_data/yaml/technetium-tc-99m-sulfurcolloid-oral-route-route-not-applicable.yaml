title: Technetium tc 99m sulfurcolloid (oral route, route not applicable)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cis Sulfur Colloid
    - type: paragraph
      text: Technetium TC 99m TSC
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Technetium Tc 99m sulfur colloid is a radiopharmaceutical. Radiopharmaceuticals
      are radioactive agents, which may be used to find and treat certain diseases
      or to study the function of the body's organs.
  - type: paragraph
    text: Technetium Tc 99m sulfur colloid is used to help your doctor see an image
      of your esophagus, stomach, and lungs to see how well they are working. This
      medicine is used to help diagnose gastroesophageal reflux disease and pulmonary
      aspiration.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor with specialized training in nuclear medicine.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Kit
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a diagnostic test, any risks of the test must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      Also, other things may affect test results. For this test, the following should
      be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of technetium Tc 99m sulfur colloid
        in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of technetium Tc 99m sulfur colloid have not been performed in the geriatric
        population, no geriatric-specific problems have been documented to date.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies suggest that this medication may alter milk production or composition.
        If an alternative to this medication is not prescribed, you should monitor
        the infant for side effects and adequate milk intake.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this diagnostic
        test. Make sure you tell your doctor if you have any other medical problems,
        especially:'
    - type: list
      ordered: false
      items:
      - Cancer—Use with caution. May make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you or your child
      this medicine in a hospital or clinic. This medicine is given by mouth or by
      a nasogastric tube.
  - type: paragraph
    text: If this medicine is given to children by mouth, it should be combined with
      a milk feeding. If this medicine is given to children by a nasogastric tube,
      it is administered into the stomach and then followed with a dextrose or milk
      feeding.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you or your child closely while
      you are receiving this medicine. This will allow your doctor to see if the medicine
      is working properly and to decide if you should continue to use it.
  - type: paragraph
    text: This medicine may cause a serious type of allergic reaction called anaphylaxis.
      Anaphylaxis requires immediate medical attention. The most serious signs of
      this reaction are very fast or irregular breathing, gasping for breath, wheezing,
      or fainting. Other signs may include changes in color of the skin of the face,
      very fast but irregular heartbeat or pulse, hive-like swellings on the skin,
      and puffiness or swellings of the eyelids or around the eyes. If these side
      effects occur, get emergency help at once.
  - type: paragraph
    text: You may be exposed to radiation when you are given this medicine. This may
      also increase your risk to have cancer (especially in children). Talk with your
      doctor if you or your child have concerns about this.
  - type: paragraph
    text: If you are a woman who can get pregnant, the imaging procedures should be
      done within 10 days after the start of your monthly period or a pregnancy test
      should be performed within 48 hours before the procedure.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cold, clammy skin
      - confusion
      - cough
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - fast, weak pulse
      - hives or welts
      - itching
      - lightheadedness
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rash
      - redness of the skin
      - shortness of breath
      - sweating
      - tightness in the chest
      - unusual tiredness or weakness
      - wheezing
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - difficult or labored breathing
      - fever
      - heart stops
      - no breathing
      - no pulse or blood pressure
      - seizures
      - unconscious
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - feeling of warmth
      - nausea
      - numbness
      - redness of the face, neck, arms, and occasionally, upper chest
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
