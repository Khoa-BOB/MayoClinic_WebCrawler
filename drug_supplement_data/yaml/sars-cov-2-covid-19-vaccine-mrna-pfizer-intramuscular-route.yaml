title: Sars-cov-2 (covid-19) vaccine, mrna (pfizer) (intramuscular route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: SARS-CoV-2 vaccine, mRNA (Pfizer) is used as an active immunization to prevent
      COVID-19 caused by the SARS-CoV-2 virus. It is also used in patients 5 years
      of age and older who are at high risk for severe COVID-19. SARS-CoV-2 (COVID-19)
      vaccine is used to prevent coronavirus disease 2019 (COVID-19) caused by severe
      acute respiratory syndrome coronavirus 2 (SARS-CoV-2).
  - type: paragraph
    text: This vaccine is to be given only by or under the direct supervision of your
      doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Comirnaty® vaccine in children younger than 5 years of age.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of SARS-CoV-2 (COVID-19) vaccine
        in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Atidarsagene Autotemcel
      - Elivaldogene Autotemcel
      - Ocrelizumab
      - Rituximab
      - Teplizumab-mzwv
      - Ublituximab-xiiy
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart disease (eg, myocarditis, pericarditis), history of—Use with caution.
        May make this condition worse.
    - type: list
      ordered: false
      items:
      - Immune system problems—This condition may decrease the useful effects of the
        vaccine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given as a shot into one of your muscles.
  - type: paragraph
    text: 'Comirnaty® :'
  - type: list
    ordered: false
    items:
    - Patients 5 years of age and older who have not received any COVID-19 vaccine—Given
      as a single dose.
    - Patients 5 years of age and older who have received any COVID-19 vaccine—Given
      as a single dose at least 2 months after receiving COVID-19 vaccine.
  - type: paragraph
    text: This vaccine comes with Information for Recipients and Caregivers. Read
      and follow the information carefully. Ask your doctor if you have any questions.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Be sure to notify your doctor of any side effects (eg, feeling faint, especially
      in teenagers) that occur after you receive this vaccine.
  - type: paragraph
    text: This vaccine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you have a rash, itching, a fast heartbeat, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      after receiving the vaccine.
  - type: paragraph
    text: This vaccine may increase your risk of serious heart problems (eg, myocarditis,
      pericarditis). Check with your doctor right away if you have anxiety, blue or
      pale skin, chest pain, possibly moving to the left arm, neck, or shoulder, fever,
      chills, a fast heartbeat, trouble breathing, or unusual tiredness or weakness.
  - type: paragraph
    text: Fainting may occur after you receive this vaccine. Your doctor may want
      you to be observed after you get the injection to prevent and manage fainting.
  - type: paragraph
    text: This vaccine may not protect everyone who receives it. This vaccine will
      not treat symptoms of COVID-19 infection if you already have the disease. It
      is very important that you take precautions to reduce the risk of COVID-19.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - diarrhea
      - fever
      - headache
      - irritability
      - joint or muscle pain
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea
      - vomiting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased appetite
      - general feeling of discomfort or illness
      - pain in the arms
      - rash
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blue or pale skin
      - chest discomfort or tightness
      - chest pain, possible moving to the left arm, neck, or shoulder
      - cough
      - difficulty swallowing
      - dizziness
      - fainting
      - fast heartbeat
      - large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
        feet, or sex organs
      - loss of bladder control
      - muscle spasm or jerking of all extremities
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - seizures
      - sudden loss of consciousness
      - trouble breathing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain, redness, or swelling at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
