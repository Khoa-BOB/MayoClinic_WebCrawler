title: Dasatinib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Phyrago
    - type: paragraph
      text: Sprycel
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: APO-daSATinib
    - type: paragraph
      text: Reddy-daSATinib
    - type: paragraph
