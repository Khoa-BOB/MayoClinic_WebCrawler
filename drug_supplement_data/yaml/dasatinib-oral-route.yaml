    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Arrhythmia (heart rhythm problem) or
      - Bleeding problems or
      - Congenital long QT syndrome (heart rhythm problem) or
      - Edema (fluid retention or swelling) or
      - Lung or breathing problems or
      - Neutropenia (low white blood cells) or
      - Palpitations (fast heart rate) or
      - Stomach bleeding or
      - Thrombocytopenia (low platelets in the blood)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Hypokalemia (low potassium levels in the blood) or
      - Hypomagnesemia (low magnesium levels in the blood)—Use with caution. May cause
        side effects to become worse.
    - type: list
      ordered: false
      items:
      - Infection—Dasatinib may decrease your body's ability to fight an infection.
    - type: list
      ordered: false
      items:
      - Lactose intolerance—Use with caution. Sprycel® tablets contains lactose.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of unwanted effects.
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all of the risks and
      benefits. It is important for you to work closely with your doctor during your
      treatment.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food. Swallow the tablet whole.
      Do not break, cut, crush, or chew it.
  - type: paragraph
    text: Pregnant women should avoid handling crushed or broken tablets. If a tablet
      is broken or crushed, wear disposable gloves to avoid exposure to the medicine.
  - type: paragraph
    text: If you are taking an antacid (eg, aluminum hydroxide, magnesium hydroxide,
      Maalox®, Rolaids®, or Tums®), take it at least 2 hours before or after you take
      dasatinib.
  - type: paragraph
    text: Do not drink grapefruit juice while you are using this medicine. Grapefruit
      juice may change the amount of medicine that is absorbed in the body.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (Phyrago® tablets): For the treatment of chronic phase
        CML: Adults—At first, 100 milligrams (mg) once a day, given either in the
        morning or in the evening. Your doctor may adjust your dose as needed. Children—Use
        and dose must be determined by your doctor. For the treatment of accelerated
        or blast CML or Ph+ ALL: Adults—At first, 140 milligrams (mg) once a day,
        given either in the morning or in the evening. Your doctor may adjust your
        dose as needed. Children—Use and dose must be determined by your doctor.'
      - 'For oral dosage form (Sprycel® tablets): For the treatment of chronic phase
        CML: Adults—At first, 100 milligrams (mg) once a day, given either in the
        morning or in the evening. Your doctor may adjust your dose as needed. Children
        1 year of age and older—Dose is based on body weight and must be determined
        by your doctor. Weighs 45 kilograms (kg) or more—At first, 100 mg once a day,
        given either in the morning or in the evening. Your doctor may adjust your
        dose as needed. Weighs 30 kg to less than 45 kg—At first, 70 mg once a day,
        given either in the morning or in the evening. Your doctor may adjust your
        dose as needed. Weighs 20 kg to less than 30 kg—At first, 60 mg once a day,
        given either in the morning or in the evening. Your doctor may adjust your
        dose as needed. Weighs 10 kg to less than 20 kg—At first, 40 mg once a day,
        given either in the morning or in the evening. Your doctor may adjust your
        dose as needed. Children younger than 1 year of age and weigh less than 10
        kg—Use is not recommended. For the treatment of accelerated or blast crisis
        CML or Ph+ ALL: Adults—At first, 140 milligrams (mg) once a day, given either
        in the morning or in the evening. Your doctor may adjust your dose as needed.
        Children 1 year of age and older—Dose is based on body weight and must be
