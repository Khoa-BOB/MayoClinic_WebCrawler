    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure that this medicine is working properly. Blood
      tests will be needed to check for unwanted effects. Be sure to keep all appointments.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Female
      patients should use an effective form of birth control to keep from getting
      pregnant during treatment with this medicine and for 30 days after your last
      dose. Male patients who have female partners should use effective birth control
      during treatment with this medicine and for at least 30 days after the last
      dose. If you think you have become pregnant while using the medicine, tell your
      doctor right away.
  - type: paragraph
    text: 'Dasatinib can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. It can also lower the
      number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor right away
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor right away if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: Dasatinib may cause fluid retention, including pleural effusion (fluid build-up
      around your lungs). Check with your doctor right away if you have a decrease
      in the amount of urine, noisy or rattling breathing, difficulty breathing, swelling
      of the fingers, hands, feet, or lower legs, trouble breathing, or weight gain.
  - type: paragraph
    text: This medicine can cause changes in heart rhythm, including QT prolongation.
      It may change the way your heart beats and cause fainting or serious side effects
      in some patients. Check with your doctor right away if you have any symptoms
      of heart rhythm problems, including a fast, pounding, or irregular heartbeat.
  - type: paragraph
    text: Check with your doctor right away if you have chest discomfort or pain,
      decreased urine output, fast, irregular, or pounding heartbeat, swelling of
      the feet or lower legs, trouble breathing, or unusual tiredness or weakness.
      These could be symptoms of a serious heart or blood vessel problem (eg, heart
      attack, stroke).
  - type: paragraph
    text: Using this medicine may cause headache, muscle or joint pain, skin rash,
      or unusual tiredness or weakness. If these symptoms persist and become worse,
      check with your doctor.
  - type: paragraph
    text: This medicine may increase your risk of having a condition called pulmonary
      arterial hypertension (high blood pressure in the lungs). This may occur at
      anytime during treatment with this medicine. Check with your doctor right away
      if you have trouble breathing, tiredness, or swelling all over your body (fluid
      retention).
  - type: paragraph
    text: Serious skin reactions (eg, Stevens-Johnson syndrome, erythema multiforme)
      can occur with this medicine. Check with your doctor right away if you have
      blistering, peeling, or loosening of the skin, chills, cough, diarrhea, red
      irritated eyes, red skin lesions, often with a purple center, severe acne or
      skin rash, sore throat, sores, ulcers, or white spots in the mouth or on the
      lips, or unusual tiredness or weakness while you are using this medicine.
  - type: paragraph
    text: This medicine may cause a serious type of reaction called tumor lysis syndrome.
      Your doctor may give you a medicine to help prevent this. Call your doctor right
      away if you have a decrease or change in urine amount, joint pain, stiffness,
      or swelling, lower back, side, or stomach pain, a rapid weight gain, swelling
      of the feet or lower legs, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause slowed growth and development in children. Your
      child's doctor may want to monitor their weight and growth regularly. Talk to
      your child's doctor if you have concerns.
  - type: paragraph
    text: Talk with your doctor before using this medicine if you plan to have children.
      Some men and women who use this medicine have become infertile (unable to have
      children).
  - type: paragraph
    text: This medicine may cause serious liver problems. Check with your doctor right
      away if you have dark urine, loss of appetite, nausea or vomiting, stomach pain,
      sever, or yellow eyes or skin.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - bloody or black, tarry stools
      - body aches or pain
      - burning, tingling, numbness, or pain in the hands, arms, feet, or legs
      - chest pain or tightness
      - chills
      - constipation
      - cough
      - coughing up blood
      - decrease in the amount of urine
      - dizziness
      - ear congestion
      - fainting
      - fast, slow, or irregular heartbeat
      - fever
      - full or bloated feeling
      - headache
      - hoarseness
      - increased menstrual flow or vaginal bleeding
      - loss of voice
      - lower back or side pain
      - noisy or rattling breathing
      - nosebleeds
      - painful or difficult urination
      - pale skin
      - paralysis
      - pressure in the stomach
      - prolonged bleeding from cuts
      - red or dark brown urine
      - runny or stuffy nose
      - sensation of pins and needles
      - severe stomach pain
      - sneezing
      - sore throat
      - stabbing pain
      - swelling of the stomach area
      - swelling of the face, fingers, hands, feet, or lower legs
      - trouble breathing
      - ulcers, sores, or white spots in the mouth
      - unsteadiness or awkwardness
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting of blood or material that looks like coffee grounds
      - weakness in the arms, hands, legs, or feet
      - weight gain
    subsections: []
  - heading: Less common
    level: 3
