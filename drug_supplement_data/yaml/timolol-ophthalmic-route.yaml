  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma, or history of or
      - Bradycardia (slow heartbeat) or
      - Cardiogenic shock (shock caused by heart attack) or
      - Chronic obstructive pulmonary disease (COPD), severe or
      - Heart block or
      - Heart failure—Should not use in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Allergic reaction (eg, anaphylaxis, atopy), or history of—May increase risk
        of an allergic reaction to occur again.
    - type: list
      ordered: false
      items:
      - Blood vessel disease (especially blood vessels of the brain) or
      - Lung disease or
      - Myasthenia gravis (muscle weakness) or
      - Stroke, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hyperthyroidism (overactive thyroid) or
      - Hypoglycemia (low blood sugar)—May cover up some of the signs and symptoms
        of these diseases, such as a fast heartbeat.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine exactly as directed by your doctor. Do not use more of
      it, do not use it more often, and do not use it for it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: Shake the regular eye drops well just before each use. If you are using
      the gel-forming eye drops , turn the bottle upside down and shake it once. You
      do not need to shake the gel-forming eye drops more than once.
  - type: paragraph
    text: 'To use the eye drops (solution and gel):'
  - type: list
    ordered: false
    items:
    - First, wash your hands. Tilt the head back and, pressing your finger gently
      on the skin just beneath the lower eyelid, pull the lower eyelid away from the
      eye to make a space. Drop the medicine into this space. Let go of the eyelid
      and gently close the eyes. Do not blink. Keep the eyes closed and apply pressure
      to the inner corner of the eye with your finger for 1 or 2 minutes to allow
      the medicine to be absorbed by the eye.
    - Immediately after using the medicine, wash your hands to remove any medicine
      that may be on them.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
      Serious damage to the eye and possible loss of vision may result from using
      contaminated eye medicines.
  - type: paragraph
    text: If your doctor ordered two different eye medicines to be used together,
      wait at least 10 minutes after the regular eye drops before using the second
      medicine. This will help prevent the second medicine from “washing out” the
      first one. The gel-forming eye drops should always be the last medicine used
      if two medicines are ordered. Wait 10 minutes before using the gel-forming eye
      drops.
  - type: paragraph
    text: You should not use the regular eye drops if you have contact lenses in your
      eyes. Remove your contact lenses before you use this medicine. Wait at least
      15 minutes after you use the medicine before putting the contact lenses back
      in.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For glaucoma or ocular hypertension: For ophthalmic gel-forming solution
        dosage form (eye drops): Adults—Use 1 drop in the affected eye once a day.
        Children—Use and dose must be determined by your doctor. . For ophthalmic
        solution dosage form (eye drops): Adults and children 2 years of age and older—Use
        1 drop in the affected eye two times a day. Your doctor may need to adjust
        your dose as needed. Children younger than 2 years of age—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For ophthalmic gel-forming solution dosage form (eye drops): Adults—Use 1
        drop in the affected eye once a day. Children—Use and dose must be determined
        by your doctor. .'
      - 'For ophthalmic solution dosage form (eye drops): Adults and children 2 years
        of age and older—Use 1 drop in the affected eye two times a day. Your doctor
        may need to adjust your dose as needed. Children younger than 2 years of age—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Use 1 drop in the affected eye once a day.
      - Children—Use and dose must be determined by your doctor. .
    - type: list
      ordered: false
      items:
      - Adults and children 2 years of age and older—Use 1 drop in the affected eye
        two times a day. Your doctor may need to adjust your dose as needed.
      - Children younger than 2 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: If you are using Timoptic®, use the medicine immediately after opening
        and throw away any unused medicine after use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: Do not use this medicine if you are also using a beta-blocker medicine that
      is taken by the mouth.
  - type: paragraph
    text: If itching, redness, swelling, or other signs of eye or eyelid irritation
      occur, stop using this medicine and check with your doctor. These signs may
      mean that you are allergic to this medicine.
  - type: paragraph
    text: Timolol may cause heart failure in some patients. Check with your doctor
      right away if you are having chest pain or discomfort, dilated neck veins, extreme
      fatigue, irregular breathing, an irregular heartbeat, swelling of the face,
      fingers, feet, or lower legs, weight gain, or trouble breathing.
  - type: paragraph
    text: This medicine may cause changes in your blood sugar levels. Also, this medicine
      may cover up signs of low blood sugar, such as a rapid pulse rate. Check with
      your doctor if you have these problems or if you notice a change in the results
      of your blood or urine sugar tests.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery.
  - type: paragraph
    text: The gel-forming eye drops may cause blurred vision or other vision problems
      that last about 30 seconds to 5 minutes after you put them in your eye. If any
      of these occur, do not drive, use machines, or do anything else that could be
      dangerous if you are not able to see well. If these eye changes are bothersome,
      check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - burning or stinging in the eye
    subsections: []
