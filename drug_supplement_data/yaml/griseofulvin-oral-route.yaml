title: Griseofulvin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Fulvicin P/G
    - type: paragraph
      text: Fulvicin-U/F
    - type: paragraph
      text: Grifulvin V
    - type: paragraph
      text: Gris-PEG
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Griseofulvin belongs to the group of medicines called antifungals. It is
      used to treat fungus infections of the body, feet, groin and thighs, scalp,
      skin, fingernails, and toenails. This medicine may be taken alone or used along
      with medicines that are applied to the skin for fungus infections.
  - type: paragraph
    text: Use of griseofulvin for prevention of fungus infection have not been established.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of griseofulvin in children. However,
        safety and efficacy have not been established in children up to 2 years of
        age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of griseofulvin in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Azathioprine
      - Desogestrel
      - Dienogest
      - Drospirenone
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Etonogestrel
      - Gestodene
      - Levoketoconazole
      - Levonorgestrel
      - Medroxyprogesterone
      - Mercaptopurine
      - Mestranol
      - Methotrexate
      - Nomegestrol
      - Norelgestromin
      - Norethindrone
      - Norgestimate
      - Norgestrel
      - Porfimer
      - Segesterone
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aminolevulinic Acid
      - Phenobarbital
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Actinomycosis (bacterial infection) or
      - Blastomycosis (Gilchrist’s disease) or
      - Candidiasis (yeast infection) or
      - Histoplasmosis (Darling’s disease) or
      - Other infections (e.g., bacteria) or
      - Sporotrichosis (Rose gardener's disease) or
      - Tinea versicolor (Tinea flava)—Griseofulvin will not work in patients with
        these conditions.
    - type: list
      ordered: false
      items:
      - Liver failure or
      - Porphyria (enzyme problem)—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Lupus erythematosus or lupus-like diseases—Use with caution. May make this
        condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Keep using this medicine for the full treatment time, even if you feel better
      after the first few doses. Your infection may not clear up if you stop using
      the medicine too soon.
  - type: paragraph
    text: Keep yourself clean to help control infection and prevent reinfection.
  - type: paragraph
    text: Griseofulvin is absorbed best when it is taken with a high fat meal, such
      as a cheeseburger, whole milk, or ice cream. Tell your doctor if you are on
      a low-fat diet.
  - type: paragraph
    text: Griseofulvin is best taken with or after meals, especially fatty ones (e.g.,
      whole milk or ice cream). This lessens possible stomach upset and helps to clear
      up the infection by helping your body absorb the medicine better. However, if
      you are on a low-fat diet, check with your doctor.
  - type: paragraph
    text: 'For patients taking the oral liquid :'
  - type: list
    ordered: false
    items:
    - Use a specially marked measuring spoon or other device to measure each dose
      accurately. The average household teaspoon may not hold the right amount of
      liquid.
  - type: paragraph
    text: You may swallow the tablets whole or sprinkle the crushed tablets in one
      tablespoonful of applesauce. Swallow it immediately without chewing.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (microsize capsules, tablets, or suspension): Treatment
        of fungus infections of the feet and nails: Adults and teenagers—500 milligrams
        (mg) every 12 hours. Children—Dose is based on body weight and must be determined
        by your doctor. The usual dose is 5 milligrams (mg) per kilogram (kg) (2.3
        mg per pound) of body weight every 12 hours, or 10 milligrams (mg) per kilogram
        (kg) (4.6 mg per pound) of body weight once a day. Treatment of fungus infections
        of the scalp, skin, and groin: Adults and teenagers—250 milligrams (mg) every
        12 hours or 500 mg once a day. Children—Dose is based on body weight and must
        be determined by your doctor. The usual dose is 5 milligrams (mg) per kilogram
        (kg) (2.3 mg per pound) of body weight every 12 hours, or 10 milligrams (mg)
        per kilogram (kg) (4.6 mg per pound) of body weight once a day.'
      - 'For oral dosage form (ultramicrosize tablets): Treatment of fungus infections:
        Adults—375 milligrams (mg) per day, taken as a single dose or divided in small
        doses. Some patients may need 750 mg divided in small doses. Children 3 years
        of age and older weighing over 60 pounds—Dose is based on body weight and
        must be determined by your doctor. The usual dose is 187.5 to 375 mg per day.
        Children 3 years of age and older weighing 35 to 60 pounds—Dose is based on
        body weight and must be determined by your doctor. The usual dose is 125 to
        187.5 mg per day. Children up to 2 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'Treatment of fungus infections of the feet and nails: Adults and teenagers—500
