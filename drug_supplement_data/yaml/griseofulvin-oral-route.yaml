    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor should check the progress of you or
      your child at regular visits to make sure that this medicine is working properly
      and to check for unwanted effects.
  - type: paragraph
    text: If your symptoms do not improve, or if they become worse, check with your
      doctor. You may need to take this medicine for several weeks or months before
      your infection gets better.
  - type: paragraph
    text: Using this medicine while you are pregnant may cause serious unwanted effects
      in your newborn baby. Tell your doctor right away if you think you are pregnant
      or if you plan to become pregnant while using this medicine.
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Stop using this medicine
      and check with your doctor right away if you or your child have blistering,
      peeling, or loosening of the skin; red skin lesions; severe acne or skin rash;
      sores or ulcers on the skin; or fever or chills while you are using this medicine.
  - type: paragraph
    text: Stop using this medicine and check with your doctor right away if you or
      your child have pain or tenderness in the upper stomach; pale stools; dark urine;
      loss of appetite; nausea; unusual tiredness or weakness; or yellow eyes or skin.
      These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Griseofulvin has been shown to cause liver and thyroid tumors in some animals.
      You and your doctor should discuss the good this medicine will do, as well as
      the risks of taking it.
  - type: paragraph
    text: Birth control pills containing estrogen may not work properly if you take
      them while you are taking griseofulvin. Unplanned pregnancies may occur. To
      keep from getting pregnant, use another form of birth control for up to 1 month
      after your last treatment. Other forms of birth control include condoms, diaphragms,
      or contraceptive foams or jellies.
  - type: paragraph
    text: Griseofulvin may increase the effects of alcohol. If taken with alcohol
      it may also cause fast heartbeat, flushing, increased sweating, or redness of
      the face. If you have these symptoms, do not drink alcoholic beverages while
      you are taking this medicine, unless you have checked first with your doctor.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, drowsy, or less alert
      than they are normally. Make sure you know how you react to this medicine before
      you drive, use machines, or do other things that could be dangerous if you are
      dizzy or are not alert . If these reactions are especially bothersome, check
      with your doctor.
  - type: paragraph
    text: 'Griseofulvin may cause your skin to be more sensitive to sunlight than
      it is normally. Exposure to sunlight, even for brief periods of time, may cause
      a skin rash, itching, redness or other discoloration of the skin, or a severe
      sunburn. When you begin taking this medicine:'
  - type: list
    ordered: false
    items:
    - Stay out of direct sunlight, especially between the hours of 10:00 a.m. and
      3:00 p.m., if possible.
    - Wear protective clothing, including a hat. Also, wear sunglasses.
    - Apply a sun block product that has a skin protection factor (SPF) of at least
      15. Some patients may require a product with a higher SPF number, especially
      if they have a fair complexion. If you have any questions about this, check
      with your doctor.
    - Apply a sun block lipstick that has an SPF of at least 15 to protect your lips.
    - Do not use a sunlamp or tanning bed or booth.
  - type: paragraph
    text: If you have a severe reaction from the sun, check with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - chills
      - cough
      - diarrhea
      - fever
      - itching
      - joint or muscle pain
      - red, irritated eyes
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - increased sensitivity of the skin to sunlight
      - skin rash, hives, or itching
      - soreness or irritation of the mouth or tongue
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chest pain
      - cloudy urine
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - numbness, tingling, pain, or weakness in the hands or feet
      - painful or difficult urination
      - shortness of breath
      - swollen glands
      - unusual bleeding or bruising
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - clay-colored stools
      - dark urine
      - dizziness
      - headache
      - loss of appetite
      - nausea
      - unpleasant breath odor
      - vomiting of blood
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hives or welts
      - redness of the skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Trouble with sleeping
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Heartburn
      - pain or discomfort in the chest, upper stomach, or throat
      - sleeplessness
      - unable to sleep
      - white patches in the mouth or throat or on the tongue
      - white patches with diaper rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
