title: Meprobamate (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Mb-Tab
    - type: paragraph
      text: Miltown
    - type: paragraph
      text: Trancot
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Meprobamate is used to relieve nervousness or tension. This medicine should
      not be used for nervousness or tension caused by the stress of everyday life.
  - type: paragraph
    text: Meprobamate is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of meprobamate in children with use
        in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Elderly people may be especially sensitive to the effects of meprobamate.
        This may increase the chance of side effects during treatment.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alfentanil
      - Alprazolam
      - Amobarbital
      - Aprobarbital
      - Benzhydrocodone
      - Bromazepam
      - Bromopride
      - Buprenorphine
      - Butabarbital
      - Butalbital
      - Butorphanol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Carisoprodol
      - Cetirizine
      - Chloral Hydrate
      - Chlordiazepoxide
      - Chlorzoxazone
      - Clobazam
      - Clomipramine
      - Clonazepam
      - Clorazepate
      - Codeine
      - Cyclobenzaprine
      - Cyproheptadine
      - Dantrolene
      - Daridorexant
      - Dexmedetomidine
      - Diazepam
      - Dihydrocodeine
      - Doxepin
      - Doxylamine
      - Esketamine
      - Eslicarbazepine Acetate
      - Estazolam
      - Ethchlorvynol
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Tizanidine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse (or history of) or
      - Drug abuse or dependence (or history of)—Dependence on meprobamate may develop
    - type: list
      ordered: false
      items:
      - Epilepsy—The risk of seizures may be increased
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Higher blood levels of meprobamate may occur, increasing the
        chance of side effects
    - type: list
      ordered: false
      items:
      - Porphyria—Meprobamate may make the condition worse
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor. Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. If too much is taken, it may become habit-forming.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For regular (short-acting) tablets: Adults and children 12 years of age and
        older: 400 milligrams three or four times a day, or 600 milligrams two times
        a day. Children 6 to 12 years of age: 100 to 200 milligrams two or three times
        a day. Children up to 6 years of age: Dose must be determined by the doctor.'
      - 'For long-acting dosage forms (extended-release tablets): Adults and children
        12 years of age or older: 400 to 800 milligrams two times a day, in the morning
        and at bedtime. Children 6 to 12 years of age: 200 milligrams two times a
        day, in the morning and at bedtime. Children up to 6 years of age: Dose must
        be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults and children 12 years of age and older: 400 milligrams three or four
        times a day, or 600 milligrams two times a day.'
      - 'Children 6 to 12 years of age: 100 to 200 milligrams two or three times a
        day.'
      - 'Children up to 6 years of age: Dose must be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults and children 12 years of age or older: 400 to 800 milligrams two times
        a day, in the morning and at bedtime.'
      - 'Children 6 to 12 years of age: 200 milligrams two times a day, in the morning
        and at bedtime.'
      - 'Children up to 6 years of age: Dose must be determined by the doctor.'
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: 'If you will be taking this medicine regularly for a long time:'
  - type: list
    ordered: false
    items:
    - Your doctor should check your progress at regular visits.
    - Check with your doctor at least every 4 months to make sure you need to continue
      taking this medicine.
  - type: paragraph
    text: If you will be taking this medicine in large doses or for a long time, do
      not stop taking it without first checking with your doctor. Your doctor may
      want you to reduce gradually the amount you are taking before stopping completely.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that slow down the nervous system, possibly causing drowsiness).
      Some examples of CNS depressants are antihistamines or medicine for hay fever,
      other allergies, or colds; sedatives, tranquilizers, or sleeping medicine; prescription
      pain medicine or narcotics; barbiturates; medicine for seizures; muscle relaxants;
      or anesthetics, including some dental anesthetics. Check with your doctor before
      taking any of the above while you are taking this medicine.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are taking this medicine. The results of some tests, such as the metyrapone
      test and the phentolamine test, may be affected by this medicine.
  - type: paragraph
    text: If you think you or someone else may have taken an overdose of this medicine,
      get emergency help at once. Taking an overdose of meprobamate or taking alcohol
      or other CNS depressants with meprobamate may lead to unconsciousness and possibly
      death. Some signs of an overdose are severe confusion, drowsiness, or weakness;
      shortness of breath or slow or troubled breathing; slurred speech; staggering;
      and slow heartbeat.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, lightheaded, drowsy,
      or less alert than they are normally. Even if taken at bedtime, it may cause
      some people to feel drowsy or less alert on arising. Make sure you know how
      you react to this medicine before you drive, use machines, or do anything else
      that could be dangerous if you are dizzy or are not alert .
  - type: paragraph
    text: Meprobamate may cause dryness of the mouth. For temporary relief, use sugarless
      candy or gum, melt bits of ice in your mouth, or use a saliva substitute. However,
      if your mouth continues to feel dry for more than 2 weeks, check with your medical
      doctor or dentist. Continuing dryness of the mouth may increase the chance of
      dental disease, including tooth decay, gum disease, and fungus infections.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin rash, hives, or itching
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - fast, pounding, or irregular heartbeat
      - sore throat and fever
      - unusual bleeding or bruising
      - unusual excitement
      - wheezing, shortness of breath, or troubled breathing
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion (severe)
      - dizziness or lightheadedness (continuing)
      - drowsiness (severe)
      - shortness of breath or slow or troubled breathing
      - slow heartbeat
      - slurred speech
      - staggering
      - weakness (severe)
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Clumsiness or unsteadiness
      - drowsiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision or change in near or distant vision
      - diarrhea
      - dizziness or lightheadedness
      - false sense of well-being
      - headache
      - nausea or vomiting
      - unusual tiredness or weakness
    - type: paragraph
      text: 'After you stop using this medicine, it may still produce some side effects
        that need attention. During this period of time, check with your doctor immediately
        if you notice the following side effects:'
    - type: list
      ordered: false
      items:
      - Clumsiness or unsteadiness
      - confusion
      - convulsions (seizures)
      - hallucinations (seeing, hearing, or feeling things that are not there)
      - increased dreaming
      - muscle twitching
      - nausea or vomiting
      - nervousness or restlessness
      - nightmares
      - trembling
      - trouble in sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
