title: Menthol and zinc oxide (topical application route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Calmoseptine
    - type: paragraph
      text: Gold Bond Medicated Body Powder
    - type: paragraph
      text: Gold Star Medicated
    - type: paragraph
      text: Risamine
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Menthol and zinc oxide topical ointment is used to prevent and heal skin
      irritation caused by urine, diarrhea, sweat, fistula damage, feeding tube site
      leakage, wound drainage, minor burns, cuts, scrapes, or itching.
  - type: paragraph
    text: This medicine is available as an over-the-counter (OTC) product.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Paste
    - Ointment
    - Powder
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of menthol and zinc oxide topical
        ointment in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of menthol and zinc oxide topical ointment in geriatric patients.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine exactly as directed by your doctor . Do not use more of
      it, do not use it more often, or do not use it for a longer time than your doctor
      ordered.
  - type: paragraph
    text: This medicine is for use on the skin only . Do not get it in the eyes. Do
      not use on deep or puncture wounds. You may use it on the skin area around the
      wound.
  - type: paragraph
    text: 'To use:'
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and water before and after using this medicine.
    - Clean the affected area with mild soap and water. Pat dry or allow it to dry.
    - Apply a thin layer of the ointment with each diaper change, at bedtime, or when
      prolonged exposure to wet diapers may occur.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (ointment): For prevention of skin irritation: Adults—Apply
        to the affected area of the skin 2 to 4 times per day. Children—Apply to the
        affected area of the skin 2 to 4 times per day.'
    - type: list
      ordered: false
      items:
      - 'For prevention of skin irritation: Adults—Apply to the affected area of the
        skin 2 to 4 times per day. Children—Apply to the affected area of the skin
        2 to 4 times per day.'
    - type: list
      ordered: false
      items:
      - Adults—Apply to the affected area of the skin 2 to 4 times per day.
      - Children—Apply to the affected area of the skin 2 to 4 times per day.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your or your child's symptoms do not improve within 7 days, or if they
      become worse, check with your doctor.
  - type: paragraph
    text: If you or your child accidentally swallow the medicine, call the doctor
      or a poison control center right away.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hives, itching, or skin rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
