    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Celecoxib capsule that has been mixed with applesauce may be stored in
        a refrigerator and used within 6 hours.
    - type: paragraph
      text: Do not store the oral liquid bottle and reuse the remaining medicine.
        Throw away the bottle with the unused medicine.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child at regular visits . This will allow your doctor to see if the medicine
      is working properly and to decide if you should continue to take it. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine during the later part of pregnancy can harm your unborn
      baby. If you think you have become pregnant while using the medicine, tell your
      doctor right away.
  - type: paragraph
    text: This medicine may cause a delay in ovulation for women and may affect their
      ability to have children. If you plan to have children, talk with your doctor
      before using this medicine.
  - type: paragraph
    text: This medicine may raise your risk of having a heart attack or stroke. This
      is more likely in people who already have heart disease. People who use this
      medicine for a long time might also have a higher risk.
  - type: paragraph
    text: This medicine may cause bleeding in your stomach or bowels. These problems
      can happen without warning signs. This is more likely if you or your child have
      had a stomach ulcer in the past, if you smoke or drink alcohol regularly, are
      over 60 years of age, are in poor health, or using certain other medicines (eg,
      steroids or a blood thinner).
  - type: paragraph
    text: Liver problems may occur while you are using this medicine. Check with your
      doctor right away if you have stomach pain or tenderness, clay-colored stools,
      dark urine, decreased appetite, fever, headache, itching, loss of appetite,
      nausea and vomiting, skin rash, swelling of the feet or lower legs, unusual
      tiredness or weakness, or yellow eyes or skin.
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, trouble breathing, unusual tiredness or weakness, vomiting, or
      weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have stomach pain, confusion,
      difficulty with breathing, irregular heartbeat, nausea or vomiting, nervousness,
      numbness or tingling in the hands, feet, or lips, or weakness or heaviness of
      the legs.
  - type: paragraph
    text: Using this medication in certain patients under the age of 18 for the treatment
      of juvenile rheumatoid arthritis may increase the risk of disseminated intravascular
      coagulation (bleeding problem). Talk with your doctor if you have concerns about
      this.
  - type: paragraph
    text: Serious skin reactions, including exfoliative dermatitis, Stevens-Johnson
      syndrome, toxic epidermal necrolysis, acute generalized exanthematous pustulosis
      (AGEP), fixed drug eruption (FDE), and generalized bullous fixed drug eruption
      (GBFDE) can occur with this medicine. Check with your doctor right away if you
      have blistering, peeling, or loosening of the skin, chills, cough, diarrhea,
      itching, joint or muscle pain, red irritated eyes, red skin lesions, sore throat,
      sores, ulcers, or white spots in the mouth or on the lips, or unusual tiredness
      or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have black, tarry stools, chest
      pain, chills, cough, fever, painful or difficult urination, sore throat, sores,
      ulcers, or white spots in the mouth or on the lips, swollen glands, unusual
      bleeding or bruising, or unusual tiredness or weakness. These may be symptoms
      of serious skin reaction called drug reaction with eosinophilia and systemic
      symptoms (DRESS).
  - type: paragraph
    text: Serious side effects can occur during treatment with this medicine and can
      occur without warning. However, possible warning signs often occur, including
      black, tarry stools, decreased urination, severe stomach pain, skin rash, swelling
      of the face, fingers, feet, or lower legs, unusual bleeding or bruising, unusual
      weight gain, vomiting of blood or material that looks like coffee grounds, or
      yellow eyes and skin. Also, signs of serious heart problems could occur such
      as chest pain, tightness in the chest, fast or irregular heartbeat, or unusual
      flushing or warmth of the skin. Check with your doctor right away if you notice
      any of these warning signs .
  - type: paragraph
    text: This medicine may cause a serious allergic reaction called anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, trouble breathing or swallowing,
      or any swelling of your hands, face, or mouth while you are using this medicine.
  - type: paragraph
    text: Tell your doctor if you or your child have unexplained weight gain or edema
      (fluid retention or body swelling) with this medicine.
  - type: paragraph
    text: Before having any kind of surgery or medical tests, tell your doctor that
      you are taking this medicine. It may be necessary for you to stop treatment
      for a while, or to change to a different NSAID before your procedure.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - fever
      - skin rash
      - sneezing
      - sore throat
      - swelling of the face, fingers, feet, or lower legs
    subsections: []
