      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - unusual weight gain
      - vomiting
      - vomiting of blood or material that looks like coffee grounds
      - weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Area rash
      - blistering, peeling, or loosening of the skin
      - changes in skin color
      - clay-colored stools
      - dilated neck veins
      - itching
      - joint or muscle pain
      - light-colored stools
      - pale or a bluish color skin of the fingers or toes
      - red irritated eyes
      - red skin lesions, often with a purple center
      - seizures
      - slurred speech
      - sores, welting, or blisters
      - sudden and severe inability to speak
      - ulcers or white spots in the mouth or on the lips
      - unpleasant breath odor
      - weakness in the arm or leg on one side of the body
      - yellow eyes and skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Continuing thirst
      - dizziness
      - drowsiness
      - headache, severe or continuing
      - sudden decrease in the amount of urine
      - trouble breathing
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
