    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Bleeding problems or
      - Congestive heart failure or
      - Edema (fluid retention or body swelling) or
      - Heart attack, history of or
      - Heart disease or
      - Hypertension (high blood pressure) or
      - Kidney disease, mild to moderate or
      - Stomach ulcers or bleeding, history of or
      - Stroke, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Aspirin-sensitive asthma, history of or
      - Aspirin sensitivity, history of or
      - Kidney disease, severe or
      - Liver disease, severe or
      - Sulfa or sulfonamide allergy (eg, sulfamethoxazole, Bactrim®, or Septra®)—Should
        not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Certain genetic conditions (poor CYP2C9 (a liver enzyme) metabolizers) or
      - Liver disease, mild or moderate—Use with caution. You may need a reduced dose
        of this medicine.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Hypovolemia—Must be corrected first before using this medicine.
    - type: list
      ordered: false
      items:
      - Heart surgery (eg, coronary artery bypass graft [CABG] surgery)—This medicine
        should not be used to relieve pain right before or after the surgery.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: For safe and effective use of this medicine, do not take more of it, do
      not take it more often, and do not take it for a longer time than your doctor
      ordered . Taking too much of this medicine may increase the chance of unwanted
      effects.
  - type: paragraph
    text: This medicine should come with a Medication Guide. It is very important
      that you read and understand this information. Be sure to ask your doctor about
      anything you do not understand.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: If you cannot swallow the capsule, you may open it and pour the medicine
      to a teaspoon of cool or room temperature applesauce. This mixture must be swallowed
      right away without chewing and followed with a glass of water to make sure all
      of the mixture is swallowed.
  - type: paragraph
    text: 'To use the oral liquid :'
  - type: list
    ordered: false
    items:
    - If you are taking 120 milligrams (mg), take the medicine directly from the bottle.
      Hold the bottle upside down for 10 seconds to make sure the full amount of medicine
      is taken.
    - If you are taking 60 mg, use an oral dosing syringe to withdraw and measure
      2.4 milliliters (mL) of the medicine from the bottle and take it directly from
      the syringe. Do not use a household teaspoon to measure the medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For acute pain or pain during menstruation:
        Adults—At first, 400 milligrams (mg). A second dose of 200 mg can be taken
        if needed on the first day. Then, 200 mg 2 times a day as needed. Children—Use
        and dose must be determined by your doctor. For ankylosing spondylitis or
        osteoarthritis: Adults—200 milligrams (mg) once a day or 100 mg 2 times a
        day. Your doctor may increase your dose if needed. Children—Use and dose must
        be determined by your doctor. For rheumatoid arthritis or juvenile rheumatoid
        arthritis: Adults—100 to 200 milligrams (mg) 2 times a day. Children 2 years
        of age and older and weighing more than 25 kilograms (kg)—Dose is based on
        body weight and must be determined by your doctor. The dose is usually 100
        milligrams (mg) 2 times a day. Children 2 years of age and older and weighing
        less than 25 kilograms (kg)—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 50 milligrams (mg) 2 times a day. Children
        younger than 2 years of age—Use and dose must be determined by your doctor.'
      - 'For oral dosage form (solution): For acute migraine with or without aura:
        Adults—120 milligrams (mg) once a day. Your doctor may adjust your dose as
        needed and tolerated. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For acute pain or pain during menstruation: Adults—At first, 400 milligrams
        (mg). A second dose of 200 mg can be taken if needed on the first day. Then,
        200 mg 2 times a day as needed. Children—Use and dose must be determined by
        your doctor.'
      - 'For ankylosing spondylitis or osteoarthritis: Adults—200 milligrams (mg)
        once a day or 100 mg 2 times a day. Your doctor may increase your dose if
        needed. Children—Use and dose must be determined by your doctor.'
      - 'For rheumatoid arthritis or juvenile rheumatoid arthritis: Adults—100 to
        200 milligrams (mg) 2 times a day. Children 2 years of age and older and weighing
        more than 25 kilograms (kg)—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 100 milligrams (mg) 2 times a day. Children
        2 years of age and older and weighing less than 25 kilograms (kg)—Dose is
        based on body weight and must be determined by your doctor. The dose is usually
        50 milligrams (mg) 2 times a day. Children younger than 2 years of age—Use
        and dose must be determined by your doctor.'
    - type: list
