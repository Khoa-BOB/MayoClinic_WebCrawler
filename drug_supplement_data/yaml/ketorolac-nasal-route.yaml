    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to ethylenediamine tetraacetic acid (EDTA) or
      - Allergy to aspirin or other non-steroidal anti-inflammatory medicines (NSAIDs)
        or
      - Aspirin-sensitive asthma, history of or
      - Bleeding problems or
      - Kidney disease, severe (including kidney failure) or
      - Major surgery, prior to or
      - Stomach ulcers, bleeding, or perforation, active or recent or
      - Use for pain relief of labor or childbirth—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Anemia or
      - Blood clotting problems or
      - Congestive heart failure or
      - Crohn's disease, history of or
      - Edema (fluid retention or body swelling) or
      - Heart attack, recent or history of or
      - Heart disease or
      - Hyperkalemia (high potassium in the blood) or
      - Hypertension (high blood pressure) or
      - Kidney disease, or history of or
      - Liver disease, or history of or
      - Stroke, history of or
      - Ulcerative colitis, history of—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Hypovolemia—Must be corrected first before using this medicine.
    - type: list
      ordered: false
      items:
      - Heart surgery (eg, coronary artery bypass graft [CABG])—Should not be used
        to relieve pain right before or after the surgery.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use it for a longer time than your doctor
      ordered. Do not use it for more than 5 days in a row . The total number of days
      also includes any doses of ketorolac that may be given in a hospital or clinic
      setting. Using too much of this medicine increases the chance of side effects,
      especially in elderly patients.
  - type: paragraph
    text: This medicine should come with a Medication Guide and patient instructions.
      Read and follow the instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: This medicine is only used in the nose . Do not breathe in (inhale) this
      medicine while spraying . Do not get any of it into your eyes. If it does get
      into the eyes, rinse them with water or saline right away and call your doctor.
  - type: paragraph
    text: Drink extra fluids while you are using this medicine. This will keep your
      kidneys working well and help prevent kidney problems.
  - type: paragraph
    text: 'To use:'
  - type: list
    ordered: false
    items:
    - If you are using the nasal spray for the first time, you will need to prime
      the spray. To do this, pump the bottle 5 times until some of the medicine sprays
      out. Now it is ready to use.
    - Gently blow your nose to clear the nostrils.
    - Sit or stand up straight and tilt your head slightly forward.
    - Insert the tip of the bottle into your right nostril. Point the bottle away
      from the center of your nose.
    - Hold your breath and spray once into your right nostril. Slowly breathe in through
      your mouth. You may want to pinch your nose, to allow the medicine to be absorbed
      through the skin inside your nose.
    - If your dose is 2 sprays, spray once into your left nostril the same way.
    - After using the spray, wipe the tip of the bottle with a clean tissue and put
      the clear plastic cover back on.
    - Do not use the bottle for more than 24 hours after your first dose. Throw the
      bottle away after 24 hours even if it still has liquid inside it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For nasal dosage form (spray): For pain: Adults weighing 50 kilograms (kg)
        or more—31.5 milligrams (mg) or 1 spray in each nostril every 6 to 8 hours.
        Your doctor may adjust your dose if needed. However, the dose is not more
        than 126 mg (a total of 8 sprays) per day. Older adults and adults weighing
        less than 50 kg—15.75 mg or 1 spray in only one nostril every 6 to 8 hours.
        However, the dose is usually not more than 63 mg (a total of 4 sprays) per
        day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For pain: Adults weighing 50 kilograms (kg) or more—31.5 milligrams (mg)
        or 1 spray in each nostril every 6 to 8 hours. Your doctor may adjust your
        dose if needed. However, the dose is not more than 126 mg (a total of 8 sprays)
        per day. Older adults and adults weighing less than 50 kg—15.75 mg or 1 spray
        in only one nostril every 6 to 8 hours. However, the dose is usually not more
        than 63 mg (a total of 4 sprays) per day. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults weighing 50 kilograms (kg) or more—31.5 milligrams (mg) or 1 spray
        in each nostril every 6 to 8 hours. Your doctor may adjust your dose if needed.
        However, the dose is not more than 126 mg (a total of 8 sprays) per day.
      - Older adults and adults weighing less than 50 kg—15.75 mg or 1 spray in only
        one nostril every 6 to 8 hours. However, the dose is usually not more than
        63 mg (a total of 4 sprays) per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Keep the unopened bottle in the refrigerator. Protect it from light and
        freezing. Once opened , store the bottle at room temperature, away from heat
        and direct sunlight. Throw away any unused medicine 24 hours after you opened
        the bottle and used your first dose.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress while you are
      using this medicine. This will allow your doctor to see if the medicine is working
      properly. Blood and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not use any other form of ketorolac (eg, injection or tablets) or other
      NSAIDs, unless your doctor says it is okay. Some examples of NSAIDs are aspirin,
      diclofenac, ibuprofen, or naproxen (Advil®, Aleve®, Celebrex®, Ecotrin®, Motrin®,
      or Voltaren®). Also, you should not use this medicine together with pentoxifylline
      (Trental®) or probenecid (Benemid®).
  - type: paragraph
    text: Ketorolac may cause bleeding in your stomach or bowels. This problem can
      happen without warning signs. This is more likely if you have had a stomach
      ulcer in the past, you smoke or drink alcohol regularly, are over 60 years of
      age, are in poor health, or are using certain other medicines (such as steroids
      or a blood thinner). Call your doctor right away if you have bloody or black,
      tarry stools, severe stomach pain or heartburn, or vomiting of blood or material
      that looks like coffee grounds.
  - type: paragraph
    text: Ketorolac may increase your risk of having blood clots, heart attack, heart
      failure, or stroke. This is more likely to occur in people who already have
      heart and blood vessel disease and who are using this medicine for a long time.
      Check with your doctor right away if you are having chest pain or discomfort,
      nausea or vomiting, pain or discomfort in the arms, jaw, back, or neck, trouble
      breathing, slurred speech, or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: Serious side effects can occur during treatment with this medicine and can
      occur without warning. However, possible warning signs often occur, including
      severe stomach pain, black tarry stools, vomiting of blood or material that
      looks like coffee grounds, skin rash, swelling of the face, fingers, feet, or
      lower legs. Also, signs of serious heart problems could occur such as chest
      pain, tightness in the chest, fast or irregular heartbeat, or unusual flushing
      or warmth of the skin. Check with your doctor immediately if you or your child
      notice any of these warning signs .
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. You might need to measure
      your blood pressure at home. If you think your blood pressure is too high, call
      your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, troubled breathing, unusual tiredness or weakness, vomiting,
      or weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have stomach pain, confusion,
      difficulty with breathing, irregular heartbeat, nausea or vomiting, nervousness,
      numbness or tingling in the hands, feet, or lips, or weakness or heaviness of
      the legs.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction called anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you have a rash, itching, trouble breathing or swallowing,
      or any swelling of your hands, face, or mouth while you are using this medicine.
  - type: paragraph
    text: Serious skin reactions, including Stevens-Johnson syndrome, exfoliative
      dermatitis, toxic epidermal necrolysis, fixed drug eruption (FDE), and generalized
      bullous fixed drug eruption (GBFDE) can occur during treatment with this medicine.
      Check with your doctor right away if you have blistering, peeling, or loosening
      of the skin, chills, cough, diarrhea, itching, joint or muscle pain, red irritated
      eyes, red skin lesions, sore throat, sores, ulcers, or white spots in the mouth
      or on the lips.
  - type: paragraph
    text: Check with your doctor right away if you have black, tarry stools, chest
      pain, chills, cough, fever, painful or difficult urination, sore throat, sores,
      ulcers, or white spots in the mouth or on the lips, swollen glands, unusual
      bleeding or bruising, or unusual tiredness or weakness. These may be symptoms
      of serious skin reaction called drug reaction with eosinophilia and systemic
      symptoms (DRESS).
  - type: paragraph
    text: Using this medicine during the later part of a pregnancy can harm your unborn
      baby. If you think you have become pregnant while using the medicine, tell your
      doctor right away.
  - type: paragraph
    text: This medicine may cause a delay in ovulation for women and may decrease
      sperm count in men, which can affect their ability to have children. If you
      plan to have children, talk with your doctor before using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody or black, tarry stools
      - dizziness
      - fast, irregular, pounding, or racing heartbeat or pulse
      - headache
      - nausea
      - nervousness
      - pale skin
      - pounding in the ears
      - severe stomach pain
      - stomach cramping or burning
      - sweating
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting of blood or material that looks like coffee grounds
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning feeling in the chest or stomach
      - chest pain or discomfort
      - decrease in the amount or frequency of urine
      - difficult or labored breathing
      - frequent urination
      - lightheadedness, dizziness, or fainting
      - rapid or shallow breathing
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody, cloudy, or dark urine
      - chest tightness
      - clay-colored stools
      - confusion
      - difficult, burning, or painful urination
      - difficulty with swallowing
      - extreme tiredness or weakness
      - hives, itching, or skin rash
      - lower back or side pain
      - nosebleeds
      - swelling of the face, fingers, feet, or lower legs
      - swollen glands
      - unpleasant breath odor
      - upper right abdominal or stomach pain
      - vomiting
      - weight gain or loss
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - difficulty with moving
      - difficulty with speaking
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - general body swelling
      - joint or muscle pain
      - pain or discomfort in the arms, jaw, back, or neck
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - pale or blue lips, fingernails, or skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness, soreness, or itching skin
      - severe mood or mental changes
      - sneezing
      - sores, welts, or blisters
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
      - weakness or heaviness of the legs
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - continuing ringing or buzzing or other unexplained noise in the ears
      - drowsiness
      - feeling of fullness
      - hearing loss
      - nasal discomfort
      - passing gas
      - swelling or inflammation of the mouth
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Runny nose
      - stuffy nose
      - watering of the eyes
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal dreams
      - abnormal taste
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - excessive thirst
      - inability to concentrate
      - irritability or restlessness
      - muscle trembling, jerking, or stiffness
      - redness, swelling, or soreness of the tongue
      - seeing, hearing, or feeling things that are not there
      - sensation of spinning
      - shakiness in the legs, arms, hands, or feet
      - trouble concentrating
      - trouble sleeping
      - uncontrolled movements, especially of the face, neck, and back
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, dry, or itching eyes
      - eye discharge or excessive tearing
      - redness, pain, swelling of the eye, eyelid, or inner lining of the eyelid
      - stiff neck or back
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
