title: Doxorubicin (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Adriamycin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Doxorubicin injection is used together with other medicines to treat cancer
      of the blood, lymph system, bladder, breast, stomach, lungs, ovaries, thyroid,
      nerves, kidneys, bones, and soft tissues, including muscles and tendons. It
      may also be used to treat other kinds of cancer, as determined by your doctor.
  - type: paragraph
    text: Doxorubicin belongs to the group of medicines known as antineoplastics.
      It seems to interfere with the growth of cancer cells, which are then eventually
      destroyed by the body. Since the growth of normal body cells may also be affected
      by doxorubicin, other effects will also occur. Some of these may be serious
      and must be reported to your doctor. Other effects, like hair loss, may not
      be serious but may cause concern. Some effects may not occur until months or
      years after the medicine is used.
  - type: paragraph
    text: Before you begin treatment with doxorubicin, you and your doctor should
      talk about the benefits this medicine will do as well as the risks of using
      it.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of doxorubicin injection in children.
        However, heart problems are more likely to occur in children younger than
        2 years of age, who are usually more sensitive to the effects of doxorubicin
        injection.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of doxorubicin injection in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Cobicistat
      - Dengue Tetravalent Vaccine, Live
      - Mavorixafor
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Tasonermin
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Abrocitinib
      - Adagrasib
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Alogliptin
      - Amiodarone
      - Amitriptyline
      - Amobarbital
      - Amprenavir
      - Apalutamide
      - Apixaban
      - Aprepitant
      - Aprobarbital
      - Asunaprevir
      - Atazanavir
      - Atorvastatin
      - Avacopan
      - Azathioprine
      - Azithromycin
      - Berotralstat
      - Boceprevir
      - Bosentan
      - Bupropion
      - Butabarbital
      - Butalbital
      - Canagliflozin
      - Capivasertib
      - Capmatinib
      - Captopril
      - Carbamazepine
      - Carvedilol
      - Celecoxib
      - Ceritinib
      - Chlorpromazine
      - Chlorzoxazone
      - Cholera Vaccine
      - Cilostazol
      - Cimetidine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Rolapitant
      - Sorafenib
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bone marrow problem (eg, drug-induced myelosuppression), severe or
      - Heart attack, recent (within 4 to 6 weeks) or
      - Heart disease, severe or
      - Liver disease, severe—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Infection—May decrease your body's ability to fight infection.
    - type: list
      ordered: false
      items:
      - Liver disease, mild—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital or cancer treatment center. This medicine is given through a needle
      placed in one of your veins.
  - type: paragraph
    text: The medicine is usually given once every 21 to 28 days. You may also receive
      other medicines to help prevent nausea and vomiting.
  - type: paragraph
    text: Doxorubicin is sometimes given together with certain other medicines. If
      you are receiving a combination of medicines, it is important that you receive
      each one at the proper time. If you are taking some of these medicines by mouth,
      ask your doctor to help you plan a way to take them at the right times.
  - type: paragraph
    text: While you are using this medicine, your doctor may want you to drink extra
      fluids so that you will pass more urine. This will help prevent kidney problems
      and keep your kidneys working well.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. It is very
      important that you read and understand this information. Be sure to ask your
      doctor about anything you do not understand.
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: This medicine needs to be given on a fixed schedule. If you miss a dose
        or forget to use your medicine, call your doctor or pharmacist for instructions.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep you or your partner from getting
      pregnant during therapy and for 6 months after the last dose of this medicine.
      If you think you have become pregnant while using the medicine, tell your doctor
      right away.
  - type: paragraph
    text: This medicine may cause irreversible heart muscle damage, leading to heart
      failure. This is more likely to occur if you have other heart problems, have
      had or currently receiving radiation therapy to your chest, or have received
      other cancer medicines. Tell your doctor right away if you have chest pain,
      decreased urine output, irregular heartbeat, trouble breathing, rapid weight
      gain, or swelling of your hands, ankles, or feet.
  - type: paragraph
    text: This medicine may increase risk of new cancers, such as acute myelogenous
      leukemia (AML) or myelodysplastic syndrome (MDS). Talk to your doctor if you
      have concerns about this risk.
  - type: paragraph
    text: If doxorubicin accidentally seeps out of the vein into which it is injected,
      it may damage some tissues and cause scarring. Tell the doctor or nurse right
      away if you notice redness, pain, or swelling at the place of injection.
  - type: paragraph
    text: While you are being treated with doxorubicin, and after you stop treatment
      with it, do not have any immunizations (vaccinations) without your doctor's
      approval. Doxorubicin may lower your body's resistance, and there is a chance
      you might get the infection the immunization is meant to prevent. In addition,
      other persons living in your household should not take oral polio vaccine, since
      there is a chance they could pass the polio virus on to you. Also, avoid persons
      who have taken oral polio vaccine within the last several months. Do not get
      close to them, and do not stay in the same room with them for very long. If
      you cannot take these precautions, you should consider wearing a protective
      face mask that covers the nose and mouth.
  - type: paragraph
    text: 'Doxorubicin can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. It can also lower the
      number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: This medicine may cause a serious type of reaction called tumor lysis syndrome.
      Your doctor may give you a medicine to help prevent this. Call your doctor right
      away if you have a decrease or change in urine amount, joint pain, stiffness,
      or swelling, lower back, side, or stomach pain, a rapid weight gain, swelling
      of the feet or lower legs, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may decrease the amount of sperm made and affect a man's ability
      to father a child. It may also cause premature menopause in women. Talk with
      your doctor before you use this medicine if you plan to have children.
  - type: paragraph
    text: Doxorubicin causes your urine to turn reddish in color, which may stain
      clothes. This is not blood. It is to be expected and only lasts for 1 or 2 days
      after each dose is given.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough or hoarseness accompanied by fever or chills
      - darkening or redness of the skin (if you recently had radiation treatment)
      - fast or irregular heartbeat
      - fever or chills
      - joint pain
      - lower back or side pain accompanied by fever or chills
      - pain at the injection site
      - painful or difficult urination accompanied by fever or chills
      - red streaks along the injected vein
      - shortness of breath
      - stomach pain
      - swelling of the feet and lower legs
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blood in the urine
      - pinpoint red spots on the skin
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hair loss, thinning of hair
      - nausea and vomiting
      - sores in the mouth and on the lips
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Darkening of the soles, palms, or nails
      - diarrhea
    - type: paragraph
      text: 'After you stop using this medicine, it may still produce some side effects
        that need attention. During this period of time, check with your doctor immediately
        if you notice the following side effects:'
    - type: list
      ordered: false
      items:
      - Fast or irregular heartbeat
      - shortness of breath
      - swelling of the feet and lower legs
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
    - type: paragraph
      text: 'Drug information provided by: Merative, Micromedex®'
