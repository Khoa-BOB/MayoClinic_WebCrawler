title: Clindamycin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cleocin HCl
    - type: paragraph
      text: Cleocin Pediatric
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Dalacin C Palmitate
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Clindamycin is used to treat bacterial infections. This medicine may be
      given to patients who had an allergic reaction to penicillin. Clindamycin will
      not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of clindamycin in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of clindamycin in the elderly. However,
        elderly patients are more likely to have diarrhea, which may require caution
        and adjustment in the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Levoketoconazole
      - Mifepristone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Apalutamide
      - Asciminib
      - Avacopan
      - Belzutifan
      - Berotralstat
      - Carbamazepine
      - Ceritinib
      - Cholera Vaccine, Live
      - Clarithromycin
      - Conivaptan
      - Crizotinib
      - Daridorexant
      - Enasidenib
      - Enzalutamide
      - Erythromycin
      - Exenatide
      - Fedratinib
      - Fluconazole
      - Gepotidacin
      - Imatinib
      - Itraconazole
      - Lanreotide
      - Lazertinib
      - Lefamulin
      - Letermovir
      - Lonafarnib
      - Mavorixafor
      - Methotrexate
      - Mitotane
      - Mobocertinib
      - Nirogacestat
      - Octreotide
      - Omaveloxolone
      - Pacritinib
      - Palbociclib
      - Phenobarbital
      - Primidone
      - Ranolazine
      - Repotrectinib
      - Ribociclib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atracurium
      - Cyclosporine
      - Metocurine
      - Tubocurarine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to aspirin—Use with caution. This medicine contains a yellow dye called
        tartrazine, which may cause allergic reactions (including bronchial asthma)
        in patients with this condition.
    - type: list
      ordered: false
      items:
      - Atopic syndrome or
      - Diarrhea or
      - Liver disease, severe or
      - Kidney disease or
      - Stomach or bowel problems, history of—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Meningitis—Should not be used in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: Take the capsule with a full glass (8 ounces) of water. This is to prevent
      irritation of the esophagus (tube between the throat and stomach).
  - type: paragraph
    text: Measure the oral liquid correctly using the marked measuring spoon that
      comes with the package. The average household teaspoon may not hold the right
      amount of liquid.
  - type: paragraph
    text: To help clear up your infection completely, keep using this medicine for
      the full time of treatment, even if you begin to feel better after a few days.
      If you have a "strep'' infection, you should keep using this medicine for at
      least 10 days. This is especially important in "strep" infections. Serious heart
      problems could develop later if your infection is not cleared up completely.
      Also, if you stop taking this medicine too soon, your symptoms may return.
  - type: paragraph
    text: This medicine works best when there is a constant amount in the blood. To
      help keep the amount constant, do not miss any doses. Also, it is best to take
      each dose at evenly spaced times day and night. If you need help in planning
      the best times to take your medicine, check with your doctor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules and solution): For treatment of bacterial
        infections: Adults—150 to 300 milligrams (mg) every 6 hours. For more severe
        infections, 300 to 450 mg every 6 hours. Children weighing 10 kilograms (kg)
        or more—Dose is based on body weight and must be determined by your doctor.
        The dose is usually 8 to 16 milligrams (mg) per kilogram (kg) of body weight
        per day, divided into 3 or 4 equal doses. For more severe infections, the
        dose is usually 16 to 25 mg per kg of body weight per day, divided into 3
        or 4 equal doses. Children weighing 10 kg or less—Dose is based on body weight
        and must be determined by your doctor. The dose is usually 37.5 milligrams
        (mg) or 1/2 teaspoonful 3 times a day.'
    - type: list
      ordered: false
      items:
      - 'For treatment of bacterial infections: Adults—150 to 300 milligrams (mg)
        every 6 hours. For more severe infections, 300 to 450 mg every 6 hours. Children
        weighing 10 kilograms (kg) or more—Dose is based on body weight and must be
        determined by your doctor. The dose is usually 8 to 16 milligrams (mg) per
        kilogram (kg) of body weight per day, divided into 3 or 4 equal doses. For
        more severe infections, the dose is usually 16 to 25 mg per kg of body weight
        per day, divided into 3 or 4 equal doses. Children weighing 10 kg or less—Dose
        is based on body weight and must be determined by your doctor. The dose is
        usually 37.5 milligrams (mg) or 1/2 teaspoonful 3 times a day.'
    - type: list
      ordered: false
      items:
      - Adults—150 to 300 milligrams (mg) every 6 hours. For more severe infections,
        300 to 450 mg every 6 hours.
      - Children weighing 10 kilograms (kg) or more—Dose is based on body weight and
        must be determined by your doctor. The dose is usually 8 to 16 milligrams
        (mg) per kilogram (kg) of body weight per day, divided into 3 or 4 equal doses.
        For more severe infections, the dose is usually 16 to 25 mg per kg of body
        weight per day, divided into 3 or 4 equal doses.
      - Children weighing 10 kg or less—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 37.5 milligrams (mg) or 1/2 teaspoonful
        3 times a day.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your or your child's progress after
      treatment . This is to make sure that the infection is cleared up completely,
      and to allow your doctor to check for any unwanted effects. Blood tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: If your or your child's symptoms do not improve, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: This medicine may cause diarrhea, and in some cases it can be severe. It
      may occur 2 months or more after you stop using this medicine. Do not take any
      medicine to treat diarrhea without first checking with your doctor. If you have
      any questions or if mild diarrhea continues or gets worse, check with your doctor.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you have a rash, itching, trouble breathing, trouble
      swallowing, or any swelling of your hands, face, or mouth while you or your
      child are using this medicine.
  - type: paragraph
    text: Serious skin reactions, including toxic epidermal necrolysis, drug reaction
      with eosinophilia and systemic symptoms (DRESS), and Stevens-Johnson syndrome
      can occur with this medicine. Check with your doctor right away if you have
      black, tarry stools, blistering, peeling, or loose skin, chest pain, chills,
      cough, diarrhea, itching, joint or muscle pain, painful or difficult urination,
      red irritated eyes, red skin lesions, often with a purple center, sore throat,
      sores, ulcers, or white spots in the mouth or on the lips, swollen glands, trouble
      breathing, unusual bleeding or bruising, or unusual tiredness or weakness while
      you or your child are receiving this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have blood in the urine, change
      in frequency of urination, drowsiness, increased thirst, loss of appetite, nausea
      or vomiting, swelling of the feet or lower legs, trouble breathing, or weakness.
      These may be symptoms of serious kidney problem.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cracks in the skin
      - loss of heat from the body
      - red, swollen skin scaly skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blistering, peeling, or loosening of the skin
      - bloating
      - blood in the urine or stools
      - blurred vision
      - chest pain or tightness
      - chills
      - clay-colored stools
      - cloudy urine
      - confusion
      - cough or hoarseness
      - dark urine
      - decrease in the amount of urine
      - diarrhea
      - diarrhea, watery and severe, which may also be bloody
      - difficulty with swallowing
      - dizziness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dry mouth
      - fast heartbeat
      - fever with or without chills
      - general feeling of tiredness or weakness
      - headache
      - heartburn
      - heart stops
      - hives or welts, itching, or skin rash
      - increased thirst
      - itching of the vagina or genital area
      - joint or muscle pain
      - loss of appetite
      - lower back or side pain
      - nausea or vomiting
      - no breathing
      - no pulse or blood pressure
      - pain during sexual intercourse
      - pain in the lower back or side
      - painful or difficult urination
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rash with flat lesions or small raised lesions on the skin
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - redness of the skin
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach cramps, pain, or tenderness
      - swollen glands
      - thick, white vaginal discharge with no odor or with a mild odor
      - thirst
      - trouble breathing
      - unconscious
      - unpleasant breath odor
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - unusual weight loss
      - vomiting of blood
      - yellow eyes or skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
