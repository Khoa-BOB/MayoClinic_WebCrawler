- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ophthalmic tobramycin is used in the eye to treat bacterial infections of
      the eye. Tobramycin works by killing bacteria.
  - type: paragraph
    text: Ophthalmic tobramycin may be used alone or with other medicines for eye
      infections. Either the drops or the ointment form of this medicine may be used
      alone during the day. In addition, both forms may be used together, with the
      drops being used during the day and the ointment at night.
  - type: paragraph
    text: Tobramycin ophthalmic preparations are available only with your doctor's
      prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
    - Ointment
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested in children and, in effective doses, has
        not been shown to cause different side effects or problems than it does in
        adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of ophthalmic tobramycin in
        the elderly with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Ataluren
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alcuronium
      - Aspirin
      - Atracurium
      - Bumetanide
      - Cholera Vaccine, Live
      - Cidofovir
      - Cisatracurium
      - Colistimethate Sodium
      - Cyclosporine
      - Decamethonium
      - Doxacurium
      - Emtricitabine
      - Ethacrynic Acid
      - Fazadinium
      - Foscarnet
      - Furosemide
      - Gallamine
      - Hexafluorenium
      - LetibotulinumtoxinA-wlbg
      - Lysine
      - Mannitol
      - Metocurine
      - Mivacurium
      - Pancuronium
      - Pipecuronium
      - Rapacuronium
      - Rocuronium
      - Succinylcholine
      - Tacrolimus
      - Teicoplanin
      - Tenofovir Alafenamide
      - Tubocurarine
      - Vancomycin
      - Vecuronium
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Cisplatin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: 'For patients using tobramycin ophthalmic solution (eye drops):'
  - type: list
    ordered: false
    items:
    - The bottle is only partially full to provide proper drop control.
    - 'To use: First, wash your hands. Tilt the head back and with the index finger
      of one hand, press gently on the skin just beneath the lower eyelid and pull
      the lower eyelid away from the eye to make a space. Drop the medicine into this
      space. Let go of the eyelid and gently close the eyes. Do not blink. Keep the
      eyes closed for 1 or 2 minutes, to allow the medicine to come into contact with
      the infection. If you think you did not get the drop of medicine into your eye
      properly, use another drop. To keep the medicine as germ-free as possible, do
      not touch the applicator tip to any surface (including the eye). Also, keep
      the container tightly closed.'
    - If your doctor ordered two different ophthalmic solutions to be used together,
      wait at least 5 minutes between the times you apply the medicines. This will
      help to keep the second medicine from ``washing out'' the first one.
  - type: list
    ordered: false
    items:
    - First, wash your hands. Tilt the head back and with the index finger of one
      hand, press gently on the skin just beneath the lower eyelid and pull the lower
      eyelid away from the eye to make a space. Drop the medicine into this space.
      Let go of the eyelid and gently close the eyes. Do not blink. Keep the eyes
      closed for 1 or 2 minutes, to allow the medicine to come into contact with the
      infection.
    - If you think you did not get the drop of medicine into your eye properly, use
      another drop.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
  - type: paragraph
    text: 'For patients using tobramycin ophthalmic ointment (eye ointment):'
  - type: list
    ordered: false
    items:
    - 'To use: First, wash your hands. Tilt the head back and with the index finger
      of one hand, press gently on the skin just beneath the lower eyelid and pull
      the lower eyelid away from the eye to make a space. Squeeze a thin strip of
      ointment into this space. A 1.25-cm (approximately ½-inch) strip of ointment
      usually is enough, unless you have been told by your doctor to use a different
      amount. Let go of the eyelid and gently close the eyes and keep them closed
      for 1 or 2 minutes, to allow the medicine to come into contact with the infection.
      To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). After using tobramycin eye ointment, wipe
      the tip of the ointment tube with a clean tissue and keep the tube tightly closed.'
  - type: list
    ordered: false
    items:
    - First, wash your hands. Tilt the head back and with the index finger of one
      hand, press gently on the skin just beneath the lower eyelid and pull the lower
      eyelid away from the eye to make a space. Squeeze a thin strip of ointment into
      this space. A 1.25-cm (approximately ½-inch) strip of ointment usually is enough,
      unless you have been told by your doctor to use a different amount. Let go of
      the eyelid and gently close the eyes and keep them closed for 1 or 2 minutes,
      to allow the medicine to come into contact with the infection.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). After using tobramycin eye ointment, wipe
      the tip of the ointment tube with a clean tissue and keep the tube tightly closed.
  - type: paragraph
    text: To help clear up your eye infection completely, keep using tobramycin for
      the full time of treatment, even if your symptoms have disappeared. Do not miss
      any doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic ointment dosage forms: For mild to moderate infections: Adults
        and children—Use every eight to twelve hours. For severe infections: Adults
        and children—Use every three to four hours until improvement occurs.'
      - 'For ophthalmic solution (eye drops) dosage forms: For mild to moderate infections:
        Adults and children—One drop every four hours. For severe infections: Adults
        and children—One drop every hour until improvement occurs.'
    - type: list
      ordered: false
      items:
      - 'For mild to moderate infections: Adults and children—Use every eight to twelve
        hours.'
      - 'For severe infections: Adults and children—Use every three to four hours
        until improvement occurs.'
    - type: list
      ordered: false
      items:
      - Adults and children—Use every eight to twelve hours.
    - type: list
      ordered: false
      items:
      - Adults and children—Use every three to four hours until improvement occurs.
    - type: list
      ordered: false
      items:
      - 'For mild to moderate infections: Adults and children—One drop every four
        hours.'
      - 'For severe infections: Adults and children—One drop every hour until improvement
        occurs.'
    - type: list
      ordered: false
      items:
      - Adults and children—One drop every four hours.
    - type: list
      ordered: false
      items:
      - Adults and children—One drop every hour until improvement occurs.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your eye infection does not improve within a few days, or if it becomes
      worse, check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Itching, redness, swelling, or other sign of eye or eyelid irritation not
        present before use of this medicine
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Increased watering of the eyes
      - itching, redness, or swelling of the eyes or eyelids
      - painful irritation of the clear front part of the eye
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning or stinging of the eyes
    - type: paragraph
      text: Eye ointments usually cause your vision to blur for a few minutes after
        application.
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
