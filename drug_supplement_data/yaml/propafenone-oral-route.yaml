title: Propafenone (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Rythmol
    - type: paragraph
      text: Rythmol SR
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Propafenone is used to prevent irregular heartbeats such as atrial fibrillation
      (AF) from occurring again in patients who do not have structural heart disease.
  - type: paragraph
    text: Propafenone belongs to the group of medicines known as antiarrhythmics.
      It works directly on the heart tissue and will slow the nerve impulses in the
      heart. This helps keep the heart rhythm normal.
  - type: paragraph
    text: There is a chance that propafenone may cause new or make worse existing
      heart rhythm problems when it is used. Since it has been shown to cause severe
      problems in some patients, propafenone is only used to treat serious heart rhythm
      problems. Discuss this possible effect with your doctor.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule, Extended Release
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of propafenone in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of propafenone in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Colchicine
      - Dronedarone
      - Fluconazole
      - Levoketoconazole
      - Levomethadyl
      - Mavorixafor
      - Mesoridazine
      - Nirmatrelvir
      - Pimozide
      - Piperaquine
      - Ritonavir
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Tipranavir
      - Vernakalant
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Acecainide
      - Adagrasib
      - Ajmaline
      - Alfuzosin
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amoxapine
      - Anagrelide
      - Apomorphine
      - Aprindine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Artemether
      - Asenapine
      - Astemizole
      - Atazanavir
      - Azimilide
      - Azithromycin
      - Bedaquiline
      - Boceprevir
      - Bretylium
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Celecoxib
      - Ceritinib
      - Chloral Hydrate
      - Chloroquine
      - Chlorpromazine
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Metoprolol
      - Rifapentine
      - Theophylline
      - Tolterodine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma or
      - Bronchitis or
      - Emphysema—Propafenone can increase trouble in breathing.
    - type: list
      ordered: false
      items:
      - AV block (type of abnormal heart rhythm), with no pacemaker or
      - Bradycardia (slow heartbeat) or
      - Breathing problems or lung disease (eg, bronchospasm, severe obstructive pulmonary
        disease) or
      - Brugada syndrome (a genetic heart rhythm disorder) or
      - Cardiogenic shock (shock caused by heart attack) or
      - Heart failure or
      - Hypotension (low blood pressure) or
      - Mineral imbalance or
      - Sick sinus node syndrome (type of abnormal heart rhythm), with no pacemaker—Should
        not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Blood or bone marrow problems (eg, agranulocytosis, granulocytopenia) or
      - Coronary artery disease or
      - Heart rhythm problems (eg, QT prolongation) or
      - Myasthenia gravis (severe muscle weakness) or
      - Torsade de pointes or
      - Ventricular fibrillation or tachycardia—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - If you have a permanent pacemaker—Use with caution. Propafenone may interfere
        with the pacemaker and require more careful follow-up by the doctor.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      or less of this medicine, and do not take it more often than your doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: 'For patients taking the extended-release capsules :'
  - type: list
    ordered: false
    items:
    - Swallow the capsules whole. Do not crush, break, or chew them.
    - This medicine may be taken with or without food.
  - type: paragraph
    text: This medicine works best when there is a constant amount in the blood. To
      help keep the amount constant, do not miss any doses. Also, it is best to take
      each dose at evenly spaced times day and night. For example, if you are to take
      3 doses a day, doses should be spaced about 8 hours apart. If you need help
      in planning the best times to take your medicine, check with your doctor.
  - type: paragraph
    text: Your doctor may want you to carry a medical identification card or bracelet
      stating that you are using this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - The number of extended-release capsules or tablets that you take depends on
        the strength of the medicine.
      - 'For atrial fibrillation (AF): For oral dosage form (extended-release capsules):
        Adults—At first, 225 milligrams (mg) every 12 hours. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 425 mg every
        12 hours. Children—Use and dose must be determined by your doctor. For oral
        dosage form (tablets): Adults—150 milligrams (mg) every 8 hours. Your doctor
        may increase your dose if needed. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release capsules): Adults—At first, 225 milligrams
        (mg) every 12 hours. Your doctor may adjust your dose as needed. However,
        the dose is usually not more than 425 mg every 12 hours. Children—Use and
        dose must be determined by your doctor.'
      - 'For oral dosage form (tablets): Adults—150 milligrams (mg) every 8 hours.
        Your doctor may increase your dose if needed. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 225 milligrams (mg) every 12 hours. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 425 mg every
        12 hours.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—150 milligrams (mg) every 8 hours. Your doctor may increase your dose
        if needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      make sure the medicine is working properly. This will allow for changes to be
      made in the amount of medicine you are taking, if necessary.
  - type: paragraph
    text: This medicine can cause changes in your heart rhythm, such as conditions
      called PR, QRS, or QT prolongation. It may cause fainting or serious side effects
      in some patients. Contact your doctor right away if your symptoms do not improve
      or if they get worse.
  - type: paragraph
    text: 'Check with your doctor right away if you develop any of the following:
      chest pain, shortness of breath, swelling of your hands, ankles, or feet, or
      weight gain. These may be symptoms of heart failure.'
  - type: paragraph
    text: This medicine can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. If you can, avoid people
      with infections. Check with your doctor immediately if you think you are getting
      an infection or if you get a fever or chills, cough or hoarseness, lower back
      or side pain, or painful or difficult urination.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect the results of certain medical tests.
  - type: paragraph
    text: Propafenone may cause some people to become dizzy or lightheaded. Make sure
      you know how you react to this medicine before you drive, use machines, or do
      anything else that could be dangerous if you are dizzy .
  - type: paragraph
    text: If you have been using this medicine regularly for several weeks, do not
      suddenly stop using it. Check with your doctor for the best way to gradually
      reduce the amount you are taking before stopping completely.
  - type: paragraph
    text: This medicine may decrease the amount of sperm men make. Talk to your doctor
      if you have concerns about this.
  - type: paragraph
    text: Grapefruits and grapefruit juice may increase the effects of propafenone
      by increasing the amount of this medicine in your body. You should not eat grapefruit
      or drink grapefruit juice while you taking this medicine.
  - type: paragraph
    text: Tell your doctor if you are smoking tobacco.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - fast, irregular, or slow heartbeat
      - lightheadedness, dizziness, or fainting
      - shortness of breath
      - swelling of the feet or lower legs
      - weight gain
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - fever
      - joint pain
      - trembling or shaking
      - weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in taste or bitter or metallic taste
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - constipation
      - diarrhea
      - dryness of the mouth
      - headache
      - nausea or vomiting
      - skin rash
      - unusual tiredness or weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
