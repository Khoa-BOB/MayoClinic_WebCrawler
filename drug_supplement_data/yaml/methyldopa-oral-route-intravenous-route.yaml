    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      make sure that this medicine is working properly.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes over-the-counter (nonprescription) medicines for appetite
      control, asthma, colds, cough, hay fever, or sinus problems, since they may
      tend to increase your blood pressure.
  - type: paragraph
    text: If you have a fever and there seems to be no reason for it, check with your
      doctor. This is especially important during the first few weeks you take methyldopa,
      since fever may be a sign of a serious reaction to this medicine.
  - type: paragraph
    text: Before having any kind of surgery (including dental surgery) or emergency
      treatment, make sure the medical doctor or dentist in charge knows that you
      are taking this medicine.
  - type: paragraph
    text: Methyldopa may cause some people to become drowsy or less alert than they
      are normally. This is more likely to happen when you begin to take it or when
      you increase the amount of medicine you are taking. Make sure you know how you
      react to this medicine before you drive, use machines, or do anything else that
      could be dangerous if you are not alert.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up from a lying or sitting position. Getting up slowly may help, but if the
      problem continues or gets worse, check with your doctor.
  - type: paragraph
    text: Methyldopa may cause dryness of the mouth. For temporary relief, use sugarless
      candy or gum, melt bits of ice in your mouth, or use a saliva substitute. However,
      if your mouth continues to feel dry for more than 2 weeks, check with your medical
      doctor or dentist. Continuing dryness of the mouth may increase the chance of
      dental disease, including tooth decay, gum disease, and fungus infections.
  - type: paragraph
    text: Tell the doctor in charge that you are taking this medicine before you have
      any medical tests. The results of some tests may be affected by this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever, shortly after starting to take this medicine
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Swelling of feet or lower legs
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Mental depression or anxiety
      - nightmares or unusually vivid dreams
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dark or amber urine
      - diarrhea or stomach cramps (severe or continuing)
      - fever, chills, troubled breathing, and fast heartbeat
      - general feeling of discomfort or illness or weakness
      - joint pain
      - pale stools
      - skin rash or itching
      - stomach pain (severe) with nausea and vomiting
      - tiredness or weakness after having taken this medicine for several weeks (continuing)
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Drowsiness
      - dryness of mouth
      - headache
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased sexual ability or interest in sex
      - diarrhea
      - dizziness or lightheadedness when getting up from a lying or sitting position
      - nausea or vomiting
      - numbness, tingling, pain, or weakness in hands or feet
      - slow heartbeat
      - stuffy nose
      - swelling of breasts or unusual milk production
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
