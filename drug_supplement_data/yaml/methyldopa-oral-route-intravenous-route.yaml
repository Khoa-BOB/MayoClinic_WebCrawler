        of body weight. This is mixed in a solution (5% dextrose) and slowly injected
        into a vein every six hours as needed.'
    - type: list
      ordered: false
      items:
      - Adults—250 to 500 mg mixed in 100 milliliters (mL) of solution (5% dextrose)
        and slowly injected into a vein every six hours as needed.
      - Children—Dose is based on body weight and must be determined by your doctor.
        The usual dose is 20 to 40 mg per kg (9.1 to 18.2 mg per pound) of body weight.
