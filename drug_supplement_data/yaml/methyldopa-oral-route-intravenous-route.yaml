title: Methyldopa (oral route, intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Aldomet
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Methyldopa belongs to the general class of medicines called antihypertensives.
      It is used to treat high blood pressure (hypertension).
  - type: paragraph
    text: High blood pressure adds to the work load of the heart and arteries. If
      it continues for a long time, the heart and arteries may not function properly.
      This can damage the blood vessels of the brain, heart, and kidneys, resulting
      in a stroke, heart failure, or kidney failure. High blood pressure may also
      increase the risk of heart attacks. These problems may be less likely to occur
      if blood pressure is controlled.
  - type: paragraph
    text: Methyldopa works by controlling impulses along certain nerve pathways. As
      a result, it relaxes blood vessels so that blood passes through them more easily.
      This helps to lower blood pressure.
  - type: paragraph
    text: Methyldopa is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of methyldopa
        in children with use in other age groups, this medicine is not expected to
        cause different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Dizziness or lightheadedness and drowsiness may be more likely to occur
        in the elderly, who are more sensitive to the effects of methyldopa.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
      - Linezolid
      - Methylene Blue
      - Ozanimod
      - Phenelzine
      - Procarbazine
      - Rasagiline
      - Safinamide
      - Selegiline
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Entacapone
      - Iobenguane I 131
      - Pseudoephedrine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Alprenolol
      - Bisoprolol
      - Ferric Ammonium Citrate
      - Haloperidol
      - Iron
      - Phenylpropanolamine
      - Sotalol
      - Timolol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (chest pain) or
      - Parkinson's disease—Methyldopa may make these conditions worse
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Effects of methyldopa may be increased because of slower removal
        from the body
    - type: list
      ordered: false
      items:
      - Mental depression (history of)—Methyldopa can cause mental depression
    - type: list
      ordered: false
      items:
      - Pheochromocytoma—Methyldopa may interfere with tests for the condition; in
        addition, there have been reports of increased blood pressure
    - type: list
      ordered: false
      items:
      - If you have taken methyldopa in the past and developed liver problems
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: In addition to the use of the medicine your doctor has prescribed, treatment
      for your high blood pressure may include weight control and care in the types
      of foods you eat, especially foods high in sodium. Your doctor will tell you
      which of these are most important for you. You should check with your doctor
      before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that methyldopa will not cure your high blood pressure but it does
      help control it. Therefore, you must continue to take it as directed if you
      expect to lower your blood pressure and keep it down. You may have to take high
      blood pressure medicine for the rest of your life . If high blood pressure is
      not treated, it can cause serious problems such as heart failure, blood vessel
      disease, stroke, or kidney disease.
  - type: paragraph
    text: To help you remember to take your medicine, try to get into the habit of
      taking it at the same time each day.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (suspension or tablets): For high blood pressure: Adults—250
        milligrams (mg) to 2 grams a day. This is divided into two to four doses.
        Children—Dose is based on body weight or size and must be determined by your
        doctor. The usual dose is 10 mg per kilogram (kg) (4.5 mg per pound) of body
        weight a day. This is divided into two to four doses. Your doctor may increase
        the dose as needed.'
      - 'For injection dosage form: For high blood pressure: Adults—250 to 500 mg
        mixed in 100 milliliters (mL) of solution (5% dextrose) and slowly injected
        into a vein every six hours as needed. Children—Dose is based on body weight
        and must be determined by your doctor. The usual dose is 20 to 40 mg per kg
        (9.1 to 18.2 mg per pound) of body weight. This is mixed in a solution (5%
        dextrose) and slowly injected into a vein every six hours as needed.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—250 milligrams (mg) to 2 grams a day. This
        is divided into two to four doses. Children—Dose is based on body weight or
        size and must be determined by your doctor. The usual dose is 10 mg per kilogram
        (kg) (4.5 mg per pound) of body weight a day. This is divided into two to
        four doses. Your doctor may increase the dose as needed.'
    - type: list
      ordered: false
      items:
      - Adults—250 milligrams (mg) to 2 grams a day. This is divided into two to four
        doses.
      - Children—Dose is based on body weight or size and must be determined by your
        doctor. The usual dose is 10 mg per kilogram (kg) (4.5 mg per pound) of body
        weight a day. This is divided into two to four doses. Your doctor may increase
        the dose as needed.
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—250 to 500 mg mixed in 100 milliliters (mL)
        of solution (5% dextrose) and slowly injected into a vein every six hours
        as needed. Children—Dose is based on body weight and must be determined by
