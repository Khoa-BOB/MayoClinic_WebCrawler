title: Potassium phosphate (intravenous route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Potassium phosphate injection is a phosphate replacement that is used to
      treat or prevent hypophosphatemia (low phosphorus in the blood). It is also
      used as an additive in the preparation of fluid formula injections. This medicine
      is given to patients who cannot receive a phosphate supplement by mouth.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of potassium phosphate injection
        in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of potassium phosphate injection
        in the elderly. However, elderly patients are more likely to have age-related
        liver, kidney, or heart problems, which may require caution and an adjustment
        in the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amiloride
      - Azilsartan
      - Azilsartan Medoxomil
      - Candesartan
      - Canrenoate
      - Canrenone
      - Cilazapril
      - Cyclosporine
      - Digoxin
      - Enalapril
      - Enalaprilat
      - Eplerenone
      - Eprosartan
      - Erdafitinib
      - Fosinopril
      - Irbesartan
      - Lisinopril
      - Losartan
      - Moexipril
      - Olmesartan
      - Perindopril
      - Quinapril
      - Ramipril
      - Spirapril
      - Spironolactone
      - Tacrolimus
      - Telmisartan
      - Trandolapril
      - Triamterene
      - Valsartan
      - Zofenopril
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Adrenal problems, severe or
      - Diabetes or
      - Heart disease or
      - Heart rhythm problems or
      - Hypercalcemia (high calcium in the blood) or
      - Hypomagnesemia (low magnesium in the blood)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Hyperkalemia (high potassium in the blood) or
      - Hyperphosphatemia (high phosphorus in the blood) or
      - Hypocalcemia (low calcium in the blood) or
      - Kidney disease, severe (eg, end-stage renal disease)—Should not be used in
        patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate—Use with caution. The effect may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. This medicine is given through a needle placed in a vein.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your progress closely while you are receiving this
      medicine to see if the medicine is working properly and to decide if you should
      continue to receive it. Blood and urine tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: This medicine contains aluminum which can cause harm especially to premature
      babies. Talk to your doctor if you have concerns about this.
  - type: paragraph
    text: This medicine may increase your risk of having serious heart or heart rhythm
      problems (eg, QT prolongation). Check with your doctor right away if you start
      having dizziness, fainting, lightheadedness, seizures, or fast, slow, pounding,
      or uneven heartbeat.
  - type: paragraph
    text: This medicine may also increase your risk of having blood clots in the lungs.
      Call your doctor right away if you have chest pain or trouble breathing.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blood in the urine
      - blurred vision
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - changes in skin color
      - chest pain or discomfort
      - confusion
      - decreased or increased urination
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fast, slow, pounding, or irregular heartbeat or pulse
      - fever
      - mood or mental changes
      - muscle cramps in the hands, arms, feet, legs, or face
      - nausea
      - nervousness
      - numbness and tingling around the mouth, fingertips, or feet
      - seizures
      - sweating
      - trouble breathing
      - unusual tiredness or weakness
      - vomiting
      - weakness and heaviness of the legs
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - stomach pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
