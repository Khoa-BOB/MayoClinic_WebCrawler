title: Acetylcysteine (inhalation route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Mucomyst
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Acetylcysteine is a mucolytic (medicine that destroys or dissolves mucus).
      It is usually given by inhalation but may be given in other ways in a hospital.
  - type: paragraph
    text: Acetylcysteine is used for certain lung conditions when increased amounts
      of mucus make breathing difficult. Acetylcysteine liquefies (thins) or dissolves
      mucus so that it may be coughed up. Sometimes the mucus may have to be removed
      by suction.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of acetylcysteine
        in children with use in other age groups, this medicine is not expected to
        cause different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of acetylcysteine in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Carbamazepine
      - Nitroglycerin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma—Acetylcysteine may make the condition worse
    - type: list
      ordered: false
      items:
      - Decreased ability to cough—The mucus may have to be removed by suctioning
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use acetylcysteine only as directed. Do not use more of it and do not use
      it more often than your doctor ordered. To do so may increase the chance of
      side effects.
  - type: paragraph
    text: If you are using this medicine at home, make sure you understand exactly
      how to use it. If you have any questions about this, check with your doctor.
  - type: paragraph
    text: After using acetylcysteine, try to cough up the loosened or thinned mucus.
      If this does not work, it may have to be suctioned out. This will prevent too
      much mucus from building up in the lungs. If you have any questions about this,
      check with your doctor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For inhalation dosage form (solution): To thin or dissolve mucus in lung
        diseases: Adults and children— 3 to 5 milliliters (mL) of a 20% solution or
        6 to 10 mL of a 10% solution used in a nebulizer three or four times a day.
        The medicine is inhaled through a face mask, mouthpiece, or tracheostomy.
        The 10 or 20% solution may be used for inhalation as a heavy mist in a tent
        or croupette. Sometimes the 10 or 20% solution is placed directly into the
        trachea or through a catheter into the trachea for certain conditions. For
        use in tests to diagnose lung problems: Adults and children—1 to 2 mL of a
        20% solution or 2 to 4 mL of a 10% solution used for inhalation or placed
        directly into the trachea two or three times before the test.'
    - type: list
      ordered: false
      items:
      - 'To thin or dissolve mucus in lung diseases: Adults and children— 3 to 5 milliliters
        (mL) of a 20% solution or 6 to 10 mL of a 10% solution used in a nebulizer
        three or four times a day. The medicine is inhaled through a face mask, mouthpiece,
        or tracheostomy. The 10 or 20% solution may be used for inhalation as a heavy
        mist in a tent or croupette. Sometimes the 10 or 20% solution is placed directly
        into the trachea or through a catheter into the trachea for certain conditions.'
      - 'For use in tests to diagnose lung problems: Adults and children—1 to 2 mL
        of a 20% solution or 2 to 4 mL of a 10% solution used for inhalation or placed
        directly into the trachea two or three times before the test.'
    - type: list
      ordered: false
      items:
      - Adults and children— 3 to 5 milliliters (mL) of a 20% solution or 6 to 10
        mL of a 10% solution used in a nebulizer three or four times a day. The medicine
        is inhaled through a face mask, mouthpiece, or tracheostomy. The 10 or 20%
        solution may be used for inhalation as a heavy mist in a tent or croupette.
        Sometimes the 10 or 20% solution is placed directly into the trachea or through
        a catheter into the trachea for certain conditions.
    - type: list
      ordered: false
      items:
      - 3 to 5 milliliters (mL) of a 20% solution or 6 to 10 mL of a 10% solution
        used in a nebulizer three or four times a day. The medicine is inhaled through
        a face mask, mouthpiece, or tracheostomy.
      - The 10 or 20% solution may be used for inhalation as a heavy mist in a tent
        or croupette.
      - Sometimes the 10 or 20% solution is placed directly into the trachea or through
        a catheter into the trachea for certain conditions.
    - type: list
      ordered: false
      items:
      - Adults and children—1 to 2 mL of a 20% solution or 2 to 4 mL of a 10% solution
        used for inhalation or placed directly into the trachea two or three times
        before the test.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Store unopened vials of this medicine in the refrigerator. Do not freeze.
        An open vial of medicine must be used right away.
    - type: paragraph
      text: The opened container should be discarded after 4 days.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your condition does not improve or if it becomes worse, check with your
      doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Wheezing, tightness in chest, or difficulty in breathing (especially in asthma
        patients)
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin rash or other irritation
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Clammy skin
      - fever
      - increase in amount of mucus in lungs
      - irritation or soreness of mouth, throat, or lungs
      - nausea or vomiting
      - runny nose
    - type: paragraph
      text: 'For patients using a face mask for inhalation of acetylcysteine: the
        mask may leave a stickiness on your face. This can be removed with water.'
    - type: paragraph
      text: When you use acetylcysteine, you may notice that the medicine has an unpleasant
        odor at first. However, this smell will go away soon after you use the medicine.
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
