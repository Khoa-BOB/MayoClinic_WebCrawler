    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and to decide if you should continue
      to take it. Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Check with your doctor right away if you have chest tightness, cough,
      difficulty swallowing, dizziness, fast heartbeat, hives, itching, skin rash,
      large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
      feet, or genitals, puffiness or swelling of the eyelids or around the eyes,
      face, lips, or tongue, trouble breathing, or unusual tiredness or weakness.
  - type: paragraph
    text: Apremilast may cause severe diarrhea, nausea, or vomiting which is more
      likely in patients 65 years of age or older, or in patients with low blood pressure
      (hypotension) or low blood volume (hypovolemia). Talk to your provider if you
      have concerns.
  - type: paragraph
    text: This medicine may cause some people to be agitated, irritable, or display
      other abnormal behaviors. Make sure your provider knows if you have trouble
      sleeping, get upset easily, have a big increase in energy, or start to act reckless.
      Also tell your provider if you have sudden or strong feelings, including feeling
      nervous, angry, restless, violent, or scared. It may also cause some people
      to have suicidal thoughts and tendencies or to become more depressed. If you
      or your caregiver notice any of these side effects, tell your doctor right away.
  - type: paragraph
    text: This medicine may decrease your child's weight and height. You may need
      to check your child's weight and height regularly during treatment with this
      medicine. Talk to your child's doctor about ways to prevent weight loss.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in behavior
      - discouragement
      - feeling sad or empty
      - irritability
      - lack of appetite
      - loss of interest or pleasure
      - thoughts of killing oneself
      - tiredness
      - trouble concentrating
      - trouble sleeping
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - chest tightness
      - dizziness
      - fast heartbeat
      - fever
      - hives, itching, or rash
      - hoarseness
      - irritation
      - joint pain, stiffness, or swelling
      - large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
        feet, or sex organs
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness of the skin
      - swelling of the hands or feet
      - trouble breathing or swallowing
      - unusual tiredness or weakness
      - weight loss
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - chills
      - diarrhea
      - ear congestion
      - headache
      - loss of voice
      - nausea
      - sneezing
      - sore throat
      - stuffy or runny nose
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - belching
      - burning, itching, pain in the hairy areas, pus at the root of the hair
      - decreased appetite
      - heartburn
      - indigestion
      - muscle aches
      - stomach discomfort, upset, or pain
      - upper abdominal or stomach pain
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
