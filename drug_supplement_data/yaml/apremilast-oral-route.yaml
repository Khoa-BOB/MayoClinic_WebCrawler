title: Apremilast (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Otezla
    - type: paragraph
      text: Otezla XR
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Apremilast is used to treat active psoriatic arthritis and oral ulcers caused
      by Behçet's disease. It is also used to treat plaque psoriasis in patients who
      may benefit from receiving phototherapy (ultraviolet light treatment) or other
      treatment.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Tablet, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of apremilast tablet in children younger than 6 years of age
        or weighing less than 20 kilograms (kg) to treat psoriatic arthritis and plaque
        psoriasis and in children to treat mouth ulcers caused by Behçet's disease
        . Safety and efficacy have not been established. This medicine may cause slowed
        growth in children.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of apremilast extended-release tablet in children younger than
        6 years of age or weighing less than 50 kilograms (kg) to treat psoriatic
        arthritis and plaque psoriasis and in children to treat mouth ulcers caused
        by Behçet's disease . Safety and efficacy have not been established. This
        medicine may cause slowed growth in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of apremilast in the elderly. However,
        elderly patients are more likely to have low blood pressure (hypotension)
        or low blood volume (hypovolemia) caused by severe diarrhea, nausea, or vomiting,
        which may require caution in patients receiving apremilast.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Apalutamide
      - Carbamazepine
      - Encorafenib
      - Enzalutamide
      - Fosphenytoin
      - Ivosidenib
      - Lumacaftor
      - Mitotane
      - Phenytoin
      - Rifampin
      - Rifapentine
      - St John's Wort
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Depression, or history of or
      - Mental illness, or history of—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Hypotension (low blood pressure) or
      - Hypovolemia (low blood volume)—Use with caution. May cause side effects to
        become worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: Take this medicine with or without food.
  - type: paragraph
    text: Swallow the tablet and extended-release tablet whole. Do not crush, split,
      or chew it.
  - type: paragraph
    text: You may switch between the tablet and extended-release tablet .
  - type: paragraph
    text: While taking the extended-release tablet , part of it may pass into your
      stool. This is normal and nothing to worry about.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets and extended-release tablets): For psoriatic
        arthritis and plaque psoriasis: Adults— Day 1: 10 milligrams (mg) in the morning.
        Day 2: 10 mg in the morning and 10 mg in the evening. Day 3: 10 mg in the
        morning and 20 mg in the evening. Day 4: 20 mg in the morning and 20 mg in
        the evening. Day 5: 20 mg in the morning and 30 mg in the evening. Day 6 and
        onwards: Otezla®: 30 mg in the morning and 30 mg in the evening. Otezla XR™:
        75 mg once a day. Children 6 years of age and older and weighing at least
        20 kilograms (kg)—Dose is based on body weight and must be determined by your
        doctor. Weighing 50 kg or more— Day 1: 10 mg in the morning. Day 2: 10 mg
        in the morning and 10 mg in the evening. Day 3: 10 mg in the morning and 20
        mg in the evening. Day 4: 20 mg in the morning and 20 mg in the evening. Day
        5: 20 mg in the morning and 30 mg in the evening. Day 6 and onwards: Otezla®:
        30 mg in the morning and 30 mg in the evening. Otezla XR™: 75 mg once a day.
        Weighing 20 kg to less than 50 kg— Day 1: 10 mg in the morning. Day 2: 10
