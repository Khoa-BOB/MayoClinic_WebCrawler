    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress while you are
      using this medicine , especially within the first 24 to 72 hours of treatment.
      This will allow your doctor to see if the medicine is working properly and to
      decide if you should continue to take it. Blood tests may be needed to check
      for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious skin reactions (eg, acute generalized exanthematous
      pustulosis, Stevens-Johnson syndrome, toxic epidermal necrolysis). Check with
      your doctor right away if you have blistering, peeling, or loosening of the
      skin, chills, cough, diarrhea, itching, joint or muscle pain, red irritated
      eyes, red skin lesions, often with a purple center, sore throat, sores, ulcers,
      or white spots in the mouth or on the lips, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you have chest tightness, cough, dizziness, fast heartbeat,
      hives, rash, itching,  puffiness or swelling of the eyelids, or around the eyes,
      face, lips, or tongue, trouble breathing or swallowing, or unusual tiredness
      or weakness while you are using this medicine.
  - type: paragraph
    text: This medicine may make you dizzy, drowsy, confused, or disoriented. Do not
      drive or do anything else that could be dangerous until you know how this medicine
      affects you .
  - type: paragraph
    text: Do not suddenly stop taking this medicine without first checking with your
      doctor . Your doctor may want you to gradually reduce the amount you are using
      before stopping completely. This may help prevent a possible worsening of your
      condition and reduce the possibility of withdrawal symptoms such as confusion
      as to time, place, or person, hallucinations, holding false beliefs that cannot
      be changed by fact, seizures, or unusual excitement, nervousness, or restlessness.
  - type: paragraph
    text: This medicine may be habit-forming. If you feel that the medicine is not
      working as well, do not use more than your prescribed dose. Call your doctor
      for instructions.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are taking this medicine. The results of some tests may be affected by this
      medicine.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that can make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for allergies or colds, sedatives, tranquilizers,
      or sleeping medicine, other prescription pain medicine or narcotics, medicine
      for seizures or barbiturates, muscle relaxants, or anesthetics, including some
      dental anesthetics. Also, there may be a greater risk of liver damage if you
      drink 3 or more alcoholic beverages while you are taking acetaminophen. Do not
      drink alcoholic beverages, and check with your doctor before taking any of these
      medicines while you are using this medicine .
  - type: paragraph
    text: 'If you think you or someone else may have taken an overdose of this medicine,
      get emergency help at once . Signs of an overdose include : black, tarry stools,
      bloody or cloudy urine, blurred vision, change in consciousness, chills, confusion,
      dark urine, difficult or painful urination, dizziness, faintness, or lightheadedness
      when getting up suddenly from a lying or sitting position, fever, headache,
      irregular, fast or slow, or shallow breathing, itching, light-colored stools,
      loss of appetite, loss of consciousness, nausea, pale or blue lips, fingernails,
      or skin, sleepiness, stomach pain, sudden decrease in amount of urine, sweating,
      trouble breathing, unpleasant breath odor, unusual tiredness or weakness, vomiting
      of blood, or yellow eyes or skin.'
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
