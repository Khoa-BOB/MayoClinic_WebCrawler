      - Clozapine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acenocoumarol
      - Fosphenytoin
      - Lixisenatide
      - Ospemifene
      - Phenytoin
      - Prednisone
      - St John's Wort
      - Warfarin
      - Zidovudine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Cabbage
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol or drug abuse or dependence, or history of—Use with caution. May increase
        risk for more serious side effects.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Porphyria (enzyme problem)—Should not be used in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. If too much of this medicine is taken for a long time, it may
      become habit-forming and cause mental or physical dependence. Also, large amounts
      of acetaminophen may cause liver damage if taken for a long time.
  - type: paragraph
    text: Carefully check the labels of all other medicines you are using , because
      they may also contain acetaminophen. It is not safe to use more than 4 grams
      (4,000 milligrams) of acetaminophen in one day (24 hours), as this may increase
      the risk for serious liver problems.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For tension headaches:: For oral dosage form (capsules): Adults and children
        12 years of age and older—1 or 2 capsules every 4 hours. However, the dose
        is usually not more than 6 capsules per day. Do not exceed 4 grams (4000 milligrams)
        of acetaminophen (Tylenol®) per day. Children younger than 12 years of age—Use
        and dose must be determined by your doctor. For oral dosage form (tablets):
        Adults and children 12 years of age and older—1 or 2 tablets every 4 hours
        as needed. However, the dose is usually not more than 6 tablets per day. Do
        not exceed 4 grams (4000 milligrams) of acetaminophen (Tylenol®) per day.
        Children younger than 12 years of age—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): Adults and children 12 years of age and
        older—1 or 2 capsules every 4 hours. However, the dose is usually not more
