- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Coal tar is used to treat eczema, psoriasis, seborrheic dermatitis, and
      other skin disorders.
  - type: paragraph
    text: Some of these preparations are available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Shampoo
    - Foam
    - Ointment
    - Liquid
    - Solution
    - Gel/Jelly
    - Lotion
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Coal tar products should not be used on infants, unless otherwise directed
        by your doctor. Studies on this medicine have been done only in adult patients,
        and there is no specific information comparing use of this medicine in children
        with use in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of this medicine in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed. Do not use more of it and do not use
      it more often than recommended on the label, unless otherwise directed by your
      doctor. To do so may increase the chance of side effects.
  - type: paragraph
    text: After applying coal tar, protect the treated area from direct sunlight and
      do not use a sunlamp for 72 hours, unless otherwise directed by your doctor,
      since a severe reaction may occur. Also, make sure you have removed all the
      coal tar medicine from your skin before you go back into direct sunlight or
      use a sunlamp.
  - type: paragraph
    text: Do not apply this medicine to infected, blistered, raw, or oozing areas
      of the skin.
  - type: paragraph
    text: Keep this medicine away from the eyes. If you should accidentally get some
      in your eyes, flush them thoroughly with water at once.
  - type: paragraph
    text: 'To use the cream or ointment form of this medicine:'
  - type: list
    ordered: false
    items:
    - Apply enough medicine to cover the affected area, and rub in gently.
  - type: paragraph
    text: 'To use the gel form of this medicine:'
  - type: list
    ordered: false
    items:
    - Apply enough gel to cover the affected area, and rub in gently. Allow the gel
      to remain on the affected area for 5 minutes, then remove excess gel by patting
      with a clean tissue.
  - type: paragraph
    text: 'To use the shampoo form of this medicine:'
  - type: list
    ordered: false
    items:
    - Wet the scalp and hair with lukewarm water. Apply a generous amount of shampoo
      and rub into the scalp, then rinse. Apply the shampoo again, working up a rich
      lather, and allow to remain on the scalp for 5 minutes. Then rinse thoroughly.
  - type: paragraph
    text: 'To use the nonshampoo liquid form of this medicine:'
  - type: list
    ordered: false
    items:
    - Some of these preparations are to be applied directly to dry or wet skin, some
      are to be added to lukewarm bath water, and some may be applied directly to
      dry or wet skin or added to lukewarm bath water. Make sure you know exactly
      how you should use this medicine. If you have any questions about this, check
      with your health care professional.
    - If this medicine is to be applied directly to the skin, apply enough to cover
      the affected area, and rub in gently.
    - Some of these preparations contain alcohol and are flammable. Do not use near
      heat, near open flame, or while smoking.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For eczema, psoriasis, seborrheic dermatitis, and other skin disorders: For
        cleansing bar dosage form: Adults—Use one or two times a day, or as directed
        by your doctor. Children—Use and dose must be determined by your doctor. For
        cream dosage form: Adults—Apply to the affected area(s) of the skin up to
        four times a day. Children—Use and dose must be determined by your doctor.
        For gel dosage form: Adults—Apply to the affected area(s) of the skin one
        or two times a day. Children—Use and dose must be determined by your doctor.
        For lotion dosage form: Adults—Apply directly to the affected area(s) of the
        skin or use as a bath, hand or foot soak, or as a hair rinse, depending on
        the product. Children—Use and dose must be determined by your doctor. For
        ointment dosage form: Adults—Apply to the affected area(s) of the skin two
        or three times a day. Children—Use and dose must be determined by your doctor.
        For shampoo dosage form: Adults—Use once a day to once a week or as directed
        by your doctor. Children—Use and dose must be determined by your doctor. For
        topical solution dosage form: Adults—Apply to wet the skin or scalp, or use
        as a bath, depending on the product. Children—Use and dose must be determined
        by your doctor. For topical suspension dosage form: Adults—Use as a bath.
        Children—Use and dose must be determined by your doctor.'
