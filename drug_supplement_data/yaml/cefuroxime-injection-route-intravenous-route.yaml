title: Cefuroxime (injection route, intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Zinacef
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cefuroxime is used in the treatment of infections caused by bacteria. It
      works by killing bacteria or preventing their growth.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested in children and, in effective doses, has
        not shown to cause different side effects or problems than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested in the elderly and has not been shown to
        cause different side effects or problems in older people than it does in younger
        adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Cholera Vaccine, Live
      - Desogestrel
      - Dienogest
      - Drospirenone
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Gestodene
      - Levonorgestrel
      - Mestranol
      - Nomegestrol
      - Norethindrone
      - Norgestimate
      - Norgestrel
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Colitis, history of or
      - Gastrointestinal disease, history of— cefuroxime may make these worse
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease or
      - Poor nutritional status—these may be worsened by cefuroxime and you may need
        to have vitamin K
    - type: list
      ordered: false
      items:
      - Kidney problems, temporary or permanent— these may effect how much cefuroxime
        is in your body, reducing your dose might be needed.
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - For injection dosage form Adults and teenagers—750 mg to 3 grams every six
        to eight hours usually for 5 to 14 days, injected into a muscle or vein. Gonorrhea
        is treated with a single dose of 1.5 grams, injected into a muscle; the total
        1.5-gram dose is divided into two doses and injected into muscles at two separate
        places on the body, and given along with a single, oral 1-gram dose of probenecid.
        Infants and children 1 month of age and older—12.5 to 150 mg per kg (5.68
        to 68 mg per pound) of body weight every six to eight hours, injected into
        a muscle or vein. Newborns—30 to 100 mg per kg (13.6 to 45.5 mg per pound)
        of body weight every eight to twelve hours, injected into a vein.
    - type: list
      ordered: false
      items:
      - Adults and teenagers—750 mg to 3 grams every six to eight hours usually for
        5 to 14 days, injected into a muscle or vein. Gonorrhea is treated with a
        single dose of 1.5 grams, injected into a muscle; the total 1.5-gram dose
        is divided into two doses and injected into muscles at two separate places
        on the body, and given along with a single, oral 1-gram dose of probenecid.
        Infants and children 1 month of age and older—12.5 to 150 mg per kg (5.68
        to 68 mg per pound) of body weight every six to eight hours, injected into
        a muscle or vein. Newborns—30 to 100 mg per kg (13.6 to 45.5 mg per pound)
        of body weight every eight to twelve hours, injected into a vein.
    - type: list
      ordered: false
      items:
      - Adults and teenagers—750 mg to 3 grams every six to eight hours usually for
        5 to 14 days, injected into a muscle or vein. Gonorrhea is treated with a
        single dose of 1.5 grams, injected into a muscle; the total 1.5-gram dose
        is divided into two doses and injected into muscles at two separate places
        on the body, and given along with a single, oral 1-gram dose of probenecid.
      - Infants and children 1 month of age and older—12.5 to 150 mg per kg (5.68
        to 68 mg per pound) of body weight every six to eight hours, injected into
        a muscle or vein.
      - Newborns—30 to 100 mg per kg (13.6 to 45.5 mg per pound) of body weight every
        eight to twelve hours, injected into a vein.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Consult your health care professional about how to store this medicine.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve within a few days or if they become worse,
      check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chest pain
      - chills
      - cough
      - fever
      - painful or difficult urination
      - shortness of breath
      - sore throat
      - sores, ulcers, or white spots on lips or in mouth
      - swollen glands
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps
      - abdominal or stomach tenderness or pain
      - bloating
      - bluish color or changes in skin color
      - diarrhea, watery and severe, which may also be bloody
      - difficulty in breathing or swallowing, wheezing, shortness of breath
      - fast heartbeat
      - fever
      - hives or welts
      - increased thirst
      - muscle spasm or jerking of all extremities
      - nausea or vomiting
      - pain
      - skin itching, rash, or redness
      - sudden loss of consciousness
      - swelling of face, throat, or tongue
      - swelling of foot or leg
      - tenderness
      - unusual weight loss
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, loosening of skin
      - bloody or cloudy urine
      - dizziness
      - fast heartbeat
      - greatly decreased frequency of urination or amount of urine
      - hearing loss, mild to moderate
      - joint or muscle pain
      - puffiness or swelling of the eyelids or around the eyes, face, lips or tongue
      - red or irritated eyes
      - redness, tenderness, itching, burning, or peeling of skin
      - red skin lesions, often with a purple center
      - sore throat
      - tightness in chest
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Gas
      - loss of appetite
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
