title: Fruquintinib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Fruzaqla
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fruquintinib is used to treat colorectal cancer (cancer of the colon or
      rectum) that has spread throughout the body in patients who have received other
      cancer treatments (eg, fluoropyrimidine, oxaliplatin, and irinotecan) that did
      not work well.
  - type: paragraph
    text: Fruquintinib belongs to the group of medicines, called antineoplastics.
      It interferes with the growth of cancer cells, which are eventually destroyed.
      Since the growth of normal cells may also be affected by the medicine, other
      unwanted effects will also occur. Some of these may be serious and must be reported
      to your doctor.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of fruquintinib in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of fruquintinib in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Apalutamide
      - Bosentan
      - Carbamazepine
      - Cenobamate
      - Cholera Vaccine
      - Dabrafenib
      - Dipyrone
      - Ebola Zaire Vaccine, Live
      - Efavirenz
      - Elagolix
      - Enzalutamide
      - Etravirine
      - Fosphenytoin
      - Influenza Virus Vaccine, Live
      - Ivosidenib
      - Lorlatinib
      - Lumacaftor
      - Mitotane
      - Modafinil
      - Nafcillin
      - Phenobarbital
      - Phenytoin
      - Primidone
      - Rifabutin
      - Rifampin
      - Rifapentine
      - Rotavirus Vaccine, Live
      - St John's Wort
      - Telotristat Ethyl
      - Thioridazine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to aspirin—Use with caution. This medicine contains a yellow dye called
        tartrazine, which may cause allergic reactions (including bronchial asthma)
        in patients with this condition.
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Blood clots, recent or
      - Heart attack, recent or
      - Hypertension (high blood pressure) or
      - Infection or
      - Kidney disease or
      - Stroke, recent—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease, moderate—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use is not recommended in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before using this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the capsule whole. Take the medicine at the same time each day.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsule): For treatment of colorectal cancer: Adults—5
        milligrams (mg) once a day for the first 21 days of each 28-day cycle. Your
        doctor may adjust your dose as needed and tolerated. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of colorectal cancer: Adults—5 milligrams (mg) once a day for
        the first 21 days of each 28-day cycle. Your doctor may adjust your dose as
        needed and tolerated. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—5 milligrams (mg) once a day for the first 21 days of each 28-day cycle.
        Your doctor may adjust your dose as needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is within 12 hours , take it as soon as possible.
        If you miss a dose and it is more than 12 hours , skip the missed dose and
        take your next dose at the regular time.
    - type: paragraph
      text: If you vomit after taking your medicine, do not take an extra dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may harm your unborn baby if either partner is using it during
      conception or pregnancy. If you are a woman who can get pregnant, your doctor
      may do tests to make sure you are not pregnant before starting this medicine.
      Use an effective form of birth control to keep from getting pregnant during
      treatment with this medicine and for at least 2 weeks after your last dose.
      Male patients who have female partners should use effective birth control during
      treatment with this medicine and for at least 2 weeks after the last dose. If
      you think you have become pregnant while using this medicine, tell your doctor
      right away.
  - type: paragraph
    text: This medicine may cause hypertension (high blood pressure). Check with your
      doctor right away if you have blurred vision, dizziness, headache, nervousness,
      pounding in the ears, or slow or fast heartbeat. Your doctor will check your
      blood pressure on a regular basis while you are using this medicine. You might
      need to monitor your blood pressure at home.
  - type: paragraph
    text: Check with your doctor right away if you have bleeding gums, coughing up
      blood, difficulty in breathing or swallowing, dizziness, headache, increased
      menstrual flow or vaginal bleeding, nosebleeds, paralysis, prolonged bleeding
      from cuts, red or dark brown urine, red or black, tarry stools, or trouble breathing.
      These may be symptoms of serious bleeding problems.
  - type: paragraph
    text: This medicine may increased risk of serious infections. Check with your
      doctor right away if you have bladder pain, bloody or cloudy urine, body aches
      or pain, chest pain or tightness, chills, cough, difficult, burning, or painful
      urination, ear congestion, fever, frequent urge to urinate, headache, loss of
      voice, lower back or side pain, sneezing, sore throat, stuffy or runny nose,
      trouble breathing, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine can cause stomach or bowel perforation (tear or hole). Check
      with your doctor right away if you have severe stomach pain, constipation, fever,
      nausea, or vomiting.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may cause proteinuria (protein in the urine). Check with your
      doctor right away if you have cloudy urine or swelling of the face, hands, arms,
      legs, or feet.
  - type: paragraph
    text: This medicine may cause a serious skin problem called hand-foot syndrome
      or palmar-plantar erythrodysesthesia syndrome. Tell your doctor right away if
      you have a rash that does not go away or redness, pain, swelling, bleeding,
      or blisters on the palms of your hands or soles of your feet.
  - type: paragraph
    text: This medicine may increase your chance of having a brain condition, called
      posterior reversible encephalopathy syndrome (PRES). Check with your doctor
      right away if you start having chest pain, sudden and severe headaches, fainting
      spells, seizures, unusual drowsiness, confusion, or problems with vision, speech,
      or walking while you are taking this medicine.
  - type: paragraph
    text: This medicine may affect the way your body heals from cuts and wounds. Make
      sure any doctor who treats you knows that you are using this medicine. You may
      need to stop using this medicine for at least 2 weeks before and after major
      surgery, or until adequate wound healing before taking this medicine again.
  - type: paragraph
    text: This medicine may increase your risk of developing blood clots. Check with
      your doctor right away if you have swelling and pain in your arms, legs, or
      stomach, chest pain, difficulty with breathing, loss of sensation, confusion,
      or problems with muscle control or speech.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - blurred vision
      - cloudy urine
      - constipation
      - coughing up blood
      - depressed mood
      - dizziness
      - dry skin and hair
      - feeling cold
      - hair loss
      - headache
      - hoarseness or husky voice
      - increased menstrual flow or vaginal bleeding
      - muscle cramps and stiffness
      - nervousness
      - nosebleeds
      - paralysis
      - pounding in the ears
      - prolonged bleeding from cuts
      - red or black, tarry stools
      - red or dark brown urine
      - redness, swelling, or pain of the skin
      - scaling of the skin on the hands and feet
      - slow or fast heartbeat
      - tingling of the hands and feet
      - trouble breathing
      - ulceration of the skin
      - unusual tiredness or weakness
      - weight gain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - body aches or pain
      - chest pain or tightness
      - cough
      - difficult, burning, or painful urination
      - ear congestion
      - fever or chills
      - frequent urge to urinate
      - heartburn
      - indigestion
      - lower back or side pain
      - loss of voice
      - severe stomach pain, cramping, or burning
      - sneezing
      - sore throat
      - stuffy or runny nose
      - vomiting of blood or material that looks like coffee grounds
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - back pain
      - coma
      - confusion
      - drowsiness
      - hallucinations
      - irritability
      - mood or mental changes
      - seizures
      - stiff neck
      - sudden weakness in the arms or legs
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dark urine
      - loss of appetite
      - nausea or vomiting
      - pains in the chest, groin, or legs, especially calves of the legs
      - sudden loss of coordination
      - sudden onset of slurred speech
      - sudden vision changes
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - difficulty in moving
      - joint pain
      - muscle or bone pain
      - swelling or inflammation of the mouth
      - throat pain
      - weight loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain in the rectum
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
