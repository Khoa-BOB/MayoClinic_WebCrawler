title: Ceftazidime and avibactam (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Avycaz
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ceftazidime and avibactam combination injection is used alone or together
      with other medicines (eg, metronidazole) to treat complicated infections in
      many different parts of the body (eg, stomach, kidneys). It is also used to
      treat hospital-acquired bacterial pneumonia and ventilator-associated bacterial
      pneumonia (HABP/VABP).
  - type: paragraph
    text: Ceftazidime and avibactam combination injection belongs to the class of
      medicines known as cephalosporin antibiotics. It works by killing bacteria or
      preventing their growth. However, this medicine will not work for colds, flu,
      or other virus infections.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of ceftazidime and avibactam combination injection in children
        younger than 31 weeks gestational age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of ceftazidime and avibactam combination
        injection in the elderly. However, elderly patients are more likely to have
        age-related kidney problems, which may require caution and an adjustment in
        the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Cholera Vaccine, Live
      - Desogestrel
      - Dienogest
      - Drospirenone
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Furosemide
      - Gestodene
      - Levonorgestrel
      - Mestranol
      - Nomegestrol
      - Norethindrone
      - Norgestimate
      - Norgestrel
      - Probenecid
      - Warfarin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Chloramphenicol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to penicillin, history of—May increase risk of an allergic reaction
        to occur again.
    - type: list
      ordered: false
      items:
      - Brain disease (eg, encephalopathy) or
      - Diarrhea, severe, history of or
      - Myoclonus (muscle twitching or jerking) or
      - Seizures—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. It is given through an IV catheter that is placed into one of
      your veins. This medicine must be given slowly, so the IV will have to stay
      in place for at least 2 hours.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your or your child's progress closely while receiving
      this medicine . This will allow your doctor to see if it is working properly
      and to decide if you should continue to receive it and to check for unwanted
      effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you or your child have a rash, itching, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while receiving
      this medicine.
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Check with your doctor
      right away if you or your child have blistering, peeling, or loosening of the
      skin, red skin lesions, severe acne or skin rash, sores or ulcers on the skin,
      or fever or chills while receiving this medicine.
  - type: paragraph
    text: This medicine may cause diarrhea, and in some cases it can be severe. It
      may occur 2 months or more after you or your child stop receiving this medicine.
      Do not take any medicine to treat diarrhea without first checking with your
      doctor. If you have any questions or if mild diarrhea continues or gets worse,
      check with your doctor.
  - type: paragraph
    text: Check with your doctor right away if you have confusion, loss of consciousness,
      jerking or twitching of the muscles, seizures, seeing, hearing, or feeling things
      that are not there, or severe sleepiness while receiving this medicine.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are receiving this medicine. The results of some tests may be affected by
      this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - bluish color
      - changes in skin color
      - chest pain
      - chills
      - confusion
      - cough
      - decreased awareness or responsiveness
      - decreased urine
      - dizziness
      - dry mouth
      - fever
      - hostility
      - increased thirst
      - irregular heartbeat
      - irritability
      - loss of appetite
      - loss of consciousness
      - mood changes
      - muscle pain, cramps, or twitching
      - nausea
      - numbness or tingling in the hands, feet, or lips
      - painful or difficult urination
      - pinpoint red spots on the skin
      - rapid weight gain
      - seizures
      - severe sleepiness
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swelling of the face, ankles, hands, foot, or leg
      - swollen glands
      - tenderness
      - unusual bleeding or bruising
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
      - vomiting
      - white patches in the mouth or throat or on the tongue
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back, leg, or stomach pains
      - blistering, peeling, or loosening of the skin
      - bloody or cloudy urine
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chest tightness
      - cough
      - dark urine
      - difficulty breathing
      - difficulty swallowing
      - fast heartbeat
      - general body swelling
      - general feeling of tiredness or weakness
      - hives, itching, skin rash
      - hoarseness
      - joint pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - lower back or side pain
      - nosebleeds
      - painful or difficult urination
      - pale skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red, irritated eyes red skin lesions, often with a purple center
      - unusual weight gain
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty having a bowel movement
      - stomach pain
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - change in taste
      - loss of taste
      - redness of the skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Collection of blood under the skin, deep, dark purple bruise, or itching,
        pain, or swelling of the skin at the injection site
      - dry, red, hot, or irritated skin
      - itching of the vagina or genital area
      - pain during sexual intercourse
      - tenderness, pain, swelling, warmth, skin discoloration, and prominent superficial
        veins at the injection site
      - thick, white vaginal discharge with no odor or with a mild odor
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
