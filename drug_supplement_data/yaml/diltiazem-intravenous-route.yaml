title: Diltiazem (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cardizem
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Diltiazem is used to control rapid heartbeats or abnormal heart rhythms.
      It belongs to a group of drugs called calcium channel blocking agents. Diltiazem
      affects the movement of calcium into the cells of the heart and blood vessels.
      As a result, the heart beats slower and the blood vessels relax, thus, increasing
      the supply of blood and oxygen to the heart while reducing its workload.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of diltiazem in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of diltiazem in geriatric patients. However, elderly patients are more likely
        to have age-related kidney or liver problems, which may require an adjustment
        in the dose for patients receiving diltiazem.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Cisapride
      - Colchicine
      - Flibanserin
      - Lomitapide
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Acalabrutinib
      - Acebutolol
      - Alfentanil
      - Alprazolam
      - Amiodarone
      - Amlodipine
      - Apalutamide
      - Apixaban
      - Aprepitant
      - Armodafinil
      - Atazanavir
      - Atenolol
      - Atorvastatin
      - Avacopan
      - Avapritinib
      - Bedaquiline
      - Belzutifan
      - Benzhydrocodone
      - Betaxolol
      - Bisoprolol
      - Bosutinib
      - Brexpiprazole
      - Brigatinib
      - Budesonide
      - Buprenorphine
      - Buspirone
      - Capivasertib
      - Carbamazepine
      - Cariprazine
      - Carteolol
      - Carvedilol
      - Celiprolol
      - Cenobamate
      - Ceritinib
      - Cilostazol
      - Cimetidine
      - Clarithromycin
      - Clomipramine
      - Clonidine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Alfuzosin
      - Dalfopristin
      - Digitoxin
      - Dutasteride
      - Efavirenz
      - Fosphenytoin
      - Guggul
      - Indinavir
      - Lithium
      - Methylprednisolone
      - Moricizine
      - Phenytoin
      - Quinupristin
      - Rifapentine
      - Sirolimus
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Atrial fibrillation (type of abnormal heart rhythm) or
      - Cardiogenic shock (shock caused by heart attack) or
      - Heart block (type of abnormal heart rhythm, can use if have a pacemaker) or
      - Severe hypotension (blood pressure too low) or
      - Short PR syndrome (type of abnormal heart rhythm) or
      - Sick sinus syndrome (type of abnormal heart rhythm, can use if have a pacemaker)
        or
      - Ventricular tachycardia (type of abnormal heart rhythm) or
      - Wolff-Parkinson-White syndrome (type of abnormal heart rhythm)—Should not
        use in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease or—Use with caution. The effects of this medicine may be increased
        because of slower removal from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given through a needle placed into one of your veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will only give you a few doses of this medicine until your condition
      improves, and then you will be switched to an oral medicine that works the same
      way. If you have any concerns about this, talk to your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - dizziness, faintness, or lightheadedness when getting up from a lying or sitting
        position suddenly
      - sweating
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fast, slow, or irregular heartbeat
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - chest pain
      - decreased urine output
      - difficult or labored breathing
      - dilated neck veins
      - dry mouth
      - extreme fatigue
      - hyperventilation
      - irregular breathing
      - irritability
      - joint pain, stiffness, or swelling
      - lower back, side, or stomach pain
      - nervousness
      - no heartbeat
      - palpitations
      - restlessness
      - shaking
      - shortness of breath
      - swelling of feet or lower legs
      - tightness in chest
      - trouble sleeping
      - troubled breathing
      - weight gain
      - wheezing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of skin, feeling of
        pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - feeling of warmth or heat
      - flushing or redness of the skin, especially on the face and neck
      - headache
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in vision
      - constipation
      - impaired vision
      - itching skin
      - lack or loss of strength
      - nausea
      - vomiting
