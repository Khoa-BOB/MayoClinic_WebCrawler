    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose of this medicine and it is less than 12 hours since
        your regular time, take it as soon as you can and take your next dose at the
        normal time. If you miss a dose and it is more than 12 hours since your regular
        time, skip the missed dose and take your next dose at the normal time.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure that this medicine is working properly. Blood
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not use rilpivirine if you are also taking dexamethasone (Decadron®),
      St. John's wort, medicine to treat tuberculosis (eg, rifampin, rifapentine,
      Priftin®, Rifadin®, or Rimactane®), seizure medicine (eg, carbamazepine, oxcarbazepine,
      phenobarbital, phenytoin, Dilantin®, Tegretol®, or Trileptal®), or certain stomach
      medicines (eg, esomeprazole, lansoprazole, omeprazole, pantoprazole, rabeprazole,
      Aciphex®, Nexium®, Prevacid®, Prilosec®, or Protonix®).
  - type: paragraph
    text: Serious skin reactions (eg, drug reaction with eosinophilia and systemic
      symptoms (DRESS)) can occur with this medicine. Check with your doctor right
      away if you have black, tarry stools, chest pain, chills, cough, fever, painful
      or difficult urination, sore throat, sores, ulcers, or white spots on the lips
      or in the mouth, swollen glands, trouble breathing, unusual bleeding or bruising,
      or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you have a rash, itching, hoarseness, lightheadedness
      or dizziness, trouble breathing, trouble swallowing, or any swelling of your
      hands, face, or mouth with this medicine.
  - type: paragraph
    text: Tell your doctor right away if you start to feel depressed and have thoughts
      about hurting yourself. Report any unusual thoughts or behaviors that trouble
      you, especially if they are new or get worse quickly.
  - type: paragraph
    text: This medicine may cause serious liver problems. This may occur in patients
      with a history of hepatitis B or C infection. Check with your doctor right away
      if you have clay-colored stools, dark urine, a decreased appetite, fever, headache,
      itching, nausea and vomiting, skin rash, stomach pain or tenderness, swelling
      of the feet or lower legs, unusual tiredness or weakness, or yellow eyes or
      skin.
  - type: paragraph
    text: Your immune system may get stronger when you start taking HIV medicines.
      Tell your doctor right away if you notice any changes in your health. Sometimes
      the immune system will start to fight infections that were hidden in your body,
      such as pneumonia, herpes, or tuberculosis. Autoimmune disorders (eg, Graves
      disease, polymyositis, and Guillain-Barré syndrome) may also occur.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are taking this medicine. The results of some tests may be affected by this
      medicine.
  - type: paragraph
    text: It is important to practice safe sex. Wear or have your partner wear a condom.
      Also, do not share needles or equipment with anyone or use dirty needles. If
      you have any questions about this, check with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in behavior
      - cloudy or bloody urine
      - discouragement
      - feeling sad or empty
      - gaseous stomach pain
      - indigestion
      - irritability
      - lack of appetite
      - loss of interest or pleasure
      - recurrent fever
      - severe nausea or vomiting
      - stomach fullness
      - swelling of the face, feet, or lower legs
      - thoughts of killing oneself
      - tiredness
      - trouble concentrating
      - trouble sleeping
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
