      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Boceprevir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Depression, history of or
      - Liver disease (eg, hepatitis B or C infection)—Use with caution. May make
        these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. If you stop taking this medicine, or do not take it as
      prescribed, you may spread HIV to others.
  - type: paragraph
    text: Rilpivirine contains a fixed amount of each medicine in the tablet and the
      tablet for suspension (oral liquid) . Do not substitute these dosage forms for
      each other. Always check your medicine each time your prescription is filled
      to make sure you receive the correct dosage form.
  - type: paragraph
    text: This medicine comes with a patient information leaflet and patient instructions.
      Read and follow the instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: 'To use the oral liquid :'
  - type: list
    ordered: false
    items:
    - Gently peel back the foil to remove the tablet. Do not push the tablets out
      of the foil.
    - Place the tablets in a small cup. Do not crush it.
    - Add 5 milliliters (mL) of room temperature drinking water. Swirl the cup gently
      for 1 to 2 minutes to dissolve the tablet. The mixture will become cloudy.
    - Swallow the liquid right away or add another 5 mL of drinking water, milk, orange
      juice, or applesauce to help take the medicine. Swirl the mixture and take all
      the medicine right away.
    - You may add another 5 mL drinking water, milk, orange juice, or applesauce to
      the cup to make sure your child gets the full dose.
    - Do not swallow whole, crush, or chew the tablet for suspension.
  - type: paragraph
    text: Keep taking rilpivirine for the full time of treatment , even if you begin
      to feel better. Do not stop taking it without checking first with your doctor.
      When your supply of the medicine is running low, contact your doctor or pharmacist
      ahead of time. Do not allow yourself to run out of the medicine.
  - type: paragraph
    text: It is important to take rilpivirine together with other medicines. Take
      all other medicines your doctor has prescribed at the right time of day. This
      will make your medicines work better.
  - type: paragraph
    text: Take this medicine with food.
  - type: paragraph
    text: If you are taking a stomach medicine for heartburn or ulcers (eg, cimetidine,
      famotidine, nizatidine, Axid®, Pepcid®, or Tagamet®), take it at least 12 hours
      before or 4 hours after rilpivirine.
  - type: paragraph
    text: If you are taking antacids that contain aluminum, magnesium, or calcium,
      take the antacid at least 2 hours before or 4 hours after rilpivirine.
  - type: paragraph
    text: If you are taking didanosine (Videx®), take it on an empty stomach and at
      least 2 hours before or 4 hours after rilpivirine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of HIV infection: For patients
        who have not received any HIV treatment in the past: Adults and children 12
        years of age and older and weighing 25 kilograms (kg) or more—25 milligrams
        (mg) once a day. Children younger than 12 years of age or weighing less than
        25 kg—Use of oral liquid is recommended. For short-term treatment of HIV infection:
        To assess the tolerability of rilpivirine before receiving Cabenuva: Adults
        and children 12 years of age and older and weighing 35 kilograms (kg) or more—25
        milligrams (mg) in combination with 30 mg of cabotegravir once a day for at
        least 28 days. Your last dose should be taken on the same day Cabenuva injections
        are started. Children younger than 12 years of age or weighing less than 35
        kg—Use and dose must be determined by your doctor. For patients who will miss
        a monthly planned injection of Cabenuva: Adults and children 12 years of age
        and older and weighing 35 kilograms (kg) or more—If you miss or plan to miss
        a scheduled monthly injection of Cabenuva injection by more than 7 days, take
        25 milligrams (mg) in combination with 30 mg of cabotegravir once a day. Your
        first dose should be taken at least 1 month after the last Cabenuva injection
        and continued until the day injection dosing is restarted. Children younger
        than 12 years of age or weighing less than 35 kg—Use and dose must be determined
        by your doctor. For patients who will miss an every-2-month planned injection
        of Cabenuva: Adults and children 12 years of age and older and weighing 35
        kilograms (kg) or more—If you miss or plan to miss a scheduled every-2-month
        injection of Cabenuva injection by more than 7 days, take 25 milligrams (mg)
        in combination with 30 mg of cabotegravir once a day. Your first dose should
        be taken at least 2 months after the last Cabenuva injection and continued
        until the day injection dosing is restarted. Children younger than 12 years
        of age or weighing less than 35 kg—Use and dose must be determined by your
        doctor.'
      - 'For oral dosage form (tablets for suspension): For treatment of HIV infection:
        For patients who have not received any HIV treatment in the past: Children
        2 years of age and older weighing at least 14 kilograms (kg) to less than
        25 kg—Dose is base on body weight and must be determined by your doctor. Weighing
        20 kg to less than 25 kg—15 milligrams (mg) or 6 tablets once a day. Weighing
        14 kg to less than 20 kg—12.5 mg or 5 tablets once a day. Children younger
        than 2 years of age or weighing less than 14 kg—Use is not recommended.'
