title: Rilpivirine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Edurant
    - type: paragraph
      text: Edurant PED
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Rilpivirine is used to treat human immunodeficiency virus (HIV) infection.
      HIV is the virus that causes acquired immune deficiency syndrome (AIDS). This
      medicine is usually given to patients who have not received any HIV treatment
      in the past. Rilpivirine is a non-nucleoside reverse transcriptase inhibitor.
  - type: paragraph
    text: Rilpivirine is also used together with cabotegravir for short-term treatment
      of HIV infection in patients when their healthcare provider determines that
      they meet certain requirements. It is used to assess how well you tolerate rilpivirine
      before receiving cabotegravir/rilpivirine combination injection (Cabenuva) or
      in patients who will miss a planned injection of Cabenuva.
  - type: paragraph
    text: This medicine will not cure HIV infection or AIDS. It works by lowering
      the amount of HIV in the blood and helps the immune system. This may help delay
      problems that result from AIDS or HIV disease. People who receive this medicine
      may continue to have some of the problems usually related to AIDS or HIV disease.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet for Suspension
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of rilpivirine tablets in children younger than 2 years of
        age or weighing less than 14 kilograms (kg). Safety and efficacy have not
        been established. Use of rilpivirine oral liquid is not recommended in children
        younger than 2 years of age or weighing less than 14 kg.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of rilpivirine in the elderly. However,
        elderly patients are more likely to have age-related kidney or liver problems,
        which may require caution for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Carbamazepine
      - Cisapride
