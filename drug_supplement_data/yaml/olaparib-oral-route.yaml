      - Haloperidol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Bitter Orange
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bone marrow problems (eg, myelodysplastic syndrome, acute myeloid leukemia),
        history of or
      - Liver disease or
      - Lung or breathing problems (eg, pneumonitis)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate—Use with caution. The effects may be increased because
        of the slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before using this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the tablets whole. Do not crush, break, chew, open, or dissolve
      them.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: If you have hormone receptor positive early breast cancer , you should continue
      taking hormone medicines during treatment with this medicine.
  - type: paragraph
    text: If you have prostate cancer , your doctor may also give you other medicines
      (eg, gonadotropin-releasing hormone medicine) during treatment or you should
      have had surgical removal of the testes before using this medicine.
  - type: paragraph
    text: Do not eat grapefruit or Seville oranges, or drink grapefruit or Seville
      orange juice while you are using this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For ovarian cancer, fallopian tube cancer,
        pancreas cancer, primary peritoneal cancer, prostate cancer, or metastatic
        breast cancer: Adults—300 milligrams (mg) (two 150 mg tablets) 2 times a day.
        Each dose should be taken 12 hours apart. Your doctor may adjust your dose
        as needed or tolerated. However, dose is usually not more than 600 mg (four
        150 mg tablets) per day. Children—Use and dose must be determined by your
        doctor. For early breast cancer: Adults—300 milligrams (mg) (two 150 mg tablets)
        2 times a day for up to 1 year. Each dose should be taken 12 hours apart.
        Your doctor may adjust your dose as needed or tolerated. However, dose is
        usually not more than 600 mg (four 150 mg tablets) per day. Children—Use and
        dose must be determined by your doctor. For maintenance treatment of advanced
        ovarian cancer: Adults—300 milligrams (mg) (two 150 mg tablets) 2 times a
        day for up to 2 years. Each dose should be taken 12 hours apart. Your doctor
        may adjust your dose as needed or tolerated. However, dose is usually not
        more than 600 mg (four 150 mg tablets) per day. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For ovarian cancer, fallopian tube cancer, pancreas cancer, primary peritoneal
        cancer, prostate cancer, or metastatic breast cancer: Adults—300 milligrams
        (mg) (two 150 mg tablets) 2 times a day. Each dose should be taken 12 hours
        apart. Your doctor may adjust your dose as needed or tolerated. However, dose
