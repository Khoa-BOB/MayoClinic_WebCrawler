    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the tablets in their original container.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to decide if you should continue to take it. Blood tests may be needed to check
      for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. This
      medicine may also cause birth defects if the father is using it when his sexual
      partner becomes pregnant. Female patients should use an effective form of birth
      control to keep from getting pregnant during treatment with this medicine and
      for at least 6 months after the last dose. Male patients who have female partners
      should use effective birth control during treatment with this medicine and for
      at least 3 months after the last dose. If you think you have become pregnant
      while using this medicine, tell your doctor right away.
  - type: paragraph
    text: Do not donate sperm while you are using the this medicine and for 3 months
      after your last dose.
  - type: paragraph
    text: This medicine may cause bone marrow problems, including myelodysplastic
      syndrome or acute myeloid leukemia. Check with your doctor right away if you
      have a fever, blood in the urine or stool, chills, unusual bleeding, bruising,
      tiredness, or weakness, or weight loss.
  - type: paragraph
    text: Tell your doctor right away if you have a chest pain, cough, or any type
      of breathing problem with this medicine. These could be symptoms of a serious
      lung problem (eg, pneumonitis).
  - type: paragraph
    text: This medicine may increase your risk for having blood clots (eg, venous
      thrombosis, pulmonary embolism). Call your doctor right away if you have chest
      pain, fast, pounding, or irregular heartbeat or pulse, pain or swelling in the
      arms or legs, or rapid shallow or trouble breathing.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem (eg, drug-induced liver injury).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bladder pain
      - bleeding gums
      - bloody or cloudy urine
      - body aches or pain
      - chest pain or tightness
      - chills
      - cough
      - cough producing mucus
      - diarrhea
      - difficult, burning, or painful urination
      - ear congestion or pain
      - fast, pounding, or irregular heartbeat or pulse
      - fever
      - frequent urge to urinate
      - general feeling of discomfort or illness
      - head congestion
      - headache
      - hoarseness or other voice changes
      - joint pain
      - loss of appetite
      - loss of voice
      - lower back or side pain
      - muscle aches and pains
      - nausea
      - pain or swelling in the arms or legs
      - painful or difficult urination
      - pale skin
      - pinpoint red spots on the skin
      - rapid shallow breathing
      - runny or stuffy nose
      - shivering
      - sneezing
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - sweating
      - swollen glands
      - trouble sleeping
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Clay colored stools
      - dark urine
      - decreased appetite
      - hives, itching, skin rash
      - irritation
      - joint stiffness or swelling
      - redness of the skin
      - stomach pain or tenderness
      - swelling of the eyelids, face, lips, hands, feet, or lower legs
      - trouble swallowing
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - belching
      - blistering, crusting, irritation, itching, or reddening of the skin
      - blurred vision
      - burning, numbness, tingling, or painful sensations
      - constipation
      - cracked, dry, or scaly skin
      - decreased appetite
      - diarrhea
      - difficulty with moving
      - dizziness
      - dry mouth
      - fear or nervousness
      - flushed, dry skin
      - fruit-like breath odor
      - heartburn
      - increased hunger
      - increased thirst
      - increased urination
      - indigestion
      - lack or loss of strength
      - loss of bladder control
      - loss of or change in taste
      - muscle stiffness
      - stomach discomfort or upset
      - swelling or inflammation of the mouth
      - unexplained weight loss
      - unsteadiness or awkwardness
      - weakness in the arms, hands, legs, or feet
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
