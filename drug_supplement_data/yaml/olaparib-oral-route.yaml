title: Olaparib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Lynparza
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Olaparib is used as maintenance treatment in patients with advanced ovarian
      cancer, fallopian tube cancer, or primary peritoneal cancer with a certain type
      of inherited (germline) or acquired (somatic) abnormal BRCA gene. Your doctor
      will test for the presence of this gene. It is used in patients who have received
      complete or partial treatment with platinum-based cancer medicines.
  - type: paragraph
    text: Olaparib is used together with bevacizumab as maintenance treatment in patients
      with advanced ovarian cancer, fallopian tube cancer, or primary peritoneal cancer
      with a certain type of abnormal BRCA gene or a positive tumor test for genomic
      instability called HRD. Your doctor will test for the presence of this gene.
      It is used in patients who have received complete or partial treatment with
      platinum-based cancer medicines.
  - type: paragraph
    text: Olaparib is also used to treat ovarian cancer, fallopian tube cancer, or
      primary peritoneal cancer with a certain type of inherited (germline) or acquired
      (somatic) abnormal BRCA gene that has come back. Your doctor will test for the
      presence of this gene. It is used in patients who have received complete or
      partial treatment with platinum-based cancer medicines.
  - type: paragraph
    text: Olaparib is also used to treat HER2-negative early breast cancer in patients
      who have been treated with other cancer medicines. It is used if the cancer
      cells have the germline BRCA mutations. Your doctor will use a special test
      to look for these mutations. It is given to patients after surgery to remove
      the tumor.
  - type: paragraph
    text: Olaparib is also used to treat HER2-negative metastatic (cancer that has
      spread) breast cancer in patients who have been treated with other cancer medicines.
      It is used if the cancer cells have the germline BRCA mutations. Your doctor
      will use a special test to look for these mutations.
  - type: paragraph
    text: Olaparib is also used as maintenance treatment in patients with metastatic
      (cancer that has spread) pancreas cancer with a certain type of inherited (germline)
      abnormal BRCA gene, whose disease has not progressed and who have been treated
      with platinum-based cancer medicines for at least 16 weeks.
  - type: paragraph
    text: Olaparib is also used to treat metastatic castration-resistant prostate
      cancer (prostate cancer that has spread and is resistant to medical or surgical
      treatments that lower testosterone) in patients who have been treated with other
      cancer medicines (eg, abiraterone, enzalutamide). It is used if the cancer cells
      have a certain type of inherited (germline) or acquired (somatic) abnormal HRR
      gene. Your doctor will test for the presence of this gene.
  - type: paragraph
    text: Olaparib is used in combination with abiraterone and prednisone or prednisolone
      to treat metastatic castration-resistant prostate cancer (prostate cancer that
      has spread and is resistant to medical or surgical treatments that lower testosterone)
      with a certain type of inherited or acquired abnormal BRCA gene. Your doctor
      will test for the presence of this gene.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of olaparib in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of olaparib in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Levoketoconazole
      - Measles Virus Vaccine, Live
      - Mifepristone
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Amprenavir
      - Apalutamide
      - Aprepitant
