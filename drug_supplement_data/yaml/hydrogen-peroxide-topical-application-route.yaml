title: Hydrogen peroxide (topical application route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Aplicare One Hydrogen Peroxide
    - type: paragraph
      text: Eskata
    - type: paragraph
      text: Proxacol
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Hydrogen Peroxide
    - type: paragraph
