title: Clotrimazole (mucous membrane, oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Mycelex Troche
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Clotrimazole lozenges are dissolved slowly in the mouth to prevent and treat
      thrush. Thrush, also called candidiasis or white mouth, is a fungus infection
      of the mouth and throat. This medicine may also be used for other problems as
      determined by your doctor.
  - type: paragraph
    text: Clotrimazole is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Lozenge/Troche
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although this medicine has not been shown to cause different side effects
        or problems in children than it does in adults, it should not be given to
        children under 3 years of age since they may be too young to use the lozenges
        safely.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of clotrimazole
        lozenges in the elderly with use in other age groups, this medicine is not
        expected to cause different side effects or problems in older people than
        it does in younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Bedaquiline
      - Colchicine
      - Dihydroergotamine
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Ergoloid Mesylates
      - Ergonovine
      - Ergotamine
      - Finerenone
      - Haloperidol
      - Lisuride
      - Meperidine
      - Metergoline
      - Methylergonovine
      - Methysergide
      - Mifepristone
      - Nicergoline
      - Nifedipine
      - Paclitaxel
      - Paclitaxel Protein-Bound
      - Pimozide
      - Roflumilast
      - Tacrolimus
      - Voriconazole
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Trimetrexate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of clotrimazole.
        Make sure you tell your doctor if you have the following medical condition:'
    - type: list
      ordered: false
      items:
      - Liver disease—Your doctor may want to monitor your liver function while you
        are taking this medicine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Clotrimazole lozenges should be held in the mouth and allowed to dissolve
      slowly and completely. This may take 15 to 30 minutes. Swallow saliva during
      this time. Do not chew the lozenges or swallow them whole.
  - type: paragraph
    text: Do not give clotrimazole lozenges to infants or children under 3 years of
      age. They may be too young to use the lozenges safely.
  - type: paragraph
    text: To help clear up your infection completely, it is very important that you
      keep using clotrimazole for the full time of treatment , even if your symptoms
      begin to clear up after a few days. Since fungus infections may be very slow
      to clear up, you may have to continue using this medicine every day for two
      weeks or more. If you stop using this medicine too soon, your symptoms may return.
      Do not miss any doses .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For the treatment of thrush: Adults and children 3 years of age and older:
        Dissolve one 10-milligram lozenge slowly and completely in your mouth; this
        dose should be taken five times a day for at least fourteen days. Children
        up to 3 years of age: This medicine is not recommended in children under 3
        years of age since they may be too young to use the lozenges safely.'
      - 'For the prevention of thrush: Adults and children 3 years of age and older:
        Dissolve one 10-milligram lozenge slowly and completely in your mouth; this
        dose should be taken three times a day. Children up to 3 years of age: This
        medicine is not recommended in children under 3 years of age since they may
        be too young to use the lozenges safely.'
    - type: list
      ordered: false
      items:
      - 'Adults and children 3 years of age and older: Dissolve one 10-milligram lozenge
        slowly and completely in your mouth; this dose should be taken five times
        a day for at least fourteen days.'
      - 'Children up to 3 years of age: This medicine is not recommended in children
        under 3 years of age since they may be too young to use the lozenges safely.'
    - type: list
      ordered: false
      items:
      - 'Adults and children 3 years of age and older: Dissolve one 10-milligram lozenge
        slowly and completely in your mouth; this dose should be taken three times
        a day.'
      - 'Children up to 3 years of age: This medicine is not recommended in children
        under 3 years of age since they may be too young to use the lozenges safely.'
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve within 1 week, or if they become worse,
      check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: paragraph
      text: 'Note: Some of the side effects, such as abdominal or stomach cramping
        or pain or diarrhea, usually occur only when the medicine is swallowed'
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramping or pain
      - diarrhea
      - itching
      - nausea or vomiting
      - unpleasant mouth sensations
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
