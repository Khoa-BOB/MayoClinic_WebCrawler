      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to see if the medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction, called angioedema,
      which can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have a large, hive-like swelling on the face,
      eyelids, lips, tongue, throat, hands, legs, feet, or sex organs after using
      this medicine.
  - type: paragraph
    text: This medicine may increase your risk of having urinary retention (trouble
      passing urine or not fully emptying the bladder). Check with your doctor if
      you have a decrease in urine volume, decrease in the frequency of urination,
      difficulty in passing urine (dribbling), or painful urination.
  - type: paragraph
    text: This medicine may make you sweat less, causing your body temperature to
      increase. Use extra care not to become overheated during exercise or hot weather
      while you are taking this medicine, since overheating may result in heat stroke.
  - type: paragraph
    text: Avoid drinking alcohol while you are taking this medicine.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, drowsy, or have blurred
      vision. Do not drive or do anything else that could be dangerous until you know
      how this medicine affects you .
  - type: paragraph
    text: This medicine may cause dryness of the mouth, nose, and throat. For temporary
      relief of mouth dryness, use sugarless candy or gum, melt bits of ice in your
      mouth, or use a saliva substitute. However, if your mouth continues to feel
      dry for more than 2 weeks, check with your medical doctor or dentist. Continuing
      dryness of the mouth may increase the chance of dental disease, including tooth
      decay, gum disease, and fungus infections.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty having a bowel movement
      - dry mouth
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - bloody or cloudy urine
      - body aches or pain
      - burning feeling while urinating
      - chills
      - cough
      - decrease in frequency of urination
      - decrease in urine volume
      - difficult or painful urination
      - difficulty in breathing
      - difficulty in passing urine (dribbling)
      - dry eyes
      - ear congestion
      - fever
      - frequent urge to urinate
      - headache
      - loss of voice
      - lower back or side pain
      - rapid weight gain
      - runny or stuffy nose
      - sneezing
      - sore throat
      - tingling of the hands or feet
      - unusual tiredness or weakness
      - unusual weight gain or loss
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - fast, irregular, pounding, or racing heartbeat or pulse
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - belching
      - dry throat
      - heartburn
      - indigestion
      - nausea
      - rash
      - stomach discomfort, upset, or pain
      - trouble sleeping
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - itching skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
