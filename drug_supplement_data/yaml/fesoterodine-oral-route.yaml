title: Fesoterodine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Toviaz
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fesoterodine is used to treat bladder problems, including neurogenic detrusor
      overactivity and symptoms of an overactive bladder, such as incontinence (loss
      of bladder control), a strong need to urinate right away, or a frequent need
      to urinate. It works on the muscles of the bladder to increase the amount of
      urine your bladder can hold and prevent them from causing incontinence.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of fesoterodine in children with symptoms of overactive bladder
        or in children younger than 6 years of age or weighing 25 kilograms (kg) or
        less with neurogenic detrusor overactivity . Safety and efficacy have not
        been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of fesoterodine in the elderly. However,
        elderly patients are more likely to have unwanted side effects (eg, constipation,
        dizziness, dry mouth, upset stomach, or urinary tract infection), or age-related
        liver or kidney problems, which may require caution in patients receiving
        fesoterodine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Itraconazole
      - Potassium Chloride
      - Potassium Citrate
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amantadine
      - Amifampridine
      - Benzhydrocodone
      - Boceprevir
      - Buprenorphine
      - Bupropion
      - Clarithromycin
      - Clomipramine
      - Clozapine
      - Cobicistat
      - Codeine
      - Conivaptan
      - Cyclobenzaprine
      - Dihydrocodeine
      - Donepezil
      - Fentanyl
      - Glucagon
      - Glycopyrrolate
      - Glycopyrronium Tosylate
      - Hydrocodone
      - Hydromorphone
      - Hydroxychloroquine
      - Idelalisib
      - Indinavir
      - Ketoconazole
      - LetibotulinumtoxinA-wlbg
      - Lopinavir
      - Meperidine
      - Methacholine
      - Methadone
      - Morphine
      - Morphine Sulfate Liposome
      - Nefazodone
      - Nelfinavir
      - Olanzapine
      - Oliceridine
      - Oxycodone
      - Oxymorphone
      - Posaconazole
      - Promethazine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Glaucoma, narrow-angle or
      - Myasthenia gravis (severe muscle weakness) or
      - Stomach or bowel problems (eg, severe constipation) or
      - Urinary problems (eg, blockage)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Glaucoma, narrow-angle, uncontrolled or
      - Liver disease, severe or
      - Stomach problems (eg, gastric retention) or
      - Urinary retention—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions in the insert carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: This medicine may be taken with or without food.
  - type: paragraph
    text: Swallow the extended-release tablet whole with a full glass of water. Do
      not split, crush, or chew it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets): For neurogenic detrusor
        overactivity: Children 6 years of age and older—Dose is based on body weight
        and must be determined by your doctor. Weighing more than 35 kilograms (kg)—At
        first, 4 milligrams (mg) once a day. Your doctor may increase the dose to
        8 mg once a day after 1 week. Weighing more than 25 and up to 35 kg—At first,
        4 mg once a day. Your doctor may increase the dose as needed and tolerated.
        However the dose is usually not more than 8 mg once a day. Children younger
        than 6 years of age or weighing 25 kg or less—Use and dose must be determined
        by your doctor. For symptoms of an overactive bladder: Adults—At first, 4
        milligrams (mg) once a day. Your doctor may increase your dose as needed and
        tolerated. However, the dose is usually not more than 8 mg once a day. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For neurogenic detrusor overactivity: Children 6 years of age and older—Dose
        is based on body weight and must be determined by your doctor. Weighing more
        than 35 kilograms (kg)—At first, 4 milligrams (mg) once a day. Your doctor
        may increase the dose to 8 mg once a day after 1 week. Weighing more than
        25 and up to 35 kg—At first, 4 mg once a day. Your doctor may increase the
        dose as needed and tolerated. However the dose is usually not more than 8
        mg once a day. Children younger than 6 years of age or weighing 25 kg or less—Use
        and dose must be determined by your doctor.'
      - 'For symptoms of an overactive bladder: Adults—At first, 4 milligrams (mg)
        once a day. Your doctor may increase your dose as needed and tolerated. However,
        the dose is usually not more than 8 mg once a day. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Children 6 years of age and older—Dose is based on body weight and must be
        determined by your doctor. Weighing more than 35 kilograms (kg)—At first,
        4 milligrams (mg) once a day. Your doctor may increase the dose to 8 mg once
