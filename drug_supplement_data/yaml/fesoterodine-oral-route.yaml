    - type: list
      ordered: false
      items:
      - Weighing more than 35 kilograms (kg)—At first, 4 milligrams (mg) once a day.
        Your doctor may increase the dose to 8 mg once a day after 1 week.
      - Weighing more than 25 and up to 35 kg—At first, 4 mg once a day. Your doctor
