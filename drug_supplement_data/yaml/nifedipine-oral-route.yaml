    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly and to check for unwanted
      effects.
  - type: paragraph
    text: You should not use this medicine if you are also taking certain other medications
      such as carbamazepine (Tegretol®), phenobarbital (Luminal®), phenytoin (Dilantin®),
      rifabutin (Mycobutin®), rifampin (Rifadin®, Rimactane®), or St. John's Wort.
      Using these medicines together can cause serious problems. Make sure your doctor
      knows all of the medications you are taking.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up suddenly from a lying or sitting position. These symptoms are more likely
      to occur when you begin taking this medicine, or when the dose is increased.
  - type: paragraph
    text: This medicine may cause fluid retention (edema) in some patients. Tell your
      doctor right away if you have bloating or swelling of the face, arms, hands,
      lower legs, or feet; tingling of the hands or feet; or unusual weight gain or
      loss.
  - type: paragraph
    text: Do not stop taking this medicine without first checking with your doctor.
      Your doctor may want you to gradually reduce the amount you are using before
      stopping completely.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery or medical tests. This medicine may affect the results of certain
      medical tests.
  - type: paragraph
    text: Grapefruits and grapefruit juice may increase the effects of nifedipine
      by increasing the amount of this medicine in your body. You should not eat grapefruit
      or drink grapefruit juice while you taking this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
