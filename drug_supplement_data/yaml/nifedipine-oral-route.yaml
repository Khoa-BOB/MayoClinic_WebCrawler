      - Clonidine
      - Clopidogrel
      - Clotrimazole
      - Cobicistat
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Indinavir
      - Magnesium
      - Vincristine
      - Vincristine Sulfate Liposome
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Bitter Orange
      - Blueberry
      - Cranberry Juice
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Aortic stenosis (narrowing of a valve in your heart) or
      - Bowel blockage, severe or
      - Congestive heart failure or
      - Coronary artery disease or
      - Heart attack or
      - Hypotension (low blood pressure)—Use with caution. May increase risk of serious
        side effects.
    - type: list
      ordered: false
      items:
      - Cardiogenic shock (shock caused by heart attack)—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Galactose intolerance (rare hereditary problem) or
      - Glucose-galactose malabsorption (rare hereditary problem) or
      - Lapp lactase deficiency (rare hereditary problem)—The extended release tablet
        form of this medicine contains lactose (milk sugar), and should not be given
        to patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney problems or
      - Liver problems (including cirrhosis)—Use with caution. The effects of nifedipine
        may be increased because of the slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these are most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure, but
      it does help control it. You must continue to take it as directed if you expect
      to lower your blood pressure and keep it down. You may have to take high blood
      pressure medicine for the rest of your life . If high blood pressure is not
      treated, it can cause serious problems such as heart failure, blood vessel disease,
      stroke, or kidney disease.
  - type: paragraph
    text: Swallow the extended release tablet whole. Do not break, crush, or chew
      it. It is best to take this tablet on an empty stomach.
  - type: paragraph
    text: If you are taking the extended-release tablets , part of the tablet may
      pass into your stool after your body has absorbed the medicine. This is normal
      and nothing to worry about.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For treatment of chest pain or high blood pressure: For oral dosage form
        (capsules): Adults—At first, 10 milligrams (mg) three times a day. Your doctor
        may increase your dose as needed. Children—Use and dose must be determined
        by your doctor. For oral dosage form (extended-release tablets): Adults—At
        first, 30 or 60 milligrams (mg) once a day. Your doctor may increase your
        dose as needed. However, the dose is usually not more than 90 mg once a day.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): Adults—At first, 10 milligrams (mg) three
        times a day. Your doctor may increase your dose as needed. Children—Use and
        dose must be determined by your doctor.'
    - type: list
