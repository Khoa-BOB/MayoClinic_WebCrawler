- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Nifedipine is used alone or together with other medicines to treat severe
      chest pain (angina) or high blood pressure (hypertension). High blood pressure
      adds to the workload of the heart and arteries. If it continues for a long time,
      the heart and arteries may not function properly. This can damage the blood
      vessels of the brain, heart, and kidneys, resulting in a stroke, heart failure,
      or kidney failure. High blood pressure may also increase the risk of heart attacks.
      These problems may be less likely to occur if blood pressure is controlled.
  - type: paragraph
    text: Nifedipine is a calcium channel blocker. It works by affecting the movement
      of calcium into the cells of the heart and blood vessels. As a result, nifedipine
      relaxes blood vessels and increases the supply of blood and oxygen to the heart
      while reducing its workload.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule, Liquid Filled
    - Tablet, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of nifedipine in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of nifedipine in the elderly. However,
        elderly patients are more likely to have age-related kidney, liver, or heart
        problems which may require caution and an adjustment in the dose for patients
        receiving nifedipine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Apalutamide
      - Carbamazepine
      - Colchicine
      - Encorafenib
      - Enzalutamide
      - Fosphenytoin
      - Ivosidenib
      - Lumacaftor
      - Mitotane
      - Phenobarbital
      - Phenytoin
      - Primidone
      - Rifabutin
      - Rifampin
      - Rifapentine
      - St John's Wort
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Acarbose
      - Adagrasib
      - Alprazolam
      - Amiodarone
      - Amlodipine
      - Amprenavir
      - Aprepitant
      - Armodafinil
      - Asciminib
      - Atazanavir
      - Atorvastatin
      - Avacopan
