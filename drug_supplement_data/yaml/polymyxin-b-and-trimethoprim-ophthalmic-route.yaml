title: Polymyxin b and trimethoprim (ophthalmic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Polytrim
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Pms-Polytrimethoprim
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Polymyxin B and trimethoprim combination is used to treat eye infections,
      including acute bacterial conjunctivitis and blepharoconjunctivitis.
  - type: paragraph
    text: Polymyxin B and trimethoprim belong to the class of medicines known as antibiotics.
      They work by killing the bacteria or preventing their growth.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of polymyxin B and trimethoprim combination in children younger
        than 2 months of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of polymyxin B and trimethoprim combination
        in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Dofetilide
      - Levomethadyl
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acecainide
      - Ajmaline
      - Alcuronium
      - Amiloride
      - Amiodarone
      - Amitriptyline
      - Amoxapine
      - Aprindine
      - Arsenic Trioxide
      - Astemizole
      - Atracurium
      - Azathioprine
      - Azilsartan
      - Azilsartan Medoxomil
      - Azimilide
      - Benazepril
      - Bretylium
      - Candesartan Cilexetil
      - Captopril
      - Chloral Hydrate
      - Chloroquine
      - Chlorpromazine
      - Cholera Vaccine, Live
      - Cisatracurium
      - Clarithromycin
      - Cyclosporine
      - Desipramine
      - Dibenzepin
      - Digoxin
      - Disopyramide
      - Dolasetron
      - Doxacurium
      - Doxepin
      - Dronedarone
      - Droperidol
      - Enalapril
      - Enalaprilat
      - Enflurane
      - Eplerenone
      - Eprosartan
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Amantadine
      - Anisindione
      - Didanosine
      - Repaglinide
      - Rosiglitazone
      - Tolbutamide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use it for a longer time than your doctor
      ordered. To do so may increase the chance of too much medicine being absorbed
      into the body and the chance of side effects.
  - type: paragraph
    text: 'To use the eye drops (solution):'
  - type: list
    ordered: false
    items:
    - Shake the medicine well just before each use.
    - Wash your hands with soap and water before and after you use this medicine.
    - Tilt the head back. Press your finger gently on the skin just beneath the lower
      eyelid and pull the lower eyelid away from the eye to make a space. Drop the
      medicine into this space. Let go of the eyelid and gently close the eyes. Do
      not blink. Keep the eyes closed and apply pressure to the inner corner of the
      eye with your finger for 1 or 2 minutes to allow the medicine to be absorbed
      by the eye.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
      Serious damage to the eye and possible loss of vision may result from using
      contaminated eye medicines.
  - type: paragraph
    text: To help clear up your infection completely, keep using this medicine for
      the full treatment time even if you feel better after the first few doses. The
      infection may not clear up if you stop using the medicine too soon. Do not miss
      any doses.
  - type: paragraph
    text: Do not use this medicine while wearing contact lenses. Wait at least 15
      minutes after you use the medicine before putting the contact lenses back in.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For eye infections: For ophthalmic dosage form (eye drops): Adults and children
        2 months of age and older—Use one drop in the affected eye(s) every 3 hours
        for 7 to 10 days. Your doctor may tell you to use the drops more often during
        severe infections. Children younger than 2 months of age—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For ophthalmic dosage form (eye drops): Adults and children 2 months of age
        and older—Use one drop in the affected eye(s) every 3 hours for 7 to 10 days.
        Your doctor may tell you to use the drops more often during severe infections.
        Children younger than 2 months of age—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 2 months of age and older—Use one drop in the affected
        eye(s) every 3 hours for 7 to 10 days. Your doctor may tell you to use the
        drops more often during severe infections.
      - Children younger than 2 months of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your eye doctor (ophthalmologist) check your progress
      at regular visits to make sure this medicine is working properly and to check
      for unwanted effects.
  - type: paragraph
    text: If itching, redness, swelling, or other signs of eye or eyelid irritation
      occur, check with your doctor right away. This may mean that you are allergic
      to this medicine.
  - type: paragraph
    text: If your symptoms do not improve within a few days or if they become worse,
      check with your eye doctor (ophthalmologist) right away.
  - type: paragraph
    text: Check with your doctor right away if you have an eye injury, eye infection,
      or plan to have eye surgery.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Increased redness, burning, stinging, or itching of the eye
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - change in color vision
      - difficulty seeing at night
      - increased sensitivity of the eyes to sunlight
      - increased tearing
      - rash around the eye
      - swelling of the eyelid
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
