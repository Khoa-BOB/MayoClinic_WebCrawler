title: Paraldehyde (oral route, injection route, rectal route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Paraldehyde is used to treat certain convulsive disorders. It also has been
      used in the treatment of alcoholism and in the treatment of nervous and mental
      conditions to calm or relax patients who are nervous or tense and to produce
      sleep. However, this medicine has generally been replaced by safer and more
      effective medicines for the treatment of alcoholism and in the treatment of
      nervous and mental conditions.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of paraldehyde
        in children with use in other age groups, this medicine is not expected to
        cause different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of paraldehyde in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Disulfiram
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Fospropofol
      - Propofol
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Ginkgo
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse (or history of) or
      - Drug abuse or dependence (or history of)—Dependence on paraldehyde may develop
    - type: list
      ordered: false
      items:
      - Colitis—Paraldehyde used rectally may make the condition worse
    - type: list
      ordered: false
      items:
      - Emphysema, asthma, bronchitis, or other chronic lung disease, or
      - Liver disease—Higher blood levels of paraldehyde may occur, increasing the
        chance of side effects
    - type: list
      ordered: false
      items:
      - Gastroenteritis (stomach flu) or
      - Stomach ulcer—Paraldehyde taken by mouth may make the condition worse
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor. Do not use more of it,
      do not use it more often, and do not use it for a longer time than your doctor
      ordered. If too much is used, the medicine may become habit-forming.
  - type: paragraph
    text: Do not use if liquid turns brownish in color or if it has a strong vinegar-like
      odor, since this means the paraldehyde is breaking down. If you have any questions
      about this, check with your health care professional.
  - type: paragraph
    text: 'For patients taking this medicine by mouth:'
  - type: list
    ordered: false
    items:
    - Do not use a plastic spoon, plastic glass, or any other plastic container to
      take this medicine, since paraldehyde may react with the plastic. Use a metal
      spoon or glass container.
    - Take this medicine mixed in a glass of milk or iced fruit juice to improve the
      taste and odor and to lessen stomach upset.
  - type: paragraph
    text: 'For patients using this medicine rectally:'
  - type: list
    ordered: false
    items:
    - Do not use paraldehyde in any plastic container since it may react with the
      plastic.
    - Before using paraldehyde rectally, make sure you understand exactly how to use
      it. Paraldehyde may need to be diluted. If you have any questions about this,
      check with your health care professional.
  - type: paragraph
    text: Keep this medicine away from the eyes and avoid getting it on the skin and
      clothing.
  - type: paragraph
    text: Keep this medicine away from heat, open flame, and sparks.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral and rectal dosage forms (liquid): Adults: Dose must be determined
        by your doctor. Children: Dose is based on body weight, and must be determined
        by the doctor.'
      - 'For injection dosage form: Adults: Dose must be determined by your doctor.
        It will be injected into a muscle or a vein. Children: Dose is based on body
        weight, and must be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults: Dose must be determined by your doctor.'
      - 'Children: Dose is based on body weight, and must be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults: Dose must be determined by your doctor. It will be injected into
        a muscle or a vein.'
      - 'Children: Dose is based on body weight, and must be determined by the doctor.'
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: 'If you will be using this medicine regularly for a long time:'
  - type: list
    ordered: false
    items:
    - Your doctor should check your progress at regular visits.
    - Do not stop using it without first checking with your doctor. Your doctor may
      want you to reduce gradually the amount you are using before stopping completely.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that slow down the nervous system, possibly causing drowsiness).
      Some examples of CNS depressants are antihistamines or medicine for hay fever,
      other allergies, or colds; sedatives, tranquilizers, or sleeping medicine; prescription
      pain medicine or narcotics; barbiturates; medicine for seizures; muscle relaxants;
      or anesthetics, including some dental anesthetics. Check with your doctor before
      taking any of the above while you are using this medicine.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are taking this medicine. The results of some tests, such as the metyrapone
      test and the phentolamine test, may be affected by this medicine.
  - type: paragraph
    text: If you think you or someone else may have taken an overdose of this medicine,
      get emergency help at once. Taking an overdose of paraldehyde or taking alcohol
      or other CNS depressants with paraldehyde may lead to unconsciousness and possibly
      death. Some signs of an overdose are confusion, muscle tremors, nausea or vomiting
      (continuing or severe), severe stomach cramps, severe weakness, shortness of
      breath or slow or troubled breathing, and slow heartbeat.
  - type: paragraph
    text: This medicine may cause some people to become drowsy or less alert than
      they are normally. Even if taken at bedtime, it may cause some people to feel
      drowsy or less alert on arising. Make sure you know how you react to this medicine
      before you drive, use machines, or do anything else that could be dangerous
      if you are not alert.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Coughing (with injection only)
      - skin rash
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Redness, swelling, or pain at injection site
    subsections: []
  - heading: With long-term use
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Yellow eyes or skin
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cloudy urine
      - confusion
      - decreased urination
      - fast and deep breathing
      - muscle tremors
      - nausea or vomiting (continuing or severe)
      - nervousness, restlessness, or irritability
      - shortness of breath or slow or troubled breathing
      - slow heartbeat
      - stomach cramps (severe)
      - weakness (severe)
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Drowsiness
      - nausea or vomiting (when taken by mouth)
      - stomach pain (when taken by mouth)
      - unpleasant breath odor
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Clumsiness or unsteadiness
      - dizziness
      - '``hangover'''' effect'
    - type: paragraph
      text: 'After you stop using this medicine, it may still produce some side effects
        that need attention. During this period of time, check with your doctor immediately
        if you notice the following side effects:'
    - type: list
      ordered: false
      items:
      - Convulsions (seizures)
      - hallucinations (seeing, hearing, or feeling things that are not there)
      - increased sweating
      - muscle cramps
      - nausea and vomiting
      - stomach cramps
      - trembling
    - type: paragraph
      text: Paraldehyde will cause your breath to have a strong unpleasant odor. This
        effect will last until about one day after you have stopped using this medicine.
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
