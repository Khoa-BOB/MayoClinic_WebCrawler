title: Darunavir (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Prezista
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: APO-Darunavir
    - type: paragraph
      text: Auro-Darunavir
    - type: paragraph
      text: Darunavir
    - type: paragraph
      text: Mar-Darunavir
    - type: paragraph
      text: M-Darunavir
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Darunavir is used in combination with ritonavir (Norvir®) and other medicines
      for the treatment of the infection caused by the human immunodeficiency virus
      (HIV). HIV is the virus that causes acquired immune deficiency syndrome (AIDS).
      This medicine is given to patients who have already had previous treatment for
      HIV or who have never taken HIV medicines in the past.
  - type: paragraph
    text: Darunavir will not cure or prevent HIV infection or AIDS. It works by lowering
      the amount of HIV in the blood and it will also help your immune system. This
      may help delay some of the medical conditions that usually result from AIDS
      or HIV disease. Darunavir will not keep you from spreading HIV to other people.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of darunavir in children 3 years
        of age and older. Because of darunavir's toxicity, use in children younger
        than 3 years of age is not recommended.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of darunavir in the elderly. However,
        elderly patients are more likely to have age-related liver problems, which
        may require caution in patients receiving darunavir.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Alfuzosin
      - Astemizole
