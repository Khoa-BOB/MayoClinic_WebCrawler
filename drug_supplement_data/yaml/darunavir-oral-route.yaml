    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the oral liquid in its original container. Do not refrigerate or
        freeze it.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood tests
      may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not use this medicine if you or your child are also using alfuzosin (Uroxatral®),
      dronedarone (Multaq®), elbasvir/grazoprevir (Zepatier®), ivabradine (Corlaonor®),
      lomitapide (Juxtapid®, Lojuxta®), lovastatin (Altocor®, Altoprev®, Mevacor®),
      lurasidone (Latuda®), naloxegol (Movantik®, Moventig®), oral midazolam (Versed®),
      pimozide (Orap®), ranolazine (Ranexa®), rifampin (Rifadin®, Rimactane®), sildenafil
      (Revatio®), simvastatin (Simcor®, Vytorin®, Zocor®), triazolam (Halcion®), or
      ergot medicines (eg, dihydroergotamine, ergotamine, methylergonovine, Cafergot®,
      D.H.E. 45®, Ergomar®, Ergostat®, Methergine®, Migranal®, Wigraine®). Do not
      use this medicine together with colchicine (Colcrys®) if you have kidney or
      liver disease.
  - type: paragraph
    text: Birth control pills may not work as well while you are using darunavir.
      To keep from getting pregnant, use an additional form of birth control along
      with your pills. Other forms of birth control include condoms, diaphragm, contraceptive
      foam, or jelly. If you think you have become pregnant while using this medicine,
      tell your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you or your child have pain or tenderness
      in the upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual
      tiredness or weakness, or yellow eyes or skin. These could be symptoms of a
      serious liver problem.
  - type: paragraph
    text: This medicine may increase blood sugar levels. Check with your doctor right
      away if you or your child have increased thirst or increased urination. If you
      notice a change in the results of your or your child's blood or urine sugar
      tests, or if you have any questions, check with your doctor.
  - type: paragraph
    text: Your immune system may get stronger when you start taking HIV medicines.
      Tell your doctor right away if you or your child notice any changes in your
      health. Sometimes the immune system will start to fight infections that were
      hidden in your body, such as pneumonia, herpes, or tuberculosis. Autoimmune
      disorders (eg, Graves' disease, polymyositis, or Guillain-Barré syndrome) may
      also occur.
  - type: paragraph
    text: Serious skin reactions, including Stevens-Johnson syndrome, toxic epidermal
      necrolysis, drug reaction with eosinophilia and systemic symptoms (DRESS), and
      acute generalized exanthematous pustulosis can occur with this medicine. Check
      with your doctor right away if you or your child have black, tarry stools, blistering,
      peeling, or loosening of the skin, chest pain, chills, cough, diarrhea, fever,
      itching, joint or muscle pain, painful or difficult urination, red irritated
      eyes, red skin lesions, often with a purple center, sore throat, sores, ulcers,
      or white spots in the mouth or on the lips, swollen glands, unusual bleeding
      or bruising, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause you to have excess body fat. Tell your doctor if
      you or your child notice changes in your body shape, such as an increased amount
      of fat in the upper back and neck, or around the chest and stomach area. You
      might also lose fat from the legs, arms, and face.
  - type: paragraph
    text: This medicine may increase the risk of bleeding in patients with hemophilia
      (a bleeding disorder). Talk with your doctor about this risk.
  - type: paragraph
    text: This medicine will not keep you from giving HIV to your partner during sex.
      Make sure you understand this and practice safe sex, even if your partner also
      has HIV, by using a latex condom or other barrier method. This medicine will
      also not keep you from giving HIV to other people if they are exposed to your
      blood. Do not re-use or share needles with anyone.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription and nonprescription (over-the-counter [OTC]) medicines,
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - blurred vision
      - chills
      - cough
      - diarrhea
      - dry mouth
      - flushed, dry skin
      - fruit-like breath odor
      - increased hunger
      - increased thirst
      - increased urination
      - itching
      - joint or muscle pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - red irritated eyes
      - red skin lesions, often with a purple center
      - skin rash
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - sweating
      - trouble breathing
      - unexplained weight loss
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - black, tarry stools
      - bloating
      - constipation
      - dark urine
      - decreased appetite
      - difficulty with moving
      - dizziness
      - excess air or gas in the stomach or bowels
      - fast heartbeat
      - feeling of fullness
      - fever
      - headache
      - heartburn
      - indigestion
      - lack or loss of strength
      - light-colored stools
      - loss of appetite
      - muscle aching or cramping
      - nausea
      - painful or difficult urination
      - passing gas
      - stomach pain or tenderness
      - swelling of the feet or lower legs
      - swollen glands
      - swollen joints
      - unpleasant breath odor
      - unusual bleeding or bruising
      - vomiting
      - vomiting of blood
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Lower back pain
      - muscle pain, spasms, or stiffness
      - pain or burning while urinating
      - sudden decrease in amount of urine
      - swelling or puffiness of the face
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Stuffy or runny nose
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Gaining weight around your neck, upper back, breast, face, or waist
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
