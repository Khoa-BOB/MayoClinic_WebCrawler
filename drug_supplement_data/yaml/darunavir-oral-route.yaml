      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Cobicistat
      - Tenofovir Disoproxil Fumarate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hemophilia (a bleeding problem) or
      - Hyperglycemia (high blood sugar) or
      - Liver disease (eg, cirrhosis, hepatitis)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use is not recommended in patients with this condition.
    - type: list
      ordered: false
      items:
      - Sulfa allergy, known or suspected—Use with caution. May make side effects
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not use more
      of it, do not use it more often, and do not use it for a longer time than your
      doctor ordered. Also, do not change the dose or stop using this medicine without
      checking first with your doctor . When your supply of this medicine is running
      low, contact your doctor or pharmacist ahead of time. Do not allow yourself
      to run out of this medicine.
  - type: paragraph
    text: This medicine is always taken with ritonavir (Norvir®). Take these two medicines
      at the same time , unless your doctor tells you otherwise.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor or pharmacist if you have any
      questions.
  - type: paragraph
    text: You may take this medicine with food.
  - type: paragraph
    text: Swallow the tablet whole with water or milk. Do not crush, break, or chew
      it.
  - type: paragraph
    text: If you are using the oral liquid , shake the bottle well before measuring
      each dose. Use the dosing syringe that comes with the package to measure each
      dose.
  - type: paragraph
    text: If you also use didanosine (Videx®), take it at least 1 hour before or 2
      hours after taking this medicine and ritonavir.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you begin
      to feel better. It is also important to take this medicine together with other
      medicines for HIV. Be sure to take all of the medicines your doctor ordered,
      and to take them at the right times.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (suspension or tablets): For HIV infection (patient
        already had HIV treatment): For patients with no darunavir resistance associated
        substitution: Adults—800 milligrams (mg) (one 800 mg tablet or 8 milliliters
        [mL]) once a day with 100 mg (1.25 mL) of ritonavir (Norvir®). Children 3
        to 17 years of age and weighing 15 kilograms (kg) or more—Dose is based on
        body weight and must be determined by your doctor. Weighing 40 kg or more—800
        mg (8 mL) with 100 mg (1.25 mL) of ritonavir once a day. Weighing 30 kg to
        less than 40 kg—675 mg (6.8 mL) with 100 mg (1.25 mL) of ritonavir once a
        day. Weighing 15 kg to less than 30 kg—600 mg (6 mL) with 100 mg (1.25 mL)
        of ritonavir once a day. Children 3 to 17 years of age and weighing 10 kg
        to less than 15 kg—Dose is based on body weight and must be determined by
        your doctor. Weighing 14 kg to less than 15 kg—490 mg (5 mL) with 96 mg (1.2
        mL) of ritonavir once a day. Weighing 13 kg to less than 14 kg—455 mg (4.6
        mL) with 80 mg (1 mL) of ritonavir once a day. Weighing 12 kg to less than
        13 kg—420 mg (4.2 mL) with 80 mg (1 mL) of ritonavir once a day. Weighing
        11 kg to less than 12 kg—385 mg (4 mL) with 64 mg (0.8 mL) of ritonavir once
        a day. Weighing 10 kg to less than 11 kg—350 mg (3.6 mL) with 64 mg (0.8 mL)
        of ritonavir once a day. Children younger than 3 years of age—Use is not recommended.
        For patients with at least one darunavir resistance associated substitution:
