title: Dipyridamole (oral route, intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Persantine
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Dipyridamole is used to lessen the chance of stroke or other serious medical
      problems that may occur when a blood vessel is blocked by blood clots. It is
      given only when there is a larger-than-usual chance that these problems may
      occur. For example, it is given to people who have had diseased heart valves
      replaced by mechanical valves, because dangerous blood clots are especially
      likely to occur in these patients. Dipyridamole works by helping to prevent
      dangerous blood clots from forming.
  - type: paragraph
    text: Dipyridamole may also be used for other heart and blood conditions as determined
      by your doctor.
  - type: paragraph
    text: Dipyridamole is also sometimes used as part of a medical test that shows
      how well blood is flowing to your heart. For information on this use of dipyridamole,
      see Dipyridamole—Diagnostic (Systemic).
  - type: paragraph
    text: Dipyridamole is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested only in adults and in children older than
        12 years of age. There is no specific information comparing use of dipyridamole
        in children younger than 12 years of age with use in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Dipyridamole has not been studied specifically in older people taking
        the medicine regularly to prevent blood clots from forming. Although there
        is no specific information comparing this use of dipyridamole in the elderly
        with use in other age groups, it is not expected to cause different side effects
        or problems in older people than it does in younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Abrocitinib
      - Defibrotide
      - Riociguat
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abciximab
      - Aceclofenac
      - Acemetacin
      - Acenocoumarol
      - Alipogene Tiparvovec
      - Alteplase, Recombinant
      - Amtolmetin Guacil
      - Anagrelide
      - Apixaban
      - Ardeparin
      - Argatroban
      - Bemiparin
      - Betrixaban
      - Bivalirudin
      - Bromfenac
      - Bufexamac
      - Caplacizumab-yhdp
      - Celecoxib
      - Certoparin
      - Choline Salicylate
      - Cilostazol
      - Citalopram
      - Clonixin
      - Clopidogrel
      - Curcumin
      - Dabigatran Etexilate
      - Dalteparin
      - Danaparoid
      - Desirudin
      - Desvenlafaxine
      - Dexibuprofen
      - Dexketoprofen
      - Diclofenac
      - Diflunisal
      - Dipyrone
      - Droxicam
      - Duloxetine
      - Edoxaban
      - Enoxaparin
      - Eptifibatide
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Adenosine
      - Garlic
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Chest pain—The chance of side effects may be increased
    - type: list
      ordered: false
      items:
      - Low blood pressure—Large amounts of dipyridamole can make your condition worse
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine works best when there is a constant amount in the blood. To
      help keep the amount constant, dipyridamole must be taken in regularly spaced
      doses, as ordered by your doctor.
  - type: paragraph
    text: This medicine works best when taken with a full glass (8 ounces) of water
      at least 1 hour before or 2 hours after meals. However, to lessen stomach upset,
      your doctor may want you to take the medicine with food or milk.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For preventing blood clots: For oral dosage form (tablets): Adults—The usual
        dose is 75 to 100 milligrams (mg) four times a day taken together with an
        anticoagulant (blood-thinning) medicine. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): Adults—The usual dose is 75 to 100 milligrams
        (mg) four times a day taken together with an anticoagulant (blood-thinning)
        medicine. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—The usual dose is 75 to 100 milligrams (mg) four times a day taken
        together with an anticoagulant (blood-thinning) medicine.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: 'Dipyridamole is sometimes used together with an anticoagulant (blood thinner)
      or aspirin. The combination of medicines may provide better protection against
      the formation of blood clots than any of the medicines used alone. However,
      the risk of bleeding may also be increased when dipyridamole is taken with aspirin.
      To reduce the risk of bleeding:'
  - type: list
    ordered: false
    items:
    - Do not take aspirin, or any combination medicine containing aspirin, unless
      the same doctor who directed you to take dipyridamole also directs you to take
      aspirin. This is especially important if you are taking an anticoagulant together
      with dipyridamole.
    - If you have been directed to take aspirin together with dipyridamole, take only
      the amount of aspirin ordered by your doctor . If you need a medicine to relieve
      pain or a fever, your doctor may not want you to take extra aspirin. It is a
      good idea to discuss this with your doctor, so that you will know ahead of time
      what medicine to take.
    - Your doctor should check your progress at regular visits.
  - type: paragraph
    text: Tell all medical doctors and dentists you go to that you are taking dipyridamole,
      and whether or not you are taking an anticoagulant (blood thinner) or aspirin
      together with it.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up from a lying or sitting position. Getting up slowly may help. If this problem
      continues or gets worse, check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - gallstones
      - tightness or swelling of neck
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps
      - diarrhea
      - dizziness or lightheadedness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Flushing
      - headache
      - nausea or vomiting
      - weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - General discomfort and/or unusual tiredness or weakness
      - hair loss
      - joint pain or swelling
      - muscle pain
      - runny nose
      - sneezing
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
