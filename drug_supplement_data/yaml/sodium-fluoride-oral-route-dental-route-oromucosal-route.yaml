- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fluoride has been found to be helpful in reducing the number of cavities
      in the teeth. It is usually present naturally in drinking water. However, some
      areas of the country do not have a high enough level in the water to prevent
      cavities. To make up for this, extra fluoride may be added to the diet. Some
      children may require both dietary fluoride and topical fluoride treatments by
      the dentist. Use of a fluoride toothpaste or rinse may be helpful as well.
  - type: paragraph
    text: Taking extra oral fluoride does not replace good dental habits. These include
      eating a good diet, brushing and flossing the teeth often, and having regular
      dental checkups.
  - type: paragraph
    text: Fluoride may also be used for other conditions as determined by your doctor.
  - type: paragraph
    text: This medicine is available only with a prescription.
  subsections:
  - heading: Importance Of Diet
    level: 3
    content:
    - type: paragraph
      text: For good health, it is important that you eat a balanced and varied diet.
        Follow carefully any diet program your health care professional may recommend.
        For your specific dietary vitamin and/or mineral needs, ask your health care
        professional for a list of appropriate foods. If you think that you are not
        getting enough vitamins and/or minerals in your diet, you may choose to take
        a dietary supplement.
    - type: paragraph
      text: People get needed fluoride from fish, including the bones, tea, and drinking
        water that has fluoride added to it. Food that is cooked in water containing
        fluoride or in Teflon-coated pans also provides fluoride. However, foods cooked
        in aluminum pans provide less fluoride.
    - type: paragraph
      text: The daily amount of fluoride needed is defined in several different ways.
    subsections: []
  - heading: For U.S.—
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Recommended Dietary Allowances (RDAs) are the amount of vitamins and minerals
        needed to provide for adequate nutrition in most healthy persons. RDAs for
        a given nutrient may vary depending on a person's age, sex, and physical condition
        (e.g., pregnancy).
      - Daily Values (DVs) are used on food and dietary supplement labels to indicate
        the percent of the recommended daily amount of each nutrient that a serving
        provides. DV replaces the previous designation of United States Recommended
        Daily Allowances (USRDAs).
    subsections: []
  - heading: For Canada—
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Recommended Nutrient Intakes (RNIs) are used to determine the amounts of vitamins,
        minerals, and protein needed to provide adequate nutrition and lessen the
        risk of chronic disease.
    - type: paragraph
      text: 'There is no RDA or RNI for fluoride. Daily recommended intakes for fluoride
        are generally defined as follows:'
    subsections: []
  - heading: Infants and children—
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - 'Birth to 3 years of age: 0.1 to 1.5 milligrams (mg).'
      - '4 to 6 years of age: 1 to 2.5 mg.'
      - '7 to 10 years of age: 1.5 to 2.5 mg.'
    subsections: []
  - heading: Adolescents and adults—
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - 1.5 to 4 mg.
    - type: paragraph
      text: 'Remember:'
    - type: list
      ordered: false
      items:
      - The total amount of fluoride you get every day includes what you get from
        the foods and beverages that you eat and what you may take as a supplement.
      - This total amount should not be greater than the above recommendations, unless
        ordered by your health care professional. Taking too much fluoride can cause
        serious problems to the teeth and bones.
    - type: paragraph
      text: 'This product is available in the following dosage forms:'
    - type: list
      ordered: false
      items:
      - Tablet, Chewable
      - Paste
      - Solution
      - Gel/Jelly
      - Suspension
      - Cream
      - Liquid
    subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Problems in children have not been reported with intake of normal daily
        recommended amounts. Doses of sodium fluoride that are too large or are taken
        for a long time may cause bone problems and teeth discoloration in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Problems in older adults have not been reported with intake of normal
        daily recommended amounts. Older people are more likely to have joint pain,
        kidney problems, or stomach ulcers which may be made worse by taking large
        doses of sodium fluoride. You should check with your health care professional.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Dairy Food
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Brown, white, or black discoloration of teeth or
      - Joint pain or
      - Kidney problems (severe) or
      - Stomach ulcer—Sodium fluoride may make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your health care professional. Do
      not take more of it and do not take it more often than ordered. Taking too much
      fluoride over a period of time may cause unwanted effects.
  - type: paragraph
    text: 'For individuals taking the chewable tablet form of this medicine:'
  - type: list
    ordered: false
    items:
    - Tablets should be chewed or crushed before they are swallowed.
    - This medicine works best if it is taken at bedtime, after the teeth have been
      thoroughly brushed. Do not eat or drink for at least 15 minutes after taking
      sodium fluoride.
  - type: paragraph
    text: 'For individuals taking the oral liquid form of this medicine:'
  - type: list
    ordered: false
    items:
    - This medicine is to be taken by mouth even though it comes in a dropper bottle.
      The amount to be taken is to be measured with the specially marked dropper.
    - Always store this medicine in the original plastic container. Fluoride will
      affect glass and should not be stored in glass containers.
    - This medicine may be dropped directly into the mouth or mixed with cereal, fruit
      juice, or other food. However, if this medicine is mixed with foods or beverages
      that contain calcium, the amount of sodium fluoride that is absorbed may be
      reduced.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (lozenges, solution, tablets, or chewable tablets):
        To prevent cavities in the teeth (not enough fluoride in the water): Children—Dose
        is based on the amount of fluoride in drinking water in your area. Dose is
        also based on the child''s age and must be determined by your health care
        professional.'
    - type: list
      ordered: false
      items:
      - 'To prevent cavities in the teeth (not enough fluoride in the water): Children—Dose
        is based on the amount of fluoride in drinking water in your area. Dose is
        also based on the child''s age and must be determined by your health care
        professional.'
    - type: list
      ordered: false
      items:
      - Children—Dose is based on the amount of fluoride in drinking water in your
        area. Dose is also based on the child's age and must be determined by your
        health care professional.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: The level of fluoride present in the water is different in different parts
      of the U.S. If you move to another area, check with a health care professional
      in the new area as soon as possible to see if this medicine is still needed
      or if the dose needs to be changed. Also, check with your health care professional
      if you change infant feeding habits (e.g., breast-feeding to infant formula),
      drinking water (e.g., city water to nonfluoridated bottled water), or filtration
      (e.g., tap water to filtered tap water).
  - type: paragraph
    text: Do not take calcium supplements or aluminum hydroxide–containing products
      and sodium fluoride at the same time. It is best to space doses of these two
      products 2 hours apart, to get the full benefit from each medicine.
  - type: paragraph
    text: Inform your health care professional as soon as possible if you notice white,
      brown, or black spots on the teeth. These are signs of too much fluoride in
      children when it is given during periods of tooth development.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  - type: paragraph
    text: Sodium fluoride in drinking water or taken as a supplement does not usually
      cause any side effects. However, taking an overdose of fluoride may cause serious
      problems.
  - type: list
    ordered: false
    items:
    - Sores in the mouth and on the lips (rare)
  - type: paragraph
    text: 'Stop taking this medicine and get emergency help immediately if any of
      the following effects occur:'
  - type: list
    ordered: false
    items:
    - Black, tarry stools
    - bloody vomit
    - diarrhea
    - drowsiness
    - faintness
    - increased watering of the mouth
    - nausea or vomiting
    - shallow breathing
    - stomach cramps or pain
    - tremors
    - unusual excitement
    - watery eyes
    - weakness
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  - type: list
    ordered: false
    items:
    - Pain and aching of bones
    - stiffness
    - white, brown, or black discoloration of the teeth—occurs only during periods
      of tooth development in children
  - type: paragraph
    text: Other side effects not listed may also occur in some patients. If you notice
      any other effects, check with your healthcare professional.
  - type: paragraph
    text: Call your doctor for medical advice about side effects. You may report side
      effects to the FDA at 1-800-FDA-1088.
