title: Bromocriptine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cycloset
    - type: paragraph
      text: Parlodel
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Bromocriptine belongs to the group of medicines known as ergot alkaloids.
      Bromocriptine blocks the release of a hormone called prolactin from the pituitary
      gland. Prolactin affects the menstrual cycle and milk production.
  - type: paragraph
    text: Bromocriptine is used to treat certain menstrual problems (eg, amenorrhea)
      in women and stops milk production in some men and women who have abnormal milk
      leakage. It is also used to treat infertility in both men and women that occurs
      because the body is making too much prolactin.
  - type: paragraph
    text: Bromocriptine is also used to treat acromegaly (overproduction of growth
      hormone) and pituitary prolactinomas (tumors of the pituitary gland).
  - type: paragraph
    text: Bromocriptine is also used to treat the signs and symptoms of Parkinson's
      disease, often in combination with levodopa.
  - type: paragraph
    text: Bromocriptine is also used together with proper diet and exercise to lower
      blood sugar levels in patients with type 2 diabetes.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of bromocriptine to treat acromegaly, Parkinson's disease,
        and type 2 diabetes in the pediatric population. Safety and efficacy have
        not been established.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of bromocriptine in children 16 years
        of age and older with prolactin-secreting pituitary adenomas. However, safety
        and efficacy have not been established in children younger than 16 years of
        age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of bromocriptine in the elderly.
        However, elderly patients are more sensitive to the effects of this medicine
        than younger adults and are more likely to have confusion, hallucinations,
        or uncontrolled body movements, and age-related kidney, liver, or heart problems,
        which may require caution and an adjustment in the dose for patients receiving
        bromocriptine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Atazanavir
      - Cobicistat
      - Darunavir
      - Dihydroergotamine
      - Eletriptan
      - Frovatriptan
      - Itraconazole
      - Ketoconazole
      - Letermovir
      - Naratriptan
      - Nirmatrelvir
      - Posaconazole
      - Rizatriptan
      - Sulpiride
      - Sumatriptan
      - Voriconazole
      - Zolmitriptan
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Almotriptan
      - Amoxapine
      - Apalutamide
      - Avacopan
      - Boceprevir
      - Carbamazepine
      - Ceritinib
      - Chlorothiazide
      - Chlorthalidone
      - Clarithromycin
      - Clomipramine
      - Conivaptan
      - Cyclosporine
      - Epinephrine
      - Fedratinib
      - Fexinidazole
      - Fosnetupitant
      - Furosemide
      - Haloperidol
      - Hydrochlorothiazide
      - Hydroflumethiazide
      - Idelalisib
      - Indapamide
      - Indinavir
      - Insulin
      - Insulin Aspart, Recombinant
      - Insulin Bovine
      - Insulin Degludec
      - Insulin Detemir
      - Insulin Glargine, Recombinant
      - Insulin Glulisine
      - Insulin Lispro, Recombinant
      - Isometheptene
      - Lopinavir
      - Metoclopramide
      - Metolazone
      - Mifepristone
      - Nefazodone
      - Nelfinavir
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Bromperidol
      - Kava
      - Thioridazine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Coronary artery disease or other serious heart or blood vessel disorder, history
        of or
      - Hypertension (high blood pressure), uncontrolled or
      - Pregnancy-induced high blood pressure—Parlodel® should not be used in patients
        with these conditions unless medically necessary.
    - type: list
      ordered: false
      items:
      - Diabetic ketoacidosis (ketones in the blood) or
      - Syncopal (fainting) migraine headaches or
      - Type I diabetes or
      - Postpartum patients (women who had recently given birth)—Cycloset® should
        not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Fever or
      - Infection or
      - Surgery or
      - Trauma—These conditions may cause temporary problems with blood sugar control
        and your doctor may want to treat you temporarily with insulin.
    - type: list
      ordered: false
      items:
      - Galactose intolerance (a rare genetic disorder) or
      - Glucose-galactose malabsorption (a rare genetic disorder) or
      - Lactase deficiency (a rare genetic disorder), severe—Use of Parlodel® is not
        recommended in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Heart attack, history of or
      - Heart or blood vessel disease (eg, pericardial effusion) or
      - Heart rhythm problems or
      - Hypertension (high blood pressure) or
      - Hypotension (low blood pressure) or
      - Lung disease (eg, pleural effusion, pulmonary fibrosis) or
      - Mental illness (eg, psychosis, dementia), history of or
      - Retroperitoneal fibrosis or
      - Seizures, history of or
      - Stomach ulcers or bleeding, or history of or
      - Stroke, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Cycloset® comes with a patient information insert. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Carefully follow the special meal plan your doctor gave you . This is the
      most important part of controlling your condition, and is necessary if the medicine
      is to work properly. Also, exercise regularly and test for sugar in your blood
      or urine as directed.
  - type: paragraph
    text: Take this medicine with food.
  - type: paragraph
    text: Take Cycloset® within 2 hours after you wake up in the morning.
  - type: paragraph
    text: Take Parlodel® at bedtime to help lessen nausea if it occurs. If stomach
      upset continues, check with your doctor.
  - type: paragraph
    text: Use only the brand of this medicine that your doctor prescribed. Different
      brands may not work the same way.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules and tablets): For infertility, pituitary
        tumors, male hormone problem (male hypogonadism), starting the menstrual cycle
        (amenorrhea), or stopping abnormal milk secretion from the nipples (galactorrhea):
        Adults and children 16 years of age or older—At first, 1.25 to 2.5 milligrams
        (mg) once a day. Your doctor may increase your dose by 2.5 mg every 2 to 7
        days as needed and tolerated. However, the dose is usually not more than 15
        mg per day. Children 11 to 15 years of age—At first, 1.25 to 2.5 mg once a
        day. Your doctor may increase your dose as needed and tolerated. However,
        the dose is usually not more than 10 mg per day. Children younger than 11
        years of age—Use and dose must be determined by your doctor. For lowering
        growth hormone (acromegaly): Adults—At first, 1.25 to 2.5 milligrams (mg)
        once a day taken at bedtime with a snack for 3 days. Your doctor may increase
        your dose by 1.25 or 2.5 mg every 3 to 7 days as needed. However, the dose
        is usually not more than 100 mg per day. Children—Use and dose must be determined
        by your doctor. For Parkinson''s disease: Adults—At first, 1.25 milligrams
        (mg) two times a day. Your doctor may increase your dose over several weeks
        as needed. However, the dose is usually not more than 100 mg per day. Children—Use
        and dose must be determined by your doctor. For type 2 diabetes: Adults—At
        first, 0.8 milligram (mg) once a day, taken within two hours after waking
        up in the morning. Your doctor may increase your dose as needed. However,
        the dose is usually not more than 4.8 mg per day. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For infertility, pituitary tumors, male hormone problem (male hypogonadism),
        starting the menstrual cycle (amenorrhea), or stopping abnormal milk secretion
        from the nipples (galactorrhea): Adults and children 16 years of age or older—At
        first, 1.25 to 2.5 milligrams (mg) once a day. Your doctor may increase your
        dose by 2.5 mg every 2 to 7 days as needed and tolerated. However, the dose
        is usually not more than 15 mg per day. Children 11 to 15 years of age—At
        first, 1.25 to 2.5 mg once a day. Your doctor may increase your dose as needed
        and tolerated. However, the dose is usually not more than 10 mg per day. Children
        younger than 11 years of age—Use and dose must be determined by your doctor.'
      - 'For lowering growth hormone (acromegaly): Adults—At first, 1.25 to 2.5 milligrams
        (mg) once a day taken at bedtime with a snack for 3 days. Your doctor may
        increase your dose by 1.25 or 2.5 mg every 3 to 7 days as needed. However,
        the dose is usually not more than 100 mg per day. Children—Use and dose must
        be determined by your doctor.'
      - 'For Parkinson''s disease: Adults—At first, 1.25 milligrams (mg) two times
        a day. Your doctor may increase your dose over several weeks as needed. However,
        the dose is usually not more than 100 mg per day. Children—Use and dose must
        be determined by your doctor.'
      - 'For type 2 diabetes: Adults—At first, 0.8 milligram (mg) once a day, taken
        within two hours after waking up in the morning. Your doctor may increase
        your dose as needed. However, the dose is usually not more than 4.8 mg per
        day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 16 years of age or older—At first, 1.25 to 2.5 milligrams
        (mg) once a day. Your doctor may increase your dose by 2.5 mg every 2 to 7
        days as needed and tolerated. However, the dose is usually not more than 15
        mg per day.
      - Children 11 to 15 years of age—At first, 1.25 to 2.5 mg once a day. Your doctor
        may increase your dose as needed and tolerated. However, the dose is usually
        not more than 10 mg per day.
      - Children younger than 11 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - Adults—At first, 1.25 to 2.5 milligrams (mg) once a day taken at bedtime with
        a snack for 3 days. Your doctor may increase your dose by 1.25 or 2.5 mg every
        3 to 7 days as needed. However, the dose is usually not more than 100 mg per
        day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—At first, 1.25 milligrams (mg) two times a day. Your doctor may increase
        your dose over several weeks as needed. However, the dose is usually not more
