      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you missed a dose of Cycloset® , skip the missed dose and wait until
        the next morning to take it.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: 'For females using Parlodel® who are not trying to get pregnant:'
  - type: list
    ordered: false
    items:
    - Use an effective form of birth control (other than oral contraceptives) to keep
      from getting pregnant. A pregnancy test is needed every 4 weeks during the amenorrheic
      period or every time you miss a monthly period. If you think you have become
      pregnant while using the medicine, tell your doctor right away.
    - Check with your doctor right away if you develop blurred vision, a sudden headache,
      or severe nausea and vomiting.
  - type: paragraph
    text: Do not use Cycloset® if you had recently given birth to a child (postpartum).
      This medicine may cause serious and life-threatening problems when given to
      postpartum women, including high blood pressure, heart attack, seizures, stroke,
      or mental illness.
  - type: paragraph
    text: This medicine may cause some people to become drowsy, dizzy, or less alert
      than they are normally. Do not drive or do anything else that could be dangerous
      unless you know how this medicine affects you .
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up suddenly from a lying or sitting position. These symptoms are more likely
      to occur when you begin taking this medicine or when the dose is increased.
  - type: paragraph
    text: Parlodel® may increase your risk of having a condition called retroperitoneal
      fibrosis. This is more likely to occur if you are receiving this medicine on
      high doses and have been using it for a long time. Check with your doctor if
      you have continuing or severe stomach pain, increased frequency of urination,
      continuing loss of appetite, lower back pain, continuing or severe nausea and
      vomiting, or weakness while taking this medicine.
  - type: paragraph
    text: 'It is very important to follow carefully any instructions from your health
      care team about taking Cycloset® :'
  - type: list
    ordered: false
    items:
    - Counseling—Other family members need to learn how to prevent side effects or
      help with side effects if they occur. Also, patients with diabetes may need
      special counseling about diabetes medicine dosing changes that might occur because
      of lifestyle changes, such as changes in exercise and diet. Furthermore, counseling
      on contraception and pregnancy may be needed because of the problems that can
      occur in patients with diabetes during pregnancy.
    - Travel—Keep your recent prescription and your medical history with you. Be prepared
      for an emergency as you would normally. Make allowances for changing time zones
      and keep your meal times as close as possible to your usual meal times.
    - In case of emergency—There may be a time when you need emergency help for a
      problem caused by your diabetes. You need to be prepared for these emergencies.
      It is a good idea to wear a medical identification (ID) bracelet or neck chain
      at all times. Also, carry an ID card in your wallet or purse that says you have
      diabetes and a list of all of your medicines.
  - type: paragraph
    text: Too much Cycloset® can cause low blood sugar (hypoglycemia) when it is used
      under certain conditions. Symptoms of low blood sugar must be treated before
      they lead to unconsciousness (passing out). People may feel different symptoms
      of low blood sugar . It is important that you learn which symptoms of low blood
      sugar you usually have so you can treat it quickly. Talk to your doctor about
      the best way to treat low blood sugar.
  - type: paragraph
    text: Symptoms of low blood sugar include anxiety, behavior change similar to
      being drunk, blurred vision, cold sweats, confusion, cool, pale skin, difficulty
      in thinking, drowsiness, excessive hunger, fast heartbeat, headache (continuing),
      nausea, nervousness, nightmares, restless sleep, shakiness, slurred speech,
      or unusual tiredness or weakness.
  - type: paragraph
    text: If symptoms of low blood sugar occur, eat glucose tablets or gel, corn syrup,
      honey, or sugar cubes, or drink fruit juice, non-diet soft drink, or sugar dissolved
      in water. Also, check your blood for low blood sugar. Glucagon is used in emergency
      situations when severe symptoms such as seizures or unconsciousness occur. Have
      a glucagon kit available, along with a syringe or needle, and know how to use
      it. Members of your household also should know how to use it.
  - type: paragraph
    text: High blood sugar may occur if you do not exercise as much as usual, have
      a fever or infection, do not take enough or skip a dose of your diabetes medicine,
      or overeat or do not follow your meal plan.
  - type: paragraph
    text: If symptoms of high blood sugar occur, check your sugar level and then call
      your doctor for instructions .
  - type: paragraph
    text: Bromocriptine may cause dryness of the mouth. For temporary relief, use
      sugarless candy or gum, melt bits of ice in your mouth, or use a saliva substitute.
      However, if dry mouth continues for more than 2 weeks, check with your medical
      doctor or dentist. Continuing dryness of the mouth may increase the chance of
      dental disease, including tooth decay, gum disease, and fungus infections.
  - type: paragraph
    text: It may take several weeks for bromocriptine to work. Do not stop taking
      this medicine or reduce the amount you are taking without first checking with
      your doctor . Your doctor may want you to gradually reduce the amount you are
      using before stopping completely. This will decrease your chance of having withdrawal
      symptoms including anxiety, depression, difficulty in breathing, fast heartbeat,
      high fever, high or low blood pressure, lack of feeling or emotion, loss of
      bladder control, seizures, severe muscle stiffness, sweating, trouble sleeping,
      unusually pale skin, or unusual tiredness or weakness.
  - type: paragraph
    text: Drinking alcohol while you are taking bromocriptine may cause you to have
      a certain reaction. Avoid alcoholic beverages until you have discussed this
      with your doctor. Some of the symptoms you may have if you drink any alcohol
      while you are taking this medicine are blurred vision, chest pain, confusion,
      fast or pounding heartbeat, flushing or redness of the face, nausea, severe
      weakness, sweating, throbbing headache, or vomiting.
  - type: paragraph
    text: Some people who have used this medicine had unusual changes in their behavior.
      Talk with your doctor right away if you start having unusual urges, such as
      gambling, compulsive shopping, or increased sex drive while using this medicine.
  - type: paragraph
    text: It is important that your doctor check you for melanoma (skin cancer) regularly
      if you have Parkinson's disease.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain or discomfort
      - difficulty in speaking
      - dizziness or lightheadedness, especially when getting up suddenly from a lying
        or sitting position
      - double vision
      - feeling, seeing, or hearing things that are not there
      - feeling of constant movement of self or surroundings
      - feeling that others are watching you or controlling your behavior
      - feeling that others can hear your thoughts
      - headache
      - inability to move the arms, legs, or facial muscles
      - inability to speak
      - lack or loss of strength
      - nausea
      - nervousness
      - pain or discomfort in the arms, jaw, back, or neck
      - pounding in the ears
      - sensation of spinning
      - severe mood or mental changes
      - shakiness and unsteady walk
      - slow or fast heartbeat
      - slow speech
      - sweating
      - trouble breathing
      - trouble sleeping
      - unsteadiness, trembling, or other problems with muscle control or coordination
      - unusual behavior
      - vomiting
    subsections: []
  - heading: Less common—reported more often in patients with Parkinson's disease
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - uncontrolled movements of the body, such as the face, tongue, arms, hands,
        head, and upper body
    subsections: []
  - heading: Rare—reported more often in patients taking large doses
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Increased frequency of urination
      - loss of appetite, continuing
      - lower back pain
      - runny nose, continuing
      - stomach pain, continuing or severe
      - weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bloody vomit
      - fainting
      - nausea
      - nervousness
      - seizures
      - sudden weakness
      - temporary blindness
      - unusual headache
      - vomiting, continuing or severe
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - anxiety
      - blue or pale skin
      - chest pain, possibly moving to the left arm, neck, or shoulder
      - chills
      - constipation
      - continuing ringing or buzzing or other unexplained noise in the ears
      - cough
      - diarrhea
      - difficulty in speaking
      - double vision
      - false beliefs that cannot be changed by facts
      - fever
      - headache
      - hearing loss
      - heartburn
      - high fever
      - high or low blood pressure
      - inability to move the arms, legs, or facial muscles
      - inability to speak
      - increased in sexual ability, desire, drive, or performance
      - increased interest in sexual intercourse
      - increased frequency of urination
      - indigestion
      - loss of bladder control
      - lower back pain
      - severe muscle stiffness
      - stuffy nose
      - unusual tiredness or weakness
      - unusually pale skin
      - vomiting of blood or material that looks like coffee grounds
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Drowsiness
      - dry mouth
      - leg cramps at night
      - loss of appetite
      - mental depression
      - stomach pain
      - tingling or pain in the fingers and toes when exposed to cold temperatures
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hair loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
    - type: paragraph
      text: 'Drug information provided by: Merative, Micromedex®'
