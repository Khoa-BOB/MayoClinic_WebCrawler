title: Cysteine (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Nouress
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cysteine injection is used to meet the nutritional requirements of newborn
      infants (including preterm babies) requiring total parenteral nutrition (TPN).
  - type: paragraph
    text: Cysteine injection is also given to adults and children with severe liver
      disease who may have impaired enzymatic processes and require TPN. This medicine
      may be also used to provide a more complete profile of amino acids for protein
      synthesis.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of cysteine injection in children.
        However, children are more likely to have immature kidney and liver functions,
        which may require caution in patients receiving this medicine.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of cysteine
        injection have not been performed in the geriatric population. Safety and
        efficacy have not been established.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Acid-base imbalance or
      - Electrolyte imbalance��Should be corrected first before receiving this medicine.
    - type: list
      ordered: false
      items:
      - Acidosis (caused by low cardiac output) or
      - Amino acid metabolism, inborn error or
      - Pulmonary edema (fluid in the lungs)—Should not be used in patients with these
        conditions.
    - type: list
      ordered: false
      items:
      - Gallstones or
      - Hyperammonemia (high ammonia levels in the blood) or
      - Liver disease—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Giving this medicine for a long time in preterm babies may
        increase risk for aluminum toxicity.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this medicine. Cysteine is added to your or your baby's TPN bag. After mixing,
      it is given through a needle placed in one of your or your baby's veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your or your child's progress closely while you are
      receiving this medicine . This will allow your doctor to see if the medicine
      is working properly. Blood and urine tests will be needed to check for unwanted
      effects.
  - type: paragraph
    text: Tell your doctor right away if you or your child have chest pain, cough,
      fainting, fast heartbeat, trouble breathing, or dizziness or lightheadedness
      after receiving this medicine. These could be symptoms of pulmonary embolism
      caused by the precipitates found in the TPN solution, infusion set, and catheter.
  - type: paragraph
    text: Tell your doctor if you or your child develop pain, tenderness, changes
      in skin color, or swelling of foot or leg after receiving this medicine. These
      could be symptoms of a vein damage or thrombophlebitis.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - chest pain
      - confusion cough
      - dizziness or lightheadedness
      - drowsiness
      - fainting
      - fast heartbeat
      - feeling of warmth
      - fever
      - muscle tremors
      - nausea
      - pain, tenderness, or swelling of the foot or leg
      - rapid, deep breathing
      - redness of the face, neck, arms, and occasionally, upper chest
      - restlessness
      - stomach cramps
      - sudden shortness of breath or troubled breathing
      - unusual tiredness or weakness
      - warmth, redness, pain, or changes in skin color at the infusion site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
