    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Glucose-6-phosphate dehydrogenase (G6PD) deficiency (a hereditary metabolic
        disorder affecting red blood cells)—Should not be used in patients with this
        condition.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. This medicine is given through a needle placed in one of your
      veins. The medicine must be injected slowly, so your IV tube will need to stay
      in place for 5 to 30 minutes.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your progress closely while you are receiving this
      medicine . This will allow your doctor to see if the medicine is working properly.
      Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening require immediate medical attention. Check with
      your doctor right away if you have cough, difficulty swallowing, dizziness,
      fast heartbeat, rash, itching, trouble breathing, or unusual tiredness or weakness
      after using this medicine.
  - type: paragraph
    text: This medicine may cause a condition called serotonin syndrome when used
      together with some medicines (eg, SSRIs, TCAs, MAOIs). Check with your doctor
      right away if you have anxiety, restlessness, fast heartbeat, fever, sweating,
      muscle spasms, twitching, nausea, vomiting, diarrhea, seeing or hearing things
      that are not there.
  - type: paragraph
    text: Before you have any medical tests, tell the doctor in charge that you are
      using this medicine. The results of some tests may be affected by this medicine.
  - type: paragraph
    text: This medicine may cause dizziness, confusion, or trouble in seeing clearly.
      Make sure you know how you react to this medicine before you drive, use machines,
      or do other jobs that require you to be alert or able to see well .
  - type: paragraph
    text: This medicine may make your skin more sensitive to sunlight. Use a sunscreen
      when you are outdoors. Avoid sunlamps and tanning beds.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - bluish-colored lips, fingernails, or palms
      - chest tightness
      - confusion
      - cough
      - dark urine
      - diarrhea
      - difficulty breathing
      - difficulty swallowing
      - dizziness or lightheadedness
      - fast heartbeat
      - fever
      - headache
      - hives or welts, itching, or skin rash
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - overactive reflexes
      - pale skin
      - poor coordination
      - rapid heart rate
      - redness of the skin
      - restlessness
      - shivering
      - sore throat
      - sweating
      - talking or acting with excitement you cannot control
      - trembling or shaking
      - twitching
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bigger, dilated, or enlarged pupils (black part of the eye)
      - blue staining of the urine, skin, and mucous membranes
      - bluish-colored lips, fingernails, or palms
      - blurred vision
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chest tightness
      - confusion
      - dark urine
      - difficulty breathing
      - dizziness or lightheadedness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fear
      - fever
      - headache
      - increased sensitivity of the eyes to light
      - nausea
      - pale skin
      - rapid heart rate
      - rapid shallow breathing
      - shakiness in the legs, arms, hands, or feet
      - sore throat
      - stomach pain
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm or leg pain
      - change in taste
      - changes in skin color
      - feeling hot or cold
      - increased sweating
      - loss of taste
      - muscle or joint pain
      - pain at the infusion site
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - bruising
      - chills
      - general feeling of discomfort or illness
      - large, flat, blue or purplish patches in the skin
      - loss of appetite
      - muscle aches and pains
      - muscle spasm
      - runny nose
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
