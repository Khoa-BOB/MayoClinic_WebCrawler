title: Resorcinol (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: DiabetAid Anti-Itch
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Resorcinol is used to treat acne, seborrheic dermatitis, eczema, psoriasis,
      and other skin disorders. It is also used to treat corns, calluses, and warts.
  - type: paragraph
    text: Resorcinol works by helping to remove hard, scaly, or roughened skin.
  - type: paragraph
    text: Some of these preparations are available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Cream
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Resorcinol may be absorbed through the skin and should not be used on
        large areas of the bodies of infants and children. In addition, resorcinol
        should not be used on wounds, since doing so may cause a blood disease called
        methemoglobinemia.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of resorcinol
        in the elderly with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine only as directed. Do not
      use more of it, do not use it more often, and do not use it for a longer time
      than your doctor ordered. To do so may increase the chance of absorption through
      the skin and the chance of resorcinol poisoning.
  - type: paragraph
    text: Apply enough resorcinol to cover the affected areas, and rub in gently.
  - type: paragraph
    text: Immediately after using this medicine, wash your hands to remove any medicine
      that may be on them.
  - type: paragraph
    text: Keep this medicine away from the eyes. If you should accidentally get some
      in your eyes, flush them thoroughly with water.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For lotion dosage form: For acne, seborrheic dermatitis, eczema, or psoriasis:
        Adults and children—Use as needed.'
      - 'For ointment dosage form: For acne, seborrheic dermatitis, eczema, psoriasis,
        corns, calluses, or warts: Adults and children—Use and dose must be determined
        by the doctor.'
    - type: list
      ordered: false
      items:
      - 'For acne, seborrheic dermatitis, eczema, or psoriasis: Adults and children—Use
        as needed.'
    - type: list
      ordered: false
      items:
      - Adults and children—Use as needed.
    - type: list
      ordered: false
      items:
      - 'For acne, seborrheic dermatitis, eczema, psoriasis, corns, calluses, or warts:
        Adults and children—Use and dose must be determined by the doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children—Use and dose must be determined by the doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: 'When using resorcinol, do not use any of the following preparations on
      the same affected area as this medicine, unless otherwise directed by your doctor:'
  - type: list
    ordered: false
    items:
    - Abrasive soaps or cleansers
    - Alcohol-containing preparations
    - Any other topical acne preparation or preparation containing a peeling agent
      (for example, benzoyl peroxide, salicylic acid, sulfur, or tretinoin [vitamin
      A acid])
    - Cosmetics or soaps that dry the skin
    - Medicated cosmetics
    - Other topical medicine for the skin
  - type: paragraph
    text: To use any of the above preparations on the same affected area as resorcinol
      may cause severe irritation of the skin.
  - type: paragraph
    text: This medicine may darken light-colored hair.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin irritation not present before use of this medicine
    subsections: []
  - heading: Symptoms of resorcinol poisoning
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea, nausea, stomach pain, or vomiting
      - dizziness
      - drowsiness
      - headache (severe or continuing)
      - nervousness or restlessness
      - slow heartbeat, shortness of breath, or troubled breathing
      - sweating
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Redness and peeling of skin (may occur after a few days)
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
