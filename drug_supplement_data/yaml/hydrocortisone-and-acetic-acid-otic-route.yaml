title: Hydrocortisone and acetic acid (otic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Acetasol HC
    - type: paragraph
      text: Vosol HC
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Corticosteroid and acetic acid combinations are used to treat certain problems
      of the ear canal. They also help relieve the redness, itching, and swelling
      that may accompany these conditions.
  - type: paragraph
    text: These medicines may also be used for other conditions as determined by your
      doctor.
  - type: paragraph
    text: Corticosteroid and acetic acid combinations are available only with your
      doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: There is no specific information comparing the use of otic corticosteroids
        in children under 3 years of age with use in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing the use of otic corticosteroids
        in the elderly with use in other age groups, they are not expected to cause
        different side effects or problems in older people than they do in younger
        adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Desmopressin
      - Mifepristone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Aldesleukin
      - Apalutamide
      - Aspirin
      - Atazanavir
      - Avacopan
      - Balofloxacin
      - Balsalazide Disodium
      - Bemiparin
      - Besifloxacin
      - Bupropion
      - Carbamazepine
      - Ciprofloxacin
      - Clarithromycin
      - Cobicistat
      - Conivaptan
      - Cosyntropin
      - Cyclosporine
      - Darunavir
      - Desogestrel
      - Dienogest
      - Drospirenone
      - Enoxacin
      - Estetrol
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Fedratinib
      - Fexinidazole
      - Fleroxacin
      - Flumequine
      - Fosnetupitant
      - Fosphenytoin
      - Gatifloxacin
      - Gemifloxacin
      - Gestodene
      - Insulin Aspart, Recombinant
      - Itraconazole
      - Lenacapavir
      - Letermovir
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Alcuronium
      - Atracurium
      - Auranofin
      - Colestipol
      - Gallamine
      - Hexafluorenium
      - Licorice
      - Metocurine
      - Rifapentine
      - Rotavirus Vaccine, Live
      - Saiboku-To
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Any other ear infection or condition—Otic corticosteroids may worsen existing
        infections or cause new infections
    - type: list
      ordered: false
      items:
      - Punctured ear drum—Using otic corticosteroids when you have a punctured ear
        drum may damage the ear
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: 'To use:'
  - type: list
    ordered: false
    items:
    - Lie down or tilt the head so that the affected ear faces up. Gently pull the
      ear lobe up and back for adults (down and back for children) to straighten the
      ear canal. Drop the medicine into the ear canal. Keep the ear facing up for
      several (about 5) minutes to allow the medicine to run to the bottom of the
      ear canal. A sterile cotton plug may be gently inserted into the ear opening
      to prevent the medicine from leaking out. At first, your doctor may want you
      to put more medicine on the cotton plug during the day to keep it moist.
  - type: paragraph
    text: To keep the medicine as germ-free as possible, avoid touching the dropper
      or applicator tip to any surface as much as possible (including the ear). Also,
      always keep the container tightly closed.
  - type: paragraph
    text: 'For patients using hydrocortisone and acetic acid ear drops:'
  - type: list
    ordered: false
    items:
    - Do not wash the dropper or applicator tip, because water may get into the medicine
      and make it weaker. If necessary, you may wipe the dropper or applicator tip
      with a clean tissue.
  - type: paragraph
    text: Do not use corticosteroids more often or for a longer time than your doctor
      ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: Do not use any leftover medicine for future ear problems without first checking
      with your doctor. This medicine should not be used if certain kinds of infections
      are present. To do so may make the infection worse.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    subsections: []
  - heading: For hydrocortisone and acetic acid
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - 'For ear drops dosage form: For ear infections: Adults and children over 3
        years of age—Use 3 to 5 drops in the affected ear every four to six hours
        for the first twenty-four hours, then 5 drops three to four times daily. Children
        under 3 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For ear infections: Adults and children over 3 years of age—Use 3 to 5 drops
        in the affected ear every four to six hours for the first twenty-four hours,
        then 5 drops three to four times daily. Children under 3 years of age—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children over 3 years of age—Use 3 to 5 drops in the affected ear
        every four to six hours for the first twenty-four hours, then 5 drops three
        to four times daily.
      - Children under 3 years of age—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    - type: paragraph
      text: Do not stop treatment abruptly.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your condition does not improve within 5 to 7 days, or if it becomes
      worse, check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anorexia, weakness, weight loss (in children)
      - stinging, itching, irritation, or burning of the ear
    - type: paragraph
      text: There have not been any other side effects reported with this medicine.
        However, if you notice any other effects, check with your doctor.
