    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: The mixed oral liquid should be kept in the refrigerator or at room temperature
        and used within 14 days. Do not freeze.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: If your or your child's symptoms do not improve, or if they become worse,
      check with your doctor. Continue to take this medicine as directed.
  - type: paragraph
    text: You or your child should not use erythromycin (Ery-Tab®), pimozide (Orap®),
      or quinidine (Cardioquin®) while using this medicine because of the risk of
      unwanted side effects.
  - type: paragraph
    text: Using this medicine for a long time or using it too much while you are pregnant
      (especially during the first trimester) can harm your unborn baby. Use an effective
      form of birth control during treatment with this medicine and for at least 1
      week after the last dose. If you think you have become pregnant while using
      this medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may rarely cause serious liver problems. Check with your doctor
      right away if you or your child have stomach pain or tenderness, clay-colored
      stools, dark urine, decreased appetite, fever, headache, itching, loss of appetite,
      nausea and vomiting, skin rash, swelling of the feet or lower legs, unusual
      tiredness or weakness, or yellow eyes or skin.
  - type: paragraph
    text: This medicine may rarely cause a serious type of allergic reaction called
      anaphylaxis, which can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you or your child have a rash, itching, hives,
      hoarseness, trouble with breathing, trouble with swallowing, or any swelling
      of your hands, face, or mouth while you are using this medicine.
  - type: paragraph
    text: Serious skin reactions can occur in certain people during treatment with
      this medicine. Check with your doctor right away if you or your child start
      having a skin rash, itching, or any other skin changes while using this medicine.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you or anyone in your family has ever
      had a heart rhythm problem including QT prolongation.
  - type: paragraph
    text: This medicine may cause adrenal gland problems. Check with your doctor right
      away if you have darkening of the skin, diarrhea, dizziness, fainting, loss
      of appetite, mental depression, nausea, skin rash, unusual tiredness or weakness,
      or vomiting.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, drowsy, or less alert
      than they are normally. Do not drive or do anything else that could be dangerous
      until you know how this medicine affects you .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - chills
      - clay-colored stools
      - cough
      - dark urine
      - diarrhea
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - fever
      - headache
      - hives, itching, or skin rash
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - light-colored stools
      - loss of appetite
      - nausea
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - stomach pain, continuing
      - unpleasant breath odor
      - unusual tiredness or weakness
      - upper right abdominal or stomach pain
      - vomiting
      - vomiting of blood
      - yellow eyes and skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blistering, peeling, or loosening of the skin
      - chest pain or discomfort
      - decreased urine
      - dry mouth
      - fainting
      - hoarseness
      - increased thirst
      - irregular or slow heart rate
      - joint or muscle pain
      - loss of bladder control
      - lower back or side pain
      - mood changes
      - muscle pain or cramps
      - muscle spasm or jerking of the arms and legs
      - numbness or tingling in the hands, feet, or lips
      - painful or difficult urination
      - pale skin
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - seizures
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - sudden loss of consciousness
      - swollen glands
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fearfulness, suspiciousness, or other mental changes
      - seeing, hearing, or feeling things that are not there
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - change in taste or bad, unusual, or unpleasant (after) taste
      - heartburn
      - indigestion
      - stomach discomfort or upset
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hair loss or thinning of the hair
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
