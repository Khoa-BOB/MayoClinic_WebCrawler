    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Electrolyte problems (mineral imbalance) or
      - Heart disease—Use with caution. These conditions may increase your risk of
        having heart rhythm problems and make the effects of this medicine worse.
    - type: list
      ordered: false
      items:
      - Fructose malabsorption (rare hereditary problem) or
      - Glucose-galactose malabsorption (rare hereditary problem) or
      - Sucrase-isomaltase deficiency (rare hereditary problem)—Should not be used
        in patients with these conditions. Oral liquid contains sucrose (table sugar).
    - type: list
      ordered: false
      items:
      - Heart rhythm problems (eg, QT prolongation) or
      - Liver disease—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you feel
      better after the first few doses. Your infection may not clear up if you stop
      using the medicine too soon.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Shake the oral liquid well before each use. Measure the medicine with a
      marked measuring spoon, oral syringe, or medicine cup. The average household
      teaspoon may not hold the right amount of liquid.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (suspension or tablets): For cryptococcal meningitis:
        Adults—400 milligrams (mg) on the first day, followed by 200 mg once a day
        for at least 10 to 12 weeks. Your doctor may adjust your dose as needed. Children
        6 months to 13 years of age—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 12 milligrams (mg) per kilogram (kg) of
        body weight on the first day, followed by 6 mg per kg of body weight once
        a day, for at least 10 to 12 weeks. Children younger than 6 months of age—Use
        and dose must be determined by your doctor. For esophageal candidiasis: Adults—200
        milligrams (mg) on the first day, followed by 100 mg once a day for at least
        3 weeks. Your doctor may increase your dose as needed. Children 6 months to
        13 years of age—Dose is based on body weight and must be determined by your
        doctor. The dose is usually 6 milligrams (mg) per kilogram (kg) of body weight
        on the first day, followed by 3 mg per kg of body weight once a day, for at
        least 3 weeks. Children younger than 6 months of age—Use and dose must be
        determined by your doctor. For oropharyngeal candidiasis: Adults—200 milligrams
        (mg) on the first day, followed by 100 mg once a day for at least 2 weeks.
        Children 6 months to 13 years of age—Dose is based on body weight and must
        be determined by your doctor. The dose is usually 6 milligrams (mg) per kilogram
        (kg) of body weight on the first day, followed by 3 mg per kg of body weight
        once a day, for at least 2 weeks. Children younger than 6 months of age—Use
        and dose must be determined by your doctor. For other infections that may
        occur in different parts of the body: Adults—Doses of up to 400 milligrams
        (mg) per day. Children 3 months of age and older—Dose is based on body weight
        and must be determined by your doctor. The dose is usually 25 milligrams (mg)
        per kilogram (kg) of body weight on the first day, followed by 12 mg per kg
        of body weight once a day. Children from birth to 3 months postnatal and 30
        weeks gestational age and older—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 25 mg per kg of body weight on the first
        day, followed by 12 mg per kg of body weight once a day, for at least 3 weeks.
        Children from birth to 3 months postnatal and younger than 30 weeks gestational
        age—Dose is based on body weight and must be determined by your doctor. The
        dose is usually 25 mg per kg of body weight on the first day, followed by
        9 mg per kg of body weight once a day, for at least 3 weeks. For prevention
        of candidiasis during bone marrow transplantation: Adults—400 milligrams (mg)
        once a day. Children—Use and dose must be determined by your doctor. For urinary
        tract infections or peritonitis: Adults—50 to 200 milligrams (mg) per day.
        Children—Use and dose must be determined by your doctor. For vaginal candidiasis:
        Adults—150 milligrams (mg) once a day. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For cryptococcal meningitis: Adults—400 milligrams (mg) on the first day,
        followed by 200 mg once a day for at least 10 to 12 weeks. Your doctor may
