title: Fluconazole (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Diflucan
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: CanesOral
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fluconazole is used to treat serious fungal or yeast infections, including
      vaginal candidiasis, oropharyngeal candidiasis (thrush, oral thrush), esophageal
      candidiasis (candida esophagitis), other candida infections (including urinary
      tract infections, peritonitis [inflammation of the lining of the stomach], and
      infections that may occur in different parts of the body), or fungal (cryptococcal)
      meningitis. It is also used in children on life support called extracorporeal
      membrane oxygenation (ECMO). This medicine works by killing the fungus or yeast,
      or preventing its growth.
  - type: paragraph
    text: Fluconazole is also used to prevent candidiasis in patients having bone
      marrow transplants who receive cancer or radiation treatment.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of fluconazole for the treatment
        of oropharyngeal candidiasis in children 6 months to 13 years of age, for
        the treatment of esophageal candidiasis, other candida infections, or fungal
        (cryptococcal) meningitis in children, and for children on ECMO . Safety and
        efficacy have been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of fluconazole in the elderly. However,
        elderly patients are more likely to have age-related kidney problems, which
        may require an adjustment in the dose for patients receiving fluconazole.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
