    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Throw away any unopened vials that are left at room temperature for more
        than 12 hours.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine commonly causes flu-like reactions, with aching muscles, fever
      and chills, and headache. Follow your doctor's instructions carefully about
      taking your temperature, and how much and when to take the acetaminophen to
      treat fever and pain.
  - type: paragraph
    text: This medicine may cause dizziness, decreased mental status, clumsiness,
      or trouble walking. Do not drive or do anything else that could be dangerous
      until you know how this medicine affects you .
  - type: paragraph
    text: 'Actimmune® can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. It can also lower the
      number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis.
      Tell your doctor right away if you have a rash, itching, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you change in how much or how often
      you urinate, lower back or side pain, difficult or painful urination.
  - type: paragraph
    text: The stopper of the vial contains natural rubber (a derivative of latex),
      which may cause allergic reactions in people who are sensitive to latex. Tell
      your doctor if you have a latex allergy before you start using this medicine.
  - type: paragraph
    text: While you are being treated with Actimmune® and after you stop using it,
      do not have any vaccines without your doctor's approval. Actimmune® may lower
      your body's resistance and there is a chance you might get the infection the
      immunization is meant to prevent.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - fever
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - confusion
      - cough or hoarseness
      - loss of balance control
      - lower back or side pain
      - mask-like face
      - painful or difficult urination
      - pinpoint red spots on the skin
      - shuffling walk
      - sore throat
      - stiffness of the arms or legs
      - trembling and shaking of the hands and fingers
      - trouble breathing
      - trouble speaking or swallowing
      - trouble thinking or concentrating
      - trouble walking
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain or tenderness
      - change in walking and balance
      - clay colored stools
      - clumsiness or unsteadiness
      - dark urine
      - decreased appetite
      - decreased frequency or amount of urine
      - general feeling of discomfort or illness
      - headache
      - increased thirst
      - itching or skin rash
      - joint or muscle pain
      - loss of appetite
      - lower back or side pain
      - muscle aches and pains
      - nausea and vomiting
      - numbness or tingling of the face, hands, or feet
      - painful or difficult urination
      - pale skin
      - redness and soreness of the eyes
      - runny nose
      - shivering skin
      - sweating
      - swelling of the face, fingers, or lower legs
      - trouble sleeping
      - weight gain
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - redness or tenderness at the injection site
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - dizziness
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
