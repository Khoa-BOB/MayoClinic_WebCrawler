title: Interferon gamma-1b (injection route, subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Actimmune
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Interferon gamma-1b injection is used to lower the frequency and severity
      of serious infections caused by chronic granulomatous disease (CGD). It is also
      used to slow down the progression of severe, malignant osteopetrosis (SMO).
      Interferon gamma-1b is a man-made version of a substance naturally produced
      by cells in the body to help fight infections and tumors.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Actimmune® to treat CGD in children
        1 year of age and older, and to treat SMO in children 1 month and older. However,
        safety and efficacy have not been established in children to treat CGD younger
        than 1 year of age, and in newborns with SMO.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Actimmune® in the elderly. However,
        elderly patients are more likely to have age-related kidney, liver, or heart
        problems, which may require caution and an adjustment in the dose for patients
        receiving Actimmune®.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Arrhythmia (heart rhythm problem) or
      - Congestive heart failure or
      - Heart disease (eg, ischemia) or
      - Nervous system problems, or history of or
      - Seizures—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine is given as a shot under your skin, usually in the right and
      left upper arms, or thighs.
  - type: paragraph
    text: 'Each package of interferon gamma-1b contains a patient instruction sheet.
      Read this sheet carefully and make sure you understand:'
  - type: list
    ordered: false
    items:
    - How to prepare the injection.
    - Proper use of disposable syringes.
    - How to give the injection.
    - How long the injection is stable.
  - type: paragraph
    text: If you have any questions about any of this, check with your doctor.
  - type: paragraph
    text: You will be shown the body areas where this shot can be given. Use a different
      body area each time you give yourself a shot. Keep track of where you give each
      shot to make sure you rotate body areas. This will help prevent skin problems
      from the injections.
  - type: paragraph
    text: Use each vial only one time. Do not save an open vial. If the medicine in
      the vial has changed color, or if you see particles in it, do not use it. Do
      not shake it.
  - type: paragraph
    text: Do not mix it with other medicines in the same syringe.
  - type: paragraph
    text: You may have fewer side effects (headache, fever, or muscle aches) if you
      give yourself the shot just before bedtime. Ask your doctor if you can take
      acetaminophen to prevent or relieve side effects.
  - type: paragraph
    text: Throw away used needles in a hard, closed container that the needles cannot
      poke through. Keep this container away from children and pets.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: For chronic granulomatous disease: Adults and
        children 1 year of age and older—Dose is based on body size and must be determined
        by your doctor. For patients with more than 0.5 square meter (m[2]) of body
        size: The dose is 50 microgram (mcg) per square meter (m[2]) of body size
        injected under your skin 3 times every week. For patients with less than or
        equal to 0.5 square meter (m[2]) of body size: The dose is 1.50 microgram
        (mcg) per kilogram (kg) of body size injected under your skin 3 times every
        week. Children younger than 1 year of age—Use and dose must be determined
