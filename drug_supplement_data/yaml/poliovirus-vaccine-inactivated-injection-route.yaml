title: Poliovirus vaccine, inactivated (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ipol
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Poliovirus vaccine is an active immunizing agent used to prevent poliomyelitis
      (polio). It works by causing your body to produce its own protection (antibodies)
      against the virus that causes polio.
  - type: paragraph
    text: There are two types of polio vaccine that are given by injection, poliovirus
      vaccine inactivated (IPV) and poliovirus vaccine inactivated enhanced potency
      (eIPV). In the U.S. and Canada, the type of vaccine that is given by injection
      is eIPV. The type of vaccine that is given by mouth is called poliovirus vaccine
      live oral (OPV).
  - type: paragraph
    text: Polio is a very serious infection that causes paralysis of the muscles,
      including the muscles that enable you to walk and breathe. A polio infection
      may leave a person unable to breathe without the help of an iron lung, unable
      to walk without leg braces, or confined to a wheelchair. There is no cure for
      polio.
  - type: paragraph
    text: 'Immunization against polio is recommended for all infants from 6 to 12
      weeks of age, all children, all adolescents up to 18 years of age, and certain
      adults who are at greater risk for exposure to polioviruses than the general
      population, including:'
  - type: list
    ordered: false
    items:
    - Persons traveling to areas or countries where polio is uncontrolled, whether
      or not they have been vaccinated against polio in the past.
    - Persons who live in areas where polio infection still occurs.
    - Adults who have not been vaccinated or who have not had the complete series
      of vaccinations against polio and who live in households with children who are
      to be given the oral polio vaccine (OPV).
    - Employees in day-care centers and group homes for children, such as orphanages.
    - Employees in medical facilities, such as hospitals and doctors' offices.
    - Laboratory workers handling samples that may contain polio viruses.
  - type: paragraph
    text: Immunization against polio is not recommended for infants younger than 6
      weeks of age, because antibodies they received from their mothers before birth
      may interfere with the effectiveness of the vaccine. Infants who were immunized
      against polio before 6 weeks of age should receive the complete polio immunization
      series.
  - type: paragraph
    text: This vaccine is to be administered only by or under the supervision of your
      doctor or other health care professional.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  - type: paragraph
    text: For a while after you are immunized, there is a very small risk (1 in 2.2
      million) that any persons living in your household who have not yet been immunized
      against polio or who have or had an immune deficiency condition may develop
      poliomyelitis (polio) from being around you. Talk to your doctor if you have
      any questions about this.
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use is not recommended for infants up to 6 weeks of age. For infants and
        children 6 weeks of age and older, polio vaccine is not expected to cause
        different side effects or problems than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of polio vaccine
        in the elderly with use in other age groups, this vaccine is not expected
        to cause different side effects or problems in older persons than it does
        in younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atidarsagene Autotemcel
      - Elivaldogene Autotemcel
      - Ocrelizumab
      - Teplizumab-mzwv
      - Ublituximab-xiiy
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diarrhea or
      - Virus infection or
      - Vomiting—These conditions may reduce the useful effect of the vaccine.
    - type: list
      ordered: false
      items:
      - Fever or
      - Illness (moderate or severe) or
      - Weakness (severe)—The symptoms of these conditions may be confused with possible
        side effects of the vaccine.
    - type: list
      ordered: false
      items:
      - Immune deficiency condition, family history of—May increase the chance of
        side effects with the vaccine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this vaccine in a hospital. This vaccine is given as a shot into your muscle
      or under your skin.
  - type: paragraph
    text: In children, a total of 4 shots of polio vaccine are given. The shots are
      usually given at 2 months, 4 months, 6 to 18 months, and 4 to 6 years of age.
      Each dose of this vaccine is usually given at least 4 weeks apart. The first
      dose of this vaccine may be given to infants 6 weeks of age.
  - type: paragraph
    text: This vaccine needs to be given on a fixed schedule. If you or your child
      miss a scheduled shot, call your doctor to make another appointment as soon
      as possible.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Tell your doctor that you have received this vaccine if you plan to get
      any live virus vaccines within 1 month after receiving this vaccine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Symptoms of allergic reaction
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with breathing or swallowing
      - hives
      - itching, especially of the feet or hands
      - reddening of the skin, especially around ears
      - swelling of the eyes, face, or inside of the nose
      - unusual tiredness or weakness (sudden and severe)
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever over 102° F (39° C)
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Irritability
      - loss of appetite
      - tiredness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Itching or skin rash
      - redness, soreness, hard lump, tenderness, or pain at the place of injection
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
