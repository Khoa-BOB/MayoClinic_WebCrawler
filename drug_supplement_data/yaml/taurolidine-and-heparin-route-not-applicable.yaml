title: Taurolidine and heparin (route not applicable)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Defencath
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Taurolidine and heparin combination is used to reduce the incidence of catheter-related
      bloodstream infections (CRBSI) in patients with kidney failure receiving hemodialysis.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Defencath® in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Defencath® in the elderly.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Defibrotide
      - Oritavancin
      - Telavancin
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abciximab
      - Aceclofenac
      - Acemetacin
      - Alipogene Tiparvovec
      - Alprostadil
      - Alteplase, Recombinant
      - Amtolmetin Guacil
      - Anagrelide
      - Anistreplase
      - Antithrombin, Recombinant
      - Apixaban
      - Argatroban
      - Aspirin
      - Bemiparin
      - Betrixaban
      - Bivalirudin
      - Bromfenac
      - Bufexamac
      - Cangrelor
      - Caplacizumab-yhdp
      - Cefamandole
      - Cefoperazone
      - Celecoxib
      - Chamomile
      - Choline Salicylate
      - Cilostazol
      - Citalopram
      - Clonixin
      - Clopidogrel
      - Collagenase, Clostridium histolyticum
      - Curcumin
      - Dabigatran Etexilate
      - Dalteparin
      - Danaparoid
      - Desvenlafaxine
      - Dexibuprofen
      - Dexketoprofen
      - Dextran
      - Diclofenac
      - Diflunisal
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Chondroitin
      - Coenzyme Q10
      - Dong Quai
      - Ginger
      - Palifermin
      - Vitamin A
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Avocado
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to pork products or
      - Thrombocytopenia (low number of platelets), heparin-induced—Should not be
        used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital or clinic. This medicine is a catheter lock solution. It is given
      through your central venous catheter.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: This medicine lowers the number of some types of blood cells in your body.
      Because of this, you may bleed or bruise more easily. To help with these problems,
      stay away from rough sports or other situations where you could be bruised,
      cut, or injured. Brush and floss your teeth gently. Be careful when using sharp
      objects, including razors and fingernail clippers.
  - type: paragraph
    text: This medicine may cause serious allergic reactions which can be life-threatening
      and require immediate medical attention. Check with your doctor right away if
      you have difficulty in breathing or swallowing, fast heartbeat, skin itching,
      rash, or redness, or swelling of the face, throat, or tongue after receiving
      this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - blood in the eye
      - confusion
      - coughing up blood
      - difficulty in breathing or swallowing
      - dizziness
      - eye pain
      - headache
      - increased menstrual flow or vaginal bleeding
      - nausea and vomiting
      - nosebleeds
      - paralysis
      - prolonged bleeding from cuts
      - red or black, tarry stools
      - red or dark brown urine
      - redness in whites of the eyes
      - stroke
      - vomiting of blood or material that looks like coffee grounds
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bone, chest, or muscle pain
      - pinpoint red spots on the skin
      - unusual bleeding or bruising
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Irregular heartbeat
      - mood or mental changes
      - muscle cramps in the hands, arms, feet, legs, or face
      - numbness and tingling around the mouth, fingertips, or feet
      - seizures
      - stomach cramps
      - tremor
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change or loss of taste
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
