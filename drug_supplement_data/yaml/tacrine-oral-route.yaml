title: Tacrine (oral route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Tacrine is used to treat the symptoms of mild to moderate Alzheimer's disease.
      Tacrine will not cure Alzheimer's disease, and it will not stop the disease
      from getting worse. However, tacrine can improve thinking ability in some patients
      with Alzheimer's disease.
  - type: paragraph
    text: In Alzheimer's disease, many chemical changes take place in the brain. One
      of the earliest and biggest changes is that there is less of a chemical messenger
      called acetylcholine (ACh). ACh helps the brain to work properly. Tacrine slows
      the breakdown of ACh, so it can build up and have a greater effect. However,
      as Alzheimer's disease gets worse, there will be less and less ACh, so tacrine
      may not work as well.
  - type: paragraph
    text: Tacrine may cause liver problems. While taking this medicine, you must have
      blood tests regularly to see if the medicine is affecting your liver.
  - type: paragraph
    text: This medicine was available only with your doctor's prescription. Tacrine
      (Cognex®) was withdrawn from the US market in May 2012.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of tacrine in children with use in
        other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Studies on tacrine have been done only in middle-aged and older patients.
        Information on the effects of tacrine is based on these patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Viloxazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amifampridine
      - Bupropion
      - Capmatinib
      - Carbamazepine
      - Clomipramine
      - Diazoxide
      - Donepezil
      - Givosiran
      - Hydroxychloroquine
      - Pixantrone
      - Ritlecitinib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Estradiol
      - Fluvoxamine
      - Haloperidol
      - Levonorgestrel
      - Theophylline
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma (or history of) or
      - Heart problems, including slow heartbeat or hypotension (low blood pressure),
        or
      - Intestinal blockage or
      - Liver disease (or history of) or
      - Parkinson's disease or
      - Stomach ulcer (or history of) or
      - Urinary tract blockage or difficult urination—Tacrine may make these conditions
        worse
    - type: list
      ordered: false
      items:
      - Brain disease, other, or
      - Epilepsy or history of seizures or
      - Head injury with loss of consciousness—Tacrine may cause seizures
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor. Do not take more or
      less of it, and do not take it more or less often than your doctor ordered.
      Taking too much may increase the chance of side effects, while taking too little
      may not improve your condition.
  - type: paragraph
    text: Tacrine is best taken on an empty stomach (1 hour before or 2 hours after
      meals). However, if this medicine upsets your stomach, your doctor may want
      you to take it with food.
  - type: paragraph
    text: Tacrine seems to work best when it is taken at regularly spaced times, usually
      four times a day.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For treatment of Alzheimer''s disease: Adults—To
        start, 10 milligrams (mg) four times a day. Your doctor may increase your
        dose gradually if you are doing well on this medicine and your liver tests
        are normal. However, the dose is usually not more than 40 mg four times a
        day.'
    - type: list
      ordered: false
      items:
      - 'For treatment of Alzheimer''s disease: Adults—To start, 10 milligrams (mg)
        four times a day. Your doctor may increase your dose gradually if you are
        doing well on this medicine and your liver tests are normal. However, the
        dose is usually not more than 40 mg four times a day.'
    - type: list
      ordered: false
      items:
      - Adults—To start, 10 milligrams (mg) four times a day. Your doctor may increase
        your dose gradually if you are doing well on this medicine and your liver
        tests are normal. However, the dose is usually not more than 40 mg four times
        a day.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits.
      Also, you must have your blood tested every other week for at least the first
      4 to 16 weeks when you start using tacrine to see if this medicine is affecting
      your liver. If all of the blood tests are normal, you will still need regular
      testing, but then your doctor may decide to do the tests less often.
  - type: paragraph
    text: Tell your doctor if your symptoms get worse, or if you notice any new symptoms.
  - type: paragraph
    text: Before you have any kind of surgery, dental treatment, or emergency treatment,
      tell the medical doctor or dentist in charge that you are taking this medicine.
      Taking tacrine together with medicines that are sometimes used during surgery
      or dental or emergency treatments may increase the effects of these medicines.
  - type: paragraph
    text: Tacrine may cause some people to become dizzy, clumsy, or unsteady. Make
      sure you know how you react to this medicine before you do anything that could
      be dangerous if you are dizzy, clumsy, or unsteady.
  - type: paragraph
    text: Do not stop taking this medicine or decrease your dose without first checking
      with your doctor. Stopping this medicine suddenly or decreasing the dose by
      a large amount may cause mental or behavior changes.
  - type: paragraph
    text: If you think you or someone else may have taken an overdose of tacrine,
      get emergency help at once. Taking an overdose of tacrine may lead to seizures
      or shock. Some signs of shock are large pupils, irregular breathing, and fast
      weak pulse. Other signs of an overdose are severe nausea and vomiting, increasing
      muscle weakness, greatly increased sweating, and greatly increased watering
      of the mouth.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Some side effects will have signs or symptoms that you can see or feel. Your
      doctor may watch for others by doing certain tests
  - type: paragraph
    text: Tacrine may cause some serious side effects, including liver problems. You
      and your doctor should discuss the good this medicine will do as well as the
      risks of receiving it.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Clumsiness or unsteadiness
      - diarrhea
      - loss of appetite
      - nausea
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fainting
      - fast or pounding heartbeat
      - fever
      - high or low blood pressure
      - skin rash
      - slow heartbeat
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Aggression, irritability, or nervousness
      - change in stool color
      - convulsions (seizures)
      - cough, tightness in chest, troubled breathing, or wheezing
      - stiffness of arms or legs, slow movement, or trembling and shaking of hands
        and fingers
      - trouble in urinating
      - yellow eyes or skin
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Convulsions (seizures)
      - greatly increased sweating
      - greatly increased watering of mouth
      - increasing muscle weakness
      - low blood pressure
      - nausea (severe)
      - shock (fast weak pulse, irregular breathing, large pupils)
      - slow heartbeat
      - vomiting (severe)
    - type: paragraph
      text: 'This medicine may also cause the following side effect that your doctor
        will watch for:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Liver problems
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain or cramping
      - dizziness
      - headache
      - indigestion
      - muscle aches or pain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - fast breathing
      - flushing of skin
      - general feeling of discomfort or illness
      - increased sweating
      - increased urination
      - increased watering of eyes
      - increased watering of mouth
      - runny nose
      - swelling of feet or lower legs
      - trouble in sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
