title: Triamcinolone (intraocular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Xipere
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Triamcinolone suprachoroidal injection is used to treat macular edema associated
      with uveitis (redness, pain, or swelling of the eye). Macular edema is swelling
      in the back of the eye and may cause vision loss.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of triamcinolone suprachoroidal injection in the pediatric
        population. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of triamcinolone suprachoroidal injection
        in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Desmopressin
      - Mifepristone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aldesleukin
      - Aspirin
      - Atazanavir
      - Balofloxacin
      - Bemiparin
      - Besifloxacin
      - Carbamazepine
      - Ceritinib
      - Ciprofloxacin
      - Cobicistat
      - Cosyntropin
      - Darunavir
      - Enoxacin
      - Ethinyl Estradiol
      - Fleroxacin
      - Flumequine
      - Fosphenytoin
      - Gatifloxacin
      - Gemifloxacin
      - Insulin Aspart, Recombinant
      - Levofloxacin
      - Lomefloxacin
      - Lutetium Lu 177 Dotatate
      - Macimorelin
      - Moxifloxacin
      - Nadifloxacin
      - Nadroparin
      - Nirmatrelvir
      - Norfloxacin
      - Ofloxacin
      - Pazufloxacin
      - Pefloxacin
      - Phenytoin
      - Prulifloxacin
      - Ritonavir
      - Rufloxacin
      - Sargramostim
      - Somatrogon-ghla
      - Sparfloxacin
      - Tosufloxacin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Alcuronium
      - Atracurium
      - Auranofin
      - Gallamine
      - Hexafluorenium
      - Licorice
      - Metocurine
      - Primidone
      - Rotavirus Vaccine, Live
      - Saiboku-To
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Fungal eye infection or
      - Herpes infection of the eye, active or
      - Mycobacterial eye infection or
      - Vaccinia (smallpox) eye infection or
      - Varicella (chickenpox) eye infection—Should not be used in patients with these
        conditions.
    - type: list
      ordered: false
      items:
      - Herpes infection of the eye, history of or
      - Thyroid problems (eg, overactive or underactive thyroid)—Use with caution.
        May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your eye doctor (ophthalmologist) will give you this medicine in a hospital
      or clinic. It is given as a shot into the eye.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your eye doctor will want to check your progress at regular visits , especially
      during the first few days after you receive this medicine, to make sure this
      medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: Serious eye problems (eg, cataracts, glaucoma, detached retina, eye infection
      or swelling) may occur after receiving this medicine. Check with your eye doctor
      right away if you have a change in vision or the eye becomes red, sensitive
      to light, or painful . Also, tell your doctor if you feel an increased pressure
      in the eye.
  - type: paragraph
    text: This medicine may cause endocrine problems (eg, HPA axis suppression, Cushing
      syndrome, high blood sugar). These problems may occur if you are receiving this
      medicine for a long time or if you suddenly stopped receiving it. Talk with
      your doctor if you have any concerns about this.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blindness
      - blurred vision
      - change in vision
      - eye pain
      - increased pressure in the eye
      - loss of vision
      - seeing flashes or sparks of light
      - seeing floating spots before the eyes, or a veil or curtain appearing across
        part of vision
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody eye
      - change in color vision
      - difficulty seeing at night
      - drooping upper eyelids
      - increased sensitivity of the eyes to sunlight
      - painful irritation of the clear front part of the eye
      - swelling or redness of the eye or inside of the eyelids
      - tearing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Backache
      - darkening of the skin
      - diarrhea
      - dizziness
      - dry mouth
      - facial hair growth in females
      - fainting
      - flushed, dry skin
      - fractures
      - fruit-like breath odor
      - full or round face, neck, or trunk
      - increased hunger
      - increased thirst or urination
      - irritability
      - loss of appetite
      - loss of sexual desire or ability
      - menstrual irregularities
      - mental depression
      - muscle wasting
      - nausea
      - sweating
      - trouble breathing
      - unexplained weight loss
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
