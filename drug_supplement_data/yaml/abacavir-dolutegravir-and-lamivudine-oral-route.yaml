title: Abacavir, dolutegravir, and lamivudine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Triumeq
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Abacavir, dolutegravir, and lamivudine combination is used for the treatment
      of the infection caused by human immunodeficiency virus (HIV). HIV is the virus
      that causes acquired immune deficiency syndrome (AIDS).
  - type: paragraph
    text: Abacavir, dolutegravir, and lamivudine combination will not cure or prevent
      HIV infection or AIDS. It works by lowering the amount of HIV in the blood and
      it will also help your immune system. This may help delay some of the medical
      conditions that usually result from AIDS or HIV disease. Abacavir, dolutegravir,
      and lamivudine combination will not keep you from spreading HIV to other people.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Tablet for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of abacavir, dolutegravir, and lamivudine combination in children
        younger than 3 months of age and weighing less than 6 kilograms (kg). Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of abacavir, dolutegravir, and lamivudine combination have not been performed
        in the geriatric population, no geriatric-specific problems have been documented
        to date. However, elderly patients are more likely to have age-related kidney,
        liver, or heart problems, which may require caution for patients receiving
        abacavir, dolutegravir, and lamivudine combination.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Dofetilide
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Aluminum
      - Amprenavir
      - Apalutamide
      - Atidarsagene Autotemcel
      - Avacopan
      - Azathioprine
      - Cabotegravir
      - Calcium
      - Carbamazepine
      - Clarithromycin
      - Conivaptan
      - Dabrafenib
      - Dalfampridine
      - Dasabuvir
      - Efavirenz
      - Eslicarbazepine Acetate
      - Etravirine
      - Fedratinib
      - Fexinidazole
      - Fosamprenavir
      - Fosphenytoin
      - Horsetail
      - Iron
      - Itraconazole
      - Letermovir
      - Levoketoconazole
      - Magaldrate
      - Magnesium
      - Mercaptopurine
      - Metformin
      - Methadone
      - Methotrexate
      - Mifepristone
      - Nevirapine
      - Omaveloxolone
      - Orlistat
      - Oxcarbazepine
      - Phenobarbital
      - Phenytoin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Riociguat
      - Tipranavir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Heart disease or
      - Hyperlipidemia (high cholesterol or fats in the blood) or
      - Hypertension (high blood pressure)—May increase risk for heart attack.
    - type: list
      ordered: false
      items:
      - Genetic condition (eg, gene variation called HLA-B*5701)—This condition may
        increase the risk for serious and life-threatening side effects.
    - type: list
      ordered: false
      items:
      - Hepatitis B or C, or history of—Use with caution. May make this condition
        worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease, mild—Use is not recommended in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Liver disease, moderate or severe—Should not be used in patients with these
        conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine exactly as directed by your doctor . Do not use more of
      it, do not use it more often, and do not use it for a longer time than your
      doctor ordered. Also, do not change the dose, switch medicines, or stop using
      this medicine without checking first with your doctor . If you stop taking this
      medicine, or do not take it as prescribed, you may spread HIV to others. When
      your supply of this medicine is running low, contact your doctor or pharmacist
      ahead of time. Do not allow yourself to run out of this medicine.
  - type: paragraph
    text: Abacavir, dolutegravir, and lamivudine combination contains a fixed amount
      of each medicine in the tablet and the tablet for suspension (oral liquid) .
      Do not substitute these dosage forms for each other. Always check your medicine
      each time your prescription is filled to make sure you receive the correct dosage
      form.
  - type: paragraph
    text: This medicine should come with a Medication Guide and instructions for use.
      Read and follow these instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: Keep taking this medicine for the full time of treatment , even if you begin
      to feel better. It is also important to take this medicine together with other
      medicines for HIV. Be sure to take all of the medicines your doctor ordered,
      and to take them at the right times.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the tablet whole. Do not chew, cut, or crush it.
  - type: paragraph
    text: 'To use the oral liquid:'
  - type: list
    ordered: false
    items:
    - Mix the tablet for suspension with 20 milliliters (mL) of drinking water (for
      4, 5, or 6 tablets) or 15 mL (for 3 tablets) in the supplied cup. Use drinking
      water only. Do not mix this medicine with any other drink or food.
    - If your child cannot use the supplied cup, you may use an oral syringe to give
      the medicine.
    - Swirl the cup gently for 1 to 2 minutes to dissolve the tablet. The medicine
      will become cloudy. Swirl the cup again to make sure there are no lumps of the
      tablet remain.
    - Swallow the liquid within 30 minutes of mixing. If the medicine has not been
      taken after 30 minutes, wash away all the liquid in the cup with water and prepare
      a new dose.
    - You may add another 15 mL or less of drinking water to the cup to make sure
      your child gets the full dose.
    - Do not chew, cut, or crush the tablet for suspension.
  - type: paragraph
    text: Take this medicine at least 2 hours before or 6 hours after you take sucralfate,
      an antacid or laxative that contains aluminum, calcium, or magnesium, or a buffered
      medicine.
  - type: paragraph
    text: You may take calcium or iron supplements together with this medicine if
      you take them with food. If not, take this medicine 2 hours before or 6 hours
      after you take these supplements.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For HIV infection: For oral dosage form (tablets): Adults and children weighing
        25 kilograms (kg) or more—One tablet once a day. Each tablet contains 600
        milligrams (mg) abacavir, 50 mg dolutegravir, and 300 mg lamivudine. Children
        weighing less than 25 kg—Use of tablets for suspension is recommended. For
        oral dosage form (tablets for suspension): Children 3 months of age and older
        weighing less than 25 kg—Dose is base on body weight and must be determined
        by your doctor. Each tablet contains 60 milligrams (mg) abacavir, 5 mg dolutegravir,
        and 30 mg lamivudine. Weighing 20 kg to less than 25 kg—6 tablets (360 mg
        abacavir, 30 mg dolutegravir, and 180 mg lamivudine) once a day. If you are
        taking this medicine together with carbamazepine, efavirenz, fosamprenavir/ritonavir,
        rifampin, or tipranavir/ritonavir, you will need to take another 30 mg of
        Tivicay® 12 hours after taking this medicine. Weighing 14 kg to less than
        20 kg—5 tablets (300 mg abacavir, 25 mg dolutegravir, and 150 mg lamivudine)
        once a day. If you are taking this medicine together with carbamazepine, efavirenz,
        fosamprenavir/ritonavir, rifampin, or tipranavir/ritonavir, you will need
        to take another 25 mg of Tivicay® 12 hours after taking this medicine. Weighing
        10 kg to less than 14 kg—4 tablets (240 mg abacavir, 20 mg dolutegravir, and
        120 mg lamivudine) once a day. If you are taking this medicine together with
        carbamazepine, efavirenz, fosamprenavir/ritonavir, rifampin, or tipranavir/ritonavir,
        you will need to take another 20 mg of Tivicay® 12 hours after taking this
        medicine. Weighing 6 kg to less than 10 kg—3 tablets (180 mg abacavir, 15
        mg dolutegravir, and 90 mg lamivudine) once a day. If you are taking this
        medicine together with carbamazepine, efavirenz, fosamprenavir/ritonavir,
        rifampin, or tipranavir/ritonavir, you will need to take another 15 mg of
        Tivicay® 12 hours after taking this medicine. Children younger than 3 months
        of age weighing less than 6 kg—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): Adults and children weighing 25 kilograms
        (kg) or more—One tablet once a day. Each tablet contains 600 milligrams (mg)
        abacavir, 50 mg dolutegravir, and 300 mg lamivudine. Children weighing less
        than 25 kg—Use of tablets for suspension is recommended.'
      - 'For oral dosage form (tablets for suspension): Children 3 months of age and
        older weighing less than 25 kg—Dose is base on body weight and must be determined
