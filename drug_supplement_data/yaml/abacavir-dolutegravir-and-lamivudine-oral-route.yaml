    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the medicine in its original bottle. Keep it tightly closed and
        protect from moisture.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: You should not use this medicine together with dofetilide (Tikosyn®) . Using
      these medicines together may cause serious or life-threatening side effects.
  - type: paragraph
    text: Serious allergic reactions may occur while taking this medicine. These usually
      occur within 6 weeks after the medicine is started, but may occur at any time.
      Check with your doctor right away if you or your child have a severe rash or
      rash with fever, blistering or peeling skin, diarrhea, nausea, vomiting, joint
      or muscle pain, sores in the mouth, swelling of the face, trouble breathing,
      unusual tiredness or weakness, or yellow eyes or skin.
  - type: paragraph
    text: When you begin taking this medicine, you will be given a warning card which
      describes symptoms of severe allergic reactions that may be caused by Triumeq®.
      The warning card also provides information about how to treat these allergic
      reactions. For your safety, you should carry the warning card with you at all
      times.
  - type: paragraph
    text: If you must stop using this medicine because of an allergic reaction, you
      should never use the medicine again. Return the unused medicine to your doctor
      or pharmacist. A worse reaction, possibly even death, can occur if you use the
      medicine again. Tell your doctor right away if you have ever taken abacavir,
      especially if you have experienced an allergic reaction to it in the past.
  - type: paragraph
    text: Two rare but serious reactions to this medicine are lactic acidosis (too
      much acid in the blood) and liver toxicity, which includes an enlarged liver.
      These are more common if you are female, very overweight (obese), or have been
      taking anti-HIV medicines for a long time. Call your doctor right away if you
      have dark urine, decreased appetite, diarrhea, general feeling of discomfort,
      light-colored stools, muscle cramping or pain, nausea, stomach discomfort or
      cramping, unusual tiredness or weakness, trouble breathing, vomiting, or yellow
      eyes or skin.
  - type: paragraph
    text: Your immune system may get stronger when you start taking HIV medicines.
      Tell your doctor right away if you or your child notices any changes in your
      health. Sometimes the immune system will start to fight infections that were
      hidden in your body, such as pneumonia or tuberculosis. Autoimmune disorders
      (eg, Graves' disease, polymyositis, or Guillain-Barré syndrome) may also occur.
  - type: paragraph
    text: This medicine may cause you to have excess body fat. Tell your doctor right
      away if you notice changes in your body shape, including an increased amount
      of body fat in the neck or upper back, face, around the chest, or stomach area.
      You might also lose fat from your legs, arms, or face.
  - type: paragraph
    text: This medicine may increase your risk of having a heart attack. This is more
      likely if you smoke regularly or if you have diabetes, heart disease, high blood
      pressure, or high cholesterol. Call your doctor right away if you have chest
      pain or discomfort, pain or discomfort in the arms, jaw, back or neck, nausea,
      sweating, or vomiting.
  - type: paragraph
    text: It is important to practice safe sex, even if your partner also has HIV.
      Use a latex condom or other barrier method. Do not reuse or share needles, or
      other items, that may have blood or body fluids on them.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in weight
      - dark or bloody urine
      - decreased frequency or amount of urine
      - fever
      - increased blood pressure
      - increased thirst
      - itching skin
      - light-colored stools
      - loss of appetite
      - lower back or side pain
      - nausea
      - stomach discomfort, upset, or pain
      - swelling of the face, fingers, or lower legs
      - trouble breathing
      - unusual drowsiness, dullness, or feeling of sluggishness
      - unusual tiredness or weakness
      - upper right abdominal or stomach pain
      - vomiting
      - yellow eyes and skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Rash
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - blurred vision
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - burning, dry, or itching eyes
      - chest tightness
      - chills
      - confusion
      - cough
      - decreased appetite
      - diarrhea
      - difficulty with moving
      - difficulty with swallowing
      - discharge or excessive tearing
      - dizziness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fainting
      - fast heartbeat
      - fast, shallow breathing
      - general feeling of discomfort or illness
      - headache
      - hives
      - joint or muscle pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - muscle pain, cramping, or stiffness
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid, shallow breathing
      - red, irritated eyes
      - redness, pain, swelling of the eye, eyelid, or inner lining of the eyelid
      - sleepiness
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach pain, continuing
      - sweating
      - swelling or puffiness of the face
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - discouragement
      - excess air or gas in the stomach or bowels
      - feeling sad or empty
      - full or bloated feeling
      - heartburn
      - indigestion
      - irritability
      - loss of interest or pleasure
      - passing gas
      - pressure in the stomach
      - swelling of the stomach area
      - thoughts or attempts of killing oneself
      - trouble concentrating
      - trouble sleeping
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal dreams
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - loss or thinning of the hair
      - weight gain around your neck, upper back, breast, or waist
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
    - type: paragraph
