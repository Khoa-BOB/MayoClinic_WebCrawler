        rifampin, or tipranavir/ritonavir, you will need to take another 15 mg of
        Tivicay® 12 hours after taking this medicine. Children younger than 3 months
        of age weighing less than 6 kg—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children weighing 25 kilograms (kg) or more—One tablet once a day.
        Each tablet contains 600 milligrams (mg) abacavir, 50 mg dolutegravir, and
        300 mg lamivudine.
      - Children weighing less than 25 kg—Use of tablets for suspension is recommended.
    - type: list
      ordered: false
      items:
      - Children 3 months of age and older weighing less than 25 kg—Dose is base on
