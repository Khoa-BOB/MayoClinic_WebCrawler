        taking this medicine together with carbamazepine, efavirenz, fosamprenavir/ritonavir,
        rifampin, or tipranavir/ritonavir, you will need to take another 30 mg of
        Tivicay® 12 hours after taking this medicine. Weighing 14 kg to less than
        20 kg—5 tablets (300 mg abacavir, 25 mg dolutegravir, and 150 mg lamivudine)
        once a day. If you are taking this medicine together with carbamazepine, efavirenz,
        fosamprenavir/ritonavir, rifampin, or tipranavir/ritonavir, you will need
        to take another 25 mg of Tivicay® 12 hours after taking this medicine. Weighing
        10 kg to less than 14 kg—4 tablets (240 mg abacavir, 20 mg dolutegravir, and
        120 mg lamivudine) once a day. If you are taking this medicine together with
        carbamazepine, efavirenz, fosamprenavir/ritonavir, rifampin, or tipranavir/ritonavir,
        you will need to take another 20 mg of Tivicay® 12 hours after taking this
