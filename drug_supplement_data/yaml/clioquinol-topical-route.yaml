title: Clioquinol (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Vioform
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Clioquinol belongs to the family of medicines called anti-infectives. Clioquinol
      topical preparations are used to treat skin infections.
  - type: paragraph
    text: Clioquinol is available without a prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Clioquinol is not recommended in children younger than 2 years of age.
        Although there is no specific information comparing use of this medicine in
        children 2 years of age and older with use in other age groups, this medicine
        is not expected to cause different side effects or problems in children than
        it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of this medicine
        in the elderly with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Caution is advised with clioquinol use in patients with liver
        or kidney disease
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Before applying this medicine, wash the affected area with soap and water,
      and dry thoroughly.
  - type: paragraph
    text: Do not use this medicine in or around the eyes. If accidental contact occurs,
      flush eyes with water.
  - type: paragraph
    text: Do not bandage or apply an occlusive dressing (airtight covering, such as
      kitchen plastic wrap) over this medicine, since it may increase the infection
      and may cause unwanted drug absorption into the body. If you have any questions
      about this, check with your doctor.
  - type: paragraph
    text: 'To use the ointment form of this medicine:'
  - type: list
    ordered: false
    items:
    - Apply a thin layer of ointment to the affected area and rub in gently. The ointment
      is recommended for use on dry, crusted lesions.
  - type: paragraph
    text: To help clear up your infection completely, keep using this medicine for
      the full time of treatment, even if your symptoms have disappeared. Do not miss
      any doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (ointment): For bacterial or fungus infections: Adults
        and children 2 years of age and older—Apply to the affected area(s) of the
        skin two or three times a day. Children younger than 2 years of age—Use is
        not recommended.'
    - type: list
      ordered: false
      items:
      - 'For bacterial or fungus infections: Adults and children 2 years of age and
        older—Apply to the affected area(s) of the skin two or three times a day.
        Children younger than 2 years of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children 2 years of age and older—Apply to the affected area(s)
        of the skin two or three times a day.
      - Children younger than 2 years of age—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: This medicine should not be used for more than 1 week. If your skin problem
      does not improve in 1 week, or if it becomes worse, check with your doctor.
  - type: paragraph
    text: Clioquinol should not be used to treat large areas of the skin or large
      open skin lesions. If you have any questions about this, check with your doctor.
  - type: paragraph
    text: This medicine may turn yellow in color when exposed to air. It may stain
      clothing, skin, hair, and nails yellow. Avoid getting this medicine on your
      clothing since bleaching may not remove the stain.
  - type: paragraph
    text: Before you have any medical tests, tell the doctor in charge that you are
      using this medicine. The results of some tests may be affected by this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, itching, rash, redness, swelling, or other sign of skin irritation
        not present before use of this medicine or becoming worse during treatment
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
