title: Measles, mumps, rubella, and varicella virus vaccine live (subcutaneous route,
  intramuscular route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Measles, mumps, rubella, and varicella virus vaccine (live) is an active
      immunizing agent that is given to protect against infections caused by measles
      (rubeola), mumps, rubella (German measles), and varicella (chickenpox) viruses.
      The combination vaccine works by causing the body to produce its own protection
      (antibodies) against the virus.
  - type: paragraph
    text: Measles (also known as coughing measles, hard measles, morbilli, red measles,
      rubeola, and 10-day measles) is an infection that is easily spread from one
      person to another. Infection with measles can cause serious problems, such as
      stomach problems, pneumonia, ear infections, sinus problems, convulsions (seizures),
      brain damage, and possibly death. The risk of serious complications and death
      is greater for adults and infants than for children and teenagers.
  - type: paragraph
    text: Mumps is an infection that can cause serious problems, such as encephalitis
      and meningitis, which affect the brain. In addition, teenage boys and men are
      very susceptible to a condition, called orchitis, which causes pain and swelling
      in the testicles and scrotum, and in rare cases, sterility. Also, mumps infection
      can cause spontaneous abortion (miscarriage) in women during the first 3 months
      of pregnancy.
  - type: paragraph
    text: Rubella (also known as German measles) is a serious infection that causes
      miscarriages, stillbirths, or birth defects in unborn babies when pregnant women
      get the disease.
  - type: paragraph
    text: Varicella (commonly known as chickenpox) is an infection that is easily
      spread from one person to another. Chickenpox is usually a mild infection but
      can sometimes cause serious problems, such as pneumonia, inflammation of the
      brain, and a rare disease, called Reye's syndrome.
  - type: paragraph
    text: This vaccine is to be administered only by or under the supervision of your
      doctor or other healthcare professional.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use is not recommended in infants younger than 12 months of age or in
        children 13 years of age and older. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: This vaccine is not recommended for use in elderly patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is not recommended.
        Your doctor may decide not to use this vaccine or change some of the other
        medicines you take.
