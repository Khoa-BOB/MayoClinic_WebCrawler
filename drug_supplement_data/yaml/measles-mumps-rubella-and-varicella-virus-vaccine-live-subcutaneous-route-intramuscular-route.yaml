    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to eggs, history of—May increase risk for a serious allergic reaction
        to occur again.
    - type: list
      ordered: false
      items:
      - Brain injury or
      - Seizures, history of or
      - Thrombocytopenia (not enough platelets in the blood) or history of—Use with
        caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Immune system problems, severe or
      - Tuberculosis, active and untreated—Should not be used in patients with this
        condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give your child this vaccine.
      It is given as a shot under your skin (usually in the upper arms or thighs)
      or into one of your muscles.
  - type: paragraph
    text: This vaccine is given in 2 doses. First dose is given at 12 to 15 months
      of age, while the second dose is given at 4 to 6 years of age.
  - type: paragraph
    text: Your child may receive certain other vaccines at the same time as this one,
      but in a different body area.
  - type: paragraph
    text: This vaccine comes with patient information leaflet. Read and follow these
      instructions carefully. Ask your doctor or pharmacist if you have any questions..
  - type: paragraph
    text: It is important to receive this vaccine at the proper time. If your child
      misses a scheduled shot, call your child's doctor to make another appointment
      as soon as possible.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your child return to your doctor’s office at the
      right time if your child needs a second dose of the vaccine . Be sure to notify
      your doctor of any side effects that occur after your child receive this vaccine.
  - type: paragraph
    text: Do not become pregnant for 3 months after receiving this vaccine without
      first checking with your doctor . There is a chance that this vaccine may cause
      problems during pregnancy. If you think you have become pregnant, tell your
      doctor right away.
  - type: paragraph
    text: This vaccine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you have a rash, itching, a fast heartbeat, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      after receiving the vaccine.
  - type: paragraph
    text: Proquad® injection will lower the number of some types of blood cells in
      your body. Because of this, you may bleed or get infections more easily. To
      help with these problems, avoid being near people who are sick or have infections.
      Wash your hands often. Stay away from rough sports or other situations where
      you could be bruised, cut, or injured. Brush and floss your teeth gently. Be
      careful when using sharp objects, including razors and fingernail clippers.
  - type: paragraph
    text: Children who have received this vaccine have developed a fever and in some
      cases a fever with seizures. Talk with your child's doctor if you have concerns
      about this.
  - type: paragraph
    text: Your child should avoid close contact with people at high risk for catching
      the varicella virus for 6 weeks after receiving this vaccine. People who are
      at risk for catching the virus are pregnant women, newborn babies, and anyone
      who has a weak immune system that keeps them from fighting infections.
  - type: paragraph
    text: 'Tell your doctor that you have received this vaccine:'
  - type: list
    ordered: false
    items:
    - If you are to receive blood transfusions or other blood products within 3 months
      of receiving this vaccine.
    - If you are to receive varicella-zoster immune globulin (VZIG) or other immune
      globulins within 3 to 5 months after receiving this vaccine.
    - If you are to have a tuberculin skin test within 4 to 6 weeks after receiving
      this vaccine.
    - If you are to receive any other live virus vaccines within 1 or 3 months of
      receiving this vaccine.
  - type: paragraph
    text: Do not take aspirin or medicines that contain aspirin (such as cold medicines)
      for 6 weeks after receiving this vaccine. Carefully check the label of any pain,
      headache, or cold medicine you give to your child to be sure it does not contain
      aspirin or salicylic acid.
  - type: paragraph
    text: This vaccine contains albumin, which comes from human blood. Some human
      blood products have transmitted certain viruses (eg, Creutzfeldt-Jakob Disease)
      to people who have received them. The risk of getting a virus from medicines
      made of human blood has been greatly reduced in recent years. This is the result
      of required testing of human donors for certain viruses, and testing during
      the manufacture of these medicines. Although the risk is low, talk with your
      child's doctor if you have concerns.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
