title: Cromolyn (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Gastrocrom
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cromolyn is used to treat the symptoms of mastocytosis. Mastocytosis is
      a rare condition caused by too many mast cells in the body. These mast cells
      release substances that cause the symptoms of the disease, such as abdominal
      pain, nausea, vomiting, diarrhea, headache, flushing or itching of skin, or
      hives.
  - type: paragraph
    text: Cromolyn works by acting on the mast cells in the body to prevent them from
      releasing substances that cause the symptoms of mastocytosis.
  - type: paragraph
    text: Cromolyn is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of oral cromolyn
        in children with use in other age groups, this medicine is not expected to
        cause different side effects or problems in children than it does in adults.
        This medicine is usually used in children two years of age and older. However,
        it may be used in children younger than two years of age if their disease
        is severe.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of oral cromolyn
        in the elderly with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—The effects of cromolyn may be increased, which may increase
        the chance of side effects
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Make certain your health care professional knows if you are on any special
      diet, such as a low-sodium diet. This medicine contains sodium.
  - type: paragraph
    text: 'Unless otherwise directed by your doctor, it is best to take oral cromolyn
      as follows:'
  subsections:
  - heading: Capsules
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Open the cromolyn capsule(s) and pour all of the powder into one-half glass
        (4 ounces) of hot water. Stir the solution until the powder is completely
        dissolved and the solution is clear. Then add an equal amount (one-half glass)
        of cold water to the solution while stirring.
      - Be sure to drink all of the liquid to get the full dose of medicine.
      - Do not mix this medicine with fruit juice, milk, or food because they may
        keep the medicine from working properly.
      - It is important to take this medicine at regular intervals for best results.
    subsections: []
  - heading: Ampuls
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Break open the ampul(s) and squeeze contents into a glass of water and stir
        well.
      - Be sure to drink all of the liquid to get the full dose of medicine.
      - It is important to take this medicine at regular intervals for best results.
      - Do not use the ampul if it appears cloudy or discolored.
    - type: paragraph
      text: Take cromolyn only as directed. Do not take more of it and do not take
        it more often than your doctor ordered. To do so may increase the chance of
        side effects.
    subsections: []
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules and ampuls): For symptoms of mastocytosis:
        Adults and children 12 years of age and older—200 milligrams (mg) dissolved
        or mixed in water and taken four times a day, thirty minutes before meals
        and at bedtime. Children 2 to 12 years of age—100 mg dissolved or mixed in
        water and taken four times a day, thirty minutes before meals and at bedtime.
        Your doctor may increase the dose if your symptoms are not under control within
        two to three weeks after you begin taking this medicine. Infants and children
        up to 2 years of age—Dose is based on body weight and must be determined by
        your doctor. The dose is usually 20 mg per kilogram (kg) (9.1 mg per pound)
        of body weight a day. This dose is divided into four doses. Your doctor may
        increase the dose if your symptoms are not under control within two to three
        weeks after you begin taking this medicine. Premature infants—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For symptoms of mastocytosis: Adults and children 12 years of age and older—200
        milligrams (mg) dissolved or mixed in water and taken four times a day, thirty
        minutes before meals and at bedtime. Children 2 to 12 years of age—100 mg
        dissolved or mixed in water and taken four times a day, thirty minutes before
        meals and at bedtime. Your doctor may increase the dose if your symptoms are
        not under control within two to three weeks after you begin taking this medicine.
        Infants and children up to 2 years of age—Dose is based on body weight and
        must be determined by your doctor. The dose is usually 20 mg per kilogram
        (kg) (9.1 mg per pound) of body weight a day. This dose is divided into four
        doses. Your doctor may increase the dose if your symptoms are not under control
        within two to three weeks after you begin taking this medicine. Premature
        infants—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—200 milligrams (mg) dissolved
        or mixed in water and taken four times a day, thirty minutes before meals
        and at bedtime.
      - Children 2 to 12 years of age—100 mg dissolved or mixed in water and taken
        four times a day, thirty minutes before meals and at bedtime. Your doctor
        may increase the dose if your symptoms are not under control within two to
        three weeks after you begin taking this medicine.
      - Infants and children up to 2 years of age—Dose is based on body weight and
        must be determined by your doctor. The dose is usually 20 mg per kilogram
        (kg) (9.1 mg per pound) of body weight a day. This dose is divided into four
        doses. Your doctor may increase the dose if your symptoms are not under control
        within two to three weeks after you begin taking this medicine.
      - Premature infants—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the medicine in the foil pouch until you are ready to use it. Store
        at room temperature, away from heat and direct light. Do not freeze.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve or if your condition becomes worse, check
      with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Coughing
      - difficulty in swallowing
      - hives or itching of skin
      - swelling of face, lips, or eyelids
      - wheezing or difficulty in breathing
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin rash
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - headache
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: paragraph
      text: 'Note: If the above side effects occur in patients with mastocytosis,
        they are usually only temporary and could be symptoms of the disease.'
    - type: list
      ordered: false
      items:
      - Abdominal pain
      - irritability
      - muscle pain
      - nausea
      - trouble in sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
