title: Icosapent ethyl (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Vascepa
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Icosapent ethyl is used together with a proper diet to help control high
      triglyceride (fat-like substance) levels in the blood. This medicine is also
      used together with a statin medicine to lower the risk of heart attack, stroke,
      and certain heart problems requiring hospitalization in adults with heart or
      blood vessel disease or diabetes.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule, Liquid Filled
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of icosapent ethyl in the pediatric population. Safety and
        efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of icosapent ethyl in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to fish or shellfish, history of—May have an increase risk of an allergic
        reaction to this medicine.
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Heart rhythm problems (eg, atrial fibrillation, atrial flutter)—Use with caution.
        May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hypothyroidism (underactive thyroid)—Use with caution. Your doctor will tell
        you how to control these conditions that may cause lipid (fat) disorders.
    - type: list
      ordered: false
      items:
      - Liver problems—Your doctor may want to monitor you more closely for unwanted
        effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. Do not change or stop taking this medicine without first
      checking with your doctor .
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions in the insert carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the capsule whole. Do not crush, break, chew, dissolve, or open
      it . Take this medicine with food.
  - type: paragraph
    text: Before prescribing medicine for your condition your doctor will probably
      try to control your condition by prescribing a personal diet for you. Carefully
      follow the special diet your doctor gave you . This diet may be low in fats,
      sugars, and/or cholesterol. Many people are able to control their condition
      by carefully following their doctor's orders for proper diet and exercise. Medicine
      is prescribed only when additional help is needed and is most effective when
      used in combination with diet and exercise.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For high triglycerides or fats in the blood:
        Adults—4 grams per day, to be taken as four 0.5 gram capsules two times a
        day with food, or as two 1 gram capsules two times a day with food. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high triglycerides or fats in the blood: Adults—4 grams per day, to be
        taken as four 0.5 gram capsules two times a day with food, or as two 1 gram
        capsules two times a day with food. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—4 grams per day, to be taken as four 0.5 gram capsules two times a
        day with food, or as two 1 gram capsules two times a day with food.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: This medicine may increase your risk of heart rhythm problems (eg, atrial
      fibrillation, atrial flutter). Call your doctor right away if you feel dizzy
      or faint, or have a fast, pounding, or uneven heartbeat.
  - type: paragraph
    text: This medicine may increase your chance of bleeding. To help with this problem,
      stay away from rough sports or other situations where you could be bruised,
      cut, or injured. Brush and floss your teeth gently. Be careful when using sharp
      objects, including razors and fingernail clippers.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  - type: paragraph
    text: Tell your doctor if you drink alcohol. Alcohol intake may cause lipid (fat-like
      substance) disorders.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - fainting
      - fast or irregular heartbeat
      - lightheadedness
      - swelling of the hands, ankles, feet, or lower legs
      - unusual bleeding
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - difficulty with moving
      - muscle pain or stiffness
      - pain in the joints
      - pain in the mouth or throat
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - pain in the arms or legs
      - stomach discomfort
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
