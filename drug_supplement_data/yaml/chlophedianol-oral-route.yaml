title: Chlophedianol (oral route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Chlophedianol is used to relieve dry, irritating coughs. This medicine should
      not be used when there is mucus or phlegm (pronounced flem) with the cough.
  - type: paragraph
    text: Chlophedianol relieves cough by acting on the cough center in the brain.
  - type: paragraph
    text: Chlophedianol is available without a doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested in children 2 years of age or older. In
        effective doses, the medicine has not been shown to cause different side effects
        or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of chlophedianol in the elderly
        with use in other age groups.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Mucus or phlegm with cough—Since chlophedianol decreases coughing, it makes
        it difficult to get rid of the mucus that may collect in the lungs and airways
        with some diseases
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Do not take liquids immediately after taking this medicine. To do so may
      decrease the soothing effect of the syrup.
  - type: paragraph
    text: Take this medicine only as directed. Do not take more of it and do not take
      it more often than your doctor ordered or the label directs you to take. To
      do so may increase the chance of side effects.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (syrup): For cough: Adults and children 12 years of
        age and older—25 milligrams (mg) every six to eight hours as needed. Children—
        Up to 2 years of age: Use is not recommended. 2 to 6 years of age: 12.5 mg
        every six to eight hours as needed. 6 to 12 years of age: 12.5 to 25 mg every
        six to eight hours as needed.'
    - type: list
      ordered: false
      items:
      - 'For cough: Adults and children 12 years of age and older—25 milligrams (mg)
        every six to eight hours as needed. Children— Up to 2 years of age: Use is
        not recommended. 2 to 6 years of age: 12.5 mg every six to eight hours as
        needed. 6 to 12 years of age: 12.5 to 25 mg every six to eight hours as needed.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—25 milligrams (mg) every six
        to eight hours as needed.
      - 'Children— Up to 2 years of age: Use is not recommended. 2 to 6 years of age:
        12.5 mg every six to eight hours as needed. 6 to 12 years of age: 12.5 to
        25 mg every six to eight hours as needed.'
    - type: list
      ordered: false
      items:
      - 'Up to 2 years of age: Use is not recommended.'
      - '2 to 6 years of age: 12.5 mg every six to eight hours as needed.'
      - '6 to 12 years of age: 12.5 to 25 mg every six to eight hours as needed.'
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your cough has not improved after 7 days, or if you have a high fever,
      skin rash, or continuing headache with the cough, check with your doctor. These
      signs may mean that you have other medical problems.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that slow down the nervous system, possibly causing drowsiness).
      Some examples of CNS depressants are antihistamines or medicine for hay fever,
      other allergies, or colds; sedatives, tranquilizers, or sleeping medicine; prescription
      pain medicine or narcotics; barbiturates; medicine for seizures; muscle relaxants;
      or anesthetics, including some dental anesthetics. Check with your doctor before
      taking any of the above while you are taking this medicine.
  - type: paragraph
    text: This medicine may also add to the effects of CNS stimulants, such as appetite
      suppressants and caffeine-containing beverages like tea, coffee, cocoa, and
      cola drinks. Avoid drinking large amounts of these beverages while taking this
      medicine. If you have any questions about this, check with your doctor.
  - type: paragraph
    text: This medicine may cause some people to become drowsy or less alert than
      they are normally. Make sure you know how you react to this medicine before
      you drive, use machines, or do anything else that could be dangerous if you
      are not alert.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hallucinations (seeing, hearing, or feeling things that are not there)
      - nightmares
      - skin rash or hives
      - unusual excitement or irritability
    subsections: []
  - heading: With large doses
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - drowsiness or dizziness
      - dryness of the mouth
      - nausea or vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
