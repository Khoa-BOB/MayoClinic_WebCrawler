title: Rabies vaccine (intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Imovax Rabies
    - type: paragraph
      text: Rabavert
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Rabies vaccine is an active immunizing agent used to prevent infection caused
      by the rabies virus. The vaccine works by causing your body to produce its own
      protection (antibodies) against the rabies virus.
  - type: paragraph
    text: Rabies vaccine is used in two ways. Rabies vaccine is given to persons who
      have been exposed (eg, by a bite, scratch, or lick) to an animal that is known,
      or thought, to have rabies. This is called post-exposure prophylaxis. Rabies
      vaccine may also be given ahead of time to persons who have a high risk of getting
      infected with rabies virus. These persons include veterinarians, animal handlers,
      or travelers who will spend more than 1 month in countries having a high rate
      of rabies infection, and persons who live, work, or take vacations in wild areas
      of the country where they are likely to come into contact with wild animals.
      This is called pre-exposure prophylaxis.
  - type: paragraph
    text: Rabies infection is a serious, and often fatal, infection. In the U.S.,
      rabies in wild animals, especially raccoons, skunks, foxes, and bats, accounts
      for most cases of rabies passed on to humans, pets, and other domestic animals.
      In Canada, the animals most often infected with rabies are foxes, skunks, bats,
      dogs, and cats. Horses, swine, and cattle also have been known to become infected
      with rabies. In much of the rest of the world, including Latin America, Africa,
      and Asia, dogs account for most cases of rabies passed on to humans.
  - type: paragraph
    text: If you are being (or will be) treated for a possible rabies infection while
      traveling outside of the U.S. or Canada, contact your doctor as soon as you
      return to the U.S. or Canada, since it may be necessary for you to have additional
      treatment.
  - type: paragraph
    text: This vaccine is to be given only by or under the supervision of your doctor
      or other health care professional.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of rabies vaccine in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of Rabavert® vaccine in geriatric patients.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Imovax® vaccine in geriatric patients. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Alclometasone
      - Aldosterone
      - Amcinonide
      - Atidarsagene Autotemcel
      - Beclomethasone
      - Betamethasone
      - Chloroquine
      - Ciclesonide
      - Clobetasol
      - Clocortolone
      - Deflazacort
      - Desonide
      - Desoximetasone
      - Diflorasone
      - Difluprednate
      - Elivaldogene Autotemcel
      - Flumethasone
      - Flunisolide
      - Fluocinolone
      - Fluorometholone
      - Fluticasone
      - Halcinonide
      - Loteprednol
      - Mometasone
      - Ocrelizumab
      - Prednicarbate
      - Rimexolone
      - Teplizumab-mzwv
      - Ublituximab-xiiy
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Illness with fever, severe—The symptoms of the condition may be confused with
        the possible side effects of the vaccine.
    - type: list
      ordered: false
      items:
      - Immune system problems—This condition may decrease the useful effects of the
        vaccine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this vaccine
      in a medical facility. For older children and adults, it is given as a shot
      into one of your muscles. For babies and children, it is given as a shot in
      the thigh.
  - type: paragraph
    text: If you are a veterinarian, work with animals, or will be going to a country
      where rabies is common, you are at risk for exposure to the rabies virus. If
      you are getting the vaccine because you are at risk of being exposed to rabies,
      you will receive 3 doses on 3 different days within a 1-month period.
  - type: paragraph
    text: 'Patients who have not been exposed to rabies:'
  - type: list
    ordered: false
    items:
    - 'Two-dose schedule: First dose is given at Day 0 and second dose is given at
      Day 7. You will receive a single dose of booster shot.'
    - 'Three-dose schedule: First dose is given at Day 0, second dose is given at
      Day 7, and third dose given at Day 21 or 28. You will receive a single dose
      of booster shot.'
  - type: paragraph
    text: 'Patients who have been exposed to rabies:'
  - type: list
    ordered: false
    items:
    - 'Patients who have received any rabies vaccine: Given in 2 doses 3 days apart
      (first dose at Day 0 and second dose at Day 3).'
    - 'Patients who have not received any rabies vaccine or have a weak immune system:
      Given in 5 doses (first dose at Day 0, second dose at Day 3, third dose at Day
      7, fourth dose at Day 14, and fifth dose at Day 28). You will also receive a
      shot of rabies immune globulin.'
  - type: paragraph
    text: In order for the rabies vaccine to work properly, it is very important that
      you do not miss any doses . Keep your appointments with your doctor.
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you or your child's progress
      at regular visits to make sure that this vaccine is working properly. Blood
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This vaccine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you have a rash, itching, a fast heartbeat, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      after receiving the vaccine.
  - type: paragraph
    text: This vaccine may cause serum sickness type reactions 2 to 21 days after
      receiving this vaccine. Check with your doctor right away if you have difficulty
      in moving, feeling of discomfort, fever, itching, joint pain or swelling, large,
      hive-like swelling on the face, eyelids, lips, tongue, throat, hands, legs,
      feet, or sex organs, muscle pain or stiffness, nausea, rash, swollen lymph glands,
      or vomiting.
  - type: paragraph
    text: This vaccine may increase the risk for nervous system problems, including
      Guillain-Barré syndrome. Check with your doctor right away if you have sudden
      numbness and weakness in the arms and legs or inability to move the arms and
      legs.
  - type: paragraph
    text: This vaccine contains albumin, which comes from human blood. Some human
      blood products have transmitted certain viruses (eg, Creutzfeldt-Jakob Disease)
      to people who have received them. The risk of getting a virus from medicines
      made of human blood has been greatly reduced in recent years. This is the result
      of required testing of human donors for certain viruses, and testing during
      the manufacture of these medicines. Although the risk is low, talk with your
      doctor if you have concerns.
  - type: paragraph
    text: This vaccine may not protect everyone who receives it. This vaccine will
      not treat symptoms of rabies virus if you already have the disease.
  - type: paragraph
    text: Fainting may occur after you receive this vaccine. Your doctor may want
      you to be observed after you get the injection to prevent and manage fainting.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chest tightness
      - confusion
      - cough
      - difficulty with moving
      - difficulty with swallowing
      - fast heartbeat
      - feeling of discomfort
      - irritability
      - lack or loss of strength
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - muscle pain, stiffness, or weakness
      - paralysis or severe weakness of the legs
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rash
      - seizures
      - skin rash, hives, or redness
      - stiffness of arms, legs, or neck
      - swelling of the joints
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
      - unusual tiredness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - dizziness
      - fever
      - general feeling of discomfort or illness
      - headache
      - itching, pain, redness, or swelling at the injection site
      - muscle or joint aches
      - nausea
      - stomach pain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bruising at the injection site
      - diarrhea
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
