    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you or your child's progress
      at regular visits to make sure this medicine is working properly and to decide
      if you should continue to take it. Blood tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: This medicine may make you more drowsy, dizzy, less alert, or lightheaded
      than normal. Make sure you know how you react to this medicine before you drive,
      use machines, or do anything else that could be dangerous if you are dizzy or
      not alert . Dizziness, lightheadedness, or fainting may also occur when you
      get up suddenly from a lying or sitting position. Getting up slowly or lying
      down for awhile may help.
  - type: paragraph
    text: Do not take atomoxetine with or within 14 days of taking a drug with monoamine
      oxidase (MAO) inhibitor activity (eg, isocarboxazid [Marplan®], phenelzine [Nardil®],
      procarbazine [Matulane®], selegiline [Eldepryl®], or tranylcypromine [Parnate®]).
      If you do, you may develop serious side effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      angioneurotic edema, which can be life-threatening and require immediate medical
      attention. Call your doctor right away if you or your child have chest tightness,
      cough, difficulty swallowing, dizziness, fast heartbeat, hives, itching, skin
      rash, large, hive-like swelling on face, eyelids, lips, tongue, throat, hands,
      legs, feet, or sex organs, puffiness or swelling of the eyelids or around the
      eyes, face, lips or tongue, trouble breathing, or unusual tiredness or weakness
      after you take this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Atomoxetine may cause serious heart or blood vessel problems. This may be
      more likely in patients who have a family history of heart disease. Check with
      your doctor right away if you or your child have chest pain, trouble breathing,
      or fainting while taking this medicine.
  - type: paragraph
    text: You will also need to have your blood pressure and heart rate measured before
      starting this medicine and while you are using it. If you notice any change
      in your blood pressure, call your doctor right away. If you have questions about
      this, talk to your doctor.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up suddenly from a lying or sitting position. These symptoms are more likely
      to occur when you begin taking this medicine or when the dose is increased.
      Getting up slowly or lying down for awhile may help.
  - type: paragraph
    text: Tell your doctor right away if you, your child, or a caregiver notices any
      unusual changes in behavior, such as an increase in aggression, hostility, agitation,
      irritability, or suicidal thinking or behavior. Also tell your doctor if you
      have hallucinations or any unusual thoughts, especially if they are new or getting
      worse quickly .
  - type: paragraph
    text: This medicine may cause slow growth in children. Your child's doctor will
      keep track of height and weight.
  - type: paragraph
    text: If you or your child experience a prolonged or painful erection of the penis
      for more than 4 hours, check with your doctor right away.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hives, itching, skin rash
      - irregular heartbeat
      - itching
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - redness of the skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Painful, prolonged erection of your penis
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dark colored urine
      - fainting
      - flu-like symptoms
      - irregular heartbeat recurrent
      - loss of bladder control
      - muscle spasm or jerking of all extremities
      - paleness or cold feeling in the fingertips and toes
      - pelvic pain in male
      - right upper stomach pain or tenderness
      - seizures
      - sudden loss of consciousness
      - tingling or pain in the fingers or toes when exposed to cold
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
