title: Atomoxetine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Strattera
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Atomoxetine is used to treat attention-deficit hyperactivity disorder (ADHD)
      in children, teenagers, and adults. It belongs to the group of medicines called
      selective norepinephrine reuptake inhibitors (SNRIs).
  - type: paragraph
    text: Atomoxetine works in the brain to increase attention and decrease restlessness
      in people who are hyperactive, have problems with concentration, or are easily
      distracted. This medicine may be used as part of a treatment program that includes
      social, educational, and psychologic treatment.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of atomoxetine in children younger than 6 years of age. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of atomoxetine
        have not been performed in the geriatric population. Safety and efficacy have
        not been established.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
      - Linezolid
      - Mavorixafor
      - Methylene Blue
      - Ozanimod
      - Phenelzine
      - Procarbazine
      - Rasagiline
      - Safinamide
      - Selegiline
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Albuterol
      - Amphetamine
      - Azathioprine
      - Bupropion
      - Celecoxib
      - Desvenlafaxine
      - Dextroamphetamine
      - Donepezil
      - Duloxetine
      - Escitalopram
      - Fedratinib
      - Fluoxetine
      - Givosiran
      - Insulin Aspart, Recombinant
      - Landiolol
      - Levoketoconazole
      - Lisdexamfetamine
      - Mercaptopurine
      - Methotrexate
      - Panobinostat
      - Paroxetine
      - Ranolazine
      - Sertraline
      - Venlafaxine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Amitriptyline
      - Amoxapine
      - Clomipramine
      - Desipramine
      - Dibenzepin
      - Dothiepin
      - Imipramine
      - Lofepramine
      - Nortriptyline
      - Opipramol
      - Protriptyline
      - Trimipramine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bipolar disorder (mood disorder), or family history of or
      - Blood vessel problems or
      - Depression, or family history of or
      - Heart disease (eg, cardiomyopathy) or
      - Heart rhythm problems (eg, tachycardia) or
      - Hypertension (high blood pressure) or
      - Hypotension (low blood pressure) or
      - Mental illness, or family history of or
      - Problems with urination or
      - Priapism (painful or prolonged erection of the penis)—Use with caution. May
        make these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Glaucoma, narrow angle or
      - Heart disease, severe or
      - Pheochromocytoma (an adrenal problem), or history of—Should not be used in
        patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more or
      less of it, do not take it more often, and do not take it for a longer time
      than your doctor ordered.
  - type: paragraph
    text: If you or your child think this medicine is not working properly after you
      have taken it for several weeks, do not increase the dose . Check with your
      doctor.
  - type: paragraph
    text: This medicine should come with a Medication Guide. It is very important
      that you read and understand this information. Be sure to ask your doctor about
      anything you do not understand.
  - type: paragraph
    text: Swallow the capsule whole . Do not crush, break, chew, or open it. You may
      take this medicine with or without food.
  - type: paragraph
    text: Avoid touching a broken or opened capsule. Wash your hands with water right
      away if you do touch an opened capsule. If this medicine comes in contact with
      your eyes, rinse them with water and call your doctor right away.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For attention-deficit hyperactivity disorder
        (ADHD): Adults and children 6 years of age and older weighing over 70 kilograms
        (kg)—At first, 40 milligrams (mg) once a day. The dose is increased after
        a minimum of 3 days to a total daily dose of 80 mg as a single dose in the
        morning or divided in 2 doses (morning and late afternoon). Your doctor may
        adjust your dose as needed. However, the dose is usually not more than 100
        mg per day. Children 6 years of age and older weighing less than 70 kilograms
        (kg)—Dose is based on body weight and must be determined by your doctor. At
        first, 0.5 milligram (mg) per kilogram (kg) of body weight once a day. The
        dose is increased after a minimum of 3 days to a total daily dose of 1.2 mg/kg
        as a single dose in the morning or divided in 2 doses (morning and late afternoon).
        Your doctor may adjust your dose as needed. However, the dose is usually not
        more than 1.4 mg/kg per day. Children younger than 6 years of age—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For attention-deficit hyperactivity disorder (ADHD): Adults and children
        6 years of age and older weighing over 70 kilograms (kg)—At first, 40 milligrams
        (mg) once a day. The dose is increased after a minimum of 3 days to a total
        daily dose of 80 mg as a single dose in the morning or divided in 2 doses
