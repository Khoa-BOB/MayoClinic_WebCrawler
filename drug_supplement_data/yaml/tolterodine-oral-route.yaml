title: Tolterodine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Detrol
    - type: paragraph
      text: Detrol LA
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Tolterodine is used to treat symptoms of an overactive bladder, such as
      incontinence (loss of bladder control) or a frequent need to urinate.
  - type: paragraph
    text: Tolterodine belongs to the group of medicines called antispasmodics. It
      helps decrease muscle spasms of the bladder and the frequent urge to urinate
      caused by these spasms.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule, Extended Release
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated that tolterodine
        is useful in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of tolterodine in the elderly. However,
        elderly patients are more likely to have age-related kidney or liver problems,
        which may require an adjustment in the dose for patients receiving tolterodine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Fluconazole
      - Ketoconazole
      - Levoketoconazole
      - Mavorixafor
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Potassium Chloride
      - Potassium Citrate
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Adagrasib
      - Amantadine
      - Amiodarone
      - Amisulpride
      - Anagrelide
      - Apalutamide
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Atazanavir
      - Avacopan
      - Azithromycin
      - Bedaquiline
      - Benzhydrocodone
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Carbamazepine
      - Celecoxib
      - Ceritinib
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
      - Codeine
      - Conivaptan
      - Crizotinib
      - Cyclobenzaprine
      - Dabrafenib
      - Dasatinib
      - Degarelix
      - Delamanid
      - Desflurane
      - Deslorelin
      - Desvenlafaxine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Cyclosporine
      - Erythromycin
      - Galantamine
      - Miconazole
      - Propafenone
      - Quinidine
      - Rivastigmine
      - Vinblastine
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart rhythm problems (e.g., QT prolongation), or history of or
      - Intestinal or stomach problems (e.g., blockage, intestinal atony, pyloric
        stenosis) or
      - Myasthenia gravis (severe muscle weakness) or
      - Narrow-angle glaucoma, controlled or
      - Urinary problems (e.g., blockage)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease (including cirrhosis)—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use is not recommended for patients taking tolterodine
        extended-release capsules.
    - type: list
      ordered: false
      items:
      - Narrow-angle glaucoma, uncontrolled or
      - Stomach problems (e.g., gastric retention) or
      - Urinary retention (hard to pass urine)—Should not be used in patients with
        these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed . Do not take more of it, do not take
      it more often, and do not take it for a longer time than your doctor ordered.
      To do so may increase the chance of side effects. Also, do not change your dose
      without checking first with your doctor.
  - type: paragraph
    text: This medicine comes with a patient information insert. It is very important
      that you read and understand this information. Be sure to ask your doctor about
      anything you do not understand.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the extended-release capsule whole with water. Do not crush, open,
      or chew it.
  - type: paragraph
    text: Take this medicine at the same time each day.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For bladder problems: For oral dosage form (tablets): Adults—At first, 2
        milligrams (mg) two times a day. Your doctor may adjust your dose if needed.
        Children—Use and dose must be determined by your doctor. For oral dosage form
        (extended-release capsules): Adults—4 milligrams (mg) once a day. Your doctor
        may adjust your dose if needed. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): Adults—At first, 2 milligrams (mg) two times
        a day. Your doctor may adjust your dose if needed. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 2 milligrams (mg) two times a day. Your doctor may adjust
        your dose if needed.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release capsules): Adults—4 milligrams (mg)
        once a day. Your doctor may adjust your dose if needed. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—4 milligrams (mg) once a day. Your doctor may adjust your dose if needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to decide if you should continue to take it.
  - type: paragraph
    text: Tolterodine may cause serious types of allergic reactions, including anaphylaxis
      and angioedema. Anaphylaxis and angioedema can be life-threatening and require
      immediate medical attention. Stop using this medicine and call your doctor right
      away if you have a rash; itching; hoarseness; lightheadedness, dizziness, or
      fainting; trouble breathing; trouble swallowing; or any swelling of your hands,
      face, mouth, or throat after using this medicine.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, drowsy, or have blurred
      vision. Make sure you know how you react to this medicine before you drive,
      use machines, or do anything else that could be dangerous if you are dizzy,
      not alert, or not able to see well .
  - type: paragraph
    text: This medicine may cause dryness in the mouth, nose, and throat. For temporary
      relief of mouth dryness, use sugarless candy or gum, melt bits of ice in your
      mouth, or use a saliva substitute. However, if your mouth continues to feel
      dry for more than 2 weeks, check with your medical doctor or dentist. Continuing
      dryness of the mouth may increase the chance of dental disease, including tooth
      decay, gum disease, and fungus infections.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal vision, including difficulty with adjusting to distances
      - bloody or cloudy urine
      - difficult, burning, or painful urination
      - frequent urge to urinate
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - chills
      - cough
      - diarrhea
      - fever
      - general feeling of discomfort or illness
      - headache
      - joint pain
      - loss of appetite
      - muscle aches and pains
      - nausea
      - pain or tenderness around the eyes and cheekbones
      - shivering
      - shortness of breath or troubled breathing
      - sore throat
      - stuffy or runny nose
      - sweating
      - tightness of the chest or wheezing
      - trouble with sleeping
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Being forgetful
      - bloating or swelling of the face, arms, hands, ankles, lower legs, or feet
      - confusion about identity, place, and time
      - difficulty with swallowing
      - dizziness
      - fast, pounding, or irregular heartbeat or pulse
      - hives
      - itching
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - mood or mental changes
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid weight gain
      - seeing, hearing, or feeling things that are not there
      - skin rash
      - tingling of the hands or feet
      - unusual tiredness or weakness
      - unusual weight gain or loss
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - constipation
      - drowsiness
      - dry eyes
      - dry mouth
      - upset stomach
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - blurred vision
      - difficulty with moving
      - dizziness or lightheadedness
      - dry skin
      - fear or nervousness
      - feeling of constant movement of self or surroundings
      - heartburn
      - indigestion
      - sensation of spinning
      - sleepiness or unusual drowsiness
      - stomach discomfort
      - weight gain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
