title: Treprostinil (inhalation route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Tyvaso
    - type: paragraph
      text: Tyvaso DPI
    - type: paragraph
      text: Yutrepia
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Treprostinil inhalation is used to treat the symptoms of pulmonary arterial
      hypertension (PAH) and pulmonary hypertension with interstitial lung disease
      (PH-ILD) to improve exercise ability. PAH is the high blood pressure that occurs
      in the main artery that carries blood from the right side of the heart (the
      ventricle) to the lungs. When the smaller blood vessels in the lungs become
      more resistant to blood flow, the right ventricle must work harder to pump enough
      blood through the lungs. Treprostinil works by blocking a hormone (a naturally
      occurring substance), that is found in the blood and lungs in large quantities
      of the people with pulmonary arterial hypertension.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of  treprostinil inhalation in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of treprostinil inhalation in the
        elderly. However, elderly patients are more likely to have age-related liver,
        kidney, or heart problems which may require caution and an adjustment in the
        dose for patients receiving treprostinil inhalation.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Abrocitinib
      - Defibrotide
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aceclofenac
      - Acemetacin
      - Acenocoumarol
      - Alipogene Tiparvovec
      - Alteplase, Recombinant
      - Amtolmetin Guacil
      - Anagrelide
      - Apixaban
      - Ardeparin
      - Argatroban
      - Aspirin
      - Bemiparin
      - Betrixaban
      - Bivalirudin
      - Bromfenac
      - Bufexamac
      - Caplacizumab-yhdp
      - Celecoxib
      - Certoparin
      - Choline Salicylate
      - Citalopram
      - Clonixin
      - Clopidogrel
      - Curcumin
      - Dabigatran Etexilate
      - Dalteparin
      - Danaparoid
      - Desirudin
      - Desvenlafaxine
      - Dexibuprofen
      - Dexketoprofen
      - Diclofenac
      - Diflunisal
      - Dipyridamole
      - Dipyrone
      - Droxicam
      - Duloxetine
      - Edoxaban
      - Enoxaparin
      - Eptifibatide
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Garlic
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Breathing problems (eg, COPD, asthma) or
      - Hypotension (low blood pressure)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. Effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Treprostinil inhalation should be taken when you wake up and also before
      any physical activity, but not more than every 4 hours. Do not change your dose
      without talking to your doctor.
  - type: paragraph
    text: This medicine is for use in your lungs. Do not get any of it in your eyes
      or on your skin. If it does get on these areas, rinse it off right away with
      water.
  - type: paragraph
    text: Tyvaso® oral inhalation solution is breathed into your lungs with Tyvaso®
      Inhalation System . This system consists of the Tyvaso® Inhalation System device
      and its accessories. Carefully follow your doctor's instructions for using the
      medicine and operating and cleaning the equipment. Do not put other medicines
      into this equipment.
  - type: paragraph
    text: Do not drink this medicine. Do not allow the inhalation solution to come
      into contact with your skin or eyes. If it does, rinse it off with water right
      away.
  - type: paragraph
    text: To avoid missing a dose or any possible problems with the drug delivery
      device you are using, you should have a back-up with Tyvaso® Inhalation System
      device .
  - type: paragraph
    text: Tyvaso DPI™ inhalation powder should only be inhaled using the Tyvaso DPI™
      Inhaler . This medicine comes with patient instructions. Read these instructions
      carefully before using this medicine. If you do not understand the directions
      or you are not sure how to use the inhaler, ask your doctor to show you what
      to do. Also, ask your doctor to check regularly how you use the inhaler to make
      sure you are using it properly.
  - type: paragraph
    text: 'To use the Tyvaso DPI™ Inhaler :'
  - type: list
    ordered: false
    items:
    - Remove the mouthpiece cover and look at the mouthpiece to make sure it is clean.
    - Hold the inhaler away from your mouth, breathe out fully. Keep your head level,
      put the mouthpiece fully into your mouth and close your lips around it. Tilt
      the inhaler slightly downward to prevent your tongue from blocking the powder.
    - Breathe in through your mouth quickly and deeply as you can until you have taken
      a full deep breath. Hold your breath for as long as you can. Then breathe out
      and continue to breathe normally.
    - Put the mouthpiece cover back after each inhalation and lift up the mouthpiece
      in an upright position to open the inhaler.
    - Do not rinse the inhaler. Always keep it dry.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For pulmonary arterial hypertension and pulmonary hypertension with interstitial
        lung disease: For inhalation dosage form (powder): Adults—At first, 16 micrograms
        (mcg) per treatment session at least 4 hours apart, 4 times a day. Your doctor
        may adjust your dose as needed and tolerated. However, the dose is usually
        not more than 64 mcg per treatment session, 4 times a day. Children—Use and
        dose must be determined by your doctor. For inhalation dosage form (solution):
        Adults—At first, 18 micrograms (mcg) or three breaths, per treatment session
        at least 4 hours apart, 4 times a day. Each treatment session will take 2
        to 3 minutes. Your doctor may adjust your dose as needed and tolerated. However,
        the dose is usually not more than 12 breaths per treatment session, 4 times
        a day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For inhalation dosage form (powder): Adults—At first, 16 micrograms (mcg)
        per treatment session at least 4 hours apart, 4 times a day. Your doctor may
        adjust your dose as needed and tolerated. However, the dose is usually not
        more than 64 mcg per treatment session, 4 times a day. Children—Use and dose
        must be determined by your doctor.'
      - 'For inhalation dosage form (solution): Adults—At first, 18 micrograms (mcg)
        or three breaths, per treatment session at least 4 hours apart, 4 times a
        day. Each treatment session will take 2 to 3 minutes. Your doctor may adjust
        your dose as needed and tolerated. However, the dose is usually not more than
        12 breaths per treatment session, 4 times a day. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 16 micrograms (mcg) per treatment session at least 4 hours
        apart, 4 times a day. Your doctor may adjust your dose as needed and tolerated.
        However, the dose is usually not more than 64 mcg per treatment session, 4
        times a day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—At first, 18 micrograms (mcg) or three breaths, per treatment session
        at least 4 hours apart, 4 times a day. Each treatment session will take 2
        to 3 minutes. Your doctor may adjust your dose as needed and tolerated. However,
        the dose is usually not more than 12 breaths per treatment session, 4 times
        a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Protect the medicine from direct light. Keep your medicine in the unopened
        foil pouch until you are ready to use it. Once the foil pack is opened, the
        ampules should be used within 7 days.
    - type: paragraph
      text: Store the unopened blister strips in the refrigerator. You may also store
        at room temperature for 5 weeks.
    - type: paragraph
      text: Store the opened blister strips in the refrigerator. You may remove the
        medicine from the refrigerator and store at room temperature for 3 days. Do
        not return it in the refrigerator.
    - type: paragraph
      text: Store the Tyvaso DPI™ Inhaler at room temperature. You may also store
        it in the refrigerator but should allow the medicine at room temperature for
        10 minutes before use. Throw away used inhaler after 7 days.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: It is very important that your doctor check your blood pressure regularly
      while you are taking this medicine. You may also need to monitor your blood
      pressure at home. If you notice any changes to your recommended blood pressure,
      call your doctor right away.
  - type: paragraph
    text: This medicine may increase the risk of bleeding. Stay away from rough sports
      or other situations where you could be bruised, cut, or injured. Brush and floss
      your teeth gently. Be careful when using sharp objects, including razors and
      fingernail clippers.
  - type: paragraph
    text: This medicine may make you dizzy, lightheaded, or faint. Do not drive or
      do anything else that could be dangerous until you know how this medicine affects
      you . Standing up slowly from a sitting or lying position can help.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements. Your doctor may adjust the doses of all the
      medicines you are taking or monitor you carefully for side effects.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - fainting
      - feeling of warmth
      - redness of the face, neck, arms and occasionally, upper chest
      - sore throat
      - trouble breathing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody nose
      - chest pain or tightness
      - chills
      - coughing or spitting up blood
      - difficulty or trouble breathing
      - fever
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - noisy breathing
      - sneezing
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - diarrhea
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - headache
      - nausea
      - sweating
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - constipation
      - indigestion
      - loss of appetite
      - muscle, jaw, or bone pain
      - stomach cramps, discomfort, or pain
      - swollen mouth and tongue
      - unpleasant taste
      - urge to have a bowel movement
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
