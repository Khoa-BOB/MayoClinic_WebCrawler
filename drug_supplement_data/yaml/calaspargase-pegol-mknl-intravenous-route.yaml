title: Calaspargase pegol-mknl (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Asparlas
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Calaspargase pegol-mknl injection is used together with other cancer medicines
      to treat patients with acute lymphoblastic leukemia (ALL), a type of white blood
      cell cancer.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of calaspargase pegol-mknl injection
        in children 1 month to 16 years of age. Safety and efficacy have been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of calaspargase pegol-mknl injection in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems (eg, coagulopathy), severe or symptomatic or
      - Blood clotting problems or
      - Liver disease or
      - Pancreatitis—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Blood clots, bleeding problems, or pancreatitis (swelling of the pancreas),
        serious, history of during previous treatment with this medicine or similar
        medicines or
      - Liver disease, severe—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins. The medicine must be given slowly, so the needle will have to stay in
      place for at least 1 hour.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      closely while receiving this medicine to make sure this medicine is working
      properly. Blood and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Receiving this medicine while you are pregnant can harm your unborn baby.
      Birth control pills may not work as well to prevent pregnancy when used with
      this medicine. If you are a woman who can get pregnant, your doctor may do tests
      to make sure you are not pregnant before receiving this medicine. Use another
      form of birth control (eg, condoms, spermicide) along with your pills during
      treatment and for at least 3 months after the last dose. If you think you have
      become pregnant while receiving this medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing
      or swallowing, or any swelling of your hands, face, or mouth after receiving
      this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have loss of appetite, nausea,
      or pains in stomach, side, or abdomen, possibly radiating to the back. These
      could be symptoms of pancreatitis (swelling of the pancreas).
  - type: paragraph
    text: This medicine may increase your risk of developing blood clots. Check with
      your doctor right away if you or your child have swelling and pain in your arms,
      legs, or stomach, chest pain, trouble breathing, loss of sensation, confusion,
      or problems with muscle control or speech.
  - type: paragraph
    text: Check with your doctor right away if you have any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, headache, dizziness, or weakness,
      pain, swelling, or discomfort in a joint, pinpoint red spots on your skin, unusual
      nosebleeds, or unusual vaginal bleeding that is heavier than normal. These may
      be signs of bleeding problems.
  - type: paragraph
    text: Check with your doctor right away if you have bloated stomach, pain or tenderness
      in the upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      weight gain, or yellow eyes or skin. These could be symptoms of a serious liver
      problem (eg, hepatic veno-occlusive disease).
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating
      - chills
      - constipation
      - dark urine
      - difficulty breathing
      - fast heartbeat
      - fever
      - indigestion
      - loss of appetite
      - nausea
      - pain in the chest, groin, or legs, especially the calves
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - severe, sudden headache
      - slurred speech
      - sudden loss of coordination
      - sudden, severe weakness or numbness in the arm or leg
      - vision changes
      - vomiting
      - yellow eyes or skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - chest pain, discomfort, or tightness
      - confusion
      - cough
      - coughing up blood
      - difficulty in swallowing
      - dilated neck veins
      - dizziness
      - extreme tiredness or weakness
      - fainting
      - slow or irregular heartbeat
      - headache
      - increased menstrual flow or vaginal bleeding
      - itching in the genital or other skin areas
      - lightheadedness
      - nosebleeds
      - paralysis
      - prolonged bleeding from cuts
      - rapid, shallow breathing
      - red or black, tarry stools
      - red or dark brown urine
      - scaling of the skin
      - sneezing
      - sore throat
      - swelling of the face, fingers, feet, or lower legs
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
