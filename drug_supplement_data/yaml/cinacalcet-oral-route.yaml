title: Cinacalcet (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Sensipar
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cinacalcet is used to treat hyperparathyroidism in patients with chronic
      kidney disease who are on dialysis. Hyperparathyroidism is a condition that
      is caused when the parathyroid glands located in the neck make too much parathyroid
      hormone (PTH). This hormone helps to control the concentrations of calcium and
      phosphorus in your blood.
  - type: paragraph
    text: Cinacalcet lowers the amount of PTH which lowers the calcium and phosphorus
      concentrations. Cinacalcet is also used to lower calcium in the blood of patients
      with parathyroid cancer and primary hyperparathyroidism.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of cinacalcet in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of cinacalcet in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amphetamine
      - Apalutamide
      - Avacopan
      - Benzphetamine
      - Brexpiprazole
      - Carbamazepine
      - Clarithromycin
      - Clomipramine
      - Clozapine
      - Codeine
      - Conivaptan
      - Dextroamphetamine
      - Dihydrocodeine
      - Donepezil
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Eliglustat
      - Fluoxetine
      - Haloperidol
      - Hydroxyamphetamine
      - Itraconazole
      - Ketoconazole
      - Letermovir
      - Lisdexamfetamine
      - Methadone
      - Methamphetamine
      - Mifepristone
      - Nebivolol
      - Oliceridine
      - Oxycodone
      - Tamoxifen
      - Tazemetostat
      - Tramadol
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Desipramine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bone disease or
      - Heart disease or
      - Heart failure or
      - Heart rhythm problems (eg, arrhythmia, QT prolongation) or
      - Hypotension (low blood pressure) or
      - Seizures, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: It is best to take this medicine with food or shortly after a meal.
  - type: paragraph
    text: Swallow the tablet whole. Do not crush, break, or chew it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For hypercalcemia with parathyroid cancer
        or hyperparathyroidism: Adults—At first, 30 milligrams (mg) two times a day.
        Your doctor may adjust your dose every 2 to 4 weeks. Children—Use and dose
        must be determined by your doctor. For hyperparathyroidism with chronic kidney
        disease: Adults—At first, 30 milligrams (mg) once a day. Your doctor may adjust
        your dose every 2 to 4 weeks. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - 'For hypercalcemia with parathyroid cancer or hyperparathyroidism: Adults—At
        first, 30 milligrams (mg) two times a day. Your doctor may adjust your dose
        every 2 to 4 weeks. Children—Use and dose must be determined by your doctor.'
      - 'For hyperparathyroidism with chronic kidney disease: Adults—At first, 30
        milligrams (mg) once a day. Your doctor may adjust your dose every 2 to 4
        weeks. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 30 milligrams (mg) two times a day. Your doctor may adjust
        your dose every 2 to 4 weeks.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—At first, 30 milligrams (mg) once a day. Your doctor may adjust your
        dose every 2 to 4 weeks.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: 'This medicine may lower the calcium in your blood. If you have any of these
      symptoms, check with your doctor right away: abdominal or stomach cramps, confusion,
      convulsions, difficulty with breathing, irregular heartbeats, mood or mental
      changes, muscle cramps in the hands, arms, feet, legs, or face, numbness and
      tingling around the mouth, fingertips, or feet, shortness of breath, or tremors.'
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you or anyone in your family has ever
      had a heart rhythm problem such as QT prolongation.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      Taking other medicines together with cinacalcet may require your doctor to change
      the dose of one of the medicines or cinacalcet.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain
      - dizziness
      - headache
      - nervousness
      - pounding in the ears
      - slow or fast heartbeat
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Convulsions
      - cough or hoarseness
      - fever or chills
      - loss of bladder control
      - lower back or side pain
      - muscle spasm or jerking of all extremities
      - painful or difficult urination
      - sudden loss of consciousness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps
      - confusion
      - decreased urine output
      - difficulty with breathing
      - difficulty with moving
      - dilated neck veins
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - extreme fatigue
      - fainting
      - irregular breathing
      - irregular heartbeats
      - joint pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - low bone turnover
      - mood or mental changes
      - muscle aching or cramping
      - muscle cramps in the hands, arms, feet, legs, or face
      - muscle pains or stiffness
      - numbness and tingling around the mouth, fingertips, or feet
      - sweating
      - swelling of the face, fingers, feet, or lower legs
      - swollen joints
      - tightness in the chest
      - tremor
      - troubled breathing
      - unusual tiredness or weakness
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - lack or loss of strength
      - loss of appetite
      - nausea
      - vomiting
      - weight loss
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hives or welts, itching, rash
      - redness of the skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
