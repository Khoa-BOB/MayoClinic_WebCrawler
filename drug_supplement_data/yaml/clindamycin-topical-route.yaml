- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Clindamycin belongs to the family of medicines called antibiotics. Topical
      clindamycin is used to help control acne. It may be used alone or with one or
      more other medicines that are used on the skin or taken by mouth for acne. Topical
      clindamycin may also be used for other problems as determined by your doctor.
  - type: paragraph
    text: Clindamycin is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Foam
    - Solution
    - Lotion
    - Pad
    - Gel/Jelly
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of this medicine in children up to
        12 years of age with use in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of this medicine
        in the elderly with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Levoketoconazole
      - Mifepristone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Apalutamide
      - Asciminib
      - Avacopan
      - Belzutifan
      - Berotralstat
      - Carbamazepine
      - Ceritinib
      - Cholera Vaccine, Live
      - Clarithromycin
      - Conivaptan
      - Crizotinib
      - Daridorexant
      - Enasidenib
      - Enzalutamide
      - Erythromycin
      - Fedratinib
      - Fluconazole
      - Gepotidacin
      - Imatinib
      - Itraconazole
      - Lanreotide
      - Lazertinib
      - Lefamulin
      - Letermovir
      - Lonafarnib
      - Mavorixafor
      - Mitotane
      - Mobocertinib
      - Nirogacestat
      - Octreotide
      - Omaveloxolone
      - Pacritinib
      - Palbociclib
      - Phenobarbital
      - Primidone
      - Ranolazine
      - Repotrectinib
      - Ribociclib
      - Selpercatinib
      - Sotorasib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atracurium
      - Metocurine
      - Tubocurarine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - History of stomach or intestinal disease (especially colitis, including colitis
        caused by antibiotics, or enteritis)—These conditions may increase the chance
        of side effects that affect the stomach and intestines
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Before applying this medicine, thoroughly wash the affected areas with warm
      water and soap, rinse well, and pat dry.
  - type: paragraph
    text: When applying the medicine, use enough to cover the affected area lightly.
      You should apply the medicine to the whole area usually affected by acne, not
      just to the pimples themselves. This will help keep new pimples from breaking
      out.
  - type: paragraph
    text: You should avoid washing the acne-affected areas too often. This may dry
      your skin and make your acne worse. Washing with a mild, bland soap 2 or 3 times
      a day should be enough, unless you have oily skin. If you have any questions
      about this, check with your doctor.
  - type: paragraph
    text: Topical clindamycin will not cure your acne. However, to help keep your
      acne under control, keep using this medicine for the full time of treatment,
      even if your symptoms begin to clear up after a few days. You may have to continue
      using this medicine every day for months or even longer in some cases. If you
      stop using this medicine too soon, your symptoms may return. It is important
      that you do not miss any doses.
  - type: paragraph
    text: 'For patients using the topical foam form of clindamycin:'
  - type: list
    ordered: false
    items:
    - After washing or shaving, it is best to wait 30 minutes before applying this
      medicine. The alcohol in it may irritate freshly washed or shaved skin.
    - This medicine contains alcohol and is flammable. Do not use near heat, near
      open flame, or while smoking.
    - 'To apply this medicine: Do not dispense clindamycin topical foam directly onto
      your hands because the foam will begin to melt on contact with warm skin. Remove
      the clear cap. Align the black mark with the nozzle of the actuator. Hold the
      can upright and press firmly to dispense. Dispense amount that will cover the
      affected area(s) directly into the cap or onto a cool surface. The can may be
      placed under cold running water if the can seems warm or the foam seems runny.
      A small amount of topical foam should be picked up with your fingertips and
      massaged gently into the affected areas until the foam disappears. Unused medicine
      that was removed from the can should be throw away. Since this medicine contains
      alcohol, it will sting or burn. In addition, it has an unpleasant taste if it
      gets on the mouth or lips. Therefore, do not get this medicine in the eyes,
      nose, or mouth, or on other mucous membranes. Spread the medicine away from
      these areas when applying. If this medicine does get in the eyes, wash them
      out immediately, but carefully, with large amounts of cool tap water. If your
      eyes still burn or are painful, check with your doctor.'
    - It is important that you do not use this medicine more often than your doctor
      ordered. It may cause your skin to become too dry or irritated.
  - type: list
    ordered: false
    items:
    - Do not dispense clindamycin topical foam directly onto your hands because the
      foam will begin to melt on contact with warm skin.
    - Remove the clear cap. Align the black mark with the nozzle of the actuator.
    - Hold the can upright and press firmly to dispense. Dispense amount that will
      cover the affected area(s) directly into the cap or onto a cool surface.
    - The can may be placed under cold running water if the can seems warm or the
      foam seems runny.
    - A small amount of topical foam should be picked up with your fingertips and
      massaged gently into the affected areas until the foam disappears.
    - Unused medicine that was removed from the can should be throw away.
    - Since this medicine contains alcohol, it will sting or burn. In addition, it
      has an unpleasant taste if it gets on the mouth or lips. Therefore, do not get
      this medicine in the eyes, nose, or mouth, or on other mucous membranes. Spread
      the medicine away from these areas when applying. If this medicine does get
      in the eyes, wash them out immediately, but carefully, with large amounts of
      cool tap water. If your eyes still burn or are painful, check with your doctor.
  - type: paragraph
    text: 'For patients using the topical solution form of clindamycin:'
  - type: list
    ordered: false
    items:
    - After washing or shaving, it is best to wait 30 minutes before applying this
      medicine. The alcohol in it may irritate freshly washed or shaved skin.
    - This medicine contains alcohol and is flammable. Do not use near heat, near
      open flame, or while smoking.
    - 'To apply this medicine: This medicine comes in a bottle with an applicator
      tip, which may be used to apply the medicine directly to the skin. Use the applicator
      with a dabbing motion instead of a rolling motion (not like a roll-on deodorant,
      for example). Tilt the bottle and press the tip firmly against your skin. If
      needed, you can make the medicine flow faster from the applicator tip by slightly
      increasing the pressure against the skin. If the medicine flows too fast, use
      less pressure. If the applicator tip becomes dry, turn the bottle upside down
      and press the tip several times to moisten it. Since this medicine contains
      alcohol, it will sting or burn. In addition, it has an unpleasant taste if it
      gets on the mouth or lips. Therefore, do not get this medicine in the eyes,
      nose, or mouth, or on other mucous membranes. Spread the medicine away from
      these areas when applying. If this medicine does get in the eyes, wash them
      out immediately, but carefully, with large amounts of cool tap water. If your
      eyes still burn or are painful, check with your doctor.'
    - It is important that you do not use this medicine more often than your doctor
      ordered. It may cause your skin to become too dry or irritated.
  - type: list
    ordered: false
    items:
    - This medicine comes in a bottle with an applicator tip, which may be used to
      apply the medicine directly to the skin. Use the applicator with a dabbing motion
      instead of a rolling motion (not like a roll-on deodorant, for example). Tilt
      the bottle and press the tip firmly against your skin. If needed, you can make
      the medicine flow faster from the applicator tip by slightly increasing the
      pressure against the skin. If the medicine flows too fast, use less pressure.
      If the applicator tip becomes dry, turn the bottle upside down and press the
      tip several times to moisten it.
    - Since this medicine contains alcohol, it will sting or burn. In addition, it
      has an unpleasant taste if it gets on the mouth or lips. Therefore, do not get
      this medicine in the eyes, nose, or mouth, or on other mucous membranes. Spread
      the medicine away from these areas when applying. If this medicine does get
      in the eyes, wash them out immediately, but carefully, with large amounts of
      cool tap water. If your eyes still burn or are painful, check with your doctor.
  - type: paragraph
    text: 'For patients using the topical suspension form of clindamycin:'
  - type: list
    ordered: false
    items:
    - Shake well before applying.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (foam): For acne: Adults and children 12 years of
        age and over—Apply once a day to areas affected by acne. Infants and children
        up to 12 years of age—Use and dose must be determined by your doctor.'
      - 'For topical dosage forms (gel, solution, and suspension): For acne: Adults
        and children 12 years of age and over—Apply two times a day to areas affected
        by acne. Infants and children up to 12 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For acne: Adults and children 12 years of age and over—Apply once a day to
        areas affected by acne. Infants and children up to 12 years of age—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and over—Apply once a day to areas affected
        by acne.
      - Infants and children up to 12 years of age—Use and dose must be determined
        by your doctor.
    - type: list
      ordered: false
      items:
      - 'For acne: Adults and children 12 years of age and over—Apply two times a
        day to areas affected by acne. Infants and children up to 12 years of age—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and over—Apply two times a day to areas
        affected by acne.
      - Infants and children up to 12 years of age—Use and dose must be determined
        by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your acne does not improve within about 6 weeks, or if it becomes worse,
      check with your health care professional. However, treatment of acne may take
      up to 8 to 12 weeks before full improvement is seen.
  - type: paragraph
    text: If your doctor has ordered another medicine to be applied to the skin along
      with this medicine, it is best to apply them at different times. This may help
      keep your skin from becoming too irritated. Also, if the medicines are used
      at or near the same time, they may not work properly.
  - type: paragraph
    text: 'For patients using the topical solution form of clindamycin:'
  - type: list
    ordered: false
    items:
    - This medicine may cause the skin to become unusually dry, even with normal use.
      If this occurs, check with your doctor.
  - type: paragraph
    text: In some patients, clindamycin may cause diarrhea.
  - type: list
    ordered: false
    items:
    - Severe diarrhea may be a sign of a serious side effect. Do not take any diarrhea
      medicine without first checking with your doctor . Diarrhea medicines may make
      your diarrhea worse or make it last longer.
    - For mild diarrhea, only diarrhea medicine containing attapulgite (e.g., Kaopectate,
      Diasorb) may be taken. Other kinds of diarrhea medicine (e.g., Imodium A.D.
      or Lomotil) should not be taken. They may make your condition worse or make
      it last longer.
    - If you have any questions about this or if mild diarrhea continues or gets worse,
      check with your health care professional.
  - type: paragraph
    text: You may continue to use cosmetics (make-up) while you are using this medicine
      for acne. However, it is best to use only “water-base” cosmetics. Also, it is
      best not to use cosmetics too heavily or too often. They may make your acne
      worse. If you have any questions about this, check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps, pain, and bloating (severe)
      - diarrhea (watery and severe), which may also be bloody
      - fever
      - increased thirst
      - nausea or vomiting
      - unusual tiredness or weakness
      - weight loss (unusual)—these side effects may also occur up to several weeks
        after you stop using this medicine
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin rash, itching, redness, swelling, or other sign of irritation not present
        before use of this medicine
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dryness, scaliness, or peeling of skin (for the topical solution)
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal pain
      - diarrhea (mild)
      - headache
      - irritation or oiliness of skin
      - stinging or burning feeling of skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
