      - Dexlansoprazole
      - Dienestrol
      - Diethylstilbestrol
      - Dihydroxyaluminum Aminoacetate
      - Dihydroxyaluminum Sodium Carbonate
      - Esomeprazole
      - Esterified Estrogens
      - Estradiol
      - Estramustine
      - Estriol
      - Estropipate
      - Ethinyl Estradiol
      - Fosphenytoin
      - Fostamatinib
      - Gefitinib
      - Imatinib
      - Iron
      - Kelp
      - Lansoprazole
      - Lanthanum Carbonate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Dietary Fiber
      - Grapefruit Juice
      - Soybean
      - Walnut
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Coffee
      - Enteral Nutrition
      - Milk
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Adrenal gland insufficiency (underactive adrenal gland), untreated or
      - Heart attack, acute or recent or
      - Thyrotoxicosis (overactive thyroid), untreated—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Adrenal gland problems or
      - Anemia, pernicious or
      - Angina (severe chest pain), history of or
      - Blood clotting problems, or history of or
      - Diabetes or
      - Heart or blood vessel disease (eg, coronary artery disease, heart failure),
        history of or
      - Heart rhythm problems (eg, arrhythmia, atrial fibrillation), history of or
      - Osteoporosis, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Hypoproteinemia (low levels of protein in the blood), severe or
      - Kidney disease (eg, nephrosis) or
      - Liver disease (eg, hepatitis), severe or
      - Pituitary gland problems (eg, acromegaly) or
      - Porphyria (enzyme problem)—Use with caution. May need to adjust the dose of
        levothyroxine in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Patients who have trouble swallowing capsules (including children younger
        than 6 years of age)—Tirosint® should not be given in these patients.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine will need to be taken for the rest of your life or your child's
      life . Do not stop taking this medicine or change your dose without first checking
      with your doctor. You may have to take this medicine for 4 to 8 weeks before
      your symptoms start to get better.
  - type: paragraph
    text: Take the capsule or tablet in the morning on an empty stomach, at least
      30 to 60 minutes before eating breakfast.
  - type: paragraph
    text: Swallow the capsule whole. Do not cut, chew, or crush it.
  - type: paragraph
    text: If your child is unable to swallow the tablet , you may crush and mix it
      in 1 to 2 teaspoons (5 to 10 milliliters) of water. Give the mixture right away
      using a spoon or dropper. Do not mix the tablet with any other liquid except
      water. Do not store the mixture for future use.
  - type: paragraph
    text: 'If you are using the oral liquid :'
  - type: list
    ordered: false
    items:
    - Take this medicine in the morning on an empty stomach, at least 15 minutes before
      eating breakfast.
    - This medicine may be mixed with water or be given directly into the mouth.
    - If mixed with water, squeeze the contents of 1 single unit-dose ampule into
      a glass or cup containing water. Stir and drink it immediately. Add some water
      to the glass or cup and drink the water. This will help get all of the medicine
      out of the glass or cup. Do not mix this medicine with any other liquid except
      water. Do not store the mixture for later use.
    - If taken without water, squeeze the medicine directly into the mouth or into
      a spoon and swallow it immediately.
  - type: paragraph
    text: If you are using kayexalate, lanthanum, orlistat, sevelamer, sucralfate,
      antacids (eg, aluminum or magnesium hydroxide, simethicone, Maalox®, Mylanta®,
      Tums®), medicine to lower cholesterol (eg, cholestyramine, colesevelam, colestipol,
      Prevalite®,Welchol®, Colestid®), stomach medicine (eg, lansoprazole, omeprazole,
      pantoprazole, Aciphex®, Dexilant®, Nexium®, Prevacid®, Prilosec®), or any medicine
      that contains calcium or iron, take them at least 4 hours before or 4 hours
      after you take levothyroxine .
  - type: paragraph
    text: Cotton seed meal, dietary fiber, soybean flour (infant formula), or walnuts
      may decrease the absorption of this medicine from your body. You may have to
      take this medicine at a different time of day from when you eat these foods.
      Talk with your doctor more about this if you have concerns.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For hypothyroidism: Adults and children
        older than 12 years of age (growth and puberty complete)—Dose is based on
        body weight and must be determined by your doctor. The dose is usually 1.7
        microgram (mcg) per kilogram (kg) of body weight per day but may be less in
        older adults. Children older than 12 years of age (growth and puberty incomplete)—Dose
        is based on body weight and must be determined by your doctor. The dose is
        usually 2 to 3 mcg per kg of body weight per day. Children 6 to 12 years of
        age—Dose is based on body weight and must be determined by your doctor. The
        dose is usually 4 to 5 mcg per kg of body weight per day. Children younger
        than 6 years of age—Use is not recommended as your child might not be able
        to swallow the capsules. For thyroid cancer: Adults—Dose is based on body
        weight and must be determined by your doctor. The dose is usually more than
        2 microgram (mcg) per kilogram (kg) of body weight per day. Children—Use and
        dose must be determined by your doctor.'
      - 'For oral dosage form (solution): For hypothyroidism: Adults and children
        older than 12 years of age (growth and puberty complete)—Dose is based on
