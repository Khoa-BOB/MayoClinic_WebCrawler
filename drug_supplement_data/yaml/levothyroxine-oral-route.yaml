    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Use the oral liquid within 3 months after opening the pouch. Keep the
        ampules in the pouch until you are ready to use them.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child at regular visits . This will allow your doctor to see if the medicine
      is working properly and to decide if you should continue to take it. Blood tests
      will be needed to check for unwanted effects.
  - type: paragraph
    text: Levothyroxine should not be used for the treatment of obesity or for the
      purpose of losing weight. This medicine is not effective for weight reduction.
      If taken in large amounts, levothyroxine may cause serious unwanted effects.
  - type: paragraph
    text: Hypothyroidism can sometimes cause infertility in men and women. Levothyroxine
      should not be used for the treatment of infertility unless it is caused by hypothyroidism.
  - type: paragraph
    text: 'For patients with diabetes : It is very important that you keep track of
      your blood or urine sugar levels as instructed by your doctor. Check with your
      doctor right away if you notice any changes in your sugar levels.'
  - type: paragraph
    text: If you think you have become pregnant while using this medicine, tell your
      doctor right away. You may need a larger dose of levothyroxine while you are
      pregnant.
  - type: paragraph
    text: Women who are post-menopausal or who use this medicine for a long time may
      have some bone loss, which could lead to osteoporosis. Talk with your doctor
      if you have questions or concerns about this.
  - type: paragraph
    text: Call your doctor right away if you or your child has rapid or irregular
      heartbeats, chest pain, leg cramps, headaches, nervousness, irritability, sleeplessness,
      tremors, a change in appetite, weight gain or loss, vomiting, diarrhea, excessive
      sweating, heat intolerance, a fever, changes in menstrual periods, hives, or
      a skin rash. These could be symptoms of too much medicine in your body.
  - type: paragraph
    text: Check with your doctor right away if you have weakness, confusion or non-responsiveness,
      feeling cold, low body temperature, swelling of the body, especially the face,
      tongue, and lower legs, or difficulty breathing . These could be symptoms of
      severe hypothyroidism, called myxedema coma, which may be life-threatening and
      requires immediate medical attention.
  - type: paragraph
    text: Do not suddenly stop taking this medicine without first checking with your
      doctor . Your doctor may want you or your child to gradually reduce the amount
      you are using before stopping completely.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you or your child
      are using this medicine. You or your child may need to stop using this medicine
      several days before having surgery or medical tests.
  - type: paragraph
    text: A temporary loss of hair may occur during the first few months of levothyroxine
      therapy. Ask your doctor about this if you have any concerns.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain, discomfort, or tightness
      - decreased urine output
      - difficult or labored breathing
      - difficulty with swallowing
      - dilated neck veins
      - extreme fatigue
      - fainting
      - fast, slow, irregular, pounding, or racing heartbeat or pulse
      - fever
      - heat intolerance
      - hives or welts, skin itching, rash, or redness
      - irregular breathing
      - irritability
      - menstrual changes
      - nausea
      - pain or discomfort in the arms, jaw, back, or neck
      - sweating
      - swelling of the eyes, face, lips, throat, or tongue
      - tremors
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred or double vision
      - dizziness
      - eye pain
      - lack or slowing of normal growth in children
      - limp or walk favoring one leg
      - pain in the hip or knee
      - seizures
      - severe headache
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in consciousness
      - cold, clammy skin
      - confusion
      - disorientation
      - fast or weak pulse
      - lightheadedness
      - loss of consciousness
      - sudden headache
      - sudden loss of coordination
      - sudden slurring of speech
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in appetite
      - crying
      - diarrhea
      - false or unusual sense of well-being
      - fear or nervousness
      - feeling not well or unhappy
      - feeling of discomfort
      - feeling of warmth
      - feeling things are not real
      - feelings of suspicion and distrust
      - hair loss
      - headache
      - increased appetite
      - mental depression
      - muscle weakness
      - quick to react or overreact emotionally
      - rapidly changing moods
      - redness of the face, neck, arms, and occasionally, upper chest
      - restlessness
      - stomach cramps
      - trouble getting pregnant
      - trouble sitting still
      - unusual tiredness or weakness
      - vomiting
      - weight gain or loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
