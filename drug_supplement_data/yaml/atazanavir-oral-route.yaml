      - Etonogestrel
      - Gestodene
      - Levonorgestrel
      - Mestranol
      - Norethindrone
      - Norgestimate
      - Norgestrel
      - Telaprevir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Gallbladder problems or
      - Hemophilia (bleeding problem) or
      - Hyperglycemia (high blood sugar) or
      - Kidney disease or
      - Liver disease (eg, hepatitis B or C)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Heart block or
      - Heart conduction problems (eg, prolonged PR interval)—Use with caution. May
        increase the chance of having side effects.
    - type: list
      ordered: false
      items:
      - Phenylketonuria—The oral powder contains phenylalanine, which can make this
        condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not change the
      dose or stop using this medicine without checking first with your doctor. When
      your supply of this medicine is running low, contact your doctor or pharmacist
      ahead of time. Do not allow yourself to run out of this medicine.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: This medicine may be taken in combination with other medicines that are
      used to treat HIV infection. Take all of the medicines your doctor has prescribed
      at the right time of day and in the correct order. Do not stop using your medicine
      unless your doctor tells you to.
  - type: paragraph
    text: This medicine is available in 2 forms. You may use a capsule or an oral
      powder . Your doctor may adjust your dose if you need to switch from one form
      to another.
  - type: paragraph
    text: It is important that atazanavir be taken with food.
  - type: paragraph
    text: Swallow the capsule whole. Do not open it.
  - type: paragraph
    text: 'For patients using the oral powder :'
  - type: list
    ordered: false
    items:
    - Determine the number of packets that are needed. Do not open a packet until
      you are ready to use it.
    - Mix the oral powder with food (eg, applesauce or yogurt) or a beverage (milk,
      infant formula, water). You may mix it in a container or a cup and use an oral
      dosing syringe or small medicine cup to give it to a child.
    - After mixing your medicine with food or liquid, use the mixture right away or
      within 1 hour. Be sure to drink or swallow all of the mixture.
  - type: paragraph
    text: If you are also using antacids or didanosine (Videx®), take atazanavir 2
      hours before or 1 hour after these medicines.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For HIV infection (patient already had HIV
        treatment): Adults—300 milligrams (mg) with 100 mg of ritonavir (Norvir®)
        once a day. For patients who are also taking atazanavir in combination with
        both H2RA and tenofovir, the dose is usually 400 mg with 100 mg of ritonavir
        (Norvir®) once a day. Pregnant patients—300 mg with 100 mg of ritonavir (Norvir®)
        once a day. For pregnant patients who are also taking atazanavir in combination
        with both H2RA or tenofovir, the dose is usually 400 mg with 100 mg of ritonavir
        (Norvir®) once a day. Children 6 to 17 years and weighing 35 kilograms (kg)
        or more—Dose is based on body weight and must be determined by your doctor.
        However, the dose is usually 300 mg with 100 mg of ritonavir (Norvir®) once
        a day. Children 6 to 17 years and weighing 15 to less than 35 kg—Dose is based
        on body weight and must be determined by your doctor. However, the dose is
        usually 200 mg with 100 mg of ritonavir (Norvir®) once a day. Children 6 to
        17 years and weighing less than 15 kg—Use of capsules is not recommended.
        For HIV infection (patient never had HIV treatment): Adults—300 milligrams
        (mg) with 100 mg of ritonavir (Norvir®) once a day. For patients who are unable
        to tolerate ritonavir, the dose is usually 400 mg (without ritonavir) once
        day. For patients who are also taking atazanavir in combination with efavirenz,
        the dose is usually 400 mg with 100 mg of ritonavir (Norvir®) once a day.
        Pregnant patients—300 mg with 100 mg of ritonavir (Norvir®) once a day. Children
        6 to 17 years and weighing 35 kilograms (kg) or more—Dose is based on body
        weight and must be determined by your doctor. However, the dose is usually
        300 mg with 100 mg of ritonavir (Norvir®) once a day. For children at least
        13 years old and weighing 40 kilograms (kg) who are unable to tolerate ritonavir,
        the dose is usually 400 mg (without ritonavir) once day. Children 6 to 17
        years and weighing 15 to less than 35 kg—Dose is based on body weight and
        must be determined by your doctor. However, the dose is usually 200 mg with
        100 mg of ritonavir (Norvir®) once a day. Children 6 to 17 years and weighing
        less than 15 kg—Use of capsules is not recommended.'
      - 'For oral dosage form (oral powder): For HIV infection: Children 3 months
        of age and older and weighing at least 25 kilograms (kg) who are unable to
        swallow the capsule—Dose is based on body weight and must be determined by
        your doctor. However, the dose is usually 300 milligrams (mg) (6 packets)
        with 100 mg of ritonavir (Norvir®) once a day. Children 3 months of age and
        older and weighing 15 to less than 25 kg—Dose is based on body weight and
        must be determined by your doctor. However, the dose is usually 250 mg (5
        packets) with 80 mg of ritonavir (Norvir®) once a day. Children 3 months of
        age and older and weighing 5 to less than 15 kg—Dose is based on body weight
        and must be determined by your doctor. However, the dose is usually 200 mg
        (4 packets) with 80 mg of ritonavir (Norvir®) once a day. For children weighing
        5 to less than 10 kg and cannot tolerate the 200 mg dose and have not taken
        an HIV protease inhibitor, they may take 150 mg (3 packets) once a day. Children
        younger than 3 months of age or weighing less than 5 kg—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For HIV infection (patient already had HIV treatment): Adults—300 milligrams
        (mg) with 100 mg of ritonavir (Norvir®) once a day. For patients who are also
        taking atazanavir in combination with both H2RA and tenofovir, the dose is
        usually 400 mg with 100 mg of ritonavir (Norvir®) once a day. Pregnant patients—300
        mg with 100 mg of ritonavir (Norvir®) once a day. For pregnant patients who
        are also taking atazanavir in combination with both H2RA or tenofovir, the
        dose is usually 400 mg with 100 mg of ritonavir (Norvir®) once a day. Children
