title: Morphine (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Astramorph PF
    - type: paragraph
      text: Duramorph
    - type: paragraph
      text: Infumorph
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Morphine injection is used to treat pain severe enough to require opioid
      treatment and when other pain medicines did not work well enough or cannot be
      tolerated. It may also be used before or during surgery with an anesthetic (medicine
      that puts you to sleep). Morphine belongs to the group of medicines called narcotic
      analgesics (pain medicines). It acts on the central nervous system (CNS) to
      relieve pain.
  - type: paragraph
    text: When a narcotic medicine is used for a long time, it may become habit-forming,
      causing mental or physical dependence. However, people who have continuing pain
      should not let the fear of dependence keep them from using narcotics to relieve
      their pain. Mental dependence (addiction) is not likely to occur when narcotics
      are used for this purpose. Physical dependence may lead to withdrawal side effects
      if treatment is stopped suddenly. However, severe withdrawal side effects can
      usually be prevented by gradually reducing the dose over a period of time before
      treatment is stopped completely.
  - type: paragraph
    text: This medicine is to be given only by or under the immediate supervision
      of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of morphine injection in children
        1 month of age and older. Safety and efficacy in infants younger than 1 month
        of age have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of morphine injection in the pediatric population. Safety and
        efficacy have not been established. Use of morphine epidural injection is
        not recommended in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of morphine injection in the elderly.
        However, elderly patients are more likely to have age-related kidney, heart,
        liver, or lung problems, which may require caution and an adjustment in the
        dose for patients receiving morphine injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
      - Linezolid
      - Methylene Blue
      - Naltrexone
      - Ozanimod
      - Phenelzine
      - Procarbazine
      - Rasagiline
      - Safinamide
      - Samidorphan
      - Selegiline
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abrocitinib
      - Acepromazine
      - Aclidinium
      - Adagrasib
      - Alfentanil
      - Almotriptan
      - Alogliptin
      - Alprazolam
      - Alvimopan
      - Amantadine
      - Amifampridine
      - Amiloride
      - Amineptine
      - Amiodarone
      - Amitriptyline
      - Amitriptylinoxide
      - Amobarbital
      - Amoxapine
      - Amphetamine
      - Anileridine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Asenapine
      - Asunaprevir
      - Atorvastatin
      - Atropine
      - Azithromycin
      - Baclofen
      - Belladonna
      - Bemetizide
      - Bendroflumethiazide
      - Benperidol
      - Bentazepam
      - Benzhydrocodone
      - Benzphetamine
      - Benzthiazide
      - Benztropine
      - Berotralstat
      - Biperiden
      - Boceprevir
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Desflurane
      - Esmolol
      - Somatostatin
      - Yohimbine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Addison's disease (adrenal gland problem) or
      - Alcohol abuse, or history of or
      - Asthma, severe or
      - Brain tumor or
      - Breathing problems, severe (e.g., hypoxia) or
      - Chronic obstructive pulmonary disease (COPD) or
      - Cor pulmonale (serious heart condition) or
      - Drug dependence, especially with narcotics, or history of or
      - Enlarged prostate (BPH, prostatic hypertrophy) or
      - Gallbladder disease or gallstones or
      - Head injuries, history of or
      - Heart disease or
      - Hypothyroidism (an underactive thyroid) or
      - Hypovolemia (low blood volume) or
      - Increased pressure in the head or
      - Kyphoscoliosis (curvature of the spine with breathing problems) or
      - Problems with passing urine or
      - Respiratory depression (very slow breathing) or
      - Ulcerative colitis—Use with caution. May increase risk for more serious side
        effects.
    - type: list
      ordered: false
      items:
      - Asthma, acute or severe or
      - Heart failure from lung disease or
      - Heart rhythm problems (eg, atrial flutter, tachycardia) or
      - Lung or breathing problems, severe or
      - Stomach or bowel blockage (eg, paralytic ileus)—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Heart attack or
      - Hypotension (low blood pressure) or
      - Seizures, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. This medicine may be given as a shot under the skin, as a shot
      into one of your muscles, or through an IV catheter placed in one of your veins.
      It can also be given through a needle or catheter into your back.
  - type: paragraph
    text: Your doctor will give you a few doses of this medicine until your condition
      improves, and then switch you to an oral medicine that works the same way. If
      you have any concerns about this, talk to your doctor.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child while you are receiving this medicine . This will allow your doctor to
      see if the medicine is working properly and to decide if you should continue
      to use it. Blood and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not use this medicine if you are using or have used an MAO inhibitor
      (MAOI) such as isocarboxazid [Marplan®], linezolid [Zyvox®], phenelzine [Nardil®],
      selegiline [Eldepryl®], tranylcypromine [Parnate®]) within the past 14 days.
  - type: paragraph
    text: Check with your doctor before using this medicine with alcohol or other
      medicines that affect the central nervous system (CNS) . The use of alcohol
      or other medicines may worsen the side effects of this medicine, such as dizziness,
      poor concentration, drowsiness, unusual dreams, and trouble with sleeping. Some
      examples of medicines that affect the CNS are antihistamines or medicine for
      allergies or colds, sedatives, tranquilizers, or sleeping medicines, medicine
      for depression, medicine for anxiety, prescription pain medicine or narcotics,
      medicine for attention deficit and hyperactivity disorder, medicine for seizures
      or barbiturates, muscle relaxants, or anesthetics, including some dental anesthetics.
  - type: paragraph
    text: This medicine may cause sleep-related breathing problems (eg, sleep apnea,
      sleep-related hypoxemia). Your doctor may decrease your dose if you have sleep
      apnea while using this medicine.
  - type: paragraph
    text: Using this medicine while you are pregnant may cause neonatal withdrawal
      syndrome in your newborn baby. Check with your doctor right away if your baby
      has an abnormal sleep pattern, diarrhea, a high-pitched cry, irritability, shakiness
      or tremors, weight loss, vomiting, or fails to gain weight. Tell your doctor
      right away if you think you are pregnant or if you plan to become pregnant while
      using this medicine.
  - type: paragraph
    text: Call your doctor right away if you have worsening of pain, increased sensitivity
      to pain, or new pain after taking this medicine. These may be symptoms of opioid-induced
      hyperalgesia and allodynia.
  - type: paragraph
    text: This medicine may be habit-forming. If you or your child feel that the medicine
      is not working as well, do not use more than your prescribed dose. Call your
      doctor for instructions.
  - type: paragraph
    text: Using narcotics for a long time can cause severe constipation. To prevent
      this, your doctor may direct you or your child to take laxatives, drink a lot
      of fluids, or increase the amount of fiber in the diet. Be sure to follow the
      directions carefully, because continuing constipation can lead to more serious
      problems.
  - type: paragraph
    text: This medicine may cause adrenal gland problems. Check with your doctor right
      away if you have darkening of the skin, diarrhea, dizziness, fainting, loss
      of appetite, mental depression, nausea, skin rash, unusual tiredness or weakness,
      or vomiting.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur when you or your child
      get up suddenly from a lying or sitting position. Getting up slowly may help
      lessen this problem. Also, lying down for a while may relieve the dizziness
      or lightheadedness.
  - type: paragraph
    text: This medicine may make you dizzy, drowsy, confused, or disoriented. Make
      sure you know how you react to this medicine before you drive, use machines,
      or do anything else that could be dangerous if you are dizzy or not alert .
  - type: paragraph
    text: Before having any kind of surgery (including dental surgery) or emergency
      treatment, tell the medical doctor or dentist in charge that you or your child
      are using this medicine. Serious unwanted effects can occur if certain medicines
      are given together with morphine injection.
  - type: paragraph
    text: If you or your child have been using this medicine regularly for several
      weeks or longer, do not suddenly stop using it without checking with your doctor
      . Your doctor may want you to gradually reduce the amount you are using before
      stopping it completely. This may help prevent worsening of your condition and
      reduce the possibility of withdrawal symptoms, including stomach cramps, anxiety,
      fever, nausea, runny nose, sweating, tremors, or trouble with sleeping.
  - type: paragraph
    text: Check with your doctor right away if you or your child have anxiety, restlessness,
      a fast heartbeat, fever, sweating, muscle spasms, twitching, nausea, vomiting,
      diarrhea, or see or hear things that are not there. These may be symptoms of
      a serious condition called serotonin syndrome. Your risk may be higher if you
      also take certain other medicines that affect serotonin levels in your body.
  - type: paragraph
    text: Using too much of this medicine may cause infertility (unable to have children).
      Talk with your doctor before using this medicine if you plan to have children.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficult or trouble breathing
      - irregular, fast or slow, or shallow breathing
      - pale or blue lips, fingernails, or skin
      - very slow breathing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - blurred vision
      - chest tightness
      - confusion
      - cough
      - darkening of the skin
      - decrease in frequency of urination
      - decrease in the amount of urine
      - diarrhea
      - difficulty in passing urine (dribbling)
      - difficulty swallowing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fever
      - increased sensitivity to pain
      - loss of appetite
      - mental depression
      - nausea
      - overactive reflexes
      - painful urination
      - poor coordination
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - seizures
      - shivering
      - sweating
      - talking or acting with excitement you cannot control
      - trembling or shaking
      - twitching
      - unusual tiredness or weakness
      - worsening of pain
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in consciousness
      - decreased awareness or responsiveness
      - difficulty with breathing
      - irregular, fast or slow, or shallow breathing
      - lack of muscle tone
      - lightheadedness
      - loss of consciousness
      - pale or blue lips, fingernails, or skin
      - pinpointed pupils of the eyes
      - severe sleepiness
      - slow or irregular heartbeat
      - trouble breathing
      - unusual tiredness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Absent, missed, or irregular menstrual periods
      - anxiety
      - decreased interest in sexual intercourse
      - delusions
      - depersonalization
      - difficulty having a bowel movement (stool)
      - false or unusual sense of well-being
      - hallucinations
      - headache
      - inability to have or keep an erection
      - itching skin
      - loss in sexual ability, desire, drive, or performance
      - menstrual changes
      - stopping of menstrual bleeding
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
