    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: The areas affected by herpes, chickenpox, or shingles should be kept as
      clean and dry as possible. Also, wear loose-fitting clothing to avoid irritating
      the sores (blisters).
  - type: paragraph
    text: It is important to remember that acyclovir will not keep you from spreading
      herpes to others.
  - type: paragraph
    text: Herpes infection of the genitals can be caught from or spread to your partner
      during any sexual activity. Even though you may get herpes if your partner has
      no symptoms, the infection is more likely to be spread if sores are present.
      This is true until the sores are completely healed and the scabs have fallen
      off. Therefore, it is best to avoid any sexual activity if either you or your
      sexual partner has any symptoms of herpes. The use of a latex condom (“rubber”')
      may help prevent the spread of herpes. However, spermicidal (sperm-killing)
      jelly or a diaphragm will probably not help.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain, swelling, or redness at place of injection
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - decreased frequency of urination or amount of urine
      - increased thirst
      - loss of appetite
      - nausea or vomiting
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blood in urine or stools
      - chills, fever, or sore throat
      - confusion
      - convulsions (seizures)
      - hallucinations (seeing, hearing, or feeling things that are not there)
      - hives
      - pinpoint red spots on skin
      - trembling
      - unusual bleeding or bruising
    subsections: []
  - heading: Frequency not determined
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding or oozing from puncture sites or mucous membranes (bowel, mouth,
        nose, or urinary bladder), continuing
      - blistering, peeling, or loosening of skin
      - bluish coloring, especially of the hands and feet
      - blurred vision
      - bruising at the place of injection
      - changes in facial skin color
      - changes in vision
      - clumsiness
      - coughing
      - decreased consciousness
      - difficulty in breathing or swallowing
      - dizziness or feeling faint, severe
      - fast heartbeat
      - irritability
      - itching or skin rash
      - large hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
        feet, sex organs
      - mood or mental changes
      - muscle cramps, pain, or weakness
      - pale skin
      - red or irritated eyes
      - sense of agitation or uneasiness
      - shakiness and unsteady walk
      - sores, ulcers, or white spots in mouth or on lips
      - swelling of eyelids, face, feet, hands, lower legs or lips
      - swollen, painful, or tender lymph nodes (glands) in neck, armpit, or groin
      - unsteadiness or other problems with muscle control or coordination
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - General feeling of discomfort or illness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - headache
    subsections: []
  - heading: Frequency not determined
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, prickling, or tingling sensations
      - drowsiness
      - loss of hair
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
