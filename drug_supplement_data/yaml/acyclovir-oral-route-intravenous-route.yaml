title: Acyclovir (oral route, intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Zovirax
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Acyclovir
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Acyclovir belongs to the family of medicines called antivirals, which are
      used to treat infections caused by viruses. Usually these medicines work for
      only one kind or group of virus infections.
  - type: paragraph
    text: Acyclovir is used to treat the symptoms of chickenpox, shingles, herpes
      virus infections of the genitals (sex organs), the skin, the brain, and mucous
      membranes (lips and mouth), and widespread herpes virus infections in newborns.
      Acyclovir is also used to prevent recurrent genital herpes infections. Although
      acyclovir will not cure herpes, it does help relieve the pain and discomfort
      and helps the sores (if any) heal faster.
  - type: paragraph
    text: Acyclovir may also be used for other virus infections as determined by your
      doctor. However, it does not work in treating certain virus infections, such
      as the common cold.
  - type: paragraph
    text: Acyclovir is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Suspension
    - Capsule
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: A limited number of studies have been done using oral acyclovir in children,
        and it has not caused different effects or problems in children than it does
        in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Agitation, confusion, dizziness, and drowsiness may be especially likely
        to occur in elderly patients who are usually more sensitive than younger adults
        to the central nervous system effects of acyclovir.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Fezolinetant
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Bupropion
      - Clomipramine
      - Dichlorphenamide
      - Emtricitabine
      - Fexinidazole
      - Foscarnet
      - Hydroxychloroquine
      - Leflunomide
      - Mycophenolate Mofetil
      - Nitisinone
      - Pimozide
      - Tenofovir Alafenamide
      - Teriflunomide
      - Tizanidine
      - Vadadustat
      - Warfarin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Fosphenytoin
      - Phenytoin
      - Valproic Acid
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Kidney disease—Dehydration or kidney disease may increase blood levels of
        acyclovir, increasing the chance of side effects.
    - type: list
      ordered: false
      items:
      - Nervous system problems—Acyclovir may make these problems worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Patient information about the treatment of herpes, chickenpox, or shingles
      is available with this medicine. Read it carefully before using this medicine.
  - type: paragraph
    text: Acyclovir is best used as soon as possible after the symptoms of herpes
      infection or shingles (for example, pain, burning, blisters) begin to appear.
  - type: paragraph
    text: If you are taking acyclovir for the treatment of chickenpox , it is best
      to start taking acyclovir as soon as possible after the first sign of the chickenpox
      rash , usually within one day.
  - type: paragraph
    text: Acyclovir capsules, tablets, and oral suspension may be taken with meals
      or on an empty stomach.
  - type: paragraph
    text: Acyclovir is best taken with a full glass (8 ounces) of water.
  - type: paragraph
    text: If you are using acyclovir oral suspension , use a specially marked measuring
      spoon or other device to measure each dose accurately. The average household
      teaspoon may not hold the right amount of liquid.
  - type: paragraph
    text: To help clear up your herpes infection, chickenpox, or shingles, keep taking
      acyclovir for the full time of treatment , even if your symptoms begin to clear
      up after a few days. Do not miss any doses . However, do not use this medicine
      more often or for a longer time than your doctor ordered.
  - type: paragraph
    text: If you are taking acyclovir capsules, tablets, or oral suspension, you should
      drink plenty of water to avoid becoming dehydrated.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules, oral suspension, or tablets): For treatment
        of genital herpes: Adults and children 12 years of age and older—200 milligrams
        (mg) five times a day for ten days. Children up to 12 years of age—Use and
        dose must be determined by the doctor. For prevention of recurrent outbreaks
        of genital herpes infections: Adults and children 12 years of age and older—200
        to 400 mg two to five times a day for five days or up to twelve months, depending
        on how often your outbreaks of infection occur. Children up to 12 years of
        age—Use and dose must be determined by the doctor. For treatment of chickenpox:
        Adults and children who weigh over 88 pounds (40 kilograms)—800 mg four times
        a day for five days. Children 2 years of age and older and weighing 88 pounds
        (40 kilograms) or less—Dose is based on body weight and must be determined
        by the doctor. The usual dose is 20 mg per kilogram (kg) of body weight, up
        to 800 mg, four times a day for five days. Children up to 2 years of age—Use
        and dose must be determined by the doctor. For treatment of shingles: Adults
        and children 12 years of age and older—800 mg five times a day for seven to
        ten days. Children up to 12 years of age—Use and dose must be determined by
        the doctor.'
      - 'For injection dosage form: For treatment of herpes of the brain, genitals,
        or mucous membranes, or for the treatment of shingles: Adults and children
        12 years of age and older—Dose is based on body weight and must be determined
        by the doctor. The usual dose is 5 to 10 mg of acyclovir per kg (2.3 to 4.5
        mg per pound) of body weight, injected slowly into a vein over at least a
        one-hour period, and repeated every eight hours for five to ten days. Children
        up to 12 years of age—Dose is based on body weight and must be determined
        by the doctor. The usual dose is 10 mg to 20 mg of acyclovir per kg (4.5 mg
        to 9.1 mg per pound) of body weight, injected slowly into a vein over at least
        a one-hour period and repeated every eight hours for seven to ten days. For
        treatment of widespread herpes virus infection in newborns: Infants from birth
        to 3 months of age—Dose is based on body weight and must be determined by
        the doctor. The usual dose is 10 mg of acyclovir per kg (4.5 mg per pound)
        of body weight, injected slowly into a vein over at least a one-hour period
        and repeated every eight hours for ten days.'
    - type: list
      ordered: false
      items:
      - 'For treatment of genital herpes: Adults and children 12 years of age and
        older—200 milligrams (mg) five times a day for ten days. Children up to 12
        years of age—Use and dose must be determined by the doctor.'
