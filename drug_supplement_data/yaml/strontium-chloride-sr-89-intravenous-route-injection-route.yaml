title: Strontium chloride sr 89 (intravenous route, injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Metastron
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Strontium chloride Sr 89 is a radiopharmaceutical. Radiopharmaceuticals
      are radioactive agents that may be used to diagnose some diseases by studying
      the function of the body's organs or to treat certain diseases.
  - type: paragraph
    text: Strontium chloride Sr 89 is used to help relieve the bone pain that may
      occur with certain kinds of cancer. The radioactive strontium is taken up in
      the bone cancer area and gives off radiation that helps provide relief of pain.
  - type: paragraph
    text: Strontium chloride Sr 89 is to be given only by or under the direct supervision
      of a doctor with specialized training in nuclear medicine or radiation oncology.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information about its use in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Strontium chloride Sr 89 has been used in older people and has not been
        shown to cause different side effects or problems in older people than it
        does in younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: The presence of other medical problems may affect the use of strontium
        chloride Sr 89. Make sure you tell your doctor if you have any other medical
        problems.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your doctor may have special instructions for you to follow to get ready
      for your treatment. If you do not understand them or if you have not received
      such instructions, check with your doctor in advance.
  - type: paragraph
    text: If you have a problem controlling your bladder, tell your doctor before
      receiving strontium chloride Sr 89. Special precautions will need to be taken
      to prevent contamination of clothing, bed linen, and the environment.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly and to check for unwanted
      effects. You may need to have blood tests done regularly.
  - type: paragraph
    text: 'Follow these guidelines for 1 week after receiving strontium chloride Sr
      89, to help reduce the chance of contaminating other persons or the environment:'
  - type: list
    ordered: false
    items:
    - Use a normal toilet, if available, instead of a urinal.
    - Strontium chloride Sr 89 is passed in the urine and feces. To prevent contamination
      of your home environment, flush the toilet twice after using.
    - Wipe any spilled urine with a tissue and flush it away.
    - Wash your hands after using or cleaning the toilet .
    - Wash your clothes and bed linens immediately if they become soiled with your
      urine or blood. Wash them separately from other clothes.
    - If you cut yourself, wash away any spilled blood .
  - type: paragraph
    text: 'Strontium chloride Sr 89 can temporarily lower the number of white blood
      cells in your blood, increasing the chance of getting an infection. It can also
      lower the number of platelets, which are necessary for proper blood clotting.
      If your blood count becomes abnormally low, there are certain precautions you
      can take, to reduce the risk of infection or bleeding, such as:'
  - type: list
    ordered: false
    items:
    - 'With abnormally low white blood cell counts: If you can, avoid people with
      infections. Check with your doctor immediately if you think you are getting
      an infection or if you get a fever or chills, cough or hoarseness, lower back
      or side pain, or painful or difficult urination. Be careful when using a regular
      toothbrush, dental floss, or toothpick. Your medical doctor, dentist, or nurse
      may recommend other ways to clean your teeth and gums. Check with your medical
      doctor before having any dental work done. Do not touch your eyes or the inside
      of your nose unless you have just washed your hands and have not touched anything
      else in the meantime.'
    - 'With abnormally low platelet blood counts: Be careful not to cut yourself when
      you are using sharp objects such as a safety razor or fingernail or toenail
      cutters. Avoid contact sports or other situations where bruising or injury could
      occur.'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
  - type: list
    ordered: false
    items:
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      When strontium chloride Sr 89 is used at recommended doses, side effects usually
      are rare. However, blood problems, such as a decrease in the number of white
      blood cells or platelets, may occur in some patients.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blood in urine or stools
      - cough or hoarseness
      - fever or chills
      - lower back or side pain
      - painful or difficult urination
      - pinpoint red spots on skin
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Flushing
      - increase in bone pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
