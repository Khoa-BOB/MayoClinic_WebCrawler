title: Menthol and methyl salicylate (topical application route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Benalg
    - type: paragraph
      text: Thera-Gesic
    subsections: []
  - heading: Canadian Brand Name
    level: 3
