title: Sodium iodide (oral route, injection route, intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Iodopen
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Sodium iodide is used to prevent or treat iodine deficiency.
  - type: paragraph
    text: The body needs iodine for normal growth and health. For patients who are
      unable to get enough iodine in their regular diet or who have a need for more
      iodine, sodium iodide may be necessary. Iodine is needed so that your thyroid
      gland can function properly.
  - type: paragraph
    text: Iodine deficiency in the United States is rare because iodine is added to
      table salt. Most people get enough salt from the foods they eat, without adding
      salt to their meals. Iodine deficiency is a problem in other areas of the world.
  - type: paragraph
    text: Lack of iodine may lead to thyroid problems, mental problems, hearing loss,
      and goiter.
  - type: paragraph
    text: Injectable sodium iodide is administered only by or under the supervision
      of a health care professional. Some multivitamin/mineral preparations that contain
      sodium iodide are available without your health care professional's prescription.
  subsections:
  - heading: Importance Of Diet
    level: 3
    content:
    - type: paragraph
      text: For good health, it is important that you eat a balanced and varied diet.
        Follow carefully any diet program your health care professional may recommend.
        For your specific dietary vitamin and/or mineral needs, ask your health care
        professional for a list of appropriate foods. If you think that you are not
        getting enough vitamins and/or minerals in your diet, you may choose to take
        a dietary supplement.
    - type: paragraph
      text: Iodine is found in various foods, including seafood, small amounts of
        iodized salt, and vegetables grown in iodine-rich soils. Iodine-containing
        mist from the ocean is another important source of iodine, since iodine is
        absorbed by the skin. Iodized salt provides 76 micrograms (mcg) of iodine
        per gram of salt.
    - type: paragraph
      text: The daily amount of iodine needed is defined in several different ways.
    subsections: []
  - heading: For U.S.—
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Recommended Dietary Allowances (RDAs) are the amount of vitamins and minerals
        needed to provide for adequate nutrition in most healthy persons. RDAs for
        a given nutrient may vary depending on a person's age, sex, and physical condition
        (e.g., pregnancy).
      - Daily Values (DVs) are used on food and dietary supplement labels to indicate
        the percent of the recommended daily amount of each nutrient that a serving
        provides. DV replaces the previous designation of United States Recommended
        Daily Allowances (USRDAs).
    subsections: []
  - heading: For Canada—
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Recommended Nutrient Intakes (RNIs) are used to determine the amounts of vitamins,
        minerals, and protein needed to provide adequate nutrition and lessen the
        risk of chronic disease.
    - type: paragraph
      text: 'Normal daily recommended intakes in mcg for iodine are generally defined
        as follows:'
    - type: paragraph
      text: 'This product is available in the following dosage forms:'
    - type: list
      ordered: false
      items:
      - Solution
    subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Problems in children have not been reported with intake of normal daily
        recommended amounts. However, high doses of sodium iodide may cause skin rash
        and thyroid problems in infants.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Problems in older adults have not been reported with intake of normal
        daily recommended amounts.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease—Use of sodium iodide may increase the amount of iodine in the
        blood and increase the chance of side effects
    - type: list
      ordered: false
      items:
      - Thyroid disease—This condition may increase the chance of side effects of
        sodium iodide
    - type: list
      ordered: false
      items:
      - Tuberculosis—Use of sodium iodide may make this condition worse
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (as part of a multivitamin/mineral supplement): To prevent
        deficiency, the amount taken by mouth is based on normal daily recommended
        intakes: For the U.S. Adults and teenagers—150 micrograms (mcg) per day. Pregnant
        females—175 mcg per day. Breast-feeding females—200 mcg per day. Children
        7 to 10 years of age—120 mcg per day. Children 4 to 6 years of age—90 mcg
        per day. Children birth to 3 years of age—40 to 70 mcg per day. For Canada
        Adult and teenage males—125 to 160 mcg per day. Adult and teenage females—110
        to 160 mcg per day. Pregnant females—135 to 185 mcg per day. Breast-feeding
        females—160 to 210 mcg per day. Children 7 to 10 years of age—95 to 125 mcg
        per day. Children 4 to 6 years of age—85 mcg per day. Children birth to 3
        years of age—30 to 65 mcg per day. To treat deficiency: Adults, teenagers,
        and children—Treatment dose is determined by prescriber for each individual
        based on severity of deficiency.'
    - type: list
      ordered: false
      items:
      - 'To prevent deficiency, the amount taken by mouth is based on normal daily
        recommended intakes: For the U.S. Adults and teenagers—150 micrograms (mcg)
        per day. Pregnant females—175 mcg per day. Breast-feeding females—200 mcg
        per day. Children 7 to 10 years of age—120 mcg per day. Children 4 to 6 years
        of age—90 mcg per day. Children birth to 3 years of age—40 to 70 mcg per day.
        For Canada Adult and teenage males—125 to 160 mcg per day. Adult and teenage
        females—110 to 160 mcg per day. Pregnant females—135 to 185 mcg per day. Breast-feeding
        females—160 to 210 mcg per day. Children 7 to 10 years of age—95 to 125 mcg
        per day. Children 4 to 6 years of age—85 mcg per day. Children birth to 3
        years of age—30 to 65 mcg per day.'
      - 'To treat deficiency: Adults, teenagers, and children—Treatment dose is determined
        by prescriber for each individual based on severity of deficiency.'
    subsections: []
  - heading: For the U.S.
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Adults and teenagers—150 micrograms (mcg) per day.
      - Pregnant females—175 mcg per day.
      - Breast-feeding females—200 mcg per day.
      - Children 7 to 10 years of age—120 mcg per day.
      - Children 4 to 6 years of age—90 mcg per day.
      - Children birth to 3 years of age—40 to 70 mcg per day.
    subsections: []
  - heading: For Canada
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Adult and teenage males—125 to 160 mcg per day.
      - Adult and teenage females—110 to 160 mcg per day.
      - Pregnant females—135 to 185 mcg per day.
      - Breast-feeding females—160 to 210 mcg per day.
      - Children 7 to 10 years of age—95 to 125 mcg per day.
      - Children 4 to 6 years of age—85 mcg per day.
      - Children birth to 3 years of age—30 to 65 mcg per day.
    - type: list
      ordered: false
      items:
      - Adults, teenagers, and children—Treatment dose is determined by prescriber
        for each individual based on severity of deficiency.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Do not refrigerate. Keep from freezing.
    - type: paragraph
      text: Store the dietary supplement in a closed container at room temperature,
        away from heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Many other products contain iodine. For example, iodine is absorbed through
      the skin from some skin cleansers (e.g., povidone-iodine). It may be especially
      important that infants and small children not receive large amounts of iodine.
      Check with your health care professional before using any other products that
      contain iodine while you are using sodium iodide.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hives
      - joint pain
      - swelling of arms, face, legs, lips, tongue, and/or throat
      - swelling of lymph glands
    subsections: []
  - heading: With long-term use
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning of mouth or throat
      - headache (severe)
      - increased watering of mouth
      - metallic taste
      - skin sores
      - soreness of teeth and gums
      - stomach irritation
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
