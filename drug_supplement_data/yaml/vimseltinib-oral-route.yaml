title: Vimseltinib (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Romvimza
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Vimseltinib is used to treat tenosynovial giant cell tumor (TGCT) when surgery
      may make the symptoms worse or cause severe problems.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of vimseltinib in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of vimseltinib
        have not been performed in the geriatric population.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Afatinib
      - Aliskiren
      - Alpelisib
      - Apixaban
      - Betrixaban
      - Colchicine
      - Cyclosporine
      - Dabigatran Etexilate
      - Dalfampridine
      - Darolutamide
      - Digoxin
      - Dofetilide
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Edoxaban
      - Elagolix
      - Ensartinib
      - Everolimus
      - Fexofenadine
      - Futibatinib
      - Gilteritinib
      - Glecaprevir
      - Irinotecan
      - Lapatinib
      - Ledipasvir
      - Lefamulin
      - Letermovir
      - Linagliptin
      - Loperamide
      - Maraviroc
      - Metformin
      - Methotrexate
      - Naldemedine
      - Nintedanib
      - Ozanimod
      - Pibrentasvir
      - Posaconazole
      - Pralsetinib
      - Ranolazine
      - Relugolix
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to aspirin—Use with caution. This medicine contains a yellow dye called
        tartrazine, which may cause allergic reactions (eg, asthma) in patients with
        this condition.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. May make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the capsule whole. Do not open, break, or chew it.
  - type: paragraph
    text: Take this medicine at least 4 hours before taking dabigatran.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For tenosynovial giant cell tumor (TGCT):
        Adults—30 milligrams (mg) 2 times a week at least 72 hours apart. Your doctor
        may adjust your dose as needed and tolerated. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For tenosynovial giant cell tumor (TGCT): Adults—30 milligrams (mg) 2 times
        a week at least 72 hours apart. Your doctor may adjust your dose as needed
        and tolerated. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—30 milligrams (mg) 2 times a week at least 72 hours apart. Your doctor
        may adjust your dose as needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is 48 hours or less , take it as soon as possible
        and go back to your regular dosing schedule. If you miss a dose and it is
        more than 48 hours , skip the missed dose and take your next dose at the regular
        time.
    - type: paragraph
      text: If you vomit within 30 minutes of taking a dose, take another dose. If
        you vomit more than 30 minutes after taking a dose, do not take another dose
        and take your next dose at your regular time.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Do not store the capsule in another container.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects. Blood tests will be needed before starting
      this medicine, 2 times each month for the first 2 months of treatment, and then
      1 time every 3 months for the first year of treatment to check for liver problems.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. It
      may also cause birth defects if the father is using it when his sexual partner
      becomes pregnant. If you can get pregnant, your doctor may do tests to make
      sure you are not pregnant before starting treatment. Use an effective form of
      birth control during treatment and for 1 month after the last dose. Males with
      female partners who are able to become pregnant should use an effective form
      of birth control during treatment and for 1 month after the last dose. If you
      think you have become pregnant, tell your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of serious liver problems.
  - type: paragraph
    text: Talk with your doctor before using this medicine if you plan to have children.
      Some men and women who use this medicine have become infertile (unable to have
      children).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of face, arms, hands, lower legs, or feet
      - blurred vision
      - burning, tingling, numbness or pain in the hands, arms, feet, or legs
      - dizziness
      - headache
      - nervousness
      - pounding in the ears
      - rapid weight gain
      - sensation of pins and needles
      - slow or fast heartbeat
      - stabbing pain
      - tingling of hands or feet
      - unusual weight gain or loss
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Clay colored stools
      - dark urine
      - decrease appetite
      - fever
      - itching
      - loss of appetite
      - nausea and vomiting
      - skin rash
      - stomach pain or tenderness
      - swelling of the feet or lower legs
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry eyes
      - swelling around the eyes
      - swelling or puffiness of the face
      - watering of the eyes
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
