title: Captopril and hydrochlorothiazide (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Capozide 25/15
    - type: paragraph
      text: Capozide 25/25
    - type: paragraph
      text: Capozide 50/15
    - type: paragraph
      text: Capozide 50/25
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Captopril and hydrochlorothiazide combination is used to treat high blood
      pressure (hypertension). High blood pressure adds to the work load of the heart
      and arteries. If it continues for a long time, the heart and arteries may not
      function properly. This can damage the blood vessels of the brain, heart, and
      kidneys resulting in a stroke, heart failure, or kidney failure. Hypertension
      may also increase the risk of heart attacks. These problems may be less likely
      to occur if blood pressure is controlled.
  - type: paragraph
    text: Captopril works by blocking an enzyme in the body that is necessary to produce
      a substance that causes blood vessels to tighten. As a result, the blood vessels
      relax. Hydrochlorothiazide works by helping reduce the amount of salt and water
      in the body by acting on the kidneys to increase the flow of urine. Both of
      these medicines lower blood pressure and increase the supply of blood and oxygen
      to the heart.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of captopril and hydrochlorothiazide combination in the pediatric
        population. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of captopril and hydrochlorothiazide combination in geriatric patients. However,
        elderly patients are more likely to have age-related kidney problems, which
        may require an adjustment of dose in patients receiving captopril and hydrochlorothiazide
        combination.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Aliskiren
      - Colchicine
      - Dofetilide
      - Isocarboxazid
      - Sacubitril
      - Valsartan
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Aceclofenac
      - Acemetacin
      - Acetyldigoxin
      - Albiglutide
      - Albuterol
      - Allopurinol
