    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angioedema (swelling of the face, lips, tongue, throat, arms, or legs), history
        of—May increase the risk of this condition occurring again.
    - type: list
      ordered: false
      items:
      - Anuria (not able to pass urine) or
      - Sulfa drug allergy—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Asthma, history of—May increase likelihood of having an allergic reaction.
        .
    - type: list
      ordered: false
      items:
      - Collagen vascular disease (an autoimmune disease) together with kidney disease—Increased
        risk of blood problems.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Kidney disease—Increased risk of potassium levels in the body becoming too
        high.
    - type: list
      ordered: false
      items:
      - Electrolyte imbalance (eg, low magnesium, potassium, or sodium in the blood)
        or
      - Fluid imbalances (caused by dehydration, vomiting, or diarrhea) or
      - Gout or
      - Heart or blood vessel disease or
      - Heart failure or
      - Hypercalcemia (high calcium in the blood) or
      - Liver disease or
      - Systemic lupus erythematosus (SLE)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Sympathectomy (nerve surgery)—The effects of benazepril and hydrochlorothiazide
        combination may be increased in patients who have had this surgery.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium. Your doctor will tell you which of these are most important
      for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure but it
      does help control it. Therefore, you must continue to take it as directed if
      you expect to lower your blood pressure and keep it down. You may have to take
      high blood pressure medicine for the rest of your life. If high blood pressure
      is not treated, it can cause serious problems such as heart failure, blood vessel
      disease, stroke, or kidney disease.
  - type: paragraph
    text: Swallow the tablet whole. Do not break, crush, or chew it. It is best to
      take this medicine on an empty stomach at least 1 hour before eating any food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For high blood pressure: Adults—At first,
        one tablet once a day. Your doctor may adjust your dose as needed. However,
        the dose is usually not more than 150 milligrams (mg) captopril and 50 mg
        hydrochlorothiazide. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—At first, one tablet once a day. Your doctor
        may adjust your dose as needed. However, the dose is usually not more than
        150 milligrams (mg) captopril and 50 mg hydrochlorothiazide. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, one tablet once a day. Your doctor may adjust your dose as
        needed. However, the dose is usually not more than 150 milligrams (mg) captopril
        and 50 mg hydrochlorothiazide.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby, especially
      in your second or third trimester. Use an effective form of birth control to
      keep from getting pregnant. If you think you have become pregnant while using
      this medicine, tell your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you have large, hive-like swelling
      on the face, eyelids, lips, tongue, throat, hands, legs, feet, or sex organs.
      These may be symptoms of a condition called angioedema.
  - type: paragraph
    text: Check with your doctor right away if you have severe stomach pain (with
      or without nausea or vomiting). This could be a symptom of a condition called
      intestinal angioedema.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may also occur, especially when
      you get up suddenly from a lying or sitting position or if you have been taking
      a diuretic (water pill). . If you feel dizzy, lie down so you do not faint.
      Then sit for a few moments before standing to prevent the dizziness from returning.
      If you faint, stop using this medicine and call your doctor right away.
  - type: paragraph
    text: This medicine may cause a serious type of allergic reaction, including anaphylaxis.
      This can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are using this medicine.
  - type: paragraph
    text: Check with your doctor if you have a fever, chills, or sore throat. These
      could be symptoms of an infection resulting from low white blood cells.
  - type: paragraph
    text: Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have stomach pain, confusion,
      irregular heartbeat, nausea or vomiting, nervousness, numbness or tingling in
      the hands, feet, or lips, trouble breathing, or weakness or heaviness of the
      legs. Ask your doctor before you use medicines, supplements, or salt substitutes
      that contain potassium .
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, trouble breathing, unusual tiredness or weakness, vomiting, or
      weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: Check with your doctor right away if you become sick while taking this medicine,
      especially with severe or continuing nausea, vomiting, or diarrhea. These conditions
      may cause you to lose too much water or salt and may lead to low blood pressure.
      You can also lose water by sweating, so drink plenty of water during exercise
      or in hot weather.
  - type: paragraph
    text: This medicine may affect blood sugar levels. If you notice a change in the
      results of your blood or urine sugar tests, or if you have any questions, check
      with your doctor.
  - type: paragraph
    text: This medicine may increase your risk of getting skin cancer (eg, non-melanoma
      skin cancer). Avoid sun exposure. Use a sunscreen when you are outdoors. Avoid
      sunlamps and tanning beds. Talk to your doctor if you have concerns about this
      risk.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery or medical tests.
  - type: paragraph
    text: This medicine may be less effective in black patients. Black patients also
      have an increased risk of swelling of the hands, arms, face, mouth, or throat.
      Talk with your doctor if you have concerns about this.
  - type: paragraph
    text: Alcohol, narcotic pain relievers, or sleeping pills may cause you to feel
      more lightheaded, dizzy, or faint when used with this medicine. Tell your doctor
      if you are drinking alcohol or using pain relievers or sleeping pills.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      for appetite control, asthma, colds, cough, hay fever, or sinus problems, and
      herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chest pain
      - chills
      - cough
      - fever
      - painful or difficult urination
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swollen glands
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - cloudy urine
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fast, pounding, or irregular heartbeat or pulse
      - sweating
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm, back, or jaw pain or discomfort
      - bloody urine
      - chest discomfort, tightness, or heaviness
      - decreased blood pressure
      - decreased frequency or amount of urine
      - dilated neck veins
      - increased need to urinate
      - increased thirst
      - irregular breathing
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss of appetite
      - lower back or side pain
      - nausea
      - paleness or cold feeling in fingertips and toes
      - passing urine more often
      - problems in urination or increase in amount of urine
      - swelling of the face, fingers, feet, or lower legs
      - tingling or pain in the fingers or toes when exposed to cold
      - vomiting
      - weight gain
    subsections: []
  - heading: incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Persistent non-healing sore
      - pink growth
      - reddish patch or irritated area
      - shiny bump
      - white, yellow or waxy scar-like area
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty in moving
      - itching skin, rash
      - muscle pain or stiffness
      - pain in joints
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change or loss of taste
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
