title: Succinylcholine (intramuscular route, intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Anectine
    - type: paragraph
      text: Quelicin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Succinylcholine injection is used before and during surgery to provide muscle
      relaxation and make intubation easier.
  - type: paragraph
    text: This medicine must be given only by or under the direct supervision of your
      doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of succinylcholine injection in the
        pediatric population. However, children are more likely to have unwanted side
        effects, including heart rhythm problems, heart disease from hyperkalemic
        rhabdomyolysis.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of succinylcholine injection in the
        elderly. However, elderly patients are more likely to have age-related liver,
        kidney, or heart problems, which may require caution and an adjustment in
        the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acetyldigoxin
      - Amikacin
      - Desflurane
      - Deslanoside
      - Dibekacin
      - Digitoxin
      - Digoxin
      - Donepezil
      - Gentamicin
      - Isoflurane
      - Kanamycin
      - Lidocaine
      - Metildigoxin
      - Netilmicin
      - Pancuronium
      - Procainamide
      - Promazine
      - Quinidine
      - Quinine
      - Sevoflurane
      - St John's Wort
      - Streptomycin
      - Thiopental
      - Tobramycin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atracurium
      - Bambuterol
      - Distigmine
      - Echothiophate
      - Fospropofol
      - Lithium
      - Magnesium
      - Metoclopramide
      - Mivacurium
      - Neostigmine
      - Physostigmine
      - Propofol
      - Pyridostigmine
      - Vancomycin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Nerve problems or
      - Stomach infection—Use with caution. May increased risk of having severe hyperkalemia.
    - type: list
      ordered: false
      items:
      - Fracture or
      - Heart or blood vessel disease or
      - Heart rhythm problems or
      - Hyperkalemia (high potassium in the blood) or
      - Hypocalcemia (low calcium in the blood) or
      - Hypokalemia (low potassium in the blood) or
      - Hypotension (low blood pressure) or
      - Hypovolemia (low blood volume) or
      - Increase intraocular pressure or
      - Kidney disease or
      - Liver disease—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Hereditary problems (eg, high risk for malignant hyperthermia) or
      - Injury (eg, major burns, multiple trauma, muscle or nerve injury) or
      - Muscle problems—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. This medicine is usually given as a shot into a muscle or into
      a vein.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check you closely after receiving this medicine . This
      will allow your doctor to see if the medicine is working properly. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause heart rhythm problems (eg, ventricular dysrhythmias)
      in children with rhabdomyolysis (serious muscle problem) with hyperkalemia.
      Check with your doctor right away if you have dizziness, fainting, or fast,
      slow, or irregular heartbeat.
  - type: paragraph
    text: This medicine may cause serious allergic reaction, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Check
      with your doctor right away if you have chest tightness, cough, difficulty swallowing,
      dizziness, fast heartbeat, hives, itching, or skin rash, puffiness or swelling
      of the eyelids or around the eyes, face, lips, or tongue, or unusual tiredness
      or weakness.
  - type: paragraph
    text: Hyperkalemia may occur rarely after receiving this medicine. Tell your doctor
      right away if you have confusion, irregular heartbeat, nausea or vomiting, numbness
      or tingling in the hands, feet, or legs, or trouble breathing after receiving
      this medicine.
  - type: paragraph
    text: This medicine may cause malignant hyperthermia (high body temperature).
      Check with your doctor right away if you have fast heartbeat, high fever, or
      rigid muscles.
  - type: paragraph
    text: This medicine may cause bradycardia (slow heartbeat). Check with your doctor
      right away if you or your child has chest pain or discomfort, lightheadedness,
      dizziness, or fainting, slow or irregular heartbeat, trouble breathing, or unusual
      tiredness.
  - type: paragraph
    text: Check with your doctor right away if you have blurred vision, change in
      vision, or loss of vision. These may be symptoms of increase intraocular pressure.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - change in vision
      - chest pain, discomfort, or tightness
      - confusion
      - cough
      - dark-colored urine
      - difficulty swallowing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dizziness
      - fainting
      - fast, slow, pounding, or irregular heartbeat or pulse
      - headache
      - high fever
      - hives, itching, or skin rash
      - lightheadedness
      - loss of vision
      - muscle twitches, pain, stiffness, cramps, or spasms
      - nausea or vomiting
      - nervousness
      - no blood pressure or pulse
      - numbness or tingling in the hands, feet, or lips
      - pale or blue lips, fingernails, or skin
      - pounding in the ears
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rigid muscles
      - stopping of the heart
      - sweating
      - trouble breathing
      - unconsciousness
      - unusual tiredness or weakness
      - weakness or heaviness of the legs
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Watering of the mouth and drooling
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
