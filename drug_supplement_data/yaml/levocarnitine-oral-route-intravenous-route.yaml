title: Levocarnitine (oral route, intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Carnitine
    - type: paragraph
      text: Carnitor
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Levocarnitine is used to prevent and treat a lack of carnitine. It is used
      to prevent and treat this condition in patients with kidney disease on dialysis.
      It is given to people whose body cannot properly use carnitine from their diet.
      Lack of carnitine can lead to liver, heart, and muscle problems. Your doctor
      may treat lack of carnitine by prescribing levocarnitine for you.
  - type: paragraph
    text: Carnitine comes in two forms. Levocarnitine (L-carnitine) should not be
      confused with the D,L-carnitine form (labeled as “vitamin B T”'). Only the L-form
      of carnitine is used by the body to treat serious carnitine deficiency. The
      D,L-form does not help the body use fat and can actually interfere with and
      cause a lack of levocarnitine.
  - type: paragraph
    text: Certain levocarnitine products have been specifically approved by the U.S.
      Food and Drug Administration for medical use and are available only with your
      doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
    - Capsule
    - Tablet
    - Capsule, Liquid Filled
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of levocarnitine
        in children with use in other age groups, this dietary supplement is not expected
        to cause different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: There is no specific information comparing use of levocarnitine in the
        elderly with use in other age groups; however, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acenocoumarol
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Seizures—occur more often and are more severe in patients with a history of
        seizure activity
      - Severe renal dysfunction—administration of high doses of oral levocarnitine
        for long periods of time may build up in the body of patients with severe
        kidney disease
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take levocarnitine with or just after meals. Also, if you are taking it
      in liquid form, drink it slowly. It will be less likely to upset your stomach
      if you take it this way. The liquid form may be taken alone or dissolved in
      drink or other liquid food.
  - type: paragraph
    text: This medicine is also less likely to cause unwanted effects when there is
      a constant amount in the blood. If you are taking more than one dose a day,
      take the doses at evenly spaced times throughout the day. Doses should be spaced
      at least 3 to 4 hours apart. If you need help in planning the best times to
      take your medicine, check with your health care professional.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: paragraph
      text: Do NOT change brands or dosage forms of levocarnitine without first checking
        with your doctor. Different products may not work in the same way. If you
        refill your medicine and it looks different, check with your pharmacist.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (solution): To prevent or treat carnitine deficiency:
        Adults and teenagers—At first, 1 gram taken once a day with food. Your doctor
        may change the dose if needed. Children—The dose is based on body weight and
        must be determined by your doctor. The usual dose at first is 50 mg per kg
        (22.7 mg per pound) of body weight a day, divided into smaller amounts with
        meals. Your doctor may change the dose if needed.'
      - 'For oral dosage form (tablets): To prevent or treat carnitine deficiency:
        Adults and teenagers—990 milligrams taken two or three times a day with meals.
        Children—The dose is based on body weight and must be determined by your doctor.
        The usual dose at first is 50 mg per kg (22.7 mg per pound) of body weight
        a day, divided into smaller amounts with meals. Your doctor may change the
        dose if needed.'
      - 'For injection dosage form: To treat carnitine deficiency: Adults and children—The
        dose is based on body weight and must be determined by your doctor. The usual
        dose is 50 mg per kg (22.7 mg per pound) of body weight a day injected into
        a vein. Your doctor may change the dose if needed. To prevent and treat carnitine
        deficiency in kidney disease patients on hemodialysis: Adults and children—10
        to 20 mg per kg of body weight a day, after dialysis. The dose may be reduced
        based on laboratory test results, after 3 to 4 weeks of therapy.'
    - type: list
      ordered: false
      items:
      - 'To prevent or treat carnitine deficiency: Adults and teenagers—At first,
        1 gram taken once a day with food. Your doctor may change the dose if needed.
        Children—The dose is based on body weight and must be determined by your doctor.
