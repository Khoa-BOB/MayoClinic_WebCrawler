title: Chenodiol (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Chenodal
    - type: paragraph
      text: Ctexli
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Chenodiol is used to treat gallstones in certain patients who will be having
      gallbladder surgery. It is also used to treat a condition called cerebrotendinous
      xanthomatosis (CTX). CTX is a rare condition that affects the body's ability
      to process cholesterol.
  - type: paragraph
    text: Chenodiol is a bile acid naturally found in the body. It works by preventing
      the production of cholesterol in the liver and dissolves the cholesterol that
      makes the gallstones.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of chenodiol in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of chenodiol in geriatric patients.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Ctexli™ in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acenocoumarol
      - Aluminum Carbonate, Basic
      - Aluminum Hydroxide
      - Aluminum Phosphate
      - Azathioprine
      - Cholestyramine
      - Colestipol
      - Dihydroxyaluminum Aminoacetate
      - Dihydroxyaluminum Sodium Carbonate
      - Levoketoconazole
      - Magaldrate
      - Mercaptopurine
      - Methotrexate
      - Phenprocoumon
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bile duct problems (eg, blockage, fistula, swelling, intrahepatic cholestasis,
        primary biliary cirrhosis) or
      - Gallbladder problems (eg, gallbladder that cannot be viewed using a special
        dye, gallstone complications) or
      - Liver problems (eg, liver failure, sclerosing cholangitis)—Should not be used
        in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Colon cancer or
      - Liver disease (including hepatitis), or history of or
      - Liver enzymes, elevated—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor to benefit your condition
      as much as possible. Do not take more of it, do not take it more often, and
      do not take it for a longer time than your doctor ordered. This medicine should
      not be taken for longer than 24 months.
  - type: paragraph
    text: Follow carefully your doctor's instructions about any special diet .
  - type: paragraph
    text: 'Ctexli™ : You may take this medicine with or without food. Swallow the
      tablet whole.'
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of cerebrotendinous xanthomatosis
        (CTX): Adults—250 milligrams (mg) 3 times a day. Children—Use and dose must
        be determined by your doctor. For treatment of gallstones: Adults—Dose is
        based on body weight and must be determined by your doctor. The dose is usually
        13 to 16 milligrams (mg) per kilogram (kg) of body weight per day, divided
        into 2 doses, taken in the morning and in the evening. Your doctor may increase
        your dose as needed and tolerated. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of cerebrotendinous xanthomatosis (CTX): Adults—250 milligrams
        (mg) 3 times a day. Children—Use and dose must be determined by your doctor.'
      - 'For treatment of gallstones: Adults—Dose is based on body weight and must
        be determined by your doctor. The dose is usually 13 to 16 milligrams (mg)
        per kilogram (kg) of body weight per day, divided into 2 doses, taken in the
        morning and in the evening. Your doctor may increase your dose as needed and
        tolerated. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—250 milligrams (mg) 3 times a day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—Dose is based on body weight and must be determined by your doctor.
        The dose is usually 13 to 16 milligrams (mg) per kilogram (kg) of body weight
        per day, divided into 2 doses, taken in the morning and in the evening. Your
        doctor may increase your dose as needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: 'Ctexli™ : If you miss a dose, skip the missed dose and go back to your
        regular dosing schedule. Do not double doses.'
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This is to make sure that the medicine is working properly and to decide if
      you should continue to take it. Blood tests and certain laboratory tests (eg,
      ultrasounds, X-rays) are needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: Mild diarrhea may occur during treatment with chenodiol. Do not take any
      medicine to treat diarrhea without first checking with your doctor. If you have
      any questions or if mild diarrhea continues or gets worse, check with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - body aches or pain
      - chills
      - cough
      - constipation
      - diarrhea
      - dizziness
      - ear congestion
      - fever
      - headache
      - loss of voice
      - muscle weakness
      - nervousness
      - pounding in the ears
      - slow or fast heartbeat
      - sneezing
      - sore throat
      - stomach pain
      - stuffy or runny nose
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chest pain
      - chills
      - cough
      - dark urine
      - facial swelling
      - loss of appetite
      - nausea or vomiting
      - painful or difficult urination
      - redness of the skin
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach pain, severe
      - swollen glands
      - trouble breathing
      - unusual bleeding or bruising
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - bloated
      - cramps
      - difficulty having a bowel movement (stool)
      - excess air or gas in the stomach or intestines
      - full feeling
      - heartburn
      - indigestion
      - pain in the chest below the breastbone
      - pain or discomfort in chest, upper stomach, or throat
      - passing gas
      - stomach discomfort or upset
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
