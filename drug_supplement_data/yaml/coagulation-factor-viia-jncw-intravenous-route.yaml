title: Coagulation factor viia-jncw (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Sevenfact
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Coagulation factor VIIa-jncw is used to treat and prevent bleeding episodes
      in patients with Hemophilia A or B. Factor VIIa-jncw is a man-made protein produced
      to replicate the naturally occurring activated factor VII (factor VIIa) in the
      body. It is used to stop bleeding of injuries for patients with hemophilia by
      helping the blood to clot.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of coagulation factor VIIa-jncw in
        children 12 years of age and older.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Adequate and well-controlled studies have not been done on the relationship
        of age to the effects of coagulation factor VIIa-jncw in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Anti-Inhibitor Coagulant Complex
      - Concizumab-mtci
      - Factor XIII
      - Fitusiran
      - Prothrombin Complex
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergic reaction to rabbits or rabbit proteins, history of—Should not be
        used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Blood clots or a history of medical problems caused by blood clots (eg, atherosclerotic
        disease, cerebrovascular disease, coronary artery disease, thromboembolism)
        or
      - Infection (septicemia) or
      - Injury (crush)—These conditions may increase the risk of developing blood
        clots.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this medicine. This medicine is given through a needle placed in one of your
      veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      closely while you are receiving this medicine to make sure it is working properly.
      Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Tell your doctor right away if you have a rash, itching, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are receiving this medicine.
  - type: paragraph
    text: This medicine may increase your chance of having blood clotting problems.
      The risk is higher if you had medical conditions such as intravascular coagulation,
      or arterial or venous thromboembolic disease, or if you are taking certain blood
      clotting medicines. Tell your doctor right away if you have sudden or severe
      headache, problems with vision or speech, chest pain, shortness of breath, or
      numbness or weakness while you are receiving this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - chest tightness
      - chills
      - dizziness
      - fever
      - flushing
      - headache
      - nausea and vomiting
      - redness, pain, or swelling at the injection site
      - trouble breathing
      - weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blood in the stools or urine
      - bruising
      - confusion
      - coughing or vomiting blood
      - difficulty swallowing
      - fast heartbeat
      - hives, itching, or rash
      - persistent bleeding or oozing from puncture sites, mouth, or nose
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - tightness in the chest
      - unusual tiredness or weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
