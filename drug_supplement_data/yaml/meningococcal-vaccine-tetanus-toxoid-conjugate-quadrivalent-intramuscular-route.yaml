title: Meningococcal vaccine, tetanus toxoid conjugate quadrivalent (intramuscular
  route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: MenQuadfi
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Meningococcal, tetanus toxoid conjugate quadrivalent vaccine is an active
      immunizing agent used to prevent infection caused by certain groups of meningococcal
      bacteria ( Neisseria meningitides ). The vaccine works by causing your body
      to produce its own protection (antibodies) against the disease.
  - type: paragraph
    text: This vaccine is active against Groups A, C, W, and Y meningococcal bacteria
      only. The vaccine will not protect against infection caused by other meningococcal
      bacteria groups, such as Group B.
  - type: paragraph
    text: Meningococcal infection can cause life-threatening illnesses, such as meningococcal
      meningitis, which affects the brain, and meningococcemia, which affects the
      blood. Some persons with meningococcal meningitis and/or meningococcemia also
      may die. These diseases are more likely to occur in young children and in persons
      with certain diseases or conditions that make them more susceptible to a meningococcal
      infection or more likely to develop serious problems from a meningococcal infection.
  - type: paragraph
    text: This vaccine is to be given only by or under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of MenQuadfi® in children younger than 6 weeks of age. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of MenQuadfi® in the elderly. However,
        elderly patients are less responsive to the effects of this vaccine than younger
        adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Guillain-Barré syndrome (GBS, a severe nerve and muscle problem), history
        of—Use with caution. May cause the symptoms of this condition to return.
    - type: list
      ordered: false
      items:
      - Immune system problems from a disease or medicine—May not work as well in
        patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this vaccine
      to your or your child. It is given as a shot into one of your muscles.
  - type: paragraph
    text: 'Patients 2 months of age and older :'
  - type: list
    ordered: false
    items:
    - '2 years of age and older: Given as a single dose. Patients 13 years of age
      and older who are at continued risk for meningococcal infection should get a
      booster (repeat) dose of the vaccine at least 3 years after the last dose.'
    - '12 to 23 months of age: Given in 2 doses. The second dose is given at least
      3 months after the first dose.'
    - '6 to 11 months of age: Given in 2 doses. The second dose is given in the second
      year of life and at least 3 months after the first dose.'
    - '6 weeks of age: Given in 4 doses at 2, 4, 6, and 12 to 18 months of age. The
      first dose may be given as early as 6 weeks.'
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Be sure to notify your doctor of any side effects that occur after you receive
      this vaccine.
  - type: paragraph
    text: This vaccine may cause a serious allergic reaction, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have a rash, itching, swelling of the tongue and
      throat, or trouble breathing after you get the injection.
  - type: paragraph
    text: Syncope (fainting) may occur after receiving this vaccine. Your doctor may
      want you to be observed after you get the injection to prevent and manage fainting.
  - type: paragraph
    text: MenQuadfi® may not protect everyone who receives it. This vaccine will not
      prevent tetanus, and will not treat symptoms of meningococcal infection if you
      already have the disease.
  - type: paragraph
    text: Tell your doctor if you are using a medicine or treatment that weakens your
      immune system (eg, eculizumab). This vaccine may not work as well if you are
      also using these medicines.
  - type: paragraph
    text: It is important that your doctor should know about all other vaccines you
      or your child have recently received.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fainting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - fast heartbeat
      - fever
      - hives, itching, skin rash
      - hoarseness
      - irritation
      - joint pain, stiffness, or swelling
      - redness of the skin
      - swelling of the eyelids, face, lips, hands, or feet
      - troubled breathing or swallowing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty in moving
      - general feeling of discomfort or illness
      - headache
      - muscle pain
      - pain, redness, or swelling at the injection site
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
