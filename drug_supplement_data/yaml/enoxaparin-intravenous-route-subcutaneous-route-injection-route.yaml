title: Enoxaparin (intravenous route, subcutaneous route, injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Lovenox
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Enoxaparin injection is used to prevent deep venous thrombosis, a condition
      in which harmful blood clots form in the blood vessels of the legs. These blood
      clots can travel to the lungs and can become lodged in the blood vessels of
      the lungs, causing a condition called pulmonary embolism. This medicine is used
      for several days after hip or knee replacement surgery, and in some cases following
      abdominal or stomach surgery, while you are unable to walk. It is during this
      time that blood clots are most likely to form. It is also used if you are unable
      to get out of bed because of a serious illness. In addition, enoxaparin is used
      to prevent blood clots from forming in the arteries of the heart during certain
      types of chest pain and heart attacks.
  - type: paragraph
    text: Enoxaparin injection is used together with warfarin to treat acute deep
      vein thrombosis with or without pulmonary embolism. It is also used to treat
      certain types of acute heart attacks.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of enoxaparin injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of enoxaparin injection in the elderly.
        However, elderly patients are more likely to have bleeding problems and age-related
        kidney disease, which may require an adjustment in the dose for patients receiving
        enoxaparin injection, especially those who weigh less than 45 kilograms (kg).
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Defibrotide
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abciximab
      - Aceclofenac
      - Acemetacin
      - Acenocoumarol
      - Alipogene Tiparvovec
      - Alteplase, Recombinant
      - Amtolmetin Guacil
      - Anagrelide
      - Anistreplase
      - Antithrombin, Recombinant
      - Apixaban
      - Argatroban
      - Aspirin
      - Bemiparin
      - Betrixaban
      - Bivalirudin
      - Bromfenac
      - Bufexamac
      - Caplacizumab-yhdp
      - Celecoxib
      - Choline Salicylate
      - Citalopram
      - Clonixin
      - Clopidogrel
      - Collagenase, Clostridium histolyticum
      - Curcumin
      - Dabigatran Etexilate
      - Dalteparin
      - Danaparoid
      - Desvenlafaxine
      - Dexibuprofen
      - Dexketoprofen
      - Diclofenac
      - Diflunisal
      - Dipyridamole
      - Dipyrone
      - Donanemab-azbt
      - Doxycycline
      - Drotrecogin Alfa
      - Droxicam
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to benzyl alcohol, heparin, or pork products or
      - Major bleeding, active or
      - Thrombocytopenia (low platelet count in the blood), history of—Should not
        use in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Blood disease or bleeding problems or
      - Blood vessel problems or
      - Catheter insertion in the spine or
      - Diabetic retinopathy (eye problem) or
      - Heart infection or
      - Heart valves, prosthetic or
      - Hypertension (high blood pressure), uncontrolled or
      - Septic shock or
      - Stomach or intestinal ulcer or bleeding, active or
      - Stroke, recent or history of or
      - Surgery (eg, eye, brain, or spine), recent or history of or
      - Thrombocytopenia, heparin-induced, or history of or
      - Threatened miscarriage or
      - Weight of less than 99 pounds in women or 126 pounds in men—Use with caution.
        The risk of bleeding may be increased.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will usually give you this
      medicine in the hospital. This medicine is given as a shot under your skin or
      into a vein.
  - type: paragraph
    text: It may sometimes be given at home to patients who do not need to be in the
      hospital. If you are using this medicine at home, your doctor or nurse will
      teach you how to prepare and inject the medicine. Be sure that you understand
      exactly how to use the medicine.
  - type: paragraph
    text: If you use this medicine at home, you will be shown the body areas where
      this shot can be given. Use a different body area each time you give yourself
      a shot. Keep track of where you give each shot to make sure you rotate body
      areas. This will help prevent skin problems.
  - type: paragraph
    text: Do not inject into skin areas that are bruised or have scars.
  - type: paragraph
    text: Check the liquid in the vial or prefilled syringe. It should be clear and
      colorless or pale yellow. Do not use it if it is cloudy, discolored, or if you
      see particles in it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: For prevention of blood clots after unstable angina
        (chest pain) or non–Q-wave myocardial infarction (a type of heart attack):
        Adults—Dose is based on body weight and must be determined by your doctor.
        The dose is usually 1 milligram (mg) per kilogram (kg) of body weight injected
        under the skin every 12 hours together with aspirin 100 to 325 mg once a day
        for 2 to 8 days. Children—Use and dose must be determined by your doctor.
        For prevention of deep venous thrombosis (abdominal or stomach surgery): Adults—40
        milligrams (mg) injected under the skin once a day for 7 to 10 days. The first
        dose should be given 2 hours before the surgery. Children—Use and dose must
        be determined by your doctor. For prevention of deep venous thrombosis (hip
        or knee replacement surgery): Adults—30 milligrams (mg) injected under the
        skin every 12 hours for 7 to 10 days. Alternatively, for hip replacement surgery,
        the dose may be 40 mg injected under the skin once a day for 3 weeks. Children—Use
        and dose must be determined by your doctor. For prevention of deep venous
        thrombosis (in patients with a serious illness): Adults—40 milligrams (mg)
        injected under the skin once a day for 6 to 11 days. Children—Use and dose
        must be determined by your doctor. For treatment of acute deep vein thrombosis
        with or without pulmonary embolism: Adults—Dose is based on body weight and
        must be determined by your doctor. However, the dose is usually 1 milligram
        (mg) per kilogram (kg) of body weight every 12 hours injected under the skin
        for 7 days. Children—Use and dose must be determined by your doctor. For treatment
        of certain type of acute heart attack Adults—Dose is based on body weight
        and must be determined by your doctor. However, the dose is usually 30 milligrams
        (mg) injected into your vein and 1 milligram (mg) per kilogram (kg) of body
        weight injected under the skin followed by 1 mg per kg every 12 hours injected
        under the skin for 8 days. Aspirin 75 to 325 mg orally once a day may also
        be given. Older adults—Dose is based on body weight and must be determined
        by your doctor. However, the starting dose is 0.75 mg per kg of body weight
        injected under the skin every 12 hours for 8 days. Aspirin 75 to 325 mg orally
        once a day may also be given. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - 'For prevention of blood clots after unstable angina (chest pain) or non–Q-wave
        myocardial infarction (a type of heart attack): Adults—Dose is based on body
        weight and must be determined by your doctor. The dose is usually 1 milligram
        (mg) per kilogram (kg) of body weight injected under the skin every 12 hours
        together with aspirin 100 to 325 mg once a day for 2 to 8 days. Children—Use
        and dose must be determined by your doctor.'
      - 'For prevention of deep venous thrombosis (abdominal or stomach surgery):
        Adults—40 milligrams (mg) injected under the skin once a day for 7 to 10 days.
        The first dose should be given 2 hours before the surgery. Children—Use and
