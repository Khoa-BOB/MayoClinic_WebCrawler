    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: If you were given a bottle of medicine to use with your syringes, you
        must use the medicine within 28 days after the first shot. Throw away the
        unused medicine in the bottle after 28 days.
    - type: paragraph
      text: Throw away used needles in a hard, closed container that the needles cannot
        poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests will be needed to
      check for unwanted effects. Be sure to keep all appointments.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery or medical tests.
  - type: paragraph
    text: This medicine lowers the number of some types of blood cells in your body.
      Because of this, you may bleed more easily. Stay away from rough sports or other
      situations where you could be bruised, cut, or injured. Brush and floss your
      teeth gently. Be careful when using sharp objects, including razors and fingernail
      clippers.
  - type: paragraph
    text: Enoxaparin may cause bleeding problems. This risk is higher if you have
      a catheter in your back for pain medicine or anesthesia (sometimes called an
      "epidural"), or if you have kidney problems. The risk of bleeding increases
      if your kidney problems get worse. Check with your doctor right away if you
      have any unusual bleeding or bruising, black, tarry stools, bleeding gums, blood
      in the urine or stools, tingling, numbness, or weakness of the lower legs, or
      pinpoint red spots on your skin.
  - type: paragraph
    text: Lovenox® multiple-dose vials contain benzyl alcohol as a preservative. Tell
      your doctor right away if you are pregnant or have had an allergic reaction
      to benzyl alcohol.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - coughing up blood
      - difficulty with breathing or swallowing
      - dizziness
      - headache
      - increased menstrual flow or vaginal bleeding
      - nosebleeds
      - paralysis
      - prolonged bleeding from cuts
      - red or black, tarry stools
      - red or dark brown urine
      - trouble breathing
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bruising
      - chest discomfort or tightness
      - collection of blood under the skin
      - confusion
      - continuing bleeding or oozing from the nose or mouth, or surgical wound
      - fever
      - irritability
      - lightheadedness
      - lower back pain
      - pain or burning while urinating
      - seizures
      - swelling of the hands or feet
      - uncontrolled bleeding at the site of injection
      - vomiting of blood or material that looks like coffee grounds
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - burning, pricking, tickling, or tingling sensation
      - chest pain
      - chills
      - cough
      - decreased urine output
      - dilated neck veins
      - dizziness or lightheadedness when getting up suddenly from a lying or sitting
        position
      - fainting
      - fast or irregular heartbeat
      - general feeling of discomfort or illness
      - irregular breathing
      - leg weakness
      - problems with bowel or bladder function
      - skin rash or hives
      - sneezing
      - sore throat
      - sudden fainting
      - swelling of the face, fingers, feet, genitals, mouth, or tongue
      - thickening of the bronchial secretions
      - unusual tiredness or weakness
      - weight gain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Deep, dark purple bruise
      - hives or welts, skin rash
      - irregular heartbeat
      - itching, pain, redness, or swelling at the injection site
      - large, flat, blue, or purplish patches in the skin
      - nausea or vomiting
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness of the skin
      - stomach pain
      - weakness or heaviness of the legs
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
