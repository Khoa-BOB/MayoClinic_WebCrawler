title: Finasteride (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Propecia
    - type: paragraph
      text: Proscar
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: 'Note: Women who are pregnant or may become pregnant should not use finasteride
      or handle the crushed or broken tablets . Finasteride can cause birth defects
      in male babies.'
  - type: paragraph
    text: Finasteride is used to treat men who have symptoms of benign prostatic hyperplasia
      (BPH) and male pattern hair loss, also called androgenetic alopecia. BPH is
      caused by an enlarged prostate. Men with BPH usually have difficulty urinating,
      a decreased flow of urination, hesitation at the beginning of urination, and
      a need to get up at night to urinate. Finasteride will make these symptoms less
      severe and reduce the chance that prostate surgery will be needed. It may be
      used alone or in combination with other medicines such as an alpha-blocker (doxazosin,
      Cardura®) to treat BPH. For men with hair loss, finasteride will increase the
      number of scalp hairs but will not increase the amount of body hair.
  - type: paragraph
    text: Finasteride blocks the action of an enzyme called 5-alpha-reductase. This
      enzyme changes testosterone to another hormone that causes the prostate to grow.
      It will increase testosterone levels in the body, which decreases prostate size.
      The effect of finasteride will only last as long as the medicine is taken.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Finasteride is not indicated for use in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of finasteride in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - St John's Wort
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: If you are taking this medicine for male pattern hair loss , it may take
      at least 3 months to see an effect. The medicine will not cure hair loss, but
      it will cause scalp hair to grow. The hair growth will only last as long as
      the medicine is used. The new hair will be lost within 1 year after the medicine
      is stopped.
  - type: paragraph
    text: If you are taking this medicine for benign prostatic hyperplasia (BPH) ,
      it may take up to 6 months to see the full effect. The medicine will not cure
      BPH, but it does help reduce the size of the prostate and improve symptoms.
      The effect on the prostate will only last as long as the medicine is used. When
      it is stopped, the prostate begins to grow again within a few months.
  - type: paragraph
    text: Swallow the tablet whole. Do not crush, break, or chew it. Take this medicine
      at the same time each day.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For benign prostatic hyperplasia: Adults—5
        milligrams (mg) once a day. Children—Use is not recommended. For male pattern
        hair loss: Adults—1 milligram (mg) once a day. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For benign prostatic hyperplasia: Adults—5 milligrams (mg) once a day. Children—Use
        is not recommended.'
      - 'For male pattern hair loss: Adults—1 milligram (mg) once a day. Children—Use
        is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—5 milligrams (mg) once a day.
      - Children—Use is not recommended.
    - type: list
      ordered: false
      items:
      - Adults—1 milligram (mg) once a day.
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to decide if you should continue to take it. Blood and urine tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Women and children should not use this medicine. Women who are pregnant
      or may become pregnant should not handle crushed or broken tablets. Finasteride
      can be absorbed through the skin and cause birth defects in male babies. If
      a woman does come in contact with this medicine, the affected area should be
      washed right away with soap and water.
  - type: paragraph
    text: This medicine will not prevent prostate cancer but may increase your risk
      of developing high-grade prostate cancer. Tell your doctor if you have concerns
      about this risk.
  - type: paragraph
    text: This medicine may affect the results of the prostate specific antigen (PSA)
      test, which may be used to detect prostate cancer. Make sure you tell all of
      your doctors that you are using this medicine.
  - type: paragraph
    text: Some men who use this medicine have become infertile (unable to have children).
      Talk with your doctor before using this medicine if you plan to have children.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - cold sweats
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - breast enlargement and tenderness
      - hives or welts, itching, skin rash
      - rapid weight gain
      - redness of the skin
      - swelling of the lips and face
      - tingling of the hands or feet
      - unusual weight gain or loss
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Clear or bloody discharge from the nipple
      - dimpling of the breast skin
      - inverted nipple
      - lump in the breast or under the arm
      - persistent crusting or scaling of the nipple
      - redness or swelling of the breast
      - sore on the skin of the breast that does not heal
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased interest in sexual intercourse
      - inability to have or keep an erection
      - loss in sexual ability, desire, drive, or performance
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Runny or stuffy nose
      - sleepiness or unusual drowsiness
      - sneezing
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - decreased amount of semen
      - diarrhea
      - dizziness
      - headache
      - stomach pain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Testicular pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
