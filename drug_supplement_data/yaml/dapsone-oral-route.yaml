title: Dapsone (oral route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Dapsone , a sulfone, belongs to the family of medicines called anti-infectives.
  - type: paragraph
    text: Dapsone is used to treat leprosy (Hansen's disease) and to help control
      dermatitis herpetiformis, a skin problem. When it is used to treat leprosy,
      dapsone may be given with one or more other medicines. Dapsone may also be used
      for other conditions as determined by your doctor.
  - type: paragraph
    text: Dapsone is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of dapsone in
        children with use in other age groups, this medicine is not expected to cause
        different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of dapsone in the elderly with
        use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Articaine
      - Lidocaine
      - Methotrexate
      - Rifabutin
      - Rifampin
      - Warfarin
      - Zidovudine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Amprenavir
      - Atazanavir
      - Fosamprenavir
      - Rifapentine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia (severe) or
      - Glucose-6-phosphate dehydrogenase (G6PD) deficiency or
      - Methemoglobin reductase deficiency—There is an increased risk of severe blood
        disorders and a decrease in red blood cell survival
    - type: list
      ordered: false
      items:
      - Liver disease—Dapsone may on rare occasion cause liver damage
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: 'For patients taking dapsone for leprosy:'
  - type: list
    ordered: false
    items:
    - To help clear up your leprosy completely or to keep it from coming back, it
      is very important that you keep taking this medicine for the full time of treatment,
      even if you begin to feel better after a few weeks or months. You may have to
      take it every day for as long as 3 years or more, or for life. If you stop taking
      this medicine too soon, your symptoms may return.
    - This medicine works best when there is a constant amount in the blood. To help
      keep the amount constant, do not miss any doses. Also, it is best to take each
      dose at the same time every day. If you need help in planning the best time
      to take your medicine, check with your health care professional.
  - type: paragraph
    text: 'For patients taking dapsone for dermatitis herpetiformis:'
  - type: list
    ordered: false
    items:
    - Your doctor may want you to follow a gluten-free diet. If you have any questions
      about this, check with your doctor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For Hansen''s disease (leprosy): Adults and
        teenagers—50 to 100 milligrams (mg) once a day; or 1.4 mg per kilogram (kg)
        (0.6 mg per pound) of body weight once a day. Dapsone should be taken with
        other medicines to treat Hansen''s disease. Children—Dose is based on body
        weight. The usual dose is 1.4 mg per kg (0.6 mg per pound) of body weight
        once a day. Dapsone should be taken with other medicines to treat Hansen''s
        disease. For dermatitis herpetiformis: Adults and teenagers—50 mg once a day
        to start. Your doctor will increase your dose, up to 300 mg once a day, until
        your symptoms are controlled. Then your dose will be decreased to the lowest
        dose that will still control your symptoms. Children—Dose is based on body
        weight. The usual dose is 2 mg per kg (0.9 mg per pound) of body weight once
        a day to start. Your doctor will increase your dose until your symptoms are
        controlled. Then your dose will be decreased to the lowest dose that will
        still control your symptoms.'
    - type: list
      ordered: false
      items:
      - 'For Hansen''s disease (leprosy): Adults and teenagers—50 to 100 milligrams
        (mg) once a day; or 1.4 mg per kilogram (kg) (0.6 mg per pound) of body weight
        once a day. Dapsone should be taken with other medicines to treat Hansen''s
        disease. Children—Dose is based on body weight. The usual dose is 1.4 mg per
        kg (0.6 mg per pound) of body weight once a day. Dapsone should be taken with
        other medicines to treat Hansen''s disease.'
      - 'For dermatitis herpetiformis: Adults and teenagers—50 mg once a day to start.
        Your doctor will increase your dose, up to 300 mg once a day, until your symptoms
        are controlled. Then your dose will be decreased to the lowest dose that will
        still control your symptoms. Children—Dose is based on body weight. The usual
        dose is 2 mg per kg (0.9 mg per pound) of body weight once a day to start.
        Your doctor will increase your dose until your symptoms are controlled. Then
        your dose will be decreased to the lowest dose that will still control your
        symptoms.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—50 to 100 milligrams (mg) once a day; or 1.4 mg per kilogram
        (kg) (0.6 mg per pound) of body weight once a day. Dapsone should be taken
        with other medicines to treat Hansen's disease.
      - Children—Dose is based on body weight. The usual dose is 1.4 mg per kg (0.6
        mg per pound) of body weight once a day. Dapsone should be taken with other
        medicines to treat Hansen's disease.
    - type: list
      ordered: false
      items:
      - Adults and teenagers—50 mg once a day to start. Your doctor will increase
        your dose, up to 300 mg once a day, until your symptoms are controlled. Then
        your dose will be decreased to the lowest dose that will still control your
        symptoms.
      - Children—Dose is based on body weight. The usual dose is 2 mg per kg (0.9
        mg per pound) of body weight once a day to start. Your doctor will increase
        your dose until your symptoms are controlled. Then your dose will be decreased
        to the lowest dose that will still control your symptoms.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: You may skip a missed dose if it does not make your symptoms come back
        or get worse. If your symptoms do come back or get worse, take the missed
        dose as soon as possible.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits.
  - type: paragraph
    text: If your symptoms do not improve within 2 to 3 months (for leprosy), or within
      a few days (for dermatitis herpetiformis), or if they become worse, check with
      your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back, leg, or stomach pains
      - bluish fingernails, lips, or skin
      - difficult breathing
      - fever
      - loss of appetite
      - pale skin
      - skin rash
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Itching, dryness, redness, scaling, or peeling of the skin, or loss of hair
      - mood or other mental changes
      - numbness, tingling, pain, burning, or weakness in hands or feet
      - sore throat
      - unusual bleeding or bruising
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - loss of appetite
      - nausea or vomiting
      - nervousness
      - trouble in sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
