title: Alfuzosin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Uroxatral
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Alfuzosin is used to treat the signs and symptoms of benign enlargement
      of the prostate (benign prostatic hyperplasia or BPH). Benign enlargement of
      the prostate is a problem that can occur in men as they get older. The prostate
      gland is located below the bladder. As the prostate gland enlarges, certain
      muscles in the gland may become tight and get in the way of the tube that drains
      urine from the bladder. This can cause problems with urinating, such as a need
      to urinate often, a weak stream when urinating, or a feeling of not being able
      to empty the bladder completely.
  - type: paragraph
    text: Alfuzosin helps relax the muscles in the prostate and the opening of the
      bladder. This may help increase the flow of urine or decrease the symptoms.
      However, alfuzosin will not shrink the prostate. The prostate may continue to
      get larger. This may cause the symptoms to become worse over time. Therefore,
      even though alfuzosin may lessen the problems caused by enlarged prostate now,
      surgery may still be needed in the future.
  - type: paragraph
    text: This medicine is usually given only to men. It is not normally given to
      women or children.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Alfuzosin is not indicated for use in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of alfuzosin in the elderly. However,
        elderly patients are more sensitive to the effects of this medicine than younger
        adults and are likely to have age-related kidney, liver, or heart problems,
        which may require caution in patients receiving alfuzosin.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Atazanavir
      - Bepridil
