    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (chest pain) or
      - Heart rhythm problems (eg, congenital or acquired QT prolongation), or history
        of or
      - Postural hypotension (low blood pressure)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Hypertension (high blood pressure) or
      - Liver disease, moderate or severe—Should not be used in patients with this
        condition.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease, mild—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine  exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Take this medicine with food and with the same meal every day.
  - type: paragraph
    text: Swallow the extended-release tablet whole. Do not break, crush, or chew
      it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended release tablets): For benign prostatic hyperplasia
        (BPH): Adults—10 milligrams (mg) once a day. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For benign prostatic hyperplasia (BPH): Adults—10 milligrams (mg) once a
        day. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—10 milligrams (mg) once a day.
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly and to check for unwanted
      effects.
  - type: paragraph
    text: Do not use this medicine if you are taking ketoconazole (Nizoral®), itraconazole
      (Sporanox®), or ritonavir (Norvir®).
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur after you use this medicine,
      especially when you get up from a lying or sitting position. Getting up slowly
      may help lessen this problem. If you feel dizzy, lie down so you do not faint
      . Then sit for a few moments before standing to prevent the dizziness from returning.
  - type: paragraph
    text: This medicine may cause some people to become dizzy or less alert than they
      are normally. Do not drive or do anything else that could be dangerous until
      you know how this medicine affects you .
  - type: paragraph
    text: Tell your eye doctor (ophthalmologist) that you have used or are using this
      medicine before cataract surgery or any other eye procedure. This medicine may
      cause a serious eye problem called Intraoperative Floppy Iris Syndrome (IFIS).
  - type: paragraph
    text: Call your doctor right away if you experience a prolonged erection . This
      is an extremely rare side effect, but if it goes untreated, can result in permanent
      erectile dysfunction (impotence).
  - type: paragraph
    text: Check with your doctor right away if you have arm, back or jaw pain, chest
      pain or discomfort, chest tightness or heaviness, fast or irregular heartbeat,
      nausea, or sweating.
  - type: paragraph
    text: Benign prostatic hyperplasia can have the same symptoms as prostate cancer.
      They may also often occur together. Your doctor may test for the presence of
      the cancer before you start using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - chills
      - cold sweats
      - confusion
      - dizziness, faintness, or lightheadedness when getting up from a lying or sitting
        position
      - fainting
      - fast, pounding, or irregular heartbeat or pulse
      - painful or prolonged erection of the penis
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm, back, or jaw pain
      - black, tarry stools
      - bleeding gums
      - bloody urine
      - chest discomfort, tightness, or heaviness
      - clay-colored stools
      - dark urine
      - diarrhea
      - fever
      - headache
      - hives, welts, itching, skin rash
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - loss of appetite
      - nausea
      - pinpoint red spots on the skin
      - stomach pain
      - sweating
      - swelling
      - unpleasant breath odor
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting of blood
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - body aches or pain
      - congestion
      - cough
      - cough producing mucus
      - decreased interest in sexual intercourse
      - difficulty breathing
      - difficulty having a bowel movement
      - dryness or soreness of the throat
      - ear congestion
      - heartburn
      - hoarseness
      - inability to have or keep an erection
      - indigestion
      - loss in sexual ability, desire, drive, or performance
      - loss of voice
      - nasal congestion
      - pain
      - pain or tenderness around the eyes and cheekbones
      - sneezing
      - sore throat
      - stomach discomfort or upset
      - stuffy or runny nose
      - tender, swollen glands in the neck
      - tightness in the chest
      - trouble with swallowing
      - unusual tiredness or weakness
      - voice changes
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Feeling of warmth
      - redness of the face, neck, arms, and occasionally, upper chest
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
