- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Amoxicillin is used to treat bacterial infections in many different parts
      of the body (ear, lungs, nose, sinus, skin, urinary tract). It is also used
      with other medicines (eg, clarithromycin, lansoprazole) to treat H. pylori infection
      and duodenal ulcers.
  - type: paragraph
    text: Amoxicillin is also used to treat tonsillitis and pharyngitis (sore throat).
  - type: paragraph
    text: Amoxicillin belongs to the group of medicines known as penicillin antibiotics.
      It works by killing the bacteria and preventing their growth. However, this
      medicine will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Powder for Suspension
    - Tablet, Chewable
    - Tablet, Extended Release
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of amoxicillin in children for treatment
        of infection in many parts of the body, including the ears, lungs, nose, sinuses,
        skin, or urinary tract) . However, newborns and infants 3 months of age and
        younger have incompletely developed kidney function, which may need a lower
        dose of this medicine. Appropriate studies have not been performed on the
        relationship of age to the effects of amoxicillin in children for the treatment
        of H. pylori infection . Safety and efficacy have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of amoxicillin extended-release tablets in children younger
        than 12 years of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of amoxicillin in the elderly. However,
        elderly patients are more likely to have age-related kidney problems, which
        may require caution and an adjustment in the dose for patients receiving amoxicillin.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acenocoumarol
      - Chlortetracycline
      - Cholera Vaccine, Live
      - Coumarin
      - Demeclocycline
      - Desogestrel
      - Dicumarol
      - Dienogest
      - Doxycycline
      - Drospirenone
      - Eravacycline
      - Estetrol
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Exenatide
      - Gestodene
      - Levonorgestrel
      - Lymecycline
      - Meclocycline
      - Mestranol
      - Methacycline
      - Methotrexate
      - Minocycline
      - Mycophenolate Mofetil
      - Nomegestrol
      - Norethindrone
      - Norgestimate
      - Norgestrel
      - Oxytetracycline
      - Phenindione
      - Phenprocoumon
      - Probenecid
      - Rolitetracycline
      - Sarecycline
      - Sulfasalazine
      - Tetracycline
      - Tigecycline
      - Venlafaxine
      - Warfarin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Khat
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to penicillins or cephalosporin antibiotics (eg, cefaclor, cefadroxil,
        cephalexin, Ceftin®, Keflex®) or
      - Mononucleosis ("mono")—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe—The extended-release tablets should not be used in
        patients with this condition.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Phenylketonuria (PKU)—The chewable tablet contains phenylalanine, which can
        make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: You may take this medicine with or without food. However, it is best to
      take this medicine at the start of a meal or snack to avoid an upset stomach.
  - type: paragraph
    text: Swallow the extended-release tablet whole. Do not crush or chew it.
  - type: paragraph
    text: 'For patients using the oral liquid :'
  - type: list
    ordered: false
    items:
    - Shake the bottle well before each use. Measure the dose with a marked measuring
      spoon, oral syringe, or medicine cup. The average household teaspoon may not
      hold the right amount of liquid.
    - You may mix the oral liquid with a baby formula, milk, fruit juice, water, ginger
      ale, or another cold drink. Be sure the child drinks all of the mixture immediately.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you feel
      better after the first few doses. Your infection may not clear up if you stop
      using the medicine too soon.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules, powder for suspension, and tablets): For
        bacterial infections: Adults and children weighing 40 kilograms (kg) or more—250
        to 500 milligrams (mg) every 8 hours, or 500 to 875 mg every 12 hours. Children
        3 months of age and older and weighing less than 40 kg—Dose is based on body
        weight and must be determined by your doctor. The usual dose is 20 to 40 milligrams
        (mg) per kilogram (kg) of body weight per day, divided and given every 8 hours,
        or 25 to 45 mg per kg of body weight per day, divided and given every 12 hours.
        Children younger than 3 months of age—Dose is based on body weight and must
        be determined by your doctor. The usual dose is 30 mg per kg of body weight
        per day, divided and given every 12 hours. For treatment of H. pylori infection:
        Adults— Dual therapy: 1000 milligrams (mg) of amoxicillin and 30 mg of lansoprazole,
        each given three times a day (every 8 hours) for 14 days. Triple therapy:
        1000 mg of amoxicillin, 500 mg of clarithromycin, and 30 mg of lansoprazole,
        all given two times a day (every 12 hours) for 14 days. Children—Use and dose
        must be determined by your doctor.'
      - 'For oral dosage form (extended-release tablets): For the treatment of pharyngitis
        and tonsillitis: Adults—775 milligrams (mg) once a day, taken within 1 hour
        of finishing a meal for 10 days. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For bacterial infections: Adults and children weighing 40 kilograms (kg)
        or more—250 to 500 milligrams (mg) every 8 hours, or 500 to 875 mg every 12
