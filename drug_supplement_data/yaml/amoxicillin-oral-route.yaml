    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: You may store the oral liquid in the refrigerator. Throw away any unused
        medicine after 14 days. Do not freeze.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your or your child's symptoms do not improve within a few days, or if
      they become worse, check with your doctor.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction called anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you or your child have itching, hives, hoarseness,
      trouble breathing, trouble swallowing, or any swelling of your hands, face,
      or mouth after taking this medicine.
  - type: paragraph
    text: Serious skin reactions, including Stevens-Johnson syndrome, toxic epidermal
      necrolysis, acute generalized exanthematous pustulosis (AGEP), or drug reaction
      with eosinophilia and systemic symptoms (DRESS) can occur with this medicine.
      Check with your doctor right away if you or your child have black, tarry stools,
      blistering, peeling, or loosening of the skin, chest pain, chills, cough, diarrhea,
      fever, itching, joint or muscle pain, painful or difficult urination, red irritated
      eyes, red skin lesions, sore throat, sores, ulcers, or white spots in the mouth
      or on the lips, swollen glands, unusual bleeding or bruising, or unusual tiredness
      or weakness while you are receiving this medicine.
  - type: paragraph
    text: This medicine may cause stomach or bowel problems, including drug-induced
      enterocolitis syndrome (DIES). It may occur 1 to 4 hours after taking this medicine.
      Check with your doctor right away if you have blurred vision, cold clammy skin,
      confusion, dizziness, faintness, or lightheadedness when getting up suddenly
      from a lying or sitting position, fever, pale skin, stomach pain, cramps, or
      tenderness, sweating, unusual drowsiness, dullness, tiredness, weakness or feeling
      of sluggish, unusual tiredness or weakness, or watery or bloody diarrhea.
  - type: paragraph
    text: Amoxicillin may cause diarrhea, and in some cases it can be severe. It may
      occur 2 months or more after you stop taking this medicine. Do not take any
      medicine or give medicine to your child to treat diarrhea without first checking
      with your doctor. Diarrhea medicines may make the diarrhea worse or make it
      last longer. If you have any questions about this, or if the diarrhea gets worse,
      check with your doctor.
  - type: paragraph
    text: Before you have any medical tests, tell the provider that you or your child
      are taking this medicine. The results of some tests may be affected by this
      medicine.
  - type: paragraph
    text: In some young patients, tooth discoloration may occur while using this medicine.
      The teeth may appear to have brown, yellow, or gray stains. To help prevent
      this, brush and floss your teeth regularly. Visit your dentist for regular teeth
      cleanings.
  - type: paragraph
    text: Birth control pills may not work while you are using this medicine. To keep
      from getting pregnant, use another form of birth control along with your birth
      control pills. Other forms include a condom, a diaphragm, or a contraceptive
      foam or jelly.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
