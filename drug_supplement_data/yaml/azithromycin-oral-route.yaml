title: Azithromycin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Zithromax
    - type: paragraph
      text: Zithromax Tri-Pak
    - type: paragraph
      text: Zithromax Z-Pak
    - type: paragraph
      text: Zmax
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Azithromycin is used to treat certain bacterial infections in many different
      parts of the body. This medicine may mask or delay the symptoms of syphilis.
      It is not effective against syphilis infections.
  - type: paragraph
    text: Azithromycin belongs to the class of drugs known as macrolide antibiotics.
      It works by killing bacteria or preventing their growth. However, this medicine
      will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of azithromycin to treat sinusitis in children or to treat
        pneumonia in children younger than 6 months of age. Safety and efficacy have
        not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of azithromycin oral suspension and tablets to treat pharyngitis
        or tonsillitis in children younger than 2 years of age. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of azithromycin in the elderly. However,
        elderly patients are more likely to have heart rhythm problems (eg, torsades
        de pointes) which may require caution in patients receiving azithromycin.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Colchicine
      - Dronedarone
      - Levoketoconazole
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acecainide
      - Adagrasib
      - Alfuzosin
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amoxapine
      - Anagrelide
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Azathioprine
      - Bedaquiline
      - Bretylium
      - Buprenorphine
      - Buserelin
      - Ceritinib
      - Chloroquine
      - Chlorpromazine
      - Cholera Vaccine, Live
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
      - Crizotinib
      - Cyclobenzaprine
      - Cyclosporine
      - Dabigatran Etexilate
      - Dabrafenib
      - Dasatinib
      - Degarelix
      - Delamanid
      - Desflurane
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atorvastatin
      - Lovastatin
      - Rifabutin
      - Theophylline
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to any macrolide and ketolide antibiotic (eg, clarithromycin, erythromycin,
        telithromycin, Biaxin®, Ery-tab®, or Ketek®) or
      - Liver disease with prior azithromycin use, history of—Should not be used in
        patients with this condition.
    - type: list
      ordered: false
      items:
      - Bacteremia (blood infection) or
      - Cystic fibrosis or
      - Infections, nosocomial or hospital-acquired or
      - Weak immune system or
      - Weakened physical condition—Should not be used in patients with these conditions
        to treat pneumonia.
    - type: list
      ordered: false
      items:
      - Bradycardia (slow heartbeat) or
      - Congestive heart failure or
      - Diarrhea or
      - Heart disease or
      - Heart rhythm problems (eg, QT prolongation, torsades de pointes, bradyarrhythmias),
        history of or
      - Hypokalemia (low potassium in the blood), uncorrected or
      - Hypomagnesemia (low magnesium in the blood), uncorrected or
      - Myasthenia gravis (severe muscle weakness)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take Zithromax® oral liquid or tablets with or without food.
  - type: paragraph
    text: Shake well the bottle of Zithromax® oral liquid before each use. Measure
      your dose correctly with a marked measuring spoon, oral syringe, or medicine
      cup. The average household teaspoon may not hold the right amount of liquid.
  - type: paragraph
    text: Measure the Zmax® extended-release oral suspension with a marked measuring
      spoon, syringe, or cup. You or your child must take this medicine within 12
      hours after it has been mixed with water. It is best to take the Zmax® extended-release
      oral suspension on an empty stomach or at least 1 hour before or 2 hours after
      a meal. If your child does not use all of the medicine in the bottle, throw
      it away after you give the dose.
  - type: paragraph
    text: If you or your child vomits within one hour of taking the Zmax® extended-release
      oral suspension , call your doctor right away to see if more medicine is needed.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you or your
      child feel better after the first few doses. Your infection may not clear up
      if you stop using the medicine too soon.
  - type: paragraph
    text: If you are taking aluminum or magnesium-containing antacids, do not take
      them at the same time that you take Zithromax® . These medicines may keep azithromycin
      from working properly. However, you can take antacids with Zmax® .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release suspension): For treatment of pneumonia:
        Adults—2 grams (g) once as a single dose. Children weighing 34 kilograms (kg)
        or more—Dose is based on body weight and must be determined by your doctor.
        The dose is usually 2 grams once a day, taken as a single dose. Children 6
        months of age and older weighing less than 34 kg—Dose is based on body weight
        and must be determined by your doctor. The dose is usually 60 milligrams (mg)
        per kilogram (kg) of body weight once a day, taken as a single dose. For treatment
        of sinusitis: Adults—2 grams (g) once a day as a single dose. Children—Use
        and dose must be determined by your doctor.'
      - 'For oral dosage forms (suspension or tablets): For treatment of infections:
        Adults—500 to 2000 milligrams (mg) once a day, taken as a single dose. Depending
        on the type of infection, this may be followed with doses of 250 to 500 mg
        once a day for several days. Children 6 months of age and older—Dose is based
        on body weight and must be determined by your doctor. The dose is usually
        10 to 30 milligrams (mg) per kilogram (kg) of body weight once a day, taken
        as a single dose. Depending on the type of infection, this may be followed
        with doses of 5 to 10 mg per kg of body weight once a day for several days.
        Children younger than 6 months of age—Use and dose must be determined by your
        doctor. For treatment of pharyngitis or tonsillitis: Adults—500 milligrams
        (mg) on Day 1 (the first day), taken as a single dose. Then, 250 mg on Day
        2 through Day 5. Children 2 years of age and older—Dose is based on body weight
        and must be determined by your doctor. The dose is usually 12 milligrams (mg)
        per kilogram (kg) of body weight once a day for 5 days. Children younger than
        2 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of pneumonia: Adults—2 grams (g) once as a single dose. Children
        weighing 34 kilograms (kg) or more—Dose is based on body weight and must be
        determined by your doctor. The dose is usually 2 grams once a day, taken as
