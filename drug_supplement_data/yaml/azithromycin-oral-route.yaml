      - feeling of constant movement of self or surroundings
      - full feeling
      - heartburn
      - hyperventilation
      - increase in body movements
      - itching of the vagina or genital area
      - lack or loss of strength
      - mental depression
      - nervousness
      - pain during sexual intercourse
      - paranoia
      - quick to react or overreact emotionally
      - rapidly changing moods
      - rash with flat lesions or small raised lesions on the skin
      - redness of the skin
      - restlessness
      - sensation of spinning
      - shaking
      - sleepiness or unusual drowsiness
      - stomach upset
      - thick, white vaginal discharge with no odor or with a mild odor
      - white patches in the mouth, tongue, or throat
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with moving
      - increased sensitivity of the skin to sunlight
      - muscle pain or stiffness
      - pain in the joints
      - redness or other discoloration of the skin
      - severe sunburn
      - trouble sitting still
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
