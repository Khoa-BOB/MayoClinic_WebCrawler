    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Do not refrigerate or freeze the Zmax® extended-release oral suspension
        . After water has been added to the powder, use the dose within 12 hours and
        throw away any unused liquid after your dose.
    - type: paragraph
      text: You may store the Zithromax® oral liquid at room temperature or in the
        refrigerator. Do not freeze the bottle. Do not keep the oral liquid for more
        than 10 days. Throw away any unused liquid after all doses are completed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child at regular visits to make sure this medicine is working properly. Blood
      and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: If you or your child's symptoms do not improve within a few days, or if
      they become worse, check with your doctor.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Call your doctor right away if you or your child have a rash, itching,
      hives, hoarseness, trouble breathing, trouble swallowing, or any swelling of
      your hands, face, or mouth after you take this medicine.
  - type: paragraph
    text: Serious skin reactions, including Stevens-Johnson syndrome, acute generalized
      exanthematous pustulosis, toxic epidermal necrolysis, and drug reaction with
      eosinophilia and systemic symptoms (DRESS) can occur with this medicine. Check
      with your doctor right away if you or your child have black, tarry stools, blistering,
      peeling, or loosening of the skin, chest pain, chills, cough, diarrhea, itching,
      joint or muscle pain, painful or difficult urination, red irritated eyes, red
      skin lesions, often with a purple center, sore throat, sores, ulcers, or white
      spots in the mouth or on the lips, swollen glands, unusual bleeding or bruising
      or unusual tiredness or weakness while you are using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you or your child have pain or tenderness
      in the upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual
      tiredness or weakness, or yellow eyes or skin. These could be symptoms of a
      serious liver problem.
  - type: paragraph
    text: Call your child's doctor right away if your child feels irritable or vomits
      after feeding. These may be symptoms of a condition called infantile hypertrophic
      pyloric stenosis.
  - type: paragraph
    text: Azithromycin may cause diarrhea, and in some cases it can be severe. It
      may occur 2 months or more after you stop using this medicine. Do not take any
      medicine to treat diarrhea without first checking with your doctor. Diarrhea
      medicines may make the diarrhea worse or make it last longer. If you or your
      child have any questions about this or if mild diarrhea continues or gets worse,
      check with your doctor.
  - type: paragraph
    text: This medicine can cause changes in heart rhythms, including QT prolongation.
      It may change the way your heart beats and cause fainting or serious side effects
      in some patients. Contact your doctor right away if you or your child have any
      symptoms of heart rhythm problems, including fast, pounding, or irregular heartbeats.
  - type: paragraph
    text: This medicine may increase the risk of serious heart or blood vessel problems.
      Call your doctor right away if you have blurred vision, chest pain, confusion,
      lightheadedness, dizziness, fainting, fast or irregular heartbeat, trouble breathing,
      or unusual tiredness or weakness.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - loose stools
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, crusting, irritation, itching, or reddening of the skin
      - cracked, dry, or scaly skin
      - fever
      - swelling
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
