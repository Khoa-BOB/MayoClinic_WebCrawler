      - Blistering, peeling, or loosening of the skin
      - bloody or cloudy urine
      - bloody, black, or tarry stools
      - body aches or pain
      - burning while urinating
      - chest pain or tightness
      - chills
      - congestion
      - cough increased
      - cough producing mucus
      - dark urine
      - difficult or labored breathing
      - difficult or painful urination
      - dizziness
      - drowsiness
      - dryness or soreness of the throat
      - earache
      - fainting
      - fast, irregular, pounding, or racing heartbeat or pulse
      - general feeling of discomfort or illness
      - headache
      - indigestion
      - irregular or slow heart rate
      - itching or rash
      - joint or muscle pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - light-colored stools
      - loss of appetite
      - muscle aches and pains
      - nausea or vomiting
      - noisy breathing
      - passing of gas
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - redness or swelling in the ear
      - runny nose
      - shivering
      - sneezing
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach pain, continuing
      - stomach pain, fullness, or discomfort
      - stuffy nose
      - sweating
      - swelling of the face, ankles, hands, feet, or lower legs
      - tender, swollen glands in the neck
      - trouble with sleeping
      - trouble with swallowing
      - unpleasant breath odor
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - upper right abdominal or stomach pain
      - voice changes
      - vomiting of blood
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding gums
      - bloating
      - blood in the urine or stools
      - blurred vision
      - change in hearing
      - clay-colored stools
      - coma
      - confusion
      - constipation
      - continuing ringing or buzzing or other unexplained noise in the ears
      - decreased urine output
      - depression
      - diarrhea, watery and severe, which may also be bloody
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fainting
      - greatly decreased frequency of urination or amount of urine
      - hives
      - hostility
      - increased thirst
      - irritability
      - lethargy
      - loss of hearing
      - lower back or side pain
      - muscle twitching
      - no blood pressure or pulse
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - pale skin
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid weight gain
      - seizures
      - stomach cramps or tenderness
      - stopping of heart
      - stupor
      - unconsciousness
      - unusual weight loss
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - aggressive or angry
      - bad, unusual, or unpleasant (after) taste
      - belching
      - burning feeling in the chest or stomach
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
