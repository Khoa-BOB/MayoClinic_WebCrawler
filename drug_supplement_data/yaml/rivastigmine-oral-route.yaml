title: Rivastigmine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Exelon
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Rivastigmine is used to treat mild to moderate dementia (memory loss and
      mental changes) associated with Alzheimer's disease or Parkinson's disease.
      Rivastigmine will not cure or stop Alzheimer's disease or Parkinson's disease
      from getting worse, however, rivastigmine can improve the thinking ability in
      some patients.
  - type: paragraph
    text: In Alzheimer's disease, many chemical changes take place in the brain. One
      of the earliest and biggest changes is that there is less of a chemical called
      acetylcholine (ACh). ACh helps the brain to work properly. Rivastigmine slows
      the breakdown of ACh, so it can build up and have a greater effect. However,
      as Alzheimer's disease gets worse, there will be less and less ACh, so rivastigmine
      may not work as well.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of rivastigmine in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of rivastigmine in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bromopride
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acebutolol
      - Amifampridine
      - Atenolol
      - Betaxolol
      - Bisoprolol
      - Bupropion
      - Carteolol
      - Carvedilol
      - Celiprolol
      - Clomipramine
      - Donepezil
      - Esmolol
      - Hydroxychloroquine
      - Labetalol
      - Levobunolol
      - Metipranolol
      - Metoclopramide
      - Metoprolol
      - Nadolol
      - Nebivolol
      - Oxprenolol
      - Penbutolol
      - Pindolol
      - Practolol
      - Propranolol
      - Sotalol
      - Timolol
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Oxybutynin
      - Tolterodine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Application site reaction from rivastigmine skin patch, history of—Should
        not be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Asthma, history of or
      - Heart problems, including slow heartbeat or hypotension (low blood pressure),
        or
      - Lung or breathing problems (eg, obstructive pulmonary disease), history of
        or
      - Seizures, history of or
      - Stomach or bowel problems (eg, bleeding, ulcers), or history of or
      - Urinary tract blockage or difficult urination—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate to severe or
      - Liver disease, mild or moderate—Use with caution. A lower dose of rivastigmine
        may be given to patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with patient instructions. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: It is best to take this medicine with food.
  - type: paragraph
    text: Rivastigmine seems to work best when it is taken at regularly spaced times,
      usually two times a day, in the morning and evening.
  - type: paragraph
    text: 'If you are using the oral liquid :'
  - type: list
    ordered: false
    items:
    - Measure your dose with the dosing syringe that comes with the package.
    - You may swallow directly from the syringe or you may mix the medicine with a
      small glass of water, soda, or cold fruit juice before taking it. You may use
      the mixture for up to 4 hours.
  - type: paragraph
    text: Swallow the capsule whole. Do not crush, break, or chew it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules or solution): For treatment of Alzheimer''s
        disease: Adults—At first, 1.5 milligrams (mg) two times a day. Your doctor
        may gradually increase your dose as needed and tolerated. However, the dose
        is usually not more than 6 mg two times a day. Children—Use and dose must
        be determined by your doctor. For treatment of Parkinson''s disease: Adults—At
        first, 1.5 milligrams (mg) two times a day. Your doctor may gradually increase
        your dose as needed and tolerated. However, the dose is usually not more than
        6 mg two times a day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of Alzheimer''s disease: Adults—At first, 1.5 milligrams (mg)
        two times a day. Your doctor may gradually increase your dose as needed and
        tolerated. However, the dose is usually not more than 6 mg two times a day.
        Children—Use and dose must be determined by your doctor.'
      - 'For treatment of Parkinson''s disease: Adults—At first, 1.5 milligrams (mg)
        two times a day. Your doctor may gradually increase your dose as needed and
        tolerated. However, the dose is usually not more than 6 mg two times a day.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 1.5 milligrams (mg) two times a day. Your doctor may gradually
        increase your dose as needed and tolerated. However, the dose is usually not
        more than 6 mg two times a day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—At first, 1.5 milligrams (mg) two times a day. Your doctor may gradually
        increase your dose as needed and tolerated. However, the dose is usually not
        more than 6 mg two times a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you missed your dose for more than 3 days , call your doctor right
        away. You may need to go back to a lower dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to check for unwanted effects.
  - type: paragraph
    text: Rivastigmine may cause nausea, vomiting, diarrhea, stomach pain, loss of
      appetite, or weight loss. Tell your doctor if any of these problems are severe,
      because they could cause other health problems such as dehydration.
  - type: paragraph
    text: If you develop a skin rash, hives, or any allergic reaction to this medicine,
      stop taking the medicine and check with your doctor as soon as possible.
  - type: paragraph
    text: Before you have any kind of surgery, dental treatment, or emergency treatment,
      tell the medical doctor or dentist in charge that you are taking this medicine.
      Taking rivastigmine together with medicines that are sometimes used during surgery
      or dental or emergency treatments may increase the effects of these medicines.
  - type: paragraph
    text: Rivastigmine may cause some people to become dizzy, clumsy, or unsteady.
      Make sure you know how you react to this medicine before you drive, use machines,
      or do anything else that could be dangerous if you are dizzy or not alert .
  - type: paragraph
    text: Do not stop taking this medicine or decrease your dose without first checking
      with your doctor . Stopping this medicine suddenly or decreasing the dose by
      a large amount may cause mental or behavior changes.
  - type: paragraph
    text: If you think you or someone else may have taken an overdose of rivastigmine,
      get emergency help at once. Taking an overdose of rivastigmine may lead to convulsions
      (seizures) or shock. Some signs of shock are large pupils, irregular breathing,
      and fast weak pulse. Other signs of an overdose are severe nausea and vomiting,
      increasing muscle weakness, greatly increased sweating, and greatly increased
      watering of the mouth.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes nonprescription medicines, such as aspirin, and medicines
      for appetite control, asthma, colds, cough, hay fever, or sinus problems.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - indigestion
      - loss of appetite
      - loss of strength
      - nausea and vomiting
      - weight loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fainting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Aggression
      - convulsions (seizures)
      - trembling and shaking of the hands and fingers
      - trouble urinating
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody or black, tarry stools
      - chest pain or discomfort
      - constipation
      - difficulty with speaking
      - drooling
      - lightheadedness, dizziness, or fainting
      - loss of balance control
      - muscle trembling, jerking, or stiffness
      - restlessness
      - severe stomach pain
      - shortness of breath
      - shuffling walk
      - slow or irregular heartbeat
      - stiffness of the limbs
      - trouble urinating
      - twisting movements of the body
      - uncontrolled movements, especially of the face, neck, and back
      - unusual tiredness
      - vomiting of blood or material that looks like coffee grounds
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or discomfort
      - increased sweating
      - increased watering of the mouth
      - irregular, fast, slow, or shallow breathing
      - lightheadedness, dizziness, or fainting
      - nausea (severe)
      - pale or blue lips, fingernails, or skin
      - seizures
      - slow or irregular heartbeat
      - trouble breathing
      - unusual tiredness
      - vomiting (severe)
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain or cramping
      - bloated or full feeling
      - confusion
      - dizziness
      - headache
      - mental depression
      - seeing, hearing, or feeling things that are not there
      - trouble sleeping
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - General feeling of discomfort or illness
      - runny nose
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
