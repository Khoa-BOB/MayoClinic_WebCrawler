title: Yellow fever vaccine (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Yf-Vax
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Yellow fever vaccine is used to prevent infection by the yellow fever virus.
      This vaccine works by causing your body to produce its own protection (antibodies)
      against the virus.
  - type: paragraph
    text: Vaccination against yellow fever is recommended for all persons 9 months
      of age and older who are traveling to or living in areas of Africa, South America,
      or other countries where there is yellow fever infection and for people who
      are traveling to countries that require yellow fever immunization (certificate
      of vaccination). It is also needed by other people who might come into contact
      with the yellow fever virus.
  - type: paragraph
    text: Pregnant women should be vaccinated only if they must travel to areas where
      there is an epidemic of yellow fever and they cannot be protected from mosquito
      bites.
  - type: paragraph
    text: The certificate of vaccination for yellow fever is valid for 10 years beginning
      10 days after the first vaccination, or on the date of the second vaccination
      if within 10 years of the first injection.
  - type: paragraph
    text: Yellow fever vaccine may not protect all persons given the vaccine.
  - type: paragraph
    text: This vaccine is given only at authorized Yellow Fever Vaccination Centers.
      The location of these centers can be obtained from your state, province, and
      local health departments.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Yellow fever vaccine is recommended for children 9 months of age or older
        if they are traveling to, or living in, areas where there is yellow fever
        infection, or if they are traveling to areas that require yellow fever immunization
        (certificate of vaccination). However, the vaccine is not recommended for
        infants younger than 9 months of age, because of an increased risk of encephalitis.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Use of this vaccine should be limited to elderly patients older than 65
        years of age who are traveling to, or living in, areas where there is yellow
        fever infection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is not recommended.
        Your doctor may decide not to use this vaccine or change some of the other
        medicines you take.
    - type: list
      ordered: false
      items:
      - Abarelix
      - Abemaciclib
      - Abiraterone
      - Acalabrutinib
      - Adagrasib
