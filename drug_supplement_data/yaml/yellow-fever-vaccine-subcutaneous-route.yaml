    - type: paragraph
      text: Receiving this vaccine with any of the following medicines may cause an
        increased risk of certain side effects, but using both drugs may be the best
        treatment for you. If both medicines are prescribed together, your doctor
        may change the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Abatacept
      - Cytomegalovirus Immune Globulin, Human
      - Hepatitis B Immune Globulin
      - Rabies Immune Globulin
      - Respiratory Syncytial Virus Immune Globulin, Human
      - Tetanus Immune Globulin
      - Vaccinia Immune Globulin, Human
      - Varicella-Zoster Immune Globulin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to eggs, egg products, chicken proteins, or gelatin, history of or
      - Serious illness with fever or
      - Weak immune system (e.g., HIV or AIDS, cancer, leukemia, lymphoma, or thymic
        disease)—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Asymptomatic HIV infection—Should be vaccinated and be monitored for possible
        side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this vaccine.
      This vaccine is given as a shot under your skin.
  - type: paragraph
    text: A booster dose of the vaccine is recommended every 10 years for patients
      who are at continuous risk of exposure to the yellow fever virus, and is required
      by his or her doctor.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that you or your child return to your doctor at the
      right time for the second dose (as directed by your doctor) . Be sure to tell
      your doctor about any side effects that occur after you receive this vaccine.
  - type: paragraph
    text: This vaccine may cause a serious type of allergic reaction called anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Tell your doctor right away if you or your child have a rash, itching, swelling
      of the tongue and throat, or trouble breathing after you receive the vaccine.
  - type: paragraph
    text: Side effects from this vaccine could occur up to 30 days after you receive
      the shot. Be sure to tell your doctor about any serious side effects that occur
      during that time.
  - type: paragraph
    text: Yellow fever vaccine may cause a serious side effect called neurotropic
      disease or post-vaccinal encephalitis. Check with your doctor right away if
      you or your child have confusion, irritability, headache, seizures, stiff neck,
      or vomiting.
  - type: paragraph
    text: 'This vaccine may cause serious allergic reactions affecting multiple body
      organs (e.g., liver or kidney). Check with your doctor right away if you have
      the following symptoms: fever, dark urine, headache, rash, stomach pain, unusual
      tiredness, or yellow eyes or skin.'
  - type: paragraph
    text: Since the vaccine may not protect everyone completely, it is very important
      that you use precautions to reduce your chance of mosquito bites. These include
      using insect repellents and mosquito nets, wearing protective clothing, and
      staying indoors during twilight and after dark.
  - type: paragraph
    text: The stopper of the vial contains dry natural rubber (a derivative of latex),
      which may cause allergic reactions in people who are sensitive to latex. Tell
      your doctor if you have a latex allergy before you start receiving this vaccine.
  - type: paragraph
    text: Tell your doctor if you are receiving a treatment or using a medicine that
      causes a weak immune system. This may include radiation therapy, steroid medicines,
      or cancer medicines.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - convulsions (seizures)
      - coughing
      - difficulty with breathing or swallowing
      - fast heartbeat
      - feeling of burning, crawling, or tingling of the skin
      - nervousness or irritability
      - reddening of the skin
      - severe headache
      - skin rash or itching
      - sneezing
      - stiff neck
      - throbbing in the ears
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with moving
      - joint pain
      - low fever
      - mild headache
      - muscle aching or cramping
      - muscle pains or stiffness
      - pain at the injection site
      - swollen joints
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
