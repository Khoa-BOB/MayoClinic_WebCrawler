    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angioedema (swelling of the face, lips, tongue, throat, arms, or legs), history
        of—May increase the risk of this condition occurring again.
    - type: list
      ordered: false
      items:
      - AV block, without a pacemaker or
      - Cardiogenic shock (shock caused by a heart attack) or
      - Diabetic patients who are also taking aliskiren (Tekturna®) or
      - Heart disease (eg, left ventricular dysfunction), severe or
      - Heart rhythm problems (eg, atrial flutter, atrial fibrillation, Wolff-Parkinson-White,
        Lown-Ganong-Levine syndromes) or
      - Hypotension (low blood pressure) or
      - Sick sinus syndrome (abnormal heart rhythm), without a pacemaker—Should not
        be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Collagen vascular disease (an autoimmune disease) together with kidney disease—Increased
        risk of blood problems.
    - type: list
      ordered: false
      items:
      - Congestive heart failure—Use may lead to kidney problems.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Kidney problems—Increased risk of potassium levels in the body becoming too
        high.
    - type: list
      ordered: false
      items:
      - Duchenne's muscular dystrophy (muscle problem) or
      - Electrolyte imbalance (eg, low levels of potassium, salt or sodium in the
        body) or
      - Fluid imbalance (caused by dehydration, vomiting, diarrhea) or
      - Heart disease (eg, hypertrophic cardiomyopathy) or
      - Heart rhythm problems (eg, prolonged PR interval) or
      - Kidney disease or
      - Liver disease—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine should not be the first medicine you use to treat your condition
      . It is meant to be used only after you have tried other medicines that have
      not worked or have caused unwanted side effects.
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these are most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure but it
      does help control it. Therefore, you must continue to take it as directed if
      you expect to lower your blood pressure and keep it down. You may have to take
      high blood pressure medicine for the rest of your life . If high blood pressure
      is not treated, it can cause serious problems such as heart failure, blood vessel
      disease, stroke, or kidney disease.
  - type: paragraph
    text: Take this medicine at the same time each day.
  - type: paragraph
    text: Swallow the extended-release tablets whole. Do not break, crush, or chew
      them.
  - type: paragraph
    text: Take this medicine with food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets): For high blood pressure:
        Adults—1 or 2 tablets (1 to 4 milligrams [mg] trandolapril and 180 to 240
        mg verapamil) per day. Your doctor may adjust your dose as needed. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—1 or 2 tablets (1 to 4 milligrams [mg] trandolapril
        and 180 to 240 mg verapamil) per day. Your doctor may adjust your dose as
        needed. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—1 or 2 tablets (1 to 4 milligrams [mg] trandolapril and 180 to 240
        mg verapamil) per day. Your doctor may adjust your dose as needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: You should not use this medicine together with sacubitril . Do not use this
      medicine and sacubitril/valsartan (Entresto®) within 36 hours of each other.
  - type: paragraph
    text: Do not use this medicine at least 2 weeks before or 2 days after using flibanserin.
      Using these medicines together may cause serious unwanted effects .
  - type: paragraph
    text: This medicine may worsen the condition of patients with heart disease or
      heart rhythm problems. Check with your doctor right away if you have chest pain
      or tightness, decreased urine output, dilated neck veins, extreme fatigue, irregular
      heartbeat, swelling of the face, fingers, feet, or lower legs, troubled breathing,
      or weight gain. You might also feel dizzy or faint, or you might have a fast,
      pounding, or uneven heartbeat.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may also occur, especially when
      you get up from a lying or sitting position or if you have been taking a diuretic
      (water pill). Do not drive or do anything else that could be dangerous until
      you know how this medicine affects you . If you feel dizzy, lie down so you
      do not faint. Then sit for a few moments before standing to prevent the dizziness
      from returning. If you faint, stop using this medicine and call your doctor
      right away .
  - type: paragraph
    text: Check with your doctor right away if you become sick while taking this medicine,
      especially with severe or continuing nausea, vomiting, or diarrhea. These conditions
      may cause you to lose too much water or salt and may lead to low blood pressure.
      You can also lose water by sweating, so drink plenty of water during exercise
      or in hot weather.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, dark urine, pale stools, nausea, vomiting, loss of appetite,
      or yellow skin or eyes. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis.
      This can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are using this medicine.
  - type: paragraph
    text: Check with your doctor if you have a fever, chills, or sore throat. These
      may be symptoms of an infection resulting from low white blood cells.
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, troubled breathing, unusual tiredness or weakness, vomiting,
      or weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: 'Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have the following symptoms:
      abdominal or stomach pain, confusion, difficulty with breathing, irregular heartbeat,
      nausea or vomiting, nervousness, numbness or tingling in the hands, feet, or
      lips, shortness of breath, or weakness or heaviness of the legs. Ask your doctor
      before you use any medicine, supplement, or salt substitute containing potassium
      .'
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine could affect surgery or medical procedures.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes prescription or nonprescription (over-the-counter [OTC])
      medicines for appetite control, asthma, colds, cough, hay fever, or sinus problems,
      and herbal or vitamin supplements, since they may increase your blood pressure.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - chills
      - cough (with mucus)
      - dark urine
      - fever
      - general feeling of discomfort or illness
      - lightheadedness or fainting
      - pain in the right side of the abdomen or stomach
      - slow heartbeat
      - sore throat
      - swelling of the face, mouth, hands, or feet
      - trouble in swallowing or breathing (sudden) accompanied by hoarseness
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - cough (dry, continuous)
      - diarrhea
      - dizziness
      - itching
      - joint pain or pain in the arms or legs
      - nausea
      - unusual tiredness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
