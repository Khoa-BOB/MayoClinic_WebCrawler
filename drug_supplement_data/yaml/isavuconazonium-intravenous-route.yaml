title: Isavuconazonium (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cresemba
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Isavuconazonium injection is used to treat serious fungal or yeast infections,
      including invasive aspergillosis and invasive mucormycosis. This medicine works
      by killing the fungus or yeast and preventing its growth.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of isavuconazonium injection in children younger than 1 year
        of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of isavuconazonium injection in the
        elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Apalutamide
      - Boceprevir
      - Carbamazepine
      - Ceritinib
      - Clarithromycin
      - Cobicistat
      - Colchicine
      - Enzalutamide
      - Flibanserin
      - Fosphenytoin
      - Idelalisib
      - Indinavir
      - Itraconazole
      - Ivosidenib
      - Ketoconazole
      - Levoketoconazole
      - Lomitapide
      - Lonafarnib
      - Lumacaftor
      - Mephobarbital
      - Mifepristone
      - Mitotane
      - Nefazodone
      - Nelfinavir
      - Nirmatrelvir
      - Paritaprevir
      - Phenobarbital
      - Phenytoin
      - Posaconazole
      - Primidone
      - Ranolazine
      - Ribociclib
      - Rifampin
      - Rifapentine
      - Ritonavir
      - Saquinavir
      - St John's Wort
      - Telaprevir
      - Telithromycin
      - Troleandomycin
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adagrasib
      - Amlodipine
      - Atogepant
      - Atorvastatin
      - Avacopan
      - Avapritinib
      - Bedaquiline
      - Brexpiprazole
      - Cariprazine
      - Conivaptan
      - Cyclosporine
      - Dabigatran Etexilate
      - Dabrafenib
      - Darunavir
      - Defactinib
      - Deutivacaftor
      - Digoxin
      - Dihydroergotamine
      - Dordaviprone
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Elexacaftor
      - Eliglustat
      - Enasidenib
      - Encorafenib
      - Ensartinib
      - Everolimus
      - Fedratinib
      - Finerenone
      - Fluconazole
      - Haloperidol
      - Ivacaftor
      - Lefamulin
      - Lenacapavir
      - Letermovir
      - Lopinavir
      - Lurbinectedin
      - Mavacamten
      - Mavorixafor
      - Meperidine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Bupropion
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart rhythm problem (eg, familial short QT syndrome)—Should not be used in
        patients with this condition.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. May make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. This medicine is given through a needle placed in one of your
      veins. The medicine must be injected slowly, so your IV tube will need to stay
      in place for at least 1 hour.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: This medicine can also be given through a nasogastric tube by a nurse or
      other trained health professional.
  - type: paragraph
    text: Your doctor may switch you between injection and oral medicine that works
      the same way. If you have any concerns about this, talk to your doctor.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your or your child's progress after
      treatment . This is to make sure that the infection is cleared up completely,
      and to allow your doctor to check for any unwanted effects. Blood tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: Do not use this medicine together with carbamazepine (Tegretol®), ketoconazole
      (Nizoral®), phenobarbital (Luminal®), rifampin (Rifadin®, Rimactane®), ritonavir
      (Norvir®), or St. John's wort. Using these medicines together may cause unwanted
      effects .
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant during treatment
      and for at least 28 days after the last dose of this medicine. If you think
      you have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction called infusion related
      reaction, which can be life-threatening and requires immediate medical attention.
      Tell your doctor right away if you start to have chills, dizziness, trouble
      breathing, chest tightness, numbness or tingling, change in sense of touch,
      or lightheadedness or faintness while you are receiving this medicine.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you have a rash, itching, trouble breathing, trouble
      swallowing, or any swelling of your hands, face, or mouth while you are using
      this medicine.
  - type: paragraph
    text: Serious skin reactions (eg, Stevens-Johnson syndrome) can occur with this
      medicine. Check with your doctor right away if you have blistering, peeling,
      or loose skin, chills, cough, diarrhea, itching, joint or muscle pain, red irritated
      eyes, red skin lesions often with a purple center, sore throat, sores, ulcers,
      or white spots in the mouth or on the lips, or unusual tiredness or weakness
      while you are using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - bloody urine
      - blurred vision
      - chest pain or tightness
      - confusion
      - decreased frequency or amount of urine
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fast or irregular heartbeat
      - loss of appetite
      - lower back or side pain
      - muscle pain or cramps
      - muscle spasms (tetany) or twitching
      - numbness or tingling in the hands, feet, or lips
      - seizures
      - severe nausea or vomiting
      - sweating
      - tingling of the hands or feet
      - trembling
      - trouble breathing
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chills
      - cough or hoarseness
      - dark urine
      - fever with or without chills
      - hives, itching, or rash
      - irritation
      - joint pain, stiffness, or swelling
      - light-colored stools
      - painful or difficult urination
      - red, swollen skin
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach pain
      - unusual bleeding or bruising
      - upper right abdominal or stomach pain
      - yellow eyes and skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - diarrhea
      - red skin lesions, often with a purple center
      - red, irritated eyes
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - anxiety
      - back pain
      - headache
      - heartburn or indigestion
      - seeing, hearing, or feeling things that are not there
      - trouble sleeping
      - unusual excitement, nervousness, or restlessness
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, numbness, tingling, or painful sensations
      - continuing ringing or buzzing or other unexplained noise in the ears
      - decreased vision
      - eye pain
      - feeling of constant movement of self or surroundings
      - hearing loss
      - loss or thinning of the hair
      - sensation of spinning
      - unsteadiness or awkwardness
      - weakness in arms, hands, legs, or feet
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
