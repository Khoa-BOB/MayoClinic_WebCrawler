title: Quinidine (oral route, injection route, intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cardioquin
    - type: paragraph
      text: Quinaglute
    - type: paragraph
      text: Quinalan
    - type: paragraph
      text: Quinidex Extentabs
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Quinidine is used to treat abnormal heart rhythms. It is also used to treat
      malaria.
  - type: paragraph
    text: Do not confuse this medicine with quinine, which, although related, has
      different medical uses.
  - type: paragraph
    text: Quinidine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Tablet, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Quinidine has not been widely studied in children; however, it is used
        in children to treat abnormal heart rhythms and to treat malaria. Children
        may be able to take higher doses than adults and may have fewer side effects
        (such as vomiting, loss of appetite, and diarrhea) than adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of quinidine
        in the elderly with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults. However, quinidine may remain in the bodies of older adults
        longer than it does in younger adults, which may increase the risk of side
        effects and which may require lower doses.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Atazanavir
      - Aurothioglucose
      - Bepridil
      - Cisapride
      - Colchicine
      - Dronedarone
      - Fingolimod
      - Fluconazole
      - Grepafloxacin
      - Itraconazole
      - Ketoconazole
      - Lefamulin
      - Levoketoconazole
      - Levomethadyl
      - Mesoridazine
      - Mifepristone
      - Nelfinavir
      - Nirmatrelvir
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Ritonavir
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Tipranavir
      - Vernakalant
      - Voriconazole
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Acetazolamide
      - Adagrasib
      - Afatinib
      - Ajmaline
      - Alefacept
