      - Amprenavir
      - Anagrelide
      - Apalutamide
      - Apomorphine
      - Aprindine
      - Arbutamine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Artemether
      - Asciminib
      - Asenapine
      - Astemizole
      - Atracurium
      - Avacopan
      - Azithromycin
      - Bedaquiline
      - Belzutifan
      - Benzphetamine
      - Berotralstat
      - Betrixaban
      - Boceprevir
      - Brexpiprazole
      - Buprenorphine
      - Buserelin
      - Carbamazepine
      - Ceritinib
      - Chloral Hydrate
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Abarelix
      - Amiloride
      - Atenolol
      - Cimetidine
      - Dalfopristin
      - Dextromethorphan
      - Dicumarol
      - Galantamine
      - Magaldrate
      - Magnesium Carbonate
      - Magnesium Hydroxide
      - Magnesium Oxide
      - Magnesium Trisilicate
      - Metoprolol
      - Nisoldipine
      - Propranolol
      - Quinupristin
      - Rifapentine
      - Tolterodine
      - Verapamil
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Electrolyte disorders—Quinidine may worsen heart rhythm problems
    - type: list
      ordered: false
      items:
      - Heart disease or
      - Myasthenia gravis—Quinidine may make these conditions worse
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Effects may be increased because of slower removal of quinidine
        from the body
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed. Do not take more of this medicine
      and do not take it more often than your doctor ordered. Do not miss any doses.
  - type: paragraph
    text: Taking quinidine with food may help lessen stomach upset.
  - type: paragraph
    text: 'For patients taking the extended-release tablet form of this medicine:'
  - type: list
    ordered: false
    items:
    - Quinidex Extentabs or Biquin Durules—Swallow the tablets whole; do not break,
      crush, or chew before swallowing. Note that Biquin Durules may sometimes appear
      as a whole tablet in the stool; this tablet is just the empty shell that is
      left after the medicine has been absorbed into the body.
    - Quinaglute Duratabs or Quin-Release—These tablets may be broken in half; however,
      they should not be crushed or chewed before swallowing.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For regular (short-acting) oral dosage form (tablets): For abnormal heart
        rhythm: Adults—200 to 650 milligrams (mg) three or four times a day. Children—30
        to 40 mg per kilogram (kg) (13.6 to 18.2 mg per pound) of body weight per
        day. Your doctor may increase the dose if needed.'
      - 'For long-acting oral dosage form (tablets): For abnormal heart rhythm: Adults—300
        to 660 mg every eight to twelve hours. Children—30 to 40 mg per kilogram (kg)
        (13.6 to 18.2 mg per pound) of body weight per day. Your doctor may increase
        the dose if needed.'
      - 'For injection dosage form: For abnormal heart rhythm: Adults—190 to 380 mg
        injected into the muscle every two to four hours. Or, up to 0.25 mg per kg
        (0.11 mg per pound) of body weight per minute in a solution injected into
        a vein. Children—Dose must be determined by your doctor. For malaria: Adults—10
        mg per kg (4.54 mg per pound) of body weight in a solution injected slowly
        into a vein over one to two hours. Then, 0.02 mg per kg (0.009 mg per pound)
        of body weight per minute is given. Or, 24 mg per kg (10.91 mg per pound)
        of body weight in a solution injected slowly into a vein over a four-hour
        period. Then, eight hours after the first dose, 12 mg per kg (5.45 mg per
        pound) of body weight, injected slowly into a vein over a four-hour period,
        and repeated every eight hours. Children—Dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For abnormal heart rhythm: Adults—200 to 650 milligrams (mg) three or four
        times a day. Children—30 to 40 mg per kilogram (kg) (13.6 to 18.2 mg per pound)
        of body weight per day. Your doctor may increase the dose if needed.'
    - type: list
      ordered: false
      items:
      - Adults—200 to 650 milligrams (mg) three or four times a day.
      - Children—30 to 40 mg per kilogram (kg) (13.6 to 18.2 mg per pound) of body
        weight per day. Your doctor may increase the dose if needed.
    - type: list
      ordered: false
      items:
      - 'For abnormal heart rhythm: Adults—300 to 660 mg every eight to twelve hours.
        Children—30 to 40 mg per kilogram (kg) (13.6 to 18.2 mg per pound) of body
        weight per day. Your doctor may increase the dose if needed.'
    - type: list
      ordered: false
      items:
      - Adults—300 to 660 mg every eight to twelve hours.
      - Children—30 to 40 mg per kilogram (kg) (13.6 to 18.2 mg per pound) of body
        weight per day. Your doctor may increase the dose if needed.
    - type: list
      ordered: false
      items:
      - 'For abnormal heart rhythm: Adults—190 to 380 mg injected into the muscle
        every two to four hours. Or, up to 0.25 mg per kg (0.11 mg per pound) of body
        weight per minute in a solution injected into a vein. Children—Dose must be
        determined by your doctor.'
      - 'For malaria: Adults—10 mg per kg (4.54 mg per pound) of body weight in a
        solution injected slowly into a vein over one to two hours. Then, 0.02 mg
        per kg (0.009 mg per pound) of body weight per minute is given. Or, 24 mg
        per kg (10.91 mg per pound) of body weight in a solution injected slowly into
        a vein over a four-hour period. Then, eight hours after the first dose, 12
        mg per kg (5.45 mg per pound) of body weight, injected slowly into a vein
        over a four-hour period, and repeated every eight hours. Children—Dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—190 to 380 mg injected into the muscle every two to four hours. Or,
        up to 0.25 mg per kg (0.11 mg per pound) of body weight per minute in a solution
        injected into a vein.
      - Children—Dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—10 mg per kg (4.54 mg per pound) of body weight in a solution injected
        slowly into a vein over one to two hours. Then, 0.02 mg per kg (0.009 mg per
