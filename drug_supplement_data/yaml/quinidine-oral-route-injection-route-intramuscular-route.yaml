        pound) of body weight, injected slowly into a vein over a four-hour period,
        and repeated every eight hours.
      - Children—Dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that the quinidine is working properly and does not cause unwanted
      effects.
  - type: paragraph
    text: Do not stop taking this medicine without first checking with your doctor,
      to avoid possible worsening of your condition.
  - type: paragraph
    text: Before having any kind of surgery (including dental surgery) or emergency
      treatment, tell the medical doctor or dentist in charge that you are taking
      this medicine.
  - type: paragraph
    text: Dizziness or lightheadedness may occur with this medicine, especially when
      you get up from a lying or sitting position. Getting up slowly may help.
  - type: paragraph
    text: Fainting may occur with this medicine. Do not drive or do anything else
      that could be dangerous if fainting occurs.
  - type: paragraph
    text: . Check with your doctor immediately if you faint or experience other side
      effects with this medicine.
  - type: paragraph
    text: Your doctor may want you to carry a medical identification card or bracelet
      stating that you are using this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal pain and/or yellow eyes or skin
      - blurred and/or double vision, confusion, delirium, disturbed color perception,
        headache, noises or ringing in the ear, and/or visual intolerance of light
      - dizziness or lightheadedness
      - fainting
      - fever
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain, fever, general discomfort, joint pain, joint swelling, muscle
        pain, and/or skin rash
      - nosebleeds or bleeding gums
      - unusual tiredness or weakness and/or pale skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - loss of appetite
      - muscle weakness
      - nausea or vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
