    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this diagnostic
        test. Make sure you tell your doctor if you have any other medical problems,
        especially:'
    - type: list
      ordered: false
      items:
      - Achlorhydria—The lack of acid in the stomach may interfere with the results
        of this test.
    - type: list
      ordered: false
      items:
      - Gastrectomy (removal of the stomach by surgery), partial or total—Use is not
        recommended in these patients.
    - type: list
      ordered: false
      items:
      - Phenylketonuria—This medicine contains phenylalanine, which can make this
        condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Exalenz BreathID® non-invasive breath test is a diagnostic test that analyzes
      a breath sample before and after taking 13C-enriched urea to help identify patients
      with H. pylori infection.
  - type: paragraph
    text: Your doctor will start the breath test by collecting your breath samples
      using the BreathID® Hp device. You will drink a mixed solution of 13C-urea tablet
      and citric acid powder. You must drink the solution within 2 hours after mixing
      it. Then, you have to breathe normally via the cannula while the test is being
      performed.
  - type: paragraph
    text: Do not eat for at least 1 hour before taking the mixed solution.
  - type: paragraph
    text: If the mixed solution has large particles after mixing it for 5 minutes,
      do not use it and open a new kit.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If you are taking antibiotics, proton pump inhibitors (eg, omeprazole, lansoprazole),
      or medicines containing bismuth, these may interact with the test. Your doctor
      will ask you to stop taking them for at least 2 weeks before the test.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fast heartbeat
      - fever
      - hives, itching, or rash
      - hoarseness
      - irritation
      - joint pain, stiffness, or swelling
      - redness of the skin
      - swelling of the eyelids, face, lips, hands, or feet
      - tightness in the chest
      - troubled breathing or swallowing
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
