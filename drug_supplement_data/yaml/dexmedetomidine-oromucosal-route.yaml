title: Dexmedetomidine (oromucosal route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Dexmedetomidine is used to treat agitation caused by schizophrenia or bipolar
      I or II disorder (manic-depressive illness).
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of dexmedetomidine in the pediatric population. Safety and
        efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of dexmedetomidine in the elderly.
        However, elderly patients are more likely to have serious unwanted effects
        (eg, low blood pressure, slow heartbeat), which may require caution and an
        adjustment in the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Isocarboxazid
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acepromazine
      - Alfentanil
      - Alfuzosin
      - Alprazolam
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amobarbital
      - Anagrelide
      - Anileridine
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Azithromycin
      - Baclofen
      - Bedaquiline
      - Benperidol
      - Benzhydrocodone
      - Bromazepam
      - Bromopride
      - Buprenorphine
      - Buserelin
      - Buspirone
      - Butabarbital
      - Butalbital
      - Butorphanol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Carisoprodol
      - Carphenazine
      - Ceritinib
      - Cetirizine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart disease (eg, heart block, ventricular dysfunction), severe or
      - Heart rhythm problems (eg, slow heartbeat, QT prolongation, torsades de pointes)
        or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood) or
      - Hypotension (low blood pressure) or
      - Syncope (fainting), history of—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hypertension (high blood pressure) or
      - Hypovolemia (low blood volume)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. This medicine is a film that is given under the tongue
      (sublingual) or behind the lower lip (buccal) .
  - type: paragraph
    text: 'To use the buccal film :'
  - type: list
    ordered: false
    items:
    - Place the film behind lower lip until it is dissolved.
    - Do not eat or drink anything for at least 1 hour after taking the medicine.
    - Do not chew or swallow it.
  - type: paragraph
    text: 'To use the sublingual film :'
  - type: list
    ordered: false
    items:
    - Place the film under the tongue until it is dissolved.
    - Do not eat or drink anything for at least 15 minutes after taking the medicine.
    - Do not chew or swallow it.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Check with your doctor right away if you have chest pain or discomfort,
      lightheadedness, dizziness or fainting, slow or irregular heartbeat, trouble
      breathing, or unusual tiredness.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you had a heart rhythm problem, such
      as QT prolongation.
  - type: paragraph
    text: This medicine may make you dizzy or drowsy. Do not drive or do anything
      else that could be dangerous until you know how this medicine affects you .
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up suddenly from a lying or sitting position. Getting up slowly may help. If
      this problem continues or gets worse, check with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chills
      - cold sweats
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - sweating
      - unusual sleepiness or drowsiness
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or discomfort
      - slow or irregular heartbeat
      - trouble breathing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - anxiety
      - bleeding gums
      - chest tightness
      - coma
      - confusion as to time, place, or person
      - cool, pale skin
      - coughing up blood
      - decrease in amount of urine
      - depression
      - difficulty in speaking
      - drowsiness
      - fast, pounding, or irregular heartbeat or pulse
      - frequent urination
      - headache
      - holding false beliefs that cannot be changed by fact
      - increased hunger
      - increased menstrual flow or vaginal bleeding
      - irritability
      - muscle twitching
      - nausea
      - nerve pain
      - nervousness
      - nightmares
      - no blood pressure or pulse
      - noisy breathing
      - nosebleeds
      - numbness or tingling in hands, feet, or lips
      - pain or discomfort in the arms, jaw, back, or neck
      - pale skin
      - palpitations
      - paralysis
      - prolonged bleeding from cuts
      - red or black, tarry stools
      - red or dark brown urine
      - restlessness
      - seeing, hearing, or feeling things that are not there
      - seizures
      - shakiness
      - slow to respond
      - slurred speech
      - stomach pain
      - stopping of the heart
      - swelling of the feet or lower legs
      - unconsciousness
      - unusual bleeding or bruising
      - vomiting
      - weakness or heaviness of the legs
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry mouth
      - stomach discomfort
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - fever
      - increased sweating
      - seeing flashes or sparks of light
      - thirst
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
