title: Omeprazole and sodium bicarbonate (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Konvomep
    - type: paragraph
      text: Zegerid
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Omeprazole and sodium bicarbonate combination is used to treat certain conditions
      where there is too much acid in the stomach. It is used to treat gastric and
      duodenal ulcers, erosive esophagitis, and gastroesophageal reflux disease (GERD).
      GERD is a condition where the acid in the stomach washes back up into the esophagus.
      Sometimes this medicine is used in combination with antibiotics (eg, amoxicillin,
      clarithromycin) to treat ulcers associated with infection caused by the H. pylori
      bacteria (germ).
  - type: paragraph
    text: Omeprazole and sodium bicarbonate combination is used to prevent upper gastrointestinal
      tract bleeding in seriously ill patients.
  - type: paragraph
    text: Omeprazole is a proton pump inhibitor (PPI). It works by decreasing the
      amount of acid produced by the stomach.
  - type: paragraph
    text: Sodium bicarbonate, also known as baking soda, is an antacid. It works by
      neutralizing the excess acid in the stomach.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
    - Packet
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of omeprazole and sodium bicarbonate combination in children.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of omeprazole and sodium bicarbonate
        combination in the elderly. However, elderly patients are more sensitive to
        the effects of this medicine than younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Rilpivirine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Acalabrutinib
      - Amphetamine
      - Apalutamide
      - Atazanavir
      - Atezolizumab
      - Avacopan
      - Belumosudil
      - Belzutifan
      - Benzphetamine
      - Bosutinib
      - Cabotegravir
      - Cannabidiol
      - Capecitabine
      - Carbamazepine
      - Cefuroxime Axetil
      - Cilostazol
      - Citalopram
      - Clarithromycin
      - Clopidogrel
      - Clorazepate
      - Conivaptan
      - Dabrafenib
      - Dacomitinib
      - Darunavir
      - Dasabuvir
      - Dasatinib
      - Defactinib
      - Delavirdine
      - Dextroamphetamine
      - Diazepam
      - Digoxin
      - Elagolix
      - Erdafitinib
      - Erlotinib
      - Escitalopram
      - Eslicarbazepine Acetate
      - Fedratinib
      - Fexinidazole
      - Fluconazole
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Armodafinil
      - Chloroquine
      - Cyanocobalamin
      - Disulfiram
      - Ginkgo Biloba
      - Iron
      - Itraconazole
      - Levothyroxine
      - Raltegravir
      - Tipranavir
      - Triazolam
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Cranberry
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bartter's syndrome (rare kidney problem) or
      - Diarrhea or
      - Hypocalcemia (low calcium in the blood) or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood), history of or
      - Osteoporosis (bone problem) or
      - Respiratory alkalosis (low levels of carbon dioxide in the blood) or
      - Seizures, history of or
      - Systemic lupus erythematosus (SLE)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Liver disease—You may need a dose adjustment. The effects may be increased
        because of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. Do not stop taking this medicine if your doctor told you to
      take it for a specific amount of time, even if you feel better.
  - type: paragraph
    text: This medicine comes with a Medication Guide or a patient information insert.
      Read and follow the instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: This medicine contains sodium (salt). Talk to your doctor before using this
      medicine if you are on a low-sodium (low-salt) diet or if you have or are at
      risk for congestive heart failure.
  - type: paragraph
    text: Tell your doctor if you are taking calcium supplements on a regular basis.
  - type: paragraph
    text: Both 20 and 40 milligrams oral suspension packets or capsules contain the
      same amount of sodium bicarbonate. Do not substitute two 20 milligrams (mg)
      oral suspension packets or capsules with one 40 mg oral suspension packets or
      capsules . Talk to your doctor if you have any questions.
  - type: paragraph
    text: Take this medicine on an empty stomach at least 1 hour before a meal. For
      patients receiving continuous feeding through a tube, feeding should be temporarily
      stopped about 3 hours before and 1 hour after administration of Konvomep™ oral
      suspension or Zegerid® powder for oral suspension .
  - type: paragraph
    text: Swallow the capsules whole with water. Do not take it with other liquids.
      Do not break, crush, or chew it. Do not open the capsule and sprinkle the contents
      into food.
  - type: paragraph
    text: 'To use the Konvomep™ oral suspension : Shake the bottle before each use.
      Measure the oral liquid medicine with a marked measuring spoon, oral syringe,
      or medicine cup.'
  - type: paragraph
    text: 'If you are using the Konvomep™ oral suspension with a nasogastric or orogastric
      tube:'
  - type: list
    ordered: false
    items:
    - Shake well and draw up 20 mL of the medicine into a catheter-tipped or oral
      syringe.
    - Give the medicine through the nasogastric or orogastric tube into the stomach
      right away.
    - Refill the syringe with 20 mL of water.
    - Flush any remaining contents from the nasogastric or orogastric tube into the
      stomach.
  - type: paragraph
    text: 'To use the Zegerid® powder for oral suspension :'
  - type: list
    ordered: false
    items:
    - Empty packet of powder into a small cup containing 1 to 2 tablespoons of water.
    - Do not use other liquids or foods.
    - Stir well and drink immediately.
    - Refill cup with water and drink.
  - type: paragraph
    text: 'If you are using the Zegerid® powder for oral suspension with a nasogastric
      or orogastric tube:'
  - type: list
    ordered: false
    items:
    - Mix the packet of powder with approximately 20 mL of water.
    - Stir well and draw up into appropriately sized syringe.
    - Give the medicine through the nasogastric or orogastric tube into the stomach
      right away.
    - Refill the syringe with an equal amount of water.
    - Shake and flush any remaining contents from the nasogastric or orogastric tube
      into the stomach.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules or powder for suspension): To treat duodenal
        ulcers, erosive esophagitis, and GERD: Adults—20 milligrams (mg) once a day
        at least 1 hour before a meal. Your doctor may adjust your dose if needed.
        Children—Use and dose must be determined by your doctor. To treat gastric
        ulcers: Adults—40 milligrams (mg) once a day at least 1 hour before a meal.
        Your doctor may adjust your dose if needed. Children—Use and dose must be
        determined by your doctor.'
      - 'For oral dosage form (powder for suspension): To prevent upper gastrointestinal
        tract bleeding in seriously ill patients: Adults—The first day: 40 milligrams
        (mg) for the first dose, then after 6 to 8 hours, a second 40 mg dose. After
        the first day: 40 mg once a day for up to 14 days. Children—Use and dose must
        be determined by your doctor. To treat gastric ulcers: Adults—40 milligrams
        (mg) once a day for 4 to 8 weeks. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'To treat duodenal ulcers, erosive esophagitis, and GERD: Adults—20 milligrams
        (mg) once a day at least 1 hour before a meal. Your doctor may adjust your
        dose if needed. Children—Use and dose must be determined by your doctor.'
      - 'To treat gastric ulcers: Adults—40 milligrams (mg) once a day at least 1
        hour before a meal. Your doctor may adjust your dose if needed. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—20 milligrams (mg) once a day at least 1 hour before a meal. Your doctor
        may adjust your dose if needed.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—40 milligrams (mg) once a day at least 1 hour before a meal. Your doctor
        may adjust your dose if needed.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'To prevent upper gastrointestinal tract bleeding in seriously ill patients:
        Adults—The first day: 40 milligrams (mg) for the first dose, then after 6
        to 8 hours, a second 40 mg dose. After the first day: 40 mg once a day for
        up to 14 days. Children—Use and dose must be determined by your doctor.'
      - 'To treat gastric ulcers: Adults—40 milligrams (mg) once a day for 4 to 8
        weeks. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults—The first day: 40 milligrams (mg) for the first dose, then after 6
        to 8 hours, a second 40 mg dose. After the first day: 40 mg once a day for
        up to 14 days.'
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—40 milligrams (mg) once a day for 4 to 8 weeks.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the Konvomep™ oral suspension in the refrigerator for up to 30 days.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits .
      This will allow your doctor to see if the medicine is working properly and to
      decide if you should continue to take it. Blood, urine, and other laboratory
      tests may be needed to check for unwanted effects. If your condition does not
      improve, or if it becomes worse, check with your doctor.
  - type: paragraph
    text: Do not use this medicine if you are also taking rilpivirine (Edurant®) or
      products containing rilpivirine (eg, Complera®). Using these medicines together
      may cause serious side effects .
  - type: paragraph
    text: Tell your doctor if you have Asian relatives, such as Filipino, Chinese,
      Japanese, Korean, or Taiwanese. You may need a lower dose of this medicine to
      treat erosive esophagitis.
  - type: paragraph
    text: This medicine is sometimes given together with other medicines to treat
      ulcers. Be sure you understand about the risks and proper use of any other medicine
      your doctor gives you together with omeprazole and sodium bicarbonate combination.
  - type: paragraph
    text: Check with your doctor right away if you have a change in frequency of urination
      or amount of urine, blood in the urine, fever, joint pain, loss of appetite,
      skin rash, swelling of the body, feet, or ankles, unusual tiredness or weakness,
      or unusual weight gain after receiving this medicine. These could be symptoms
      of acute tubulointerstitial nephritis.
  - type: paragraph
    text: Taking this medicine for a long time may make it harder for your body to
      absorb vitamin B12. Tell your doctor if you have concerns about vitamin B12
      deficiency.
  - type: paragraph
    text: Serious stomach conditions may occur while taking this medicine alone or
      together with antibiotics. Check with your doctor immediately if you have stomach
      cramps, bloated feeling, watery and severe diarrhea which may also be bloody
      sometimes, fever, nausea, vomiting, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may increase your risk of having fractures of the hip, wrist,
      and spine. This is more likely are 50 years of age and older, if you receive
      high doses of this medicine or use it for one year or more.
  - type: paragraph
    text: Cutaneous or systemic lupus erythematosus may occur or get worse in patients
      receiving a PPI. Call your doctor right away if you have joint pain or a skin
      rash on your cheeks or arms that gets worse when exposed to the sun.
  - type: paragraph
    text: This medicine may cause hypomagnesemia (low magnesium in the blood). This
      is more likely to occur if you are taking this medicine for more than one year,
      or if you are taking this medicine together with digoxin (Lanoxin®) or certain
      diuretics or "water pills". Check with your doctor right away if you have convulsions
      (seizures), fast, racing, or uneven heartbeat, muscle spasms (tetany), tremors,
      or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause serious skin reactions, including Stevens-Johnson
      syndrome, toxic epidermal necrolysis, acute generalized exanthematous pustulosis,
      and drug reaction with eosinophilia and systemic symptoms (DRESS). Check with
      your doctor right away if you have black, tarry stools, blistering, peeling,
      or loosening of the skin, chest pain, chills, cough, diarrhea, itching, joint
      or muscle pain, painful or difficult urination, red irritated eyes, red skin
      lesions, often with a purple center, sore throat, sores, ulcers, or white spots
      in the mouth or on the lips, swollen glands, unusual bleeding or bruising, or
      unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may increase your risk for fundic gland polyps (abnormal tissue
      growth in the upper part of your stomach). This is more likely if you are receiving
      this medicine for more than 1 year. Talk to your doctor if you have concerns.
  - type: paragraph
    text: Do not stop taking this medicine without first checking with your doctor,
      or unless told to do so by your doctor.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      you have medical tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription (eg, atazanavir, nelfinavir, Reyataz��, Viracept®)
      or nonprescription (over-the-counter [OTC]) medicines and herbal (eg, St John's
      wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
