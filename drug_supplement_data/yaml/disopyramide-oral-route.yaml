title: Disopyramide (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Norpace
    - type: paragraph
      text: Norpace CR
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Disopyramide is used to treat a life-threatening heart rhythm problem called
      ventricular arrhythmia, including sustained ventricular tachycardia.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
    - Capsule, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of disopyramide in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of disopyramide in the elderly. However,
        elderly patients are more likely to have age-related liver, kidney, or heart
        problems, which may require caution and an adjustment in the dose for patients
        receiving disopyramide.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Fingolimod
      - Itraconazole
      - Levoketoconazole
      - Levomethadyl
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Vernakalant
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adagrasib
      - Ajmaline
      - Alfuzosin
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amoxapine
      - Anagrelide
      - Apomorphine
      - Aprindine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Azithromycin
      - Bedaquiline
      - Betaxolol
      - Buprenorphine
      - Buserelin
      - Ceritinib
      - Chloral Hydrate
      - Chloroquine
      - Chlorpromazine
      - Chlorpropamide
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
      - Cobicistat
      - Crizotinib
      - Cyclobenzaprine
      - Dabrafenib
      - Darunavir
      - Dasabuvir
      - Dasatinib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atenolol
      - Dalfopristin
      - Digoxin
      - Quinupristin
      - Rifapentine
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Cardiogenic shock (shock caused by heart attack) or
      - Enlarged prostate or
      - Glaucoma, history of or
      - Heart block, without a pacemaker or
      - Heart failure or
      - Heart rhythm problem (eg, asymptomatic ventricular premature contractions,
        long QT syndrome) or
      - Hyperkalemia (high potassium in the blood) or
      - Hypotension (low blood pressure) or
      - Kidney disease, severe or
      - Myasthenia gravis (severe muscle weakness) or
      - Urinary retention (problems with passing urine)—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Heart failure, history of
      - Heart rhythm problem (eg, QT prolongation) or
      - Malnutrition—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Sick sinus syndrome (type of abnormal heart rhythm) or
      - Wolff-Parkinson-White syndrome (rare heart condition)—Use with caution. May
        cause very slow heartbeat in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. When your supply of this medicine is running low, contact your
      doctor or pharmacist ahead of time. Do not allow yourself to run out of this
      medicine.
  - type: paragraph
    text: Swallow the extended-release capsule whole. Do not crush, break, or chew
      it.
  - type: paragraph
    text: If you are taking verapamil, take it 48 hours after or 24 hours before taking
      this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For heart rhythm problems: For oral dosage form (capsules): Adults—400 to
        800 milligrams (mg) per day given in divided doses. Dose is usually 600 mg
        per day given in divided doses (150 mg every 6 hours). Your doctor may adjust
        your dose as needed. Adults weighing less than 50 kilograms (kg)—Dose is usually
        400 mg per day given in divided doses (100 mg every 6 hours). Your doctor
        may adjust your dose as needed. Children—Use and dose must be determined by
        your doctor. For oral dosage forms (extended-release capsules): Adults—400
        to 800 milligrams (mg) per day given in divided doses. Dose is usually 600
        milligrams (mg) per day given in divided doses (300 mg every 12 hours). Your
        doctor may adjust your dose as needed. Adults weighing less than 50 kilograms
        (kg)—Dose is usually 400 mg per day given in divided doses (200 mg every 12
        hours). Your doctor may adjust your dose as needed. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): Adults—400 to 800 milligrams (mg) per day
        given in divided doses. Dose is usually 600 mg per day given in divided doses
        (150 mg every 6 hours). Your doctor may adjust your dose as needed. Adults
        weighing less than 50 kilograms (kg)—Dose is usually 400 mg per day given
        in divided doses (100 mg every 6 hours). Your doctor may adjust your dose
        as needed. Children—Use and dose must be determined by your doctor.'
      - 'For oral dosage forms (extended-release capsules): Adults—400 to 800 milligrams
        (mg) per day given in divided doses. Dose is usually 600 milligrams (mg) per
        day given in divided doses (300 mg every 12 hours). Your doctor may adjust
        your dose as needed. Adults weighing less than 50 kilograms (kg)—Dose is usually
        400 mg per day given in divided doses (200 mg every 12 hours). Your doctor
        may adjust your dose as needed. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—400 to 800 milligrams (mg) per day given in divided doses. Dose is
        usually 600 mg per day given in divided doses (150 mg every 6 hours). Your
        doctor may adjust your dose as needed.
      - Adults weighing less than 50 kilograms (kg)—Dose is usually 400 mg per day
        given in divided doses (100 mg every 6 hours). Your doctor may adjust your
        dose as needed.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—400 to 800 milligrams (mg) per day given in divided doses. Dose is
        usually 600 milligrams (mg) per day given in divided doses (300 mg every 12
        hours). Your doctor may adjust your dose as needed.
      - Adults weighing less than 50 kilograms (kg)—Dose is usually 400 mg per day
