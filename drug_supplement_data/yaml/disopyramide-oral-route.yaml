        dose as needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Disopyramide may worsen the symptoms of heart failure in some patients.
      Check with your doctor right away if you are having chest pain or discomfort,
      dilated neck veins, extreme fatigue, irregular breathing or heartbeat, swelling
      of the face, fingers, feet, or lower legs, trouble breathing, or weight gain.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you or anyone in your family has ever
      had a heart rhythm problem such as QT prolongation.
  - type: paragraph
    text: Do not suddenly stop taking this medicine without first checking with your
      doctor . Your doctor may want you to gradually reduce the amount you are taking
      before stopping it completely. Some conditions may become worse when the medicine
      is stopped suddenly, which can be dangerous.
  - type: paragraph
    text: This medicine may cause changes in your blood sugar levels. Also, this medicine
      may cover up signs of low blood sugar, such as a rapid pulse rate. Check with
      your doctor if you have these problems or if you notice a change in the results
      of your blood or urine sugar tests.
  - type: paragraph
    text: Dizziness, lightheadedness, or even fainting may occur when you get up suddenly
      from a lying or sitting position. Getting up slowly may help lessen this problem.
      Also, lying down for a while may relieve the dizziness or lightheadedness.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficult urination
      - fainting
      - fast, slow, or irregular heartbeat
      - unusual tiredness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain
      - confusion
      - decrease in frequency of urination
      - decrease in urine volume
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - itching, skin rash
      - lightheadedness
      - nervousness
      - painful urination
      - rapid weight gain
      - sweating
      - swelling of the face, fingers, feet, or lower legs
      - trouble breathing
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - chills
      - clay-colored stools
      - cold sweats
      - confusion
      - cool, pale skin
      - dark urine
      - diarrhea
      - discouragement
      - drowsiness
      - enlargement of breasts in men
      - fast heartbeat
      - feeling sad or empty
      - fever
      - headache
      - increased hunger
      - irritability
      - loss of appetite
      - loss of interest or pleasure
      - nausea
      - nosebleeds or bleeding gums
      - shakiness
      - sore throat
      - stomach pain
      - trouble concentrating
      - trouble sleeping
      - unpleasant breath odor
      - unsteady walk
      - vomiting of blood
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness or discomfort
      - irregular breathing
      - pain or discomfort in the arms, jaw, back or neck
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish lips or skin
      - chest pain or discomfort
      - dizziness
      - fainting
      - fast, slow, or irregular heartbeat
      - lightheadedness
      - loss of consciousness
      - not breathing
      - pounding or rapid pulse
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - dry eyes, mouth, nose, or throat
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or stomach pain
      - decreased interest in sexual intercourse
      - inability to have or keep an erection
      - loss in sexual ability, desire, drive, or performance
      - muscle weakness
      - nervousness
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
