title: Dapsone (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Aczone
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Dapsone topical is used to treat acne. It works by killing the bacteria
      that cause acne and by keeping the skin pores clean.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Gel/Jelly
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of dapsone topical in children 9
        years of age and older. However, dapsone topical is not recommended for children
        younger than 9 years of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of dapsone topical have not been performed in the geriatric population, geriatric-specific
        problems are not expected to limit the usefulness of dapsone topical in the
        elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Glucose-6-phosphate dehydrogenase (G6PD) deficiency or
      - Methemoglobinemia, congenital or idiopathic—May increase risk for serious
        side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine exactly as directed by your doctor . Do not use more of
      it, do not use it more often, and do not use it for a longer time than your
      doctor ordered. To do so may increase the chance for unwanted effects.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: This medicine is for use only on the skin . Do not put it in your eyes,
      nose, mouth, or vagina. Rinse it off right away if it does get on these areas.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (gel): For acne: Adults and children 9 years of age
        and older—Apply a thin layer on the acne area once a day (7.5% gel). Children
        younger than 9 years of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For acne: Adults and children 9 years of age and older—Apply a thin layer
        on the acne area once a day (7.5% gel). Children younger than 9 years of age—Use
        is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children 9 years of age and older—Apply a thin layer on the acne
        area once a day (7.5% gel).
      - Children younger than 9 years of age—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits .
      This will allow your doctor to see if the medicine is working properly and to
      decide if you should continue to use it.
  - type: paragraph
    text: If your condition does not improve within 12 weeks, or if it become worse,
      check with your doctor.
  - type: paragraph
    text: Check with your doctor right away if you have bluish-colored lips, fingernails,
      or palms, dark urine, trouble breathing, dizziness or lightheadedness, a headache,
      pale skin, unusual bleeding or bruising, or unusual tiredness or weakness. These
      may be symptoms of a serious blood disorder.
  - type: paragraph
    text: Hemolytic anemia may occur while using this medicine. Tell your doctor right
      away if you have back, leg, or stomach pain, bleeding gums, chills, dark urine,
      nosebleeds, nausea or vomiting, or yellow eyes or skin.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish-colored lips, fingernails, or palms
      - dark urine
      - difficult breathing
      - dizziness or lightheadedness
      - fever
      - headache
      - pale skin
      - rapid heart rate
      - sore throat
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dryness, redness, oiliness, or peeling at the application site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
