title: Selexipag (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Uptravi
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Selexipag injection is used to treat pulmonary arterial hypertension (PAH),
      which is the high blood pressure that occurs in the main artery that carries
      blood from the right side of the heart (the ventricle) to the lungs. When the
      smaller blood vessels in the lungs become more resistant to blood flow, the
      right ventricle must work harder to pump enough blood through the lungs. It
      works by relaxing these blood vessels and increasing the supply of blood to
      the lungs, which reduces the workload of the heart. This medicine helps slow
      down the worsening of your disease and lowers your risk of being hospitalized
      for PAH.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of selexipag injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of selexipag injection in the elderly.
        However, elderly patients are more sensitive to the effects of this medicine
        than younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Abrocitinib
      - Gemfibrozil
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aceclofenac
      - Acemetacin
      - Acenocoumarol
      - Amtolmetin Guacil
      - Apalutamide
      - Apixaban
      - Argatroban
      - Bivalirudin
      - Bromfenac
      - Bufexamac
      - Cannabidiol
      - Caplacizumab-yhdp
      - Carbamazepine
      - Ceftobiprole Medocaril
      - Celecoxib
      - Choline Salicylate
      - Citalopram
      - Clonixin
      - Clopidogrel
      - Dabigatran Etexilate
      - Danaparoid
      - Darolutamide
      - Deferasirox
      - Desirudin
      - Desvenlafaxine
      - Dexibuprofen
      - Dexketoprofen
      - Diclofenac
      - Diflunisal
      - Dipyrone
      - Droxicam
      - Duloxetine
      - Edoxaban
      - Elexacaftor
      - Eltrombopag
      - Escitalopram
      - Etodolac
      - Etofenamate
      - Etoricoxib
      - Felbinac
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Liver disease, moderate—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use is not recommended in patients with this condition.
    - type: list
      ordered: false
      items:
      - Pulmonary venoocclusive disease (narrowing of the veins in the lungs)—Use
        with caution. May make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. It is given through a needle placed into one of your veins. The
      medicine must be injected slowly, so your IV tube will need to stay in place
      for 80 minutes. Your dose is based on your current dose of selexipag tablets.
      It is usually given 2 times a day.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress while you are
      receiving this medicine to make sure this medicine is working properly. Blood
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: You should not receive this medicine together with gemfibrozil (Lopid®).
      Using these medicines together may increase your chance for more serious side
      effects .
  - type: paragraph
    text: Check with your doctor right away if you have blue lips and fingernails,
      chest pain, coughing that sometimes produces a pink frothy sputum, difficult,
      fast, or noisy breathing, increased sweating, pale skin, or swelling in the
      legs and ankles. These may be symptoms of pulmonary edema (fluid in the lungs).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blue lips and fingernails
      - blurred vision
      - chest pain
      - confusion
      - coughing that sometimes produces a pink frothy sputum
      - difficult, fast, noisy breathing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - increased sweating
      - pale skin
      - swelling in the legs and ankles
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry, red, hot, or irritated skin
      - pain, redness, or swelling at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
