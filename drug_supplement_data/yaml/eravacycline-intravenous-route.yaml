title: Eravacycline (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Xerava
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Eravacycline injection is used to treat complicated intra-abdominal (within
      the stomach area) infections (cIAI) caused by bacteria.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of eravacycline injection in the pediatric population. Use
        is not recommended in children younger than 8 years of age. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of eravacycline injection in the
        elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Acitretin
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Amoxicillin
      - Ampicillin
      - Apalutamide
      - Avacopan
      - Bacampicillin
      - Bexarotene
      - Carbamazepine
      - Clarithromycin
      - Cloxacillin
      - Conivaptan
      - Dicloxacillin
      - Enzalutamide
      - Ethinyl Estradiol
      - Etretinate
      - Fedratinib
      - Fexinidazole
      - Fosphenytoin
      - Isotretinoin
      - Itraconazole
      - Letermovir
      - Levonorgestrel
      - Lumacaftor
      - Magnesium Sulfate
      - Methicillin
      - Methotrexate
      - Mifepristone
      - Mitotane
      - Nafcillin
      - Omaveloxolone
      - Oxacillin
      - Palovarotene
      - Penicillin G
      - Penicillin G Benzathine
      - Penicillin G Procaine
      - Penicillin V
      - Phenobarbital
      - Phenytoin
      - Piperacillin
      - Pivampicillin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease, severe—Use with caution. The effects may be increased because
        of the slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given through a needle placed into one of your veins. It must
      be given slowly, so the needle will have to stay in place for about 60 minutes.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress closely while
      you are receiving this medicine to make sure it is working properly. Blood tests
      may be needed to check for unwanted effects.
  - type: paragraph
    text: Tell your doctor if you are pregnant or planning to get pregnant. You should
      not receive this medicine during the second or third part of a pregnancy.
  - type: paragraph
    text: This medicine may cause permanent discoloration of the teeth and slow down
      the growth of bones in children younger than 8 years of age. Talk with your
      doctor if you have concerns.
  - type: paragraph
    text: Eravacycline may cause diarrhea, and in some cases it can be severe. It
      may occur 2 months or more after you stop receiving this medicine. Do not take
      any medicine to treat diarrhea without first checking with your doctor. Diarrhea
      medicines may make the diarrhea worse or make it last longer. If you have any
      questions about this or if mild diarrhea continues or gets worse, check with
      your doctor.
  - type: paragraph
    text: Avoid overexposing your skin to sunlight. Always use sunscreen or sun blocking
      lotions and wear protective clothing and hats while you are receiving this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding wound
      - blurred vision
      - confusion
      - diarrhea
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - red, tender, or oozing skin at the incision site
      - sweating
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry, stools
      - bloating
      - chest pain
      - chills
      - constipation
      - cough
      - dark urine
      - difficult or labored breathing
      - fast, irregular, pounding, or racing heartbeat or pulse
      - fever
      - hives, itching, skin rash
      - hoarseness
      - indigestion
      - irritation
      - joint pain, stiffness or swelling
      - loss of appetite
      - lower back or side pain
      - mood or mental changes
      - muscle cramps in the hands, arms, feet, legs, or face
      - nausea
      - numbness and tingling around the mouth, fingertips, or feet
      - painful or difficult urination
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - pale skin
      - redness of the skin
      - seizures
      - sore throat
      - stomach cramps
      - swelling of the eyelids, face, lips, hands, or feet
      - tightness in the chest
      - tremor
      - troubled breathing or swallowing
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - vomiting
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry, red, hot, or irritated skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - change in taste
      - discouragement
      - feeling sad or empty
      - loss of interest or pleasure
      - loss of taste
      - trouble concentrating
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
