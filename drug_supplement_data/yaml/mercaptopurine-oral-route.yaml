title: Mercaptopurine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Purinethol
    - type: paragraph
      text: Purixan
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Mercaptopurine is used in combination with other medicines as maintenance
      treatment of acute lymphoblastic leukemia. It belongs to the group of medicines
      known as antimetabolites.
  - type: paragraph
    text: Mercaptopurine interferes with the growth of cancer cells, which are eventually
      destroyed. Since the growth of normal cells may also be affected by this medicine,
      other unwanted effects will also occur. Some of these may be serious and must
      be reported to your doctor.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of mercaptopurine in the pediatric population. Safety and efficacy
        have not been established. The oral liquid may cause hypoglycemia (low blood
        sugar) in children younger than 6 years of age or with a low body mass index.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of mercaptopurine in the elderly.
        However, elderly patients are more likely to have age-related liver, kidney,
        or heart problems, which may require caution and an adjustment in the dose
        for patients receiving mercaptopurine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Febuxostat
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abacavir
      - Acarbose
      - Acetazolamide
      - Adalimumab
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Alacepril
      - Albendazole
      - Alfalfa
      - Allopurinol
      - Alprazolam
      - Ambrisentan
      - Amiodarone
      - Anidulafungin
      - Atomoxetine
      - Atovaquone
      - Azacitidine
      - Azathioprine
      - Azithromycin
      - Balsalazide
      - Benazepril
      - Bexarotene
      - Bicalutamide
      - Black Cohosh
      - Bortezomib
      - Bosentan
      - Busulfan
      - Captopril
      - Carbamazepine
      - Caspofungin
      - Cefadroxil
      - Cefdinir
      - Chenodiol
      - Chlorzoxazone
      - Cholera Vaccine
      - Cilazapril
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofarabine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acenocoumarol
      - Phenprocoumon
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Blood or bone marrow problems or
      - Bowel problems (eg, nausea, vomiting, diarrhea) or
      - Gout or
      - Leukopenia (low white blood cells) or
      - Liver disease or
      - Thrombocytopenia (low platelets in the blood)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Autoimmune disease (eg, inflammatory bowel disease) or
      - Virus infection (eg, Epstein-Barr, cytomegalovirus)—Use with caution. May
        cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Infection—May decrease your body's ability to fight infection.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before using this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Use this medicine exactly as directed by your doctor . Do not use more of
      it, do not use it more often, and do not use it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Mercaptopurine is given together with certain other medicines. If you are
      using a combination of medicines, it is important that you take each medicine
      at the right time . Follow your doctor's instructions on when to take these
      medicines.
  - type: paragraph
    text: Shake the oral liquid for at least 30 seconds to make sure that it is well
      mixed. Measure the dose with a marked measuring oral syringe and adaptor. Wash
      the dosing syringe with warm soapy water, rinse, and dry well after each use.
  - type: paragraph
    text: While you are using mercaptopurine, your doctor may want you to drink extra
      fluids so that you will pass more urine. This will help prevent kidney problems
      and keep your kidneys working well.
  - type: paragraph
    text: Tell your doctor if you are using this medicine together with allopurinol.
      Your doctor may decrease your dose of the oral liquid .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (suspension or tablets): For maintenance treatment
        of acute lymphatic leukemia: Adults—Dose is based on body weight and must
        be determined by your doctor. At first, 1.5 to 2.5 milligrams (mg) per kilogram
        (kg) of body weight per day, taken as a single dose. Your doctor may adjust
        your dose as needed and tolerated. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For maintenance treatment of acute lymphatic leukemia: Adults—Dose is based
        on body weight and must be determined by your doctor. At first, 1.5 to 2.5
        milligrams (mg) per kilogram (kg) of body weight per day, taken as a single
        dose. Your doctor may adjust your dose as needed and tolerated. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Dose is based on body weight and must be determined by your doctor.
        At first, 1.5 to 2.5 milligrams (mg) per kilogram (kg) of body weight per
        day, taken as a single dose. Your doctor may adjust your dose as needed and
        tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you vomit shortly after taking a dose of mercaptopurine, check with
        your doctor. You will be told whether to take the dose again or to wait until
        the next scheduled dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Once opened, use the oral liquid within 8 weeks. Throw away any unused
        medicine after 8 weeks.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure that this medicine is working properly. Blood
      tests may be needed to check for unwanted effects. Genetic testing may also
      be performed to check your levels of thiopurine S-methyltransferase (an enzyme
      needed to metabolize mercaptopurine).
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you can get pregnant, your doctor may do tests to make sure you are not pregnant
      before starting this medicine. Use an effective form of birth control to keep
      from getting pregnant during treatment with this medicine and for at least 6
      months after your last dose. Male patients who have female partners should use
      effective birth control during treatment with this medicine and for at least
      3 months after the last dose. If you think you have become pregnant while using
      this medicine, tell your doctor right away.
  - type: paragraph
    text: 'Mercaptopurine can temporarily lower the number of white blood cells in
      your blood, increasing the chance of getting an infection. It can also lower
      the number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: While you are being treated with mercaptopurine, and after you stop treatment
      with it, do not have any immunizations (vaccines) without your doctor's approval.
      Mercaptopurine may lower your body's resistance and the vaccine may not work
      as well or you might get the infection the vaccine is meant to prevent. In addition,
      you should not be around other persons living in your household who receive
      live virus vaccines because there is a chance they could pass the virus on to
      you. Some examples of live vaccines include measles, mumps, influenza (nasal
      flu vaccine), poliovirus (oral form), rotavirus, and rubella. Do not get close
      to them and do not stay in the same room with them for very long. If you have
      questions about this, talk to your doctor.
  - type: paragraph
    text: This medicine may increase your risk of getting certain types of cancer,
      including skin cancer and cervical cancer. Some teenagers and young adults with
      Crohn's disease or ulcerative colitis developed a rare type of cancer called
      hepatosplenic T-cell lymphoma (HSTCL). Check with your doctor right away if
      you have unusual bleeding, bruising, or weakness, swollen lymph nodes in the
      neck, underarms, or groin, or unexplained weight loss.
  - type: paragraph
    text: This medicine may cause a life-threatening condition called macrophage activation
      syndrome (MAS). This usually occurs in patients with an autoimmune disease (eg,
      inflammatory bowel disease) or virus infection (eg, Epstein-Barr, cytomegalovirus),
      and must be treated immediately. Tell your doctor right away if you have a fever,
      cough that does not go away, redness in one part of your body, or warm feeling
      or swelling of your skin.
  - type: paragraph
    text: Talk with your doctor before using this medicine if you plan to have children.
      Some men and women using this medicine have become infertile (unable to have
      children).
  - type: paragraph
    text: This medicine may make your skin more sensitive to sunlight. Wear sunscreen.
      Do not use sunlamps or tanning beds.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - clay colored stools
      - cough or hoarseness
      - dark urine
      - decreased appetite
      - fever or chills
      - headache
      - loss of appetite
      - lower back or side pain
      - nausea, vomiting
      - painful or difficult urination
      - pale skin
      - pinpoint red spots on the skin
      - rash, itchy skin
      - stomach pain or tenderness
      - swelling of the feet or lower legs
      - trouble with breathing upon exertion
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - yellow eyes or skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - joint pain
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swollen glands
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blurred vision
      - chills
      - cold sweats
      - coma
      - confusion
      - constipation
      - depression
      - diarrhea
      - dizziness
      - fast heartbeat
      - heartburn
      - increased hunger
      - increased sensitivity of the skin to sunlight
      - indigestion
      - joint pain, stiffness, or swelling
      - nervousness
      - nightmares
      - redness or other discoloration of the skin
      - seizures
      - severe sunburn
      - shakiness
      - slurred speech
      - stomach cramping or burning
      - unpleasant breath odor
      - vomiting of blood or material that looks like coffee grounds
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Darkening of the skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hair loss or thinning of the hair
      - increased sensitivity of the skin to sunlight
      - low sperm count
      - redness or other discoloration of the skin
      - severe sunburn
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
