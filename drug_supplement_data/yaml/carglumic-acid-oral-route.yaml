title: Carglumic acid (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Carbaglu
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Carglumic acid is used together with diet and other medicines to treat and
      prevent hyperammonemia (too much ammonia in the blood) caused by the lack of
      a liver enzyme called N-acetylglutamate synthase (NAGS). It is also used together
      with diet and other medicines to prevent hyperammonemia caused by certain genetic
      disorders called propionic acidemia (PA) or methylmalonic acidemia (MMA).
  - type: paragraph
    text: Ammonia is formed in the body when we digest protein. A person without the
      NAGS enzyme cannot process ammonia properly, and too much ammonia will collect
      in the blood. This will cause serious unwanted effects. Carglumic acid acts
      by replacing the NAGS enzyme and helps reduce the amount of ammonia in the blood.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of carglumic acid in children. Safety
        and efficacy have been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of carglumic acid in the geriatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: It is important that you and your child follow any special diet instructions
      from your doctor, such as using a low-protein diet. If you have any questions
      about this, check with your doctor.
  - type: paragraph
    text: Do not swallow the tablet whole. Do not break, crush, or chew it. Also,
      it is best to take this medicine right away before meals or feedings.
  - type: paragraph
    text: 'To use :'
  - type: list
    ordered: false
    items:
    - Dissolve the tablet in a small container or medicine cup with at least 2.5 milliliters
      (mL) or one-half teaspoonful of water. Shake the container gently to dissolve
      the tablet.
    - Drink the mixture right away.
    - Some small particles or specks may be left at the bottom of the container.
    - Rinse the mixing container with water and drink the water right away to make
      sure you take all of the medicine.
  - type: paragraph
    text: 'To use with a nasogastric tube (NGT) :'
  - type: list
    ordered: false
    items:
    - Dissolve the tablet in a small container or medicine cup with at least 2.5 milliliters
      (mL) or one-half teaspoonful of water. Shake the container gently to dissolve
      the tablet.
    - Pour the mixture into the tube right away.
    - Some small particles or specks may be left at the bottom of the container or
      in the tubing.
    - Rinse the mixing container with water and pour the water into the tube right
      away. This will clear the particles from the tube and make sure you have given
      all of the medicine.
  - type: paragraph
    text: 'To use with an oral syringe :'
  - type: list
    ordered: false
    items:
    - Dissolve the tablet in a small container or medicine cup with at least 2.5 milliliters
      (mL) or one-half teaspoonful of water. Shake the container gently to dissolve
      the tablet.
    - Use an oral syringe to measure the correct amount of mixture for the dose and
      give it right away. Throw away any unused medicine in the container.
    - Some small particles or specks may be left in the oral syringe.
    - Refill the oral syringe with 1 to 2 mL of water and give the water right away.
      This will clear the particles from the syringe and make sure you have given
      all of the medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For hyperammonemia caused by NAGS deficiency:
        Adults and children—Dose is based on body weight and must be determined by
        your doctor. The starting dose is usually 100 to 250 milligrams (mg) per kilogram
        (kg) of body weight per day. The total dose will be divided and given into
        2 to 4 doses per day. Your doctor may adjust your dose to 10 mg/kg to 100
        mg/kg divided into 2 to 4 doses per day. For hyperammonemia caused by PA or
        MMA: Adults and children—Dose is based on body weight or body surface area
        and must be determined by your doctor. Weighing more than 15 kilograms (kg)—3.3
        grams (g) per square meter (m2), divided and given into 2 equal doses (12
        hours apart) for at least 7 days. Weighing less than or equal to 15 kg—150
        milligrams (mg) per kilogram (kg) per day, divided and given into 2 equal
        doses (12 hours apart) for at least 7 days.'
    - type: list
      ordered: false
      items:
      - 'For hyperammonemia caused by NAGS deficiency: Adults and children—Dose is
        based on body weight and must be determined by your doctor. The starting dose
        is usually 100 to 250 milligrams (mg) per kilogram (kg) of body weight per
        day. The total dose will be divided and given into 2 to 4 doses per day. Your
        doctor may adjust your dose to 10 mg/kg to 100 mg/kg divided into 2 to 4 doses
        per day.'
      - 'For hyperammonemia caused by PA or MMA: Adults and children—Dose is based
        on body weight or body surface area and must be determined by your doctor.
        Weighing more than 15 kilograms (kg)—3.3 grams (g) per square meter (m2),
        divided and given into 2 equal doses (12 hours apart) for at least 7 days.
        Weighing less than or equal to 15 kg—150 milligrams (mg) per kilogram (kg)
        per day, divided and given into 2 equal doses (12 hours apart) for at least
        7 days.'
    - type: list
      ordered: false
      items:
      - Adults and children—Dose is based on body weight and must be determined by
        your doctor. The starting dose is usually 100 to 250 milligrams (mg) per kilogram
