    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Before you open the bottle , store it in the refrigerator. Do not freeze.
    - type: paragraph
      text: After you open the bottle for the first time, store it at room temperature.
        Keep the bottle tightly closed, and away from heat, moisture, and direct light.
        Do not refrigerate the bottle. Write the date you used the first tablet on
        the bottle. Throw away any unused medicine 30 days after the date on the bottle.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure that this medicine is working properly. Blood
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Hyperammonemia (too much ammonia in the blood) is a life-threatening condition
      that requires immediate medical attention. Check with your doctor right away
      if you or your child have nausea or vomiting that continues, an increase in
      the frequency of seizures, loss of appetite, swelling of the face, tiredness
      and weakness, or yellow eyes or skin.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chills
      - cough
      - decreased weight
      - diarrhea
      - fever
      - general feeling of discomfort or illness
      - headache
      - hoarseness
      - increased sweating
      - joint pain
      - loss of appetite
      - lower back or side pain
      - muscle aches and pains
      - nausea
      - painful or difficult urination
      - pale skin
      - runny nose
      - shivering
      - sore throat
      - sweating
      - trouble sleeping
      - trouble breathing
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - anxiety
      - bloating
      - blurred vision
      - chest discomfort or pain
      - cold sweats
      - coma
      - confusion
      - cool, pale skin
      - darkened urine
      - decreased appetite
      - decreased awareness or responsiveness
      - depression
      - dizziness
      - drowsiness
      - faintness
      - hallucinations
      - indigestion
      - irritability
      - mood or mental changes
      - nervousness
      - nightmares
      - numbness, tingling, pain, or weakness in the hands or feet
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - seizures
      - severe sleepiness
      - shakiness
      - slurred speech
      - stiff neck
      - swelling of the feet or lower legs
      - trembling
      - weakness and heaviness of the legs
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Actions that are out of control
      - itching, rash
      - reddened skin
      - talking, feeling, and acting with excitement
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fast, pounding, or irregular heartbeat or pulse
      - increase in mucous from the lungs
      - restlessness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in hearing
      - change in taste
      - congestion
      - ear drainage
      - earache or pain in the ear
      - lack or loss of strength
      - loss of taste
      - sleepiness or unusual drowsiness
      - stomach pain
      - stuffy or runny nose
      - swollen glands
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
