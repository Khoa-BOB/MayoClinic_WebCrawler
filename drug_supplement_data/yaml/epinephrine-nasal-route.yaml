title: Epinephrine (nasal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Adrenalin
    - type: paragraph
      text: Neffy
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Epinephrine nasal spray is used for emergency treatment of severe allergic
      reactions, including anaphylaxis.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Spray
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of epinephrine nasal spray in children
        4 years of age and older weighing 15 kilograms (kg) or more. However, safety
        and efficacy have not been established in children younger than 4 years and
        weighing less than 15 kg.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of epinephrine nasal pray in the
        elderly. However, elderly patients are more sensitive to the effects of this
        medicine and more likely to have unwanted effects, which may require caution
        in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Dihydroergotamine
      - Isocarboxazid
      - Linezolid
      - Phenelzine
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acebutolol
      - Acecainide
      - Adenosine
      - Ajmaline
      - Amiloride
      - Amineptine
      - Amiodarone
      - Amitriptyline
      - Amitriptylinoxide
      - Amoxapine
      - Amphetamine
      - Aprindine
      - Atenolol
      - Bemetizide
      - Bendroflumethiazide
      - Benzthiazide
      - Bepridil
      - Betaxolol
      - Bisoprolol
      - Bretylium
      - Bromocriptine
      - Bucindolol
      - Bumetanide
      - Canrenoate
      - Canrenone
      - Carteolol
      - Carvedilol
      - Celiprolol
      - Chlorothiazide
      - Chlorpheniramine
      - Chlorthalidone
      - Clomipramine
      - Clopamide
      - Cyclopenthiazide
      - Cyclothiazide
      - Desipramine
      - Dextroamphetamine
      - Diazoxide
      - Dibenzepin
      - Digoxin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Heart or blood vessel disease (eg, coronary artery disease) or
      - Heart rhythm problems or
      - Hypertension (high blood pressure) or
      - Hyperthyroidism (overactive thyroid) or
      - Hypokalemia (low potassium levels in the blood) or
      - Injury to the nose, history of or
      - Kidney disease or
      - Nasal polyps or
      - Nose surgery, history of or
      - Parkinson's disease—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it
      and do not use it more often than your doctor ordered. To do so may increase
      the chance of side effects.
  - type: paragraph
    text: Call for emergency help right away after the first dose of this medicine.
  - type: paragraph
    text: This medicine comes with patient information leaflet and patient instructions.
      Read and follow these instructions carefully. Read it again each time you refill
      your prescription in case there is new information. Ask your doctor or pharmacist
      if you have any questions.
  - type: paragraph
    text: Use each nasal spray only one time. Do not test spray or prime the plunger
      before use.
  - type: paragraph
    text: Do not sniff during or after the dose is given. If any liquid drips out
      of the nose, you may need to give another dose of this medicine.
  - type: paragraph
    text: If symptoms continue or get worse, you may need to use more than one nasal
      spray. It should be given in the same nostril 5 minutes after the first dose.
  - type: paragraph
    text: Carry this medicine with you at all times for emergency use in case you
      have a severe allergic reaction. It is recommended that you carry 2 Neffy® devices.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For nasal dosage form (spray): For allergic reactions: Adults and children
        4 years of age and older weighing 30 kilograms (kg) or more—One spray in one
        nostril as needed. Each spray contains 2 milligrams (mg) of epinephrine. Children
        4 years of age and older weighing 15 kg to less than 30 kg—One spray in one
        nostril as needed. Each spray contains 1 milligram (mg) of epinephrine. Children
        younger than 4 years of age and weighing less than 15 kg—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For allergic reactions: Adults and children 4 years of age and older weighing
        30 kilograms (kg) or more—One spray in one nostril as needed. Each spray contains
        2 milligrams (mg) of epinephrine. Children 4 years of age and older weighing
        15 kg to less than 30 kg—One spray in one nostril as needed. Each spray contains
        1 milligram (mg) of epinephrine. Children younger than 4 years of age and
        weighing less than 15 kg—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 4 years of age and older weighing 30 kilograms (kg) or
        more—One spray in one nostril as needed. Each spray contains 2 milligrams
        (mg) of epinephrine.
      - Children 4 years of age and older weighing 15 kg to less than 30 kg—One spray
        in one nostril as needed. Each spray contains 1 milligram (mg) of epinephrine.
      - Children younger than 4 years of age and weighing less than 15 kg—Use and
        dose must be determined by your doctor.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Do not freeze. If the spray is frozen and is needed in an emergency, do
        not wait for the spray to thaw.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Anaphylaxis is a life-threatening reaction and requires immediate medical
      attention. Check with your doctor right away, or go to an emergency room as
      soon as possible, even if you feel better after using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Trembling or shaking of the legs, arms, hands, or feet
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blurred vision
      - chest pain or discomfort
      - confusion about identity, place, and time
      - dizziness
      - dry mouth
      - fainting
      - fast, irregular, pounding, or racing heartbeat or pulse
      - fast, slow, or irregular heartbeat
      - flushed, dry skin
      - fruit-like breath odor
      - headache
      - increased hunger
      - increased thirst
      - increased urination
      - nausea
      - nervousness
      - pale skin
      - panic
      - pounding in the ears
      - restlessness
      - sleepiness
      - stomach pain
      - stroke
      - sweating
      - swelling of the feet or lower legs
      - trouble breathing
      - trouble remembering
      - unexplained weight loss
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Feeling jittery
      - throat irritation
      - runny nose
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Gum pain
      - sneezing
      - stuffy nose
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
