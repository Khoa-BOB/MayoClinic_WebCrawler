title: Tedizolid (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Sivextro
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Tedizolid is used to treat acute bacterial skin and skin structure infections
      (ABSSSI). It belongs to the class of drugs called antibiotics. Tedizolid works
      by killing bacteria or preventing their growth. However, this medicine will
      not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of tedizolid in children younger than 26 weeks gestational
        age and weighing less than 1 kilogram (kg). Safety and efficacy have not been
        established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of tedizolid in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Cholera Vaccine, Live
      - Methotrexate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diarrhea—Use with caution. May make this condition worse.
    - type: list
      ordered: false
      items:
      - Neutropenia (low white blood cell count)—Use with caution. Tedizolid may not
        work as well in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Keep using this medicine for the full time of treatment , even if you begin
      to feel better after the first few doses. Your infection may not clear up if
      you stop using this medicine too soon.
  - type: paragraph
    text: This medicine works best when there is a constant amount in the blood. To
      help keep the amount constant, tedizolid must be given on a regular schedule.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of skin infections: Adults
        and children weighing 35 kilograms (kg) or more—200 milligrams (mg) once a
        day for 6 days. Children weighing less than 35 kg—Use of injection dosage
        form is recommended. Children younger than 26 weeks gestational age and weighing
        less than 1 kg—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of skin infections: Adults and children weighing 35 kilograms
        (kg) or more—200 milligrams (mg) once a day for 6 days. Children weighing
        less than 35 kg—Use of injection dosage form is recommended. Children younger
        than 26 weeks gestational age and weighing less than 1 kg—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children weighing 35 kilograms (kg) or more—200 milligrams (mg)
        once a day for 6 days.
      - Children weighing less than 35 kg—Use of injection dosage form is recommended.
      - Children younger than 26 weeks gestational age and weighing less than 1 kg—Use
        and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose and it is less than 8 hours until your next dose, skip
        the missed dose and go back to your regular schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      while using this medicine. This will allow your doctor to see if the medicine
      is working properly and to check for any unwanted effects.
  - type: paragraph
    text: If your or your child's symptoms do not improve or if they become worse,
      check with your doctor.
  - type: paragraph
    text: This medicine may cause diarrhea, and in some cases it can be severe. It
      may also occur 2 months or more after you or your child stop using this medicine.
      If you or your child have diarrhea that continues or gets worse, check with
      your doctor. Do not take any medicine to treat diarrhea without checking first
      with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest tightness
      - diarrhea
      - dizziness
      - fast, slow, pounding, or irregular heartbeat or pulse
      - fever
      - headache
      - hives or welts, itching, or skin rash
      - hoarseness
      - irritation
      - itching of the vagina or genitals
      - joint pain, stiffness, or swelling
      - nervousness
      - pale skin
      - pounding in the ears
      - redness of the skin
      - severe stomach cramps and pain
      - sore mouth or tongue
      - stomach tenderness
      - swelling of the eyelids, face, lips, hands, or feet
      - thick, white vaginal discharge with mild or no odor
      - trouble breathing or swallowing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - watery or severe diarrhea, which may also be bloody
      - white patches in the mouth or on the tongue
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blood in the urine or stools
      - chills
      - cough
      - lower back or side pain
      - painful or difficult urination
      - pinpoint red spots on the skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - double vision
      - feeling of warmth
      - feeling that you cannot keep your eyes open
      - increased sensitivity of the eyes to light
      - redness of the face, neck, arms, and occasionally, upper chest
      - seeing floating spots before the eyes
      - sore neck, shoulders, or back
      - sore, tired, burning, or itching eyes
      - trouble concentrating
      - trouble sleeping
      - vomiting
      - watery or dry eyes
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
