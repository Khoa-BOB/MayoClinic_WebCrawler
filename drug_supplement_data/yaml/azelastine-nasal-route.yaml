title: Azelastine (nasal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Astelin
    - type: paragraph
      text: Astelin Ready-Spray
    - type: paragraph
      text: Astepro
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Azelastine nasal spray is used to help relieve symptoms (eg, stuffy or runny
      nose, itching, sneezing) of seasonal (short-term) or perennial (year-round)
      allergic rhinitis (hay fever), vasomotor rhinitis, or other upper respiratory
      allergies.
  - type: paragraph
    text: Azelastine is an antihistamine. It works by preventing the effects of a
      substance called histamine, which is produced by the body. Histamine can cause
      itching, sneezing, runny nose, and watery eyes.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Spray
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Astepro® nasal spray in children.
        However, safety and efficacy have not been established to treat seasonal allergic
        rhinitis in children younger than 2 years of age and perennial allergic rhinitis
        in children younger than 6 months of age .
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Astepro® allergy nasal spray in
        children. However, use is not recommended in children younger than 6 years
        of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Astepro® nasal spray in the elderly.
        However, elderly patients are more likely to have age-related kidney, liver,
        or heart problems, which may require caution and an adjustment in the dose
        for patients receiving this medicine.
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of Astepro® allergy nasal spray in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amifampridine
      - Bupropion
      - Clomipramine
      - Donepezil
      - Hydroxychloroquine
      - Pitolisant
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Cimetidine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it
      and do not use it more often than your doctor ordered. To do so may increase
      the chance of side effects.
  - type: paragraph
    text: This medicine usually comes with patient information insert. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Follow the instructions on the medicine label if you are using this medicine
      without a prescription.
  - type: paragraph
    text: This medicine is for use only in the nose . Do not get any of it in your
      eyes or on your mouth. If it does get on these areas, rinse it off with water
      and call your doctor right away.
  - type: paragraph
    text: Do not use this medicine for any other nose problem (eg, ulcers or surgery,
      or injury that has not healed) without checking with your doctor first.
  - type: paragraph
    text: 'To use the spray:'
  - type: list
    ordered: false
    items:
    - When you use the azelastine nasal spray for the first time, you must prime the
      spray. Press down fully 6 times or until a fine spray comes out.
    - Prime the spray after each time you clean the pump, or if you have not used
      the medicine for 3 days or longer, by spraying the medicine 2 times or until
      a fine spray comes out.
    - Blow your nose to clear your nostrils.
    - Tilt your head down, looking at your toes, and insert the tip of the nose piece
      into your nostril. Hold bottle upright and aim the spray tip toward the back
      of your nose. Tilt your head downward while spraying to avoid a bitter taste
      in the mouth.
    - Close your other nostril with a finger. Press the pump 1 time and sniff gently
      at the same time, keeping your head tilted forward and down.
    - Repeat in your other nostril using the same steps.
    - If your healthcare provider tells you to use 2 sprays in each nostril, repeat
      the steps above for the second spray in each nostril.
    - Do not blow your nose or tip your head back after using the spray.
    - Wipe the tip of the outside of the nose piece with a clean, dry tissue or cloth
      and put the cap back on.
  - type: paragraph
    text: Do not drink alcohol while you are using this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For nasal dosage form (Astelin® spray): For treatment of seasonal allergic
        rhinitis: Adults and children 12 years of age and older—1 or 2 sprays in each
        nostril 2 times a day, or 2 sprays in each nostril once a day. Each spray
        contains 137 or 205.5 micrograms (mcg) of azelastine. Children 6 to 11 years
        of age—1 spray in each nostril 2 times a day. Each spray contains 137 or 205.5
        mcg of azelastine. Children 2 to 5 years of age—1 spray in each nostril 2
        times a day. Each spray contains 137 mcg of azelastine. Children younger than
        2 years of age—Use and dose must be determined by your doctor.'
      - 'For nasal dosage form (Astepro® spray): For treatment of perennial allergic
        rhinitis: Children 6 months to 11 years of age—1 spray in each nostril 2 times
        a day. Each spray contains 137 micrograms (mcg) of azelastine. Children younger
        than 6 months of age—Use and dose must be determined by your doctor. For treatment
        of seasonal allergic rhinitis: Adults and children 12 years of age and older—1
        or 2 sprays in each nostril 2 times a day. Each spray contains 137 micrograms
        (mcg) of azelastine. Children 2 to 11 years of age—1 spray in each nostril
        2 times a day. Each spray contains 137 mcg of azelastine. Children younger
        than 2 years of age—Use and dose must be determined by your doctor.'
      - 'For nasal dosage form (Astepro® allergy spray): For treatment of allergic
        rhinitis or other upper respiratory allergies: Adults and children 12 years
        of age and older—2 sprays in each nostril once a day or 1 or 2 sprays in each
        nostril 2 times a day (every 12 hours). Do not use more than 4 sprays in each
        nostril per day (24 hour period). Each spray contains 205.5 micrograms (mcg)
        of azelastine. Children 6 to 11 years of age—1 spray in each nostril 2 times
        a day (every 12 hours). Do not use more than 2 sprays in each nostril per
        day (24 hour period). Each spray contains 205.5 micrograms (mcg) of azelastine.
        Children younger than 6 years of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For treatment of seasonal allergic rhinitis: Adults and children 12 years
        of age and older—1 or 2 sprays in each nostril 2 times a day, or 2 sprays
        in each nostril once a day. Each spray contains 137 or 205.5 micrograms (mcg)
        of azelastine. Children 6 to 11 years of age—1 spray in each nostril 2 times
        a day. Each spray contains 137 or 205.5 mcg of azelastine. Children 2 to 5
        years of age—1 spray in each nostril 2 times a day. Each spray contains 137
        mcg of azelastine. Children younger than 2 years of age—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—1 or 2 sprays in each nostril
        2 times a day, or 2 sprays in each nostril once a day. Each spray contains
        137 or 205.5 micrograms (mcg) of azelastine.
      - Children 6 to 11 years of age—1 spray in each nostril 2 times a day. Each
        spray contains 137 or 205.5 mcg of azelastine.
      - Children 2 to 5 years of age—1 spray in each nostril 2 times a day. Each spray
        contains 137 mcg of azelastine.
      - Children younger than 2 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - 'For treatment of perennial allergic rhinitis: Children 6 months to 11 years
        of age—1 spray in each nostril 2 times a day. Each spray contains 137 micrograms
        (mcg) of azelastine. Children younger than 6 months of age—Use and dose must
