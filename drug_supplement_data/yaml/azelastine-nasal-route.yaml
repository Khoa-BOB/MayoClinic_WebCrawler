      - Children younger than 6 years of age—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the bottle upright with the pump tightly closed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor should check you or your child at regular visits for any problems
      or unwanted effects that may be caused by this medicine. If your symptoms do
      not improve within a few days or if they become worse, check with your doctor.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that makes you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for hay fever, other allergies, or colds, sedatives,
      tranquilizers, or sleeping medicine, prescription pain medicine or narcotics,
      medicine for seizures, muscle relaxants, or anesthetics, including some dental
      anesthetics. Check with your doctor before taking any of the above while you
      are using this medicine .
  - type: paragraph
    text: This medicine may cause some people to become dizzy, drowsy, or less alert
      than they are normally. Even if used at bedtime, it may cause some people to
      feel drowsy or less alert on arising. Make sure you know how you react to this
      medicine before you drive, use machines, or do anything else that could be dangerous
      if you are dizzy or not alert .
  - type: paragraph
    text: Keep the spray away from the eyes because this medicine may cause irritation
      or blurred vision. Closing your eyes while you are using this medicine may help
      keep it out of your eyes.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Heavy nosebleeds
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning or discomfort inside the nose
      - ear congestion
      - chills
      - cough
      - fever
      - sore throat
      - body aches or pain
      - headache
      - loss of voice
      - trouble breathing
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blood in the urine
      - blurred vision or other change in vision
      - chest tightness
      - eye pain or redness
      - hives, itching, or skin rash
      - rapid heartbeat
      - sores in the mouth or on the lips
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bitter taste in the mouth
      - drowsiness or sleepiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody mucus or unexplained nosebleeds
      - dizziness
      - dryness of the mouth
      - muscle aches or pain
      - nausea
      - sudden outbursts of sneezing
      - weight gain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
