title: Phenolsulfonphthalein (injection route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Phenolsulfonphthalein is used as a test to help diagnose problems or disease
      of the kidneys. This test determines how well your kidneys are working.
  - type: paragraph
    text: Phenolsulfonphthalein passes out of the body almost entirely in the urine.
      Measuring the amount of phenolsulfonphthalein in the urine can help the doctor
      determine if the kidneys are working properly.
  - type: paragraph
    text: 'How test is done: After you have emptied your bladder, phenolsulfonphthalein
      will be given by injection. Then you will be asked to empty your bladder into
      a container one or more times after the medicine is given. The amount of this
      medicine in your urine will be measured. Then the results of the test will be
      studied. The way the phenolsulfonphthalein test is done may be different for
      different patients. Some patients may have the phenolsulfonphthalein injected
      into a vein, others, into a muscle.'
  - type: paragraph
    text: It is very important that you empty the bladder completely and collect all
      the urine when you are asked to do so. If any urine is left behind or lost,
      it will change the results of the test.
  - type: paragraph
    text: Phenolsulfonphthalein is to be used only under the supervision of a doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a diagnostic test, any risks of the test must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      Also, other things may affect test results. For this test, the following should
      be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of phenolsulfonphthalein
        in children with use in other age groups, phenolsulfonphthalein is not expected
        to cause different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of phenolsulfonphthalein
        in the elderly with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this diagnostic
        test. Make sure you tell your doctor if you have any other medical problems,
        especially:'
    - type: list
      ordered: false
      items:
      - Gout or
      - Liver disease or
      - Multiple myeloma (a kind of cancer)—These conditions may affect how fast the
        body gets rid of the phenolsulfonphthalein
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease or
      - Kidney disease (severe)—Patients with these conditions are at greater risk
        of becoming ill because of the large amount of liquids that must be taken
        for this test
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although this medicine usually does not cause any side effects, tell your health
      care professional immediately if you notice wheezing or skin rash or itching
      shortly after it is given.
  - type: paragraph
    text: Other side effects not listed may also occur in some patients. If you notice
      any other effects, check with your healthcare professional.
  - type: paragraph
    text: Call your doctor for medical advice about side effects. You may report side
      effects to the FDA at 1-800-FDA-1088.
