- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Immune globulin injection is used to prevent infections or make the infection
      less severe (eg, hepatitis A with not more than 2 weeks of exposure, chickenpox,
      measles with not more than 6 days of exposure, has not been vaccinated, and
      has not had measles previously, or rubella) when your body has a weak immune
      system. Immune globulin contains antibodies that make your immune system stronger.
      It is used for patients who have idiopathic thrombocytopenic purpura (ITP),
      chronic immune thrombocytopenic purpura, chronic inflammatory demyelinating
      polyneuropathy (CIDP), or dermatomyositis (DM). It is also used for patients
      who have primary humoral immunodeficiency (PI), including congenital agammaglobulinemia,
      common variable immunodeficiency, X-linked agammaglobulinemia, Wiskott-Aldrich
      syndrome, and other severe combined immune system problems. It is also used
      to improve muscle strength and disability in patients with multifocal motor
      neuropathy (MMN). Immune globulin injection belongs to a group of medicines
      known as immunizing agents.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of immune globulin injection in children.
        Some of the products are only used in children who are 2, 3, or 15 years of
        age and older, and other products are not approved for use in children. Immune
        globulin injection is used to treat primary humoral immunodeficiency (PI),
        idiopathic thrombocytopenic purpura (ITP), and chronic immune thrombocytopenic
        purpura in children. Safety and efficacy have not been established for use
        in chronic inflammatory demyelinating polyneuropathy (CIDP) , multifocal motor
        neuropathy (MMN) , or dermatomyositis (DM) .
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Gamastan® in the pediatric population. Safety and efficacy
        have not been established.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Gammagard Liquid ERC® in children younger than 2 years of
        age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of immune globulin injection in the
        elderly. However, elderly patients are more likely to have age-related blood
        clotting problems, kidney disease, or heart disease, which may require caution
        for patients receiving immune globulin injection.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Gamastan® in the elderly. Safety and efficacy have not been
        established.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Bumetanide
      - Cholera Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Ebola Zaire Vaccine, Live
      - Eculizumab
      - Ethacrynic Acid
      - Etozolin
      - Furosemide
      - Influenza Virus Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Piretanide
      - Poliovirus Vaccine, Live
      - Pozelimab-bbfg
      - Ravulizumab-cwvz
      - Rotavirus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Torsemide
      - Typhoid Vaccine, Live
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
      - Zoster Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to corn—Use with caution. May cause an allergic reaction to occur.
    - type: list
      ordered: false
      items:
      - Anemia, history of or
      - Bleeding problems, history of or
      - Hyponatremia (low sodium in the blood) or
      - Kidney problems—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Atherosclerosis (hardening of the arteries), history of or
      - Blood clotting problems, history of or
      - Diabetes or
      - Heart attack or stroke, recent or
      - Heart or blood vessel disease or
      - Hyperproteinemia (high protein in the blood) or
      - Hyperviscosity (thick blood), known or suspected or
      - Hypovolemia (low blood volume or major loss of body fluids) or
      - IgA (immunoglobulin A) deficiency with antibodies against IgA or
      - Paraproteinemia (paraproteins in the blood) or
      - Sepsis (serious infection in the body)—Use with caution. May cause side effects
        to become worse.
    - type: list
      ordered: false
      items:
      - Hereditary intolerance to fructose or sucrose or
      - IgA (immunoglobulin A) deficiency with antibodies against IgA—Gammaplex® should
        not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Hyperprolinemia (too much proline in the blood) or
      - IgA (immunoglobulin A) deficiency with antibodies against IgA—Hizentra® and
        Privigen® should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - IgA (immunoglobulin A) deficiency with antibodies against IgA—Cuvitru®, Gamastan®,
        and Octagam® should not be used in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins, as a shot into one of your muscles, or as a shot under your skin.
  - type: paragraph
    text: This medicine comes with a patient information leaflet and patient instructions.
      Read and follow the instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: The Gammagard Liquid, Gammagard Liquid ERC®, Gammaked™, Gamunex®-C, and
      Hizentra® products may be given at home to patients who do not need to be in
      the hospital or clinic. Gammagard Liquid, Gammaked™, Gamunex®-C, and Hizentra®
      are given as an infusion under your skin once every week. Gammagard Liquid ERC®
      is given as an infusion under your skin every 3 or 4 weeks. Cuvitru® and Hizentra®
      products may also be given once every 2 weeks. If you are using this medicine
      at home, your doctor will teach you how to prepare and infuse the medicine.
      You will be shown the body areas where the medicine can be given. Use a different
      body area for each infusion. Keep track of where you give an infusion to make
      sure you rotate sites. This will help prevent skin problems.
  - type: paragraph
    text: Do not change the brand or type of your immune globulin unless your doctor
      tells you to. If you must change the brand of medicine, talk to your doctor
      before giving yourself an infusion. Make sure you understand the instructions
      on how to use the new brand.
  - type: paragraph
    text: Allow the Gammagard Liquid, Gammagard Liquid ERC®, Gammaked™, or Gamunex®-C
      brand to reach room temperature before using it.
  - type: paragraph
    text: 'To use Cuvitru®, Gammagard Liquid, Gammaked™, Gamunex®-C, or Hizentra®
      :'
  - type: list
    ordered: false
    items:
    - First, gather the items you will need on a clean, flat surface using a cloth
      or towel in a well-lighted area.
    - Wash your hands with soap and water before and after using this medicine.
    - If you have been told to wear gloves when preparing your infusion, put the gloves
      on.
    - Check the liquid in the vial (glass container). It should be clear and slightly
      yellow to light brown in color. If it is cloudy, discolored, or contains large
      flecks (particles), do not use the vial. Select another vial.
    - If the liquid is clear, place it on the clean, flat surface. Do not heat up
      or shake the medicine.
    - Follow your doctor's instructions on how to prepare the correct amount of medicine.
    - Choose an injection site on your body (eg, stomach area, thigh, upper arm, upper
      leg, hip). Clean the injection site with a fresh alcohol wipe, and let it dry.
    - With two fingers, pinch together the skin at the injection site. Insert the
      needle with the tube under the skin.
    - Put sterile gauze and tape over the injection site to keep the needle from coming
      out.
    - Before starting the infusion, make sure no blood is flowing into the infusion
      tube. If blood is present, remove and throw away the used needle and tube.
    - Follow your doctor's instructions on how to use the infusion pump.
    - Remove the peel-off portion of the label from the used vial. Place this label
      in your treatment diary or log book. Write down the amount of medicine you used,
      the date, and the time of your treatment.
    - It usually takes about 60 minutes for each infusion.
    - When all of the medicine has been infused, turn off the pump.
    - Take the gauze off and remove the needle and tube from your skin.
    - Clean and store the infusion pump.
  - type: paragraph
    text: 'To use Gammagard Liquid ERC® :'
  - type: list
    ordered: false
    items:
    - Allow the medicine to warm to room temperature for 60 minutes before you use
      it. Do not warm it in any other way (eg, microwave).
    - Wash your hands with soap and water before and after using this medicine.
    - Check the liquid in the vial. It should be clear, colorless to slightly yellowish.
      Do not use it if it looks cloudy, has particles in it, or is dark yellow. Do
      not shake. Do not use it if the cap is missing or damaged.
    - Pull the plunger back to fill the syringe with air. Inject air into the vial
      and withdraw the prescribed amount.
    - Remove the needle cover. Pinch the skin. Insert the needle at a 90 degree angle.
    - Before starting the infusion, make sure no blood is flowing into the infusion
      tube. If blood is present, remove and throw away the used needle and tube.
    - Carefully follow the manufacturer’s instructions for preparing the infusion.
    - Remove the peel-off label from the vial. Place this label in your treatment
      diary or log book. Write down the amount of medicine you used, the date, and
      the time of your treatment.
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: This medicine needs to be given on a fixed schedule. If you miss a dose
        or forget to use your medicine, call your doctor or pharmacist for instructions.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Store Hizentra® at room temperature, away from heat and moisture, for
        up to 30 months. Keep from freezing. Protect the product from direct light.
        Keep the medicine in its original package until you are ready to use it.
    - type: paragraph
      text: Store Gamunex®-C in its original container and in the refrigerator, but
        do not freeze it.
    - type: paragraph
      text: You may store Gammagard Liquid or Gammaked™ in the refrigerator or at
        room temperature. Store it in the original container. Do not freeze. Talk
        with your pharmacist if you have questions about storage of this product.
    - type: paragraph
      text: Store Cuvitru® or Gammagard Liquid ERC® at room temperature, away from
        heat and moisture, for up to 24 months or in the refrigerator for up to 36
        months. Do not freeze. Do not shake. Protect the product from direct light.
        Keep the medicine in its original package until you are ready to use it.
    - type: paragraph
      text: Throw away used needles and tubes in a hard, closed container where the
        needles cannot poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      for any problems that may be caused by this medicine. Blood and urine tests
      may be needed to check for unwanted effects.
  - type: paragraph
    text: Patients with idiopathic thrombocytopenic purpura (ITP) should not be treated
      with Gammaked™ or Gamunex®-C that is injected under the skin (subcutaneously).
      Doing so may increase the risk of having a hematoma (buildup of blood under
      the skin).
  - type: paragraph
    text: This medicine may cause fever, chills, flushing, headaches, nausea, and
      vomiting, especially if you are receiving it for the first time or if you have
      not received it for more than 8 weeks. Check with your doctor or nurse right
      away if you have any of these symptoms.
  - type: paragraph
    text: This medicine is made from donated human blood. Some human blood products
      have transmitted certain viruses (eg, Creutzfeldt-Jakob disease) to people who
      have received them, although the risk is low. Human donors and donated blood
      are both tested for viruses to keep the transmission risk low. Talk with your
      doctor if you have concerns about this risk.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have a rash, itching, hives, chest pain, dizziness
      or lightheadedness, trouble breathing, trouble swallowing, or any swelling of
      your hands, face, or mouth after receiving this medicine. Certain people, including
      those with IgA (an immunoglobulin) deficiency and antibodies against IgA and
      a history of hypersensitivity to human immunoglobulin products should not use
      this medicine .
  - type: paragraph
    text: Check with your doctor right away if you start to have a stiff neck, drowsiness,
      fever, severe headache, nausea, vomiting, painful eye movements, or eye sensitivity
      to light. These could be symptoms of a serious condition called aseptic meningitis
      syndrome (AMS).
  - type: paragraph
    text: This medicine may cause bleeding (hemolysis) or hemolytic anemia. Tell your
      doctor right away if you have stomach or back pain, dark urine, decreased urination,
      difficulty with breathing, an increased heart rate, tiredness, or yellow eyes
      or skin after you receive the medicine.
  - type: paragraph
    text: Check with your doctor right away if you start having chest pain, difficult,
      fast, or noisy breathing, blue lips and fingernails, fever, pale skin, increased
      sweating, coughing that sometimes produces a pink frothy sputum, trouble breathing,
      or swelling of the legs and ankles after receiving this medicine. These may
      be symptoms of a serious lung problem, including transfusion-related acute lung
      injury (TRALI).
  - type: paragraph
    text: This medicine may cause blood clots. This is more likely to occur if you
      have a history of blood clotting problems, heart disease, or atherosclerosis
      (hardening of the arteries), or if you are obese, take medicines containing
      estrogen, or must stay in bed for a long time because of surgery or illness.
      Check with your doctor right away if you suddenly have chest pain, severe headache,
      leg pain, or problems with vision, speech, or walking.
  - type: paragraph
    text: Check with your doctor right away if you start having red or dark brown
      urine, lower back or side pain, sudden weight gain, swollen face, arms, or legs,
      decreased urine output, or any problems with urination after you receive this
      medicine. These may be symptoms of a serious kidney problem.
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. You might need to measure
      your blood pressure at home. If you think your blood pressure is too high, call
      your doctor right away.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect the results of certain medical tests.
  - type: paragraph
    text: While you are being treated with immune globulin injection, do not have
      any immunizations (vaccines) without your doctor's approval . You may need to
      wait 3 to 6 months after receiving immune globulin to get a live virus vaccine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - black, tarry stools
      - blurred vision
      - bone pain
      - chest pain or tightness
      - chills
      - cough
      - dark urine
      - decreased urination
      - diarrhea
      - dizziness
      - fast, pounding, or irregular heartbeat or pulse
      - fever
      - general feeling of discomfort or illness
      - headache
      - joint pain
      - loss of appetite
      - muscle aches and pains
      - nausea
      - nervousness
      - noisy breathing
      - pain in the arms or legs
      - painful or difficult urination
      - pounding in the ears
      - rash
      - runny nose
      - shivering
      - slow or fast heartbeat
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach pain
      - sweating
      - swollen glands
      - trouble breathing
      - trouble sleeping
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
      - yellow eyes or skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish coloring of the lips or nail beds
      - burning sensation in the head
      - faintness or lightheadedness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with swallowing
      - hives or welts
      - itching, especially of the feet or hands
      - reddening of the skin, especially around the ears
      - swelling of the eyes, face, or inside of the nose
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back, leg, or stomach pains
      - blistering, peeling, or loosening of the skin
      - blood in the urine
      - change in vision
      - changes in blood pressure
      - changes in urination
      - chest pain or discomfort
      - cold, clammy, or pale skin
      - confusion
      - decreased frequency or amount of urine
      - difficult or labored breathing
      - difficulty seeing at night
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - feeling of warmth
      - headache that is severe and occurs suddenly
      - hoarseness
      - increased sensitivity of the eyes to sunlight
      - increased thirst
      - irritation
      - joint stiffness or swelling
      - light-colored stools
      - loss of appetite
      - loss of consciousness
      - low blood pressure or pulse
      - lower back or side pain
      - muscle spasm or jerking of all extremities
      - pains in the chest, groin, or legs, especially calves of the legs
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - seizures
      - shakiness in the legs, arms, hands, or feet
      - skin blisters
      - slow breathing
      - slurred speech that occurs suddenly
      - sudden, severe weakness or numbness in the arm or leg
      - sweating
      - swelling of the face, fingers, lower legs, or ankles
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Lack or loss of strength
      - redness, swelling, itching, or pain at the injection site
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hip pain
      - leg cramps
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - dry mouth
      - hair loss, thinning of hair
      - nervousness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
