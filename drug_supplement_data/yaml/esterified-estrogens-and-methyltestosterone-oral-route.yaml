- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Esterified estrogens and methyltestosterone combination is used to treat
      the symptoms of menopause in patients who did not get relief after being treated
      with estrogens alone. These symptoms may include a feeling of heat, sweating,
      and warmth in the face, neck, or chest ("hot flashes"); and dryness, burning,
      and itching in the vagina.
  - type: paragraph
    text: Esterified estrogens are a man-made mixture of estrogens. Estrogen is a
      hormone that is produced by the body in greater amounts in females. It is necessary
      for normal sexual development of the female and for regulation of the menstrual
      cycle during the childbearing years. Methyltestosterone is a man-made form of
      testosterone, a hormone that is produced by the body in greater amounts in males
      and small amounts in females. Menopause symptoms occur when the hormone balance
      changes in the female body. This combination of hormones will relieve the symptoms
      of menopause by adding more hormones to the body.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: The use of esterified estrogens and methyltestosterone combination is
        not recommended in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of esterified estrogens and methyltestosterone
        combination in the elderly. However, elderly patients are more likely to develop
        dementia and age-related kidney, liver, or heart problems, which may require
        caution and an adjustment in the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amifampridine
      - Anisindione
      - Bupropion
      - Cosyntropin
      - Dicumarol
      - Donepezil
      - Fosphenytoin
      - Hydroxychloroquine
      - Insulin Aspart, Recombinant
      - Melatonin
      - Phenprocoumon
      - Phenytoin
      - Somatrogon-ghla
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Ginseng
      - Levothyroxine
      - Licorice
      - Tipranavir
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Abnormal vaginal bleeding, undiagnosed or
      - Blood clotting problems (e.g., deep vein thrombosis, pulmonary embolism),
        history of or
      - Breast cancer, or history of or
      - Heart attack, recent or history of or
      - Liver disease, severe or
      - Stroke, recent or history of—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Asthma or
      - Cancer (e.g., breast, cervix, liver, vagina) or
      - Depression, history of or
      - Diabetes or
      - Edema (fluid retention) or
      - Endometriosis (problem with the lining of the uterus) or
      - Epilepsy or
      - Eye or vision problems (e.g., retinal vascular thrombosis) or
      - Gallbladder disease or
      - Hepatitis (including cholestatic jaundice), history of or
      - Hypercalcemia (high calcium in the blood) or
      - Hypocalcemia (high calcium in the blood) or
      - Hypothyroidism (underactive thyroid) or
      - Migraine headaches, history of or
      - Porphyria (enzyme problem) or
      - Systemic lupus erythematosus—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease or
      - Hypercholesterolemia (high cholesterol in the blood) or
      - Hypertension (high blood pressure) or
      - Hypertriglyceridemia (high triglycerides or fat in the blood) or
      - Venous thromboembolism (clot in the veins), history of—May increase risk for
        more serious side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions in the insert carefully. Ask your doctor if you have any questions.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of menopause symptoms: Adults—One
        to two tablets once a day. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For treatment of menopause symptoms: Adults—One to two tablets once a day.
        Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—One to two tablets once a day.
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure the medicine is working properly and to decide if you should continue
      to take it. These visits should be every 6 to 12 months or as otherwise directed
      by your doctor.
  - type: paragraph
    text: It is unlikely that a postmenopausal woman may become pregnant. But, you
      should know that using this medicine while you are pregnant could harm your
      unborn baby. If you think you have become pregnant while using the medicine,
      tell your doctor right away.
  - type: paragraph
    text: Very rarely, this medicine can cause serious side effects such as a heart
      attack or stroke. You are much more likely to have these side effects if you
      smoke cigarettes or are overweight, or if you have diabetes, high blood pressure,
      or a high blood cholesterol. Talk with your doctor if you think you might be
      at risk.
  - type: paragraph
    text: Using large doses of estrogen alone over a long period of time may increase
      the risk of some kinds of cancer (e.g., endometrial cancer). Talk with your
      doctor about this risk. If you have vaginal bleeding with this medicine, call
      your doctor right away.
  - type: paragraph
    text: This medicine may increase the risk of getting breast cancer. It is very
      important that you check your breasts on a regular basis for any unusual lumps
      or discharge, and that you have breast x-rays every year as directed by your
      doctor . These exams are very important if you have a family member with a history
      of breast cancer. Talk with your doctor about this risk.
  - type: paragraph
    text: This medicine may increase the risk of getting dementia in elderly women
      (above 65 years of age). Talk with your doctor if this concerns you.
  - type: paragraph
    text: Check with your doctor right away if blurred vision, difficulty with reading,
      or any other change in vision occurs during or after treatment. Your doctor
      may want you to have your eyes checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: Using large doses of methyltestosterone over a long period of time may increase
      the risk of serious liver problems (e.g., peliosis hepatis or liver cancer).
      Talk with your doctor about this risk.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are taking this medicine. The results of some tests may be affected by this
      medicine. Also, you may need to stop using this medicine for a few weeks before
      and after having surgery, or if you are inactive for a long period of time.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
