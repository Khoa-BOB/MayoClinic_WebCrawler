title: Orphenadrine, aspirin, and caffeine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Norgesic
    - type: paragraph
      text: Norgesic Forte
    - type: paragraph
      text: Orphenadrine w/A.C.
    - type: paragraph
      text: Orphengesic
    - type: paragraph
      text: Orphengesic Forte
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Orphenadrine, aspirin, and caffeine combination is used to relieve mild
      to moderate pain in patients with acute (short-term) muscle or bone problems.
      It helps relax certain muscles in your body, which relieves the pain and discomfort
      caused by strains, sprains, or other injury to your muscles. However, this medicine
      does not take the place of rest, exercise, or other treatment that your doctor
      may recommend for your medical problem.
  - type: paragraph
    text: Orphenadrine acts in the central nervous system (CNS) to produce its muscle
      relaxant effects. Aspirin is a nonsteroidal anti-inflammatory drug (NSAID) that
      is used to relieve pain and reduce fever. Caffeine is a CNS stimulant that is
      used together with pain relievers to increase their effect.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Because of aspirin's toxicity, use in children younger than 12 years of
        age is not recommended. Do not give aspirin to a child who has chickenpox
        or flu symptoms, unless approved by a doctor.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of orphenadrine, aspirin, and caffeine combination in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Abrocitinib
      - Defibrotide
      - Dichlorphenamide
      - Influenza Virus Vaccine, Live
      - Isocarboxazid
      - Ketorolac
      - Potassium Chloride
      - Potassium Citrate
      - Probenecid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Aceclofenac
      - Acemetacin
      - Acenocoumarol
      - Acetazolamide
      - Alclometasone
      - Aldosterone
      - Alfentanil
      - Alipogene Tiparvovec
      - Alprazolam
      - Alteplase, Recombinant
      - Amantadine
      - Amcinonide
      - Amifampridine
      - Amikacin
      - Amiloride
      - Amineptine
      - Amitriptyline
      - Amitriptylinoxide
      - Amoxapine
      - Amphotericin B
      - Amtolmetin Guacil
      - Anagrelide
      - Anisindione
      - Apixaban
      - Ardeparin
      - Argatroban
      - Bacitracin
      - Beclomethasone
      - Bemetizide
      - Bemiparin
      - Benazepril
      - Bendroflumethiazide
      - Benzhydrocodone
      - Benzthiazide
      - Betamethasone
      - Betrixaban
      - Bivalirudin
      - Brinzolamide
      - Bromazepam
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acebutolol
      - Atenolol
      - Betaxolol
      - Bisoprolol
      - Carteolol
      - Carvedilol
      - Celiprolol
      - Delapril
      - Donanemab-azbt
      - Esmolol
      - Garlic
      - Imidapril
      - Labetalol
      - Levobunolol
      - Metipranolol
      - Metoprolol
      - Nadolol
      - Nebivolol
      - Nitroglycerin
      - Oxprenolol
      - Penbutolol
      - Perphenazine
      - Pindolol
      - Propranolol
      - Sotalol
      - Streptokinase
      - Tamarind
      - Temocapril
      - Tenecteplase
      - Timolol
      - Tizanidine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bladder problem or
      - Enlarged prostate or
      - Esophagus problem (eg, achalasia) or
      - Glaucoma or
      - Myasthenia gravis or
      - Stomach or bowel blockage (eg, pyloric or duodenal obstruction)—Should not
        be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Blood clotting problem or
      - Stomach ulcer—Use with caution. May increase risk for more side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: You may take this medicine with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (tablets): For mild to moderate muscle or bone pain:
        Adults and children older than 12 years of age—One-half or one tablet 3 or
        4 times a day. Each tablet contains 50 milligrams (mg) orphenadrine, 770 mg
        aspirin, and 60 mg caffeine. Children younger than 12 years of age—Use is
        not recommended.'
    - type: list
      ordered: false
      items:
      - 'For mild to moderate muscle or bone pain: Adults and children older than
        12 years of age—One-half or one tablet 3 or 4 times a day. Each tablet contains
        50 milligrams (mg) orphenadrine, 770 mg aspirin, and 60 mg caffeine. Children
        younger than 12 years of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children older than 12 years of age—One-half or one tablet 3 or
        4 times a day. Each tablet contains 50 milligrams (mg) orphenadrine, 770 mg
        aspirin, and 60 mg caffeine.
      - Children younger than 12 years of age—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress,
      especially if you will be using this medicine for a long time . This will allow
      your doctor to see if the medicine is working properly and to decide if you
      should continue to use it. Blood and urine tests may be needed to check for
      unwanted effects.
  - type: paragraph
    text: Using this medicine during the later part of pregnancy can harm your unborn
      baby. If you think you have become pregnant while using the medicine, tell your
      doctor right away.
  - type: paragraph
    text: This medicine contains aspirin, which may cause a condition called Reye's
      syndrome, especially in children with or recovering from a viral infection (including
      chicken pox, influenza). Do not give this medicine in these patients, unless
      ordered by your doctor. Talk to your doctor if you have concerns.
  - type: paragraph
    text: This medicine may cause confusion, tremors, or lightheadedness, or make
      you less alert than you are normally. Do not drive or do anything else that
      could be dangerous until you know how this medicine affects you . Sit or lie
      down if you feel dizzy. Stand up carefully.
  - type: paragraph
    text: Check with your doctor right away if you have black, tarry stools, chest
      pain, chills, cough, fever, painful or difficult urination, rash, sore throat,
      sores, ulcers, or white spots on the lips or in the mouth, swelling of the face,
      swollen glands, trouble breathing, unusual bleeding or bruising, or unusual
      tiredness or weakness. These may be symptoms of serious skin reaction called
      drug with eosinophilia with systemic syndrome (DRESS).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or non-prescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - anxiety
      - confusion
      - fast or irregular breathing
      - irritability
      - nervousness
      - nightmares
      - restlessness
      - seeing, hearing, or feeling things that are not there
      - seizures
      - tremors
      - unusual feeling of excitement
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chest pain or tightness
      - chills
      - cough
      - fever
      - headache
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swollen or painful glands
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting of blood or material that looks like coffee grounds
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decrease in the frequency of urination or urine volume
      - difficulty in passing urine (dribbling)
      - dizziness
      - fainting
      - fast, pounding, or irregular heartbeat or pulse
      - lightheadedness
      - painful urination
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - constipation
      - drowsiness
      - dry mouth
      - itching, red, skin rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
