title: Aromatic ammonia spirit (inhalation route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Aromatic ammonia spirit is used to prevent or treat fainting.
  - type: paragraph
    text: Fainting may be caused by some kinds of medicine, by an unpleasant or stressful
      event, or by a serious medical problem, such as heart disease. Fainting in an
      older person is often more serious than fainting in a younger person. Older
      people and people with a history of heart problems should seek medical attention
      as soon as possible after fainting.
  - type: paragraph
    text: Aromatic ammonia spirit is available without a doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested in children and, in effective doses, has
        not been shown to cause different side effects or problems than it does in
        adults. However, this medicine should not be given to children without first
        checking with their doctor.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of aromatic
        ammonia spirit in the elderly with use in other age groups, this medicine
        is not expected to cause different side effects or problems in older people
        than it does in younger adults.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma, bronchitis, emphysema, or other chronic lung disease, or
      - Eye problems—This medicine may make these conditions worse
    - type: list
      ordered: false
      items:
      - Flushed face—The cause of the fainting may be a serious condition that should
        be treated by a doctor
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For preventing or treating fainting: For inhalation dosage form (inhalants):
        Adults and teenagers—The inhalant should be held away from the face and crushed
        between the fingers. The inhalant should then be held about four inches away
        from the nostrils, and the vapor slowly inhaled until the patient awakens
        or no longer feels faint. Children—Use and dose must be determined by your
        doctor. For inhalation dosage form (solution): Adults and teenagers—After
        the top is taken off the container, the vapor may be slowly inhaled until
        the patient awakens or no longer feels faint. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For inhalation dosage form (inhalants): Adults and teenagers—The inhalant
        should be held away from the face and crushed between the fingers. The inhalant
        should then be held about four inches away from the nostrils, and the vapor
        slowly inhaled until the patient awakens or no longer feels faint. Children—Use
        and dose must be determined by your doctor.'
      - 'For inhalation dosage form (solution): Adults and teenagers—After the top
        is taken off the container, the vapor may be slowly inhaled until the patient
        awakens or no longer feels faint. Children—Use and dose must be determined
