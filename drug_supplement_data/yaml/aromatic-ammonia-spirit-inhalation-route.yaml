    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Do not refrigerate. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Fainting in older people may be a sign of a serious medical problem. Older
      people and people with heart problems should check with their doctor as soon
      as possible after fainting.
  - type: paragraph
    text: Keep this medicine away from your eyes and skin. If aromatic ammonia spirit
      comes into contact with your eyes or skin, burns and irritation may occur. Burns
      in the eyes may cause blindness.
  - type: paragraph
    text: 'If this medicine gets into your eyes:'
  - type: list
    ordered: false
    items:
    - Rinse your eyes with a gentle stream of water for 20 minutes. Hold the eyelid
      away from the eyeball to allow complete rinsing.
    - Call a poison control center, your doctor, or a hospital emergency room immediately.
  - type: paragraph
    text: 'If this medicine comes into contact with your skin:'
  - type: list
    ordered: false
    items:
    - Remove any clothing on which aromatic ammonia spirit has spilled.
    - Rinse the skin with large amounts of water.
    - Do not rub or apply ointment to the skin.
    - Call your doctor if skin irritation continues.
  - type: paragraph
    text: 'If a large amount of this medicine is taken orally:'
  - type: list
    ordered: false
    items:
    - Drink a glass (8 ounces) of water.
    - Call a poison control center, your doctor, or a hospital emergency room immediately.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - diarrhea
      - difficulty in breathing
      - headache
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
