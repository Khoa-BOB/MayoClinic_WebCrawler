title: Guanadrel (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Hylorel
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Guanadrel belongs to the general class of medicines called antihypertensives.
      It is used to treat high blood pressure (hypertension).
  - type: paragraph
    text: High blood pressure adds to the work load of the heart and arteries. If
      it continues for a long time, the heart and arteries may not function properly.
      This can damage the blood vessels of the brain, heart, and kidneys resulting
      in a stroke, heart failure, or kidney failure. High blood pressure may also
      increase the risk of heart attacks. These problems may be less likely to occur
      if blood pressure is controlled.
  - type: paragraph
    text: Guanadrel works by controlling nerve impulses along certain nerve pathways.
      As a result, it relaxes the blood vessels so that blood passes through them
      more easily. This helps to lower blood pressure.
  - type: paragraph
    text: Guanadrel is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of guanadrel in children with use
        in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Dizziness or faintness may be more likely to occur in the elderly, who
        are usually more sensitive to the effects of guanadrel.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Brofaromine
      - Clorgyline
      - Furazolidone
      - Iproniazid
      - Isocarboxazid
      - Lazabemide
      - Linezolid
      - Moclobemide
      - Nialamide
      - Pargyline
      - Phenelzine
      - Procarbazine
      - Rasagiline
      - Selegiline
      - Toloxatone
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Yohimbine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma (history of) or
      - Diarrhea or
      - Pheochromocytoma or
      - Stomach ulcer (history of)—Guanadrel may worsen these conditions
    - type: list
      ordered: false
      items:
      - Fever—Effects of guanadrel may be increased
    - type: list
      ordered: false
      items:
      - Heart attack or stroke (recent) or
      - Heart or blood vessel disease—Lowering blood pressure may make problems resulting
        from these conditions worse
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: In addition to the use of the medicine your doctor has prescribed, treatment
      for your high blood pressure may include weight control and care in the types
      of foods you eat, especially foods high in sodium. Your doctor will tell you
      which of these are most important for you. You should check with your doctor
      before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that guanadrel will not cure your high blood pressure but it does
      help control it. Therefore, you must continue to take it as directed if you
      expect to lower your blood pressure and keep it down. You may have to take high
      blood pressure medicine for the rest of your life . If high blood pressure is
      not treated, it can cause serious problems such as heart failure, blood vessel
      disease, stroke, or kidney disease.
  - type: paragraph
    text: To help you remember to take your medicine, try to get into the habit of
      taking it at the same time each day.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For high blood pressure: Adults—At first,
        5 milligrams (mg) two times a day. Then, your doctor may increase your dose
        to 20 to 75 mg a day, divided into two to four doses. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—At first, 5 milligrams (mg) two times a day.
        Then, your doctor may increase your dose to 20 to 75 mg a day, divided into
        two to four doses. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 5 milligrams (mg) two times a day. Then, your doctor may
        increase your dose to 20 to 75 mg a day, divided into two to four doses.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      make sure that this medicine is working properly.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up from a lying or sitting position. This may be more likely to occur in the
      morning. Getting up slowly may help. If you feel dizzy, sit or lie down. When
      you get up from lying down, sit on the edge of the bed with your feet dangling
      for 1 or 2 minutes. Then stand up slowly. If the problem continues or gets worse,
      check with your doctor.
  - type: paragraph
    text: The dizziness, lightheadedness, or fainting is also more likely to occur
      if you drink alcohol, stand for long periods of time, exercise, or if the weather
      is hot. While you are taking guanadrel, be careful to limit the amount of alcohol
      you drink. Also, use extra care during exercise or hot weather or if you must
      stand for long periods of time.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes over-the-counter (nonprescription) medicines for appetite
      control, asthma, colds, cough, hay fever, or sinus problems, since they may
      tend to increase your blood pressure.
  - type: paragraph
    text: Before having any kind of surgery (including dental surgery) or emergency
      treatment, tell the medical doctor or dentist in charge that you are taking
      guanadrel.
  - type: paragraph
    text: Tell your doctor if you get a fever since that may change the amount of
      medicine you have to take.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Get emergency help immediately if any of the following symptoms of overdose
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - dizziness or faintness (severe)
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Swelling of feet or lower legs
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - shortness of breath
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty in ejaculating
      - dizziness, lightheadedness, or fainting, especially when getting up from a
        lying or sitting position
      - drowsiness
      - unusual tiredness or weakness
      - weight gain or loss (excessive)
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea or increase in bowel movements
      - dryness of mouth
      - headache
      - muscle pain or tremors
      - nighttime urination
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
