      - loss of appetite
      - lump in the breast or under the arm
      - nausea and vomiting
      - nervousness
      - pain or feeling of pressure in the pelvis
      - persistent crusting or scaling of the nipple
      - pounding in the ears
      - rash
      - recurrent fever
      - redness of the skin
      - redness or swelling of the breast
      - severe cramping of the uterus
      - slow or fast heartbeat
      - sore on the skin of the breast that does not heal
      - swelling of the eyelids, face, lips, hands, or feet
      - tightness in the chest
      - troubled breathing or swallowing
      - unpleasant breath odor
      - unusual tiredness or weakness
      - vaginal bleeding
      - vomiting of blood
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - back pain
      - belching
      - body aches or pain
      - breast pain
      - burning, itching, redness, skin rash, swelling, or soreness at the application
