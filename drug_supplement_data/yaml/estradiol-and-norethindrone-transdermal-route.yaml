    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Abnormal or unusual vaginal bleeding or
      - Blood clots (eg, deep vein thrombosis, pulmonary embolism), active or history
        of or
      - Breast cancer, known or suspected, or a history of or
      - Heart attack, history of or
      - Liver disease or
      - Protein C, protein S, or other known blood clotting disorders or
      - Stroke, history of or
      - Tumors (estrogen-dependent), known or suspected—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Asthma or
      - Bone problems or
      - Diabetes or
      - Edema (fluid retention or body swelling) or
      - Endometriosis or
      - Epilepsy (seizures) or
      - Gallbladder disease or
      - Hereditary angioedema (swelling of the face, lips, tongue, or throat) or
      - Hypercalcemia (high calcium in the blood) or
      - Hypocalcemia (low calcium in the blood) or
      - Hypothyroidism (an underactive thyroid) or
      - Jaundice during pregnancy or from using hormonal therapy in the past or
      - Liver tumors or
      - Migraine headache or
      - Porphyria (an enzyme problem) or
      - Systemic lupus erythematosus (SLE)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Heart disease or
      - Hypercholesterolemia (high cholesterol or fats in the blood) or
      - Hypertension (high blood pressure) or
      - Hypertriglyceridemia (high triglycerides or fats in the blood) or
      - Obesity, or history of or
      - Prolonged periods of immobilization—Use with caution. These conditions may
        increase risk for more serious side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine exactly as directed by your
      doctor . Do not use more of it, do not use it more often, and do not use it
      for a longer time than your doctor ordered. To do so may cause unwanted side
      effects.
  - type: paragraph
    text: This medicine comes with a patient information leaflet. Read and follow
      the instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Before starting CombiPatch® therapy, you may need to tell your doctor if
      you are currently using continuous estrogen or combination estrogen plus progestin
      therapy. This will allow your doctor to determine when to start your treatment.
  - type: paragraph
    text: You may have monthly bleeding or spotting at the completion of each cycle.
  - type: paragraph
    text: This transdermal patch system is to be applied on the skin of the lower
      abdomen (lower stomach area) two times a week, depending on your dosing regimen
      (either continuous combined regimen or continuous sequential regimen), as advised
      by your doctor.
  - type: paragraph
    text: 'To use the skin patch :'
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and water before and after you use this medicine.
    - Carefully tear open the pouch when you are ready to put the patch on your skin.
      Do not cut it.
    - Peel off the backing from the patch and apply the patch to a clean, dry, and
      hair-free area of the lower stomach. This area must be free of powder, oil,
      or lotion for the patch to stick on to your skin.
    - Press the patch firmly in place with your hand for about 10 seconds.
    - Do not apply the patch on the breast or over any skin folds. Do not apply the
      patch on oily, broken, burned, or irritated skin, or areas with skin conditions
      (such as birth marks, tattoos). Avoid applying the patch on the waistline or
      other places where tight clothing may rub it off.
    - Wear the patch at all times until it is time to put on a new patch. Do not expose
      it to the sun for long periods of time.
    - When replacing your patch, make sure to apply the new patch to a different area
      of your lower abdomen. Wait at least 1 week before applying a patch to the same
      area.
    - When changing a patch, slowly peel it off from your skin. If you have any patch
      adhesive left on your skin, allow it to dry for 15 minutes and gently rub the
      sticky area with oil or lotion to remove it. It is best to change your patch
      on the same days of each week to help you remember.
    - You may take a bath, shower, or swim while using this medicine. Doing so will
      not affect the patch.
    - If a patch falls off, just put it back on a different area. If the patch does
      not stick completely, put on a new patch but continue to follow your original
      schedule for changing your patch.
    - 'To throw away a used patch: Fold the patch in half with the sticky side together
      and place it in a sturdy child-proof container. Throw this container in the
      trash away from children and pets. Do not flush the patch down the toilet.'
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For transdermal dosage form (patch): For treatment of hot flashes, atrophic
        vaginitis caused by menopause: Continuous combined regimen: Adults—Apply 1
        CombiPatch® two times a week (every 3 to 4 days) for a 28-day cycle. One CombiPatch®
        contains 0.05 milligrams (mg) of estradiol and 0.14 or 0.25 mg of norethindrone).
        Children—Use is not recommended. Continuous sequential regimen: Adults—Apply
        0.05 milligram (mg) estradiol patch (Vivelle-Dot®) two times a week (every
        3 to 4 days) for the first 14 days of the 28-day cycle. Then, apply one CombiPatch®
        two times a week (every 3 to 4 days) for the next 14 days of the 28-day cycle.
        One CombiPatch® contains 0.05 milligrams (mg) of estradiol and 0.14 or 0.25
        mg of norethindrone). Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For treatment of hot flashes, atrophic vaginitis caused by menopause: Continuous
        combined regimen: Adults—Apply 1 CombiPatch® two times a week (every 3 to
        4 days) for a 28-day cycle. One CombiPatch® contains 0.05 milligrams (mg)
        of estradiol and 0.14 or 0.25 mg of norethindrone). Children—Use is not recommended.
        Continuous sequential regimen: Adults—Apply 0.05 milligram (mg) estradiol
        patch (Vivelle-Dot®) two times a week (every 3 to 4 days) for the first 14
        days of the 28-day cycle. Then, apply one CombiPatch® two times a week (every
        3 to 4 days) for the next 14 days of the 28-day cycle. One CombiPatch® contains
        0.05 milligrams (mg) of estradiol and 0.14 or 0.25 mg of norethindrone). Children—Use
        is not recommended.'
    - type: list
      ordered: false
      items:
      - 'Continuous combined regimen: Adults—Apply 1 CombiPatch® two times a week
        (every 3 to 4 days) for a 28-day cycle. One CombiPatch® contains 0.05 milligrams
        (mg) of estradiol and 0.14 or 0.25 mg of norethindrone). Children—Use is not
        recommended.'
      - 'Continuous sequential regimen: Adults—Apply 0.05 milligram (mg) estradiol
        patch (Vivelle-Dot®) two times a week (every 3 to 4 days) for the first 14
        days of the 28-day cycle. Then, apply one CombiPatch® two times a week (every
        3 to 4 days) for the next 14 days of the 28-day cycle. One CombiPatch® contains
        0.05 milligrams (mg) of estradiol and 0.14 or 0.25 mg of norethindrone). Children—Use
        is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—Apply 1 CombiPatch® two times a week (every 3 to 4 days) for a 28-day
        cycle. One CombiPatch® contains 0.05 milligrams (mg) of estradiol and 0.14
        or 0.25 mg of norethindrone).
      - Children—Use is not recommended.
    - type: list
      ordered: false
      items:
      - Adults—Apply 0.05 milligram (mg) estradiol patch (Vivelle-Dot®) two times
        a week (every 3 to 4 days) for the first 14 days of the 28-day cycle. Then,
        apply one CombiPatch® two times a week (every 3 to 4 days) for the next 14
        days of the 28-day cycle. One CombiPatch® contains 0.05 milligrams (mg) of
        estradiol and 0.14 or 0.25 mg of norethindrone).
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you forget to wear or change a patch, put one on as soon as you can.
        If it is almost time to put on your next patch, wait until then to apply a
        new patch and skip the one you missed. Do not apply extra patches to make
        up for a missed dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the patches at room temperature in a closed container, away from
        heat, moisture, and direct light.
    - type: paragraph
      text: Store the unopened pouches at room temperature for up to 6 months. Do
        not store the patch outside of its pouch.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and does not cause unwanted effects.
      Pelvic exam, breast exam, and mammogram (breast x-ray) may be needed to check
      for unwanted effects, unless your doctor tells you otherwise. Be sure to keep
      all appointments.
  - type: paragraph
    text: It is unlikely that a postmenopausal woman may become pregnant. But, you
      should know that using this medicine while you are pregnant could harm your
      unborn baby. If you think you have become pregnant while using the medicine,
      tell your doctor right away.
  - type: paragraph
    text: Using this medicine may increase your risk for having blood clots, strokes,
      or heart attacks. This risk may continue even after you stop using the medicine.
      Your risk for these serious problems is even greater if you have high blood
      pressure, high cholesterol in your blood, diabetes or are overweight or smoke
      cigarettes. Contact your doctor immediately if you experience chest pain, confusion,
      difficulty speaking, double vision, headaches, an inability to move arms, legs
      or facial muscle, or an inability to speak.
  - type: paragraph
    text: Using this medicine may increase your risk of endometrial cancer, breast
      cancer, or uterine cancer. Talk with your doctor about this risk. Check with
      your doctor immediately if your experience abnormal vaginal bleeding.
  - type: paragraph
    text: Do not use this medicine if you have had your uterus (womb) removed (hysterectomy)
      .
  - type: paragraph
    text: Using this medicine may increase your risk of dementia, especially in women
      65 years of age and older.
  - type: paragraph
    text: Check with your doctor immediately if severe headache or sudden loss of
      vision or any other change in vision occurs while you are using this medicine.
      Your doctor may want you to have your eyes checked by an ophthalmologist (eye
      doctor).
  - type: paragraph
    text: This medicine may cause serious types of allergic reactions, including anaphylaxis
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, hoarseness, lightheadedness
      or dizziness, trouble breathing, trouble swallowing, or any swelling of your
      hands, face, or mouth with this medicine.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine before you have surgery
      or if you need to stay in bed for an extended time. This medicine may affect
      the results of certain medical tests.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine. Grapefruit and grapefruit juice may change the amount of this medicine
      that is absorbed in the body.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - heavy non-menstrual vaginal bleeding
      - itching of the vagina or genital area
      - pain during sexual intercourse
      - rapid weight gain
      - thick, white vaginal discharge with no odor or with a mild odor
      - tingling of the hands or feet
      - unusual weight gain or loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough or hoarseness
      - fever or chills
      - lower back or side pain
      - painful or difficult urination
    subsections: []
