title: Iodine (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Aplicare One Tincture Of Iodine
    - type: paragraph
      text: Iodex
    - type: paragraph
      text: Iodoflex
    - type: paragraph
      text: Iodosorb
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Topical iodine is used to prevent and treat infections that may occur in
      minor scrapes and cuts. It works by killing bacteria that can cause infections.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tincture
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use of topical iodine is not recommended for newborn infants because it
        may cause skin and thyroid problems.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of topical
        iodine in the elderly with use in other age groups, this medicine is not expected
        to cause different side effects or problems in older people than it does in
        younger adults.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Animal bites or
      - Deep wounds or
      - Serious burns—The chance of side effects may be increased
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed.
  - type: paragraph
    text: This medicine is for external use only. Do not swallow it.
  - type: paragraph
    text: Keep this medicine away from the eyes because it may cause irritation. If
      you should accidentally get some in your eyes, wash it away with water immediately.
  - type: paragraph
    text: Do not use topical iodine on deep, puncture wounds, animal bites, or serious
      burns. To do so may increase the chance of side effects.
  - type: paragraph
    text: Do not cover the wound to which you have applied topical iodine with a tight
      dressing or bandage since this may increase the chance of side effects.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (tincture): For minor bacterial skin infections:
        Adults and children 1 month of age and over—Use when necessary, according
        to the directions on the label or your doctor''s instructions. Do not use
        for more than ten days. Infants and children under 1 month of age—Use is not
        recommended.'
    - type: list
      ordered: false
      items:
      - 'For minor bacterial skin infections: Adults and children 1 month of age and
        over—Use when necessary, according to the directions on the label or your
        doctor''s instructions. Do not use for more than ten days. Infants and children
        under 1 month of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children 1 month of age and over—Use when necessary, according
        to the directions on the label or your doctor's instructions. Do not use for
        more than ten days.
      - Infants and children under 1 month of age—Use is not recommended.
    - type: paragraph
      text: To help clear up your infection completely, it is very important that
        you keep using topical iodine for the full time of treatment. Do not miss
        any doses.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Check with your doctor if the skin problem for which you are using topical
      iodine becomes worse, or if you develop a constant irritation such as itching
      or burning that was not present before you started using this medicine.
  - type: paragraph
    text: This medicine can stain your skin and clothing. Alcohol may be used to remove
      iodine stain on the skin. Stains on clothing can be removed by washing and rinsing
      them in ammonia diluted with water. Stains on starched linens can be removed
      by washing them in soap and water.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, crusting, irritation, itching, or reddening of skin
    subsections: []
  - heading: Symptoms of overdose (when swallowed)
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - diarrhea
      - fever
      - nausea
      - not being able to pass urine
      - thirst, severe
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
