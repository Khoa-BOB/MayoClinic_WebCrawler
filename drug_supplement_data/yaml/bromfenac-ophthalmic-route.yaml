    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your eye doctor (ophthalmologist) check your progress
      at regular visits to make sure this medicine is working properly and to check
      for unwanted effects.
  - type: paragraph
    text: If your symptoms do not improve within a few days or if they become worse,
      check with your doctor.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you have a rash, itching, hives, hoarseness, shortness
      of breath, trouble breathing, trouble swallowing, or any swelling of your hands,
      face, or mouth after using this medicine.
  - type: paragraph
    text: Slow or delayed healing may occur while you are using this medicine. Ask
      your doctor before using this medicine together with a topical corticosteroid
      (eg, betamethasone, clobetasol, hydrocortisone, Lotrisone®).
  - type: paragraph
    text: Using this medicine may increase risk of having keratitis and corneal problems.
      Check with your eye doctor right away if you have blurred vision, changes in
      vision, or eye redness, irritation, or pain while using this medicine.
  - type: paragraph
    text: While applying the medicine, your eyes will probably sting or burn for a
      short time. This is to be expected.
  - type: paragraph
    text: Do not use other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - change in color vision
      - decreased vision or other changes in vision
      - difficulty seeing at night
      - eye pain
      - red, sore eyes
      - sensitivity to light
      - tearing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal sensation in the eye
      - burning or stinging of the eye
      - feeling of having something in the eye
      - headache
      - itching of the eyes
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
