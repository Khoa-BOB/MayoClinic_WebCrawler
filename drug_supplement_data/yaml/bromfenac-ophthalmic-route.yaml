    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to aspirin, phenylacetic acid, and other NSAIDs (eg, diclofenac, ibuprofen,
        naproxen, Advil®, Aleve®, Celebrex®, Voltaren®), history of or
      - Bleeding problems—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Asthma or
      - Sulfite allergy—Use with caution. This medicine contains sodium sulfite which
        may cause an allergic reaction in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Corneal (front part of the eye) denervation or
      - Corneal (front part of the eye) epithelial defects or
      - Diabetes or
      - Ocular (eye) surface diseases (eg, dry eye syndrome) or
      - Ocular (eye) surgeries, complicated or
      - Ocular (eye) surgeries, multiple within a short period of time or
      - Rheumatoid arthritis—Use with caution. May increase the risk of experiencing
        corneal problems.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use it for a longer time than your doctor
      ordered. To do so may increase the chance of too much medicine being absorbed
      into the body and the chance of side effects. This medicine is not for long-term
      use.
  - type: paragraph
    text: Keep using this medicine for at least 2 weeks unless your doctor tells you
      otherwise.
  - type: paragraph
    text: This medicine can be used with other ophthalmic (eye) medicines. Wait at
      least 5 minutes before using another eye medicine.
  - type: paragraph
    text: Remove contact lenses before you use the eye drops. Wait for at least 10
      minutes before putting the contact lenses back in.
  - type: paragraph
    text: 'To use the eye drops:'
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and water before and after you use this medicine.
    - Tilt the head back. Press your finger gently on the skin just beneath the lower
      eyelid and pull the lower eyelid away from the eye to make a space. Drop the
      medicine into this space. Let go of the eyelid and gently close the eyes. Do
      not blink. Keep the eyes closed and apply pressure to the inner corner of the
      eye with your finger for 1 or 2 minutes to allow the medicine to be absorbed
      by the eye.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
      Serious damage to the eye and possible loss of vision may result from using
      contaminated eye drops.
  - type: paragraph
    text: If you are using more than one eye product, apply these medicines at least
      5 minutes apart.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic dosage form (eye drops): For eye pain or swelling following
        cataract surgery: Adults— Bromsite™: Use one drop in the affected area two
        times a day (morning and evening) starting 1 day before cataract surgery,
        continued on the day of surgery, and for 14 days after the surgery. Prolensa®
        and Bromday®: Use one drop in the affected eye once a day starting 1 day before
        cataract surgery, continued on the day of surgery, and for 14 days after the
        surgery. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For eye pain or swelling following cataract surgery: Adults— Bromsite™: Use
        one drop in the affected area two times a day (morning and evening) starting
        1 day before cataract surgery, continued on the day of surgery, and for 14
        days after the surgery. Prolensa® and Bromday®: Use one drop in the affected
        eye once a day starting 1 day before cataract surgery, continued on the day
        of surgery, and for 14 days after the surgery. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults— Bromsite™: Use one drop in the affected area two times a day (morning
        and evening) starting 1 day before cataract surgery, continued on the day
        of surgery, and for 14 days after the surgery. Prolensa® and Bromday®: Use
        one drop in the affected eye once a day starting 1 day before cataract surgery,
