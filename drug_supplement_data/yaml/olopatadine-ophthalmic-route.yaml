    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your eye doctor will want to examine your or your child's eye(s) at regular
      visits to make sure the medicine is working properly and is not causing unwanted
      effects.
  - type: paragraph
    text: If your or your child's symptoms do not improve or if your condition becomes
      worse, check with your doctor.
  - type: paragraph
    text: This medicine should not be used for irritation caused by contact lenses.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - burning, dryness, stinging of the eye
      - eye redness, irritation, or pain
      - swelling of the eyelid, face, lips, or feet
      - trouble breathing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - runny or stuffy nose
      - sore throat
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - body or muscle aches or pain
      - change in taste
      - chills
      - cough
      - diarrhea
      - feeling of something in the eye
      - general feeling of discomfort or illness
      - increased cough
      - lack or loss of strength
      - loss of appetite
      - nausea
      - pain or tenderness around the eyes and cheekbones
      - redness of the eye or inside of the eyelid
      - sensitivity of the eyes to light
      - shivering
      - sneezing
      - sweating
      - tender, swollen glands in the neck
      - trouble sleeping
      - trouble swallowing
      - unusual tiredness or weakness
      - voice changes
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
