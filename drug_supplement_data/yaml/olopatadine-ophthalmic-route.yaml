title: Olopatadine (ophthalmic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Pataday
    - type: paragraph
      text: Patanol
    - type: paragraph
      text: Pazeo
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Olopatadine ophthalmic (eye) drops is used to treat itching of the eye caused
      by a condition known as allergic conjunctivitis (pink eye). This medicine is
      also used to treat eye itching or redness caused by pollen, ragweed, grass,
      animal hair, or dander. It works by preventing the effects of certain inflammatory
      substances (eg, histamine), which are produced by cells in your eyes and sometimes
      cause allergic reactions.
  - type: paragraph
    text: Olopatadine 0.1% ophthalmic solution and olopatadine 0.2% ophthalmic solution
      are available only with your doctor's prescription.
  - type: paragraph
    text: Pataday® 0.1% ophthalmic solution , Pataday® 0.2% ophthalmic solution ,
      and Pataday® 0.7% ophthalmic solution are available without a prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of olopatadine eye drops in children.
        However, safety and efficacy of olopatadine 0.1% ophthalmic solution have
        not been established in children younger than 3 years of age, and of olopatadine
        0.2% ophthalmic solution , Pataday® 0.1% ophthalmic solution , Pataday®  0.2%
        ophthalmic solution , or Pataday® 0.7% ophthalmic solution have not been established
        in children younger than 2 years of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of olopatadine eye drops in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amifampridine
      - Bupropion
      - Clomipramine
      - Donepezil
      - Hydroxychloroquine
      - Pitolisant
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your eye doctor will tell you how much of this medicine to use and how often.
      Do not use more medicine or use it more often than your doctor tells you to.
  - type: paragraph
    text: If you are wearing contact lenses, remove them before putting the drops
      in your eyes. Wait at least 10 minutes after using this medicine before putting
      them back in. Do not wear contact lenses if your eyes are red.
  - type: paragraph
    text: Use only the brand of this medicine that your doctor prescribed. Different
      brands may not work the same way.
  - type: paragraph
    text: 'To use the eye drops:'
  - type: list
    ordered: false
    items:
    - First, wash your hands. Tilt your head back and, pressing your finger gently
      on the skin just beneath the lower eyelid, pull the lower eyelid away from the
      eye to make a space. Drop the medicine into this space. Let go of the eyelid
      and gently close the eye. Do not blink. Keep the eye closed for 1 or 2 minutes
      to allow the medicine to cover the eye.
    - If you think you did not get the drop of medicine into your eye properly, repeat
      the directions with another drop.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
  - type: paragraph
    text: Do not use if the liquid changes color or become cloudy.
  - type: paragraph
    text: If you are also using other eye products while using Pataday® , wait at
      least 5 minutes between each product.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For eye itching caused by allergic conjunctivitis: For ophthalmic dosage
        form (eye drops): Olopatadine 0.1% solution: Adults and children 3 years of
        age and older—Put one drop in each affected eye two times a day, at least
        6 to 8 hours apart. Children younger than 3 years of age—Use and dose must
        be determined by your doctor. Olopatadine 0.2% solution: Adults and children
        2 years of age and older—Put one drop in each affected eye once a day. Children
        younger than 2 years of age—Use and dose must be determined by your doctor.'
      - 'For eye itching or redness caused by pollen, ragweed, grass, animal hair,
        or dander: For ophthalmic dosage form (eye drops): Pataday® 0.1% ophthalmic
        solution: Adults and children 2 years of age and older—Put one drop in each
        affected eye two times a day, at least 6 to 8 hours apart. Children younger
        than 2 years of age—Use and dose must be determined by your doctor. Pataday®
        0.2% ophthalmic solution or Pataday® 0.7% ophthalmic solution: Adults and
        children 2 years of age and older—Put one drop in each affected eye once a
        day. Children younger than 2 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
