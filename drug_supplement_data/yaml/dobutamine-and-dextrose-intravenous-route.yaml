title: Dobutamine and dextrose (intravenous route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Dobutamine and dextrose combination injection is used treat heart failure
      and helps the heart pump blood.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of dobutamine and dextrose combination
        injection in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of dobutamine and dextrose combination
        injection in the elderly. However, elderly patients are more likely to have
        age-related liver, kidney, or heart problems, which may require caution and
        an adjustment in the dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Dihydroergotamine
      - Isocarboxazid
      - Linezolid
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Entacapone
      - Opicapone
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Carvedilol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to corn, corn products, or sulfites or
      - Heart disease (eg, idiopathic hypertrophic subaortic stenosis)—Should not
        be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Heart rhythm problems or
      - Hypertension (high blood pressure)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Hypovolemia (low blood volume)—Should be corrected first before starting treatment
        with this medicine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given as a needle placed into one of your veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress closely while
      receiving the medicine to make sure it is working properly. Blood tests are
      needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause increase in blood pressure or heart rate. Check
      with your doctor right away if you have blurred vision, dizziness, headache,
      nosebleeds, or numbness or tingling in the face, arms, or legs.
  - type: paragraph
    text: This medicine may cause serious allergic and skin reactions, including anaphylaxis,
      eosinophilia, and bronchospasms, which can be life-threatening and require immediate
      medical attention. Check with your doctor right away if you have black, tarry
      stools, chest pain or tightness, chills, cough, difficulty swallowing, dizziness,
      fast heartbeat, fever, hives, itching, skin rash, painful or difficult urination,
      puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue,
      sore throat, sores, ulcers, or white spots on the lips or in the mouth, swollen
      glands, trouble breathing, unusual bleeding or bruising, or unusual tiredness
      or weakness.
  - type: paragraph
    text: This medicine may cause fluid overload, which can lead to electrolyte problems,
      overhydration, or pulmonary edema (fluid in the lungs). Talk with your doctor
      right away if you have a decrease in the amount of urine output, noisy, rattling
      breathing, trouble breathing, swelling of the fingers, hands, feet, or lower
      legs, or weight gain.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - headache
      - increased heart rate
      - numbness or tingling in the arms or legs
      - trouble thinking, speaking, or walking
      - weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - fast, irregular, pounding, or racing heartbeat or pulse
      - trouble breathing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back, tarry stools
      - bluish color
      - blurred vision
      - changes in skin color
      - chest discomfort or tightness
      - chills
      - confusion
      - cough
      - difficulty swallowing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fever
      - hives, itching, skin rash
      - painful or difficult urination
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - sweating
      - swelling of the fingers, hands, feet, or lower legs
      - swollen glands
      - unusual bleeding or bruising
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
