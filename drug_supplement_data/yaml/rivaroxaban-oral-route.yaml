        a day, taken with or without food. Weighing 8 kg to 9.9 kg—1.6 mg 2 times
        a day, taken with or without food. Weighing 7 kg to 7.9 kg—1.1 mg 2 times
        a day, taken with or without food.
      - Children younger than 2 years of age of age and weighing less than 7 kg—Use
        and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Weighing 50 kilograms (kg) or more—10 milligrams (mg) once a day, taken with
        or without food.
      - Weighing 30 kg to 49.9 kg—7.5 mg once a day, taken with or without food.
      - Weighing 20 kg to 29.9 kg—2.5 mg 2 times a day, taken with or without food.
      - Weighing 12 kg to 19.9 kg—2 mg 2 times a day, taken with or without food.
      - Weighing 10 kg to 11.9 kg—1.7 mg 2 times a day, taken with or without food.
      - Weighing 8 kg to 9.9 kg—1.6 mg 2 times a day, taken with or without food.
      - Weighing 7 kg to 7.9 kg—1.1 mg 2 times a day, taken with or without food.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: This medicine needs to be given on a fixed schedule. If you miss a dose
        or forget to use your medicine, call your doctor or pharmacist for instructions.
    - type: paragraph
      text: 'Once-daily dosing : If you miss a dose, take it as soon as you can on
        the same day. Then take your regularly scheduled dose the next day.'
    - type: paragraph
      text: 'Twice-daily dosing to prevent serious heart or blood vessel problems
        (2.5 mg tablet) : If you miss a dose, skip the missed dose and take your next
        dose at your usual time.'
    - type: paragraph
      text: 'Twice-daily dosing to treat a blood clot (oral liquid or 15 mg tablet)
        : If you miss a dose, take it as soon as you can on the same day. You may
        take 2 doses at the same time to make up for the missed dose. Then take your
        regularly scheduled doses the next day.'
    - type: paragraph
      text: 'Thrice-daily dosing : If you miss a dose, skip the missed dose, then
        take your regularly scheduled doses the next day.'
    - type: paragraph
      text: 'Oral liquid : If your child vomits or spits up right after or within
        30 minutes after taking the medicine, give another dose. If it is more than
        30 minutes, give the next dose at the regular time. Call your doctor right
        away if your child vomits or spits out the medicine repeatedly.'
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: You may store the crushed tablet with applesauce or water mixture for
        up to 4 hours.
    - type: paragraph
      text: Throw away the oral liquid 60 days after opening.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests will be
      needed to check for unwanted effects. Be sure to keep all appointments.
  - type: paragraph
    text: You may bleed or bruise more easily while you are using this medicine. Stay
      away from rough sports or other situations where you could be bruised, cut,
      or injured. Be careful when using sharp objects, including razors and fingernail
      clippers. Avoid nose picking and forceful nose blowing.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine.
  - type: paragraph
    text: This medicine may cause bleeding problems. This risk is higher if you have
      a catheter in your back for pain medicine or anesthesia (sometimes called an
      "epidural"), or if you have kidney problems. The risk of bleeding increases
      if your kidney problems get worse. Check with your doctor right away if you
      have any unusual bleeding or bruising, black, tarry stools, bleeding gums, blood
      in the urine or stools, tingling, numbness, or weakness of the lower legs, or
      pinpoint red spots on your skin.
  - type: paragraph
    text: Check with your doctor right away if you have a decreased urine output,
      confusion, dizziness, nausea, rapid weight gain, swelling of the face, ankles,
      or hands, or unusual tiredness or weakness after receiving the medicine. These
      may be symptoms of a serious kidney problem.
  - type: paragraph
    text: Be careful when using a regular toothbrush, dental floss, or toothpick.
      Your medical doctor, dentist, or nurse may recommend other ways to clean your
      teeth and gums. Check with your medical doctor before having any dental work
      done.
  - type: paragraph
    text: Do not suddenly stop taking this medicine without first checking with your
      doctor . Doing so, may increase your risk of having a stroke.
  - type: paragraph
    text: Make sure your doctor knows if you are pregnant or planning to become pregnant
      during treatment with this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - bleeding gums
      - bloody stools
      - bowel or bladder dysfunction
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - coughing up blood
      - difficulty with breathing or swallowing
      - dizziness
      - headache
      - increased menstrual flow or vaginal bleeding
      - leg weakness
      - nosebleeds
      - numbness
      - paralysis
      - prolonged bleeding from cuts
      - red or black, tarry stools
      - red or dark brown urine
      - vomiting of blood or material that looks like coffee grounds
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fainting
      - pain in the arms or legs
      - wound secretion
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning feeling while urinating
      - difficult or painful urination
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - blurred vision
      - chest tightness
      - chills
      - clay-colored stools
      - cough
      - dark urine
      - diarrhea
      - fast or irregular heartbeat
      - fever with or without chills
      - general feeling of tiredness or weakness
      - hives, itching, skin rash
      - hoarseness
      - joint or muscle pain
      - loss of appetite
      - lower back or side pain
      - nausea
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - severe headache
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach pain or swelling
      - unpleasant breath odor
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blisters
      - muscle spasm
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
