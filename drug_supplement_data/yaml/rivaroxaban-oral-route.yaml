title: Rivaroxaban (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Xarelto
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Rivaroxaban is used to treat and prevent deep venous thrombosis (DVT), a
      condition in which harmful blood clots form in the blood vessels of the legs.
      These blood clots can travel to the lungs and can become lodged in the blood
      vessels of the lungs, causing a condition called pulmonary embolism (PE). This
      medicine is used for several days after hip or knee replacement surgery while
      you are unable to walk. It is during this time that blood clots are most likely
      to form. It also reduces the risk of blood clots occurring again in patients
      who are still at risk for DVT or PE after receiving treatment for at least 6
      months.
  - type: paragraph
    text: Rivaroxaban is also used to prevent stroke and blood clots in patients with
      certain heart rhythm problems (eg, nonvalvular atrial fibrillation). It is also
      used together with aspirin to decrease the risk of serious heart problems, heart
      attack, and stroke in patients with coronary artery disease (a condition where
      the blood supply to the heart is reduced or blocked). This medicine is also
      used together with aspirin to lower the risk of sudden decrease in blood flow
      to the legs, major amputation, heart attack, or stroke in patients with peripheral
      artery disease (a condition where the blood flow to the legs is reduced), including
      patients who have had a recent surgery to improve blood flow to the legs. This
      medicine is also used to prevent venous thromboembolism (VTE) in certain patients
      that are hospitalized for an acute illness and after discharge who are at risk
      of getting blood clots because of decreased ability to move around (mobility)
      and who do not have a high risk of bleeding. It is also used to treat or reduce
      the risk of venous thromboembolism (VTE) after receiving at least 5 days of
      medicine to treat blood clots and helps prevent blood clots in patients with
      congenital heart disease after undergoing the Fontan procedure.
  - type: paragraph
    text: Rivaroxaban is a factor Xa inhibitor, an anticoagulant. It works by decreasing
      the clotting ability of the blood and helps prevent harmful clots from forming
      in the blood vessels.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of rivaroxaban to treat and prevent
        venous thromboembolism in children and to prevent blood clots in children
        2 years of age with congenital heart disease . Safety and efficacy have been
        established. Use is not recommended in children younger than 6 months of age
        who were less than 37 weeks of growth at birth, had less than 10 days of oral
        feeding, or weighing less than 2.6 kilograms (kg).
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of rivaroxaban in the elderly. However,
        elderly patients are more likely to have bleeding and blood clotting problems,
        which may require caution and an adjustment in the dose for patients receiving
        rivaroxaban.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Defibrotide
      - Phenobarbital
      - Primidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Abciximab
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Aceclofenac
      - Acemetacin
      - Acenocoumarol
      - Adagrasib
      - Alipogene Tiparvovec
      - Alteplase, Recombinant
      - Amtolmetin Guacil
      - Anagrelide
      - Anistreplase
      - Apalutamide
      - Apixaban
      - Ardeparin
      - Argatroban
      - Aspirin
      - Atazanavir
      - Avacopan
      - Bemiparin
      - Berotralstat
      - Betrixaban
      - Bivalirudin
      - Boceprevir
      - Bromfenac
      - Bufexamac
      - Cangrelor
      - Caplacizumab-yhdp
      - Capmatinib
      - Carbamazepine
      - Celecoxib
      - Ceritinib
      - Certoparin
      - Choline Salicylate
      - Cilostazol
      - Citalopram
      - Clonixin
      - Clopidogrel
      - Cobicistat
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Amiodarone
      - Betamethasone
      - Clarithromycin
      - Dexamethasone
      - Fluconazole
      - Hydrocortisone
      - Methylprednisolone
      - Prednisolone
      - Prednisone
      - Triamcinolone
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Antiphospholipid syndrome—Use is not recommended in patients with this condition.
    - type: list
      ordered: false
      items:
      - Bleeding problems, or history of or
      - Blood vessel problems or
      - Cancer or
      - Catheter insertion in the spine or
      - Liver disease, moderate or severe or
      - Lung problems (eg, bleeding, bronchiectasis, pulmonary cavitation), or history
        of or
      - Stomach or bowel ulcer or bleeding or
      - Stroke, recent or history of or
      - Surgery (eg, eye, brain, spine), recent or history of—Use with caution. The
        risk of bleeding may be increased.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease, moderate or severe—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Major bleeding, active or
      - Prosthetic heart valve—Should not be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine should come with a Medication Guide and patient instructions.
      Read and follow these instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: The 2.5 and 10 mg tablets can be taken with or without food. The 15 and
      20 mg tablets should be taken with food. Also, take this medicine at the same
      time each day.
  - type: paragraph
    text: 'If you are unable to swallow the tablets whole :'
  - type: list
    ordered: false
    items:
    - The 10 mg, 15 mg, or 20 mg tablets may be crushed and mixed with a small amount
      of applesauce. This must be taken right away followed by food.
    - 'If you are using a nasogastric tube or gastric feeding tube: The 10 mg, 15
      mg, or 20 mg tablets may be crushed and mixed in 50 milliliters (mL) of water
      before giving it via the tube. This must be followed by enteral feeding.'
  - type: paragraph
    text: If your child is unable to swallow the tablets whole , you may use the oral
      liquid.
  - type: paragraph
    text: 'To use the oral liquid:'
  - type: list
    ordered: false
    items:
    - Shake the bottle slowly for 10 seconds before each use.
    - Measure the medicine with the provided oral dosing syringe.
    - Ask your doctor if you should take it with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For prevention of deep venous thrombosis
        (hip replacement surgery): Adults—10 milligrams (mg) once a day for 35 days.
        The starting dose should be taken at least 6 to 10 hours after surgery. Children—Use
        and dose must be determined by your doctor. For prevention of deep venous
        thrombosis (knee replacement surgery): Adults—10 milligrams (mg) once a day
        for 12 days. The starting dose should be taken at least 6 to 10 hours after
        surgery. Children—Use and dose must be determined by your doctor. For prevention
        of reoccurring deep venous thrombosis and pulmonary embolism: Adults—10 milligrams
        (mg) once a day with or without food after at least 6 months of treatment
        with a blood thinner medicine. Children—Use and dose must be determined by
        your doctor. For prevention of heart attack, stroke, and serious heart problems
        in patients with coronary artery disease: Adults—2.5 milligrams (mg) 2 times
        a day together with aspirin (75 to 100 mg once a day), taken with or without
        food. Children—Use and dose must be determined by your doctor. For prevention
        of sudden decrease in blood flow to the legs, major amputation, heart attack,
        and stroke in patients with peripheral artery disease: Adults—2.5 milligrams
        (mg) 2 times a day together with aspirin (75 to 100 mg once a day), taken
        with or without food. Children—Use and dose must be determined by your doctor.
        For prevention of stroke and blood clots in patients with nonvalvular atrial
        fibrillation: Adults—15 or 20 milligrams (mg) once a day, taken with the evening
        meal. Children—Use and dose must be determined by your doctor. For prevention
        of blood clots in people who are hospitalized for an acute illness: Adults—10
        milligrams (mg) once a day in hospital and after hospital discharge for a
        total recommended duration of 31 to 39 days, taken with or without food. Children—Use
        and dose must be determined by your doctor. For treatment of deep venous thrombosis
        and pulmonary embolism: Adults—At first, 15 milligrams (mg) 2 times a day,
        taken with food for the first 21 days. Then, your doctor may give you 20 mg
        once a day, taken at the same time each day with food. Children—Use and dose
        must be determined by your doctor. For treatment and prevention of venous
        thromboembolism: Children 6 months of age and older weighing 30 kilograms
        (kg) or more—Dose is base on weight and must be determined by your doctor.
        Weighing 50 kilograms (kg) or more—20 milligrams (mg) once a day, taken with
        food. Weighing 30 kg to 49.9 kg—15 mg once a day, taken with food. Children
        6 months of age and older weighing less than 30 kg—Use the oral suspension.
        Children younger than 6 months of age—Use and dose must be determined by your
        doctor. For prevention of blood clots in patients with congenital heart disease
        after Fontan procedure: Children 2 years of age and older weighing 50 kilograms
        (kg) or more—Dose is base on weight and must be determined by your doctor.
        The dose usually 10 milligrams (mg) once a day, taken with or without food.
        Children 2 years of age and older weighing less than 50 kg—Use the oral suspension.
        Children younger than 2 years of age—Use and dose must be determined by your
        doctor.'
