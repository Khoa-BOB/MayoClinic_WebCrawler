title: Risperidone (intramuscular route, subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Perseris
    - type: paragraph
      text: Risperdal Consta
    - type: paragraph
      text: Risvan
    - type: paragraph
      text: Rykindo
    - type: paragraph
      text: Uzedy
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Risperidone injection is used to treat the symptoms of psychiatric (mental)
      disorders, including schizophrenia. Risperdal Consta® and Uzedy® are used alone
      or together with other medicines (eg, lithium or valproate) to treat patients
      with bipolar disorder. This medicine should not be used to treat behavioral
      problems in older adults who have dementia.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension, Extended Release
    - Powder for Suspension, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of risperidone injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Elderly patients may be especially sensitive to the effects of risperidone.
        This may increase the chance of having side effects during treatment. This
        medicine should not be used for behavioral problems in older adults with dementia.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of risperidone injection in the elderly.
        However, elderly patients are more likely to have age-related liver, kidney,
        or heart problems, which may require caution and an adjustment in the dose
        for patients receiving risperidone injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Bromopride
      - Cisapride
      - Dronedarone
      - Levoketoconazole
      - Levomethadyl
      - Mavorixafor
      - Mesoridazine
      - Metoclopramide
      - Pimozide
      - Piperaquine
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Acecainide
      - Adagrasib
      - Ajmaline
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Anagrelide
      - Apalutamide
      - Apomorphine
      - Apomorphine Hydrochloride
      - Aprindine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Azimilide
      - Azithromycin
      - Bedaquiline
      - Bretylium
      - Bromocriptine Mesylate
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Cabergoline
      - Carbamazepine
      - Celecoxib
      - Ceritinib
      - Chloral Hydrate
      - Chloroquine
      - Chlorpromazine
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Cimetidine
      - Lamotrigine
      - Midodrine
      - Ranitidine
      - Ritonavir
      - Valproic Acid
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergic reaction to paliperidone (Invega®), history of—Should not be used
        in patients with this condition.
    - type: list
      ordered: false
      items:
      - Alzheimer's disease or
      - Dehydration or
      - Heart attack, recent or history of or
      - Heart or blood vessel disease or
      - Heart failure, history of or
      - Heart rhythm problem, or a history of or
      - Hypotension (low blood pressure) or
      - Hypovolemia (low amount of blood) or
      - Stroke, history of or
      - Trouble with swallowing—May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Blood or bone marrow problems or
      - Bone problems (eg, osteodystrophy) or
      - Breast cancer, prolactin-dependent or
      - Diabetes or
      - Hyperglycemia (high blood sugar) or
      - Hyperprolactinemia (high prolactin in the blood) or
      - Neuroleptic malignant syndrome (NMS), history of or
      - Parkinson's disease or
      - Priapism (painful or prolonged erection of the penis) or
      - Seizures, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      It is given as a shot into one of your muscles or as shot under your skin (in
      the stomach area or upper arm only).
  - type: paragraph
    text: Perseris™ and Risvan™ are given once a month. Risperdal Consta® is usually
      given every 2 weeks. Uzedy® is given once a month or once every 2 months.
  - type: paragraph
    text: If you have never taken risperidone, your doctor will first give you an
      oral form of this medicine before starting treatment with Perseris™ , Risperdal
      Consta® , Risvan™ , or Uzedy® .
  - type: paragraph
    text: If you are receiving Risperdal Consta® , your doctor may switch you to Uzedy®
      5 weeks after the last dose of Risperdal Consta® .
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: This medicine needs to be given on a fixed schedule. If you miss a dose
        or forget to use your medicine, call your doctor or pharmacist for instructions.
    - type: paragraph
      text: Be sure to keep all appointments for the injections.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: This medicine may increase risk for stroke in elderly patients with dementia.
      Tell your doctor right away if you have confusion, difficulty in speaking, slow
      speech, inability to speak, inability to move the arms, legs, or facial muscles,
      double vision, or headache while using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have difficulty with breathing,
      fast heartbeat, high fever, high or low blood pressure, increased sweating,
      loss of bladder control, seizures, severe muscle stiffness, unusually pale skin,
      or tiredness. These could be symptoms of a serious condition called neuroleptic
      malignant syndrome (NMS).
  - type: paragraph
    text: This medicine may cause tardive dyskinesia (a movement disorder). Check
      with your doctor right away if you have lip smacking or puckering, puffing of
      the cheeks, rapid or worm-like movements of the tongue, uncontrolled chewing
      movements, or uncontrolled movements of the arms and legs.
  - type: paragraph
    text: This medicine may increase the amount of sugar in your blood. Check with
      your doctor right away if you have blurred vision, dry mouth, flushed, dry skin,
      increased hunger, increased thirst or increased urination, nausea, sweating,
      trouble breathing, unexplained weight loss, unusual tiredness or weakness, or
      vomiting. If you have diabetes, you may notice a change in the results of your
      urine or blood sugar tests. If you have any questions, check with your doctor.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up suddenly from a lying or sitting position. Getting up slowly may help. If
      this problem continues or gets worse, check with your doctor.
  - type: paragraph
    text: Risperidone injection can temporarily lower the number of white blood cells
      in your blood, increasing the chance of getting an infection. If you can, avoid
      people with infections. Check with your doctor immediately if you think you
      are getting an infection or if you get a fever or chills, cough or hoarseness,
      lower back or side pain, or painful or difficult urination.
  - type: paragraph
    text: This medicine may cause drowsiness, trouble with thinking, or trouble with
      controlling body movements, which may lead to falls, fractures, or other injuries.
      Do not drive or do anything else that could be dangerous until you know how
      this medicine affects you .
  - type: paragraph
    text: This medicine may make it more difficult for your body to cool itself down.
      Use care not to become overheated during exercise or hot weather since overheating
      may result in heat stroke . Also, use extra care not to become too cold while
      you are receiving risperidone injection. If you become too cold, you may feel
      drowsy, confused, or clumsy.
  - type: paragraph
    text: This medicine may increase your weight. Your doctor may need to check your
      weight on a regular basis while you are receiving this medicine.
  - type: paragraph
    text: Check with your doctor before using this medicine with alcohol or other
      medicines that affect the central nervous system (CNS) . The use of alcohol
      or other medicines that affect the CNS with risperidone may worsen the side
      effects of this medicine, such as dizziness, poor concentration, drowsiness,
      unusual dreams, and trouble with sleeping. Some examples of medicines that affect
      the CNS are antihistamines or medicine for allergies or colds, sedatives, tranquilizers,
      or sleeping medicines, medicine for depression, medicine for anxiety, prescription
      pain medicine or narcotics, medicine for attention deficit and hyperactivity
      disorder, medicine for seizures or barbiturates, muscle relaxants, or anesthetics,
      including some dental anesthetics.
  - type: paragraph
    text: This medicine may increase prolactin blood levels if used for a long time.
      Check with your doctor if you have breast swelling or soreness, unusual breast
      milk production, absent, missed, or irregular menstrual periods, stopping of
      menstrual bleeding, loss in sexual ability, desire, drive, or performance, decreased
      interest in sexual intercourse, or an inability to have or keep an erection.
  - type: paragraph
    text: If you plan to have children, talk with your doctor before receiving this
      medicine. Some female patients receiving this medicine have become infertile
      (unable to have children).
  - type: paragraph
    text: Avoid rubbing, massaging, or placing belts or waistbands on the injection
      site during treatment with Perseris™ .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Aggressive behavior
      - agitation
      - anxiety
      - changes in vision, including blurred vision
      - difficulty concentrating
      - difficulty speaking or swallowing
      - inability to move the eyes
      - increase in amount of urine
      - loss of balance control
      - mask-like face
      - memory problems
      - muscle spasms of the face, neck, and back
      - problems with urination
      - restlessness or need to keep moving (severe)
      - shuffling walk
      - skin rash or itching
      - stiffness or weakness of the arms or legs
      - tic-like or twitching movements
      - trembling and shaking of the fingers and hands
      - trouble sleeping
      - twisting body movements
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - chest pain
      - speech or vision problems
      - sudden weakness or numbness in the face, arms, or legs
    subsections: []
  - heading: Rare
