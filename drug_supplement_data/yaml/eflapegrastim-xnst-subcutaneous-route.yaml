title: Eflapegrastim-xnst (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Rolvedon
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Eflapegrastim-xnst injection is used to treat neutropenia (low white blood
      cells) that is caused by cancer medicines. It is a synthetic (man-made) form
      of a substance that is naturally produced in your body called a colony stimulating
      factor. Eflapegrastim-xnst helps the bone marrow to make new white blood cells.
  - type: paragraph
    text: When certain cancer medicines are used to fight cancer cells, they also
      affect the white blood cells that fight infections. Eflapegrastim-xnst is used
      to lower the risk of getting an infection while you are being treated with cancer
      medicines.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of eflapegrastim-xnst injection in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of eflapegrastim-xnst injection in
        the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bone marrow cancer or other bone marrow problems or
      - Glomerulonephritis (kidney disease) or
      - Leukocytosis (high white blood cell count) or
      - Lung disease or breathing problems or
      - Sickle cell disease (red blood cell disease) or
      - Thrombocytopenia (low platelets in the blood)—Use with caution. May make these
        conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional may give you this medicine.
      It is given as a shot under the skin of your upper outer arm, upper outer buttock,
      stomach, or upper outer thigh. You or your caregiver may be trained to prepare
      and inject this medicine at home. Be sure that you understand how to use it.
  - type: paragraph
    text: If you use this medicine at home, you will be shown the body areas where
      this shot can be given. Use a different body area each time you give yourself
      a shot. Keep track of where you give each shot to make sure you rotate body
      areas. This will help prevent skin problems from the injections. Do not inject
      into skin areas that are tender, damaged, bruised, scarred, hard, or has moles,
      scars, birthmarks, or stretch marks.
  - type: paragraph
    text: This medicine comes with a patient information leaflet and patient instructions.
      Read and follow these instructions carefully. Ask your doctor if you have any
      questions about.
  - type: list
    ordered: false
    items:
    - How to prepare the injection.
    - The proper use of disposable syringes.
    - How to give the injection.
    - How long the injection can be stored at home.
  - type: paragraph
    text: Allow the medicine to warm to room temperature for 30 minutes before using
      it. Do not warm it by using a heat source or in any other way. Do not shake.
      Do not use if it has been dropped on a hard surface.
  - type: paragraph
    text: Check the liquid in the prefilled syringe. It should be clear and colorless.
      Do not use it if it is discolored, cloudy, or if you see lumps, flakes, or particles
      in it.
  - type: paragraph
    text: Do not use this medicine between 14 days before and 24 hours after receiving
      chemotherapy.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injectable dosage form (prefilled syringe): For neutropenia: Adults—13.2
        milligrams (mg) as a single injection under the skin once every cancer treatment
        cycle. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For neutropenia: Adults—13.2 milligrams (mg) as a single injection under
        the skin once every cancer treatment cycle. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—13.2 milligrams (mg) as a single injection under the skin once every
        cancer treatment cycle.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Protect from light. Throw this medicine away if it has been frozen or
        if it has been left at room temperature for longer than 12 hours.
    - type: paragraph
      text: Throw away used needles in a hard, closed container where the needles
        cannot poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: Check with your doctor right away at the first sign of an infection, including
      fever, chills, cough, sore throat, or unusual tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you are having pain in the upper left
      part of your stomach or at the tip of the left shoulder. This could be a symptom
      of a serious side effect with the spleen.
  - type: paragraph
    text: Check with your doctor right away if you develop a fever, chest pain or
      tightness, or trouble breathing. These could be symptoms of a serious lung condition
      called acute respiratory distress syndrome (ARDS).
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Tell
      your doctor right away if you have a rash, itching skin, dizziness, lightheadedness,
      or fainting, swelling of the face, tongue, or throat, trouble breathing, or
      chest pain after you receive the medicine.
  - type: paragraph
    text: This medicine may cause kidney problems. Call your doctor right away if
      you have swelling in your face or ankles, blood in the urine, or decrease in
      how much or how often you urinate.
  - type: paragraph
    text: This medicine may cause a condition called capillary leak syndrome. It can
      cause fluid to leak from the blood vessels into your body's tissues. Call your
      doctor right away if you have swelling or puffiness and are urinating less often,
      trouble breathing, feeling of fullness, dizziness, or feeling faint.
  - type: paragraph
    text: This medicine lowers the number of some types of blood cells in your body.
      Because of this, you may bleed more easily. Wash your hands often. Stay away
      from rough sports or other situations where you could be bruised, cut, or injured.
      Brush and floss your teeth gently. Be careful when using sharp objects, including
      razors and fingernail clippers. Check with your doctor right away if you have
      black or tarry stools, bleeding gums, blood in the urine or stools, pinpoint
      red spots on the skin, or unusual bleeding or bruising after receiving this
      medicine.
  - type: paragraph
    text: This medicine may cause aortitis (inflammation of the aorta, the largest
      artery in the body). Check with your doctor right away if you have fever, stomach
      pain, unusual tiredness or weakness, or back pain.
  - type: paragraph
    text: This medicine may cause blood or bone marrow problems (eg, myelodysplastic
      syndrome, acute myeloid leukemia) in patients with breast or lung cancer. Check
      with your doctor right away if you have chest pain, chills, cough or hoarseness,
      fever, lower back or side pain, painful or difficult urination, sores, ulcers,
      or white spots on the lips or in the mouth, swollen glands, unusual bleeding
      or bruising, or unusual tiredness or weakness.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are using this medicine. The results of some tests (eg, bone tests) may
      be affected by this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - blood in the urine or stools
      - bone pain
      - pain in the arms or legs
      - pale skin
      - pinpoint red spots on the skin
      - stomach pain
      - tingling of the hands or feet
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - unusual weight gain or loss
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - blue lips, fingernails, or skin
      - blurred vision
      - change in the amount of urine
      - chest pain or tightness
      - chills
      - cloudy or bloody urine
      - cough
      - difficult or fast breathing
      - difficulty swallowing
      - dizziness
      - eye pain
      - fainting or lightheadedness
      - fast heartbeat
      - feeling of fullness
      - fever
      - fever sores on the skin
      - general feeling of discomfort or illness
      - headache
      - hives, itching, skin rash
      - lower back or side pain
      - nausea
      - nervousness
      - pain spreading to the left shoulder
      - painful or difficult urination
      - pounding in the ears
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness of the skin
      - slow or fast heartbeat
      - sore throat
      - sores, welts, or blisters
      - swelling of the hands, ankles, feet, or lower legs
      - ulcers or white spots on the lips or in the mouth
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased appetite
      - diarrhea
      - feeling of warmth
      - muscle or joint pain
      - redness of the face, neck, arms and occasionally, upper chest
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
