title: Rubella and mumps virus vaccine live (intramuscular route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Rubella and mumps virus vaccine live is an active immunizing agent used
      to prevent infection by the rubella and mumps viruses. It works by causing your
      body to produce its own protection (antibodies) against the virus.
  - type: paragraph
    text: Rubella (also known as German measles) is a serious infection that causes
      miscarriages, stillbirths, or birth defects in unborn babies when pregnant women
      get the disease.
  - type: paragraph
    text: Mumps is an infection that can cause serious problems, such as encephalitis
      and meningitis, which affect the brain. In addition, adolescent boys and men
      are very susceptible to a condition called orchitis, which causes pain and swelling
      in the testicles and scrotum and, in rare cases, sterility. Also, mumps infection
      can cause spontaneous abortion in women during the first 3 months of pregnancy.
  - type: paragraph
    text: While immunization against rubella and mumps is recommended for all persons
      12 months of age and older, it is especially important for women of childbearing
      age and persons traveling outside the U.S.
  - type: paragraph
    text: If rubella and mumps virus vaccine live is to be given to a child, the child
      should be at least 12 months of age. This is to make sure the vaccine is effective.
      In a child less than 12 months of age, antibodies from the mother may prevent
      the vaccine from working.
  - type: paragraph
    text: This vaccine is to be administered only by or under the supervision of your
      doctor or other health care professional.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use of this vaccine is not recommended for infants younger than 12 months
        of age. Children who received the vaccine when younger than 12 months of age
        should receive another dose of vaccine at 12 to 15 months of age.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is not recommended.
        Your doctor may decide not to use this vaccine or change some of the other
        medicines you take.
