    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Immune deficiency condition (or family history of)—Condition may increase
        the chance and severity of side effects of the vaccine and/or may decrease
        the useful effects of the vaccine
    - type: list
      ordered: false
      items:
      - Severe illness with fever—The symptoms of the condition may be confused with
        the possible side effects of the vaccine
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: For prevention of rubella and mumps: Adults and
        children 12 months of age and older—One dose injected under the skin. Children
        up to 12 months of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For prevention of rubella and mumps: Adults and children 12 months of age
        and older—One dose injected under the skin. Children up to 12 months of age—Use
        is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 months of age and older—One dose injected under the
        skin.
      - Children up to 12 months of age—Use is not recommended.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Do not become pregnant for 3 months after receiving rubella and mumps virus
      vaccine live without first checking with your doctor . There may be a chance
      that this vaccine can cause birth defects.
  - type: paragraph
    text: 'Tell your doctor that you have received this vaccine:'
  - type: list
    ordered: false
    items:
    - If you are to receive blood products or immune globulins within 14 days of receiving
      this vaccine
    - If you are to receive this vaccine within 3 months of receiving blood products
      or immune globulin
    - If you are to receive a tuberculin skin test within 4 to 6 weeks after receiving
      this vaccine. The results of the test may be affected by this vaccine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Symptoms of allergic reaction
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty in breathing or swallowing
      - hives
      - itching, especially of feet or hands
      - reddening of skin, especially around ears
      - swelling of eyes, face, or inside of nose
      - unusual tiredness or weakness (sudden and severe)
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain or tenderness of eyes
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bruising or purple spots on skin
      - confusion
      - fever over 103 °F (39.4 °C)
      - headache (severe or continuing)
      - irritability
      - pain, numbness, or tingling of hands, arms, legs, or feet
      - pain, tenderness, or swelling in testicles and scrotum
      - stiff neck
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning or stinging at place of injection
      - skin rash
      - swelling of glands in neck
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Aches or pain in joints
      - headache (mild)
      - itching, swelling, redness, tenderness, or hard lump at place of injection
      - nausea
      - runny nose
      - sore throat
      - vague feeling of bodily discomfort
    - type: paragraph
      text: The above side effects (especially aches or pain in joints) are more likely
        to occur in adults, particularly women.
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
