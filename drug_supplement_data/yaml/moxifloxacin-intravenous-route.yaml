title: Moxifloxacin (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Avelox I.V.
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Moxifloxacin injection is used to treat bacterial infections in many different
      parts of the body. It is also used to treat and prevent plague (including pneumonic
      and septicemic plague).
  - type: paragraph
    text: Moxifloxacin belongs to the class of medicines known as quinolone antibiotics.
      It works by killing bacteria or preventing their growth. However, this medicine
      will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of moxifloxacin injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of moxifloxacin injection in the
        elderly. However, elderly patients are more likely to have age-related heart
        or kidney problems, or develop severe tendon problems (including tendon rupture),
        which may require caution in patients receiving moxifloxacin injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Levoketoconazole
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Adagrasib
      - Albiglutide
      - Alfuzosin
      - Alogliptin
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Anagrelide
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Azathioprine
      - Azithromycin
      - Bedaquiline
      - Betamethasone
      - Budesonide
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Canagliflozin
      - Ceritinib
      - Chloroquine
      - Chlorpromazine
      - Chlorpropamide
      - Cholera Vaccine, Live
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
      - Corticotropin
      - Cortisone
      - Cosyntropin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aminolevulinic Acid
      - Lanthanum Carbonate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bradycardia (slow heartbeat) or
      - Diabetes or
      - Diarrhea or
      - Heart disease or
      - Heart rhythm problems (eg, prolonged QT interval), or family history of or
      - Hypoglycemia (low blood sugar) or
      - Hypokalemia (low potassium in the blood) or
      - Mental illness, history of or
      - Seizures (epilepsy), history of—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Brain disease (eg, hardening of the arteries) or
      - Kidney disease or
      - Liver disease (including cirrhosis) or
      - Organ transplant (eg, heart, kidney, or lung), history of or
      - Tendon disorder (eg, rheumatoid arthritis), history of—Use with caution. May
        cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Myasthenia gravis (severe muscle weakness), or history of—Should not be used
        in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins. The medicine must be injected slowly, so your IV tube will need to stay
      in place for at least 60 minutes.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Your doctor may give you a few doses of this medicine until your condition
      improves, and then you may be switched to an oral medicine that works the same
      way. If you have any concerns about this, talk to your doctor.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress closely while
      you are receiving this medicine to make sure it is working properly. Blood and
      urine tests are needed to check for any unwanted effects.
  - type: paragraph
    text: If you have low potassium levels in the blood, moxifloxacin may increase
      your risk of having a fast, slow, or irregular heartbeat, loss of consciousness,
      or fainting spells. If these symptoms occur, tell your doctor right away.
  - type: paragraph
    text: 'Serious side effects can occur during treatment with this medicine. Sometimes
      serious side effects can occur without warning. However, possible warning signs
      include: black, tarry stools, blistering, peeling, or loosening of the skin,
      bloody or cloudy urine, chills, decreased urination, diarrhea, fever, joint
      or muscle pain, red skin lesions, often with a purple center, sores, ulcers,
      or white spots in the mouth or on the lips, severe stomach pain, skin rash,
      swelling of the face, fingers, feet, or lower legs, unusual bleeding or bruising,
      unusual weight gain, or yellow skin or eyes. Check with your doctor immediately
      if you notice any of these warning signs .'
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you have itching, hives, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth after you
      receive this medicine.
  - type: paragraph
    text: Moxifloxacin may cause diarrhea, and in some cases it can be severe. It
      may occur 2 months or more after you stop using this medicine. Do not take any
      medicine to treat diarrhea without first checking with your doctor. Diarrhea
      medicines may make the diarrhea worse or make it last longer. If you have any
      questions about this or if mild diarrhea continues or gets worse, check with
      your doctor.
  - type: paragraph
    text: Tell your doctor right away if you start having numbness, tingling, or burning
      pain in your hands, arms, legs, or feet. These may be symptoms of a condition
      called peripheral neuropathy.
  - type: paragraph
    text: Moxifloxacin may rarely cause inflammation (tendinitis) or tearing of a
      tendon (the cord that attaches muscles to bones). This can occur while you are
      using the medicine or after you finish using it. The risk of having tendon problems
      may be increased if you are over 60 years of age, are using steroid medicines
      (eg, dexamethasone, prednisolone, prednisone, or Medrol®), have severe kidney
      problems, have a history of tendon problems (eg, rheumatoid arthritis), or if
      you have received an organ transplant (eg, heart, kidney, or lung). Check with
      your doctor right away if you have sudden pain or swelling in a tendon after
      exercise (eg, ankle, back of the knee or leg, shoulder, elbow, or wrist), bruise
      more easily after an injury, or are unable to bear weight or move the affected
      area. Refrain from exercise until your doctor says otherwise.
  - type: paragraph
    text: 'Tell your doctor right away if you have any of the following symptoms while
      receiving this medicine: convulsions (seizures), feeling anxious, confused,
      or depressed, seeing, hearing, or feeling things that are not there, severe
      headache, trouble sleeping, or unusual thoughts or behaviors.'
  - type: paragraph
    text: Moxifloxacin may cause some people to become dizzy, lightheaded, drowsy,
      or less alert than they are normally. Do not drive or do anything else that
      could be dangerous until you know how this medicine affects you . If these reactions
      are especially bothersome, check with your doctor.
  - type: paragraph
    text: 'Some people who receive moxifloxacin may become more sensitive to sunlight
      than normal. Exposure to sunlight, even for brief periods of time, may cause
      severe sunburn, or skin rash, redness, itching, or discoloration. When you begin
      receiving this medicine:'
  - type: list
    ordered: false
    items:
    - Stay out of direct sunlight, especially between the hours of 10 AM and 3 PM,
      if possible.
    - Wear protective clothing, including a hat and sunglasses.
    - Apply a sun block product that has a sun protection factor (SPF) of at least
      15. Some people may require a product with a higher SPF number, especially if
      they have a fair complexion. If you have any questions about this, check with
      your doctor.
    - Do not use a sunlamp or tanning bed or booth.
  - type: paragraph
    text: If you have a severe reaction from the sun, check with your doctor.
  - type: paragraph
    text: 'For diabetic patients : This medicine may affect blood sugar levels. If
      you notice a change in the results of your blood or urine sugar tests or if
      you have any questions, check with your doctor.'
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
