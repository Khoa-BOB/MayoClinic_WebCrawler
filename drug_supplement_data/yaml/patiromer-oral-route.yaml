title: Patiromer (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Veltassa
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Patiromer is used to treat hyperkalemia (high potassium in the blood). This
      medicine is a potassium binder. It should not be used as an emergency treatment
      for life-threatening hyperkalemia.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of patiromer in children younger than 12 years of age. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of patiromer in the elderly. However,
        elderly patients are more likely to have unwanted side effects (eg, stomach
        or bowel problems) which may require caution in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Ciprofloxacin
      - Levothyroxine
      - Metformin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bowel blockage or
      - Constipation, severe or
      - Impaction (bowel movement problem)—Use is not recommended in patients with
        these conditions. This medicine may not work properly and may worsen these
        conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: You may take this medicine with or without food. Do not heat this medicine
      (eg, microwave) or add to heated foods or liquids. Do not take this medicine
      in its dry form.
  - type: paragraph
    text: 'To use:'
  - type: list
    ordered: false
    items:
    - Measure 1/3 cup of water. Pour half of the water into a glass.
    - Empty the entire contents of a packet into the glass. You may need more than
      1 packet for your prescribed dose.
    - Stir the mixture well.
    - Pour the remaining water into the glass containing the mixture and stir thoroughly.
      The mixture will look cloudy and the powder will not dissolve. Add more water
      if the mixture is too thick.
    - Drink the mixture immediately.
    - If some powder remains in the glass, add more water, stir, and drink immediately.
      Repeat as needed to make sure you get your full dose.
    - You may also use other drinks or soft foods (eg, apple sauce, pudding, yogurt)
      instead of water to prepare the mixture.
  - type: paragraph
    text: If you are taking other medicines, use patiromer 3 hours before or 3 hours
      after these medicines. Patiromer may keep other medicines from working properly.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (powder for suspension): For treatment of hyperkalemia:
        Adults—At first, 8.4 grams (g) once a day. Your doctor may adjust your dose
        as needed. However, the dose is usually not more than 25.2 g once a day. Children
        12 years of age and older—At first, 4 g once a day. Your doctor may adjust
        your dose as needed. However, the dose is usually not more than 25.2 g once
        a day. Children younger than 12 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of hyperkalemia: Adults—At first, 8.4 grams (g) once a day.
        Your doctor may adjust your dose as needed. However, the dose is usually not
        more than 25.2 g once a day. Children 12 years of age and older—At first,
        4 g once a day. Your doctor may adjust your dose as needed. However, the dose
        is usually not more than 25.2 g once a day. Children younger than 12 years
        of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 8.4 grams (g) once a day. Your doctor may adjust your dose
        as needed. However, the dose is usually not more than 25.2 g once a day.
      - Children 12 years of age and older—At first, 4 g once a day. Your doctor may
        adjust your dose as needed. However, the dose is usually not more than 25.2
        g once a day.
      - Children younger than 12 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: You may also store this medicine at room temperature but it must be used
        within 3 months of being taken out of the refrigerator.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause hypomagnesemia (low magnesium levels in the blood).
      Check with your doctor right away if you have drowsiness, loss of appetite,
      mood or mental changes, muscle spasms (tetany) or twitching, seizures, nausea
      or vomiting, trembling, or unusual tiredness or weakness.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Drowsiness
      - loss of appetite
      - mood or mental changes
      - muscle spasms (tetany) or twitching
      - nausea
      - seizures
      - trembling
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty having a bowel movement
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloated or full feeling
      - diarrhea
      - excess air or gas in the stomach or bowels
      - passing gas
      - stomach discomfort
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
