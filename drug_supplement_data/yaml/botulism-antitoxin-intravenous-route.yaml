title: Botulism antitoxin (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Botulism Antitoxin Heptavalent ABCDEFG Equine
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Botulism antitoxin is used to treat symptoms of botulism in patients who
      are exposed to botulinum toxin.
  - type: paragraph
    text: 'Botulism is a serious disease that causes paralysis of the muscles. It
      is caused by a toxin made by a bacteria called Clostridium botulinum . Symptoms
      of botulism include: double or blurred vision, drooping eyelids, slurred speech,
      difficulty with breathing or swallowing, dry mouth, or muscle weakness that
      spreads throughout the body.'
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of botulism antitoxin in the pediatric population. Safety and
        efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of botulism antitoxin in the geriatric population. Safety and
        efficacy have not been established.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to horses or horse blood products, history of or
      - Asthma or
      - Hay fever or seasonal allergies—May increase risk of an allergic reaction
        to occur again.
    - type: list
      ordered: false
      items:
      - Diabetes—This medicine contains maltose, which can interfere with some types
        of blood glucose monitoring systems. This can result in falsely elevated blood
        glucose readings which may lead to inappropriate insulin administration or
        unrecognized hypoglycemia
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given through a needle placed in one of your veins.
  - type: paragraph
    text: This medicine comes with patient information leaflet. It is very important
      that you read and understand this information. Ask your doctor if you have any
      questions.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your progress closely while you are receiving this
      medicine . This will allow your doctor to see if the medicine is working properly
      and to decide if you should continue to receive it.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you have a rash, itching, trouble breathing,
      trouble swallowing, fast or uneven heartbeat, lightheadedness or fainting, tightness
      in the chest, or any swelling of your hands, face, or mouth after you receive
      the injection.
  - type: paragraph
    text: Check with your doctor right away if you have back or joint pain, a fever,
      swollen lymph glands, or a rash within 1 to 3 weeks after receiving this medicine.
      These can be signs and symptoms of a delayed allergic reaction called serum
      sickness.
  - type: paragraph
    text: This medicine may cause headaches, chills, nausea, vomiting, or unusual
      tiredness or weakness, while you are receiving the injection or within 24 hours
      after you receive it. Check with your doctor or nurse right away if you have
      any of these symptoms.
  - type: paragraph
    text: This medicine is made from horse plasma. Some horse blood products have
      transmitted viruses to people who have received them, although the risk is low.
      Talk to your doctor if you have any symptoms that concern you.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - hives or welts
      - itching skin
      - nausea
      - rash
      - redness of the skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - fever
      - throat discomfort
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or discomfort
      - cough
      - difficulty with breathing
      - fast, pounding, or irregular heartbeat or pulse
      - feeling of discomfort
      - increased sweating
      - inflammation of the joints
      - lightheadedness, dizziness, or fainting
      - muscle aches
      - no blood pressure or pulse
      - noisy breathing
      - slow or irregular heartbeat
      - stopping of heart
      - swollen lymph glands
      - tightness in the chest
      - unconsciousness
      - unusual tiredness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - difficulty with moving
      - difficulty with swallowing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - hoarseness
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - muscle cramping
      - muscle pains or stiffness
      - noisy breathing
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness of the skin
      - sweating
      - swollen joints
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - decrease in the frequency of urination
      - decrease in urine volume
      - difficulty in passing urine (dribbling)
      - dry mouth
      - hyperventilation
      - irritability
      - painful urination
      - restlessness
      - shaking
      - trouble sleeping
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
