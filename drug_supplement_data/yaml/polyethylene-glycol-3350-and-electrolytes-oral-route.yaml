    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Delafloxacin
      - Felodipine
      - Isradipine
      - Licorice
      - Nicardipine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (chest pain), unstable or
      - Heart attack, recent or
      - Heart disease (eg, cardiomyopathy) or
      - Hypocalcemia (low calcium in the blood) or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood) or
      - Hyponatremia (low sodium level in the blood) or
      - Withdrawal from alcohol or benzodiazepines—May increase risk for seizures,
        arrhythmia, or kidney problems.
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Dehydration or
      - Heart rhythm problems (eg, prolonged QT interval, uncontrolled arrhythmia),
        history of or
      - Inflammatory bowel disease or
      - Kidney disease or
      - Seizures, history of or
      - Trouble swallowing or
      - Ulcerative colitis, active and severe—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Fluid and electrolyte imbalance—Use with caution. These conditions may increase
        risk for more side effects and must be corrected first before using this medicine.
    - type: list
      ordered: false
      items:
      - Gastric retention (problems with emptying of food or fluid from the stomach)
        or
      - Stomach or bowel problems (eg, blockage, ileus, perforation) or
      - Toxic megacolon (a very dilated intestine)—Should not be used in patients
        with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your doctor may have special instructions for you, depending on the type
      of test you are going to have. If you have not received such instructions, or
      if you do not understand them, check with your doctor.
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Otherwise, the test
      you are going to have may not work as well and may have to be done again.
  - type: paragraph
    text: This medicine comes with a Medication Guide. You must read, understand,
      and follow these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may eat a low-residue breakfast (eg, white bread, biscuits, no wheat
      muffins, cornflakes, eggs, cream of wheat, grits, yogurt, cottage cheese, coffee,
      tea, juice without pulp, and fruits with no skin or seeds) up to 1 day before
      the time of the test. Do not eat anything red or purple.
  - type: paragraph
    text: You may drink clear liquid (eg, water, fruit juices without pulp, lemonade,
      coffee, tea without cream or non-dairy creamer, chicken broth, gelatin) up until
      2 hours before the time of the test. Do not drink red or purple liquids.
  - type: paragraph
    text: Do not take any medicine by mouth within 1 hour before using PEG and electrolytes
      combination solution . Do not take another laxative while using this medicine.
  - type: paragraph
    text: Take chlorpromazine, digoxin, iron supplement, penicillamine, or antibiotics
      (eg, fluoroquinolone, tetracycline) at least 2 hours before or not less than
      6 hours after taking this medicine.
  - type: paragraph
    text: Do not eat solid foods, drink dairy (eg, milk), or alcohol while you are
      using this medicine.
  - type: paragraph
    text: Do not drink anything at least 2 hours before the test.
  - type: paragraph
    text: 'To use the medicine:'
  - type: list
    ordered: false
    items:
    - Mix the powder with water before using it. Do not swallow the powder directly.
      Add lukewarm water to the fill mark on the bottle. If you are using flavoring
      powder that comes with the medicine, add it before adding the water. Do not
      add any extra flavorings or starch-based thickeners to the medicine.
    - Shake well until all the ingredients are dissolved. Use the solution within
      24 hours.
    - Drink 8 ounces of the mixed medicine about every 15 minutes until you finish
      all of the prepared solution or until your stool is clear and free of solid
      matter.
    - Drink an additional 16 ounces of water during the evening.
    - You should have your first loose stool or mild diarrhea about 1 hour after you
      drink the medicine. This is how the medicine cleans out your bowels. You may
      have bloating or an upset stomach before the loose stools start.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (powder for solution): For cleansing of the colon: Adults—240
        milliliters (mL) (8 oz) every 15 minutes in the evening and 5 to 8 hours in
        the morning before the test. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - 'For cleansing of the colon: Adults—240 milliliters (mL) (8 oz) every 15 minutes
        in the evening and 5 to 8 hours in the morning before the test. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—240 milliliters (mL) (8 oz) every 15 minutes in the evening and 5 to
        8 hours in the morning before the test.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the mixed solution in the refrigerator. Do not freeze. Throw away
        any unused liquid after 24 hours.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check you closely to make sure this medicine
      is working properly. Blood and urine tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: Contact your doctor right away if you have decreased urination, dizziness,
      headache, or vomiting. These could be symptoms of a loss of too much body fluid
      (dehydration).
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you had a heart rhythm problem, including
      QT prolongation.
  - type: paragraph
    text: This medicine may increase your risk for seizures. This is more likely to
      occur if you take medicine for depression, if you are withdrawing from alcohol
      or benzodiazepine use, or if you have low sodium level in the blood (hyponatremia).
      Talk to your doctor if you have any concerns.
  - type: paragraph
    text: This medicine may cause serious bowel problems (eg, colon ulcers, ischemic
      colitis). Check with your doctor right away if you have stomach pain and tenderness,
      bloody stools, or rectal bleeding.
  - type: paragraph
    text: Keep yourself hydrated before, during, and after using this medicine. Drink
      extra fluids so you will pass more urine. This may help prevent kidney problems.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Tell your doctor right away if you have a rash, itching, hoarseness,
      trouble breathing or swallowing, or large, hive-like swelling on the face, eyelids,
      lips, tongue, throat, hands, legs, feet, or genitals after using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Full or bloated feeling
      - pressure in the stomach
      - stomach pain
      - swelling of the stomach area
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - bloody or black, tarry stools
      - chest pain or tightness
      - constipation
      - cough
      - difficulty swallowing
      - dizziness
      - fainting
      - fast, slow, or irregular heartbeat
      - hives, itching, skin rash
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - no heartbeat
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid weight gain
      - shakiness in the legs, arms, hands, or feet
      - swelling of the neck
      - tingling of the hands or feet
      - trembling or shaking of the hands or feet
      - trouble breathing
      - unusual tiredness or weakness
      - unusual weight gain or loss
      - vomiting
      - vomiting of blood or material that looks like coffee grounds
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
