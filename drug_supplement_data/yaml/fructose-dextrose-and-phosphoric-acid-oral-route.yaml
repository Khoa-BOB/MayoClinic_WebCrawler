title: Fructose, dextrose, and phosphoric acid (oral route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fructose, dextrose, and phosphoric acid combination is used to treat nausea
      and vomiting. However, this combination has not been proven to be effective.
  - type: paragraph
    text: This medicine is available without a prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: The fluid loss caused by vomiting may result in a severe condition, especially
        in children under 3 years of age. Do not give medicine for vomiting to children
        without first checking with their doctor.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: The fluid loss caused by vomiting may result in a severe condition. Elderly
        persons should not take any medicine for vomiting without first checking with
        their doctor.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Appendicitis, symptoms of, or
      - Inflamed bowel, symptoms of—Make sure nausea and vomiting are not due to appendicitis
        or inflamed bowel before using this product. These conditions may become more
        severe if they are not treated by your doctor
    - type: list
      ordered: false
      items:
      - Diabetes mellitus—The sugars contained in this medicine may cause problems
        in diabetics
    - type: list
      ordered: false
      items:
      - Fructose intolerance, hereditary—The fructose in this medicine may cause severe
        side effects in patients with this condition
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: 'For safe use of this medicine:'
  - type: list
    ordered: false
    items:
    - Follow your doctor's instructions if this medicine was prescribed.
    - Follow the manufacturer's package directions if you are treating yourself.
  - type: paragraph
    text: Do not dilute this medicine with other liquids. Also, do not drink any other
      liquids immediately before or after taking this medicine. To do so may keep
      this medicine from working properly.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (oral solution): For morning sickness: Pregnant women:
        One or two tablespoonfuls upon arising and every three hours as needed. For
        nausea: Adults: One or two tablespoonfuls. Dose may be repeated every fifteen
        minutes until nausea stops. You should not take this product for more than
        one hour (5 doses) without checking with your doctor. Children over 3 years
        of age: One or two teaspoonfuls. Dose may be repeated every fifteen minutes
        until nausea stops. This product should not be taken for more than one hour
        (5 doses) without checking with your doctor. Children under 3 years of age:
        Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For morning sickness: Pregnant women: One or two tablespoonfuls upon arising
        and every three hours as needed.'
      - 'For nausea: Adults: One or two tablespoonfuls. Dose may be repeated every
        fifteen minutes until nausea stops. You should not take this product for more
        than one hour (5 doses) without checking with your doctor. Children over 3
        years of age: One or two teaspoonfuls. Dose may be repeated every fifteen
        minutes until nausea stops. This product should not be taken for more than
        one hour (5 doses) without checking with your doctor. Children under 3 years
        of age: Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'Pregnant women: One or two tablespoonfuls upon arising and every three hours
        as needed.'
    - type: list
      ordered: false
      items:
      - 'Adults: One or two tablespoonfuls. Dose may be repeated every fifteen minutes
        until nausea stops. You should not take this product for more than one hour
        (5 doses) without checking with your doctor.'
      - 'Children over 3 years of age: One or two teaspoonfuls. Dose may be repeated
        every fifteen minutes until nausea stops. This product should not be taken
        for more than one hour (5 doses) without checking with your doctor.'
      - 'Children under 3 years of age: Use is not recommended.'
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Check with your doctor if your nausea and vomiting continue or become worse
      after you have taken this medicine.
  - type: paragraph
    text: Do not take this medicine if you have any signs of appendicitis or inflamed
      bowel (such as stomach or lower abdominal pain, cramping, bloating, soreness,
      or continuing or severe nausea or vomiting). Instead, check with your doctor
      as soon as possible.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Stop taking this medicine and get emergency help immediately if any of
      the following effects occur:'
  subsections:
  - heading: Signs of fructose intolerance
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fainting
      - swelling of face, arms, and legs
      - unusual bleeding
      - vomiting
      - weight loss
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - stomach or abdominal pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
