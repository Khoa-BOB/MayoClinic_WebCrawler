      - 'For urinary tract infections: Adults and children 13 years of age and older—200
        to 400 mg every twelve to twenty-four hours for seven to fourteen days. Children
        6 months to 12 years of age—Use and dose to be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 13 years of age and older—200 to 400 milligrams (mg) every
