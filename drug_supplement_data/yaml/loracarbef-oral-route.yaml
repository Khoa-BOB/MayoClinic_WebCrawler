title: Loracarbef (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Lorabid
    - type: paragraph
      text: Lorabid Pulvules
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Loracarbef is used to treat bacterial infections in many different parts
      of the body. It works by killing bacteria or preventing their growth. This medicine
      will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: Loracarbef is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested in a limited number of children 6 months
        of age and older. In effective doses, the medicine has not been shown to cause
        different side effects or problems than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested in a limited number of elderly patients
        and has not been shown to cause different side effects or problems in older
        people than it does in younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease—Kidney disease may increase the blood level of loracarbef,
        increasing the chance of side effects
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Loracarbef should be taken at least 1 hour before or at least 2 hours after
      meals.
  - type: paragraph
    text: To help clear up your infection completely, keep taking loracarbef for the
      full time of treatment, even if you begin to feel better after a few days. If
      you have a ``strep'' infection, you should keep taking this medicine for at
      least 10 days. This is especially important in ``strep'' infections. Serious
      heart problems could develop later if your infection is not cleared up completely.
      Also, if you stop taking this medicine too soon, your symptoms may return.
  - type: paragraph
    text: This medicine works best when there is a constant amount in the blood or
      urine. To help keep the amount constant, do not miss any doses. Also, it is
      best to take the doses at evenly spaced times, day and night. If this interferes
      with your sleep or other daily activities, or if you need help in planning the
      best times to take your medicine, check with your health care professional.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules or oral suspension): For bronchitis: Adults
        and children 13 years of age and older—200 to 400 milligrams (mg) every twelve
        hours for seven days. Children 6 months to 12 years of age—Use and dose to
        be determined by your doctor. For otitis media (ear infection): Children 6
        months to 12 years of age—Dose is based on body weight and must be determined
        by your doctor. For pneumonia: Adults and children 13 years of age and older—400
        mg every twelve hours for fourteen days. Children 6 months to 12 years of
        age—Use and dose to be determined by your doctor. For sinusitis: Adults and
        children 13 years of age and older—400 mg every twelve hours for ten days.
        Children 6 months to 12 years of age—Use and dose to be determined by your
        doctor. For skin and soft tissue infections: Adults and children 13 years
        of age and older—200 mg every twelve hours for seven days. Children 6 months
        to 12 years of age—Dose is based on body weight and must be determined by
        your doctor. For streptococcal pharyngitis (``strep throat''''): Adults and
        children 13 years of age and older—200 mg every twelve hours for ten days.
        Children 6 months to 12 years of age—Dose is based on body weight and must
        be determined by your doctor. For urinary tract infections: Adults and children
        13 years of age and older—200 to 400 mg every twelve to twenty-four hours
        for seven to fourteen days. Children 6 months to 12 years of age—Use and dose
        to be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For bronchitis: Adults and children 13 years of age and older—200 to 400
        milligrams (mg) every twelve hours for seven days. Children 6 months to 12
        years of age—Use and dose to be determined by your doctor.'
      - 'For otitis media (ear infection): Children 6 months to 12 years of age—Dose
