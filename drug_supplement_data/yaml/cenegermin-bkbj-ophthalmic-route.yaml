title: Cenegermin-bkbj (ophthalmic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Oxervate
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cenegermin-bkbj eye drops is used to treat neurotrophic keratitis (disease
      of the cornea of the eye).
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of cenegermin-bkbj eye drops in the
        pediatric population.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of cenegermin-bkbj eye drops in the
        elderly.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use it for a longer time than your doctor
      ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet and patient instructions.
      Read and follow these instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: This medicine is available as a Delivery System Kit. Make sure to follow
      the instructions carefully to get the best out of your medicine.
  - type: paragraph
    text: 'To prepare the medicine:'
  - type: list
    ordered: false
    items:
    - Push down the vial adapter blister pack onto the vial until it snaps into place
      over the vial's neck. Do not remove it from the vial after connecting it.
    - Clean the surface of the valve on the connector part of the vial adapter with
      a sterile disinfectant wipe. Let it dry for about 1 minute.
    - Screw a pipette (clockwise) into the connector part of the vial adapter. Make
      sure it is pushed all the way down.
    - Turn the vial upside-down and gently pull the plunger until it stops to draw
      the eye drop solution into the pipette.
    - Check the pipette to make sure it contains the eye drop solution. If it is empty,
      keep the vial with the connected pipette upside-down, push the plunger all the
      way in and pull it out again.
    - Unscrew (counter-clockwise) and pull the pipette straight up after it has been
      correctly filled.
  - type: paragraph
    text: 'To use the eye drops:'
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and water before and after using this medicine.
    - If you wear contact lenses, remove them before using this medicine. Wait at
      least 15 minutes before you put your contact lenses back in.
    - Tilt your head back and, pressing your finger gently on the skin just beneath
      the lower eyelid, pull the lower eyelid away from the eye to make a space.
    - Gently push the plunger down until at least a drop is released into the eye
      pocket. Do not touch your eye with the tip of the pipette. With your head still
      tilted back, blink a few times so that the medicine covers the surface of your
      eye.
    - Throw the used pipette right away after use, even if there is still medicine
      left in it.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
      Serious damage to the eye and possible loss of vision may result from using
      contaminated eye medicines.
  - type: paragraph
    text: If you are also using other eye medicines, use them at least 15 minutes
      before or after using cenegermin-bkbj. Use cenegermin-bkbj 15 minutes before
      using any eye ointment, gel, or drop that is thick.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic dosage forms (eye drops): For neurotrophic keratitis: Adults
        and children—Instill one drop into the affected eye 6 times a day at 2-hour
        intervals for 8 weeks.'
    - type: list
      ordered: false
      items:
      - 'For neurotrophic keratitis: Adults and children—Instill one drop into the
        affected eye 6 times a day at 2-hour intervals for 8 weeks.'
    - type: list
      ordered: false
      items:
      - Adults and children—Instill one drop into the affected eye 6 times a day at
        2-hour intervals for 8 weeks.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the unopened vial in its original carton in the refrigerator for
        up to 14 days. Keep the opened vial in the refrigerator or at room temperature
        for up to 12 hours. Do not shake the vial. Throw away any unused medicine
        after 12 hours.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your eye doctor (ophthalmologist) check your or
      your child's progress at regular visits to make sure the medicine is working
      properly and to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause blurred vision or eye pain. Do not drive or do anything
      else that could be dangerous until you know how this medicine affects you .
  - type: paragraph
    text: If your symptoms do not improve within a few days or if they become worse,
      check with your eye doctor (ophthalmologist) right away.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased vision or any change in vision
      - feeling of having something in the eye
      - irritation, pain, redness, or swelling of the eye
      - tearing
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
