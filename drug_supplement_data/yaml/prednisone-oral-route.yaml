    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Cataracts or
      - Congestive heart failure or
      - Cushing's syndrome (adrenal gland problem) or
      - Diabetes or
      - Eye infection or
      - Glaucoma or
      - Heart attack, recent or
      - Hyperglycemia (high blood sugar) or
      - Hypertension (high blood pressure) or
      - Infection (eg, bacterial, virus, fungus, or parasite) or
      - Mood changes, including depression or
      - Myasthenia gravis (severe muscle weakness) or
      - Osteoporosis (weak bones) or
      - Peptic ulcer, active or history of or
      - Personality changes or
      - Stomach or intestinal problems (eg, diverticulitis, ulcerative colitis) or
      - Thyroid problems or
      - Tuberculosis, inactive—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Fungal infections or
      - Herpes simplex eye infection—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance for unwanted effects.
  - type: paragraph
    text: Take this medicine with food or milk to avoid stomach irritation.
  - type: paragraph
    text: Swallow the delayed-release tablet whole. Do not crush, break, or chew it.
  - type: paragraph
    text: Measure the oral liquid with a marked measuring spoon, oral syringe, or
      medicine cup. The average household teaspoon may not hold the right amount of
      liquid.
  - type: paragraph
    text: Prednisone Intensol™ solution is a concentrated liquid. Measure the concentrated
      liquid with the special oral dropper that comes with the package.
  - type: paragraph
    text: If you use this medicine for a long time, do not suddenly stop using it
      without checking first with your doctor . You may need to slowly decrease your
      dose before stopping it completely.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (concentrated solution, solution, delayed-release tablets,
        and tablets): Dose depends on medical condition: Adults—At first, 5 to 60
        milligrams (mg) per day. Your doctor may adjust your dose as needed. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'Dose depends on medical condition: Adults—At first, 5 to 60 milligrams (mg)
        per day. Your doctor may adjust your dose as needed. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 5 to 60 milligrams (mg) per day. Your doctor may adjust your
        dose as needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away any unused Prednisone Intensol™ solution 90 days after the
        bottle is opened for the first time.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and to decide if you should continue
      to receive it. Blood or urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: If you are using this medicine for a long time, tell your doctor about any
      extra stress or anxiety in your life, including other health concerns and emotional
      stress. Your dose of this medicine might need to be changed for a short time
      while you have extra stress.
  - type: paragraph
    text: Using too much of this medicine or using it for a long time may increase
      your risk of having adrenal gland problems. Talk to your doctor right away if
      you have blurred vision, dizziness or fainting, a fast, irregular, or pounding
      heartbeat, increased thirst or urination, irritability, or unusual tiredness
      or weakness.
  - type: paragraph
    text: This medicine may cause you to get more infections than usual. Avoid people
      who are sick or have infections and wash your hands often. If you are exposed
      to chickenpox or measles, tell your doctor right away. If you start to have
      a fever, chills, sore throat, or any other sign of an infection, call your doctor
      right away.
  - type: paragraph
    text: Check with your doctor right away if blurred vision, difficulty in reading,
      eye pain, or any other change in vision occurs during or after treatment. Your
      doctor may want you to have your eyes checked by an ophthalmologist (eye doctor).
  - type: paragraph
    text: While you are being treated with prednisone, do not have any immunizations
      (vaccines) without your doctor's approval. Prednisone may lower your body's
      resistance and the vaccine may not work as well or you might get the infection
      the vaccine is meant to prevent. In addition, you should not be around other
      persons living in your household who receive live virus vaccines because there
      is a chance they could pass the virus on to you. Some examples of live vaccines
      include measles, mumps, influenza (nasal flu vaccine), poliovirus (oral form),
      rotavirus, and rubella. If you have questions about this, talk to your doctor.
  - type: paragraph
    text: This medicine may cause changes in mood or behavior for some patients. Tell
      your doctor right away if you have depression, mood swings, a false or unusual
      sense of well-being, trouble with sleeping, or personality changes while taking
      this medicine.
  - type: paragraph
    text: This medicine might cause thinning of the bones (osteoporosis) or slow growth
      in children if used for a long time. Tell your doctor if you have any bone pain
      or if you have an increased risk for osteoporosis. If your child is using this
      medicine, tell the doctor if you think your child is not growing properly.
  - type: paragraph
    text: This medicine may increase your risk for cancer, including Kaposi's sarcoma.
      Tell your doctor right away if you have flat, painless spots that are red or
      purple on white skin and bluish, brownish, or black on dark skin.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect the results of certain skin tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Aggression
      - agitation
      - blurred vision
      - decrease in the amount of urine
      - dizziness
      - fast, slow, pounding, or irregular heartbeat or pulse
      - headache
      - irritability
      - mood changes
      - noisy, rattling breathing
      - numbness or tingling in the arms or legs
      - pounding in the ears
      - swelling of the fingers, hands, feet, or lower legs
      - trouble thinking, speaking, or walking
      - trouble breathing
      - weight gain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Backache
      - bloody, black, or tarry stools
      - cough or hoarseness
      - darkening of the skin
      - decrease in height
      - decreased vision
      - diarrhea
      - dry mouth
      - eye pain
      - eye tearing
      - facial hair growth in females
      - fainting
      - fever or chills
      - flushed, dry skin
      - fractures
      - fruit-like breath odor
      - full or round face, neck, or trunk
      - heartburn or indigestion (severe and continuous)
      - increased hunger
      - increased thirst
      - increased urination
      - loss of appetite
      - loss of sexual desire or ability
      - lower back or side pain
      - menstrual irregularities
      - muscle pain, tenderness, wasting, or weakness
      - nausea
      - pain in the back, ribs, arms, or legs
      - painful or difficult urination
      - skin rash
      - stomach pain
      - sweating
      - trouble healing
      - trouble sleeping
      - unexplained weight loss
      - unusual tiredness or weakness
      - vision changes
      - vomiting
      - vomiting of material that looks like coffee grounds
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Increased appetite
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal fat deposits on the face, neck, and trunk
      - acne
      - dry scalp
      - lightening of normal skin color
      - red face
      - reddish purple lines on the arms, face, legs, trunk, or groin
      - swelling of the stomach area
      - thinning of the scalp hair
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
