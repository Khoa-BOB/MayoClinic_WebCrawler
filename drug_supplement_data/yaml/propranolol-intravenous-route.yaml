      - Felbinac
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (severe chest pain)—May provoke chest pain if stopped too quickly .
    - type: list
      ordered: false
      items:
      - Asthma or
      - Bradycardia (slow heartbeat) or
      - Heart block or
      - Heart failure—Should not use in patients with these conditions .
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hyperthyroidism (overactive thyroid) or
      - Hypoglycemia (low blood sugar)—May cover up some of the signs and symptoms
        of these diseases, such as a fast heartbeat .
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body .
    - type: list
      ordered: false
      items:
      - Lung disease (e.g., bronchitis, emphysema)—May cause difficulty with breathing
        in patients with this condition .
    - type: list
      ordered: false
      items:
      - Wolff-Parkinson-White syndrome (rare heart condition)—May cause a very slow
        heartbeat in patients with this condition .
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given through a needle placed in one of your veins .
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will only give you a few doses of this medicine until your condition
      improves, and then you will be switched to an oral medicine that works the same
      way. If you have any concerns about this, talk to your doctor .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain or discomfort
      - confusion
      - decreased urine output
      - dilated neck veins
      - dizziness, faintness, or lightheadedness when getting up from a lying or sitting
        position suddenly
      - extreme fatigue
      - irregular breathing
      - lightheadedness, dizziness, or fainting
      - shortness of breath
      - slow or irregular heartbeat
      - sweating
      - swelling of face, fingers, feet, or lower legs
      - tightness in chest
      - troubled breathing
      - unusual tiredness or weakness
      - weight gain
      - wheezing
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blisters, hives, or itching
      - fever and chills
      - general feeling of discomfort or illness
      - hair loss
      - headaches
      - muscle or joint pain
      - skin rash
      - sore throat
      - swollen glands
    subsections: []
  - heading: Incidence not determined
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal pain, usually after eating a meal
      - abdominal tenderness
      - black, tarry stools
      - blood in urine
      - bloody nose
      - bloody stools
      - body aches or pain
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - congestion
      - constipation
      - cough
      - decreased awareness or responsiveness
      - diarrhea
      - difficult or labored breathing
      - dryness or soreness of throat
      - general feeling of tiredness or weakness
      - heavier menstrual periods
      - hoarseness
      - lower back or side pain
      - mimicry of speech or movements
      - mutism
      - nausea
      - negativism
      - no blood pressure or pulse
      - noisy breathing
      - painful or difficult urination
      - paleness or cold feeling in fingertips and toes
      - peculiar postures or movements, mannerisms, or grimacing
      - pinpoint red or purple spots on skin
      - rectal bleeding
      - reddened skin
      - runny nose
      - severe sleepiness
      - sores on the skin
      - sores, ulcers, or white spots on lips or in mouth
      - stopping of heart
      - tender, swollen glands in neck
      - tingling or pain in fingers or toes when exposed to cold
      - trouble in swallowing
      - unconsciousness
      - unusual bleeding or bruising
      - voice changes
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased interest in sexual intercourse
      - dry eyes
      - inability to have or keep an erection
      - loss in sexual ability, desire, drive, or performance
      - pain of penis on erection
      - skin irritation or rash, including rash that looks like psoriasis
      - thinning of hair
    subsections: []
  - heading: Incidence not determined
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion about identity, place, and time
      - crying
      - depersonalization
      - disturbed color perception
      - double vision
      - dysphoria
      - euphoria
      - halos around lights
      - loss of strength or energy
      - loss of vision
      - mental depression
      - muscle weakness
      - night blindness
      - overbright appearance of lights
      - paranoia
      - quick to react or overreact emotionally
      - rapidly changing moods
      - seeing, hearing, or feeling things that are not there
      - short-term memory loss
      - sleeplessness
      - trouble sleeping
      - tunnel vision
      - unable to sleep
      - unusual drowsiness, dullness, or feeling of sluggishness
      - vivid dreams
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
