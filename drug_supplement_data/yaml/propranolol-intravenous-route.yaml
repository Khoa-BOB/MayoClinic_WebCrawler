title: Propranolol (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Inderal
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Propranolol injection is used to control fast heartbeats and abnormal heart
      rhythms .
  - type: paragraph
    text: This medicine is a beta-blocker. It works by affecting the response to nerve
      impulses in certain parts of the body, like the heart. As a result, the heart
      beats slower and at a regular rhythm .
  - type: paragraph
    text: This medicine is available only with your doctor's prescription .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of propranolol injection in the pediatric population. Safety
        and efficacy have not been established .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatrics-specific
        problems that would limit the usefulness of propranolol injection in the elderly.
        However, elderly patients are more likely to have age-related liver, kidney,
        or heart problems, which may require an adjustment of dosage in patients receiving
        propranolol injection .
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Fezolinetant
      - Mavorixafor
      - Rizatriptan
      - Thioridazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Albuterol
      - Bupivacaine
      - Bupivacaine Liposome
      - Bupropion
      - Capmatinib
      - Ceritinib
      - Clomipramine
      - Clonidine
      - Crizotinib
      - Darunavir
      - Desvenlafaxine
      - Diatrizoate
      - Diazoxide
      - Dihydroergotamine
      - Diltiazem
      - Dronedarone
      - Epinephrine
      - Escitalopram
      - Eslicarbazepine Acetate
      - Fedratinib
      - Fenoldopam
      - Fexinidazole
      - Fingolimod
      - Fluoxetine
      - Formoterol
