      - Landiolol
      - Lercanidipine
      - Levalbuterol
      - Lidocaine
      - Mefloquine
      - Melatonin
      - Mepivacaine
      - Methylergonovine
      - Olodaterol
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Aceclofenac
      - Acemetacin
      - Acetyldigoxin
      - Albiglutide
      - Alfuzosin
      - Alogliptin
      - Amtolmetin Guacil
      - Aspirin
      - Bromfenac
      - Bufexamac
      - Bunazosin
      - Canagliflozin
      - Celecoxib
      - Chlorpromazine
      - Chlorpropamide
      - Cholestyramine
      - Choline Salicylate
      - Cimetidine
      - Clonixin
      - Dapagliflozin
      - Deslanoside
      - Dexibuprofen
      - Dexketoprofen
      - Diclofenac
      - Diflunisal
