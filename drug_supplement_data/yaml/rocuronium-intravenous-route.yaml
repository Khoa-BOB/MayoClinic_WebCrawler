title: Rocuronium (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Zemuron
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Rocuronium injection is used with general anesthesia medicines for rapid
      sequence intubation and routine tracheal intubation. This medicine is also used
      to help relax the muscles during surgery or mechanical ventilation.
  - type: paragraph
    text: This medicine is to be given only by your doctor or other trained health
      professional.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of rocuronium injection in children.
        However, use of this medicine in children for rapid sequence intubation is
        not recommended.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of rocuronium injection in the elderly.
        However, elderly patients are more likely to have residual neuromuscular block
        or blood circulation problems, which may require caution in patients receiving
        this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amikacin
      - Bacitracin
      - Capreomycin
      - Carbamazepine
      - Colistimethate Sodium
      - Dibekacin
      - Epinephrine
      - Fosphenytoin
      - Framycetin
      - Gentamicin
      - Isepamicin
      - Isoflurane
      - Kanamycin
      - Neomycin
      - Netilmicin
      - Phenytoin
      - Polymyxin B
      - Procainamide
      - St John's Wort
      - Streptomycin
      - Tobramycin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Enflurane
      - Magnesium
      - Sevoflurane
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood circulation problems or
      - Eaton-Lambert syndrome (muscle problem) or
      - Electrolyte imbalance or
      - Heart or blood vessel disease or
      - Heart rhythm problem (eg, QT prolongation) or
      - Heart valve disease or
      - Metabolic acidosis or alkalosis or
      - Myasthenia gravis (muscle problem) or
      - Pulmonary hypertension—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Malignant hyperthermia—Should be treated first before using this medicine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine
      in a hospital. This medicine is given through a needle placed in one of your
      veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you or your child closely while
      you are receiving this medicine . This will allow your doctor to see if the
      medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction called anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you or your child have a rash, itching, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      while you are using this medicine.
  - type: paragraph
    text: Myopathy may occur while using this medicine for a long period of time in
      intensive care unit (ICU). It may also occur if this medicine is used together
      with a steroid medicine. Tell your doctor right away if you or your child have
      extreme or ongoing muscle weakness while using this medicine.
  - type: paragraph
    text: Tell your doctor right away if you or your child have pale skin, pain, or
      redness at the injection site while using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - difficulty with breathing
      - dizziness
      - fainting
      - fast, slow, or irregular heartbeat
      - noisy breathing
      - swelling at the injection site
      - tightness in the chest
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with swallowing
      - hives, itching, or skin rash
      - muscular pain, tenderness, wasting, or weakness
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - unusual tiredness or weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
