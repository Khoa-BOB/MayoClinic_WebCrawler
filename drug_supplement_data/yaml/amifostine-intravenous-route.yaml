title: Amifostine (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ethyol
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Amifostine is used to help prevent or lessen some of the side effects of
      cisplatin (a cancer medicine) or radiation therapy on the kidneys and salivary
      glands.
  - type: paragraph
    text: This medicine is to be given only by or under the immediate supervision
      of your doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Use of amifostine injection in children is not recommended. Safety and
        efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of amifostine in the elderly. However,
        elderly patients are more likely to have age-related kidney, liver, or heart
        disease, which may require caution and an adjustment in the dose in patients
        receiving amifostine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Heart attack, history of or
      - Heart disease or
      - Heart rhythm problems or
      - Kidney disease or
      - Stroke, history of or
      - Transient ischemic attacks (TIA or mini-stroke), history of—Use with caution.
        May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Dehydration or
      - Hypotension (low blood pressure)—Should not be used in patients with these
        conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital or cancer treatment center. This medicine is given through a needle
      placed into one of your veins.
  - type: paragraph
    text: Amifostine injection is given before cisplatin therapy or radiation therapy.
      It must be injected slowly, so your IV tube will need to stay in place for at
      least 15 minutes before cisplatin treatment or at least 3 minutes before radiation
      therapy.
  - type: paragraph
    text: You may receive other medicines to help prevent nausea and vomiting. You
      may also be given calcium supplements if needed.
  - type: paragraph
    text: Drink plenty of fluids during the 24 hours before receiving amifostine.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for any unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant during treatment
      with this medicine. If you think you have become pregnant while using this medicine,
      tell your doctor right away.
  - type: paragraph
    text: 'Low blood pressure (hypotension) may occur with this medicine. Check with
      your doctor right away if you have the following symptoms: blurred vision, confusion,
      severe dizziness, faintness, or lightheadedness, sweating, or unusual tiredness
      or weakness.'
  - type: paragraph
    text: Serious skin reactions can occur during treatment or weeks after starting
      this medicine. Check with your doctor right away if you have blistering, peeling,
      or loosening of the skin, red skin lesions on the palms of the hands or soles
      of the feet, severe acne or skin rash, sores or ulcers on the skin, or fever
      or chills while you are receiving this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have a fever, chills, cough, sore
      throat, swollen, painful, or tender lymph glands in the neck, armpit, or groin,
      or yellow skin or eyes while using this medicine. These could be symptoms of
      a serious condition called drug reaction with eosinophilia and systemic symptoms
      (DRESS).
  - type: paragraph
    text: This medicine may cause a serious allergic reaction, called anaphylaxis.
      This can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth after receiving
      this medicine.
  - type: paragraph
    text: This medicine may cause nausea or vomiting in most people, sometimes even
      after receiving medicines to prevent it. Ask your doctor or nurse about other
      ways to control these side effects.
  - type: paragraph
    text: This medicine may cause hypocalcemia (low calcium in the blood). Check with
      your doctor if you have stomach cramps, confusion, convulsions, trouble breathing,
      irregular heartbeat, mood or mental changes, muscle cramps in the hands, arms,
      feet, legs, or face, or numbness and tingling around the mouth, fingertips,
      or feet.
  - type: paragraph
    text: If you plan to have children, talk with your doctor before using this medicine.
      Some men using this medicine have become infertile (unable to have children).
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - confusion
      - dizziness, faintness, or lightheadedness when suddenly getting up from a lying
        or sitting position
      - fainting or loss of consciousness
      - fast or irregular breathing
      - itching
      - nausea, vomiting
      - red, scaly, swollen, or peeling areas of the skin
      - skin rash
      - sweating
      - swelling of the eyes or eyelids
      - tightness in the chest
      - trouble with breathing
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - burning or tingling sensation
      - chills
      - cough
      - cracks in the skin
      - diarrhea
      - fast, slow, or irregular heartbeat or pulse
      - fever
      - joint or muscle pain
      - loss of bladder control
      - loss of heat from the body
      - muscle cramps in the hands, arms, feet, legs, or face
      - muscle spasm or jerking of all extremities
      - no blood pressure or pulse
      - numbness and tingling around the mouth, fingertips, or feet
      - red, irritated eyes
      - red skin lesions, often with a purple center
      - seizures
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach cramps
      - stopping of the heart
      - sudden loss of consciousness
      - tremor
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody urine
      - decreased frequency or amount of urine
      - difficulty with swallowing
      - hives or welts
      - hoarseness
      - increased blood pressure
      - increased thirst
      - lower back or side pain
      - loss of appetite
      - pain or discomfort in the arms, jaw, back, or neck
      - slow or irregular breathing
      - swelling of the face, fingers, or lower legs
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Feeling unusually warm or cold
      - flushing or redness of the face or neck
      - headache
      - hiccups
      - nervousness
      - pounding in the ears
      - sleepiness (severe)
      - sneezing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
