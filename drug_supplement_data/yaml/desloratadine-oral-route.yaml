    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve within a few days or if they become worse,
      check with your doctor.
  - type: paragraph
    text: This medicine may cause some people to become drowsy, dizzy, or less alert
      than they are normally. Make sure you know how you react to this medicine before
      you drive, use machines, or do anything else that could be dangerous if you
      are dizzy or are not alert.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anaphylaxis, such as, cough, difficulty swallowing, dizziness, fast heartbeat,
        hives, itching, puffiness or swelling of eyelids or around the eyes or face
        or lips or tongue, shortness of breath, skin rash, tightness in chest, unusual
        tiredness or weakness, wheezing
      - dyspnea, such as, shortness of breath, difficult or labored breathing, tightness
        in chest, wheezing
      - edema, such as, swelling
      - pruritus, such as, itching skin
      - rash
      - tachycardia, such as, fast, pounding, or irregular heartbeat or pulse
      - urticaria, such as, hives or welts, itching, redness of skin, skin rash.
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dizziness
      - dry mouth
      - dysmenorrhea, such as, difficult or painful menstruation
      - dyspepsia, such as, acid or sour stomach, belching, heartburn, indigestion,
        stomach discomfort , upset or pain,
      - fatigue, such as, unusual tiredness or weakness
      - myalgia, such as, joint pain, swollen joints, muscle aching or cramping, muscle
        pains or stiffness, difficulty in moving
      - pharyngitis, such as, body aches or pain, congestion, cough, dryness or soreness
        of throat, fever, hoarseness, runny nose, tender swollen glands in neck, trouble
        in swallowing, voice changes.
      - somnolence, such as, sleepiness or unusual drowsiness
      - nausea
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
