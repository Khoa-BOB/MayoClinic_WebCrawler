title: Desloratadine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Clarinex
    - type: paragraph
      text: Clarinex Reditabs
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Desloratadine is an antihistamine. It is used to relieve the symptoms of
      hay fever and hives of the skin.
  - type: paragraph
    text: Antihistamines work by preventing the effects of a substance called histamine,
      which is produced by the body. Histamine can cause itching, sneezing, runny
      nose, and watery eyes. Also, in some persons histamine can close up the bronchial
      tubes (air passages of the lungs) and make breathing difficult. Histamine can
      also cause some persons to have hives, with severe itching of the skin.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: Do not give any over-the-counter (OTC) cough and cold medicine to a baby
      or child under 4 years of age. Using these medicines in very young children
      might cause serious or possibly life-threatening side effects .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Disintegrating
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested in children 6 months of age and older. In
        effective doses, the medicine has not been shown to cause different side effects
        or problems than it does in adults.
    - type: paragraph
      text: Do not give any over-the-counter (OTC) cough and cold medicine to a baby
        or child under 4 years of age. Using these medicines in very young children
        might cause serious or possibly life-threatening side effects .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Desloratadine has been tested in patients 65 years of age and older and
        has not been shown to cause different side effects or problems in older people
        than it does in younger adults. However, older patients are more likely to
        have kidney or liver problems which may make them more sensitive to the effects
        of desloratadine. Your doctor may give you a different desloratadine dose
        if you have kidney or liver problems.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Cannabidiol
      - Carbamazepine
      - Clopidogrel
      - Gemfibrozil
      - Pitolisant
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Liver disease or
      - Kidney disease—Effects of desloratadine may be increased because of slower
        removal from the body.
    - type: list
      ordered: false
      items:
      - Phenylketonuria (PKU)—The oral disintegrating tablets may contain aspartame,
        which can make your condition worse.
    - type: list
      ordered: false
      items:
      - Slow metabolizers of desloratadine—May increase chances of unwanted effects
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: paragraph
      text: 'For patients using the oral disintegrating tablet form of this medicine:'
    - type: list
      ordered: false
      items:
      - Make sure your hands are dry.
      - Do not push the tablet through the foil backing of the package. Instead, gently
        peel back the foil backing and remove the tablet.
      - Immediately place the tablet on top of the tongue.
      - The tablet will dissolve in seconds, and you may swallow it with your saliva.
        You do not need to drink water or other liquid to swallow the tablet.
    - type: paragraph
      text: 'For patients using the syrup form of this medicine: Use a calibrated
        measuring dropper or syringe to measure the direct dose for your child based
        on your doctor''s instructions. Do not use a regular teaspoon. If you are
        unsure about how much of the syrup to give to your child, ask your doctor
        or pharmacist.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (oral disintegrating tablets): For symptoms of chronic
        hives: Adults and children 12 years of age and older—5 milligrams (mg) once
        a day. Children 6 to 11 years of age—2.5 mg once a day. Children 4 to 6 years
        of age—Use and dose must be determined by your doctor. Children and infants
        up to 4 years of age—Use is not recommended . For symptoms of hay fever: Adults
        and children 12 years of age and older—5 mg once a day. Children 6 to 11 years
        of age—2.5 mg once a day. Children 4 to 6 years of age—Use and dose must be
        determined by your doctor. Children and infants up to 4 years of age—Use is
        not recommended .'
