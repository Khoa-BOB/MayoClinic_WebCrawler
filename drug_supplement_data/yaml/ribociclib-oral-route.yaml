    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (severe chest pain), unstable or
      - Congestive heart failure or
      - Electrolyte imbalance (eg, high or low potassium, calcium, phosphorus, magnesium
        in the blood) or
      - Heart attack, recent or
      - Heart rhythm problems (eg, long QT syndrome, slow, fast, or irregular heartbeat)
        or
      - Hypertension (high blood pressure), uncontrolled or
      - Hypothyroidism (underactive thyroid), uncontrolled—Avoid use. May cause side
        effects to become worse.
    - type: list
      ordered: false
      items:
      - Infection or
      - Neutropenia (low white blood cells)—May decrease your body's ability to fight
        infection.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease, moderate or severe—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Lung problems (eg, interstitial lung disease, pneumonitis)—Use with caution.
        May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Ribociclib is taken together with an aromatase inhibitor or fulvestrant.
      It is important that you take both medicines at the same time each day, preferably
      in the morning . Follow your doctor's instructions on when to take these medicines.
  - type: paragraph
    text: Your doctor may also give you luteinizing hormone-releasing hormone medicine
      together with this medicine.
  - type: paragraph
    text: Swallow the tablet whole. Do not crush, break, or chew it. Do not take this
      medicine if it is broken, cracked, or looks damaged. You may take this medicine
      with or without food.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For early breast cancer: Adults—400 milligrams
        (mg) (two 200 mg tablets) taken as a single dose, once a day for 21 consecutive
        days, followed by 7 days without medicine. Your doctor may adjust your dose
        as needed and tolerated. Children—Use and dose must be determined by your
        doctor. For advanced or metastatic breast cancer: Adults—600 milligrams (mg)
        (three 200 mg tablets) taken as a single dose, once a day for 21 consecutive
        days, followed by 7 days without medicine. Your doctor may adjust your dose
        as needed and tolerated. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - 'For early breast cancer: Adults—400 milligrams (mg) (two 200 mg tablets)
        taken as a single dose, once a day for 21 consecutive days, followed by 7
        days without medicine. Your doctor may adjust your dose as needed and tolerated.
        Children—Use and dose must be determined by your doctor.'
      - 'For advanced or metastatic breast cancer: Adults—600 milligrams (mg) (three
        200 mg tablets) taken as a single dose, once a day for 21 consecutive days,
        followed by 7 days without medicine. Your doctor may adjust your dose as needed
        and tolerated. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—400 milligrams (mg) (two 200 mg tablets) taken as a single dose, once
        a day for 21 consecutive days, followed by 7 days without medicine. Your doctor
        may adjust your dose as needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—600 milligrams (mg) (three 200 mg tablets) taken as a single dose,
        once a day for 21 consecutive days, followed by 7 days without medicine. Your
        doctor may adjust your dose as needed and tolerated.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you vomit after you take this medicine, do not take another dose the
        same day. Wait and take your next dose when you normally would.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the medicine in its original package.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you can get pregnant, your doctor may give you a pregnancy test before you start
      using this medicine to make sure you are not pregnant. Use an effective form
      of birth control to keep from getting pregnant during treatment and for at least
      3 weeks after your last dose. If you think you have become pregnant while using
      the medicine, tell your doctor right away.
  - type: paragraph
    text: If you plan to have children, talk with your doctor before using this medicine.
      Some men using this medicine have become infertile (unable to have children).
  - type: paragraph
    text: Interstitial lung disease or pneumonitis can occur while using this medicine.
      This can be life-threatening and requires immediate medical attention. Check
      with your doctor right away if you have chest pain, cough, difficulty with breathing,
      fever or chills while using this medicine.
  - type: paragraph
    text: Serious skin reactions, including Stevens-Johnson Syndrome, toxic epidermal
      necrolysis, or drug reaction with eosinophilia and systemic symptoms (DRESS)
      can occur with this medicine. Check with your doctor right away if you have
      black, tarry stools, blistering, peeling, or loosening of the skin, chest pain,
      chills, cough, fever, painful or difficult urination, red skin lesions, sore
      throat, sores, ulcers, or white spots on the lips or in the mouth, swollen glands,
      unusual bleeding or bruising, or unusual tiredness or weakness with this medicine.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you or anyone in your family has ever
      had a heart rhythm problem including QT prolongation.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Ribociclib can temporarily lower the number of some types of blood cells
      in your blood. Because of this, you may bleed or get infections more easily.
      To help with these problems, avoid being near people who are sick or have infections.
      Wash your hands often. Stay away from rough sports or other situations where
      you could be bruised, cut, or injured. Brush and floss your teeth gently. Be
      careful when using sharp objects, including razors and fingernail clippers.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bladder pain
      - bleeding gums
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - bloody or cloudy urine
      - chest tightness
      - chills
      - cough
      - difficult, burning, or painful urination
      - fever
      - frequent urge to urinate
      - lower back or side pain
      - pale skin
      - pinpoint red spots on the skin
      - sore throat
      - tingling of the hands or feet
      - trouble breathing
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - unusual weight gain or loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - confusion
      - dark urine
      - fainting
      - general feeling of discomfort or illness
      - irregular heartbeat
      - loss of appetite
      - mood or mental changes
      - muscle cramps in the hands, arms, feet, legs, or face
      - nausea
      - numbness and tingling around the mouth, fingertips, or feet
      - pain or tenderness in the upper stomach
      - pale stools
      - seizures
      - stomach cramps
      - thickening of bronchial secretions
      - tremor
      - vomiting
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, loosening of skin
      - diarrhea
      - joint or muscle pain
      - rash or itching skin
      - red irritated eyes
      - red skin lesions, often with a purple center
      - swollen glands
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm or leg pain
      - back pain
      - constipation
      - dry skin
      - headache
      - lack or loss of strength
      - loss or thinning of the hair
      - mouth or throat pain
      - swelling or inflammation of the mouth
      - trouble sleeping
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - dry eye
      - heartburn
      - increased tearing
      - indigestion
      - patchy loss of skin color
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
