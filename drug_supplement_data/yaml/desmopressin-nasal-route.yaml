    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose of Noctiva™, skip the missed dose and go back to your
        regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: 'DDAVP® or desmopressin generic : Store at room temperature in an upright
        position.'
    - type: paragraph
      text: 'DDAVP® Rhinal Tube System : Store in the refrigerator in an upright position.
        For travelers, the product is good for up to 3 weeks at room temperature.'
    - type: paragraph
      text: 'Stimate® : Store at room temperature in an upright position. Throw the
        bottle away 6 months after it is used for the first time.'
    - type: paragraph
      text: 'Noctiva™ : Keep the unopened nasal spray bottle in the refrigerator in
        an upright position. You may store the opened bottle at room temperature.
        Throw away 60 days after opening.'
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits . This will allow your doctor to see if the medicine is working
      properly and to decide if you should continue to use it. Blood and urine tests
      may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not use Noctiva™ together with certain diuretics (eg, furosemide, torsemide,
      Demadex®, Lasix®) and systemic or inhaled glucocorticoids (eg, dexamethasone,
      fluticasone, methylprednisolone, prednisolone, prednisone, Cortef®, Medrol®).
  - type: paragraph
    text: This medicine lowers the amount of sodium in your blood. Check with your
      doctor right away if you have confusion, nausea, vomiting, muscle cramps or
      spasms, or unusual tiredness or weakness.
  - type: paragraph
    text: Desmopressin may rarely cause severe allergic reactions, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have a rash, itching, swelling of the face, tongue,
      and throat, trouble breathing, or chest pain after you use this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - confusion
      - cough
      - difficulty swallowing
      - dizziness
      - drowsiness
      - fever
      - puffiness or swelling of the eyelids or around the eyes
      - seizures
      - skin rash, hives, or itching
      - tightness in the chest
      - trouble breathing
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - body aches or pain
      - chest pain
      - decreased urine output
      - ear congestion
      - fast, irregular, pounding, or racing heartbeat or pulse
      - headache
      - increased thirst
      - loss of consciousness
      - loss of voice
      - muscle pain or cramps
      - nausea
      - nervousness
      - nosebleed
      - pounding in the ears
      - runny or stuffy nose
      - slow or fast heartbeat
      - sneezing
      - sore throat
      - swelling of the face, ankles, or hands
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody nose
      - burning, dry, or itching eyes
      - diarrhea
      - eye discharge or excessive tearing
      - indigestion
      - loss of appetite
      - passing gas
      - redness, pain, or swelling of the eye, eyelid, or inner lining of the eyelid
      - stomach pain, fullness, or discomfort
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - feeling of warmth
      - heartburn
      - redness of the face, neck, arms, and upper chest
      - sleepiness or unusual drowsiness
      - stomach cramps
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
