        nostrils. Your doctor may adjust the dose as needed. Children younger than
        3 months of age—Use and dose must be determined by your doctor.'
      - 'For treatment of hemophilia A or won Willebrand disease: Adults and children
        13 years of age and older—One spray (0.1 milliliter) in each nostril as a
        single dose per day. Your doctor may adjust the dose as needed. Children 11
        months to 12 years of age—Use and dose must be determined by your doctor.
        Children younger than 11 months of age—Use is not recommended.'
      - 'For treatment of nocturnal polyuria: Adults younger than 65 years of age
