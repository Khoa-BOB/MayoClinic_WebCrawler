title: Desmopressin (nasal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: DDAVP
    - type: paragraph
      text: DDAVP Rhinal Tube
    - type: paragraph
      text: Minirin
    - type: paragraph
      text: Noctiva
    - type: paragraph
      text: Stimate
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Desmopressin nasal spray is used to treat central cranial diabetes insipidus.
      This is a condition that causes the body to lose too much fluid and become dehydrated.
      It is also used to control frequent urination and increased thirst caused by
      certain types of brain injury or brain surgery. The Stimate® nasal spray is
      used to treat bleeding in patients with hemophilia A or von Willebrand disease
      (Type I).
  - type: paragraph
    text: Noctiva™ nasal spray is used to treat nocturnal polyuria in adults who awaken
      two or more times to urinate at night. Nocturnal polyuria is a condition where
      your body makes too much urine at night. Your doctor will need to measure your
      urine and the times that you urinate for 24 hours to determine if you have nocturnal
      polyuria.
  - type: paragraph
    text: Desmopressin is similar to a hormone that is produced in the body. It acts
      on the kidneys to reduce the flow of urine. For bleeding, desmopressin increases
      the blood levels of factor VIII and von Willebrand factor. This results in less
      bleeding for patients who have low levels of these agents.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Spray
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of desmopressin nasal spray to treat
        central diabetes insipidus in children 3 months of age and older for desmopressin
        acetate or in children 4 years of age and older for DDAVP® . Safety and efficacy
        have been established.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Stimate® to treat hemophilia A
        and von Willebrand disease in children 11 months of age and older. However,
        use is not recommended in children younger than 11 months of age.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Noctiva™ in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of desmopressin nasal spray in the
        elderly. However, elderly patients are more likely to have age-related liver,
        kidney, or heart problems, which may require caution and an adjustment in
        the dose for patients receiving desmopressin.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Noctiva™ in the elderly. However,
        elderly patients are more likely to have hyponatremia (low sodium in the blood),
        which may require caution and an adjustment in the dose for patients receiving
        Noctiva™ .
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bumetanide
      - Ethacrynic Acid
      - Furosemide
      - Torsemide
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aceclofenac
      - Acemetacin
      - Acetohexamide
      - Alfentanil
      - Amineptine
      - Amitriptyline
      - Amitriptylinoxide
      - Amoxapine
      - Amtolmetin Guacil
      - Anileridine
      - Aspirin
      - Bendroflumethiazide
      - Benzhydrocodone
      - Benzthiazide
      - Bromfenac
      - Bufexamac
      - Buprenorphine
      - Butorphanol
      - Carbamazepine
      - Celecoxib
      - Chlorothiazide
      - Chlorpromazine
      - Chlorpropamide
      - Chlorthalidone
      - Choline Salicylate
      - Citalopram
      - Clomipramine
      - Clonixin
      - Clopamide
      - Codeine
      - Desipramine
      - Dexibuprofen
      - Dexketoprofen
      - Dezocine
      - Diacetylmorphine
      - Diazoxide
      - Dibenzepin
      - Diclofenac
      - Difenoxin
      - Diflunisal
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood clotting problems or
      - Hypertension (high blood pressure) or
      - Hypotension (low blood pressure) or
      - Tachycardia (increased heart rate)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Coronary artery disease or
      - Cystic fibrosis or
      - Heart failure or
      - Kidney problems or
      - Polydipsia (excessive thirst), habitual or psychogenic—Use with caution. May
        cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Head injury or
      - Hypertension (high blood pressure), uncontrolled or
      - Urinary retention, or history of—Noctiva™ can cause fluid retention, and should
        not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Gastroenteritis or
      - Infection (systemic) or
      - Polydipsia (excessive thirst) or
      - Primary nocturnal enuresis (bed-wetting at night) or
      - Salt-wasting nephropathies or
      - Syndrome of inappropriate antidiuretic hormone (SIADH), known or suspected—Noctiva™
        should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Hyponatremia (low sodium in the blood), or history of or
      - Kidney disease, moderate to severe—Should not be used in patients with these
        conditions.
    - type: list
      ordered: false
      items:
      - Nose problems (eg, blockage, nasal mucosa atrophy, rhinitis) or
      - Nose surgery (eg, transsphenoidal hypophysectomy)—Use with caution. May increase
        risk for more serious side effects.
    - type: list
      ordered: false
      items:
      - Type IIB von Willebrand disease—Stimate® should not be used in patients with
        this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine exactly as directed by your doctor . Do not use more of
      it, do not use it more often, and do not use it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with Medication Guide or patient information leaflet
      and patient instructions. Read and follow these instructions carefully. Ask
      your doctor if you have any questions.
  - type: paragraph
    text: This medicine should only be used in the nose .
  - type: paragraph
    text: Your doctor may limit the amount of fluid or water you drink. Follow the
      instructions carefully to prevent unwanted effects.
  - type: paragraph
    text: 'To use the nasal spray :'
  - type: list
    ordered: false
    items:
    - When used for the first time, the spray must be primed. Press the pump down
      4 times. If the spray is not used for 1 week, prime the pump again by pressing
      once.
    - Gently blow your nose before using the spray. Tilt your head back slightly and
      insert the tip of the nose piece into your nostril.
    - Close the opposite nostril with a finger. Release one spray and breathe in gently
      at the same time.
    - Hold your breath for a few seconds then breathe out slowly through the mouth.
    - If a second dose is needed, spray the opposite nostril using the same steps.
    - Do not blow your nose or tip your head back after using the spray.
    - Wipe the tip of the bottle with a clean, dry tissue and replace the cap.
    - Throw away any unused medicine after 25 sprays (Stimate®) or 50 sprays (DDAVP®
      or desmopressin generic).
  - type: paragraph
    text: 'To use the DDAVP® Rhinal Tube nasal system :'
  - type: list
    ordered: false
    items:
    - The rhinal tube applicator is a soft, flexible plastic tube with numbers printed
      on the side. The numbers represent the dose.
    - Place the correct amount of medicine in the tube by inserting the tip of the
      container in the end of the tube that is marked with an arrow.
    - Put the end of the tube that is marked with an arrow into one nostril and put
      the other end into your mouth.
    - Hold your breath, tilt the head back, and blow with a short, strong puff until
      all the medicine is sprayed into the nose.
    - Do not let medicine run into your throat.
    - For young children, an adult must blow the medicine into the nose.
    - Wash the tube with water and shake it to remove all of the water.
    - Put the seal back on the container tip and replace the plastic cap.
  - type: paragraph
    text: 'To use the Noctiva™ nasal spray :'
  - type: list
    ordered: false
    items:
    - When used for the first time, the spray must be primed. Press the pump down
      5 times. If the spray is not used for more than 3 days, prime the pump again
      by pressing 2 times.
    - Do not shake the bottle.
    - Gently blow your nose before using the spray. Tilt your head back slightly and
      insert the nasal applicator into your left or right nostril.
    - Close the opposite nostril with a finger. Release one spray and breathe in gently
      at the same time.
    - Wipe the nasal applicator with a clean, dry tissue and replace the cap.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For nasal dosage form (nasal spray): For treatment of central diabetes insipidus:
        DDAVP®: Adults—10 micrograms (mcg) given into one nostril. Your doctor may
        increase your dose up to 40 mcg divided into 2 or 3 doses per day. Children
        4 years of age and older—At first, 10 mcg once a day into one nostril. Your
        doctor may increase the dose up to 30 mcg given once a day or divided into
        2 doses (20 mcg in the morning and 10 mcg at nighttime). Children younger
        than 4 years of age—Use is not recommended. Desmopressin acetate: Adults and
        children 13 years of age and older—0.1 to 0.4 milliliter (mL) given as a single
        dose or divided into 2 or 3 doses per day. The dose is given in one nostril
        or divided and given in both nostrils. Your doctor may adjust the dose as
        needed. Children 3 months to 12 years of age—0.05 to 0.3 mL given as a single
        dose or divided into 2 doses per day. The dose is given in one nostril or
        divided and given in both nostrils. Your doctor may adjust the dose as needed.
        Children younger than 3 months of age—Use and dose must be determined by your
        doctor. For treatment of hemophilia A or won Willebrand disease: Adults and
        children 13 years of age and older—One spray (0.1 milliliter) in each nostril
        as a single dose per day. Your doctor may adjust the dose as needed. Children
        11 months to 12 years of age—Use and dose must be determined by your doctor.
        Children younger than 11 months of age—Use is not recommended. For treatment
        of nocturnal polyuria: Adults younger than 65 years of age who are not at
        increased risk for hyponatremia—One spray (1.66 micrograms [mcg]) in either
        left or right nostril 30 minutes before going to bed. Older adults 65 years
        of age or older—At first, one spray (0.83 mcg) in either left or right nostril
        30 minutes before going to bed. After 7 days, your doctor will increase your
        dose to 1.66 mcg as needed. Children—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of central diabetes insipidus: DDAVP®: Adults—10 micrograms
        (mcg) given into one nostril. Your doctor may increase your dose up to 40
