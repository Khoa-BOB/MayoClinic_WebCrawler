title: Tryptophan (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Aminomine
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: L-tryptophan is used along with other medications to treat mental depression.
      Also, L-tryptophan is used along with lithium to treat bipolar disorder.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of L-tryptophan in children with
        use in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of L-tryptophan in the elderly
        with use in other age groups.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Furazolidone
      - Iproniazid
      - Isocarboxazid
      - Linezolid
      - Methylene Blue
      - Moclobemide
      - Phenelzine
      - Procarbazine
      - Rasagiline
      - Selegiline
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alfentanil
      - Almotriptan
      - Amitriptyline
      - Amoxapine
      - Amphetamine
      - Benzhydrocodone
      - Benzphetamine
      - Buprenorphine
      - Butorphanol
      - Citalopram
      - Clomipramine
      - Clorgyline
      - Codeine
      - Cyclobenzaprine
      - Desvenlafaxine
      - Dextroamphetamine
      - Dextromethorphan
      - Dihydrocodeine
      - Dolasetron
      - Doxepin
      - Duloxetine
      - Escitalopram
      - Fenfluramine
      - Fentanyl
      - Fluoxetine
      - Fluvoxamine
      - Frovatriptan
      - Gepirone
      - Granisetron
      - Hydrocodone
      - Hydromorphone
      - Hydroxyamphetamine
      - Hydroxytryptophan
      - Imipramine
      - Lasmiditan
      - Levomilnacipran
      - Levorphanol
      - Lisdexamfetamine
      - Lithium
      - Lorcaserin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Achlohydria or malabsorption (digestion problems)—L-tryptophan may cause breathing
        problems in patients with certain types of digestion problems
      - Bladder cancer—L-tryptophan may increase the risk of bladder cancer
      - Cataracts—L-tryptophan may cause cataracts
      - Diabetes mellitus (sugar diabetes)—L-tryptophan may cause diabetes in patients
        with a family history of diabetes
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take with a low-protein, carbohydrate-rich meal or snack to prevent an upset
      stomach.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules or tablets): For mental depression: Adults—8
        to 12 grams per day, given in 3 to 4 equally divided doses Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For mental depression: Adults—8 to 12 grams per day, given in 3 to 4 equally
        divided doses Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—8 to 12 grams per day, given in 3 to 4 equally divided doses
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits,
      to allow dosage adjustments and help reduce any side effects.
  - type: paragraph
    text: This medicine may cause some people to become drowsy, dizzy, or less alert
      than they are normally. Make sure you know how you react to this medicine before
      you drive, use machines, or do anything else that could be dangerous if you
      are dizzy or are not alert.
  - type: paragraph
    text: This medicine may cause dryness of the mouth. Using sugarless candy or gum,
      ice, or a saliva substitute may be helpful. Check with your physician or dentist
      if dry mouth continues for more than 2 weeks.
  - type: paragraph
    text: Avoid excessive exposure to ultraviolet light to reduce the chance of cataract
      formation.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  subsections:
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    - type: list
      ordered: false
      items:
      - Agitation
      - confusion
      - diarrhea
      - fever
      - overactive reflexes
      - poor coordination
      - restlessness
      - shivering
      - sweating
      - talking or acting with excitement you cannot control
      - trembling or shaking
      - twitching
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    - type: list
      ordered: false
      items:
      - Dizziness
      - drowsiness
      - dry mouth
      - headache
      - loss of appetite
      - nausea
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
