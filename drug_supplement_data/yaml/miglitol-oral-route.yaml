    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Digestion problems or
      - Inflammatory bowel disease or
      - Intestinal blockage or
      - Other intestinal problems—Miglitol should not be used
    - type: list
      ordered: false
      items:
      - Kidney disease—Higher levels of miglitol may result and a smaller dose may
        be needed
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Follow carefully the special meal plan you doctor gave you. This is the
      most important part of controlling your condition, and is necessary if the medicine
      is to work properly. Also, exercise regularly and test for sugar in your blood
      or urine as directed.
  - type: paragraph
    text: For this medicine to work properly it should be taken with the first bite
      of each main meal.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For type 2 diabetes: Adults—At first the
        dose is 25 milligrams (mg) three times a day, at the start (with the first
        bite) of each main meal. After four to eight weeks, your doctor may increase
        your dose to 50 mg three times a day. Then, after an additional twelve weeks,
        if necessary, your doctor may increase your dose to 100 mg three times a day.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For type 2 diabetes: Adults—At first the dose is 25 milligrams (mg) three
        times a day, at the start (with the first bite) of each main meal. After four
        to eight weeks, your doctor may increase your dose to 50 mg three times a
        day. Then, after an additional twelve weeks, if necessary, your doctor may
        increase your dose to 100 mg three times a day. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first the dose is 25 milligrams (mg) three times a day, at the start
        (with the first bite) of each main meal. After four to eight weeks, your doctor
        may increase your dose to 50 mg three times a day. Then, after an additional
        twelve weeks, if necessary, your doctor may increase your dose to 100 mg three
        times a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will want to check your progress at regular visits, especially
      during the first few weeks that you take this medicine.
  - type: paragraph
    text: 'It is very important to follow carefully any instructions from your health
      care team about:'
  - type: list
    ordered: false
    items:
    - Alcohol—Drinking alcohol may cause severe low blood sugar. Discuss this with
      your health care team.
    - Other medicines—Do not take other medicines during the time you are taking miglitol
      unless they have been discussed with your doctor. This especially includes nonprescription
      medicines such as aspirin, and medicines for appetite control, asthma, colds,
      cough, hay fever, or sinus problems.
    - Counseling—Other family members need to learn how to prevent side effects or
      help with side effects if they occur. Also, patients with diabetes may need
      special counseling about diabetes medicine dosing changes that might occur because
      of lifestyle changes, such as changes in exercise and diet. Furthermore, counseling
      on contraception and pregnancy may be needed because of the problems that can
      occur in patients with diabetes during pregnancy.
    - Travel—Keep a recent prescription and your medical history with you. Be prepared
      for an emergency as you would normally. Make allowances for changing time zones
      and keep your meal times as close as possible to your usual meal times.
  - type: paragraph
    text: In case of emergency—There may be a time when you need emergency help for
      a problem caused by your diabetes. You need to be prepared for these emergencies.
      It is a good idea to wear a medical identification (ID) bracelet or neck chain
      at all times. Also, carry an ID card in your wallet or purse that says that
      you have diabetes and a list of all your medicines.
  - type: paragraph
    text: Symptoms of hypoglycemia (low blood sugar) include anxiety; behavior change
      similar to being drunk; blurred vision; cold sweats; confusion; cool, pale skin;
      difficulty in thinking; drowsiness; excessive hunger; fast heartbeat; headache
      (continuing); nausea; nervousness; nightmares; restless sleep; shakiness; slurred
      speech; or unusual tiredness or weakness.
  - type: paragraph
    text: Miglitol does not cause low blood sugar. However, it can occur if you delay
      or miss a meal or snack, drink alcohol, exercise more than usual, cannot eat
      because of nausea or vomiting, or take miglitol with another type of diabetes
      medicine. Symptoms of low blood sugar must be treated before they lead to unconsciousness
      (passing out). Different people feel different symptoms of low blood sugar.
      It is important that you learn which symptoms of low blood sugar you usually
      have so that you can treat it quickly.
  - type: paragraph
    text: If symptoms of low blood sugar occur, eat glucose tablets or gel or honey,
      or drink fruit juice to relieve the symptoms. Table sugar (sucrose) or regular
      (nondiet) soft drinks will not work. Also, check your blood for low blood sugar.
      Glucagon is used in emergency situations when severe symptoms such as seizures
      (convulsions) or unconsciousness occur. Have a glucagon kit available, along
      with a syringe or needle, and know how to use it. Members of your household
      also should know how to use it.
  - type: paragraph
    text: Symptoms of hyperglycemia (high blood sugar) include blurred vision; drowsiness;
      dry mouth; flushed, dry skin; fruit-like breath odor; increased urination; ketones
      in urine; loss of appetite; stomachache, nausea, or vomiting; tiredness; troubled
      breathing (rapid and deep); unconsciousness; or unusual thirst.
  - type: paragraph
    text: High blood sugar may occur if you do not exercise as much as usual, have
      a fever or infection, do not take enough or skip a dose of your diabetes medicine,
      or overeat or do not follow your meal plan.
  - type: paragraph
    text: If symptoms of high blood sugar occur, check your blood sugar level and
      then call your health care professional for instructions.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloated full feeling
      - excess air or gas in stomach or intestines
      - increase in bowel movements
      - loose stools
      - passing gas
      - soft stools
      - stomach or abdomen pain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
