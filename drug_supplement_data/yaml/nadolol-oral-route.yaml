title: Nadolol (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Corgard
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Alti-Nadolol
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Nadolol is used alone or together with other medicines to treat high blood
      pressure (hypertension). High blood pressure adds to the workload of the heart
      and arteries. If it continues for a long time, the heart and arteries may not
      function properly. This can damage the blood vessels of the brain, heart, and
      kidneys, resulting in a stroke, heart failure, or kidney failure. High blood
      pressure may also increase the risk of heart attacks. These problems may be
      less likely to occur if blood pressure is controlled.
  - type: paragraph
    text: Nadolol is also used to treat severe chest pain (angina).
  - type: paragraph
    text: This medicine is a beta-blocker. It works by affecting the response to nerve
      impulses in certain parts of the body, like the heart. As a result, the heart
      beats slower and decreases the blood pressure. When the blood pressure is lowered,
      the amount of blood and oxygen is increased to the heart.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of nadolol in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of nadolol in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Albuterol
      - Ceritinib
      - Clonidine
      - Crizotinib
      - Darunavir
      - Diltiazem
      - Dronedarone
      - Epinephrine
      - Fenoldopam
      - Fexinidazole
      - Fingolimod
      - Formoterol
      - Indacaterol
      - Iobenguane I 131
      - Iohexol
      - Itraconazole
      - Ketoconazole
      - Lacosamide
      - Landiolol
      - Levalbuterol
      - Lidocaine
      - Melatonin
      - Methylergonovine
      - Olodaterol
      - Oxymetazoline
      - Phenelzine
      - Ponesimod
      - Rivastigmine
      - Salmeterol
      - Siponimod
      - Terbutaline
      - Verapamil
      - Vilanterol
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Aceclofenac
      - Acemetacin
      - Acetyldigoxin
      - Albiglutide
      - Alfuzosin
      - Alogliptin
      - Amtolmetin Guacil
      - Aspirin
