    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Green Tea
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma or
      - Bradycardia (slow heartbeat) or
      - Cardiogenic shock (shock caused by heart attack) or
      - Heart block or
      - Heart failure—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Blood vessel disease or
      - Lung disease (eg, bronchitis, emphysema)—Use with caution. This medicine may
        worsen these conditions.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hyperthyroidism (overactive thyroid) or
      - Hypoglycemia (low blood sugar)—May cover up some of the signs and symptoms
        of these diseases, such as a fast heartbeat.
    - type: list
      ordered: false
      items:
      - Kidney disease or—Use with caution. The effects may be increased because of
        slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Patients who are fasting (eg, surgery, not eating regularly, vomiting)—May
        increase risk of hypoglycemia (low blood sugar).
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. Your dose may need to be changed several times in order to find
      out what works best for you.
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium. Your doctor will tell you which of these are most important
      for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure, but
      it does help control it. You must continue to take it as directed if you expect
      to lower your blood pressure and keep it down. You may have to take high blood
      pressure medicine for the rest of your life. If high blood pressure is not treated,
      it can cause serious problems such as heart failure, blood vessel disease, stroke,
      or kidney disease.
  - type: paragraph
    text: You may take this medicine with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For high blood pressure: Adults—At first,
        40 milligrams (mg) once a day. Your doctor may increase your dose as needed.
        Children—Use and dose must be determined by your doctor. For severe chest
        pain: Adults—At first, 40 milligrams (mg) once a day. Your doctor may increase
        your dose as needed. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—At first, 40 milligrams (mg) once a day.
        Your doctor may increase your dose as needed. Children—Use and dose must be
        determined by your doctor.'
      - 'For severe chest pain: Adults—At first, 40 milligrams (mg) once a day. Your
        doctor may increase your dose as needed. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 40 milligrams (mg) once a day. Your doctor may increase your
        dose as needed.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—At first, 40 milligrams (mg) once a day. Your doctor may increase your
        dose as needed.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Nadolol may cause heart failure in some patients. Check with your doctor
      right away if you are having chest pain or discomfort, dilated neck veins, extreme
      fatigue, irregular breathing, an irregular heartbeat, swelling of the face,
      fingers, feet, or lower legs, trouble breathing, or weight gain.
  - type: paragraph
    text: Do not suddenly stop taking this medicine without first checking with your
      doctor . Your doctor may want you to gradually reduce the amount you are taking
      before stopping it completely. Some conditions may become worse when the medicine
      is stopped suddenly, which can be dangerous.
  - type: paragraph
    text: This medicine may cause changes in blood sugar levels. Also, this medicine
      may cover up the symptoms of low blood sugar (including fast heartbeat) and
      increase the risk for serious or prolonged hypoglycemia (low blood sugar). Check
      with your doctor if you notice a change in your normal symptoms or a change
      in the results of your blood or urine sugar tests. Call your doctor right away
      if you have anxiety, blurred vision, chills, cold sweats, coma, confusion, cool,
      pale skin, depression, dizziness, fast heartbeat, headache, increased hunger,
      nausea, nervousness, nightmares, seizures, shakiness, slurred speech, or unusual
      tiredness or weakness.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. Do not stop taking this medicine before surgery without your
      doctor's approval .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      for appetite control, asthma, colds, cough, hay fever, or sinus problems, since
      they may increase your blood pressure.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain or discomfort
      - confusion
      - dilated neck veins
      - dizziness, faintness, or lightheadedness when getting up from a lying or sitting
        position suddenly
      - extreme fatigue
      - irregular breathing
      - lightheadedness, dizziness, or fainting
      - paleness or cold feeling in fingertips and toes
      - slow or irregular heartbeat
      - sweating
      - swelling of face, fingers, feet, or lower legs
      - tingling or pain in fingers or toes when exposed to cold
      - trouble breathing
      - unusual tiredness or weakness
      - weight gain
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - changes in behavior
      - chest tightness
      - cough
      - noisy breathing
      - slurred speech
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blurred vision
      - chills
      - cold sweats
      - coma
      - confusion
      - cool, pale skin
      - depression
      - dizziness
      - fast heartbeat
      - headache
      - increased hunger
      - nausea
      - nervousness
      - nightmares
      - seizures
      - shakiness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloated
      - continuing ringing or buzzing or other unexplained noise in ears
      - decreased interest in sexual intercourse
      - diarrhea
      - difficulty having a bowel movement (stool)
      - drowsiness
      - dry mouth, eyes, or skin
      - excess air or gas in stomach or intestines
      - full feeling
      - gas in stomach
      - hair loss, thinning of hair
      - hearing loss
      - heartburn
      - inability to have or keep an erection
      - itching skin
      - loss in sexual ability, desire, drive, or performance
      - loss of appetite
      - passing gas
      - rash
      - relaxed and calm
      - sleepiness
      - stomach pain
      - stomach soreness or discomfort
      - stuffy nose
      - vomiting
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
