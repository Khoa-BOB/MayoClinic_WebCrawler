title: Meningococcal vaccine, diphtheria conjugate (intramuscular route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Meningococcal diphtheria conjugate vaccine is an active immunizing agent
      used to prevent infection by certain groups of meningococcal bacteria. The vaccine
      works by causing your body to produce its own protection (antibodies) against
      the disease.
  - type: paragraph
    text: The following information applies only to the meningococcal vaccine used
      for meningococcal bacteria Groups A, C, Y, and W-135. These groups cause nearly
      all of the meningococcal meningitis cases in the U.S. The vaccine will not protect
      against infection caused by other meningococcal bacteria groups, such as Group
      B.
  - type: paragraph
    text: Meningococcal infection can cause life-threatening illnesses, such as meningococcal
      meningitis, which affects the brain, and meningococcemia, which affects the
      blood. Some persons with meningococcal meningitis and/or meningococcemia also
      may die. The rate of these diseases peak in adolescence and early adulthood
      and are more likely to occur in persons with certain diseases or conditions
      that make them more susceptible to a meningococcal infection or more likely
      to develop serious problems from a meningococcal infection.
  - type: paragraph
    text: 'Immunization against meningococcal disease is recommended for persons 9
      months to 55 years of age who are at risk of getting the disease because:'
  - type: list
    ordered: false
    items:
    - They have certain diseases or conditions that make them more susceptible to
      a meningococcal infection or more likely to develop serious problems from a
      meningococcal infection.
    - They are living in, working in, or visiting an area where there is a strong
      possibility of contracting meningococcal disease. .
  - type: paragraph
    text: This vaccine is to be administered only by or under the supervision of your
      doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of meningococcal diphtheria conjugate vaccine in infants younger
        than 9 months of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of meningococcal diphtheria conjugate vaccine in adults older
        than 55 years of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atidarsagene Autotemcel
      - Elivaldogene Autotemcel
      - Measles Virus Vaccine, Live
      - Ocrelizumab
      - Teplizumab-mzwv
      - Ublituximab-xiiy
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Guillain-Barré syndrome (nerve disease that causes paralysis), history of—Should
        not be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Hemophilia (blood disorder with tendency to bleed uncontrollably) or
      - Illness, recent or critical or
      - Other bleeding problems—May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Immunodeficiency disorder or
      - Weak immune system—This vaccine may not work well in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this vaccine. This vaccine is given as a shot into one of your or your child’s
      muscles.
  - type: paragraph
    text: This vaccine is usually given only once. You will not need a booster dose,
      unless your doctor tells you otherwise.
  - type: paragraph
    text: Vaccine information statements are given to the patient, parent, or guardian
      before receiving this vaccine. Read the information carefully. Ask your doctor
      if you have any questions.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you or your child at regular
      visits to make sure this vaccine is working properly and to check for unwanted
      effects.
  - type: paragraph
    text: The stopper of the vial contains dry natural latex rubber. Make sure your
      doctor knows if you or your child have had an allergic reaction to latex rubber.
  - type: paragraph
    text: Check with your doctor right away if you have a cough, difficulty with swallowing,
      dizziness, fast heartbeat, hives, itching, puffiness or swelling of the eyelids
      or around the eyes, face, lips or tongue, shortness of breath, skin rash, tightness
      in the chest, unusual tiredness or weakness, and/or wheezing. These could be
      symptoms of an allergic reaction to the vaccine.
  - type: paragraph
    text: Contact your doctor immediately if you or your child have sudden weakness
      or are not able to move your arms or legs. This could be a sign of a serious
      condition called Guillain-Barré syndrome (GBS).
  - type: paragraph
    text: Make sure your doctor knows if you or your child are receiving medicine
      or a procedure that may weaken the immune system, such as steroids, cancer medicines,
      or radiation.
  - type: paragraph
    text: It is important that your doctor should know about all other vaccines you
      or your child have recently received, including a flu shot.
  - type: paragraph
    text: It is important to tell your doctor if you become pregnant. Your doctor
      may want you to join a pregnancy registry for patients receiving this vaccine.
  - type: paragraph
    text: This vaccine will not prevent diphtheria, and will not treat symptoms of
      meningococcal infection if you already have the disease.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - hives
      - itching
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - shortness of breath
      - skin rash
      - tightness in the chest
      - unusual tiredness or weakness
      - wheezing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Inability to move the arms and legs
      - fainting
      - sudden and progressing muscle weakness
      - sudden and severe back pain
      - sudden numbness and weakness in the arms and legs
      - weakness of the muscles in your face
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - diarrhea
      - difficulty with moving
      - fever
      - general feeling of discomfort or illness
      - hard lump at the injection site
      - headache
      - irritability
      - loss of appetite
      - muscle pain or stiffness
      - pain in the joints
      - pain, redness, or swelling at the injection site
      - sleepiness
      - weight loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
