    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the oral liquid in the oral dosing dispenser in the refrigerator
        for up to 72 hours before use. You may also keep the medicine at room temperature
        for up to 3 hours.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress while you are
      using this medicine to make sure it is working properly and to check for unwanted
      effects.
  - type: paragraph
    text: Do not use this medicine if you are also using pimozide (Orap®). Using these
      medicines together may cause serious unwanted side effects .
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you have itching, hives, rash, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are using this medicine.
  - type: paragraph
    text: Birth control pills may not work as well while you are using aprepitant.
      To keep from getting pregnant, use another form of birth control together with
      your pills while you are using the medicine and for 1 month after your last
      dose. Other forms of birth control include condoms, diaphragms, or contraceptive
      foams or jellies.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black or tarry stools
      - chills
      - cough
      - fever
      - lower back or side pain
      - painful or difficult urination
      - pale skin
      - shortness of breath
      - sore throat
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - confusion about identity, place, and time
      - diarrhea
      - itching or skin rash
      - joint or muscle pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - redness of the skin
      - red, irritated eyes
      - red skin lesions, often with a purple center
      - slow or irregular heartbeat
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - confusion
      - decreased urination
      - dizziness
      - dry mouth
      - fainting
      - heartburn
      - hiccups
      - increase in heart rate
      - indigestion
      - lack or loss of strength
      - lightheadedness
      - loss of appetite
      - nausea
      - rapid breathing
      - stomach discomfort upset or pain
      - sunken eyes
      - swelling or inflammation of the mouth
      - thirst
      - weight loss
      - wrinkled skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning feeling in the chest or stomach
      - hot flashes
      - indigestion
      - pain or discomfort in the chest, upper stomach, or throat
      - tenderness in the stomach area
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
