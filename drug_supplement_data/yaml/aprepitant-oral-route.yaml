title: Aprepitant (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Emend
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Aprepitant capsules and oral suspension are used in combination with other
      medicines to prevent the nausea and vomiting that may occur during cancer treatment
      (chemotherapy). Aprepitant capsules are also used to prevent nausea and vomiting
      that may occur after surgery. Aprepitant works in the nervous system to block
      the action of a chemical that causes vomiting.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of aprepitant in the pediatric population. Safety and efficacy
        of aprepitant to prevent nausea and vomiting after surgery have not been established
        in children, and to prevent nausea and vomiting caused by cancer medicines
        in children younger than 6 months of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of aprepitant in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Flibanserin
      - Levoketoconazole
      - Lomitapide
      - Pimozide
      - Ranolazine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acalabrutinib
      - Adagrasib
      - Alfentanil
      - Alprazolam
      - Amiodarone
      - Amlodipine
      - Amprenavir
      - Apalutamide
      - Atazanavir
      - Atogepant
      - Avacopan
      - Avapritinib
      - Bedaquiline
      - Benzhydrocodone
      - Boceprevir
      - Bosutinib
      - Brexpiprazole
      - Brigatinib
      - Budesonide
      - Buprenorphine
      - Capivasertib
      - Carbamazepine
      - Cariprazine
      - Celecoxib
      - Ceritinib
      - Cilostazol
      - Cimetidine
      - Ciprofloxacin
      - Clarithromycin
      - Clofazimine
      - Clozapine
      - Cobicistat
      - Cobimetinib
      - Codeine
      - Colchicine
      - Conivaptan
      - Crizotinib
      - Cyclosporine
      - Dabrafenib
      - Daridorexant
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Dexamethasone
      - Methylprednisolone
      - Midazolam
      - Quetiapine
      - Sirolimus
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor to benefit your condition
      as much as possible. Do not take more of it, do not take it more often, and
      do not take it for a longer time than your doctor ordered.
  - type: paragraph
    text: This medicine comes with patient information leaflet. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Aprepitant is given together with other medicines to prevent vomiting from
      chemotherapy . Carefully follow your doctor's instructions about how to take
      the medicines.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Swallow the capsule whole. Do not crush, break, or chew it.
  - type: paragraph
    text: 'To use the oral suspension :'
  - type: list
    ordered: false
    items:
    - For each dose of this medicine, you will receive a prefilled oral dosing dispenser
      that contains your prescribed dose.
    - Call your doctor right away if you or your child is not able to take the prescribed
      dose.
    - Throw away the oral dosing dispenser and cap after each use.
  - type: paragraph
    text: Do not start taking aprepitant if you already have nausea and vomiting.
      Contact your doctor about what to do.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For prevention of nausea and vomiting caused
        by chemotherapy: Adults and children 12 years of age and older—125 milligrams
        (mg) 1 hour before chemotherapy (Day 1). Then, 80 mg once in the morning on
        Days 2 and 3. Children younger than 12 years of age, weighing at least 30
        kilograms (kg), and can swallow a capsule—125 mg 1 hour before chemotherapy
        (Day 1). Then, 80 mg once in the morning on Days 2 and 3. Children younger
        than 12 years of age weighing less than 30 kg—Use and dose must be determined
        by your doctor. For prevention of nausea and vomiting after surgery: Adults—40
        milligrams (mg) within 3 hours before surgery. Children—Use and dose must
        be determined by your doctor.'
      - 'For oral dosage form (powder for suspension): For prevention of nausea and
        vomiting caused by chemotherapy: Adults and children 6 months to 11 years
        of age and cannot swallow the capsule—Dose is based on body weight and must
        be determined by your doctor. The dose is usually 3 milligrams (mg) per kilogram
        (kg) of body weight up to a maximum dose of 125 mg taken 1 hour before chemotherapy
        (Day 1). Then, 2 mg per kg of body weight up to a maximum dose of 80 mg taken
        once in the morning on Days 2 and 3. Children younger than 6 months of age—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For prevention of nausea and vomiting caused by chemotherapy: Adults and
        children 12 years of age and older—125 milligrams (mg) 1 hour before chemotherapy
        (Day 1). Then, 80 mg once in the morning on Days 2 and 3. Children younger
        than 12 years of age, weighing at least 30 kilograms (kg), and can swallow
        a capsule—125 mg 1 hour before chemotherapy (Day 1). Then, 80 mg once in the
        morning on Days 2 and 3. Children younger than 12 years of age weighing less
        than 30 kg—Use and dose must be determined by your doctor.'
      - 'For prevention of nausea and vomiting after surgery: Adults—40 milligrams
        (mg) within 3 hours before surgery. Children—Use and dose must be determined
        by your doctor.'
    - type: list
