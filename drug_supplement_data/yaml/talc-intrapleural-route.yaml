title: Talc (intrapleural route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Sclerosol Intrapleural
    - type: paragraph
      text: Steritalc
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Talc is sprayed through a tube into the chest area around the lungs. It
      is given to people who have breathing problems caused by a buildup of fluid
      or air in this area. Talc is used after the fluid has been drained out, to prevent
      the problem from returning.
  - type: paragraph
    text: You may be familiar with talc used as an ingredient in dusting powders (talcum
      powder). The talc used for preventing fluid buildup in the lungs is a special
      grade of talc that has been sterilized (made germ-free).
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of talc powder in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of talc powder in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Other lung disease or breathing problems (eg, pneumonitis, acute respiratory
        distress syndrome)—Use with caution. May make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor will give you this medicine during a medical procedure, such as
      a thoracoscopy. This medicine is injected through a tube into your chest and
      around the lungs.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your closely to make sure that
      this medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant during treatment
      and for 5 months after the last dose of this medicine. If you think you have
      become pregnant while using the medicine, tell the doctor right away.
  - type: paragraph
    text: This medicine may cause serious lung or breathing problems (eg, pneumonitis,
      acute respiratory distress syndrome). Check with your doctor right away if you
      have blue lips, fingernails, or skin, chest pain, chills, cough, fever, general
      feeling of discomfort or illness, thickening or bronchial secretions, or trouble
      breathing.
  - type: paragraph
    text: This medicine may contain small amounts of asbestos, which may increase
      the risk of getting cancer. Talk with your doctor if you have any concerns about
      this.
  - type: paragraph
    text: Some men who use this medicine have become infertile (unable to have children).
      Talk with your doctor before using this medicine if you plan to have children.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect the results of certain medical tests.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blue lips, fingernails, or skin
      - chest pain, discomfort, or tightness
      - chills
      - coughing or spitting up blood
      - cough with thick mucous
      - dizziness
      - fainting
      - fast, slow, or irregular heartbeat
      - general feeling of discomfort or illness
      - trouble breathing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, swelling, warmth, or pain on your skin where the spray tube was
        inserted
    - type: paragraph
      text: Some of the above side effects could be caused by having a tube placed
        in your chest or other procedures that were done at the time the talc was
        used, as well as by the talc. Other side effects not listed above may also
        occur in some patients. If you notice any other effects, check with your doctor.
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
