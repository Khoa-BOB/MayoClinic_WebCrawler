    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to see if this medicine is working and allow for changes in
      the dose. Blood tests may be needed to check for any unwanted effects.
  - type: paragraph
    text: Tell your doctor if you are pregnant or planning to become pregnant. Using
      this medicine during the later part of a pregnancy may cause problems in your
      newborn baby (eg, sedation or withdrawal symptoms). Tell your doctor right away
      if your baby has an abnormal sleep pattern, diarrhea, feeding problems, a high-pitched
      cry, irritability, low muscle tone, restlessness, shakiness or tremors, sluggishness,
      trouble breathing, weight loss, vomiting, or fails to gain weight. If you think
      you have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may be habit-forming. If you feel that the medicine is not
      working as well, do not use more than your prescribed dose. Call your doctor
      for instructions.
  - type: paragraph
    text: If you develop any unusual and strange thoughts or behavior while you are
      taking lorazepam be sure to discuss it with your doctor. Some changes that have
      occurred in people taking this medicine are like those seen in people who drink
      alcohol and then act in a manner that is not normal. Other changes may be more
      unusual and extreme, such as confusion, worsening of depression, hallucinations
      (seeing, hearing, or feeling things that are not there), thoughts of killing
      oneself, and unusual excitement, nervousness, or irritability.
  - type: paragraph
    text: This medicine may cause drowsiness, trouble with thinking, trouble with
      controlling movements, or trouble with seeing clearly. Make sure you know how
      you react to this medicine before you drive, use machines, or do anything else
      that could be dangerous if you are not alert or able to think or see well .
  - type: paragraph
    text: 'Symptoms of an overdose include: blurred vision, change in consciousness,
      confusion, dizziness, faintness, or lightheadedness when getting up suddenly
      from a lying or sitting position, hallucinations, increased sweating, loss of
      consciousness, loss of strength or energy, muscle pain or weakness, nightmares,
      shakiness and unsteady walk, slow or irregular heartbeat, sweating, trouble
      in speaking, unsteadiness, trembling, or other problems with muscle control
      or coordination, trouble sleeping, unusual excitement, nervousness, restlessness,
      or irritability, or unusual tiredness or weakness . Call your doctor right away
      if you notice these symptoms.'
  - type: paragraph
    text: This medicine may cause respiratory depression (serious breathing problem
      that can be life-threatening), especially when used with narcotic pain medicines.
      Tell your doctor if you are using any narcotic medicine.
  - type: paragraph
    text: Do not stop taking it without checking with your doctor first. Your doctor
      may want you to gradually reduce the amount you are using before stopping it
      completely. This may help prevent a worsening of your condition and reduce the
      possibility of withdrawal symptoms, including hallucinations, headache, seizures,
      stomach or muscle cramps, tremors, trouble sleeping, or unusual behavior.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other central nervous
      system (CNS) depressants. CNS depressants are medicines that slow down the nervous
      system, which may cause drowsiness or make you less alert. Some examples of
      CNS depressants are antihistamines or medicine for hay fever, allergies, or
      colds, sedatives, tranquilizers, or sleeping medicine, prescription pain medicine
      or narcotics, barbiturates or medicine for seizures, muscle relaxants, or anesthetics
      (numbing medicines), including some dental anesthetics. This effect may last
      for a few days after you stop taking this medicine. Check with your doctor before
      taking any of the above while you are using this medicine .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
