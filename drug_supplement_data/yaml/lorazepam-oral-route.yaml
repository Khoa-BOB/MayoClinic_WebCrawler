  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol or drug abuse or dependence, or history of or
      - Lung or breathing problems (eg, COPD, respiratory depression, sleep apnea)
        or
      - Seizures, or history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Depression or
      - Mental problems (eg, psychosis)—Use is not recommended in patients with these
        conditions.
    - type: list
      ordered: false
      items:
      - Glaucoma, acute narrow-angle—Should not be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor. Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. If too much of this medicine is taken for a long time, it may
      become habit-forming (causing mental or physical dependence).
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the tablet whole. Do not crush, break, or chew it.
  - type: paragraph
    text: Swallow the extended-release capsule whole. Do not crush, break, or chew
      it. If you cannot swallow the extended-release capsule, you may open it and
      sprinkle the medicine onto a tablespoon of applesauce. Stir this mixture well
      and swallow it without chewing. Drink water after swallowing the mixture. Take
      the mixture within 2 hours of mixing. Do not store for future use.
  - type: paragraph
    text: Measure the oral liquid using the marked medicine dropper that comes with
      the package. Dilute each dose with water, juice, soda, applesauce and puddings.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (oral solution): For anxiety: Adults and children 12
        years of age and older—2 to 6 milligrams (mg) in divided doses per day. Your
        doctor may adjust your dose as needed. Older adults—At first, 1 to 2 mg in
        divided doses per day. Your doctor may adjust your dose as needed. Children
        younger than 12 years of age—Use and dose must be determined by your doctor.'
      - 'For oral dosage form (tablets): For anxiety: Adults and children 12 years
        of age and older—At first, 2 to 3 milligrams (mg) in divided doses per day.
        Your doctor may adjust your dose as needed. Older adults—At first, 1 to 2
        mg in divided doses per day. Your doctor may adjust your dose as needed and
        tolerated. Children younger than 12 years of age—Use and dose must be determined
        by your doctor. For insomnia caused by anxiety or transient situational stress:
        Adults and children 12 years of age and older—2 to 4 milligrams (mg) taken
        as a single dose at bedtime. Your doctor may adjust your dose as needed. Children
        younger than 12 years of age—Use and dose must be determined by your doctor.'
      - 'For oral dosage form (extended-release capsules): For anxiety: Adults—One
        capsule once a day in the morning. Dose is based on the total daily dose of
        lorazepam tablets, which you take three times a day in equally divided doses.
        Your doctor may adjust your dose as needed. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For anxiety: Adults and children 12 years of age and older—2 to 6 milligrams
        (mg) in divided doses per day. Your doctor may adjust your dose as needed.
        Older adults—At first, 1 to 2 mg in divided doses per day. Your doctor may
        adjust your dose as needed. Children younger than 12 years of age—Use and
        dose must be determined by your doctor.'
    - type: list
