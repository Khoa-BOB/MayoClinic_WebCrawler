title: Isosulfan blue (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Lymphazurin
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Lymphazurin 1%
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Isosulfan blue injection is used as an aid in a procedure called lymphography
      (medical imaging procedure) to test how well your lymphatic system is working
      in certain parts of your body. It is a blue dye that works by staining the lymph
      nodes and lymph vessels. This creates a contrast between the lymph nodes and
      vessels and helps your doctor check for serious medical problems such as lymphedema,
      chyluria (lymph in the urine), chylous ascites (lymph in the stomach), chylothorax
      (lymph in the chest), cancer of the lymph nodes, or other problems of the lymphatic
      system.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of isosulfan blue injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of isosulfan blue injection in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma, history of—Use with caution. May be more likely to experience side
        effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor will give you this medicine in a hospital. This medicine is given
      as a shot under your skin.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress closely while
      you are receiving this medicine. This will allow your doctor to see if the medicine
      is working properly and to decide if you should continue to receive it.
  - type: paragraph
    text: This medicine may cause a serious type of allergic reaction called anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Tell your doctor or nurse right away if you have cold clammy skin; confusion;
      dizziness; lightheadedness; a skin rash; itching; shortness of breath; sweating;
      swelling of the face, tongue, and throat; or trouble with breathing after you
      get the injection.
  - type: paragraph
    text: Make sure your doctor knows if you have had an allergic reaction to any
      dye or medicine given during a test or procedure.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect the results of certain medical tests.
  - type: paragraph
    text: This medicine may cause your urine to turn blue for up to 24 hours after
      you receive this medicine. Talk to your doctor if you have any questions.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cold, clammy skin
      - confusion
      - cough
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - fast, weak pulse
      - hives or welts
      - itching
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - lightheadedness
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness of the skin
      - shortness of breath
      - skin rash
      - sweating
      - tightness in the chest
      - troubled breathing
      - unusual tiredness or weakness
      - wheezing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blue discoloration of the skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
