title: Ritodrine (oral route, intravenous route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ritodrine is used to stop premature labor. This medicine was available only
      with your doctor's prescription.
  - type: paragraph
    text: Ritodrine is no longer available in the United States.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Methacholine
      - Sotalol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - High blood pressure (hypertension), uncontrolled, or
      - Migraine headaches (or history of)—May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Heart or blood vessel disease or
      - Overactive thyroid, uncontrolled—May cause serious side effects on the heart,
        including irregular heartbeat.
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release capsules): Adults: In the first twenty-four
        hours after the doctor stops your intravenous ritodrine, your dose may be
        as high as 40 milligrams (mg) every eight hours. After that, the dose is usually
        40 mg every eight to twelve hours. Your doctor may want you to take oral ritodrine
        up until it is time for you to deliver your baby or until your 37th week of
        pregnancy.'
      - 'For oral dosage form (tablets): Adults: In the first twenty-four hours after
        the doctor stops your intravenous ritodrine, your dose may be as high as 10
        milligrams (mg) every two hours. After that, the dose is usually 10 to 20
        mg every four to six hours. Your doctor may want you to take oral ritodrine
        up until it is time for you to deliver your baby or until your 37th week of
        pregnancy.'
      - 'For injection dosage form: Adults: 50 to 350 micrograms per minute, injected
        into a vein.'
    - type: list
      ordered: false
      items:
      - 'Adults: In the first twenty-four hours after the doctor stops your intravenous
        ritodrine, your dose may be as high as 40 milligrams (mg) every eight hours.
        After that, the dose is usually 40 mg every eight to twelve hours. Your doctor
        may want you to take oral ritodrine up until it is time for you to deliver
        your baby or until your 37th week of pregnancy.'
    - type: list
      ordered: false
      items:
      - 'Adults: In the first twenty-four hours after the doctor stops your intravenous
        ritodrine, your dose may be as high as 10 milligrams (mg) every two hours.
        After that, the dose is usually 10 to 20 mg every four to six hours. Your
        doctor may want you to take oral ritodrine up until it is time for you to
        deliver your baby or until your 37th week of pregnancy.'
    - type: list
      ordered: false
      items:
      - 'Adults: 50 to 350 micrograms per minute, injected into a vein.'
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Check with your doctor right away if your contractions begin again or your
      water breaks.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes over-the-counter (nonprescription) medicines for appetite
      control, asthma, colds, cough, hay fever, or sinus problems since they may increase
      the unwanted effects of this medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain or tightness
      - dizziness or lightheadedness
      - drowsiness
      - dry mouth
      - fast or irregular heartbeat—rare with oral form
      - flushed and dry skin
      - fruit-like breath odor
      - increased urination
      - loss of appetite
      - nausea
      - severe pounding or racing heartbeat—rare with oral form
      - shortness of breath—rare with oral form
      - sleepiness
      - stomachache
      - tiredness
      - troubled breathing (rapid and deep)
      - unusual thirst
      - vomiting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sore throat or fever
      - yellow eyes or skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    - type: list
      ordered: false
      items:
      - Fast or irregular heartbeat (severe)
      - nausea or vomiting (severe)
      - nervousness or trembling (severe)
      - shortness of breath (severe)
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - reddened skin
      - tremors
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - emotional upset
      - jitteriness, nervousness, or restlessness
      - skin rash
    - type: paragraph
      text: 'After you stop using this medicine, it may still produce some side effects
        that need attention. During this period of time, check with your doctor immediately
        if you notice the following side effects:'
    - type: list
      ordered: false
      items:
      - Shortness of breath
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
