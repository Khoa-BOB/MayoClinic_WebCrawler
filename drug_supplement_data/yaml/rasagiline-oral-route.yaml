      items:
      - 'For patients taking rasagiline alone: Adults—1 milligram (mg) once a day.
        Children—Use and dose must be determined by your doctor.'
      - 'For patients taking rasagiline with levodopa: Adults—At first, 0.5 milligram
        (mg) once a day. Your doctor may increase your dose as needed. However, the
        dose is usually not more than 1 mg per day. Children—Use and dose must be
