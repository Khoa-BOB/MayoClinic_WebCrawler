        dose as needed. However, the dose is usually not more than 1 mg per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check your progress at regular visits to
      make sure that this medicine is working properly and to check for unwanted effects.
  - type: paragraph
    text: Do not use this medicine if you are using St. John's wort, cyclobenzaprine,
      dextromethorphan, meperidine, methadone, propoxyphene, tramadol, or used a MAO
      inhibitor within the past 14 days.
  - type: paragraph
    text: If you experience signs and symptoms of high blood pressure, you should
      seek immediate medical attention . Signs and symptoms include severe headache,
      blurred vision or visual disturbances, difficulty thinking, stupor or coma,
      seizures, chest pain, unexplained nausea or vomiting.
  - type: paragraph
    text: Make sure your doctor knows about all the other medicines you are using.
      Rasagiline may cause a serious condition called serotonin syndrome when used
      with some medicines. This especially includes medicines used to treat depression,
      such as citalopram, duloxetine, escitalopram, fluoxetine, fluvoxamine, olanzapine,
      paroxetine, sertraline, venlafaxine, Celexa®, Cymbalta®, Effexor®, Lexapro®,
      Luvox®, Paxil®, Prozac®, Sarafem®, Symbyax®, or Zoloft®. Check with your doctor
      right away if you have agitation, confusion, diarrhea, excitement while talking
      that is not normal, fever, overactive reflexes, poor coordination, restlessness,
      shivering, sweating, trembling or shaking that you cannot control, or twitching.
      These could be symptoms of serotonin syndrome.
  - type: paragraph
    text: This medicine may make you dizzy or drowsy. It may even cause you to fall
      asleep without warning while you drive, talk, or eat. Do not drive or do anything
      that could be dangerous until you know how this medicine affects you .
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for hay fever, other allergies, or colds, sedatives,
      tranquilizers, or sleeping medicine, prescription pain medicine or narcotics,
      medicine for seizures or barbiturates, muscle relaxants, or anesthetics, including
      some dental anesthetics. Check with your medical doctor or dentist before taking
      any of the above while you are taking this medicine .
  - type: paragraph
    text: If you are taking this medicine with levodopa, you may experience increased
      dyskinesia (eg, twitching, twisting, uncontrolled repetitive movements of tongue,
      lips, face, arms, or legs). Check with your doctor if you have any of these
      symptoms.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up from a lying or sitting position. Getting up slowly may help. If you should
      have this problem, check with your doctor.
  - type: paragraph
    text: If you develop any unusual or strange thoughts and behavior while receiving
      this medicine, be sure to discuss it with your doctor. Other changes might be
      confusion, worsening of depression, visual hallucinations (seeing things that
      are not there), suicidal thoughts, and unusual excitement, nervousness, or irritability.
  - type: paragraph
    text: Some people who have used this medicine had unusual changes in their behavior.
      Talk with your doctor right away if you start having problems with gambling
      or an increased interest in sex while using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you are having convulsions (seizures),
      difficulty with breathing, a fast heartbeat, a high fever, high or low blood
      pressure, increased sweating, loss of bladder control, severe muscle stiffness,
      unusually pale skin, or tiredness. These could be symptoms of a serious condition
      called neuroleptic malignant syndrome (NMS).
  - type: paragraph
    text: Do not stop taking rasagiline without first checking with your doctor .
      Your doctor may want you to gradually reduce the amount you are taking before
      stopping completely.
  - type: paragraph
    text: It is important that your doctor check your skin regularly for signs of
      a skin cancer called melanoma. If you notice any unusual red, brown, or black
      spots on your skin, talk to your doctor right away.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes prescription or nonprescription (over-the-counter)
      medicines for appetite control, asthma, colds, cough, hay fever, or sinus problems,
      since they may increase your blood pressure.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
