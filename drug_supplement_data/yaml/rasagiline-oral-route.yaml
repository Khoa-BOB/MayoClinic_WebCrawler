    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Avocado
      - Bitter Orange
      - Tobacco
      - Tyramine Containing Food
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Dyskinesia (abnormal muscle movements) or
      - Hypertension (high blood pressure) or
      - Psychosis (mental disorder), or history of—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease, mild—Use with caution. The effects may be increased because
        of a slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Liver problems, moderate or severe—Should not be used in patients with this
        condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor , to help your condition
      as much as possible. Do not take more or less of it, and do not take it more
      or less often than your doctor ordered.
  - type: paragraph
    text: Take this medicine with or without food.
  - type: paragraph
    text: 'If you take this medicine and consume tyramine-rich foods, beverages, or
      dietary supplements or amines (from over-the-counter medicines), you could experience
      a hypertensive crisis or "cheese reaction". A hypertensive crisis (increase
      in blood pressure) is very serious and requires immediate medical attention.
      It is very important that you restrict dietary tyramine by avoiding the following
      tyramine-rich foods and beverages:'
  - type: list
    ordered: false
    items:
    - Aged cheese
    - Air dried, aged and fermented meats, sausages and salamis (eg, cacciatore, hard
      salami and mortadella)
    - Animal livers that are spoiled or improperly stored
    - Beers and tap beers, all varieties that have not been pasteurized so as to allow
      for ongoing fermentation
    - Broad bean pods (eg, fava bean pods)
    - Meat, poultry, or fish that is spoiled or stored improperly (eg, foods with
      changes in coloration, odor, or mold)
    - OTC supplements containing tyramine
    - Pickled herring
    - Red wine
    - Sauerkraut
    - Soybean products including soy sauce and tofu
    - Yeast extract, concentrated.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For treatment of Parkinson''s disease: For oral dosage form (tablets): For
        patients taking rasagiline alone: Adults—1 milligram (mg) once a day. Children—Use
        and dose must be determined by your doctor. For patients taking rasagiline
        with levodopa: Adults—At first, 0.5 milligram (mg) once a day. Your doctor
        may increase your dose as needed. However, the dose is usually not more than
        1 mg per day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For patients taking rasagiline alone: Adults—1
        milligram (mg) once a day. Children—Use and dose must be determined by your
        doctor. For patients taking rasagiline with levodopa: Adults—At first, 0.5
        milligram (mg) once a day. Your doctor may increase your dose as needed. However,
        the dose is usually not more than 1 mg per day. Children—Use and dose must
        be determined by your doctor.'
    - type: list
