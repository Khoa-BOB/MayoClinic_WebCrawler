title: Avatrombopag (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Doptelet
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Avatrombopag is used to treat thrombocytopenia (low platelets in the blood)
      in adults with chronic liver disease who are scheduled to have a medical or
      dental procedure. It is also used to treat thrombocytopenia in patients with
      chronic immune thrombocytopenia who have had previous treatment that did not
      work well. It is also used to treat thrombocytopenia in children 1 year of age
      and older with persistent or chronic immune thrombocytopenia who have had previous
      treatment that did not work well. Avatrombopag works by stimulating the bone
      marrow to produce more platelets.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of avatrombopag to treat thrombocytopenia in children younger
        than 1 year of age with persistent or chronic immune thrombocytopenia and
        to treat thrombocytopenia in children with liver disease . Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of avatrombopag in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Apalutamide
      - Avacopan
      - Carbamazepine
      - Clarithromycin
      - Conivaptan
      - Deutivacaftor
      - Enzalutamide
      - Fedratinib
      - Fexinidazole
      - Fluconazole
      - Itraconazole
      - Letermovir
      - Mifepristone
      - Omaveloxolone
      - Phenobarbital
      - Primidone
      - Rifampin
      - Sparsentan
      - Tazemetostat
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood clots, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Blood clotting disorder (eg, antithrombin deficiency, Factor V Leiden, prothrombin
        20210A or, Protein C or S deficiency)—Use with caution. May increase risk
        for blood clotting problems (eg, thromboembolism).
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information leaflet and patient instructions.
      Read and follow these instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: Take this medicine with food.
  - type: paragraph
    text: Do not substitute the tablets with the capsules .
  - type: paragraph
    text: 'To use the Doptelet® Sprinkle capsule:'
  - type: list
    ordered: false
    items:
    - Do not swallow the capsules whole. Do not chew or crush the granules.
    - Open the capsule and sprinkle the contents in a spoon or cup. Mix the granules
      with soft food (eg, applesauce, strawberry jelly, or yogurt) or liquids (eg,
      skim or whole milk, orange juice, unflavored electrolyte liquid, or water).
      It will not dissolve.
    - Swallow the mixture right away. Do not save for later use. Rinse the spoon or
      cup to make sure you receive the full dose.
  - type: paragraph
    text: If you have chronic liver disease, you should begin using this medicine
      10 to 13 days before your scheduled procedure. You may have your medical or
      dental procedure 5 to 8 days after the last dose of avatrombopag.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsule): For thrombocytopenia in patients with persistent
        or chronic immune thrombocytopenia: Children 1 to less than 6 years of age—Dose
        is based on your platelet count and must be determined by your doctor. At
        first, 10 milligrams (mg) (1 capsule) once a day. Your doctor may adjust you
        dose as needed. However, the dose is usually not more than 20 mg (2 capsules)
        per day. Children younger than 1 year of age—Use and dose must be determined
        by your doctor.'
      - 'For oral dosage forms (tablets): For thrombocytopenia in patients with persistent
        or chronic immune thrombocytopenia: Adults and children 6 years of age and
        older—Dose is based on your platelet count and must be determined by your
        doctor. At first, 20 milligrams (mg) (1 tablet) once a day. Your doctor may
        adjust you dose as needed. However, the dose is usually not more than 40 mg
        (2 tablets) per day. Children younger than 6 years of age—Use of granules
        is recommended. For thrombocytopenia in patients with chronic liver disease:
        Adults—Dose is based on your platelet count and must be determined by your
        doctor. The dose is usually 40 (2 tablets) to 60 milligrams (mg) (3 tablets)
        once a day for 5 days. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For thrombocytopenia in patients with persistent or chronic immune thrombocytopenia:
        Children 1 to less than 6 years of age—Dose is based on your platelet count
        and must be determined by your doctor. At first, 10 milligrams (mg) (1 capsule)
        once a day. Your doctor may adjust you dose as needed. However, the dose is
        usually not more than 20 mg (2 capsules) per day. Children younger than 1
        year of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Children 1 to less than 6 years of age—Dose is based on your platelet count
