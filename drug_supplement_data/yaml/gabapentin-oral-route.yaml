title: Gabapentin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: FusePaq Fanatrex
    - type: paragraph
      text: Gabarone
    - type: paragraph
      text: Gralise
    - type: paragraph
      text: Neurontin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Gabapentin is used to help control partial seizures (convulsions) in the
      treatment of epilepsy. This medicine cannot cure epilepsy and will only work
      to control seizures for as long as you continue to take it.
  - type: paragraph
    text: Gabapentin is also used to manage a condition called postherpetic neuralgia,
      which is pain that occurs after shingles.
  - type: paragraph
    text: Gabapentin works in the brain to prevent seizures and relieve pain for certain
      conditions in the nervous system. It is not used for routine pain caused by
      minor injuries or arthritis. Gabapentin is an anticonvulsant.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
    - Tablet
    - Tablet, Extended Release, 24 HR
    - Solution
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of gabapentin for treating partial
        seizures in children 3 years of age and older. However, safety and efficacy
        have not been established in children younger than 3 years of age.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of gabapentin for treating postherpetic neuralgia in children.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of gabapentin in the elderly. However,
        elderly patients are more likely to have unwanted effects (eg, problems with
        balance or walking, swelling in the feet or legs) and age-related kidney problems,
        which may require caution and an adjustment in the dose for patients receiving
        gabapentin.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alfentanil
      - Alprazolam
      - Aluminum Carbonate, Basic
      - Aluminum Hydroxide
      - Aluminum Phosphate
      - Amobarbital
      - Anileridine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Asenapine
      - Baclofen
      - Benperidol
      - Benzhydrocodone
      - Bromazepam
      - Buprenorphine
      - Buspirone
      - Butabarbital
      - Butalbital
      - Butorphanol
      - Calcifediol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Carisoprodol
      - Carphenazine
      - Cetirizine
      - Chloral Hydrate
      - Chlordiazepoxide
      - Chlorpromazine
      - Chlorzoxazone
      - Clobazam
      - Clomipramine
      - Clonazepam
      - Clorazepate
      - Clozapine
      - Codeine
      - Cyclobenzaprine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Ginkgo
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Depression, history of or
      - Lung or breathing problems (eg, respiratory depression) or
      - Mood or mental changes, history of—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Kidney disease (eg, patients receiving dialysis)—Use with caution. The effects
        may be increased because of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: 'If you are using Gralise® tablets :'
  - type: list
    ordered: false
    items:
    - These should be taken with the evening meal.
    - Swallow the tablet whole. Do not crush, break, or chew it.
  - type: paragraph
    text: For patients with epilepsy who take gabapentin three times per day, do not
      allow more than 12 hours to pass between any 2 doses. The medicine works best
      if a constant amount is in the blood.
  - type: paragraph
    text: Neurontin® capsules, tablets, and solution may be taken with or without
      food.
  - type: paragraph
    text: You may break the scored Neurontin® tablets into 2 pieces, but make sure
      you use the second half of the tablet as the next dose. Do not use the half-tablet
      if the whole tablet has been cut or broken after 28 days. Ask your doctor or
      pharmacist if you have any questions.
  - type: paragraph
    text: Swallow the capsule whole with plenty of water. Do not open, crush, or chew
      it.
  - type: paragraph
    text: Measure the oral liquid using a marked measuring spoon, oral syringe, or
      medicine cup. The average household teaspoon may not hold the right amount of
      liquid.
  - type: paragraph
    text: If you take an antacid that contains aluminum or magnesium, wait at least
      2 hours before taking gabapentin. Some examples of these antacids are Di-Gel®,
      Gaviscon®, Gelusil®, Maalox® and Mylanta®.
  - type: paragraph
    text: Only use the brand of this medicine that your doctor prescribed . Different
      brands may not work the same way.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules, liquid, and tablets): For epilepsy: Adults
        and children 12 years of age and older—At first, 300 milligrams (mg) 3 times
        per day. Your doctor may adjust your dose as needed and tolerated. However,
        the dose is usually not more than 1800 mg per day (600 mg 3 times per day).
        Children 3 to 11 years of age—Dose is based on body weight and must be determined
        by your doctor. The starting dose is 10 to 15 milligrams (mg) per kilogram
        (kg) of body weight per day and divided in 3 doses. Your doctor may adjust
        your dose as needed and tolerated. Children younger than 3 years of age—Use
        and dose must be determined by your doctor. For postherpetic neuralgia: Adults—
        At first, 300 milligrams (mg) as a single dose in the evening. Your doctor
        may adjust your dose as needed and tolerated. However, the dose is usually
        not more than 1800 mg per day. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - 'For epilepsy: Adults and children 12 years of age and older—At first, 300
        milligrams (mg) 3 times per day. Your doctor may adjust your dose as needed
        and tolerated. However, the dose is usually not more than 1800 mg per day
        (600 mg 3 times per day). Children 3 to 11 years of age—Dose is based on body
        weight and must be determined by your doctor. The starting dose is 10 to 15
        milligrams (mg) per kilogram (kg) of body weight per day and divided in 3
        doses. Your doctor may adjust your dose as needed and tolerated. Children
        younger than 3 years of age—Use and dose must be determined by your doctor.'
      - 'For postherpetic neuralgia: Adults— At first, 300 milligrams (mg) as a single
        dose in the evening. Your doctor may adjust your dose as needed and tolerated.
        However, the dose is usually not more than 1800 mg per day. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—At first, 300 milligrams (mg)
        3 times per day. Your doctor may adjust your dose as needed and tolerated.
        However, the dose is usually not more than 1800 mg per day (600 mg 3 times
        per day).
      - Children 3 to 11 years of age—Dose is based on body weight and must be determined
        by your doctor. The starting dose is 10 to 15 milligrams (mg) per kilogram
        (kg) of body weight per day and divided in 3 doses. Your doctor may adjust
        your dose as needed and tolerated.
      - Children younger than 3 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - Adults— At first, 300 milligrams (mg) as a single dose in the evening. Your
        doctor may adjust your dose as needed and tolerated. However, the dose is
        usually not more than 1800 mg per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: You should store the Neurontin® oral liquid in the refrigerator. Do not
        freeze.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood tests
      are needed to check for unwanted effects.
  - type: paragraph
    text: Check with your doctor right away if you have a fever, rash, swollen, painful,
      or tender lymph glands in the neck, armpit, or groin, unusual bleeding or bruising,
      or yellow eyes or skin. These may be symptoms of a serious and life-threatening
      allergic reaction called drug reaction with eosinophilia and systemic symptoms
      (DRESS) or multiorgan hypersensitivity.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Call your doctor right away if you have a rash, itching, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      while you are using this medicine.
  - type: paragraph
    text: Gabapentin may cause vision changes, clumsiness, unsteadiness, dizziness,
      drowsiness, sleepiness, or trouble with thinking. Make sure you know how you
      react to this medicine before you drive, use machines, or do anything else that
      could be dangerous if you are not alert, well-coordinated, or able to think
      or see well . If these side effects are especially bothersome, check with your
      doctor.
  - type: paragraph
    text: This medicine may cause some people to be agitated, irritable, or display
      other abnormal behaviors, such as feeling sad or hopeless, getting upset easily,
      or feeling nervous, restless, or hostile. It may also cause some people to have
      suicidal thoughts and tendencies or to become more depressed, even after stopping
      the medicine. If you, your child, or your caregiver notice any of these side
      effects, tell your doctor right away.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for hay fever, allergies, or colds, sedatives,
      tranquilizers, or sleeping medicines, prescription pain medicine or narcotics,
      other medicines for seizures (eg, barbiturates), muscle relaxants, or anesthetics,
      including some dental anesthetics. Check with your medical doctor or dentist
      before taking any of the above while you or your child are using gabapentin
      .
  - type: paragraph
    text: This medicine may cause respiratory depression, a serious breathing problem
      that can be life-threatening, when used together with narcotic pain medicines.
      Check with your doctor right away if you have pale or blue lips, fingernails,
      or skin, difficult or trouble breathing, or irregular, fast or slow, or shallow
      breathing.
  - type: paragraph
    text: Do not stop using gabapentin without checking with your doctor . Stopping
      the medicine suddenly may increase the risk for seizures. Your doctor may want
      you or your child to gradually reduce the amount you are taking before stopping
      it completely.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect the results of certain medical tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Clumsiness or unsteadiness
      - continuous, uncontrolled, back-and-forth, or rolling eye movements
    subsections: []
  - heading: More common in children
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Aggressive behavior or other behavior problems
      - anxiety
      - concentration problems and change in school performance
      - crying
      - depression
      - false sense of well-being
      - hyperactivity or increase in body movements
      - rapidly changing moods
      - reacting too quickly, too emotional, or overreacting
      - restlessness
      - suspiciousness or distrust
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chest pain
      - chills
      - cough
      - depression, irritability, or other mood or mental changes
      - fever
      - loss of memory
      - pain or swelling in the arms or legs
      - painful or difficult urination
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swollen glands
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - clay-colored stools
      - coma
      - confusion
      - dark urine
      - decreased urine output
      - diarrhea
      - difficult or troubled breathing
      - dizziness
      - fast or irregular heartbeat
      - headache
      - increased thirst
      - irregular, fast or slow, or shallow breathing
      - itching or skin rash
      - joint pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - loss of appetite
      - loss of bladder control
      - muscle ache or pain
      - muscle spasm or jerking of all extremities
      - nausea
      - pale or blue lips, fingernails, or skin
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - seizures
      - shakiness in the legs, arms, hands, or feet
      - sudden loss of consciousness
      - stomach pain
      - trembling or shaking of the hands or feet
      - unpleasant breath odor
      - vomiting of blood
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - cold or flu-like symptoms
      - delusions
      - dementia
      - hoarseness
      - lack or loss of strength
      - lower back or side pain
      - swelling of the hands, feet, or lower legs
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Accidental injury
      - appetite increased
      - back pain
      - body aches or pain
      - burning, dry, or itching eyes
      - change in vision
      - change in walking and balance
      - chest tightness
      - clumsiness or unsteadiness
      - congestion
      - constipation
      - cough producing mucus
      - decrease in sexual desire or ability
      - dryness of the mouth or throat
      - earache
      - excessive tearing
      - eye discharge
      - feeling faint, dizzy, or lightheadedness
      - feeling of warmth or heat
      - flushed, dry skin
      - flushing or redness of the skin, especially on the face and neck
      - frequent urination
      - fruit-like breath odor
      - impaired vision
      - incoordination
      - increased hunger
      - increased sensitivity to pain
      - increased sensitivity to touch
      - increased thirst
      - noise in the ears
      - pain, redness, rash, swelling, or bleeding where the skin is rubbed off
      - redness or swelling in the ear
      - redness, pain, swelling of the eye, eyelid, or inner lining of the eyelid
      - runny nose
      - sneezing
      - sweating
      - tender, swollen glands in the neck
      - tingling in the hands and feet
      - trouble sleeping
      - trouble swallowing
      - trouble thinking
      - twitching
      - unexplained weight loss
      - voice changes
      - vomiting
      - weakness or loss of strength
      - weight gain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
