    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acenocoumarol
      - Apixaban
      - Delavirdine
      - Glipizide
      - Glyburide
      - Linezolid
      - Prednisone
      - Repaglinide
      - Rivaroxaban
      - Tipranavir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Cholestatic jaundice, history of or
      - Liver disease, history of—Should not be used in patients with these conditions
        caused by clarithromycin.
    - type: list
      ordered: false
      items:
      - Bradycardia (slow heartbeat) or
      - Heart rhythm problems (eg, QT prolongation, torsades de pointes, ventricular
        arrhythmia), history of or
      - Hypokalemia (low potassium in the blood), uncorrected or
      - Hypomagnesemia (low magnesium in the blood), uncorrected—Use is not recommended
        in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Decreased kidney function or
      - Porphyria (enzyme problem), history of—Clarithromycin together with ranitidine
        bismuth citrate should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Diarrhea or
      - Heart disease or
      - Liver disease or
      - Myasthenia gravis (severe muscle weakness)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Clarithromycin together with colchicine should not be used in
        patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: You may take this medicine with meals or milk or on an empty stomach. However,
      clarithromycin extended release tablets should be taken with food.
  - type: paragraph
    text: 'If you are using the extended-release tablets :'
  - type: list
    ordered: false
    items:
    - Swallow the tablet whole. Do not break, crush, or chew it.
    - While taking the extended-release form of this medicine, a part of the tablet
      may pass into your stools. This is normal and is nothing to worry about.
  - type: paragraph
    text: Measure the oral liquid with a marked measuring spoon, syringe, or cup.
      The average household teaspoon may not hold the right amount of liquid. Shake
      the bottle well before each use.
  - type: paragraph
    text: If you are taking clarithromycin and zidovudine, these medicines should
      be taken at least 2 hours apart.
  - type: paragraph
    text: Keep using this medicine for the full time of treatment , even if you or
      your child begin to feel better after the first few doses. Your infection may
      not clear up if you stop using the medicine too soon.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release tablets): For bacterial infections:
        Adults—1000 milligrams (mg) once a day for 7 to 14 days. Children—Use and
        dose must be determined by your doctor. For community-acquired pneumonia:
        Adults—1000 milligrams (mg) once a day for 7 days. Children—Use and dose must
        be determined by your doctor.'
      - 'For oral dosage forms (suspension and tablets): For bacterial infections:
        Adults—250 to 500 milligrams (mg) every 12 hours for 7 to 14 days. Children
        6 months of age and older—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 7.5 milligrams (mg) per kilogram (kg)
        of body weight every 12 hours for 10 days. Infants younger than 6 months of
        age—Use and dose must be determined by your doctor. For community-acquired
        pneumonia: Adults—250 milligrams (mg) every 12 hours for 7 to 14 days. Children
        6 months of age and older—Dose is based on body weight and must be determined
        by your doctor. Infants younger than 6 months of age—Use and dose must be
        determined by your doctor. For prevention or treatment of Mycobacterium avium
        complex (MAC) infection: Adults—500 milligrams (mg) 2 times a day. Children
        20 months of age and older—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 7.5 milligrams (mg) per kilogram (kg)
        of body weight, up to 500 mg, 2 times a day. Children younger than 20 months
        of age—Use and dose must be determined by your doctor. For treatment of ulcers
        associated with H. pylori: Adults—500 milligrams (mg) every 8 hours for 14
        days in combination with omeprazole, 500 mg every 12 hours in combination
        with amoxicillin and lansoprazole for 10 or 14 days, or 500 mg every 12 hours
        in combination with amoxicillin and omeprazole for 10 days. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For bacterial infections: Adults—1000 milligrams (mg) once a day for 7 to
        14 days. Children—Use and dose must be determined by your doctor.'
      - 'For community-acquired pneumonia: Adults—1000 milligrams (mg) once a day
        for 7 days. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—1000 milligrams (mg) once a day for 7 to 14 days.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—1000 milligrams (mg) once a day for 7 days.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For bacterial infections: Adults—250 to 500 milligrams (mg) every 12 hours
        for 7 to 14 days. Children 6 months of age and older—Dose is based on body
        weight and must be determined by your doctor. The dose is usually 7.5 milligrams
