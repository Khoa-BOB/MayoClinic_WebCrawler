      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Do not refrigerate or freeze the oral liquid . Throw away any unused mixed
        medicine after 14 days.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood and
      urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not use this medicine if you or your child are also using astemizole
      (Hismanal®), cisapride (Propulsid®), lomitapide (Juxtapid®), lovastatin (Mevacor®),
      pimozide (Orap®), simvastatin (Zocor®), terfenadine (Seldane®), or certain ergot
      medicines (eg, dihydroergotamine, ergotamine, D.H.E. 45®, Ergomar®, Ergostat®,
      or Migranal®). If you have kidney or liver disease, do not take this medicine
      together with colchicine (Colcrys®). Using these medicines together may increase
      the risk for more serious side effects .
  - type: paragraph
    text: If your or your child's symptoms do not improve within a few days, or if
      they become worse, check with your doctor.
  - type: paragraph
    text: Make sure your doctor knows if you are pregnant or planning to become pregnant.
      If you become pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you or your child have a rash, itching, hoarseness,
      trouble breathing or swallowing, or any swelling of your hands, face, mouth,
      or throat while you or your child are using this medicine.
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Check with your doctor
      right away if you or your child have blistering, peeling, or loosening of the
      skin, red skin lesions, severe acne or skin rash, sores or ulcers on the skin,
      or fever or chills while you or your child are using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you or your child have pain or tenderness
      in the upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual
      tiredness or weakness, or yellow eyes or skin. These could be symptoms of a
      serious liver problem.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you or anyone in your family has ever
      had a heart rhythm problem, such as QT prolongation.
  - type: paragraph
    text: Clarithromycin may increase the risk for heart and blood vessel problems
      in patients with these conditions. It may occur a year or 10 years after the
      use of this medicine. Talk to your doctor if you have concerns about this risk.
  - type: paragraph
    text: This medicine may cause diarrhea, and in some cases it can be severe. It
      may occur 2 months or more after you or your child stop taking this medicine.
      Do not take any medicine to treat diarrhea without first checking with your
      doctor. Diarrhea medicines may make the diarrhea worse or make it last longer.
      If you have any questions or if mild diarrhea continues or gets worse, check
      with your doctor.
  - type: paragraph
    text: This medicine may make you dizzy or confused. Do not drive or do anything
      else that could be dangerous until you know how this medicine affects you .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - cough
      - fever
      - hoarseness
      - lower back or side pain
      - painful or difficult urination
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever with or without chills
      - itching, skin rash
      - nausea
      - severe stomach cramps and pain
      - stomach tenderness
      - unusual bleeding or bruising
      - vomiting
      - watery and severe diarrhea, which may also be bloody
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - black, tarry stools
      - blistering, peeling, or loosening of the skin
      - blurred vision
      - chest pain or discomfort
      - clay-colored stools
      - confusion about identity, place, and time
      - cool, pale skin
      - dark urine
      - depression
      - difficulty with swallowing
      - dizziness
      - fainting
      - fast, slow, pounding, or irregular heartbeat or pulse
      - feeling of unreality
      - feeling that others are watching you or controlling your behavior
      - feeling that others can hear your thoughts
      - feeling, seeing, or hearing things that are not there
      - hives
      - increased hunger
      - joint or muscle pain
      - light-colored stools
      - loss of appetite
      - nightmares
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - recurrent fainting
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - redness, swelling, or soreness of the tongue
      - seizures
      - sense of detachment from self or body
      - severe mood or mental changes
      - shakiness
      - skin eruptions
      - slurred speech
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach pain
      - swollen glands
      - tightness in the chest
      - unpleasant breath odor
      - unusual behavior
      - unusual tiredness or weakness
      - vomiting of blood
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - bloated or full feeling
      - change in sensation of taste
      - excess air or gas in the stomach or bowels
      - headache
      - heartburn
      - indigestion
      - mild diarrhea
      - passing gas
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in sense of smell
      - continuing ringing or buzzing or other unexplained noise in the ears
      - feeling of constant movement of self or surroundings
      - hearing loss
      - lightheadedness
      - loss of taste
      - mood or mental changes
      - sensation of spinning
      - shakiness in the legs, arms, hands, or feet
      - sore mouth or tongue
      - swelling or inflammation of the mouth
      - tongue discoloration
      - tooth discoloration
      - trouble sleeping
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
