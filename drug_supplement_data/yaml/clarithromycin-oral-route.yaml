        10 days. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—250 to 500 milligrams (mg) every 12 hours for 7 to 14 days.
      - Children 6 months of age and older—Dose is based on body weight and must be
