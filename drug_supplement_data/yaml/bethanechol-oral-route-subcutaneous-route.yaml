title: Bethanechol (oral route, subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Urecholine
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Bethanechol is taken to treat certain disorders of the urinary tract or
      bladder. It helps to cause urination and emptying of the bladder. Bethanechol
      may also be used for other conditions as determined by your doctor.
  - type: paragraph
    text: Bethanechol is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of bethanechol
        in children with use in other age groups, this medicine is not expected to
        cause different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults. Although there is no specific information comparing use of bethanechol
        in the elderly with use in other age groups, it is not expected to cause different
        side effects or problems in older people than it does in younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Betel Nut
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Asthma or
      - Epilepsy or
      - Heart or blood vessel disease or
      - Intestinal blockage or
      - Low blood pressure or
      - Parkinson's disease or
      - Recent bladder or intestinal surgery or
      - Stomach ulcer or other stomach problems or
      - Urinary tract blockage or difficult urination—Bethanechol may make these conditions
        worse
    - type: list
      ordered: false
      items:
      - High blood pressure—Bethanechol may cause a rapid fall in blood pressure
    - type: list
      ordered: false
      items:
      - Overactive thyroid—Bethanechol may further increase the chance of heart problems
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine on an empty stomach (either 1 hour before or 2 hours
      after meals) to lessen the possibility of nausea and vomiting, unless otherwise
      directed by your doctor.
  - type: paragraph
    text: Take this medicine only as directed. Do not take more of it, do not take
      it more often, and do not take it for a longer time than your doctor ordered.
      To do so may increase the chance of side effects.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'To empty the bladder: For oral dosage form (tablets): Adults—25 to 50 milligrams
        (mg) three or four times a day. Children—Dose is based on body weight and
        must be determined by your doctor. The usual dose is 0.6 mg per kilogram (kg)
        (0.27 mg per pound) of body weight a day. This dose is divided into smaller
        doses and taken three or four times a day. For injection dosage form: Adults—5
        mg injected under the skin three or four times a day. Children—Dose is based
        on body weight and must be determined by your doctor. The usual dose is 0.2
        mg per kg (0.09 mg per pound) of body weight a day. This dose is divided into
        smaller doses, which are injected under the skin three or four times a day.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): Adults—25 to 50 milligrams (mg) three or
        four times a day. Children—Dose is based on body weight and must be determined
        by your doctor. The usual dose is 0.6 mg per kilogram (kg) (0.27 mg per pound)
        of body weight a day. This dose is divided into smaller doses and taken three
        or four times a day.'
      - 'For injection dosage form: Adults—5 mg injected under the skin three or four
        times a day. Children—Dose is based on body weight and must be determined
        by your doctor. The usual dose is 0.2 mg per kg (0.09 mg per pound) of body
        weight a day. This dose is divided into smaller doses, which are injected
        under the skin three or four times a day.'
    - type: list
      ordered: false
      items:
      - Adults—25 to 50 milligrams (mg) three or four times a day.
      - Children—Dose is based on body weight and must be determined by your doctor.
        The usual dose is 0.6 mg per kilogram (kg) (0.27 mg per pound) of body weight
        a day. This dose is divided into smaller doses and taken three or four times
        a day.
    - type: list
      ordered: false
      items:
      - Adults—5 mg injected under the skin three or four times a day.
      - Children—Dose is based on body weight and must be determined by your doctor.
        The usual dose is 0.2 mg per kg (0.09 mg per pound) of body weight a day.
        This dose is divided into smaller doses, which are injected under the skin
        three or four times a day.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up from a lying or sitting position. Getting up slowly may help lessen this
      problem.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Shortness of breath, wheezing, or tightness in chest
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - blurred vision or change in near or distance vision
      - diarrhea
      - dizziness or lightheadedness
      - feeling faint
      - frequent urge to urinate
      - headache
      - increased watering of mouth or sweating
      - nausea or vomiting
      - redness or flushing of skin or feeling of warmth
      - seizures
      - sleeplessness, nervousness, or jitters
      - stomach discomfort or pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
