title: Emtricitabine and tenofovir (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Truvada
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Emtricitabine and tenofovir disoproxil fumarate combination is used together
      with other medicines to treat human immunodeficiency virus (HIV) infection.
      HIV is the virus that causes acquired immune deficiency syndrome (AIDS). This
      medicine is also used as part of a complete prevention strategy (Pre-exposure
      prophylaxis) to reduce the risk of getting HIV infection in adults and children
      who are at high risk.
  - type: paragraph
    text: This medicine will not cure HIV infection or AIDS. It works by lowering
      the amount of HIV in the blood and helps the immune system. This may help delay
      some of the medical conditions that usually result from AIDS or HIV disease.
      It will not keep you from spreading HIV to other people.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of emtricitabine and tenofovir combination in children weighing
        less than 17 kilograms (kg) to treat HIV infection and in children weighing
        less than 35 kg to prevent HIV infection . Safety and efficacy have not been
        established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of emtricitabine and tenofovir combination
        in the elderly. However, elderly patients are more likely to have age-related
        liver or kidney problems, which may require caution and an adjustment in the
        dose for patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aceclofenac
      - Acemetacin
      - Acyclovir
      - Amikacin
      - Amikacin Liposome
      - Amtolmetin Guacil
      - Aspirin
      - Atazanavir
      - Atidarsagene Autotemcel
      - Bromfenac
      - Bufexamac
      - Bupropion
      - Cabotegravir
      - Capreomycin
      - Celecoxib
      - Choline Salicylate
      - Cidofovir
      - Clonixin
      - Dexibuprofen
      - Dexketoprofen
      - Diclofenac
      - Didanosine
      - Diflunisal
      - Dipyrone
      - Droxicam
      - Etodolac
      - Etofenamate
      - Etoricoxib
      - Felbinac
      - Fenoprofen
      - Fepradinol
      - Feprazone
      - Floctafenine
      - Flufenamic Acid
      - Flurbiprofen
      - Ganciclovir
      - Gentamicin
      - Horsetail
      - Ibuprofen
      - Indomethacin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Darunavir
      - Lopinavir
      - Ritonavir
      - Tipranavir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bone fracture, history of or
      - Kidney disease (eg, acute renal failure, Fanconi syndrome), history of or
      - Liver disease (eg, hepatitis B infection), history of or
      - Osteomalacia (soft bones), history of or
      - Osteoporosis (weak or brittle bones), history of—Use with caution. May make
        these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or requiring hemodialysis or
      - Unknown or positive HIV-1 status (for Pre-exposure prophylaxis)—Should not
        be used in patients with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not use more
      of it, do not use it more often, and do not use it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Read it again each time you refill your prescription in case there
      is new information. You should talk to your doctor if you have any questions.
  - type: paragraph
    text: Keep using this medicine for the full time of treatment , even if you or
      your child begin to feel better. It is also important that you continue taking
      all of the medicines that your doctor has given you for HIV infection.
  - type: paragraph
    text: This medicine can be taken with or without food. Swallow the tablet whole.
      Do not crush, break, or chew it.
  - type: paragraph
    text: Do not change the dose or stop using this medicine without checking first
      with your doctor . When your supply of this medicine is running low, contact
      your doctor or pharmacist ahead of time. Do not allow yourself to run out of
      this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of HIV infection: Adults and
        children weighing 35 kilograms (kg) or more—One tablet once a day. Each tablet
        contains 200 milligrams (mg) of emtricitabine and 300 mg of tenofovir. Children
        weighing 17 kg to less than 35 kg and who are able to swallow a whole tablet—The
        dose is based on body weight and must be determined by your doctor: Weighing
        28 to less than 35 kg—One tablet once a day. Each tablet contains 167 mg of
        emtricitabine and 250 mg of tenofovir. Weighing 22 to less than 28 kg—One
        tablet once a day. Each tablet contains 133 mg of emtricitabine and 200 mg
        of tenofovir. Weighing 17 to less than 22 kg—One tablet once a day. Each tablet
        contains 100 mg of emtricitabine and 150 mg of tenofovir. Children weighing
        less than 17 kg—Use and dose must be determined by your doctor. For prevention
        of HIV infection (Pre-exposure prophylaxis): Adults and children weighing
        35 kilograms (kg) or more—One tablet once a day. Each tablet contains 200
        milligrams (mg) of emtricitabine and 300 mg of tenofovir. Children weighing
        less than 35 kg—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of HIV infection: Adults and children weighing 35 kilograms
        (kg) or more—One tablet once a day. Each tablet contains 200 milligrams (mg)
        of emtricitabine and 300 mg of tenofovir. Children weighing 17 kg to less
        than 35 kg and who are able to swallow a whole tablet—The dose is based on
