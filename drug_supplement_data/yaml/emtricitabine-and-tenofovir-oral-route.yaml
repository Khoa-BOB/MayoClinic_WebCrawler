    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the medicine in the original bottle that you were given at the pharmacy
        and keep it tightly closed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure that this medicine is working properly. Blood
      and urine tests may be needed to check for unwanted effects. You should remain
      under the care of a doctor while using this medicine.
  - type: paragraph
    text: Two rare but serious reactions to this medicine are lactic acidosis (too
      much acid in the blood) and liver toxicity, which includes an enlarged liver.
      These are more common if you are female, very overweight (obese), or have been
      taking anti-HIV medicines for a long time. Check with your doctor right away
      if you or your child have stomach discomfort, decreased appetite, diarrhea,
      fast, shallow breathing, general feeling of discomfort, muscle pain or cramping,
      nausea, sleepiness, unusual tiredness or weakness, or yellow eyes or skin.
  - type: paragraph
    text: This medicine may cause rare, but serious, liver problems. This is more
      common in patients with a history of hepatitis B infection or those who already
      have liver disease. Check with your doctor right away if you have clay-colored
      stools, dark urine, a decreased appetite, a fever, a headache, itching, nausea
      and vomiting, a skin rash, stomach pain or tenderness, swelling of the feet
      or lower legs, unusual tiredness or weakness, or yellow eyes or skin.
  - type: paragraph
    text: This medicine is not for the treatment of hepatitis B virus infection .
      Patients infected with both HBV and HIV who take emtricitabine and tenofovir
      combination need close medical follow-up for several months after stopping treatment
      to make sure their hepatitis B infection does not get worse. You should also
      be tested for hepatitis B before starting treatment with this medicine.
  - type: paragraph
    text: This medicine may cause kidney problems. Avoid using other medicines that
      may injure the kidneys, including multiple or high-dose NSAID pain medications
      or certain other antiviral medications.
  - type: paragraph
    text: This medicine may also increase your risk of developing fractures (broken
      bones). Ask your doctor about this if you or your child have any concerns.
  - type: paragraph
    text: Your immune system may get stronger when you start using HIV medicines.
      Tell your doctor right away if you or your child notice any changes in your
      health. Sometimes the immune system will start to fight infections that were
      hidden in your body, such as pneumonia, herpes, or tuberculosis. Autoimmune
      disorders (including Graves disease, polymyositis, and Guillain-Barré syndrome)
      may also occur.
  - type: paragraph
    text: 'If you are using this medicine for Pre-exposure prophylaxis :'
  - type: list
    ordered: false
    items:
    - You should be confirmed that you are HIV-negative before you start using this
      medicine and you must stay HIV-negative to keep taking this medicine.
    - You and your partner should be tested regularly (for at least once every 3 months)
      for HIV-1. You should also be tested regularly for other sexually transmitted
      infections, including syphilis or gonorrhea.
    - Check with your doctor right away if you have a fever, headache, joint or muscle
      pain, a rash, night sweats, or swollen lymph nodes.
  - type: paragraph
    text: This medicine does not decrease the risk of transmitting the HIV infection
      to others through sexual contact or by contaminated blood. Make sure you understand
      and practice safe sex, even if your partner also has HIV. Avoid sharing needles
      with anyone. If you have any questions about this, check with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blisters under the skin
      - body aches or pain
      - chills
      - difficulty in breathing
      - ear congestion
      - fever
      - loss of voice
      - pain or tenderness around the eyes and cheekbones
      - rash with flat lesions or small raised lesions on the skin
      - redness of the skin
      - runny or stuffy nose
      - sore throat
      - spots on your skin resembling a blister or pimple
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blindness or vision changes
      - burning of the face or mouth
      - burning, crawling, itching, numbness, painful, prickling, "pins and needles",
        or tingling feelings in the hands, arms, feet, or legs
      - chest pain
      - clumsiness or unsteadiness
      - stabbing pain
      - weakness in the hands or feet
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - bloating
      - bloody or cloudy urine
      - bone pain
      - change in how much or how often you urinate
      - confusion
      - constipation
      - cough
      - dark urine
      - decreased awareness or responsiveness
      - difficult or painful urination
      - difficulty in swallowing
      - fast heartbeat
      - fast, shallow breathing
      - general feeling of discomfort
      - increased thirst
      - indigestion
      - irritability
      - itching skin, hives, welts
      - loss of appetite
      - loss of consciousness
      - lower back or side pain
      - muscle pain, cramp, or twitching
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid weight gain
      - seizures
      - severe sleepiness
      - stomach pain
      - sudden decrease in the amount of urine
      - swelling of the face, fingers, hands, lower legs, or ankles
      - tightness in the chest
      - unusual drowsiness, dullness, or feeling of sluggishness
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Depression
      - diarrhea
      - nausea
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - back pain
      - belching
      - difficulty in moving
      - heartburn
      - joint pain or swelling
      - lack or loss of strength
      - pain
      - passing of gas
      - stomach upset
      - sweating
      - trouble sleeping
      - vomiting
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
