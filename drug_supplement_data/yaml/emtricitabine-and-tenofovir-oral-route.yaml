    - type: list
      ordered: false
      items:
      - Adults and children weighing 35 kilograms (kg) or more—One tablet once a day.
        Each tablet contains 200 milligrams (mg) of emtricitabine and 300 mg of tenofovir.
      - 'Children weighing 17 kg to less than 35 kg and who are able to swallow a
        whole tablet—The dose is based on body weight and must be determined by your
