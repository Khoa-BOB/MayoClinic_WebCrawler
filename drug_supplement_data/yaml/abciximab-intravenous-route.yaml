title: Abciximab (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Reopro
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Abciximab is used to lessen the chance of heart attack in people who need
      percutaneous coronary intervention (PCI), a procedure to open blocked arteries
      of the heart.
  - type: paragraph
    text: A heart attack may occur when a blood vessel in the heart is blocked by
      a blood clot. Blood clots can sometimes form during PCI. Abciximab reduces the
      chance that a harmful clot will form by preventing certain cells in the blood
      from clumping together. Abciximab is used with aspirin and heparin, which are
      other medicines used to keep your blood from clotting.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of abciximab in children with use
        in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Bleeding problems may be especially likely to occur in elderly patients,
        who are usually more sensitive than younger adults tot the effects of abciximab.
        It is important that you discuss the use of this medicine with your doctor.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Abrocitinib
      - Defibrotide
      - Eptifibatide
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aceclofenac
      - Acemetacin
      - Acenocoumarol
      - Alipogene Tiparvovec
      - Alteplase, Recombinant
      - Amtolmetin Guacil
      - Anagrelide
      - Apixaban
      - Ardeparin
      - Argatroban
      - Bemiparin
      - Betrixaban
      - Bivalirudin
      - Bromfenac
      - Bufexamac
      - Caplacizumab-yhdp
      - Celecoxib
      - Certoparin
      - Choline Salicylate
      - Cilostazol
      - Citalopram
      - Clonixin
      - Clopidogrel
      - Curcumin
      - Dabigatran Etexilate
      - Dalteparin
      - Danaparoid
      - Desirudin
      - Desvenlafaxine
      - Dexibuprofen
      - Dexketoprofen
      - Dextran
      - Diclofenac
      - Diflunisal
      - Dipyridamole
      - Dipyrone
      - Drotrecogin Alfa
      - Droxicam
      - Duloxetine
      - Edoxaban
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Garlic
      - Vitamin A
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Aneurysm (swelling in a blood vessel) especially in the head or
      - Blood disease or a history of unusual bleeding or
      - Brain problems which may include bleeding, disease, injury or tumor or
      - If you weigh less than 150 pounds or
      - If you are over 65 years of age or
      - Injury to any part of the body or
      - Liver disease or
      - Stroke—The risk of bleeding may be increased
    - type: paragraph
      text: Also, tell your doctor if you have received abciximab or heparin before
        and had a reaction to either of them called thrombocytopenia (a low platelet
        count in the blood), or if new blood clots formed while you were receiving
        the medicine.
    - type: paragraph
      text: In addition, tell your doctor if you have recently had any bleeding from
        the stomach, previously had a stroke, recently fallen or suffered a blow to
        the body or head, or had major medical or dental surgery . These events may
        increase the risk of serious bleeding when you are taking abciximab.
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form: For prevention of blood clots during percutaneous
        coronary intervention (the procedure to open blocked blood vessels): Adults—Initial
        dose: 250 micrograms (mcg) per kilogram (kg) of body weight injected 10 to
        60 minutes before the procedure. Maintenance dose: 0.125 mcg per kg of body
        weight per minute (maximum of 10 mcg per minute) by IV for 12 hours. Children—Use
        and dose must be determined by your doctor. For patients with unstable angina
        that will undergo percutaneous coronary intervention within 24 hours: Adults—Initial
        dose: 250 micrograms (mcg) per kilogram (kg) of body weight injected. Maintenance
        dose: 10 mcg per minute by IV for 18 to 24 hours, ending 1 hour after the
        procedure. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For prevention of blood clots during percutaneous coronary intervention (the
        procedure to open blocked blood vessels): Adults—Initial dose: 250 micrograms
        (mcg) per kilogram (kg) of body weight injected 10 to 60 minutes before the
        procedure. Maintenance dose: 0.125 mcg per kg of body weight per minute (maximum
        of 10 mcg per minute) by IV for 12 hours. Children—Use and dose must be determined
        by your doctor.'
      - 'For patients with unstable angina that will undergo percutaneous coronary
        intervention within 24 hours: Adults—Initial dose: 250 micrograms (mcg) per
        kilogram (kg) of body weight injected. Maintenance dose: 10 mcg per minute
        by IV for 18 to 24 hours, ending 1 hour after the procedure. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults—Initial dose: 250 micrograms (mcg) per kilogram (kg) of body weight
        injected 10 to 60 minutes before the procedure. Maintenance dose: 0.125 mcg
        per kg of body weight per minute (maximum of 10 mcg per minute) by IV for
        12 hours.'
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'Adults—Initial dose: 250 micrograms (mcg) per kilogram (kg) of body weight
        injected. Maintenance dose: 10 mcg per minute by IV for 18 to 24 hours, ending
        1 hour after the procedure.'
      - Children—Use and dose must be determined by your doctor.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Tell all of your medical doctors and dentists that you are using this medicine.
  - type: paragraph
    text: 'Check with your doctor immediately if you notice any of the following side
      effects:'
  - type: list
    ordered: false
    items:
    - Bruising or bleeding, especially bleeding that is hard to stop. Bleeding inside
      the body sometimes appears as bloody or black, tarry stools, or faintness.
    - Back pain; burning, pricking, tickling, or tingling sensation; leg weakness;
      numbness; paralysis; or problems with bowel or bladder function.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding
      - blurred vision; confusion; dizziness, faintness, or lightheadedness when getting
        up from a lying or sitting position suddenly; sweating; unusual tiredness
        or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in urine or stools
      - pinpoint red spots on skin
      - unusual bleeding or bruising
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or discomfort
      - chills
      - cough
      - eye pain
      - fever
      - general feeling of illness
      - headache
      - pale skin
      - rapid weight gain
      - shortness of breath
      - slow or irregular heartbeat
      - sneezing
      - sore throat
      - swelling of hands, ankles, feet, or lower legs
      - tightness in chest
      - tingling of hands or feet
      - troubled breathing
      - unusual tiredness
      - wheezing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More Common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - burning, crawling, itching, numbness, prickling, “pins and needles”, or tingling
        feelings
      - changes in vision
      - delusions
      - dementia
      - fear
      - heartburn
      - indigestion or stomach discomfort, upset or pain
      - mood or mental changes
      - nausea
      - nervousness
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
