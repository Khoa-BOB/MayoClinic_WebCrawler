      - Amlodipine
      - Amprenavir
      - Anagrelide
      - Apalutamide
      - Apomorphine
      - Aprepitant
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Asunaprevir
      - Atorvastatin
      - Avacopan
      - Avanafil
      - Avapritinib
      - Axitinib
      - Azithromycin
      - Bedaquiline
      - Berotralstat
      - Boceprevir
      - Bosentan
      - Bosutinib
      - Brexpiprazole
      - Brigatinib
      - Budesonide
      - Buprenorphine
      - Buserelin
      - Buspirone
      - Canagliflozin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diarrhea or
      - Heart rhythm problems (eg, QT prolongation, ventricular arrhythmia)—Use with
        caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given through a needle placed into one of your
      veins. The medicine must be given slowly, so the needle will have to remain
      in place for at least 1 hour. It is usually given every 12 hours for 5 to 7
      days.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant during treatment
      and for at least 2 days after the last dose. If you think you have become pregnant
      while using this medicine, tell your doctor right away.
  - type: paragraph
    text: Do not use this medicine if you are also using erythromycin (Ery-Tab®),
      moxifloxacin (Avelox®), medicine to treat heart rhythm problems (eg, amiodarone,
      quinidine, procainamide, sotalol, Betapace®, Cordarone®), medicine to treat
      mental illness (eg, pimozide, Orap®), or tricyclic antidepressants. Using these
      medicines together with lefamulin may cause unwanted serious side effects .
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you or anyone in your family has ever
      had a heart rhythm problem such as QT prolongation.
  - type: paragraph
    text: Lefamulin may cause diarrhea, and in some cases it can be severe. It may
      occur 2 months or more after you stop using this medicine. Do not take any medicine
      to treat diarrhea without checking first with your doctor. Diarrhea medicines
      may make the diarrhea worse or make it last longer. If you have any questions
      about this or if mild diarrhea continues or gets worse, check with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Convulsions
      - decreased urine
      - dry mouth
      - increased thirst
      - irregular heartbeat
      - loss of appetite
      - mood changes
      - muscle pain or cramps
      - nausea or vomiting
      - numbness or tingling in the hands, feet, or lips
      - trouble breathing
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach tenderness
      - chest pain or discomfort
      - fainting
      - fever
      - irregular or slow heart rate
      - severe abdominal or stomach cramps and pain
      - watery and severe diarrhea, which may also be bloody
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain, itching, burning, swelling, or a lump at the injection site
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
