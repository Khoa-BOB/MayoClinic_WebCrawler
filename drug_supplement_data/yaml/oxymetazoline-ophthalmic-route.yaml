title: Oxymetazoline (ophthalmic route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ocuclear
    - type: paragraph
      text: Upneeq
    - type: paragraph
      text: Visine L.R.
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Visine Workplace
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Oxymetazoline is used to treat acquired blepharoptosis, a condition wherein
      there is drooping or abnormal lowering of the upper eyelid.
  - type: paragraph
    text: This medicine is available without a prescription. Your doctor may have
      special instructions on the proper use and dose for your medical problem.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of oxymetazoline in children younger than 13 years of age.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of oxymetazoline in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
      - Phenelzine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amineptine
      - Amitriptyline
      - Amitriptylinoxide
      - Amoxapine
      - Amphetamine
      - Carteolol
      - Carvedilol
      - Clomipramine
      - Desipramine
      - Dextroamphetamine
      - Dibenzepin
      - Doxepin
      - Furazolidone
      - Imipramine
      - Insulin Aspart, Recombinant
      - Iproniazid
      - Isocarboxazid
      - Labetalol
      - Landiolol
      - Levobunolol
      - Linezolid
      - Lisdexamfetamine
      - Lofepramine
      - Melitracen
      - Methylene Blue
      - Metipranolol
      - Moclobemide
      - Nadolol
      - Nialamide
      - Nortriptyline
      - Opipramol
      - Oxprenolol
      - Penbutolol
      - Pindolol
      - Practolol
      - Procarbazine
      - Propranolol
      - Protriptyline
      - Rasagiline
      - Safinamide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Brain or nerve problems (eg, stroke, aneurysm, Horner syndrome, myasthenia
        gravis) or
      - Eye or vision problems (eg, eye infection, mass, paralysis, or weakness) or
      - Heart or blood vessel disease, severe or unstable or
      - Hypertension (high blood pressure), uncontrolled or
      - Hypotension (low blood pressure), orthostatic or uncontrolled or
      - Sjogren's syndrome (immune system disorder)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Glaucoma, narrow-angle, untreated—Use with caution. May increase risk for
        angle closure glaucoma.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use it for a longer time than your doctor
      ordered.
  - type: paragraph
    text: This medicine comes with patient instructions. Read and follow these instructions
      carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: This medicine should be used only for your drooping eyelid. Check with your
      doctor before using it for other problems, especially if you think that an infection
      may be present .
  - type: paragraph
    text: 'To use:'
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and water before and after using this medicine.
    - Tilt your head back and, pressing your finger gently on the skin just beneath
      the lower eyelid, pull the lower eyelid away from the eye to make a space. Drop
      the medicine into this space.
    - Let go of the eyelid and gently close the eyes. Do not blink. Keep the eyes
      closed and apply pressure to the inner corner of the eye with your finger for
      1 or 2 minutes to allow the medicine to be absorbed by the eye.
    - If you think you did not get the drop of medicine into your eye properly, repeat
      the directions with another drop.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). Also, keep the container tightly closed.
      Serious damage to the eye and possible loss of vision may result from using
      contaminated eye medicines.
  - type: paragraph
    text: If you wear contact lenses, remove them before you put the drops into your
      eyes. Wait at least 15 minutes after using this medicine before you put your
      contact lenses back in.
  - type: paragraph
    text: Wait at least 15 minutes after using this medicine before you use other
      eye medicines.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic dosage form (eye drops): For drooping eyelids: Adults and
        children 13 years of age and older—Use 1 drop into the affected eye once a
        day. Children younger than 13 years of age—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For drooping eyelids: Adults and children 13 years of age and older—Use 1
        drop into the affected eye once a day. Children younger than 13 years of age—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 13 years of age and older—Use 1 drop into the affected
        eye once a day.
      - Children younger than 13 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep this medicine in the child-resistant foil pouch until you use it.
        Protect this medicine from excessive heat.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your eye doctor (ophthalmologist) check your or
      your child's progress at regular visits to make sure this medicine is working
      properly. Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause blood vessel problems, including changes in your
      or your child's blood pressure. Your or your child's blood pressure might get
      too high or too low while using this medicine. This may cause headaches, dizziness,
      lightheadedness, or fainting, or blurred vision. You might need to measure your
      or your child's blood pressure at home. If you think your or your child's blood
      pressure is too high or too low, call your doctor right away.
  - type: paragraph
    text: This medicine may increase your or your child's risk of having an eye problem
      called angle-closure glaucoma. Check with your doctor right away if you or your
      child have eye pain, blurred vision, or other changes in vision.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or non-prescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - painful irritation of the clear front part of the eye
      - redness of the white part of the eyes or the inside of the eyelids
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry eye
      - headache
      - pain at the instillation site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
