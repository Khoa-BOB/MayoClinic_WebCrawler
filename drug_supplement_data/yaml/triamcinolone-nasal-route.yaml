- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Triamcinolone nasal spray is used to treat an itchy or runny nose, sneezing,
      or other symptoms caused by seasonal and perennial hay fever (allergic rhinitis).
  - type: paragraph
    text: Triamcinolone is a steroid (cortisone-like medicine). It works by preventing
      the inflammation that occurs with allergic reactions.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Spray
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of triamcinolone nasal spray in children
        2 years of age and older. However, safety and efficacy have not been established
        in children younger than 2 years of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of triamcinolone nasal spray in the
        elderly. However, elderly patients are more likely to have age-related liver,
        kidney, or heart problems, which may require caution and an adjustment in
        the dose for patients receiving triamcinolone nasal spray.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Desmopressin
      - Mifepristone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Aldesleukin
      - Aspirin
      - Atazanavir
      - Balofloxacin
      - Bemiparin
      - Besifloxacin
      - Carbamazepine
      - Ceritinib
      - Ciprofloxacin
      - Cobicistat
      - Cosyntropin
      - Darunavir
      - Enoxacin
      - Ethinyl Estradiol
      - Fleroxacin
      - Flumequine
      - Fosphenytoin
      - Gatifloxacin
      - Gemifloxacin
      - Insulin Aspart, Recombinant
      - Levofloxacin
      - Lomefloxacin
      - Lutetium Lu 177 Dotatate
      - Macimorelin
      - Moxifloxacin
      - Nadifloxacin
      - Nadroparin
      - Nirmatrelvir
      - Norfloxacin
      - Ofloxacin
      - Pazufloxacin
      - Pefloxacin
      - Phenytoin
      - Prulifloxacin
      - Ritonavir
      - Rufloxacin
      - Sargramostim
      - Somatrogon-ghla
      - Sparfloxacin
      - Tosufloxacin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Alcuronium
      - Atracurium
      - Auranofin
      - Gallamine
      - Hexafluorenium
      - Licorice
      - Metocurine
      - Primidone
      - Rotavirus Vaccine, Live
      - Saiboku-To
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Adrenal problems or
      - Asthma or
      - Cataracts, history of or
      - Glaucoma, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Chicken pox (includes recent exposure) or
      - Herpes simplex infection of the eye or
      - Infections (bacteria, fungus, virus, or parasite), active or untreated or
      - Measles (includes recent exposure) or
      - Tuberculosis, active or history of—Can reduce the body's ability to fight
        infections.
    - type: list
      ordered: false
      items:
      - Injury to the nose or
      - Nose surgery, recent or
      - Sores or ulcers in the nose, recent—May prevent proper healing of these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it
      and do not use it more often than your doctor ordered. To do so may increase
      the chance of side effects.
  - type: paragraph
    text: This medicine comes with patient information leaflet. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: This medicine is only used in the nose . Do not get this medicine in your
      eyes or mouth. If it does get on these areas, rinse it off right away with water
      and call your doctor right away.
  - type: paragraph
    text: Do not use this medicine for any other nose problem without checking with
      your doctor first.
  - type: paragraph
    text: 'To use the spray:'
  - type: list
    ordered: false
    items:
    - Shake the bottle gently before each use.
    - When you use the triamcinolone nasal spray for the first time, you must prime
      the spray. Press down fully on the top of the pump 5 times or until a fine spray
      comes out. Prime the spray if it has not been used for 14 days or more.
    - Gently blow your nose before using the spray if needed. Tilt your head back
      slightly and insert the tip of the nose piece into your nostril.
    - Close the opposite nostril with a finger. Release 1 spray and at the same time,
      breathe in gently through the nostril.
    - Hold your breath for a few seconds then breathe out slowly through your mouth.
    - Spray the opposite nostril using the same steps.
    - Do not blow your nose for 15 minutes after using the spray.
    - Wipe the tip of the spray bottle with a clean, dry tissue or cloth and put the
      cap back on.
    - Use the check-off chart that is included in the package to help you monitor
      the number of sprays you used.
    - Throw this medicine away after you use 120 sprays.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For nasal dosage form (spray): For treatment of seasonal and perennial allergic
        rhinitis Adults and teenagers—Two sprays in each nostril once a day. Your
        doctor may adjust your dose if needed. Each spray contains 55 micrograms (mcg)
        of triamcinolone. Children 6 to 12 years of age—One spray in each nostril
        once a day. Some children may need two sprays in each nostril once a day.
        Your doctor may adjust your dose if needed. Children 2 to 5 years of age—One
        spray in each nostril once a day. Children younger than 2 years of age—Use
        is not recommended.'
    - type: list
      ordered: false
      items:
      - For treatment of seasonal and perennial allergic rhinitis Adults and teenagers—Two
        sprays in each nostril once a day. Your doctor may adjust your dose if needed.
        Each spray contains 55 micrograms (mcg) of triamcinolone. Children 6 to 12
        years of age—One spray in each nostril once a day. Some children may need
        two sprays in each nostril once a day. Your doctor may adjust your dose if
        needed. Children 2 to 5 years of age—One spray in each nostril once a day.
        Children younger than 2 years of age—Use is not recommended.
    - type: list
      ordered: false
      items:
      - Adults and teenagers—Two sprays in each nostril once a day. Your doctor may
        adjust your dose if needed. Each spray contains 55 micrograms (mcg) of triamcinolone.
      - Children 6 to 12 years of age—One spray in each nostril once a day. Some children
        may need two sprays in each nostril once a day. Your doctor may adjust your
        dose if needed.
      - Children 2 to 5 years of age—One spray in each nostril once a day.
      - Children younger than 2 years of age—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child at regular visits . This will allow your doctor to see if the medicine
      is working properly and to decide if you or your child should continue to use
      it.
  - type: paragraph
    text: If your or your child's symptoms do not improve within 3 weeks or if they
      become worse, check with your doctor.
  - type: paragraph
    text: This medicine may increase your risk of having some unwanted effects in
      the nose. Check with your doctor right away if you or your child have bloody
      mucus, sores inside the nose, unexplained nosebleeds, or a whistling sound when
      you breathe while you are using this medicine.
  - type: paragraph
    text: This medicine may cause thrush (a type of fungus infection) in the nose
      or throat. Tell your doctor right away if you or your child have white patches
      in the throat, or pain when you eat or swallow.
  - type: paragraph
    text: Check with your doctor immediately if you have changes in vision, such as
      blurred vision, difficulty reading, or eye pain during or after treatment. Your
      doctor may want your eyes checked by an eye doctor.
  - type: paragraph
    text: You may get infections more easily while you are using this medicine. Avoid
      being around people who are sick or have infections such as chickenpox or measles
      or if you have never had these infections or been immunized. This is especially
      important for children. Tell your doctor right away if you think you have been
      exposed to chickenpox or measles.
  - type: paragraph
    text: 'This medicine may increase your risk of having an adrenal gland that is
      less active than normal. The adrenal gland makes steroids for your body. This
      is more likely for people who use steroids for a long time or use high doses.
      Check with your doctor right away if you or your child have any of the following
      symptoms: darkening of the skin, diarrhea, dizziness, fainting, loss of appetite,
      mental depression, nausea, skin rash, unusual tiredness or weakness, or vomiting.'
  - type: paragraph
    text: This medicine may cause children to grow more slowly than normal. This would
      cause a child not to gain weight or get taller. Talk with your doctor if you
      think your child is not growing properly or if you have any questions about
      this.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - chills
      - congestion
      - diarrhea
      - dryness or soreness of the throat
      - fever
      - general feeling of discomfort or illness
      - headache
      - hoarseness
      - increased cough
      - joint pain
      - loss of appetite
      - muscle aches and pains
      - nausea
      - runny nose
      - shivering
      - sweating
      - tender, swollen glands in the neck
      - trouble sleeping
      - trouble with swallowing
      - unexplained nosebleeds
      - unusual tiredness or weakness
      - voice changes
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough producing mucus
      - difficulty with breathing
      - noisy breathing
      - shortness of breath
      - tightness in the chest
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blindness
      - bloody mucus
      - blurred vision
      - changes in vision
      - darkening of the skin
      - decreased vision
      - eye pain
      - fainting
      - fast heartbeat
      - hives
      - irritation
      - itching
      - joint stiffness or swelling
      - loss of appetite
      - lower back or side pain
      - mental depression
      - painful or difficult urination
      - rash
      - redness of the skin
      - slowing of normal growth in children
      - swelling of the eyelids, face, lips, hands, or feet
      - tearing
      - trouble healing
      - white patches in the throat
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - heartburn
      - indigestion
      - stomach discomfort, upset, or pain
      - tooth problems
      - upper abdominal or stomach pain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in sense of smell or taste
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
