title: Erythromycin (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Erythrocin Lactobionate
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Erythromycin injection is used to treat bacterial infections in many different
      parts of the body. It is also used to treat diphtheria, acute pelvic inflammatory
      disease, and Legionnaire's disease. This medicine is also used to prevent bacterial
      endocarditis and rheumatic fever to occur again in patients who have had an
      allergic reaction to penicillin or sulfa drugs.
  - type: paragraph
    text: Erythromycin belongs to the class of medicines known as macrolide antibiotics.
      It works by killing bacteria or preventing their growth. However, this medicine
      will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of erythromycin injection in children.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of erythromycin injection in the
        elderly. However, elderly patients are more likely to have erythromycin-induced
        hearing loss, heart rhythm problems, and bleeding problems, and age-related
        kidney, liver, or heart problems, which may require caution and an adjustment
        in the dose for patients receiving erythromycin injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Astemizole
      - Bepridil
      - Cisapride
      - Colchicine
      - Dihydroergotamine
      - Dronedarone
      - Flibanserin
      - Fluconazole
      - Grepafloxacin
      - Ketoconazole
      - Levoketoconazole
      - Levomethadyl
      - Lomitapide
      - Lovastatin
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Saquinavir
      - Simvastatin
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Acalabrutinib
      - Acecainide
      - Adagrasib
      - Afatinib
      - Ajmaline
      - Alfentanil
      - Alprazolam
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amlodipine
      - Amoxapine
      - Anagrelide
      - Apalutamide
      - Apixaban
      - Apomorphine
      - Aprepitant
      - Aprindine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Ascorbic Acid
      - Asenapine
      - Atazanavir
      - Atorvastatin
      - Avacopan
      - Avapritinib
      - Azimilide
      - Azithromycin
      - Bedaquiline
      - Benzhydrocodone
      - Betrixaban
      - Bosutinib
      - Bretylium
      - Brexpiprazole
      - Brigatinib
      - Buprenorphine
      - Buserelin
      - Capivasertib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Anisindione
      - Avanafil
      - Bexarotene
      - Budesonide
      - Buspirone
      - Diazepam
      - Dicumarol
      - Methylprednisolone
      - Midazolam
      - Phenprocoumon
      - Sildenafil
      - Sirolimus
      - Tolterodine
      - Triazolam
      - Trimetrexate
      - Valproic Acid
      - Zafirlukast
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Heart rhythm problems (eg, QT prolongation, ventricular tachycardia) or
      - Myasthenia gravis (severe muscle weakness)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. Effects of erythromycin may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this medicine in a hospital. It is given through a needle placed into one of
      your veins.
  - type: paragraph
    text: Your doctor may give you a few doses of this medicine until your condition
      improves, and then you may be switched to an oral medicine that works the same
      way. If you have any concerns about this, talk to your doctor.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you or your child's progress
      closely while you are receiving this medicine to make sure this medicine is
      working properly and to check for any unwanted effects.
  - type: paragraph
    text: If your or your child's symptoms do not improve within a few weeks, or if
      they become worse, check with your doctor.
  - type: paragraph
    text: You should not receive this medicine if you are also using astemizole (Hismanal®),
      cisapride (Propulsid®), dihydroergotamine (Migranal®), ergotamine (Ergomar®),
      pimozide (Orap®), terfenadine (Seldane®), or statin medicine (eg, lovastatin,
      simvastatin, Mevacor®, Zocor®). Using these medicines together may cause serious
      unwanted effects .
  - type: paragraph
    text: Check with your doctor right away if you or your child have pain or tenderness
      in the upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual
      tiredness or weakness, or yellow eyes or skin. These could be symptoms of a
      serious liver problem.
  - type: paragraph
    text: Erythromycin may cause diarrhea, and in some cases it can be severe. It
      may occur 2 months or more after you stop receiving this medicine. Do not take
      any medicine to treat diarrhea without first checking with your doctor. Diarrhea
      medicines may make the diarrhea worse or make it last longer. If you have any
      questions about this or if mild diarrhea continues or gets worse, check with
      your doctor.
  - type: paragraph
    text: This medicine can cause changes in heart rhythms, such as a condition called
      QT prolongation. It may change the way your heart beats and cause fainting or
      serious side effects in some patients. Contact your doctor right away if you
      or your child have any symptoms of heart rhythm problems, such as fast, pounding,
      or uneven heartbeat.
  - type: paragraph
    text: Infantile hypertrophic pyloric stenosis (IHPS) occurs in infants receiving
      this medicine. Tell your child's doctor right away if your child is vomiting
      or irritable during feeding.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you or your child are receiving this medicine. The results of some tests may
      be affected by this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - chest pain or discomfort
      - chills
      - cough
      - diarrhea
      - difficulty with swallowing
      - dizziness
      - fainting
      - fast, pounding, or irregular heartbeat or pulse
      - hearing loss
      - hives or welts, itching, skin rash
      - irregular or slow heart rate
      - irritation at the injection site
      - joint or muscle pain
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red, irritated eyes
      - red skin lesions, often with a purple center
      - redness of the skin
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - tightness in the chest
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
