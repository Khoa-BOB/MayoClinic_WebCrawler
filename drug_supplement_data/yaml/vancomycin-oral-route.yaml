title: Vancomycin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Firvanq
    - type: paragraph
      text: Vancocin HCl Pulvules
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Vancomycin, when taken by mouth, is used to treat Clostridioides difficile
      -associated diarrhea (also called C diff). C diff is a type of bacteria that
      causes severe diarrhea. Oral vancomycin is also used to treat enterocolitis
      caused by a certain bacteria (eg, Staphylococcus aureus).
  - type: paragraph
    text: Vancomycin belongs to the family of medicines called antibiotics. It works
      by killing bacteria or preventing their growth. It will not work for colds,
      flu, or other virus infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
    - Capsule
    - Powder for Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of vancomycin in children. Safety
        and efficacy have been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of vancomycin in the elderly. However,
        elderly patients are more likely to have age-related kidney problems, which
        may require caution and an adjustment in the dose for patients receiving vancomycin.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amikacin
      - Amikacin Liposome
      - Aspirin
      - Cholera Vaccine, Live
      - Cyclosporine
      - Gentamicin
      - Neomycin
      - Paromomycin
      - Piperacillin
      - Plazomicin
      - Streptomycin
      - Tazobactam
      - Tobramycin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Succinylcholine
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Hearing problems—Use with caution. May make this condition worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Other inflammatory bowel disorders—May increase risk for more serious side
        effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Swallow the capsule whole. Do not crush, open, or chew it.
  - type: paragraph
    text: 'If you are using the oral liquid :'
  - type: list
    ordered: false
    items:
    - Shake the medicine well before each use.
    - Use a specially marked measuring spoon, oral syringe, or medicine cup to measure
      each dose accurately. The average household teaspoon may not hold the right
      amount of liquid.
    - Do not use after the expiration date on the label. The medicine may not work
      properly after that date. Check with your pharmacist if you have any questions
      about this.
  - type: paragraph
    text: If you are also using cholestyramine or colestipol for your colitis, do
      not take vancomycin by mouth within 3 to 4 hours of taking either of these medicines.
      Doing so may keep vancomycin from working properly.
  - type: paragraph
    text: Keep using this medicine for the full treatment time , even if you begin
      to feel better after a few days. Your infection may not clear up if you stop
      using the medicine too soon.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules or oral liquid): For treatment of C. difficile-associated
        diarrhea: Adults—125 milligrams (mg) 4 times a day for 10 days. Children—Dose
        is based on body weight and must be determined by the doctor. The usual dose
        is 40 milligrams per kilogram (mg/kg) of body weight, divided into 3 or 4
        doses, and taken for 7 to 10 days. However, dose is usually not more than
        2000 mg per day. For treatment of Staphylococcal enterocolitis: Adults—500
        to 2000 milligrams (mg) divided into 3 or 4 doses for 7 to 10 days. Children—Dose
        is based on body weight and must be determined by the doctor. The usual dose
        is 40 milligrams per kilogram (mg/kg) of body weight, divided into 3 or 4
        doses, and taken for 7 to 10 days. However, dose is usually not more than
        2000 mg per day.'
    - type: list
      ordered: false
      items:
      - 'For treatment of C. difficile-associated diarrhea: Adults—125 milligrams
        (mg) 4 times a day for 10 days. Children—Dose is based on body weight and
        must be determined by the doctor. The usual dose is 40 milligrams per kilogram
        (mg/kg) of body weight, divided into 3 or 4 doses, and taken for 7 to 10 days.
        However, dose is usually not more than 2000 mg per day.'
      - 'For treatment of Staphylococcal enterocolitis: Adults—500 to 2000 milligrams
        (mg) divided into 3 or 4 doses for 7 to 10 days. Children—Dose is based on
        body weight and must be determined by the doctor. The usual dose is 40 milligrams
        per kilogram (mg/kg) of body weight, divided into 3 or 4 doses, and taken
        for 7 to 10 days. However, dose is usually not more than 2000 mg per day.'
    - type: list
      ordered: false
      items:
      - Adults—125 milligrams (mg) 4 times a day for 10 days.
      - Children—Dose is based on body weight and must be determined by the doctor.
        The usual dose is 40 milligrams per kilogram (mg/kg) of body weight, divided
        into 3 or 4 doses, and taken for 7 to 10 days. However, dose is usually not
        more than 2000 mg per day.
    - type: list
      ordered: false
      items:
      - Adults—500 to 2000 milligrams (mg) divided into 3 or 4 doses for 7 to 10 days.
      - Children—Dose is based on body weight and must be determined by the doctor.
        The usual dose is 40 milligrams per kilogram (mg/kg) of body weight, divided
        into 3 or 4 doses, and taken for 7 to 10 days. However, dose is usually not
        more than 2000 mg per day.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the capsules at room temperature, away from heat, moisture, and
        direct light.
    - type: paragraph
      text: Store the oral liquid in the refrigerator for up to 14 days. Do not freeze.
        Throw away any unused medicine after 14 days, or if the liquid becomes cloudy
        or has particles in it.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is important that your doctor check you and your child's progress at
      regular visits to make sure that this medicine is working properly and that
      the colitis is cleared up completely. Blood, urine, and hearing tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: If you or your child's symptoms do not improve within a few days, or if
      they become worse, check with your doctor.
  - type: paragraph
    text: Check with your doctor right away if you or your child have blood in the
      urine, change in the frequency of urination or amount of urine, difficulty with
      breathing, nausea, vomiting, swelling of the feet or lower legs, or weakness
      during and after treatment with this medicine. These may be signs of a serious
      kidney problem.
  - type: paragraph
    text: Check with your doctor right away if you have sudden decrease in hearing
      or loss of hearing, which may be accompanied by dizziness and ringing in the
      ears . Tell your doctor if you or your child have dizziness or lightheadedness,
      feeling of constant movement of self or surroundings, or sensation of spinning.
      These may be symptoms of damage to your hearing or sense of balance.
  - type: paragraph
    text: This medicine may cause serious skin reactions, including toxic epidermal
      necrolysis, Stevens-Johnson syndrome, drug reaction with eosinophilia and systemic
      symptoms (DRESS), acute generalized exanthematous pustulosis (AGEP), and linear
      IgA bullous dermatosis (LABD). Check with your doctor right away if you have
      black, tarry stools, blistering, peeling, or loosening of the skin, chest pain,
      chills, cough, diarrhea, fever, itching, joint or muscle pain, painful or difficult
      urination, red irritated eyes, red skin lesions, often with a purple center,
      sore throat, sores, ulcers, or white spots in the mouth or on the lips, swollen
      glands, trouble breathing, unusual bleeding or bruising, or unusual tiredness
      or weakness.
  - type: paragraph
    text: If you are taking this medicine for diarrhea caused by other antibiotics,
      do not take any other diarrhea medicine without first checking with your doctor.
      Other medicines for diarrhea may make your diarrhea worse or make it last longer.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - bloody or cloudy urine
      - decreased urine
      - difficult, burning, or painful urination
      - dry mouth
      - fever
      - frequent urge to urinate
      - increased thirst
      - irregular heartbeat
      - loss of appetite
      - lower back or side pain
      - mood changes
      - muscle pain or cramps
      - nausea
      - numbness or tingling in the hands, feet, or lips
      - seizures
      - unusual tiredness or weakness
      - unusual weight gain or loss
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in the frequency of urination or amount of urine
      - drowsiness
      - trouble breathing
      - weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hives, skin rash
      - redness or other discoloration of the skin
      - scaling or welting of the skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blistering, peeling, or loosening of the skin
      - blurred vision
      - chest pain or tightness
      - chills
      - confusion
      - continuing ringing or buzzing or other unexplained noise in the ears
      - cough
      - difficulty with swallowing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fast heartbeat
      - feeling of constant movement of self or surroundings
      - feeling of fullness in the ears
      - hearing loss
      - itching
      - joint or muscle pain
      - loss of balance
      - lower back or side pain
      - pale skin
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - ringing or buzzing in the ears
      - sensation of spinning
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - sweating
      - swollen glands
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - bitter or unpleasant taste
      - excess air or gas in the stomach or bowels
      - headache
      - mouth irritation
      - passing gas
      - stomach pain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Depression
      - difficulty having a bowel movement
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
