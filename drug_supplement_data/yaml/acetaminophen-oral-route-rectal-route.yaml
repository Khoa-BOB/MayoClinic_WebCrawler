    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the bottle closed when you are not using it. Store it at room temperature,
        away from light and heat. Do not freeze.
    - type: paragraph
      text: You may store the suppositories in the refrigerator, but do not freeze
        them.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child while you are using this medicine . This will allow your doctor to see
      if the medicine is working properly and to decide if you should continue to
      take it.
  - type: paragraph
    text: If your symptoms or fever do not improve within a few days or if they become
      worse, check with your doctor.
  - type: paragraph
    text: Many combination medicines contain acetaminophen, including products with
      brand names such as Alka-Seltzer Plus®, Comtrex®, Drixoral®, Excedrin Migraine®,
      Midol®, Sinutab®, Sudafed®, Theraflu®, and Vanquish®. Adding these medicines
      to the medicine you already take may cause you to get more than a safe amount
      of acetaminophen. Talk to your doctor before taking more than one medicine that
      contains acetaminophen.
  - type: paragraph
    text: Check with your doctor right away if you or your child have pain or tenderness
      in the upper stomach; pale stools; dark urine; loss of appetite; nausea; unusual
      tiredness or weakness; or yellow eyes or skin. These could be symptoms of a
      serious liver problem.
  - type: paragraph
    text: If you will be taking more than an occasional 1 or 2 doses of acetaminophen,
      do not drink alcoholic beverages. To do so may increase the chance of liver
      damage, especially if you drink large amounts of alcohol on a regular basis,
      if you take more acetaminophen than is recommended on the label, or if you take
      it regularly for a long time.
  - type: paragraph
    text: Acetaminophen may interfere with the results of some medical tests. Before
      you have any medical tests, tell the person in charge if you have taken acetaminophen
      within the past 3 or 4 days. You may also call the laboratory ahead of time
      to find out whether acetaminophen will cause a problem.
  - type: paragraph
    text: Acetaminophen may cause false results with some blood glucose tests. If
      you are diabetic and notice a change in your test results, or if you have any
      questions, check with your doctor.
  - type: paragraph
    text: If you think you have taken too much acetaminophen, get emergency help at
      once, even if there are no signs of poisoning. Treatment to prevent liver damage
      must be started as soon as possible.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody or black, tarry stools
      - bloody or cloudy urine
      - fever with or without chills (not present before treatment and not caused
        by the condition being treated)
      - pain in the lower back and/or side (severe and/or sharp)
      - pinpoint red spots on the skin
      - skin rash, hives, or itching
      - sore throat (not present before treatment and not caused by the condition
        being treated)
      - sores, ulcers, or white spots on the lips or in the mouth
      - sudden decrease in the amount of urine
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - yellow eyes or skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - increased sweating
      - loss of appetite
      - nausea or vomiting
      - stomach cramps or pain
      - swelling, pain, or tenderness in the upper abdomen or stomach area
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
