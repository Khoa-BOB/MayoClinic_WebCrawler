- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Acetaminophen is used to treat minor aches and pain and to reduce fever.
      It may also help treat pain from mild forms of arthritis.
  - type: paragraph
    text: This medicine is available without a prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule, Liquid Filled
    - Solution
    - Powder
    - Suspension
    - Tablet, Chewable
    - Suppository
    - Liquid
    - Elixir
    - Tablet
    - Capsule
    - Tablet, Extended Release
    - Tablet, Disintegrating
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of acetaminophen in children. However,
        do not give over-the-counter products to children under 2 years of age unless
        instructed to do so by your doctor.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of acetaminophen in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Articaine
      - Carbamazepine
      - Exenatide
      - Imatinib
      - Isoniazid
      - Lidocaine
      - Pixantrone
      - Pneumococcal 13-Valent Vaccine, Diphtheria Conjugate
      - Probenecid
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acenocoumarol
      - Fosphenytoin
      - Lixisenatide
      - Phenytoin
      - Warfarin
      - Zidovudine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Cabbage
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol abuse, or history of or
      - Kidney disease, severe or
      - Liver disease (including hepatitis)—May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Phenylketonuria (PKU)—Some brands of acetaminophen contain aspartame, which
        can make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered. Liver damage can occur if large amounts of acetaminophen are
      taken for a long time.
  - type: paragraph
    text: If you are taking this medicine without the advice of your doctor, carefully
      read the package label and follow the dosing instructions . Talk to your doctor
      if you have any questions.
  - type: paragraph
    text: Carefully check the labels of all other medicines you are using , because
      they may also contain acetaminophen. It is not safe to use more than 4 grams
      (4,000 milligrams) of acetaminophen in one day (24 hours), as this may increase
      the risk for serious liver problems. For Tylenol® Extra Strength , the maximum
      dose is 3,000 milligrams per 24 hours.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: 'For patients using the oral liquid with syringe (e.g. Little Fevers®):'
  - type: list
    ordered: false
    items:
    - Shake the bottle well before each use.
    - Measure the dose with the provided dose syringe (e.g., AccuSafe™) that comes
      with the package. Do not use any other syringe, dropper, spoon, or dosing device
      when giving this medicine to your child.
    - Remove the cap, attach the syringe to the flow restrictor, and invert the bottle.
    - Pull back the syringe until filled with the dose prescribed by your doctor.
    - Slowly give the medicine into your child's mouth (towards the inner cheek).
    - Replace and tighten the cap.
  - type: paragraph
    text: 'For patients using the oral liquid with dropper:'
  - type: list
    ordered: false
    items:
    - Shake the bottle well before each use.
    - Measure the dose with the provided dropper. Do not use any other syringe, dropper,
      spoon, or dosing device when giving this medicine to your child.
    - Remove the cap, insert the dropper and withdraw the dose prescribed by your
      doctor.
    - Slowly give the medicine into your child's mouth (towards the inner cheek).
    - Replace the cap back tightly.
  - type: paragraph
    text: 'For patients using acetaminophen oral granules (e.g., Snaplets-FR):'
  - type: list
    ordered: false
    items:
    - Just before the medicine is to be taken, open the number of packets needed for
      one dose.
    - Mix the granules inside of the packets with a small amount of soft food, such
      as applesauce, ice cream, or jam.
    - Eat the acetaminophen granules along with the food.
  - type: paragraph
    text: 'For patients using acetaminophen oral powders (e.g., Feverall® Sprinkle
      Caps [Children''s or Junior Strength]):'
  - type: list
    ordered: false
    items:
    - These capsules are not intended to be swallowed whole. Instead, just before
      the medicine is to be taken, open the number of capsules needed for one dose.
    - Empty the powder from each capsule into 1 teaspoonful (5 mL) of water or other
      liquid.
    - Drink the medicine along with the liquid. You may drink more liquid after taking
      the medicine.
    - You may also mix the powder with a small amount of soft food, such as applesauce,
      ice cream, or jam. Eat the acetaminophen powder along with the food.
  - type: paragraph
    text: 'For patients using acetaminophen suppositories :'
  - type: list
    ordered: false
    items:
    - If the suppository is too soft to insert, chill it in the refrigerator for 30
      minutes or run cold water over it before removing the foil wrapper.
    - 'To insert the suppository: Remove the foil wrapper and moisten the suppository
      with cold water. Lie down on your side and use your finger to push the suppository
      up into the rectum.'
  - type: list
    ordered: false
    items:
    - Remove the foil wrapper and moisten the suppository with cold water.
    - Lie down on your side and use your finger to push the suppository up into the
      rectum.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For pain or fever: For oral and rectal dosage forms (capsules, granules,
        powders, solution, suppositories, suspension, or tablets): Adults and teenagers—650
        to 1000 milligrams (mg) every 4 to 6 hours as needed. Dose is based on form
        and strength. Carefully follow the label instructions for the maximum dose
        per day. Children—Dose is based on weight or age. Carefully follow the label
        instructions for the maximum dose per day. Children 11 to 12 years of age:
        320 to 480 mg every 4 to 6 hours as needed. Children 9 to 11 years of age:
        320 to 400 mg every 4 to 6 hours as needed. Children 6 to 9 years of age:
        320 mg every 4 to 6 hours as needed. Children 4 to 6 years of age: 240 mg
        every 4 to 6 hours as needed. Children 2 to 4 years of age: 160 mg every 4
        to 6 hours as needed. Children under 2 years of age: Use and dose must be
        determined by your doctor.'
    - type: list
