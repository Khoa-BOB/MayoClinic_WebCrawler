title: Setmelanotide (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Imcivree
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Setmelanotide injection is used to help lose weight and keep the weight
      off in patients with obesity caused by proopiomelanocortin (POMC), proprotein
      convertase subtilisin/kexin type 1 (PCSK1), leptin receptor (LEPR) deficiency,
      or Bardet-Biedl syndrome (BBS). Your doctor will perform a test to check for
      POMC, PCSK1, or LEPR deficiency, or BBS before you use this medicine.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of setmelanotide injection in children younger than 2 years
        of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of setmelanotide injection in the geriatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Venlafaxine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Depression, or history of—Use with caution. May make this condition worse.
    - type: list
      ordered: false
      items:
      - General obesity or
      - Kidney disease, end-stage or
      - Obesity caused by other genetic conditions—Use is not recommended in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      It is given as a shot under your skin, usually in the stomach, thighs, or upper
      arms.
  - type: paragraph
    text: This medicine comes with patient instructions. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may also be taught how to give your medicine at home. Be sure you understand
      exactly how the medicine is to be injected.
  - type: paragraph
    text: You will be shown the body areas where this shot can be given. Use a different
      body area each time you give yourself a shot. Keep track of where you give each
      shot to make sure you rotate body areas.
  - type: paragraph
    text: You should receive this medicine 1 time each day when you first wake up.
  - type: paragraph
    text: Check the liquid in the vial. It should be clear to almost clear and colorless
      to slightly yellow. Do not use the medicine if the liquid is discolored, or
      has particles in it.
  - type: paragraph
    text: Allow the medicine vial to warm to room temperature for at least 15 minutes
      before using it. You may also warm the vial by rolling it gently between the
      palms of your hands for 60 seconds.
  - type: paragraph
    text: Use a new needle and syringe each time you inject your medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form (solution): For weight management: Adults and children
        12 years of age and older—At first, 2 milligrams (mg) injected under the skin
        once a day for 2 weeks. Your doctor may adjust the dose as needed and tolerated.
        Maintenance dose is 3 mg injected under the skin once a day. Children 6 to
        younger than 12 years of age—At first, 1 mg injected under the skin once a
        day for 2 weeks. Your doctor may adjust the dose as needed and tolerated.
        Maintenance dose is 3 mg injected under the skin once a day. Children 2 to
        younger than 6 years of age—At first, 0.5 mg injected under the skin once
        a day for 2 weeks. Your doctor may adjust the dose as needed and tolerated.
        Maintenance dose is based on body weight and must be determined by your doctor.
        Weighing 40 kilograms (kg) or more—At first, 0.5 mg injected under the skin
        once a day on Weeks 1 to 2, followed by 1 mg once a day on Weeks 3 to 4, then
        1.5 mg once a day on Weeks 5 to 6, and 2 mg once a day on Week 7 and onward.
        Weighing 30 kg to less than 40 kg—At first, 0.5 mg injected under the skin
        once a day on Weeks 1 to 2, followed by 1 mg once a day on Weeks 3 to 4, and
        1.5 mg once a day on Week 5 and onward. Weighing 20 kg to less than 30 kg—At
        first, 0.5 mg injected under the skin once a day on Weeks 1 to 2 and 1 mg
        once a day on Week 3 and onward. Weighing 15 kg to less than 20 kg—0.5 mg
        injected under the skin once a day on Week 1 and onward. Children younger
        than 2 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For weight management: Adults and children 12 years of age and older—At first,
        2 milligrams (mg) injected under the skin once a day for 2 weeks. Your doctor
