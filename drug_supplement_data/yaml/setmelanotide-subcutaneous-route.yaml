    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store in the refrigerator. Do not freeze.
    - type: paragraph
      text: Store the unopened vial in the refrigerator until the expiration date.
        You may remove the medicine from the refrigerator and store at room temperature
        for 30 days. You may also return it in the refrigerator. Throw away this medicine
        after 30 days of removing it from the refrigerator.
    - type: paragraph
      text: Store opened vial in the refrigerator. You may remove the medicine from
        the refrigerator and store at room temperature. You may also return it in
        the refrigerator. Throw away any unused medicine after 30 days, even if it
        still has medicine in it.
    - type: paragraph
      text: Throw away used needles in a hard, closed container where the needles
        cannot poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly and to check for unwanted
      effects.
  - type: paragraph
    text: If you have not lost weight after 12 to 16 weeks of treatment, check with
      your doctor.
  - type: paragraph
    text: This medicine may cause sexual function problems in men and women. Check
      with your doctor right away if you have an erection of the penis lasting longer
      than 4 hours.
  - type: paragraph
    text: This medicine may cause some people to have suicidal thoughts and tendencies
      or to become more depressed. If you or your caregiver notice any of these side
      effects, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Check
      with your doctor right away if you have chest tightness, cough, difficulty swallowing,
      dizziness, fast heartbeat, hives, itching, skin rash, puffiness or swelling
      of the eyelids or around the eyes, face, lips, or tongue, or unusual tiredness
      or weakness.
  - type: paragraph
    text: This medicine may cause skin problems (eg, hyperpigmentation). Check with
      your doctor right away if you have darkening of the skin or skin lesions (moles
      or nevi) you already have, or development of new skin lesions.
  - type: paragraph
    text: This medicine contains benzyl alcohol, which may cause serious reactions
      (eg, gasping syndrome) to newborn or premature babies. Discuss this with your
      doctor if you are concerned.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Aggressive, angry
      - darkening of the skin or skin lesions
      - discouragement
      - feeling sad or empty
      - irritability
      - lack of appetite
      - loss of interest or pleasure
      - prolonged erection of the penis
      - reddish purple lines on the arms, face, legs, trunk, or groin
      - thoughts of killing oneself changes in behavior
      - tiredness
      - trouble concentrating
      - trouble sleeping
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest tightness
      - cough
      - difficulty swallowing
      - dizziness
      - fast heartbeat
      - hives, itching, skin rash
      - puffiness or swelling of the eyelids or around the face, lips, or tongue
      - trouble breathing
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - bleeding, blistering, burning, coldness, discoloration of skin, feeling of
        pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - body aches or pain
      - chills
      - diarrhea
      - difficulty in moving
      - dry mouth
      - ear congestion
      - fever
      - hair loss, thinning of hair
      - headache
      - joint pain
      - lack or loss of strength
      - loss of voice
      - muscle pain, stiffness, or spasm
      - nausea
      - pain in the arms or legs
      - rash
      - runny or stuffy nose
      - sneezing
      - sore throat
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
