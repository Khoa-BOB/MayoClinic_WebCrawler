title: Cabotegravir and rilpivirine (intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cabenuva
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cabotegravir and rilpivirine combination injection are used together for
      the treatment of the human immunodeficiency virus type 1 (HIV-1) infection.
      HIV is the virus that causes acquired immune deficiency syndrome (AIDS). This
      medicine is usually given to patients to replace their current anti-HIV medicines
      when their healthcare provider determines that they meet certain requirements.
  - type: paragraph
    text: Cabotegravir and rilpivirine combination injection will not cure or prevent
      HIV infection or AIDS. It helps keep HIV from reproducing and appears to slow
      down the destruction of the immune system. This may help delay problems that
      are usually related to AIDS or HIV disease from occurring. This medicine will
      not keep you from spreading HIV to other people. People who receive this medicine
      may continue to have other problems usually related to AIDS or HIV disease.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension, Extended Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of cabotegravir and rilpivirine combination injection in children
        younger than 12 years of age or weighing less than 35 kilograms (kg). Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of cabotegravir and rilpivirine combination
        injection in the elderly. However, elderly patients are more likely to have
        age-related kidney, liver, or heart problems, which may require caution for
        patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Carbamazepine
      - Cisapride
      - Dexamethasone
      - Dexlansoprazole
      - Dronedarone
      - Esomeprazole
      - Fluconazole
      - Fosphenytoin
      - Ketoconazole
      - Lansoprazole
      - Levoketoconazole
      - Mesoridazine
      - Omeprazole
      - Oxcarbazepine
      - Pantoprazole
      - Phenobarbital
      - Phenytoin
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Primidone
      - Rabeprazole
      - Rifabutin
      - Rifampin
      - Rifapentine
      - Saquinavir
      - Sparfloxacin
      - St John's Wort
      - Terfenadine
      - Thioridazine
      - Vonoprazan
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abacavir
      - Abametapir
      - Adagrasib
      - Alfuzosin
      - Aluminum Carbonate, Basic
      - Aluminum Hydroxide
      - Aluminum Phosphate
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amprenavir
      - Anagrelide
      - Apalutamide
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Atidarsagene Autotemcel
      - Avacopan
      - Azithromycin
      - Bedaquiline
      - Buprenorphine
      - Buserelin
      - Calcium Carbonate
      - Calcium Silicate
      - Ceritinib
      - Chloroquine
      - Chlorpromazine
      - Cimetidine
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clozapine
      - Conivaptan
      - Crizotinib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Boceprevir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Depression or
      - Liver disease—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or end-stage—Use with caution. The effects may be increased
        because of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given as a shot into a muscle, usually at each side of your
      buttocks. It is usually given once a month or once every 2 months.
  - type: paragraph
    text: This medicine comes with a patient information leaflet and instructions
      for use. Read and follow the instructions carefully. Read it again each time
      you receive the injection in case there is new information. Ask your doctor
      if you have any questions.
  - type: paragraph
    text: Your doctor may ask you to take 1 tablet of cabotegravir and 1 tablet of
      rilpivirine once a day for 1 month (at least 28 days) before receiving your
      first injection. This will allow your doctor to see how well you tolerate these
      medicines.
  - type: paragraph
    text: If you stop treatment with this medicine, you will need to take other medicines
      for HIV infection to reduce the risk of resistance to the virus. Call your doctor
      right away to discuss what other medicines to take.
  subsections:
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your progress closely while you are receiving this
      medicine to make sure this medicine is working properly. Blood tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: You should not receive this medicine together with dexamethasone (Decadron®),
      St. John's wort, medicine to treat tuberculosis (eg, rifabutin, rifampin, rifapentine,
      Mycobutin®, Priftin®, Rifadin®, Rimactane®), seizure medicine (eg, carbamazepine,
      oxcarbazepine, phenobarbital, phenytoin, Dilantin®, Tegretol®, Trileptal®).
      Using these medicines together may make Cabenuva less effective.
  - type: paragraph
    text: This medicine may cause serious skin reactions, including drug reaction
      with eosinophilia and systemic symptoms (DRESS). Check with your doctor right
      away if you have black, tarry stools, chest pain, cough, fever, painful or difficult
      urination, sore throat, sores, ulcers, or white spots on the lips or in the
      mouth, swollen glands, trouble breathing, unusual bleeding or bruising, or unusual
      tiredness or weakness.
  - type: paragraph
    text: Check with your doctor right away if you have anxiety, back pain, chest
      pain or tightness, dizziness, lightheadedness, fainting, feeling of warmth,
      hives, skin rash, numbness of your mouth, stomach cramps, sweating, trouble
      breathing, or pain, itching, redness, swelling, or tenderness at the injection
      site after you get the injection.
  - type: paragraph
    text: Check with your doctor right away if you have dark urine, clay-colored stools,
      stomach pain, or yellow eyes or skin. These may be symptoms of a serious liver
      problem.
  - type: paragraph
    text: Tell your doctor right away if you start to feel depressed. Report any unusual
      thoughts or behaviors that trouble you, especially if they are new or get worse
      quickly.
  - type: paragraph
    text: This medicine does not decrease the risk of transmitting HIV infection to
      others through sexual contact or by contamination through blood. HIV may be
      acquired from or spread to others through infected body fluids, including blood,
      vaginal fluid, or semen. If you are infected, it is best to avoid any sexual
      activity involving an exchange of body fluids with other people. If you do have
      sex, always wear (or have your partner wear) a condom. Only use condoms made
      of latex or polyurethane and use them every time you have contact with semen,
      vaginal secretions, or blood. Also, do not share needles or equipment with anyone
      or use dirty needles. If you have any questions about this, check with your
      doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bone or muscle pain
      - changes in behavior
      - dark urine
      - discouragement
      - feeling sad or empty
      - headache
      - irritability
      - loss of appetite
      - loss of interest or pleasure
      - nausea or vomiting
      - sleepiness or unusual drowsiness
      - stomach pain
      - thoughts of hurting oneself
      - trouble concentrating
      - trouble sleeping
      - unusual tiredness or weakness
      - yellow eyes or skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - back pain
      - chest pain or tightness
      - cough
      - diarrhea
      - dizziness, lightheadedness, fainting
      - feeling of warmth
      - hives, itching skin, rash
      - light-colored stools
      - noisy breathing
      - numbness of the mouth
      - redness of the face, neck, arms and occasionally, upper chest
      - redness of the skin
      - stomach cramps
      - sweating
      - trouble breathing
      - upper right stomach pain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chills
      - cloudy or blood urine
      - fever
      - high blood pressure
      - painful or difficult urination
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swelling of the face, feet, or lower legs
      - swollen glands
      - unusual bleeding or bruising
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of skin, feeling of
        pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
      - small lumps under the skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloated
      - collection of blood under skin
      - deep, dark purple bruise
      - difficulty in moving
      - excess air or gas in the stomach or intestines
      - full feeling
      - general feeling of discomfort or illness
      - increased weight
      - joint pain
      - lack or loss of strength
      - muscle aches, cramps, pains, or stiffness
      - passing gas
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
