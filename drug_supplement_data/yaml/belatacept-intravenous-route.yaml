      - drowsiness
      - dry mouth
      - fainting
      - fast or irregular heartbeat
      - fever
      - frequent urge to urinate
      - headache
      - hostility
      - inability to move the arms and legs
      - increased blood pressure
      - increased thirst
      - irritability
      - itching in other skin areas
