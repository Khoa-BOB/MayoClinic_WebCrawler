title: Belatacept (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Nulojix
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Belatacept injection belongs to a group of medicines known as immunosuppressive
      agents. It is used together with other medicines to prevent the body from rejecting
      a transplanted kidney.
  - type: paragraph
    text: When a patient receives a kidney transplant, the body's white blood cells
      will try to get rid of (reject) the transplanted kidney. Belatacept works by
      suppressing the immune system and prevents the white blood cells from trying
      to get rid of the transplanted organ.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of belatacept injection in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of belatacept injection in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Antithymocyte Globulin Equine
      - Antithymocyte Globulin Rabbit
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Cholera Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Poliovirus Vaccine, Live
      - Rotavirus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine, Live
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
      - Zoster Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Cytomegalovirus (CMV) infection—Use with caution. May increase risk for more
        serious side effects.
    - type: list
      ordered: false
      items:
      - Infection (e.g., bacteria, fungus, virus, or protozoa)—May decrease your body's
        ability to fight infection.
    - type: list
      ordered: false
      items:
      - Tuberculosis infection—Should be treated before starting therapy with this
        medicine.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a hospital. This medicine is given through a needle placed in one of your
      veins. The medicine must be injected slowly, so the needle will need to stay
      in place for at least 30 minutes.
  - type: paragraph
    text: This medicine comes with a Medication Guide. It is very important that you
      read and understand this information. Be sure to ask your doctor about anything
      you do not understand.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects. Be sure to keep all appointments.
  - type: paragraph
    text: It is important to tell your doctor if you become pregnant. Your doctor
      may want you to join a pregnancy registry for patients using this medicine.
  - type: paragraph
    text: Do not receive this medicine if your doctor says you are Epstein-Barr virus
      (EBV) negative. Your doctor will test you for EBV.
  - type: paragraph
    text: Using this medicine may increase your risk of having serious conditions
      called post-transplant lymphoproliferative disorder (PTLD) or progressive multifocal
      leukoencephalopathy. The risk of developing PTLD is higher in patients who are
      EBV negative, have cytomegalovirus (CMV) infection, or have received treatments
      for transplant rejections. Check with your doctor right away if you have changes
      in mood or usual behavior, confusion, problems with thinking, loss of memory,
      decreased strength on one side of the body, or changes in vision, walking, or
      talking.
  - type: paragraph
    text: This medicine may increase your risk of getting certain types of cancer,
      especially of the skin. Talk to your doctor if you have concerns about this
      risk.
  - type: paragraph
    text: Use sunscreen or sunblock lotions with a sun protection factor (SPF) of
      at least 15 on a regular basis when you are outdoors. Wear protective clothing
      and hats, and stay out of direct sunlight between the hours of 10 a.m. and 3
      p.m. Avoid sunlamps and tanning beds.
  - type: paragraph
    text: This medicine may increase your risk of developing infections. Avoid being
      near people who are sick or have infections while you are using this medicine.
      Wash your hands often. Tell your doctor if you have any kind of infection before
      you start using this medicine. Also tell your doctor if you have ever had an
      infection that would not go away or an infection that kept coming back.
  - type: paragraph
    text: You will need to have a skin test for tuberculosis before you start using
      this medicine. Tell your doctor if you or anyone in your home has ever had a
      positive reaction to a tuberculosis skin test.
  - type: paragraph
    text: 'This medicine may increase your risk for developing a rare and serious
      virus infection called polyoma virus-associated nephropathy (PVAN). PVAN is
      caused by BK virus. The BK virus may affect how your kidneys work and cause
      a transplanted kidney to fail. Check with your doctor right away if you are
      having more than one of these symptoms: bloody urine; a decreased frequency
      or amount of urine; increased thirst; loss of appetite; lower back or side pain;
      nausea; swelling of the face, fingers, or lower legs; trouble with breathing;
      unusual tiredness or weakness; vomiting; or weight gain.'
  - type: paragraph
    text: While you are being treated with belatacept, and after you stop using it,
      it is important to talk to your doctor about the immunizations (vaccines) you
      should receive. Do not get any vaccine without your doctor's approval . Belatacept
      may lower your body's resistance and there is a chance you might get the infection
      the vaccine is meant to prevent. In addition, other persons living in your household
      should not receive certain vaccines since there is a chance they could pass
      the infection on to you. Talk to your doctor if you have questions about this.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
