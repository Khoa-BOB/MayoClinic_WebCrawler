      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - unusual weight gain or loss
      - weakness or heaviness of the legs
      - weight gain
      - wheezing
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - coughing or spitting up blood
      - drowsiness
      - joint pain, stiffness, or swelling
      - loss of appetite
      - night sweats
      - persistent non-healing sore
      - pink growth reddish patch or irritated area
      - shiny bump
      - sudden high fever or low-grade fever for months
      - swelling of the feet or lower legs
      - weight gain
      - white, yellow, or waxy scar-like area
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps
      - blemishes on the skin
      - body aches or pain
      - collection of blood under the skin
      - cough producing mucus
      - deep, dark purple bruise
      - diarrhea
      - difficulty having a bowel movement (stool)
      - difficulty with moving
      - dry mouth
      - ear congestion
      - flushed, dry skin
      - fruit-like breath odor
      - hair loss or thinning of the hair
      - increased hunger
      - increased sweating
      - increased urination
      - itching, pain, redness, or swelling
      - loss of consciousness
      - loss of voice
      - muscle cramps in the hands, arms, feet, legs, or face
      - muscle or bone pain
      - muscle pain or stiffness
      - numbness and tingling around the mouth, fingertips, or feet
      - pain in the joints
      - pimples
      - shakiness in the legs, arms, hands, or feet
      - shortness of breath
      - sleeplessness
      - sneezing
      - swelling or inflammation of the mouth
      - tightness in the chest
      - tremor
      - trouble sleeping
      - unable to sleep
      - unexplained weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
