title: Fenofibrate (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Antara
    - type: paragraph
      text: Fenoglide
    - type: paragraph
      text: Lipofen
    - type: paragraph
      text: Lofibra
    - type: paragraph
      text: Tricor
    - type: paragraph
      text: Triglide
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fenofibrate is used together with a proper diet to reduce and treat high
      cholesterol and triglyceride (fat-like substances) levels in the blood. This
      may help prevent the development of pancreatitis (inflammation or swelling of
      the pancreas) caused by high levels of triglycerides in the blood.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of fenofibrate in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of fenofibrate in the elderly. However,
        elderly patients are more likely to have age-related kidney problems, which
        may require caution and an adjustment in the dose for patients receiving fenofibrate.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Ciprofibrate
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acenocoumarol
      - Anisindione
      - Atorvastatin
      - Cholestyramine
      - Colchicine
      - Colesevelam
      - Colestipol
      - Cyclosporine
      - Dicumarol
      - Ezetimibe
      - Fluvastatin
      - Lovastatin
      - Phenprocoumon
      - Pitavastatin
      - Pravastatin
      - Rosuvastatin
      - Simvastatin
      - Tacrolimus
      - Warfarin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Rosiglitazone
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood clotting problems (eg, deep vein thrombosis, pulmonary embolism), history
        of or
      - Heart disease or
      - Muscle pain, tenderness, or weakness, history of—Use with caution. May make
        these conditions worse.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hypothyroidism (an underactive thyroid) or
      - Kidney problems—Use with caution. May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Gallbladder disease, history of or
      - Kidney disease, severe (eg, end-stage kidney disease, those receiving dialysis)
        or
      - Liver disease (including cirrhosis), active—Should not be used in patients
        with these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not use more of
      it, do not use it more often, or do not use it for a longer time than your doctor
      ordered.
  - type: paragraph
    text: In addition to this medicine, your doctor may change your diet to one that
      is low in fat, sugar, and cholesterol. Carefully follow your doctor's order
      about any special diet . If you have excess body weight, your doctor may tell
      you to exercise to lose this weight before using this medicine. Also avoid drinking
      alcohol before and during treatment with fenofibrate.
  - type: paragraph
    text: This medicine is usually taken once a day. Take the medicine at the same
      time each day to maintain the medication's effect.
  - type: paragraph
    text: Fenoglide® , Lipofen® , and Lofibra™ should be taken with a meal. Antara®
      , Tricor® , and Triglide® can be taken with or without a meal.
  - type: paragraph
    text: Swallow Antara® capsules , Fenoglide® tablets , Lipofen® capsules , Tricor®
      tablets , or Triglide® tablets whole. Do not open, crush, break, chew, or dissolve
      them. Do not take chipped or broken Triglide® tablets .
  - type: paragraph
    text: If you are also using cholestyramine, colesevelam, or colestipol, you must
      take Lipofen® , Tricor® , Triglide® , or Fenoglide® at least 1 hour before or
      4 to 6 hours after you take these medicines.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For high cholesterol: Adults— Antara®: At
        first, 130 milligrams (mg) once a day with a meal. Your doctor may adjust
        your dose as needed. Lipofen®: 150 mg once a day with a meal. Your doctor
        may adjust your dose as needed. Lofibra™: 200 mg once a day with a meal. Children—Use
        and dose must be determined by your doctor. For severe hypertriglyceridemia
        (high triglycerides or fats): Adults— Antara®: At first, 43 to 130 milligrams
        (mg) once a day. Your doctor may adjust your dose as needed. However, the
        dose is usually not more than 130 mg per day. Lipofen®: 50 to 150 mg once
        a day with a meal. Your doctor may adjust your dose as needed. Lofibra™: At
        first, 67 mg once a day with a meal. Your doctor may increase your dose as
        needed. Children—Use and dose must be determined by your doctor.'
