    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep Triglide® tablets in its original container. Protect from heat, light,
        and moisture.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly to
      lower your cholesterol and triglyceride (fat) levels and to decide if you should
      continue to take it. Blood and urine tests may be needed to check for unwanted
      effects.
  - type: paragraph
    text: Call your doctor right away if you have a headache, stomach pain, vomiting,
      dark urine, loss of appetite, weight loss, general feeling of tiredness or weakness,
      light-colored stools, upper right stomach pain, or yellow eyes or skin. These
      could be symptoms of serious liver problems.
  - type: paragraph
    text: Check with your doctor right away if you have unexplained muscle pain, tenderness,
      or weakness, especially if you also have unusual tiredness or fever. These could
      be symptoms of a serious muscle problem called myopathy.
  - type: paragraph
    text: Check with your doctor right away if you have dark urine, diarrhea, fever,
      muscle cramps or spasms, muscle pain or stiffness, or feel very tired or weak.
      These could be symptoms of a serious muscle problem called rhabdomyolysis, which
      can cause kidney problems.
  - type: paragraph
    text: Pancreatitis (swelling of the pancreas) may occur while you are using this
      medicine. Tell your doctor right away if you have bloating, sudden and severe
      stomach pain, chills, diarrhea, fast heartbeat, fever, indigestion. loss of
      appetite, nausea, pains in stomach, side, or abdomen, possibly radiating to
      the back, vomiting.
  - type: paragraph
    text: This medicine may increase your risk of having gallstones. Check with your
      doctor right away if you have severe stomach pain, especially after eating,
      with nausea and vomiting.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Tell your doctor right away if you have a rash, itching, hoarseness,
      trouble breathing, trouble swallowing, or any swelling of your hands, face,
      or mouth after using this medicine.
  - type: paragraph
    text: Serious skin reactions, including Steven-Johnson syndrome, toxic epidermal
      necrolysis, and drug reaction with eosinophilia and systemic symptoms (DRESS)
      can occur with this medicine. Check with your doctor right away if you have
      blistering, peeling, or loosening of the skin, chest pain, chills, cough, diarrhea,
      itching, joint or muscle pain, painful or difficult urination, rash, red skin
      lesions, often with a purple center, sore throat, sores, ulcers, or white spots
      in the mouth or on the lips, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may lower the number of some types of blood cells in your
      body. Because of this, you may bleed or get infections more easily. To help
      with these problems, avoid being near people who are sick or have infections.
      Wash your hands often. Stay away from rough sports or other situations where
      you could be bruised, cut, or injured. Brush and floss your teeth gently. Be
      careful when using sharp objects, including razors and fingernail clippers.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - fever
      - hives, itching, skin rash
      - muscle aches and pains
      - nausea
      - stomach pain
      - vomiting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dark urine
      - muscle cramps, spasms, stiffness, swelling, or weakness
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - bloating
      - bloody urine
      - constipation
      - cough
      - decreased frequency or amount of urine
      - difficulty in moving
      - fast heartbeat
      - increased blood pressure
      - increased thirst
      - indigestion
      - joint pain or swelling
      - light-colored stools
      - loss of appetite
      - lower back or side pain
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - pale skin
      - swelling of the face, fingers, or lower legs
      - upper right stomach pain
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Runny or stuffy nose
      - sneezing
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - diarrhea
      - eye irritation
      - gas
      - increased sensitivity of the skin to sunlight
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Lack or loss of strength
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
