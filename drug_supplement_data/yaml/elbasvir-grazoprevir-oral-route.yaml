title: Elbasvir/grazoprevir (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Zepatier
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Elbasvir and grazoprevir combination is used with or without ribavirin to
      treat chronic hepatitis C infection.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of elbasvir and grazoprevir combination in children younger
        than 12 years of age weighing less than 30 kilograms (kg). Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of elbasvir and grazoprevir combination
        in the elderly. However, elderly patients are more likely to have liver problems,
        which may require caution in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Apalutamide
      - Atazanavir
      - Carbamazepine
      - Cyclosporine
      - Darolutamide
      - Darunavir
      - Efavirenz
      - Elagolix
      - Eltrombopag
      - Enasidenib
      - Enzalutamide
      - Fosphenytoin
      - Fostemsavir
      - Gemfibrozil
      - Ivosidenib
      - Ketoconazole
      - Lopinavir
      - Lumacaftor
      - Mitotane
      - Nirmatrelvir
      - Paritaprevir
      - Phenytoin
      - Pimozide
      - Rifampin
      - Rifapentine
      - Ritonavir
      - Saquinavir
      - St John's Wort
      - Tipranavir
      - Velpatasvir
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Alpelisib
      - Atogepant
      - Atorvastatin
      - Atrasentan
      - Avacopan
      - Bosentan
      - Ceftobiprole Medocaril
      - Clarithromycin
      - Cobicistat
      - Conivaptan
      - Drospirenone
      - Elexacaftor
      - Eluxadoline
      - Ethinyl Estradiol
      - Etonogestrel
      - Etravirine
      - Fedratinib
      - Fexinidazole
      - Finerenone
      - Fosnetupitant
      - Haloperidol
      - Insulin Aspart, Recombinant
      - Itraconazole
      - Ketoconazole
      - Leflunomide
      - Leniolisib
      - Letermovir
      - Methylergonovine
      - Midostaurin
      - Mifepristone
      - Modafinil
      - Nafcillin
      - Netupitant
      - Nifedipine
      - Norethindrone
      - Norgestimate
      - Omaveloxolone
      - Phenobarbital
      - Primidone
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Hepatitis B, history of—Use with caution. May cause this condition to become
        active again.
    - type: list
      ordered: false
      items:
      - Liver disease, moderate to severe—Should not be used in patients with this
        condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: To help clear up your infection completely, take Zepatier® together with
      or without ribavirin for the full time of treatment , even if you begin to feel
      better after a few days. Also, it is important to keep the amount of medicine
      in your body at a steady level. To help keep the amount constant, Zepatier®
      must be used on a regular schedule.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. Read and follow
      the information carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  - type: paragraph
    text: Make sure you understand how to use all of the medicines your doctor prescribed.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For chronic hepatitis C infection (used together
        with or without ribavirin): Adults and children 12 years of age and older
        or weighing 30 kilograms (kg) or more—One tablet once a day. Each tablet contains
        50 milligrams (mg) of elbasvir and 100 mg of grazoprevir. Children younger
        than 12 years of age weighing less than 30 kg—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For chronic hepatitis C infection (used together with or without ribavirin):
        Adults and children 12 years of age and older or weighing 30 kilograms (kg)
        or more—One tablet once a day. Each tablet contains 50 milligrams (mg) of
        elbasvir and 100 mg of grazoprevir. Children younger than 12 years of age
        weighing less than 30 kg—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older or weighing 30 kilograms (kg)
        or more—One tablet once a day. Each tablet contains 50 milligrams (mg) of
        elbasvir and 100 mg of grazoprevir.
      - Children younger than 12 years of age weighing less than 30 kg—Use and dose
        must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the tablets in the original container until you are ready to use
        it.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine together with ribavirin while you are pregnant can harm
      your unborn baby. Birth defects may occur if the father is using this medicine
      when his sexual partner becomes pregnant. If a pregnancy occurs while you are
      using this medicine, tell your doctor right away.
  - type: paragraph
    text: 'Do not use the following medicines while you are using Zepatier®: cyclosporine
      (Gengraf®, Neoral®, Sandimmune®), rifampin (Rifadin®, Rimactane®), St. John''s
      wort, medicine to treat HIV infection (including atazanavir, darunavir, efavirenz,
      lopinavir, saquinavir, tipranavir, Invirase®, Kaletra®, Reyataz®, Sustiva®),
      or medicine to treat seizures (including carbamazepine, phenytoin, Dilantin®,
      Tegretol®).'
  - type: paragraph
    text: Check with your doctor right away if you are weak or tired, have pain or
      tenderness in the upper stomach, pale stools, dark urine, loss of appetite,
      nausea, vomiting, or yellow eyes or skin. These could be symptoms of a serious
      liver problem.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Discouragement
      - feeling sad or empty
      - irritability
      - loss of appetite
      - loss of interest or pleasure
      - trouble concentrating
      - trouble sleeping
      - unusual tiredness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dark urine
      - fever with or without chills
      - large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
        feet, or sex organs
      - light-colored stools
      - nausea and vomiting
      - upper stomach pain
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - stomach pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
