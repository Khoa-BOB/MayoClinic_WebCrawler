    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to aspirin or
      - Asthma or
      - Diabetes or
      - Glaucoma or
      - Heart attack, history of or
      - Heart disease or
      - High blood pressure, history of or
      - Kidney disease or
      - Liver disease (eg, cirrhosis) or
      - Lung or breathing problems (eg, bronchitis, emphysema)
      - Stomach ulcers or bleeding, history of or
      - Stroke, history of or
      - Thyroid problems or
      - Trouble urinating caused by enlarged prostate—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Heart surgery—Should not be used to relieve pain right before or after the
        surgery.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: Follow the instructions on the medicine label if you are using this medicine
      without a prescription.
  - type: paragraph
    text: You may take this medicine with milk or food to avoid stomach upset.
  - type: paragraph
    text: Do not drink 3 or more alcoholic drinks while you are using this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For symptoms of allergies and cold: Adults
        and children 12 years of age and older—1 tablet every 4 hours a day. Do not
        take more than 6 tablets per day. Each tablet contains 4 milligrams (mg) chlorpheniramine,
        200 mg ibuprofen, and 10 mg phenylephrine. Children younger than 12 years
        of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For symptoms of allergies and cold: Adults and children 12 years of age and
        older—1 tablet every 4 hours a day. Do not take more than 6 tablets per day.
        Each tablet contains 4 milligrams (mg) chlorpheniramine, 200 mg ibuprofen,
        and 10 mg phenylephrine. Children younger than 12 years of age—Use is not
        recommended.'
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age and older—1 tablet every 4 hours a day.
        Do not take more than 6 tablets per day. Each tablet contains 4 milligrams
        (mg) chlorpheniramine, 200 mg ibuprofen, and 10 mg phenylephrine.
      - Children younger than 12 years of age—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure that this medicine is working properly and to
      check for unwanted effects.
  - type: paragraph
    text: If your or your child's symptoms do not improve within a few days (eg, fever
      for more than 3 days, stuffy nose or pain for more than 7 days), or if they
      become worse, check with your doctor.
  - type: paragraph
    text: Using this medicine during late pregnancy can harm your unborn baby. If
      you think you have become pregnant while using the medicine, tell your doctor
      right away.
  - type: paragraph
    text: Do not use this medicine if you have used an MAO inhibitor (MAOI), including
      Eldepryl®, Marplan®, Nardil®, or Parnate® within the past 2 weeks.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction, which can be life-threatening
      and requires immediate medical attention. Tell your doctor right away if you
      have a rash, itching, hoarseness, trouble breathing, trouble swallowing, or
      any swelling of your hands, face, or mouth after using this medicine.
  - type: paragraph
    text: This medicine may cause bleeding in your stomach or bowels. These problems
      can happen without warning signs. This is more likely if you have had a stomach
      ulcer in the past, if you smoke or drink alcohol regularly, are over 60 years
      of age, are in poor health, or using certain other medicines (eg, NSAIDs, steroid,
      blood thinner). Call your doctor right away if you have severe stomach pain,
      black, tarry stools, or are vomiting blood or material that looks like coffee
      grounds.
  - type: paragraph
    text: This medicine may increase your risk of having a heart attack, heart failure,
      or stroke. This is more likely in people who already have heart disease. People
      who use this medicine for a long time might also have a higher risk. Some signs
      of serious heart problems are chest pain or tightness, fast or irregular heartbeat,
      or unusual flushing or warmth of the skin. Check with your doctor right away
      if you notice any of these warning signs .
  - type: paragraph
    text: This medicine may make you dizzy or drowsy. Do not drive or do anything
      else that could be dangerous until you know how this medicine affects you .
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that can make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for allergies or colds, sedatives, tranquilizers,
      or sleeping medicine, other prescription pain medicine or narcotics, medicine
      for seizures or barbiturates, muscle relaxants, or anesthetics, including some
      dental anesthetics. Check with your doctor before taking any of these medicines
      while you are using this medicine .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or non-prescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody or black, tarry stools
      - chest pain or tightness
      - confusion
      - constipation
      - cough
      - decrease urine output
      - diarrhea
      - difficulty in speaking
      - difficulty swallowing
      - dilated neck veins
      - dizziness
      - double vision
      - fast heartbeat
      - headache
      - heartburn
      - hives, itching, skin rash
      - inability to speak
      - inability to move the arms, legs, or facial muscles
      - indigestion
      - irregular breathing
      - nausea
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or  tongue
      - severe stomach pain, cramping, or burning
      - swelling of the face, fingers, feet, or lower legs
      - trouble breathing
      - unusual tiredness or weakness
      - vomiting of blood or material that looks like coffee grounds
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nervousness
      - trouble sleeping
      - unusual excitement, especially in children
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
