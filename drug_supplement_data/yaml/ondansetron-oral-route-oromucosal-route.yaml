    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose of this medicine, and you feel nauseated or you vomit,
        take the missed dose as soon as possible.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep the medicine in the foil pouch until you are ready to use it. Store
        at room temperature, away from heat and direct light. Do not freeze.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the unused soluble film in the foil pouch until you ready to use
        it.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Check with your doctor if severe nausea and vomiting continue after leaving
      the hospital or cancer treatment center.
  - type: paragraph
    text: Do not use this medicine if you are receiving apomorphine (Apokyn®) . Using
      these medicines together may increase risk for more serious problems.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are using this medicine.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you or anyone in your family has ever
      had a heart rhythm problem including QT prolongation.
  - type: paragraph
    text: Check with your doctor right away if you have anxiety, restlessness, a fast
      heartbeat, fever, sweating, muscle spasms, twitching, nausea, vomiting, diarrhea,
      or see or hear things that are not there. These may be symptoms of a serious
      condition called serotonin syndrome. Your risk may be higher if you also take
      certain other medicines that affect serotonin levels in your body.
  - type: paragraph
    text: This medicine may cause a serious heart problem called myocardial ischemia
      (low blood supply to the heart). Check with your doctor right away if you have
      chest pain or discomfort, nausea, pain or discomfort in the arms, jaw, back,
      or neck, sweating, trouble breathing, irregular heartbeat, or vomiting.
  - type: paragraph
    text: Check with your doctor right away if you start to have pain or swelling
      in your stomach area. These may be signs of a serious stomach or bowel problem.
  - type: paragraph
    text: This medicine may make you dizzy. Do not drive or do anything else that
      could be dangerous until you know how this medicine affects you .
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - dizziness
      - fast heartbeat
      - fever
      - headache
      - trouble breathing
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decrease in the frequency of urination
      - decrease in the urine volume
      - difficulty with passing urine (dribbling)
      - painful urination
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm, back, or jaw pain
      - chest pain, discomfort, tightness, or heaviness
      - cough
      - decreased urine
      - difficulty with breathing
      - difficulty with swallowing
      - dry mouth
      - fast, pounding, or irregular heartbeat or pulse
      - increased thirst
      - loss of appetite
      - loss of bladder control
      - loss of consciousness
      - mood changes
      - muscle pain or cramps
      - nausea or vomiting
      - noisy breathing
      - numbness or tingling in the hands, feet, or lips
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - seizures
      - skin rash, hives, or itching
      - sweating
      - total body jerking
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - blistering, peeling, or loosening of the skin
      - blurred vision
      - chills
      - diarrhea
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fixed position of the eye
      - heart stops
      - hoarseness
      - inability to move the eyes
      - increased blinking or spasms of the eyelid
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - no pulse or blood pressure
      - noisy breathing
      - overactive reflexes
      - pain or discomfort in the arms, jaw, back, or neck
      - poor coordination
      - pounding heartbeat
      - red irritated eyes
      - red skin lesions often with a purple center
      - restlessness
      - shivering
      - slow or irregular breathing
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - sticking out of the tongue
      - sweating
      - talking or acting with excitement you cannot control
      - trembling or shaking
      - trouble with speaking
      - twitching
      - unconscious
      - uncontrolled twisting movements of the neck, trunk, arms, or legs
      - unusual facial expressions
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - difficulty having a bowel movement (stool)
      - dry mouth
      - general feeling of discomfort or illness
      - hyperventilation
      - irritability
      - shaking
      - trouble sleeping
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with speaking
      - drooling
      - loss of balance control
      - muscle trembling, jerking, or stiffness
      - shuffling walk
      - stiffness of the limbs
      - uncontrolled movements, especially of the face, neck, and back
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Feeling of warmth
      - hiccups
      - redness of the face, neck, arms, and occasionally, upper chest
      - redness of the skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
