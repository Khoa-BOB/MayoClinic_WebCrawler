title: Ondansetron (oral route, oromucosal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Zofran
    - type: paragraph
      text: Zofran ODT
    - type: paragraph
      text: Zuplenz
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ondansetron is used to prevent nausea and vomiting that is caused by cancer
      medicines (chemotherapy) or radiation therapy. It is also used to prevent nausea
      and vomiting that may occur after surgery. Ondansetron works in the stomach
      to block the signals to the brain that cause nausea and vomiting.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Disintegrating
    - Film
    - Tablet
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of ondansetron in children younger than 4 years of age. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of ondansetron in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Apomorphine
      - Bepridil
      - Cisapride
      - Dronedarone
      - Fluconazole
      - Ketoconazole
      - Levoketoconazole
      - Mavorixafor
      - Mesoridazine
      - Phenelzine
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Acecainide
      - Adagrasib
      - Alfentanil
      - Alfuzosin
      - Almotriptan
      - Amineptine
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amitriptylinoxide
      - Amoxapine
      - Amphetamine
      - Anagrelide
      - Anileridine
      - Apalutamide
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Avacopan
      - Azathioprine
      - Azimilide
      - Azithromycin
      - Bedaquiline
      - Benzhydrocodone
      - Benzphetamine
      - Bretylium
      - Brompheniramine
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Buspirone
      - Butorphanol
      - Capmatinib
      - Carbamazepine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Cyclophosphamide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to other selective 5-HT3 receptor antagonists (eg, alosetron [Lotronex®],
        dolasetron [Anzemet®], granisetron [Kytril®], palonosetron [Aloxi®])—Use with
        caution. It is likely you will also be allergic to ondansetron.
    - type: list
      ordered: false
      items:
      - Bowel blockage or
      - Gastric distension (enlarged stomach)—May cover up symptoms of these stomach
        or intestinal problems, especially in patients who had a recent stomach surgery.
    - type: list
      ordered: false
      items:
      - Bradyarrhythmia (slow heartbeat) or
      - Congestive heart failure or
      - Heart rhythm problems (eg, prolonged QT interval, slow heartbeat) or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Heart rhythm problems (eg, congenital long QT syndrome)—Use is not recommended
        in patients with this condition.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Phenylketonuria (PKU)—The oral disintegrating tablets may contain aspartame,
        which can make your condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine comes with patient instructions. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: 'To use the oral disintegrating tablet :'
  - type: list
    ordered: false
    items:
    - Make sure your hands are dry.
    - Do not push the tablet through the foil backing of the package. Instead, gently
      peel back the foil backing and remove the tablet.
    - Immediately place the tablet on top of the tongue. The tablet will dissolve
      in seconds, and you may swallow it with your saliva. You do not need to drink
      water or other liquid to swallow the tablet.
  - type: paragraph
    text: 'To use the oral soluble film :'
  - type: list
    ordered: false
    items:
    - Make sure your hands are clean and dry before and after using this medicine.
    - Fold the pouch along the dotted line to expose the tear notch.
    - While still folded, tear the pouch carefully along the edge and remove the film
      out from the pouch.
    - Put the soluble film immediately on top of your tongue where it will dissolve
      in 4 to 20 seconds. Do not chew or swallow the film whole.
    - Once the film is dissolved, you may swallow with or without water.
  - type: paragraph
    text: If you vomit within 30 minutes after using this medicine, take the same
      amount of medicine again. If vomiting continues, check with your doctor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (oral disintegrating tablets, solution, or tablets):
        For prevention of moderate nausea and vomiting after treatment with cancer
        medicines: Adults and children 12 years of age and older—At first, 8 milligrams
        (mg) taken 30 minutes before starting cancer treatment. The 8-mg dose is taken
        again 8 hours after the first dose. Then, the dose is 8 mg every 12 hours
        for 1 to 2 days. Children 4 to 11 years of age—At first, 4 mg taken 30 minutes
        before starting cancer treatment. The 4-mg dose is taken again 4 and 8 hours
        after the first dose. Then, the dose is 4 mg every 8 hours for 1 to 2 days.
        Children younger than 4 years of age—Use and dose must be determined by your
        doctor. For prevention of more severe nausea and vomiting after treatment
        with cancer medicines: Adults, teenagers, and children 12 years of age—One
        24-milligram (mg) tablet taken 30 minutes before starting cancer treatment.
        Children younger than 12 years of age—Use and dose must be determined by your
        doctor. For prevention of nausea and vomiting after radiation treatment: Adults—At
        first, 8 milligrams (mg) taken 1 to 2 hours before radiation treatment. Then,
        the dose is 8 mg every 8 hours. Children—Use and dose must be determined by
        your doctor. For prevention of nausea and vomiting after surgery: Adults—16
        milligrams (mg) one hour before anesthesia is given. Children—Use and dose
        must be determined by your doctor.'
      - 'For oral dosage form (soluble film): For prevention of moderate nausea and
        vomiting after treatment with cancer medicines: Adults and children 12 years
        of age and older—At first, one 8-milligram (mg) film taken 30 minutes before
        starting cancer treatment. The second 8-mg film is taken 8 hours after the
        first dose. Then, one 8-mg film is taken two times a day (every 12 hours)
        for 1 to 2 days. Children 4 to 11 years of age—At first, one 4-milligram (mg)
        film taken 30 minutes before starting cancer treatment. The second and third
        4-mg films are taken 4 and 8 hours after the first dose. Then, one 4-mg film
        is taken three times a day (every 8 hours) for 1 to 2 days. Children younger
        than 4 years of age—Use and dose must be determined by your doctor. For prevention
        of more severe nausea and vomiting after treatment with cancer medicines:
        Adults—24 milligrams (mg) or three 8-mg films taken 30 minutes before starting
        cancer treatment. Each film should be dissolved in the tongue before taking
        the next film. Children—Use and dose must be determined by your doctor. For
        prevention of nausea and vomiting after radiation treatment: Adults—One 8-milligram
        (mg) film three times a day. Children—Use and dose must be determined by your
        doctor. For prevention of nausea and vomiting after surgery: Adults—16 milligrams
        (mg) or two 8-mg films taken 1 hour before anesthesia is given. Each film
        should be dissolved in the tongue before taking the next film. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For prevention of moderate nausea and vomiting after treatment with cancer
        medicines: Adults and children 12 years of age and older—At first, 8 milligrams
        (mg) taken 30 minutes before starting cancer treatment. The 8-mg dose is taken
