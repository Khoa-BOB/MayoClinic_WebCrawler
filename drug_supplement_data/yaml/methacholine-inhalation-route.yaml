title: Methacholine (inhalation route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Provocholine
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Methacholine inhalation is used to help your doctor diagnose bronchial airway
      hyperreactivity or asthma. This medicine works by narrowing your bronchial airways.
      The degree of narrowing will be measured by a device called a spirometer. This
      test is also called the methacholine challenge test.
  - type: paragraph
    text: This medicine is to be given only under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a diagnostic test, any risks of the test must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      Also, other things may affect test results. For this test, the following should
      be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of methacholine inhalation in children younger than 5 years
        of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of methacholine inhalation in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this diagnostic test,
        it is especially important that your healthcare professional know if you are
        taking any of the medicines listed below. The following interactions have
        been selected on the basis of their potential significance and are not necessarily
        all-inclusive.
    - type: paragraph
      text: Receiving this diagnostic test with any of the following medicines is
        usually not recommended, but may be required in some cases. If both medicines
        are prescribed together, your doctor may change the dose or how often you
        use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aclidinium
      - Albuterol
      - Amantadine
      - Amitriptyline
      - Amoxapine
      - Arformoterol
      - Atropine
      - Bambuterol
      - Belladonna
      - Benztropine
      - Biperiden
      - Brompheniramine
      - Carbinoxamine
      - Carisoprodol
      - Chlorpheniramine
      - Chlorpromazine
      - Clemastine
      - Clenbuterol
      - Clidinium
      - Clomipramine
      - Clozapine
      - Colterol
      - Cyclobenzaprine
      - Cyclopentolate
      - Cyproheptadine
      - Darifenacin
      - Desipramine
      - Dicyclomine
      - Dimenhydrinate
      - Diphenhydramine
      - Doxepin
      - Fenoterol
      - Fesoterodine
      - Flavoxate
      - Fluphenazine
      - Formoterol
      - Glycopyrrolate
      - Glycopyrronium Tosylate
      - Hexoprenaline
      - Homatropine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this diagnostic
        test. Make sure you tell your doctor if you have any other medical problems,
        especially:'
    - type: list
      ordered: false
      items:
      - Allergic rhinitis without asthma symptoms or
      - Infection (eg, upper respiratory infection, influenza) or
      - Lung disease, chronic (eg, COPD, tuberculosis, sarcoidosis, or cystic fibrosis)—Use
        in patients with these conditions may sometimes cause a false-positive result.
    - type: list
      ordered: false
      items:
      - Aortic aneurysm (bulge in the wall of the main artery of the heart) or
      - Heart attack, history of or
      - Hypertension (high blood pressure), uncontrolled or
      - Stroke, history of—Use with caution. Use is not recommended in patients with
        these conditions.
    - type: list
      ordered: false
      items:
      - Epilepsy or
      - Peptic ulcer disease or
      - Thyroid disease or
      - Urinary tract blockage or
      - Vagotonia (excessive activity of the vagus nerve)—Use with caution. May increase
        risk for more side effects. Your doctor should only test this medicine in
        patients with these conditions if benefits outweigh the risks.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other health professional will give you this medicine in the
      hospital. It is given through oral inhalation using a dosimeter. Your doctor
      will also use a device, called a spirometer, to check for your lung function.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you or your child's progress
      closely during treatment with this medicine to see if it is working properly
      and to check for any unwanted effects.
  - type: paragraph
    text: This medicine may cause severe bronchoconstriction and should not be used
      in patients with asthma or with breathing difficulties. Check with your doctor
      right away if you are having severe cough, difficulty breathing, noisy breathing,
      or tightness in the chest.
  - type: paragraph
    text: This medicine may cause mild cough, chest tightness, or trouble with breathing.
      This is normal and nothing to worry about.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - difficulty breathing
      - noisy breathing
      - tightness in the chest
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - itching
      - lightheadedness
      - throat irritation
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
