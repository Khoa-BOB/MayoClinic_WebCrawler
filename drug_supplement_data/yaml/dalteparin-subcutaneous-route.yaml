      - Drotrecogin Alfa
      - Droxicam
      - Edoxaban
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to pork or heparin or
      - Bleeding, active or
      - Regional anesthesia or
      - Thrombocytopenia (low platelet count in the blood), heparin-induced, or history
        of—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Catheter insertion in your spine or
      - Eye problems caused by diabetes or high blood pressure or
      - Heart infection or
      - Hypertension (high blood pressure), severe and uncontrolled or
      - Kidney disease or
      - Liver disease or
      - Stomach or intestinal ulcer or bleeding, active or recent or
      - Stroke or
      - Surgery (eg, surgery of the eye, brain, or spine), recent or history of or
      - Thrombocytopenia—Use with caution. The risk of bleeding may be increased.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      It is given as a shot under your skin (usually in the stomach, buttocks, or
      thighs). You or your caregiver may be trained to prepare and inject the medicine
      at home. Be sure that you understand how to use the medicine.
  - type: paragraph
    text: You will be shown the body areas where this shot can be given. Use a different
      body area each time you give yourself a shot. Keep track of where you give each
      shot to make sure you rotate body areas. This will help prevent skin problems
      from the injections.
  - type: paragraph
    text: If the medicine in the vial (glass container) or prefilled syringe has changed
      color, or if you see particles in it, do not use it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form (solution): For prevention of blood clots after
        unstable angina (chest pain) or non–Q-wave myocardial infarction (a type of
        heart attack): Adults—Dose is based on body weight and must be determined
        by your doctor. The dose is usually 120 international units (IU) per kilogram
        (kg) of body weight injected under the skin (but not more than 10,000 IU)
        given every 12 hours for 5 to 8 days. Unless your doctor recommends otherwise,
        aspirin should be given 75 to 165 milligrams (mg) once a day. Children—Use
        and dose must be determined by your doctor. For prevention of deep venous
        thrombosis after abdominal surgery: Adults—2,500 or 5,000 international units
        (IU) injected under the skin once a day, or 2,500 IU injected under the skin
        followed by 2,500 IU injected under the skin given 12 hours later and then
        5,000 IU injected under the skin once a day for 5 to 10 days. Children—Use
        and dose must be determined by your doctor. For prevention of deep venous
        thrombosis after hip replacement surgery: Adults— If started the evening before
        surgery: 5,000 international units (IU) injected under the skin 10 to 14 hours
        before surgery followed by 5,000 IU injected under the skin 4 to 8 hours after
        surgery, then 5,000 IU injected under the skin once a day. If started on the
        day of surgery: 2,500 IU injected under the skin within 2 hours before surgery
        followed by 2,500 IU injected under the skin 4 to 8 hours after surgery, then
        5,000 IU injected under the skin once a day. If started after surgery: 2,500
        IU injected under the skin given 4 to 8 hours after surgery, then 5,000 IU
        injected under the skin once a day, given 5 to 10 days after surgery. Children—Use
        and dose must be determined by your doctor. For prevention of deep venous
        thrombosis in medical patients with acute illness: Adults—5,000 international
        units (IU) injected under the skin once a day for 12 to 14 days. Children—Use
        and dose must be determined by your doctor. For symptomatic deep venous thrombosis
        and pulmonary embolism in children: Children 8 to 16 years of age—Dose is
        based on body weight and must be determined by your doctor. At first, 100
        internation units (IU) per kilogram (kg) of body weight injected under the
        skin 2 times a day. Your doctor will adjust your dose as needed. Children
        2 to 7 years of age—Dose is based on body weight and must be determined by
        your doctor. At first, 125 IU per kg of body weight injected under the skin
        2 times a day. Your doctor will adjust your dose as needed. Children 4 weeks
        to 1 year of age—Dose is based on body weight and must be determined by your
        doctor. At first, 100 IU per kg of body weight injected under the skin 2 times
        a day. Your doctor will adjust your dose as needed. Children younger than
        4 weeks of age—Use and dose must be determined by your doctor. For symptomatic
        deep venous thrombosis and pulmonary embolism in patients with cancer: Adults—Dose
        is based on body weight and must be determined by your doctor. On the first
        30 days, 200 international units (IU) per kilogram (kg) of total body weight
        injected under the skin (but not more than 18,000 IU) once a day. On months
        2 to 6, 150 IU per kg of body weight injected under the skin once a day. Children—Use
        and dose must be determined by your doctor.'
    - type: list
