    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: If you were given a bottle of medicine to use with your syringes, you
        must use the medicine within 14 days after the first shot. Throw away any
        unused medicine after 14 days.
    - type: paragraph
      text: Throw away used needles in a hard, closed container that the needles cannot
        poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure that the medicine is working properly. Blood
      tests may be needed to check for unwanted effects. Be sure to keep all appointments.
  - type: paragraph
    text: This medicine may increase your risk of bleeding or bruising. This risk
      is higher if you have poorly controlled high blood pressure, a heart infection,
      stomach ulcers, or other bleeding problems. Check with your doctor right away
      if you notice any unusual bleeding or bruising, black, tarry stools, blood in
      the urine or stools, or pinpoint red spots on your skin. Avoid picking your
      nose. If you need to blow your nose, blow it gently.
  - type: paragraph
    text: This medicine may increase your risk of serious bleeding or nerve problems
      in your spine. This risk is higher if you have a catheter in your back for pain
      medicine or anesthetics, or have an injection into your spine (sometimes called
      an "epidural" or "spinal"). Other factors include traumatic or repeated epidural
      or spinal punctures in the past, spinal deformity, previous spinal surgery,
      or use of other medications that increase the risk of bleeding. Check with your
      doctor right away if you develop weakness or numbness in your legs or feet,
      or loss of urine or bowel control.
  - type: paragraph
    text: Call your doctor right away if you start having pains in the chest, groin,
      or legs, especially the calves, difficulty with breathing, severe, sudden headache,
      slurred speech, sudden, sudden loss of coordination, sudden, severe weakness
      or numbness in the arm or leg, or vision changes. These may be symptoms of thromboembolism.
  - type: paragraph
    text: Be careful when using a regular toothbrush, dental floss, or toothpick.
      Your medical doctor, dentist, or nurse may recommend other ways to clean your
      teeth and gums. Check with your medical doctor before having any dental work
      done.
  - type: paragraph
    text: Be careful not to cut yourself when you are using sharp objects, such as
      a safety razor or fingernail or toenail cutters. Avoid contact sports or other
      situations where bruising or injury could occur.
  - type: paragraph
    text: This medicine contains benzyl alcohol which may cause serious unwanted effects
      to newborn or premature infants. Talk to your doctor if you have concerns about
      this.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery or medical tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bruise
      - deep, dark purple bruise, pain, or swelling at the injection site
      - nosebleed
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding of the gums
      - constipation
      - coughing up blood
      - difficulty with breathing or swallowing
      - dizziness
      - headache
      - increased menstrual flow or vaginal bleeding
      - paralysis
      - prolonged bleeding from cuts
      - red or black, tarry stools
      - red or dark brown urine
      - severe stomach pain
      - unexplained pain, swelling, or discomfort, especially in the chest, abdomen
        or stomach, joints, or muscles
      - unusual bleeding or bruising
      - vomiting of blood or material that looks like coffee grounds
      - weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - bleeding from mucous membranes
      - bluish or black discoloration, flushing, or redness of the skin
      - burning, pricking, tickling, or tingling sensation
      - cough
      - feeling faint
      - fever
      - leg weakness
      - numbness
      - problems with bowel or bladder function
      - skin rash (which may consist of pinpoint, purple-red spots), hives, or itching
      - sloughing of the skin at the injection site
      - swelling of the eyelids, face, or lips
      - tightness in the chest
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blue-green to black skin discoloration
      - decrease in height
      - pain in the ribs, arms, or legs
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hair loss or thinning of hair
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
