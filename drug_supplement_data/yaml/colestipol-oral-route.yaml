title: Colestipol (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Colestid
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Colestipol is used to lower high cholesterol levels in the blood. This may
      help prevent medical problems caused by cholesterol clogging the blood vessels.
  - type: paragraph
    text: Colestipol works by attaching to certain substances in the intestine. Since
      colestipol is not absorbed into the body, these substances also pass out of
      the body without being absorbed.
  - type: paragraph
    text: Colestipol may also be used for other conditions as determined by your doctor.
  - type: paragraph
    text: Colestipol is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Suspension
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: There is no specific information comparing use of colestipol in children
        with use in other age groups. However, use is not recommended in children
        under 2 years of age since cholesterol is needed for normal development.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Side effects may be more likely to occur in patients over 60 years of
        age, who are usually more sensitive to the effects of colestipol.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Bezafibrate
      - Chenodiol
      - Deferasirox
      - Digoxin
      - Elafibranor
      - Ezetimibe
      - Fenofibrate
      - Fenofibric Acid
      - Mycophenolate Mofetil
      - Mycophenolic Acid
      - Seladelpar
      - Taurursodiol
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aceclofenac
      - Diclofenac
      - Diltiazem
      - Furosemide
      - Hydrocortisone
      - Tetracycline
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Constipation or
      - Gallstones or
      - Heart or blood vessel disease or
      - Hemorrhoids or
      - Stomach ulcer or other stomach problems or
      - Underactive thyroid—Colestipol may make these conditions worse
    - type: list
      ordered: false
      items:
      - Kidney disease—There is an increased risk of developing electrolyte problems
    - type: list
      ordered: false
      items:
      - Liver disease—Cholesterol levels may be raised
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Before prescribing medicine for your condition, your doctor will probably
      try to control your condition by prescribing a personal diet for you. Such a
      diet may be low in fats, sugars, and/or cholesterol. Many people are able to
      control their condition by carefully following their doctor's orders for proper
      diet and exercise. Medicine is prescribed only when additional help is needed
      and is effective only when a schedule of diet and exercise is properly followed.
  - type: paragraph
    text: Also, this medicine is less effective if you are greatly overweight. It
      may be very important for you to go on a reducing diet. However, check with
      your doctor before going on any diet.
  - type: paragraph
    text: Make certain your health care professional knows if you are on a low-sodium,
      low-sugar, or any other special diet.
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Try not to miss
      any doses and do not take more medicine than your doctor ordered.
  - type: paragraph
    text: Follow carefully the special diet your doctor gave you. This is the most
      important part of controlling your condition and is necessary if the medicine
      is to work properly.
  - type: paragraph
    text: 'This medicine should never be taken in its dry form, since it could cause
      you to choke. Instead, always mix as follows:'
  - type: list
    ordered: false
    items:
    - Add this medicine to 3 ounces or more of water, milk, flavored drink, or your
      favorite juice or carbonated drink. If you use a carbonated drink, slowly mix
      in the powder in a large glass to prevent too much foaming. Stir until it is
      completely mixed (it will not dissolve) before drinking. After drinking all
      the liquid containing the medicine, rinse the glass with a little more liquid
      and drink that also, to make sure you get all the medicine.
    - You may also mix this medicine with milk in hot or regular breakfast cereals,
      or in thin soups such as tomato or chicken noodle soup. Or you may add it to
      some pulpy fruits such as crushed pineapple, pears, peaches, or fruit cocktail.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (powder for oral suspension): For high cholesterol:
        Adults—15 to 30 grams a day. This is divided into two to four doses and taken
        before meals. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high cholesterol: Adults—15 to 30 grams a day. This is divided into two
        to four doses and taken before meals. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—15 to 30 grams a day. This is divided into two to four doses and taken
        before meals.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits.
      This will allow your doctor to see if the medicine is working properly to lower
      your cholesterol levels and to decide if you should continue to take it.
  - type: paragraph
    text: Do not stop taking this medicine without first checking with your doctor.
      When you stop taking this medicine, your blood cholesterol levels may increase
      again. Your doctor may want you to follow a special diet to help prevent this
      from happening.
  - type: paragraph
    text: Do not take any other medicine unless prescribed by your doctor since colestipol
      may interfere with other medicines.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - stomach pain (severe) with nausea and vomiting
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Loss of weight (sudden)
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - bloating
      - diarrhea
      - dizziness
      - headache
      - nausea or vomiting
      - stomach pain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
