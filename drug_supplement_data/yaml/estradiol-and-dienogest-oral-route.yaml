title: Estradiol and dienogest (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Natazia
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Estradiol valerate and dienogest combination is used to prevent pregnancy.
      It is a birth control pill that contains two types of hormones, estrogens and
      progestins and, when taken properly, prevents pregnancy. It works by stopping
      a woman's egg from fully developing each month. The egg can no longer accept
      a sperm and fertilization (pregnancy) is prevented.
  - type: paragraph
    text: Estradiol valerate and dienogest combination is also used to treat heavy
      menstrual bleeding that is not caused by any diagnosed conditions of the uterus
      (womb) in women who choose to use birth control pills.
  - type: paragraph
    text: No contraceptive method is 100 percent effective. Birth control methods
      such as having surgery to become sterile or not having sex are more effective.
      Discuss with your doctor your options for birth control.
  - type: paragraph
    text: Estradiol valerate and dienogest combination does not prevent HIV/AIDS or
      other sexually transmitted diseases. It will not help as emergency contraception,
      such as after unprotected sexual contact.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of estradiol
        valerate and dienogest combination have not been performed in the pediatric
        population. However, pediatric-specific problems that would limit the usefulness
        of this medication in teenagers are not expected. This medicine may be used
        for birth control in teenage females but is not indicated before the start
        of menstruation.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of estradiol
        valerate and dienogest combination have not been performed in the geriatric
        population. This medicine is not indicated for use in elderly women.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Fezolinetant
      - Tranexamic Acid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Amifampridine
      - Amoxicillin
      - Ampicillin
      - Amprenavir
      - Apalutamide
      - Aprepitant
      - Armodafinil
      - Artemether
      - Avacopan
      - Bacampicillin
      - Belzutifan
      - Betamethasone
      - Bexarotene
      - Bosentan
      - Bupropion
      - Carbamazepine
      - Carbenicillin
      - Cefaclor
      - Cefadroxil
      - Cefdinir
      - Cefditoren
      - Cefixime
      - Cefpodoxime
      - Cefprozil
      - Ceftazidime
      - Ceftibuten
      - Cefuroxime
      - Cenobamate
      - Ceritinib
      - Clarithromycin
      - Clobazam
      - Clomipramine
      - Cloxacillin
      - Colesevelam
      - Conivaptan
      - Cosyntropin
      - Cyclacillin
      - Cyclosporine
      - Dabrafenib
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Amitriptyline
      - Atazanavir
      - Diazepam
      - Doxepin
      - Ginseng
      - Imipramine
      - Lamotrigine
      - Levothyroxine
      - Licorice
      - Lorazepam
      - Selegiline
      - Tacrine
      - Temazepam
      - Tipranavir
      - Triazolam
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Abnormal or unusual vaginal bleeding or
      - Blood clots (eg, deep vein thrombosis, pulmonary embolism), or history of
        or
      - Breast cancer, active or a history of or
      - Diabetes with kidney, eye, or blood vessel damage or
      - Heart attack, history of or
      - Heart or blood vessel disease (eg, coronary artery disease, heart valve problems)
        or
      - Heart rhythm problems (atrial fibrillation) or
      - Hypertension (high blood pressure), uncontrolled or
      - Liver disease, including tumors or cancer or
      - Migraine headache, new or worse or a new kind of headache or
      - Problems with circulation or blood clots, now or in the past or
      - Stroke, history of—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Angioedema (swelling of the face, tongue, or throat), inherited or
      - Chloasma gravidarum (skin disorder during pregnancy), history of or
      - Depression, history of or
      - Diabetes or
      - Dyslipidemia (high cholesterol or fats in the blood) or
      - Gallbladder disease or
      - Hypertension (high blood pressure), controlled—Use with caution. May make
        these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine exactly as directed by your
      doctor . Do not use more of it, do not use it more often, and do not use it
      for a longer time than your doctor ordered.
  - type: paragraph
    text: To make using oral contraceptives as safe and reliable as possible, you
      should understand how and when to use them and what effects may be expected.
  - type: paragraph
    text: This medicine comes with patient instructions. Read and follow these instructions
      carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: This medicine is available in blister packs. Each blister pack contains
      28 tablets with different colors that need to be taken in the same order as
      directed on the blister pack.
  - type: paragraph
    text: When you begin using this medicine, your body will require at least 9 days
      to adjust before a pregnancy will be prevented. Use a second form of contraception
      (eg, condom, spermicide, or diaphragm) for the first 9 days of your first cycle
      of pills.
  - type: paragraph
    text: Take this medicine at the same time each day.
  - type: paragraph
    text: Do not skip or delay taking your pill by more than 12 hours . If you miss
      a dose, you could get pregnant. Ask your doctor for ways to help you remember
      to take your pills or about using another method of birth control.
  - type: paragraph
    text: You may have light bleeding or spotting when you first take the pill.
  - type: paragraph
    text: You may feel sick or nauseous, especially during the first few months that
      you take this medicine. If your nausea is continuous and does not go away, call
      your doctor.
  - type: paragraph
    text: If you vomit or have diarrhea within 3 to 4 hours of taking this medicine,
      follow the instructions in the patient leaflet or call your doctor.
  - type: paragraph
    text: If you are switching from a combination hormonal method (eg, another pill,
      patch, vaginal ring) to using Natazia® , take the first dark yellow pill on
      the first day of your period. If you do not start your period, see your doctor
      for a pregnancy test. If you have used a vaginal ring or patch, take the pill
      on the day the ring or patch is removed. You must also use a second method of
      birth control (eg, condom, diaphragm, spermicide) for the first 9 days you take
      this medicine.
  - type: paragraph
    text: If you are switching from a progestin-only method (eg, progestin-only pill,
      implant, injection, intrauterine system) to using Natazia® , take the first
      dark yellow pill on the day you would have taken your next progestin-only pill,
      or on the day your implant or IUD is removed, or on the day you would have your
      next injection. You must also use a second method of birth control (eg, condom,
      diaphragm, spermicide) for the first 9 days you take this medicine.
  - type: paragraph
    text: If you use this medicine after giving birth and choose not to breastfeed
      , you may start 4 weeks after childbirth to prevent the risk of having blood
      clots.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine. Grapefruit and grapefruit juice may change the amount of this medicine
      that is absorbed in the body.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: paragraph
      text: Your doctor may ask you to begin your dose on the first day of your menstrual
        period (called Day 1). When you begin on a certain day it is important that
        you follow that schedule, even if you miss a dose. Do not change your schedule
        on your own. If the schedule that you use is not convenient, check with your
        doctor about changing it.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For contraception (to prevent pregnancy)
        and to treat heavy menstrual bleeding: Adults and teenagers—One tablet taken
        at the same time each day for 28 days. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For contraception (to prevent pregnancy) and to treat heavy menstrual bleeding:
        Adults and teenagers—One tablet taken at the same time each day for 28 days.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—One tablet taken at the same time each day for 28 days.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    - type: paragraph
      text: If you vomit or have diarrhea within 3 to 4 hours of taking this medicine,
        treat this as a missed dose and follow the patient instructions or call your
        doctor.
    - type: list
      ordered: false
      items:
      - 'If you miss one pill for less than 12 hours: Take the tablet as soon as possible
        and take the next tablet at your regular schedule. You do not need to use
        another form of birth control.'
      - 'If you miss one pill for more than 12 hours: On Days 1-17: Take the tablet
        as soon as possible and take the next tablet at your regular schedule. You
        may have to take 2 tablets that day. Use a second form of birth control (eg,
        condom, spermicide) for the next 9 days. On Days 18-24: Throw out the rest
        of the pack and start a new pack that same day. Use a second form of birth
        control (eg, condom, spermicide) for the next 9 days. On Days 25-28: Take
        the tablet as soon as possible and take the next tablet at your regular schedule.
        You may have to take 2 tablets that day. You do not need to use another form
        of birth control.'
    - type: list
      ordered: false
      items:
      - 'On Days 1-17: Take the tablet as soon as possible and take the next tablet
        at your regular schedule. You may have to take 2 tablets that day. Use a second
        form of birth control (eg, condom, spermicide) for the next 9 days.'
      - 'On Days 18-24: Throw out the rest of the pack and start a new pack that same
        day. Use a second form of birth control (eg, condom, spermicide) for the next
        9 days.'
      - 'On Days 25-28: Take the tablet as soon as possible and take the next tablet
        at your regular schedule. You may have to take 2 tablets that day. You do
        not need to use another form of birth control.'
    - type: list
      ordered: false
      items:
      - 'If you miss two pills in a row: On Days 1-17: Do not take the missed pills.
        Take the pill for the day on which your first noticed you had missed pills.
        Use a second form of birth control (eg, condom, spermicide) for the next 9
        days. On Days 17-25: Throw out the rest of the pack and start a new pack (take
        Day 3) that same day. Use a second form of birth control (eg, condom, spermicide)
        for the next 9 days. On Days 25-28: Throw out the rest of the pack and start
        a new pack that same day. You do not need to use another form of birth control.'
    - type: list
      ordered: false
      items:
      - 'On Days 1-17: Do not take the missed pills. Take the pill for the day on
        which your first noticed you had missed pills. Use a second form of birth
        control (eg, condom, spermicide) for the next 9 days.'
      - 'On Days 17-25: Throw out the rest of the pack and start a new pack (take
        Day 3) that same day. Use a second form of birth control (eg, condom, spermicide)
        for the next 9 days.'
      - 'On Days 25-28: Throw out the rest of the pack and start a new pack that same
        day. You do not need to use another form of birth control.'
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may also
      be needed to check for unwanted effects. These visits will usually be every
      6 to 12 months, but some doctors require them more often.
  - type: paragraph
    text: Although you are using this medicine to prevent pregnancy, you should know
      that using this medicine while you are pregnant could harm the unborn baby.
      If you think you have become pregnant while using the medicine, tell your doctor
      right away.
  - type: paragraph
    text: Vaginal bleeding of various amounts may occur between your regular menstrual
      periods during the first 3 months of use. This is sometimes called spotting
      when slight, or breakthrough bleeding when heavier.
  - type: list
    ordered: false
    items:
    - If this should occur, continue with your regular dosing schedule.
    - The bleeding usually stops within 1 week. Check with your doctor if the bleeding
      continues for more than 1 week.
    - If bleeding continues after you have been taking hormonal contraceptives on
      schedule and for more than 3 months, check with your doctor.
  - type: paragraph
    text: Missed periods may occur if you skip one or more tablets and have not taken
      your pills exactly as directed. If you miss two periods in a row, talk to your
      doctor. You might need a pregnancy test.
  - type: paragraph
    text: Do not use this medicine if you smoke cigarettes or if you are over 35 years
      old. If you smoke while using birth control pills, you increase your risk of
      having a heart attack, stroke, or blood clot. Your risk is even higher if you
      are over age 35, if you have diabetes, high blood pressure, high cholesterol,
      or if you are overweight. Talk with your doctor about ways to stop smoking.
      Keep your diabetes under control. Ask your doctor about diet and exercise to
      control your weight and blood cholesterol level.
  - type: paragraph
    text: Using this medicine may increase your risk of having heart attack, stroke,
      or blood clots. Check with your doctor right away if you have pain in the chest,
      groin, or legs, especially the calves, difficulty with breathing, a sudden,
      severe headache, slurred speech, a sudden loss of coordination, or vision changes
      while using this medicine.
  - type: paragraph
    text: Check with your doctor immediately if you have problems wearing contact
      lenses or if blurred vision, difficulty reading, or any other change in vision
      occurs during or after treatment . Your eyes need to be checked by an ophthalmologist
      (eye doctor).
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: This medicine may not work as well in women who are overweight. If you gain
      a lot of weight after you start taking this medicine, ask your doctor if you
      should change to another type of birth control pill.
  - type: paragraph
    text: Check with your doctor before refilling an old prescription, especially
      after a pregnancy. You will need another physical examination and your doctor
      may change your prescription.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery or certain medical tests.
  - type: paragraph
    text: This medicine may make your skin more sensitive to sunlight. Use sunscreen
      when you are outdoors. Avoid sunlamps and tanning beds.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Breast pain, discomfort, or tenderness
      - headache, severe and throbbing
      - irregular menstrual periods
      - nausea
      - normal menstrual bleeding occurring earlier, possibly lasting longer than
        expected
      - vomiting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - clay-colored stools
      - dark urine
      - difficulty with breathing
      - dizziness
      - fever
      - headache
      - itching
      - loss of appetite
      - pain in the chest, groin, or legs, especially the calves
      - rash
      - slurred speech
      - stomach pain
      - sudden loss of coordination
      - sudden, severe weakness or numbness in the arm or leg
      - sudden, unexplained shortness of breath
      - unpleasant breath odor
      - unusual tiredness or weakness
      - vision changes
      - vomiting of blood
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blood in the stool
      - chest pain, discomfort, tightness
      - decrease in the amount of urine
      - fainting
      - hives
      - irritation
      - itching of the vagina or genitals
      - joint pain, stiffness, or swelling
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - pain in the ankles or knees
      - pain or discomfort in the arms, jaw, back, or neck
      - pain, redness, or swelling in the arm or leg
      - painful, red lumps under the skin, mostly on the legs
      - pelvic pain
      - pounding in the ears
      - redness of the skin
      - slow or fast heartbeat
      - stomach or pelvic discomfort, aching, or heaviness
      - sweating
      - swelling of the eyelids, face, lips, hands, lower legs, or feet
      - thick, white vaginal discharge with mild or no odor
      - trouble breathing or swallowing
      - upper right abdominal or stomach pain
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blemishes on the skin
      - increased weight
      - pimples
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
