title: Calcium chloride/dextrose/hetastarch/magnesium chloride/potassium chloride/sodium
  chloride/sodium lactate (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Hextend
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Hextend® injection is used to treat low blood volume (hypovolemia) when
      other treatment is not available.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of Hextend®
        injection have not been performed in the pediatric population. Safety and
        efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Hextend® injection in the elderly.
        However, elderly patients are more sensitive to the effects of this medicine
        than younger adults and are more likely to have age-related kidney problems,
        which may require caution and an adjustment in the dose for patients receiving
        this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content: []
    subsections: []
  - heading: Substance Name
    level: 3
    content: []
    subsections: []
  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Substance Name
    level: 3
    content: []
    subsections: []
  - heading: Substance Name
    level: 3
    content: []
    subsections: []
  - heading: Substance Name
    level: 3
    content: []
    subsections: []
  - heading: Substance Name
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Eplerenone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alacepril
      - Amiloride
      - Baloxavir Marboxil
      - Benazepril
      - Bictegravir
      - Canrenoate
      - Captopril
      - Cilazapril
      - Delapril
      - Digoxin
      - Erdafitinib
      - Fosinopril
      - Imidapril
      - Indomethacin
      - Lisinopril
      - Moexipril
      - Pentopril
      - Perindopril
      - Quinapril
      - Raltegravir
      - Ramipril
      - Sparsentan
      - Spirapril
      - Spironolactone
      - Temocapril
      - Trandolapril
      - Triamterene
      - Vadadustat
      - Zofenopril
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Chlorothiazide
      - Delafloxacin
      - Felodipine
      - Isradipine
      - Licorice
      - Nicardipine
      - Strontium Ranelate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alkalosis (high pH levels in the blood) or
      - Allergy to corn or
      - Diabetes or
      - Heart or blood vessel disease or
      - Hyperkalemia (high potassium levels in the blood) or
      - Kidney disease, severe—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Heart bypass—May increase the risk for bleeding in patients undergoing this
        surgery.
    - type: list
      ordered: false
      items:
      - Infection (eg, sepsis), severe or
      - Surgery or
      - Trauma—Use with caution. May increase the risk for serious kidney problems.
    - type: list
      ordered: false
      items:
      - Leukapheresis—Use in not recommended in patients undergoing this procedure.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Use with caution. May increase the risk for serious
        side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a medical facility. It is given as a needle placed into one of your veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress closely while
      receiving the medicine to make sure it is working properly. Blood and urine
      tests are needed to check for unwanted effects.
  - type: paragraph
    text: Call your doctor right away if you have bloody or cloudy urine, difficult
      or painful urination, sudden increase or decrease in the amount of urine, or
      swelling of the face, feet, or lower legs. These may be symptoms of a serious
      kidney problem.
  - type: paragraph
    text: This medicine may cause a serious allergic reaction, called anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing
      or swallowing, or any swelling of your hands, face, or mouth after receiving
      this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have black, tarry stools, blood
      in the urine or stools, headache, dizziness, or weakness, pain, swelling, or
      discomfort in a joint, pinpoint red spots on your skin, unusual nosebleeds,
      or any unusual bleeding or bruising.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody or cloudy urine
      - blue lips and fingernails
      - blurred vision
      - chest pain, discomfort, or tightness
      - confusion
      - cough
      - coughing that sometime produces a pink frothy sputum
      - decreased urine output
      - difficulty swallowing
      - dilated neck veins
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - drowsiness
      - fainting
      - fast, slow, or irregular heartbeat or pulse
      - fever
      - hives, itching, skin rash
      - increased sweating
      - large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
        feet, or sex organs
      - muscle tremors
      - nausea
      - noisy breathing
      - no blood pressure or pulse
      - pale skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid shallow breathing
      - restlessness
      - sneezing
      - stomach cramps
      - stopping of the heart
      - sudden increase or decrease in the amount of urine
      - sweating
      - swelling around the eyes
      - swelling in the legs and ankles
      - swelling of the face, fingers, feet, or lower legs
      - unconsciousness
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - weight gain
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - diarrhea
      - general feeling of discomfort or illness
      - headache
      - joint pain
      - muscle aches and pains
      - runny nose
      - shivering
      - sore throat
      - tingling of the feet
      - trouble sleeping
      - unusual weight gain or loss
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
