title: Teriflunomide (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Aubagio
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Teriflunomide is used to treat the relapsing forms of multiple sclerosis
      (MS), including clinically isolated syndrome, relapsing-remitting disease, and
      active secondary progressive disease. This medicine will not cure MS, but it
      may slow some disabling effects and decrease the number of relapses of the disease.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of teriflunomide in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of teriflunomide in patients over the age of 65 years. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Leflunomide
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acyclovir
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Alpelisib
      - Amiodarone
      - Apalutamide
      - Asciminib
      - Atorvastatin
      - Aztreonam
      - Baricitinib
      - Bosentan
      - Cefaclor
      - Ciprofloxacin
      - Dabrafenib
      - Danicopan
      - Daprodustat
      - Dasabuvir
      - Dengue Tetravalent Vaccine, Live
      - Elagolix
      - Eltrombopag
      - Enzalutamide
      - Finerenone
      - Furosemide
      - Glyburide
      - Grazoprevir
      - Haloperidol
      - Influenza Virus Vaccine, Live
      - Irinotecan
      - Itraconazole
      - Leniolisib
      - Letermovir
      - Measles Virus Vaccine, Live
      - Methotrexate
      - Methylergonovine
      - Mifepristone
      - Momelotinib
      - Montelukast
      - Mumps Virus Vaccine, Live
      - Nifedipine
      - Olanzapine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Ethinyl Estradiol
      - Levonorgestrel
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bone marrow problems or
      - Carpal tunnel syndrome or
      - Hyperkalemia (high potassium in the blood) or
      - Hypertension (high blood pressure) or
      - Liver disease or
      - Lung disease (eg, acute interstitial pneumonitis, interstitial lung disease)
        or
      - Peripheral neuropathy (nerve problem) or
      - Tuberculosis, history of or
      - Weak immune system—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Diabetes—May increase risk of having nerve problems.
    - type: list
      ordered: false
      items:
      - Infection, active—Should be treated first before starting this medicine.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Liver disease, severe—Should not be used in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not suddenly
      stop using it, do not use more of it, do not use it more often, and do not use
      it for a longer time than your doctor ordered. To do so may increase the chance
      of side effects.
  - type: paragraph
    text: This medicine should come with a Medication Guide. It is very important
      that you read and understand this information. Be sure to ask your doctor about
      anything you do not understand.
  - type: paragraph
    text: You may take this with or without food.
  - type: paragraph
    text: Teriflunomide may stay in your blood for up to 2 years after your treatment.
      Your doctor may want you to use activated charcoal or cholestyramine (Questran®)
      to help remove this medicine from the body much faster if necessary. Talk to
      your doctor if you have questions about this.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For multiple sclerosis: Adults—7 or 14 milligrams
        (mg) once a day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For multiple sclerosis: Adults—7 or 14 milligrams (mg) once a day. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—7 or 14 milligrams (mg) once a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Women
      will receive a pregnancy test before starting this medicine. Use an effective
      form of birth control to keep from getting pregnant during treatment and after
      2 years of stopping treatment with this medicine. If you think you have become
      pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: Teriflunomide may also cause birth defects if the father is using it when
      his sexual partner becomes pregnant. Men taking teriflunomide should use condoms
      as a form of birth control during sexual intercourse. A man intending to father
      a child should stop taking this medicine and check with his doctor right away.
  - type: paragraph
    text: Do not use this medicine together with leflunomide (Arava®) . Using these
      medicines together may cause serious unwanted effects.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: 'Teriflunomide can temporarily lower the number of white blood cells in
      your blood, increasing the chance of getting an infection. It can also lower
      the number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: You will need to have a skin test for tuberculosis before you start using
      this medicine. Tell your doctor if you or anyone in your home has ever had a
      positive reaction to a tuberculosis test.
  - type: paragraph
    text: While you are being treated with teriflunomide, for at least 6 months you
      stop using it, do not have any immunizations (vaccinations) without your doctor's
      approval . Live virus vaccines should not be given while receiving this medicine.
  - type: paragraph
    text: Using this medicine may increase your risk of getting cancers, including
      blood cancer. Talk to your doctor if you have concerns about this risk.
  - type: paragraph
    text: Check with your doctor right away if you are having burning, numbness, tingling,
      or painful sensations in the arms, hands, legs, or feet. These could be symptoms
      of a condition called peripheral neuropathy.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Check
      with your doctor right away if you have blistering, peeling, or loosening of
      the skin, red skin lesions, severe acne or skin rash, sores or ulcers on the
      skin, trouble breathing, trouble swallowing, fever or chills.
  - type: paragraph
    text: This medicine may cause serious skin reactions (eg, Stevens-Johnson syndrome,
      toxic epidermal necrolysis). Check with your doctor right away if you have a
      black, tarry stools, blistering, peeling or loosening of the skin, chest pain,
      chills, cough, diarrhea, fever, itching, joint or muscle pain, red irritated
      eyes, red skin lesions, often with a purple center, painful or difficult urination,
      sore throat, sores, ulcers, or white spots in the mouth or on the lips, swollen
      glands, unusual bleeding or bruising, or unusual tiredness or weakness.
  - type: paragraph
    text: Tell your doctor right away if you or your child develop a fever, rash,
      swollen, painful, or tender lymph glands in the neck, armpit, or groin, unusual
      bleeding or bruising, or yellow eyes or skin after using this medicine. These
      may be symptoms of a serious and life-threatening condition called drug reaction
      with eosinophilia and systemic symptoms (DRESS).
  - type: paragraph
    text: Check with your doctor right away if you have a cough with or without a
      fever or trouble breathing while taking this medicine.
  - type: paragraph
    text: You will need to have your blood pressure measured before starting this
      medicine and while you are using it. If you notice any change to your recommended
      blood pressure, call your doctor right away. If you have questions about this,
      talk to your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chills
      - cough
      - cough producing mucus
      - diarrhea
      - difficulty breathing
      - ear congestion
      - fever
      - general feeling of discomfort or illness
      - headache
      - joint pain
      - loss of appetite
      - loss of voice
      - muscle aches and pains
      - nausea
      - runny or stuffy nose
      - shivering
      - sneezing
      - sore throat
      - sweating
      - tightness in the chest
      - trouble sleeping
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - black, tarry stools
      - bloody or cloudy urine
      - blurred vision
      - burning, numbness, pain, or tingling in all fingers except smallest finger
      - clay colored stools
      - coma
      - confusion
      - dark urine
      - decreased appetite
      - decreased urine output
      - depression
      - diarrhea
      - difficult, burning, or painful urination
      - dizziness
      - fast, irregular, pounding, or racing heartbeat or pulse
      - frequent urge to urinate
      - hostility
      - irritability
      - itching or skin rash
      - lethargy
      - loss of appetite
      - lower back or side pain
      - muscle twitching
      - pale skin
      - pounding in the ears
      - rapid weight gain
      - seizures
      - slow or fast heartbeat
      - stomach pain or tenderness
      - stupor
      - swelling of the feet or lower legs
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - weakness or heaviness of the legs
      - yellow eyes or skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - joint pain
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - sores, ulcers, or white spots in the mouth or on the lips
      - swollen glands
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hair loss or thinning of the hair
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blemishes on the skin
      - bone pain
      - burning, dry, or itching eyes
      - difficulty with moving
      - discharge or excessive tearing
      - full or bloated feeling
      - muscle cramping or stiffness
      - pain in the lower back, bottom, or hips
      - pain in the upper leg
      - pimples
      - pressure in the stomach
      - redness, pain, or swelling of the eye, eyelid, or inner lining of the eyelid
      - swelling of the stomach area
      - swollen joints
      - toothache
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
