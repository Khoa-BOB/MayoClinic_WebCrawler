title: Aminolevulinic acid (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Gleolan
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Aminolevulinic acid is used to help your doctor see an image of a malignant
      (cancer) tissue during surgery in patients with glioma (tumor in the brain or
      spine). It is an optical imaging agent.
  - type: paragraph
    text: This medicine is to be given only by or under the supervision of a doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a diagnostic test, any risks of the test must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      Also, other things may affect test results. For this test, the following should
      be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of aminolevulinic acid in children. Safety and efficacy have
        not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of aminolevulinic acid in the elderly.
        However, some elderly patients are more sensitive to the effects of this medicine
        than younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this diagnostic test,
        it is especially important that your healthcare professional know if you are
        taking any of the medicines listed below. The following interactions have
        been selected on the basis of their potential significance and are not necessarily
        all-inclusive.
    - type: paragraph
      text: Receiving this diagnostic test with any of the following medicines is
        not recommended. Your doctor may decide not to use this diagnostic test or
        change some of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Receiving this diagnostic test with any of the following medicines is
        usually not recommended, but may be required in some cases. If both medicines
        are prescribed together, your doctor may change the dose or how often you
        use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Rotavirus Vaccine, Live
    - type: paragraph
      text: Receiving this diagnostic test with any of the following medicines may
        cause an increased risk of certain side effects, but using both drugs may
        be the best treatment for you. If both medicines are prescribed together,
        your doctor may change the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acetazolamide
      - Acetohexamide
      - Balofloxacin
      - Bendroflumethiazide
      - Benzthiazide
      - Besifloxacin
      - Chlorothiazide
      - Chlorpromazine
      - Chlorpropamide
      - Chlortetracycline
      - Chlorthalidone
      - Cinoxacin
      - Ciprofloxacin
      - Clopamide
      - Demeclocycline
      - Diazoxide
      - Dixyrazine
      - Doxycycline
      - Enoxacin
      - Flumequine
      - Fluphenazine
      - Gatifloxacin
      - Gemifloxacin
      - Gliclazide
      - Glimepiride
      - Glipizide
      - Gliquidone
      - Glyburide
      - Griseofulvin
      - Hydrochlorothiazide
      - Hydroflumethiazide
      - Indapamide
      - Levofloxacin
      - Lomefloxacin
      - Lymecycline
      - Mafenide
      - Meclocycline
      - Methacycline
      - Methdilazine
      - Methotrimeprazine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this diagnostic
        test. Make sure you tell your doctor if you have any other medical problems,
        especially:'
    - type: list
      ordered: false
      items:
      - Allergy to porphyrins or
      - Porphyria, acute or chronic—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine
      in a hospital. It is given by mouth before surgery.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress closely while
      you are receiving this medicine. This will allow your doctor to see if the medicine
      is working properly and to decide if you should continue to receive it.
  - type: paragraph
    text: This medicine may cause photosensitivity (increased sensitivity to sunlight).
      Avoid exposure to sunlight or room lights for 48 hours after surgery.
  - type: paragraph
    text: If you are using medicine that can cause photosensitivity (eg, griseofulvin,
      St. John’s wort, diuretic, phenothiazine, quinolone, sulfa drug, sulfonylurea,
      tetracycline, or topical preparations containing aminolevulinic acid), do not
      take it 24 hours before and after receiving aminolevulinic acid.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis.
      This can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth after you
      receive this medicine.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. This medicine may affect the results of certain medical tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blindness over half the field of vision
      - blurred vision
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - inability to move the legs or arms
      - paralysis of one side of the body
      - partial or slight paralysis
      - problems with movement, walking, or speech
      - seizure
      - sweating
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, crusting, irritation, itching, or reddening of the skin
      - cracked, dry, scaly skin
      - headache
      - increased sensitivity of the skin to sunlight
      - redness or other discoloration of the skin
      - severe sunburn
      - skin rash
      - swelling
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - difficulty swallowing
      - dizziness
      - drowsiness
      - fast heartbeat
      - hives or welts
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - muscle tremors
      - puffiness or swelling of the eyelids or around the eyes, face, lips or tongue
      - rapid, deep breathing
      - restlessness
      - shakiness and unsteady walk
      - stomach cramps
      - tightness in the chest
      - unsteadiness, trembling, or other problems with muscle control or coordination
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blue lips, fingernails, or skin
      - difficult or troubled breathing
      - irregular, fast, slow, or shallow breathing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever
      - nausea
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - diarrhea
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
