title: Calcipotriene (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Calcitrene
    - type: paragraph
      text: Dovonex
    - type: paragraph
      text: Sorilux
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Calcipotriene is used to treat plaque psoriasis of the skin and scalp, which
      is a skin disease with red patches and white scales that do not go away. Calcipotriene
      is a form of vitamin D that works by changing how the skin cells are made in
      the areas affected by psoriasis.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Cream
    - Solution
    - Ointment
    - Foam
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Sorilux® in children 4 years of
        age and older. However, safety and efficacy have not been established in children
        younger than 4 years of age.
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Dovonex® in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of calcipotriene topical in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Erythrodermic, exfoliative, or pustular psoriasis—Use has not been studied
        in patients with these conditions.
    - type: list
      ordered: false
      items:
      - High vitamin D in the body or
      - Hypercalcemia (high calcium in the blood)—Should not be used in patients with
        these conditions.
    - type: list
      ordered: false
      items:
      - Skin irritation in areas with psoriasis—Use with caution. May make this condition
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use it for a longer time than your doctor
      ordered. To do so may cause unwanted side effects or skin irritation.
  - type: paragraph
    text: This medicine should only be used on the skin . Do not get it into your
      eyes, nose, mouth, or vagina. Do not use it on skin areas that have cuts, scrapes,
      or burns. If it does get on these areas, rinse it off right away with water.
  - type: paragraph
    text: 'To use the cream or ointment :'
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and water before and after using this medicine. If
      the skin on your hands is being treated with the medicine, only wash the skin
      that is not affected.
    - Apply a thin layer to the affected area of the skin. Rub it in gently until
      it disappears into the skin.
    - Do not get any medicine onto your face or into your eyes.
  - type: paragraph
    text: 'To use the scalp solution :'
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and water before and after using this medicine.
    - Before using the medicine, comb your dry hair to remove any skin flakes. Part
      your hair so you can see the scalp lesions.
    - Apply the solution only to the scalp lesions. Rub it in gently until it disappears
      into the scalp.
    - Do not get any medicine on your forehead or into your eyes.
    - Do not use this medicine near heat, an open flame, or while smoking.
  - type: paragraph
    text: 'To use the foam :'
  - type: list
    ordered: false
    items:
    - This medicine comes with a patient information insert and patient instructions.
      Read and follow the instructions carefully.
    - Wash your hands with soap and water before and after using this medicine. If
      the skin on your hands is being treated with the medicine, only wash the skin
      that is not affected.
    - Break the tiny plastic piece on the nozzle of the foam can.
    - Shake the can before each use.
    - Turn the can upside down and place a small amount into the palm of your hand.
    - Apply a thin layer to the affected areas of the skin and scalp. Rub it in gently
      until it disappears into the skin. If using on the scalp, apply it when your
      hair is dry.
    - Do not use the medicine into or near your eyes, mouth, or vagina. If the foam
      does get in your eyes, wash them right away with water.
    - Do not use this medicine near heat, an open flame, or while smoking.
  - type: paragraph
    text: To help clear up your skin problem completely, it is very important that
      you keep using calcipotriene for the full time of treatment . Do not miss any
      doses.
  - type: paragraph
    text: This medicine should only be used for skin conditions that your doctor is
      treating. Check with your doctor before using it for other skin conditions,
      especially if you think that a skin infection may be present . This medicine
      should not be used to treat certain kinds of skin infections or conditions,
      such as severe burns.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For plaque psoriasis: For topical dosage forms (cream and scalp solution):
        Adults—Apply to the affected area of the skin or scalp 2 times a day. Children—Use
        and dose must be determined by your doctor. For topical dosage form (foam):
        Adults and children 4 years of age and older—Apply to the affected area of
        the skin or scalp 2 times a day. Children younger than 4 years of age—Use
        and dose must be determined by your doctor. For topical dosage form (ointment):
        Adults—Apply to the affected area of the skin or scalp 1 or 2 times a day.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For topical dosage forms (cream and scalp solution): Adults—Apply to the
        affected area of the skin or scalp 2 times a day. Children—Use and dose must
        be determined by your doctor.'
      - 'For topical dosage form (foam): Adults and children 4 years of age and older—Apply
        to the affected area of the skin or scalp 2 times a day. Children younger
        than 4 years of age—Use and dose must be determined by your doctor.'
      - 'For topical dosage form (ointment): Adults—Apply to the affected area of
        the skin or scalp 1 or 2 times a day. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply to the affected area of the skin or scalp 2 times a day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults and children 4 years of age and older—Apply to the affected area of
        the skin or scalp 2 times a day.
      - Children younger than 4 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - Adults—Apply to the affected area of the skin or scalp 1 or 2 times a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: The scalp solution and foam are flammable. Keep them away from open flame
        or heat. Do not smoke when you are applying the medicine. Do not poke holes
        in the foam canister or throw it into a fire, even if the canister is empty.
        Do not keep the foam inside a car where it could be exposed to extreme heat.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure this medicine is working properly. Blood tests
      may be needed to check for any unwanted effects.
  - type: paragraph
    text: Check with your doctor right away if you have a skin rash, burning, stinging,
      redness, swelling, or irritation on the skin.
  - type: paragraph
    text: If your psoriasis does not improve within a few weeks or becomes worse,
      check with your doctor.
  - type: paragraph
    text: This medicine may temporarily increase the calcium levels in your blood
      (hypercalcemia). Check with your doctor right away if you have stomach pain,
      confusion, depression, dry mouth, headache, incoherent speech, increased urination,
      loss of appetite, metallic taste, muscle weakness, unusual tiredness, nausea,
      vomiting, or weight loss.
  - type: paragraph
    text: Calcipotriene may make your skin more sensitive to sunlight. Use sunscreen
      and wear protective clothing, including a hat, when you are outdoors. Avoid
      sunlamps and tanning beds.
  - type: paragraph
    text: Do not use cosmetics or other skin care products on the treated areas unless
      directed to do so by your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin redness, swelling, or itching
      - skin rash
      - worsening of psoriasis
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - constipation
      - darkening of the skin
      - depression
      - dry mouth
      - headache
      - high urine levels of calcium
      - incoherent speech
      - increased urination
      - lightening of normal skin color
      - lightening of treated areas of the dark skin
      - loss of appetite
      - metallic taste
      - muscle weakness
      - nausea
      - stomach pain
      - thirst
      - unusual tiredness
      - vomiting
      - weight loss
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - constipation
      - discouragement
      - dry mouth
      - feeling sad or empty
      - headache
      - incoherent speech
      - increased urination
      - irritability
      - lack of appetite
      - loss of interest or pleasure
      - metallic taste
      - muscle weakness
      - nausea
      - stomach pain
      - thirst
      - tiredness
      - trouble concentrating
      - trouble sleeping
      - unusual tiredness
      - vomiting
      - weight loss
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, dryness, irritation, peeling, or redness of the skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain at the application site
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Darker color in the treated areas of the skin
      - pus in the hair follicles
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
