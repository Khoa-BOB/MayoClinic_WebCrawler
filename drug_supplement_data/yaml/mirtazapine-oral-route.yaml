title: Mirtazapine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Remeron
    - type: paragraph
      text: Remeron Soltab
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Remeron RD
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Mirtazapine is used to treat depression. Mirtazapine belongs to a group
      of medicines called tetracyclic antidepressants. These medicines work in the
      central nervous system (CNS) to make certain chemicals in the brain stronger.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet, Disintegrating
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of mirtazapine in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of mirtazapine in the elderly. However,
        elderly patients are more likely to have confusion or unusual drowsiness and
        age-related liver, kidney, or heart problems, which may require caution and
        an adjustment in the dose for patients receiving mirtazapine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Bromopride
      - Cisapride
      - Dronedarone
      - Fluconazole
      - Isocarboxazid
      - Ketoconazole
      - Levoketoconazole
      - Linezolid
      - Methylene Blue
      - Ozanimod
      - Phenelzine
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Procarbazine
      - Rasagiline
      - Safinamide
      - Saquinavir
      - Selegiline
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Tranylcypromine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adagrasib
      - Alfentanil
      - Alfuzosin
      - Almotriptan
      - Alprazolam
      - Amineptine
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amitriptylinoxide
      - Amoxapine
      - Amphetamine
      - Anagrelide
      - Anileridine
      - Apalutamide
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Asenapine
      - Astemizole
      - Atazanavir
      - Azithromycin
      - Bedaquiline
      - Bentazepam
      - Benzhydrocodone
      - Benzphetamine
      - Boceprevir
      - Bromazepam
      - Brompheniramine
      - Buprenorphine
      - Bupropion
      - Buserelin
      - Buspirone
      - Butorphanol
      - Carbamazepine
      - Ceritinib
      - Chlordiazepoxide
      - Chloroquine
      - Chlorpheniramine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (severe chest pain), history of or
      - Blood vessel disease or circulation problems or
      - Dehydration or
      - Heart attack, history of or
      - Heart disease or
      - Hypotension (low blood pressure) or
      - Hypovolemia (low blood volume) or
      - Stroke, history of—May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Bipolar disorder (mood disorder with mania and depression) or
      - Glaucoma, angle-closure or
      - Heart rhythm problems (eg, QT prolongation) or
      - Hypercholesterolemia (high cholesterol in the blood) or
      - Hyponatremia (low sodium in the blood) or
      - Mania or hypomania, history of or
      - Seizures, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate or severe or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Phenylketonuria (a metabolic disorder)—The orally disintegrating tablet contains
        aspartame, which can make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor in order to improve
      your condition as much as possible. Do not take more of it, do not take it more
      often, and do not take it for a longer time than your doctor ordered.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: 'To use the orally disintegrating tablet :'
  - type: list
    ordered: false
    items:
    - Make sure your hands are dry before you handle the tablet.
    - Do not open the blister pack that contains the tablet until you are ready to
      take it.
    - Do not push the tablet through the foil backing of the package. Instead, gently
      peel back the foil backing and remove the tablet.
    - Immediately place the tablet on top of the tongue. Do not break or split the
      tablet.
    - The tablet will dissolve in seconds, and you may swallow it with your saliva.
      You do not need to drink water or other liquids to swallow the tablet.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (orally disintegrating tablets, tablets): For depression:
        Adults—At first, 15 milligrams (mg) once a day, preferably in the evening
        just before sleep. Your doctor may adjust your dose if needed. However, the
        dose is usually not more than 45 mg per day. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For depression: Adults—At first, 15 milligrams (mg) once a day, preferably
        in the evening just before sleep. Your doctor may adjust your dose if needed.
        However, the dose is usually not more than 45 mg per day. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 15 milligrams (mg) once a day, preferably in the evening
        just before sleep. Your doctor may adjust your dose if needed. However, the
        dose is usually not more than 45 mg per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the orally disintegrating tablet in the original package until you
        are ready to take it.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      , to allow changes in your dose and help reduce any side effects. Blood tests
      may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not take mirtazapine with a monoamine oxidase (MAO) inhibitor (eg, isocarboxazid
      [Marplan®], linezolid [Zyvox®], methylene blue injection, phenelzine [Nardil®],
      selegiline [Eldepryl®], tranylcypromine [Parnate®]). Do not start taking mirtazapine
      during the 2 weeks after you stop a MAO inhibitor and wait 2 weeks after stopping
      mirtazapine before you start taking a MAO inhibitor. If you take them together
      or do not wait 2 weeks, you may develop confusion, agitation, restlessness,
      stomach or intestinal symptoms, a sudden high body temperature, an extremely
      high blood pressure, or severe seizures.
  - type: paragraph
    text: Mirtazapine may cause a serious condition called serotonin syndrome if taken
      together with some medicines. Do not use mirtazapine with buspirone (Buspar®),
      fentanyl (Abstral®, Duragesic®), lithium (Eskalith®, Lithobid®), tryptophan,
      St. John's wort, or some pain or migraine medicines (eg, rizatriptan, sumatriptan,
      tramadol, Frova®, Imitrex®, Maxalt®, Relpax®, Ultram®, Zomig®). Check with your
      doctor first before taking any other medicines with mirtazapine . Check with
      your doctor right away if you are having agitation, difficulty in breathing,
      a fast heartbeat, hallucinations, a high fever, high or low blood pressure,
      increased sweating, loss of bladder control, seizures, severe muscle stiffness,
      unusually pale skin, or tiredness while you are taking this medicine.
  - type: paragraph
    text: Mirtazapine may cause some teenagers and young adults to be agitated, irritable,
      or display other abnormal behaviors. It may also cause some people to have suicidal
      thoughts and tendencies or to become more depressed. Some people may have trouble
      sleeping, get upset easily, have a big increase in energy, or start to act reckless.
      If you or your caregiver notice any of these unwanted effects, tell your doctor
      right away. Let the doctor know if you or anyone in your family has bipolar
      disorder (manic-depressive) or has tried to commit suicide..
  - type: paragraph
    text: This medicine may add to the effects of alcohol and other CNS depressants
      (medicines that make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for allergies or colds, sedatives, tranquilizers,
      or sleeping medicines, prescription pain medicine or narcotics, medicine for
      seizures or barbiturates, muscle relaxants, or anesthetics, including some dental
      anesthetics. Check with your doctor before taking any of the above while you
      are taking this medicine .
  - type: paragraph
    text: This medicine can temporarily lower the number of white blood cells in your
      blood, increasing your chance of getting an infection. If you can, avoid people
      with infections. Check with your doctor right away if you think you are getting
      an infection or if you have a fever or chills, sore throat, sores in the mouth,
      lower back or side pain, or painful or difficult urination.
  - type: paragraph
    text: Do not suddenly stop taking this medicine without first checking with your
      doctor . Your doctor may want you to gradually reduce the amount you are using
      before stopping completely. This may help prevent a possible worsening of your
      condition and reduce the possibility of withdrawal symptoms such as headache,
      nausea, or a general feeling of discomfort or illness.
  - type: paragraph
    text: This medicine may increase your weight. Your doctor may need to check your
      weight on a regular basis while you are using this medicine.
  - type: paragraph
    text: Mirtazapine may cause drowsiness, trouble with thinking, or trouble with
      controlling body movements. Make sure you know how you react to this medicine
      before you drive, use machines, or do anything else that requires you to be
      alert, well-coordinated, and able to think well .
  - type: paragraph
    text: This medicine may cause serious skin reaction, including drug reaction with
      eosinophilia and systemic symptoms (DRESS). Check with your doctor right away
      if you have black, tarry stools, chest pain, chills, cough, fever, painful or
      difficult urination, sore throat, sores, ulcers, or white spots on the lips
      or in the mouth. swollen glands, unusual bleeding or bruising, or unusual tiredness
      or weakness.
  - type: paragraph
    text: Hyponatremia (low sodium in the blood) may occur with this medicine. This
      is more common in elderly patients, those who are taking diuretic medicines
      for high blood pressure, or those who have decreased amounts of fluid in the
      body due to severe diarrhea or vomiting. Check with your doctor right away if
      you have confusion, difficulty concentrating, headaches, memory problems, weakness,
      and unsteadiness.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up suddenly from a lying or sitting position. Getting up slowly may help. If
      this problem continues or gets worse, check with your doctor.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased or increased movement
      - mood or mental changes, including abnormal thinking, agitation, anxiety, confusion,
        and feelings of not caring
      - skin rash
      - swelling
      - trouble breathing
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in menstrual cycle (periods)
      - chills
      - decreased sexual ability
      - fever
      - menstrual pain
      - mood or mental changes, including anger, feelings of being outside the body,
        mood swings, and unusual excitement
      - mouth sores
      - seeing, hearing, or feeling things that are not there
      - seizures
      - sore throat
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - blistering, peeling, loosening of skin
      - chest pain
      - fainting
      - hives, itching, skin rash
      - irregular or slow heart rate
      - joint or muscle pain
      - painful or difficult urination
      - red, irritated eyes
      - red skin lesions, often with a purple center
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swollen glands
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - dizziness
      - drowsiness
      - dry mouth
      - increased appetite
      - weight gain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal dreams
      - back pain
      - dizziness or fainting when getting up suddenly from a lying or sitting position
      - increased need to urinate
      - increased sensitivity to touch
      - increased thirst
      - low blood pressure
      - muscle pain
      - nausea
      - sense of constant movement of self or surroundings
      - stomach pain
      - trembling or shaking
      - vomiting
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Painful or prolonged erection of the penis
      - swelling of the breasts or unusual milk production
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
