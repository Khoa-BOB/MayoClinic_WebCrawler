title: Didanosine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Videx
    - type: paragraph
      text: Videx EC
    - type: paragraph
      text: Videx Pediatric
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Didanosine is used in combination with other medicines for the treatment
      of human immunodeficiency virus (HIV) infection. HIV is the virus that causes
      acquired immune deficiency syndrome (AIDS).
  - type: paragraph
    text: Didanosine will not cure or prevent HIV infection or AIDS. It helps keep
      HIV from reproducing and appears to slow down the destruction of the immune
      system. This may help delay the development of problems usually related to AIDS
      or HIV disease. Didanosine will not keep you from spreading HIV to other people.
      People who receive this medicine may continue to have the problems usually related
      to AIDS or HIV disease.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: The buffered tablets that are to be chewed, crushed or mixed with water
      are no longer available in the United States. This product was voluntarily discontinued,
      and it was not due to safety concerns. Didanosine delayed-release capsules (Videx®
      EC) and pediatric powder for oral solution are still available.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule, Delayed Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of didanosine in children 2 weeks
        of age and older.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of didanosine in the elderly. However,
        elderly patients are more likely to have age-related kidney problems, which
        may require caution and an adjustment in the dose for patients receiving didanosine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Allopurinol
      - Oxypurinol
      - Ribavirin
      - Stavudine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Atazanavir
      - Atidarsagene Autotemcel
      - Cabotegravir
      - Darunavir
      - Hydroxyurea
      - Methadone
      - Nelfinavir
      - Orlistat
      - Tacrolimus
      - Tenofovir Disoproxil Fumarate
      - Zalcitabine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atevirdine
      - Ciprofloxacin
      - Delavirdine
      - Enoxacin
      - Ganciclovir
      - Indinavir
      - Itraconazole
      - Ketoconazole
      - Lomefloxacin
      - Metoclopramide
      - Moxifloxacin
      - Nirmatrelvir
      - Norfloxacin
      - Ofloxacin
      - Ranitidine
      - Rifabutin
      - Ritonavir
      - Sulfamethoxazole
      - Trimethoprim
      - Trovafloxacin Mesylate
      - Valganciclovir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alcohol use, active or history of or
      - Liver disease (including hepatitis) or
      - Obesity (overweight) or
      - Pancreatitis (inflammation of the pancreas), history of or
      - Peripheral neuropathy (nerve disorder), history of—Use with caution. May cause
        side effects to become worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Portal hypertension (high blood pressure in the portal vein of the liver)—Use
        with caution. May make this condition worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. Also, do not stop taking this medicine without checking
      first with your doctor.
  - type: paragraph
    text: This medicine comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Keep taking didanosine for the full time of treatment , even if you begin
      to feel better. Only take medicine that your doctor has prescribed specifically
      for you. Do not share your medicine with other people.
  - type: paragraph
    text: This medicine works best when there is a constant amount in the blood. To
      help keep the amount constant, do not miss any doses. If you need help in planning
      the best times to take your medicine, check with your doctor.
  - type: paragraph
    text: Didanosine should be taken on an empty stomach since food may keep it from
      working properly. Didanosine oral liquid should be taken at least 30 minutes
      before or 2 hours after you eat.
  - type: paragraph
    text: Swallow the delayed-release capsule whole. Do not break, crush, chew, or
      open it.
  - type: paragraph
    text: Shake the oral liquid before use. Measure each dose with a specially marked
      measuring spoon or measuring cup. The average household teaspoon may not hold
      the right amount of liquid.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For HIV infection: For oral dosage form (delayed-release capsules): Adults
        and children who can swallow capsules—Dose is based on body weight and must
        be determined by your doctor. For patients weighing 60 kilograms (kg) or more—400
        milligrams (mg) once a day. For patients weighing 25 kg to less than 60 kg—250
        mg once a day. For patients weighing 20 kg to less than 25 kg—200 mg once
        a day. Children weighing less than 20 kg—The oral capsules are not given to
        small children. For oral dosage form (solution): Adults weighing 60 kilograms
        (kg) or more—Dose is based on body weight and must be determined by your doctor.
        The usual dose is 200 milligrams (mg) 2 times a day or 400 mg once a day.
        Adults weighing less than 60 kg—Dose is based on body weight and must be determined
        by your doctor. The usual dose is 125 mg 2 times a day or 250 mg once a day.
        Children older than 8 months of age—Dose is based on body size and must be
        determined by your doctor. The usual dose is 120 milligrams per square meter
        (mg/m(2)) 2 times a day. Infants 2 weeks to 8 months old—Dose is based on
        body size and must be determined by your doctor. The usual dose is 100 mg/m(2)
        2 times a day. Infants younger than 2 weeks old—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (delayed-release capsules): Adults and children who
        can swallow capsules—Dose is based on body weight and must be determined by
        your doctor. For patients weighing 60 kilograms (kg) or more—400 milligrams
