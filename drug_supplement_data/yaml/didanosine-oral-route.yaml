    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the delayed-release capsules in a closed container at room temperature,
        away from heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the oral liquid in the refrigerator. Throw away any unused medicine
        after 30 days.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      at regular visits to make sure that this medicine is working properly. Blood
      tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not use didanosine if you or your child are also using allopurinol (Zyloprim®),
      ribavirin (Copegus®, Rebetol®), or stavudine (Zerit®). Using these medicines
      together may cause serious side effects .
  - type: paragraph
    text: 'This medicine may cause a life-threatening condition called pancreatitis.
      Check with your doctor right away if you or your child have more than one of
      these symptoms: bloating, chills, constipation, darkened urine, a fast heartbeat,
      fever, indigestion, loss of appetite, nausea, pains in the stomach, side, or
      abdomen, possibly radiating to the back, vomiting, or yellow eyes or skin.'
  - type: paragraph
    text: 'Two rare but serious reactions to this medicine are lactic acidosis (too
      much acid in the blood) and liver toxicity, which includes an enlarged liver.
      These are more common if you are female, very overweight (obese), or have been
      taking anti-HIV medicines for a long time. Call your doctor right away if you
      or your child have more than one of these symptoms: abdominal or stomach discomfort
      or cramping, dark urine, decreased appetite, diarrhea, a general feeling of
      discomfort, light-colored stools, muscle cramping or pain, nausea, unusual tiredness
      or weakness, trouble breathing, vomiting, or yellow eyes or skin.'
  - type: paragraph
    text: Check with your doctor right away if you or your child have abdominal or
      stomach pain, black, tarry stools, bleeding gums, blood in the urine or stools,
      pinpoint red spots on the skin, or unusual bleeding or bruising. These may be
      symptoms of a condition called non-cirrhotic portal hypertension.
  - type: paragraph
    text: Tell your doctor right away if you or your child start having numbness,
      tingling, or burning pain in your hands, arms, legs, or feet. These may be symptoms
      of a condition called peripheral neuropathy.
  - type: paragraph
    text: Your immune system may get stronger when you start taking HIV medicines.
      Sometimes the immune system will start to fight infections that were hidden
      in your body, such as pneumonia or tuberculosis, or may result in a flare-up
      of a hidden autoimmune disorder such as Graves' disease, polymyositis, or Guillain-Barré
      syndrome. Tell your doctor right away if you notice any changes in your health.
  - type: paragraph
    text: This medicine may cause you or your child to lose fat from your legs, arms,
      or face. Talk to your doctor if you have any concerns.
  - type: paragraph
    text: Check with your doctor right away if you or your child start to see unusual
      colors or have blurred vision. Your doctor may want you to have your eyes checked
      regularly by an eye doctor (ophthalmologist).
  - type: paragraph
    text: Do not drink alcohol while you are using this medicine.
  - type: paragraph
    text: This medicine will not keep you from giving HIV to your partner during sex.
      Make sure you understand this and practice safe sex, even if your partner also
      has HIV, by using a latex condom or other barrier method. This medicine will
      also not keep you from giving HIV to other people if they are exposed to your
      blood. Do not re-use or share needles with anyone.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea
      - stomach pain
      - tingling, burning, numbness, and pain in the hands or feet
      - vomiting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - fever
      - itching, skin rash
      - seizures
      - sore throat
      - swelling of the feet or lower legs
      - unusual bleeding and bruising
      - unusual tiredness and weakness
      - yellow skin and eyes
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - black, tarry stools
      - bleeding gums
      - blindness
      - bloating
      - blood in the urine or stools
      - blue-yellow color blindness
      - blurred vision
      - change in the color of the eye
      - chest pain
      - clay colored stools
      - cold sweats
      - confusion
      - constipation
      - cool, pale skin
      - cough
      - dark urine
      - decreased appetite
      - decreased vision
      - depression
      - diarrhea
      - difficulty with moving
      - difficulty with swallowing
      - dizziness
      - dry eyes or mouth
      - eye pain
      - fast heartbeat
      - fast, shallow breathing
      - flushed, dry skin
      - fruit-like breath odor
      - general feeling of discomfort
      - headache
      - hives
      - increased hunger
      - increased thirst
      - increased urination
      - indigestion
      - joint pain
      - light-colored stools
      - loss of appetite
      - loss of consciousness
      - muscle aching, cramping, or pain
      - nightmares
      - painful or difficult urination
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - right upper abdominal or stomach pain and fullness
      - shakiness
      - sleepiness
      - slurred speech
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach ache or discomfort
      - sweating
      - swollen glands or joints
      - tightness in the chest
      - troubled breathing with exertion
      - unexplained weight loss
      - unsteadiness or awkwardness
      - weakness in the arms, hands, legs, or feet
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty with sleeping
      - irritability
      - restlessness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - excess air or gas in the stomach or bowels
      - feeling of fullness
      - hair loss or thinning of the hair
      - heartburn
      - indigestion
      - lack or loss of strength
      - passing gas
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
