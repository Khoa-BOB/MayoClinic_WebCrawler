title: Bleomycin (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Blenoxane
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Bleomycin belongs to the general group of medicines called antineoplastics.
      It is used to treat several types of cancer, including cervix and uterus cancer,
      head and neck cancer, testicle and penile cancer, and certain types of lymphoma.
      Bleomycin also may used for other conditions, as determined by your doctor.
  - type: paragraph
    text: Bleomycin seems to act by interfering with the growth of cancer cells, which
      are eventually destroyed. Since the growth of normal body cells may also be
      affected by bleomycin, other effects will also occur. Some of these may be serious
      and must be reported to your doctor. Other effects, like darkening of skin or
      hair loss, may not be serious but may cause concern. Some effects may not occur
      for months or years after the medicine is used.
  - type: paragraph
    text: Before you begin treatment with bleomycin, you and your doctor should talk
      about the good this medicine will do as well as the risks of using it.
  - type: paragraph
    text: Bleomycin is to be administered only by or under the immediate supervision
      of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of bleomycin in
        children with use in other age groups, this medicine is not expected to cause
        different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Lung problems are more likely to occur in elderly patients (over 70 years
        of age), who are usually more sensitive to the effects of bleomycin.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Brentuximab Vedotin
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Ascorbic Acid
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Fosphenytoin
      - Influenza Virus Vaccine, Live
      - Phenytoin
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease—Effects of bleomycin may be increased because of slower removal
        from the body
    - type: list
      ordered: false
      items:
      - Liver disease—Bleomycin can cause liver problems
    - type: list
      ordered: false
      items:
      - Lung disease—Bleomycin may worsen the condition
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Bleomycin is sometimes given together with certain other medicines. If you
      are using a combination of medicines, it is important that you receive each
      medicine at the proper time. If you are taking some of these medicines by mouth,
      ask your health care professional to help you plan a way to take them at the
      right times.
  - type: paragraph
    text: Bleomycin often causes nausea, vomiting, and loss of appetite. However,
      it is very important that you continue to receive the medicine, even if you
      begin to feel ill. Ask your health care professional for ways to lessen these
      effects.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly and to check for unwanted
      effects.
  - type: paragraph
    text: Before having any kind of surgery (including dental surgery) or emergency
      treatment, tell the medical doctor or dentist in charge that you are receiving
      or have received this medicine.
  - type: paragraph
    text: Tell your doctor if you smoke. The risk of lung problems is increased in
      people who smoke.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: Also, because of the way these medicines act on the body, there is a chance
      that they might cause other unwanted effects that may not occur until months
      or years after the medicine is used. These delayed effects may include certain
      types of cancer, such as leukemia. Discuss these possible effects with your
      doctor.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever and chills (occurring within 3 to 6 hours after a dose)
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
      - faintness
      - wheezing
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain (sudden severe)
      - weakness in arms or legs (sudden)
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - shortness of breath
      - sores in mouth and on lips
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Darkening or thickening of skin
      - dark stripes on skin
      - itching of skin
      - skin rash or colored bumps on fingertips, elbows, or palms
      - skin redness or tenderness
      - swelling of fingers
      - vomiting and loss of appetite
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in fingernails or toenails
      - weight loss
    - type: paragraph
      text: Bleomycin may cause a temporary loss of hair in some people. After treatment
        has ended, normal hair growth should return, although it may take several
        months.
    - type: paragraph
      text: Side effects that affect your lungs (for example, cough and shortness
        of breath) may be more likely to occur if you smoke.
    - type: paragraph
      text: 'After you stop using this medicine, it may still produce some side effects
        that need attention. During this period of time, check with your doctor immediately
        if you notice the following side effects:'
    - type: list
      ordered: false
      items:
      - Cough
      - shortness of breath
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
