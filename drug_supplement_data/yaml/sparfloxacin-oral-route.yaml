title: Sparfloxacin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Zagam
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Sparfloxacin belongs to the class of medicines known as antibiotics. It
      is used to treat bronchitis and pneumonia caused by bacterial infections.
  - type: paragraph
    text: Sparfloxacin works by killing bacteria or preventing their growth. However,
      this medicine will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Caution is recommended in using sparfloxacin in children up to 18 years
        of age because similar medicines have been shown to cause bone development
        problems in young animals. However, your doctor may choose to use this medicine
        if other medicines cannot be used.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been studied in elderly patients and has not been found
        to cause different side effects or other problems than it does in younger
        adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Alfuzosin
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Anagrelide
      - Apomorphine
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Artemether
      - Asenapine
      - Astemizole
      - Atazanavir
      - Azithromycin
      - Bedaquiline
      - Bepridil
      - Buprenorphine
      - Buserelin
      - Ceritinib
      - Chloroquine
      - Chlorpromazine
      - Ciprofloxacin
      - Cisapride
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
      - Crizotinib
      - Cyclobenzaprine
      - Dabrafenib
      - Dasatinib
      - Degarelix
      - Delamanid
      - Desflurane
      - Desipramine
      - Deslorelin
      - Deutetrabenazine
      - Dexmedetomidine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acarbose
      - Adagrasib
      - Albiglutide
      - Alogliptin
      - Betamethasone
      - Budesonide
      - Bupropion
      - Canagliflozin
      - Chlorpropamide
      - Cholera Vaccine, Live
      - Corticotropin
      - Cortisone
      - Cosyntropin
      - Dapagliflozin
      - Deflazacort
      - Dexamethasone
      - Dulaglutide
      - Empagliflozin
      - Ertugliflozin
      - Exenatide
      - Fludrocortisone
      - Fluocortolone
      - Glimepiride
      - Glipizide
      - Glyburide
      - Hydrocortisone
      - Insulin
      - Insulin Aspart, Recombinant
      - Insulin Bovine
      - Insulin Degludec
      - Insulin Detemir
      - Insulin Glulisine
      - Insulin Lispro, Recombinant
      - Linagliptin
      - Liraglutide
      - Lixisenatide
      - Magnesium Sulfate
      - Metformin
      - Methylprednisolone
      - Miglitol
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Aluminum Carbonate, Basic
      - Aluminum Hydroxide
      - Aluminum Phosphate
      - Aminolevulinic Acid
      - Calcium
      - Dihydroxyaluminum Aminoacetate
      - Dihydroxyaluminum Sodium Carbonate
      - Lanthanum Carbonate
      - Magaldrate
      - Magnesium Carbonate
      - Magnesium Hydroxide
      - Magnesium Oxide
      - Magnesium Trisilicate
      - Sucralfate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Brain or spinal cord disease, including hardening of the arteries in the brain,
        or epilepsy or other seizures—Sparfloxacin may increase the chance of convulsions
        (seizures) occurring
    - type: list
      ordered: false
      items:
      - Heart rhythm problems or
      - Heart or blood problems that could lead to heart rhythm problems—Sparfloxacin
        can cause heart rhythm problems
    - type: list
      ordered: false
      items:
      - Kidney disease—Effects of sparfloxacin may be increased because of slower
        removal from the body
    - type: list
      ordered: false
      items:
      - Sensitivity of the skin to sunlight (previous)—Increased risk of severe reactions
        to sunlight caused by sparfloxacin
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Sparfloxacin may be taken with meals or on an empty stomach, or with milk
      products or caffeine-containing products.
  - type: paragraph
    text: Drink plenty of fluids while you are being treated with this medicine. Drinking
      extra water will help to prevent some unwanted effects of sparfloxacin.
  - type: paragraph
    text: This medicine works best when there is a constant amount in the blood or
      urine. To help keep the amount constant, do not miss any doses. Also, it is
      best to take the doses at evenly spaced times, day and night. For example, if
      you are to take one dose a day, try to take it at the same time each day.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of infection: Adults—400 milligrams
        (mg) on the first day, then 200 mg once a day for an additional nine days.
        Children younger than 18 years of age—Use and dose must be determined by your
        doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of infection: Adults—400 milligrams (mg) on the first day,
        then 200 mg once a day for an additional nine days. Children younger than
        18 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—400 milligrams (mg) on the first day, then 200 mg once a day for an
        additional nine days.
      - Children younger than 18 years of age—Use and dose must be determined by your
        doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: If you are taking aluminum-, calcium-, or magnesium-containing antacids,
      iron supplements, sucralfate, or zinc, do not take them at the same time that
      you take this medicine. It is best to take these medicines at least 4 hours
      after taking sparfloxacin. These medicines may keep sparfloxacin from working
      properly.
  - type: paragraph
    text: 'Some people who take sparfloxacin may become more sensitive to sunlight
      than they are normally. Exposure to sunlight, even for brief periods of time,
      may cause severe sunburn; skin rash, redness, itching, or discoloration; or
      vision changes. When you begin taking this medicine:'
  - type: list
    ordered: false
    items:
    - Stay out of direct sunlight, especially between the hours of 10:00 a.m. and
      3:00 p.m., if possible, while you are taking sparfloxacin and for 5 days after
      you stop taking sparfloxacin.
    - Wear protective clothing, including a hat and sunglasses.
    - Apply a sun block product that has a skin protection factor (SPF) of at least
      15. Some patients may require a product with a higher SPF number, especially
      if they have a fair complexion. However, wearing a sun block product will not
      prevent a reaction to sunlight while you are taking sparfloxacin. If you have
      any questions about this, check with your health care professional.
    - Do not use a sunlamp or tanning bed or booth.
  - type: paragraph
    text: If you have a severe reaction from the sun, check with your doctor. Stay
      out of direct sunlight and artificial light (e.g., sunlamp, tanning bed or booth)
      for the next 5 days or until the reaction has stopped.
  - type: paragraph
    text: If you get a skin rash or other signs of an allergic reaction, stop taking
      sparfloxacin and check with your doctor.
  - type: paragraph
    text: Sparfloxacin may cause some people to become dizzy, lightheaded, drowsy,
      or less alert than they are normally. Make sure you know how you react to this
      medicine before you drive, use machines, or do anything else that could be dangerous
      if you are dizzy or are not alert. If these reactions are especially bothersome,
      check with your doctor.
  - type: paragraph
    text: This medicine may rarely cause inflammation or even tearing of a tendon
      (the cord that attaches muscles to bones). If you get sudden pain in a tendon
      after exercise (for example, in your ankle, back of the knee or leg, shoulder,
      elbow, or wrist), stop taking sparfloxacin and check with your doctor. Rest
      and do not exercise until the doctor has made sure that you have not injured
      or torn the tendon.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blisters
      - itching
      - redness of skin
      - sensation of skin burning
      - skin rash
      - swelling of skin
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps and pain (severe)
      - abdominal tenderness
      - diarrhea (watery and severe), which may also be bloody
      - fever
      - pain, inflammation, or swelling in calves, shoulders, or hands
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Irregular heartbeat
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acute psychosis
      - agitation
      - confusion
      - hallucinations (seeing, hearing, or feeling things that are not there)
      - tremors
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Changes in sense of taste
      - diarrhea
      - dizziness
      - drowsiness
      - headache
      - lightheadedness
      - nausea
      - nervousness
      - trouble in sleeping
      - vaginal itching and discharge
      - vomiting
    - type: paragraph
      text: 'After you stop using this medicine, it may still produce some side effects
        that need attention. During this period of time, check with your doctor immediately
        if you notice the following side effects:'
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps and pain (severe)
      - abdominal tenderness
      - diarrhea (watery and severe), which may also be bloody
      - fever
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
