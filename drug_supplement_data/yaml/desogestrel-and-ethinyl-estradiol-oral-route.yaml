    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Abnormal or unusual vaginal bleeding or
      - Blood clots (eg, deep vein thrombosis, pulmonary embolism), or history of
        or
      - Blood disorders (eg, hypercoagulopathy), acquired or inherited or
      - Breast cancer, known or suspected or
      - Diabetes with kidney, eye, nerve, or blood vessel damage or
      - Endometrial cancer or
      - Heart attack, history of or
      - Heart or blood vessel disease (eg, coronary artery disease, heart valve problems),
        or history of or
      - Hypertension (high blood pressure), uncontrolled or
      - Jaundice during pregnancy or from using hormonal therapy in the past or
      - Liver disease, including tumors or cancer or
      - Major surgery with prolonged periods of immobilization or
      - Migraine headache or
      - Stroke, history of or
      - Tumors (estrogen-dependent), known or suspected—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Breast cancer, family history of or
      - Cervical cancer or
      - Depression, history of or
      - Edema (fluid retention or body swelling) or
      - Epilepsy (seizures) or
      - Gallbladder disease or
      - Hypertension (high blood pressure)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hyperlipidemia (high cholesterol or fats in the blood) or
      - Hypertension (high blood pressure) or
      - Kidney disease or
      - Obesity, or history of—Use with caution. These conditions may increase risk
        for more serious side effects.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine exactly as directed by your
      doctor . Do not use more of it, do not use it more often, and do not use it
      for a longer time than your doctor ordered.
  - type: paragraph
    text: To use oral contraceptives as safe and reliable as possible, you should
      understand how and when to take them and what effects may be expected.
  - type: paragraph
    text: This medicine comes with patient instructions. Read and follow these instructions
      carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: This medicine is available in blister packs with a tablet dispenser. Each
      blister pack contains 28 tablets with different colors that need to be taken
      in the same order as directed on the blister pack.
  - type: paragraph
    text: When you begin using this medicine, your body will require at least 7 days
      to adjust before a pregnancy will be prevented. Use a second form of contraception
      (eg, condom, spermicide, or diaphragm) for the first 7 days of your first cycle
      of pills.
  - type: paragraph
    text: Take this medicine at the same time each day. Birth control pills work best
      when no more than 24 hours pass between doses.
  - type: paragraph
    text: Do not skip or delay taking your pill by more than 24 hours . If you miss
      a dose, you could get pregnant. Ask your doctor for ways to help you remember
      to take your pills or about using another method of birth control.
  - type: paragraph
    text: You may feel sick or nauseated, especially during the first few months that
      you take this medicine. If your nausea is continuous and does not go away, call
      your doctor.
  - type: paragraph
    text: Follow the instructions in the patient leaflet or call your doctor if you
      vomit or have diarrhea within 3 to 4 hours of taking this medicine. Treat this
      as a missed dose.
  - type: paragraph
    text: If you are using colesevelam, take it at least 4 hours before or after using
      this medicine.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine. Grapefruit and grapefruit juice may change the amount of this medicine
      that is absorbed in the body.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: paragraph
      text: Your doctor may ask you to begin your dose on the first day of your menstrual
        period (called Day 1 start) or on the first Sunday after your menstrual period
        starts (called Sunday start). When you begin on a certain day it is important
        that you follow that schedule, even if you miss a dose. Do not change your
        schedule on your own. If the schedule that you use is not convenient, talk
        with your doctor about changing it. For a Sunday start, you need to use another
        form of birth control (eg, condom, diaphragm, spermicide) for the first 7
        days.
    - type: paragraph
      text: You should begin your next and all subsequent 28-day regimens of treatment
        on the same day of the week as the first regimen began and follow the same
        schedule.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For contraception (to prevent pregnancy):
        Adults and teenagers: Desogen®—One white tablet (active) taken at the same
        time each day for 21 consecutive days followed by one green tablet (inert)
        daily for 7 days per menstrual cycle. Ortho-Cept®—One light orange tablet
        (active) taken at the same time each day for 21 consecutive days followed
        by one green tablet (inert) daily for 7 days per menstrual cycle. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For contraception (to prevent pregnancy): Adults and teenagers: Desogen®—One
        white tablet (active) taken at the same time each day for 21 consecutive days
        followed by one green tablet (inert) daily for 7 days per menstrual cycle.
        Ortho-Cept®—One light orange tablet (active) taken at the same time each day
        for 21 consecutive days followed by one green tablet (inert) daily for 7 days
        per menstrual cycle. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults and teenagers: Desogen®—One white tablet (active) taken at the same
        time each day for 21 consecutive days followed by one green tablet (inert)
        daily for 7 days per menstrual cycle. Ortho-Cept®—One light orange tablet
        (active) taken at the same time each day for 21 consecutive days followed
