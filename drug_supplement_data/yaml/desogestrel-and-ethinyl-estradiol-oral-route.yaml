- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Desogestrel and ethinyl estradiol combination is used to prevent pregnancy.
      It is a birth control pill that contains two types of hormones, desogestrel
      and ethinyl estradiol, and when taken properly, prevents pregnancy. It works
      by stopping a woman's egg from fully developing each month. The egg can no longer
      accept a sperm and fertilization (pregnancy) is prevented.
  - type: paragraph
    text: No contraceptive method is 100 percent effective. Birth control methods
      such as having surgery to become sterile or not having sex are more effective
      than birth control pills. Discuss your options for birth control with your doctor.
  - type: paragraph
    text: This medicine does not prevent HIV infection or other sexually transmitted
      diseases. It will not help as emergency contraception, such as after unprotected
      sexual contact.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of desogestrel
        and ethinyl estradiol combination have not been performed in the pediatric
        population. However, pediatric-specific problems that would limit the usefulness
        of this medication in teenagers are not expected. This medicine may be used
        for birth control in teenage females but should not be used before the start
        of menstruation.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of desogestrel
        and ethinyl estradiol combination have not been performed in the geriatric
        population. This medicine is not indicated for use in elderly women.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Dasabuvir
      - Fezolinetant
      - Ombitasvir
      - Paritaprevir
      - Ritonavir
      - Tranexamic Acid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Alclometasone
      - Aldosterone
      - Amcinonide
      - Amifampridine
      - Amobarbital
      - Amoxicillin
