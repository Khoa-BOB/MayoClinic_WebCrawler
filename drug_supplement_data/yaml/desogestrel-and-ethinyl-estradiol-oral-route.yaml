    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    - type: paragraph
      text: This medicine has specific patient instructions on what to do if you miss
        a dose. Read and follow these instructions carefully and call your doctor
        if you have any questions.
    - type: paragraph
      text: Use a second form of birth control for 7 days after you miss a dose to
        prevent pregnancy.
    - type: paragraph
      text: Make sure your doctor knows if you miss your period 2 months in a row,
        because this could mean that you are pregnant.
    - type: paragraph
      text: You may not have a period for that month if you miss more than one dose
        or change your schedule.
    - type: paragraph
      text: You could have light bleeding or spotting if you do not take a pill on
        time. The more pills you miss, the more likely you are to have bleeding.
    - type: list
      ordered: false
      items:
      - 'If you miss one light orange or white pill: Take the pill as soon as possible
        and take the next pill at your regular schedule.'
      - 'If you miss two light orange or white pills in week 1 or 2: Take the two
        pills as soon as possible and the next two pills the next day. Continue taking
        one pill a day until you finish the pack. Use a second form of birth control
        (eg, condom, spermicide) for 7 days after you miss a dose.'
      - 'If you miss two light orange or white pills in week 3, or if you miss three
        or more light orange or white pills in any week: Day 1 start: Throw out the
        rest of the pack and start a new pack that same day. Sunday start: Continue
        taking one pill a day until Sunday, then throw out the rest of the pack and
        start a new pack that same day. Use a second form of birth control (eg, condom,
        spermicide) for 7 days after you miss a dose, to prevent pregnancy. If you
        miss your menstrual period 2 months in a row, check with your doctor because
        you might be pregnant.'
      - 'If you miss any of the seven green pills in week 4: Throw away the pills
        you missed. Continue taking one pill a day until you finish the pack.'
    - type: list
      ordered: false
      items:
      - 'Day 1 start: Throw out the rest of the pack and start a new pack that same
        day.'
      - 'Sunday start: Continue taking one pill a day until Sunday, then throw out
        the rest of the pack and start a new pack that same day. Use a second form
        of birth control (eg, condom, spermicide) for 7 days after you miss a dose,
        to prevent pregnancy. If you miss your menstrual period 2 months in a row,
        check with your doctor because you might be pregnant.'
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and does not cause unwanted effects.
      These visits will usually be every 6 to 12 months, but some doctors require
      them more often. Your doctor may also want to check your blood pressure while
      taking this medicine.
  - type: paragraph
    text: Although you are using this medicine to prevent pregnancy, you should know
      that using this medicine while you are pregnant could harm your unborn baby.
      If you think you have become pregnant while using the medicine, tell your doctor
      right away. Make sure your doctor knows if you have had a baby within 4 to 6
      weeks before you start using this medicine.
  - type: paragraph
    text: Vaginal bleeding of various amounts may occur between your regular menstrual
      periods during the first 3 months of use. This is sometimes called spotting
      when slight, or breakthrough bleeding when heavier.
  - type: list
    ordered: false
    items:
    - If this should occur, continue with your regular dosing schedule.
    - The bleeding usually stops within 1 week. Check with your doctor if the bleeding
      continues for more than 1 week.
    - If the bleeding continues after you have been taking hormonal contraceptives
      on schedule and for more than 3 months, check with your doctor.
  - type: paragraph
    text: Check with your doctor right away if you miss a menstrual period. Missed
      periods may occur if you skip one or more tablets and have not taken your pills
      exactly as directed. If you miss two periods in a row, talk to your doctor.
      You might need a pregnancy test.
  - type: paragraph
    text: If you suspect that you may be pregnant, check with your doctor immediately
      .
  - type: paragraph
    text: Do not use this medicine together with medicine to treat hepatitis C virus
      infection, including ombitasvir/paritaprevir/ritonavir, with or without dasabuvir.
  - type: paragraph
    text: Do not use this medicine if you smoke cigarettes or if you are over 35 years
      of age . If you smoke while using birth control pills, you increase your risk
      of having a blood clot, heart attack, or stroke. Your risk is even higher if
      you are over age 35, if you have diabetes, high blood pressure, high cholesterol,
      or if you are overweight. Talk with your doctor about ways to stop smoking.
      Keep your diabetes under control. Ask your doctor about diet and exercise to
      control your weight and blood cholesterol level.
  - type: paragraph
    text: Using this medicine may increase your risk of having blood clotting problems.
      This usually occurs when you first start taking this medicine, or after starting
      birth control pills after not using them for a month or more. Check with your
      doctor right away if you have pain in the chest, groin, or legs, especially
      the calves, difficulty with breathing, a sudden, severe headache, slurred speech,
      a sudden, unexplained shortness of breath, a sudden unexplained shortness of
      breath, a sudden loss of coordination, or vision changes while using this medicine.
  - type: paragraph
    text: Using this medicine may increase your risk of breast cancer or cervical
      cancer. Talk with your doctor about this risk. Check with your doctor immediately
      if your experience abnormal vaginal bleeding.
  - type: paragraph
    text: Check with your doctor immediately if you wear contact lenses or if blurred
      vision, difficulty in reading, or any other change in vision occurs during or
      after treatment . Your doctor may want an eye doctor (ophthalmologist) to check
      your eyes.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, dark urine or pale stools, or yellow eyes or skin. These could
      be symptoms of a serious liver problem.
  - type: paragraph
    text: Using this medicine may increase your risk for gallbladder surgery. Talk
      with your doctor about this risk.
  - type: paragraph
    text: Check with your doctor before refilling an old prescription, especially
      after a pregnancy. You will need another physical examination and your doctor
      may change your prescription.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. The results of some medical tests may be affected by this medicine.
      You may also need to stop using this medicine at least 3 to 4 weeks before and
      2 weeks after having major surgery.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Absent, missed, or irregular menstrual periods
      - anxiety
      - change in vision
      - changes in skin color
      - chest pain or discomfort
      - chills
      - clay-colored stools
      - constipation
      - cough
      - dark urine
      - diarrhea
      - dizziness, lightheadedness, fainting
      - fever
      - hives or welts
      - itching skin or rash
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - nausea
      - pain or discomfort in the arms, jaw, back, or neck
      - pain, tenderness, or swelling of the foot or leg
      - pains in the chest, groin, or legs, especially in the calves of the legs
      - severe headaches of sudden onset
      - slow or fast heartbeat
      - stomach pain
      - sudden loss of coordination or slurred speech
      - sudden troubled breathing
      - sweating
      - unusual tiredness or weakness
      - vomiting
      - vomiting of blood
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating
      - blotchy spots on the exposed skin
      - breast enlargement or tenderness
      - feeling sad or empty
      - irritability
      - itching of the vagina or outside the genitals
      - loss of interest or pleasure
      - pain during sexual intercourse
      - thick, white curd-like vaginal discharge without odor or with mild odor
      - trouble wearing contact lenses
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
