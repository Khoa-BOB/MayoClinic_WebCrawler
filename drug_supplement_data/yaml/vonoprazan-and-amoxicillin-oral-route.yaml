    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, hairy tongue
      - bleeding gums
      - blistering, peeling, or loosening of the skin
      - blood in the urine or stools
      - confusion about identity, place, and time
      - coughing up blood
      - dark urine
