    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: Call your doctor or pharmacist for instructions.
    - type: paragraph
      text: This medicine has specific patient instructions on what to do if you miss
        a dose. Read and follow these instructions carefully and call your doctor
        if you have any questions.
    - type: list
      ordered: false
      items:
      - 'FEMCON® Fe: If you miss one white active tablet in weeks 1, 2, or 3: Take
        the tablet as soon as possible and take the next tablet at your regular schedule.
        Continue taking one tablet a day until you finish the pack. If you miss two
        white active tablets in week 1 or 2: Take the two tablets as soon as possible
        and the next two tablets the next day. Continue taking one tablet a day until
        you finish the pack. Use a second form of birth control (eg, condom, spermicide)
        for 7 days after you miss a dose. If you miss two white active tablets in
        week 3, or you miss three or more white active tablets in a row in weeks 1,
        2, or 3: Day 1 start: Throw out the rest of the pack and start a new pack
        that same day. Use a second form of birth control (eg, condom, spermicide)
        for 7 days after you miss a dose. Sunday start: Continue taking one tablet
        a day until Sunday, then throw out the rest of the pack and start a new pack
        that same day. Use a second form of birth control (eg, condom, spermicide)
        for 7 days after you miss a dose, to prevent pregnancy.'
      - 'Lo Loestrin® Fe: If you miss one blue tablet: Take the tablet as soon as
        possible and take the next tablet at your regular schedule. This means that
        you may take 2 pills in 1 day. Continue taking one tablet a day until you
        finish the pack. You do not need to use another form of birth control if you
        have sex. If you miss two blue tablets in Week 1 or 2: Take the two tablets
        as soon as possible and the next two tablets the next day. Continue taking
        one tablet a day until you finish the pack. Use a second form of birth control
        (eg, condom, spermicide) for 7 days after you miss a dose. If you miss two
        tablets (blue or white) in Week 3 or 4: Throw out the rest of the pack and
        start a new pack that same day. Use a second form of birth control (eg, condom,
        spermicide) for 7 days after you miss a dose. If you miss two periods in a
        row, call your doctor for a pregnancy test before you take any more pills.
        If you miss three or more tablets (blue or white): Throw out the rest of the
        pack and start a new pack that same day. Use a second form of birth control
        (eg, condom, spermicide) the next time you have sex or for 7 days after you
        miss a dose. If you miss two periods in a row, call your doctor for a pregnancy
        test before you take any more pills. If you miss one or two brown tablets
        in Week 4: Throw out the pill you missed. Start a new pack on the same day
        you usually start a new pack. You do not need to use another form of birth
        control if you have sex.'
      - 'Loestrin® 24 Fe: If you miss one white active tablet in weeks 1, 2, or 3:
        Take the tablet as soon as possible and take the next tablet at your regular
        schedule. Continue taking one tablet a day until you finish the pack. If you
        miss two white active tablets in week 1 or 2: Take the two tablets as soon
        as possible and the next two tablets the next day. Continue taking one tablet
        a day until you finish the pack. Use a second form of birth control (eg, condom,
        spermicide) for 7 days after you miss a dose. If you miss two white active
        tablets in week 3 or 4, or you miss three or more white active tablets in
        a row: Day 1 start: Throw out the rest of the pack and start a new pack that
        same day. Use a second form of birth control (eg, condom, spermicide) for
        7 days after you miss a dose. Sunday start: Continue taking one tablet a day
        until Sunday, then throw out the rest of the pack and start a new pack that
        same day. Use a second form of birth control (eg, condom, spermicide) for
        7 days after you miss a dose, to prevent pregnancy.'
      - 'Minastrin® 24 Fe: If you miss one white active tablet in weeks 1, 2, or 3:
        Take the tablet as soon as possible and take the next tablet at your regular
        schedule. Continue taking one tablet a day until you finish the pack. If you
        miss two white active tablets in week 1 or 2: Take the two tablets as soon
        as possible and the next two tablets the next day. Continue taking one tablet
        a day until you finish the pack. Use a second form of birth control (eg, condom,
        spermicide) for 7 days after you miss a dose. If you miss two white active
        tablets in week 3 or 4, or you miss three or more white active tablets in
        a row: Day 1 start: Throw out the rest of the pack and start a new pack that
        same day. Use a second form of birth control (eg, condom, spermicide) for
        7 days after you miss a dose. Sunday start: Continue taking one tablet a day
        until Sunday, then throw out the rest of the pack and start a new pack that
        same day. Use a second form of birth control (eg, condom, spermicide) for
        7 days after you miss a dose, to prevent pregnancy. If you miss any of the
        four brown tablets: Throw out the pill you missed. Continue taking the remaining
        tablet until you finish the pack. You do not need to use another form of birth
        control if you have sex.'
      - 'Norminest® Fe or Norquest® Fe: If you miss one blue or yellow-green active
        tablet: Take the tablet as soon as possible and take the next tablet at your
        regular schedule. This means that you may take 2 pills in 1 day. You do not
        need to use another form of birth control if you have sex. If you miss more
        than one blue or yellow-green active tablets: Skip the two tablets. Take the
        next tablet at your regular schedule. Continue taking one tablet a day until
        you finish the pack. Use a second form of birth control (eg, condom, spermicide)
        for 7 days after you miss a dose. You could have light bleeding or spotting
        any time you do not take a pill on schedule. The more pills you miss, the
        more likely you are to have bleeding. If you miss two periods in a row, call
        your doctor for a pregnancy test before you take any more pills.'
    - type: list
      ordered: false
      items:
      - 'If you miss one white active tablet in weeks 1, 2, or 3: Take the tablet
        as soon as possible and take the next tablet at your regular schedule. Continue
        taking one tablet a day until you finish the pack.'
      - 'If you miss two white active tablets in week 1 or 2: Take the two tablets
        as soon as possible and the next two tablets the next day. Continue taking
        one tablet a day until you finish the pack. Use a second form of birth control
        (eg, condom, spermicide) for 7 days after you miss a dose.'
      - 'If you miss two white active tablets in week 3, or you miss three or more
        white active tablets in a row in weeks 1, 2, or 3: Day 1 start: Throw out
        the rest of the pack and start a new pack that same day. Use a second form
        of birth control (eg, condom, spermicide) for 7 days after you miss a dose.
        Sunday start: Continue taking one tablet a day until Sunday, then throw out
        the rest of the pack and start a new pack that same day. Use a second form
        of birth control (eg, condom, spermicide) for 7 days after you miss a dose,
        to prevent pregnancy.'
