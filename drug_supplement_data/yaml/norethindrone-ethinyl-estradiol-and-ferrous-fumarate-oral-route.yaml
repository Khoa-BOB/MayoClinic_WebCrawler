        doctor.'
    - type: list
      ordered: false
      items:
      - 'Adults and teenagers— FEMCON® Fe: One white tablet (active) taken at the
        same time each day for 21 consecutive days followed by one brown (inert) tablet
        daily for 7 days per menstrual cycle. Loestrin® 24 Fe: One white (active)
        tablet taken at the same time each day for 24 consecutive days followed by
