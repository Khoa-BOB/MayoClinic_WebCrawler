        by one brown (inert) tablet daily for 7 days per menstrual cycle.'
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'FEMCON® Fe: One white tablet (active) taken at the same time each day for
        21 consecutive days followed by one brown (inert) tablet daily for 7 days
        per menstrual cycle.'
      - 'Loestrin® 24 Fe: One white (active) tablet taken at the same time each day
