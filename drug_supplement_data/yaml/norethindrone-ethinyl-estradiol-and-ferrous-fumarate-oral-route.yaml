    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
      - Dairy Food
      - Phytic Acid Containing Food
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Abnormal or unusual vaginal bleeding or
      - Blood clots (eg, deep vein thrombosis, pulmonary embolism), or history of
        or
      - Breast cancer, active or history of or
      - Cholestasis (bile problem) during pregnancy or previous pill use, history
        of or
      - Diabetes with kidney, eye, nerve, or blood vessel damage or
      - Heart attack, history of or
      - Heart or blood vessel disease (eg, coronary artery disease, heart valve problems)
        or
      - Heart rhythm problems (atrial fibrillation) or
      - Hypertension (high blood pressure), uncontrolled or
      - Liver disease, including tumors or cancer or
      - Migraine headache, new or worse or a new kind of headache or
      - Problems with circulation or blood clots, now or in the past or
      - Stroke, history of—Should not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Angioedema (swelling of the face, tongue, or throat), inherited or
      - Cervical cancer or intraepithelial neoplasia or
      - Chloasma gravidarum (skin disorder during pregnancy), history of or
      - Depression, history of or
      - Diabetes or
      - Dyslipidemia (high cholesterol or fats in the blood), uncontrolled or
      - Gallbladder disease or
      - Hypertension (high blood pressure)—Use with caution. May make these conditions
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine exactly as directed by your
      doctor . Do not use more of it, do not use it more often, and do not use it
      for a longer time than your doctor ordered.
  - type: paragraph
    text: To make using hormonal contraceptives as safe and reliable as possible,
      you should understand how and when to use them and what effects may be expected.
  - type: paragraph
    text: This medicine comes with patient instructions. Read and follow these instructions
      carefully. Ask your doctor or pharmacist if you have any questions.
  - type: paragraph
    text: This medicine is available in blister packs. Each blister pack contains
      28 tablets with different colors that need to be taken in the same order as
      directed on the blister pack.
  - type: paragraph
    text: When you begin using this medicine, your body will require at least 7 days
      to adjust before a pregnancy will be prevented. Use a second form of contraception,
      such as a condom, spermicide, or diaphragm, for the first 7 days of your first
      cycle of pills.
  - type: paragraph
    text: Take this medicine at the same time each day. You may take this medicine
      with or without food.
  - type: paragraph
    text: You may chew and swallow the chewable tablet or swallow it whole. Drink
      a full glass of water (8 ounces) immediately after chewing or swallowing this
      medicine.
  - type: paragraph
    text: Do not skip or delay taking your pill by more than 24 hours . If you miss
      a dose, you could get pregnant. Ask your doctor for ways to help you remember
      to take your pills or about using another method of birth control.
  - type: paragraph
    text: You may have light bleeding or spotting when you first take the pill.
  - type: paragraph
    text: You may feel sick or nauseous, especially during the first few months that
      you take this medicine. If your nausea is continuous and does not go away, call
      your doctor.
  - type: paragraph
    text: If you vomit or have diarrhea within 3 to 4 hours of taking this medicine,
      follow the instructions in the patient leaflet or call your doctor.
  - type: paragraph
    text: If you are switching from a combination hormonal method (eg, another pill,
      patch, vaginal ring) to using Lo Loestrin® Fe or Minastrin® 24 Fe , take the
      medicine on the day you would have taken your next pill. If you do not start
      your period, see your doctor for a pregnancy test. If you have used a vaginal
      ring or patch, finish the 21 days of use, and wait 7 days after the ring or
      patch is removed before you start taking this medicine. You must also use a
      second method of birth control (eg, condom, diaphragm, spermicide) for the first
      7 days you take this medicine.
  - type: paragraph
    text: If you are switching from a progestin-only method (eg, progestin-only pill,
      implant, injection, intrauterine system) to using Lo Loestrin® Fe or Minastrin®
      24 Fe , take the medicine on the day you would have taken your next progestin-only
      pill, or on the day your implant is removed, or on the day you would have your
      next injection. If you switch from an IUD, talk to your doctor when to start
      taking this medicine. You must also use a second method of birth control (eg,
      condom, diaphragm, spermicide) for the first 7 days you take this medicine.
  - type: paragraph
    text: If you are switching from another hormonal method to using FEMCON® Fe or
      Loestrin® 24 Fe , take the medicine on the day you would have taken your next
      pill.
  - type: paragraph
    text: 'If you are switching from another birth control method to using FEMCON®
      Fe, Loestrin® 24 Fe, or Minastrin® 24 Fe :'
  - type: list
    ordered: false
    items:
    - Transdermal patch, vaginal ring, or injection—Start FEMCON® Fe, Loestrin® 24
      Fe, or Minastrin® 24 Fe on the day that you would usually apply, insert, or
      inject the medicine.
    - Intrauterine device (IUD)—Start FEMCON® Fe, Loestrin® 24 Fe, or Minastrin® 24
      Fe on the day of removing the IUD. Use a second form of birth control for the
      first 7 days if the IUD has not been removed on the first day of your menstrual
      cycle.
    - Implant—Start FEMCON® Fe, Loestrin® 24 Fe, or Minastrin® 24 Fe on the day of
      removing the implant.
  - type: paragraph
    text: If you have a miscarriage or an abortion in the first trimester of your
      pregnancy , you may start FEMCON® Fe , Loestrin® 24 Fe , Lo Loestrin® Fe , or
      Minastrin® 24 Fe right away. You do not need a second form of birth control.
      If you start this medicine 5 days or more after the miscarriage or abortion,
      you should use a second form of non-hormonal birth control for the first 7 days
      of your first pill cycle. If you have a miscarriage or abortion after the second
      trimester, you should wait for 4 weeks before starting this medicine. Use another
      form of birth control for the first 7 days of your first pill cycle if you use
      this medicine on a Sunday.
  - type: paragraph
    text: If you use this medicine after giving birth and choose not to breastfeed
      , you may start 4 weeks after childbirth to prevent the risk of having blood
      clots.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine. Grapefruit and grapefruit juice may change the amount of this medicine
      that is absorbed in the body.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: paragraph
      text: Your doctor may ask you to begin your dose on the first day of your menstrual
        period (called Day 1 Start), on the fifth day (called Day 5 start), or on
        the first Sunday after your menstrual period starts (called Sunday Start).
        When you begin on a certain day it is important that you follow that schedule,
        even if you miss a dose. Do not change your schedule on your own. If the schedule
        that you use is not convenient, check with your doctor about changing it.
        For the Day 5 start and Sunday start, you need to use another form of birth
        control (eg, condom, diaphragm, spermicide) for the first 7 days.
    - type: paragraph
      text: 'Lo Loestrin® Fe : Your doctor may ask you to begin your dose on the first
        day of your menstrual period. You need to use another form of birth control
        (eg, condom, spermicide) for the first 7 days if you start taking this medicine
        other than on the first day of your menstrual period.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (chewable tablets or tablets): For contraception (to
        prevent pregnancy): Adults and teenagers— FEMCON® Fe: One white tablet (active)
        taken at the same time each day for 21 consecutive days followed by one brown
        (inert) tablet daily for 7 days per menstrual cycle. Loestrin® 24 Fe: One
        white (active) tablet taken at the same time each day for 24 consecutive days
        followed by one brown (inert) tablet for 4 consecutive days. Lo Loestrin®
        Fe: One blue (active) taken at the same time each day for 24 consecutive days
        followed by one white tablet for 2 consecutive days, followed by one brown
        (inert) tablet daily for 2 consecutive days. Minastrin® 24 Fe: One white tablet
        (active) taken at the same time each day for 24 consecutive days followed
        by one brown (inert) tablet on days 25 through 28. Norminest® Fe: One blue
        tablet (active) taken at the same time each day for 21 consecutive days followed
        by one brown (inert) tablet daily for 7 days per menstrual cycle. Norquest®
        Fe: One yellow-green tablet (active) taken at the same time each day for 21
        consecutive days followed by one brown (inert) tablet daily for 7 days per
        menstrual cycle. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For contraception (to prevent pregnancy): Adults and teenagers— FEMCON® Fe:
        One white tablet (active) taken at the same time each day for 21 consecutive
        days followed by one brown (inert) tablet daily for 7 days per menstrual cycle.
        Loestrin® 24 Fe: One white (active) tablet taken at the same time each day
        for 24 consecutive days followed by one brown (inert) tablet for 4 consecutive
