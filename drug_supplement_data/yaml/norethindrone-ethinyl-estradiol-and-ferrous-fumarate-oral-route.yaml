    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may also
      be needed to check for unwanted effects. These visits will usually be every
      6 to 12 months, but some doctors require them more often.
  - type: paragraph
    text: Although you are using this medicine to prevent pregnancy, you should know
      that using this medicine while you are pregnant could harm the unborn baby.
      If you think you have become pregnant while using the medicine, tell your doctor
      right away.
  - type: paragraph
    text: Do not use this medicine together with medicine to treat hepatitis C virus
      infection, including glecaprevir/pibrentasvir (Mavyret®) or ombitasvir/paritaprevir/ritonavir,
      with or without dasabuvir (Technivie®, Viekira Pak®).
  - type: paragraph
    text: Vaginal bleeding of various amounts may occur between your regular menstrual
      periods during the first 3 months of use. This is sometimes called spotting
      when slight, or breakthrough bleeding when heavier.
  - type: list
    ordered: false
    items:
    - If this should occur, continue with your regular dosing schedule.
    - The bleeding usually stops within 1 week. Check with your doctor if the bleeding
      continues for more than 1 week.
    - If bleeding continues after you have been taking hormonal contraceptives on
      schedule and for more than 3 months, check with your doctor.
  - type: paragraph
    text: Check with your doctor right away if you miss a menstrual period. Missed
      periods may occur if you skip one or more active tablets and have not taken
      your pills exactly as directed. If you miss two periods in a row, talk to your
      doctor. You might need a pregnancy test.
  - type: paragraph
    text: If you suspect that you may be pregnant, stop using this medicine immediately
      and check with your doctor .
  - type: paragraph
    text: Do not use this medicine if you smoke cigarettes or if you are over 35 years
      old. If you smoke while using birth control pills, you increase your risk of
      having a heart attack, stroke, or blood clot. Your risk is even higher if you
      are over age 35, if you have diabetes, high blood pressure, high cholesterol,
      or if you are overweight. Talk with your doctor about ways to stop smoking.
      Keep your diabetes under control. Ask your doctor about diet and exercise to
      control your weight and blood cholesterol level.
  - type: paragraph
    text: Using this medicine may increase your risk of having heart attack, stroke,
      or blood clots. Check with your doctor right away if you have pain in the chest,
      groin, or legs, especially the calves, difficulty with breathing, a sudden,
      severe headache, slurred speech, a sudden, a sudden loss of coordination, or
      vision changes while using this medicine.
  - type: paragraph
    text: Check with your doctor immediately if you have trouble wearing contact lenses
      or if blurred vision, difficulty with reading, or any other change in vision
      occurs during or after treatment . Your doctor may want your eyes to be checked
      by an ophthalmologist (eye doctor).
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, unusual tiredness
      or weakness, or yellow eyes or skin. These could be symptoms of a serious liver
      problem.
  - type: paragraph
    text: Check with your doctor before refilling an old prescription, especially
      after a pregnancy. You will need another physical examination and your doctor
      may change your prescription.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery or certain medical tests.
  - type: paragraph
    text: This medicine may cause skin discoloration. Use a sunscreen when you are
      outdoors. Avoid sunlamps and tanning beds.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Breast tenderness
      - heavy non-menstrual vaginal bleeding
      - irregular menstrual periods
      - longer or heavier menstrual periods
      - normal menstrual bleeding occurring earlier, possibly lasting longer than
        expected
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain or tightness
      - chills
      - clay-colored stools
      - confusion
      - dark urine
      - diarrhea
      - difficulty with speaking
      - dizziness
      - double vision
      - fast or irregular heartbeat
      - fever
      - headache
      - inability to move the arms, legs, or facial muscles
      - inability to speak
      - indigestion
      - itching or rash
      - loss of appetite
      - nausea
      - pain, redness, or swelling in the arm or leg
      - pains in the chest, groin, or legs, especially in the calves
      - severe headaches of sudden onset
      - severe nausea or vomiting
      - slurred speech
      - stomach pain
      - sudden loss of coordination
      - sudden onset of slurred speech
      - sudden vision changes
      - unpleasant breath odor
      - unusual tiredness or weakness
      - unusual warmth or flushing of the skin
      - unusually heavy or unexpected menstrual bleeding
      - vaginal bleeding or spotting
      - vomiting of blood
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blemishes on the skin
      - cramps
      - depression
      - pain
      - pimples
      - weight changes
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
