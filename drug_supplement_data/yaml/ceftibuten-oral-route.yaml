      - Burning while urinating
      - confusion
      - decreased urination
      - difficult or labored breathing
      - difficult or painful urination
      - dizziness
      - dry mouth
      - fainting
      - fever
      - increase in heart rate
      - lightheadedness
      - rapid breathing
      - shortness of breath
      - sunken eyes
      - thirst
      - tightness in the chest
      - unusual tiredness or weakness
      - wheezing
      - wrinkled skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps or tenderness
      - back, leg, or stomach pains
      - bleeding gums
      - blistering, peeling, or loosening of the skin
      - bloating
      - bloody or cloudy urine
      - bloody, black, or tarry stools
      - chest pain
      - chills
      - clay-colored stools
      - cloudy urine
      - cough or hoarseness
      - coughing up blood
      - dark urine
      - decrease in urine output or decrease in urine-concentrating ability
      - diarrhea
      - diarrhea, watery and severe, which may also be bloody
      - difficulty with breathing or swallowing
      - fast heartbeat
      - feeling of discomfort
      - feeling that others are watching you or controlling your behavior
      - feeling that others can hear your thoughts
      - feeling, seeing, or hearing things that are not there
      - fever with or without chills
      - general body swelling
      - general feeling of tiredness or weakness
      - high fever
      - hives
      - increased menstrual flow or vaginal bleeding
      - increased thirst
      - inflammation of the joints
      - itching
      - joint or muscle pain
      - loss of appetite
      - lower back or side pain
      - muscle aches
      - nausea or vomiting
      - noisy breathing
      - nosebleeds
      - pain
      - pale skin
      - paralysis
      - problems with speech or speaking
      - prolonged bleeding from cuts
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red or black, tarry stools
      - red or dark brown urine
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - seizures
      - severe mood or mental changes
      - skin rash
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - sudden decrease in the amount of urine
      - swollen lymph glands
      - swollen or painful glands
      - unpleasant breath odor
      - unusual behavior
      - unusual bleeding or bruising
      - unusual weight loss
      - vomiting of blood
      - wheezing
      - yellowing of the eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - heartburn
      - indigestion
      - loose stools
      - stomach discomfort, upset, or pain
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - bad, unusual, or unpleasant (after) taste
      - bloated, full feeling
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - change in taste
      - constipation
      - cracks in the skin at the corners of the mouth
      - dry mouth
      - excess air or gas in the stomach or intestines
      - feeling unusually cold
      - full feeling
      - headache
      - hives or welts
      - increase in the body movements
      - irritability
      - itching of the vagina or genital area
      - pain during sexual intercourse
      - passing gas
      - redness of the skin
      - shivering
      - sleepiness or unusual drowsiness
      - sleeplessness
      - soreness or redness around the fingernails and toenails
      - stuffy nose
      - thick, white vaginal discharge with no odor or with a mild odor
      - trouble with sleeping
      - unable to sleep
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
