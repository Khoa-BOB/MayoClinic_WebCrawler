title: Domperidone (oral route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Domperidone is a medicine that increases the movements or contractions of
      the stomach and bowel. Domperidone is also used to treat nausea and vomiting
      caused by other drugs used to treat Parkinson's Disease.
  - type: paragraph
    text: Domperidone is to be given only by or under the immediate supervision of
      your doctor.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Children—Studies on this medicine have been done only in adult patients,
        and there is no specific information comparing use of domperidone in children
        with use in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing the use of domperidone in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Clarithromycin
      - Darunavir
      - Dronedarone
      - Fluconazole
      - Ketoconazole
      - Levoketoconazole
      - Mesoridazine
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Saquinavir
      - Sparfloxacin
      - Terfenadine
      - Thioridazine
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Adagrasib
      - Alfuzosin
      - Alprazolam
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amlodipine
      - Amoxapine
      - Amprenavir
      - Anagrelide
      - Apalutamide
      - Apomorphine
      - Aprepitant
      - Aripiprazole
      - Aripiprazole Lauroxil
      - Arsenic Trioxide
      - Artemether
      - Asenapine
      - Astemizole
      - Atazanavir
      - Avacopan
      - Azithromycin
      - Bedaquiline
      - Bicalutamide
      - Boceprevir
      - Buprenorphine
      - Buserelin
      - Cabergoline
      - Carbamazepine
      - Ceritinib
      - Chloroquine
      - Chlorpromazine
      - Cimetidine
      - Ciprofloxacin
      - Citalopram
      - Clofazimine
      - Clomipramine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding from the stomach or other problems involving the bowels
      - Pituitary (brain) tumor
      - Liver disease
      - Medicine sensitivity to domperidone
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): Treatment of gastrointestinal motility disorders:
        Adults—10 milligrams (mg) three to four times daily. Some patients may require
        higher doses up to 20 mg three or four times daily. Nausea and vomiting: Adults—20
        milligrams (mg) three to four times daily.'
    - type: list
      ordered: false
      items:
      - 'Treatment of gastrointestinal motility disorders: Adults—10 milligrams (mg)
        three to four times daily. Some patients may require higher doses up to 20
        mg three or four times daily.'
    - type: list
      ordered: false
      items:
      - Adults—10 milligrams (mg) three to four times daily. Some patients may require
        higher doses up to 20 mg three or four times daily.
    - type: list
      ordered: false
      items:
      - 'Nausea and vomiting: Adults—20 milligrams (mg) three to four times daily.'
    - type: list
      ordered: false
      items:
      - Adults—20 milligrams (mg) three to four times daily.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits.
      This will allow your doctor to see if the medicine is working properly and to
      decide if you should continue to take it.
  - type: paragraph
    text: If your symptoms do not improve within a few days or if they become worse,
      check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  subsections:
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    - type: list
      ordered: false
      items:
      - Difficulty in speaking
      - disorientation
      - dizziness
      - fainting
      - irregular heartbeat
      - light-headedness
      - loss of balance or muscle control
    - type: paragraph
      text: 'Check with your doctor immediately if any of the following side effects
        occur:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Loss of balance or muscle control
      - swelling of the mouth
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fast, irregular, pounding, or racing heartbeat or pulse
      - swelling of face, hands, lower legs, or feet
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Breast milk flowing from the nipple
      - dry mouth
      - swelling of the breast in the male
      - headache
      - hives
      - hot flashes
      - itching of skin
      - itching, redness, pain, or swelling of eye
      - menstrual irregularities
      - pain in the breast
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in need to urinate
      - change in appetite
      - constipation
      - diarrhea
      - burning, difficult, or painful urination
      - difficulty in speaking
      - dizziness
      - drowsiness
      - heartburn
      - irritability
      - lack or loss of strength
      - leg cramps
      - mental dullness
      - nervousness
      - palpitations
      - sluggishness
      - stomach cramps
      - thirst
      - tiredness
      - weakness
