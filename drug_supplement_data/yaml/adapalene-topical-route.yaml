title: Adapalene (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Differin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Adapalene is used to treat acne. It works partly by keeping skin pores clear.
  - type: paragraph
    text: Adapalene is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Cream
    - Solution
    - Gel/Jelly
    - Lotion
    - Swab
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies of this medicine have been done only in adult patients, and there
        is no specific information comparing use of adapalene in children up to 12
        years of age with use in other age groups. In teenagers, adapalene is not
        expected to cause different side effects or problems than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of adapalene in the elderly
        with use in other age groups. Older adults are not likely to develop acne.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Eczema or
      - Seborrheic dermatitis—Use of this medicine may cause or increase the irritation
        associated with eczema or seborrheic dermatitis
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine only as directed. Do not
      use more of it, do not use it more often, and do not use it for a longer time
      than your doctor ordered. To do so may cause irritation of the skin.
  - type: paragraph
    text: Do not apply this medicine to windburned or sunburned skin or on open wounds.
  - type: paragraph
    text: Do not use this medicine in or around the eyes, lips, or inside of the nose.
      Spread the medicine away from these areas when applying. If the medicine accidently
      gets on these areas, wash with water at once.
  - type: paragraph
    text: Apply the medicine to clean, dry areas of the skin affected by acne. Rub
      in gently and well. Wash your hands afterwards to remove any medicine that may
      remain on them.
  - type: paragraph
    text: To help clear up your acne completely, it is very important that you keep
      using this medicine for the full time of treatment , even if your symptoms begin
      to clear up after a short time. If you stop using this medicine too soon, your
      acne may return or get worse.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (gel): For acne: Adults and teenagers—Apply a small
        amount as a thin film once a day, at least one hour before bedtime. Apply
        the medicine to dry, clean areas affected by acne. Rub in gently and well.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For acne: Adults and teenagers—Apply a small amount as a thin film once a
        day, at least one hour before bedtime. Apply the medicine to dry, clean areas
        affected by acne. Rub in gently and well. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—Apply a small amount as a thin film once a day, at least
        one hour before bedtime. Apply the medicine to dry, clean areas affected by
        acne. Rub in gently and well.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: During the first 3 weeks you are using adapalene, your acne may seem to
      get worse before it gets better. Full improvement should be seen within 12 weeks,
      especially if you use the medicine every day. You should not stop using adapalene
      if your acne seems worse at first, unless irritation or other symptoms become
      severe. Check with your doctor if your acne does not improve within 8 to 12
      weeks.
  - type: paragraph
    text: 'Do not apply any topical product to the same area where you are using adapalene,
      unless otherwise directed by your doctor. If applied to the same area treated
      with adapalene, the following products may cause mild to severe irritation of
      the skin:'
  - type: list
    ordered: false
    items:
    - Hair products that irritate the skin, such as permanents or hair removal products
    - Skin products for acne (such as clindamycin or erythromycin) or other skin products
      containing a peeling agent (such as benzoyl peroxide, resorcinol, salicylic
      acid, or sulfur)
    - Skin products that cause one to be more sensitive to the sun, such as those
      containing spices or lime
    - Skin products that are too drying or that contain a large amount of alcohol,
      such as astringents, cosmetics, shaving creams, or after-shave lotions
    - Skin products that are abrasive, such as some soaps or skin cleansers
  - type: paragraph
    text: Your doctor may ask you to use other topical products, such as benzoyl peroxide,
      clindamycin, or erythromycin, during your treatment with adapalene. Applying
      the products at different times of the day will lessen the chance of causing
      skin irritation.
  - type: paragraph
    text: If your skin becomes too dry or red at any time, discuss with your doctor
      whether you should continue using adapalene. Applying creams, lotions, or moisturizers
      as needed helps lessen these skin problems.
  - type: paragraph
    text: During treatment with this medicine, avoid getting too much sun on treated
      areas and do not use sunlamps. Since your skin may be more prone to sunburn
      or skin irritation, use sunscreen or sunblocking lotions regularly with a sun
      protection factor (SPF) of 15 or more. Wear protective clothing against sun,
      wind, and cold weather.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning sensation or stinging of skin
      - dryness and peeling of skin
      - itching of skin
      - redness of skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Worsening of acne
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
