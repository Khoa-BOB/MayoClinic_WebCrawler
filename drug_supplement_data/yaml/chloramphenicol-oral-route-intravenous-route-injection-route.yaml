title: Chloramphenicol (oral route, intravenous route, injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Chloromycetin Sodium Succinate
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Chloromycetin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Chloramphenicol is used in the treatment of infections caused by bacteria.
      It works by killing bacteria or preventing their growth.
  - type: paragraph
    text: Chloramphenicol is used to treat serious infections in different parts of
      the body. It is sometimes given with other antibiotics. However, chloramphenicol
      should not be used for colds, flu, other virus infections, sore throats or other
      minor infections, or to prevent infections.
  - type: paragraph
    text: Chloramphenicol should only be used for serious infections in which other
      medicines do not work. This medicine may cause some serious side effects, including
      blood problems and eye problems. Symptoms of the blood problems include pale
      skin, sore throat and fever, unusual bleeding or bruising, and unusual tiredness
      or weakness. You and your doctor should talk about the good this medicine will
      do as well as the risks of taking it .
  - type: paragraph
    text: Chloramphenicol is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Newborn infants are especially sensitive to the side effects of chloramphenicol
        because they cannot remove the medicine from their body as well as older children
        and adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of chloramphenicol in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Cholera Vaccine, Live
      - Exenatide
      - Fosphenytoin
      - Phenytoin
      - Rifampin
      - Tacrolimus
      - Voriconazole
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Ceftazidime
      - Chlorpropamide
      - Cyanocobalamin
      - Cyclosporine
      - Dicumarol
      - Rifapentine
      - Tetanus Toxoid
      - Tolbutamide
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia, bleeding, or other blood problems—Chloramphenicol may cause blood
        problems
    - type: list
      ordered: false
      items:
      - Liver disease—Patients with liver disease may have an increased risk of side
        effects
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Chloramphenicol is best taken with a full glass (8 ounces) of water on an
      empty stomach (either 1 hour before or 2 hours after meals), unless otherwise
      directed by your doctor.
  - type: paragraph
    text: 'For patients taking the oral liquid form of this medicine:'
  - type: list
    ordered: false
    items:
    - Use a specially marked measuring spoon or other device to measure each dose
      accurately. The average household teaspoon may not hold the right amount of
      liquid.
  - type: paragraph
    text: To help clear up your infection completely, keep taking this medicine for
      the full time of treatment, even if you begin to feel better after a few days.
      Do not miss any doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For infections caused by bacteria: For oral dosage forms (capsules and suspension):
        Adults and teenagers—Dose is based on body weight. The usual dose is 12.5
        milligrams (mg) per kilogram (kg) (5.7 mg per pound) of body weight every
        six hours. Children— Infants up to 2 weeks of age: Dose is based on body weight.
        The usual dose is 6.25 mg per kg (2.8 mg per pound) of body weight every six
        hours. Infants 2 weeks of age and older: Dose is based on body weight. The
        usual dose is 12.5 mg per kg (5.7 mg per pound) of body weight every six hours;
        or 25 mg per kg (11.4 mg per pound) of body weight every twelve hours. For
        injection dosage form: Adults and teenagers—Dose is based on body weight.
        The usual dose is 12.5 mg per kg (5.7 mg per pound) of body weight every six
        hours. Children— Infants up to 2 weeks of age: Dose is based on body weight.
        The usual dose is 6.25 mg per kg (2.8 mg per pound) of body weight every six
