    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: It is very important that your doctor check you at regular visits for any
      blood problems that may be caused by this medicine.
  - type: paragraph
    text: Chloramphenicol may cause blood problems. These problems may result in a
      greater chance of infection, slow healing, and bleeding of the gums. Therefore,
      you should be careful when using regular toothbrushes, dental floss, and toothpicks.
      Dental work, whenever possible, should be done before you begin taking this
      medicine or delayed until your blood counts have returned to normal. Check with
      your medical doctor or dentist if you have any questions about proper oral hygiene
      (mouth care) during treatment.
  - type: paragraph
    text: 'For diabetic patients:'
  - type: list
    ordered: false
    items:
    - This medicine may cause false test results with urine sugar tests. Check with
      your doctor before changing your diet or the dosage of your diabetes medicine.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Stop taking this medicine and get emergency help immediately if any of
      the following effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloated stomach
      - drowsiness
      - gray skin color
      - low body temperature
      - uneven breathing
      - unresponsiveness
    - type: paragraph
      text: 'Check with your doctor immediately if any of the following side effects
        occur:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pale skin
      - sore throat and fever
      - unusual bleeding or bruising
      - unusual tiredness or weakness (the above side effects may also occur up to
        weeks or months after you stop taking this medicine)
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion, delirium, or headache
      - eye pain, blurred vision, or loss of vision
      - numbness, tingling, burning pain, or weakness in the hands or feet
      - skin rash, fever, or difficulty in breathing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - nausea or vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
