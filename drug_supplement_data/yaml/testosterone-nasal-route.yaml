title: Testosterone (nasal route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Natesto
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Testosterone nasal gel is used for the treatment of men whose bodies do
      not make enough natural testosterone, a condition called hypogonadism. Testosterone
      is a male hormone responsible for the growth and development of the male sex
      organs and maintenance of secondary sex characteristics. This medicine is not
      for use in female patients .
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Gel/Jelly
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of testosterone nasal gel in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of testosterone nasal gel in the
        elderly. However, elderly patients may be at an increased risk for developing
        heart and blood vessel problems, or prostate problems (including enlarged
        prostate), which may require caution in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Anisindione
      - Apixaban
      - Azathioprine
      - Bupropion
      - Dabigatran Etexilate
      - Dicumarol
      - Edoxaban
      - Insulin
      - Insulin Aspart, Recombinant
      - Insulin Bovine
      - Insulin Degludec
      - Insulin Detemir
      - Insulin Glulisine
      - Insulin Lispro, Recombinant
      - Levoketoconazole
      - Mercaptopurine
      - Methotrexate
      - Paclitaxel
      - Paclitaxel Protein-Bound
      - Phenprocoumon
      - Rivaroxaban
      - Warfarin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Licorice
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood clotting problems (eg, deep vein thrombosis, pulmonary embolism) or
      - Diabetes or
      - Drug use disorder, history of or
      - Enlarged prostate or
      - Heart attack, history of or
      - Hypercalcemia (high calcium in the blood) or
      - Hyperlipidemia (high lipid or cholesterol in the blood) or
      - Hypertension (high blood pressure) or
      - Liver disease or
      - Problems with passing urine or
      - Sleep apnea or
      - Stroke, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Blood disorder (eg, polycythemia)—May increase risk for thromboembolic diseases.
    - type: list
      ordered: false
      items:
      - Breast cancer or
      - Prostate cancer, known or suspected—Should not be used in patients with these
        conditions.
    - type: list
      ordered: false
      items:
      - Deviated anterior nasal septum (fracture in your nose that cause the inside
        of your nose to be crooked), or history of or
      - Fracture in your nose, within the previous 6 months or
      - Hypertension (high blood pressure), uncontrolled or
      - Mucosal inflammatory disorders (eg, Sjögren's syndrome) or
      - Nose disorders, history of or
      - Nose or sinus surgery, history of—Use is not recommended in patients with
        these conditions.
    - type: list
      ordered: false
      items:
      - Heart disease (eg, congestive heart failure) or
      - Kidney disease or
      - Liver disease—Use with caution. Testosterone may cause edema (fluid retention)
        in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Lung disease, chronic or
      - Obesity—Use with caution. May increase risk for more side effects.
    - type: list
      ordered: false
      items:
      - Rhinitis, severe—Use of a different testosterone product should be considered
        in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Your doctor will test the testosterone levels in your blood before you start
      and while you are using this medicine.
  - type: paragraph
    text: Use this medicine only as directed . Do not use more of it and do not use
      it more often than your doctor ordered. To do so may increase the chance of
      side effects.
  - type: paragraph
    text: This medicine comes with a patient information leaflet and patient instructions.
      Read and follow these instructions carefully. Ask your doctor if you have any
      questions.
  - type: paragraph
    text: This medicine is for use only in the nose . Do not get any of it in your
      eyes or on your skin. If it does get on these areas, rinse it off right away.
  - type: paragraph
    text: 'To use:'
  - type: list
    ordered: false
    items:
    - If you are using this medicine for the first time, you will need to prime the
      pump. To do this, hold the Natesto® pump over a sink, turn it upside down, and
      slowly press the pump for 10 times.
    - If any medicine comes out during priming, discard it into the sink and rinse
      down the drain with warm water.
    - Wipe the tip with a clean, dry tissue if there is any medicine left on the tip
      of the pump. Now it is ready to use.
    - If you get the medicine on your hands, wash it away with warm water and soap.
    - Gently blow your nose to clear the nostrils.
    - While looking in the mirror, insert the tip of the pump into your left nostril
      and gently tilt it so that it touches the side wall of your nostrils to ensure
      it is applied properly.
    - Slowly press the pump until it stops and remove the tip slowly from your nose.
    - Do the same steps applying the medicine into your right nostril.
    - After using the pump, wipe the tip with a clean, dry tissue and put the cap
      back on.
    - Press your nostrils together just below the middle of your nose and lightly
      rub them together.
    - Do not blow your nose or sniff 1 hour after using this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For nasal dosage form (gel): For hormone replacement: Adults—1 pump actuation
        in each nostril 3 times a day (morning, afternoon, and night) 6 to 8 hours
        apart. Each pump contains 5.5 milligrams (mg) of testosterone. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For hormone replacement: Adults—1 pump actuation in each nostril 3 times
        a day (morning, afternoon, and night) 6 to 8 hours apart. Each pump contains
        5.5 milligrams (mg) of testosterone. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—1 pump actuation in each nostril 3 times a day (morning, afternoon,
        and night) 6 to 8 hours apart. Each pump contains 5.5 milligrams (mg) of testosterone.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep the medicine in a safe place. Do not give it to anyone else, even
        if you have the same symptoms.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress while you are
      using this medicine. This will allow your doctor to see if the medicine is working
      properly and to decide if you should continue to use it. Blood and urine tests
      may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not use Natesto® together with other medicines given into your nose (eg,
      oxymetazoline), unless your doctor says it is okay.
  - type: paragraph
    text: This medicine should not be used by female patients, especially if pregnant
      or breastfeeding . Testosterone may cause birth defects if a pregnant woman
      comes in contact with the medicine. Make sure your doctor knows if your sexual
      partner is pregnant. If a pregnancy occurs while you are using this medicine,
      tell your doctor right away.
  - type: paragraph
    text: This medicine may cause nasal problems. Check with your doctor right away
      if you have a runny nose, congestion, sneezing, nosebleeds, nasal discomfort,
      nasal scabbing, or nasal dryness while using this medicine.
  - type: paragraph
    text: This medicine may cause blood clotting problems (eg, deep vein thrombosis,
      pulmonary embolism). Check with your doctor right away if you have a chest pain,
      trouble breathing, coughing up blood, numbness or weakness in your arm or leg,
      or on one side of your body, or pain in your lower leg (calf) while using this
      medicine.
  - type: paragraph
    text: This medicine may increase your risk of having heart or blood vessel problems,
      including heart attack or stroke. Tell your doctor right away if you have chest
      pain that may spread to your arms, jaw, back, or neck, faintness, headache,
      nausea, vomiting, trouble breathing, trouble seeing or speaking, or unusual
      sweating.
  - type: paragraph
    text: This medicine may increase the risk of prostate cancer, especially in older
      males. Make sure your doctor knows if you have prostate cancer, or if anyone
      in your family has prostate cancer.
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. You might need to measure
      your blood pressure at home. If you think your blood pressure is too high, call
      your doctor right away.
  - type: paragraph
    text: This medicine may be habit-forming. If you feel that the medicine is not
      working as well, do not use more than your prescribed dose. Call your doctor
      for instructions.
  - type: paragraph
    text: In some cases, this medicine may decrease the amount of sperm men make and
      affect their ability to have children. If you plan to have children, talk with
      your doctor before using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may cause edema (fluid and sodium retention). Check with your
      doctor right away if you have a decrease in amount of urine, swelling of the
      fingers, hands, feet, or lower legs, trouble breathing, or weight gain.
  - type: paragraph
    text: This medicine may cause swelling of the breasts (gynecomastia) and breast
      pain in some patients. If you have questions about this, talk to your doctor.
  - type: paragraph
    text: This medicine may cause changes in the level of cholesterol and fats in
      your blood. If this condition occurs, your doctor may give you medicine to control
      the cholesterol and fat levels. Talk to your doctor if you have concerns.
  - type: paragraph
    text: Hypercalcemia (high calcium in the blood) may occur in patients taking this
      medicine. Check with your doctor right away if you have stomach pain, confusion,
      constipation, depression, dry mouth, increased urination, loss of appetite,
      metallic taste, or muscle weakness.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      you have surgery or medical tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Discomfort in the nose
      - fever
      - headache
      - muscle aches
      - sore throat
      - stuffy or runny nose
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody nose
      - body aches or pain
      - chest tightness
      - chills
      - cough
      - difficulty with breathing
      - ear congestion
      - loss of voice
      - pain or tenderness around the eyes and cheekbones
      - sneezing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blurred vision
      - chest pain or discomfort
      - confusion
      - difficulty speaking
      - dizziness or lightheadedness
      - double vision
      - fainting
      - fast heartbeat
      - inability to move the arms, legs, or facial muscles
      - inability to speak
      - nausea
      - nervousness
      - pain in the chest, groin, or legs, especially the calves
      - pain or discomfort in arms, jaw, back, or neck
      - pain, redness, or swelling in the arm or leg
      - pounding in the ears
      - slow or fast heartbeat
      - slurred speech
      - sudden, severe weakness or numbness in the arm or leg
      - sudden loss of coordination
      - sweating
      - trouble breathing
      - vision changes
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change in sense of smell
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
