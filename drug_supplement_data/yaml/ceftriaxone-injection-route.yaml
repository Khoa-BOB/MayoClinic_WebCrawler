title: Ceftriaxone (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Rocephin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ceftriaxone is used to treat bacterial infections in many different parts
      of the body. This medicine is also given before certain types of surgery to
      prevent infections.
  - type: paragraph
    text: Ceftriaxone belongs to the class of medicines known as cephalosporin antibiotics.
      It works by killing bacteria or preventing their growth. However, this medicine
      will not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of ceftriaxone in children. Because
        of ceftriaxone's toxicity, use in newborn and premature babies is not recommended.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of ceftriaxone in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Calcium Acetate
      - Calcium Chloride
      - Calcium Gluceptate
      - Calcium Gluconate
      - Lactated Ringer's Solution
      - Ringer's Solution
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Cholera Vaccine, Live
      - Warfarin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anemia or
      - Diarrhea or
      - Gallbladder disease or
      - Pancreatitis (inflammation of the pancreas) or
      - Stomach or bowel disease (e.g., colitis), history of—Use with caution. May
        make these conditions worse.
    - type: list
      ordered: false
      items:
      - Hyperbilirubinemia (high bilirubin in the blood)—Should not be used in newborn
        (less than 28 days of age) and premature infants with this condition.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. Effects may be increased because of slower
        removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Liver disease, severe or
      - Undernourished condition—May be worsened by ceftriaxone and you may need to
        take Vitamin K.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given as a shot into one of your muscles or through a needle
      placed in one of your veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you have itching; hives; hoarseness; shortness of
      breath; trouble breathing; trouble swallowing; or any swelling of your hands,
      face, or mouth after you receive this medicine.
  - type: paragraph
    text: Ceftriaxone may cause diarrhea, and in some cases it can be severe. Do not
      take any medicine to treat diarrhea without first checking with your doctor.
      Diarrhea medicines may make the diarrhea worse or make it last longer. If you
      have any questions about this or if mild diarrhea continues or gets worse, check
      with your doctor.
  - type: paragraph
    text: Pancreatitis may occur while you are using this medicine. Tell your doctor
      right away if you have sudden and severe stomach pain, chills, constipation,
      nausea, vomiting, fever, or lightheadedness.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes calcium-containing solutions for injection, prescription or nonprescription
      (over-the-counter [OTC]) medicines and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chest pain
      - chills
      - cough
      - fever
      - painful or difficult urination
      - shortness of breath
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swollen glands
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach cramps or tenderness
      - back, leg, or stomach pains
      - bleeding gums
      - bloating
      - blood in the urine or stools
      - bloody nose
      - bluish color
      - changes in skin color
      - clay-colored stools
      - convulsions
      - cough or hoarseness
      - dark urine
      - diarrhea, watery and severe, which may also be bloody
      - difficulty with breathing
      - difficulty with swallowing
      - dizziness
      - fast, irregular, pounding, or racing heartbeat or pulse
      - feeling of discomfort
      - feeling of warmth
      - fever with or without chills
      - general body swelling
      - general feeling of tiredness or weakness
      - headache
      - hives
      - increased sweating
      - increased thirst
      - inflammation of the joints
      - itching
      - loss of appetite
      - lower back or side pain
      - muscle aches
      - nausea or vomiting
      - noisy breathing
      - nosebleeds
      - pain
      - pale skin
      - pinpoint red spots on the skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rash
      - redness of the face, neck, arms, and occasionally, upper chest
      - shortness of breath
      - skin rash
      - swelling of the foot or leg
      - swollen lymph glands
      - tenderness
      - tightness in the chest
      - troubled breathing with exertion
      - unpleasant breath odor
      - unusual weight loss
      - vomiting of blood
      - watery or bloody diarrhea
      - wheezing
      - yellowing of the eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - chest pain
      - coughing up blood
      - decrease in the amount of urine
      - excessive muscle tone
      - increased menstrual flow or vaginal bleeding
      - muscle stiffness, tension, or tightness
      - nosebleeds
      - paralysis
      - prolonged bleeding from cuts
      - red irritated eyes
      - red or black, tarry stools
      - red or dark brown urine
      - red skin lesions, often with a purple center
      - restlessness
      - skin rash with a general disease
      - swelling
      - trouble sitting still
      - unpleasant breath odor
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - bloated
      - change in taste
      - dizziness
      - excess air or gas in the stomach or intestines
      - full feeling
      - headache
      - heartburn
      - indigestion
      - itching of the vagina or genital area
      - loss of taste
      - pain during sexual intercourse
      - passing gas
      - stomach discomfort, upset, or pain
      - thick, white vaginal discharge with no odor or with a mild odor
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hives or welts
      - redness, swelling, or soreness of the tongue
      - swelling or inflammation of the mouth
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
