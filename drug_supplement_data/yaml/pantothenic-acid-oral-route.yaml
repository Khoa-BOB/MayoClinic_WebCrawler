title: Pantothenic acid (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Panto-250
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Vitamins are compounds that you must have for growth and health. They are
      needed in only small amounts and are usually available in the foods that you
      eat. Pantothenic acid (vitamin B 5) is needed for the breakdown of carbohydrates,
      proteins, and fats.
  - type: paragraph
    text: No problems have been found that are due to a lack of pantothenic acid alone.
      However, a lack of one B vitamin usually goes along with a lack of others, so
      pantothenic acid is often included in B complex products.
  - type: paragraph
    text: Claims that pantothenic acid is effective for treatment of nerve damage,
      breathing problems, itching and other skin problems, and poisoning with some
      other drugs; for getting rid of or preventing gray hair; for preventing arthritis,
      allergies, and birth defects; or for improving mental ability have not been
      proven.
  - type: paragraph
    text: This vitamin is available without a prescription.
  subsections:
  - heading: Importance Of Diet
    level: 3
    content:
    - type: paragraph
      text: For good health, it is important that you eat a balanced and varied diet.
        Follow carefully any diet program your health care professional may recommend.
        For your specific dietary vitamin and/or mineral needs, ask your health care
        professional for a list of appropriate foods. If you think that you are not
        getting enough vitamins and/or minerals in your diet, you may choose to take
        a dietary supplement.
    - type: paragraph
      text: Pantothenic acid is found in various foods including peas and beans (except
        green beans), lean meat, poultry, fish, and whole-grain cereals. Little pantothenic
        acid is lost from foods with ordinary cooking.
    - type: paragraph
      text: Vitamins alone will not take the place of a good diet and will not provide
        energy. Your body also needs other substances found in food—protein, minerals,
        carbohydrates, and fat.
    - type: paragraph
      text: The daily amount of pantothenic acid needed is defined in several different
        ways.
    subsections: []
  - heading: For U.S.—
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Recommended Dietary Allowances (RDAs) are the amount of vitamins and minerals
        needed to provide for adequate nutrition in most healthy persons. RDAs for
        a given nutrient may vary depending on a person's age, sex, and physical condition
        (e.g., pregnancy).
      - Daily Values (DVs) for nutrients are used on food and dietary supplement labels
        to indicate the percent of the recommended daily amount of each nutrient that
        a serving provides. DVs replace the previous designation of United States
        Recommended Daily Allowances (USRDAs).
    subsections: []
  - heading: For Canada—
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Recommended Nutrient Intakes (RNIs) are used to determine the amounts of vitamins,
        minerals, and protein needed to provide adequate nutrition and lessen the
        risk of chronic disease.
    - type: paragraph
      text: 'Because lack of pantothenic acid is so rare, there is no RDA or RNI for
        this vitamin. The following daily intakes are thought to be plenty for most
        individuals:'
    - type: list
      ordered: false
      items:
      - 'Infants and children— Birth to 3 years of age: 2 to 3 milligrams (mg). 4
        to 6 years of age: 3 to 4 mg. 7 to 10 years of age: 4 to 5 mg.'
      - Adolescents and adults—4 to 7 mg.
    - type: list
      ordered: false
      items:
      - 'Birth to 3 years of age: 2 to 3 milligrams (mg).'
      - '4 to 6 years of age: 3 to 4 mg.'
      - '7 to 10 years of age: 4 to 5 mg.'
    - type: paragraph
      text: 'This product is available in the following dosage forms:'
    - type: list
      ordered: false
      items:
      - Suspension
      - Tablet
      - Capsule
    subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'If you are taking this dietary supplement without a prescription, carefully
      read and follow any precautions on the label. For this supplement, the following
      should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Problems in children have not been reported with intake of normal daily
        recommended amounts.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Problems in older adults have not been reported with intake of normal
        daily recommended amounts.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content: []
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (capsules, tablets, oral solution): To prevent deficiency,
        the amount taken by mouth is based on normal daily recommended intakes: Adults
        and teenagers—4 to 7 milligrams (mg) per day. Children 7 to 10 years of age—4
        to 5 mg per day. Children 4 to 6 years of age—3 to 4 mg per day. Children
        birth to 3 years of age—2 to 3 mg per day. To treat deficiency: Adults, teenagers,
        and children—Treatment dose is determined by prescriber for each individual
        based on severity of deficiency.'
    - type: list
      ordered: false
      items:
      - 'To prevent deficiency, the amount taken by mouth is based on normal daily
        recommended intakes: Adults and teenagers—4 to 7 milligrams (mg) per day.
        Children 7 to 10 years of age—4 to 5 mg per day. Children 4 to 6 years of
        age—3 to 4 mg per day. Children birth to 3 years of age—2 to 3 mg per day.'
      - 'To treat deficiency: Adults, teenagers, and children—Treatment dose is determined
        by prescriber for each individual based on severity of deficiency.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—4 to 7 milligrams (mg) per day.
      - Children 7 to 10 years of age—4 to 5 mg per day.
      - Children 4 to 6 years of age—3 to 4 mg per day.
      - Children birth to 3 years of age—2 to 3 mg per day.
    - type: list
      ordered: false
      items:
      - Adults, teenagers, and children—Treatment dose is determined by prescriber
        for each individual based on severity of deficiency.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the dietary supplement in a closed container at room temperature,
        away from heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
