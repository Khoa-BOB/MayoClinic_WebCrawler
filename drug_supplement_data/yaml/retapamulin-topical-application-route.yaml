title: Retapamulin (topical application route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Altabax
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Retapamulin is used to treat a bacterial skin infection called impetigo.
      This medicine is a topical antibiotic .
  - type: paragraph
    text: This medicine is available only with your doctor's prescription .
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Ointment
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of retapamulin in children below 9 months of age. Safety and
        efficacy have not been established .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatrics-specific
        problems that would limit the usefulness of retapamulin in the elderly .
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Atazanavir
      - Boceprevir
      - Clarithromycin
      - Cobicistat
      - Conivaptan
      - Indinavir
      - Itraconazole
      - Ketoconazole
      - Lopinavir
      - Nefazodone
      - Nelfinavir
      - Posaconazole
      - Ritonavir
      - Saquinavir
      - Telaprevir
      - Telithromycin
      - Tipranavir
      - Voriconazole
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Skin infections (other than impetigo)—This medicine should not be used in
        other skin problems .
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine is for use on the skin only. Do not get it in your eyes, nose,
      mouth, or vagina. Do not use on skin areas that have cuts or scrapes. If it
      does get on these areas, rinse it off right away .
  - type: paragraph
    text: Wash your hands with soap and water before using this medicine. Also wash
      your hands with soap and water after using this medicine if the hands are not
      the area for treatment .
  - type: paragraph
    text: Before applying this medicine, wash the affected area with soap and water,
      and dry thoroughly. Then apply a thin layer to the affected area and rub in
      gently .
  - type: paragraph
    text: After applying this medicine, the treated area may be covered with a sterile
      bandage or gauze dressing if desired .
  - type: paragraph
    text: Keep using this medicine for the full treatment time, even if your symptoms
      have improved after the first few doses. Your infection may not clear up if
      you stop using the medicine too soon .
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (ointment): For impetigo: Adults and children 9 months
        of age and older—Apply to the affected area of the skin two times a day for
        5 days. Children below 9 months of age—Use and dose must be determined by
        your doctor .'
    - type: list
      ordered: false
      items:
      - 'For impetigo: Adults and children 9 months of age and older—Apply to the
        affected area of the skin two times a day for 5 days. Children below 9 months
        of age—Use and dose must be determined by your doctor .'
    - type: list
      ordered: false
      items:
      - Adults and children 9 months of age and older—Apply to the affected area of
        the skin two times a day for 5 days.
      - Children below 9 months of age—Use and dose must be determined by your doctor
        .
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your skin infection does not improve within 3 to 4 days, or if it becomes
      worse, check with your doctor .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, itching, redness, skin rash, swelling, or soreness at site
      - skin rash, encrusted, scaly, and oozing
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, burning, crusting, dryness, flaking of skin
      - flushing, redness of skin
      - itching, scaling, severe redness, soreness, swelling of skin
      - pain at site of application
      - unusually warm skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - fever
      - headache
      - muscle aches
      - nausea
      - sore throat
      - stuffy or runny nose
      - unusual tiredness or weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
