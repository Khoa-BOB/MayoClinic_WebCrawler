title: Thiothixene (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Navane
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Thiothixene is used to treat a mental condition called schizophrenia. This
      medicine should not be used to treat behavioral problems in older adult patients
      who have dementia.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: The use of thiothixene in children younger than 12 years of age is not
        recommended.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of thiothixene in geriatric patients. However, this medicine should not be
        used for behavioral problems in older adults with dementia.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bromopride
      - Metoclopramide
      - Potassium Chloride
      - Potassium Citrate
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Amantadine
      - Apomorphine
      - Benzhydrocodone
      - Buprenorphine
      - Bupropion
      - Cabergoline
      - Clomipramine
      - Clozapine
      - Codeine
      - Cyclobenzaprine
      - Dihydrocodeine
      - Glucagon
      - Glycopyrrolate
      - Glycopyrronium Tosylate
      - Hydrocodone
      - Hydromorphone
      - Hydroxychloroquine
      - Insulin Aspart, Recombinant
      - LetibotulinumtoxinA-wlbg
      - Lithium
      - Meperidine
      - Methacholine
      - Methadone
      - Morphine
      - Morphine Sulfate Liposome
      - Olanzapine
      - Oliceridine
      - Oxycodone
      - Oxymorphone
      - Promethazine
      - Quetiapine
      - Revefenacin
      - Scopolamine
      - Secretin Human
      - Sofpironium
      - Sufentanil
      - Tapentadol
      - Tiotropium
      - Tramadol
      - Zotepine
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Betel Nut
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood or bone marrow problems (e.g., agranulocytosis, leukopenia, neutropenia)
        or
      - Central nervous system depression (severe drowsiness or loss of consciousness)
        or
      - Circulatory collapse (shock-like state)—Should not be used in patients with
        these conditions.
    - type: list
      ordered: false
      items:
      - Breast cancer, prolactin-dependent or
      - Eye or vision problems (e.g., pigmentary retinopathy, lenticular pigmentation)
        or
      - Heart or blood vessel disease or
      - Hyperprolactinemia (high prolactin in the blood) or
      - Liver disease or
      - Neuroleptic malignant syndrome (NMS), history of or
      - Seizures, history of—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For schizophrenia: Adults and teenagers
        12 years of age and older—At first, 2 milligrams (mg) three times per day
        or 5 mg two times per day. Your doctor may increase your dose as needed. However,
        the dose is usually not more than 60 mg per day. Children younger than 12
        years of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For schizophrenia: Adults and teenagers 12 years of age and older—At first,
        2 milligrams (mg) three times per day or 5 mg two times per day. Your doctor
        may increase your dose as needed. However, the dose is usually not more than
        60 mg per day. Children younger than 12 years of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers 12 years of age and older—At first, 2 milligrams (mg)
        three times per day or 5 mg two times per day. Your doctor may increase your
        dose as needed. However, the dose is usually not more than 60 mg per day.
      - Children younger than 12 years of age—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects. You may also need to have your eyes tested on
      a regular basis while you are using this medicine.
  - type: paragraph
    text: 'This medicine may cause tardive dyskinesia (a movement disorder). Check
      with your doctor right away if you have any of the following symptoms while
      using this medicine: lip smacking or puckering, puffing of the cheeks, rapid
      or worm-like movements of the tongue, uncontrolled chewing movements, or uncontrolled
      movements of the arms and legs.'
  - type: paragraph
    text: 'Stop using this medicine and check with your doctor right away if you have
      any of the following symptoms while using this medicine: convulsions (seizures),
      difficulty with breathing, a fast heartbeat, a high fever, high or low blood
      pressure, increased sweating, loss of bladder control, severe muscle stiffness,
      unusually pale skin, or tiredness. These could be symptoms of a serious condition
      called neuroleptic malignant syndrome (NMS).'
  - type: paragraph
    text: Thiothixine can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. If you can, avoid people
      with infections. Check with your doctor right away if you think you are getting
      an infection, or if you have a fever or chills, a cough or hoarseness, lower
      back or side pain, or painful or difficult urination.
  - type: paragraph
    text: This medicine may cause dizziness, trouble with thinking, or trouble with
      controlling body movements. Make sure you know how you react to this medicine
      before you drive, use machines, or do anything else that requires you to be
      alert, well-coordinated, or able to think well .
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for allergies or colds; sedatives, tranquilizers,
      or sleeping medicine; prescription pain medicines, including narcotics; medicine
      for seizures (e.g., barbiturates); muscle relaxants; or anesthetics, including
      some dental anesthetics. Check with your doctor before taking any of the above
      while you are using this medicine .
  - type: paragraph
    text: You might get overheated more easily while using this medicine. Be aware
      of this if you are exercising or the weather is hot. Drinking water might help.
      If you get too hot and feel dizzy, weak, tired, confused, or sick to your stomach,
      try to cool down. Call your doctor if you are not able to cool your body and
      your symptoms continue.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cough
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - hives
      - itching
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - shortness of breath
      - skin rash
      - tightness in the chest
      - unusual tiredness or weakness
      - wheezing
    subsections: []
