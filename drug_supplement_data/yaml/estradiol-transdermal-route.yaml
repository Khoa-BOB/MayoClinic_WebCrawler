  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is not recommended. Your
        doctor may decide not to treat you with this medication, change some of the
        other medicines you take, or give you special instructions about the use of
        food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Tobacco
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Caffeine
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Abnormal or unusual vaginal bleeding or
      - Blood clots (eg, deep vein thrombosis, pulmonary embolism), active or history
        of or
      - Breast cancer, known or suspected, or history of or
      - Dementia or
      - Heart attack, active or recent (within the past 12 months) or
      - Heart or blood vessel disease or
      - Liver disease or
      - Protein C, protein S deficiency, or antithrombin deficiency, or other known
        blood clotting disorders or
      - Stroke, active or recent (within the past 12 months) or
      - Surgery with a long period of inactivity or
      - Tumors (estrogen-dependent), known or suspected—Should not be used in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Asthma or
      - Cancer, history of or
      - Diabetes or
      - Edema (fluid retention or body swelling) or
      - Endometriosis or
      - Epilepsy (seizures) or
      - Gallbladder disease or
      - Hereditary angioedema (swelling of the face, lips, tongue, or throat) or
      - Hypercalcemia (high calcium in the blood) or
      - Hypertension (high blood pressure) or
      - Hypertriglyceridemia (high triglycerides or fats in the blood) or
      - Hypocalcemia (low calcium in the blood), severe or
      - Hypothyroidism (an underactive thyroid) or
      - Jaundice during pregnancy or from using hormonal therapy in the past or
      - Kidney disease or
      - Liver tumors or
      - Migraine headache or
      - Obesity or
      - Porphyria (an enzyme problem) or
      - Systemic lupus erythematosus (SLE)—Use with caution. May make these conditions
        worse.
