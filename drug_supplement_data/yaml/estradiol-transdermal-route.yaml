    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you forget to wear or change a patch, put one on as soon as you can.
        If it is almost time to put on your next patch, wait until then to apply a
        new patch and skip the one you missed. Do not apply extra patches to make
        up for a missed dose.
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: Do not use Evamist® spray if it has been more than 12 hours since you
        missed your last dose.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the patches at room temperature in a closed container, away from
        heat, moisture, and direct light.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly and does not cause unwanted effects.
      These visits may be every 3 to 6 months. Pelvic exam, breast exam, and mammogram
      (breast x-ray) may be needed to check for unwanted effects, unless your doctor
      tells you otherwise. Be sure to keep all appointments.
  - type: paragraph
    text: It is unlikely that a postmenopausal woman may become pregnant. But, you
      should know that using this medicine while you are pregnant could harm your
      unborn baby. If you think you have become pregnant while using the medicine,
      tell your doctor right away.
  - type: paragraph
    text: Using this medicine may increase your risk for having blood clots, strokes,
      or heart attacks. This risk may continue even after you stop using the medicine.
      Your risk for these serious problems is even greater if you have high blood
      pressure, high cholesterol in your blood, diabetes, or if you are overweight
      or smoke cigarettes. Contact your doctor immediately if you experience confusion,
      difficulty speaking, double vision, headaches, an inability to move arms, legs
      or facial muscle, or an inability to speak.
  - type: paragraph
    text: Using this medicine over a long period of time may increase your risk of
      breast cancer, endometrial cancer, or uterine cancer. Do not use this medicine
      if you have had your uterus (womb) removed (hysterectomy). Check with your doctor
      immediately if you experience abnormal vaginal bleeding.
  - type: paragraph
    text: Using this medicine may increase your risk of dementia, especially in women
      65 years of age and older.
  - type: paragraph
    text: Using this medicine may increase your risk for gallbladder disease. Talk
      with your doctor about this risk.
  - type: paragraph
    text: Tell the medical doctor or dentist in charge that you are using this medicine
      before any kind of surgery (including dental surgery) or emergency treatment.
      Your doctor will decide whether you should continue using this medicine. This
      medicine may also affect the results of certain medical tests.
  - type: paragraph
    text: Check with your doctor immediately if severe headache or sudden loss of
      vision or any other change in vision occurs while you are using this medicine.
      Your doctor may want you to have your eyes checked by an ophthalmologist (eye
      doctor).
  - type: paragraph
    text: This medicine may cause a serious type of allergic reaction, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are using this medicine.
  - type: paragraph
    text: Check with your child's doctor right away if your child starts to have nipple
      or breast swelling or tenderness in females, or enlargement of the breasts in
      males. Your child may have been exposed to this medicine.
  - type: paragraph
    text: Do not allow your pets to lick or touch the arm where this medicine was
      applied. Small pets may be sensitive to this medicine. Call your pet's veterinarian
      if your pet starts to have nipple or breast enlargement, swelling of the vulva,
      or any signs of illness.
  - type: paragraph
    text: Do not take other medicines or drink grapefruit juice unless you discuss
      it with your doctor. This includes prescription or nonprescription (over-the-counter
      [OTC]) medicines and herbal (eg, St. John's wort) or vitamin supplements.
