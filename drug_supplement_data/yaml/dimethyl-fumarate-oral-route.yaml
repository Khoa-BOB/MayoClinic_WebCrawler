title: Dimethyl fumarate (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Tecfidera
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Dimethyl fumarate is used to treat the relapsing forms of multiple sclerosis
      (MS), including clinically isolated syndrome, relapsing-remitting disease, and
      active secondary progressive disease. This medicine will not cure MS, but it
      may slow some disabling effects and decrease the number of relapses of the disease.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule, Delayed Release
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of dimethyl fumarate in the pediatric population. Safety and
        efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Although appropriate studies on the relationship of age to the effects
        of dimethyl fumarate have not been performed in the geriatric population,
        geriatric-specific problems are not expected to limit the usefulness of dimethyl
        fumarate in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Diroximel Fumarate
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Infection (eg, herpes zoster) or
      - Lymphopenia (low white blood cells) or
      - Weak immune system—May decrease your body's ability to fight infections.
    - type: list
      ordered: false
      items:
      - Stomach or bowel problems or
      - Liver disease—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Swallow the delayed-release capsule whole. Do not crush or chew it. Do not
      sprinkle the contents of the capsule on food.
  - type: paragraph
    text: Take this medicine with or without food. You may have less skin flushing
      if you take the medicine with food.
  - type: paragraph
    text: Your doctor may give you other medicine (eg, aspirin) to be taken 30 minutes
      before taking Tecfidera® to help reduce skin flushing.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (delayed-release capsules): For multiple sclerosis:
        Adults—At first, 120 milligrams (mg) 2 times a day. After 7 days, your doctor
        will increase your dose to 240 mg 2 times a day. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For multiple sclerosis: Adults—At first, 120 milligrams (mg) 2 times a day.
        After 7 days, your doctor will increase your dose to 240 mg 2 times a day.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 120 milligrams (mg) 2 times a day. After 7 days, your doctor
        will increase your dose to 240 mg 2 times a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in its original container. Protect from light.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Call your doctor right away if you have a rash, itching, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      while you are using this medicine.
  - type: paragraph
    text: This medicine can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection (including herpes zoster).
      Avoid being near people who are sick or have infections while you are using
      this medicine. Wash your hands often. Tell your doctor if you have any kind
      of infection before you start using this medicine. Also tell your doctor if
      you have ever had an infection that would not go away or an infection that kept
      coming back.
  - type: paragraph
    text: Check with your doctor right away if you think you are getting an infection
      or if you get a fever, chills, cough, hoarseness, lower back or side pain, painful
      or difficult urination, burning or stinging of the skin, painful cold sores
      or blisters on the lips, nose, eyes, genitals, or trunk of body, chest pain,
      coughing or spitting up blood, sore throat, muscle aches, night sweats, trouble
      breathing, or unusual tiredness.
  - type: paragraph
    text: This medicine may increase your risk of developing a serious and rare brain
      infection called progressive multifocal leukoencephalopathy (PML). Check with
      your doctor right away if you have vision changes, loss of coordination, clumsiness,
      memory loss, difficulty speaking or understanding what others say, or weak legs.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may cause skin flushing. Tell your doctor right away if you
      have warmth, redness, itching, or a burning sensation in your face, neck, arms,
      or upper chest while using this medicine.
  - type: paragraph
    text: Make sure your doctor knows if you are pregnant or planning to become pregnant
      before using this medicine.
  - type: paragraph
    text: This medicine may cause serious stomach or bowel problems (eg, bleeding,
      blockage, perforation, or ulcers). Check with your doctor right away if you
      have black, tarry stools, constipation, diarrhea, fever, heartburn, indigestion,
      nausea, stomach pain, cramps, or burns, or vomiting of blood or material that
      looks like coffee grounds.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - cough
      - feeling of warmth
      - fever
      - hoarseness
      - lower back or side pain
      - painful or difficult urination
      - redness of the face, neck, arms, and occasionally, upper chest
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chest pain or tightness
      - constipation
      - diarrhea
      - difficulty with swallowing
      - dizziness
      - fast heartbeat
      - heartburn
      - hives, itching, or skin rash
      - indigestion
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - nausea
      - painful blisters on the trunk of the body
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - stomach pain, cramps, or burns
      - swollen glands
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting of blood or material that looks like coffee ground
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - stomach discomfort or upset
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
