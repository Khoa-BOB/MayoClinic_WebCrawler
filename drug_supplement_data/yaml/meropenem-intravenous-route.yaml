title: Meropenem (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Merrem IV
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Meropenem injection is used to treat infections caused by bacteria. It works
      by killing the bacteria or preventing their growth. This medicine will not work
      for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of meropenem injection in children
        3 months of age and older with complicated skin and skin structure infections
        and bacterial meningitis, and for children with intra-abdominal infections.
        Safety and efficacy have been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of meropenem injection in the elderly.
        However, elderly patients are more likely to have age-related kidney problems,
        which may require caution and an adjustment in the dose for patients receiving
        meropenem injection.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Bupropion
      - Cholera Vaccine, Live
      - Clomipramine
      - Desogestrel
      - Dienogest
      - Drospirenone
      - Estetrol
      - Estradiol
      - Ethinyl Estradiol
      - Ethynodiol
      - Etonogestrel
      - Gestodene
      - Levonorgestrel
      - Medroxyprogesterone
      - Mestranol
      - Nitisinone
      - Nomegestrol
      - Norelgestromin
      - Norethindrone
      - Norgestimate
      - Norgestrel
      - Segesterone
      - Ulipristal
      - Valproic Acid
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Probenecid
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to penicillins, cephalosporins, or other allergens, history of—Use
        may increase the risk for an allergic reaction to reoccur.
    - type: list
      ordered: false
      items:
      - Brain infection (eg, meningitis) caused by bacteria or
      - Brain lesion (eg, tumor) or
      - Seizures, history of—May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects of may be increased because of
        slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this medicine. It is given through an IV catheter that is placed into one of
      your veins. The medicine must be injected slowly, so the IV will need to stay
      in place for at least 15 to 30 minutes.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check you or your child's progress
      closely while you are receiving this medicine. This will allow your doctor to
      see if the medicine is working properly and to decide if you should continue
      to receive it.
  - type: paragraph
    text: Meropenem may cause serious allergic reactions, including anaphylaxis, which
      can be life-threatening and requires immediate medical attention. Tell your
      doctor or nurse right away if you or your child have itching, hives, hoarseness,
      trouble breathing, trouble swallowing, or any swelling of your hands, face,
      or mouth after receiving this medicine.
  - type: paragraph
    text: Serious skin reactions, including erythema multiforme, Stevens-Johnson syndrome,
      toxic epidermal necrolysis, drug reaction with eosinophilia and systemic symptoms
      (DRESS), and acute generalized exanthematous pustulosis (AGEP) can occur with
      this medicine. Check with your doctor right away if you have black, tarry stools,
      blistering, peeling, or loosening of the skin, chest pain, chills, cough, diarrhea,
      fever, itching, joint or muscle pain, painful or difficult urination, red irritated
      eyes, red skin lesions, often with a purple center, sore throat, sores, ulcers,
      or white spots in the mouth or on the lips, swollen glands, unusual bleeding
      or bruising, or unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cause rhabdomyolysis (a serious muscle problem). Check
      with your doctor right away if you have dark urine, fever, muscle cramps, spasms,
      pains, or stiffness, or unusual tiredness or weakness.
  - type: paragraph
    text: Some patients may develop tremors or seizures while receiving this medicine.
      If you or your child already have a history of seizures and you are taking anticonvulsants,
      you should continue unless otherwise directed by your doctor. Tell your doctor
      if you are taking divalproex sodium (Depakote®) or valproic acid (Depakene®).
  - type: paragraph
    text: Meropenem may cause diarrhea, and in some cases it can be severe. It may
      occur 2 months or more after you stop using this medicine. Do not take any medicine
      to treat diarrhea without first checking with your doctor. Diarrhea medicines
      may make the diarrhea worse or make it last longer. If you have any questions
      about this or if mild diarrhea continues or gets worse, check with your doctor.
  - type: paragraph
    text: This medicine may cause seizures, confusion, headaches, numbness or tingling
      sensation. Do not drive or do anything else that could be dangerous until you
      know how this medicine affects you .
  - type: paragraph
    text: Do not take other medicines unless thy have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bluish lips or skin
      - chills
      - cold, clammy skin
      - confusion
      - dizziness
      - fainting
      - fast heartbeat
      - fast, weak pulse
      - fever
      - itching, skin rash
      - lightheadedness
      - rapid, shallow breathing
      - sweating
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - black, bloody, or tarry stools
      - black, bloody vomit
      - bloating or swelling of the face, arms, hands, lower legs, or feet
      - blurred vision
      - burning sensation while urinating
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chest tightness
      - cough
      - dark urine
      - decreased awareness or responsiveness
      - decreased urine output
      - depression
      - diarrhea (watery and severe), which may also be bloody
      - difficult or painful urination
      - difficulty with breathing
      - dilated neck veins
      - extreme tiredness or weakness
      - fever with or without chills
      - headache
      - hives or welts
      - hostility
      - irregular breathing
      - irritability
      - light-colored stools
      - loss of consciousness
      - muscle twitching
      - nausea
      - no blood pressure or pulse
      - nosebleed
      - pale skin
      - pounding in the ears
      - rapid weight gain
      - seizures
      - severe constipation
      - severe vomiting
      - severe sleepiness
      - slow, irregular heartbeat
      - stomach cramps, severe
      - trouble breathing
      - unconsciousness
      - unpleasant breath odor
      - unusual bleeding or bruising
      - unusual drowsiness, dullness, tiredness, weakness, or feeling of sluggishness
      - unusual weight gain or loss
      - vomiting of blood or material that looks like coffee grounds
      - weight gain
      - white patches in the mouth, tongue, or throat
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back, leg, or stomach pains
      - black, tarry stools
      - bleeding gums
      - blistering, peeling, or loosening of the skin
      - chest pain
      - confusion as to time, place, or person
      - cough
      - general body swelling
      - general feeling of tiredness or weakness
      - hoarseness
      - holding false beliefs that cannot be changed by fact
      - joint or muscle pain
      - large, hive-like swelling on the face, eyelids, tongue, throat, hands, legs,
        feet, or genitals
      - loss of appetite
      - lower back or side pain
      - muscle cramps, spasms, pains, or stiffness
      - painful or difficult urination
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - seeing, hearing, or feeling things that are not there
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - swollen glands
      - unusual excitement, nervousness, or restlessness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - redness and swelling at the injection site
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - cold hands and feet
      - cold sweats
      - congestion
      - cool pale skin
      - dryness or soreness of the throat
      - increased hunger
      - indigestion
      - nightmares
      - passing of gas
      - redness, swelling, or soreness of the tongue
      - runny nose
      - shakiness
      - slurred speech
      - sneezing
      - stomach pain, fullness, or discomfort
      - trouble swallowing
      - vaginal yeast infection
      - voice changes
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Belching
      - excess air or gas in the stomach or bowels
      - full feeling
      - heartburn
      - redness of the skin
      - sleepiness or unusual drowsiness
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
