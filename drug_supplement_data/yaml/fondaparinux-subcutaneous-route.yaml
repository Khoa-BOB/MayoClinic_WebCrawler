        a day. For patients weighing more than 20 kilograms (kg), doses should be
        rounded to the nearest prefilled syringe available. There is no available
        prefilled syringe for patients weighing 10 kg to 20 kg: Weighing 60 kilograms
        (kg) or more—7.5 milligrams (mg) per 0.6 milliliters (mL) injected under the
        skin once a day. Weighing 40 kg to 60 kg—5 mg per 0.4 mL injected under the
        skin once a day. Weighing 20 kg to 40 kg—2.5 mg per 0.5 mL injected under
        the skin once a day. Weighing 10 kg to 20 kg—Dose should be exact and rounded
        to the nearest 0.1 mg. Children younger than 1 year of age weighing less than
        10 kg—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—2.5 milligrams (mg) injected under the skin once a day for 5 to 9 days.
        The first dose is given 6 to 8 hours after surgery.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—2.5 milligrams (mg) injected under the skin once a day for 5 to 9 days.
        The first dose is given 6 to 8 hours after surgery.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—Dose is based on body weight and must be determined by your doctor.
        The dose is usually 5 to 10 milligrams (mg) injected under the skin once a
