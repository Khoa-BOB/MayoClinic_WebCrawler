    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Throw away prefilled syringe that has been left at room temperature for
        more than 4 hours.
    - type: paragraph
      text: Throw away used needles in a hard, closed container that the needles cannot
        poke through. Keep this container away from children and pets.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests will be needed to
      check for unwanted effects. Be sure to keep all appointments.
  - type: paragraph
    text: Fondaparinux may cause bleeding problems. This risk is higher if you have
      a catheter in your back for pain medicine or anesthesia (sometimes called an
      "epidural"), or if you have kidney problems. The risk of bleeding increases
      if your kidney problems get worse. Check with your doctor right away if you
      have any unusual bleeding or bruising, black, tarry stools, bleeding gums, blood
      in the urine or stools, tingling, numbness, or weakness of the lower legs, or
      pinpoint red spots on your skin.
  - type: paragraph
    text: This medicine lowers the number of some types of blood cells in your body.
      Because of this, you may bleed more easily. Stay away from rough sports or other
      situations where you could be bruised, cut, or injured. Brush and floss your
      teeth gently. Be careful when using sharp objects, including razors and fingernail
      clippers.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using fondaparinux several days before having
      surgery or medical tests.
  - type: paragraph
    text: This medicine may increase your risk of having spinal or epidural blood
      clots when it is used together with certain other medicines or procedures. Check
      with your doctor right away if you have midline back pain, numbness, tingling,
      or weakness in the legs or feet, or loss of control of the bowel or bladder
      (incontinence).
  - type: paragraph
    text: The needle guard of the prefilled syringe of this medicine contains natural
      rubber (a derivative of latex). Tell your doctor if you have a latex allergy
      before using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pale skin
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bladder pain
      - bleeding gums
      - blood in the urine or stools
      - blurred vision
      - chest pain
      - chills
      - collection of blood under the skin
      - confusion
      - cough
      - decreased or cloudy urine
      - deep, dark purple bruise
      - difficult, burning, or painful urination
      - dizziness
      - dry mouth
      - fainting or lightheadedness when getting up from a lying or sitting position
      - fever
      - frequent urge to urinate
      - increased thirst
      - irregular heartbeat
      - itching, pain, redness, or swelling at the injection site
      - loss of appetite
      - lower back or side pain
      - muscle pain or cramps
      - nausea or vomiting
      - numbness or tingling in the hands, feet, or lips
      - pinpoint red spots on the skin
      - red, tender, or oozing skin at incision
      - seizures
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - sudden sweating
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - bowel or bladder dysfunction
      - chest tightness
      - difficulty with swallowing
      - fast heartbeat
      - hives, itching, or skin rash
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - leg weakness
      - numbness
      - paralysis
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bruising or purple areas on the skin
      - coughing up blood
      - decreased alertness
      - headache
      - joint pain or swelling
      - nosebleeds
      - stomach pain or swelling
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty having a bowel movement
      - swelling
      - trouble sleeping
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - diarrhea
      - heartburn
      - indigestion
      - pain
      - skin blisters
      - stomach discomfort, upset, or pain
      - unusual changes to site of surgery
      - wound drainage, increased
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
