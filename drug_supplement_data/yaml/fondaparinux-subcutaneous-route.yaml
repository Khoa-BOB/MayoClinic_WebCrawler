title: Fondaparinux (subcutaneous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Arixtra
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fondaparinux injection is used to prevent deep vein thrombosis, a condition
      in which harmful blood clots form in the blood vessels of the legs. These blood
      clots can travel to the lungs and can become lodged in the blood vessels of
      the lungs, causing a condition called pulmonary embolism. This medicine is used
      for several days after hip fracture surgery, hip or knee replacement surgery,
      and in some cases following abdominal or stomach surgery, while you are unable
      to walk. It is during this time that blood clots are most likely to form.
  - type: paragraph
    text: Fondaparinux injection is also used together with warfarin to treat acute
      deep vein thrombosis (blood clot in the leg) and pulmonary embolism (blood clot
      in the lung). It is also used to treat venous thromboembolism (blood clot in
      the vein).
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of fondaparinux injection to treat blood clots in the vein
        in children younger than 1 year of age weighing less than 10 kilograms (kg)
        and to treat other conditions in children. Safety and efficacy have not been
        established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of fondaparinux in the elderly. However,
        elderly patients are more likely to have bleeding problems and age-related
        kidney problems, which may require caution or an adjustment in the dose for
        patients receiving fondaparinux.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Defibrotide
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abciximab
      - Aceclofenac
      - Acemetacin
      - Alipogene Tiparvovec
      - Alteplase, Recombinant
      - Amtolmetin Guacil
      - Anagrelide
      - Anistreplase
      - Apixaban
      - Argatroban
      - Aspirin
      - Bemiparin
      - Betrixaban
      - Bivalirudin
      - Bromfenac
      - Bufexamac
      - Cangrelor
      - Caplacizumab-yhdp
      - Celecoxib
      - Chamomile
      - Choline Salicylate
      - Cilostazol
      - Citalopram
      - Clonixin
      - Clopidogrel
      - Collagenase, Clostridium histolyticum
      - Curcumin
      - Dabigatran Etexilate
      - Dalteparin
      - Danaparoid
      - Desvenlafaxine
      - Dexibuprofen
      - Dexketoprofen
      - Diclofenac
      - Diflunisal
      - Dipyridamole
      - Dipyrone
      - Donanemab-azbt
      - Doxycycline
      - Drotrecogin Alfa
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Chondroitin
      - Coenzyme Q10
      - Dong Quai
      - Ginger
      - Vitamin A
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following may cause an increased risk
        of certain side effects but may be unavoidable in some cases. If used together,
        your doctor may change the dose or how often you use this medicine, or give
        you special instructions about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Avocado
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding problems or
      - Blood vessel problems or
      - Catheter insertion in the spine or
      - Diabetic retinopathy (eye problem) or
      - Hypertension (high blood pressure), uncontrolled or
      - Liver disease or
      - Stomach or bowel problems (eg, ulcers), active or
      - Stroke, recent or history of or
      - Surgery (eg, eye, brain, or spine), recent or history of—Use with caution.
        The risk of bleeding may be increased.
    - type: list
      ordered: false
      items:
      - Heart infection or
      - Kidney disease, severe or
      - Major bleeding, active or
      - Thrombocytopenia (low platelet count in the blood) or
      - Weight of less than 50 kilograms (kg)—Should not be used in patients with
        these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      This medicine is given as a shot under your skin, usually in the stomach.
  - type: paragraph
    text: This medicine comes with a patient information leaflet and patient instructions.
      Read and follow the instructions in the insert carefully. Ask your doctor if
      you have any questions.
  - type: paragraph
    text: It may sometimes be given at home to patients who do not need to be in the
      hospital. If you are using this medicine at home, your doctor or nurse will
      teach you how to prepare and inject the medicine. Be sure that you understand
      exactly how to use the medicine.
  - type: paragraph
    text: You will be shown the body areas where this shot can be given. Use a different
      body area each time you give yourself a shot. Keep track of where you give each
      shot to make sure you rotate body areas. This will help prevent skin problems.
  - type: paragraph
    text: Check the liquid in the prefilled syringe. It should be clear to colorless.
      Do not use it if it is discolored or if you see particles in it. Do not use
      it if it is cracked, broken, bent, or has a leak.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For injection dosage form (prefilled syringe): For prevention of deep vein
        thrombosis following hip fracture surgery, or hip or knee replacement surgery:
        Adults—2.5 milligrams (mg) injected under the skin once a day for 5 to 9 days.
        The first dose is given 6 to 8 hours after surgery. Children—Use and dose
        must be determined by your doctor. For prevention of deep vein thrombosis
        following stomach surgery: Adults—2.5 milligrams (mg) injected under the skin
        once a day for 5 to 9 days. The first dose is given 6 to 8 hours after surgery.
        Children—Use and dose must be determined by your doctor. For treatment of
        deep vein thrombosis and pulmonary embolism: Adults—Dose is based on body
        weight and must be determined by your doctor. The dose is usually 5 to 10
        milligrams (mg) injected under the skin once a day for at least 5 days. Children—Use
        and dose must be determined by your doctor. For treatment of venous thromboembolism:
        Children 1 year of age and older—Dose is based on body weight and must be
        determined by your doctor. At first, 0.1 milligram (mg) per kilogram (kg)
        of body weight injected under the skin once a day. For patients weighing more
        than 20 kilograms (kg), doses should be rounded to the nearest prefilled syringe
        available. There is no available prefilled syringe for patients weighing 10
        kg to 20 kg: Weighing 60 kilograms (kg) or more—7.5 milligrams (mg) per 0.6
        milliliters (mL) injected under the skin once a day. Weighing 40 kg to 60
        kg—5 mg per 0.4 mL injected under the skin once a day. Weighing 20 kg to 40
        kg—2.5 mg per 0.5 mL injected under the skin once a day. Weighing 10 kg to
        20 kg—Dose should be exact and rounded to the nearest 0.1 mg. Children younger
        than 1 year of age weighing less than 10 kg—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For prevention of deep vein thrombosis following hip fracture surgery, or
        hip or knee replacement surgery: Adults—2.5 milligrams (mg) injected under
        the skin once a day for 5 to 9 days. The first dose is given 6 to 8 hours
        after surgery. Children—Use and dose must be determined by your doctor.'
      - 'For prevention of deep vein thrombosis following stomach surgery: Adults—2.5
