      - 'For treatment of deep vein thrombosis and pulmonary embolism: Adults—Dose
        is based on body weight and must be determined by your doctor. The dose is
        usually 5 to 10 milligrams (mg) injected under the skin once a day for at
        least 5 days. Children—Use and dose must be determined by your doctor.'
      - 'For treatment of venous thromboembolism: Children 1 year of age and older—Dose
        is based on body weight and must be determined by your doctor. At first, 0.1
