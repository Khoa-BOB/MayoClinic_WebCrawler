title: Betaine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cystadane
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Betaine is used to treat a lack of or defect in certain enzymes that causes
      too much homocysteine in the blood and urine. This medicine removes the extra
      homocysteine from the body.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested in children and, in effective doses, has
        not been shown to cause different side effects or problems than it does in
        adults. However, children may require more frequent changes in their dose
        than adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing the use of betaine in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Betaine powder should be mixed with 4 to 6 ounces of juice, milk, or water
      until completely dissolved. The solution should be used immediately after mixing.
  - type: paragraph
    text: Do not use if the powder does not dissolve completely or gives a colored
      solution.
  - type: paragraph
    text: Betaine should be taken with meals.
  - type: paragraph
    text: It is important that you follow any special instructions from your doctor,
      such as taking folic acid, pyridoxine (vitamin B 6), and vitamin B 12 supplements.
      If you have any questions about this, check with your doctor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (powder for solution): To prevent buildup of homocysteine:
        Adults, teenagers, and children 3 years of age and older—The starting dose
        is usually 3 grams taken two times a day with meals. Your doctor may adjust
        your dose as needed. Children younger than 3 years of age—The dose is based
        on body weight and must be determined by your doctor. Betaine should be taken
        with meals.'
    - type: list
      ordered: false
      items:
      - 'To prevent buildup of homocysteine: Adults, teenagers, and children 3 years
        of age and older—The starting dose is usually 3 grams taken two times a day
        with meals. Your doctor may adjust your dose as needed. Children younger than
        3 years of age—The dose is based on body weight and must be determined by
        your doctor. Betaine should be taken with meals.'
    - type: list
      ordered: false
      items:
      - Adults, teenagers, and children 3 years of age and older—The starting dose
        is usually 3 grams taken two times a day with meals. Your doctor may adjust
        your dose as needed.
      - Children younger than 3 years of age—The dose is based on body weight and
        must be determined by your doctor. Betaine should be taken with meals.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor should check your progress at regular visits to make sure that
      this medicine is working properly.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - nausea
      - stomach upset
    - type: paragraph
      text: Betaine may cause a body odor. Other side effects not listed above may
        also occur in some patients. If you notice any other effects, check with your
        doctor.
