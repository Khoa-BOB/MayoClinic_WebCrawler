title: Haemophilus b conjugate vaccine (intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: ActHIB
    - type: paragraph
      text: Hibtiter
    - type: paragraph
      text: Pedvaxhib
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Haemophilus b conjugate vaccine (tetanus toxoid conjugate) is an active
      immunizing agent that is used to prevent infection caused by the Haemophilus
      influenza type b (Hib) bacteria. The vaccine works by causing your body to produce
      its own protection (antibodies) against the disease.
  - type: paragraph
    text: Haemophilus b conjugate vaccine is prepared by adding a diphtheria, meningococcal,
      or tetanus-related substance to the process. However, this vaccine does not
      take the place of the regular vaccines for diphtheria, tetanus, or meningococcus
      that children and adults should receive. All of the haemophilus b conjugate
      vaccines work the same way , but they may be given at different ages or different
      schedules.
  - type: paragraph
    text: Infections with Haemophilus influenza type b (Hib) bacteria can cause life-threatening
      illnesses, such as meningitis (a brain disease), epiglottitis (a throat disease
      that can cause suffocation), pericarditis (a heart disease), pneumonia (a lung
      disease), and septic arthritis (a bone and joint disease). Hib meningitis may
      cause death or leave the child with serious and permanent damage, such as intellectual
      disability, deafness, epilepsy, or partial blindness.
  - type: paragraph
    text: Haemophilus b conjugate vaccine is recommended for all children 2 months
      to 5 years of age (up to the 6th birthday).
  - type: paragraph
    text: The Hiberix® vaccine is used as a booster dose for children who have already
      received the primary series with a haemophilus b conjugate vaccine. The vaccine
      will "boost" or increase the protection that the child had from an earlier dose.
  - type: paragraph
    text: This vaccine is to be administered only by or under the direct supervision
      of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
    - Powder for Suspension
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of ActHIB® , HibTITER® , or PedvaxHIB®
        in children 2 months to 5 years of age. However, safety and efficacy have
        not been established in children 6 years of age and older and children younger
        than 2 months of age.
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of the Hiberix® vaccine in children
        15 months to 4 years of age. However, safety and efficacy have not been established
        in children 5 years of age and older and children younger than 15 months of
        age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: The haemophilus b conjugate vaccine (tetanus toxoid conjugate) is not
        for use in adult or geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atidarsagene Autotemcel
      - Elivaldogene Autotemcel
      - Ocrelizumab
      - Teplizumab-mzwv
      - Ublituximab-xiiy
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Guillain-Barré syndrome (severe nerve and muscle problem), history of after
        a vaccine with tetanus toxoid—Your doctor will decide if you should receive
        this vaccine.
    - type: list
      ordered: false
      items:
      - Weakened immune system—May not work as well in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give your child this vaccine
      in a medical facility. It is given as a shot into a muscle.
  - type: paragraph
    text: The exact schedule for your child's vaccines will vary depending on the
      brand of medicine used and your child's age at the time of the first dose. In
      general, your child will receive the first dose at 2 to 6 months of age, followed
      by 2 more doses at least 8 weeks apart. Your child will usually receive a booster
      dose at 15 to 18 months of age, although he or she can receive this medicine
      up until the age of 5 years.
  - type: paragraph
    text: It is important that your child receive all of the doses of the vaccine
      in this series. Try to keep all of your scheduled appointments. If your child
      does miss a dose of this vaccine, make another appointment as soon as possible.
  - type: paragraph
    text: Your child may receive other vaccines at the same time as this one, but
      in a different body area. You should receive information sheets about all of
      the vaccines your child receives. Make sure you understand all of the information
      that is given to you.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your child return to your doctor’s office at the
      right time for each dose . Be sure to notify your doctor of any unwanted effects
      that occur after your child receives this vaccine.
  - type: paragraph
    text: This vaccine may interfere with laboratory tests that check for Hib disease.
      Make sure your doctor knows that your child received the vaccine if a severe
      infection occurs during the 1 to 2 weeks after the vaccine is given.
  - type: paragraph
    text: The vaccine syringe and vial stopper may contain dry natural rubber(a derivative
      of latex), which may cause an allergic reaction in patients who are sensitive
      to latex. Tell your doctor if your child has a latex allergy before receiving
      this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - loss of appetite
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Earache
      - redness or swelling in the ear
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - chills
      - cough
      - fever over 102 degrees F (39 degrees C)
      - lack or loss of strength
      - seizures
      - sneezing
      - sore throat
      - tightness in the chest
      - troubled breathing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - bluish lips or skin
      - dizziness
      - fast heartbeat
      - hives or welts, skin rash
      - itching (especially of the feet or hands)
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or genitals
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid weight gain
      - reddening of the skin (especially around the ears)
      - swelling of the eyes, face, or inside of the nose
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
      - tingling of the hands or feet
      - unusual tiredness or weakness (sudden and severe)
      - unusual weight gain or loss
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever less than 102 degrees F (39 degrees C)
      - irritability
      - redness, pain, swelling, tenderness, or warm feeling at the injection site
      - reduced physical activity
      - restlessness
      - sleepiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Prolonged crying lasting more than 4 hours
      - unusual high-pitched crying
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
