      - Azithromycin
      - Bedaquiline
      - Boceprevir
      - Buprenorphine
      - Buserelin
      - Ceritinib
      - Chloroquine
      - Chlorpromazine
      - Cholera Vaccine
      - Ciprofloxacin
      - Citalopram
      - Clarithromycin
      - Clofazimine
      - Clomipramine
      - Clothiapine
      - Clozapine
      - Cobicistat
      - Conivaptan
      - Crizotinib
      - Cyclobenzaprine
