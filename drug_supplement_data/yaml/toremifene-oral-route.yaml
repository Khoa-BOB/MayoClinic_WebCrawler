      - Dasatinib
      - Degarelix
      - Delamanid
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood clots, or history of—Use is usually not recommended in patients with
        this condition.
    - type: list
      ordered: false
      items:
      - Bone problems (eg, bone cancer) or
      - Congestive heart failure or
      - Heart rhythm problems (eg, QT prolongation) or
      - Leukopenia (low white blood cells in the blood) or
      - Thrombocytopenia (low platelets in the blood)—Use with caution. May make these
        conditions worse.
    - type: list
      ordered: false
      items:
      - Heart rhythm problems (eg, congenital or acquired long QT syndrome) or
      - Hypokalemia (low potassium in the blood), uncorrected or
      - Hypomagnesemia (low magnesium in the blood), uncorrected—Should not be used
        in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Liver disease (eg, cirrhosis, fibrosis)—Use with caution. The effects may
        be increased because of slower removal of the medicine from the body.
    - type: list
      ordered: false
      items:
      - Unusual growth of the lining of the uterus (womb)—Long-term use of toremifene
        is usually not recommended.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it,
      do not use it more often, and do not use it for a longer time than your doctor
      ordered.
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For breast cancer: Adults—60 milligrams (mg)
        once a day. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For breast cancer: Adults—60 milligrams (mg) once a day. Children—Use is
        not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—60 milligrams (mg) once a day.
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects. It is important for women to have regular gynecologic
      check-ups while taking this medicine.
  - type: paragraph
    text: It is unlikely that a postmenopausal woman may become pregnant. But, using
      this medicine while you are pregnant could harm your unborn baby. If you are
      a woman who can bear children, your doctor may give you a pregnancy test before
      you start using this medicine to make sure you are not pregnant. Use an effective
      form of birth control to keep from getting pregnant. If you think you have become
      pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you had a heart rhythm problem, such
      as QT prolongation.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Hypercalcemia (high calcium in the blood) and tumor flare (increased size
      of a tumor) are more likely to occur in patients with bone problems who are
      taking this medicine. Check with your doctor right away if you have stomach
      pain, confusion, constipation, depression, dry mouth, increased urination, loss
      of appetite, metallic taste, muscle weakness, pain and swelling in the bones
      and muscles surrounding a tumor, thirst, unusual tiredness, or weight loss.
  - type: paragraph
    text: This medicine may increase your risk of having uterus problems, including
      endometrial cancer. Talk with your doctor if you have concerns about this.
  - type: paragraph
    text: 'Toremifene can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. It can also lower the
      number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you get a fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: This medicine may cause you to have bleeding from the vagina, especially
      when you first start using it. If the bleeding continues or is bothersome, check
      with your doctor right away.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - arm, back, or jaw pain
      - blurred vision
      - change in how much and how often you urinate
      - change in vaginal discharge
      - changes in skin color
      - changes in vision
      - changes in weight
      - chest pain, discomfort, tightness, or heaviness
      - confusion
      - constipation
      - cough
      - depression
      - dilated neck veins
      - dizziness, lightheadedness
      - dry mouth
      - fainting
      - fast, slow, or irregular heartbeat
      - inability to speak, incoherent speech
      - irregular breathing
      - loss of appetite
      - metallic taste in the tongue
      - muscle weakness
      - nausea
      - pain or discomfort in the arms, jaw, back, or neck
      - pain or feeling of pressure in the pelvis
      - pain, tenderness, or swelling of the foot or leg
      - seizures
      - severe or sudden headache
      - stomach pain
      - sweating
      - swelling of the face, fingers, feet, or lower legs
      - temporary blindness
      - tenderness, pain, swelling, warmth, skin discoloration, prominent superficial
