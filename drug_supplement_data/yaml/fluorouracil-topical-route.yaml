title: Fluorouracil (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Carac
    - type: paragraph
      text: Efudex
    - type: paragraph
      text: Fluoroplex
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fluorouracil topical is used to treat actinic or solar keratoses and a type
      of skin cancer called superficial basal cell carcinoma.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Cream
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of fluorouracil topical in the pediatric population. Safety
        and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of fluorouracil topical in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Brivudine
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Tegafur
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acenocoumarol
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Allopurinol
      - Azanidazole
      - Benznidazole
      - Cholera Vaccine
      - Cimetidine
      - Ebola Zaire Vaccine, Live
      - Fosphenytoin
      - Influenza Virus Vaccine, Live
      - Isoconazole
      - Leucovorin
      - Levoleucovorin
      - Methotrexate
      - Metronidazole
      - Nimorazole
      - Ornidazole
      - Oxypurinol
      - Phenindione
      - Phenprocoumon
      - Phenytoin
      - Rotavirus Vaccine, Live
      - Secnidazole
      - Tamoxifen
      - Tinidazole
      - Warfarin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Levamisole
      - Rolapitant
      - Thiamine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Dihydropyrimidine dehydrogenase (DPD) enzyme deficiency—Should not be used
        in patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you use this medicine only as directed by your
      doctor . Do not use more of it, do not use it more often, and do not use it
      for a longer time than your doctor ordered. To do so may cause your skin to
      become irritated.
  - type: paragraph
    text: This medicine is for use on the skin only . Do not get any of this medicine
      near or around your eyes, nose, or mouth. If it does get on these areas, rinse
      it off with water and check with your doctor right away.
  - type: paragraph
    text: 'To use the cream or solution :'
  - type: list
    ordered: false
    items:
    - Wash your hands with soap and water before and after using this medicine.
    - Apply enough amount of the medicine to each affected area.
    - You may use a glove, nonmetal applicator, or fingers to apply this medicine.
    - Do not bandage or otherwise wrap the skin being treated unless directed to do
      so by your doctor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (cream and solution): For actinic or solar keratosis:
        Adults—Apply to the affected area 2 times a day for 2 to 4 weeks. Children—Use
        and dose must be determined by your doctor. For superficial basal cell carcinomas:
        Adults—Apply to the affected area 2 times a day for 3 to 6 weeks. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For actinic or solar keratosis: Adults—Apply to the affected area 2 times
        a day for 2 to 4 weeks. Children—Use and dose must be determined by your doctor.'
      - 'For superficial basal cell carcinomas: Adults—Apply to the affected area
        2 times a day for 3 to 6 weeks. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply to the affected area 2 times a day for 2 to 4 weeks.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—Apply to the affected area 2 times a day for 3 to 6 weeks.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Keep this medicine away from pets. Do not allow pets to contact the skin
        where the medicine is applied. Throw away or clean any cloth or applicator
        that may still have some of this medicine. Do not leave any medicine on your
        hands, clothing, carpet, or furniture.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      for any unwanted effects that may be caused by this medicine.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant during treatment.
      If you think you have become pregnant while using the medicine, tell your doctor
      right away.
  - type: paragraph
    text: This medicine may make your skin more sensitive to sunlight. Wear sunscreen.
      Do not use sunlamps or tanning beds. If you have a severe reaction from the
      sun, check with your doctor.
  - type: paragraph
    text: This medicine may cause black, tarry stools, blurred or double vision, chills,
      cough, diarrhea, difficulty in walking, drooping eyelids, fever, headache, jaw
      pain, lower back or side pain, numbness or tingling in the fingers and toes,
      pain in the fingers, toes, and testicles, painful or difficult urination, pale
      skin, sore throat, sores, ulcers, or white spots in the mouth or on the lips,
      swelling or inflammation of the mouth, unusual bleeding or bruising, or unusual
      tiredness or weakness. Check with your doctor right away if you notice any of
      these serious side effects .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bleeding gums
      - blood in the urine or stools
      - chest pain
      - chills
      - cough
      - fever
      - painful or difficult urination
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - swollen glands
      - trouble breathing
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry, rough, or scaly skin
      - loss or thinning of the hair
      - raised, dark red, wart-like spots on the skin, especially when used on the
        face
      - swelling or inflammation of the mouth
      - tearing of the eyes
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
