      - chills
      - coma
      - cough
      - cough producing mucus
      - decreased urine output
      - diarrhea
      - dizziness
      - fever
      - general feeling of discomfort or illness
      - hostility
      - lethargy
      - muscle twitching
      - nervousness
      - rapid weight gain
      - sensitivity to heat
      - stomach cramps, tenderness, or pain
      - stupor
      - sweating
      - swelling of the face, feet, lower legs, ankles, or hands
      - thickening of bronchial secretions
      - trouble sleeping
      - watery or bloody diarrhea
      - weight loss
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - back or leg pain
      - black, tarry stools
      - bleeding gums
      - blood in the stools
      - blue or pale skin
      - blurred vision
      - burning, tingling, numbness, or pain in the hands, arms, feet, or legs
      - burning feeling in the chest or stomach
      - change in vision
      - chest pain, possibly moving to the left arm, neck, or shoulder
      - drowsiness
      - dry mouth
      - eye pain
      - general body swelling
      - inability to move the arms and legs
      - indigestion
      - joint pain
      - light-colored stools
      - lightheadedness
      - loss of consciousness
      - loss of strength or energy
      - muscle aches, pain, tenderness, or weakness
      - nosebleeds
      - numbness or tingling in the fingers, face, or feet
      - partial or slight paralysis
      - pinpoint red spots on the skin
      - rapid, shallow breathing
      - redness of the eye
      - sensation of pins and needles
      - sensitivity of the eye to light
      - severe headache
      - skin rash, redness, soreness, or itching
      - sores, welting, or blisters
      - stabbing pain
      - stiff neck or back
      - stomach discomfort or upset
      - sudden numbness and weakness in the arms and legs
      - swollen, painful, or tender lymph glands in the neck, armpit, or groin
      - tearing
      - upper right abdominal or stomach pain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - cracks in the skin
      - flushed, dry skin
      - fruit-like breath odor
      - increased hunger
      - increased thirst
      - increased urination
      - loss of heat from the body
      - red irritated eyes
      - red skin lesions, often with a purple center
      - red, swollen skin
      - scaly skin
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
