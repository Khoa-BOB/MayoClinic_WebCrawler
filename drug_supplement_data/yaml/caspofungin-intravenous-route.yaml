title: Caspofungin (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cancidas
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Caspofungin injection is used to treat serious fungal infections, including
      candidemia (fungal infection in the blood), esophageal candidiasis (fungal infection
      of the esophagus), other candida infections, and aspergillosis (fungal infection
      in the lungs). It is also used to treat fungal infections assumed to be present
      in patients with febrile neutropenia. Caspofungin injection is given when other
      medicines (eg, amphotericin B, itraconazole) did not work well.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of caspofungin injection in children
        3 months of age and older. Safety and efficacy have not been established in
        children younger than 3 months of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of caspofungin injection in the elderly.
        However, elderly patients are more sensitive to the effects of this medicine
        than younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Azathioprine
      - Cyclosporine
      - Levoketoconazole
      - Mercaptopurine
      - Methotrexate
      - Tacrolimus
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Carbamazepine
      - Dexamethasone
      - Efavirenz
      - Fosphenytoin
      - Nevirapine
      - Phenytoin
      - Rifampin
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Liver disease, moderate to severe (eg, hepatitis, liver failure)—Use with
        caution. Effects may be increased because of slower removal of the medicine
        from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      It is given through a needle placed into one of your veins. The medicine must
      be injected slowly, so the needle will have to remain in place for about 1 hour
      for 7 to 14 days.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check the progress of you or your
      child while you are taking this medicine to make sure the medicine is working
      properly. Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Check with your doctor right away if you or your child have pain or tenderness
      in the upper stomach, dark urine, pale stools, nausea, vomiting, loss of appetite,
      or yellow skin or eyes. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may cause a serious type of allergic reaction, called anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you or your child have a rash, itching, hoarseness,
      trouble breathing, trouble swallowing, or any swelling of your hands, face,
      or mouth after receiving this medicine.
  - type: paragraph
    text: Serious skin reactions can occur with this medicine. Check with your doctor
      right away if you have blistering, peeling, or loosening of the skin, red skin
      lesions, severe acne or a skin rash, sores or ulcers on the skin, or fever or
      chills with this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - blue lips, fingernails, or skin
      - blurred vision
      - changes in skin color
      - chest pain
      - confusion
      - cough
      - cracked lips
      - decreased urine
      - diarrhea
      - difficult or troubled breathing
      - difficulty with swallowing
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dry mouth
      - fever
      - headache
      - increased thirst
      - irregular heartbeat
      - irregular, fast, slow, or shallow breathing
      - loss of appetite
      - mood changes
      - muscle pain or cramps
      - nausea
      - nervousness
      - numbness or tingling in your hands, feet, or lips
      - pain or redness at the injection site
      - pain, tenderness, or swelling of the foot or leg
      - pale skin
      - pounding in the ears
      - rapid weight gain
      - seizures
      - slow or fast heartbeat
      - sneezing
      - sore throat
      - sores, ulcers, or white spots on the lips, tongue, or inside the mouth
      - sweating
      - tightness in the chest
      - troubled breathing with exertion
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - unusual weight gain or loss
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody urine
      - decreased frequency or amount of urine
      - increased blood pressure
      - lower back or side pain
      - weight gain
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bladder pain
      - bleeding gums
      - blood in the urine or stools
      - bloody nose
      - chest pain or discomfort
      - clay-colored stools
      - cloudy urine
      - constipation
      - dark urine
      - decreased appetite
      - depression
      - drowsiness
      - fever with or without chills
      - flushed, dry skin
      - frequent urge to urinate
      - fruit-like breath odor
      - general feeling of tiredness or weakness
      - incoherent speech
      - increased hunger
      - increased urination
      - indigestion
      - itching
      - light-colored stools
      - metallic taste
      - muscle spasms (tetany) or twitching seizures
      - muscle weakness
      - no blood pressure or pulse
      - noisy, rattling breathing
