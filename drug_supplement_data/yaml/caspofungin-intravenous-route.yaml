      - pinpoint red spots on the skin
      - rapid weight gain
      - rash
      - right upper abdominal or stomach pain and fullness
      - shakiness in the legs, arms, hands, or feet
      - stomach pain, continuous
      - stomach pain or tenderness
      - stopping of heart
      - trembling or shaking of the hands or feet
      - troubled breathing at rest
      - ulcers, sores, or white spots in the mouth
      - unconsciousness
      - unexplained weight loss
      - unpleasant breath odor
      - vomiting of blood
      - weakness
      - weight loss
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Flushing, redness of the skin
      - unusually warm skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - belching
      - blistering, peeling, or loosening of the skin
      - bloated or feeling of fullness
      - bumps on the skin
      - difficulty in moving
      - dry, red, hot, or irritated skin
      - fear
      - flaking and falling off of the skin
      - heartburn
      - hives or welts
      - indigestion
      - joint or muscle pain
      - lack or loss of strength
      - muscle pain or stiffness
      - pressure in the stomach
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - redness of the skin
      - sleepiness or unusual drowsiness
      - small red or purple spots on the skin
      - stomach discomfort, upset, or pain
      - swelling of the abdominal or stomach area
      - trouble sleeping
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
