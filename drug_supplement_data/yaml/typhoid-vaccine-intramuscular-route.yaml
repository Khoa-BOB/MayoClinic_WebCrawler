title: Typhoid vaccine (intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Typhim Vi
    - type: paragraph
      text: Typhoid Vi Polysaccharide Vaccine
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Typhoid vaccine is used to prevent typhoid fever caused by a germ called
      Salmonella typhi . The vaccine works by causing your body to produce its own
      protection (antibodies) against the disease.
  - type: paragraph
    text: Typhoid fever is a serious disease that can cause death. It is spread most
      often through infected food or water. Typhoid may also be spread by close person-to-person
      contact with infected persons (such as occurs with persons living in the same
      household). Some infected persons do not appear to be sick, but they can still
      spread the germ to others.
  - type: paragraph
    text: 'Typhoid fever is very rare in the U.S. and other areas of the world that
      have good water and sewage (waste) systems. However, it is a problem in parts
      of the world that do not have such systems. If you are traveling to certain
      countries or remote, out-of-the-way areas, typhoid vaccine will help protect
      you from typhoid fever. The U.S. Centers for Disease Control (CDC) currently
      recommend caution in the following areas of the world:'
  - type: list
    ordered: false
    items:
    - Africa
    - Asia
    - Latin America
  - type: paragraph
    text: Typhoid vaccine given by injection helps prevent typhoid fever, but does
      not provide 100% protection. Therefore, it is very important to avoid infected
      persons and food and water that may be infected, even if you have received the
      vaccine.
  - type: paragraph
    text: This vaccine is to be given only by or under the supervision of your doctor
      or other health care professional.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of typhoid vaccine in children 2
        years of age and older. Safety and efficacy have not been established in children
        younger than 2 years of age.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of typhoid vaccine in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is not recommended.
        Your doctor may decide not to use this vaccine or change some of the other
        medicines you take.
    - type: list
      ordered: false
      items:
      - Abarelix
      - Abemaciclib
      - Abiraterone
      - Acalabrutinib
      - Adagrasib
      - Ado-Trastuzumab Emtansine
      - Afamitresgene Autoleucel
      - Afatinib
      - Aldesleukin
      - Alectinib
      - Alemtuzumab
      - Alpelisib
      - Altretamine
      - Aminoglutethimide
      - Aminolevulinic Acid
      - Amivantamab-vmjw
      - Anastrozole
      - Apalutamide
      - Arsenic Trioxide
      - Asciminib
      - Asparaginase
      - Atezolizumab
      - Avapritinib
      - Avelumab
      - Axicabtagene Ciloleucel
      - Axitinib
      - Azacitidine
      - Belantamab Mafodotin
      - Belinostat
      - Belumosudil
      - Belzutifan
      - Bendamustine
      - Bevacizumab
      - Bexarotene
      - Bicalutamide
      - Binimetinib
      - Bleomycin
      - Blinatumomab
      - Bortezomib
      - Bosutinib
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Ocrelizumab
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Illness with fever, severe—Use with caution. The symptoms of the condition
        may be confused with the side effects of the vaccine.
    - type: list
      ordered: false
      items:
      - Immune system problems from a disease or medicine—May not work as well in
        patients with this condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this vaccine.
      It is given as a shot into one of your muscles, usually in the upper arm.
  - type: paragraph
    text: To get the best possible protection against typhoid, you should receive
      the vaccine at least 2 weeks before you travel to areas where you may be exposed
      to typhoid.
  - type: paragraph
    text: If you will be traveling regularly to parts of the world where typhoid is
      a problem, you should get a booster (repeat) dose of the vaccine every 2 years.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Be sure to notify your doctor of any side effects (eg, feeling faint) that
      occur after you receive this vaccine.
  - type: paragraph
    text: This vaccine may cause a serious type of allergic reaction called anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Tell your doctor right away if you have a rash, itching, swelling of the tongue
      and throat, or troubled breathing after you get the injection.
  - type: paragraph
    text: Typhoid vaccine may not protect everyone who receives it. This vaccine will
      not treat the symptoms if you already have typhoid fever.
  - type: paragraph
    text: Tell your doctor if you are using a medicine or treatment that weakens your
      immune system, such as a steroid, radiation, or cancer treatment. This vaccine
      may not work as well if you are also using these medicines. However, your doctor
      may still want you to get the vaccine because it can give you some protection.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever
      - general feeling of discomfort or illness
      - pain, redness, swelling, tenderness or a lump at the place of injection
      - unusual tiredness or weakness
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty in breathing or swallowing
      - fainting
      - hives, itching, or redness of the skin
      - swelling of the eyes, face, or inside of the nose
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - nausea
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - difficulty in moving
      - joint pain or swelling
      - muscle aches, cramps, pain, or stiffness
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
