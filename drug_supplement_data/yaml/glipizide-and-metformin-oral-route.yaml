    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will want to check your progress at regular visits , especially
      during the first few weeks that you take this medicine.
  - type: paragraph
    text: Under certain conditions, too much glipizide and metformin can cause lactic
      acidosis. Symptoms of lactic acidosis are severe and quick to appear and usually
      occur when other health problems not related to the medicine are present and
      are very severe, such as a heart attack or kidney failure. Symptoms of lactic
      acidosis include abdominal or stomach discomfort; decreased appetite; diarrhea;
      fast, shallow breathing; general feeling of discomfort; muscle pain or cramping;
      and unusual sleepiness, tiredness, or weakness.
  - type: paragraph
    text: If symptoms of lactic acidosis occur, you should get immediate emergency
      medical help.
  - type: paragraph
    text: 'It is very important to follow carefully any instructions from your health
      care team about:'
  - type: list
    ordered: false
    items:
    - Alcohol—Drinking alcohol may cause severe low blood sugar. Discuss this with
      your health care team.
    - Other medicines—Do not take other medicines unless they have been discussed
      with your doctor.
    - Counseling—Other family members need to learn how to prevent side effects or
      help with side effects if they occur. Also, patients with diabetes may need
      special counseling about diabetes medicine dosing changes that might occur because
      of lifestyle changes, such as changes in exercise and diet. Furthermore, counseling
      on contraception and pregnancy may be needed because of the problems that can
      occur in patients with diabetes during pregnancy.
    - Travel—Keep a recent prescription and your medical history with you. Be prepared
      for an emergency as you would normally. Make allowances for changing time zones
      and keep your meal times as close as possible to your usual meal times.
  - type: paragraph
    text: In case of emergency—There may be a time when you need emergency help for
      a problem caused by your diabetes. You need to be prepared for these emergencies.
      It is a good idea to wear a medical identification (ID) bracelet or neck chain
      at all times. Also, carry an ID card in your wallet or purse that says that
      you have diabetes and a list of all your medicines.
  - type: paragraph
    text: Symptoms of hypoglycemia (low blood sugar) include anxiety; behavior change
      similar to being drunk; blurred vision; cold sweats; confusion; cool, pale skin;
      difficulty in thinking; drowsiness; excessive hunger; fast heartbeat; headache
      (continuing); nausea; nervousness; nightmares; restless sleep; shakiness; slurred
      speech; or unusual tiredness or weakness.
  - type: paragraph
    text: Glipizide and metformin combination can cause low blood sugar. However,
      it also can occur if you delay or miss a meal or snack, drink alcohol, exercise
      more than usual, cannot eat because of nausea or vomiting, take certain medicines,
      or take glipizide and metformin with another type of diabetes medicine. Symptoms
      of low blood sugar must be treated before they lead to unconsciousness (passing
      out). Different people feel different symptoms of low blood sugar. It is important
      that you learn which symptoms of low blood sugar you usually have so that you
      can treat it quickly.
  - type: paragraph
    text: If symptoms of low blood sugar occur, eat glucose tablets or gel, corn syrup,
      honey, or sugar cubes; or drink fruit juice, nondiet soft drink, or sugar dissolved
      in water. Also, check your blood for low blood sugar. Glucagon is used in emergency
      situations when severe symptoms such as seizures (convulsions) or unconsciousness
      occur. Have a glucagon kit available, along with a syringe or needle, and know
      how to use it. Members of your household also should know how to use it.
  - type: paragraph
    text: Symptoms of hyperglycemia (high blood sugar) include blurred vision; drowsiness;
      dry mouth; flushed, dry skin; fruit-like breath odor; increased urination (frequency
      and volume); ketones in urine; loss of appetite; sleepiness; stomachache, nausea,
      or vomiting; tiredness; troubled breathing (rapid and deep); unconsciousness;
      or unusual thirst.
  - type: paragraph
    text: High blood sugar may occur if you do not exercise as much as usual, have
      a fever or infection, do not take enough or skip a dose of your diabetes medicine,
      or overeat or do not follow your meal plan.
  - type: paragraph
    text: If symptoms of high blood sugar occur, check your blood sugar level and
      then call your health care professional for instructions.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - blurred vision
      - chills
      - cold sweats
      - coma
      - confusion
      - cool pale skin
      - cough
      - depression
      - dizziness
      - fast heartbeat
      - fever
      - headache
      - increased hunger
      - nausea
      - nervousness
      - nightmares
      - seizures
      - shakiness
      - slurred speech
      - sneezing
      - sore throat
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bladder pain
      - bloody or cloudy urine
      - difficult, burning, or painful urination
      - frequent urge to urinate
      - lower back or side pain
      - pounding in the ears
      - slow heartbeat
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal discomfort
      - decreased appetite
      - diarrhea
      - fainting spells
      - fast, shallow breathing
      - general feeling of discomfort
      - muscle pain or cramping
      - shortness of breath
      - sleepiness
    subsections: []
  - heading: Symptoms of Overdose
    level: 3
    content:
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    - type: list
      ordered: false
      items:
      - Abdominal discomfort
      - anxiety
      - behavior change, similar to drunkenness
      - blurred vision
      - cold sweats
      - coma
      - confusion
      - cool, pale skin
      - decreased appetite
      - diarrhea
      - difficulty in concentrating
      - drowsiness
      - excessive hunger
      - fast heartbeat
      - fast, shallow breathing
      - general feeling of discomfort
      - headache
      - muscle pain or cramping
      - nausea
      - nervousness
      - nightmares
      - restless sleep
      - seizures
      - shakiness
      - slurred speech
      - unusual sleepiness
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More Common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Muscle or bone pain
      - stomach pain
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
