title: Glipizide and metformin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Metaglip
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: 'Glipizide and Metformin combination is used to treat high blood sugar levels
      that are caused by a type of diabetes mellitus or sugar diabetes called type
      2 diabetes. Normally, after you eat, your pancreas releases insulin to help
      your body store excess sugar for later use. This process occurs during normal
      digestion of food. In type 2 diabetes, your body does not work properly to store
      the excess sugar and the sugar remains in your bloodstream. Chronic high blood
      sugar can lead to serious health problems in the future. Proper diet is the
      first step in managing type 2 diabetes but often medicines are needed to help
      your body. With two actions, the combination of glipizide and metformin helps
      your body cope with high blood sugar. Glipizide stimulates the release of insulin
      from the pancreas, directing your body to store blood sugar. Metformin has three
      different actions: it slows the absorption of sugar in your small intestine;
      it also stops your liver from converting stored sugar into blood sugar; and
      it helps your body use your natural insulin more efficiently.'
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of glipizide and metformin in children
        with use in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Some older adults may be more sensitive than younger adults to the effects
        of these medicines. The first signs of low or high blood sugar are not easily
        seen or do not occur at all in older adults. This may increase the chance
        of low blood sugar developing during treatment. Older adults are more likely
        to have age-related problems and glipizide and metformin should be used carefully
        as age increases. This medicine should not be started in adults over 80 years
        of age unless kidney function is not reduced.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abemaciclib
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
