    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Acid in the blood (acidosis or ketoacidosis) or
      - Surgery (major)—Use of insulin is best to help control diabetes in patients
        with these conditions.
    - type: list
      ordered: false
      items:
      - Blood poisoning or
      - Dehydration (severe) or
      - Heart or blood vessel disorders or
      - Kidney disease or
      - Liver disease—Lactic acidosis can occur in these conditions and chances of
        it occurring are even greater with a medicine that contains metformin.
    - type: list
      ordered: false
      items:
      - Congestive Heart Failure—Glipizide and metformin should not be used in patients
        who have this medical condition.
    - type: list
      ordered: false
      items:
      - Kidney, heart, or other problems that require medical tests or examinations
        that use certain medicines called contrast agents, with x-ray exams—Because
        this medicine contains metformin, your doctor should advise you to stop taking
        it before you have any medical exams or diagnostic tests that might cause
        less urine output than usual; you may be advised to start taking the medicine
        again 48 hours after the exams or tests if your kidney function is tested
        and found to be normal.
    - type: list
      ordered: false
      items:
      - Alcohol intoxication or
      - Strenuous exercise not accompanied by adequate intake of food or
      - Underactive adrenal gland, not properly controlled or
      - Underactive pituitary gland, not properly controlled or
      - Undernourished condition or
      - Weakened physical condition or
      - Any other condition that causes low blood sugar—Patients with these conditions
        may be more likely to develop low blood sugar while taking a medication that
        contains glipizide and metformin.
    - type: list
      ordered: false
      items:
      - Vitamin B12 deficiency—This condition may be made worse by this medication.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Follow carefully the special meal plan your doctor gave you. This is the
      most important part of controlling your condition, and is necessary if the medicine
      is to work properly. Also, exercise regularly and test for sugar in your blood
      or urine as directed.
  - type: paragraph
    text: Glipizide and metformin combination should be taken with meals to help reduce
      the gastrointestinal side effects that may occur during treatment.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For type 2 diabetes: For first-time treatment:
        Adults: At first, 2.5 milligrams (mg) of glipizide and 250 milligrams (mg)
        of metformin once a day with a meal. Then, your doctor may increase your dose
        a little at a time every two weeks until your blood sugar is controlled. Children:
        Use and dose must be determined by your doctor. As second-line therapy: Oral,
        2.5 milligrams (mg) of glipizide and 500 milligrams (mg) of metformin or 5
        milligrams (mg) of glipizide and 500 milligrams (mg) of metformin two times
        a day, with the morning and evening meals. Then, your doctor may increase
        your dose a little at a time until your blood sugar is controlled. The starting
        dose should not exceed the daily dose of glipizide or metformin already being
        taken. Children: Use and dose must be determined by your doctor. For patients
        previously treated with a sulfonylurea antidiabetic agent and/or metformin:
        Adults: When switching patients from a sulfonylurea plus metformin to the
        glipizide and metformin combination, the initial dose should not exceed the
        daily dose of glipizide (or equivalent dose of another sulfonylurea) and metformin
        that was being taken. Children: Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For type 2 diabetes: For first-time treatment: Adults: At first, 2.5 milligrams
