title: Permethrin (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Acticin
    - type: paragraph
      text: Elimite
    - type: paragraph
      text: Nix Creme Rinse
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Nix
    - type: paragraph
      text: Nix Dermal Cream
    - type: paragraph
      text: Nix Lice Killing Creme Rinse
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Permethrin 1% lotion is used to treat head lice infections. It acts by destroying
      both the lice and their eggs. The 5% cream is used to treat scabies infections
      by destroying the mites which cause scabies.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Lotion
    - Cream
    - Liquid
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of topical permethrin in children
        with use in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of topical permethrin in the
        elderly with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women suggest that this medication poses minimal risk to the
        infant when used during breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of topical
        permethrin. Make sure you tell your doctor if you have other medical problems,
        especially:'
    - type: list
      ordered: false
      items:
      - Severe inflammation of the scalp—Use of permethrin may make the condition
        worse
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Keep this medicine away from the eyes. If you accidentally get some in your
      eyes, flush them thoroughly with water at once.
  - type: paragraph
    text: Permethrin lotion which is used to treat lice, comes in a container that
      holds only one treatment. Use as much of the medicine as you need and discard
      any remaining lotion properly.
  - type: paragraph
    text: 'For the treatment of head lice (1% lotion):'
  - type: list
    ordered: false
    items:
    - Shampoo the hair and scalp using regular shampoo.
    - Thoroughly rinse and towel dry the hair and scalp.
    - Allow hair to air dry for a few minutes.
    - Shake the permethrin lotion well before applying.
    - Thoroughly wet the hair and scalp with the permethrin lotion. Be sure to cover
      the areas behind the ears and on the back of the neck also. Allow the lotion
      to remain in place for 10 minutes.
    - Then, rinse the hair and scalp thoroughly and dry with a clean towel.
    - When the hair is dry, you may want to comb the hair with a fine-toothed comb
      to remove any remaining nits (eggs) or nit shells.
  - type: paragraph
    text: Head lice can be easily transferred from one person to another by direct
      contact with clothing, hats, scarves, bedding, towels, washcloths, hairbrushes
      and combs, or hairs from infected persons. Therefore, all members of your household
      should be examined for head lice and should receive treatment if they are found
      to be infected. If you have any questions about this, check with your doctor.
  - type: paragraph
    text: 'For the treatment of scabies (5% cream):'
  - type: list
    ordered: false
    items:
    - Read package directions carefully before using.
    - Thoroughly wash and dry skin.
    - Massage the cream into the skin from the head to the soles of the feet, paying
      special attention to creases in the skin, hands, feet, between fingers and toes,
      underarms, and groin.
    - Scabies rarely infests the scalp of adults, although the hairline, neck, side
      of the head, and forehead may be infested in older people and in infants. Infants
      should be treated on the scalp, side of the head, and forehead.
    - Leave the permethrin cream on the skin for 8 to 14 hours.
    - Wash off by taking a shower or bath.
    - Change into clean clothes.
    - After treatment, itching may continue for up to 4 weeks.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage forms (cream and lotion): For head lice: Adults and children
        2 years of age and older—Apply to the hair and scalp one time. Children up
        to 2 years of age—Use and dose must be determined by your doctor. For scabies:
        Adults and children 2 months of age and older—Apply to the skin one time.
        Children up to 2 months of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For head lice: Adults and children 2 years of age and older—Apply to the
        hair and scalp one time. Children up to 2 years of age—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 2 years of age and older—Apply to the hair and scalp one
        time.
      - Children up to 2 years of age—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For scabies: Adults and children 2 months of age and older—Apply to the skin
        one time. Children up to 2 months of age—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and children 2 months of age and older—Apply to the skin one time.
      - Children up to 2 months of age—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: 'To prevent reinfection or spreading of the infection to other people, good
      health habits are required. These include the following:'
  - type: list
    ordered: false
    items:
    - Machine wash all clothing (including hats, scarves, and coats), bedding, towels,
      and washcloths in very hot water and dry them by using the hot cycle of a dryer
      for at least 20 minutes. Clothing or bedding that cannot be washed should be
      dry cleaned or sealed in an airtight plastic bag for 2 weeks.
    - Shampoo all wigs and hairpieces.
    - Wash all hairbrushes and combs in very hot soapy water (above 130 °F) for 5
      to 10 minutes and do not share them with other people.
    - Clean the house or room by thoroughly vacuuming upholstered furniture, rugs,
      and floors.
    - Wash all toys in very hot soapy water (above 130 °F) for 5 to 10 minutes or
      seal in an airtight plastic bag for 2 weeks. This is especially important for
      stuffed toys used on the bed.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  subsections:
  - heading: Less common or rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, itching, numbness, rash, redness, stinging, swelling, or tingling
        of the scalp
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
