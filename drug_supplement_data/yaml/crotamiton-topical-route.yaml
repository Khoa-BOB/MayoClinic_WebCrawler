title: Crotamiton (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Eurax
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Crotamiton is used to treat scabies infection. It is also used to relieve
      the itching of certain skin conditions.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Lotion
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of this medicine in children with
        use in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of crotamiton in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Severely inflamed skin or raw oozing areas of the skin—Use of crotamiton on
        these areas may make the condition worse
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Keep crotamiton away from the mouth. It may be harmful if swallowed.
  - type: paragraph
    text: Use this medicine only as directed. Do not use it more often than your doctor
      ordered. To do so may increase the chance of side effects.
  - type: paragraph
    text: Keep crotamiton away from the eyes and other mucous membranes, such as the
      inside of the nose. It may cause irritation. If you should accidentally get
      some in your eyes, flush them thoroughly with water at once.
  - type: paragraph
    text: This medicine usually comes with patient directions. Read them carefully
      before using.
  - type: paragraph
    text: If you take a bath or shower before using this medicine, dry the skin well
      before applying crotamiton.
  - type: paragraph
    text: 'For patients using this medicine for scabies:'
  - type: list
    ordered: false
    items:
    - Apply enough medicine to cover the entire skin surface from the chin down, and
      rub in well. This applies especially to folds and creases in the skin and to
      the hands, feet (including the soles), between fingers and toes, and moist areas
      (such as underarms and groin).
    - Do not wash off the first coat of this medicine.
    - Apply a second coat of this medicine 24 hours after the first one.
    - The next day, put on freshly washed or dry-cleaned clothing and change bedding
      in order to prevent reinfection.
    - Then, 48 hours after the second application of this medicine, take a cleansing
      bath to remove the medicine.
    - Your sexual partners, especially, and all members of your household may need
      to be treated also, since the infection may spread to persons in close contact.
      If these persons are not being treated or if you have any questions about this,
      check with your doctor.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage forms (cream and lotion): For scabies: Adults—Use two
        times. Apply one time the first day, and one time the second day. For severe
        cases, treatment may be repeated one time after one week. Children—Use and
        dose must be determined by your doctor. For pruritus: Adults—Use when necessary
        according to the directions on the label or your doctor''s instructions. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For scabies: Adults—Use two times. Apply one time the first day, and one
        time the second day. For severe cases, treatment may be repeated one time
        after one week. Children—Use and dose must be determined by your doctor.'
      - 'For pruritus: Adults—Use when necessary according to the directions on the
        label or your doctor''s instructions. Children—Use and dose must be determined
        by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Use two times. Apply one time the first day, and one time the second
        day. For severe cases, treatment may be repeated one time after one week.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults—Use when necessary according to the directions on the label or your
        doctor's instructions.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your condition does not improve or if it becomes worse, check with your
      doctor.
  - type: paragraph
    text: 'For patients using this medicine for scabies:'
  - type: list
    ordered: false
    items:
    - To prevent reinfection or spreading of the infection to other people, good health
      habits are also required. These include machine washing all underwear, pajamas,
      sheets, pillowcases, towels, and washcloths in very hot water and drying them
      using the hot cycle of a dryer. Clothing or bedding that cannot be washed in
      this way should be dry cleaned.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Skin irritation or rash not present before use of this medicine
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
