    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up suddenly from a lying or sitting position. Getting up slowly may help. If
      the problem continues or gets worse, check with your doctor.
  - type: paragraph
    text: Check with your doctor right away if you have bloody urine, a decrease in
      frequency or amount of urine, an increase in blood pressure, increased thirst,
      loss of appetite, lower back or side pain, nausea, swelling of the face, fingers,
      or lower legs, trouble breathing, unusual tiredness or weakness, vomiting, or
      weight gain. These could be symptoms of a serious kidney problem.
  - type: paragraph
    text: This medicine may cause hypokalemia(low potassium in the blood). Tell your
      doctor if you become sick with severe or continuing nausea, vomiting, or diarrhea,
      and drink fluids to prevent getting dehydrated. Check with your doctor right
      away if you have dry mouth, increased thirst, muscle cramps, or nausea or vomiting.
  - type: paragraph
    text: This medicine may cause some people to become dizzy. Do not drive, use machines,
      or do anything else that could be dangerous if you are dizzy .
  - type: paragraph
    text: This medicine may affect blood sugar levels. Diabetic patients may notice
      a change in the results of blood or urine sugar tests. Talk to your doctor if
      you have any questions.
  - type: paragraph
    text: Drinking alcoholic beverages may also make the dizziness worse. While you
      are taking this medicine, be careful to limit the amount of alcohol you drink.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes prescription or nonprescription (over-the-counter)
      medicines for appetite control, asthma, colds, cough, hay fever, or sinus problems.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - black, tarry stools
      - bleeding gums
      - blistering, peeling, or loosening of the skin
      - bloating
      - blood in the urine or stools
      - blurred vision
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - chest pain or tightness
      - chills
      - clay-colored stools
      - cold sweats
      - coma
      - confusion
      - cough or hoarseness
      - coughing up blood
      - darkened urine
      - decreased urine output
      - depression
      - diarrhea
      - difficulty having a bowel movement (stool)
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dry mouth
      - fast heartbeat
      - fever
      - flushed, dry skin
      - fruit-like breath odor
      - general feeling of tiredness or weakness
      - headache
      - hostility
      - increased hunger
      - increased thirst
      - increased urination
      - indigestion
      - irritability
      - itching or skin rash
      - joint pain, stiffness, or swelling
      - lethargy
      - loss of appetite
      - lower back or side pain
      - muscle twitching
      - nausea
      - pain in the joints or muscles
      - painful or difficult urination
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - pinpoint red spots on the skin
      - rapid weight gain
      - red, irritated eyes
      - red skin lesions, often with a purple center
      - redness, soreness or itching skin
      - seizures
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - sores, welting, or blisters
      - stomach pain
      - stupor
      - sugar in the urine
      - sweating
      - swelling of the feet or lower legs
      - swollen glands
      - trouble breathing
      - unpleasant breath odor
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - unusual weight loss
      - vomiting
      - vomiting of blood
      - weight loss
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cramping
      - decreased interest in sexual intercourse
      - feeling of constant movement of self or surroundings
      - hives
      - inability to have or keep an erection
      - increased sensitivity of the skin to sunlight
      - loss in sexual ability, desire, drive, or performance
      - muscle spasm
      - redness or other discoloration of the skin
      - restlessness
      - sensation of spinning
      - severe sunburn
      - weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
