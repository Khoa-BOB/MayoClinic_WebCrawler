    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the mixed oral liquid at or below room temperature for up to 4 weeks.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause serious types of allergic reactions, including anaphylaxis.
      Anaphylaxis can be life-threatening and requires immediate medical attention.
      Call your doctor right away if you have a rash, itching, hoarseness, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, mouth, or
      throat while you are using this medicine.
  - type: paragraph
    text: Call your doctor right away if you have severe stomach pain (with or without
      nausea or vomiting). This could be a symptom of intestinal angioedema.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may also occur, especially when
      you get up from a lying or sitting position or if you have been taking a diuretic
      (water pill). Make sure you know how you react to the medicine before you drive,
      use machines, or do other things that could be dangerous if you are dizzy or
      not alert . If you feel dizzy, lie down so you do not faint. Then sit for a
      few moments before standing to prevent the dizziness from returning.
  - type: paragraph
    text: Check with your doctor right away if you become sick while taking this medicine,
      especially with severe or continuing nausea, vomiting, or diarrhea. These conditions
      may cause you to lose too much water or salt and may lead to low blood pressure.
      You can also lose water by sweating, so drink plenty of water during exercise
      or in hot weather.
  - type: paragraph
    text: Check with your doctor if you have a fever, chills, or sore throat. These
      could be symptoms of an infection resulting from low white blood cells.
  - type: paragraph
    text: 'Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have the following symptoms:
      abdominal or stomach pain, confusion, difficulty with breathing, irregular heartbeat,
      nausea or vomiting, nervousness, numbness or tingling in the hands, feet, or
      lips, shortness of breath, or weakness or heaviness of the legs. Do not use
      supplements or salt substitutes containing potassium without first checking
      with your doctor .'
  - type: paragraph
    text: Check with your doctor right away if you have upper stomach pain, pale stools,
      dark urine, loss of appetite, nausea, unusual tiredness or weakness, or yellow
      eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: This medicine may affect blood sugar levels. If you notice a change in the
      results of your blood or urine sugar tests, or if you have any questions, check
      with your doctor.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery.
  - type: paragraph
    text: This medicine may be less effective in black patients. Black patients also
      have an increased risk of angioedema (swelling of the hands, arms, face, mouth,
      or throat).
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes over-the-counter (nonprescription) medicines for appetite control,
      asthma, colds, cough, hay fever, or sinus problems, since they may tend to increase
      your blood pressure.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - cloudy urine
      - confusion
      - decrease in urine output or decrease in urine-concentrating ability
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - sweating
      - unusual tiredness or weakness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - body aches or pain
      - chest pain
      - chills
      - common cold
      - cough
      - diarrhea
      - difficulty breathing
      - ear congestion
      - fever
      - headache
      - loss of voice
      - nasal congestion
      - nausea
      - runny nose
      - sneezing
      - sore throat
      - vomiting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm, back, or jaw pain
      - chest discomfort, tightness, or heaviness
      - fast or irregular heartbeat
      - general feeling of discomfort or illness
      - joint pain
      - loss of appetite
      - muscle aches and pains
      - shivering
      - trouble sleeping
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased interest in sexual intercourse
      - inability to have or keep an erection
      - lack or loss of strength
      - loss in sexual ability, desire, drive, or performance
      - rash
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - feeling of constant movement of self or surroundings
      - heartburn
      - indigestion
      - muscle cramps
      - sensation of spinning
      - stomach discomfort or upset
      - swelling
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
