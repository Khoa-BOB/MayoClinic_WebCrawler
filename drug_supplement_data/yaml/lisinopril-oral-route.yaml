    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angioedema (swelling of the face, lips, tongue, throat, arms, or legs) with
        other ACE inhibitors, history of—May increase risk of this condition occurring
        again.
    - type: list
      ordered: false
      items:
      - Collagen vascular disease (an autoimmune disease) together with kidney disease—Increased
        risk of blood problems.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Kidney problems—Increased risk of potassium levels in the body becoming too
        high.
    - type: list
      ordered: false
      items:
      - Diabetes patients who are also taking aliskiren (Tekturna®) or
      - Hereditary or idiopathic angioedema or
      - Patients who have kidney problems and are also taking aliskiren (Tekturna®)—Should
        not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Electrolyte imbalance (eg, low sodium in the blood) or
      - Fluid imbalances (caused by dehydration, vomiting, or diarrhea) or
      - Heart or blood vessel problems (eg, aortic stenosis, hypertrophic cardiomyopathy)
        or
      - Liver disease—Use with caution. May make these conditions worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these are most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure but it
      does help control it. Therefore, you must continue to take it as directed if
      you expect to lower your blood pressure and keep it down. You may have to take
      high blood pressure medicine for the rest of your life . If high blood pressure
      is not treated, it can cause serious problems such as heart failure, blood vessel
      disease, stroke, or kidney disease.
  - type: paragraph
    text: Measure the oral liquid correctly using the marked measuring spoon that
      comes with the package. Rinse the dosing spoon with water after each use.
  - type: paragraph
    text: If your child cannot swallow the tablets, an oral liquid may be given. Shake
      the oral liquid well just before each use. Ask your doctor or pharmacist about
      this.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage forms (solution or tablets): For high blood pressure: Adults—At
        first, 10 milligrams (mg) once a day. Your doctor may increase your dose as
        needed. However, the dose is usually not more than 40 mg per day. Children
        6 years of age and older—Dose is based on body weight and must be determined
        by your doctor. The starting dose is usually 0.07 mg per kilogram (kg) of
        body weight per day. Your doctor may adjust your dose as needed. However,
        the dose is usually not more than 0.61 mg per kg of body weight or 40 mg per
        day. Children younger than 6 years of age—Use is not recommended. For heart
        failure: Adults—At first, 5 milligrams (mg) once a day. Your doctor may increase
        your dose as needed. However, the dose is usually not more than 40 mg per
        day. Children—Use and dose must be determined by your doctor. For immediate
        treatment after a heart attack: Adults—At first, 5 milligrams (mg), followed
        by 5 mg after 24 hours, followed by 10 mg after 48 hours, and then 10 mg once
        a day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—At first, 10 milligrams (mg) once a day.
        Your doctor may increase your dose as needed. However, the dose is usually
        not more than 40 mg per day. Children 6 years of age and older—Dose is based
        on body weight and must be determined by your doctor. The starting dose is
