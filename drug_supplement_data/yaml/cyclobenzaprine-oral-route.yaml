        on Days 15 and onwards. However, the dose is usually not more than 5.6 mg
        per day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—At first, 2.8 milligrams (mg) once a day at bedtime on Days 1 to 14,
        followed by 5.6 mg once a day at bedtime on Days 15 and onwards. However,
        the dose is usually not more than 5.6 mg per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    - type: paragraph
      text: If you miss a dose of the sublingual tablet , take the next dose at your
        regular time. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      for any problems that may be caused by this medicine. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: If your condition does not improve within 2 or 3 weeks, or if it becomes
      worse, check with your doctor.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. If
      you can get pregnant, your doctor may do tests to make sure you are not pregnant
      before starting this medicine. Use an effective form of birth control to keep
      from getting pregnant during treatment with this medicine and for 2 weeks after
      the last dose. If you think you have become pregnant while using this medicine,
      tell your doctor right away.
  - type: paragraph
    text: Do not use the this medicine if you have used an MAO inhibitor (MAOI) (eg,
      isocarboxazid [Marplan®], linezolid [Zyvox®], phenelzine [Nardil®], selegiline
      [Eldepryl®], tranylcypromine [Parnate®]) within the past 14 days.
  - type: paragraph
    text: This medicine may cause a serious condition called serotonin syndrome if
      taken together with some medicines, including some pain or migraine medicines
      (eg, bupropion, meperidine, tramadol, Wellbutrin®, Demerol®, Zydol®) or medicines
      for depression (eg, SNRIs, SSRIs, TCAs). Check with your doctor right away if
      you have anxiety, restlessness, a fast heartbeat, fever, sweating, muscle spasms,
      twitching, nausea, vomiting, diarrhea, or see or hear things that are not there.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that slow down the nervous system, possibly causing drowsiness).
      Some examples of CNS depressants are antihistamines or medicine for hay fever,
      other allergies, or colds, sedatives, tranquilizers, or sleeping medicine, prescription
      pain medicine or narcotics, medicine for seizures or barbiturates, other muscle
      relaxants, or anesthetics, including some dental anesthetics. Check with your
      doctor before taking any of the above while you are using this medicine .
  - type: paragraph
    text: This medicine may cause some people to have blurred vision or to become
      drowsy, dizzy, or less alert than they are normally. Do not drive or do anything
      else that could be dangerous until you know how this medicine affects you .
  - type: paragraph
    text: This medicine may cause mouth problems. Check with your doctor right away
      if you have discomfort, irritation, numbness, pain, or tingling in the mouth.
  - type: paragraph
    text: Cyclobenzaprine may cause dryness of the mouth. For temporary relief, use
      sugarless candy or gum, melt bits of ice in your mouth, or use a saliva substitute.
      However, if your mouth continues to feel dry for more than 2 weeks, check with
      your medical doctor or dentist. Continuing dryness of the mouth may increase
      the chance of dental disease, including tooth decay, gum disease, and fungus
      infections.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Dry mouth or throat
      - excitement or nervousness
      - numbness, tingling, discomfort, or pain in your mouth, teeth, or tongue
      - trouble sleeping
      - unusual muscle weakness
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - anxiety
      - black, tarry stools
      - blurred vision
      - chest pain, discomfort, or tightness
      - chills
      - clumsiness or unsteadiness
      - confusion
      - cough
      - dark urine
      - difficulty in moving
      - difficulty swallowing
      - dizziness
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - fainting
      - fast, pounding, or irregular heartbeat or pulse
      - fever
      - headache
      - joint pain
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - light-colored stools
      - mental depression
      - muscle aches, cramps, pains, stiffness, or twitching
      - nausea
      - numbness, tingling, pain, or weakness in hands or feet
      - pain or discomfort in the arms, jaw, back, or neck
      - painful or difficult urination
      - pounding in the ears
      - problems in speaking
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - ringing or buzzing in the ears
      - seeing, hearing, or feeling things that are not there
      - seizures
      - shakiness in the legs, arms, hands, or feet
      - skin rash, hives, or itching
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - sweating
      - swelling
      - swollen glands
      - trembling or shaking of the hands or feet
      - trouble breathing
      - unusual bleeding or bruising
      - unusual thoughts or dreams
      - unusual tiredness or weakness
      - upper right abdominal or stomach pain
      - vomiting
      - yellow eyes or skin
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Drowsiness (severe)
      - dry, hot, flushed skin
      - fast or irregular heartbeat
      - hallucinations (seeing, hearing, or feeling things that are not there)
      - increase or decrease in body temperature
      - seizures
      - trouble breathing
      - unexplained muscle stiffness
      - unusual nervousness or restlessness (severe)
      - vomiting (occurring together with other symptoms of overdose)
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - bloated feeling or gas
      - constipation
      - diarrhea
      - frequent urination
      - general feeling of discomfort or illness
      - heartburn
      - indigestion
      - stomach discomfort, upset, or pain
      - unpleasant taste or other taste changes
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Inability to have or keep an erection
      - increased or loss interest in sexual intercourse
      - increased or loss in sexual ability, desire, drive, or performance
      - loss or thinning of the hair
      - swelling of the breasts or breast soreness in both females and males
      - swelling or inflammation of the mouth
      - swollen joints
      - unexpected or excess milk flow from the breasts
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
