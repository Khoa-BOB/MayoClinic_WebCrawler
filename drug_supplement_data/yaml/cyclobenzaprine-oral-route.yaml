title: Cyclobenzaprine (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Amrix
    - type: paragraph
      text: Fexmid
    - type: paragraph
      text: Flexeril
    - type: paragraph
      text: FusePaq Tabradol
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cyclobenzaprine is used to help relax certain muscles in your body. It helps
      relieve pain, stiffness, and discomfort caused by strains, sprains, or injuries
      to your muscles. However, this medicine does not take the place of rest, exercise
      or physical therapy, or other treatment that your doctor may recommend for your
      medical problem.
  - type: paragraph
    text: Cyclobenzaprine is also used to treat a condition called fibromyalgia (muscle
      pain and stiffness).
  - type: paragraph
    text: Cyclobenzaprine acts on the central nervous system (CNS) to produce its
      muscle relaxant effects. Its actions on the CNS may also cause some of this
      medicine's side effects.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule, Extended Release
    - Tablet
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of cyclobenzaprine extended-release capsules or sublingual
        tablet in the pediatric population. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of cyclobenzaprine sublingual tablet
        in the elderly.
    - type: paragraph
      text: Because of the possibility of higher blood levels in the elderly as compared
        to younger adults, use of cyclobenzaprine extended-release capsules is not
        recommended in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Cisapride
      - Dronedarone
      - Isocarboxazid
      - Levoketoconazole
      - Levomethadyl
      - Linezolid
      - Mesoridazine
