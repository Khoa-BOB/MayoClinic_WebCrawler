    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
      - Tobacco
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Heart attack, recent or
      - Heart block or
      - Heart rhythm problems (eg, arrhythmia) or
      - Hyperthyroidism (overactive thyroid)—Should not be used in patients with these
        conditions.
    - type: list
      ordered: false
      items:
      - Glaucoma, angle closure, history of or
      - Increased pressure in the eye, history of or
      - Seizures, history of or
      - Trouble urinating, history of—Use with caution. May these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease, mild—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body. .
    - type: list
      ordered: false
      items:
      - Liver disease, moderate or severe—Use is not recommended in patients with
        these conditions. .
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it and do not take it more often than your doctor ordered. To do so may increase
      the chance of serious side effects.
  - type: paragraph
    text: Swallow the extended-release capsule whole. If you cannot swallow the capsule
      whole, you may open the capsule and sprinkle the contents over 1 tablespoon
      of applesauce. Swallow the mixture right away without chewing. Rinse the mouth
      to make sure all of the medicine has been swallowed. Do not save any of the
      mixture to use later.
  - type: paragraph
    text: 'If you are using the sublingual tablet :'
  - type: list
    ordered: false
    items:
    - Drink a few sips of water before taking this medicine to make sure your mouth
      is moist to lessen numbness of the mouth. Take this medicine after brushing
      teeth.
    - Do not cut, crush, chew, or swallow it.
    - Place the tablet under the tongue until it is dissolved.
    - Do not eat or drink for at least 15 minutes until the tablets are completely
      dissolved. Do not drink hot, cold, or acidic drinks until the morning.
    - Do not talk for at least 5 minutes after taking this medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For relaxing stiff muscles: For oral dosage form (extended-release capsules):
        Adults—15 milligrams (mg) once a day. Some patients may need 30 mg (one 30
        mg capsule or two 15 mg capsules) per day. Children—Use and dose must be determined
        by your doctor . For oral dosage form (tablets): Adults and children 15 years
        of age and older—10 milligrams (mg) 3 times a day. The largest amount should
        be no more than 60 mg (six 10-mg tablets) a day. Children younger than 15
        years of age—Use and dose must be determined by your doctor.'
      - 'For fibromyalgia: For sublingual dosage form (tablets): Adults—At first,
        2.8 milligrams (mg) once a day at bedtime on Days 1 to 14, followed by 5.6
        mg once a day at bedtime on Days 15 and onwards. However, the dose is usually
        not more than 5.6 mg per day. Children—Use and dose must be determined by
        your doctor.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (extended-release capsules): Adults—15 milligrams (mg)
        once a day. Some patients may need 30 mg (one 30 mg capsule or two 15 mg capsules)
        per day. Children—Use and dose must be determined by your doctor .'
      - 'For oral dosage form (tablets): Adults and children 15 years of age and older—10
        milligrams (mg) 3 times a day. The largest amount should be no more than 60
        mg (six 10-mg tablets) a day. Children younger than 15 years of age—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—15 milligrams (mg) once a day. Some patients may need 30 mg (one 30
        mg capsule or two 15 mg capsules) per day.
      - Children—Use and dose must be determined by your doctor .
    - type: list
      ordered: false
      items:
      - Adults and children 15 years of age and older—10 milligrams (mg) 3 times a
        day. The largest amount should be no more than 60 mg (six 10-mg tablets) a
        day.
      - Children younger than 15 years of age—Use and dose must be determined by your
        doctor.
    - type: list
      ordered: false
      items:
      - 'For sublingual dosage form (tablets): Adults—At first, 2.8 milligrams (mg)
