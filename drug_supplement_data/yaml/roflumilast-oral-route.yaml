title: Roflumilast (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Daliresp
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Roflumilast is used to prevent the symptoms (flare-ups) of chronic obstructive
      pulmonary disease (COPD).
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of roflumilast in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of roflumilast in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adagrasib
      - Alprazolam
      - Amiodarone
      - Amlodipine
      - Amprenavir
      - Apalutamide
      - Aprepitant
      - Asciminib
      - Atazanavir
      - Atorvastatin
      - Avacopan
      - Azithromycin
      - Belumosudil
      - Berberine
      - Berotralstat
      - Bicalutamide
      - Boceprevir
      - Brodalumab
      - Cannabis
      - Capivasertib
      - Carbamazepine
      - Ceritinib
      - Chlorzoxazone
      - Cilostazol
      - Cimetidine
      - Ciprofloxacin
      - Clarithromycin
      - Clofazimine
      - Clotrimazole
      - Cobicistat
      - Conivaptan
      - Crizotinib
      - Cyclosporine
      - Daclatasvir
      - Daridorexant
      - Darunavir
      - Delavirdine
      - Desogestrel
      - Diazoxide
      - Dienogest
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Ethinyl Estradiol
      - Gestodene
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Bitter Orange
      - Blueberry
      - Cranberry Juice
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Depression, history of or
      - Mental illness, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease, moderate to severe—Should not be used in patients with this
        condition.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: This medicine comes with a Medication Guide. It is very important that you
      read and understand this information. Be sure to ask your doctor about anything
      you do not understand.
  - type: paragraph
    text: You may take this medicine with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For prevention of COPD: Adults—One 500 microgram
        (mcg) tablet per day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For prevention of COPD: Adults—One 500 microgram (mcg) tablet per day. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—One 500 microgram (mcg) tablet per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      . This will allow your doctor to see if the medicine is working properly and
      to decide if you should continue to take it.
  - type: paragraph
    text: This medicine is used to prevent acute flare-ups of COPD. It is not used
      to stop a flare-up that has already started. You should use an inhaled medicine
      for the acute flare-ups that will work quickly to help you breathe better. If
      you do not have an inhaled medicine for acute COPD flare-ups, or if you have
      any questions about this, check with your doctor.
  - type: paragraph
    text: This medicine may cause some people to be agitated or display other abnormal
      behaviors, such as feeling sad or hopeless, getting upset easily, having trouble
      sleeping, or feeling nervous or hostile. It may also cause some people to have
      suicidal thoughts and tendencies or to become more depressed. If you or your
      caregiver notice any of these side effects, tell your doctor right away.
  - type: paragraph
    text: This medicine may cause you to lose weight. Your doctor may need to check
      your weight on a regular basis while you are using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Unexplained weight loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - cough
      - diarrhea
      - discouragement
      - fear or nervousness
      - feeling sad or empty
      - fever
      - general feeling of discomfort or illness
      - headache
      - irritability
      - joint pain
      - loss of appetite
      - loss of interest or pleasure
      - muscle aches and pains
      - nausea
      - runny nose
      - shivering
      - sleeplessness
      - sore throat
      - sweating
      - thoughts of killing oneself or changes in behavior
      - tiredness
      - trouble concentrating
      - trouble sleeping
      - unable to sleep
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - back pain
      - bladder pain
      - bloody or cloudy urine
      - burning feeling in the chest or stomach
      - decreased appetite
      - difficult, burning, or painful urination
      - dizziness
      - frequent urge to urinate
      - indigestion
      - lower back or side pain
      - muscle spasm
      - pain or tenderness around the eyes and cheekbones
      - shakiness in the legs, arms, hands, or feet
      - shortness of breath or troubled breathing
      - sneezing
      - stomach upset
      - stuffy or runny nose
      - sweating
      - tenderness in the stomach area
      - tightness of the chest or wheezing
      - trembling or shaking of the hands or feet
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
