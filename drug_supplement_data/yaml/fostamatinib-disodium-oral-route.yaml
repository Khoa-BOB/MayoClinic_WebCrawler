title: Fostamatinib disodium (oral route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fostamatinib is used to treat low platelet levels (thrombocytopenia) in
      the blood in patients with chronic immune thrombocytopenia (ITP) who have received
      treatment that did not work well.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies on the relationship of age to the effects of fostamatinib
        have not been performed in the pediatric population. Use is not recommended
        in children. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of fostamatinib in the elderly. However,
        elderly patients are more likely to have serious unwanted effects, which may
        require caution in patients receiving fostamatinib.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Colchicine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Alpelisib
      - Apalutamide
      - Atazanavir
      - Avacopan
      - Carbamazepine
      - Clarithromycin
      - Conivaptan
      - Cyclosporine
      - Dabigatran Etexilate
      - Doxorubicin
      - Doxorubicin Hydrochloride Liposome
      - Ensartinib
      - Enzalutamide
      - Fedratinib
      - Fexinidazole
      - Finerenone
      - Fosphenytoin
      - Haloperidol
      - Itraconazole
      - Lefamulin
      - Letermovir
      - Lumacaftor
      - Mavorixafor
      - Methylergonovine
      - Mifepristone
      - Mitotane
      - Morphine
      - Morphine Sulfate Liposome
      - Nifedipine
      - Omaveloxolone
      - Phenobarbital
      - Phenytoin
      - Pimozide
      - Posaconazole
      - Primidone
      - Ranolazine
      - Relugolix
      - Repotrectinib
      - Rifampin
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Levothyroxine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood clot in your leg or lungs, recent or
      - Hypertension (high blood pressure) or
      - Infection, recent or
      - Liver disease or
      - Surgery (eg, splenectomy)—Use with caution. May cause side effects to become
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor . Do not take more of
      it, do not take it more often, and do not take it for a longer time than your
      doctor ordered.
  - type: paragraph
    text: This medicine should come with a patient information leaflet. Read and follow
      these instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You may take this medicine with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For thrombocytopenia: Adults—The starting
        dose is usually 100 milligrams (mg) 2 times a day. Your doctor may increase
        your dose as needed. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For thrombocytopenia: Adults—The starting dose is usually 100 milligrams
        (mg) 2 times a day. Your doctor may increase your dose as needed. Children—Use
        is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—The starting dose is usually 100 milligrams (mg) 2 times a day. Your
        doctor may increase your dose as needed.
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant during treatment
      with this medicine and for at least 1 month after the last dose. If you think
      you have become pregnant while using this medicine, tell your doctor right away.
  - type: paragraph
    text: Your blood pressure might get too high while you are using this medicine.
      This may cause headaches, dizziness, or blurred vision. You might need to measure
      your blood pressure at home. If you think your blood pressure is too high, call
      your doctor right away.
  - type: paragraph
    text: Check with your doctor right away if you have pain or tenderness in the
      upper stomach, pale stools, dark urine, loss of appetite, nausea, vomiting,
      or yellow eyes or skin. These could be symptoms of a serious liver problem.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry, stools
      - blurred vision
      - chest pain
      - chills
      - cough
      - diarrhea
      - dizziness
      - fever
      - headache
      - lower back or side pain
      - nervousness
      - painful or difficult urination
      - pale skin
      - pounding in the ears
      - slow or fast heartbeat
      - sore throat
      - stomach pain
      - ulcers, sores, or white spots in the mouth
      - unusual bleeding or bruising
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Check with your doctor immediately if any of the following side effects
        occur:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Nausea
      - rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
