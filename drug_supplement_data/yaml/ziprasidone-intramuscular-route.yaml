    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood or bone marrow problems (eg, agranulocytosis, leukopenia, neutropenia)
        or
      - Diabetes or
      - Hyperglycemia (high blood sugar) or
      - Hyperprolactinemia (high prolactin in the blood) or
      - Neuroleptic malignant syndrome (NMS), history of or
      - Priapism (painful or prolonged erection of the penis) or
      - Seizures, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Bradycardia (slow heartbeat) or
      - Dehydration or
      - Heart or blood vessel disease or
      - Hypokalemia (low potassium in the blood) or
      - Hypomagnesemia (low magnesium in the blood) or
      - Hypotension (low blood pressure) or
      - Hypovolemia (low amount of blood) or
      - Stroke, history of or
      - Trouble with swallowing—May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Heart attack, recent acute or
      - Heart failure, uncompensated or
      - Heart rhythm problems (eg, congenital long QT syndrome, QT prolongation)—Should
        not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Kidney disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine
      in a clinic or hospital setting. This medicine is given as a shot into one of
      your muscles.
  - type: paragraph
    text: Your doctor will give you a few doses of this medicine until your condition
      improves, and then switch you to an oral medicine that works the same way. If
      you have any concerns about this, talk to your doctor.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your progress after you receive this medicine to
      make sure that it is working properly. Blood tests may be needed to check for
      unwanted effects.
  - type: paragraph
    text: Do not use this medicine together with amiodarone (Cordarone®), arsenic
      trioxide, chlorpromazine (Thorazine®), disopyramide (Norpace®), dofetilide (Tikosyn®),
      dolasetron mesylate (Anzemet®), droperidol (Inapsine®), gatifloxacin (Tequin®),
      halofantrine, levomethadyl acetate, mefloquine (Lariam®), mesoridazine (Serentil®),
      moxifloxacin (Avelox®), pentamidine (Nebupent®), pimozide (Orap®), probucol,
      procainamide (Pronestyl®), quinidine (Cardioquin®), sotalol (Betapase®), sparfloxacin
      (Zagam®), tacrolimus (Prograf®), or thioridazine (Mellaril®). Using these medicines
      together may cause serious unwanted effects .
  - type: paragraph
    text: Do not use this medicine if you are using or have used an MAO inhibitor
      (MAOI), including linezolid (Zyvox®) or methylene blue injection within the
      past 14 days. If you are using an MAO inhibitor, take it at least 3 days after
      stopping ziprasidone.
  - type: paragraph
    text: This medicine can cause changes in the heart rhythm, including QT prolongation.
      It may change the way your heart beats and cause fainting or serious side effects.
      Tell your doctor right away if you have fast, pounding, or irregular heartbeats.
  - type: paragraph
    text: This medicine may cause a serious condition called serotonin syndrome when
      taken with some medicines. This includes medicines to treat depression, including
      buspirone (Buspar®), citalopram (Celexa®), duloxetine (Cymbalta®), escitalopram
      (Lexapro®), fentanyl (Actiq®), fluoxetine (Prozac®, Sarafem®, or Symbyax®),
      fluvoxamine (Luvox®), lithium (Eskalith®), meperidine (Demerol®), methadone
      (Methadose®), olanzapine (Zyprexa®), paroxetine (Paxil®), sertraline (Zoloft®),
      tramadol (Ultram®), tryptophan (Tryptan®), or venlafaxine (Effexor®). Check
      with your doctor right away if you have agitation, confusion, diarrhea, excitement
      while talking that is not normal, fever, overactive reflexes, poor coordination,
      restlessness, shivering, sweating, trembling or shaking that you cannot control,
      or twitching. These could be symptoms of serotonin syndrome.
  - type: paragraph
    text: Check with your doctor right away if you have difficulty with breathing,
      a fast heartbeat, a high fever, high or low blood pressure, increased sweating,
      loss of bladder control, seizures, severe muscle stiffness, unusually pale skin,
      or tiredness. These could be symptoms of a serious condition called neuroleptic
      malignant syndrome (NMS).
  - type: paragraph
    text: If you develop a skin rash, hives, or any allergic reaction to this medicine,
      check with your doctor as soon as possible.
  - type: paragraph
    text: Check with your doctor right away if you have a fever, chills, cough, sore
      throat, swollen, painful, or tender lymph glands in the neck, armpit, or groin,
      or yellow skin or eyes while using this medicine. These could be symptoms of
      a serious condition called drug reaction with eosinophilia and systemic symptoms
      (DRESS).
  - type: paragraph
    text: Serious skin reactions, including Stevens-Johnson syndrome can occur with
      this medicine. Check with your doctor right away if you have blistering, peeling,
      or loosening of the skin, red skin lesions, severe acne or skin rash, sores
      or ulcers on the skin, or fever or chills while you are using this medicine.
  - type: paragraph
    text: This medicine may cause tardive dyskinesia (a movement disorder). Check
      with your doctor right away if you have lip smacking or puckering, puffing of
      the cheeks, rapid or worm-like movements of the tongue, uncontrolled chewing
      movements, or uncontrolled movements of the arms and legs while you are using
      this medicine.
  - type: paragraph
    text: This medicine may increase the amount of sugar in your blood. Check with
      your doctor right away if you have increased thirst or increased urination.
      If you have diabetes, you may notice a change in the results of your urine or
      blood sugar tests. If you have any questions, check with your doctor.
  - type: paragraph
    text: Ziprasidone can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. If you can, avoid people
      with infections. Check with your doctor right away if you think you are getting
      an infection, or you have a fever or chills, a cough or hoarseness, lower back
      or side pain, or painful or difficult urination.
  - type: paragraph
    text: This medicine may cause some people to become drowsy or dizzy, or may cause
      trouble with thinking or controlling body movements, which may lead to falls,
      fractures, or other injuries. Make sure you know how you react to this medicine
      before you drive, use machines, or do anything else that requires you to be
      alert, well-coordinated, or able to think well .
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up suddenly from a lying or sitting position. Getting up slowly may help. If
      the problem continues or gets worse, check with your doctor.
  - type: paragraph
    text: Ziprasidone injection may cause some people to be agitated, irritable, or
      display other abnormal behaviors. It may also cause some people to have suicidal
      thoughts and tendencies. If you or your caregiver notice any of these side effects,
      tell your doctor right away.
  - type: paragraph
    text: You may get overheated more easily while you are using this medicine. Be
      careful if you exercise often or are exposed to high temperatures or humidity.
      Drink more water and stay out of the sun.
  - type: paragraph
    text: Avoid drinking alcohol while you are using this medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (eg, St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - cold sweats
      - confusion
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - bleeding or bloody stools
      - blurred vision
      - breathing too fast
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - change in personality
      - chest pain or discomfort
      - cough
      - diarrhea
      - difficulty with speaking
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - drooling
      - dry mouth
      - feeling of warmth or heat
      - feeling, seeing, or hearing things that are not there
      - fever
      - flushing or redness of the skin, especially on the face and neck
      - general feeling of discomfort or illness
      - irritability
      - joint pain
      - loss of appetite
      - loss of balance control
      - multiple swollen and inflamed skin lesions
      - muscle aches, pains, discomfort, tension, tightness, trembling, jerking, or
        stiffness
      - nausea
      - painful or prolonged erection of the penis
      - pounding in the ears
      - restlessness
      - runny nose
      - severe mood or mental changes
      - shaking
      - shivering
      - shuffling walk
      - slow or fast heartbeat
      - sore throat
      - stiffness of the limbs
      - sweating
      - trouble sleeping
      - twisting movements of the body
      - uncontrolled movements, especially of the face, neck, and back
      - unusual behavior
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Actions that are out of control
      - difficulty with breathing
      - high fever
      - high or low blood pressure
      - hives or itching
      - lip smacking or puckering
      - loss of bladder control
      - overactive reflexes
      - poor coordination
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - rapid or worm-like movements of the tongue
      - seizures
      - talking or acting with excitement you cannot control
      - trembling
      - twitching
      - unexpected or excess milk flow from the breasts
      - unusually pale skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Pain at the site of injection
      - sleepiness or unusual drowsiness
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - back pain
      - belching
      - constipation
      - cramps
      - heartburn
      - heavy bleeding
      - inability to sit still
      - indigestion
      - need to keep moving
      - pain
      - sneezing
      - stomach discomfort, upset, or pain
      - stuffy nose
      - tooth disorder
      - weight loss
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
