title: Framycetin (ophthalmic route)
sections:
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Framycetin belongs to the family of medicines called antibiotics. Framycetin
      ophthalmic preparations are used to treat infections of the eye.
  - type: paragraph
    text: Framycetin is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Studies on this medicine have been done only in adult patients, and there
        is no specific information comparing use of framycetin in children with use
        in other age groups.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of framycetin in the elderly
        with use in other age groups.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: 'For patients using the eye drops form of this medicine:'
  - type: list
    ordered: false
    items:
    - The bottle is only partially full to provide proper drop control.
    - First, wash your hands. Tilt the head back and, pressing your finger gently
      on the skin just beneath the lower eyelid, pull the lower eyelid away from the
      eye to make a space. Drop the medicine into this space. Let go of the eyelid
      and gently close the eyes. Do not blink. Keep the eyes closed and apply pressure
      to the inner corner of the eye with your finger for 1 or 2 minutes to allow
      the medicine to be absorbed by the eye.
    - Remove any excess solution around the eye with a clean tissue, being careful
      not to touch the eye.
  - type: paragraph
    text: 'For patients using the eye ointment form of this medicine:'
  - type: list
    ordered: false
    items:
    - First, wash your hands. Tilt the head back and with the index finger of one
      hand, press gently on the skin just beneath the lower eyelid and pull the lower
      eyelid away from the eye to make a space. Squeeze a thin strip of ointment into
      this space. A 1-cm (approximately 1/3-inch) strip of ointment is usually enough
      unless otherwise directed by your doctor. Let go of the eyelid and gently close
      the eyes and keep them closed for 1 or 2 minutes, to allow the medicine to come
      into contact with the infection.
    - To keep the medicine as germ-free as possible, do not touch the applicator tip
      to any surface (including the eye). After using framycetin eye ointment, wipe
      the tip of the ointment tube with a clean tissue and keep the tube tightly closed.
  - type: paragraph
    text: To help clear up your infection completely, keep using this medicine for
      the full time of treatment, even if your symptoms have disappeared. Do not miss
      any doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For ophthalmic ointment (eye ointment) dosage form: For eye infections: Adults—Apply
        to the affected eye 2 or 3 times per day, or at bedtime if the drops have
        been used during the day. Children—Use and dose must be determined by your
        doctor.'
      - 'For ophthalmic solution (eye drops) dosage form: For eye infections: Adults—Apply
        1 or 2 drops to the affected eye every one or two hours for the first two
        or three days. Your doctor may then instruct you to decrease your dose to
        1 or 2 drops to the affected eye 3 or 4 times per day. Children—Use and dose
        must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For eye infections: Adults—Apply to the affected eye 2 or 3 times per day,
        or at bedtime if the drops have been used during the day. Children—Use and
        dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply to the affected eye 2 or 3 times per day, or at bedtime if the
        drops have been used during the day.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For eye infections: Adults—Apply 1 or 2 drops to the affected eye every one
        or two hours for the first two or three days. Your doctor may then instruct
        you to decrease your dose to 1 or 2 drops to the affected eye 3 or 4 times
        per day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—Apply 1 or 2 drops to the affected eye every one or two hours for the
        first two or three days. Your doctor may then instruct you to decrease your
        dose to 1 or 2 drops to the affected eye 3 or 4 times per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If your symptoms do not improve within a few days, or if they become worse,
      check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: A medicine may cause some unwanted effects. If you notice any side effects,
      check with your doctor.
