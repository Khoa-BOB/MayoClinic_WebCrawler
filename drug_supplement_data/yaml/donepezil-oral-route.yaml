      - nasal congestion
      - pain in chest, upper stomach, or throat
      - problems with speech
      - runny nose
      - severe thirst
      - shortness of breath
      - sneezing
      - sore throat
      - sunken eyes
      - tightness in chest
      - tremor
      - troubled breathing
      - wheezing
      - wrinkled skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back, leg, or stomach pains
      - bleeding gums
      - chest pain or discomfort
      - coma
      - convulsions
      - dark urine
      - difficulty breathing
      - fast or irregular heartbeat
      - fatigue
      - general body swelling
      - general tiredness and weakness
      - high fever
      - increased thirst
      - indigestion
      - light-colored stools
      - muscle pain or cramps
      - nausea and vomiting
      - nosebleeds
      - pains in stomach, side, or abdomen, possibly radiating to the back
      - pale skin
      - rash
      - seeing, hearing, or feeling things that are not there
      - seizures
      - severe muscle stiffness
      - severe nausea
      - slow or irregular heartbeat
      - stomach pain
      - sweating
      - swelling of face, ankles, or hands
      - tiredness
      - unusually pale skin
      - upper right abdominal or stomach pain
      - yellow eyes and skin
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Convulsions (seizures)
      - increased sweating
      - increased watering of mouth
      - increasing muscle weakness
      - low blood pressure
      - severe nausea
      - severe vomiting
      - slow heartbeat
      - troubled breathing
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
