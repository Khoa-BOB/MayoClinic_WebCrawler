title: Fam-trastuzumab deruxtecan-nxki (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Enhertu
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Fam-trastuzumab deruxtecan-nxki injection is used to treat HER2-positive
      (IHC 3+ or ISH positive) metastatic (cancer that has spread to other parts of
      the body) or unresectable (cancer that cannot be removed with surgery) breast
      cancer in patients who have previously received an anti-HER2 breast cancer treatment
      for metastatic disease or have breast cancer that has come back during or within
      6 months of completing treatment for early-stage breast cancer.
  - type: paragraph
    text: Fam-trastuzumab deruxtecan-nxki injection is also used to treat HER2-low
      metastatic (cancer that has spread to other parts of the body) or unresectable
      (cancer that cannot be removed with surgery) breast cancer in patients who have
      previously received treatment for metastatic disease or have breast cancer that
      has come back during or within 6 months of completing treatment (after surgery).
      This medicine is also used to treat HR-positive, HER2-low or HR-positive, HER2-ultralow
      breast cancer that has spread to other parts of the body cannot be removed with
      surgery in patients who have received one or more endocrine treatments.
  - type: paragraph
    text: Fam-trastuzumab deruxtecan-nxki injection is also used to treat metastatic
      (cancer that has spread to other parts of the body) or unresectable (cancer
      that cannot be removed with surgery) non-small cell lung cancer (NSCLC) in patients
      whose cancer has an abnormal HER2 gene and who have previously received treatment.
  - type: paragraph
    text: Fam-trastuzumab deruxtecan-nxki injection is also used to treat HER2-positive
      (IHC 3+ or IHC 2+/ ISH positive) metastatic (cancer that has spread to other
      parts of the body) or locally advanced (cancer that has spread to areas near
      the stomach) stomach cancer called gastric or gastroesophageal junction (GEJ)
      adenocarcinoma in patients who have previously received trastuzumab-based regimen.
  - type: paragraph
    text: Fam-trastuzumab deruxtecan-nxki injection is also used to treat HER2-positive
      (IHC 3+) metastatic (cancer that has spread to other parts of the body) or unresectable
      (cancer that cannot be removed with surgery) solid tumors in patients who have
      previously received treatment that did not work well.
  - type: paragraph
    text: Your doctor will test for the presence of the HER2 gene. HER2 protein is
      produced by some tumors. Fam-trastuzumab deruxtecan-nxki interferes with the
      growth of this protein which also prevents tumor growth. The tumor cells will
      then be destroyed by the body.
  - type: paragraph
    text: This medicine is to be given only by or under the immediate supervision
      of your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Enhertu® in the pediatric population. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Enhertu® in the elderly. However,
        elderly patients are more likely to have unwanted side effects which may require
        caution in patients receiving this medicine.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Rotavirus Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Heart disease, history of or
      - Interstitial lung disease or
      - Neutropenia (low number of white blood cells) or
      - Pneumonitis (lung disease) or—Use with caution. May make these conditions
        worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Medicines used to treat cancer are very strong and can have many side effects.
      Before receiving this medicine, make sure you understand all the risks and benefits.
      It is important for you to work closely with your doctor during your treatment.
  - type: paragraph
    text: A doctor or other trained health professional will give you this medicine
      in a medical facility. It is given through an IV catheter that is placed into
      one of your veins. The medicine must be given slowly, so the IV will have to
      stay in place for at least 30 to 90 minutes. The injection is usually given
      once every 3 weeks.
  - type: paragraph
    text: You may also receive other medicines to help prevent nausea and vomiting.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress closely while
      receiving the medicine and at regular visits . This will allow your doctor to
      see if the medicine is working properly and to decide if you should continue
      to receive it. Blood tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Receiving this medicine while you are pregnant can harm your unborn baby.
      It may also cause birth defects if the father is receiving it when his sexual
      partner becomes pregnant. If you can get pregnant, your doctor may do tests
      to make sure you are not pregnant before starting treatment. Female patients
      should use effective birth control during treatment with this medicine and for
      7 months after the last dose. Male patients who have female partners should
      use effective birth control during treatment with this medicine and for 4 months
      after the last dose. If you think you have become pregnant while receiving the
      medicine, tell your doctor right away.
  - type: paragraph
    text: Talk with your doctor before receiving this medicine if you plan to have
      children. Some male patients who receive this medicine have become infertile
      (unable to have children).
  - type: paragraph
    text: Tell your doctor right away if you are having chest pain or tightness, chills,
      cough, fever, general feeling or discomfort or illness, thickening of bronchial
      secretions, or trouble breathing while receiving this medicine. These could
      be symptoms of a serious lung problem (eg, interstitial lung disease or pneumonitis).
  - type: paragraph
    text: 'This medicine can temporarily lower the number of white blood cells in
      your blood, increasing the chance of getting an infection. It can also lower
      the number of platelets, which are necessary for proper blood clotting. If this
      occurs, there are certain precautions you can take, especially when your blood
      count is low, to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - If you can, avoid people with infections. Check with your doctor immediately
      if you think you are getting an infection or if you have fever or chills, cough
      or hoarseness, lower back or side pain, or painful or difficult urination.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising,
      black, tarry stools, blood in the urine or stools, or pinpoint red spots on
      your skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Do not touch your eyes or the inside of your nose unless you have just washed
      your hands and have not touched anything else in the meantime.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
    - Avoid contact sports or other situations where bruising or injury could occur.
  - type: paragraph
    text: This medicine may cause heart failure. Your doctor may test your heart before
      and during treatment. Contact your doctor right away if you have chest pain,
      increased coughing, trouble breathing, rapid weight gain, or swelling in your
      ankles or legs. These could be symptoms of heart failure.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - bloody nose
      - bone or muscle pain
      - burning, numbness, tingling, or painful sensations
      - chest pain or tightness
      - chills
      - cough
      - decreased urine output
      - diarrhea
      - difficult breathing
      - dilated neck veins
      - dry mouth
      - fever
      - general feeling of discomfort or illness
      - headache
      - increased thirst
      - irregular breathing
      - irregular heartbeat
      - loss of appetite
      - lower back or side pain
      - mood changes
      - muscle cramps
      - nausea or vomiting
      - new loss of taste or smell
      - numbness or tingling in the hands, feet, or lips
      - painful or difficult urination
      - pale skin
      - seizures
      - sneezing
      - sore throat
      - stuffy or runny nose
      - swelling of the face, fingers, feet, or lower legs
      - thickening of bronchial secretions
      - trouble breathing
      - ulcers, sores, or white spots in the mouth
      - unsteadiness or awkwardness
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - weakness in the arms, hands, legs, or feet
      - weight gain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty swallowing
      - dizziness
      - fast heartbeat
      - flushing
      - hives, itching, skin rash
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - constipation
      - decreased appetite
      - dry eyes
      - hair loss or thinning of the hair
      - headache
      - heartburn
      - indigestion
      - stomach discomfort, upset, or pain
      - swelling or inflammation of the mouth
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloated
      - change in taste
      - darkening of the skin
      - excess air or gas in the stomach or intestines
      - full feeling
      - passing gas
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
