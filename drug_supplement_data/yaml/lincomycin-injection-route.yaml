title: Lincomycin (injection route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Lincocin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Lincomycin injection treats bacterial infections. It may be also given to
      patients who have an allergic reaction to penicillin antibiotics.
  - type: paragraph
    text: Lincomycin belongs to the family of medicines called antibiotics. It works
      by killing bacteria or preventing their growth. However, this medicine will
      not work for colds, flu, or other virus infections.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of lincomycin injection in children younger than 1 month of
        age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of lincomycin injection in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Ascorbic Acid
      - Cholera Vaccine, Live
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy, history of or
      - Asthma, history of or
      - Diarrhea or
      - Stomach or bowel disease (eg, colitis), history of or—Use with caution. May
        make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, severe or
      - Liver disease, severe—Use with caution. The effects may be increased because
        of slower removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this medicine. This medicine is given as a shot into a muscle, vein or eye.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your or your child's progress
      while you are receiving this medicine . This will allow your doctor to see if
      the medicine is working properly and to decide if you should continue to receive
      it. Blood and urine tests may be needed to check for unwanted effects.
  - type: paragraph
    text: Do not use this medicine together with erythromycin (Ery-Tab®).
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and require immediate medical attention. Call
      your doctor right away if you or your child have a rash, itching, hives, hoarseness,
      trouble breathing, trouble swallowing, or any swelling of your hands, face,
      or mouth after you receive this medicine.
  - type: paragraph
    text: Lincomycin injection may cause diarrhea, and in some cases it can be severe.
      It may occur 2 months or more after you stop using this medicine. Do not take
      any medicine to treat diarrhea without first checking with your doctor. Diarrhea
      medicines may make the diarrhea worse or make it last longer. If you have any
      questions about this or if mild diarrhea continues or gets worse, check with
      your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain or tenderness
      - black, tarry stools
      - blistering, peeling, or loosening of the skin
      - blurred vision
      - chills
      - clay-colored stools
      - confusion
      - cough
      - dark urine
      - diarrhea
      - difficulty with swallowing
      - dizziness dizziness, faintness, or lightheadedness when getting up suddenly
        from a lying or sitting position
      - fast heartbeat
      - fever
      - headache
      - hives, itching, or rash
      - joint or muscle pain
      - loss of appetite
      - lower back or side pain
      - nausea
      - painful or difficult urination
      - pale skin
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - red skin lesions, often with a purple center
      - red, irritated eyes
      - severe abdominal or stomach cramps and pain
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - sweating
      - tightness in the chest
      - ulcers, sores, or white spots in the mouth
      - unpleasant breath odor
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - vomiting of blood
      - watery and severe diarrhea, which may also be bloody
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach discomfort
      - continuing ringing or buzzing or other unexplained noise in the ears
      - feeling of constant movement of self or surroundings
      - hearing loss
      - pain, redness, or hard lumps at the injection site
      - redness, swelling, or soreness of the tongue
      - sensation of spinning
      - sleepiness or unusual drowsiness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
