    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Angina (severe chest pain) or
      - Electrolyte imbalances (e.g., low sodium in the body) or
      - Fluid imbalances (caused by dehydration, vomiting, or diarrhea) or
      - Heart attack, recent or
      - Heart problems (e.g., aortic stenosis, heart failure) or
      - Kidney problems or
      - Patients undergoing surgery or dialysis—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Congestive heart failure, severe—Use may lead to kidney problems.
    - type: list
      ordered: false
      items:
      - Angioedema (an allergic reaction) with other blood pressure medicines (e.g.,
        benazepril, enalapril, lisinopril, Lotrel®, Vasotec®, Zestoretic®, Zestril®),
        history of or
      - Diabetes patients who are also taking aliskiren (Tekturna®)—Should not be
        used in these patients.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Amlodipine and valsartan combination is used when a single medicine to lower
      your blood pressure is not enough. It is also used as the first medicine to
      treat your condition if your doctor feels that you need to take more than one
      blood pressure medicine.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these are most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure, but
      it does help control it. You must continue to take it as directed if you expect
      to lower your blood pressure and keep it down. You may have to take high blood
      pressure medicine for the rest of your life . If high blood pressure is not
      treated, it can cause serious problems such as heart failure, blood vessel disease,
      stroke, or kidney disease.
  - type: paragraph
    text: You may take this medicine with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For high blood pressure: Adults—One tablet
        once a day. Your doctor may increase your dose as needed. However, the dose
        is usually not more than amlodipine 10 milligrams (mg) and valsartan 320 mg
        per day. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—One tablet once a day. Your doctor may increase
        your dose as needed. However, the dose is usually not more than amlodipine
        10 milligrams (mg) and valsartan 320 mg per day. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—One tablet once a day. Your doctor may increase your dose as needed.
        However, the dose is usually not more than amlodipine 10 milligrams (mg) and
        valsartan 320 mg per day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood and urine tests may be
      needed to check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may also occur, especially when
      you get up from a lying or sitting position or if you have been taking a diuretic
      (water pill). Make sure you know how you react to this medicine before you drive,
      use machines, or do anything else that could be dangerous if you are dizzy or
      not alert . If you feel dizzy, lie down so you do not faint. Then sit for a
      few moments before standing to prevent the dizziness from returning.
  - type: paragraph
    text: Check with your doctor right away if you become sick while taking this medicine,
      especially with severe or continuing nausea, vomiting, or diarrhea. These conditions
      may cause you to lose too much water or salt which may cause low blood pressure.
      You can also lose water by sweating, so drink plenty of water during exercise
      or in hot weather.
  - type: paragraph
    text: This medicine may worsen the symptoms of angina (chest pain) or cause a
      heart attack in certain patients with severe heart or blood vessel disease.
      Check with your doctor right away if you are having chest pain or discomfort,
      fast or uneven heartbeat, nausea or vomiting, pain or discomfort in the arms,
      jaw, back, or neck, shortness of breath, or sweating.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery or medical tests.
  - type: paragraph
    text: 'Hyperkalemia (high potassium in the blood) may occur in certain people
      receiving this medicine. Check with your doctor right away if you have the following
      symptoms: abdominal or stomach pain, confusion, difficulty with breathing, irregular
      heartbeat, nausea or vomiting, nervousness, numbness or tingling in the hands,
      feet, or lips, shortness of breath, or weakness or heaviness of the legs. Ask
      your doctor before you use any medicines, supplements, or salt substitutes that
      contain potassium .'
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This especially includes over-the-counter (nonprescription) medicines for appetite
      control, asthma, colds, cough, hay fever, or sinus problems, since they may
      tend to increase your blood pressure.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloating or swelling of the face, arms, hands, lower legs, or feet
      - rapid weight gain
      - tingling of the hands or feet
      - unusual weight gain or loss
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - chills
      - cough
      - difficulty with breathing
      - dizziness
      - ear congestion
      - fever
      - headache
      - loss of voice
      - muscle aches
      - sneezing
      - sore throat
      - stuffy or runny nose
      - unusual tiredness or weakness
    subsections: []
  - heading: Rare
