      - dry mouth
      - fast, irregular, pounding, or racing heartbeat or pulse
      - flushed, dry skin
      - heart murmur
      - hives
      - hoarseness
      - indigestion
      - itching
      - joint pain, stiffness, or swelling
      - loss of appetite
      - nausea
      - pain in the lower back, bottom, or hips
      - pain in the upper leg
      - pain or tenderness around the eyes and cheekbones
      - rash
      - redness of the skin
      - stomach cramps, tenderness, or pain
      - sweating
      - swelling of the eyelids, face, lips, hands, or feet
      - tightness of the chest
      - trouble with swallowing
      - troubled breathing
      - vomiting
      - watery or bloody diarrhea
      - weakness
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest discomfort
      - cold, clammy skin
      - fast, weak pulse
      - flushing
      - lightheadedness or fainting
      - slow heartbeat
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - back pain
      - belching
      - bone pain
      - continuing ringing or buzzing or other unexplained noise in the ears
      - difficulty having a bowel movement (stool)
      - difficulty with moving
      - fear or nervousness
      - feeling sad or empty
      - full or bloated feeling
      - hearing loss
      - heartburn
      - inability to have or keep an erection
      - increased sensitivity to sunlight
      - irritability
      - itching, pain, redness, or swelling of the eye or eyelid
      - lack or loss of strength
      - loss in sexual ability, desire, drive, or performance
      - loss of interest or pleasure
      - muscle aching or cramping
      - pain in the arms or legs
      - passing gas
      - pressure in the stomach
      - redness in the joints
      - redness of the skin
      - sensation of spinning
      - skin rash, encrusted, scaly, and oozing
      - sleepiness or unusual drowsiness
      - swelling of the abdominal or stomach area
      - tiredness
      - toothache
      - trouble concentrating
      - unable to sleep
      - unusually warm skin
      - watering of the eyes
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
