title: Amlodipine and valsartan (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Exforge
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Amlodipine and valsartan is a combination of medicines that are used to
      treat high blood pressure (hypertension). High blood pressure adds to the workload
      of the heart and arteries. If it continues for a long time, the heart and arteries
      may not function properly. This can damage the blood vessels of the brain, heart,
      and kidneys, resulting in a heart failure or kidney failure. Lowering blood
      pressure reduces the risk of strokes and heart attacks.
  - type: paragraph
    text: Amlodipine is a calcium channel blocker (CCB). It affects the movement of
      calcium into the cells of the heart and blood vessels. As a result, amlodipine
      relaxes the blood vessels and increases the supply of blood and oxygen to the
      heart while reducing its workload.
  - type: paragraph
    text: Valsartan is an angiotensin II receptor blocker (ARB). It works by blocking
      a substance in the body that causes blood vessels to tighten. As a result, valsartan
      relaxes the blood vessels. This lowers blood pressure and increases the supply
      of blood and oxygen to the heart.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of amlodipine and valsartan combination in the pediatric population.
        Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of amlodipine and valsartan combination
        in the elderly. However, elderly patients may be more sensitive to the effects
        of this medicine than younger adults, which may require caution in patients
        receiving amlodipine and valsartan combination.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Aliskiren
      - Benazepril
      - Captopril
