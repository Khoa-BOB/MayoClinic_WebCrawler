        the week; or 6 mg per kilogram (2.7 mg per pound) of body weight is injected
        into a vein once a day for five days of the week. Children—Use and dose must
        be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—Dose is based on body weight and must be determined by
        your doctor. At first, 5 mg per kilogram (2.3 mg per pound) of body weight
        is injected into a vein every twelve hours for fourteen to twenty-one days.
        Then, 5 mg per kilogram (2.3 mg per pound) of body weight is injected into
        a vein once a day for seven days of the week; or 6 mg per kilogram (2.7 mg
        per pound) of body weight is injected into a vein once a day for five days
        of the week.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults and teenagers—Dose is based on body weight and must be determined by
        your doctor. At first, 5 mg per kilogram (2.3 mg per pound) of body weight
