        of body weight is injected into a vein once a day for five days of the week.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: 'Ganciclovir can lower the number of white blood cells in your blood, increasing
      the chance of getting an infection. It can also lower the number of platelets,
      which are necessary for proper blood clotting. If this occurs, there are certain
      precautions you can take to reduce the risk of infection or bleeding:'
  - type: list
    ordered: false
    items:
    - Check with your doctor immediately if you think you are getting an infection
      or if you get a fever or chills.
    - Check with your doctor immediately if you notice any unusual bleeding or bruising;
      black, tarry stools; blood in urine or stools; or pinpoint red spots on your
      skin.
    - Be careful when using a regular toothbrush, dental floss, or toothpick. Your
      medical doctor, dentist, or nurse may recommend other ways to clean your teeth
      and gums. Check with your medical doctor before having any dental work done.
    - Be careful not to cut yourself when you are using sharp objects such as a safety
      razor or fingernail or toenail cutters.
  - type: paragraph
    text: The use of birth control is recommended for both men and women. Women should
      use effective birth control methods while receiving this medicine. Men should
      use a condom during treatment with this medicine and for at least 90 days after
      treatment has been completed.
  - type: paragraph
    text: It is very important that your doctor check you at regular visits for any
      blood problems that may be caused by this medicine.
  - type: paragraph
    text: 'If you have CMV retinitis: It is also very important that your ophthalmologist
      (eye doctor) check your eyes at regular visits since it is still possible that
      you may have some loss of eyesight during ganciclovir treatment.'
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: Medicines like ganciclovir can sometimes cause serious side effects such
      as blood problems; these are described below. Discuss these possible effects
      with your doctor.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content: []
    subsections: []
  - heading: For oral capsules and injection into the vein only
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Sore throat and fever
      - unusual bleeding or bruising
    subsections: []
  - heading: Less common
    level: 3
    content: []
    subsections: []
  - heading: For oral capsules and injection into the vein only
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Mood or other mental changes
      - nervousness
      - pain at place of injection
      - skin rash
      - tremor
      - unusual tiredness and weakness
    subsections: []
  - heading: For injection into the eye only
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased vision or any change in vision
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
      - loss of appetite
      - nausea and vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
