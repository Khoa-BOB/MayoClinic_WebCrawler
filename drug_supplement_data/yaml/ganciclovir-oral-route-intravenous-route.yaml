title: Ganciclovir (oral route, intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Cytovene
    - type: paragraph
      text: Cytovene IV
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Ganciclovir is an antiviral. It is used to treat infections caused by viruses.
  - type: paragraph
    text: Ganciclovir is used to treat the symptoms of cytomegalovirus (CMV) infection
      of the eyes in people whose immune system is not working fully. This includes
      patients with acquired immune deficiency syndrome (AIDS). Ganciclovir will not
      cure this eye infection, but it may help to keep the symptoms from becoming
      worse. It is also used to help prevent CMV infection in patients who receive
      organ or bone marrow transplants, as well as in patients with advanced human
      immunodeficiency virus (HIV) infection. Ganciclovir may be used for other serious
      CMV infections as determined by your doctor. However, it does not work in treating
      certain viruses, such as the common cold or the flu.
  - type: paragraph
    text: This medicine may cause some serious side effects, including anemia and
      other blood problems. Before you begin treatment with ganciclovir, you and your
      doctor should talk about the good this medicine will do as well as the risks
      of using it.
  - type: paragraph
    text: Ganciclovir is to be administered only by or under the supervision of your
      doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Powder for Solution
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Ganciclovir can cause serious side effects in any patient. Therefore,
        it is especially important that you discuss with the child's doctor the good
        that this medicine may do as well as the risks of using it.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of ganciclovir in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Azathioprine
      - Bupropion
      - Clomipramine
      - Emtricitabine
      - Hydroxychloroquine
      - Imipenem
      - Levoketoconazole
      - Maribavir
      - Mercaptopurine
      - Methotrexate
      - Mycophenolate Mofetil
      - Tenofovir Alafenamide
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Didanosine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Kidney disease—Ganciclovir may build up in the blood in patients with kidney
        disease, increasing the chance of side effects
    - type: list
      ordered: false
      items:
      - Low platelet count or
      - Low white blood cell count—Ganciclovir may make these blood diseases worse
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is important that you take ganciclovir capsules with food. This is to
      make sure the medicine is fully absorbed into the body and will work properly.
  - type: paragraph
    text: To get the best results, ganciclovir must be given for the full time of
      treatment. Also, this medicine works best when there is a constant amount in
      the blood. To help keep the amount constant, ganciclovir must be given on a
      regular schedule.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For treatment of CMV retinitis after you
        have received ganciclovir injection for at least fourteen to twenty-one days:
        Adults and teenagers—1000 milligrams (mg) three times a day with food; or
        500 mg six times a day, every three hours with food, during waking hours.
        Children—Use and dose must be determined by your doctor. For prevention of
        CMV disease in transplant patients and patients with advanced HIV infection:
        Adults and teenagers—1000 mg three times a day with food. Children—Use and
        dose must be determined by your doctor.'
      - 'For injection dosage form: For treatment of CMV retinitis: Adults and teenagers—Dose
        is based on body weight and must be determined by your doctor. At first, 5
        mg per kilogram (2.3 mg per pound) of body weight is injected into a vein
        every twelve hours for fourteen to twenty-one days. Then, 5 mg per kilogram
        (2.3 mg per pound) of body weight is injected into a vein once a day for seven
        days of the week; or 6 mg per kilogram (2.7 mg per pound) of body weight is
        injected into a vein once a day for five days of the week. Children—Use and
        dose must be determined by your doctor. For prevention of CMV in transplant
        patients: Adults and teenagers—Dose is based on body weight and must be determined
        by your doctor. At first, 5 mg per kilogram (2.3 mg per pound) of body weight
        is injected into a vein every twelve hours for seven to fourteen days. Then
        the dose is reduced to 5 mg per kilogram (2.3 mg per pound) of body weight
        once a day for seven days of the week; or 6 mg per kilogram (2.7 mg per pound)
        of body weight is injected into a vein once a day for five days of the week.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of CMV retinitis after you have received ganciclovir injection
        for at least fourteen to twenty-one days: Adults and teenagers—1000 milligrams
        (mg) three times a day with food; or 500 mg six times a day, every three hours
        with food, during waking hours. Children—Use and dose must be determined by
        your doctor.'
      - 'For prevention of CMV disease in transplant patients and patients with advanced
        HIV infection: Adults and teenagers—1000 mg three times a day with food. Children—Use
        and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults and teenagers—1000 milligrams (mg) three times a day with food; or
        500 mg six times a day, every three hours with food, during waking hours.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults and teenagers—1000 mg three times a day with food.
      - Children—Use and dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - 'For treatment of CMV retinitis: Adults and teenagers—Dose is based on body
        weight and must be determined by your doctor. At first, 5 mg per kilogram
        (2.3 mg per pound) of body weight is injected into a vein every twelve hours
        for fourteen to twenty-one days. Then, 5 mg per kilogram (2.3 mg per pound)
        of body weight is injected into a vein once a day for seven days of the week;
        or 6 mg per kilogram (2.7 mg per pound) of body weight is injected into a
        vein once a day for five days of the week. Children—Use and dose must be determined
        by your doctor.'
      - 'For prevention of CMV in transplant patients: Adults and teenagers—Dose is
        based on body weight and must be determined by your doctor. At first, 5 mg
        per kilogram (2.3 mg per pound) of body weight is injected into a vein every
        twelve hours for seven to fourteen days. Then the dose is reduced to 5 mg
