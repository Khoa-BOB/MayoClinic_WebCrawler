    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress or your child's
      progress at regular visits . This will allow your doctor to see if the medicine
      is working properly and to check for any unwanted effects.
  - type: paragraph
    text: Check with your doctor at once if you or your child continue to have breathing
      problems after using a dose of this medicine or if your condition gets worse.
  - type: paragraph
    text: Do not change your dose or stop using this medicine without asking your
      doctor first.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      for appetite control, asthma, colds, cough, hay fever, or sinus problems, and
      herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fast, pounding, or irregular heartbeat or pulse
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Shakiness in the legs, arms, hands, or feet
      - trembling or shaking of the hands or feet
      - worsening of asthma
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain
      - chills
      - cough
      - diarrhea
      - dizziness
      - fainting
      - fever
      - general feeling of discomfort or illness
      - headache
      - increased sweating
      - joint pain
      - loss of appetite
      - muscle aches and pains
      - nausea
      - nervousness
      - pounding in the ears
      - puffiness of the face and fingers
      - runny nose
      - shivering
      - slow or fast heartbeat
      - sore throat
      - sweating
      - swelling
      - trouble sleeping
      - unusual tiredness or weakness
      - vomiting
    - type: paragraph
      text: 'Get emergency help immediately if any of the following symptoms of overdose
        occur:'
    subsections: []
  - heading: Symptoms of overdose
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Arm, back, or jaw pain
      - chest discomfort
      - chest tightness or heaviness
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - dry mouth
      - general feeling of discomfort or illness
      - shortness of breath
      - sleeplessness
      - unable to sleep
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal or stomach pain
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bad, unusual, or unpleasant (after) taste
      - change in appetite
      - drowsiness
      - dry mouth or throat
      - itching skin
      - pain
      - raised red swellings on the skin, lips, tongue, or in the throat
      - tightening of the muscles
      - weakness
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
