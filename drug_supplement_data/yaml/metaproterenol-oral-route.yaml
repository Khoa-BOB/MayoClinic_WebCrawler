        Your doctor may adjust your dose as needed. Children 6 to 9 years of age or
        weighing less than 60 lbs—10 mg three or four times a day. Your doctor may
        adjust your dose as needed. Children younger than 6 years of age—Use is not
        recommended.'
    - type: list
      ordered: false
      items:
      - Adults—Two teaspoonfuls (10 milliliters [mL]) three or four times a day. Your
