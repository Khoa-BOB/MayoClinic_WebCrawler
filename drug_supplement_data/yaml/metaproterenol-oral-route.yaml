title: Metaproterenol (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Alupent
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Alti-Orciprenaline
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Metaproterenol is used to treat asthma and bronchospasm in patients with
      bronchitis, emphysema, and other lung diseases.
  - type: paragraph
    text: Metaproterenol belongs to the family of medicines known as adrenergic bronchodilators.
      Adrenergic bronchodilators are medicines that open up the bronchial tubes (air
      passages) in the lungs. They relieve cough, wheezing, shortness of breath, and
      troubled breathing by increasing the flow of air through the bronchial tubes.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
    - Syrup
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of metaproterenol oral solution and tablets in children younger
        than 6 years of age. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: No information is available on the relationship of age to the effects
        of metaproterenol in geriatric patients.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Iobenguane I 123
      - Methacholine
      - Sotalol
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Heart or blood vessel disease or
      - Hypertension (high blood pressure) or
      - Hyperthyroidism (overactive thyroid) or
      - Seizures—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Heart rhythm problems (e.g., arrhythmia) or
      - Tachycardia (fast or rapid heartbeat)—Should not be used in patients with
        these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Use this medicine only as directed by your doctor . Do not use more of it
      and do not use it more often than your doctor ordered. Also, do not stop using
      this medicine or any asthma medicine without telling your doctor. To do so may
      increase the chance for breathing problems.
  - type: paragraph
    text: Measure the oral liquid with a marked measuring spoon, oral syringe, or
      medicine cup. The average household teaspoon may not hold the right amount of
      liquid.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For asthma and bronchospasm: For oral dosage form (solution): Adults—Two
        teaspoonfuls (10 milliliters [mL]) three or four times a day. Your doctor
        may adjust your dose as needed. Children older than 9 years of age or weighing
        more than 60 pounds (lbs)—Two teaspoonfuls (10 mL) three or four times a day.
        Your doctor may adjust your dose as needed. Children 6 to 9 years of age or
        weighing less than 60 lbs—One teaspoonful (5 mL) three or four times a day.
        Your doctor may adjust your dose as needed. Children younger than 6 years
        of age—Use and dose must be determined by your child''s doctor. For oral dosage
        form (tablets): Adults—20 milligrams (mg) three or four times a day. Your
        doctor may adjust your dose as needed. Children older than 9 years of age
        or weighing more than 60 pounds (lbs)—20 mg three or four times a day. Your
        doctor may adjust your dose as needed. Children 6 to 9 years of age or weighing
        less than 60 lbs—10 mg three or four times a day. Your doctor may adjust your
        dose as needed. Children younger than 6 years of age—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (solution): Adults—Two teaspoonfuls (10 milliliters
        [mL]) three or four times a day. Your doctor may adjust your dose as needed.
        Children older than 9 years of age or weighing more than 60 pounds (lbs)—Two
        teaspoonfuls (10 mL) three or four times a day. Your doctor may adjust your
        dose as needed. Children 6 to 9 years of age or weighing less than 60 lbs—One
        teaspoonful (5 mL) three or four times a day. Your doctor may adjust your
        dose as needed. Children younger than 6 years of age—Use and dose must be
        determined by your child''s doctor.'
      - 'For oral dosage form (tablets): Adults—20 milligrams (mg) three or four times
