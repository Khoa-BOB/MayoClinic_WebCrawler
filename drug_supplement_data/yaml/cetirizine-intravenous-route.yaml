title: Cetirizine (intravenous route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Quzyttir
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Cetirizine injection is used to treat adults and children 6 months of age
      and older with acute urticaria (hives, itching, or redness of the skin).
  - type: paragraph
    text: Cetirizine is an antihistamine that works by preventing the effects of a
      substance called histamine, which is produced by the body. Histamine can cause
      itching, sneezing, runny nose, and watery eyes. It can close up the bronchial
      tubes (air passages of the lungs) and make breathing difficult.
  - type: paragraph
    text: This medicine is to be given only by or under the direct supervision of
      your doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Solution
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of cetirizine injection in children
        6 months of age and older. Safety and efficacy have not been established in
        children younger than 6 months of age.
    - type: paragraph
      text: Use of cetirizine injection in children younger than 6 years of age with
        kidney or liver disease is not recommended.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of cetirizine injection in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this medicine, it is
        especially important that your healthcare professional know if you are taking
        any of the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Isocarboxazid
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Acepromazine
      - Alfentanil
      - Alprazolam
      - Amobarbital
      - Anileridine
      - Aripiprazole
      - Asenapine
      - Baclofen
      - Benperidol
      - Benzhydrocodone
      - Bromazepam
      - Buprenorphine
      - Buspirone
      - Butabarbital
      - Butalbital
      - Butorphanol
      - Calcium Oxybate
      - Cannabidiol
      - Cannabis
      - Carbamazepine
      - Carbidopa
      - Carbinoxamine
      - Carisoprodol
      - Carphenazine
      - Chloral Hydrate
      - Chlordiazepoxide
      - Chlorpromazine
      - Chlorzoxazone
      - Clobazam
      - Clomipramine
      - Clonazepam
      - Clorazepate
      - Clozapine
      - Codeine
      - Cyclobenzaprine
      - Cyproheptadine
      - Daridorexant
      - Dexmedetomidine
      - Diacetylmorphine
      - Diazepam
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Ethanol
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you or your child
      this medicine in a medical facility. It is given through a needle placed into
      one of your veins.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor will check your progress closely while you or your child are
      receiving this medicine . This will allow your doctor to see if the medicine
      is working properly and to decide if you should continue to receive it.
  - type: paragraph
    text: This medicine may cause some people to become drowsy, sleepy, or less alert
      than they are normally. Make sure you know how you react to this medicine before
      you drive, use machines, or do anything else that could be dangerous if you
      are not alert .
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for hay fever, other allergies or colds, sedatives,
      tranquilizers, or sleeping medicine, prescription pain medicine or narcotics,
      medicine for seizures, muscle relaxants, or anesthetics, including some dental
      anesthetics. Check with your doctor or dentist before taking any of the above
      while you or your child are receiving this medicine .
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Drowsiness
      - relaxed and calm
      - sleepiness or unusual drowsiness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acid or sour stomach
      - belching
      - burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - change or loss of taste
      - feeling hot
      - headache
      - heartburn
      - increased sweating
      - indigestion
      - stomach discomfort, upset, or pain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bleeding, blistering, burning, coldness, discoloration of the skin, feeling
        of pressure, hives, infection, inflammation, itching, lumps, numbness, pain,
        rash, redness, scarring, soreness, stinging, swelling, tenderness, tingling,
        ulceration, or warmth at the injection site
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
