title: Glycerin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Osmoglyn
    subsections: []
  - heading: Canadian Brand Name
    level: 3
    content:
    - type: paragraph
      text: Glycerin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Glycerin , when taken by mouth, is used to treat certain conditions in which
      there is increased eye pressure, such as glaucoma. It may also be used before
      eye surgery to reduce pressure in the eye.
  - type: paragraph
    text: Glycerin may also be used for other conditions as determined by your doctor.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Spray
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Although there is no specific information comparing use of glycerin in
        children with use in other age groups, this medicine is not expected to cause
        different side effects or problems in children than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Glycerin reduces water in the body, and there may be an increased risk
        that elderly patients taking it could become dehydrated.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Arsenic Trioxide
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Licorice
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Type 2 diabetes mellitus—Use of glycerin may increase the chance of dehydration
        (loss of too much body water)
    - type: list
      ordered: false
      items:
      - Confused mental states or
      - Heart disease or
      - Kidney disease—Glycerin may make these conditions worse
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: It is very important that you take this medicine only as directed. Do not
      take more of it and do not take it more often than your doctor ordered.
  - type: paragraph
    text: To improve the taste of this medicine, mix it with a small amount of unsweetened
      lemon, lime, or orange juice, pour over cracked ice, and sip through a straw.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (oral solution): To lower pressure in the eye: Adults—Dose
        is based on body weight and must be determined by your doctor. The usual dose
        is 1 to 2 grams per kilogram (kg) (0.45 to 0.91 grams per pound) of body weight
        taken one time. Then, additional doses of 500 milligrams (mg) per kg (227
        mg per pound) of body weight every six hours may be taken if needed. Children—Dose
        is based on body weight and must be determined by your doctor. The usual dose
        is 1 to 1.5 grams per kg (0.45 to 0.68 grams per pound) of body weight taken
        one time. The dose may be repeated in four to eight hours if needed.'
    - type: list
      ordered: false
      items:
      - 'To lower pressure in the eye: Adults—Dose is based on body weight and must
        be determined by your doctor. The usual dose is 1 to 2 grams per kilogram
        (kg) (0.45 to 0.91 grams per pound) of body weight taken one time. Then, additional
        doses of 500 milligrams (mg) per kg (227 mg per pound) of body weight every
        six hours may be taken if needed. Children—Dose is based on body weight and
        must be determined by your doctor. The usual dose is 1 to 1.5 grams per kg
        (0.45 to 0.68 grams per pound) of body weight taken one time. The dose may
        be repeated in four to eight hours if needed.'
    - type: list
      ordered: false
      items:
      - Adults—Dose is based on body weight and must be determined by your doctor.
        The usual dose is 1 to 2 grams per kilogram (kg) (0.45 to 0.91 grams per pound)
        of body weight taken one time. Then, additional doses of 500 milligrams (mg)
        per kg (227 mg per pound) of body weight every six hours may be taken if needed.
      - Children—Dose is based on body weight and must be determined by your doctor.
        The usual dose is 1 to 1.5 grams per kg (0.45 to 0.68 grams per pound) of
        body weight taken one time. The dose may be repeated in four to eight hours
        if needed.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: Your doctor should check your progress at regular visits to make sure that
      this medicine is working properly.
  - type: paragraph
    text: In some patients, headaches may occur when this medicine is taken. To help
      prevent or relieve the headache, lie down while you are taking this medicine
      and for a short time after taking it. If headaches become severe or continue,
      check with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor as soon as possible if any of the following side
      effects occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Confusion
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Irregular heartbeat
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - nausea or vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - dizziness
      - dryness of mouth or increased thirst
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
