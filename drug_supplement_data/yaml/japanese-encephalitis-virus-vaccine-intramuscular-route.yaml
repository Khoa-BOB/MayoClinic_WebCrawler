title: Japanese encephalitis virus vaccine (intramuscular route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Ixiaro
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Japanese encephalitis virus vaccine, inactivated, adsorbed (Ixiaro®) is
      used to prevent infection caused by the Japanese encephalitis virus. It works
      by causing your body to produce its own protection (antibodies) against the
      virus.
  - type: paragraph
    text: This vaccine is to be given only by or under the direct supervision of your
      doctor.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Suspension
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a vaccine, the risks of taking the vaccine must be weighed
      against the good it will do. This is a decision you and your doctor will make.
      For this vaccine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of Japanese encephalitis virus vaccine, inactivated, adsorbed
        in children younger than 2 months of age. Safety and efficacy have not been
        established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of Japanese encephalitis virus vaccine,
        inactivated, adsorbed in the elderly.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are receiving this vaccine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Receiving this vaccine with any of the following medicines is usually
        not recommended, but may be required in some cases. If both medicines are
        prescribed together, your doctor may change the dose or how often you use
        one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atidarsagene Autotemcel
      - Elivaldogene Autotemcel
      - Ocrelizumab
      - Teplizumab-mzwv
      - Ublituximab-xiiy
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this vaccine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bleeding disorder (eg, thrombocytopenia)—Use with caution. May increase risk
        of bleeding or bruising.
    - type: list
      ordered: false
      items:
      - Immune deficiency or
      - Immune system problem—May not work properly in patients with these conditions
        and may cause side effects to become worse.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this vaccine.
      It is given as a shot into the muscle of your upper arm or thigh.
  - type: paragraph
    text: This vaccine is given in 2 doses. Dose 2 is scheduled 28 days after Dose
      1. It is very important that you receive both doses of the vaccine at least
      7 days before you plan to travel out of the country. If you miss the second
      shot, call your doctor to make another appointment as soon as possible.
  - type: paragraph
    text: You may need a  booster dose if you continue to be exposed to the virus
      or might be exposed again. Get the booster dose at least 11 months after your
      last scheduled dose. You may need a  booster dose if you continue to be exposed
      to the virus or might be exposed again. Get the booster dose at least 11 months
      after your last scheduled dose.You may also need a booster dose if you received
      the second dose of the vaccine series more than 1 year ago.
  - type: paragraph
    text: This vaccine comes with a patient information leaflet. Read and follow these
      instructions carefully. Ask your doctor if you have any questions.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that you receive the second dose of the vaccine series
      at the right time . You may not be protected as well until 1 week after you
      receive the second dose of the vaccine.
  - type: paragraph
    text: This vaccine may cause serious allergic reactions, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Tell
      your doctor right away if you have a rash, itching, a fast heartbeat, trouble
      breathing, trouble swallowing, or any swelling of your hands, face, or mouth
      after receiving the vaccine.
  - type: paragraph
    text: This vaccine may case syncope (fainting). Talk with your doctor if you have
      concerns.
  - type: paragraph
    text: Since the vaccine may not protect everyone completely, it is very important
      that you use precautions to reduce the risk of mosquito bites. Use insect repellents
      and mosquito nets, wear protective clothing, and stay indoors during twilight
      and after dark.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor or nurse immediately if any of the following side
      effects occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - cough
      - diarrhea
      - fever
      - general feeling of discomfort or illness
      - headache
      - joint pain
      - loss of appetite
      - muscle aches and pains
      - nausea
      - runny nose
      - shivering
      - sore throat
      - sweating
      - trouble sleeping
      - unusual tiredness or weakness
      - vomiting
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - difficulty breathing
      - ear congestion
      - loss of voice
      - nasal congestion
      - sneezing
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning, crawling, itching, numbness, prickling, "pins and needles", or tingling
        feelings
      - fainting
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Difficulty moving
      - muscle cramps or stiffness
      - swollen joints
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - pain, itching, redness, or swelling where the shot was given
      - rash
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
