        120 mg per day. Children 10 to 17 years of age—At first, 20 milligrams (mg)
        once a day. Your doctor may increase your dose as needed. However, the dose
        is usually not more than 80 mg per day. Children younger than 10 years of
        age—Use and dose must be determined by your doctor.'
    - type: list
