    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following is usually not recommended,
        but may be unavoidable in some cases. If used together, your doctor may change
        the dose or how often you use this medicine, or give you special instructions
        about the use of food, alcohol, or tobacco.
    - type: list
      ordered: false
      items:
      - Grapefruit Juice
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Alzheimer's disease or dementia or
      - Dehydration or
      - Heart attack, history of or
      - Heart failure or
      - Heart or blood vessel disease or
      - Heart rhythm problems or
      - Hypotension (low blood pressure) or
      - Hypovolemia (low amount of blood) or
      - Parkinson's disease or
      - Stroke, history of or
      - Trouble swallowing—May cause side effects to become worse.
    - type: list
      ordered: false
      items:
      - Blood or bone marrow problems (eg, agranulocytosis, leukopenia, neutropenia)
        or
      - Diabetes or risk factors for diabetes or
      - Dyslipidemia (high cholesterol or fats in the blood) or
      - Hyperglycemia (high blood sugar) or
      - Hyperprolactinemia (high prolactin in the blood) or
      - Mania, or history of or
      - Seizures, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Kidney disease, moderate to severe or
      - Liver disease, moderate to severe—You may need a dose adjustment. Talk with
        your doctor if you have concerns about this.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine only as directed by your doctor even if you feel well
      . Do not take more of this medicine and do not take it more often than your
      doctor ordered. This medicine works best if there is a constant amount in the
      blood. To keep blood levels constant, take this medicine at the same time each
      day and do not miss any doses.
  - type: paragraph
    text: This medicine should come with a Medication Guide. Read and follow the instructions
      carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: You must take this medicine with food (containing at least 350 calories).
  - type: paragraph
    text: Do not eat grapefruit or drink grapefruit juice while you are using this
      medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For schizophrenia: Adults—At first, 40 milligrams
        (mg) once a day. Your doctor may increase your dose as needed. However, the
        dose is usually not more than 160 mg per day. Children 13 to 17 years of age—At
        first, 40 milligrams (mg) once a day. Your doctor may increase your dose as
        needed. However, the dose is usually not more than 80 mg per day. Children
        younger than 13 years of age—Use and dose must be determined by your doctor.
        For depression: Adults—At first, 20 milligrams (mg) once a day. Your doctor
        may increase your dose as needed. However, the dose is usually not more than
        120 mg per day. Children 10 to 17 years of age—At first, 20 milligrams (mg)
        once a day. Your doctor may increase your dose as needed. However, the dose
        is usually not more than 80 mg per day. Children younger than 10 years of
        age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For schizophrenia: Adults—At first, 40 milligrams (mg) once a day. Your doctor
        may increase your dose as needed. However, the dose is usually not more than
        160 mg per day. Children 13 to 17 years of age—At first, 40 milligrams (mg)
        once a day. Your doctor may increase your dose as needed. However, the dose
