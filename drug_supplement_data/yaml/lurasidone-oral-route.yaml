    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood tests may be needed
      to check for unwanted effects.
  - type: paragraph
    text: Lurasidone should not be used with certain medicines such as carbamazepine
      (Tegretol®), clarithromycin (Biaxin®), ketoconazole (Nizoral®), phenytoin (Dilantin®),
      rifampin (Rifadin®, Rimactane®), ritonavir (Norvir®), St. John's wort, or voriconazole
      (Vfend®). Using these medicines together may cause serious unwanted effects
      . Make sure your doctor knows all of the medicines you are taking.
  - type: paragraph
    text: Lurasidone may cause some people to be agitated, irritable, or display other
      abnormal behaviors. It may also cause some people to have suicidal thoughts
      and tendencies. If you or your caregiver notice any of these side effects, tell
      your doctor right away.
  - type: paragraph
    text: This medicine may increase risk of transient ischemic attack or stroke in
      elderly patients. Tell your doctor right away if you have confusion, double
      vision, headache, inability to move the arms, legs, or facial muscles, slow
      speech, or trouble speaking, thinking, or walking while using this medicine.
  - type: paragraph
    text: 'Check with your doctor right away if you have any of the following symptoms
      while using this medicine: convulsions (seizures), difficulty with breathing,
      a fast heartbeat, a high fever, high or low blood pressure, increased sweating,
      loss of bladder control, severe muscle stiffness, unusually pale skin, or tiredness.
      These could be symptoms of a serious condition called neuroleptic malignant
      syndrome (NMS).'
  - type: paragraph
    text: This medicine may cause tardive dyskinesia (a movement disorder). Check
      with your doctor right away if you have lip smacking or puckering, puffing of
      the cheeks, rapid or worm-like movements of the tongue, uncontrolled chewing
      movements, or uncontrolled movements of the arms and legs while you are using
      this medicine.
  - type: paragraph
    text: This medicine may increase the amount of sugar in your blood. Check with
      your doctor right away if you have increased thirst or increased urination.
      If you have diabetes, you may notice a change in the results of your urine or
      blood sugar tests. If you have any questions, check with your doctor.
  - type: paragraph
    text: This medicine may increase your weight. Your doctor may need to check your
      weight on a regular basis while you are using this medicine. Talk to your doctor
      about ways to prevent weight gain.
  - type: paragraph
    text: Lurasidone can temporarily lower the number of white blood cells in your
      blood, increasing the chance of getting an infection. If you can, avoid people
      with infections. Check with your doctor right away if you think you are getting
      an infection, or if you have a fever or chills, a cough or hoarseness, lower
      back or side pain, or painful or difficult urination.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur, especially when you get
      up suddenly from a lying or sitting position. Getting up slowly may help. If
      the problem continues or gets worse, check with your doctor.
  - type: paragraph
    text: This medicine may cause some people to become drowsy or dizzy, or to have
      trouble with thinking or controlling body movements, which may lead to falls,
      fractures or other injuries. Do not drive or do anything else that could be
      dangerous until you know how this medicine affects you .
  - type: paragraph
    text: Avoid activities involving high temperature or humidity. This medicine may
      reduce your body's ability to adjust to the heat.
  - type: paragraph
    text: This medicine will add to the effects of alcohol and other CNS depressants
      (medicines that make you drowsy or less alert). Some examples of CNS depressants
      are antihistamines or medicine for allergies or colds, sedatives, tranquilizers,
      or sleeping medicine, prescription pain medicines including other narcotics,
      medicine for seizures (eg, barbiturates), muscle relaxants, or anesthetics (numbing
      medicines), including some dental anesthetics. Check with your doctor before
      taking any of the above while you are using this medicine .
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are taking this medicine. The results of some tests may be affected by this
      medicine.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
