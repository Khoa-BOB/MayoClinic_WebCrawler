      - loss of appetite
      - lower back or side pain
      - muscle cramp, pain, or stiffness
      - nausea
      - sore throat
      - sores, ulcers, or white spots on the lips or in the mouth
      - swelling of the face, fingers, or lower legs
      - swollen glands
      - vomiting
      - weight gain
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased urine output
      - hives or welts, itching, skin rash
      - loss of consciousness
      - redness of the skin
      - swelling of the throat or tongue
      - tightness in the chest
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - belching
      - drowsiness
      - dry mouth
      - heartburn
      - hyperventilation
      - indigestion
      - irritability
      - relaxed and calm feeling
      - sleepiness or unusual drowsiness
      - stomach discomfort, upset, or pain
      - trouble sleeping
      - unusually deep sleep
      - unusually long duration of sleep
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal dreams
      - back pain
      - blurred vision
      - burning feeling in the chest or stomach
      - decreased appetite
      - diarrhea
      - feeling of constant movement of self or surroundings
      - indigestion
      - sensation of spinning
      - sweating
      - tenderness in the stomach area
      - watering of mouth and drooling
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Decreased interest in sexual intercourse
      - inability to have or keep an erection
      - loss in sexual ability, desire, drive, or performance
      - unexpected or excess milk flow from the breasts
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
