    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If you or your child's symptoms do not improve within a few days, or if
      they become worse, check with your doctor.
  - type: paragraph
    text: The areas affected by genital herpes, chickenpox, or shingles should be
      kept as clean and dry as possible. Also, wear loose-fitting clothing to avoid
      irritating the sores (blisters).
  - type: paragraph
    text: It is important to remember that this medicine will not keep you from spreading
      herpes to others .
  - type: paragraph
    text: Herpes infection of the genitals can be caught from or spread to your partner
      during any sexual activity. Even though you may get herpes if your partner has
      no symptoms, the infection is more likely to be spread if sores are present.
      This is true until the sores are completely healed and the scabs have fallen
      off. Therefore, it is best to avoid any sexual activity if either you or your
      sexual partner has any symptoms of herpes . The use of a latex condom (“rubber")
      may help prevent the spread of herpes. However, spermicidal (sperm-killing)
      jelly or a diaphragm will probably not help.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Discouragement
      - feeling sad or empty
      - irritability
      - lack of appetite
      - loss of interest or pleasure
      - tiredness
      - trouble concentrating
      - trouble sleeping
    subsections: []
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Black, tarry stools
      - chest pain
      - chills
      - cough
      - decreased frequency or output of urine
      - fever
      - flu-like symptoms
      - headache
      - lower back or side pain
      - reduced mental alertness
      - shortness of breath
      - yellow eyes or skin
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Actions that are out of control
      - agitation
      - anxiety
      - back, leg, or stomach pains
      - bleeding gums
      - blood in urine or stools
      - blurred vision
      - change in consciousness
      - change in mental status
      - changes in behavior, especially in interactions with other people
      - changes in patterns and rhythms of speech
      - dark or bloody urine
      - difficult or labored breathing
      - difficulty speaking
      - difficulty swallowing
      - dizziness
      - drowsiness
      - dry mouth
      - fast, pounding, or irregular heartbeat or pulse
      - feeling that others are watching you or controlling your behavior
      - feeling that others can hear your thoughts
      - feeling, seeing, or hearing things that are not there
      - general tiredness and weakness
      - hyperventilation
      - increased thirst
      - itching
      - lightheadedness when getting up from a lying or sitting position
      - light-colored stools
      - loss of consciousness
      - mood or mental changes
      - nausea and vomiting
      - nervousness
      - pale color of skin
      - pinpoint red spots on the skin
      - pounding in the ears
      - puffiness or swelling of the eyelids or around the eyes, face, lips, or tongue
      - redness of the skin
      - restlessness
      - seeing, hearing, or feeling things that are not there
      - seizures
      - severe mood or mental changes
      - shakiness and unsteady walk
      - shakiness in the legs, arms, hands, or feet
      - skin rash
      - slurred speech
      - sores, ulcers, or white spots on the lips or in the mouth
      - stiff neck
      - swelling of the face, fingers, or lower legs
      - swollen or painful glands
      - talking, feeling, and acting with excitement
      - tightness in the chest
      - trembling or shaking of the hands or feet
      - trouble in speaking
      - troubled breathing
      - unsteadiness, trembling, or other problems with muscle control or coordination
      - unusual behavior
      - unusual bleeding or bruising
      - unusual tiredness or weakness
      - upper right abdominal pain
      - vomiting
      - weight gain
      - wheezing
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - cramps
      - difficulty in moving
      - ear congestion
      - heavy bleeding
      - loss of voice
      - muscle aches
      - muscle pain or stiffness
      - nasal congestion
      - pain
      - pain in joints
      - sneezing
      - sore throat
      - stuffy or runny nose
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Constipation
      - diarrhea
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, peeling, or loosening of the skin
      - hair loss or thinning of the hair
      - hives or welts
      - increased sensitivity of skin to sunlight
      - red, irritated eyes
      - redness or other discoloration of the skin
      - severe sunburn
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
