title: Valacyclovir (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Valtrex
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Valacyclovir is used to treat herpes virus infections, including herpes
      labialis (also known as cold sores), herpes zoster (also known as shingles),
      and herpes simplex (also known as genital herpes) in adults. It is also used
      to treat chickenpox and cold sores in children.
  - type: paragraph
    text: In your body, valacyclovir becomes the anti-herpes medicine, acyclovir.
      Although valacyclovir will not cure shingles or genital herpes, it does help
      relieve the pain and discomfort and helps the sores heal faster.
  - type: paragraph
    text: Valacyclovir is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies have not been performed on the relationship of age
        to the effects of valacyclovir in children below 12 years of age with cold
        sores, and children below 2 years of age with chickenpox. Safety and efficacy
        have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of valacyclovir in the elderly. However,
        elderly patients are more likely to have age-related kidney disease, which
        may require an adjustment in the dose of patients receiving valacyclovir.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Dichlorphenamide
      - Emtricitabine
      - Fexinidazole
      - Foscarnet
      - Leflunomide
      - Mycophenolate Mofetil
      - Nitisinone
      - Tenofovir Alafenamide
      - Teriflunomide
      - Vadadustat
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Fosphenytoin
      - Phenytoin
      - Valproic Acid
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Advanced human immunodeficiency virus (HIV) infection or
      - Bone marrow transplantation or
      - Kidney transplantation—Patients with these medical problems may have an increased
        risk of severe side effects.
    - type: list
      ordered: false
      items:
      - Kidney disease—The effects may be increased because of slower removal of this
        medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Valacyclovir works best if it is used within 48 hours after the first symptoms
      of shingles or genital herpes (e.g., pain, burning, or blisters) begin to appear.
      For recurrent outbreaks of genital herpes, valacyclovir works best if it is
      used within 24 hours after the symptoms begin to appear.
  - type: paragraph
    text: If you are taking valacyclovir for the treatment of chickenpox, it is best
      to start taking valacyclovir as soon as possible after the first sign of the
      chickenpox rash appears , usually within one day.
  - type: paragraph
    text: Valacyclovir may be taken with meals or on an empty stomach.
  - type: paragraph
    text: If you are using the oral suspension , use a specially marked measuring
      spoon or other device to measure each dose accurately. The average household
      teaspoon may not hold the right amount of liquid.
  - type: paragraph
    text: Drink extra fluids so you will pass more urine while you are using this
      medicine. This will keep your kidneys working well and help prevent kidney problems.
  - type: paragraph
    text: To help clear up your infection, keep taking valacyclovir for the full time
      of treatment, even if your symptoms begin to clear up after a few days. Do not
      miss any doses. However, do not use this medicine more often or for a longer
      time than your doctor ordered.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For treatment of chickenpox: Adults and children
        below 2 years of age—Use and dose must be determined by your doctor. Children
        2 to 18 years of age—Dose is based on body weight and must be determined by
        your doctor. The usual dose is 20 milligrams (mg) per kilogram (kg) of body
        weight, taken three times a day for 5 days. However, the dose is usually not
        more than 1000 mg three times a day. For treatment of cold sores: Adults—2000
        milligrams (mg) every 12 hours for one day. Children 12 years of age and above—2000
        milligrams (mg) every 12 hours for one day. Children below 12 years of age—Use
        and dose must be determined by your doctor. For treatment of genital herpes,
        first outbreak: Adults—1000 milligrams (mg) two times a day for ten days.
        Children—Use and dose must be determined by your doctor. For treatment of
        genital herpes, recurrent outbreaks: Adults—500 milligrams (mg) two times
        a day for three days. Children—Use and dose must be determined by your doctor.
        To prevent recurrent outbreaks of genital herpes: Adults—500 milligrams (mg)
        or 1000 mg once a day. Children—Use and dose must be determined by your doctor.
        For treatment of shingles: Adults—1000 milligrams (mg) three times a day for
        seven days. Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For treatment of chickenpox: Adults and children below 2 years of age—Use
        and dose must be determined by your doctor. Children 2 to 18 years of age—Dose
        is based on body weight and must be determined by your doctor. The usual dose
        is 20 milligrams (mg) per kilogram (kg) of body weight, taken three times
        a day for 5 days. However, the dose is usually not more than 1000 mg three
        times a day.'
