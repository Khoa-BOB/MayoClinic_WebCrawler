title: Dutasteride and tamsulosin (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Jalyn
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: 'Note: Women of childbearing potential should not use or handle this medicine
      . Dutasteride can cause birth defects in male fetuses.'
  - type: paragraph
    text: Dutasteride and tamsulosin combination is used to treat men who have symptoms
      of an enlarged prostate gland, which is also known as benign prostatic hyperplasia
      (BPH). Benign enlargement of the prostate is a problem that can occur in men
      as they get older. The prostate gland is located below the bladder. When the
      prostate gland gets larger, certain muscles in the gland get in the way of the
      tube that drains urine from the bladder. This can cause problems with urinating,
      such as a need to urinate often, a weak stream when urinating, or a feeling
      of not being able to empty the bladder completely.
  - type: paragraph
    text: Dutasteride blocks the action of an enzyme called 5-alpha-reductase. This
      enzyme changes testosterone to another hormone that causes the prostate gland
      to grow. Dutasteride will cause the size of the prostate to decrease, but the
      effect lasts only as long as the medicine is taken. If it is stopped, the prostate
      begins to grow again.
  - type: paragraph
    text: Tamsulosin helps relax the muscles in the prostate gland and the opening
      of the bladder. This may help increase the flow of urine or decrease symptoms.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Capsule
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Dutasteride and tamsulosin combination is not indicated for use in the
        pediatric population. Safety and efficacy have not been established.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of dutasteride and tamsulosin combination
        in the elderly. However, elderly patients are more sensitive to the effects
        of this medicine than younger adults.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Boceprevir
      - Mavorixafor
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abiraterone Acetate
      - Abiraterone Acetate, Micronized
      - Alfuzosin
      - Apalutamide
      - Avacopan
      - Bunazosin
      - Carbamazepine
      - Celecoxib
      - Ceritinib
      - Clarithromycin
      - Cobicistat
      - Conivaptan
      - Dapiprazole
      - Desvenlafaxine
      - Doxazosin
      - Escitalopram
      - Fedratinib
      - Idelalisib
      - Iloperidone
      - Indinavir
      - Itraconazole
      - Ketoconazole
      - Letermovir
      - Lopinavir
      - Melphalan
      - Mifepristone
      - Moxisylyte
      - Nefazodone
      - Nelfinavir
      - Nirmatrelvir
      - Omaveloxolone
      - Paroxetine
      - Phenobarbital
      - Phenoxybenzamine
      - Phentolamine
      - Posaconazole
      - Prazosin
      - Primidone
      - Ranolazine
      - Ritonavir
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Acebutolol
      - Alprenolol
      - Atenolol
      - Avanafil
      - Betaxolol
      - Bevantolol
      - Bisoprolol
      - Bucindolol
      - Carteolol
      - Carvedilol
      - Celiprolol
      - Cimetidine
      - Ciprofloxacin
      - Dilevalol
      - Diltiazem
      - Esmolol
      - Ketoconazole
      - Labetalol
      - Levobunolol
      - Mepindolol
      - Metipranolol
      - Metoprolol
      - Nadolol
      - Nebivolol
      - Oxprenolol
      - Penbutolol
      - Pindolol
      - Propranolol
