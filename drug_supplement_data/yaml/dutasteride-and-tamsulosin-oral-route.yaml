    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  The
        following interactions have been selected on the basis of their potential
        significance and are not necessarily all-inclusive.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergy to sulfa drugs (eg, sulfamethoxazole, sulfasalazine, sulfasoxazole,
        Azulfidine®, Bactrim®, or Septra®)—Increased allergic reaction in patients
        with this condition.
    - type: list
      ordered: false
      items:
      - Hypotension (low blood pressure) or
      - Postural hypotension (low blood pressure when arising), history of or
      - Priapism (painful or prolonged erection of the penis)—Use with caution. May
        make these conditions worse.
    - type: list
      ordered: false
      items:
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions in the insert carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Take the capsule at least 30 minutes after the same meal each day. Swallow
      the capsule whole. Do not chew or open it.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (capsules): For benign prostatic hyperplasia: Adults—One
        capsule once a day. Each capsule contains 0.5 milligram (mg) dutasteride and
        0.4 mg tamsulosin. Children—Use is not recommended.'
    - type: list
      ordered: false
      items:
      - 'For benign prostatic hyperplasia: Adults—One capsule once a day. Each capsule
        contains 0.5 milligram (mg) dutasteride and 0.4 mg tamsulosin. Children—Use
        is not recommended.'
    - type: list
      ordered: false
      items:
      - Adults—One capsule once a day. Each capsule contains 0.5 milligram (mg) dutasteride
        and 0.4 mg tamsulosin.
      - Children—Use is not recommended.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly and to check for unwanted
      effects.
  - type: paragraph
    text: Women and children should not use this medicine. Pregnant women or women
      who may become pregnant should not handle or touch the capsules. Dutasteride
      can be absorbed through the skin and can cause birth defects in male fetuses.
      If a pregnant woman does come in contact with this medicine, the affected area
      should be washed right away with soap and water, especially if the capsule is
      broken.
  - type: paragraph
    text: Because this medicine may cause some people to become dizzy or feel faint,
      make sure you know how you react to this medicine before you drive, use machines,
      or do anything else that could be dangerous if you are dizzy or are not alert
      .
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur after you take this medicine,
      especially when you get up suddenly from a lying or sitting position. Getting
      up slowly may help with this problem. If you feel dizzy, lie down so you do
      not faint . Then sit for a few moments before standing to prevent the dizziness
      from returning.
  - type: paragraph
    text: If you plan to have cataract surgery , tell your eye doctor (ophthalmologist)
      that you are taking this medicine or that you used this medicine in the previous
      9 months. A serious eye problem called Intraoperative Floppy Iris Syndrome (IFIS)
      has occurred in some patients who were taking this medicine or who had recently
      taken this medicine when they had cataract surgery.
  - type: paragraph
    text: This medicine may affect the results of the prostate specific antigen (PSA)
      test, which may be used to detect prostate cancer. Make sure you tell all of
      your doctors that you are using this medicine.
  - type: paragraph
    text: This medicine will not prevent prostate cancer but may increase your risk
      of developing high-grade prostate cancer. Tell your doctor if you have concerns
      about this risk.
  - type: paragraph
    text: You should seek medical attention right away if you experience a prolonged
      erection while using this medicine . This is an extremely rare unwanted effect
      that must be treated right away to prevent permanent erectile damage (impotence).
  - type: paragraph
    text: Men who have taken this medicine should not donate blood until 6 months
      have passed since the last dose. Dutasteride can remain in your blood for a
      long time and be passed on to a pregnant woman who receives a blood transfusion.
  - type: paragraph
    text: This medicine does not usually affect normal sexual abilities for most men.
      You may notice that you ejaculate less fluid when you have sex.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chills
      - cold sweats
      - confusion
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Chest pain
      - cough or hoarseness
      - fever
      - lower back or side pain
      - painful or difficult urination
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blistering, flaking, or peeling of the skin
      - blurred vision
      - difficulty with breathing
      - fast, irregular, pounding, or racing heartbeat or pulse
      - large, hive-like swelling on the face, eyelids, lips, tongue, throat, hands,
        legs, feet, or sex organs
      - pain or swelling of the treated skin
      - painful or prolonged erection of the penis
      - sweating
      - trouble breathing
      - unusual tiredness or weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Change or problem with discharge of semen
      - decreased interest in sexual intercourse
      - dizziness
      - enlarged and painful breasts
      - inability to have or keep an erection
      - loss in sexual ability, desire, drive, or performance
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - body aches or pain
      - congestion
      - diarrhea
      - dryness or soreness of the throat
      - headache
      - increased cough
      - lack or loss of strength
      - pain or tenderness around the eyes and cheekbones
      - runny nose
      - sleepiness or unusual drowsiness
      - sleeplessness
      - sneezing
      - stuffy nose
      - tender, swollen glands in the neck
      - tightness of the chest
      - trouble sleeping
      - trouble with swallowing
      - unable to sleep
      - voice changes
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody nose
      - constipation
      - hives or welts, itching, skin rash
      - joint or muscle pain
      - red irritated eyes
      - red skin lesion, often with a purple center
      - redness of the skin
      - sore throat
      - sores, ulcers, or white spots in the mouth or on the lips
      - vomiting
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
