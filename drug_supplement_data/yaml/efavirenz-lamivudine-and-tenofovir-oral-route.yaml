title: Efavirenz, lamivudine, and tenofovir (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Symfi
    - type: paragraph
      text: Symfi Lo
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Efavirenz, lamivudine, and tenofovir combination is used alone to treat
      human immunodeficiency virus (HIV) infection. HIV is the virus that causes acquired
      immune deficiency syndrome (AIDS).
  - type: paragraph
    text: This medicine does not cure or prevent HIV or AIDS. It helps keep HIV from
      reproducing and appears to slow down the destruction of the immune system. This
      may help delay the development of problems that usually result from AIDS or
      HIV disease. It will not keep you from spreading HIV to other people. People
      who receive this medicine may continue to have some of the problems usually
      related to AIDS or HIV disease.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated pediatric-specific
        problems that would limit the usefulness of Symfi™ in children weighing 40
        kilograms (kg) or more or Symfi Lo™ in children weighing 35 kg or more . Safety
        and efficacy have not been established in children weighing less than 40 kg
        using Symfi™ and in children weighing less than 35 kg using Symfi Lo™ .
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Appropriate studies performed to date have not demonstrated geriatric-specific
        problems that would limit the usefulness of efavirenz, lamivudine, and tenofovir
        combination in the elderly. However, elderly patients are more likely to have
        age-related kidney, liver, or heart problems, which may require caution in
        patients receiving efavirenz, lamivudine, and tenofovir combination.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bepridil
      - Carbamazepine
      - Cisapride
      - Dasabuvir
      - Dronedarone
      - Elbasvir
      - Grazoprevir
      - Levoketoconazole
      - Lonafarnib
      - Maraviroc
      - Mavacamten
      - Mesoridazine
      - Paritaprevir
      - Pimozide
      - Piperaquine
      - Posaconazole
      - Ranolazine
      - Ritonavir
      - Saquinavir
      - Sparfloxacin
      - St John's Wort
      - Terfenadine
      - Thioridazine
      - Voriconazole
      - Ziprasidone
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Abametapir
      - Aceclofenac
      - Acemetacin
      - Adagrasib
      - Alfentanil
      - Alfuzosin
      - Amiodarone
      - Amisulpride
      - Amitriptyline
      - Amprenavir
      - Amtolmetin Guacil
      - Anagrelide
      - Apalutamide
      - Apomorphine
      - Aripiprazole
      - Arsenic Trioxide
      - Artemether
      - Asenapine
      - Aspirin
      - Astemizole
      - Atazanavir
      - Atidarsagene Autotemcel
      - Atogepant
      - Atovaquone
      - Atrasentan
      - Avacopan
      - Avanafil
      - Avapritinib
      - Axitinib
      - Azathioprine
      - Azithromycin
      - Bedaquiline
      - Belzutifan
      - Benzhydrocodone
      - Berotralstat
      - Bexarotene
      - Boceprevir
      - Brigatinib
      - Bromfenac
      - Bufexamac
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Atorvastatin
      - Caspofungin
      - Darunavir
      - Diltiazem
      - Etonogestrel
      - Lopinavir
      - Norgestimate
      - Ospemifene
      - Pravastatin
      - Ritonavir
      - Simvastatin
      - Tipranavir
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Allergic reaction to efavirenz, lamivudine, or tenofovir (eg, Stevens-Johnson
        syndrome, erythema multiforme, toxic skin eruptions), history of—Should not
        be used in patients with this condition.
    - type: list
      ordered: false
      items:
      - Bone problems (eg, osteoporosis), history of or
      - Drug abuse, history of or
      - Fanconi syndrome (kidney disease), history of or
      - Heart rhythm problem (eg, QT prolongation) or
      - Hepatitis B infection, history of or
      - Hypercholesterolemia (high cholesterol level in the blood) or
      - Kidney failure, acute or
      - Liver disease, mild or
      - Mental problems, history of or
      - Pancreatitis (swelling of the pancreas), history of or
      - Seizures, history of—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - End-stage kidney disease or
      - Kidney disease, moderate or severe or
      - Liver disease, moderate or severe—Use is not recommended in patients with
        these conditions.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine exactly as directed by your doctor . Do not take more
      of it, do not take it more often, and do not take it for a longer time than
      your doctor ordered.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read and follow the
      instructions in the insert carefully. Ask your doctor if you have any questions.
  - type: paragraph
    text: Do not change the dose or stop using this medicine without checking first
      with your doctor . When your supply of this medicine is running low, contact
      your doctor or pharmacist ahead of time. Do not allow yourself to run out of
      this medicine.
  - type: paragraph
    text: Take this medicine on an empty stomach, at the same time each day, preferably
      at bedtime.
  - type: paragraph
    text: Keep taking this medicine for the full time of treatment even if you begin
      to feel better. If you stop the medicine even briefly, the virus may become
      harder to treat.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For treatment of HIV infection: For oral dosage form (Symfi™ tablets): Adults
        and children weighing 40 kilograms (kg) or more—1 tablet once a day at bedtime.
        This medicine contains 600 milligrams (mg) efavirenz, 300 mg lamivudine, and
        300 mg tenofovir disoproxil fumarate (equivalent to 245 mg tenofovir disoproxil).
        Children weighing less than 40 kg—Use is not indicated in these patients.
        For oral dosage form (Symfi Lo™ tablets): Adults and children weighing 35
        kilograms (kg) or more—1 tablet once a day at bedtime. This medicine contains
        400 milligrams (mg) efavirenz, 300 mg lamivudine, and 300 mg tenofovir disoproxil
        fumarate (equivalent to 245 mg tenofovir disoproxil). Children weighing less
        than 35 kg—Use is not indicated in these patients.'
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (Symfi™ tablets): Adults and children weighing 40 kilograms
        (kg) or more—1 tablet once a day at bedtime. This medicine contains 600 milligrams
        (mg) efavirenz, 300 mg lamivudine, and 300 mg tenofovir disoproxil fumarate
        (equivalent to 245 mg tenofovir disoproxil). Children weighing less than 40
        kg—Use is not indicated in these patients.'
      - 'For oral dosage form (Symfi Lo™ tablets): Adults and children weighing 35
        kilograms (kg) or more—1 tablet once a day at bedtime. This medicine contains
        400 milligrams (mg) efavirenz, 300 mg lamivudine, and 300 mg tenofovir disoproxil
        fumarate (equivalent to 245 mg tenofovir disoproxil). Children weighing less
        than 35 kg—Use is not indicated in these patients.'
    - type: list
      ordered: false
      items:
      - Adults and children weighing 40 kilograms (kg) or more—1 tablet once a day
        at bedtime. This medicine contains 600 milligrams (mg) efavirenz, 300 mg lamivudine,
        and 300 mg tenofovir disoproxil fumarate (equivalent to 245 mg tenofovir disoproxil).
      - Children weighing less than 40 kg—Use is not indicated in these patients.
    - type: list
      ordered: false
      items:
      - Adults and children weighing 35 kilograms (kg) or more—1 tablet once a day
        at bedtime. This medicine contains 400 milligrams (mg) efavirenz, 300 mg lamivudine,
        and 300 mg tenofovir disoproxil fumarate (equivalent to 245 mg tenofovir disoproxil).
      - Children weighing less than 35 kg—Use is not indicated in these patients.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Store the medicine in its original container. Keep the bottle tightly
        closed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your and your child's progress
      at regular visits , especially during the first few weeks that you take this
      medicine. Blood and urine tests may be needed to check for any unwanted effects.
  - type: paragraph
    text: Do not use this medicine together with elbasvir/grazoprevir (Zepatier®).
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. You should
      not become pregnant while you are using this medicine and for 12 weeks after
      the last dose. Some birth control pills may not work as well while you are using
      this medicine. Use birth control pills together with another form of birth control
      (eg, condoms, diaphragm, or contraceptive foam or jelly). If you think you have
      become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: Two rare but serious reactions to this medicine are lactic acidosis (too
      much acid in the blood) and liver toxicity. These reactions usually occur if
      you are a female and overweight. Call your doctor right away if you or child
      have abdominal or stomach discomfort, cramping, nausea, vomiting, diarrhea,
      or a decreased appetite, muscle cramping or pain, unusual tiredness or weakness,
      trouble breathing, or yellow skin or eyes.
  - type: paragraph
    text: This medicine may cause a hepatitis B infection to worsen if you stop using
      it. Your doctor may check for the presence of hepatitis B before and during
      treatment with this medicine and for at least several months after your last
      dose.
  - type: paragraph
    text: This medicine may increase the risk of kidney problems. To lower this risk,
      avoid other medicines that can be harmful to the kidneys such as aminoglycoside
      antibiotics, certain other antiviral medicines, and NSAID pain medicines.
  - type: paragraph
    text: You or your child might have mood or behavior changes with this medicine,
      such as feeling sad or hopeless, or getting upset easily. You could feel nervous
      or hostile, or have decreased awareness or responsiveness. Some people become
      violent and want to hurt themselves or others. Call your doctor right away if
      you or your child have any strange feelings, thoughts, or behaviors.
  - type: paragraph
    text: This medicine may cause nervous system symptoms and can be severe. These
      symptoms usually begin during the first or second day after taking this medicine
      and usually go away after 2 to 4 weeks of treatment. Some symptoms may occur
      months to years after starting treatment. Tell your doctor if you have confusion,
      trouble sleeping, unusual dreams, trouble concentrating, slow thoughts and movements
      while using this medicine.
  - type: paragraph
    text: This medicine may cause some people to become dizzy, lightheaded, drowsy,
      or less alert than they are normally. Even if taken at bedtime, it may cause
      some people to feel drowsy or less alert upon waking up. Do not drive or do
      anything else that could be dangerous unless you know how this medicine affects
      you .
  - type: paragraph
    text: Some people who have used this medicine developed serious skin problems.
      Call your doctor right away if you or your child notice a severe skin rash,
      blistering, peeling, or loosening of the skin, red skin lesions, sores or ulcers
      on the skin, or fever or chills while you or your child are using this medicine.
  - type: paragraph
    text: Check with your doctor right away if you or your child have loss of appetite,
      nausea, or pains in the stomach, side, or abdomen, possibly radiating to the
      back. These could be symptoms of pancreatitis (swelling of the pancreas).
  - type: paragraph
    text: This medicine may also increase your or your child's risk of developing
      fractures (broken bones). Ask your doctor about this if you have any concerns.
  - type: paragraph
    text: Your immune system may get stronger when you start taking HIV medicines.
      Tell your doctor right away if you notice any changes in your health. Sometimes
      the immune system will start to fight infections that were hidden in your body,
      such as pneumonia, herpes, or tuberculosis. Autoimmune disorders (eg, Graves'
      disease, polymyositis, and Guillain-Barré syndrome) may also occur.
  - type: paragraph
    text: This medicine may cause you to have excess body fat. Tell your doctor if
      you notice changes in your body shape, such as an increased amount of fat in
      the upper back and neck, or around the chest and stomach area. You might also
      lose fat from the legs, arms, and face.
  - type: paragraph
    text: Contact your doctor right away if you or your child have any changes in
      heart rhythm. You might feel dizzy or faint, or you might have a fast, pounding,
      or uneven heartbeat. Make sure your doctor knows if you or anyone in your family
      has ever had a heart rhythm problem such as QT prolongation.
  - type: paragraph
    text: Limit the amount of alcohol you drink.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you or your child
      are using this medicine. This medicine may affect the results of certain medical
      tests.
  - type: paragraph
    text: This medicine does not decrease the risk of transmitting the HIV infection
      to others through sexual contact or by contaminated blood. Make sure you understand
      and practice safe sex, even if your partner also has HIV. Avoid sharing needles
      with anyone.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes prescription or nonprescription (over-the-counter [OTC]) medicines
      and herbal (St. John's wort) or vitamin supplements.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Anxiety
      - discouragement
      - feeling sad or empty
      - fever
      - irritability
      - lack of appetite
      - loss of interest or pleasure
      - rash
      - stomach pain
      - trouble concentrating
      - trouble sleeping
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Body aches or pain
      - burning, numbness, tingling, or painful sensations
      - chest pain
      - chills
      - cough
      - diarrhea
      - difficulty in moving
      - ear congestion
      - headache
      - joint pain
      - loss of voice
      - muscle cramp, pain, or stiffness
      - nausea
      - painful blisters on the trunk of the body
      - runny or stuffy nose
      - sneezing
      - sore throat
      - swollen joints
      - tightness in the chest
      - troubled breathing
      - unsteadiness or awkwardness
      - unusual tiredness or weakness
      - weakness in the arms, hands, legs, or feet
    subsections: []
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Agitation
      - blistering, peeling, loosening of the skin
      - bloating
      - bone fractures, especially of the femur
      - bone pain
      - dark urine
      - decreased appetite
      - decreased awareness or responsiveness
      - decreased urine
      - difficulty having a bowel movement (stool)
      - dizziness
      - dry mouth
      - fast, irregular heartbeat
      - fast, shallow breathing
      - general feeling of discomfort
      - general feeling of tiredness or weakness
      - hostility
      - increased thirst
      - indigestion
      - itching
      - light-colored stools
      - loss of bone mineral density
      - loss of consciousness
      - mood changes
      - muscle twitching
      - pains in the stomach, side, or abdomen, possibly radiating to the back
      - rapid weight gain
      - red skin lesions, often with a purple center
      - red, irritated eye
      - seizures
      - severe sleepiness
      - sleepiness
      - sores, ulcers, or white spots in the mouth or on the lips
      - stomach discomfort
      - stomach pain, continuing
      - swelling of the face, ankles, or hands
      - upper right abdominal or stomach pain
      - vomiting
      - yellow eyes or skin
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Back pain
      - lack or loss of strength
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abnormal dreams
      - belching
      - heartburn
      - indigestion
      - redistribution or accumulation of body fat
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
