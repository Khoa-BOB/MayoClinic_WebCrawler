title: Iodoquinol (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Diquinol
    - type: paragraph
      text: Yodoxin
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Iodoquinol belongs to the group of medicines called antiprotozoals. These
      medicines are used to treat infections caused by protozoa (tiny, one-celled
      animals). Iodoquinol is used most often in the treatment of an intestinal infection
      called amebiasis. However, it may be used to treat other types of infection
      as determined by your doctor.
  - type: paragraph
    text: Iodoquinol is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: Children may be more likely to develop certain side effects, especially
        if given high doses for a long time.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: Many medicines have not been studied specifically in older people. Therefore,
        it may not be known whether they work exactly the same way they do in younger
        adults or if they cause different side effects or problems in older people.
        There is no specific information comparing use of iodoquinol in the elderly
        with use in other age groups.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: There are no adequate studies in women for determining infant risk when
        using this medication during breastfeeding. Weigh the potential benefits against
        the potential risks before taking this medication while breastfeeding.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Eye disease—Iodoquinol may cause side effects affecting the eye or make eye
        disease worse
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease or
      - Thyroid disease—Patients with kidney disease, liver disease, or thyroid disease
        may have an increased chance of side effects
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Take this medicine after meals to lessen possible stomach upset, unless
      otherwise directed by your doctor.
  - type: paragraph
    text: If the tablets are too large to swallow whole, they may be crushed and mixed
      with a small amount of applesauce or chocolate syrup.
  - type: paragraph
    text: To help clear up your infection completely, keep taking this medicine for
      the full time of treatment, even if you begin to feel better after a few days.
      Do not miss any doses.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For amebiasis: Adults—630 or 650 milligrams
        (mg) three times a day for twenty days. Children—Dose is based on body weight
        and must be determined by your doctor. The usual dose is 10 to 13.3 mg per
        kilogram (kg) (4.5 to 6 mg per pound) of body weight three times a day for
        twenty days.'
    - type: list
      ordered: false
      items:
      - 'For amebiasis: Adults—630 or 650 milligrams (mg) three times a day for twenty
        days. Children—Dose is based on body weight and must be determined by your
        doctor. The usual dose is 10 to 13.3 mg per kilogram (kg) (4.5 to 6 mg per
        pound) of body weight three times a day for twenty days.'
    - type: list
      ordered: false
      items:
      - Adults—630 or 650 milligrams (mg) three times a day for twenty days.
      - Children—Dose is based on body weight and must be determined by your doctor.
        The usual dose is 10 to 13.3 mg per kilogram (kg) (4.5 to 6 mg per pound)
        of body weight three times a day for twenty days.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: This medicine may cause blurred vision or loss of vision. Make sure you
      know how you react to this medicine before you drive, use machines, or do anything
      else that could be dangerous if you are not able to see well . If these reactions
      are especially bothersome, check with your doctor.
  - type: paragraph
    text: If you must have thyroid function tests, make sure the doctor knows that
      you are taking this medicine or have taken it within the past 6 months.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Fever or chills
      - skin rash, hives, or itching
      - swelling of neck
    subsections: []
  - heading: With long-term use of high doses
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision or any change in vision
      - clumsiness or unsteadiness
      - decreased vision or eye pain
      - increased weakness
      - muscle pain
      - numbness, tingling, pain, or weakness in hands or feet
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Diarrhea
      - nausea or vomiting
      - stomach pain
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Headache
      - itching of the rectal area
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
