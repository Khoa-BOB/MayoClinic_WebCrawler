    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Anaphylactic reaction (severe), history of—May increase risk for repeated
        anaphylactic reactions.
    - type: list
      ordered: false
      items:
      - Asthma or
      - Bradycardia (slow heartbeat), severe or
      - Cardiogenic shock (shock caused by heart attack) or
      - Heart block or
      - Heart failure, decompensated or
      - Liver disease, severe or
      - Patients with diabetes who are taking aliskiren or
      - Sick sinus syndrome (type of abnormal heart rhythm), without a pacemaker—Should
        not be used in patients with these conditions.
    - type: list
      ordered: false
      items:
      - Coronary artery disease or
      - Fluid imbalances (caused by dehydration, vomiting, or diarrhea) or
      - Heart failure or
      - Hypotension (low blood pressure) or
      - Kidney disease, severe or
      - Lung disease (eg, asthma, bronchitis, emphysema) or
      - Peripheral vascular disease (clogged blood vessels) or
      - Pheochromocytoma (adrenal gland tumor)—Use with caution. May make these conditions
        worse.
    - type: list
      ordered: false
      items:
      - Diabetes or
      - Hyperthyroidism (overactive thyroid) or
      - Hypoglycemia (low blood sugar)—May cover up some of the symptoms of these
        diseases, such as a fast heartbeat.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: Byvalson™ is used when a single medicine to lower your blood pressure is
      not enough. It is also used as the first medicine to treat your condition if
      your doctor feels that you need to take more than one blood pressure medicine.
  - type: paragraph
    text: This medicine comes with a patient information insert. Read the information
      carefully and make sure you understand it before taking this medicine. Ask your
      doctor if you have any questions.
  - type: paragraph
    text: In addition to the use of this medicine, treatment for your high blood pressure
      may include weight control and changes in the types of foods you eat, especially
      foods high in sodium (salt). Your doctor will tell you which of these are most
      important for you. You should check with your doctor before changing your diet.
  - type: paragraph
    text: Many patients who have high blood pressure will not notice any signs of
      the problem. In fact, many may feel normal. It is very important that you take
      your medicine exactly as directed and that you keep your appointments with your
      doctor even if you feel well.
  - type: paragraph
    text: Remember that this medicine will not cure your high blood pressure, but
      it does help control it. You must continue to take it as directed if you expect
      to lower your blood pressure and keep it down. You may have to take high blood
      pressure medicine for the rest of your life . If high blood pressure is not
      treated, it can cause serious problems such as heart failure, blood vessel disease,
      stroke, or kidney disease.
  - type: paragraph
    text: Take this medicine the same way every day. This means take it at the same
      time and take it consistently with or without food.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For high blood pressure: Adults—One tablet
        containing 5 milligrams (mg) of nebivolol and 80 mg of valsartan once a day.
        Children—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - 'For high blood pressure: Adults—One tablet containing 5 milligrams (mg) of
        nebivolol and 80 mg of valsartan once a day. Children—Use and dose must be
        determined by your doctor.'
    - type: list
      ordered: false
      items:
      - Adults—One tablet containing 5 milligrams (mg) of nebivolol and 80 mg of valsartan
        once a day.
      - Children—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, take it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure this medicine is working properly. Blood tests may be needed to
      check for unwanted effects.
  - type: paragraph
    text: Using this medicine while you are pregnant can harm your unborn baby. Use
      an effective form of birth control to keep from getting pregnant. If you think
      you have become pregnant while using the medicine, tell your doctor right away.
  - type: paragraph
    text: Do not use this medicine together with aliskiren (Tekturna®) if you have
      diabetes.
  - type: paragraph
    text: Dizziness, lightheadedness, or fainting may occur after the first dose,
      especially if you have been taking a diuretic (water pill). Make sure you know
      how you react to this medicine before you drive, use machines, or do anything
      else that could be dangerous if you are dizzy or not alert .
  - type: paragraph
    text: Check with your doctor right away if you experience dizziness, fainting,
      confusion, muscle pain, weakness, or a fast heartbeat. Use extra care if you
      exercise or if the weather is hot. Heavy sweating can cause dehydration (loss
      of too much water) or electrolyte imbalances (loss of sodium or potassium in
      the body).
  - type: paragraph
    text: Check with your doctor right away if you become sick while taking this medicine,
      especially with severe or continuing nausea, vomiting, or diarrhea. These conditions
      may cause you to lose too much water or salt which may cause low blood pressure.
  - type: paragraph
    text: Do not suddenly stop taking this medicine without first checking with your
      doctor . Your doctor may want you to gradually reduce the amount you are taking
      before stopping it completely. Some conditions may become worse when the medicine
      is stopped suddenly, which can be dangerous.
  - type: paragraph
    text: This medicine may worsen the symptoms of heart failure in some patients.
      Check with your doctor right away if you are having chest pain or discomfort,
      dilated neck veins, extreme fatigue, irregular breathing, an irregular heartbeat,
      swelling of the face, fingers, feet, or lower legs, weight gain, or trouble
      breathing.
  - type: paragraph
    text: 'Hyperkalemia (high potassium in the blood) may occur while you are using
      this medicine. Check with your doctor right away if you have the following symptoms:
      abdominal or stomach pain, confusion, difficulty with breathing, irregular heartbeat,
      nausea or vomiting, nervousness, numbness or tingling in the hands, feet, or
      lips, shortness of breath, or weakness or heaviness of the legs. Do not use
      supplements or salt substitutes containing potassium without first checking
      with your doctor .'
  - type: paragraph
    text: This medicine may cause serious allergic reaction, including anaphylaxis,
      which can be life-threatening and requires immediate medical attention. Call
      your doctor right away if you have a rash, itching, hoarseness, trouble breathing,
      trouble swallowing, or any swelling of your hands, face, or mouth while you
      are using this medicine.
  - type: paragraph
    text: Make sure any doctor or dentist who treats you knows that you are using
      this medicine. You may need to stop using this medicine several days before
      having surgery.
  - type: paragraph
    text: This medicine may cause serious kidney problem. Check with your doctor right
      away if you have agitation, coma, confusion, decreased urine output, decreased
      urine output, depression, dizziness, headache, hostility, irritability, lethargy,
      muscle twitching, nausea, rapid weight gain, seizures, stupor, swelling of the
      face ankles, or hands, unusual tiredness or weakness.
  - type: paragraph
    text: This medicine may cover up signs of low blood sugar in patients who have
      diabetes or are fasting (eg, surgery, not eating regularly, vomiting), such
      as a rapid pulse rate. Check with your doctor if you have these problems or
      if you notice a change in the results of your blood or urine sugar tests.
  - type: paragraph
    text: Do not take other medicines unless they have been discussed with your doctor.
      This includes over-the-counter (nonprescription) medicines for appetite control,
      asthma, colds, cough, hay fever, or sinus problems, since they may increase
      your blood pressure.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Check with your doctor immediately if any of the following side effects
      occur:'
  subsections:
  - heading: Incidence not known
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Blurred vision
      - chest pain or tightness
      - confusion
      - decreased urine output
      - difficult breathing
      - dilated neck veins
      - dizziness, faintness, or lightheadedness when getting up suddenly from a lying
        or sitting position
      - extreme fatigue
      - irregular breathing
      - irregular heartbeat
      - nausea or vomiting
      - nervousness
      - numbness or tingling in the hands, feet, or lips
      - stomach pain
      - sweating
      - swelling of the face, fingers, feet, or lower legs
      - trouble breathing
      - unusual tiredness or weakness
      - weakness or heaviness of the legs
      - weight gain
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
