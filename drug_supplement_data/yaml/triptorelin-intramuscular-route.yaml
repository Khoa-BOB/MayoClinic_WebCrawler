  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Bladder blockage or
      - Depression, history of or
      - Diabetes or
      - Heart or blood vessel disease or
      - Hyperglycemia (high blood sugar) or
      - Mental illness, history of or
      - Spinal cord problems—Use with caution. May make these conditions worse.
    - type: list
      ordered: false
      items:
      - Brain or brain vessel problems or tumors, history of or
      - Seizures, history of—May increase the risk for seizures.
    - type: list
      ordered: false
      items:
      - Congestive heart failure or
      - Electrolyte imbalance or
      - Heart rhythm problems (eg, congenital long QT syndrome)—May cause side effects
        to become worse.
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—Use with caution. The effects may be increased because of slower
        removal of the medicine from the body.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A nurse or other trained health professional will give you this medicine.
      It is given as a shot into your muscle (usually in the buttocks or thighs).
      This medicine needs to be given on a fixed schedule. Make sure you keep all
      of your appointments.
  - type: paragraph
    text: Triptodur® comes with a Medication Guide. Read and follow these instructions
      carefully. Ask your doctor or pharmacist if you have any questions.
  subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that your doctor check your progress at regular visits
      to make sure that this medicine is working properly. Blood and urine tests may
      be needed to check for unwanted effects.
  - type: paragraph
    text: This medicine may cause serious allergic reactions, including anaphylaxis
      and angioedema, which can be life-threatening and require immediate medical
      attention. Call your doctor right away if you have a rash, itching, hoarseness,
      large, hive-like swelling on face, eyelids, lips, tongue, throat, hands, legs,
      feet, or genitals, trouble breathing, trouble swallowing, or any swelling of
      your hands, face, or mouth after you receive the medicine.
  - type: paragraph
    text: 'Patients receiving triptorelin injection for advanced prostate cancer :'
  - type: list
    ordered: false
    items:
    - When you first start using this medicine, some of your symptoms might get worse
      or you might have new symptoms for a short time. Tell your doctor right away
      if you have bone pain, back pain, a tingling or numbness in the body, blood
      in the urine, sensation of pins and needles, stabbing pain, or trouble urinating.
    - Contact your doctor right away if you have any changes to your heart rhythm.
      You might feel dizzy or faint, or you might have a fast, pounding, or uneven
      heartbeat. Make sure your doctor knows if you or anyone in your family has ever
      had a heart rhythm problem, including QT prolongation.
    - This medicine may increase your risk of high blood sugar or cholesterol levels,
      or non-alcoholic fatty liver disease. Check with your doctor if you notice a
      change in the results of your blood or urine sugar tests.
    - This medicine may increase your risk of having a heart attack or stroke. Call
      your doctor right away if you have chest pain or discomfort, pain or discomfort
      in the arms, jaw, back, or neck, nausea, sweating, trouble breathing, or vomiting.
    - This medicine may cause seizures. Check with your doctor right away if you have
      loss of bladder control, muscle spasm or jerking of all extremities, or sudden
      loss of consciousness.
    - Talk with your doctor before using this medicine if you plan to have children.
      Some males who use this medicine have become infertile (unable to have children).
  - type: paragraph
    text: 'Patients receiving triptorelin injection for central precocious puberty
      (CPP) :'
  - type: list
    ordered: false
    items:
    - This medicine can cause a brief increase in blood levels of some hormones. During
      this time, you may notice more signs of puberty in your child, including light
      vaginal bleeding in girls. If your child's symptoms do not improve within 2
      months, or if they get worse, call your doctor.
    - Monitor your child's height every 3 to 6 months while on treatment with this
      medicine.
    - This medicine may cause your child to be agitated, irritable, or display other
      abnormal behaviors. Make sure the doctor knows if your child has trouble sleeping,
      get upset easily, have a big increase in energy, or start to act reckless. Also
      tell the doctor if your child has sudden or strong feelings, such as feeling
      nervous, angry, restless, violent, or scared. If you or your caregiver notice
      any of these side effects, tell your doctor right away.
    - Using this medicine may increase your child's risk of having seizures. Check
      with your doctor right away if your child starts to have convulsions, muscle
      spasm or jerking of all extremities, sudden loss of consciousness, or loss of
      bladder control.
    - This medicine may cause intracranial hypertension or pseudotumor cerebri (increased
      pressure in the head) in children. Check with your doctor right away if your
      child has blurred or double vision, change in ability to see colors, especially
      blue or yellow, continuing ringing or buzzing or other unexplained noise in
      the ears, dizziness, eye pain, hearing loss, nausea and vomiting, or severe
      headache.
  - type: paragraph
    text: This medicine may cause serious skin reactions, including Stevens-Johnson
      syndrome, toxic epidermal necrolysis, drug reaction with eosinophilia and systemic
      symptoms (DRESS), and acute generalized exanthematous pustulosis (AGEP). Check
      with your doctor right away if you have black, tarry stools, blistering, peeling,
      or loosening of the skin, chest pain, chills, cough, diarrhea, fever, itching,
      joint or muscle pain, painful or difficult urination, red irritated eyes, red
      skin lesions, often with a purple center, sore throat, sores, ulcers, or white
      spots in the mouth or on the lips, swollen glands, unusual bleeding or bruising,
      or unusual tiredness or weakness.
  - type: paragraph
    text: Before you have any medical tests, tell the medical doctor in charge that
      you are using this medicine. The results of some tests may be affected by this
      medicine.
  subsections: []
