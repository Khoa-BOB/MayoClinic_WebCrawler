title: Eflornithine (topical route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Vaniqa
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Eflornithine is used to slow down bodily substances called enzymes that
      help hair grow. The effect is slower facial hair growth.
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Pediatric
    level: 3
    content:
    - type: paragraph
      text: There is no specific information comparing use of eflornithine in children
        under the age of 12 years with use in other age groups. However, this medicine
        is not expected to cause different side effects or problems in older children
        than it does in adults.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested and has not been shown to cause different
        side effects or problems in older people than it does in younger adults.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. Tell your healthcare professional if you are
        taking any other prescription or nonprescription (over-the-counter [OTC])
        medicine.
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: This medicine comes with a patient instruction sheet. Read this sheet carefully
      and follow the directions. If you have any questions on how to use this medicine,
      be sure to ask your health care professional.
  - type: paragraph
    text: This medicine is usually used on the face and nearby involved areas under
      the chin only. Do not get the medicine in your eyes, nose, or mouth. Rinse thoroughly
      with water and contact your doctor if the medicine gets in the eyes
  - type: paragraph
    text: You need to continue your normal hair removal procedures while using this
      medicine, and the medicine should be applied at least five minutes after the
      unwanted hair has been removed. You should wait until the medicine dries before
      applying cosmetics or sunscreen.
  - type: paragraph
    text: Do not wash the treated areas for at least 4 hours after applying the medicine.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For topical dosage form (cream): For reduced rate of facial hair growth in
        women. Adults and children 12 years of age or older—Coat the problem areas
        on the face and nearby areas under the chin with the medicine two times a
        day with the second treatment coming at least eight hours after the first.
        Children under 12 years of age—Use and dose must be determined by your doctor.'
    - type: list
      ordered: false
      items:
      - For reduced rate of facial hair growth in women. Adults and children 12 years
        of age or older—Coat the problem areas on the face and nearby areas under
        the chin with the medicine two times a day with the second treatment coming
        at least eight hours after the first. Children under 12 years of age—Use and
        dose must be determined by your doctor.
    - type: list
      ordered: false
      items:
      - Adults and children 12 years of age or older—Coat the problem areas on the
        face and nearby areas under the chin with the medicine two times a day with
        the second treatment coming at least eight hours after the first.
      - Children under 12 years of age—Use and dose must be determined by your doctor.
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, apply it as soon as possible. However,
        if it is almost time for your next dose, skip the missed dose and go back
        to your regular dosing schedule.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: If skin irritation occurs, reduce the frequency of treatments. If irritation
      continues, stop using the medicine and contact your doctor.
  - type: paragraph
    text: If no improvement is seen after six months of treatment, stop using the
      medicine and contact your doctor.
  - type: paragraph
    text: If condition gets worse while you use the medicine, stop the medicine and
      contact your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: 'Some side effects may occur that usually do not need medical attention.
      These side effects may go away during treatment as your body adjusts to the
      medicine. Also, your health care professional may be able to tell you about
      ways to prevent or reduce some of these side effects. Check with your health
      care professional if any of the following side effects continue or are bothersome
      or if you have any questions about them:'
  subsections:
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Acne
      - stinging skin
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Burning or bleeding skin
      - chapped, red lips
      - chronic acne
      - hair bumps
      - numbness
      - rash
      - reddening of skin
      - swelling of lips
      - tingling skin
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
