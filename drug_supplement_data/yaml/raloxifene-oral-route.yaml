title: Raloxifene (oral route)
sections:
- heading: Brand Name
  level: 2
  content: []
  subsections:
  - heading: US Brand Name
    level: 3
    content:
    - type: paragraph
      text: Evista
    subsections: []
- heading: Description
  level: 2
  content:
  - type: paragraph
    text: Raloxifene is used to help prevent and treat thinning of the bones (osteoporosis)
      only in postmenopausal women.
  - type: paragraph
    text: It works like an estrogen to stop the bone loss that can develop in women
      after menopause, but it does not increase the bone density as much as daily
      0.625 mg doses of conjugated estrogens. Raloxifene will not treat hot flashes
      of menopause and may cause hot flashes to occur. Also, raloxifene does not stimulate
      the breast or uterus as estrogen does.
  - type: paragraph
    text: Raloxifene lowers the blood concentrations of total and low-density lipoprotein
      (LDL) cholesterol, the bad cholesterols, but it does not increase concentrations
      of high-density lipoprotein (HDL) cholesterol, the good cholesterol, in your
      blood.
  - type: paragraph
    text: Raloxifene is also used to lower chances of having invasive breast cancer
      in postmenopausal women with osteoporosis or at high risk of having invasive
      breast cancer .
  - type: paragraph
    text: This medicine is available only with your doctor's prescription.
  - type: paragraph
    text: 'This product is available in the following dosage forms:'
  - type: list
    ordered: false
    items:
    - Tablet
  subsections: []
- heading: Before Using
  level: 2
  content:
  - type: paragraph
    text: 'In deciding to use a medicine, the risks of taking the medicine must be
      weighed against the good it will do. This is a decision you and your doctor
      will make. For this medicine, the following should be considered:'
  subsections:
  - heading: Allergies
    level: 3
    content:
    - type: paragraph
      text: Tell your doctor if you have ever had any unusual or allergic reaction
        to this medicine or any other medicines. Also tell your health care professional
        if you have any other types of allergies, such as to foods, dyes, preservatives,
        or animals. For non-prescription products, read the label or package ingredients
        carefully.
    subsections: []
  - heading: Geriatric
    level: 3
    content:
    - type: paragraph
      text: This medicine has been tested only in women past menopause and has not
        been shown to cause different side effects or problems in elderly people than
        it does in adults who have just gone through menopause.
    subsections: []
  - heading: Breastfeeding
    level: 3
    content:
    - type: paragraph
      text: Studies in women breastfeeding have demonstrated harmful infant effects.
        An alternative to this medication should be prescribed or you should stop
        breastfeeding while using this medicine.
    subsections: []
  - heading: Drug Interactions
    level: 3
    content:
    - type: paragraph
      text: Although certain medicines should not be used together at all, in other
        cases two different medicines may be used together even if an interaction
        might occur. In these cases, your doctor may want to change the dose, or other
        precautions may be necessary. When you are taking this medicine, it is especially
        important that your healthcare professional know if you are taking any of
        the medicines listed below. The following interactions have been selected
        on the basis of their potential significance and are not necessarily all-inclusive.
    - type: paragraph
      text: Using this medicine with any of the following medicines is not recommended.
        Your doctor may decide not to treat you with this medication or change some
        of the other medicines you take.
    - type: list
      ordered: false
      items:
      - Bacillus of Calmette and Guerin Vaccine, Live
      - Dengue Tetravalent Vaccine, Live
      - Measles Virus Vaccine, Live
      - Mumps Virus Vaccine, Live
      - Rubella Virus Vaccine, Live
      - Smallpox Monkeypox Vaccine
      - Typhoid Vaccine
      - Varicella Virus Vaccine, Live
      - Yellow Fever Vaccine
    - type: paragraph
      text: Using this medicine with any of the following medicines is usually not
        recommended, but may be required in some cases. If both medicines are prescribed
        together, your doctor may change the dose or how often you use one or both
        of the medicines.
    - type: list
      ordered: false
      items:
      - Adenovirus Vaccine Type 4, Live
      - Adenovirus Vaccine Type 7, Live
      - Cholera Vaccine
      - Ebola Zaire Vaccine, Live
      - Influenza Virus Vaccine, Live
      - Rotavirus Vaccine, Live
    - type: paragraph
      text: Using this medicine with any of the following medicines may cause an increased
        risk of certain side effects, but using both drugs may be the best treatment
        for you. If both medicines are prescribed together, your doctor may change
        the dose or how often you use one or both of the medicines.
    - type: list
      ordered: false
      items:
      - Levothyroxine
    subsections: []
  - heading: Other Interactions
    level: 3
    content:
    - type: paragraph
      text: Certain medicines should not be used at or around the time of eating food
        or eating certain types of food since interactions may occur.  Using alcohol
        or tobacco with certain medicines may also cause interactions to occur.  Discuss
        with your healthcare professional the use of your medicine with food, alcohol,
        or tobacco.
    subsections: []
  - heading: Other Medical Problems
    level: 3
    content:
    - type: paragraph
      text: 'The presence of other medical problems may affect the use of this medicine.
        Make sure you tell your doctor if you have any other medical problems, especially:'
    - type: list
      ordered: false
      items:
      - Blood clot formation, active or history of, including deep vein thrombosis,
        pulmonary embolism, and retinal embolism—Raloxifene may slightly increase
        the chances of these conditions and, if they are already present, cause them
        to worsen. This medicine should not be used in patients with these conditions
        .
    - type: list
      ordered: false
      items:
      - Cancer or tumors or
      - Congestive heart failure or
      - Heart rhythm problems (e.g., atrial fibrillation) or
      - High blood pressure or
      - Stroke, history of or
      - Transient ischemic attack (TIA), history of or
      - Any other condition that increases the risk of blood clots—Taking raloxifene
        while having one of these conditions may worsen the chance that blood clots
        can form .
    - type: list
      ordered: false
      items:
      - Kidney disease or
      - Liver disease—These conditions may cause higher concentrations of raloxifene
        in the blood .
    subsections: []
- heading: Proper Use
  level: 2
  content:
  - type: paragraph
    text: A paper with information for the patient will be given to you with your
      filled prescription, and will provide many details concerning the use of raloxifene.
      Read this paper carefully and ask your health care professional if you need
      additional information or explanation.
  - type: paragraph
    text: Many patients trying to prevent or treat bone loss will not notice any signs
      of the problem. In fact, many may feel normal. It is very important that you
      take your medicine exactly as directed.
  subsections:
  - heading: Dosing
    level: 3
    content:
    - type: paragraph
      text: The dose of this medicine will be different for different patients. Follow
        your doctor's orders or the directions on the label. The following information
        includes only the average doses of this medicine. If your dose is different,
        do not change it unless your doctor tells you to do so.
    - type: paragraph
      text: The amount of medicine that you take depends on the strength of the medicine.
        Also, the number of doses you take each day, the time allowed between doses,
        and the length of time you take the medicine depend on the medical problem
        for which you are using the medicine.
    - type: list
      ordered: false
      items:
      - 'For oral dosage form (tablets): For preventing bone loss: Adults—60 mg once
        a day, with or without meals. For treating bone loss: Adults—60 mg once a
        day, with or without meals. For preventing invasive breast cancer: Adults—60
        mg once a day, with or without meals .'
    - type: list
      ordered: false
      items:
      - 'For preventing bone loss: Adults—60 mg once a day, with or without meals.'
      - 'For treating bone loss: Adults—60 mg once a day, with or without meals.'
      - 'For preventing invasive breast cancer: Adults—60 mg once a day, with or without
        meals .'
    - type: list
      ordered: false
      items:
      - Adults—60 mg once a day, with or without meals.
    - type: list
      ordered: false
      items:
      - Adults—60 mg once a day, with or without meals.
    - type: list
      ordered: false
      items:
      - Adults—60 mg once a day, with or without meals .
    subsections: []
  - heading: Missed Dose
    level: 3
    content:
    - type: paragraph
      text: If you miss a dose of this medicine, skip the missed dose and go back
        to your regular dosing schedule. Do not double doses.
    subsections: []
  - heading: Storage
    level: 3
    content:
    - type: paragraph
      text: Store the medicine in a closed container at room temperature, away from
        heat, moisture, and direct light. Keep from freezing.
    - type: paragraph
      text: Keep out of the reach of children.
    - type: paragraph
      text: Do not keep outdated medicine or medicine no longer needed.
    - type: paragraph
      text: Ask your healthcare professional how you should dispose of any medicine
        you do not use.
    subsections: []
- heading: Precautions
  level: 2
  content:
  - type: paragraph
    text: It is very important that you keep your appointments with your doctor even
      if you feel well.
  - type: paragraph
    text: Before you have any kind of surgery, tell the medical doctor in charge that
      you are using this medicine. Discuss discontinuing use of raloxifene 3 days
      before you think you will have a long period of inactivity, sitting, or bed
      rest, such as after having surgery or going on a long trip. The doctor may have
      you start the medicine again after you are back on your feet and fully mobile.
      If you are going on a trip and stay on raloxifene, you should walk regularly
      or move about when possible. Remaining still for long periods may cause blood
      clots for some people, and raloxifene may rarely worsen their condition.
  - type: paragraph
    text: If you are able to become pregnant, stop using the medicine immediately
      if you think you have become pregnant and check with your doctor. Raloxifene
      is recommended for women who are past menopause.
  - type: paragraph
    text: Raloxifene does not act like an estrogen to stimulate the uterus or breast.
      If you experience vaginal bleeding, breast pain or enlargement, or swelling
      of hands or feet while on raloxifene, you should report it to your doctor.
  - type: paragraph
    text: Other ways that may be used with raloxifene to help prevent or treat bone
      loss are taking calcium plus vitamin D supplements and getting weight-bearing
      exercise. You may want to discuss these options with your doctor.
  subsections: []
- heading: Side Effects
  level: 2
  content:
  - type: paragraph
    text: Along with its needed effects, a medicine may cause some unwanted effects.
      Although not all of these side effects may occur, if they do occur they may
      need medical attention.
  - type: paragraph
    text: 'Stop taking this medicine and get emergency help immediately if any of
      the following effects occur:'
  subsections:
  - heading: Rare
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Coughing blood
      - headache or migraine headache
      - loss of or change in speech, coordination, or vision
      - pain or numbness in chest, arm, or leg
      - shortness of breath (unexplained)
    - type: paragraph
      text: 'Check with your doctor as soon as possible if any of the following side
        effects occur:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Bloody or cloudy urine
      - chest pain
      - difficult, burning, or painful urination
      - fever
      - frequent urge to urinate
      - infection, including body aches or pain, congestion in throat, cough, dryness
        or soreness of throat, runny nose, and loss of voice
      - leg cramping
      - skin rash
      - swelling of hands, ankles, or feet
      - vaginal itching
    subsections: []
  - heading: Less common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Abdominal pain (severe)
      - aching body pains
      - congestion in lungs
      - decreased vision or other changes in vision
      - diarrhea
      - difficulty in breathing
      - hoarseness
      - loss of appetite
      - nausea
      - trouble in swallowing
      - weakness
    - type: paragraph
      text: 'Some side effects may occur that usually do not need medical attention.
        These side effects may go away during treatment as your body adjusts to the
        medicine. Also, your health care professional may be able to tell you about
        ways to prevent or reduce some of these side effects. Check with your health
        care professional if any of the following side effects continue or are bothersome
        or if you have any questions about them:'
    subsections: []
  - heading: More common
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Hot flashes, including sudden sweating and feelings of warmth (especially
        common during the first 6 months of treatment)
      - increased white vaginal discharge
      - joint or muscle pain
      - mental depression
      - problems of stomach or intestines, including passing of gas, upset stomach,
        or vomiting
      - swollen joints
      - trouble in sleeping
      - weight gain (unexplained)
    - type: paragraph
      text: Other side effects not listed may also occur in some patients. If you
        notice any other effects, check with your healthcare professional.
    - type: paragraph
      text: Call your doctor for medical advice about side effects. You may report
        side effects to the FDA at 1-800-FDA-1088.
