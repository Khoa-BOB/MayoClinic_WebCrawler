title: E. coli
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Escherichia coli (E. coli) bacteria normally live in the intestines of healthy
      people and animals. Most types of E. coli are harmless or cause relatively brief
      diarrhea. But a few strains, such as E. coli O157:H7, can cause severe stomach
      cramps, bloody diarrhea and vomiting.
  - type: paragraph
    text: You may be exposed to E. coli from contaminated water or food — especially
      raw vegetables and undercooked ground beef. Healthy adults usually recover from
      infection with E. coli O157:H7 within a week. Young children and older adults
      have a greater risk of developing a life-threatening form of kidney failure.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Signs and symptoms of E. coli O157:H7 infection usually begin three or
      four days after exposure to the bacteria. But you may become ill as soon as
      one day after exposure to more than a week later. Signs and symptoms include:'
  - type: list
    ordered: false
    items:
    - Diarrhea, which may range from mild and watery to severe and bloody
    - Stomach cramping, pain or tenderness
    - Nausea and vomiting, in some people
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Contact your doctor if your diarrhea is persistent, severe or bloody.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Only a few strains of E. coli trigger diarrhea. The E. coli O157:H7 strain
      belongs to a group of E. coli that produces a powerful toxin that damages the
      lining of the small intestine. This can cause bloody diarrhea. You develop an
      E. coli infection when you ingest this strain of bacteria.
  - type: paragraph
    text: Unlike many other disease-causing bacteria, E. coli can cause an infection
      even if you ingest only small amounts. Because of this, you can be sickened
      by E. coli from eating a slightly undercooked hamburger or from swallowing a
      mouthful of contaminated pool water.
  - type: paragraph
    text: Potential sources of exposure include contaminated food or water and person-to-person
      contact.
  subsections:
  - heading: Contaminated food
    level: 3
    content:
    - type: paragraph
      text: 'The most common way to get an E. coli infection is by eating contaminated
        food, such as:'
    - type: list
      ordered: false
      items:
      - Ground beef. When cattle are slaughtered and processed, E. coli bacteria in
        their intestines can get on the meat. Ground beef combines meat from many
        different animals, increasing the risk of contamination.
      - Unpasteurized milk. E. coli bacteria on a cow's udder or on milking equipment
        can get into raw milk.
      - Fresh produce. Runoff from cattle farms can contaminate fields where fresh
        produce is grown. Certain vegetables, such as spinach and lettuce, are particularly
        vulnerable to this type of contamination.
    subsections: []
  - heading: Contaminated water
    level: 3
    content:
    - type: paragraph
      text: Human and animal stool may pollute ground and surface water, including
        streams, rivers, lakes and water used to irrigate crops. Although public water
        systems use chlorine, ultraviolet light or ozone to kill E. coli , some E.
        coli outbreaks have been linked to contaminated municipal water supplies.
    - type: paragraph
      text: Private water wells are a greater cause for concern because many don't
        have a way to disinfect water. Rural water supplies are the most likely to
        be contaminated. Some people also have been infected with E. coli after swimming
        in pools or lakes contaminated with stool.
    subsections: []
  - heading: Personal contact
    level: 3
    content:
    - type: paragraph
      text: E. coli bacteria can easily travel from person to person, especially when
        infected adults and children don't wash their hands properly. Family members
        of young children with E. coli infection are especially likely to get it themselves.
        Outbreaks have also occurred among children visiting petting zoos and in animal
        barns at county fairs.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'E. coli can affect anyone who is exposed to the bacteria. But some people
      are more likely to develop problems than are others. Risk factors include:'
  - type: list
    ordered: false
    items:
    - Age. Young children and older adults are at higher risk of experiencing illness
      caused by E. coli and more-serious complications from the infection.
    - Weakened immune systems. People who have weakened immune systems — from AIDS
      or from drugs to treat cancer or prevent the rejection of organ transplants
      — are more likely to become ill from ingesting E. coli .
    - Eating certain types of food. Riskier foods include undercooked hamburger; unpasteurized
      milk, apple juice or cider; and soft cheeses made from raw milk.
    - Time of year. Though it's not clear why, the majority of E. coli infections
      in the U.S. occur from June through September.
    - Decreased stomach acid levels. Stomach acid offers some protection against E.
      coli . If you take medications to reduce stomach acid, such as esomeprazole
      (Nexium), pantoprazole (Protonix), lansoprazole (Prevacid) and omeprazole (Prilosec),
      you may increase your risk of an E. coli infection.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Most healthy adults recover from E. coli illness within a week. Some people
      — particularly young children and older adults — may develop a life-threatening
      form of kidney failure called hemolytic uremic syndrome.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: No vaccine or medication can protect you from E. coli -based illness, though
      researchers are investigating potential vaccines. To reduce your chance of being
      exposed to E. coli , avoid swallowing water from lakes or pools, wash your hands
      often, avoid risky foods, and watch out for cross-contamination.
  subsections:
  - heading: Risky foods
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Cook hamburgers until they're 160 F (71 C). Hamburgers should be well-done,
        with no pink showing. But color isn't a good guide to know if the meat is
        done cooking. Meat — especially if grilled — can brown before it's completely
        cooked. Use a meat thermometer to ensure that meat is heated to at least 160
        F (71 C) at its thickest point.
      - Drink pasteurized milk, juice and cider. Any boxed or bottled juice kept at
        room temperature is likely to be pasteurized, even if the label doesn't say
        so. Avoid any unpasteurized dairy products or juice.
      - Wash raw produce thoroughly. Washing produce may not get rid of all E. coli
        — especially in leafy greens, which provide many places for the bacteria to
        attach themselves to. Careful rinsing can remove dirt and reduce the amount
        of bacteria that may be clinging to the produce.
    subsections: []
  - heading: Avoid cross-contamination
    level: 3
    content:
    - type: list
      ordered: false
      items:
      - Wash utensils. Use hot soapy water on knives, countertops and cutting boards
        before and after they come into contact with fresh produce or raw meat.
      - Keep raw foods separate. This includes using separate cutting boards for raw
        meat and foods, such as vegetables and fruits. Never put cooked hamburgers
        on the same plate you used for raw patties.
      - Wash your hands. Wash your hands after preparing or eating food, using the
        bathroom, or changing diapers. Make sure that children also wash their hands
        before eating, after using the bathroom and after contact with animals.
    subsections: []
