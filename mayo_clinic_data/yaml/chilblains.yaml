title: Chilblains
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Chilblains (CHILL-blayns) is a condition that causes inflamed swollen patches
      and blistering on the hands and feet. It's caused by exposure to damp air that's
      cold but not freezing. Symptoms may show up a few hours after being in the cold.
  - type: paragraph
    text: Chilblains can be prevented by limiting your time in the cold, dressing
      warmly and covering exposed skin. If you do get chilblains, keeping the skin
      warm and dry can help ease the symptoms.
  - type: paragraph
    text: Chilblains, also known as perniosis, usually clears up in 2 or 3 weeks,
      especially if the weather gets warmer. You may get the symptoms each cold season
      for years.
  - type: paragraph
    text: The condition doesn't usually result in permanent injury.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of chilblains include:'
  - type: list
    ordered: false
    items:
    - Small, itchy areas on your skin, often on your feet or hands.
    - Sores or blistering.
    - Swelling.
    - Pain or stinging.
    - Changes in skin color.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'Seek medical care for chilblains if you:'
    - type: list
      ordered: false
      items:
      - Have symptoms that are long lasting or go away then flare.
      - Think you might have an infection.
      - Have symptoms that aren't improving after two weeks of home care.
      - Have symptoms that extend into the warm season.
      - Aren't sure whether you were in below-freezing temperatures, as you might
        have frostbite.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The exact cause of chilblains is unknown. They may be an unusual reaction
      of your body to cold followed by rewarming. Rewarming of cold skin can cause
      small blood vessels under the skin to expand more quickly than nearby larger
      blood vessels can handle.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'The following factors increase the risk of chilblains:'
  - type: list
    ordered: false
    items:
    - Wearing clothing and shoes that are tight or expose skin to the cold. Wearing
      tightfitting clothing and shoes in cold, damp weather may make you more susceptible
      to chilblains.
    - Being a young woman. This condition is most common in females between the ages
      of 15 and 30.
    - Being underweight. This condition is most common in people with a low body mass.
    - Living in cold, humid areas. Your risk of chilblains is higher if you live in
      an area with high humidity and cold but not freezing temperatures.
    - Having certain medical conditions. These include Raynaud's phenomenon, connective
      tissue disease and SARS-CoV-2.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Chilblains symptoms that are long-lasting and develop after repeated exposure
      to cold and damp conditions can cause scarring and thin skin.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'To prevent chilblains:'
  - type: list
    ordered: false
    items:
    - Avoid or limit your exposure to the cold.
    - When you come in from the cold, rewarm the skin gradually.
    - Dress in layers of loose clothing and wear mittens, a scarf and a hat, and warm,
      water-resistant footwear.
    - Cover all exposed skin as completely as possible when going outside in cold
      weather.
    - Keep your hands, feet and face dry and warm.
    - Keep your home and workplace comfortably warm.
    - Don't smoke.
  subsections: []
