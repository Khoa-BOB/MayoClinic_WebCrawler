title: Atrial septal defect (ASD)
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: An atrial septal defect (ASD) is a heart condition that you're born with.
      That means it's a congenital heart defect. People with an ASD have a hole between
      the upper heart chambers. The hole increases the amount of blood going through
      the lungs.
  - type: paragraph
    text: Small atrial septal defects might be found by chance and never cause a concern.
      Others might close during infancy or early childhood.
  - type: paragraph
    text: A large, long-term atrial septal defect can damage the heart and lungs.
      Surgery may be needed to repair an atrial septal defect and to prevent complications.
  subsections:
  - heading: Types
    level: 3
    content:
    - type: paragraph
      text: 'Types of atrial septal defects (ASDs) include:'
    - type: list
      ordered: false
      items:
      - Secundum. This is the most common type of ASD . It occurs in the middle of
        the wall between the upper heart chambers. This wall is called the atrial
        septum.
      - Primum. This type of ASD affects the lower part of the wall between the upper
        heart chambers. It might occur with other heart problems present at birth.
      - Sinus venosus. This is a rare type of ASD . It most often happens in the upper
        part of the wall between the heart chambers. It often occurs with other heart
        structure changes present at birth.
      - Coronary sinus. The coronary sinus is part of the vein system of the heart.
        In this rare type of ASD , part of the wall between the coronary sinus and
        the left upper heart chamber is missing.
    subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: A baby born with an atrial septal defect (ASD) may not have symptoms. Symptoms
      may begin in adulthood.
  - type: paragraph
    text: 'Atrial septal defect symptoms may include:'
  - type: list
    ordered: false
    items:
    - Shortness of breath, especially when exercising.
    - Tiredness, especially with activity.
    - Swelling of the legs, feet or belly area.
    - Irregular heartbeats, also called arrhythmias.
    - Skipped heartbeats or feelings of a quick, pounding or fluttering heartbeat,
      called palpitations.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Serious congenital heart defects are often diagnosed before or soon after
        a child is born.
    - type: paragraph
      text: Get immediate emergency help if a child has trouble breathing.
    - type: paragraph
      text: 'Call a healthcare professional if these symptoms occur:'
    - type: list
      ordered: false
      items:
      - Shortness of breath, especially during exercise or activity.
      - Easy tiring, especially after activity.
      - Swelling of the legs, feet or belly area.
      - Skipped heartbeats or feelings of a quick, pounding heartbeat.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The cause of atrial septal defect is not clear. The problem affects the
      structure of the heart. It happens as the baby's heart is forming during pregnancy.
  - type: paragraph
    text: 'The following may play a role in the cause of congenital heart defects
      such as atrial septal defect:'
  - type: list
    ordered: false
    items:
    - Changes in genes.
    - Some medical conditions.
    - Certain medicines.
    - Smoking.
    - Alcohol misuse.
  subsections:
  - heading: How the heart works
    level: 3
    content:
    - type: paragraph
      text: To understand the cause of atrial septal defect, it may be helpful to
        know how the heart typically works.
    - type: paragraph
      text: The typical heart is made of four chambers. The two upper chambers are
        called the atria. The two lower chambers are called the ventricles.
    - type: paragraph
      text: The right side of the heart moves blood to the lungs. In the lungs, blood
        picks up oxygen and then returns it to the heart's left side. The left side
        of the heart then pumps the blood through the body's main artery, called the
        aorta. The blood then goes out to the rest of the body.
    - type: paragraph
      text: A large atrial septal defect can send extra blood to the lungs and cause
        the right side of the heart to work too hard. Without treatment, the right
        side of the heart grows larger over time and becomes weak. The blood pressure
        in the arteries in the lungs also can increase, causing pulmonary hypertension.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Atrial septal defect (ASD) occurs as the baby''s heart is forming during
      pregnancy. It is a congenital heart defect. Things that may increase a baby''s
      risk of atrial septal defect or other heart problems present at birth include:'
  - type: list
    ordered: false
    items:
    - German measles, also called rubella, during the first few months of pregnancy.
    - Diabetes.
    - Lupus.
    - Alcohol or tobacco use during pregnancy.
    - Cocaine use during pregnancy.
    - Use of some medicines during pregnancy, including those to treat seizures and
      mood conditions.
  - type: paragraph
    text: Some types of congenital heart defects occur in families. This means they
      are inherited. Tell your care team if you or someone in your family had a heart
      problem present at birth. Screening by a genetic counselor can help show the
      risk of certain heart defects in future children.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: A small atrial septal defect might never cause any concern. Small atrial
      septal defects often close during infancy.
  - type: paragraph
    text: 'Larger atrial septal defects can cause serious complications, including:'
  - type: list
    ordered: false
    items:
    - Right-sided heart failure.
    - Irregular heartbeats, called arrhythmias.
    - Stroke.
    - Early death.
    - High blood pressure in the lung arteries, called pulmonary hypertension.
  - type: paragraph
    text: Pulmonary hypertension can cause permanent lung damage. This complication,
      called Eisenmenger syndrome, most often occurs over many years. It sometimes
      happens in people with large atrial septal defects.
  - type: paragraph
    text: Treatment can prevent or help manage many of these complications.
  subsections:
  - heading: Atrial septal defect and pregnancy
    level: 3
    content:
    - type: paragraph
      text: If you have an atrial septal defect and are pregnant or thinking about
        becoming pregnant, talk to a care professional first. It's important to get
        proper prenatal care. A healthcare professional may suggest repairing the
        hole in the heart before getting pregnant. A large atrial septal defect or
        its complications can lead to a high-risk pregnancy.
    subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: Because the cause of atrial septal defect (ASD) is not clear, prevention
      may not be possible. But getting good prenatal care is important. If you were
      born with an ASD , make an appointment for a health checkup before becoming
      pregnant.
  - type: paragraph
    text: 'During this visit:'
  - type: list
    ordered: false
    items:
    - Talk about current health conditions and medicines. It's important to closely
      control diabetes, lupus and other health conditions during pregnancy. Your healthcare
      professional may suggest changing doses of some medicines or stopping them before
      pregnancy.
    - Review your family medical history. If you have a family history of congenital
      heart defects or other genetic conditions, you might talk with a genetic counselor
      to find your risks.
    - Ask about getting tested to see if you've had German measles, also called rubella.
      Rubella in a pregnant person has been linked to some types of congenital heart
      defects in the baby. If you haven't already had German measles or the vaccine,
      get the recommended vaccinations.
  subsections: []
