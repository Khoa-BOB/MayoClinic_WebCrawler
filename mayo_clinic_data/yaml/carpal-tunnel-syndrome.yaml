  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'There are no proven strategies to prevent carpal tunnel syndrome, but you
      can lessen stress on the hands and wrists with these methods:'
  - type: list
    ordered: false
    items:
    - Reduce your force and relax your grip. If your work involves a cash register
      or keyboard, for instance, hit the keys softly.
    - Take short, frequent breaks. Gently stretch and bend your hands and wrists periodically.
      Alternate tasks when possible. This is especially important if you use equipment
      that vibrates or that requires you to exert a great amount of force. Taking
      a break for even a few minutes each hour can make a difference.
    - Watch your form. Do not bend your wrist all the way up or down when using a
      keyboard. A relaxed middle position with the wrists parallel to the floor is
      best. Keep your keyboard at elbow height or slightly lower.
    - Improve your posture. The wrong posture can occur when you adjust your body
      to view a computer screen rather than adjusting the screen height and distance
      to a correct posture. The wrong posture rolls shoulders forward, shortens the
      neck and shoulder muscles, and compresses nerves in the neck. This can cause
      neck pain and also may bother the hands and arms.
    - Change your computer mouse. Make sure that your computer mouse is comfortable
      to use and doesn't strain your wrist.
    - Keep your hands warm. You're more likely to develop hand pain and stiffness
      if you work in a cold environment. If you can't control the temperature at work,
      put on fingerless gloves that keep the hands and wrists warm.
  subsections: []
