title: Carpal tunnel syndrome
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Carpal tunnel syndrome is one of the most common hand conditions. It is
      caused by pressure on the median nerve in the carpal tunnel of the wrist. The
      carpal tunnel is a narrow passageway surrounded by bones and ligaments on the
      palm side of the hand. When the median nerve is compressed, symptoms can include
      numbness, tingling and weakness in the thumb and fingers.
  - type: paragraph
    text: Wrist anatomy, health conditions and possibly repetitive hand motions can
      contribute to carpal tunnel syndrome.
  - type: paragraph
    text: Proper treatment usually relieves the tingling and numbness and restores
      hand function.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of carpal tunnel syndrome usually start gradually and include:'
  - type: list
    ordered: false
    items:
    - Tingling and numbness. Tingling and numbness may occur in the fingers or hand.
      Usually the thumb, index, middle and ring fingers are affected, but not the
      little finger. You might have a feeling like an electric shock in these fingers.
      These symptoms often occur while holding a steering wheel, phone or newspaper,
      or they may wake you from sleep. The sensation also can travel from the wrist
      up the arm. Many people "shake out" their hands to try to relieve their symptoms.
      The numb feeling may become constant over time.
    - Weakness. People with carpal tunnel syndrome may experience weakness in the
      hand and drop objects. This may be due to numbness or to weakness of the thumb's
      pinching muscles, which also are controlled by the median nerve.
  - type: paragraph
    text: Tingling and numbness. Tingling and numbness may occur in the fingers or
      hand. Usually the thumb, index, middle and ring fingers are affected, but not
      the little finger. You might have a feeling like an electric shock in these
      fingers. These symptoms often occur while holding a steering wheel, phone or
      newspaper, or they may wake you from sleep.
  - type: paragraph
    text: The sensation also can travel from the wrist up the arm.
  - type: paragraph
    text: Many people "shake out" their hands to try to relieve their symptoms. The
      numb feeling may become constant over time.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See your healthcare professional if you have symptoms of carpal tunnel
        syndrome that interfere with your usual activities and sleep patterns. Permanent
        nerve and muscle damage can occur without treatment.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Carpal tunnel syndrome is caused by pressure on the median nerve.
  - type: paragraph
    text: The median nerve runs from the forearm through a passageway in the wrist
      to the hand, known as the carpal tunnel. The median nerve provides sensation
      to the palm side of the thumb and all of the fingers except the little finger.
      This nerve also provides signals to move the muscles around the base of the
      thumb. This movement is known as motor function.
  - type: paragraph
    text: Anything that squeezes or irritates the median nerve in the carpal tunnel
      space may lead to carpal tunnel syndrome. A wrist fracture can narrow the carpal
      tunnel and irritate the nerve. This also may occur due to swelling and inflammation
      caused by rheumatoid arthritis or other diseases.
  - type: paragraph
    text: Many times, there is no single cause of carpal tunnel syndrome. Or the cause
      may not be known. It may be that a combination of risk factors contributes to
      the development of the condition.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Several factors have been linked with carpal tunnel syndrome. Although
      they may not directly cause carpal tunnel syndrome, they may increase the risk
      of irritation or damage to the median nerve. These include:'
  - type: list
    ordered: false
    items:
    - Anatomical factors. A wrist fracture or dislocation can alter the space within
      the carpal tunnel. Arthritis that causes changes to the small bones in the wrist
      can affect the carpal tunnel. These changes can put pressure on the median nerve.
      People who have smaller carpal tunnels may be more likely to have carpal tunnel
      syndrome.
    - Sex assigned at birth. Carpal tunnel syndrome is generally more common in women.
      This may be because the carpal tunnel area is relatively smaller in women than
      in men. Or it may be due to the effect of hormones on the lining of the tendons
      in the carpal tunnel. Women who have carpal tunnel syndrome also may have smaller
      carpal tunnels than do women who don't have the condition.
    - Nerve-damaging conditions. Some chronic illnesses, such as diabetes, increase
      the risk of nerve damage, including damage to the median nerve.
    - Inflammatory conditions. Rheumatoid arthritis, gout and other conditions that
      cause swelling, known as inflammation, can affect the lining around the tendons
      in the wrist. This can put pressure on the median nerve.
    - Medicines. Some studies have shown a link between carpal tunnel syndrome and
      anastrozole (Arimidex), a medicine used to treat breast cancer.
    - Obesity. Being obese is a risk factor for carpal tunnel syndrome.
    - Body fluid changes. Fluid retention may increase the pressure within the carpal
      tunnel, irritating the median nerve. This is common during pregnancy and menopause.
      Carpal tunnel syndrome that happens with pregnancy generally gets better on
      its own after pregnancy.
    - Other medical conditions. Certain conditions, such as thyroid disorders, kidney
      failure and lymphedema, may increase the chances of getting carpal tunnel syndrome.
    - Workplace factors. Working with vibrating tools or on an assembly line that
      requires repeated movements that flex the wrist may create pressure on the median
      nerve. Such work also may worsen existing nerve damage. Pressure on the nerve
      can be worse if the work is done in a cold environment. However, the scientific
      evidence is conflicting and these factors haven't been established as direct
      causes of carpal tunnel syndrome. Several studies have evaluated whether there
      is a link between computer use and carpal tunnel syndrome. Some evidence suggests
      that mouse use, but not the use of a keyboard, may be related to carpal tunnel
      syndrome. There has not been enough quality and consistent evidence to support
      extensive computer use as a risk factor for carpal tunnel syndrome. However,
      computer use may cause a different form of hand pain.
  - type: paragraph
    text: Anatomical factors. A wrist fracture or dislocation can alter the space
      within the carpal tunnel. Arthritis that causes changes to the small bones in
      the wrist can affect the carpal tunnel. These changes can put pressure on the
      median nerve.
  - type: paragraph
    text: People who have smaller carpal tunnels may be more likely to have carpal
      tunnel syndrome.
  - type: paragraph
