title: Hammertoe and mallet toe
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Hammertoe and mallet toe are foot conditions that cause a bend that is not
      usual in a toe or toes. Wearing shoes that don't fit well can cause hammertoe
      and mallet toe. Other causes are foot injury and certain illnesses, such as
      diabetes. Often the cause isn't known.
  - type: paragraph
    text: A hammertoe has a bend in the middle joint of the toe. A mallet toe has
      a bend in the joint nearest the toenail. Hammertoe and mallet toe usually occur
      in the second, third or fourth toes.
  - type: paragraph
    text: Changing footwear, wearing shoe inserts and using other devices might relieve
      the pain and pressure of hammertoe and mallet toe. If these treatments don't
      work, surgery can correct the condition and relieve the pressure.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Hammertoe and mallet toe have a bend that is not usual in the joints of
      one or more of the toes. Other symptoms include:'
  - type: list
    ordered: false
    items:
    - Pain from wearing shoes.
    - Trouble moving the affected toe.
    - Toe stiffness.
    - A change in skin color and swelling.
    - Growth of corns and calluses from the affected toe rubbing against shoes or
      against the ground.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See a healthcare professional if you have lasting foot pain that affects
        your ability to walk.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Hammertoe and mallet toe have been linked to:'
  - type: list
    ordered: false
    items:
    - Certain shoes. High-heeled shoes or footwear that's too tight in the toe can
      crowd toes so they can't lie flat. In time, the toe might remain curled even
      when not in shoes.
    - Injury. A toe that has been stubbed, jammed or broken might be more likely to
      develop hammertoe or mallet toe.
    - Toe muscles that are out of balance. If the muscles aren't balanced, they can
      put pressure on the tendons and joints. This change in balance can lead to hammertoe
      and mallet toe over time.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that can increase the risk of hammertoe and mallet toe include:'
  - type: list
    ordered: false
    items:
    - Sex assigned a birth. Women are more likely to develop hammertoe or mallet toe
      than are men.
    - Certain diseases. Arthritis and diabetes can increase the risk of having foot
      problems. Genes also might play a role.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: For a while, you still might be able to straighten the toe. But over time,
      the tendons and joints of a hammertoe or mallet toe might tighten. This can
      cause the toe to stay bent.
  - type: paragraph
    text: Shoes can rub against the higher part of the bent toe. The bent position
      also may lead to excess pressure on the toe bones. This can cause painful corns
      or calluses.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'Shoes that fit well can prevent many foot, heel and ankle problems. Here''s
      what to look for when buying shoes:'
  - type: list
    ordered: false
    items:
    - Enough toe room. Avoid shoes with pointed toes.
    - Low heels. Not wearing high heels can help prevent toe and back problems.
    - Shoes that adjust. Shoes with laces or straps are roomier and easier to make
      comfortable feeling.
  - type: paragraph
    text: 'These added tips can help you buy the right shoes:'
  - type: list
    ordered: false
    items:
    - Shop at the end of the day. Feet swell as the day goes on.
    - Check size. Shoe size — especially the width — can change with age. Measure
      both feet and buy for the larger foot.
    - Buy shoes that fit right away. Be sure shoes are comfortable before you buy
      them. A shoe repair store might be able to stretch shoes in tight spots, but
      it's better to buy them to fit.
  subsections: []
