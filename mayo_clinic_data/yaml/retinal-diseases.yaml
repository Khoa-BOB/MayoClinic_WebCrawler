title: Retinal diseases
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Retinal diseases vary widely, but most of them cause visual symptoms. Retinal
      diseases can affect any part of your retina, a thin layer of tissue on the inside
      back wall of the eye.
  - type: paragraph
    text: The retina contains millions of light-sensitive cells, called rods and cones,
      and other nerve cells that receive and organize visual information. The retina
      sends this information to the brain through the optic nerve, enabling you to
      see.
  - type: paragraph
    text: Treatment is available for some retinal diseases. Depending on your condition,
      treatment goals may be to stop or slow the disease. This may help preserve,
      improve or restore your vision. Untreated, some retinal diseases can cause severe
      vision loss or blindness.
  subsections:
  - heading: Types
    level: 3
    content:
    - type: paragraph
      text: 'Common retinal diseases and conditions include:'
    - type: list
      ordered: false
      items:
      - Retinal tear. A retinal tear occurs when the clear, gel-like substance in
        the center of your eye, called vitreous, shrinks and tugs on the thin layer
        of tissue lining the back of your eye, called the retina. This can cause a
        tear in the retinal tissue. It's often accompanied by the sudden onset of
        symptoms such as floaters and flashing lights.
      - Retinal detachment. A retinal detachment is defined by the presence of fluid
        under the retina. This usually occurs when fluid passes through a retinal
        tear, causing the retina to lift away from the underlying tissue layers.
      - Diabetic retinopathy. If you have diabetes, the tiny blood vessels in the
        back of your eye can deteriorate and leak fluid into and under the retina.
        This causes the retina to swell, which may blur or distort your vision. Or
        you may develop new, irregular capillaries that break and bleed. This also
        worsens your vision.
      - Epiretinal membrane. Epiretinal membrane is a delicate tissue-like scar or
        membrane that looks like crinkled cellophane lying on top of the retina. This
        membrane pulls up on the retina, which distorts your vision. Objects may appear
        blurred or crooked.
      - Macular hole. A macular hole is a small defect in the center of the retina
        at the back of the eye, called the macula. The hole may develop from atypical
        traction between the retina and the vitreous, or it may follow an injury to
        the eye.
      - Macular degeneration. In macular degeneration, the center of the retina begins
        to deteriorate. This causes symptoms such as blurred central vision or a blind
        spot in the center of the visual field. There are two types — wet macular
        degeneration and dry macular degeneration. Many people will first have the
        dry form, which can progress to the wet form in one or both eyes.
      - Retinitis pigmentosa. Retinitis pigmentosa is an inherited degenerative disease.
        It slowly affects the retina and causes loss of night and side vision.
    subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Many retinal diseases share some common symptoms. These may include:'
  - type: list
    ordered: false
    items:
    - Seeing floating specks or cobwebs.
    - Blurred or distorted vision in which straight lines can look wavy.
    - Defects in the side vision.
    - Vision loss.
  - type: paragraph
    text: You may need to try looking with each eye alone to notice these changes.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: It's important to pay attention to any changes in your vision and find
        care quickly. Seek immediate medical attention if you suddenly have floaters,
        flashes or reduced vision. These are warning signs of potentially serious
        retinal disease.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk factors for retinal diseases might include:'
  - type: list
    ordered: false
    items:
    - Aging.
    - Smoking.
    - Being obese.
    - Having diabetes or other diseases.
    - Eye trauma.
    - A family history of retinal diseases.
  subsections: []
