title: Schizoid personality disorder
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Schizoid personality disorder is a condition where a person shows very little,
      if any, interest and ability to form relationships with other people. It's very
      hard for the person to express a full range of emotions.
  - type: paragraph
    text: If you have schizoid personality disorder, you may be seen as keeping to
      yourself or rejecting others. You may not be interested in or able to form close
      friendships or romantic relationships. Because you do not tend to show emotion,
      it may appear that you do not care about others or what's going on around you.
  - type: paragraph
    text: Schizoid personality disorder is less common than other personality disorders,
      but it's much more common than schizophrenia. The cause is not known. Some symptoms
      of schizoid personality disorder are similar to autism spectrum disorders, other
      personality disorders — especially avoidant personality disorder — and early
      symptoms of schizophrenia.
  - type: paragraph
    text: Talk therapy, also called psychotherapy, can help those who know they need
      to improve relationships with others. But it's common to feel unsure about change.
      Medicines are mainly used to treat mental health conditions that occur along
      with schizoid personality disorder, rather than the disorder itself.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'If you have schizoid personality disorder, it''s likely that you:'
  - type: list
    ordered: false
    items:
    - Want to be alone and do activities alone.
    - Do not want or enjoy close relationships.
    - Feel little if any desire for sexual relationships.
    - Take pleasure in few activities, if any.
    - Find it hard to express your emotions and react.
    - May lack humor or not be interested in others. Or you may be cold toward others.
    - May lack the drive that makes you want to reach goals.
    - Do not react to praise or criticism from others.
  - type: paragraph
    text: People may view you as odd or unusual.
  - type: paragraph
    text: Schizoid personality disorder most often begins when a person is a young
      adult. But some symptoms might be noticed during childhood. These symptoms may
      make it hard to do well in school, at work, in social situations or in other
      areas of life. But the person may do well if the job can be done by mostly working
      alone.
  subsections:
  - heading: Schizoid personality disorder and schizophrenia
    level: 3
    content:
    - type: paragraph
      text: Although the names may sound alike, schizoid personality disorder, schizotypal
        personality disorder and schizophrenia spectrum disorders are all different
        types of mental health conditions. But they can have similar symptoms, such
        as not being able to make social connections or show a full range of emotions.
    - type: paragraph
      text: 'In contrast to schizotypal personality disorder and schizophrenia, people
        with schizoid personality disorder:'
    - type: list
      ordered: false
      items:
      - Are in touch with reality.
      - Are not likely to feel paranoid, hold bizarre beliefs or hallucinate.
      - Make sense when speaking. Although the tone may not be lively, the content
        of the person's speech is not strange or hard to follow.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: People with schizoid personality disorder typically only seek treatment
        for a related problem, such as depression.
    - type: paragraph
      text: If someone close to you has urged you to seek help for symptoms common
        to schizoid personality disorder, make an appointment with a doctor or another
        health care professional, or a mental health professional. If you suspect
        a loved one may have schizoid personality disorder, gently suggest that the
        person seek help. You can offer to go along to the first appointment.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Personality is the blend of thoughts, emotions and behaviors that makes
      you special. It's the way you view, understand and relate to the outside world.
      It's also how you see yourself. Personality forms when you're a child. It's
      shaped through a blend of your surroundings and genes passed down from your
      parents.
  - type: paragraph
    text: Children typically learn over time to properly understand social cues and
      take action. What causes schizoid personality disorder to happen is not known.
      But a blend of your surroundings and genes passed down to you may play a role
      in developing the disorder.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that raise your risk of schizoid personality disorder include:'
  - type: list
    ordered: false
    items:
    - Having a parent or another relative who has schizoid personality disorder, schizotypal
      personality disorder or schizophrenia.
    - Having a parent who was cold, did not properly care for you and did not take
      action to help you emotionally.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'People with schizoid personality disorder are at higher risk of:'
  - type: list
    ordered: false
    items:
    - Schizotypal personality disorder or schizophrenia.
    - Other personality disorders.
    - Major depression.
    - Anxiety disorders.
  subsections: []
