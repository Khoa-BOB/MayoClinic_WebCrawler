title: Knee bursitis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Knee bursitis is a condition in which one or more small fluid-filled sacs
      near the knee joint become inflamed. The sacs are called bursae. Bursae reduce
      friction and cushion pressure points between bones and tendons, muscles and
      skin near the joints.
  - type: paragraph
    text: Any of the bursae in the knee can be affected by painful swelling, also
      called inflammation. But most often, knee bursitis happens over the kneecap
      or on the inner side of the knee below the joint.
  - type: paragraph
    text: Knee bursitis causes pain and can limit your movement. Treatment often includes
      a mix of self-care techniques and medical treatments to ease pain and inflammation.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Knee bursitis symptoms vary. They depend on which bursa is affected and
      what's causing the inflammation.
  - type: paragraph
    text: The affected portion of your knee might feel warm, tender and swollen. You
      also might feel pain when you move or when you're at rest.
  - type: paragraph
    text: A direct blow to the knee can cause symptoms to come on fast. But knee bursitis
      often stems from friction and irritation of the bursae. This can occur with
      jobs that require a lot of kneeling on hard surfaces. So, the symptoms can start
      slowly and become worse over time.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'Sometimes, the bursa that lies over the kneecap can become infected.
        Call your healthcare professional if you have:'
    - type: list
      ordered: false
      items:
      - A fever or chills along with pain and swelling in your knee.
      - Long-lasting swelling or a change in the color of the skin around the knee.
      - Trouble moving or extending your knee.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Knee bursitis can be caused by:'
  - type: list
    ordered: false
    items:
    - Frequent and ongoing pressure, such as from kneeling, especially on hard surfaces.
    - Overuse of the knee or strenuous activity.
    - A direct blow to the knee.
    - An infection of the bursa due to bacteria, which could get into the knee through
      a bruise or a cut.
    - Medical problems that can happen with osteoarthritis, rheumatoid arthritis or
      gout in the knee.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that can raise the risk of getting knee bursitis include:'
  - type: list
    ordered: false
    items:
    - Prolonged kneeling. The risk of bursitis is higher for people who work on their
      knees for long amounts of time. This includes carpet layers, plumbers and gardeners.
    - Playing certain sports. Sports that can lead to direct blows or frequent falls
      on the knee raise your risk of knee bursitis. So do sports that create friction
      between the knee and a mat. These sports include wrestling, football, basketball
      and volleyball. Runners also can get pain and inflammation in the bursa that's
      located on the inner side of the knee below the joint. This is called pes anserine
      bursitis.
    - Obesity and osteoarthritis. Pes anserine bursitis often occurs in obese women
      with osteoarthritis.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'The following tips can help you prevent bursitis or keep it from coming
      back:'
  - type: list
    ordered: false
    items:
    - Wear kneepads. This can help if you often work on your knees or play sports
      that put your knees at risk. Use padding to cushion and protect your knees.
    - Take breaks. If you're on your knees for a while, take regular breaks to stretch
      your legs and rest your knees.
    - Reach and stay at a healthy weight. This can help take pressure off the knee
      joints.
  subsections: []
