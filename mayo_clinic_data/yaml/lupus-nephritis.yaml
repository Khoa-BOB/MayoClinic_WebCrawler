title: Lupus nephritis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Lupus nephritis is a problem that occurs often in people who have systemic
      lupus erythematosus, also called lupus.
  - type: paragraph
    text: Lupus is a disease in which the body's immune system attacks its own cells
      and organs, called autoimmune disease. Lupus causes the immune system to make
      proteins called autoantibodies. These proteins attack tissues and organs in
      the body, including the kidneys.
  - type: paragraph
    text: Lupus nephritis occurs when lupus autoantibodies affect parts of the kidneys
      that filter out waste. This causes swelling and irritation of the kidneys, called
      inflammation. It might lead to blood in the urine, protein in the urine, high
      blood pressure, kidneys that don't work well or even kidney failure.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Signs and symptoms of lupus nephritis include:'
  - type: list
    ordered: false
    items:
    - Blood in the urine.
    - Urine that foams because of too much protein.
    - High blood pressure.
    - Swelling in the legs, ankles or feet and sometimes in the hands and face.
    - High levels of a waste product called creatinine in the blood.
  subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: As many as half of adults with systemic lupus get lupus nephritis. Systemic
      lupus causes the body's immune system to damage the kidneys. Then the kidneys
      can't filter out waste as they should.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'The only known risk factors for lupus nephritis are:'
  - type: list
    ordered: false
    items:
    - Being male. Women are more likely to get lupus, but men get lupus nephritis
      more than women do.
    - Race or ethnicity. Black people, Hispanic people and Asian Americans are more
      likely to have lupus nephritis than are whites.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Lupus nephritis can cause:'
  - type: list
    ordered: false
    items:
    - Hypertension.
    - Kidney failure.
    - A higher risk of getting cancer, especially one that starts in the cells of
      the immune system, called B-cell lymphoma.
    - A higher risk of heart and blood vessel problems.
  subsections: []
