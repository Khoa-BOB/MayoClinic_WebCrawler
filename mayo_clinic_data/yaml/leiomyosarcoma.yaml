title: Leiomyosarcoma
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Leiomyosarcoma is a rare cancer that begins in smooth muscle tissue. Many
      areas of the body have smooth muscle tissue. Areas with smooth muscle tissue
      include the digestive system, urinary system, blood vessels and uterus.
  - type: paragraph
    text: Leiomyosarcoma most often starts in the smooth muscle tissue in the uterus,
      belly or leg. It starts as a growth of cells. It often grows quickly and can
      move to other parts of the body.
  - type: paragraph
    text: Symptoms of leiomyosarcoma depend on where the cancer starts. There may
      be no symptoms early in the condition.
  - type: paragraph
    text: Leiomyosarcoma is a type of soft tissue sarcoma. Soft tissue sarcoma is
      a broad group of cancers that begin in the connective tissues. Connective tissues
      connect, support and surround other body structures.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Leiomyosarcoma might not cause signs or symptoms at first. As the cancer
      grows, symptoms may include:'
  - type: list
    ordered: false
    items:
    - Pain.
    - Weight loss.
    - Nausea and vomiting.
    - A lump or swelling under the skin.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with a doctor or other healthcare professional if
        you have symptoms that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: It's not clear what causes leiomyosarcoma. This cancer starts when something
      changes the cells in the smooth muscles. Many areas of the body have smooth
      muscle tissue. These include the digestive system, urinary system, blood vessels
      and uterus.
  - type: paragraph
    text: Leiomyosarcoma happens when smooth muscle cells develop changes in their
      DNA. A cell's DNA holds the instructions that tell the cell what to do. In healthy
      cells, the DNA tells the cells to grow and multiply at a set rate. The DNA also
      tells the cells to die at a set time.
  - type: paragraph
    text: In cancer cells, the DNA changes give other instructions. The changes tell
      the cancer cells to grow and multiply at a fast rate. Cancer cells can keep
      living when healthy cells would die. This causes too many cells.
  - type: paragraph
    text: The cancer cells might form a mass called a tumor. The tumor can grow to
      invade and destroy healthy body tissue. In time, cancer cells can break away
      and spread to other parts of the body. When cancer spreads, it's called metastatic
      cancer.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk factors for leiomyosarcoma include:'
  - type: list
    ordered: false
    items:
    - Being an adult. Leiomyosarcoma can happen at any age. But it is most common
      in adults. It's rare in children.
    - Having certain genetic conditions. People with certain genetic conditions may
      have a higher risk of leiomyosarcoma. These conditions include hereditary retinoblastoma
      and Li-Fraumeni syndrome.
  - type: paragraph
    text: Healthcare professionals haven't found a way to prevent leiomyosarcoma.
  subsections: []
