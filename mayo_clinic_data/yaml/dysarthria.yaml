title: Dysarthria
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Dysarthria happens when the muscles used for speech are weak or are hard
      to control. Dysarthria often causes slurred or slow speech that can be difficult
      to understand.
  - type: paragraph
    text: Common causes of dysarthria include conditions that affect the nervous system
      or that cause facial paralysis. These conditions may cause tongue or throat
      muscle weakness. Certain medicines also can cause dysarthria.
  - type: paragraph
    text: Treating the underlying cause of dysarthria may improve your speech. You
      also may need speech therapy. For dysarthria caused by prescription medicines,
      changing or stopping the medicines may help.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Symptoms of dysarthria depend on the underlying cause and the type of dysarthria.
  - type: paragraph
    text: 'Symptoms may include:'
  - type: list
    ordered: false
    items:
    - Slurred speech.
    - Slow speech.
    - Not being able to speak louder than a whisper or speaking too loudly.
    - Rapid speech that is difficult to understand.
    - Nasal, raspy or strained voice.
    - Uneven speech rhythm.
    - Uneven speech volume.
    - Monotone speech.
    - Trouble moving your tongue or facial muscles.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Dysarthria can be a sign of a serious condition. See a healthcare professional
        right away if you have sudden or unexplained changes in your ability to speak.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Dysarthria can be caused by conditions that make it hard to move the muscles
      in the mouth, face or upper respiratory system. These muscles control speech.
  - type: paragraph
    text: 'Conditions that may lead to dysarthria include:'
  - type: list
    ordered: false
    items:
    - Amyotrophic lateral sclerosis, also known as ALS or Lou Gehrig's disease.
    - Brain injury.
    - Brain tumor.
    - Cerebral palsy.
    - Guillain-Barre syndrome.
    - Head injury.
    - Huntington's disease.
    - Lyme disease.
    - Multiple sclerosis.
    - Muscular dystrophy.
    - Myasthenia gravis.
    - Parkinson's disease.
    - Stroke.
    - Wilson's disease.
  - type: paragraph
    text: Some medicines also can cause dysarthria. These may include certain sedatives
      and seizure medicines.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Dysarthria risk factors include having a neurological condition that affects
      the muscles that control speech.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Complications of dysarthria may come from having trouble with communication.
      Complications may include:'
  - type: list
    ordered: false
    items:
    - Trouble socializing. Communication problems may affect your relationships with
      family and friends. These problems also may make social situations challenging.
    - Depression. In some people, dysarthria may lead to social isolation and depression.
  subsections: []
