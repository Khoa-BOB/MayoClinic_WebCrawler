title: Chronic myelogenous leukemia
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Chronic myelogenous leukemia, also called CML , is an uncommon type of cancer
      of the bone marrow. Bone marrow is the spongy tissue inside bones where blood
      cells are made. CML causes an increased number of white blood cells in the blood.
  - type: paragraph
    text: The term "chronic" in chronic myelogenous leukemia means this cancer tends
      to progress more slowly than severe forms of leukemia. The term "myelogenous"
      (my-uh-LOHJ-uh-nus) refers to the type of cells affected by this cancer.
  - type: paragraph
    text: Chronic myelogenous leukemia also can be called chronic myeloid leukemia
      and chronic granulocytic leukemia. It typically affects older adults and rarely
      occurs in children, though it can occur at any age.
  - type: paragraph
    text: Advances in treatment have improved the prognosis of people with chronic
      myelogenous leukemia. Most people can achieve remission and live for many years
      after diagnosis.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Chronic myelogenous leukemia often doesn't cause symptoms. It might be detected
      during a blood test.
  - type: paragraph
    text: 'When they occur, symptoms may include:'
  - type: list
    ordered: false
    items:
    - Bone pain.
    - Bleeding easily.
    - Feeling full after eating a small amount of food.
    - Fatigue.
    - Fever.
    - Weight loss without trying.
    - Loss of appetite.
    - Pain or fullness below the ribs on the left side.
    - Excessive sweating during sleep.
    - Blurry vision caused by bleeding in the back of the eye.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with your health care provider if you have any persistent
        symptoms that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Chronic myelogenous leukemia happens when something causes changes to the
      bone marrow cells. It's not clear what starts this process. However, doctors
      have discovered how it progresses into chronic myelogenous leukemia.
  subsections:
  - heading: A new chromosome develops
    level: 3
    content:
    - type: paragraph
      text: Human cells typically have 23 pairs of chromosomes. These chromosomes
        hold the DNA that contains the instructions that tell the cells what to do.
        In people with chronic myelogenous leukemia, the chromosomes in the blood
        cells swap sections with each other. A section of chromosome 9 switches places
        with a section of chromosome 22. This creates an extra-short chromosome 22
        and an extra-long chromosome 9.
    - type: paragraph
      text: The extra-short chromosome 22 is called the Philadelphia chromosome. It
        is named for the city where it was discovered. The Philadelphia chromosome
        is present in the blood cells of 90% of people with chronic myelogenous leukemia.
    subsections: []
  - heading: The Philadelphia chromosome creates a new gene
    level: 3
    content:
    - type: paragraph
      text: Genes from chromosome 9 combine with genes from chromosome 22 to create
        a new gene called BCR-ABL. The BCR-ABL gene tells the blood cells to produce
        too much of a protein called tyrosine kinase. Tyrosine kinase promotes cancer
        by allowing certain blood cells to grow out of control.
    subsections: []
  - heading: The new gene allows too many diseased blood cells
    level: 3
    content:
    - type: paragraph
      text: Blood cells begin growing in the bone marrow. When the bone marrow functions
        correctly, it produces immature cells, called blood stem cells, in a controlled
        way. These cells then mature and specialize into the red cells, white cells
        and platelets that circulate in the blood.
    - type: paragraph
      text: In chronic myelogenous leukemia, this process doesn't work properly. The
        tyrosine kinase allows too many white blood cells to grow. Most or all of
        these cells contain the Philadelphia chromosome. The diseased white blood
        cells don't grow and die like they should. The diseased white blood cells
        build up in huge numbers. They crowd out healthy blood cells and damage the
        bone marrow.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that increase the risk of chronic myelogenous leukemia include:'
  - type: list
    ordered: false
    items:
    - Older age . CML is more common in older people than in children and teens.
    - Being male . Men are slightly more at risk of developing CML than are women.
    - Radiation exposure . Radiation therapy for certain types of cancer has been
      linked to CML .
  - type: paragraph
    text: There's no way to prevent chronic myelogenous leukemia. If you get it, there's
      nothing you could have done to prevent it.
  subsections:
  - heading: Family history is not a risk factor
    level: 3
    content:
    - type: paragraph
      text: The gene change that leads to chronic myelogenous leukemia isn't passed
        from parents to children. This change is believed to develop after birth.
    subsections: []
