title: Hydrocephalus
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Hydrocephalus is the buildup of fluid in cavities called ventricles deep
      within the brain. The excess fluid increases the size of the ventricles and
      puts pressure on the brain.
  - type: paragraph
    text: Cerebrospinal fluid usually flows through the ventricles and bathes the
      brain and spinal column. But the pressure of too much cerebrospinal fluid can
      damage brain tissues and cause a range of symptoms related to brain function.
  - type: paragraph
    text: Hydrocephalus can happen at any age, but it occurs more often among infants
      and among adults 60 and older. Surgery can restore and maintain healthy cerebrospinal
      fluid levels in the brain. Therapies can manage symptoms resulting from hydrocephalus.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: The symptoms of hydrocephalus can vary by age.
  subsections:
  - heading: Infants
    level: 3
    content:
    - type: paragraph
      text: 'Common symptoms of hydrocephalus in infants include:'
    subsections:
    - heading: Changes in the head
      level: 4
      content:
      - type: list
        ordered: false
        items:
        - A head that is larger than usual.
        - A rapid increase in the size of an infant's head.
        - A bulge or tense soft spot on the top of the head.
      subsections: []
    - heading: Physical symptoms
      level: 4
      content:
      - type: list
        ordered: false
        items:
        - Nausea and vomiting.
        - Sleepiness or sluggishness, known as lethargy.
        - Irritability.
        - Poor eating.
        - Seizures.
        - Eyes fixed downward, known as sunsetting of the eyes.
        - Problems with muscle tone and strength.
      subsections: []
  - heading: Toddlers and older children
    level: 3
    content:
    - type: paragraph
      text: 'Among toddlers and older children, symptoms might include:'
    subsections:
    - heading: Physical symptoms
      level: 4
      content:
      - type: list
        ordered: false
        items:
        - Headache.
        - Blurred or double vision.
        - Eye movements that are not usual.
        - Enlargement of a toddler's head.
        - Sleepiness or sluggishness.
        - Nausea or vomiting.
        - Trouble with balance.
        - Poor coordination.
        - Poor appetite.
        - Loss of bladder control or urinating often.
      subsections: []
    - heading: Behavioral and cognitive changes
      level: 4
      content:
      - type: list
        ordered: false
        items:
        - Irritability.
        - Change in personality.
        - Decline in school performance.
        - Delays or problems with earlier gained skills, such as walking or talking.
      subsections: []
  - heading: Young and middle-aged adults
    level: 3
    content:
    - type: paragraph
      text: 'Common symptoms in this age group include:'
    - type: list
      ordered: false
      items:
      - Headache.
      - Sluggishness.
      - Loss of coordination or balance.
      - Loss of bladder control or needing to urinate often.
      - Vision problems.
      - Decline in memory, concentration and other thinking skills that may affect
        job performance.
    subsections: []
  - heading: Older adults
    level: 3
    content:
    - type: paragraph
      text: 'Among adults 60 and older, the more common symptoms of hydrocephalus
        are:'
    - type: list
      ordered: false
      items:
      - Loss of bladder control or needing to urinate often.
      - Memory loss.
      - Progressive loss of other thinking or reasoning skills.
      - Trouble walking, often described as shuffling or the feeling of the feet being
        stuck.
      - Poor coordination or balance.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'Seek emergency medical care for infants and toddlers with these symptoms:'
    - type: list
      ordered: false
      items:
      - A high-pitched cry.
      - Problems with sucking or feeding.
      - Recurrent vomiting with no clear cause.
      - Seizures.
    - type: paragraph
      text: Seek prompt medical attention for other hydrocephalus symptoms in any
        age group.
    - type: paragraph
      text: More than one condition can cause the problems associated with hydrocephalus.
        It's important to get a timely diagnosis and appropriate care.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Hydrocephalus is caused by an imbalance between how much cerebrospinal fluid
      is produced and how much is absorbed into the bloodstream.
  - type: paragraph
    text: Tissues lining the ventricles of the brain produce cerebrospinal fluid.
      It flows through the ventricles by way of channels. The fluid eventually flows
      into spaces around the brain and spinal column. It's absorbed primarily by blood
      vessels in tissues on the surface of the brain.
  - type: paragraph
    text: 'Cerebrospinal fluid plays an important role in brain function by:'
  - type: list
    ordered: false
    items:
    - Allowing the relatively heavy brain to float within the skull.
    - Cushioning the brain to prevent injury.
    - Removing waste products of the brain's metabolism.
    - Flowing back and forth between the brain cavity and spinal column. This flow
      maintains a constant pressure within the brain and allows for changes in blood
      pressure in the brain.
  - type: paragraph
    text: 'Too much cerebrospinal fluid in the ventricles can occur for one of the
      following reasons:'
  - type: list
    ordered: false
    items:
    - Obstruction. Partial blockage of the flow of cerebrospinal fluid is the most
      common cause of too much cerebrospinal fluid in the ventricles. A blockage may
      happen from one ventricle to another or from the ventricles to other spaces
      around the brain.
    - Poor absorption. Less common is a problem with absorbing cerebrospinal fluid.
      This is often related to inflammation of brain tissues from disease or injury.
    - Overproduction. Rarely, cerebrospinal fluid is created more quickly than it
      can be absorbed.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Much of the time, the cause of hydrocephalus is not known. However, developmental
      or medical problems can contribute to or trigger hydrocephalus.
  subsections:
  - heading: Newborns
    level: 3
    content:
    - type: paragraph
      text: 'Hydrocephalus may be present at or before birth, known as congenital
        hydrocephalus. Or it can occur shortly after birth. Any of the following incidents
        may cause hydrocephalus in newborns:'
    - type: list
      ordered: false
      items:
      - The central nervous system developed in a way that blocks the flow of cerebrospinal
        fluid.
      - Bleeding occurred within the ventricles. This is a possible complication of
        premature birth.
      - There was an infection in the uterus during pregnancy, such as rubella or
        syphilis. An infection can cause swelling in the brain tissues of an unborn
        baby.
    subsections: []
  - heading: Other contributing factors
    level: 3
    content:
    - type: paragraph
      text: 'Other factors that can contribute to hydrocephalus among any age group
        include:'
    - type: list
      ordered: false
      items:
      - Tumors of the brain or spinal cord.
      - Central nervous system infections, such as bacterial meningitis or mumps.
      - Bleeding in the brain from a stroke or head injury.
      - Other traumatic injury to the brain.
    subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: In most cases, hydrocephalus worsens. Without treatment, hydrocephalus leads
      to complications. Complications may include learning disabilities or developmental
      and physical disabilities. Complications of this condition also can result in
      death. When hydrocephalus is mild and it's treated, there may be few, if any,
      serious complications.
  subsections: []
