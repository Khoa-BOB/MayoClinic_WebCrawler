  - type: paragraph
    text: If fluid builds up, it can push brain tissue against the skull.
  - type: paragraph
    text: One type of brain AVM that involves a major blood vessel called the vein
      of Galen causes serious complications in babies. Symptoms are present at birth
      or appear soon after birth. This type of brain AVM causes fluid to build up
      in the brain and the head to swell. Swollen veins may be seen on the scalp,
      and seizures may occur. Children with this type of brain AVM can have a failure
      to thrive and congestive heart failure.
  subsections: []
