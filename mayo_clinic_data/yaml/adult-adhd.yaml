title: Adult attention-deficit/hyperactivity disorder (ADHD)
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Adult attention-deficit/hyperactivity disorder (ADHD) is a mental health
      disorder that includes a combination of persistent problems, such as difficulty
      paying attention, hyperactivity and impulsive behavior. Adult ADHD can lead
      to unstable relationships, poor work or school performance, low self-esteem,
      and other problems.
  - type: paragraph
    text: Though it's called adult ADHD , symptoms start in early childhood and continue
      into adulthood. In some cases, ADHD is not recognized or diagnosed until the
      person is an adult. Adult ADHD symptoms may not be as clear as ADHD symptoms
      in children. In adults, hyperactivity may decrease, but struggles with impulsiveness,
      restlessness and difficulty paying attention may continue.
  - type: paragraph
    text: Treatment for adult ADHD is similar to treatment for childhood ADHD . Adult
      ADHD treatment includes medications, psychological counseling (psychotherapy)
      and treatment for any mental health conditions that occur along with ADHD .
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Some people with ADHD have fewer symptoms as they age, but some adults continue
      to have major symptoms that interfere with daily functioning. In adults, the
      main features of ADHD may include difficulty paying attention, impulsiveness
      and restlessness. Symptoms can range from mild to severe.
  - type: paragraph
    text: Many adults with ADHD aren't aware they have it — they just know that everyday
      tasks can be a challenge. Adults with ADHD may find it difficult to focus and
      prioritize, leading to missed deadlines and forgotten meetings or social plans.
      The inability to control impulses can range from impatience waiting in line
      or driving in traffic to mood swings and outbursts of anger.
  - type: paragraph
    text: 'Adult ADHD symptoms may include:'
  - type: list
    ordered: false
    items:
    - Impulsiveness
    - Disorganization and problems prioritizing
    - Poor time management skills
    - Problems focusing on a task
    - Trouble multitasking
    - Excessive activity or restlessness
    - Poor planning
    - Low frustration tolerance
    - Frequent mood swings
    - Problems following through and completing tasks
    - Hot temper
    - Trouble coping with stress
  subsections:
  - heading: What's typical behavior and what's ADHD?
    level: 3
    content:
    - type: paragraph
      text: Almost everyone has some symptoms similar to ADHD at some point in their
        lives. If your difficulties are recent or occurred only occasionally in the
        past, you probably don't have ADHD . ADHD is diagnosed only when symptoms
        are severe enough to cause ongoing problems in more than one area of your
        life. These persistent and disruptive symptoms can be traced back to early
        childhood.
    - type: paragraph
      text: Diagnosis of ADHD in adults can be difficult because certain ADHD symptoms
        are similar to those caused by other conditions, such as anxiety or mood disorders.
        And many adults with ADHD also have at least one other mental health condition,
        such as depression or anxiety.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If any of the symptoms listed above continually disrupt your life, talk
        to your doctor about whether you might have ADHD .
    - type: paragraph
      text: Different types of health care professionals may diagnose and supervise
        treatment for ADHD . Seek a provider who has training and experience in caring
        for adults with ADHD .
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'While the exact cause of ADHD is not clear, research efforts continue.
      Factors that may be involved in the development of ADHD include:'
  - type: list
    ordered: false
    items:
    - Genetics. ADHD can run in families, and studies indicate that genes may play
      a role.
    - Environment. Certain environmental factors also may increase risk, such as lead
      exposure as a child.
    - Problems during development. Problems with the central nervous system at key
      moments in development may play a role.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk of ADHD may increase if:'
  - type: list
    ordered: false
    items:
    - You have blood relatives, such as a parent or sibling, with ADHD or another
      mental health disorder
    - Your mother smoked, drank alcohol or used drugs during pregnancy
    - As a child, you were exposed to environmental toxins — such as lead, found mainly
      in paint and pipes in older buildings
    - You were born prematurely
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'ADHD can make life difficult for you. ADHD has been linked to:'
  - type: list
    ordered: false
    items:
    - Poor school or work performance
    - Unemployment
    - Financial problems
    - Trouble with the law
    - Alcohol or other substance misuse
    - Frequent car accidents or other accidents
    - Unstable relationships
    - Poor physical and mental health
    - Poor self-image
    - Suicide attempts
  subsections:
  - heading: Coexisting conditions
    level: 3
    content:
    - type: paragraph
      text: 'Although ADHD doesn''t cause other psychological or developmental problems,
        other disorders often occur along with ADHD and make treatment more challenging.
        These include:'
    - type: list
      ordered: false
      items:
      - Mood disorders. Many adults with ADHD also have depression, bipolar disorder
        or another mood disorder. While mood problems aren't necessarily due directly
        to ADHD , a repeated pattern of failures and frustrations due to ADHD can
        worsen depression.
      - Anxiety disorders. Anxiety disorders occur fairly often in adults with ADHD
        . Anxiety disorders may cause overwhelming worry, nervousness and other symptoms.
        Anxiety can be made worse by the challenges and setbacks caused by ADHD .
      - Other psychiatric disorders. Adults with ADHD are at increased risk of other
        psychiatric disorders, such as personality disorders, intermittent explosive
        disorder and substance use disorders.
      - Learning disabilities. Adults with ADHD may score lower on academic testing
        than would be expected for their age, intelligence and education. Learning
        disabilities can include problems with understanding and communicating.
    subsections: []
