title: Muscle cramp
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: A muscle cramp is a sudden, unexpected tightening of one or more muscles.
      Sometimes called a charley horse, a muscle cramp can be very painful. Exercising
      or working hard, especially in heat, can lead to muscle cramps. Some medicines
      and illnesses also might cause muscle cramps.
  - type: paragraph
    text: Muscle cramps aren't usually harmful. Self-care measures can treat most
      muscle cramps.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Muscle cramps occur mostly in leg muscles, most often in the calf. Cramps
      usually last for seconds to minutes. After the cramp eases, the area might be
      sore for hours or days.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'Muscle cramps usually go away on their own. They don''t usually need
        medical care. However, see a health care provider for cramps that:'
    - type: list
      ordered: false
      items:
      - Cause severe discomfort.
      - Have leg swelling, redness or skin changes.
      - Come with muscle weakness.
      - Happen often.
      - Don't get better with self-care.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: A muscle cramp can happen after working a muscle too hard or straining it,
      losing body fluids through sweat or simply holding a position for a long time.
      Often, however, the cause isn't known.
  - type: paragraph
    text: 'Most muscle cramps are harmless. But some might be related to a medical
      concern, such as:'
  - type: list
    ordered: false
    items:
    - Not enough blood flow. A narrowing of the arteries that bring blood to the legs
      can cause a cramping pain in the legs and feet during exercise. These cramps
      usually go away soon after exercise stops.
    - Nerve compression. Pressure on the nerves in the spine also can cause cramping
      pain in the legs. The pain usually gets worse with walking. Walking bent slightly
      forward, such as when pushing a shopping cart, might ease cramping.
    - Not enough minerals. Too little potassium, calcium or magnesium in the diet
      can cause leg cramps. Medicines often prescribed for high blood pressure can
      cause increased urination, which may drain the body of these minerals.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that might increase the risk of muscle cramps include:'
  - type: list
    ordered: false
    items:
    - Age. Older people lose muscle mass. Then the muscles can't work as hard and
      can get stressed more easily.
    - Poor conditioning. Not being in shape for an activity causes muscles to tire
      more easily.
    - Extreme sweating. Athletes who get tired and sweat a lot while playing sports
      in warm weather often get muscle cramps.
    - Pregnancy. Muscle cramps are common during pregnancy.
    - Medical issues. Having diabetes or illnesses that involve nerves, liver or thyroid
      can increase the risk of muscle cramps.
    - Weight. Being overweight can increase the risk of muscle cramps.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'These steps might help prevent cramps:'
  - type: list
    ordered: false
    items:
    - Drink plenty of liquids every day. Muscles need fluids to work well. During
      activity, drink liquids regularly. Keep drinking water or other liquids without
      caffeine or alcohol after the activity.
    - Stretch your muscles. Stretch gently before and after using any muscle for a
      time. To avoid getting leg cramps at night, stretch before bedtime. Light exercise,
      such as riding a stationary bicycle for a few minutes before bedtime, also may
      help prevent cramps while you sleep.
  subsections: []
