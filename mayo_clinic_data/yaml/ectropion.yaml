title: Ectropion
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Ectropion (ek-TROH-pee-on) is a condition in which your eyelid turns outward.
      This leaves the inner eyelid surface exposed and prone to irritation.
  - type: paragraph
    text: Ectropion is more common in older adults, and it generally affects only
      the lower eyelid. In severe ectropion, the entire length of the eyelid is turned
      out. In less severe ectropion, only one segment of the eyelid sags away from
      the eye.
  - type: paragraph
    text: Artificial tears and lubricating ointments can help relieve symptoms of
      ectropion. But usually surgery is needed to fully correct the condition.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Normally when you blink, your eyelids distribute tears evenly across your
      eyes, keeping the surfaces of the eyes lubricated. These tears drain into small
      openings on the inner part of your eyelids (puncta).
  - type: paragraph
    text: 'If you have ectropion, your lower lid pulls away from your eye and tears
      don''t drain properly into the puncta. The resulting signs and symptoms can
      include:'
  - type: list
    ordered: false
    items:
    - Watery eyes (excessive tearing). Without proper drainage, your tears may pool
      and constantly flow over your eyelids.
    - Excessive dryness. Ectropion can cause your eyes to feel dry, gritty and sandy.
    - Irritation. Stagnant tears or dryness can irritate your eyes, causing a burning
      sensation and redness in your eyelids and the whites of your eyes.
    - Sensitivity to light. Stagnant tears or dry eyes can irritate the surface of
      the cornea, making you sensitive to light.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See your doctor if your eyes are constantly watering or irritated, or
        your eyelid seems to be sagging or drooping.
    - type: paragraph
      text: 'Seek immediate care if you have been diagnosed with ectropion and you
        experience:'
    - type: list
      ordered: false
      items:
      - Rapidly increasing redness in your eyes
      - Sensitivity to light
      - Decreasing vision
    - type: paragraph
      text: These are signs and symptoms of cornea exposure or ulcers, which can harm
        your vision.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Ectropion can be caused by:'
  - type: list
    ordered: false
    items:
    - Muscle weakness. As you age, the muscles under your eyes tend to weaken, and
      tendons stretch out. These muscles and tendons hold your eyelid taut against
      your eye. When they weaken, your eyelid can begin to droop.
    - Facial paralysis. Certain conditions, such as Bell's palsy, and certain types
      of tumors can paralyze facial nerves and muscles. Facial paralysis that affects
      eyelid muscles can lead to ectropion.
    - Scars or previous surgeries. Skin that has been damaged by burns or trauma,
      such as a dog bite, can affect the way that your eyelid rests against your eye.
      Previous eyelid surgery (blepharoplasty) can cause ectropion, particularly if
      a considerable amount of skin was removed from the eyelid at the time of surgery.
    - Eyelid growths. Benign or cancerous growths on your eyelid can cause the lid
      to turn outward.
    - Genetic disorders. Rarely is ectropion present at birth (congenital). When it
      is, it's usually associated with genetic disorders, such as Down syndrome.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that increase your risk of developing ectropion include:'
  - type: list
    ordered: false
    items:
    - Age. The most common cause of ectropion is weakening muscle tissue associated
      with aging.
    - Previous eye surgeries. People who have had eyelid surgery are at higher risk
      of developing ectropion later.
    - Previous cancer, burns or trauma. If you've had spots of skin cancer on your
      face, facial burns or trauma, you're at higher risk of developing ectropion.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Ectropion leaves your cornea irritated and exposed, making it more susceptible
      to drying. The result can be abrasions and ulcers on the cornea, which can threaten
      your vision.
  subsections: []
