title: Sleep terrors (night terrors)
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Sleep terrors are times of screaming or crying, intense fear, and sometimes
      waving arms and legs when not fully awake. Also known as night terrors, sleep
      terrors may lead to sleepwalking. Like sleepwalking, sleep terrors are a type
      of parasomnia. Parasomnias are disturbing or strange behaviors or experiences
      during sleep. A sleep terror usually lasts from seconds to a few minutes, but
      it may last longer.
  - type: paragraph
    text: Sleep terrors may happen in children between the ages of 1 and 12 years.
      They happen much less often in adults. Although sleep terrors can be frightening
      to those around the person with sleep terrors, they aren't usually a cause for
      concern. Most children outgrow sleep terrors by their teenage years.
  - type: paragraph
    text: Sleep terrors may need treatment if they cause problems with getting enough
      sleep or cause a safety risk.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Sleep terrors differ from nightmares. A nightmare is a bad dream. The person
      who has a nightmare wakes up from the dream and may remember details. A person
      who has a sleep terror remains asleep. Children usually don't remember anything
      about their sleep terrors in the morning. Adults may recall part of a dream
      they had during the sleep terrors.
  - type: paragraph
    text: Sleep terrors generally happen in the first part of sleep time, and rarely
      during naps. A sleep terror may lead to sleepwalking.
  - type: paragraph
    text: 'During a sleep terror, a person may:'
  - type: list
    ordered: false
    items:
    - Start by screaming, shouting or crying.
    - Sit up in bed and look scared.
    - Stare wide-eyed.
    - Sweat, breathe heavily, and have a racing pulse, flushed face and enlarged pupils.
    - Kick and thrash.
    - Be hard to wake up and be confused if awakened.
    - Not be comforted or soothed.
    - Have no or little memory of the event the next morning.
    - Possibly, get out of bed and run around the house or have aggressive behavior
      if blocked or held back.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'Occasional sleep terrors aren''t usually a cause for concern. If your
        child has sleep terrors, you can simply mention them at a routine well-child
        exam. But if you have concerns for you or your child, talk to your doctor
        or other healthcare professional sooner, especially if sleep terrors:'
    - type: list
      ordered: false
      items:
      - Happen more often.
      - Regularly disrupt the sleep of the person with sleep terrors or other family
        members.
      - Lead to safety concerns or injury.
      - Result in daytime symptoms of extreme sleepiness or problems with daily activities.
      - Continue beyond the teen years or start as an adult.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Sleep terrors are a type of parasomnia. A parasomnia is a disturbing or
      strange behavior or experience during sleep. People who have sleep terrors don't
      completely wake up from sleep during the episodes. Their appearance may suggest
      they are awake, but they remain partially asleep.
  - type: paragraph
    text: 'Several issues can contribute to sleep terrors, such as:'
  - type: list
    ordered: false
    items:
    - Serious lack of sleep and extreme tiredness.
    - Stress.
    - Sleep schedule changes, travel or sleep interruptions.
    - Fever.
  - type: paragraph
    text: 'Sleep terrors sometimes can be triggered by conditions that interfere with
      sleep, such as:'
  - type: list
    ordered: false
    items:
    - Sleep-disordered breathing — a group of disorders that include breathing patterns
      that are not typical during sleep. The most common type of sleep-disordered
      breathing is obstructive sleep apnea.
    - Restless legs syndrome.
    - Some medicines.
    - Mood disorders, such as depression and anxiety.
    - Alcohol use.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Sleep terrors are more common if family members have a history of sleep
      terrors or sleepwalking.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Some complications that may result from sleep terrors include:'
  - type: list
    ordered: false
    items:
    - Being too sleepy during the day, which can lead to problems at school or work
      or with everyday tasks.
    - Disturbed sleep.
    - Embarrassment about the sleep terrors or problems with relationships.
    - Injury to the person having a sleep terror or, rarely, to someone nearby.
  subsections: []
