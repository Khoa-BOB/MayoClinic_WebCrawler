title: Childhood schizophrenia
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Childhood schizophrenia is an uncommon but severe mental disorder in which
      children and teenagers interpret reality abnormally. Schizophrenia involves
      a range of problems with thinking (cognitive), behavior or emotions. It may
      result in some combination of hallucinations, delusions, and extremely disordered
      thinking and behavior that impairs your child's ability to function.
  - type: paragraph
    text: Childhood schizophrenia is essentially the same as schizophrenia in adults,
      but it starts early in life — generally in the teenage years — and has a profound
      impact on a child's behavior and development. With childhood schizophrenia,
      the early age of onset presents special challenges for diagnosis, treatment,
      education, and emotional and social development.
  - type: paragraph
    text: Schizophrenia is a chronic condition that requires lifelong treatment. Identifying
      and starting treatment for childhood schizophrenia as early as possible may
      significantly improve your child's long-term outcome.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Schizophrenia involves a range of problems with thinking, behavior or emotions.
      Signs and symptoms may vary, but usually involve delusions, hallucinations or
      disorganized speech, and reflect an impaired ability to function. The effect
      can be disabling.
  - type: paragraph
    text: In most people with schizophrenia, symptoms generally start in the mid-
      to late 20s, though it can start later, up to the mid-30s. Schizophrenia is
      considered early onset when it starts before the age of 18. Onset of schizophrenia
      in children younger than age 13 is extremely rare.
  - type: paragraph
    text: Symptoms can vary in type and severity over time, with periods of worsening
      and remission of symptoms. Some symptoms may always be present. Schizophrenia
      can be difficult to recognize in the early phases.
  subsections:
  - heading: Early signs and symptoms
    level: 3
    content:
    - type: paragraph
      text: Schizophrenia signs and symptoms in children and teenagers are similar
        to those in adults, but the condition may be more difficult to recognize in
        this age group.
    - type: paragraph
      text: Early signs and symptoms may include problems with thinking, behavior
        and emotions.
    - type: paragraph
      text: 'Thinking:'
    - type: list
      ordered: false
      items:
      - Problems with thinking and reasoning
      - Bizarre ideas or speech
      - Confusing dreams or television for reality
    - type: paragraph
      text: 'Behavior:'
    - type: list
      ordered: false
      items:
      - Withdrawal from friends and family
      - Trouble sleeping
      - Lack of motivation — for example, showing up as a drop in performance at school
      - Not meeting daily expectations, such as bathing or dressing
      - Bizarre behavior
      - Violent or aggressive behavior or agitation
      - Recreational drug or nicotine use
    - type: paragraph
      text: 'Emotions:'
    - type: list
      ordered: false
      items:
      - Irritability or depressed mood
      - Lack of emotion, or emotions inappropriate for the situation
      - Strange anxieties and fears
      - Excessive suspicion of others
    subsections: []
  - heading: Later signs and symptoms
    level: 3
    content:
    - type: paragraph
      text: 'As children with schizophrenia age, more typical signs and symptoms of
        the disorder begin to appear. Signs and symptoms may include:'
    - type: list
      ordered: false
      items:
      - Delusions. These are false beliefs that are not based in reality. For example,
        you think that you're being harmed or harassed; that certain gestures or comments
        are directed at you; that you have exceptional ability or fame; that another
        person is in love with you; or that a major catastrophe is about to occur.
        Delusions occur in most people with schizophrenia.
      - Hallucinations. These usually involve seeing or hearing things that don't
        exist. Yet for the person with schizophrenia, hallucinations have the full
        force and impact of a normal experience. Hallucinations can be in any of the
        senses, but hearing voices is the most common hallucination.
      - Disorganized thinking. Disorganized thinking is inferred from disorganized
        speech. Effective communication can be impaired, and answers to questions
        may be partially or completely unrelated. Rarely, speech may include putting
        together meaningless words that can't be understood, sometimes known as word
        salad.
      - Extremely disorganized or abnormal motor behavior. This may show in several
        ways, from childlike silliness to unpredictable agitation. Behavior is not
        focused on a goal, which makes it hard to do tasks. Behavior can include resistance
        to instructions, inappropriate or bizarre posture, a complete lack of response,
        or useless and excessive movement.
      - Negative symptoms. This refers to reduced or lack of ability to function normally.
        For example, the person may neglect personal hygiene or appear to lack emotion
        — doesn't make eye contact, doesn't change facial expressions, speaks in a
        monotone, or doesn't add hand or head movements that normally occur when speaking.
        Also, the person may avoid people and activities or lack the ability to experience
        pleasure.
    - type: paragraph
      text: 'Compared with schizophrenia symptoms in adults, children and teens may
        be:'
    - type: list
      ordered: false
      items:
      - Less likely to have delusions
      - More likely to have visual hallucinations
    subsections: []
  - heading: Symptoms may be difficult to interpret
    level: 3
    content:
    - type: paragraph
      text: When childhood schizophrenia begins early in life, symptoms may build
        up gradually. Early signs and symptoms may be so vague that you can't recognize
        what's wrong. Some early signs can be mistaken for typical development during
        early teen years, or they could be symptoms of other mental or physical conditions.
    - type: paragraph
      text: As time goes on, signs may become more severe and more noticeable. Eventually,
        your child may develop the symptoms of psychosis, including hallucinations,
        delusions and difficulty organizing thoughts. As thoughts become more disorganized,
        there's often a "break from reality" (psychosis) frequently requiring hospitalization
        and treatment with medication.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: It can be difficult to know how to handle vague behavioral changes in
        your child. You may be afraid of rushing to conclusions that label your child
        with a mental illness. Your child's teacher or other school staff may alert
        you to changes in your child's behavior.
    - type: paragraph
      text: Seek medical care as soon as possible if you have concerns about your
        child's behavior or development.
    subsections: []
  - heading: Suicidal thoughts and behavior
    level: 3
    content:
    - type: paragraph
      text: Suicidal thoughts and behavior are common among people with schizophrenia.
        If you have a child or teen who is in danger of attempting suicide or has
        made a suicide attempt, make sure someone stays with him or her. Call 911
        or your local emergency number immediately. Or if you think you can do so
        safely, take your child to the nearest hospital emergency room.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: It's not known what causes childhood schizophrenia, but it's thought that
      it develops in the same way as adult schizophrenia does. Researchers believe
      that a combination of genetics, brain chemistry and environment contributes
      to development of the disorder. It's not clear why schizophrenia starts so early
      in life for some and not for others.
  - type: paragraph
    text: Problems with certain naturally occurring brain chemicals, including neurotransmitters
      called dopamine and glutamate, may contribute to schizophrenia. Neuroimaging
      studies show differences in the brain structure and central nervous system of
      people with schizophrenia. While researchers aren't certain about the significance
      of these changes, they indicate that schizophrenia is a brain disease.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Although the precise cause of schizophrenia isn''t known, certain factors
      seem to increase the risk of developing or triggering schizophrenia, including:'
  - type: list
    ordered: false
    items:
    - Having a family history of schizophrenia
    - Increased immune system activation, such as from inflammation
    - Older age of the father
    - Some pregnancy and birth complications, such as malnutrition or exposure to
      toxins or viruses that may impact brain development
    - Taking mind-altering (psychoactive) drugs during teen years
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Left untreated, childhood schizophrenia can result in severe emotional,
      behavioral and health problems. Complications associated with schizophrenia
      may occur in childhood or later, such as:'
  - type: list
    ordered: false
    items:
    - Suicide, suicide attempts and thoughts of suicide
    - Self-injury
    - Anxiety disorders, panic disorders and obsessive-compulsive disorder (OCD)
    - Depression
    - Abuse of alcohol or other drugs, including nicotine
    - Family conflicts
    - Inability to live independently, attend school or work
    - Social isolation
    - Health and medical problems
    - Being victimized
    - Legal and financial problems, and homelessness
    - Aggressive behavior, although uncommon
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: Early identification and treatment may help get symptoms of childhood schizophrenia
      under control before serious complications develop. Early treatment is also
      crucial in helping limit psychotic episodes, which can be extremely frightening
      to a child and his or her parents. Ongoing treatment can help improve your child's
      long-term outlook.
  subsections: []
