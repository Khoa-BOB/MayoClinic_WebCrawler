title: CSF leak (Cerebrospinal fluid leak)
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Cerebrospinal fluid (CSF) surrounds the brain and spinal cord and provides
      a cushion to protect them from injury. There are three layers that surround
      the spinal cord and brain. When there is a hole or tear in the outermost layer,
      a CSF leak occurs. The hole or tear in this outer layer, called the dura mater,
      allows some of the fluid to escape.
  - type: paragraph
    text: 'There are two distinct types of CSF leaks: spinal CSF leaks and cranial
      CSF leaks. Each type has different symptoms, causes and treatments.'
  - type: paragraph
    text: A spinal CSF leak occurs anywhere in the spinal column. The most common
      symptom of a spinal CSF leak is a headache.
  - type: paragraph
    text: A cranial CSF leak occurs in the skull, and often causes symptoms such as
      clear fluid leaking from the nose or ear.
  - type: paragraph
    text: Some CSF leaks may heal with bed rest and other conservative treatment.
      Many CSF leaks need a patch to cover the hole or surgery to repair the leak.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Symptoms vary between spinal and cranial CSF leaks.
  subsections:
  - heading: Spinal CSF leaks
    level: 3
    content:
    - type: paragraph
      text: 'The most common symptom of a spinal CSF leak is a headache. These headaches
        usually:'
    - type: list
      ordered: false
      items:
      - Cause pain in the back of the head.
      - Improve when lying down.
      - Worsen when standing up.
      - May start or worsen when coughing or straining.
      - Rarely, start suddenly. When this happens, it is called a "thunderclap" headache.
    - type: paragraph
      text: 'Other symptoms of spinal CSF leaks may include:'
    - type: list
      ordered: false
      items:
      - Neck or shoulder pain.
      - Ringing in the ears.
      - Changes in hearing.
      - Dizziness.
      - Nausea or vomiting.
      - Changes in vision.
      - Changes in behavior or ability to think clearly.
    subsections: []
  - heading: Cranial CSF leaks
    level: 3
    content:
    - type: paragraph
      text: 'Cranial CSF leak symptoms may include:'
    - type: list
      ordered: false
      items:
      - Clear, watery drainage from one side of the nose or ear.
      - Hearing loss.
      - A metallic taste in the mouth.
      - Meningitis.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Spinal CSF leaks may be caused by:'
  - type: list
    ordered: false
    items:
    - A spinal tap, also called a lumbar puncture.
    - An epidural in the spine for pain relief, such as during labor and delivery.
    - An injury to the head or spine.
    - Bone spurs along the spine.
    - Irregularities of the dura mater around the nerve roots in the spine.
    - Irregular connections between dura mater and veins. These are referred to as
      CSF -venous fistulas.
    - Prior surgery on the spine.
  - type: paragraph
    text: 'Cranial CSF leaks may be caused by:'
  - type: list
    ordered: false
    items:
    - A head injury.
    - Sinus surgery.
    - Increased pressure in the brain.
    - Malformations of the inner ear.
  - type: paragraph
    text: 'Sometimes CSF leaks develop after very minor events:'
  - type: list
    ordered: false
    items:
    - Sneezing.
    - Coughing.
    - Straining to have a bowel movement.
    - Lifting heavy objects.
    - Falling.
    - Stretching.
    - Exercise.
  - type: paragraph
    text: When there is no surgery or procedure prior to the start of a CSF leak,
      it is called a spontaneous CSF leak.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk factors for spinal CSF leaks include:'
  - type: list
    ordered: false
    items:
    - Having a previous surgery or procedure on or around the spine.
    - Connective tissue disorders such as Marfan syndrome or Ehlers-Danlos syndrome,
      which often also cause joint hypermobility and dislocations.
  - type: paragraph
    text: 'Risk factors for cranial CSF leaks include:'
  - type: list
    ordered: false
    items:
    - Having a previous surgery on or around the skull.
    - Obesity.
    - Obstructive sleep apnea.
    - Head trauma.
    - Tumor at the skull base.
    - Irregularities of the skull base or inner ear.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: If a cranial CSF leak is left untreated, complications may occur. Possible
      complications include meningitis and tension pneumocephalus, which is when air
      enters the spaces surrounding the brain. Untreated spinal CSF leaks may lead
      to subdural hematomas, or bleeding on the surface of the brain.
  subsections: []
