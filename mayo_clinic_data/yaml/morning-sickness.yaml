title: Morning sickness
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Morning sickness is feeling like throwing up, also called nausea, and throwing
      up, also called vomiting, that occurs during pregnancy. Despite its name, morning
      sickness can strike at any time of the day or night.
  - type: paragraph
    text: Many people have morning sickness, especially during the first three months
      of pregnancy. But some people have morning sickness all through pregnancy. Home
      remedies, such as snacking during the day and sipping ginger ale or taking medicine
      you can buy without a prescription, might help relieve nausea.
  - type: paragraph
    text: Rarely, morning sickness is so bad that it turns into hyperemesis gravidarum.
      This is when the nausea and vomiting cause serious fluid loss or loss of more
      than 5% of pre-pregnancy body weight. Hyperemesis gravidarum might require going
      to a hospital for treatment.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Nausea, with or without vomiting, is common in pregnancy. Morning sickness
      is often brought on by smelling certain odors or eating certain foods.
  - type: paragraph
    text: Morning sickness is most common during the first three months of pregnancy.
      It typically starts before nine weeks. Symptoms usually improve by the middle
      or end of the second three months of pregnancy.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'Contact your health care provider if:'
    - type: list
      ordered: false
      items:
      - You produce no urine or only a little urine that's a dark color.
      - You can't keep liquids down.
      - You feel dizzy or faint when you stand up.
      - Your heart races.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The cause of morning sickness is not known. Hormone changes might play a
      role. Rarely, a medical condition not related to pregnancy, such as thyroid
      or gallbladder disease, can cause serious nausea or vomiting.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Morning sickness can affect anyone who''s pregnant, but it might be more
      likely for those who:'
  - type: list
    ordered: false
    items:
    - Had nausea or vomiting from other causes before becoming pregnant, such as motion
      sickness or migraines.
    - Had morning sickness during a prior pregnancy.
    - Are pregnant with twins or other multiples.
  - type: paragraph
    text: 'Hyperemesis gravidarum might be more likely for those who:'
  - type: list
    ordered: false
    items:
    - Are pregnant with a girl.
    - Have a family history of hyperemesis gravidarum.
    - Have had hyperemesis gravidarum during an earlier pregnancy.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Mild nausea and vomiting of pregnancy usually won't cause harm.
  - type: paragraph
    text: If left untreated, severe nausea and vomiting can cause a lack of bodily
      fluids, a condition known as dehydration. It also may lead to an imbalance in
      electrolytes — the salts in blood that control the balance of fluids in the
      body. Severe nausea and vomiting may result in less urine output. Research is
      mixed on whether hyperemesis gravidarum causes poor weight gain for the baby
      during pregnancy.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: There's no sure way to prevent morning sickness. However, taking a daily
      vitamin supplement before and during pregnancy might help.
  subsections: []
