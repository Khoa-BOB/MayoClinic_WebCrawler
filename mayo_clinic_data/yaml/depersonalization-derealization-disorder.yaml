title: Depersonalization-derealization disorder
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Depersonalization-derealization disorder occurs when you always or often
      feel that you're seeing yourself from outside your body or you sense that things
      around you are not real — or both. Feelings of depersonalization and derealization
      can be very disturbing. You may feel like you're living in a dream.
  - type: paragraph
    text: Many people have a passing experience of depersonalization or derealization
      at some point. But when these feelings keep occurring or never fully go away,
      and they make it hard for you to function, it's likely depersonalization-derealization
      disorder. This condition is more common in people who experience trauma, such
      as violence, abuse or other kinds of extreme stress.
  - type: paragraph
    text: Depersonalization-derealization disorder can be serious and may get in the
      way of your relationships and work. It also can disrupt other daily activities.
      The main treatment for depersonalization-derealization disorder is psychotherapy,
      also known as talk therapy. Sometimes medicines also are used.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Short experiences of depersonalization or derealization are fairly common.
      But lasting and returning bouts of these symptoms can cause problems at work
      or school, or in other important areas of your life. During these bouts, you
      know that your sense of not being connected to your body or your surroundings
      are only feelings and not reality.
  - type: paragraph
    text: The experience and feelings of the condition can be hard to describe. Worrying
      about "going crazy" can cause you to become focused on checking that you exist
      and finding out what's real.
  - type: paragraph
    text: Symptoms usually begin in the middle or late teenage years, or in early
      adulthood. Depersonalization-derealization disorder is rare in children and
      older adults.
  subsections:
  - heading: Depersonalization symptoms
    level: 3
    content:
    - type: paragraph
      text: 'Symptoms of depersonalization include:'
    - type: list
      ordered: false
      items:
      - Feelings that you're seeing your thoughts, feelings, or body or parts of your
        body from the outside. For example, you may feel like you're floating in the
        air above yourself.
      - Feeling like a robot or that you're not in control of what you say or how
        you move.
      - The sense that your body, legs or arms appear twisted or like they're not
        the right shape. Or they may seem larger or smaller than usual. You also could
        feel that your head is wrapped in cotton.
      - Emotional or physical numbness of your senses or responses to the world around
        you.
      - A sense that your memories lack emotion, and they may or may not be your own
        memories.
    subsections: []
  - heading: Derealization symptoms
    level: 3
    content:
    - type: paragraph
      text: 'Symptoms of derealization include:'
    - type: list
      ordered: false
      items:
      - Feeling that people and your surroundings are not real, like you're living
        in a movie or a dream.
      - Feeling emotionally disconnected from people you care about, as if you were
        separated by a glass wall.
      - Surroundings that appear out of their usual shape, or are blurry or colorless.
        Or they may seem like they only have two dimensions, so they're flat with
        no depth. Or you could be more aware of your surroundings, and they may appear
        clearer than usual.
      - Thoughts about time that are not real, such as recent events feeling like
        the distant past.
      - Unrealistic thoughts about distance and the size and shape of objects.
    - type: paragraph
      text: Bouts of depersonalization-derealization disorder may last hours, days,
        weeks or months. In some people, these bouts turn into ongoing feelings of
        depersonalization or derealization that may get better or worse at times.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Passing feelings of depersonalization or derealization are common and
        are not always a cause for concern. But ongoing or serious feelings of detachment
        and distortion of your surroundings can be a sign of depersonalization-derealization
        disorder or another physical or mental health condition.
    - type: paragraph
      text: 'See a doctor if you have feelings of depersonalization or derealization
        that:'
    - type: list
      ordered: false
      items:
      - Are disturbing you or are disrupting your emotions.
      - Do not go away or keep coming back.
      - Get in the way of work, relationships or daily activities.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The cause of depersonalization-derealization disorder is not well understood.
      Some people may be more likely to experience depersonalization and derealization
      than others. This is possibly due to genetic and environmental factors. High
      levels of stress and fear may cause bouts.
  - type: paragraph
    text: Symptoms of depersonalization-derealization disorder may be related to childhood
      trauma or other experiences or events that cause severe emotional stress or
      trauma.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that may raise the risk of depersonalization-derealization disorder
      include:'
  - type: list
    ordered: false
    items:
    - Certain personality traits that make you want to stay away from stressful situations
      or make it hard to describe your emotional experience.
    - Serious trauma as a child or an adult, like going through or seeing a traumatic
      event, such as violence or abuse.
    - Serious stress, such as major relationship, financial or work-related issues.
    - Depression or anxiety, especially serious depression, depression that lasts
      a long time or anxiety with panic attacks.
    - Drug misuse, which can cause bouts of depersonalization or derealization.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Bouts of depersonalization or derealization can be scary and make it hard
      to function. They can:'
  - type: list
    ordered: false
    items:
    - Make it hard to focus on tasks or remember things.
    - Get in the way of work and other routine activities.
    - Cause problems in relationships with your family and friends.
    - Make you feel anxious, depressed or hopeless.
  subsections: []
