title: Esthesioneuroblastoma
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Esthesioneuroblastoma (es-thee-zee-o-noo-row-blas-TOE-muh) is a rare type
      of cancer that starts in the upper part of the inside of the nose, known as
      the nasal cavity. Esthesioneuroblastoma also is called olfactory neuroblastoma.
  - type: paragraph
    text: This cancer usually affects adults. But it can occur at any age. Esthesioneuroblastoma
      usually begins as a growth of cells, called a tumor, inside the nose. It might
      grow and go into the sinuses, eyes and brain. It also can spread to other parts
      of the body.
  - type: paragraph
    text: People with esthesioneuroblastoma can lose their sense of smell. They might
      get nosebleeds. And they might have trouble breathing through their nose as
      the tumor grows.
  - type: paragraph
    text: Esthesioneuroblastoma treatment usually includes surgery. Often, radiation
      and chemotherapy are part of the treatment as well.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Esthesioneuroblastoma symptoms include:'
  - type: list
    ordered: false
    items:
    - Loss of the sense of smell.
    - Frequent nosebleeds.
    - Difficulty breathing through the nose.
  - type: paragraph
    text: As the cancer grows, it might cause eye pain, loss of vision, ear pain and
      headaches.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with your healthcare team if you have lasting symptoms
        that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Experts haven't found the exact cause of esthesioneuroblastoma. In general,
      cancer happens when cells get changes in their DNA. A cell's DNA holds the instructions
      that tell a cell what to do. The changes tell the cells to make many more cells
      quickly. The changes give the cells the ability to keep living when healthy
      cells would naturally die. This causes too many cells.
  - type: paragraph
    text: The cells might form a mass called a tumor. The tumor can grow to invade
      and destroy healthy body tissue. In time, cells can break away and spread to
      other parts of the body.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Healthcare professionals haven't found many risk factors for esthesioneuroblastoma.
      This cancer can happen at any age. But it's more common in adults.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Complications of esthesioneuroblastoma may include:'
  - type: list
    ordered: false
    items:
    - Cancer that grows into nearby organs and tissues. Esthesioneuroblastoma can
      grow and get into the sinuses, eyes and brain.
    - Spread of the cancer, known as metastasis. Esthesioneuroblastoma can spread
      to other parts of the body, such as the lymph nodes, bone marrow, lungs, liver,
      skin and bones.
  subsections: []
