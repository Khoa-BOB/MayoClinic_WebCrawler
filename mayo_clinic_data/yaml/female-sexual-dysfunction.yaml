- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that may increase your risk of sexual dysfunction:'
  - type: list
    ordered: false
    items:
    - Depression, anxiety and other mental health conditions.
    - Heart disease, diabetes, cancer.
    - Conditions of the spine and brain, called neurological. Examples are spinal
      cord injury or multiple sclerosis.
    - Gynecological conditions, including infections.
    - Certain medicines, such as those taken for depression or high blood pressure.
    - Emotional or psychological stress, especially stress in your relationship with
      your partner.
    - A history of sexual abuse.
    - Lack of privacy.
  subsections: []
