title: Female sexual dysfunction
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Female sexual dysfunction is a medical term for ongoing sexual problems
      that upset you or your partner. Problems may involve sexual response, desire,
      orgasm or pain during sex.
  - type: paragraph
    text: Many people have sexual problems at some point. Some have them throughout
      their lives. Female sexual dysfunction can happen at any stage of life. It can
      happen only sometimes or all the time during sex.
  - type: paragraph
    text: Sexual response is complex. It involves how your body works, your feelings,
      things that happen in your life, your beliefs, your lifestyle and how you relate
      to your partner. A problem in any one of these areas can affect sexual desire,
      arousal or satisfaction. Treatment often involves more than one approach.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms vary depending on the type of sexual dysfunction. Symptoms may
      include:'
  - type: list
    ordered: false
    items:
    - Low sexual desire. This most common of female sexual dysfunctions involves a
      lack of interest in sex and not wanting to have sex.
    - Sexual arousal disorder. Even if you want sex, sometimes it may be hard to get
      or stay aroused during sex.
    - Orgasmic disorder. You have ongoing trouble having an orgasm even with enough
      sexual arousal.
    - Sexual pain disorder. You have pain when having sex.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If sexual problems affect your relationship or worry you, make an appointment
        with a member of your healthcare team.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Sexual dysfunction problems often start when hormones change. This might
      be after having a baby or during menopause. Major illness, such as cancer, diabetes
      or heart disease, also can add to sexual dysfunction.
  - type: paragraph
    text: 'Factors that add to sex problems include the following:'
  - type: list
    ordered: false
    items:
    - Physical. Medical conditions can lead to sexual dysfunction. These may include
      cancer, diabetes, kidney failure, multiple sclerosis, heart disease and bladder
      problems. Certain medicines can decrease your sexual desire and make it harder
      for you to have an orgasm. These include some medicines to treat depression,
      high blood pressure, allergies and cancers.
    - Hormonal. Lower estrogen levels after menopause may lead to changes in your
      genital tissues and how you respond to sex. Lower estrogen leads to less blood
      flow to the pelvis. This can cause you to have less feeling in your genitals
      and to need more time to become aroused and reach orgasm. The vaginal lining
      also becomes thinner and less stretchy. Not being sexually active can make this
      worse. These factors can lead to painful intercourse, called dyspareunia. Sexual
      desire also lessens when hormone levels drop. Your body's hormone levels shift
      after giving birth and during breastfeeding. This can lead to vaginal dryness
      and affect your desire for sex.
    - Psychological and social. Anxiety or depression that isn't treated can cause
      sexual dysfunction or add to it. So can long-term stress, a history of sexual
      abuse, worries of pregnancy and the demands of having an infant. Problems with
      your partner can affect your sex life. So can cultural and religious issues
      and problems with body image.
