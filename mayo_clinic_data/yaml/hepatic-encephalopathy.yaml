title: Hepatic encephalopathy
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Hepatic encephalopathy (huh-PAT-ik en-sef-uh-LOP-uh-thee) is a serious condition
      that occurs when the liver is unable to filter toxins from the blood, including
      ammonia from the intestines. A buildup of toxins affects the brain's ability
      to function. If left untreated or not treated successfully, hepatic encephalopathy
      can lead to unresponsiveness, coma or death.
  - type: paragraph
    text: Hepatic encephalopathy may be caused by injury to the liver, cancer or a
      chronic liver disease that results in liver failure, such as cirrhosis. Hepatic
      encephalopathy occurs in 30% to 40% of people who have cirrhosis. Alcohol use,
      infections, use of some medicines and blood clots in the veins also may cause
      hepatic encephalopathy.
  - type: paragraph
    text: Prompt treatment is needed for hepatic encephalopathy to prevent death.
      Call 911 or emergency medical help if you think you or a loved one might have
      hepatic encephalopathy.
  subsections:
  - heading: Types
    level: 3
    content:
    - type: paragraph
      text: 'There are three types of hepatic encephalopathy:'
    - type: list
      ordered: false
      items:
      - Type A. Type A hepatic encephalopathy results from acute liver failure , which
        is loss of liver function that happens quickly — in days or weeks.
      - Type B. Type B hepatic encephalopathy happens when blood that should go to
        the liver through the portosystemic shunt instead goes into the bloodstream.
        The shunt is an opening between the portal vein and the hepatic vein, which
        carries blood from the liver to the heart.
      - Type C. Type C hepatic encephalopathy occurs in people who have cirrhosis
        , which is advanced scarring of the liver. People with acute-on-chronic liver
        failure, which is rapid decline in people with chronic liver failure, also
        may have type C.
    - type: paragraph
      text: Acute hepatic encephalopathy comes on suddenly. Chronic hepatic encephalopathy
        is long-lasting. People who have hepatic encephalopathy may have a wide range
        of cognitive or mental changes, which range from barely noticeable to coma.
        When symptoms are noticeable, the condition is called overt hepatic encephalopathy.
        When symptoms are not noticeable, the condition is called covert encephalopathy.
    subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Common symptoms of hepatic encephalopathy include:'
  - type: list
    ordered: false
    items:
    - Trouble focusing or paying attention.
    - Not knowing where you are.
    - Sleepiness during the day or trouble sleeping at night.
    - Memory loss or confusion.
    - Flapping tremor in the limbs.
    - Personality or mood changes.
    - Slurred speech or movement.
    - Falling into a coma .
  - type: paragraph
    text: Over time, the symptoms of hepatic encephalopathy can lead to a lower quality
      of life and ability to function. Having other chronic conditions besides hepatic
      encephalopathy may make daily life even harder.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If you or someone with liver disease has sudden confusion, cannot wake
        up or displays unusual behavior, call your healthcare professional or go to
        a hospital emergency room right away.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Hepatic encephalopathy is caused by a buildup of toxins, especially ammonia,
      when the liver can''t filter waste from the blood. This buildup may result from:'
  - type: list
    ordered: false
    items:
    - Alcohol use and conditions that arise from it, such as cirrhosis.
    - Imbalances of electrolytes in the body, such as a low potassium or low sodium
      level.
    - Infections.
    - Bleeding in the digestive tract.
    - Complications from a liver transplant.
    - Surgery placing shunts in the liver to improve blood flow.
  - type: paragraph
    text: 'Other factors that may cause hepatic encephalopathy include:'
  - type: list
    ordered: false
    items:
    - Certain medicines, such as diuretics, opioids and sedatives.
    - Dehydration arising from vomiting, diarrhea or other causes.
    - Constipation .
    - Older age.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'You''re more likely to develop hepatic encephalopathy if you have:'
  - type: list
    ordered: false
    items:
    - Diabetes .
    - Advanced liver disease, such as cirrhosis.
    - Kidney disease .
    - Epilepsy .
    - Low muscle mass, sometimes called sarcopenia.
    - Large portosystemic shunts in your liver.
    - Low sodium or high ammonia levels in your blood.
    - Certain genetic risk factors.
  - type: paragraph
    text: 'You''re also at higher risk of hepatic encephalopathy if you:'
  - type: list
    ordered: false
    items:
    - Are an older adult.
    - Drink alcohol.
    - Have poor eating habits.
    - Take diuretics, proton-pump inhibitors, opioids or benzodiazepine medicines.
    - Have a history of hepatic encephalopathy.
  - type: paragraph
    text: Your healthcare professional may tell you about other risk factors based
      on your health or lifestyle.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Some complications from hepatic encephalopathy may be very serious. Common
      complications include:'
  - type: list
    ordered: false
    items:
    - Trouble with daily life or work.
    - Falls and injuries.
    - Lasting memory and attention problems.
    - Trouble driving a car.
    - Sleep disturbances.
    - Hospitalizations.
    - Coma.
    - Death.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'It''s possible to reduce your chances of getting hepatic encephalopathy
      by taking care of your health. Some ways to prevent hepatic encephalopathy include:'
  - type: list
    ordered: false
    items:
    - Take prescription medicines as prescribed.
    - Eat protein from plants and dairy.
    - Avoid alcohol and sedating medicines.
    - Avoid opioids.
    - Stay hydrated.
    - Prevent constipation.
    - Treat infections as soon as they appear.
    - Get regular checkups for liver disease.
  subsections: []
