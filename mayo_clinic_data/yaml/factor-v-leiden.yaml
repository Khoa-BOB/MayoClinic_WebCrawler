title: Factor V Leiden
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Factor V Leiden (FAK-tur five LIDE-n) is a mutation of one of the clotting
      factors in the blood. This mutation can increase your chance of developing abnormal
      blood clots, most commonly in your legs or lungs.
  - type: paragraph
    text: Most people with factor V Leiden never develop abnormal clots. But in people
      who do, these abnormal clots can lead to long-term health problems or become
      life-threatening.
  - type: paragraph
    text: Both men and women can have factor V Leiden. Women who carry the factor
      V Leiden mutation may have an increased tendency to develop blood clots during
      pregnancy or when taking the hormone estrogen.
  - type: paragraph
    text: If you have factor V Leiden and have developed blood clots, anticoagulant
      medications can lessen your risk of developing additional blood clots and help
      you avoid potentially serious complications.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: The factor V Leiden mutation does not itself cause any symptoms. Since factor
      V Leiden is a risk for developing blood clots in the leg or lungs, the first
      indication that you have the disorder may be the development of an abnormal
      blood clot.
  - type: paragraph
    text: Some clots do no damage and disappear on their own. Others can be life-threatening.
      Symptoms of a blood clot depend on what part of your body is affected.
  subsections:
  - heading: A clot in a deep vein
    level: 3
    content:
    - type: paragraph
      text: 'This is known as deep vein thrombosis (DVT), which most commonly occurs
        in the legs. A DVT may not cause any symptoms. If signs and symptoms do occur,
        they can include:'
    - type: list
      ordered: false
      items:
      - Pain
      - Swelling
      - Redness
      - Warmth
    subsections: []
  - heading: A clot that travels to your lungs
    level: 3
    content:
    - type: paragraph
      text: 'Known as a pulmonary embolism, this occurs when a portion of a DVT breaks
        free and travels through the right side of your heart to your lung, where
        it blocks blood flow. This can be a life-threatening situation. Signs and
        symptoms may include:'
    - type: list
      ordered: false
      items:
      - Sudden shortness of breath
      - Chest pain when breathing in
      - A cough that produces bloody or blood-streaked sputum
      - Rapid heartbeat
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Seek medical attention immediately if you have signs or symptoms of either
        a DVT or a pulmonary embolism.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: If you have factor V Leiden, you inherited either one copy or, rarely, two
      copies of the defective gene. Inheriting one copy slightly increases your risk
      of developing blood clots. Inheriting two copies — one from each parent — significantly
      increases your risk of developing blood clots.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: A family history of factor V Leiden increases your risk of inheriting the
      disorder. The disorder is most common in people who are white and of European
      descent.
  - type: paragraph
    text: 'People who have inherited factor V Leiden from only one parent have a 5
      percent chance of developing an abnormal blood clot by age 65. Factors that
      increase this risk include:'
  - type: list
    ordered: false
    items:
    - Two faulty genes. Inheriting the genetic mutation from both parents instead
      of just one can significantly increase your risk of abnormal blood clots.
    - Immobility. Extended periods of immobility, such as sitting during a long airplane
      flight, can increase the risk of leg clots.
    - Estrogens. Oral contraceptives, hormone replacement therapy and pregnancy can
      make you more likely to develop blood clots.
    - Surgeries or injuries. Surgeries or injuries such as broken bones can increase
      your risk of abnormal blood clots.
    - Non-O blood type. Abnormal blood clots are more common in people who have blood
      types of A, B or AB compared with those with blood type O.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Factor V Leiden can cause blood clots in the legs (deep vein thrombosis)
      and lungs (pulmonary embolism). These blood clots can be life-threatening.
  subsections: []
