title: Aortic valve disease
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Aortic valve disease is a type of heart valve disease. In this condition,
      the valve between the lower left heart chamber and the body's main artery doesn't
      work properly.
  - type: paragraph
    text: The aortic valve helps keep blood flowing in the correct direction through
      the heart. A damaged or diseased aortic valve can affect blood flow to the rest
      of the heart and body.
  - type: paragraph
    text: 'Aortic valve disease includes:'
  - type: list
    ordered: false
    items:
    - Aortic valve stenosis. Each heart valve has flaps of tissue that open and close
      once per heartbeat. The flaps also are called cusps. Sometimes the aortic valve
      flaps become thick and stiff, or they connect together. These problems cause
      the valve opening to become narrow. The narrowed valve reduces or blocks blood
      flow from the heart to the rest of the body.
    - Aortic valve regurgitation. The aortic valve doesn't close properly, causing
      blood to flow backward into the left lower heart chamber.
  - type: paragraph
    text: A person may be born with aortic valve disease. This is called a congenital
      heart defect. Sometimes aortic valve disease occurs later in life due to other
      health conditions.
  - type: paragraph
    text: Treatment for aortic valve disease depends on the type and severity of disease.
      Some people may need surgery to repair or replace the aortic valve.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Some people with aortic valve disease may not notice symptoms for many
      years. Symptoms of aortic valve disease may include:'
  - type: list
    ordered: false
    items:
    - Chest pain or tightness.
    - Dizziness.
    - Fainting.
    - Fatigue after activity or having less ability to be active.
    - Irregular heartbeat.
    - Shortness of breath, particularly during vigorous activity or when lying down.
    - Not eating enough. This is mainly seen in children with aortic valve stenosis.
    - Not gaining enough weight. This is mainly seen in children with aortic valve
      stenosis.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If you're having sudden chest pain, call 911 or your local emergency number.
    - type: paragraph
      text: Make an appointment for a health checkup if you have symptoms of aortic
        valve disease, such as shortness of breath, fatigue after activity, or sensations
        of a pounding or an irregular heartbeat. Sometimes the first symptoms of aortic
        valve disease are related to heart failure. Get a health checkup if you have
        fatigue that doesn't get better with rest, shortness of breath, and swollen
        ankles and feet, which are common symptoms of heart failure.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Aortic valve disease may be caused by a heart problem present at birth,
      called a congenital heart defect. Other causes of aortic valve disease later
      in life include:'
  - type: list
    ordered: false
    items:
    - Age-related changes to the heart.
    - Infections.
    - High blood pressure.
    - Injury to the heart.
  - type: paragraph
    text: To better understand the causes of aortic valve disease, it may be helpful
      to know how the heart valves typically work.
  - type: paragraph
    text: 'The heart has four valves that keep blood flowing in the correct direction.
      These valves are:'
  - type: list
    ordered: false
    items:
    - Aortic valve.
    - Mitral valve.
    - Tricuspid valve.
    - Pulmonary valve.
  - type: paragraph
    text: Each valve has flaps, also called cusps or leaflets, that open and close
      once during each heartbeat.
  - type: paragraph
    text: In aortic valve disease, the valve between the lower left heart chamber
      and the body's main artery doesn't work properly. The lower left heart chamber
      is called the left ventricle. The body's main artery is called the aorta.
  - type: paragraph
    text: The valve may become thick and stiff or the valve may not close properly.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Many things can raise the risk of aortic valve disease, including:'
  - type: list
    ordered: false
    items:
    - Older age. Calcium can build up on the aortic valve as people age, causing the
      aortic valve to stiffen and become narrow.
    - Heart valve problems present at birth, called congenital heart defects. Some
      people are born with a missing, extra or fused valve flap. This increases the
      risk of aortic valve regurgitation.
    - Rheumatic fever. This complication of strep throat can cause aortic stenosis,
      a type of heart valve disease. If you have heart valve disease due to rheumatic
      fever, it's called rheumatic heart disease. If not, it's called nonrheumatic
      heart disease.
    - Inflammation of the lining of the heart's chambers and valves, called endocarditis.
      This life-threatening condition is usually caused by infection. It can damage
      the aortic valve.
    - History of radiation therapy to the chest. Some types of cancer are treated
      with radiation therapy. Symptoms of heart valve disease may not be noticed until
      many years after radiation therapy is received.
    - Other health conditions. Chronic kidney disease, lupus and Marfan syndrome,
      a connective tissue disease, can increase the risk of aortic stenosis or regurgitation.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Potential complications of aortic valve disease may include:'
  - type: list
    ordered: false
    items:
    - Blood clots.
    - Stroke.
    - Heart failure.
    - Heart rhythm problems, called arrhythmias.
    - Death due to sudden cardiac arrest.
  - type: paragraph
    text: Proper diagnosis and treatment can help reduce the risk of complications.
  subsections: []
