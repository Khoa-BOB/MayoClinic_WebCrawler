title: Esophageal spasms
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Esophageal spasms are painful contractions in the muscular tube connecting
      the mouth and stomach, called the esophagus. Esophageal spasms can feel like
      sudden, bad chest pain that lasts from a few minutes to hours. Some people may
      mistake it for heart pain, also called angina.
  - type: paragraph
    text: Esophageal spasms usually happen only now and then, and they might not need
      treatment. But sometimes the spasms happen a lot and can prevent food and liquids
      from traveling through the esophagus. If esophageal spasms affect the ability
      to eat or drink, treatments are available.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of esophageal spasms include:'
  - type: list
    ordered: false
    items:
    - Squeezing pain in the chest. The pain is often intense and might be mistaken
      for heart pain or heartburn.
    - Difficulty swallowing solids and liquids, sometimes related to swallowing specific
      substances. Red wine or extremely hot or cold liquids are more common culprits.
    - The feeling that an object is stuck in the throat.
    - The return of food and liquids back up the esophagus, also called regurgitation.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: The squeezing chest pain that happens with esophageal spasms also can
        be caused by a heart attack. If you have squeezing chest pain, seek medical
        care right away.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: It's not clear what causes esophageal spasms. However, they appear to be
      related to abnormal functioning of nerves that control the muscles used when
      swallowing.
  - type: paragraph
    text: A healthy esophagus moves food into the stomach through a series of coordinated
      muscle contractions. Esophageal spasms make it difficult for the muscles in
      the walls of the lower esophagus to coordinate. This makes it harder for the
      muscles to move food to the stomach.
  - type: paragraph
    text: There are two types of esophageal spasms — distal esophageal spasm and hypercontractile
      esophagus, also known as nutcracker esophagus.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk factors for esophageal spasms include:'
  - type: list
    ordered: false
    items:
    - Sex. Women are more likely to have esophageal spasms than men.
    - Age. Esophageal spasms tend to happen around age 60.
  subsections: []
