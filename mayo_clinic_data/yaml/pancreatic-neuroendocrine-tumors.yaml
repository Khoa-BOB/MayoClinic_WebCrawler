title: Pancreatic neuroendocrine tumors
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Pancreatic neuroendocrine tumors are a rare type of cancer that starts as
      a growth of cells in the pancreas. The pancreas is a long, flat gland that sits
      behind the stomach. It makes enzymes and hormones that help digest food.
  - type: paragraph
    text: Pancreatic neuroendocrine tumors start from the hormone-producing cells
      in the pancreas. These cells are called islet cells. Another term for pancreatic
      neuroendocrine tumor is islet cell cancer.
  - type: paragraph
    text: Some pancreatic neuroendocrine tumor cells keep making hormones. These are
      known as functional tumors. Functional tumors create too much of the given hormone.
      Examples of functional tumors include insulinoma, gastrinoma and glucagonoma.
  - type: paragraph
    text: Most pancreatic neuroendocrine tumors do not produce an excess amount of
      hormones. Tumors that don't produce extra hormones are called nonfunctional
      tumors.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Pancreatic neuroendocrine tumors sometimes don''t cause symptoms. When
      they do, symptoms can include:'
  - type: list
    ordered: false
    items:
    - Heartburn.
    - Weakness.
    - Fatigue.
    - Muscle cramps.
    - Indigestion.
    - Diarrhea.
    - Weight loss.
    - Skin rash.
    - Constipation.
    - Pain in the abdomen or back.
    - Yellowing of the skin and the whites of the eyes.
    - Dizziness.
    - Blurred vision.
    - Headaches.
    - Increased thirst and hunger.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with a health care professional if you have any symptoms
        that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Pancreatic neuroendocrine tumors happen when cells in the pancreas develop
      changes in their DNA. A cell's DNA holds the instructions that tell the cell
      what to do. The changes, which doctors call mutations, tell the cells to multiply
      quickly. The changes let the cells continue living when healthy cells would
      die as part of their natural life cycle. This causes many extra cells. The cells
      might form a mass called a tumor. Sometimes the cells can break away and spread
      to other organs, such as the liver. When cancer spreads, it's called metastatic
      cancer.
  - type: paragraph
    text: In pancreatic neuroendocrine tumors, the DNA changes happen in hormone-producing
      cells called islet cells. It's not clear what causes the changes that lead to
      cancer.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that are associated with an increased risk of pancreatic neuroendocrine
      tumors include:'
  - type: list
    ordered: false
    items:
    - A family history of pancreatic neuroendocrine tumors. If a family member was
      diagnosed with pancreatic neuroendocrine tumor, your risk is increased.
    - Syndromes present at birth that increase the risk of tumors. Some syndromes
      that are passed from parents to children can increase the risk of pancreatic
      neuroendocrine tumors. Examples of these include multiple endocrine neoplasia,
      type 1 (MEN 1), von Hippel-Lindau (VHL) disease, neurofibromatosis 1 (NF1) and
      tuberous sclerosis. These inherited syndromes are caused by changes in the DNA.
      These changes allow cells to grow and divide more than needed.
  - type: paragraph
    text: There's no way to prevent pancreatic neuroendocrine tumors. If you develop
      this type of cancer, you didn't do anything to cause it.
  subsections: []
