title: Hemolytic uremic syndrome (HUS)
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Hemolytic uremic syndrome, also called HUS, is a condition that can happen
      when small blood vessels become damaged and inflamed. This damage can cause
      clots to form in the vessels all through the body. The clots may damage the
      kidneys and other organs. Hemolytic uremic syndrome can lead to kidney failure,
      which can be life-threatening.
  - type: paragraph
    text: Anyone can get hemolytic uremic syndrome. But it's most common in young
      children. Most often, infection with certain strains of Escherichia coli (E.
      coli) bacteria is the cause.
  - type: paragraph
    text: Other infections, certain medicines or conditions such as pregnancy, cancer
      or autoimmune diseases can cause hemolytic uremic syndrome. It also can be the
      result of certain gene changes.
  - type: paragraph
    text: Hemolytic uremic syndrome is serious. But treating it in time leads to a
      full recovery for most people, especially young children.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'The symptoms of hemolytic uremic syndrome vary, depending on the cause.
      The first symptoms of hemolytic uremic syndrome caused by E. coli bacteria might
      include:'
  - type: list
    ordered: false
    items:
    - Diarrhea, which is often bloody.
    - Pain, cramping or bloating in the stomach area.
    - Fever.
    - Vomiting.
  - type: paragraph
    text: All forms of hemolytic uremic syndrome damage blood vessels. This damage
      causes red blood cells to break down, called anemia. The condition also causes
      blood clots to form in the blood vessels. These blood clots can damage the kidneys.
  - type: paragraph
    text: 'Symptoms of these changes include:'
  - type: list
    ordered: false
    items:
    - Loss of color in the skin.
    - Extreme tiredness.
    - Easy bruising.
    - Unusual bleeding, such as bleeding from the nose and mouth.
    - Decreased urinating or blood in the urine.
    - Swelling, called edema, of the legs, feet or ankles. Swelling happens less often
      in the face, hands, feet or entire body.
    - Confusion, seizures or stroke.
    - High blood pressure.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'See a member of your healthcare team right away if you or your child
        has bloody diarrhea or several days of diarrhea followed by:'
    - type: list
      ordered: false
      items:
      - Urinating less.
      - Swelling.
      - Bruising.
      - Unusual bleeding.
      - Extreme tiredness.
    - type: paragraph
      text: Seek emergency care if you or your child doesn't urinate for 12 hours
        or more.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The most common cause of hemolytic uremic syndrome is infection with certain
      strains of E. coli bacteria. This is especially true for children under age
      5. Some of the E. coli strains make a toxin called Shiga toxin. These strains
      are called Shiga toxin-producing E. coli, also called STEC.
  - type: paragraph
    text: Most of the hundreds of types of E. coli are typical and harmless. But some
      strains of E. coli can lead to hemolytic uremic syndrome.
  - type: paragraph
    text: 'Other causes of hemolytic uremic syndrome can include:'
  - type: list
    ordered: false
    items:
    - Other infections. This can include infection with pneumococcal bacteria, human
      immunodeficiency virus, also called HIV, or a flu virus.
    - Certain medicines. These can include some of the medicines used to treat cancer
      and some medicines used to keep people who receive donor organs from rejecting
      the organs.
    - Complications of other conditions. Rarely, these conditions can include pregnancy
      or conditions such as autoimmune disease or cancer.
  - type: paragraph
    text: An uncommon type of the condition, called atypical hemolytic uremic syndrome,
      can be passed down through families. People who inherit the gene that causes
      this form of hemolytic uremic syndrome don't always get the condition. But an
      infection, the use of certain medicines or ongoing health conditions can start
      hemolytic uremic syndrome in people with the gene.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Hemolytic uremic syndrome caused by E.coli can occur if you:'
  - type: list
    ordered: false
    items:
    - Eat meat, fruit or vegetables with the bacteria.
    - Swim in pools or lakes that have feces with the bacteria.
    - Have close contact with an infected person.
  - type: paragraph
    text: 'The risk of getting hemolytic uremic syndrome is highest for:'
  - type: list
    ordered: false
    items:
    - Children 5 or younger.
    - People who have weakened immune systems.
    - People with certain gene changes.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Hemolytic uremic syndrome can cause life-threatening complications, including:'
  - type: list
    ordered: false
    items:
    - Kidney failure, which can be sudden, called acute, or happen over time, called
      chronic.
    - High blood pressure.
    - Stroke or seizures.
    - Coma.
    - Clotting issues, which can lead to bleeding.
    - Heart issues.
    - Digestive tract issues, such as problems with the intestines, gallbladder or
      pancreas.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'Meat or produce that has E. coli won''t always look, feel or smell bad.
      To protect against E. coli infection and other illnesses from foods:'
  - type: list
    ordered: false
    items:
    - Don't drink milk, juice or cider that isn't processed to make it safe to drink,
      called pasteurized.
    - Wash hands well before eating and after using the restroom and changing diapers.
    - Clean utensils and food surfaces often.
    - Cook meat to an inside temperature of at least 160 degrees Fahrenheit (71 degrees
      Celsius).
    - Defrost meat in the microwave or refrigerator, not on the counter.
    - Keep raw foods separate from other foods. Don't put cooked meat on plates that
      had raw meat on them.
    - Store meat below produce in the refrigerator to cut the risk of liquids such
      as blood dripping on produce.
    - Stay away from unclean swimming areas. Don't swim if you have diarrhea.
  subsections: []
