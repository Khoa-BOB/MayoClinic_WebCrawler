title: Lichen sclerosus
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Lichen sclerosus (LIE-kun skluh-ROW-sus) is a condition that causes patchy,
      discolored, thin skin. It usually affects the genital and anal areas.
  - type: paragraph
    text: Anyone can get lichen sclerosus but postmenopausal women are at higher risk.
      It isn't contagious and can't be spread through sexual contact.
  - type: paragraph
    text: Treatment is usually a medicated ointment. This treatment helps return the
      skin to its usual color and reduces the risk of scarring. Even if your symptoms
      clear up, they tend to come back. So you'll likely need long-term follow-up
      care.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'It''s possible to have mild lichen sclerosus with no symptoms. When symptoms
      do occur, they usually affect the skin of the genital and anal areas. The back,
      shoulders, upper arms and breasts may also be affected. Symptoms may include:'
  - type: list
    ordered: false
    items:
    - Smooth discolored skin patches
    - Blotchy, wrinkled skin patches
    - Itching
    - Soreness or a burning feeling
    - Easy bruising
    - Fragile skin
    - Changes in the tube for urine flow (urethra)
    - Bleeding, blistering or open sores
    - Painful sex
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See your health care provider if you have symptoms of lichen sclerosus.
    - type: paragraph
      text: If you've already been diagnosed with lichen sclerosus, see your health
        care provider every 6 to 12 months. These visits are important to check for
        any skin changes or side effects of treatment.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The exact cause of lichen sclerosus isn't known. It's likely a combination
      of factors, including an overactive immune system, your genetic makeup, and
      previous skin damage or irritation.
  - type: paragraph
    text: Lichen sclerosus isn't contagious and can't be spread through sexual contact.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Anyone can get lichen sclerosus, but the risk is higher for:'
  - type: list
    ordered: false
    items:
    - Postmenopausal women
    - Children younger than 10 years old
    - Women who have another autoimmune disease, such as forms of low thyroid function
      (hypothyroidism)
    - Men with urinary incontinence or an uncircumcised penis
    - People with a family history of the disease
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Complications of lichen sclerosus include painful sex and scarring, including
      covering of the clitoris. Scarring of the penis can cause painful erection,
      poor urine flow and an inability to retract the foreskin.
  - type: paragraph
    text: People with vulvar lichen sclerosus are also at an increased risk of squamous
      cell carcinoma.
  - type: paragraph
    text: In children, constipation is a common complication.
  subsections: []
