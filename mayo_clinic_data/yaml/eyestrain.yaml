title: Eyestrain
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Eyestrain is a common condition that occurs when your eyes get tired from
      intense use, such as while driving long distances or staring at computer screens
      and other digital devices.
  - type: paragraph
    text: Eyestrain can be annoying. But it usually isn't serious, and it goes away
      once you rest your eyes or take other steps to reduce your eye discomfort. In
      some cases, symptoms of eyestrain can indicate an underlying eye condition that
      needs treatment.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Eyestrain symptoms include:'
  - type: list
    ordered: false
    items:
    - Sore, tired, burning or itching eyes
    - Watery or dry eyes
    - Blurred or double vision
    - Headache
    - Sore neck, shoulders or back
    - Increased sensitivity to light, called photophobia
    - Difficulty concentrating
    - Feeling that you cannot keep your eyes open
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See an eye specialist if self-care steps don't relieve your eyestrain.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Common causes of eyestrain include:'
  - type: list
    ordered: false
    items:
    - Looking at digital device screens
    - Reading without pausing to rest your eyes
    - Driving long distances and doing other activities involving focusing for a long
      time
    - Being exposed to bright light or glare
    - Straining to see in very dim light
    - Having an underlying eye problem, such as dry eyes or uncorrected vision, called
      refractive error
    - Being stressed or fatigued
    - Being exposed to dry moving air from a fan, a heating system or an air-conditioning
      system
  subsections:
  - heading: Computer and digital device use
    level: 3
    content:
    - type: paragraph
      text: Extended use of computers and other digital devices is one of the most
        common causes of eyestrain. The American Optometric Association calls this
        computer vision syndrome. It's also called digital eyestrain. People who look
        at screens two or more hours in a row every day have the greatest risk of
        this condition.
    - type: paragraph
      text: 'Computer use strains eyes more than reading print material because people
        tend to:'
    - type: list
      ordered: false
      items:
      - Blink less while using computers, and blinking is key to moistening the eyes
      - View digital screens at less than ideal distances or angles
      - Use devices that have glare or reflection
      - Use devices with poor contrast between the text and the background
    - type: paragraph
      text: In some cases, an underlying eye problem, such as eye muscle imbalance
        or uncorrected vision, can cause or worsen computer vision syndrome.
    - type: paragraph
      text: 'Some other factors that can make the condition worse include:'
    - type: list
      ordered: false
      items:
      - Glare on the screen
      - Poor posture
      - Setup of a computer workstation
      - Circulating air, such as from air conditioning or a nearby fan
    subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Eyestrain doesn't have serious or long-term consequences, but it can be
      aggravating and unpleasant. It can make you tired and reduce your ability to
      concentrate.
  subsections: []
