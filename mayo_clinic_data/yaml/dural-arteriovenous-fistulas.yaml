title: Dural arteriovenous fistulas
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Dural arteriovenous fistulas (dAVFs) are irregular connections between arteries
      and veins. They occur in the tough covering over the brain or spinal cord, known
      as the dura mater. The irregular passageways between arteries and veins are
      called arteriovenous fistulas, which can lead to bleeding in the brain or other
      serious symptoms.
  - type: paragraph
    text: Dural AVFs are rare. They tend to occur between ages 50 and 60. They are
      not typically genetic, so children are not more likely to develop a dAVF if
      their parent has one.
  - type: paragraph
    text: Although some dAVFs stem from known causes, most often the cause is not
      known. It's thought that dAVFs involving large brain veins form when one of
      the brain's venous sinuses narrows or becomes blocked. Venous sinuses are channels
      that route circulated blood from the brain back to the heart.
  - type: paragraph
    text: Treatment for dAVF usually involves an endovascular procedure or stereotactic
      radiosurgery to block the blood flow to the dAVF . Or surgery may be needed
      to disconnect or remove the dAVF .
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Some people with dural arteriovenous fistulas (dAVFs) may not have symptoms.
      When symptoms occur, they may be characterized as benign or aggressive. An aggressive
      dAVF has more-serious symptoms.
  - type: paragraph
    text: Aggressive dAVF symptoms can result from bleeding in the brain, known as
      intracerebral hemorrhage. Bleeding in the brain often causes a sudden headache.
      It also may cause other symptoms based on the location and size of the hemorrhage.
  - type: paragraph
    text: Aggressive symptoms also may result from nonhemorrhagic neurological deficits
      (NHNDs), which can include seizures or changes in mental abilities. These symptoms
      usually develop more gradually, over days to weeks. Symptoms are typically related
      to the area of the brain affected.
  - type: paragraph
    text: 'Aggressive symptoms can include:'
  - type: list
    ordered: false
    items:
    - Sudden headache.
    - Trouble walking and falls.
    - Seizures.
    - Speech or language issues.
    - Facial pain.
    - Dementia.
    - Slowed movement, stiffness and tremor, known as parkinsonism.
    - Trouble with coordination.
    - Burning or prickling sensations.
    - Weakness.
    - Lack of interest, known as apathy.
    - Failure to thrive.
    - Symptoms related to increased pressure, such as headaches, nausea and vomiting.
  - type: paragraph
    text: 'Other dAVF symptoms can include hearing issues. People with hearing symptoms
      may hear a rhythmic sound in the ear that occurs with the heartbeat, known as
      pulsatile tinnitus. Symptoms also may include trouble with vision, such as:'
  - type: list
    ordered: false
    items:
    - Vision changes.
    - Eye bulge.
    - Swelling in the eye lining.
    - Paralysis of a muscle in or around the eye.
  - type: paragraph
    text: Rarely, dementia may occur due to increased pressure in the blood vessels
      in the brain.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with your healthcare professional if you have any
        symptoms that are not usual or that worry you.
    - type: paragraph
      text: 'Seek medical help immediately if you experience a seizure or symptoms
        that suggest brain hemorrhage, such as:'
    - type: list
      ordered: false
      items:
      - Sudden, severe headache.
      - Nausea.
      - Vomiting.
      - Weakness or numbness on one side of the body.
      - Trouble speaking or understanding speech.
      - Loss of vision.
      - Double vision.
      - Trouble with balance.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Most dural arteriovenous fistulas (dAVFs) have no clear origin. But some
      result from a traumatic head injury, infection, previous brain surgery, blood
      clots in deep veins or tumors.
  - type: paragraph
    text: Most experts think that dAVFs involving larger brain veins occur from the
      narrowing or blockage of one of the brain's venous sinuses. The venous sinuses
      are channels in the brain that route circulated blood from the brain back to
      the heart.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Risk factors of dural arteriovenous fistulas (dAVFs) include being inclined
      to blood clots in the vein, known as vein thrombosis. Changes in the way the
      blood clots may increase the risk of a blockage or narrowing of the venous sinuses.
  - type: paragraph
    text: Most often, dAVFs affect people between ages 50 and 60. But they can occur
      in people at younger ages, including in children.
  - type: paragraph
    text: Research has found that noncancerous tumors found in the membranes that
      surround the brain and spinal cord may be associated with dAVFs .
  subsections: []
