title: Head and neck cancers
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Head and neck cancers are cancers that start in the head and neck area.
      There are many kinds of cancer that can happen in the head and neck. Each kind
      begins as a growth of cells that can invade and destroy healthy body tissue.
  - type: paragraph
    text: Head and neck cancer often refers to cancers that start in the mouth, throat,
      sinuses and salivary glands. But other cancers can happen in the head and neck
      and are sometimes considered part of this category too.
  - type: paragraph
    text: Head and neck cancer isn't a diagnosis. Instead, it's a category of cancers
      that have some things in common. For example, many head and neck cancers share
      some risk factors and treatments. Most head and neck cancers begin in squamous
      cells. These thin, flat cells make up the outer layer of the skin. They also
      line the inside of the nose, mouth and throat. Cancers that begin in the squamous
      cells are called squamous cell carcinomas. Cancers can begin in other kinds
      of cells in the head and neck area, though these are less common.
  - type: paragraph
    text: Which treatment you'll have for your head and neck cancer depends on many
      factors. These might include the location of the cancer, its size and the type
      of cells involved. Your healthcare team also considers your overall health.
      Treatment options might include surgery, radiation therapy, chemotherapy and
      others.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Head and neck cancer symptoms may include a sore in the mouth and pain when
      swallowing. Symptoms might depend on where the cancer starts. Head and neck
      cancers include cancers that start in the mouth, throat, sinuses and salivary
      glands.
  - type: paragraph
    text: 'Symptoms in the mouth and throat:'
  - type: list
    ordered: false
    items:
    - A lump in the neck that you might be able to feel through the skin. Typically
      the lump isn't painful.
    - A sore in the mouth that won't heal.
    - Coughing up blood.
    - Hoarse voice.
    - Loose teeth.
    - Pain when swallowing.
  - type: paragraph
    text: 'Symptoms in the nose:'
  - type: list
    ordered: false
    items:
    - Nosebleeds.
    - Stuffy or blocked nose that doesn't go away.
  - type: paragraph
    text: 'Other symptoms:'
  - type: list
    ordered: false
    items:
    - A sore on the skin of the face, neck or lips that doesn't heal.
    - Ear pain.
    - Losing weight without trying.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with a doctor or other healthcare professional if
        you have any symptoms that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Experts aren't certain exactly what causes head and neck cancers. What causes
      a cancer may depend on where the cancer starts. Head and neck cancers include
      cancers that start in the mouth, throat, sinuses and salivary glands.
  - type: paragraph
    text: In general, head and neck cancer starts when a cell in the head and neck
      area develops changes in its DNA. A cell's DNA holds the instructions that tell
      a cell what to do. In healthy cells, the DNA gives instructions to grow and
      multiply at a set rate. The instructions tell the cells to die at a set time.
      In cancer cells, the changes give different instructions. The changes tell the
      cancer cells to make many more cells quickly. Cancer cells can keep living when
      healthy cells would die. This causes too many cells.
  - type: paragraph
    text: The cancer cells might form a mass called a tumor. The tumor can grow to
      invade and destroy healthy body tissue. In time, cancer cells can break away
      and spread to other parts of the body. When cancer spreads, it's called metastatic
      cancer.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Head and neck cancers have some risk factors in common. These include using
      tobacco and drinking alcohol. Other risk factors depend on the location of the
      cancer. Head and neck cancers include cancers that start in the mouth, throat,
      sinuses and salivary glands.
  - type: paragraph
    text: 'In general, things that increase the risk of head and neck cancers include:'
  - type: list
    ordered: false
    items:
    - Using tobacco. Using tobacco of any kind increases the risk of many types of
      head and neck cancer. Examples of kinds of tobacco include cigarettes, cigars,
      pipes, chewing tobacco and snuff.
    - Drinking alcohol. Frequent and heavy drinking increases the risk of many types
      of head and neck cancer.
    - Being exposed to human papillomavirus, also called HPV. HPV is a common virus
      that's passed through sexual contact. For most people, it causes no problems
      and goes away on its own. For others, it can cause changes in cells that can
      lead to many types of cancer. Many throat cancers are thought to be caused by
      HPV.
    - Breathing chemicals in the air. Exposure to chemicals in the air can increase
      the risk of cancer in the nose and sinuses. Chemicals at home and at work can
      increase the risk.
    - Being exposed to the sun or tanning lamps. Ultraviolet light from the sun increases
      the risk of skin cancer of the head and neck. Ultraviolet light also can come
      from the lights used in tanning beds.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: To help prevent head and neck cancers, don't smoke and limit the amount
      of alcohol you drink. Other steps you can take may depend on the specific type
      of cancer. Head and neck cancers include cancers that start in the mouth, throat,
      sinuses and salivary glands.
  - type: paragraph
    text: 'To lower the risk of head and neck cancer:'
  subsections:
  - heading: Don't use tobacco
    level: 3
    content:
    - type: paragraph
      text: If you don't smoke or use other kinds of tobacco, don't start. If you
        do use tobacco, make a plan to quit. Talk with a healthcare professional about
        things that can help you quit.
    subsections: []
  - heading: Drink alcohol in moderation, if at all
    level: 3
    content:
    - type: paragraph
      text: If you choose to drink alcohol, do so in moderation. For healthy adults,
        that means up to one drink a day for women and up to two drinks a day for
        men.
    subsections: []
  - heading: Ask about the HPV vaccine
    level: 3
    content:
    - type: paragraph
      text: Receiving a vaccination to prevent HPV infection may reduce the risk of
        HPV-related cancers. Ask a healthcare professional whether the HPV vaccine
        is right for you.
    subsections: []
  - heading: Protect your head and neck from the sun
    level: 3
    content:
    - type: paragraph
      text: Wear a hat with a wide brim to shade your head and neck. Use a broad-spectrum
        sunscreen with an SPF of at least 30, even on cloudy days. Apply sunscreen
        generously. Reapply every two hours, or more often if you're swimming or sweating.
    subsections: []
