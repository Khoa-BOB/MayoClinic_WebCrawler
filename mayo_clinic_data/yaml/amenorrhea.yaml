title: Amenorrhea
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Amenorrhea (uh-men-o-REE-uh) is the absence of menstruation, often defined
      as missing one or more menstrual periods.
  - type: paragraph
    text: Primary amenorrhea refers to the absence of menstruation in someone who
      has not had a period by age 15. The most common causes of primary amenorrhea
      relate to hormone levels, although anatomical problems also can cause amenorrhea.
  - type: paragraph
    text: Secondary amenorrhea refers to the absence of three or more periods in a
      row by someone who has had periods in the past. Pregnancy is the most common
      cause of secondary amenorrhea, although problems with hormones also can cause
      secondary amenorrhea.
  - type: paragraph
    text: Treatment of amenorrhea depends on the underlying cause.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Depending on the cause of amenorrhea, you might experience other signs
      or symptoms along with the absence of periods, such as:'
  - type: list
    ordered: false
    items:
    - Milky nipple discharge
    - Hair loss
    - Headache
    - Vision changes
    - Excess facial hair
    - Pelvic pain
    - Acne
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Consult your doctor if you've missed at least three menstrual periods
        in a row, or if you've never had a menstrual period and you're age 15 or older.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Amenorrhea can occur for a variety of reasons. Some are normal, while others
      may be a side effect of medication or a sign of a medical problem.
  subsections:
  - heading: Natural amenorrhea
    level: 3
    content:
    - type: paragraph
      text: 'During the normal course of your life, you may experience amenorrhea
        for natural reasons, such as:'
    - type: list
      ordered: false
      items:
      - Pregnancy
      - Breastfeeding
      - Menopause
    subsections: []
  - heading: Contraceptives
    level: 3
    content:
    - type: paragraph
      text: Some people who take birth control pills (oral contraceptives) may not
        have periods. Even after stopping birth control pills, it may take some time
        before regular ovulation and menstruation return. Contraceptives that are
        injected or implanted also may cause amenorrhea, as can some types of intrauterine
        devices.
    subsections: []
  - heading: Medications
    level: 3
    content:
    - type: paragraph
      text: 'Certain medications can cause menstrual periods to stop, including some
        types of:'
    - type: list
      ordered: false
      items:
      - Antipsychotics
      - Cancer chemotherapy
      - Antidepressants
      - Blood pressure drugs
      - Allergy medications
    subsections: []
  - heading: Lifestyle factors
    level: 3
    content:
    - type: paragraph
      text: 'Sometimes lifestyle factors contribute to amenorrhea, for instance:'
    - type: list
      ordered: false
      items:
      - Low body weight. Excessively low body weight — about 10% under normal weight
        — interrupts many hormonal functions in the body, potentially halting ovulation.
        Women who have an eating disorder, such as anorexia or bulimia, often stop
        having periods because of these abnormal hormonal changes.
      - Excessive exercise. Women who participate in activities that require rigorous
        training, such as ballet, may find their menstrual cycles interrupted. Several
        factors combine to contribute to the loss of periods in athletes, including
        low body fat, stress and high energy expenditure.
      - Stress. Mental stress can temporarily alter the functioning of your hypothalamus
        — an area of your brain that controls the hormones that regulate your menstrual
        cycle. Ovulation and menstruation may stop as a result. Regular menstrual
        periods usually resume after your stress decreases.
    subsections: []
  - heading: Hormonal imbalance
    level: 3
    content:
    - type: paragraph
      text: 'Many types of medical problems can cause hormonal imbalance, including:'
    - type: list
      ordered: false
      items:
      - Polycystic ovary syndrome (PCOS). PCOS causes relatively high and sustained
        levels of hormones, rather than the fluctuating levels seen in the normal
        menstrual cycle.
      - Thyroid malfunction. An overactive thyroid gland (hyperthyroidism) or underactive
        thyroid gland (hypothyroidism) can cause menstrual irregularities, including
        amenorrhea.
      - Pituitary tumor. A noncancerous (benign) tumor in your pituitary gland can
        interfere with the hormonal regulation of menstruation.
      - Premature menopause. Menopause usually begins around age 50. But, for some
        women, the ovarian supply of eggs diminishes before age 40 and menstruation
        stops.
    subsections: []
  - heading: Structural problems
    level: 3
    content:
    - type: paragraph
      text: 'Problems with the sexual organs themselves also can cause amenorrhea.
        Examples include:'
    - type: list
      ordered: false
      items:
      - Uterine scarring. Asherman's syndrome, a condition in which scar tissue builds
        up in the lining of the uterus, can sometimes occur after a dilation and curettage
        (D&C), cesarean section or treatment for uterine fibroids. Uterine scarring
        prevents the normal buildup and shedding of the uterine lining.
      - Lack of reproductive organs. Sometimes problems arise during fetal development
        that lead to missing parts of the reproductive system, such as the uterus,
        cervix or vagina. Because the reproductive system didn't develop fully, menstrual
        cycles aren't possible later in life.
      - Structural abnormality of the vagina. An obstruction of the vagina may prevent
        visible menstrual bleeding. A membrane or wall may be present in the vagina
        that blocks the outflow of blood from the uterus and cervix.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that may increase your risk of amenorrhea include:'
  - type: list
    ordered: false
    items:
    - Family history. If other women in your family have experienced amenorrhea, you
      may have inherited a predisposition for the problem.
    - Eating disorders. If you have an eating disorder, such as anorexia or bulimia,
      you are at higher risk of developing amenorrhea.
    - Athletic training. Rigorous athletic training can increase your risk of amenorrhea.
    - History of certain gynecologic procedures. If you've had a D&C , especially
      related to pregnancy, or a procedure known as loop electrodiathermy excision
      procedure (LEEP), your risk of developing amenorrhea is higher.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'The causes of amenorrhea can cause other problems as well. These include:'
  - type: list
    ordered: false
    items:
    - Infertility and problems with pregnancy. If you don't ovulate and don't have
      menstrual periods, you can't become pregnant. When hormone imbalance is the
      cause of amenorrhea, this can also cause miscarriage or other problems with
      pregnancy.
    - Psychological stress. Not having periods when your peers are having theirs can
      be stressful, especially for young people who are transitioning into adulthood.
    - Osteoporosis and cardiovascular disease. These two problems can be caused by
      not having enough estrogen. Osteoporosis is a weakening of the bones. Cardiovascular
      disease includes heart attack and problems with the blood vessels and heart
      muscle.
    - Pelvic pain. If an anatomical problem is causing the amenorrhea, it may also
      cause pain in the pelvic area.
  subsections: []
