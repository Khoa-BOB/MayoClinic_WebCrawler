title: Ehlers-Danlos syndrome
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Ehlers-Danlos syndrome is a group of inherited disorders that affect your
      connective tissues — primarily your skin, joints and blood vessel walls. Connective
      tissue is a complex mixture of proteins and other substances that provide strength
      and elasticity to the underlying structures in your body.
  - type: paragraph
    text: People who have Ehlers-Danlos syndrome usually have overly flexible joints
      and stretchy, fragile skin. This can become a problem if you have a wound that
      requires stitches, because the skin often isn't strong enough to hold them.
  - type: paragraph
    text: A more severe form of the disorder, called vascular Ehlers-Danlos syndrome,
      can cause the walls of your blood vessels, intestines or uterus to rupture.
      Because vascular Ehlers-Danlos syndrome can have serious potential complications
      in pregnancy, you may want to talk to a genetic counselor before starting a
      family.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'There are many different types of Ehlers-Danlos syndrome, but the most
      common signs and symptoms include:'
  - type: list
    ordered: false
    items:
    - Overly flexible joints. Because the connective tissue that holds joints together
      is looser, your joints can move far past the normal range of motion. Joint pain
      and dislocations are common.
    - Stretchy skin. Weakened connective tissue allows your skin to stretch much more
      than usual. You may be able to pull a pinch of skin up away from your flesh,
      but it will snap right back into place when you let go. Your skin might also
      feel exceptionally soft and velvety.
    - Fragile skin. Damaged skin often doesn't heal well. For example, the stitches
      used to close a wound often will tear out and leave a gaping scar. These scars
      may look thin and crinkly.
  - type: paragraph
    text: Symptom severity can vary from person to person and depends on the specific
      type of Ehlers-Danlos syndrome that you have. The most common type is called
      hypermobile Ehlers-Danlos syndrome.
  subsections:
  - heading: Vascular Ehlers-Danlos syndrome
    level: 3
    content:
    - type: paragraph
      text: People who have vascular Ehlers-Danlos syndrome often share distinctive
        facial features of a thin nose, thin upper lip, small earlobes and prominent
        eyes. They also have thin, translucent skin that bruises very easily. In fair-skinned
        people, the underlying blood vessels are very visible through the skin.
    - type: paragraph
      text: Vascular Ehlers-Danlos syndrome can weaken your heart's largest artery
        (aorta), as well as the arteries to other regions of your body. A rupture
        of any of these larger blood vessels can be fatal. The vascular type can also
        weaken the walls of the uterus or large intestines — which also may rupture.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Different types of Ehlers-Danlos syndrome are associated with a variety
      of genetic causes, some of which are inherited and passed on from parent to
      child. If you have the most common form, hypermobile Ehlers-Danlos syndrome,
      there's a 50% chance that you'll pass on the gene to each of your children.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Complications depend on the types of signs and symptoms you have. For example,
      overly flexible joints can result in joint dislocations and early-onset arthritis.
      Fragile skin may develop prominent scarring.
  - type: paragraph
    text: People who have vascular Ehlers-Danlos syndrome are at risk of often fatal
      ruptures of major blood vessels. Some organs, such as the uterus and intestines,
      also may rupture. Pregnancy can increase the risk of a rupture in the uterus.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: If you have a personal or family history of Ehlers-Danlos syndrome and you're
      thinking about starting a family, you may benefit from talking to a genetic
      counselor — a health care professional trained to assess the risk of inherited
      disorders. Genetic counseling can help you understand the inheritance pattern
      of the type of Ehlers-Danlos syndrome that affects you and the risks it poses
      for your children.
  subsections: []
