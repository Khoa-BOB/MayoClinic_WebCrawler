title: Hangovers
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: A hangover is a group of unpleasant symptoms that can happen after drinking
      too much alcohol. As if feeling awful weren't bad enough, frequent hangovers
      also are linked with poor performance and conflict at home, school and work.
  - type: paragraph
    text: Generally, the more alcohol you drink, the more likely you are to have a
      hangover the next day. But there's no easy way to know how much you can safely
      drink and still avoid a hangover.
  - type: paragraph
    text: However unpleasant, most hangovers go away on their own, though they can
      last up to 24 hours. If you choose to drink alcohol, doing so responsibly can
      help you stay away from hangovers.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Hangover symptoms often begin when your blood alcohol content drops and
      is at or near zero. Symptoms are usually in full effect the morning after a
      night of heavy drinking. Depending on what and how much alcohol you drank, you
      may notice:'
  - type: list
    ordered: false
    items:
    - Extreme tiredness and weakness.
    - Thirst and dry mouth.
    - Headache and muscle aches.
    - Nausea, vomiting or belly pain.
    - Poor sleep or not getting enough sleep.
    - Low tolerance for light and sound.
    - Dizziness or a sense of the room spinning.
    - Shakiness and sweating.
    - Problems concentrating or thinking clearly.
    - Changes in mood, such as depression, anxiety and irritability.
    - Fast heartbeat.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Hangovers after a single night's drinking go away on their own. Talk with
        your healthcare professional if you're concerned that frequent heavy drinking
        may lead to serious problems, such as alcohol withdrawal.
    subsections: []
  - heading: When it's an emergency
    level: 3
    content:
    - type: paragraph
      text: More-serious symptoms from heavy drinking may be a sign of alcohol poisoning
        — a life-threatening emergency. Alcohol poisoning is a serious and sometimes
        deadly result of drinking large amounts of alcohol in a short period of time.
        Drinking too much too quickly can affect breathing, heart rate, body temperature
        and gag reflex. In some cases, this can lead to coma and death.
    - type: paragraph
      text: 'Call 911 or your local emergency number if a person who has been drinking
        shows symptoms of:'
    - type: list
      ordered: false
      items:
      - Confusion.
      - Vomiting.
      - Seizures.
      - Slow breathing — less than eight breaths a minute.
      - Irregular breathing — a gap of more than 10 seconds between breaths.
      - Damp or sweaty skin.
      - Blue or gray skin color due to low oxygen levels. Depending on skin color,
        these changes may be harder to see.
      - Slow heart rate.
      - Low body temperature.
      - Difficulty remaining conscious.
      - Passing out and not being able to be awakened.
    - type: paragraph
      text: A person who can't be awakened is at risk of dying. If you suspect that
        someone has alcohol poisoning — even if you don't see the classic symptoms
        — get medical help right away.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Hangovers are caused by drinking too much alcohol. A single alcoholic drink
      is enough to trigger a hangover for some people, while others may drink heavily
      and not have a hangover.
  - type: paragraph
    text: 'Several issues may contribute to a hangover. For example:'
  - type: list
    ordered: false
    items:
    - Alcohol causes the body to make more urine. You lose extra body liquid by urinating
      more than usual. This can lead to dehydration. Symptoms of dehydration include
      extra thirst, tiredness, headache, dizziness and lightheadedness.
    - Alcohol triggers an inflammatory response from the immune system. The immune
      system may make certain substances linked to the body's defense system. This
      commonly causes physical symptoms that make you feel as if you're ill. Your
      symptoms also may include problems thinking clearly and remembering, poor appetite,
      and loss of interest in usual activities.
    - Alcohol irritates the lining of the stomach. Alcohol can irritate your stomach.
      Alcohol also causes your stomach to make more acid. This can cause belly pain,
      nausea or vomiting.
    - Alcohol can cause blood sugar levels to fall. If your blood sugar dips too low,
      you may feel extra tired, weak and shaky. You also may have mood changes and
      even seizures.
    - Alcohol prevents restful sleep. You may feel sleepy, but alcohol keeps you from
      getting the kind of sleep that helps you feel rested. Alcohol also often causes
      you to awaken in the middle of the night or too early in the morning. Not getting
      good-quality sleep may leave you groggy and tired.
  subsections:
  - heading: Congeners
    level: 3
    content:
    - type: paragraph
      text: Alcoholic beverages contain ingredients called congeners. These give many
        types of alcoholic beverages their taste and smell. They also can play a role
        in hangovers. Congeners are found in larger amounts in dark liquors, such
        as brandy and bourbon, than in clear liquors, such as vodka and gin.
    - type: paragraph
      text: Congeners are more likely to produce a hangover or make a hangover worse.
        But drinking too much alcohol of any color can still make you feel bad the
        next morning.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Anyone who drinks alcohol can have a hangover. But some people are more
      likely to have hangovers than others are. A difference in a gene that affects
      the way the body breaks down alcohol may make some people flush, sweat or become
      ill after drinking even a small amount of alcohol.
  - type: paragraph
    text: 'Issues that may make a hangover more likely or worse include:'
  - type: list
    ordered: false
    items:
    - Drinking on an empty stomach. Having no food in your stomach speeds up how much
      and how fast alcohol enters the body.
    - Using other drugs, such as nicotine, along with alcohol. Smoking along with
      drinking appears to raise the likelihood of a hangover.
    - Not sleeping well or long enough after drinking. Some researchers believe that
      certain hangover symptoms are often due, at least in part, to how much sleep
      you get following a night of drinking. Poor-quality sleep and not getting enough
      sleep usually follow drinking alcohol.
    - Having a family history of alcohol use disorder. Having close relatives with
      a history of alcohol use disorder may suggest an inherited problem with the
      way your body processes alcohol.
    - Drinking darker colored alcoholic beverages. Darker colored drinks often contain
      a high level of congeners and may be more likely to produce a hangover.
  subsections:
  - heading: Wine headache
    level: 3
    content:
    - type: paragraph
      text: Some people have a headache a few hours after drinking wine — especially
        red wine. The cause of the headache isn't clear. But it's different from a
        hangover, which may or may not include a headache. It's possible that some
        chemicals in wine and how the body responds to them could result in a headache
        after drinking wine. More research is needed to find the exact cause of wine
        headache.
    subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'When you have a hangover, you''re likely to have problems with:'
  - type: list
    ordered: false
    items:
    - Clear thinking and memory.
    - Attention and focus.
    - Tasks that require steady hands and body coordination.
  - type: paragraph
    text: 'Not surprisingly, this short-term dulling of your abilities increases your
      risk of problems at home, school and work, such as:'
  - type: list
    ordered: false
    items:
    - Problems being on time or not showing up at all.
    - Trouble finishing tasks.
    - Conflict with others.
    - Falling asleep at school or on the job.
    - Problems driving a car or using machinery.
    - Workplace injuries.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: Some companies use misleading advertising to claim that their products can
      prevent hangovers. But the only guaranteed way to prevent a hangover is to not
      drink alcohol.
  - type: paragraph
    text: 'If you choose to drink alcohol, do so in moderation. Moderate alcohol use
      for healthy adults means:'
  - type: list
    ordered: false
    items:
    - Up to one drink a day for women.
    - Up to two drinks a day for men.
  - type: paragraph
    text: 'The less alcohol you drink, the less likely you are to have a hangover.
      It may help to:'
  - type: list
    ordered: false
    items:
    - Eat before and while drinking. Alcohol enters the body more quickly if your
      stomach is empty. It may help to eat something before drinking alcohol and during
      the time you're drinking.
    - Choose carefully. Beverages with fewer congeners are slightly less likely to
      cause hangovers than beverages with more congeners. But remember that all types
      of alcohol can cause a hangover.
    - Drink water between alcoholic drinks. Drinking a full glass of water after each
      alcoholic drink will help you stay hydrated. It'll also help you drink less
      alcohol.
    - Know your limits and only drink in moderation. Decide ahead of time how many
      drinks you'll have — and stick to it. Don't feel pressured to drink.
    - Take it slow. Don't have more than one alcoholic drink in an hour. Stop drinking
      completely when you've reached your limit — or before then.
  - type: paragraph
    text: Some people take pain relievers to prevent hangover symptoms. But ask your
      healthcare professional if this is safe for you and how much medicine is best
      for you. These medicines may not work well together with other medicines you
      take.
  - type: paragraph
    text: Aspirin and ibuprofen (Advil, Motrin IB, others) can cause your stomach
      to make more acid, which can irritate your stomach. And acetaminophen (Tylenol,
      others) may cause serious liver damage if taken with too much alcohol.
  subsections: []
