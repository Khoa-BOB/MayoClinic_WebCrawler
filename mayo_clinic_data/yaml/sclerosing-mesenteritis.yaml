title: Sclerosing mesenteritis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Sclerosing mesenteritis is a condition in which tissue that holds the small
      intestines in place, called the mesentery, becomes inflamed and forms scar tissue.
      The condition also is called mesenteric panniculitis. Sclerosing mesenteritis
      is rare, and it's not clear what causes it.
  - type: paragraph
    text: Sclerosing mesenteritis can cause belly pain, vomiting, bloating, diarrhea
      and fever. But some people experience no symptoms and may never need treatment.
  - type: paragraph
    text: In rare cases, scar tissue formed by sclerosing mesenteritis can block food
      from moving through the digestive tract. In this case, you may need surgery.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Symptoms of sclerosing mesenteritis include pain in the belly, vomiting,
      bloating, diarrhea and fever. Sometimes people don't have any symptoms.
  subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The cause of sclerosing mesenteritis is not known.
  subsections: []
