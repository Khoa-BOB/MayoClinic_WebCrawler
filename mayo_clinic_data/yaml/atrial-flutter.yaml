title: Atrial flutter
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Atrial flutter is a type of heart rhythm disorder, called an arrhythmia.
      It is similar to atrial fibrillation (AFib). But in atrial flutter the heart
      rhythm is more organized and less chaotic than in AFib. A person can have both
      atrial flutter and AFib.
  - type: paragraph
    text: Atrial flutter may not cause symptoms. But some people may have a pounding,
      rapid heartbeat and chest pain. Fainting or almost fainting also may happen.
      Treatment for atrial flutter may include medicines and a heart procedure.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: People with atrial flutter may not have symptoms. The irregular heartbeat
      may be found during a health checkup for another reason.
  - type: paragraph
    text: 'If atrial flutter symptoms happen, they may include:'
  - type: list
    ordered: false
    items:
    - A pounding or racing feeling in the chest.
    - Chest pain.
    - Fainting or almost fainting.
    - Shortness of breath.
    - Feeling very tired.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If you feel like your heart is pounding, fluttering, skipping a beat or
        beating too fast, make an appointment for a health checkup. You may be told
        to see a doctor trained in heart diseases, called a cardiologist.
    - type: paragraph
      text: 'Get emergency medical care if you have these symptoms:'
    - type: list
      ordered: false
      items:
      - Chest pain.
      - Shortness of breath.
      - Fainting.
    - type: paragraph
      text: Always call 911 or your local emergency number if you think you might
        be having a heart attack.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Changes in the heart's electrical system cause atrial flutter. The heart's
      electrical system controls the heartbeat. Some health conditions or heart surgery
      can change how electrical signals travel through the heart and cause atrial
      flutter.
  - type: paragraph
    text: The movement of the heart's signals make the heart squeeze and pump blood.
      Usually, this process goes smoothly. The typical resting heart rate is about
      60 to 100 beats a minute. But in atrial flutter, the heart's upper chambers
      beat too quickly. This causes the heart to beat in a fast, but usually organized,
      way.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Some health conditions increase the risk of atrial flutter. They include:'
  - type: list
    ordered: false
    items:
    - Heart failure.
    - Chronic obstructive pulmonary disease, also called COPD.
    - Blood clot in the lungs, called a pulmonary embolism.
    - Heart condition present at birth, called a congenital heart defect.
  - type: paragraph
    text: 'Other risk factors for atrial flutter are:'
  - type: list
    ordered: false
    items:
    - Getting older.
    - Recent heart surgery.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: A complication of atrial flutter is atrial fibrillation (AFib). About half
      of people with atrial flutter get AFib within three years. AFib increases the
      risk of blood clots and strokes.
  - type: paragraph
    text: 'Other complications of atrial flutter are:'
  - type: list
    ordered: false
    items:
    - Heart failure.
    - Stroke.
    - Heart attack.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'Lifestyle changes help keep the heart healthy. Try these heart-healthy
      tips:'
  - type: list
    ordered: false
    items:
    - Don't smoke.
    - Eat healthy foods such as fruits, vegetables and whole grains. Eat less salt
      and saturated fats.
    - Exercise at least 30 minutes a day on most days of the week.
    - Keep a healthy weight.
    - Use less or do not use caffeine and alcohol.
    - Reduce and manage stress.
    - Control high blood pressure, high cholesterol and diabetes.
    - Get good sleep. Adults should try to get 7 to 9 hours daily.
  subsections: []
