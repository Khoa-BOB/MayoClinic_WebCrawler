title: Tonic-clonic (grand mal) seizure
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: A tonic-clonic seizure, previously known as a grand mal seizure, causes
      a loss of consciousness and violent muscle contractions. It's the type of seizure
      most people picture when they think about seizures.
  - type: paragraph
    text: During a seizure, there's a burst of electrical activity in the brain that
      causes changes in behavior and movements. Seizures can be focal, meaning the
      burst of electrical activity happens in one area of the brain. Or seizures can
      be generalized, in which they result in electrical activity in all areas of
      the brain. Tonic-clonic seizures may begin as focal seizures in a small area
      of the brain and spread to become generalized seizures that involve the whole
      brain.
  - type: paragraph
    text: Focal and generalized seizures have different symptoms. People who have
      generalized seizures usually lose consciousness. But people who have focal seizures
      may or may not lose consciousness. In tonic-clonic seizures, the muscles become
      stiff, causing the person to fall. Then the muscles alternately flex and relax.
  - type: paragraph
    text: Usually, a tonic-clonic seizure is caused by epilepsy. But sometimes this
      type of seizure can be triggered by other health problems, such as a high fever
      or damage to the brain.
  - type: paragraph
    text: Some people who have a tonic-clonic seizure don’t have another one and don't
      need treatment. But someone who has recurrent seizures may need treatment with
      daily anti-seizure medicines to control and prevent future tonic-clonic seizures.
      Surgery and dietary changes also may be options to manage your seizures.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Tonic-clonic seizures have two stages:'
  - type: list
    ordered: false
    items:
    - Tonic phase. Often, someone in the tonic phase will make a sound, such as a
      groan or yell. The muscles suddenly get stiff and cause the person to fall down.
      Loss of consciousness occurs. This phase tends to last about 10 to 20 seconds.
    - Clonic phase. The muscles go into rhythmic contractions. The arms and legs often
      jerk. They alternately flex and relax. Convulsions usually last 1 to 2 minutes
      or less.
  - type: paragraph
    text: 'The following symptoms occur in some but not all people with tonic-clonic
      seizures:'
  - type: list
    ordered: false
    items:
    - Loss of bowel and bladder function. This may happen during or following a seizure.
    - Not responding after convulsions. The person may not become conscious for several
      minutes after convulsions have ended.
    - Confusion. The person often is disoriented after a tonic-clonic seizure. This
      is referred to as postictal confusion.
    - Fatigue. Sleepiness is common after a tonic-clonic seizure.
    - Bad headache. Headaches may occur after a tonic-clonic seizure.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'Call 911 or emergency medical help if:'
    - type: list
      ordered: false
      items:
      - The seizure lasts more than five minutes.
      - Breathing or consciousness doesn't return after the seizure stops.
      - A second seizure follows immediately.
      - You have a high fever.
      - You're experiencing heat exhaustion.
      - You're pregnant.
      - You have diabetes.
      - You've injured yourself during the seizure.
    - type: paragraph
      text: If you experience a seizure for the first time, see a healthcare professional.
    - type: paragraph
      text: 'Also see a healthcare professional if you or your child:'
    - type: list
      ordered: false
      items:
      - Experiences an increasing number of seizures for no apparent reason.
      - Notices new seizure symptoms.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The brain's nerve cells typically communicate by sending electrical and
      chemical signals across the synapses that connect the cells. A synapse is the
      area between cells that allows them to send messages. Tonic-clonic seizures
      occur when there's a surge of electrical activity over the surface of the brain.
      Many nerve cells fire at once, much faster than usual. Exactly what causes these
      changes often is not known.
  - type: paragraph
    text: 'However, tonic-clonic seizures are sometimes caused by other health problems,
      such as:'
  - type: list
    ordered: false
    items:
    - Injury or infection. Severe head injuries can cause tonic-clonic seizures. Other
      possible causes include infections, such as encephalitis or meningitis, or having
      these infections in the past. Stroke and dementias that cause degeneration in
      the brain, such as Alzheimer's disease, also can cause tonic-clonic seizures.
    - Congenital or developmental factors. These can include blood vessels that don't
      form properly in the brain and brain tumors.
    - Metabolic issues. Very low blood levels of glucose, sodium, calcium or magnesium
      can cause tonic-clonic seizures.
    - Withdrawal syndromes. These can include using or withdrawing from drugs, including
      alcohol.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk factors for tonic-clonic seizures include:'
  - type: list
    ordered: false
    items:
    - A family history of seizure disorders.
    - Any injury to the brain from trauma, a stroke, previous infection and other
      causes.
    - Sleep deprivation.
    - Medical problems that affect the balance of minerals in the body.
    - Illicit drug use.
    - Heavy alcohol use.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Having a seizure at certain times can be dangerous for you or others. You
      might be at risk of:'
  - type: list
    ordered: false
    items:
    - Falling. If you fall during a seizure, you can injure your head or break a bone.
    - Drowning. If you have a seizure while swimming or bathing, you're at risk of
      accidental drowning.
    - Car accidents. A seizure that causes either loss of awareness or control can
      be dangerous if you're driving a car or operating other equipment.
    - Pregnancy complications. Seizures during pregnancy pose dangers to both mother
      and baby. And certain anti-seizure medicines increase the risk of birth defects.
      If you have epilepsy and plan to become pregnant, talk with a healthcare professional.
      Your medicines may need to be adjusted. A healthcare professional likely will
      monitor your pregnancy.
    - Emotional health issues. People with seizures are more likely to have depression
      and anxiety. Children with seizures may be more likely to develop attention
      deficit hyperactivity disorder, also called ADHD. Emotional health issues may
      be a result of dealing with the condition itself or as a result of medicine
      side effects.
  subsections: []
