title: Vasovagal syncope
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Vasovagal syncope (vay-zoh-VAY-gul SING-kuh-pee) occurs when you faint because
      your body overreacts to certain triggers. These may include the sight of blood
      or extreme emotional distress. Vasovagal syncope also is called neurocardiogenic
      syncope.
  - type: paragraph
    text: The vasovagal syncope trigger causes your heart rate and blood pressure
      to drop suddenly. That leads to reduced blood flow to your brain, causing you
      to briefly lose consciousness.
  - type: paragraph
    text: Vasovagal syncope is usually harmless and requires no treatment. But it's
      possible that you may injure yourself during a vasovagal syncope episode. Your
      healthcare professional may recommend tests to rule out more-serious causes
      of fainting, such as heart conditions.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Before you faint due to vasovagal syncope, you may experience some of the
      following symptoms:'
  - type: list
    ordered: false
    items:
    - Change in skin color.
    - Lightheadedness.
    - Tunnel vision — your field of vision narrows so that you see only what's in
      front of you.
    - Upset stomach.
    - Feeling warm.
    - A cold, clammy sweat.
    - Blurred vision.
  - type: paragraph
    text: 'During a vasovagal syncope episode, people around you may notice:'
  - type: list
    ordered: false
    items:
    - Jerky movements.
    - A slow, weak pulse.
    - Dilated pupils.
  - type: paragraph
    text: Recovery after a vasovagal episode generally begins in less than a minute.
      However, if you stand up too soon after fainting — within about 15 to 30 minutes
      — you're at risk of fainting again.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Fainting can be a sign of a more serious condition, such as a heart or
        brain condition. You may want to consult your healthcare professional after
        a fainting spell, especially if you've never had one before.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Vasovagal syncope occurs when the part of your nervous system that regulates
      heart rate and blood pressure overreacts to a trigger. Common triggers include:'
  - type: list
    ordered: false
    items:
    - Standing for long periods of time.
    - Heat exposure.
    - Seeing blood.
    - Having blood drawn.
    - Fear of bodily injury.
    - Straining, such as to pass stool.
  - type: paragraph
    text: Vasovagal syncope can happen without a trigger.
  - type: paragraph
    text: During a vasovagal syncope episode, your heart rate slows, and the blood
      vessels in your legs widen. This allows blood to pool in your legs, which lowers
      your blood pressure. The drop in blood pressure and slowed heart rate quickly
      reduce blood flow to your brain, and you faint.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'The risk of vasovagal syncope may be higher in:'
  - type: list
    ordered: false
    items:
    - Children and young adults, although vasovagal syncope can happen at any age.
    - People who stand for long periods of time.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: You may not always be able to avoid a vasovagal syncope episode. If you
      feel like you might faint, lie down and lift your legs. This allows gravity
      to keep blood flowing to your brain. If you can't lie down, sit down and put
      your head between your knees until you feel better.
  subsections: []
