title: Peptic ulcer
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Peptic ulcers are open sores on the inner lining of the stomach and the
      upper part of the small intestine. The most common symptom of a peptic ulcer
      is stomach pain.
  - type: paragraph
    text: 'Peptic ulcers include:'
  - type: list
    ordered: false
    items:
    - Gastric ulcers , which appear on the inside of the stomach.
    - Duodenal ulcers , which appear on the inside of the upper part of the small
      intestine, called the duodenum.
  - type: paragraph
    text: The most common causes of peptic ulcers are infection with the germ Helicobacter
      pylori (H. pylori) and long-term use of nonsteroidal anti-inflammatory drugs
      (NSAIDs). These include ibuprofen (Advil, Motrin IB, others) and naproxen sodium
      (Aleve).
  - type: paragraph
    text: Stress and spicy foods do not cause peptic ulcers. But they can make symptoms
      worse.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Many people with peptic ulcers don''t have symptoms. If there are symptoms,
      they may include:'
  - type: list
    ordered: false
    items:
    - Dull or burning stomach pain. For some people, pain may be worse between meals
      and at night. For others, it may be worse after eating.
    - Feeling of fullness or bloating.
    - Belching.
    - Heartburn.
    - Nausea.
  - type: paragraph
    text: 'Peptic ulcers can cause bleeding from the ulcer. Then symptoms might include:'
  - type: list
    ordered: false
    items:
    - Vomiting blood, which may appear red or black.
    - Having dark blood in stools, or stools that are black or tarry.
    - Feeling dizzy or fainting.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See your healthcare professional if you're vomiting blood, having dark
        blood in stools or are feeling dizzy. Also see your healthcare professional
        if nonprescription antacids and acid blockers relieve your pain but the pain
        returns.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Peptic ulcers happen when acid in the organs that food travels through,
      called the digestive tract, eats away at the inner surface of the stomach or
      small intestine. The acid can create a painful open sore that may bleed.
  - type: paragraph
    text: Your digestive tract is coated with a mucous layer that most often protects
      against acid. But if the amount of acid increases or the amount of mucus decreases,
      you could develop an ulcer.
  - type: paragraph
    text: 'Common causes include:'
  - type: list
    ordered: false
    items:
    - Helicobacter pylori. This germ lives in the mucous layer that covers and protects
      tissues that line the stomach and small intestine. The H. pylori germ often
      causes no problems. But it can cause swelling and irritation, called inflammation,
      of the stomach's inner layer. When this happens, it can cause an ulcer. It's
      not clear how H. pylori infection spreads. It may go from person to person by
      close contact, such as kissing. People also can contract H. pylori through food
      and water.
    - Regular use of certain pain relievers. Taking aspirin or nonsteroidal anti-inflammatory
      drugs (NSAIDs) over time can irritate or inflame the lining of the stomach and
      small intestine. These medicines include ibuprofen (Advil, Motrin IB, others),
      naproxen sodium (Aleve, Anaprox DS, others), ketoprofen and others. They do
      not include acetaminophen (Tylenol, others).
  - type: paragraph
    text: Helicobacter pylori. This germ lives in the mucous layer that covers and
      protects tissues that line the stomach and small intestine. The H. pylori germ
      often causes no problems. But it can cause swelling and irritation, called inflammation,
      of the stomach's inner layer. When this happens, it can cause an ulcer.
  - type: paragraph
    text: It's not clear how H. pylori infection spreads. It may go from person to
      person by close contact, such as kissing. People also can contract H. pylori
      through food and water.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'If you take NSAIDs, the following factors may increase your risk of peptic
      ulcers:'
  - type: list
    ordered: false
    items:
    - Old age. This includes people older than 60.
    - Prior peptic ulcer. People who have had a peptic ulcer before have a higher
      risk of having another one.
    - NSAIDs use. Taking high doses of NSAIDs or two or more NSAIDs increases the
      risk. So does taking NSAIDS with certain other medicines. These include other
      pain relievers, steroids, blood thinners, certain antidepressants called selective
      serotonin reuptake inhibitors (SSRIs) and medicines to treat the bone-thinning
      disease osteoporosis. These include alendronate (Fosamax, Binosto) and risedronate
      (Actonel, Atelvia).
  - type: paragraph
    text: NSAIDs use. Taking high doses of NSAIDs or two or more NSAIDs increases
      the risk. So does taking NSAIDS with certain other medicines.
  - type: paragraph
    text: These include other pain relievers, steroids, blood thinners, certain antidepressants
      called selective serotonin reuptake inhibitors (SSRIs) and medicines to treat
      the bone-thinning disease osteoporosis. These include alendronate (Fosamax,
      Binosto) and risedronate (Actonel, Atelvia).
  - type: paragraph
    text: 'Factors that don''t cause peptic ulcers but can make them worse include:'
  - type: list
    ordered: false
    items:
    - Smoking. This may increase the risk of peptic ulcers in people who are infected
      with H. pylori.
    - Drinking alcohol. Alcohol can irritate and erode the mucous lining of the stomach.
      And it increases stomach acid.
    - Having untreated stress.
    - Eating spicy foods.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Untreated peptic ulcers can cause:'
  - type: list
    ordered: false
    items:
    - Bleeding in the stomach or duodenum. Bleeding can be a slow blood loss that
      leads to too few red blood cells, called anemia. Or you can lose enough blood
      so that you need to be in a hospital or get blood from a donor. Severe blood
      loss may cause black or bloody vomit or black or bloody stools.
    - A hole, called a perforation, in the stomach wall. Peptic ulcers can eat a hole
      through the wall of your stomach or small intestine. This puts you at risk of
      infection of your abdomen, called peritonitis.
    - Blockage. Peptic ulcers can keep food from going through the digestive tract.
      The blockage can make you feel full easily and cause you to vomit and lose weight.
    - Stomach cancer. Studies have shown that people infected with H. pylori have
      an increased risk of stomach cancer.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'To help prevent peptic ulcers:'
  - type: list
    ordered: false
    items:
    - Take care with pain relievers. If you often use NSAIDs, which can increase your
      risk of peptic ulcer, take steps to reduce your risk of stomach problems. For
      instance, take pain relievers with meals. Work with your healthcare professional
      to find the lowest dose that gives you pain relief. Don't drink alcohol with
      pain relievers. Together, they can increase your risk of stomach upset. If you
      need an NSAID, you also may need to take other medicines to help protect your
      stomach. These include antacids, proton pump inhibitors, acid blockers or cytoprotective
      agents. A class of NSAIDs called COX-2 inhibitors may be less likely to cause
      peptic ulcers. But these medicines may increase the risk of heart attack.
    - If you smoke, find a way to quit. Quitting smoking can lower your risk of peptic
      ulcer. Talk with your healthcare professional for help with quitting.
  - type: paragraph
    text: Take care with pain relievers. If you often use NSAIDs, which can increase
      your risk of peptic ulcer, take steps to reduce your risk of stomach problems.
      For instance, take pain relievers with meals.
  - type: paragraph
    text: Work with your healthcare professional to find the lowest dose that gives
      you pain relief. Don't drink alcohol with pain relievers. Together, they can
      increase your risk of stomach upset.
  - type: paragraph
    text: If you need an NSAID, you also may need to take other medicines to help
      protect your stomach. These include antacids, proton pump inhibitors, acid blockers
      or cytoprotective agents.
  - type: paragraph
    text: A class of NSAIDs called COX-2 inhibitors may be less likely to cause peptic
      ulcers. But these medicines may increase the risk of heart attack.
  subsections: []
