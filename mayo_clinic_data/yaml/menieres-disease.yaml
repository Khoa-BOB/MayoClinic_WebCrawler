title: Meniere's disease
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Meniere's disease is an inner ear problem that can cause dizzy spells, also
      called vertigo, and hearing loss. Most of the time, Meniere's disease affects
      only one ear.
  - type: paragraph
    text: Meniere's disease can happen at any age. But it usually starts between the
      ages of 40 to 60. It's thought to be a lifelong condition. But some treatments
      can help ease symptoms and lessen how it affects your life long term.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of Meniere''s disease include:'
  - type: list
    ordered: false
    items:
    - Regular dizzy spells. You have a spinning feeling that starts and stops suddenly.
      Vertigo may start without warning. It usually lasts 20 minutes to 12 hours,
      but not more than 24 hours. Serious vertigo can cause nausea.
    - Hearing loss. Hearing loss in Meniere's disease may come and go, especially
      early on. Over time, hearing loss can be long-lasting and not get better.
    - Ringing in the ear. Ringing in the ear is called tinnitus. Tinnitus is the term
      for when you have a ringing, buzzing, roaring, whistling or hissing sound in
      your ear.
    - Feeling of fullness in the ear. People with Meniere's disease often feel pressure
      in the ear. This is called aural fullness.
  - type: paragraph
    text: After a vertigo attack, symptoms get better and might go away for a while.
      Over time, how many vertigo attacks you have may lessen.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See your healthcare provider if you have symptoms of Meniere's disease.
        Other illnesses can cause these problems. So, it's important to find out what's
        causing your symptoms as soon as possible.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The cause of Meniere's disease isn't known. Symptoms of Meniere's disease
      may be due to extra fluid in the inner ear called endolymph. But it isn't clear
      what causes this fluid to build up in the inner ear.
  - type: paragraph
    text: 'Issues that affect the fluid, which might lead to Meniere''s disease, include:'
  - type: list
    ordered: false
    items:
    - Poor fluid drainage. This may be due to a blockage or irregular ear shape.
    - Autoimmune disorders.
    - Viral infection.
    - Genetics.
  - type: paragraph
    text: Because no single cause has been found, Meniere's disease likely has a combination
      of causes.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Meniere's disease is most common in people ages 40 to 60. Females may have
      a slightly higher risk than men.
  - type: paragraph
    text: You may have a higher chance of getting Meniere's disease if someone in
      your family has had the condition.
  - type: paragraph
    text: You may have a higher risk of Meniere's disease if you have an autoimmune
      disorder.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'The most difficult complications of Meniere''s disease can be:'
  - type: list
    ordered: false
    items:
    - Unexpected vertigo attacks.
    - Possibly losing your hearing long term.
  - type: paragraph
    text: The disease can happen at any time. This can cause worry and stress.
  - type: paragraph
    text: Vertigo can cause you to lose balance. This can increase your risk of falls
      and accidents.
  subsections: []
