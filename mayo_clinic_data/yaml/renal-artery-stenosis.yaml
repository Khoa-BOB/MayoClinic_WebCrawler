title: Renal artery stenosis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Renal artery stenosis is when one or more arteries that carry blood to the
      kidneys narrow. These are called the renal arteries.
  - type: paragraph
    text: Having narrowed renal arteries means the kidneys don't get enough oxygen-rich
      blood. The kidneys need enough blood flow to help filter waste products and
      remove excess fluids. Less blood flow to the kidneys may injure kidney tissue
      and raise blood pressure throughout the body.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Renal artery stenosis often doesn''t cause symptoms until it''s advanced.
      A healthcare professional may find the condition while testing for something
      else. Or your healthcare professional may suspect the condition if you have:'
  - type: list
    ordered: false
    items:
    - High blood pressure that begins suddenly or gets worse without a known cause.
    - High blood pressure that begins before age 30 or after age 55.
  - type: paragraph
    text: 'As renal artery stenosis advances, other signs and symptoms may include:'
  - type: list
    ordered: false
    items:
    - High blood pressure that's hard to manage.
    - A whooshing sound as blood flows through a narrowed vessel, called a bruit.
      A member of your healthcare team hears the sound through a stethoscope placed
      over your kidneys.
    - Fluid buildup and swelling in the body's tissues.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with your healthcare professional if you have lasting
        symptoms that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'The two main causes of renal artery stenosis include:'
  - type: list
    ordered: false
    items:
    - Buildup on kidney arteries, also called renal arteries. Fats, cholesterol and
      other substances, called plaques, can build up in and on the kidney artery walls.
      This is called atherosclerosis. As the buildup grows, the plaque can harden.
      That lowers blood flow and causes kidney scarring. In time, the plaque narrows
      the artery. Atherosclerosis happens in many areas of the body. It's the most
      common cause of renal artery stenosis.
    - Fibromuscular dysplasia. In fibromuscular dysplasia, the muscle in the artery
      wall doesn't grow as it should. This often begins in childhood. The renal artery
      can have narrow sections and wider sections. This looks like beads in images
      of the artery. The renal artery can narrow so much that the kidney doesn't get
      enough blood. This can lead to high blood pressure at a young age. This can
      happen in one or both kidneys. Experts don't know what causes fibromuscular
      dysplasia. But the condition is more common in people assigned female at birth.
      It may be present at birth, called congenital.
  - type: paragraph
    text: Buildup on kidney arteries, also called renal arteries. Fats, cholesterol
      and other substances, called plaques, can build up in and on the kidney artery
      walls. This is called atherosclerosis.
  - type: paragraph
    text: As the buildup grows, the plaque can harden. That lowers blood flow and
      causes kidney scarring. In time, the plaque narrows the artery. Atherosclerosis
      happens in many areas of the body. It's the most common cause of renal artery
      stenosis.
  - type: paragraph
    text: Fibromuscular dysplasia. In fibromuscular dysplasia, the muscle in the artery
      wall doesn't grow as it should. This often begins in childhood. The renal artery
      can have narrow sections and wider sections. This looks like beads in images
      of the artery.
  - type: paragraph
    text: The renal artery can narrow so much that the kidney doesn't get enough blood.
      This can lead to high blood pressure at a young age. This can happen in one
      or both kidneys.
  - type: paragraph
    text: Experts don't know what causes fibromuscular dysplasia. But the condition
      is more common in people assigned female at birth. It may be present at birth,
      called congenital.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Most often, renal artery stenosis results from narrowed kidney arteries.
      Risk factors for narrowed arteries in the kidneys and other parts of the body
      include:'
  - type: list
    ordered: false
    items:
    - Older age.
    - High blood pressure.
    - High cholesterol.
    - Diabetes.
    - Obesity.
    - Smoking and other tobacco use.
    - A family history of early heart disease.
    - Lack of exercise.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Possible complications of renal artery stenosis include:'
  - type: list
    ordered: false
    items:
    - High blood pressure.
    - Chronic kidney disease or kidney failure. Kidney disease can happen if high
      blood pressure is not managed over time. Kidney failure needs treatment with
      dialysis or a kidney transplant.
    - Fluid retention in the legs. This causes swollen ankles or feet.
  subsections: []
