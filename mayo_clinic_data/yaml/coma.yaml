title: Coma
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Coma is a state of prolonged loss of consciousness. It can have a variety
      of causes, including traumatic head injury, stroke, brain tumor, or drug or
      alcohol intoxication. A coma may even be caused by an underlying illness, such
      as diabetes or an infection.
  - type: paragraph
    text: Coma is a medical emergency. Quick action is needed to preserve life and
      brain function. Healthcare professionals typically order a series of blood tests
      and a brain scan to try to learn what's causing the coma so that proper treatment
      can begin.
  - type: paragraph
    text: A coma doesn't usually last longer than several weeks. People who are unconscious
      for a longer time might transition to a lasting vegetative state, known as a
      persistent vegetative state, or brain death.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'The symptoms of a coma commonly include:'
  - type: list
    ordered: false
    items:
    - Closed eyes.
    - Depressed brainstem reflexes, such as pupils not responding to light.
    - No responses of limbs except for reflex movements.
    - No response to painful stimuli except for reflex movements.
    - Irregular breathing.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: A coma is a medical emergency. Seek immediate medical care for the person
        in a coma.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Many types of problems can cause a coma. Some examples are:'
  - type: list
    ordered: false
    items:
    - Traumatic brain injuries. These are often caused by traffic collisions or acts
      of violence.
    - Stroke. Reduced or stopped blood supply to the brain, known as a stroke, can
      result from blocked arteries or a burst blood vessel.
    - Tumors. Tumors in the brain or brainstem can cause a coma.
    - Diabetes. Blood sugar levels that become too high or too low can cause a coma.
    - Lack of oxygen. People who have been rescued from drowning or revived after
      a heart attack might not awaken due to lack of oxygen to the brain.
    - Infections. Infections such as encephalitis and meningitis cause swelling of
      the brain, spinal cord or the tissues that surround the brain. Severe cases
      of these infections can result in brain damage or a coma.
    - Seizures. Ongoing seizures can lead to a coma.
    - Toxins. Exposure to toxins, such as carbon monoxide or lead, can cause brain
      damage and a coma.
    - Drugs and alcohol. Overdosing on drugs or alcohol can result in a coma.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk factors for coma include:'
  - type: list
    ordered: false
    items:
    - Serious head injury.
    - Stroke.
    - Bleeding in and around the brain, known as an intracranial bleed.
    - Brain tumor.
    - Diabetes with blood sugar that's very high or very low.
    - Health conditions, such as hypothyroidism or very low sodium in the blood.
    - Very low blood pressure from serious heart failure.
    - Epilepsy, including having seizures that last more than five minutes or that
      happen one after another without the person regaining consciousness.
    - Serious infection, such as sepsis, encephalitis or meningitis.
    - Near drowning, which decreases oxygen to the brain.
    - Excessive use of alcohol or use of illegal drugs.
    - Exposure to carbon monoxide, lead or other toxins.
  - type: paragraph
    text: 'The risk of coma goes up with age. This is especially true if older adults:'
  - type: list
    ordered: false
    items:
    - Have a brain disease or another condition such as diabetes, high blood pressure
      or kidney disease.
    - Take several medicines, which can lead to drug interactions or accidental overdose.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Although many people gradually recover from a coma, others enter a persistent
      vegetative state or die. Some people who recover from a coma end up with major
      or minor disabilities.
  - type: paragraph
    text: During a coma, bedsores, urinary tract infections, blood clots in the legs
      and other problems may develop.
  subsections: []
