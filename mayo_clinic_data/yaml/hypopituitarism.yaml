title: Hypopituitarism
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Hypopituitarism is a rare condition in which the pituitary gland doesn't
      make one or more hormones or doesn't make enough hormones.
  - type: paragraph
    text: The pituitary gland is a kidney-bean-sized gland at the base of your brain.
      It is part of the body's system of glands that make hormones, called the endocrine
      system. The pituitary gland makes several hormones. They act on nearly every
      part of the body.
  - type: paragraph
    text: Hypopituitarism is when there isn't enough of one or more of the pituitary
      hormones. This lack of hormones, called a deficiency, can affect how the body
      works in many ways. These include growth, blood pressure and the ability to
      have children, among others. Symptoms depend on which hormones are missing.
  - type: paragraph
    text: People who have hypopituitarism usually need to take medicines for the rest
      of their lives. These medicines replace the missing hormones, which helps control
      symptoms.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: The symptoms of hypopituitarism usually start slowly and get worse over
      time. They might not be noticed for months or even years. But for some people,
      symptoms start suddenly.
  - type: paragraph
    text: Symptoms of hypopituitarism vary from person to person. Symptoms depend
      on what hormones are missing and how little of the hormone is being made. There
      might be more than one hormone that's low. A second hormone deficiency might
      increase the symptoms of the first one. Or sometimes, it might hide those symptoms.
  subsections:
  - heading: Growth hormone (GH) deficiency
    level: 3
    content:
    - type: paragraph
      text: 'In children, GH deficiency can cause growth problems and short stature.
        Most adults who have GH deficiency don''t have symptoms. But some adults have:'
    - type: list
      ordered: false
      items:
      - Fatigue.
      - Muscle weakness.
      - Changes in body fat.
      - Loss of interest in activities.
      - Lack of social contacts.
    subsections: []
  - heading: Luteinizing hormone (LH) and follicle-stimulating hormone (FSH) deficiency
    level: 3
    content:
    - type: paragraph
      text: A lack of these hormones, called gonadotropins, affects the reproductive
        system.
    - type: paragraph
      text: The lack of hormones keeps the ovaries from making enough eggs and estrogen.
        It keeps the testicles from making enough sperm and testosterone. This can
        lower sex drive and cause tiredness. It also can make it hard or impossible
        to have children — a condition called infertility. In children, the physical
        changes to an adult body, known as puberty, may not occur or may be late.
    - type: paragraph
      text: 'Some people might have symptoms such as:'
    - type: list
      ordered: false
      items:
      - Hot flashes.
      - Irregular periods or no periods.
      - Loss of pubic hair.
      - Not being able to make milk for breastfeeding.
      - Not being able to get or keep an erection, known as erectile dysfunction.
      - Decreased facial or body hair.
      - Mood changes.
      - Fatigue.
    subsections: []
  - heading: Thyroid-stimulating hormone (TSH) deficiency
    level: 3
    content:
    - type: paragraph
      text: 'This hormone controls the thyroid gland. Too little TSH leads to low
        levels of thyroid hormones. This condition is called hypothyroidism. It causes
        symptoms such as:'
    - type: list
      ordered: false
      items:
      - Tiredness.
      - Weight gain.
      - Dry skin.
      - Constipation.
      - Sensitivity to cold or trouble staying warm.
    subsections: []
  - heading: Adrenocorticotropic hormone (ACTH) deficiency
    level: 3
    content:
    - type: paragraph
      text: 'This hormone helps the adrenal glands work correctly. It also helps the
        body react to stress. Symptoms of ACTH deficiency include:'
    - type: list
      ordered: false
      items:
      - Severe tiredness.
      - Low blood pressure.
      - Many and lasting infections.
      - Nausea, vomiting or abdominal pain.
      - Confusion.
    subsections: []
  - heading: Anti-diuretic hormone (ADH) deficiency
    level: 3
    content:
    - type: paragraph
      text: 'This hormone, which also is called vasopressin, helps the body balance
        its fluid levels. An ADH deficiency can lead to a disorder called diabetes
        insipidus, which can cause:'
    - type: list
      ordered: false
      items:
      - Urinating more than usual.
      - Extreme thirst.
      - Imbalances in minerals such as sodium and potassium, known as electrolytes.
    subsections: []
  - heading: Prolactin deficiency
    level: 3
    content:
    - type: paragraph
      text: Prolactin is the hormone that tells the body when to start making breast
        milk. Low levels of prolactin can cause problems with making milk for breastfeeding.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See your health care provider if you develop any symptoms of hypopituitarism.
    - type: paragraph
      text: Contact your health care provider right away if symptoms of hypopituitarism
        start suddenly or come with a bad headache, changes in vision, confusion or
        a drop in blood pressure. These could be symptoms of sudden damage to the
        pituitary gland tissue. This condition is known as pituitary apoplexy.
    - type: paragraph
      text: Bleeding into the pituitary gland can cause pituitary apoplexy. Pituitary
        apoplexy is a medical emergency and needs medical attention quickly.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Hypopituitarism has a number of causes. One common cause is a tumor of the
      pituitary gland. As a pituitary tumor grows, it can press on and damage pituitary
      tissue. This disrupts the pituitary gland's ability to make hormones. A tumor
      also can press on the optic nerves, causing vision problems.
  - type: paragraph
    text: 'Other potential causes of damage to the pituitary gland that may lead to
      hypopituitarism include:'
  - type: list
    ordered: false
    items:
    - Lack of blood flow to the brain or pituitary gland, known as a stroke, or bleeding,
      called hemorrhage, into the brain or pituitary gland.
    - Certain medicines, such as narcotics, high-dose steroids or certain cancer medicines
      called checkpoint inhibitors.
    - Swelling, known as inflammation, of the pituitary gland caused by an unusual
      immune system response, called hypophysitis.
    - Infections of the brain, such as meningitis, or infections that can spread to
      the brain, such as tuberculosis or syphilis.
    - Significant blood loss during childbirth, which can damage the front part of
      the pituitary gland. This condition is known as Sheehan syndrome or postpartum
      pituitary necrosis.
  - type: paragraph
    text: In some cases, a change in a gene causes hypopituitarism. That change is
      heredity, which means it is passed down in families. The genetic change affects
      the pituitary gland's ability to make one or more of its hormones. This often
      starts at birth or in early childhood.
  - type: paragraph
    text: Tumors or diseases of a part of the brain that's just above the pituitary,
      called the hypothalamus, also can cause hypopituitarism. The hypothalamus makes
      hormones that affect how the pituitary gland works.
  - type: paragraph
    text: Sometimes, the cause of hypopituitarism isn't known.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Most people with hypopituitarism don''t have any factors that put them
      at higher risk of developing the condition. But the following may raise the
      risk of developing hypopituitarism:'
  - type: list
    ordered: false
    items:
    - A head injury.
    - Brain surgery.
    - Radiation treatment to the head or neck.
    - Diseases that affect more than one part of the body. These include an inflammatory
      disease that affects various organs, called sarcoidosis; a disease in which
      unusual cells cause scarring, called Langerhans cell histiocytosis; and a disease
      that causes too much iron in the liver and other tissues, called hemochromatosis.
  subsections: []
