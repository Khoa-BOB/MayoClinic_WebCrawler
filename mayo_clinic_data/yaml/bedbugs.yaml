title: Bedbugs
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Bedbugs are small, reddish-brown blood-sucking, wingless insects. Bedbug
      bites usually clear up without treatment in a week or two. Bedbugs aren't known
      to spread disease, but they can cause an allergic reaction or a severe skin
      reaction in some people.
  - type: paragraph
    text: Bedbugs are about the size of an apple seed. They hide in the cracks and
      crevices of beds, box springs, headboards, bed frames and other objects around
      a bed and come out at night to feed on their preferred host, humans. The risk
      of running into bedbugs is higher if you spend time in places where nighttime
      guests come and go often — such as hotels, hospitals or homeless shelters.
  - type: paragraph
    text: If you have bedbugs in your home, professional extermination is recommended.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of bedbug bites are similar to symptoms of other insect bites
      and rashes. Bedbug bites are usually:'
  - type: list
    ordered: false
    items:
    - Inflamed spots, often with a darker spot in the middle
    - Itchy
    - Arranged in a rough line or in a cluster
    - Located on the face, neck, arms and hands
  - type: paragraph
    text: Some people have no reaction to bedbug bites, while others experience an
      allergic reaction that can include severe itching, blisters or hives.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If you experience allergic reactions or severe skin reactions to bedbug
        bites, see your health care provider for professional treatment.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Bedbug infestations may be linked to:'
  - type: list
    ordered: false
    items:
    - More frequent travel
    - Changes in pest control practices
    - Insecticide resistance
  subsections:
  - heading: Where do they hide?
    level: 3
    content:
    - type: paragraph
      text: 'Bedbug infestations usually occur around or near where people sleep.
        They can be found in:'
    - type: list
      ordered: false
      items:
      - Clothing
      - Luggage
      - Bedding
      - Boxes
      - Box springs
      - Mattresses
      - Headboards
      - Objects near beds
    - type: paragraph
      text: 'They can also be found:'
    - type: list
      ordered: false
      items:
      - Under peeling paint and loose wallpaper
      - Under carpeting near baseboards
      - In upholstered furniture seams
      - Under light switch plates or electrical outlets
    subsections: []
  - heading: How do they spread?
    level: 3
    content:
    - type: paragraph
      text: Bedbugs can move from one site to another by traveling on items such as
        clothing, luggage, furniture, boxes and bedding.
    - type: paragraph
      text: Bedbugs can easily travel between floors and rooms in hotels or apartment
        buildings.
    subsections: []
  - heading: Sign of uncleanliness?
    level: 3
    content:
    - type: paragraph
      text: Bedbugs don't care if their environment is clean or dirty. All they need
        is a warm host and plenty of hiding places.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: You're at risk of bites from bedbugs if you're in places where people come
      and go often, such as apartment buildings, dorm rooms, homeless shelters, hotels,
      cruise ships, trains, buses and refugee camps.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: list
    ordered: false
    items:
    - Cover up. Bedbugs don't tend to burrow under clothing. So you may be able to
      avoid bites by wearing pajamas that cover as much skin as possible.
    - Inspect secondhand items. Look over used bedding, mattresses and upholstered
      furniture before bringing them into your home.
    - Use hotel precautions. Check mattress seams for bedbug excrement and place your
      luggage on tables or dressers instead of on the floor.
  subsections: []
