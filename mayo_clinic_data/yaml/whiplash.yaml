title: Whiplash
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Whiplash is a neck injury due to forceful, rapid back-and-forth movement
      of the neck, like the cracking of a whip.
  - type: paragraph
    text: Whiplash is commonly caused by rear-end car crashes. But whiplash also can
      result from sports accidents, physical abuse and other types of traumas, such
      as a fall. Whiplash may be called a neck sprain or strain, but these terms also
      include other types of neck injuries.
  - type: paragraph
    text: Most people with whiplash get better within a few weeks by following a treatment
      plan that includes pain medicine and exercise. However, some people have long-lasting
      neck pain and other complications.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of whiplash most often start within days of the injury. They may
      include:'
  - type: list
    ordered: false
    items:
    - Neck pain and stiffness.
    - Pain that gets worse with neck movement.
    - Loss of range of motion in the neck.
    - Headaches, most often starting at the base of the skull.
    - Tenderness or pain in the shoulder, upper back or arms.
    - Tingling or numbness in the arms.
    - Tiredness.
    - Dizziness.
  - type: paragraph
    text: 'Some people also have:'
  - type: list
    ordered: false
    items:
    - Blurred vision.
    - Ringing in the ears, called tinnitus.
    - Trouble sleeping.
    - Crankiness.
    - Trouble focusing.
    - Memory problems.
    - Depression.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See your healthcare professional if you have neck pain or other whiplash
        symptoms after a car accident, sports injury or other injury. It's important
        to get a quick diagnosis. This is to rule out broken bones or other damage
        that can cause or worsen symptoms.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Whiplash most often occurs when the head is quickly thrown backward and
      then forward with force. This often happens as a result of a rear-end car crash.
      This motion can cause damage to the muscles and tissues of the neck.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk factors for whiplash include:'
  - type: list
    ordered: false
    items:
    - Rear-end car crash. This is the most common risk factor for getting whiplash.
    - Physical abuse or assault. Whiplash can occur if you are punched or shaken.
      It's one of the injuries seen in shaken baby syndrome.
    - Contact sports. Football tackles and other sports-related contact hits sometimes
      can cause whiplash.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Most people who have whiplash feel better within a few weeks. They don't
      seem to have lasting effects from the injury. But some people have pain for
      months or years after the injury.
  - type: paragraph
    text: 'It''s hard to predict how recovery from whiplash might go. As a rule, you
      may be more likely to have ongoing pain if your first symptoms were intense,
      started quickly and included:'
  - type: list
    ordered: false
    items:
    - Severe neck pain.
    - More-limited range of motion.
    - Pain that spread to the arms.
  - type: paragraph
    text: 'The following risk factors have been linked to a worse outcome:'
  - type: list
    ordered: false
    items:
    - Having had whiplash before.
    - Older age.
    - Already having low back or neck pain.
    - A high-speed injury.
  subsections: []
