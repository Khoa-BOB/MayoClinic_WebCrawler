title: Radiation enteritis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Radiation enteritis is inflammation of the intestines that occurs after
      radiation therapy.
  - type: paragraph
    text: Radiation enteritis causes diarrhea, nausea, vomiting and stomach cramps
      in people receiving radiation aimed at the abdomen, pelvis or rectum. It's most
      common in people receiving radiation therapy for cancer in the abdomen and pelvic
      areas.
  - type: paragraph
    text: For most people, radiation enteritis is temporary, with inflammation usually
      subsiding several weeks after treatment ends. But for some, radiation enteritis
      may continue long after radiation therapy ends or may develop months or years
      after treatment.
  - type: paragraph
    text: Chronic radiation enteritis can cause complications such as anemia, diarrhea
      or bowel obstruction.
  - type: paragraph
    text: Treatment focuses on relieving symptoms until the inflammation heals. In
      severe cases, tube feeding or surgery to remove sections of the intestine may
      be necessary.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: The symptoms of radiation enteritis include diarrhea, nausea, vomiting and
      stomach cramps. Symptoms occur because of irritation of the intestines from
      radiation therapy for cancer. Symptoms usually go away several weeks after treatment
      ends. But sometimes they last longer. Radiation enteritis that goes on for longer
      can cause anemia and bowel obstruction.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: The risk of radiation enteritis is higher in people undergoing radiation
      treatments for cancers in the belly and the pelvis. Radiation enteritis occurs
      because radiation therapy can cause irritation of the intestines.
  subsections: []
