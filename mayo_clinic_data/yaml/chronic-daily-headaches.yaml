title: Chronic daily headaches
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Most people have headaches from time to time. But if you have a headache
      more days than not, you might have chronic daily headaches.
  - type: paragraph
    text: Rather than a specific headache type, chronic daily headaches include a
      variety of headache subtypes. Chronic refers to how often the headaches occur
      and how long the condition lasts.
  - type: paragraph
    text: The constant nature of chronic daily headaches makes them one of the most
      disabling headache conditions. Aggressive initial treatment and steady, long-term
      management might reduce pain and lead to fewer headaches.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: By definition, chronic daily headaches occur 15 days or more a month, for
      longer than three months. True (primary) chronic daily headaches aren't caused
      by another condition.
  - type: paragraph
    text: 'There are short-lasting and long-lasting chronic daily headaches. Long-lasting
      headaches last more than four hours. They include:'
  - type: list
    ordered: false
    items:
    - Chronic migraine
    - Chronic tension-type headache
    - New daily persistent headache
    - Hemicrania continua
  subsections:
  - heading: Chronic migraine
    level: 3
    content:
    - type: paragraph
      text: 'This type typically occurs in people with a history of episodic migraines.
        Chronic migraines tend to:'
    - type: list
      ordered: false
      items:
      - Affect one side or both sides of your head
      - Have a pulsating, throbbing sensation
      - Cause moderate to severe pain
    - type: paragraph
      text: 'And they cause at least one of the following:'
    - type: list
      ordered: false
      items:
      - Nausea, vomiting or both
      - Sensitivity to light and sound
    subsections: []
  - heading: Chronic tension-type headache
    level: 3
    content:
    - type: paragraph
      text: 'These headaches tend to:'
    - type: list
      ordered: false
      items:
      - Affect both sides of your head
      - Cause mild to moderate pain
      - Cause pain that feels pressing or tightening, but not pulsating
    subsections: []
  - heading: New daily persistent headache
    level: 3
    content:
    - type: paragraph
      text: 'These headaches come on suddenly, usually in people without a headache
        history. They become constant within three days of your first headache. They:'
    - type: list
      ordered: false
      items:
      - Often affect both sides of your head
      - Cause pain that feels like pressing or tightening, but not pulsating
      - Cause mild to moderate pain
      - Might have features of chronic migraine or chronic tension-type headache
    subsections: []
  - heading: Hemicrania continua
    level: 3
    content:
    - type: paragraph
      text: 'These headaches:'
    - type: list
      ordered: false
      items:
      - Affect only one side of your head
      - Are daily and continuous with no pain-free periods
      - Cause moderate pain with spikes of severe pain
      - Respond to the prescription pain reliever indomethacin (Indocin)
      - Can become severe with development of migraine-like symptoms
    - type: paragraph
      text: 'In addition, hemicrania continua headaches are associated with at least
        one of the following:'
    - type: list
      ordered: false
      items:
      - Tearing or redness of the eye on the affected side
      - Nasal congestion or runny nose
      - Drooping eyelid or pupil narrowing
      - Sensation of restlessness
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'Occasional headaches are common, and usually require no medical attention.
        However, consult your doctor if:'
    - type: list
      ordered: false
      items:
      - You usually have two or more headaches a week
      - You take a pain reliever for your headaches most days
      - You need more than the recommended dose of over-the-counter pain remedies
        to relieve your headaches
      - Your headache pattern changes or your headaches worsen
      - Your headaches are disabling
    - type: paragraph
      text: 'Seek prompt medical care if your headache:'
    - type: list
      ordered: false
      items:
      - Is sudden and severe
      - Accompanies a fever, stiff neck, confusion, seizure, double vision, weakness,
        numbness or difficulty speaking
      - Follows a head injury
      - Gets worse despite rest and pain medication
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The causes of many chronic daily headaches aren't well-understood. True
      (primary) chronic daily headaches don't have an identifiable underlying cause.
  - type: paragraph
    text: 'Conditions that might cause nonprimary chronic daily headaches include:'
  - type: list
    ordered: false
    items:
    - Inflammation or other problems with the blood vessels in and around the brain,
      including stroke
    - Infections, such as meningitis
    - Intracranial pressure that's either too high or too low
    - Brain tumor
    - Traumatic brain injury
  subsections:
  - heading: Medication overuse headache
    level: 3
    content:
    - type: paragraph
      text: This type of headache usually develops in people who have an episodic
        headache disorder, usually migraine or tension type, and take too much pain
        medication. If you're taking pain medications — even over-the-counter — more
        than two days a week (or nine days a month), you're at risk of developing
        rebound headaches.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors associated with developing frequent headaches include:'
  - type: list
    ordered: false
    items:
    - Female sex
    - Anxiety
    - Depression
    - Sleep disturbances
    - Obesity
    - Snoring
    - Overuse of caffeine
    - Overuse of headache medication
    - Other chronic pain conditions
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: If you have chronic daily headaches, you're also more likely to have depression,
      anxiety, sleep disturbances, and other psychological and physical problems.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: Taking care of yourself might help ease chronic daily headaches.
  - type: list
    ordered: false
    items:
    - Avoid headache triggers. Keeping a headache diary can help you determine what
      triggers your headaches so that you can avoid the triggers. Include details
      about every headache, such as when it started, what you were doing at the time
      and how long it lasted.
    - Avoid medication overuse. Taking headache medications, including over-the-counter
      medications, more than twice a week can increase the severity and frequency
      of your headaches. Consult your doctor about how to wean yourself off the medication
      because there can be serious side effects if done improperly.
    - Get enough sleep. The average adult needs seven to eight hours of sleep a night.
      It's best to go to bed and wake up at the same time every day. Talk to your
      doctor if you have sleep disturbances, such as snoring.
    - Don't skip meals. Eat healthy meals at about the same times daily. Avoid food
      or drinks, such as those containing caffeine, that seem to trigger headaches.
      Lose weight if you're obese.
    - Exercise regularly. Regular aerobic physical activity can improve your physical
      and mental well-being and reduce stress. With your doctor's OK, choose activities
      you enjoy — such as walking, swimming or cycling. To avoid injury, start slowly.
    - Reduce stress. Stress is a common trigger of chronic headaches. Get organized.
      Simplify your schedule. Plan ahead. Stay positive. Try stress-reduction techniques,
      such as yoga, tai chi or meditation.
    - Reduce caffeine. While some headache medications include caffeine because it
      can be beneficial in reducing headache pain, it can also aggravate headaches.
      Try to minimize or eliminate caffeine from your diet.
  subsections: []
