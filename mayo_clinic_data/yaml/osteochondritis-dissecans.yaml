title: Osteochondritis dissecans
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Osteochondritis dissecans (os-tee-o-kon-DRY-tis DIS-uh-kanz) is a joint
      condition in which bone underneath the cartilage of a joint dies due to lack
      of blood flow. This bone and cartilage can then break loose, causing pain and
      possibly hindering joint motion.
  - type: paragraph
    text: Osteochondritis dissecans occurs most often in children and adolescents.
      It can cause symptoms either after an injury to a joint or after several months
      of activity, especially high-impact activity such as jumping and running, that
      affects the joint. The condition occurs most commonly in the knee, but also
      occurs in elbows, ankles and other joints.
  - type: paragraph
    text: Doctors stage osteochondritis dissecans according to the size of the injury,
      whether the fragment is partially or completely detached, and whether the fragment
      stays in place. If the loosened piece of cartilage and bone stays in place,
      you may have few or no symptoms. For young children whose bones are still developing,
      the injury might heal by itself.
  - type: paragraph
    text: Surgery might be necessary if the fragment comes loose and gets caught between
      the moving parts of your joint or if you have persistent pain.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Depending on the joint that''s affected, signs and symptoms of osteochondritis
      dissecans might include:'
  - type: list
    ordered: false
    items:
    - Pain. This most common symptom of osteochondritis dissecans might be triggered
      by physical activity — walking up stairs, climbing a hill or playing sports.
    - Swelling and tenderness. The skin around your joint might be swollen and tender.
    - Joint popping or locking. Your joint might pop or stick in one position if a
      loose fragment gets caught between bones during movement.
    - Joint weakness. You might feel as though your joint is "giving way" or weakening.
    - Decreased range of motion. You might be unable to straighten the affected limb
      completely.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If you have persistent pain or soreness in your knee, elbow or another
        joint, see your doctor. Other signs and symptoms that should prompt a call
        or visit to your doctor include joint swelling or an inability to move a joint
        through its full range of motion.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The cause of osteochondritis dissecans is unknown. The reduced blood flow
      to the end of the affected bone might result from repetitive trauma — small,
      multiple episodes of minor, unrecognized injury that damage the bone. There
      might be a genetic component, making some people more inclined to develop the
      disorder.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Osteochondritis dissecans occurs most commonly in children and adolescents
      between the ages of 10 and 20 who are highly active in sports.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Osteochondritis dissecans can increase your risk of eventually developing
      osteoarthritis in that joint.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: Adolescents participating in organized sports might benefit from education
      on the risks to their joints associated with overuse. Learning the proper mechanics
      and techniques of their sport, using the proper protective gear, and participating
      in strength training and stability training exercises can help reduce the chance
      of injury.
  subsections: []
