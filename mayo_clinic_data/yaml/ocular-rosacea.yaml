title: Ocular rosacea
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Ocular rosacea (roe-ZAY-she-uh) is inflammation that causes redness, burning
      and itching of the eyes. It often develops in people who have rosacea, a chronic
      skin condition that affects the face. Sometimes ocular (eye) rosacea is the
      first sign that you may later develop the facial type.
  - type: paragraph
    text: Ocular rosacea primarily affects adults between the ages of 30 and 50. It
      seems to develop in people who tend to blush and flush easily.
  - type: paragraph
    text: There's no cure for ocular rosacea, but medications and a good eye care
      routine can help control the signs and symptoms.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Signs and symptoms of ocular rosacea can precede the skin symptoms of rosacea,
      develop at the same time, develop later or occur on their own. Signs and symptoms
      of ocular rosacea may include:'
  - type: list
    ordered: false
    items:
    - Red, burning, itchy or watering eyes
    - Dry eyes
    - Grittiness or the feeling of having a foreign body in the eye or eyes
    - Blurred vision
    - Sensitivity to light (photophobia)
    - Dilated small blood vessels on the white part of the eye that are visible when
      you look in a mirror
    - Red, swollen eyelids
    - Recurrent eye or eyelid infections, such as pink eye (conjunctivitis), blepharitis,
      sties or chalazia
  - type: paragraph
    text: The severity of ocular rosacea symptoms doesn't always match the severity
      of skin symptoms.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment to see a doctor if you have signs and symptoms of
        ocular rosacea, such as dry eyes, burning or itchy eyes, redness, or blurred
        vision.
    - type: paragraph
      text: If you've been diagnosed with skin rosacea, ask your doctor whether you
        should undergo periodic eye exams to check for ocular rosacea.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'The exact cause of ocular rosacea, like skin rosacea, is unknown. It may
      be due to one or more factors, including:'
  - type: list
    ordered: false
    items:
    - Heredity
    - Environmental factors
    - Bacterial involvement
    - Blocked glands in the eyelids
    - Eyelash mites
  - type: paragraph
    text: Some research has also shown a possible link between skin rosacea and Helicobacter
      pylori bacteria, which is the same bacteria that causes gastrointestinal infections.
  - type: paragraph
    text: 'A number of factors that aggravate skin rosacea can aggravate ocular rosacea,
      as well. Some of these factors include:'
  - type: list
    ordered: false
    items:
    - Hot or spicy foods or beverages
    - Alcohol
    - Sunlight, wind or temperature extremes
    - Certain emotions, such as stress, anger or embarrassment
    - Strenuous exercise
    - Hot baths or saunas
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Ocular rosacea is common in people with skin rosacea, although you can also
      have ocular rosacea without the skin being involved. Skin rosacea affects more
      women than men, and ocular rosacea affects men and women equally. It's also
      more common in fair-skinned people of Celtic and Northern European origin.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Ocular rosacea may affect the surface of your eye (cornea), particularly
      when you have dry eyes from evaporation of tears. Corneal complications can
      lead to visual symptoms. Inflammation of your eyelids (blepharitis) can cause
      secondary irritation of the cornea from misdirected eyelashes or other complications.
      Ultimately, corneal complications can lead to vision loss.
  subsections: []
