title: Popliteal artery entrapment syndrome
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Popliteal artery entrapment syndrome, also called PAES, is an uncommon condition
      that affects the main artery behind the knee. That artery is the popliteal artery.
      In this condition, the calf muscle is in the wrong position or is larger than
      usual. The muscle presses on the artery. The artery becomes trapped, making
      it harder for blood to flow to the lower leg and foot.
  - type: paragraph
    text: Popliteal artery entrapment syndrome is most common among athletes.
  - type: paragraph
    text: PAES is grouped into six types. The types depend on the location of the
      artery and if there are changes in nearby muscle or fiber structures. Type 6
      is the most common.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'The main symptom of popliteal artery entrapment syndrome, also called PAES,
      is pain or cramping in the back of the lower leg. The back of the lower leg
      is called the calf. The pain or cramping occurs during exercise and goes away
      with rest. Other symptoms of PAES may include:'
  - type: list
    ordered: false
    items:
    - Cold feet after exercise.
    - Tingling or burning in the calf.
    - Numbness in the calf area.
  - type: paragraph
    text: 'If the nearby vein, called the popliteal vein, also becomes trapped by
      the calf muscle, you may have:'
  - type: list
    ordered: false
    items:
    - A heavy feeling in the leg.
    - Lower leg cramping at night.
    - Swelling in the calf area.
    - Changes in skin color around the calf muscle.
  - type: paragraph
    text: Symptoms typically affect people under age 40.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment for a health checkup if you have any type of leg pain.
        This is especially important if you have calf or foot cramping during activity
        that gets better with rest.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Popliteal artery entrapment syndrome, also called PAES, is caused by an
      irregular calf muscle, usually the gastrocnemius muscle.
  - type: paragraph
    text: The condition may be seen at birth, or it may occur later in life. When
      it's present at birth, the calf muscle or nearby artery forms in the wrong place
      during pregnancy. People who get the condition later in life have a calf muscle
      that is bigger than usual.
  - type: paragraph
    text: The changes in the calf muscle cause it to press on the main artery behind
      the knee. This reduces blood flow to the lower leg. The lack of blood flow causes
      pain and cramping in the back of the lower leg during times of activity.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Popliteal artery entrapment syndrome, also called PAES, is uncommon. The
      following things increase the risk of the condition:'
  - type: list
    ordered: false
    items:
    - Younger age. The condition is most often seen in people who are in their late
      teens or 20s. It's rarely diagnosed in those over age 40.
    - Male sex assigned at birth. PAES can occur in anyone, but it's much more common
      in young men.
    - Extreme athletic activity. Runners, bicyclists, and athletes who try to build
      muscle fast with weight training routines or high-intensity circuit training
      are at the highest risk.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Long-term pressure on the popliteal artery can cause the artery to narrow.
      This is called artery stenosis. It can cause pain and cramping with just slight
      activity, such as walking.
  - type: paragraph
    text: In very bad cases or when the condition is not diagnosed, the nerves and
      muscles in the leg can become damaged. Blood clots may occur in the lower leg.
      Sometimes popliteal artery entrapment syndrome may lead to other artery damage
      that needs treatment.
  subsections: []
