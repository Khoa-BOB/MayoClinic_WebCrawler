title: Idiopathic hypersomnia
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Idiopathic hypersomnia is a condition that causes people to be very sleepy
      during the day even after a full night of sleep. People with the condition have
      trouble waking up from sleep. They also may wake up confused and disoriented.
      Naps typically don't lead to feeling refreshed.
  - type: paragraph
    text: Idiopathic hypersomnia is not common, and the cause of the condition is
      not known.
  - type: paragraph
    text: The need to sleep can strike at any time, including when driving a car or
      working. This makes idiopathic hypersomnia potentially dangerous.
  - type: paragraph
    text: The condition often develops slowly over time. Diagnosing idiopathic hypersomnia
      requires ruling out more common sleep conditions. Treatment aims to control
      symptoms with medicine.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'The main symptom of idiopathic hypersomnia is being very sleepy during
      the day. Symptoms begin slowly over several weeks or months and may include:'
  - type: list
    ordered: false
    items:
    - Having a strong need to sleep.
    - Not being able to stay awake and alert during the day.
    - Sleeping more than 11 hours at night.
    - Having trouble waking up in the morning.
    - Being confused, moving slowly and having trouble with coordination after waking
      up.
    - Feeling anxiety after waking up.
  - type: paragraph
    text: People with idiopathic hypersomnia may need to set several loud alarms to
      wake up in the morning.
  - type: paragraph
    text: 'People with the condition also may:'
  - type: list
    ordered: false
    items:
    - Take naps longer than an hour.
    - Not feel refreshed after naps.
    - Have trouble with memory and attention.
  - type: paragraph
    text: Rarely, idiopathic hypersomnia can cause someone to fall asleep suddenly
      during the day.
  - type: paragraph
    text: Some people with idiopathic hypersomnia may experience automatic behavior
      when they are very sleepy. This can include staring, or they may drive without
      purpose and later realize that they are miles from home. Automatic behavior
      also may include writing or saying things that don't make sense. Afterward,
      people with idiopathic hypersomnia don't remember the behavior.
  subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The cause of idiopathic hypersomnia is not known.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Experts don't know what causes idiopathic hypersomnia, so risk factors are
      not known. But symptoms usually appear at a younger age, between ages 10 and
      30. And women may be more likely to have idiopathic hypersomnia than are men.
  subsections: []
