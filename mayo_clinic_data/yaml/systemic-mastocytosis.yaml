title: Systemic mastocytosis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Systemic mastocytosis (mas-to-sy-TOE-sis) is a rare disorder that results
      in too many mast cells building up in your body. A mast cell is a type of white
      blood cell. Mast cells are found in connective tissues throughout your body.
      Mast cells help your immune system function properly and normally help protect
      you from disease.
  - type: paragraph
    text: When you have systemic mastocytosis, excess mast cells build up in your
      skin, bone marrow, digestive tract or other body organs. When triggered, these
      mast cells release substances that can cause signs and symptoms similar to those
      of an allergic reaction and, sometimes, severe inflammation that may result
      in organ damage. Common triggers include alcohol, spicy foods, insect stings
      and certain medications.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Signs and symptoms of systemic mastocytosis depend on the part of the body
      affected by excessive mast cells. Too many mast cells can build up in the skin,
      liver, spleen, bone marrow or intestines. Less commonly, other organs such as
      the brain, heart or lungs also may be affected.
  - type: paragraph
    text: 'Signs and symptoms of systemic mastocytosis may include:'
  - type: list
    ordered: false
    items:
    - Flushing, itching or hives
    - Abdominal pain, diarrhea, nausea or vomiting
    - Anemia or bleeding disorders
    - Bone and muscle pain
    - Enlarged liver, spleen or lymph nodes
    - Depression, mood changes or problems concentrating
  - type: paragraph
    text: 'The mast cells are triggered to produce substances that cause inflammation
      and symptoms. People have different triggers, but the most common ones include:'
  - type: list
    ordered: false
    items:
    - Alcohol
    - Skin irritation
    - Spicy foods
    - Exercise
    - Insect stings
    - Certain medications
  - type: paragraph
    text: When to see a doctor
  - type: paragraph
    text: Talk to your doctor if you have problems with flushing or hives, or if you
      have concerns about the signs or symptoms listed above.
  subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Most cases of systemic mastocytosis are caused by a random change (mutation)
      in the KIT gene. Typically this flaw in the KIT gene is not inherited. Too many
      mast cells are produced and build up in tissues and body organs, releasing substances
      such as histamine, leukotrienes and cytokines that cause inflammation and symptoms.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Complications of systemic mastocytosis can include:'
  - type: list
    ordered: false
    items:
    - Anaphylactic reaction. This severe allergic reaction includes signs and symptoms
      such as rapid heartbeat, fainting, loss of consciousness and shock. If you have
      a severe allergic reaction, you may need an injection of epinephrine.
    - Blood disorders. These can include anemia and poor blood clotting.
    - Peptic ulcer disease. Chronic stomach irritation can lead to ulcers and bleeding
      in your digestive tract.
    - Reduced bone density. Because systemic mastocytosis can affect your bones and
      bone marrow, you may be at risk of bone problems, such as osteoporosis.
    - Organ failure. A buildup of mast cells in body organs can cause inflammation
      and damage to the organ.
  subsections: []
