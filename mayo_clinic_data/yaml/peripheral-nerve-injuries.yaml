title: Peripheral nerve injuries
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Peripheral nerves send messages from the brain and spinal cord to the rest
      of the body. They help do things such as move the body's muscles for walking
      and sense that the feet are cold. Peripheral nerves are made of fibers called
      axons that are insulated by surrounding tissues.
  - type: paragraph
    text: Peripheral nerves are fragile and easily damaged. A nerve injury can affect
      the brain's ability to communicate with muscles and organs. Damage to the peripheral
      nerves is called peripheral neuropathy.
  - type: paragraph
    text: It's important to get medical care for a peripheral nerve injury as soon
      as possible. Early diagnosis and treatment may prevent complications and permanent
      damage.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'With a peripheral nerve injury, symptoms may range from mild to serious,
      limiting your daily activities. Your symptoms often depend on which nerve fibers
      are damaged:'
  - type: list
    ordered: false
    items:
    - Motor nerves. These nerves regulate all the muscles under your conscious control,
      such as those used for walking, talking and holding objects. Damage to these
      nerves can cause muscle weakness, painful cramps and muscle twitching.
    - Sensory nerves. Because these nerves relay information about touch, temperature
      and pain, you may experience a variety of symptoms. These include numbness or
      tingling in the hands or feet. You may have trouble walking, keeping your balance
      with your eyes closed, fastening buttons, or sensing pain or changes in temperature.
      Injury of sensory nerves also may cause pain.
    - Autonomic (aw-tuh-NOM-ik) nerves. This group of nerves regulates activities
      that are not controlled consciously, such as breathing, heart and thyroid function,
      and digestion. Symptoms may include excessive sweating, changes in blood pressure,
      the inability to tolerate heat and gastrointestinal symptoms.
  - type: paragraph
    text: Many peripheral nerve injuries affect more than one type of nerve fiber,
      so you may experience a range of symptoms.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If you experience weakness, tingling, numbness or a total loss of feeling,
        see your healthcare professional to find out the cause. It's important to
        treat peripheral nerve injuries early.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Peripheral nerves can be damaged in several ways:'
  - type: list
    ordered: false
    items:
    - Injury from an accident, a fall or sports can stretch, compress, crush or cut
      nerves.
    - Medical conditions, such as diabetes, Guillain-Barre syndrome and carpal tunnel
      syndrome, can damage nerves.
    - Autoimmune diseases including lupus, rheumatoid arthritis and Sjogren syndrome
      also can damage nerves.
  - type: paragraph
    text: Other causes include narrowing of the arteries, changes in hormone balance
      and tumors.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: People who experience physical trauma or play sports may be at higher risk
      of an injury that can stretch or crush peripheral nerves. People with certain
      medical conditions also may be at higher risk of peripheral nerve injuries.
      These conditions, especially diabetes, may put nerves at greater risk of compression.
  subsections: []
