title: Hip dysplasia
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Hip dysplasia is the medical term for a hip socket that doesn't fully cover
      the ball portion of the upper thighbone. This allows the hip joint to become
      partially or completely dislocated. Most people with hip dysplasia are born
      with the condition.
  - type: paragraph
    text: Healthcare professionals will check your baby for signs of hip dysplasia
      shortly after birth and during well-baby visits. If hip dysplasia is diagnosed
      in early infancy, a soft brace can usually correct the problem.
  - type: paragraph
    text: Mild hip dysplasia might not start causing symptoms until a person is a
      teenager or young adult. Hip dysplasia can damage the cartilage lining the joint.
      It also can hurt the soft cartilage, called the labrum, that rims the socket
      portion of the hip joint. This is called a hip labral tear.
  - type: paragraph
    text: In older children and young adults, surgery may be needed to move the bones
      into the proper positions for smooth joint movement.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Symptoms vary by age group. In infants, you might notice that one leg is
      longer than the other. Once a child begins walking, a limp may develop. During
      diaper changes, one hip may be less flexible than the other.
  - type: paragraph
    text: In teenagers and young adults, hip dysplasia can cause painful complications
      such as osteoarthritis or a hip labral tear. This may cause activity-related
      groin pain. Sometimes, there might be a sensation of instability in the hip.
  subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: At birth, the hip joint is made of soft cartilage that gradually hardens
      into bone. The ball and socket need to fit together well because they act as
      molds for each other. If the ball isn't seated firmly into the socket, the socket
      will not fully form around the ball and will become too shallow.
  - type: paragraph
    text: 'During the final month before birth, the space within the womb can become
      so crowded that the ball of the hip joint moves out of its proper position.
      This results in a shallower socket. Factors that may reduce the amount of space
      in the womb include:'
  - type: list
    ordered: false
    items:
    - First pregnancy.
    - Large baby.
    - Breech presentation.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Hip dysplasia tends to run in families and is more common in girls. The
      risk of hip dysplasia is also higher in babies born in the breech position and
      in babies who are swaddled tightly with the hips and knees straight.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Later in life, hip dysplasia can damage the soft cartilage, called the labrum,
      that rims the socket portion of the hip joint. This is called a hip labral tear.
      Hip dysplasia can also make the joint more likely to develop osteoarthritis.
      This happens because of higher contact pressures over a smaller surface of the
      socket. Over time, this wears away the smooth cartilage on the bones that helps
      them glide against each other as the joint moves.
  subsections: []
