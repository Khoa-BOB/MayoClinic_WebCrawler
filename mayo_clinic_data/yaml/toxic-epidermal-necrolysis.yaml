title: TEN
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Toxic epidermal necrolysis (TEN) is a rare, life-threatening skin reaction,
      usually caused by a medication. It's a severe form of Stevens-Johnson syndrome
      (SJS). In people with SJS , TEN is diagnosed when more than 30% of the skin
      surface is affected and the moist linings of the body (mucous membranes) have
      extensive damage.
  - type: paragraph
    text: TEN is a life-threatening condition that affects people of all ages. TEN
      is usually treated in a hospital. While the skin heals, supportive care includes
      controlling pain, caring for wounds and making sure you're getting enough fluids.
      Recovery can take weeks to months.
  - type: paragraph
    text: If your condition was caused by a medication, you'll need to permanently
      avoid that drug and those related to it.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Toxic epidermal necrolysis signs and symptoms include:'
  - type: list
    ordered: false
    items:
    - Widespread skin pain
    - A spreading rash covering more than 30% of the body
    - Blisters and large areas of peeling skin
    - Sores, swelling and crusting on the mucous membranes, including the mouth, eyes
      and vagina
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Early treatment is key for people with Stevens-Johnson syndrome/toxic
        epidermal necrolysis (SJS/TEN). If you have symptoms, seek immediate medical
        attention. You'll likely need care from a skin specialist (dermatologist)
        and other experts in a hospital.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: SJS/TEN is usually caused by a skin reaction to medicine. The symptoms are
      likely to start showing up one to four weeks after you start taking a new drug.
  - type: paragraph
    text: The most common drug triggers of SJS/TEN include antibiotics, epilepsy drugs,
      sulfa drugs and allopurinol (Aloprim, Zyloprim).
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that increase your risk of SJS/TEN include:'
  - type: list
    ordered: false
    items:
    - HIV infection. Among people with HIV, the incidence of SJS/TEN is about 100
      times greater than that among the general population.
    - A weakened immune system. The immune system can be affected by an organ transplant,
      HIV/AIDS and autoimmune diseases.
    - Cancer. People with cancer, especially blood cancers (hematologic malignancies),
      are at increased risk of SJS/TEN .
    - A history of SJS/TEN . If you've had a medication-related form of this condition,
      you are at risk of a recurrence if you use that drug again.
    - A family history of SJS/TEN . If a first-degree relative, such as a parent or
      sibling, has had SJS/TEN , you may be more susceptible to developing it too.
    - Genetic factors. Having certain genetic variations puts you at increased risk
      of SJS/TEN , especially if you're also taking drugs for seizures, gout or mental
      illness.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'People at highest risk of TEN complications are those over age 70 and those
      who have liver cirrhosis or spreading (metastatic) cancer. Complications of
      TEN include:'
  - type: list
    ordered: false
    items:
    - Blood infection (sepsis). Sepsis occurs when bacteria from an infection enter
      your bloodstream and spread throughout your body. Sepsis is a rapidly progressing,
      life-threatening condition that can cause shock and organ failure.
    - Lung involvement. This can cause coughing, difficulty breathing and, with severe
      disease, acute respiratory failure.
    - Visual impairment. TEN can cause eye problems, such as dry eye, ingrown eyelashes,
      corneal scarring and, rarely, blindness.
    - Permanent skin damage. After recovering from TEN , your skin may have bumps,
      scars and discoloration. Lasting skin problems might cause your hair to fall
      out, and your fingernails and toenails might not grow normally.
    - Vaginal sores. In women, TEN can cause sores in the tissues lining the vagina,
      leading to pain or, if left untreated, vaginal fusion.
    - Emotional distress. This condition causes distress and can have long-term psychological
      impact.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: To prevent another episode of TEN , learn whether it was caused by a medicine.
      If so, never take that medicine or anything similar again. A recurrence could
      be worse and life-threatening. Also tell any future health care providers about
      your history of TEN , and wear a medic alert bracelet or necklace with information
      about your condition. Or carry an allergy passport.
  subsections: []
