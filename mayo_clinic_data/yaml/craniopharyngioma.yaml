title: Craniopharyngioma
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Craniopharyngioma is a rare type of noncancerous brain tumor.
  - type: paragraph
    text: Craniopharyngioma begins as a growth of cells near the brain's pituitary
      gland. The pituitary gland makes hormones that control many body functions.
      As a craniopharyngioma slowly grows, it can affect the pituitary gland and other
      nearby structures in the brain.
  - type: paragraph
    text: Craniopharyngioma can happen at any age, but it occurs most often in children
      and older adults. Symptoms include changes in vision over time, fatigue, headaches
      and urinating more often. Children with craniopharyngioma may grow slowly and
      may be smaller than expected.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Signs and symptoms of craniopharyngioma may include:'
  - type: list
    ordered: false
    items:
    - Headaches.
    - Vision changes.
    - Nausea and vomiting.
    - Increased urination.
    - Sleepiness.
    - Memory troubles.
    - Loss of balance.
    - Trouble walking.
    - Changes in personality or behavior.
    - Weight gain and slowed growth in children.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with a doctor or other healthcare professional if
        you have any symptoms that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: It's not clear what causes craniopharyngioma. Craniopharyngioma begins as
      a growth of cells near the brain's pituitary gland. The pituitary gland makes
      hormones that control many body functions.
  - type: paragraph
    text: Craniopharyngioma happens when cells develop changes in their DNA. A cell's
      DNA holds the instructions that tell the cell what to do. In healthy cells,
      the DNA gives instructions to grow and multiply at a set rate. The instructions
      tell the cells to die at a set time. In tumor cells, the DNA changes give different
      instructions. The changes tell the tumor cells to grow and multiply quickly.
      Tumor cells can keep living when healthy cells would die. This causes too many
      cells.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Healthcare professionals haven't found many risk factors for craniopharyngioma.
      This tumor can happen at any age. But it's more common in children and older
      adults.
  subsections: []
