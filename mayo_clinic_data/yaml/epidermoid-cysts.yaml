title: Epidermoid cysts
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Epidermoid (ep-ih-DUR-moid) cysts are harmless small bumps beneath the skin.
      They are most common on the face, neck and trunk.
  - type: paragraph
    text: Epidermoid cysts are slow growing and often painless, so they rarely cause
      problems or need treatment. You might choose to have a cyst removed if it bothers
      you, breaks open, or is painful or infected.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Epidermoid cyst signs and symptoms include:'
  - type: list
    ordered: false
    items:
    - A small, round bump under the skin, often on the face, neck or trunk
    - A tiny blackhead plugging the central opening of the cyst
    - A thick, smelly, cheesy substance that leaks from the cyst
    - An inflamed or infected bump
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'Most epidermoid cysts don''t cause problems or need treatment. See your
        healthcare professional if you have a cyst that:'
    - type: list
      ordered: false
      items:
      - Grows or multiplies rapidly.
      - Breaks open.
      - Is painful or infected.
      - Is in a spot that keeps getting scratched or bumped.
      - Bothers you because of how it looks.
      - Is in an unusual spot, such as a finger or toe.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The surface of the skin, also called the epidermis, is made up of a thin,
      protective layer of cells that the body sheds nonstop. Most epidermoid cysts
      form when these cells move deeper into the skin rather than shed. Sometimes
      this type of cyst forms due to irritation or injury of the skin or a hair follicle.
  - type: paragraph
    text: Epidermal cells form the walls of the cyst and then secrete the protein
      keratin into it. Keratin is the thick, cheesy substance that can leak from the
      cyst.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Anyone can develop an epidermoid cyst, but these factors make it more likely:'
  - type: list
    ordered: false
    items:
    - Being past puberty.
    - Having a rare, inherited condition called Gardner syndrome.
    - Injuring the skin.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Potential complications of epidermoid cysts include:'
  - type: list
    ordered: false
    items:
    - Inflammation. An epidermoid cyst can become painful and swollen, even if it's
      not infected. An inflamed cyst is hard to remove. Your doctor is likely to postpone
      removing a cyst until the inflammation subsides.
    - Rupture. A cyst that breaks open can lead to a boil-like infection that needs
      prompt treatment.
    - Skin cancer. In rare cases, epidermoid cysts can lead to skin cancer.
  subsections: []
