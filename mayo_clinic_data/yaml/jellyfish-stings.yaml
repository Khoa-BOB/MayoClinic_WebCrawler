title: Jellyfish stings
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Jellyfish stings are fairly common problems for people swimming, wading
      or diving in oceans. The long tentacles trailing from the jellyfish can inject
      venom from thousands of microscopic barbed stingers.
  - type: paragraph
    text: Most often jellyfish stings cause instant pain and inflamed marks on the
      skin. Some stings may cause more whole-body (systemic) illness. And in rare
      cases they're life-threatening.
  - type: paragraph
    text: Most jellyfish stings get better over a few days or weeks with home treatment.
      Severe reactions likely need emergency medical care.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of jellyfish stings include:'
  - type: list
    ordered: false
    items:
    - Burning, prickling, stinging pain
    - Welts or tracks on the skin — a "print" of the tentacles' contact with the skin
    - Itchiness (pruritus)
    - Swelling
    - Throbbing pain that radiates up a leg or an arm
  - type: paragraph
    text: 'Severe jellyfish stings can affect multiple body systems. These reactions
      may appear rapidly or several hours after the stings. Symptoms of severe jellyfish
      stings include:'
  - type: list
    ordered: false
    items:
    - Stomach pain, nausea and vomiting
    - Headache
    - Muscle pain or spasms
    - Faintness, dizziness or confusion
    - Difficulty breathing
    - Heart problems
  - type: paragraph
    text: 'The severity of a reaction depends on:'
  - type: list
    ordered: false
    items:
    - The type and size of the jellyfish
    - The age, size and health of the person affected, with severe reactions more
      likely in children
    - How long the person was exposed to the stingers
    - How much of the skin is affected
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Seek emergency treatment if you have severe symptoms.
    - type: paragraph
      text: See your health care provider if your symptoms worsen or the wound shows
        symptoms of infection.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Jellyfish stings are caused by brushing against a jellyfish tentacle. Tentacles
      have thousands of microscopic barbed stingers. Each stinger has a tiny bulb
      that holds venom and a coiled, sharp-tipped tube.
  - type: paragraph
    text: When you brush against a tentacle, tiny triggers on its surface release
      the stingers. The tube pierces the skin and releases venom. It affects the area
      of contact and may enter the bloodstream.
  - type: paragraph
    text: Jellyfish that have washed up on a beach may still release venomous stingers
      if touched.
  subsections:
  - heading: Types of jellyfish
    level: 3
    content:
    - type: paragraph
      text: 'Many types of jellyfish are fairly harmless to humans. Others can cause
        severe pain and a full-body (systemic) reaction. These jellyfish cause more-serious
        problems in people:'
    - type: list
      ordered: false
      items:
      - Box jellyfish. Box jellyfish can cause intense pain and, rarely, life-threatening
        reactions. The more dangerous species of box jellyfish are in the warm waters
        of the Pacific and Indian oceans.
      - Portuguese man-of-war. Also called bluebottle jellyfish, Portuguese man-of-war
        jellyfish live mostly in warmer seas. This type has a blue or purplish gas-filled
        bubble that keeps it afloat.
      - Sea nettle. Common in both warm and cool seawaters.
      - Lion's mane jellyfish. These are the world's largest jellyfish, with a body
        diameter of more than 3 feet (1 meter). They're most common in cooler, northern
        regions of the Pacific and Atlantic oceans.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Conditions that increase the risk of jellyfish stings:'
  - type: list
    ordered: false
    items:
    - Swimming when jellyfish appear in large numbers (a jellyfish bloom)
    - Swimming or diving in jellyfish areas without protective clothing
    - Playing or sunbathing where jellyfish are washed up on the beach
    - Swimming in a place known to have many jellyfish
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Possible complications of a jellyfish sting include:'
  - type: list
    ordered: false
    items:
    - Delayed skin reaction, causing blisters, rash or other irritation
    - Irukandji syndrome, which causes chest and stomach pain, high blood pressure,
      and heart problems
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'The following tips can help you avoid jellyfish stings:'
  - type: list
    ordered: false
    items:
    - Wear a protective suit. When swimming or diving in areas where jellyfish stings
      are possible, wear a wet suit or other protective clothing. Diving stores sell
      protective "skin suits" or "stinger suits" made of thin, high-tech fabric. Consider
      protective footwear, as stings can also occur while wading in shallow water.
    - Get information about conditions. Talk to lifeguards, local residents or officials
      with a local health department before swimming or diving in coastal waters,
      especially in areas where jellyfish are common.
    - Avoid water during jellyfish season. Stay out of the water in jellyfish areas
      when jellyfish numbers are high.
  subsections: []
