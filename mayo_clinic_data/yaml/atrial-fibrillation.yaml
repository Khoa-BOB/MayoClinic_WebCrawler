title: Atrial fibrillation
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Atrial fibrillation (AFib) is an irregular and often very rapid heart rhythm.
      An irregular heart rhythm is called an arrhythmia. AFib can lead to blood clots
      in the heart. The condition also increases the risk of stroke, heart failure
      and other heart-related complications.
  - type: paragraph
    text: During atrial fibrillation, the heart's upper chambers, called the atria,
      beat chaotically and irregularly. They beat out of sync with the lower heart
      chambers, called the ventricles. AFib may cause a fast, pounding heartbeat,
      shortness of breath or light-headedness. Some people don't notice symptoms.
  - type: paragraph
    text: Episodes of atrial fibrillation may come and go, or they may be constant.
      AFib itself usually isn't life-threatening. But it's a serious condition that
      needs proper treatment to prevent stroke.
  - type: paragraph
    text: Treatment for AFib may include medicines, therapy to shock the heart back
      to a regular rhythm and procedures to block faulty heart signals.
  - type: paragraph
    text: A person with atrial fibrillation also may have a related heart rhythm disorder
      called atrial flutter. The treatments for AFib and atrial flutter are similar.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of atrial fibrillation (AFib) may include:'
  - type: list
    ordered: false
    items:
    - A fast, fluttering or pounding heartbeat, called palpitations.
    - Chest pain.
    - Dizziness.
    - Fatigue.
    - Lightheadedness.
    - Reduced ability to exercise.
    - Shortness of breath.
    - Weakness.
  - type: paragraph
    text: Some people with AFib don't notice any symptoms.
  - type: paragraph
    text: 'Atrial fibrillation may be:'
  - type: list
    ordered: false
    items:
    - Occasional, also called paroxysmal atrial fibrillation. AFib symptoms come and
      go. The symptoms usually last for a few minutes to hours. Some people have symptoms
      for as long as a week. The irregular heartbeat can happen again and again. Symptoms
      might go away on their own. Some people with this type of AFib need treatment.
    - Persistent. The irregular heartbeat is constant. The heart rhythm does not correct
      itself. If symptoms occur, medical treatment is needed to reset the heart rhythm.
    - Long-standing persistent. This type of AFib is constant and lasts longer than
      12 months. Medicines or a procedure are needed to correct the irregular heartbeat.
    - Permanent. The irregular heart rhythm can't be reset. Medicines are needed to
      control the heart rate and to prevent blood clots.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If you have symptoms of atrial fibrillation, make an appointment for a
        health checkup. You may be referred to a doctor trained in heart diseases,
        called a cardiologist.
    - type: paragraph
      text: If you have chest pain, get emergency medical help right away. Chest pain
        could mean that you're having a heart attack.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: To understand the causes of atrial fibrillation (AFib), it may be helpful
      to know how the heart typically beats.
  - type: paragraph
    text: 'The heart has four chambers:'
  - type: list
    ordered: false
    items:
    - The two upper chambers are called the atria.
    - The two lower chambers are called the ventricles.
  - type: paragraph
    text: Inside the upper right heart chamber is a group of cells called the sinus
      node. The sinus node makes the signals that start each heartbeat.
  - type: paragraph
    text: The signals move across the upper heart chambers. Next, the signals arrive
      at a group of cells called the AV node, where they usually slow down. The signals
      then go to the lower heart chambers.
  - type: paragraph
    text: In a healthy heart, this signaling process usually goes smoothly. The resting
      heart rate is typically 60 to 100 beats a minute.
  - type: paragraph
    text: But in atrial fibrillation, the signals in the upper chambers of the heart
      are chaotic. As a result, the upper chambers tremble or shake. The AV node is
      flooded with signals trying to get through to the lower heart chambers. This
      causes a fast and irregular heart rhythm.
  - type: paragraph
    text: In people with AFib, the heart rate may range from 100 to 175 beats a minute.
  subsections:
  - heading: Causes of atrial fibrillation
    level: 3
    content:
    - type: paragraph
      text: Changes with the heart's structure are the most common cause of atrial
        fibrillation (AFib).
    - type: paragraph
      text: 'Heart diseases and health conditions that can cause AFib include:'
    - type: list
      ordered: false
      items:
      - A heart condition you're born with, called a congenital heart defect.
      - A heart rhythm disorder that affects the heart's natural pacemaker, called
        sick sinus syndrome.
      - A sleep disorder called obstructive sleep apnea.
      - Heart attack.
      - Heart valve disease.
      - High blood pressure.
      - Lung diseases, including pneumonia.
      - Narrowed or blocked arteries, called coronary artery disease.
      - Thyroid disease such as an overactive thyroid.
      - Infections from viruses.
    - type: paragraph
      text: Heart surgery or stress due to surgery or sickness also may cause AFib.
        Some people who have atrial fibrillation have no known heart disease or heart
        damage.
    - type: paragraph
      text: 'Lifestyle habits that can send the heart into AFib may include:'
    - type: list
      ordered: false
      items:
      - Drinking too much alcohol or caffeine.
      - Illegal drug use.
      - Smoking or using tobacco.
      - Taking medicines that have stimulants, including cold and allergy medicines
        bought without a prescription.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Things that can increase the risk of atrial fibrillation (AFib) include:'
  - type: list
    ordered: false
    items:
    - Age. The risk of AFib increases as you grow older.
    - Caffeine, nicotine or illegal drug use. Caffeine, nicotine and some illegal
      drugs — such as amphetamines and cocaine — can cause your heart to beat faster.
      Use of these substances may lead to the development of more-serious irregular
      heartbeats.
    - Drinking too much alcohol. Drinking too much alcohol can affect the electrical
      signals in the heart and cause an irregular heartbeat.
    - Changes in the level of body minerals. Minerals in the blood called electrolytes
      help the heart beat. They include potassium, sodium, calcium and magnesium.
      If these substances are too low or too high, irregular heartbeats may occur.
    - Family history. An increased risk of atrial fibrillation occurs in some families.
    - Heart conditions or heart surgery. Coronary artery disease, heart valve disease
      and heart conditions present at birth increase the risk of AFib. A history of
      heart attack or heart surgery also makes a person more likely to get the condition.
    - High blood pressure. Over time, high blood pressure may cause part of the heart
      to become stiff and thick. This can change how heartbeat signals travel through
      the heart.
    - Obesity. People who have obesity are at higher risk of developing atrial fibrillation.
    - Other long-term health conditions. You may be more likely to get AFib if you
      have diabetes, chronic kidney disease, lung disease or sleep apnea.
    - Some medicines and supplements. Some prescription medicines and certain cough
      and cold remedies bought without a prescription can cause irregular heartbeats.
    - Thyroid disease. Having an overactive thyroid gland can raise the risk of irregular
      heartbeats.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: A possible complication of atrial fibrillation (AFib) is blood clots. Blood
      clots can lead to stroke.
  - type: paragraph
    text: 'The risk of stroke from AFib increases as you grow older. Other health
      conditions also may increase the risk of a stroke due to AFib. These conditions
      include:'
  - type: list
    ordered: false
    items:
    - High blood pressure.
    - Diabetes.
    - Heart failure.
    - Some types of heart valve disease.
  - type: paragraph
    text: Blood thinners are commonly used to prevent blood clots and strokes in people
      with atrial fibrillation.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'Healthy lifestyle choices can reduce the risk of heart disease and may
      prevent atrial fibrillation (AFib). Here are some basic heart-healthy tips:'
  - type: list
    ordered: false
    items:
    - Control high blood pressure, high cholesterol and diabetes.
    - Don't smoke or use tobacco.
    - Eat nutritious foods that are low in salt and saturated fat.
    - Exercise at least 30 minutes a day on most days of the week unless your healthcare
      team says not to.
    - Keep a healthy weight.
    - Get good sleep. Adults should aim for 7 to 9 hours daily.
    - Reduce and manage stress.
  subsections: []
