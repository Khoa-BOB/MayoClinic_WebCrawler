title: Broken collarbone
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: A broken collarbone is a common injury. The collarbone, also known as the
      clavicle, connects the shoulder blade to the breastbone. Common causes of a
      broken collarbone include falls, sports and traffic accidents. Infants sometimes
      break their collarbones while being born.
  - type: paragraph
    text: Seek medical help quickly for a broken collarbone. Most heal well with ice,
      pain relievers, a sling, physical therapy and time. Some breaks might require
      surgery to put plates, screws or rods into the bone to hold the pieces in place
      during healing.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of a broken collarbone include:'
  - type: list
    ordered: false
    items:
    - Pain that increases when moving the shoulder.
    - Swelling, tenderness or bruising.
    - Skin over the break might look like a tent when gently pinched.
    - A bump on or near the shoulder.
    - A grinding or crackling sound when moving the shoulder.
    - Stiffness or not being able to move the shoulder.
  - type: paragraph
    text: Newborns often will not move their arm for days after breaking the collarbone
      during birth and will cry if someone moves the arm.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If you notice symptoms of a broken collarbone or enough pain to prevent
        using the arm as usual, see a health care provider right away. Waiting to
        be treated can lead to poor healing.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Common causes of a broken collarbone include:'
  - type: list
    ordered: false
    items:
    - Falls, such as falling onto the shoulder or onto an outstretched arm.
    - Sports injuries, such as a direct blow to the shoulder on the field, rink or
      court.
    - Traffic accidents, from a car, motorcycle or bike crash.
    - Birth injury, usually from a difficult vaginal birth.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Teenagers and children are at higher risk of a broken collarbone than are
      adults. The risk goes down after age 20. Then it rises again in older people
      as they lose bone strength with age.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Most broken collarbones heal without difficulty. Complications, when they
      occur, might include:'
  - type: list
    ordered: false
    items:
    - Nerve or blood vessel injury. Rarely, the jagged ends of a broken collarbone
      may injure nearby nerves and blood vessels. Seek immediate medical attention
      for numbness or coldness in an arm or hand.
    - Poor or slow healing. A badly broken collarbone might heal slowly or not all
      the way. Poor joining of the bones during healing can shorten the bone.
    - A lump in the bone. As part of the healing process, the place where the bone
      knits together forms a bony lump. The lump is easy to see because it's close
      to the skin. Most lumps disappear over time, but not all.
    - Osteoarthritis. A fracture that involves the joints that connect the collarbone
      to the shoulder blade or the breastbone might increase the risk of later developing
      arthritis in that joint.
  subsections: []
