title: Atrial tachycardia
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Atrial tachycardia is an irregular heartbeat, called an arrhythmia. It's
      a type of supraventricular tachycardia.
  - type: paragraph
    text: During an atrial tachycardia episode, the heart beats more than 100 times
      a minute. Then it returns to a heart rate of around 60 to 80 beats a minute.
      An episode may start slowly, or it may start suddenly and quickly. It can cause
      a pounding or racing heartbeat, lightheadedness, dizziness, and fainting.
  - type: paragraph
    text: Atrial tachycardia is common. It may happen in people who have had heart
      surgery or who are pregnant. Infections, stimulant medicines or alcohol use
      may trigger it.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: The main symptom of atrial tachycardia is a very fast heartbeat. Typically
      during atrial tachycardia, the heart beats 150 to 200 times a minute. The fast
      heartbeat may come and go suddenly, or it can be ongoing.
  - type: paragraph
    text: 'Other symptoms of atrial tachycardia may include:'
  - type: list
    ordered: false
    items:
    - Pounding or fluttering feelings in the chest or neck, called palpitations.
    - Chest pain.
    - Fainting or almost fainting.
    - Lightheadedness or dizziness.
    - Shortness of breath.
    - Sweating.
    - Weakness or extreme tiredness.
    - Nausea.
  - type: paragraph
    text: Some people with atrial tachycardia do not notice symptoms.
  - type: paragraph
    text: 'Atrial tachycardia symptoms may be hard to see in infants and young children.
      Symptoms of atrial tachycardia in children can include:'
  - type: list
    ordered: false
    items:
    - Poor feeding.
    - Sweating.
    - Irritability.
    - Changes in skin color.
  - type: paragraph
    text: If your infant or young child has any of these symptoms, talk with a healthcare
      professional.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'Symptoms of atrial tachycardia may be related to a serious health condition.
        Call 911 or your local emergency number if you have a very fast heartbeat
        that lasts for more than a few minutes or if a fast heartbeat occurs with
        these symptoms:'
    - type: list
      ordered: false
      items:
      - Chest pain.
      - Dizziness.
      - Shortness of breath.
      - Weakness.
    - type: paragraph
      text: 'Make an appointment for a healthcare checkup if you have:'
    - type: list
      ordered: false
      items:
      - A very fast heartbeat for the first time.
      - An irregular heartbeat that lasts longer than a few seconds.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Atrial tachycardia is caused by faulty electrical signals in the heart.
      These electrical signals control the heartbeat.
  - type: paragraph
    text: In atrial tachycardia, a change in these signals makes the heartbeat start
      too early in the heart's upper chambers. This causes the heart to beat too fast.
      Then the heart is not able to fill with blood properly.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Anyone can get atrial tachycardia. But some health conditions or treatments
      can increase your risk. Atrial tachycardia risk factors include:'
  - type: list
    ordered: false
    items:
    - Heart conditions such as coronary artery disease, heart valve disease and other
      heart diseases.
    - Heart failure.
    - Heart condition present at birth, called a congenital heart defect.
    - Previous heart surgery.
    - Sleep apnea.
    - Thyroid disease.
    - Lung disease, including chronic obstructive pulmonary disease (COPD).
    - Diabetes.
    - Some medicines, including those used to treat asthma, allergies and colds.
  - type: paragraph
    text: 'Other things that may increase the risk of atrial tachycardia include:'
  - type: list
    ordered: false
    items:
    - Emotional stress.
    - Too much caffeine.
    - Heavy alcohol use, defined as more than 15 drinks a week for men and eight or
      more drinks a week for women.
    - Smoking and nicotine use.
    - Stimulant drugs, including cocaine and methamphetamine.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Atrial tachycardia isn't usually life-threatening. However, it can be a
      concern if you have heart damage or another heart condition. If the very fast
      heartbeat continues, it may weaken the heart muscle.
  subsections: []
