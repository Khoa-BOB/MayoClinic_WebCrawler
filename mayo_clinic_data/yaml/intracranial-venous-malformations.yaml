title: Intracranial venous malformations
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Intracranial venous malformations are veins in the brain that are unusually
      large. These larger veins aren't likely to cause symptoms or affect how the
      veins work.
  - type: paragraph
    text: Some people may have an intracranial venous malformation that is never diagnosed
      and never causes symptoms. Sometimes, they're found by accident during a brain
      imaging test for another condition.
  - type: paragraph
    text: Intracranial venous malformations usually don't require treatment.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Intracranial venous malformations may never cause symptoms. They are sometimes
      found by accident during brain imaging tests for another condition. If an intracranial
      venous malformation does cause symptoms, they may include:'
  - type: list
    ordered: false
    items:
    - Headaches.
    - Seizures.
    - Dizziness.
    - Nausea and vomiting.
    - Muscle weakness or paralysis.
    - Loss of coordination.
    - Vision troubles.
    - Difficulty speaking.
    - Memory problems.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Seek medical attention if you have any of the symptoms of an intracranial
        venous malformation.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Experts don't understand what causes intracranial venous malformations.
      Certain genetic changes might play a role, and the malformations may happen
      during fetal development. However, some types may not be inherited and are acquired
      later in life, possibly after an injury to the central nervous system.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Having a family history of intracranial venous malformations can increase
      your risk. But most types aren't inherited.
  - type: paragraph
    text: Certain hereditary conditions can increase your risk of intracranial venous
      malformations. These include hereditary hemorrhagic telangiectasia, Sturge-Weber
      syndrome and Klippel-Trenaunay syndrome.
  subsections: []
