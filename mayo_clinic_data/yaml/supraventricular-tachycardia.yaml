title: Supraventricular tachycardia
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Supraventricular tachycardia (SVT) is a type of irregular heartbeat, also
      called an arrhythmia. It's a very fast or erratic heartbeat that affects the
      heart's upper chambers. SVT also is called paroxysmal supraventricular tachycardia.
  - type: paragraph
    text: The typical heart beats about 60 to 100 times a minute. During SVT , the
      heart beats about 150 to 220 times a minute. Occasionally it beats faster or
      slower.
  - type: paragraph
    text: Most people with supraventricular tachycardia don't need treatment. When
      recommended, treatment may include specific actions or movements, medicines,
      a heart procedure, or a device to control the heartbeat.
  subsections:
  - heading: Types
    level: 3
    content:
    - type: paragraph
      text: 'Supraventricular tachycardia (SVT) falls into three main groups:'
    - type: list
      ordered: false
      items:
      - Atrioventricular nodal reentrant tachycardia (AVNRT) . This is the most common
        type of supraventricular tachycardia.
      - Atrioventricular reciprocating tachycardia (AVRT). This is the second most
        common type of supraventricular tachycardia. It's most commonly seen in younger
        people.
      - Atrial tachycardia . This type of SVT is more commonly seen in people who
        have heart disease. Atrial tachycardia doesn't involve the AV node.
    - type: paragraph
      text: 'Other types of supraventricular tachycardia include:'
    - type: list
      ordered: false
      items:
      - Sinus nodal reentrant tachycardia (SNRT).
      - Inappropriate sinus tachycardia (IST).
      - Multifocal atrial tachycardia (MAT).
      - Junctional ectopic tachycardia (JET).
      - Nonparoxysmal junctional tachycardia (NPJT).
    subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: The main symptom of supraventricular tachycardia (SVT) is a very fast heartbeat
      that may last for a few minutes to a few days. The heart beats 100 or more times
      a minute. Usually during SVT , the heart beats 150 to 220 times a minute. The
      fast heartbeat may come and go suddenly.
  - type: paragraph
    text: 'Symptoms of supraventricular tachycardia may include:'
  - type: list
    ordered: false
    items:
    - Pounding or fluttering feelings in the chest, called palpitations.
    - A pounding sensation in the neck.
    - Chest pain.
    - Fainting or almost fainting.
    - Lightheadedness or dizziness.
    - Shortness of breath.
    - Sweating.
    - Weakness or extreme tiredness.
  - type: paragraph
    text: Some people with SVT do not notice symptoms.
  - type: paragraph
    text: In infants and very young children, symptoms of SVT may be vague. The symptoms
      can include sweating, poor feeding, a change in skin color and a rapid pulse.
      If your infant or young child has any of these symptoms, talk with a healthcare
      professional.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Supraventricular tachycardia (SVT) is usually not life-threatening unless
        you have heart damage or another heart condition. But if SVT is severe, the
        irregular heartbeat may cause all heart activity to suddenly stop. This is
        called sudden cardiac arrest.
    - type: paragraph
      text: Call a healthcare professional if you have a very fast heartbeat for the
        first time or if an irregular heartbeat lasts longer than a few seconds.
    - type: paragraph
      text: 'Symptoms of SVT may be related to a serious health condition. Call 911
        or your local emergency number if you have a very fast heartbeat that lasts
        for more than a few minutes or if a fast heartbeat occurs with these symptoms:'
    - type: list
      ordered: false
      items:
      - Chest pain.
      - Dizziness.
      - Shortness of breath.
      - Weakness.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Supraventricular tachycardia (SVT) is caused by faulty signaling in the
      heart. Electrical signals in the heart control the heartbeat.
  - type: paragraph
    text: In SVT , a change in heart signaling causes the heartbeat to start too early
      in the heart's upper chambers. When this happens, the heartbeat speeds up. The
      heart can't fill with blood properly. Symptoms such as lightheadedness or dizziness
      can occur.
  subsections:
  - heading: How does the heart beat?
    level: 3
    content:
    - type: paragraph
      text: To understand the cause of supraventricular tachycardia (SVT), it might
        help to know how the heart usually works.
    - type: paragraph
      text: 'The heart has four chambers:'
    - type: list
      ordered: false
      items:
      - The two upper chambers are called the atria.
      - The two lower chambers are called the ventricles.
    - type: paragraph
      text: Inside the upper right heart chamber is a group of cells called the sinus
        node. The sinus node makes the signals that start each heartbeat.
    - type: paragraph
      text: The signals move across the upper heart chambers. Then the signals arrive
        at a group of cells called the AV node, where they usually slow down. The
        signals then go to the lower heart chambers.
    - type: paragraph
      text: In a healthy heart, this heart signaling process usually goes smoothly.
        The heart usually beats about 60 to 100 times a minute at rest. But in SVT
        , the heart beats faster than 100 beats a minute. The heart may beat 150 to
        220 times a minute.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Supraventricular tachycardia (SVT) is the most common type of arrhythmia
      in infants and children. It also tends to occur more often in women, particularly
      during pregnancy.
  - type: paragraph
    text: 'Health conditions or treatments that may increase the risk of supraventricular
      tachycardia include:'
  - type: list
    ordered: false
    items:
    - Coronary artery disease, heart valve disease and other heart diseases.
    - Heart failure.
    - A heart problem present at birth, also called a congenital heart defect.
    - Previous heart surgery.
    - A sleep disorder called obstructive sleep apnea.
    - Thyroid disease.
    - Uncontrolled diabetes.
    - Some medicines, including those used to treat asthma, allergies and colds.
  - type: paragraph
    text: 'Other things that may increase the risk of SVT include:'
  - type: list
    ordered: false
    items:
    - Emotional stress.
    - Too much caffeine.
    - Excessive alcohol use, which is defined as 14 or more drinks a week for men
      and seven or more drinks a week for women.
    - Smoking and nicotine use.
    - Stimulant drugs, including cocaine and methamphetamine.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: When the heart beats too fast, it may not send enough blood to the body.
      As a result, the organs and tissues may not get enough oxygen.
  - type: paragraph
    text: Over time, untreated and frequent attacks of supraventricular tachycardia
      (SVT) may weaken the heart and lead to heart failure. This is especially true
      in people who also have other medical conditions.
  - type: paragraph
    text: A severe attack of SVT may cause fainting or a sudden loss of all heart
      activity, called sudden cardiac arrest.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: The same lifestyle changes used to manage supraventricular tachycardia (SVT)
      also may help prevent it. Try these tips.
  - type: list
    ordered: false
    items:
    - Follow a heart-healthy lifestyle. Eat a nutritious diet, don't smoke, get regular
      exercise and manage stress.
    - Don't use a lot of caffeine. Avoid large amounts of caffeine. For most people
      with supraventricular tachycardia, moderate amounts of caffeine do not trigger
      episodes of SVT .
    - Keep a notebook or diary of when symptoms happen. Include the symptoms, your
      heart rate and what you were doing at the time of the fast heartbeat. This information
      can help you learn the things that trigger the very fast heartbeat.
    - Use medicines carefully. Some medicines, including those bought without a prescription,
      may contain stimulants that can trigger SVT .
  subsections: []
