title: Pink eye (conjunctivitis)
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Pink eye is an inflammation of the transparent membrane that lines the eyelid
      and eyeball. This membrane is called the conjunctiva. When small blood vessels
      in the conjunctiva become swollen and irritated, they're more visible. This
      is what causes the whites of the eyes to appear reddish or pink. Pink eye also
      is called conjunctivitis.
  - type: paragraph
    text: Pink eye is most often caused by a viral infection. It also can be caused
      by a bacterial infection, an allergic reaction or — in babies — an incompletely
      opened tear duct.
  - type: paragraph
    text: Though pink eye can be irritating, it rarely affects your vision. Treatments
      can help ease the discomfort of pink eye. Because pink eye can be contagious,
      getting an early diagnosis and taking certain precautions can help limit its
      spread.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'The most common pink eye symptoms include:'
  - type: list
    ordered: false
    items:
    - Redness in one or both eyes.
    - Itchiness in one or both eyes.
    - A gritty feeling in one or both eyes.
    - A discharge in one or both eyes that forms a crust during the night that may
      prevent your eye or eyes from opening in the morning.
    - Tearing.
    - Sensitivity to light, called photophobia.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: There are serious eye conditions that can cause eye redness. These conditions
        may cause eye pain, a feeling that something is stuck in your eye, blurred
        vision and light sensitivity. If you experience these symptoms, seek urgent
        care.
    - type: paragraph
      text: People who wear contact lenses need to stop wearing their contacts as
        soon as pink eye symptoms begin. If your symptoms don't start to get better
        within 12 to 24 hours, make an appointment with your eye healthcare professional
        to make sure you don't have a more serious eye infection related to contact
        lens use.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Causes of pink eye include:'
  - type: list
    ordered: false
    items:
    - Viruses.
    - Bacteria.
    - Allergies.
    - A chemical splash in the eye.
    - A foreign object in the eye.
    - In newborns, a blocked tear duct.
  subsections:
  - heading: Viral and bacterial conjunctivitis
    level: 3
    content:
    - type: paragraph
      text: Most cases of pink eye are caused by adenovirus. It also can be caused
        by other viruses, including herpes simplex virus and varicella-zoster virus.
    - type: paragraph
      text: Both viral and bacterial conjunctivitis can occur along with colds or
        symptoms of a respiratory infection, such as a sore throat. Wearing contact
        lenses that aren't cleaned properly or aren't your own can cause bacterial
        conjunctivitis.
    - type: paragraph
      text: Both types are very contagious. They are spread through direct or indirect
        contact with the liquid that drains from the eye of someone who's infected.
        One or both eyes may be affected.
    subsections: []
  - heading: Allergic conjunctivitis
    level: 3
    content:
    - type: paragraph
      text: Allergic conjunctivitis affects both eyes. It is a response to an allergy-causing
        substance such as pollen. In response to allergens, your body produces an
        antibody called immunoglobulin E (IgE). IgE triggers special cells in the
        mucous lining of your eyes and airways to release inflammatory substances,
        including histamines. Your body's release of histamine can produce a number
        of allergy symptoms, including red or pink eyes.
    - type: paragraph
      text: If you have allergic conjunctivitis, you may experience intense itching,
        tearing and inflammation of the eyes. You also could have sneezing and watery
        nasal discharge. Most allergic conjunctivitis can be controlled with allergy
        eye drops. Allergic conjunctivitis is not contagious.
    subsections: []
  - heading: Conjunctivitis resulting from irritation
    level: 3
    content:
    - type: paragraph
      text: Irritation from a chemical splash or foreign object in the eye also is
        associated with conjunctivitis. Sometimes flushing and cleaning the eye to
        wash out the chemical or object causes redness and irritation. Symptoms, which
        may include watery eyes and a mucous discharge, usually clear up on their
        own within about a day.
    - type: paragraph
      text: If flushing doesn't resolve the symptoms, or if the chemical is a caustic
        one such as lye, see your healthcare professional or eye specialist as soon
        as possible. A chemical splash into the eye can cause permanent eye damage.
        Ongoing symptoms could indicate that you still have the foreign body in your
        eye. Or you also could have a scratch on the cornea or the membrane covering
        the eyeball, called the conjunctiva.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk factors for pink eye include:'
  - type: list
    ordered: false
    items:
    - Exposure to someone infected with the viral or bacterial form of conjunctivitis.
    - Exposure to something you're allergic to, for allergic conjunctivitis.
    - Using contact lenses, especially extended-wear lenses.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'In both children and adults, pink eye can cause inflammation in the cornea
      that can affect vision. Prompt evaluation and treatment by your healthcare professional
      can reduce the risk of complications. See your professional if you have:'
  - type: list
    ordered: false
    items:
    - Eye pain.
    - A feeling that something is stuck in the eye.
    - Blurred vision.
    - Light sensitivity.
  subsections: []
- heading: Prevention
  level: 2
  content: []
  subsections:
  - heading: Preventing the spread of pink eye
    level: 3
    content:
    - type: paragraph
      text: 'Practice good hygiene to control the spread of pink eye. For instance:'
    - type: list
      ordered: false
      items:
      - Don't touch your eyes with your hands.
      - Wash your hands often.
      - Use a clean towel and washcloth daily.
      - Don't share towels or washcloths.
      - Change your pillowcases often.
      - Throw away old eye cosmetics, such as mascara.
      - Don't share eye cosmetics or personal eye care items.
    - type: paragraph
      text: Keep in mind that pink eye is no more contagious than the common cold.
        It's okay to return to work, school or child care if you're able to practice
        good hygiene and avoid close contact. However, if work, school or child care
        involves close contact with others, it may be best to stay home until your
        or your child's symptoms clear up.
    subsections: []
  - heading: Preventing pink eye in newborns
    level: 3
    content:
    - type: paragraph
      text: Newborns' eyes are susceptible to bacteria present in the mother's birth
        canal. These bacteria often cause no symptoms in the mother. In some cases,
        these bacteria can cause infants to develop a serious form of conjunctivitis
        known as ophthalmia neonatorum. This condition needs immediate treatment to
        keep the baby's sight. That's why shortly after birth, an antibiotic ointment
        is applied to every newborn's eyes. The ointment helps prevent eye infection.
    subsections: []
