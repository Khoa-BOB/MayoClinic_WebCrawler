title: Granuloma annulare
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Granuloma annulare (gran-u-LOW-muh an-u-LAR-e) is a skin condition that
      causes a raised rash or bumps in a ring pattern. The most common type affects
      young adults, usually on the hands and feet.
  - type: paragraph
    text: Minor skin injuries and some medicines might trigger the condition. It's
      not contagious and usually not painful, but it can make you feel self-conscious.
      And if it becomes a long-term condition, it can cause emotional distress.
  - type: paragraph
    text: Treatment might clear the skin gradually, but the bumps tend to come back.
      Untreated, the condition might last from a few weeks to decades.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'The signs and symptoms of granuloma annulare can vary, depending on the
      type:'
  - type: list
    ordered: false
    items:
    - Localized. This is the most common type of granuloma annulare. The rash borders
      are circular or semicircular, with a diameter up to 2 inches (5 centimeters).
      The rash occurs most commonly on the hands, feet, wrists and ankles of young
      adults.
    - Generalized. This type is uncommon and usually affects adults. It causes bumps
      that form a rash on most of the body, including the trunk, arms and legs. The
      rash might cause discomfort or itchiness.
    - Under the skin. A type that usually affects young children is called subcutaneous
      granuloma annulare. It produces small, firm lumps under the skin, instead of
      a rash. The lumps form on the hands, shins and scalp.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Call your health care provider if you develop a rash or bumps in ring
        pattern that don't go away within a few weeks.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'It''s not clear what causes granuloma annulare. Sometimes it''s triggered
      by:'
  - type: list
    ordered: false
    items:
    - Animal or insect bites
    - Infections, such as hepatitis
    - Tuberculin skin tests
    - Vaccinations
    - Sun exposure
    - Minor skin injuries
    - Medicines
  - type: paragraph
    text: Granuloma annulare is not contagious.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Granuloma annulare can be related to diabetes or thyroid disease, most often
      when you have many bumps all over the body. It may, rarely, be related to cancer,
      especially in older people whose granuloma annulare is severe, doesn't respond
      to treatment or returns after cancer treatment.
  subsections: []
