title: Yeast infection (vaginal)
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: A vaginal yeast infection is a fungal infection. It causes irritation, discharge
      and itching of the vagina and the vulva. Vaginal yeast infection also is called
      vaginal candidiasis.
  - type: paragraph
    text: Vaginal yeast infection affects most people assigned female at birth at
      some point in life. Many have at least two infections.
  - type: paragraph
    text: People who don't have sex can get a vaginal yeast infection. So it isn't
      though of as a sexually transmitted infection. But you can get vaginal yeast
      infections through sex.
  - type: paragraph
    text: There's a higher risk of vaginal yeast infection when you start having sex.
      And some vaginal yeast infections may be linked to sexual contact between the
      mouth and genital area, called oral-genital sex.
  - type: paragraph
    text: Medicines can treat vaginal yeast infections. Yeast infections that happen
      four times or more a year may need a longer treatment course and a plan to prevent
      them.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Yeast infection symptoms range from mild to moderate. They may include:'
  - type: list
    ordered: false
    items:
    - Itching and irritation in the vagina and tissues at the vaginal opening, called
      the vulva.
    - A burning feeling, mainly during intercourse or while urinating.
    - Redness and swelling of the vulva. Redness may be harder to see on Black or
      brown skin than on white skin.
    - Vaginal pain and soreness.
    - Thick, white vaginal shedding of fluid and cells, called discharge, with little
      or no odor. The discharge looks like cottage cheese.
  subsections:
  - heading: Complicated yeast infection
    level: 3
    content:
    - type: paragraph
      text: 'You might have a complicated yeast infection if:'
    - type: list
      ordered: false
      items:
      - You have severe symptoms, such as a lot of redness, swelling and itching that
        leads to tears, cracks or sores in the vagina.
      - You have four or more yeast infections in a year.
      - Your infection is caused by a less common type of fungus.
      - You're pregnant.
      - You have diabetes that isn't well-managed.
      - Your immune system is weakened because of certain medicines or conditions
        such as HIV infection.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'Make an appointment with your healthcare professional if:'
    - type: list
      ordered: false
      items:
      - This is the first time you've had symptoms of a yeast infection.
      - You're not sure whether you have a yeast infection.
      - Your symptoms don't go away after you treat them with antifungal vaginal creams
        or suppositories that you can get without a prescription.
      - You have other symptoms.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The fungus Candida albicans causes most vaginal yeast infections.
  - type: paragraph
    text: Most often, the vagina has a balance of yeast, including candida, and bacteria.
      Certain bacteria called lactobacillus work to prevent too much yeast.
  - type: paragraph
    text: But some factors can affect the balance. Too much candida or the fungus
      growing deeper into vaginal cells causes symptoms of a yeast infection.
  - type: paragraph
    text: 'Too much yeast can result from:'
  - type: list
    ordered: false
    items:
    - Antibiotic use.
    - Pregnancy.
    - Diabetes that isn't well-managed.
    - A weakened immune system.
    - Use of birth control pills or hormone therapy that raises levels of the hormone
      estrogen.
  - type: paragraph
    text: Candida albicans is the most common type of fungus to cause yeast infections.
      When other types of candida fungus cause yeast infections, they can be harder
      to treat.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that raise the risk of getting a yeast infection include:'
  - type: list
    ordered: false
    items:
    - Antibiotic use. Yeast infections are common in people who take antibiotics.
      Broad-spectrum antibiotics kill a range of bacteria. They also kill healthy
      bacteria in the vagina. This can lead to too much yeast.
    - Raised estrogen levels. Yeast infections are more common in people with higher
      estrogen levels. Pregnancy, birth control pills and hormone therapy can raise
      estrogen levels.
    - Diabetes that isn't well-managed. People with poorly managed blood sugar are
      at greater risk of yeast infections than are people with well-managed blood
      sugar.
    - Weakened immune system. People with lowered immunity are more likely to get
      yeast infections. Lower immunity might be from corticosteroid therapy or HIV
      infection or other diseases that suppress the immune system.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: To lower your risk of vaginal yeast infections, wear underwear that has
      a cotton crotch and doesn't fit too tightly.
  - type: paragraph
    text: 'Also, these tips might help prevent a yeast infection:'
  - type: list
    ordered: false
    items:
    - Do not wear tight pantyhose, underwear or jeans.
    - Do not douche. This removes some of the good germs in the vagina that protect
      from infection.
    - Do not use scented products in the vaginal area. For instance, don't use scented
      bubble bath, soap, menstrual pads and tampons.
    - Do not use hot tubs or take hot baths.
    - Do not use antibiotics you don't need. For instance, don't take antibiotics
      for colds or other viral infections.
    - Do not stay in wet clothes, such as swimsuits and workout clothes, for longer
      than needed.
  subsections: []
