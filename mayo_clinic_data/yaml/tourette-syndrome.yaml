title: Tourette syndrome
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Tourette (too-RET) syndrome is a disorder that involves repetitive movements
      or unwanted sounds (tics) that can't be easily controlled. For instance, you
      might repeatedly blink your eyes, shrug your shoulders or blurt out unusual
      sounds or offensive words.
  - type: paragraph
    text: Tics typically show up between ages 2 and 15, with the average being around
      6 years of age. Males are about three to four times more likely than females
      to develop Tourette syndrome.
  - type: paragraph
    text: Although there's no cure for Tourette syndrome, treatments are available.
      Many people with Tourette syndrome don't need treatment when symptoms aren't
      troublesome. Tics often lessen or become controlled after the teen years.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Tics — sudden, brief, intermittent movements or sounds — are the hallmark
      sign of Tourette syndrome. They can range from mild to severe. Severe symptoms
      might significantly interfere with communication, daily functioning and quality
      of life.
  - type: paragraph
    text: 'Tics are classified as:'
  - type: list
    ordered: false
    items:
    - Simple tics. These sudden, brief and repetitive tics involve a limited number
      of muscle groups.
    - Complex tics. These distinct, coordinated patterns of movements involve several
      muscle groups.
  - type: paragraph
    text: Tics can also involve movement (motor tics) or sounds (vocal tics). Motor
      tics usually begin before vocal tics do. But the spectrum of tics that people
      experience is diverse.
  - type: paragraph
    text: 'In addition, tics can:'
  - type: list
    ordered: false
    items:
    - Vary in type, frequency and severity
    - Worsen if you're ill, stressed, anxious, tired or excited
    - Occur during sleep
    - Change over time
    - Worsen in the early teenage years and improve during the transition into adulthood
  - type: paragraph
    text: Before the onset of motor or vocal tics, you'll likely experience an uncomfortable
      bodily sensation (premonitory urge) such as an itch, a tingle or tension. Expression
      of the tic brings relief. With great effort, some people with Tourette syndrome
      can temporarily stop or hold back a tic.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See your child's pediatrician if you notice your child displaying involuntary
        movements or sounds.
    - type: paragraph
      text: Not all tics indicate Tourette syndrome. Many children develop tics that
        go away on their own after a few weeks or months. But whenever a child shows
        unusual behavior, it's important to identify the cause and rule out serious
        health problems.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The exact cause of Tourette syndrome isn't known. It's a complex disorder
      likely caused by a combination of inherited (genetic) and environmental factors.
      Chemicals in the brain that transmit nerve impulses (neurotransmitters), including
      dopamine and serotonin, might play a role.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk factors for Tourette syndrome include:'
  - type: list
    ordered: false
    items:
    - Family history. Having a family history of Tourette syndrome or other tic disorders
      might increase the risk of developing Tourette syndrome.
    - Sex. Males are about three to four times more likely than females to develop
      Tourette syndrome.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: People with Tourette syndrome often lead healthy, active lives. However,
      Tourette syndrome frequently involves behavioral and social challenges that
      can harm your self-image.
  - type: paragraph
    text: 'Conditions often associated with Tourette syndrome include:'
  - type: list
    ordered: false
    items:
    - Attention-deficit/hyperactivity disorder (ADHD)
    - Obsessive-compulsive disorder (OCD)
    - Autism spectrum disorder
    - Learning disabilities
    - Sleep disorders
    - Depression
    - Anxiety disorders
    - Pain related to tics, especially headaches
    - Anger-management problems
  subsections: []
