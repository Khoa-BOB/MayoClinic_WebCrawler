title: Primary progressive aphasia
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Primary progressive aphasia (uh-FAY-zhuh) is a rare nervous system condition
      that affects a person's ability to communicate. People who have primary progressive
      aphasia can have trouble expressing their thoughts and understanding or finding
      words.
  - type: paragraph
    text: Symptoms develop gradually, often before age 65. They get worse over time.
      People with primary progressive aphasia can lose the ability to speak and write.
      Eventually they're not able to understand written or spoken language.
  - type: paragraph
    text: This condition progresses slowly. People who have primary progressive aphasia
      may continue caring for themselves and participating in daily activities for
      several years.
  - type: paragraph
    text: Primary progressive aphasia is a type of frontotemporal dementia. Frontotemporal
      dementia is a cluster of conditions that result from the degeneration of the
      frontal or temporal lobes of the brain. These areas include brain tissue involved
      in speech and language. Not all people with primary progressive aphasia have
      dementia, but most develop it. The term "dementia" is typically not used until
      a person can't do things alone due to changes in their thinking and understanding.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Primary progressive aphasia symptoms vary based on which part of the brain's
      language areas are involved. The condition has three types. Each type causes
      different symptoms. Symptoms develop over time and gradually get worse.
  subsections:
  - heading: Semantic variant primary progressive aphasia
    level: 3
    content:
    - type: paragraph
      text: 'Symptoms include:'
    - type: list
      ordered: false
      items:
      - Trouble understanding spoken or written language, particularly single words.
      - Trouble understanding the meaning of words.
      - Not being able to name objects.
      - Trouble spelling words, especially those that aren't spelled the way that
        they sound, such as the word "yacht."
    subsections: []
  - heading: Logopenic variant primary progressive aphasia
    level: 3
    content:
    - type: paragraph
      text: 'Symptoms include:'
    - type: list
      ordered: false
      items:
      - Trouble understanding spoken language, particularly long sentences.
      - Pausing and hesitating to search for words while speaking.
      - Not being able to repeat phrases or sentences.
    subsections: []
  - heading: Nonfluent-agrammatic variant primary progressive aphasia
    level: 3
    content:
    - type: paragraph
      text: 'Symptoms include:'
    - type: list
      ordered: false
      items:
      - Leaving out words or putting words in the wrong order in written and spoken
        language.
      - Trouble understanding complex sentences.
      - Trouble speaking. This includes making errors in speech sounds, known as apraxia
        of speech.
    - type: paragraph
      text: Primary progressive apraxia of speech is related to primary progressive
        aphasia. However, people with this condition don't have trouble with language.
        They have problems speaking. This includes making errors in speech sounds
        or having trouble saying words quickly.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See your healthcare professional if you have concerns about your ability
        to communicate. If you have a family member or friend who has symptoms of
        primary progressive aphasia, talk to the person about your concerns. Offer
        to go with the person to see a healthcare professional.
    - type: paragraph
      text: If changes in speech or communication come on suddenly, call 911 or your
        local emergency number.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Primary progressive aphasia is caused by a shrinking of certain areas of
      the brain, known as lobes. In primary progressive aphasia, the frontal, temporal
      or parietal lobes are affected. When areas of the brain shrink, it's called
      atrophy. The atrophy caused by primary progressive aphasia mainly happens on
      the left side of the brain. The areas affected are responsible for speech and
      language.
  - type: paragraph
    text: Atrophy is linked to the presence of certain proteins in the brain. The
      proteins may reduce brain activity or function.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk factors for primary progressive aphasia include:'
  - type: list
    ordered: false
    items:
    - Learning disabilities. People who had a childhood learning disability such as
      dyslexia may have a higher risk of developing primary progressive aphasia.
    - Certain gene changes. Although primary progressive aphasia most often happens
      randomly, rare gene changes have been linked to the condition. If other members
      of your family have had primary progressive aphasia, consider genetic testing
      to see if you are more likely to develop it.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: People with primary progressive aphasia eventually lose the ability to speak
      and write. This may take anywhere from 3 to 15 years. People with the condition
      also have trouble understanding written and spoken language.
  - type: paragraph
    text: As the disease progresses, other mental skills such as memory, planning
      and organizing can be affected. Some people develop other symptoms such as problems
      with movement, balance and swallowing. With these complications, people with
      the disease eventually need help with day-to-day care.
  - type: paragraph
    text: People with primary progressive aphasia also can develop depression as the
      disease progresses. Other complications might include blunted emotions such
      as not showing concern, poor judgment or social behavior that's not appropriate.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'There is no known way to prevent primary progressive aphasia. However,
      you can keep your brain healthy by using GROWTH:'
  - type: list
    ordered: false
    items:
    - G et quality sleep.
    - R educe stress.
    - O pen connections.
    - W ork out.
    - T ry new things.
    - H ealthy eating.
  subsections: []
