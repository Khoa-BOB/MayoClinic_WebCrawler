title: Multiple system atrophy
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Multiple system atrophy, also called MSA, causes people to lose coordination
      and balance or become slow and stiff. It also causes changes in speech and loss
      of control of other bodily functions.
  - type: paragraph
    text: MSA is a rare condition. It sometimes shares symptoms with Parkinson's disease,
      including slow movement, rigid muscles and poor balance.
  - type: paragraph
    text: Treatment includes medicines and lifestyle changes to help manage symptoms,
      but there is no cure. The condition gets worse over time and eventually leads
      to death.
  - type: paragraph
    text: In the past, this condition has been called Shy-Drager syndrome, olivopontocerebellar
      atrophy or striatonigral degeneration.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Multiple system atrophy (MSA) symptoms affect many parts of the body. Symptoms
      start in adulthood, usually in the 50s or 60s.
  - type: paragraph
    text: 'There are two types of MSA: parkinsonian and cerebellar. The type depends
      on the symptoms a person has when diagnosed.'
  subsections:
  - heading: Parkinsonian type
    level: 3
    content:
    - type: paragraph
      text: 'This is the most common type of MSA. Symptoms are similar to those of
        Parkinson''s disease, such as:'
    - type: list
      ordered: false
      items:
      - Stiff muscles.
      - Trouble bending the arms and legs.
      - Slow movement, known as bradykinesia.
      - Tremors at rest or when moving the arms or legs.
      - Slurred, slow or soft speech, known as dysarthria.
      - Trouble with posture and balance.
    subsections: []
  - heading: Cerebellar type
    level: 3
    content:
    - type: paragraph
      text: 'The main symptoms of the cerebellar type involve poor muscle coordination,
        known as ataxia. Symptoms may include:'
    - type: list
      ordered: false
      items:
      - Trouble with movement and coordination. This includes loss of balance and
        not being able to walk steadily.
      - Slurred, slow or soft speech, known as dysarthria.
      - Changes in vision. This may include blurred or double vision and not being
        able to focus the eyes.
      - Trouble chewing or swallowing, known as dysphagia.
    subsections: []
  - heading: General symptoms
    level: 3
    content:
    - type: paragraph
      text: For both types of multiple system atrophy, the autonomic nervous system
        doesn't work properly. The autonomic nervous system controls involuntary functions
        in the body, such as blood pressure. When this system doesn't work properly,
        it can cause the following symptoms.
    subsections:
    - heading: Postural hypotension, also known as orthostatic hypotension
      level: 4
      content:
      - type: paragraph
        text: Postural hypotension is a form of low blood pressure. People who have
          this type of low blood pressure feel dizzy or lightheaded when they stand
          up after sitting or lying down. They may even faint. Not everyone with MSA
          has postural hypotension.
      - type: paragraph
        text: People with MSA also can develop dangerously high blood pressure levels
          while lying down. This is called supine hypertension.
      subsections: []
    - heading: Urinary and bowel symptoms
      level: 4
      content:
      - type: paragraph
        text: 'These symptoms include:'
      - type: list
        ordered: false
        items:
        - Constipation.
        - Loss of bladder or bowel control, known as incontinence.
      subsections: []
    - heading: Changes in sweat production
      level: 4
      content:
      - type: paragraph
        text: 'People with multiple system atrophy may:'
      - type: list
        ordered: false
        items:
        - Produce less sweat.
        - Have heat intolerance because they sweat less.
        - Have poor body temperature control, often causing cold hands or feet.
      subsections: []
    - heading: Conditions that affect sleep
      level: 4
      content:
      - type: paragraph
        text: 'Sleep symptoms may include:'
      - type: list
        ordered: false
        items:
        - Agitated sleep due to "acting out" dreams. This is known as rapid eye movement
          (REM) sleep behavior disorder.
        - Breathing that stops and starts during sleep, known as sleep apnea.
        - A high-pitched whistling sound while breathing, called stridor.
      subsections: []
    - heading: Sexual symptoms
      level: 4
      content:
      - type: paragraph
        text: 'These symptoms may include:'
      - type: list
        ordered: false
        items:
        - Trouble getting or keeping an erection, known as erectile dysfunction.
        - Trouble with lubrication during sex and having an orgasm.
        - Loss of interest in sex.
      subsections: []
    - heading: Cardiovascular symptoms
      level: 4
      content:
      - type: paragraph
        text: 'MSA may cause:'
      - type: list
        ordered: false
        items:
        - Color changes in the hands and feet.
      subsections: []
    - heading: Psychiatric symptoms
      level: 4
      content:
      - type: paragraph
        text: 'People with multiple system atrophy also may experience:'
      - type: list
        ordered: false
        items:
        - Trouble controlling emotions, such as laughing or crying when not expected.
      subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If you develop any of the symptoms of multiple system atrophy, see your
        healthcare professional. If you have already been diagnosed with MSA, contact
        your healthcare professional if your symptoms become worse or if new symptoms
        occur.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: There is no known cause for multiple system atrophy (MSA). Some researchers
      are studying the possible role of genetics or environmental causes such as a
      toxin in MSA. But there's no substantial evidence to support these theories.
  - type: paragraph
    text: MSA causes parts of the brain to shrink. This is known as atrophy. The areas
      of the brain that shrink due to MSA include the cerebellum, basal ganglia and
      brainstem. The atrophy of these parts of the brain affect internal body functions
      and movement.
  - type: paragraph
    text: Under a microscope, the brain tissue of people with MSA shows a buildup
      of a protein called alpha-synuclein. Some research suggests that the buildup
      of this protein leads to multiple system atrophy.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: A risk factor for multiple system atrophy (MSA) is having rapid eye movement
      (REM) sleep behavior disorder. People with this disorder act out their dreams.
      Most people who have MSA have a history of REM sleep behavior disorder.
  - type: paragraph
    text: Another risk factor is having a condition caused by the autonomic nervous
      system not working properly. Symptoms such as urinary incontinence could be
      an early sign of MSA. The autonomic nervous system controls involuntary functions.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Complications of multiple system atrophy (MSA) vary from person to person.
      But for everyone with the disease, MSA symptoms get worse over time. The symptoms
      can make daily activities harder as time goes on.
  - type: paragraph
    text: 'Possible complications include:'
  - type: list
    ordered: false
    items:
    - Worsening breathing symptoms during sleep.
    - Injuries from falls caused by poor balance or fainting.
    - The breakdown of the skin in people who have trouble moving or can't move.
    - Not being able to care for yourself in day-to-day activities.
    - Vocal cord paralysis, which affects speech and breathing.
    - Increased trouble swallowing.
  - type: paragraph
    text: People typically live about 7 to 10 years after multiple system atrophy
      symptoms first appear. However, the survival rate with MSA varies widely. Death
      is often due to trouble breathing, infections or blood clots in the lungs.
  subsections: []
