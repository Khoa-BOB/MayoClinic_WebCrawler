title: Overactive bladder
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Overactive bladder, also called OAB, causes sudden urges to urinate that
      may be hard to control. There might be a need to pass urine many times during
      the day and night. There also might be loss of urine that isn't intended, called
      urgency incontinence.
  - type: paragraph
    text: People with an overactive bladder might feel self-conscious. That can cause
      them to keep away from others or limit their work and social life. The good
      news is that it can be treated.
  - type: paragraph
    text: Simple behavior changes might manage symptoms of an overactive bladder.
      These might include changes in diet, urinating on a certain schedule and using
      pelvic floor muscles to control the bladder. There also are other treatments
      to try.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'If you have an overactive bladder, you may:'
  - type: list
    ordered: false
    items:
    - Feel a sudden urge to urinate that's hard to control.
    - Lose urine without meaning to after an urgent need to urinate, called urgency
      incontinence.
    - Urinate often. This can mean eight or more times in 24 hours.
    - Wake up more than twice a night to urinate, called nocturia.
  - type: paragraph
    text: Even if you can get to the toilet in time when you feel an urge to urinate,
      having to urinate often during day and night can disrupt your life.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Although common among older adults, overactive bladder isn't a typical
        part of aging. It might not be easy to talk about your symptoms. But if the
        symptoms distress you or disrupt your life, talk to your healthcare professional.
        There are treatments that might help.
    subsections: []
- heading: Causes
  level: 2
  content: []
  subsections:
  - heading: How a healthy bladder works
    level: 3
    content:
    - type: paragraph
      text: The kidneys make urine, which drains into the bladder. When urinating,
        urine passes from the bladder through a tube called the urethra (u-REE-thruh).
        A muscle in the urethra called the sphincter opens to release urine out of
        the body.
    - type: paragraph
      text: In people assigned female at birth, the urethral opening is just above
        the vaginal opening. In people assigned male at birth, the urethral opening
        is at the tip of the penis.
    - type: paragraph
      text: As the bladder fills, nerve signals sent to the brain trigger the need
        to urinate. When urinating, these nerve signals cause the pelvic floor muscles
        and the muscles of the urethra, called the urinary sphincter muscles, to relax.
        The muscles of the bladder tighten, also called contract, pushing the urine
        out.
    subsections: []
  - heading: Involuntary bladder contractions
    level: 3
    content:
    - type: paragraph
      text: Overactive bladder happens when the muscles of the bladder start to tighten
        on their own even when the amount of urine in the bladder is low. These are
        called involuntary contractions. They cause an urgent need to urinate.
    - type: paragraph
      text: 'Several conditions may be a part of overactive bladder, including:'
    - type: list
      ordered: false
      items:
      - Conditions that affect the bladder, such as tumors or bladder stones.
      - Conditions that affect the brain and spinal cord, such as stroke and multiple
        sclerosis.
      - Diabetes.
      - Factors that get in the way of urine leaving the bladder, such as an enlarged
        prostate, constipation or having had surgery to treat lack of control over
        urinating, called incontinence.
      - Hormonal changes during menopause.
      - Urinary tract infections, which can cause symptoms like those of an overactive
        bladder.
    - type: paragraph
      text: 'Overactive bladder symptoms also may be linked to:'
    - type: list
      ordered: false
      items:
      - Cognitive decline due to aging. This can make it harder for the bladder to
        use the signals it gets from the brain.
      - Drinking too much caffeine or alcohol.
      - Medicines that cause the body to make a lot of urine or that need to be taken
        with a lot of fluids.
      - Not being able to get to the bathroom quickly.
      - Not emptying the bladder all the way. This leads to not enough space in the
        bladder for more urine.
    - type: paragraph
      text: Sometimes the cause of overactive bladder isn't known.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Aging increases the risk of overactive bladder. So does being female. Conditions
      such as enlarged prostate and diabetes also can increase the risk.
  - type: paragraph
    text: Many people with declines in thinking ability, such as those who have had
      a stroke or have Alzheimer's disease, get an overactive bladder. That's because
      they're less able to notice the symptoms of needing to urinate. Drinking fluids
      on a schedule, timing and prompting urination, absorbent garments, and bowel
      programs can help manage the condition.
  - type: paragraph
    text: Some people with an overactive bladder also have trouble with bowel control.
      Tell your healthcare professional if you're having trouble controlling your
      bowels.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Any type of incontinence can affect quality of life. If your overactive
      bladder symptoms disrupt your life, you might also have:'
  - type: list
    ordered: false
    items:
    - Anxiety.
    - Emotional distress or depression.
    - Sexual problems.
    - Sleep disturbances and interrupted sleep cycles.
  - type: paragraph
    text: People assigned female at birth who have an overactive bladder also may
      have a condition called mixed incontinence. This has both urgency and stress
      incontinence.
  - type: paragraph
    text: Stress incontinence is the sudden loss of urine from physical movement or
      activity that puts pressure on the bladder. Examples are coughing, sneezing,
      laughing or exercising.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'These healthy lifestyle choices may reduce your risk of overactive bladder:'
  - type: list
    ordered: false
    items:
    - Do exercises to make the pelvic floor muscles stronger. These are called Kegel
      exercises.
    - Get regular, daily physical activity and exercise.
    - Limit caffeine and alcohol.
    - Maintain a healthy weight.
    - Manage ongoing, called chronic, conditions, such as diabetes, that might add
      to overactive bladder symptoms.
    - Quit smoking.
  subsections: []
