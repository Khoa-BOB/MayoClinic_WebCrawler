title: Lung cancer
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Lung cancer is a kind of cancer that starts as a growth of cells in the
      lungs. The lungs are two spongy organs in the chest that control breathing.
  - type: paragraph
    text: Lung cancer is the leading cause of cancer deaths worldwide.
  - type: paragraph
    text: People who smoke have the greatest risk of lung cancer. The risk of lung
      cancer increases with the length of time and number of cigarettes smoked. Quitting
      smoking, even after smoking for many years, significantly lowers the chances
      of developing lung cancer. Lung cancer also can happen in people who have never
      smoked.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Lung cancer typically doesn't cause symptoms early on. Symptoms of lung
      cancer usually happen when the disease is advanced.
  - type: paragraph
    text: 'Signs and symptoms of lung cancer that happen in and around the lungs may
      include:'
  - type: list
    ordered: false
    items:
    - A new cough that doesn't go away.
    - Chest pain.
    - Coughing up blood, even a small amount.
    - Hoarseness.
    - Shortness of breath.
    - Wheezing.
  - type: paragraph
    text: 'Signs and symptoms that happen when lung cancer spreads to other parts
      of the body may include:'
  - type: list
    ordered: false
    items:
    - Bone pain.
    - Headache.
    - Losing weight without trying.
    - Loss of appetite.
    - Swelling in the face or neck.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with your doctor or other healthcare professional
        if you have any symptoms that worry you.
    - type: paragraph
      text: If you smoke and haven't been able to quit, make an appointment. Your
        healthcare professional can recommend strategies for quitting smoking. These
        may include counseling, medicines and nicotine replacement products.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Lung cancer happens when cells in the lungs develop changes in their DNA.
      A cell's DNA holds the instructions that tell a cell what to do. In healthy
      cells, the DNA gives instructions to grow and multiply at a set rate. The instructions
      tell the cells to die at a set time. In cancer cells, the DNA changes give different
      instructions. The changes tell the cancer cells to make many more cells quickly.
      Cancer cells can keep living when healthy cells would die. This causes too many
      cells.
  - type: paragraph
    text: The cancer cells might form a mass called a tumor. The tumor can grow to
      invade and destroy healthy body tissue. In time, cancer cells can break away
      and spread to other parts of the body. When cancer spreads, it's called metastatic
      cancer.
  - type: paragraph
    text: Smoking causes most lung cancers. It can cause lung cancer in both people
      who smoke and in people exposed to secondhand smoke. But lung cancer also happens
      in people who never smoked or been exposed to secondhand smoke. In these people,
      there may be no clear cause of lung cancer.
  subsections:
  - heading: How smoking causes lung cancer
    level: 3
    content:
    - type: paragraph
      text: Researchers believe smoking causes lung cancer by damaging the cells that
        line the lungs. Cigarette smoke is full of cancer-causing substances, called
        carcinogens. When you inhale cigarette smoke, the carcinogens cause changes
        in the lung tissue almost immediately.
    - type: paragraph
      text: At first your body may be able to repair this damage. But with each repeated
        exposure, healthy cells that line your lungs become more damaged. Over time,
        the damage causes cells to change and eventually cancer may develop.
    subsections: []
  - heading: Types of lung cancer
    level: 3
    content:
    - type: paragraph
      text: Lung cancer is divided into two major types based on the appearance of
        the cells under a microscope. Your healthcare professional makes treatment
        decisions based on which major type of lung cancer you have.
    - type: paragraph
      text: 'The two general types of lung cancer include:'
    - type: list
      ordered: false
      items:
      - Small cell lung cancer. Small cell lung cancer usually only happens in people
        who have smoked heavily for years. Small cell lung cancer is less common than
        non-small cell lung cancer.
      - Non-small cell lung cancer. Non-small cell lung cancer is a category that
        includes several types of lung cancers. Non-small cell lung cancers include
        squamous cell carcinoma, adenocarcinoma and large cell carcinoma.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: A number of factors may increase the risk of lung cancer. Some risk factors
      can be controlled, for instance, by quitting smoking. Other factors can't be
      controlled, such as your family history.
  - type: paragraph
    text: 'Risk factors for lung cancer include:'
  subsections:
  - heading: Smoking
    level: 3
    content:
    - type: paragraph
      text: Your risk of lung cancer increases with the number of cigarettes you smoke
        each day. Your risk also increases with the number of years you have smoked.
        Quitting at any age can significantly lower your risk of developing lung cancer.
    subsections: []
  - heading: Exposure to secondhand smoke
    level: 3
    content:
    - type: paragraph
      text: Even if you don't smoke, your risk of lung cancer increases if you're
        around people who are smoking. Breathing the smoke in the air from other people
        who are smoking is called secondhand smoke.
    subsections: []
  - heading: Previous radiation therapy
    level: 3
    content:
    - type: paragraph
      text: If you've had radiation therapy to the chest for another type of cancer,
        you may have an increased risk of developing lung cancer.
    subsections: []
  - heading: Exposure to radon gas
    level: 3
    content:
    - type: paragraph
      text: Radon is produced by the natural breakdown of uranium in soil, rock and
        water. Radon eventually becomes part of the air you breathe. Unsafe levels
        of radon can build up in any building, including homes.
    subsections: []
  - heading: Exposure to cancer-causing substances
    level: 3
    content:
    - type: paragraph
      text: Workplace exposure to cancer-causing substances, called carcinogens, can
        increase your risk of developing lung cancer. The risk may be higher if you
        smoke. Carcinogens linked to lung cancer risk include asbestos, arsenic, chromium
        and nickel.
    subsections: []
  - heading: Family history of lung cancer
    level: 3
    content:
    - type: paragraph
      text: People with a parent, sibling or child with lung cancer have an increased
        risk of the disease.
    subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Lung cancer can cause complications, such as:'
  subsections:
  - heading: Shortness of breath
    level: 3
    content:
    - type: paragraph
      text: People with lung cancer can experience shortness of breath if cancer grows
        to block the major airways. Lung cancer also can cause fluid to collect around
        the lungs and heart. The fluid makes it harder for the affected lung to expand
        fully when you inhale.
    subsections: []
  - heading: Coughing up blood
    level: 3
    content:
    - type: paragraph
      text: Lung cancer can cause bleeding in the airway. This can cause you to cough
        up blood. Sometimes bleeding can become severe. Treatments are available to
        control bleeding.
    subsections: []
  - heading: Pain
    level: 3
    content:
    - type: paragraph
      text: Advanced lung cancer that spreads can cause pain. It may spread to the
        lining of a lung or to another area of the body, such as a bone. Tell your
        healthcare professional if you experience pain. Many treatments are available
        to control pain.
    subsections: []
  - heading: Fluid in the chest
    level: 3
    content:
    - type: paragraph
      text: Lung cancer can cause fluid to accumulate in the chest, called pleural
        effusion. The fluid collects in the space that surrounds the affected lung
        in the chest cavity, called the pleural space.
    - type: paragraph
      text: Pleural effusion can cause shortness of breath. Treatments are available
        to drain the fluid from your chest. Treatments can reduce the risk that pleural
        effusion will happen again.
    subsections: []
  - heading: Cancer that spreads to other parts of the body
    level: 3
    content:
    - type: paragraph
      text: Lung cancer often spreads to other parts of the body. Lung cancer may
        spread to the brain and the bones.
    - type: paragraph
      text: Cancer that spreads can cause pain, nausea, headaches or other symptoms
        depending on what organ is affected. Once lung cancer has spread beyond the
        lungs, it's generally not curable. Treatments are available to decrease symptoms
        and to help you live longer.
    subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'There''s no sure way to prevent lung cancer, but you can reduce your risk
      if you:'
  subsections:
  - heading: Don't smoke
    level: 3
    content:
    - type: paragraph
      text: If you've never smoked, don't start. Talk to your children about not smoking
        so that they can understand how to avoid this major risk factor for lung cancer.
        Begin conversations about the dangers of smoking with your children early
        so that they know how to react to peer pressure.
    subsections: []
  - heading: Stop smoking
    level: 3
    content:
    - type: paragraph
      text: Stop smoking now. Quitting reduces your risk of lung cancer, even if you've
        smoked for years. Talk to your healthcare team about strategies and aids that
        can help you quit. Options include nicotine replacement products, medicines
        and support groups.
    subsections: []
  - heading: Avoid secondhand smoke
    level: 3
    content:
    - type: paragraph
      text: If you live or work with a person who smokes, urge them to quit. At the
        very least, ask them to smoke outside. Avoid areas where people smoke, such
        as bars. Seek out smoke-free options.
    subsections: []
  - heading: Test your home for radon
    level: 3
    content:
    - type: paragraph
      text: Have the radon levels in your home checked, especially if you live in
        an area where radon is known to be a problem. High radon levels can be fixed
        to make your home safer. Radon test kits are often sold at hardware stores
        and can be purchased online. For more information on radon testing, contact
        your local department of public health.
    subsections: []
  - heading: Avoid carcinogens at work
    level: 3
    content:
    - type: paragraph
      text: Take precautions to protect yourself from exposure to toxic chemicals
        at work. Follow your employer's precautions. For instance, if you're given
        a face mask for protection, always wear it. Ask your healthcare professional
        what more you can do to protect yourself at work. Your risk of lung damage
        from workplace carcinogens increases if you smoke.
    subsections: []
  - heading: Eat a diet full of fruits and vegetables
    level: 3
    content:
    - type: paragraph
      text: Choose a healthy diet with a variety of fruits and vegetables. Food sources
        of vitamins and nutrients are best. Avoid taking large doses of vitamins in
        pill form, as they may be harmful. For instance, researchers hoping to reduce
        the risk of lung cancer in people who smoked heavily gave them beta carotene
        supplements. Results showed the supplements increased the risk of cancer in
        people who smoke.
    subsections: []
  - heading: Exercise most days of the week
    level: 3
    content:
    - type: paragraph
      text: If you don't exercise regularly, start out slowly. Try to exercise most
        days of the week.
    subsections: []
