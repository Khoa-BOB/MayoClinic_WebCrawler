title: Dressler syndrome
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Dressler syndrome is swelling and irritation of the sac around the heart
      that happens after damage to the heart muscle. The damage may trigger an immune
      system response that causes the condition. The damage can result from a heart
      attack, heart surgery or a serious injury.
  - type: paragraph
    text: Symptoms of Dressler syndrome include chest pain that can feel like chest
      pain from a heart attack.
  - type: paragraph
    text: Swelling and irritation of the sac around the heart is called pericarditis.
      Dressler syndrome is a type of pericarditis that can start after the heart muscle
      is damaged. So you may hear Dressler syndrome called post-traumatic pericarditis.
  - type: paragraph
    text: 'Some other names for the condition are:'
  - type: list
    ordered: false
    items:
    - Post-myocardial infarction syndrome.
    - Post-cardiac injury syndrome.
    - Post-pericardiotomy syndrome.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of Dressler syndrome are likely to start weeks to a few months
      after a heart attack, surgery or injury to the chest. Symptoms can include:'
  - type: list
    ordered: false
    items:
    - Chest pain, which may get worse with deep breaths.
    - Fever.
    - Shortness of breath.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Get emergency care for sudden or ongoing chest pain. This can be a symptom
        of a heart attack or another serious condition.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Experts think Dressler syndrome is caused by the immune system's response
      to heart damage. The body reacts to the injured tissue by sending immune cells
      and proteins called antibodies to clean up and repair the affected area. Sometimes
      this response causes swelling due to the inflammation in the sac around the
      heart that's known as the pericardium.
  - type: paragraph
    text: Dressler syndrome can happen after a heart attack or some heart surgeries
      or procedures. It also can happen after a serious injury to the chest, such
      as trauma from a car accident.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Damage to the heart muscle increases the risk of Dressler syndrome. Some
      things that cause heart muscle are:'
  - type: list
    ordered: false
    items:
    - Chest injury.
    - Some types of heart surgery.
    - Heart attack.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: A complication of Dressler syndrome is fluid buildup in the tissues surrounding
      the lungs called pleural effusion.
  - type: paragraph
    text: 'Rarely, Dressler syndrome can cause more-serious complications, including:'
  - type: list
    ordered: false
    items:
    - Cardiac tamponade. Swelling of the pericardium can cause fluid to build up in
      the sac. The fluid can put pressure on the heart. The pressure forces the heart
      to work harder, and the heart doesn't pump blood as well as it should.
    - Constrictive pericarditis. Swelling that's ongoing or that keeps coming back
      can cause the pericardium to become thick or scarred. The scarring can reduce
      the heart's ability to pump blood.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: Some studies suggest that taking the anti-inflammatory medicine colchicine
      (Colcrys, Gloperba, others) soon after heart surgery may help prevent Dressler
      syndrome.
  subsections: []
