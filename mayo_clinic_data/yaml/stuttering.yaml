title: Stuttering
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Stuttering is a speech condition that disrupts the normal flow of speech.
      Fluency means having an easy and smooth flow and rhythm when speaking. With
      stuttering, the interruptions in flow happen often and cause problems for the
      speaker. Other names for stuttering are stammering and childhood-onset fluency
      disorder.
  - type: paragraph
    text: People who stutter know what they want to say, but they have a hard time
      saying it. For example, they may repeat or stretch out a word, a syllable, or
      a consonant or vowel sound. Or they may pause during speech because they've
      reached a word or sound that's hard to get out.
  - type: paragraph
    text: Stuttering is common among young children as a usual part of learning to
      speak. Some young children may stutter when their speech and language abilities
      aren't developed enough to keep up with what they want to say. Most children
      outgrow this type of stuttering, called developmental stuttering.
  - type: paragraph
    text: But sometimes stuttering is a long-term condition that remains into adulthood.
      This type of stuttering can affect self-esteem and communicating with other
      people.
  - type: paragraph
    text: Children and adults who stutter may be helped by treatments such as speech
      therapy, electronic devices to improve speech fluency or a form of mental health
      therapy called cognitive behavioral therapy.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Stuttering symptoms may include:'
  - type: list
    ordered: false
    items:
    - Having a hard time starting a word, phrase or sentence.
    - Stretching out a word or sounds within a word.
    - Repeating a sound, syllable or word.
    - Brief silence for certain syllables or words, or pausing before or within a
      word.
    - Adding extra words such as "um" if expecting to have problems moving to the
      next word.
    - A lot of tension, tightness or movement of the face or upper body when saying
      a word.
    - Anxiety about talking.
    - Not being able to communicate well with others.
  - type: paragraph
    text: 'These actions may happen when stuttering:'
  - type: list
    ordered: false
    items:
    - Rapid eye blinks.
    - Trembling of the lips or jaw.
    - Unusual face movements, sometimes called facial tics.
    - Head nodding.
    - Tightening of fists.
  - type: paragraph
    text: Stuttering may be worse when the person is excited, tired or under stress,
      or when feeling self-conscious, hurried or pressured. Situations such as speaking
      in front of a group or talking on the phone can be especially hard for people
      who stutter.
  - type: paragraph
    text: But most people who stutter can speak without stuttering when they talk
      to themselves and when they sing or speak along with someone else.
  subsections:
  - heading: When to see a doctor or speech-language pathologist
    level: 3
    content:
    - type: paragraph
      text: It's common for children between the ages of 2 and 5 years to go through
        periods when they may stutter. For most children, this is part of learning
        to speak, and it gets better on its own. But stuttering that continues may
        need treatment to improve speech fluency.
    - type: paragraph
      text: 'Call your healthcare professional for a referral to a specialist in speech
        and language called a speech-language pathologist. Or you can contact the
        speech-language pathologist directly for an appointment. Ask for help if stuttering:'
    - type: list
      ordered: false
      items:
      - Lasts more than six months.
      - Happens along with other speech or language problems.
      - Happens more often or continues as the child grows older.
      - Includes muscle tightening or physically struggling when trying to speak.
      - Affects the ability to effectively communicate at school or work or in social
        situations.
      - Causes anxiety or emotional problems, such as fear of or not taking part in
        situations that require speaking.
      - Begins as an adult.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Researchers continue to study the underlying causes of developmental stuttering.
      A combination of factors may be involved.
  subsections:
  - heading: Developmental stuttering
    level: 3
    content:
    - type: paragraph
      text: 'Stuttering that happens in children while they''re learning to speak
        is called developmental stuttering. Possible causes of developmental stuttering
        include:'
    - type: list
      ordered: false
      items:
      - Problems with speech motor control. Some evidence shows that problems in speech
        motor control, such as timing, sensory and motor coordination, may be involved.
      - Genetics. Stuttering tends to run in families. It appears that stuttering
        can happen from changes in genes passed down from parents to children.
    subsections: []
  - heading: Stuttering that happens from other causes
    level: 3
    content:
    - type: paragraph
      text: Speech fluency can be disrupted from causes other than developmental stuttering.
    - type: list
      ordered: false
      items:
      - Neurogenic stuttering. A stroke, traumatic brain injury or other brain disorders
        can cause speech that is slow or has pauses or repeated sounds.
      - Emotional distress. Speech fluency can be disrupted during times of emotional
        distress. Speakers who usually do not stutter may experience problems with
        fluency when they are nervous or feel pressured. These situations also may
        cause speakers who stutter to have greater problems with fluency.
      - Psychogenic stuttering. Speech difficulties that appear after an emotional
        trauma are uncommon and not the same as developmental stuttering.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Males are much more likely to stutter than females are. Things that raise
      the risk of stuttering include:'
  - type: list
    ordered: false
    items:
    - Having a childhood developmental condition. Children who have developmental
      conditions, such as attention-deficit/hyperactivity disorder, autism or developmental
      delays, may be more likely to stutter. This is true for children with other
      speech problems too.
    - Having relatives who stutter. Stuttering tends to run in families.
    - Stress. Stress in the family and other types of stress or pressure can worsen
      existing stuttering.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Stuttering can lead to:'
  - type: list
    ordered: false
    items:
    - Problems communicating with others.
    - Not speaking or staying away from situations that require speaking.
    - Not taking part in social, school or work activities and opportunities for success.
    - Being bullied or teased.
    - Low self-esteem.
  subsections: []
