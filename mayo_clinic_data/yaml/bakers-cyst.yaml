title: Baker cyst
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: A Baker cyst is a fluid-filled growth behind the knee. It causes a bulge
      and a feeling of tightness. Also called a popliteal (pop-luh-TEE-ul) cyst, a
      Baker cyst sometime causes pain. The pain can get worse when with activity or
      when fully straightening or bending the knee.
  - type: paragraph
    text: A Baker cyst is usually the result of a problem with the knee joint, such
      as arthritis or a cartilage tear. Both conditions can cause the knee to produce
      too much fluid.
  - type: paragraph
    text: Although a Baker cyst may cause swelling and discomfort, treating the underlying
      problem that is causing it usually provides relief.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'In some cases, a Baker cyst causes no pain, and you may not notice it.
      If you do have symptoms, they might include:'
  - type: list
    ordered: false
    items:
    - Swelling behind the knee, and sometimes in the leg
    - Knee pain
    - Stiffness and inability to fully flex the knee
  - type: paragraph
    text: The symptoms may be worse after you've been active or if you've been standing
      for a long time.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Seek medical attention if you have pain and swelling behind your knee.
        Though unlikely, these symptoms may be a sign of a blood clot in a leg vein.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: A lubricating fluid called synovial (sih-NO-vee-ul) fluid helps the leg
      swing smoothly and reduces friction between the moving parts of the knee.
  - type: paragraph
    text: But sometimes underlying conditions can cause the knee to produce too much
      synovial fluid. When this happens, fluid can build up in the back of the knee,
      leading to a Baker cyst.
  - type: paragraph
    text: 'This can be caused by:'
  - type: list
    ordered: false
    items:
    - Inflammation of the knee joint, which can occur with various types of arthritis
    - A knee injury, such as a cartilage tear
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Rarely, a Baker cyst bursts and synovial fluid leaks into the calf region,
      causing:'
  - type: list
    ordered: false
    items:
    - Sharp pain in the knee
    - Swelling in the calf
    - Sometimes, redness of the calf or a feeling of water running down the calf
  subsections: []
