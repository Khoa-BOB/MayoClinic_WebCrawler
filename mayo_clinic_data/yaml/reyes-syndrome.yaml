title: Reye's syndrome
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Reye's syndrome is a serious condition that causes swelling in the liver
      and brain. It can occur at any age but usually affects children and teenagers
      after a viral infection, most commonly the flu or chickenpox. Reye's syndrome
      is rare. The condition also is known as Reye syndrome.
  - type: paragraph
    text: Symptoms such as confusion, seizures and loss of consciousness need emergency
      treatment. Early diagnosis and treatment of Reye's syndrome can save a child's
      life.
  - type: paragraph
    text: Aspirin has been linked with Reye's syndrome in children or teenagers who
      have the flu or chickenpox. Do not give children or teenagers aspirin. To treat
      fever or pain, consider giving your child infants' or children's acetaminophen
      (Tylenol, others) or ibuprofen (Advil, Motrin, others). Infants' or children's
      acetaminophen and ibuprofen medicines are safer alternatives to aspirin. Talk
      to your healthcare professional if you have concerns.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: The symptoms of Reye's syndrome usually start about 3 to 5 days after a
      viral infection begins. The viral infection may be the flu, also known as influenza,
      or chickenpox. Or Reye's syndrome may develop after an upper respiratory infection
      such as a cold.
  - type: paragraph
    text: In Reye's syndrome, a child's blood sugar usually drops while levels of
      ammonia and acidity in the blood rise. The liver also may swell, and fats may
      build up. Swelling may occur in the brain. This can cause seizures, convulsions
      or loss of consciousness.
  subsections:
  - heading: Initial symptoms
    level: 3
    content:
    - type: paragraph
      text: 'For children younger than age 2, the first symptoms of Reye''s syndrome
        may include:'
    - type: list
      ordered: false
      items:
      - Diarrhea.
      - Rapid breathing.
    - type: paragraph
      text: 'For older children and teenagers, early symptoms may include:'
    - type: list
      ordered: false
      items:
      - Vomiting that doesn't stop.
      - Being sleepy or sluggish.
    subsections: []
  - heading: Additional symptoms
    level: 3
    content:
    - type: paragraph
      text: 'As the condition gets worse, symptoms may become more serious, including:'
    - type: list
      ordered: false
      items:
      - Irritable, aggressive or irrational behavior.
      - Confusion or seeing or hearing things that aren't there.
      - Weakness in the arms and legs or not being able to move them.
      - Seizures.
      - Excessive sluggishness.
      - Decreased level of consciousness.
    - type: paragraph
      text: These symptoms need emergency treatment.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Early diagnosis and treatment of Reye's syndrome can save a child's life.
        If you suspect that your child has Reye's syndrome, it's important to act
        quickly.
    - type: paragraph
      text: 'Seek emergency medical help if your child:'
    - type: list
      ordered: false
      items:
      - Has seizures.
      - Loses consciousness.
    - type: paragraph
      text: 'Contact your child''s healthcare professional if your child experiences
        the following symptoms after having the flu or chickenpox:'
    - type: list
      ordered: false
      items:
      - Vomits repeatedly.
      - Becomes unusually sleepy or sluggish.
      - Has sudden behavior changes.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The exact cause of Reye's syndrome is not known. The use of aspirin during
      a viral illness has most commonly been linked to Reye's syndrome. Several factors
      may play a role.
  - type: paragraph
    text: In some children, the symptoms of Reye's syndrome may be caused by another
      health condition, such as a metabolic condition. This can occur even without
      the use of aspirin.
  - type: paragraph
    text: Metabolic conditions are rare. The most common condition that causes Reye's
      syndrome is medium-chain acyl-CoA dehydrogenase (MCAD) deficiency. In MCAD deficiency,
      the body can't break down certain fats to turn them into energy. This happens
      because an enzyme is missing or not working properly. MCAD deficiency is a fatty
      acid oxidation disorder.
  - type: paragraph
    text: In people with a fatty acid oxidation disorder, aspirin use during a viral
      illness is more likely to trigger symptoms of Reye's syndrome. A screening test
      can determine if your child has a fatty acid oxidation disorder.
  - type: paragraph
    text: Reye's syndrome may develop after influenza or chickenpox in particular.
  - type: paragraph
    text: Exposure to certain toxins — such as insecticides, herbicides and paint
      thinner — may produce symptoms similar to Reye's syndrome. But these toxins
      don't cause Reye's syndrome.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'The following risk factors — usually when they occur together — may lead
      to Reye''s syndrome:'
  - type: list
    ordered: false
    items:
    - Using aspirin to treat a viral infection such as chickenpox, the flu or an upper
      respiratory infection.
    - Having a metabolic condition. This may include a fatty acid oxidation disorder.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Most children and teenagers who have Reye's syndrome survive. However, varying
      degrees of lasting brain damage are possible. Without proper diagnosis and treatment,
      Reye's syndrome can cause death within a few days.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: To prevent Reye's syndrome, do not give children or teenagers aspirin. This
      includes plain aspirin and medicines that contain aspirin. Aspirin has been
      linked to Reye's syndrome in children and teenagers who have the flu or chickenpox.
  - type: paragraph
    text: Some hospitals and medical facilities screen newborns for fatty acid oxidation
      disorders to determine which children are at greater risk of developing Reye's
      syndrome. It's especially important not to give aspirin or medicines that contain
      aspirin to children with known fatty acid oxidation disorders.
  - type: paragraph
    text: Always check the label before you give your child medicine. This includes
      products you buy without a prescription and alternative or herbal remedies.
      Aspirin can show up in some unexpected products such as Alka-Seltzer.
  - type: paragraph
    text: 'Sometimes aspirin goes by other names, such as:'
  - type: list
    ordered: false
    items:
    - Acetylsalicylic acid.
    - Acetylsalicylate.
    - Salicylic acid.
    - Salicylate.
  - type: paragraph
    text: For the treatment of fever or pain related to the flu, chickenpox or another
      viral illness, give your child a safer alternative to aspirin. This may include
      infants' or children's acetaminophen (Tylenol, others) or ibuprofen (Advil,
      Motrin, others).
  - type: paragraph
    text: There's an exception to the general rule about aspirin. Children and teenagers
      who have certain chronic diseases, such as Kawasaki disease, may need long-term
      treatment with medicines that contain aspirin.
  - type: paragraph
    text: If your child needs to take aspirin, make sure your child's vaccines are
      current. This includes two doses of the chickenpox vaccine and a yearly flu
      vaccine. Avoiding these two viral illnesses can help prevent Reye's syndrome.
  subsections: []
