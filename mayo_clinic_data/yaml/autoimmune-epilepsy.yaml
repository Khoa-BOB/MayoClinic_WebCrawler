title: Autoimmune epilepsy
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Autoimmune epilepsy is a type of epilepsy where seizures are caused by the
      immune system mistakenly attacking brain cells. It can occur with conditions
      that affect the immune system, especially autoimmune encephalitis.
  - type: paragraph
    text: Autoimmune epilepsy also is known as autoimmune associated epilepsy and
      acute symptomatic seizures secondary to autoimmune encephalitis.
  - type: paragraph
    text: The immune system protects the body from viruses, bacteria and other substances
      that can cause illnesses. Antibodies are proteins that are part of the immune
      system. In autoimmune epilepsy, antibodies mistakenly target receptors in the
      brain. This leads to swelling in the brain, also known as inflammation, and
      seizures.
  - type: paragraph
    text: Antiseizure medicines usually don't do enough to manage seizures in people
      with autoimmune epilepsy. Instead, immunotherapy medicines help reduce the immune
      response on the brain.
  - type: paragraph
    text: When immunotherapy is started early, it can reduce inflammation and improve
      seizures. For some people, treatment can stop seizures completely. For others,
      seizures may continue after treatment.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of autoimmune epilepsy may begin after an illness with a fever.
      Seizures come on suddenly and are serious. The types of seizures that may occur
      include:'
  - type: list
    ordered: false
    items:
    - Focal seizures. These are the most common type of seizure in autoimmune epilepsy.
      Sometimes focal seizures cause a change or loss of awareness. The seizures may
      cause the person to stare and not respond to the environment. Other types of
      focal seizures don't cause a change in awareness. These seizures cause different
      symptoms depending on which part of the brain causes them. Focal seizures may
      cause one part of the body to shake. Or they may cause a feeling that his has
      happened before, known as déjà vu. Focal seizures also may cause nausea or vision
      symptoms, such as flashing lights.
    - Faciobrachial dystonic seizures. These seizures cause muscle contractions on
      one side of the face and in an arm, both on the same side of the body.
  - type: paragraph
    text: 'Symptoms related to seizures include:'
  - type: list
    ordered: false
    items:
    - Seizures that happen several times a day.
    - Seizures that don't go away with antiseizure medicines.
    - Seizures that last more than five minutes or that occur close together without
      the person regaining consciousness, known as status epilepticus.
  - type: paragraph
    text: 'Autoimmune epilepsy symptoms also may include:'
  - type: list
    ordered: false
    items:
    - Memory loss and trouble with thinking.
    - Personality and behavior changes.
    - Involuntary movements or clumsy movements.
    - Irregular eye movements.
    - Changes in heart rate, blood pressure and other automatic functions.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Get emergency medical care if you or someone you are with has a seizure
        that lasts more than five minutes or if seizures occur one after another with
        a loss of consciousness. Also seek emergency medical care for high fevers
        or trouble breathing.
    - type: paragraph
      text: See your healthcare professional right away if you have had a seizure
        for the first time or if you have other symptoms of autoimmune epilepsy.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Autoimmune epilepsy is caused by the immune system attacking brain cells
      and leading to seizures. Antibodies are part of the immune system. They usually
      protect the body from viruses and infections. But in autoimmune conditions,
      the immune system attacks healthy cells. More recently, research has concluded
      that epilepsy can be an autoimmune disease.
  - type: paragraph
    text: 'Autoimmune epilepsy causes may include:'
  - type: list
    ordered: false
    items:
    - Autoimmune encephalitis. Autoimmune encephalitis (en-sef-uh-LIE-tis) is a group
      of conditions that causes swelling in the brain. This happens because the immune
      system mistakenly attacks brain cells. Autoimmune encephalitis causes a variety
      of symptoms, including seizures. It is the most common cause of autoimmune epilepsy.
      Certain types of autoimmune encephalitis are commonly linked to autoimmune epilepsy
      and are associated with antibodies that target NMDA-receptors, LGI1, CASPR2
      and GAD65.
    - Rasmussen syndrome. In this condition, immune cells known as T cells cause inflammation
      and brain damage that lead to seizures. People with autoimmune epilepsy due
      to Rasmussen syndrome may continue to have seizures after treatment.
    - Cancer. Sometimes tumors trigger the immune system to attack healthy brain cells,
      known as paraneoplastic syndrome. This can lead to epilepsy.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'The risk of autoimmune epilepsy is low, but it can occur in both adults
      and children. Risk factors include:'
  - type: list
    ordered: false
    items:
    - Having another autoimmune disease. These may include rheumatoid arthritis, Graves'
      disease, Hashimoto thyroiditis, Crohn's disease, ulcerative colitis or lupus.
    - Having a history of cancer.
    - Having a parent, sibling or child with an autoimmune disease.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Autoimmune epilepsy complications can include serious seizures that last
      more than five minutes or occur one after another. The person isn't conscious
      in between the seizures. These serious seizures are known as status epilepticus.
      They need emergency medical attention.
  - type: paragraph
    text: Sometimes autoimmune epilepsy can lead to seizures that don't stop with
      treatment.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: You may not be able to prevent autoimmune epilepsy. But getting cancer screenings
      can help your healthcare professional find tumors and treat them early. This
      could prevent autoimmune encephalitis triggered by cancers, which can be a cause
      of epilepsy. Talk with your healthcare professional about your cancer risk and
      if you should get screened for certain cancers.
  subsections: []
