title: Desmoplastic small round cell tumors
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Desmoplastic (des-moe-PLAS-tik) small round cell tumors (DSRCT) are a type
      of cancer that often begins in the abdomen. Sometimes this type of cancer can
      occur in other parts of the body.
  - type: paragraph
    text: Desmoplastic small round cell tumors are rare cancers that begin as a growth
      of cells. The growths often form on the tissue that lines the inside of the
      abdomen and pelvis. This tissue lining is called the peritoneum. The cancer
      cells can quickly spread to other nearby organs. This might include the bladder,
      colon and liver.
  - type: paragraph
    text: Desmoplastic small round cell tumors can happen to anyone, but they're more
      common in young men and boys.
  - type: paragraph
    text: Treatment for desmoplastic small round cell tumors typically involves a
      combination of treatments. Options might include surgery, chemotherapy and radiation
      therapy.
  - type: paragraph
    text: Desmoplastic small round cell tumors are a type of soft tissue sarcoma.
      Soft tissue sarcoma is a term used to describe a large group of cancers that
      all start in the tissues that connect, support and surround other body structures.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Desmoplastic small round cell tumor symptoms vary depending on where the
      cancer begins. Most often it begins in the abdomen.
  - type: paragraph
    text: 'Signs and symptoms of desmoplastic small round cell tumors in the abdomen
      include:'
  - type: list
    ordered: false
    items:
    - Swelling of the abdomen
    - Abdominal pain
    - Constipation
    - Difficulty urinating
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with your healthcare professional if you have any
        persistent signs and symptoms that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: It's not clear what causes desmoplastic small round cell tumors.
  - type: paragraph
    text: Cancer begins when a cell develops changes in its DNA. A cell's DNA contains
      the instructions that tell a cell what to do. The changes tell the cell to multiply
      quickly. This creates a clump of cancer cells called a tumor. The cancer cells
      can invade and destroy healthy body tissue. In time, the cancer cells can break
      away and spread to other parts of the body.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Healthcare professionals haven't found many risk factors for desmoplastic
      small round cell tumors. This cancer can happen to anyone, but it's more common
      in young men and boys.
  subsections: []
