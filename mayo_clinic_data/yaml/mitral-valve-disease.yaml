title: Mitral valve disease
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Mitral valve disease is a problem with the valve located between the left
      heart chambers. The upper left heart chamber is called the left atrium. The
      bottom left heart chamber is called the left ventricle.
  - type: paragraph
    text: 'Mitral valve disease includes:'
  - type: list
    ordered: false
    items:
    - Mitral valve regurgitation. The mitral valve flaps, also called leaflets, may
      not close tightly. This causes blood to leak backward.
    - Mitral valve stenosis. The flaps of the mitral valve become thick or stiff,
      and they can fuse together. This narrows the valve opening, which reduces blood
      flow from the left atrium to the left ventricle.
  - type: paragraph
    text: Treatment for mitral valve disease depends on the severity of the condition
      and whether it is worsening. Sometimes, surgery is recommended to repair or
      replace the mitral valve.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Some people with mitral valve disease might not have symptoms for many years,
      if at all.
  - type: paragraph
    text: 'Symptoms of mitral valve disease can include:'
  - type: list
    ordered: false
    items:
    - Fatigue.
    - Irregular heartbeat.
    - Shortness of breath.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If you have symptoms of mitral valve disease, you may be referred to a
        doctor trained in heart diseases, called a cardiologist.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: To understand the causes of mitral valve disease, it may be helpful to know
      how the heart works.
  - type: paragraph
    text: The mitral valve is one of four valves in the heart that keep blood flowing
      in the right direction. Each valve has flaps, called leaflets, that open and
      close once during each heartbeat. If a valve doesn't open or close properly,
      blood flow through the heart to the body can be reduced.
  - type: list
    ordered: false
    items:
    - In mitral valve regurgitation, the flaps don't close tightly. Blood flows backward
      when the valve is closed, making it harder for the heart to work properly.
    - In mitral valve stenosis, the valve opening narrows. The heart now must work
      harder to force blood through the smaller valve opening. If the opening in the
      valve becomes small enough, it can reduce blood flow between the left heart
      chambers.
  - type: paragraph
    text: Mitral valve disease has many causes. Some forms of mitral valve disease
      can be present at birth. A heart problem that you're born with is called a congenital
      heart defect.
  - type: paragraph
    text: Mitral valve disease also may develop later in life. This means it is acquired.
      For example, mitral valve stenosis is often caused by rheumatic fever. This
      fever is a complication of a strep infection that can affect the heart. When
      this happens, it's called rheumatic mitral valve disease.
  - type: paragraph
    text: 'Other causes of acquired mitral valve disease include:'
  - type: list
    ordered: false
    items:
    - Other heart conditions.
    - Infection.
    - Age-related changes.
    - Autoimmune disease, such as lupus.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Several things can increase the risk of mitral valve disease, including:'
  - type: list
    ordered: false
    items:
    - Older age.
    - Certain infections that affect the heart.
    - Heart attack and some types of heart disease.
    - Use of certain drugs.
    - Heart condition present at birth, called a congenital heart defect.
    - Radiation to the chest.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Mitral valve disease can cause many complications. Severe mitral valve regurgitation,
      for example, causes the heart to work harder, which can cause the left ventricle
      to enlarge and the heart muscle to weaken.
  - type: paragraph
    text: 'Other complications of mitral valve disease may include:'
  - type: list
    ordered: false
    items:
    - Irregular and often rapid heartbeat, called atrial fibrillation.
    - High blood pressure in the blood vessels in the lungs, called pulmonary hypertension.
    - Blood clots.
    - Congestive heart failure.
    - Stroke.
  subsections: []
