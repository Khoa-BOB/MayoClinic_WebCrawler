title: Rhabdomyosarcoma
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Rhabdomyosarcoma is a rare type of cancer that starts as a growth of cells
      in soft tissue. Soft tissues support and connect organs and other parts of the
      body. Rhabdomyosarcoma most often starts in muscle tissue.
  - type: paragraph
    text: 'Although rhabdomyosarcoma can start anywhere in the body, it''s more likely
      to start in the:'
  - type: list
    ordered: false
    items:
    - Head and neck area.
    - Urinary system, such as the bladder.
    - Reproductive system, such as the vagina, uterus and testes.
    - Arms and legs.
  - type: paragraph
    text: Rhabdomyosarcoma treatment often involves surgery, chemotherapy and radiation
      therapy. Treatment depends on where the cancer starts, how large it grows and
      whether it spreads to other parts of the body.
  - type: paragraph
    text: Research into diagnosis and treatment have greatly improved the outlook
      for people diagnosed with rhabdomyosarcoma. More and more people are living
      for years after a rhabdomyosarcoma diagnosis.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Signs and symptoms of rhabdomyosarcoma depend on where the cancer starts.
  - type: paragraph
    text: 'For example, if the cancer is in the head or neck area, symptoms may include:'
  - type: list
    ordered: false
    items:
    - Headache.
    - Bleeding in the nose, throat or ears.
    - Tearing, bulging or swelling of the eyes.
  - type: paragraph
    text: 'If the cancer is in the urinary or reproductive system, symptoms may include:'
  - type: list
    ordered: false
    items:
    - A mass or bleeding in the vagina or rectum.
    - Trouble urinating and blood in the urine.
    - Trouble with bowel movements.
  - type: paragraph
    text: 'If the cancer is in the arms or legs, symptoms may include:'
  - type: list
    ordered: false
    items:
    - Possibly pain in the affected area, if the cancer pushes on nerves or other
      areas of the body.
    - Swelling or a lump in the arm or leg.
  subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: It's not clear what causes rhabdomyosarcoma. It starts when a soft tissue
      cell develops changes in its DNA. A cell's DNA holds the instructions that tell
      a cell what to do.
  - type: paragraph
    text: In healthy cells, the DNA gives instructions to grow and multiply at a set
      rate. The instructions tell the cells to die at a set time. In cancer cells,
      the DNA changes give different instructions. The changes tell the cancer cells
      to make many more cells quickly. Cancer cells can keep living when healthy cells
      would die. This causes too many cells.
  - type: paragraph
    text: The cancer cells might form a mass called a tumor. The tumor can grow to
      invade and destroy healthy body tissue. In time, cancer cells can break away
      and spread to other parts of the body. When cancer spreads, it's called metastatic
      cancer.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that may increase the risk of rhabdomyosarcoma include:'
  - type: list
    ordered: false
    items:
    - Younger age. Rhabdomyosarcoma most often happens to children younger than 10.
    - Inherited syndromes. Rarely, rhabdomyosarcoma has been linked to genetic syndromes
      that are passed from parents to children. These include neurofibromatosis 1,
      Noonan syndrome, Li-Fraumeni syndrome, Beckwith-Wiedemann syndrome and Costello
      syndrome.
  - type: paragraph
    text: There is no way to prevent rhabdomyosarcoma.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Complications of rhabdomyosarcoma and its treatment include:'
  - type: list
    ordered: false
    items:
    - Cancer that spreads. Rhabdomyosarcoma can spread from where it started to other
      parts of the body. When cancer spreads, it might require more-intense treatments.
      This can make recovery harder. Rhabdomyosarcoma most often spreads to the lungs,
      lymph nodes and bones.
    - Long-term side effects. Rhabdomyosarcoma and its treatments can cause many side
      effects, both short and long term. Your healthcare team can help you manage
      the side effects that happen during treatment. And the team can give you a list
      of side effects to watch for in the years after treatment.
  subsections: []
