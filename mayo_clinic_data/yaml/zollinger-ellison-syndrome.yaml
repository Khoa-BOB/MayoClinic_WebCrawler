title: Zollinger-Ellison syndrome
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Zollinger-Ellison syndrome is a condition in which one or more tumors grow
      in the pancreas or small intestine. The tumors, called gastrinomas, produce
      large amounts of the hormone gastrin. Gastrin causes the stomach to produce
      too much acid, which leads to peptic ulcers. High gastrin levels also can cause
      diarrhea, belly pain and other symptoms.
  - type: paragraph
    text: Zollinger-Ellison syndrome is rare. Though it may happen at any time in
      life, people usually find out they have it sometime between ages 20 and 50.
      Medicines to cut down stomach acid and heal the ulcers are the usual treatment.
      Some people also may need surgery to remove tumors.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of Zollinger-Ellison syndrome may include:'
  - type: list
    ordered: false
    items:
    - Stomach pain.
    - Diarrhea.
    - Burning, aching or discomfort in your upper belly.
    - Acid reflux and heartburn.
    - Burping.
    - Nausea and vomiting.
    - Bleeding in your digestive tract.
    - Losing weight without trying.
    - Loss of appetite.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See a healthcare professional if you have a burning, aching pain in your
        upper belly that doesn't go away — especially if you also have nausea, vomiting
        and diarrhea.
    - type: paragraph
      text: Tell your care professional if you've been using over-the-counter medicines
        to reduce stomach acid. These include omeprazole (Prilosec, Zegerid), cimetidine
        (Tagamet HB) or famotidine (Pepcid AC). These medicines may mask your symptoms,
        which could delay your diagnosis.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The exact cause of Zollinger-Ellison syndrome isn't known. But the pattern
      of events that occurs in Zollinger-Ellison syndrome typically follows the same
      sequence. The syndrome begins when one or more tumors form in the pancreas or
      a part of the small intestine called the duodenum. The duodenum is the section
      connected to the stomach. Sometimes the tumors form at other sites, such as
      the lymph nodes next to the pancreas.
  - type: paragraph
    text: The pancreas sits behind the stomach. It makes enzymes that are needed for
      digesting food. The pancreas also makes many hormones, including insulin. Insulin
      is the hormone that helps control blood sugar, also called glucose.
  - type: paragraph
    text: Digestive juices from the pancreas, liver and gallbladder mix in the duodenum.
      This is where most of digestion happens.
  - type: paragraph
    text: The tumors that form with Zollinger-Ellison syndrome are made up of cells
      that secrete large amounts of the hormone gastrin. For this reason, they are
      sometimes called gastrinomas. Increased gastrin causes the stomach to make far
      too much acid. The excess acid then leads to peptic ulcers and sometimes to
      diarrhea.
  - type: paragraph
    text: Besides causing excess acid production, the tumors are often cancerous.
      Although the tumors tend to grow slowly, the cancer can spread elsewhere — most
      commonly to nearby lymph nodes or the liver.
  subsections:
  - heading: Association with MEN 1
    level: 3
    content:
    - type: paragraph
      text: Zollinger-Ellison syndrome may be caused by an inherited condition called
        multiple endocrine neoplasia, type 1 (MEN 1). People with MEN 1 also have
        tumors in the parathyroid glands. They may have tumors in their pituitary
        glands as well.
    - type: paragraph
      text: About 25% of people who have gastrinomas have them as part of MEN 1. They
        also may have tumors in the pancreas and other organs.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: If you have a first-degree relative, such as a sibling or parent, with MEN
      1, it's more likely that you'll have Zollinger-Ellison syndrome.
  subsections: []
