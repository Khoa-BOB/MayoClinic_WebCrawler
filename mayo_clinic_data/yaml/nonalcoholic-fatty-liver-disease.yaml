title: Nonalcoholic fatty liver disease
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Metabolic dysfunction-associated steatotic liver disease (MASLD), formerly
      called nonalcoholic fatty liver disease (NAFLD), is a liver condition that affects
      people with excess weight, obesity or other metabolic conditions, such as type
      2 diabetes, high blood pressure or high cholesterol. In MASLD, too much fat
      builds up in the liver.
  - type: paragraph
    text: MASLD is becoming more common, especially in Middle Eastern and Western
      nations, as the number of people with obesity rises. It is the most common form
      of liver disease in the world. MASLD ranges in severity from hepatic steatosis
      — sometimes called diffuse hepatic steatosis, or formerly fatty liver infiltration
      or simply fatty liver — to a more severe form of disease called metabolic dysfunction-associated
      steatohepatitis (MASH), formerly called nonalcoholic steatohepatitis (NASH).
  - type: paragraph
    text: MASH causes the liver to swell or enlarge. This is known as hepatomegaly
      . MASH also causes fat deposits in the liver, which causes liver damage. MASH
      may get worse and may lead to serious liver scarring, called cirrhosis , or
      even liver cancer. This damage is like the damage caused by heavy alcohol use.
  - type: paragraph
    text: Life expectancy varies depending on whether you have MASLD or MASH. Factors
      such as scarring and other health conditions also affect how long you can live
      with MASLD or MASH.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'MASLD often has no symptoms. When it does, they include:'
  - type: list
    ordered: false
    items:
    - Feeling very tired, also called fatigue.
    - Not feeling well, known as malaise.
    - Pain or discomfort in the upper right belly area.
  - type: paragraph
    text: 'Possible symptoms of MASH and cirrhosis, which is severe scarring, include:'
  - type: list
    ordered: false
    items:
    - Itchy skin.
    - Abdominal swelling, also called ascites (uh-SY-teez).
    - Shortness of breath.
    - Swelling in the legs.
    - Spiderlike blood vessels just beneath the skin's surface.
    - Enlarged spleen.
    - A change in skin color on the palms.
    - Yellowing of the skin and eyes, also called jaundice.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with a member of your health care team if you have
        lasting symptoms that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Experts don't know exactly why fat builds up in some livers and not others.
      They also don't fully understand why fat buildup in some livers turns into MASH.
  - type: paragraph
    text: 'MASLD and MASH are both linked to the following:'
  - type: list
    ordered: false
    items:
    - Genetics.
    - Being overweight or having obesity.
    - Insulin resistance , which happens when the body's cells don't take up sugar
      in response to the hormone insulin.
    - Type 2 diabetes, sometimes called high blood sugar or hyperglycemia.
    - High levels of fats, especially triglycerides, in the blood.
  - type: paragraph
    text: These combined health concerns may contribute to liver damage. However,
      some people get MASLD even if they do not have any risk factors.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Many diseases and health conditions can increase your risk of MASLD, including:'
  - type: list
    ordered: false
    items:
    - Obesity, especially when fat is centered in the waist.
    - Type 2 diabetes.
    - High cholesterol.
    - High levels of triglycerides in the blood.
    - Insulin resistance.
    - Metabolic syndrome .
    - Polycystic ovary syndrome.
    - Obstructive sleep apnea.
    - Underactive thyroid, also called hypothyroidism.
    - Underactive pituitary gland, also called hypopituitarism .
    - Growth hormone deficiency, which means the body doesn't make enough hormones
      to grow.
  - type: paragraph
    text: 'MASH is more likely in people:'
  - type: list
    ordered: false
    items:
    - Older than 50.
    - Who have certain genetic risk factors.
    - With obesity.
    - With diabetes or high blood sugar.
    - With symptoms of metabolic syndrome, such as high blood pressure, high triglycerides
      and a large waist size.
  - type: paragraph
    text: It is hard to tell MASLD and MASH apart without an exam and testing.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Severe liver scarring, also called cirrhosis, is the main complication of
      MASLD and MASH. Cirrhosis happens because of liver injury, such as the damage
      caused by inflammation in MASH. As the liver tries to stop inflammation, it
      creates areas of scarring, also called fibrosis. With ongoing inflammation,
      fibrosis spreads and takes up more liver tissue.
  - type: paragraph
    text: 'If nothing is done to stop the scarring, cirrhosis can lead to:'
  - type: list
    ordered: false
    items:
    - Fluid buildup in the stomach area, called ascites.
    - Swollen veins in the esophagus, called esophageal varices, which can rupture
      and bleed.
    - Confusion, sleepiness and slurred speech, also called hepatic encephalopathy.
    - Overactive spleen, known as hypersplenism, which can cause too few blood platelets.
    - Liver cancer.
    - End-stage liver failure, which means the liver has stopped working.
  - type: paragraph
    text: For many people with MASLD, the outlook is good, especially if they make
      recommended lifestyle changes. In fact, in some people, weight loss may help
      reverse MASLD. However, some people develop MASH, which significantly impacts
      life expectancy and health outcomes .
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'To reduce your risk of MASLD:'
  - type: list
    ordered: false
    items:
    - Eat a healthy diet . Eat a diet that's rich in fruits, vegetables, whole grains
      and healthy fats. One such diet is the Mediterranean diet.
    - Limit alcohol, simple sugars and portion sizes. Avoid sugary drinks such as
      soda, sports drinks, juices and sweet tea. Avoid or limit alcohol, which can
      damage the liver.
    - Keep a healthy weight. If you are overweight or have obesity, work with your
      healthcare team to gradually lose weight. If you are at a healthy weight, work
      to keep it by eating a healthy diet and exercising.
    - Exercise. Be active most days of the week. Get an OK from your healthcare team
      first if you haven't been exercising regularly.
  subsections: []
