title: Liposarcoma
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Liposarcoma is a rare type of cancer that starts in the fat cells. It most
      often begins as a growth of cells in the belly or in the arm and leg muscles.
      But liposarcoma can begin in the fat cells anywhere in the body.
  - type: paragraph
    text: Liposarcoma happens most often in older adults, but it can happen at any
      age.
  - type: paragraph
    text: Liposarcoma treatment usually involves surgery to remove the cancer. Other
      treatments, such as radiation therapy, also may be used.
  - type: paragraph
    text: Liposarcoma is a type of cancer called a soft tissue sarcoma. These cancers
      happen in the body's connective tissues. There are many types of soft tissue
      sarcoma.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Liposarcoma symptoms depend on the part of the body where the cancer forms.
  - type: paragraph
    text: 'Liposarcoma in the arms and legs can cause:'
  - type: list
    ordered: false
    items:
    - A growing lump of tissue under the skin.
    - Pain.
    - Swelling.
    - Weakness of the affected limb.
  - type: paragraph
    text: 'Liposarcoma in the belly, also called the abdomen, can cause:'
  - type: list
    ordered: false
    items:
    - Abdominal pain.
    - Abdominal swelling.
    - Feeling full sooner when eating.
    - Constipation.
    - Blood in stool.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with a doctor or other health care professional if
        you have any symptoms that don't go away and that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: It's not clear what causes liposarcoma.
  - type: paragraph
    text: Liposarcoma starts when fat cells get changes in their DNA. A cell's DNA
      holds the instructions that tell the cell what to do. The changes turn the fat
      cells into cancer cells. The changes tell the cancer cells to grow quickly and
      make a lot of extra cells. The cancer cells keep living when healthy cells would
      die as part of their natural life cycle.
  - type: paragraph
    text: The cancer cells form a growth, called a tumor. In some types of liposarcoma,
      the cancer cells stay put. They continue making more cells, causing the tumor
      to get bigger. In other types of liposarcoma, the cancer cells might break away
      and spread to other parts of the body. When cancer spreads to other parts of
      the body, it's called metastatic cancer.
  subsections: []
