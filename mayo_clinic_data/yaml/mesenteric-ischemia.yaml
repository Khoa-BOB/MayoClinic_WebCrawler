title: Mesenteric ischemia
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Mesenteric ischemia (mez-un-TER-ik is-KEE-me-uh) is a condition that happens
      when narrowed or blocked arteries restrict blood flow to the small intestine.
      Decreased blood flow can permanently damage the small intestine.
  - type: paragraph
    text: Sudden loss of blood flow to the small intestine is called acute mesenteric
      ischemia. The acute type is often caused by a blood clot and needs immediate
      treatment, such as surgery.
  - type: paragraph
    text: Mesenteric ischemia that develops over time is called chronic mesenteric
      ischemia. The chronic type is usually caused by a buildup of fatty deposits
      in the arteries. Chronic mesenteric ischemia is treated with open surgery or
      a procedure called angioplasty.
  - type: paragraph
    text: Chronic mesenteric ischemia can become acute if it's not treated. It also
      can lead to severe weight loss and malnutrition.
  subsections: []
- heading: Symptoms
  level: 2
  content: []
  subsections:
  - heading: Acute mesenteric ischemia
    level: 3
    content:
    - type: paragraph
      text: 'Symptoms of the acute form of mesenteric ischemia include:'
    - type: list
      ordered: false
      items:
      - Sudden, severe belly pain.
      - Urgent need to pass stool.
      - Fever.
      - Nausea and vomiting.
    subsections: []
  - heading: Chronic mesenteric ischemia
    level: 3
    content:
    - type: paragraph
      text: 'Symptoms of the chronic form of mesenteric ischemia include:'
    - type: list
      ordered: false
      items:
      - Belly pain that starts about 30 minutes after eating.
      - Pain that worsens over an hour.
      - Pain that goes away within 1 to 3 hours.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If you have severe, sudden belly pain that persists, seek emergency medical
        care. If you get pain after eating, make an appointment with someone on your
        primary healthcare team.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Both acute and chronic mesenteric ischemia are caused by a decrease in blood
      flow to the small intestine. Acute mesenteric ischemia is most commonly caused
      by a blood clot in the main mesenteric artery. The blood clot often starts in
      the heart. The chronic form is most commonly caused by a buildup of fatty deposits,
      called plaque, that narrows the arteries.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'The most common risk factors for acute mesenteric ischemia include:'
  - type: list
    ordered: false
    items:
    - Atrial fibrillation — an irregular and often very rapid heart rhythm.
    - Congestive heart failure — a condition in which the heart muscle doesn't pump
      blood as well as it should.
    - Recent vascular surgery.
  - type: paragraph
    text: 'The most common risk factors for chronic mesenteric ischemia include:'
  - type: list
    ordered: false
    items:
    - Type 2 diabetes.
    - High cholesterol levels.
    - High blood pressure.
    - Artery disease.
    - Smoking.
    - Obesity.
    - Older age.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'If not treated promptly, acute mesenteric ischemia can lead to:'
  - type: list
    ordered: false
    items:
    - Irreversible bowel damage. Not getting enough blood flow to the bowel can cause
      parts of the bowel to die.
    - Sepsis. This potentially life-threatening condition is caused by the body releasing
      chemicals into the bloodstream to fight infection. In sepsis, the body overreacts
      to the chemicals, triggering changes that can lead to multiple organ failure.
    - Death. Both of the above complications may lead to death.
  - type: paragraph
    text: 'People with chronic mesenteric ischemia can develop:'
  - type: list
    ordered: false
    items:
    - Fear of eating. This happens because of the after-meal pain associated with
      the condition.
    - Weight loss that isn't intended. This can occur as a result of the fear of eating.
    - Acute-on-chronic mesenteric ischemia. Symptoms of chronic mesenteric ischemia
      can get worse, leading to the acute form of the condition.
  subsections: []
