title: Aortic aneurysm
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: An aortic aneurysm is a bulge that occurs in the wall of the body's main
      artery, called the aorta. The aorta carries blood from the heart to the body.
      Aortic aneurysms can occur anywhere in the aorta. They may be tube shaped or
      round.
  - type: paragraph
    text: 'Aortic aneurysms include:'
  - type: list
    ordered: false
    items:
    - Abdominal aortic aneurysm . This type occurs along the part of the aorta that
      passes through the belly area.
    - Thoracic aortic aneurysm . This type occurs along the part of the aorta that
      passes through the chest cavity.
  - type: paragraph
    text: Some people may have both types of aortic aneurysms.
  - type: paragraph
    text: An aortic aneurysm increases the risk of a tear in the inner layer of the
      wall of the aorta. This tear is called an aortic dissection .
  subsections: []
