title: Dyshidrosis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Dyshidrosis is a skin condition that causes small, fluid-filled blisters
      to form on the palms of the hands and sides of the fingers. Sometimes the bottoms
      of the feet are affected too.
  - type: paragraph
    text: The itchy blisters last a few weeks and often come back.
  - type: paragraph
    text: Treatment for dyshidrosis most often includes prescription steroid skin
      creams or ointments. Your doctor or other health care provider may suggest a
      different treatment, such as light therapy or medicine taken by mouth or injection.
      The right treatment depends on how severe your symptoms are.
  - type: paragraph
    text: Dyshidrosis is also called dyshidrotic eczema and pompholyx.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Dyshidrosis symptoms include painful, itchy and fluid-filled blisters on
      the sides of the fingers, the palms of the hands and the bottoms of the feet.
      The blisters are small — about the width of a standard pencil lead. They are
      grouped in clusters and can look like tapioca.
  - type: paragraph
    text: With severe disease, the small blisters can merge to form larger blisters.
      Skin affected by dyshidrosis can be painful and very itchy. After a few weeks,
      the blisters dry and flake off.
  - type: paragraph
    text: Dyshidrosis tends to come back regularly for months or years.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Call your doctor if you have a rash on your hands or feet that's severe,
        doesn't go away, or spreads beyond the hands and feet.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The cause of dyshidrosis isn't known. It tends to happen in people who have
      a skin condition called atopic dermatitis (eczema) and allergic conditions,
      such as hay fever or glove allergy. Dyshidrosis isn't contagious.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk factors for dyshidrosis include:'
  - type: list
    ordered: false
    items:
    - Stress. Dyshidrosis appears to be more common during times of emotional or physical
      stress.
    - Exposure to certain metals. These include cobalt and nickel — often in an industrial
      setting.
    - Sensitive skin. People who develop a rash after contact with certain irritants
      are more likely to form the blisters of dyshidrosis.
    - Atopic dermatitis. Some people with atopic dermatitis may have dyshidrosis.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: For most people with dyshidrosis, it's just an itchy inconvenience. For
      others, the pain and itching may limit the use of their hands or feet. Intense
      scratching can increase the risk of a bacterial infection of the affected skin.
  - type: paragraph
    text: After healing, you may notice skin color changes in the affected area. This
      is called postinflammatory hyperpigmentation. It's more likely to occur in people
      with brown or Black skin. This complication most often goes away in time without
      treatment.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: There's no way to prevent dyshidrosis. It may help to manage stress and
      avoid exposure to metal salts, such as cobalt and nickel.
  - type: paragraph
    text: 'Good skin care practices may help protect the skin as well. These include:'
  - type: list
    ordered: false
    items:
    - Using mild, nonsoap cleansers and lukewarm water to wash your hands.
    - Drying your hands well.
    - Applying moisturizer at least twice a day.
    - Wearing gloves. But if you notice that wearing gloves worsens the rash, you
      may be sensitive to gloves. Let your doctor know about this. Try cotton gloves
      to prevent irritation. For wet activities, you might try wearing cotton gloves
      under waterproof gloves.
  subsections: []
