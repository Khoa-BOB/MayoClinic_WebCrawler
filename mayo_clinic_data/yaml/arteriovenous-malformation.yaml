title: Arteriovenous malformation
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: An arteriovenous malformation, also known as an AVM, is a tangle of blood
      vessels that creates irregular connections between arteries and veins. This
      disrupts blood flow and prevents tissues from receiving oxygen. An AVM can occur
      anywhere in the body, including in the brain.
  - type: paragraph
    text: Arteries move oxygen-rich blood from the heart to the brain and other organs.
      Veins drain the oxygen-depleted blood back to the lungs and heart. When an AVM
      disrupts this critical process, surrounding tissues might not get enough oxygen.
  - type: paragraph
    text: Because the tangled blood vessels in an AVM do not form properly, they can
      weaken and burst. If an AVM in the brain bursts, it can cause bleeding in the
      brain, which can lead to a stroke or brain damage. Bleeding in the brain is
      known as a hemorrhage.
  - type: paragraph
    text: Read more about brain AVM (arteriovenous malformation) .
  - type: paragraph
    text: The cause of AVMs is not clear. Rarely, they are passed down in families.
  - type: paragraph
    text: Once diagnosed, a brain AVM often can be treated to prevent or reduce the
      risk of complications.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Symptoms of an arteriovenous malformation, also known as an AVM, can vary.
      Sometimes an AVM doesn't cause symptoms. The AVM can be found while getting
      images for another health concern.
  - type: paragraph
    text: 'Often the first symptoms appear after bleeding occurs. Besides bleeding,
      symptoms can include:'
  - type: list
    ordered: false
    items:
    - Trouble with thinking that gets worse over time.
    - Headaches.
    - Nausea and vomiting.
    - Seizures.
    - Loss of consciousness.
  - type: paragraph
    text: 'Other possible symptoms include:'
  - type: list
    ordered: false
    items:
    - Weak muscles, such as weakness in the legs.
    - Loss of movement and feeling in one part of the body, known as paralysis.
    - Loss of coordination that can cause trouble with walking.
    - Trouble doing tasks that require planning.
    - Back pain.
    - Dizziness.
    - Vision problems. This may include losing part of the field of vision, trouble
      moving the eyes or swelling of part of the optic nerve.
    - Trouble with speech or understanding language.
    - Numbness, tingling or sudden pain.
    - Memory loss or dementia.
    - Seeing or hearing things that aren't there, known as hallucinations.
    - Confusion.
  - type: paragraph
    text: Children and teens might have trouble with learning or behavior.
  - type: paragraph
    text: 'One type of AVM called a vein of Galen malformation causes symptoms that
      appear at or shortly after birth. A vein of Galen malformation occurs deep inside
      the brain. Signs can include:'
  - type: list
    ordered: false
    items:
    - A buildup of fluid in the brain that causes the head to be larger than usual.
    - Swollen veins on the scalp.
    - Seizures.
    - Failure to thrive.
    - Congestive heart failure.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Seek medical attention if you have any of the symptoms of an AVM , such
        as headaches, dizziness, vision problems, seizures and changes in thinking.
        Many AVMs are found during testing for a different condition, such as during
        a CT scan or an MRI .
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: An arteriovenous malformation happens when arteries and veins connect in
      an irregular way. Experts don't understand why this happens. Certain genetic
      changes might play a role, but most types are not usually passed down in families.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Rarely, having a family history of an arteriovenous malformation can increase
      your risk. But most types aren't inherited.
  - type: paragraph
    text: Certain hereditary conditions can increase your risk of an arteriovenous
      malformation. These include hereditary hemorrhagic telangiectasia, also known
      as Osler-Weber-Rendu syndrome.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: The most common complications of an arteriovenous malformation are bleeding
      and seizures. Bleeding can cause brain damage and may cause death if you don't
      get treated.
  subsections: []
