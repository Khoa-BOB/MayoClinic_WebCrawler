title: Acoustic neuroma
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: An acoustic neuroma is a noncancerous tumor that develops on the main nerve
      leading from the inner ear to the brain. This nerve is called the vestibular
      nerve. Branches of the nerve directly affect balance and hearing. Pressure from
      an acoustic neuroma can cause hearing loss, ringing in the ear and trouble with
      balance. Another name for an acoustic neuroma is vestibular schwannoma.
  - type: paragraph
    text: An acoustic neuroma develops from the Schwann cells covering the vestibular
      nerve. A Schwann cell helps protect and support other nerve cells in the body.
      An acoustic neuroma is usually slow growing. Rarely, it may become large enough
      to press against the brain and affect vital functions.
  - type: paragraph
    text: Treatments for an acoustic neuroma include monitoring, radiation and surgical
      removal.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Symptoms of an acoustic neuroma often are easy to miss and may take years
      to develop. Symptoms may occur because of the tumor's effects on the hearing
      and balance nerves. The tumor also can put pressure on the facial nerve that
      directs facial muscles and the trigeminal nerve that affects feeling in the
      face. Blood vessels or other brain structures also can be affected by an acoustic
      neuroma.
  - type: paragraph
    text: As the tumor grows, it may be more likely to cause more noticeable or worse
      symptoms.
  - type: paragraph
    text: 'Common signs and symptoms of an acoustic neuroma include:'
  - type: list
    ordered: false
    items:
    - Hearing loss, usually gradually over months to years. In rare cases, hearing
      loss can be sudden. Hearing loss usually occurs on one side or is worse on one
      side.
    - Ringing in the affected ear, known as tinnitus.
    - Loss of balance or not feeling steady.
    - Dizziness.
    - Facial numbness and, very rarely, weakness or loss of muscle movement.
  - type: paragraph
    text: Rarely, an acoustic neuroma may grow large enough to compress the brainstem
      and become life-threatening.
  subsections:
  - heading: When to see your doctor
    level: 3
    content:
    - type: paragraph
      text: See a healthcare professional if you notice hearing loss in one ear, ringing
        in your ear or trouble with balance.
    - type: paragraph
      text: Early diagnosis of an acoustic neuroma may help keep the tumor from growing
        large enough to cause complications such as total hearing loss.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The cause of acoustic neuromas can sometimes be linked to a change to a
      gene on chromosome 22. Typically, this gene produces a tumor suppressor protein
      that helps regulate the growth of Schwann cells covering the nerves. Experts
      don't know what causes this change to the gene. Often there is no known cause.
      In some people, the gene change is related to a rare condition called NF2-related
      schwannomatosis, also known as NF2. The condition was previously known as neurofibromatosis
      type 2. People with NF2 usually have growth of tumors on the hearing and balance
      nerves on both sides of the head. These tumors are known as bilateral vestibular
      schwannomas.
  subsections: []
- heading: Risk factors
  level: 2
  content: []
  subsections:
  - heading: NF2-related schwannomatosis
    level: 3
    content:
    - type: paragraph
      text: The only confirmed risk factor for acoustic neuromas is having a parent
        with the rare genetic condition NF2-related schwannomatosis, also known as
        NF2. However, only a small number of people with acoustic neuromas have NF2.
    - type: paragraph
      text: A hallmark characteristic of NF2 is noncancerous tumors on the balance
        nerves on both sides of the head. Tumors also may develop on other nerves.
    - type: paragraph
      text: NF2 is known as an autosomal dominant condition. This means that the gene
        related to the condition can be passed to a child by just one parent. Each
        child of an affected parent has a 50-50 chance of inheriting it.
    subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'An acoustic neuroma may cause permanent complications, including:'
  - type: list
    ordered: false
    items:
    - Hearing loss.
    - Facial numbness and weakness.
    - Trouble with balance.
    - Ringing in the ear.
  - type: paragraph
    text: Large tumors may press on the brainstem, occasionally preventing the flow
      of cerebrospinal fluid between the brain and spinal cord. Fluid can build up
      in your head, a condition known as hydrocephalus. This increases the pressure
      inside the skull.
  subsections: []
