title: Schwannomatosis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Schwannomatosis is a condition that results in slow-growing tumors on nerve
      tissue. The tumors can grow on nerves in the ears, brain, spine and eyes. They
      also can grow on peripheral nerves, which are nerves located outside of the
      brain and spinal cord. Schwannomatosis is rare. It's usually diagnosed in early
      adulthood.
  - type: paragraph
    text: There are three types of schwannomatosis. Each type is caused by an altered
      gene.
  - type: paragraph
    text: In NF2-related schwannomatosis (NF2), tumors grow in both ears and can cause
      hearing loss. The altered gene that causes this type is sometimes passed down
      from a parent. NF2-related schwannomatosis was previously known as neurofibromatosis
      2 (NF2).
  - type: paragraph
    text: The other two types of schwannomatosis are SMARCB1-related schwannomatosis
      and LZTR1-related schwannomatosis. The altered genes that cause these types
      usually are not passed down through families.
  - type: paragraph
    text: The tumors caused by schwannomatosis usually are not cancerous. Symptoms
      can include headaches, hearing loss, trouble with balance and pain. Treatment
      focuses on managing symptoms.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Schwannomatosis symptoms depend on the type.
  subsections:
  - heading: NF2-related schwannomatosis
    level: 3
    content:
    - type: paragraph
      text: Symptoms of NF2-related schwannomatosis (NF2) usually result from slow-growing
        tumors in both ears, known as acoustic neuromas or vestibular schwannomas.
        The tumors are benign, which means that they are not cancerous.
    - type: paragraph
      text: The tumors grow on the nerve that carries sound and balance information
        from the inner ear to the brain. These tumors can cause hearing loss.
    - type: paragraph
      text: 'Symptoms tend to appear during the late teen and early adult years, and
        can vary. Symptoms may include:'
    - type: list
      ordered: false
      items:
      - Gradual hearing loss.
      - Ringing in the ears.
      - Poor balance.
      - Headaches.
    - type: paragraph
      text: Sometimes NF2 can lead to the growth of tumors on other nerves, including
        in the brain, spine and eyes. They also can grow on peripheral nerves, which
        are located outside of the brain and spinal cord. People who have NF2 also
        may develop other benign tumors.
    - type: paragraph
      text: 'Symptoms of these tumors can include:'
    - type: list
      ordered: false
      items:
      - Numbness and weakness in the arms or legs.
      - Pain.
      - Poor balance.
      - Facial drop.
      - Changes in vision or cataracts.
      - Seizures.
      - Headaches.
    subsections: []
  - heading: SMARCB1- and LZTR1-related schwannomatosis
    level: 3
    content:
    - type: paragraph
      text: These two types of schwannomatosis typically affect people after age 20.
        Symptoms usually appear between ages 25 and 30.
    - type: paragraph
      text: SMARCB1- and LZTR1-related schwannomatosis can cause tumors to grow on
        nerves in the brain, spine and eyes. Tumors also may grow on peripheral nerves
        located outside of the brain and spinal cord.
    - type: paragraph
      text: 'Symptoms of SMARCB1- and LZTR1-related schwannomatosis include:'
    - type: list
      ordered: false
      items:
      - Long-lasting pain, which can occur anywhere in the body and can be disabling.
      - Numbness or weakness in various parts of the body.
      - Loss of muscle, known as atrophy.
    - type: paragraph
      text: These types of schwannomatosis also can cause tumors to grow in the ear.
        But it happens rarely, and tumors usually grow in only one ear. This differs
        from NF2, which causes tumors to grow in both ears. For this reason, people
        with SMARCB1- and LZTR1-related schwannomatosis don't have the same hearing
        loss as people who have NF2.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See a healthcare professional if you have symptoms of schwannomatosis.
        Although there is no cure, complications can be treated.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Schwannomatosis is caused by an altered gene. The specific genes involved
      depend on the type:'
  - type: list
    ordered: false
    items:
    - NF2-related schwannomatosis (NF2). The NF2 gene produces a protein called merlin,
      also called schwannomin, that suppresses tumors. An altered gene causes a loss
      of merlin, leading to cell growth that's not controlled.
    - SMARCB1- and LZTR1-related schwannomatosis. So far, two genes are known to cause
      these types of schwannomatosis. Changes of the genes SMARCB1 and LZTR1, which
      suppress tumors, are linked with these conditions.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: The gene that causes schwannomatosis is sometimes passed down from a parent.
      The risk of inheriting the gene differs based on the type of schwannomatosis.
  - type: paragraph
    text: For about half of people who have NF2-related schwannomatosis (NF2), they
      received an altered gene from a parent that caused the disease. NF2 has an autosomal
      dominant inheritance pattern. This means that any child of a parent who is affected
      by the disease has a 50% chance of having the gene change. People who have NF2
      and whose relatives aren't affected are likely to have a new gene change.
  - type: paragraph
    text: In SMARCB1- and LZTR1-related schwannomatosis, the disease is less likely
      to be passed down from a parent. Researchers estimate that the risk of inheriting
      SMARCB1- and LZTR1-related schwannomatosis from an affected parent is about
      15%.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Complications can occur in schwannomatosis, and they depend on the type
      the person has.
  subsections:
  - heading: NF2-related schwannomatosis complications
    level: 3
    content:
    - type: paragraph
      text: 'NF2-related schwannomatosis (NF2) complications can include:'
    - type: list
      ordered: false
      items:
      - Partial or total hearing loss.
      - Facial nerve damage.
      - Vision changes.
      - Small benign skin tumors, known as skin schwannomas.
      - Weakness or numbness in the legs or arms.
      - Having many benign brain tumors or spinal tumors, known as meningiomas. These
        require frequent surgeries.
    subsections: []
  - heading: SMARCB1- and LZTR1-related schwannomatosis complications
    level: 3
    content:
    - type: paragraph
      text: The pain caused by this type of schwannomatosis can be weakening. People
        with this type may need surgery or management by a pain specialist.
    subsections: []
