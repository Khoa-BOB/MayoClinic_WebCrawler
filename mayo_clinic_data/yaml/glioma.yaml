title: Glioma
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Glioma is a growth of cells that starts in the brain or spinal cord. The
      cells in a glioma look similar to healthy brain cells called glial cells. Glial
      cells surround nerve cells and help them function.
  - type: paragraph
    text: As a glioma grows it forms a mass of cells called a tumor. The tumor can
      grow to press on brain or spinal cord tissue and cause symptoms. Symptoms depend
      on which part of the brain or spinal cord is affected.
  - type: paragraph
    text: There are many types of glioma. Some grow slowly and aren't considered to
      be cancers. Others are considered cancerous. Another word for cancerous is malignant.
      Malignant gliomas grow quickly and can invade healthy brain tissue. Some types
      of glioma happen mostly in adults. Others happen mostly in kids.
  - type: paragraph
    text: The type of glioma you have helps your health care team understand how serious
      your condition is and what treatments might work best. In general, glioma treatment
      options include surgery, radiation therapy, chemotherapy and others.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Glioma symptoms depend on the location of the glioma. Symptoms also may
      depend on the type of glioma, its size and how quickly it's growing.
  - type: paragraph
    text: 'Common signs and symptoms of gliomas include:'
  - type: list
    ordered: false
    items:
    - Headache, particularly one that hurts the most in the morning.
    - Nausea and vomiting.
    - Confusion or a decline in brain function, such as problems with thinking and
      understanding information.
    - Memory loss.
    - Personality changes or irritability.
    - Vision problems, such as blurred vision, double vision or loss of peripheral
      vision.
    - Speech difficulties.
    - Seizures, especially in someone who hasn't had seizures before.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with your health care provider if you have any signs
        and symptoms that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Doctors aren't sure what causes glioma. It starts when cells in the brain
      or spinal cord develop changes in their DNA. A cell's DNA contains the instructions
      that tell a cell what to do.
  - type: paragraph
    text: The DNA changes tell the cells to make more cells quickly. The cells continue
      living when healthy cells would die. This causes too many cells that don't work
      right. The cells form a mass called a tumor.
  - type: paragraph
    text: The tumor can grow to press on nearby nerves and parts of the brain or spinal
      cord. This leads to glioma symptoms and can cause complications.
  - type: paragraph
    text: Some gliomas develop more changes in their DNA that cause them to become
      brain cancers. The changes tell the cells to invade and destroy healthy brain
      tissue.
  - type: paragraph
    text: In glioma, the tumor cells look similar to healthy brain cells called glial
      cells. The glial cells surround and support nerve cells in the brain and spinal
      cord.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Things that can increase the risk of glioma include:'
  - type: list
    ordered: false
    items:
    - Getting older. Gliomas are most common in adults between ages 45 and 65 years
      old. But glioma can happen at any age. Certain types of gliomas are more common
      in children and young adults.
    - Being exposed to radiation. People who have been exposed to a type of radiation
      called ionizing radiation have an increased risk of glioma. One example of ionizing
      radiation is radiation therapy used to treat cancer.
    - Having a family history of glioma. Glioma can run in families, but this is very
      rare. More research is needed to understand whether parents can pass a risk
      of glioma to their children.
  - type: paragraph
    text: Researchers haven't found anything you can do to prevent glioma.
  subsections: []
