title: Sjogren's syndrome
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Sjogren's (SHOW-grins) syndrome is a disorder of your immune system identified
      by its two most common symptoms — dry eyes and a dry mouth.
  - type: paragraph
    text: The condition often accompanies other immune system disorders, such as rheumatoid
      arthritis and lupus. In Sjogren's syndrome, the mucous membranes and moisture-secreting
      glands of your eyes and mouth are usually affected first — resulting in decreased
      tears and saliva.
  - type: paragraph
    text: Although you can develop Sjogren's syndrome at any age, most people are
      older than 40 at the time of diagnosis. The condition is much more common in
      women. Treatment focuses on relieving symptoms.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'The two main symptoms of Sjogren''s syndrome are:'
  - type: list
    ordered: false
    items:
    - Dry eyes. Your eyes might burn, itch or feel gritty — as if there's sand in
      them.
    - Dry mouth. Your mouth might feel like it's full of cotton, making it difficult
      to swallow or speak.
  - type: paragraph
    text: 'Some people with Sjogren''s syndrome also have one or more of the following:'
  - type: list
    ordered: false
    items:
    - Joint pain, swelling and stiffness
    - Swollen salivary glands — particularly the set located behind your jaw and in
      front of your ears
    - Skin rashes or dry skin
    - Vaginal dryness
    - Persistent dry cough
    - Prolonged fatigue
  subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Sjogren's syndrome is an autoimmune disorder. Your immune system mistakenly
      attacks your body's own cells and tissues.
  - type: paragraph
    text: Scientists aren't certain why some people develop Sjogren's syndrome. Certain
      genes put people at higher risk of the disorder, but it appears that a triggering
      mechanism — such as infection with a particular virus or strain of bacteria
      — is also necessary.
  - type: paragraph
    text: 'In Sjogren''s syndrome, your immune system first targets the glands that
      make tears and saliva. But it can also damage other parts of your body, such
      as:'
  - type: list
    ordered: false
    items:
    - Joints
    - Thyroid
    - Kidneys
    - Liver
    - Lungs
    - Skin
    - Nerves
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Sjogren''s syndrome typically occurs in people with one or more known risk
      factors, including:'
  - type: list
    ordered: false
    items:
    - Age. Sjogren's syndrome is usually diagnosed in people older than 40.
    - Sex. Women are much more likely to have Sjogren's syndrome.
    - Rheumatic disease. It's common for people who have Sjogren's syndrome to also
      have a rheumatic disease — such as rheumatoid arthritis or lupus.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: The most common complications of Sjogren's syndrome involve your eyes and
      mouth.
  - type: list
    ordered: false
    items:
    - Dental cavities. Because saliva helps protect the teeth from the bacteria that
      cause cavities, you're more prone to developing cavities if your mouth is dry.
    - Yeast infections. People with Sjogren's syndrome are much more likely to develop
      oral thrush, a yeast infection in the mouth.
    - Vision problems. Dry eyes can lead to light sensitivity, blurred vision and
      corneal damage.
  - type: paragraph
    text: 'Less common complications might affect:'
  - type: list
    ordered: false
    items:
    - Lungs, kidneys or liver. Inflammation can cause pneumonia, bronchitis or other
      problems in your lungs; lead to problems with kidney function; and cause hepatitis
      or cirrhosis in your liver.
    - Lymph nodes. A small percentage of people with Sjogren's syndrome develop cancer
      of the lymph nodes (lymphoma).
    - Nerves. You might develop numbness, tingling and burning in your hands and feet
      (peripheral neuropathy).
  subsections: []
