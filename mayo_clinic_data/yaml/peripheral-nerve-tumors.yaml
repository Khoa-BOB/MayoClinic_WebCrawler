title: Peripheral nerve tumors
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Peripheral nerve tumors are growths that form in or near nerves. Nerves
      are strands of tissue that transmit signals from the brain to the rest of the
      body. Peripheral nerves control muscles that allow you to walk, blink, swallow,
      pick things up and do other activities.
  - type: paragraph
    text: Peripheral nerve tumors can occur anywhere in the body. Most of them are
      benign, meaning they're not cancerous. But they can lead to pain, nerve damage
      and loss of function in the affected area.
  - type: paragraph
    text: Treatment usually involves surgery to remove the tumor. When the tumor can't
      be removed without damaging nearby healthy tissue and nerves, other treatments
      may be considered.
  - type: paragraph
    text: There are several types of peripheral nerve tumors. Intraneural tumors grow
      within nerves. Extraneural tumors press against nerves.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: The symptoms of a peripheral nerve tumor develop from direct effects on
      the main nerve or from the tumor pressing on nearby nerves, blood vessels or
      tissues. As the tumor grows, it may be more likely to cause symptoms, although
      tumor size doesn't always determine effects.
  - type: paragraph
    text: 'Symptoms of peripheral nerve tumors vary depending on where the tumors
      are located and the tissues affected. They include:'
  - type: list
    ordered: false
    items:
    - Swelling or a lump under the skin.
    - Pain, tingling or numbness.
    - Weakness or a loss of function in the affected area.
    - Dizziness or a loss of balance.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See your health care provider if you have any of the symptoms listed,
        especially if you have a lump that grows quickly.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: It's not clear why most peripheral nerve tumors develop. Some are linked
      to known inherited syndromes, such as neurofibromatosis (types 1 and 2) and
      schwannomatosis. Others may be caused by changes in a gene.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Peripheral nerve tumors are more common in people who have:'
  - type: list
    ordered: false
    items:
    - Neurofibromatosis (types 1 and 2) and schwannomatosis. In these disorders, tumors
      develop on or near the nerves throughout the body. There are often multiple
      tumors. They can lead to a variety of symptoms depending on where they are in
      the body. These tumors are usually not cancerous.
    - A history of radiation treatment. A person who was exposed to radiation is at
      higher risk of developing peripheral nerve tumors years later.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Peripheral nerve tumors can press against nerves. This can lead to complications.
      Some may be permanent:'
  - type: list
    ordered: false
    items:
    - Numbness and weakness in the affected area.
    - Loss of function in the affected area.
    - Trouble with balance.
    - Pain.
  subsections: []
