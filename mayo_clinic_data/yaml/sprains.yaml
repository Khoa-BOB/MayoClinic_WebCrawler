title: Sprains
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: A sprain is a stretching or tearing of ligaments — the tough bands of fibrous
      tissue that connect two bones together in your joints. The most common location
      for a sprain is in your ankle.
  - type: paragraph
    text: Initial treatment includes rest, ice, compression and elevation. Mild sprains
      can be successfully treated at home. Severe sprains sometimes require surgery
      to repair torn ligaments.
  - type: paragraph
    text: The difference between a sprain and a strain is that a sprain injures the
      bands of tissue that connect two bones together, while a strain involves an
      injury to a muscle or to the band of tissue that attaches a muscle to a bone.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Signs and symptoms will vary, depending on the severity of the injury,
      and may include:'
  - type: list
    ordered: false
    items:
    - Pain
    - Swelling
    - Bruising
    - Limited ability to move the affected joint
    - Hearing or feeling a "pop" in your joint at the time of injury
  subsections:
  - heading: When to see the doctor
    level: 3
    content:
    - type: paragraph
      text: 'Mild sprains can be treated at home. But the injuries that cause sprains
        can also cause serious injuries, such as fractures. You should see a doctor
        if you:'
    - type: list
      ordered: false
      items:
      - Can't move or bear weight on the affected joint
      - Have pain directly over the bones of an injured joint
      - Have numbness in any part of the injured area
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'A sprain occurs when you overextend or tear a ligament while severely stressing
      a joint. Sprains often occur in the following circumstances:'
  - type: list
    ordered: false
    items:
    - Ankle — Walking or exercising on an uneven surface, landing awkwardly from a
      jump
    - Knee — Pivoting during an athletic activity
    - Wrist — Landing on an outstretched hand during a fall
    - Thumb — Skiing injury or overextension when playing racquet sports, such as
      tennis
  - type: paragraph
    text: Children have areas of softer tissue, called growth plates, near the ends
      of their bones. The ligaments around a joint are often stronger than these growth
      plates, so children are more likely to experience a fracture than a sprain.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors contributing to sprains include:'
  - type: list
    ordered: false
    items:
    - Environmental conditions. Slippery or uneven surfaces can make you more prone
      to injury.
    - Fatigue. Tired muscles are less likely to provide good support for your joints.
      When you're tired, you're also more likely to succumb to forces that could stress
      a joint.
    - Poor equipment. Ill-fitting or poorly maintained footwear or other sporting
      equipment can contribute to your risk of a sprain.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: Regular stretching and strengthening exercises for your sport, fitness or
      work activity, as part of an overall physical conditioning program, can help
      to minimize your risk of sprains. Try to be in shape to play your sport; don't
      play your sport to get in shape. If you have a physically demanding occupation,
      regular conditioning can help prevent injuries.
  - type: paragraph
    text: You can protect your joints in the long term by working to strengthen and
      condition the muscles around the joint that has been injured. The best brace
      you can give yourself is your own "muscle brace." Ask your doctor about appropriate
      conditioning and stability exercises. Also, use footwear that offers support
      and protection.
  subsections: []
