title: Iritis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Iritis (i-RYE-tis) is swelling and irritation (inflammation) in the colored
      ring around your eye's pupil (iris). Another name for iritis is anterior uveitis.
  - type: paragraph
    text: The uvea is the middle layer of the eye between the retina and the white
      part of the eye. The iris is located in the front portion (anterior) of the
      uvea.
  - type: paragraph
    text: Iritis is the most common type of uveitis. Uveitis is inflammation of part
      of or all of the uvea. The cause is often unknown. It can result from an underlying
      condition or genetic factor.
  - type: paragraph
    text: If untreated, iritis could lead to glaucoma or vision loss. See your doctor
      as soon as possible if you have symptoms of iritis.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Iritis can occur in one or both eyes. It usually develops suddenly, and
      can last up to three months.
  - type: paragraph
    text: 'Signs and symptoms of iritis include:'
  - type: list
    ordered: false
    items:
    - Eye redness
    - Discomfort or achiness in the affected eye
    - Sensitivity to light
    - Decreased vision
  - type: paragraph
    text: Iritis that develops suddenly, over hours or days, is known as acute iritis.
      Symptoms that develop gradually or last longer than three months indicate chronic
      iritis.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See an eye specialist (ophthalmologist) as soon as possible if you have
        symptoms of iritis. Prompt treatment helps prevent serious complications.
        If you have eye pain and vision problems with other signs and symptoms, you
        might need urgent medical care.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Often, the cause of iritis can''t be determined. In some cases, iritis
      can be linked to eye trauma, genetic factors or certain diseases. Causes of
      iritis include:'
  - type: list
    ordered: false
    items:
    - Injury to the eye. Blunt force trauma, a penetrating injury, or a burn from
      a chemical or fire can cause acute iritis.
    - Infections. Viral infections on your face, such as cold sores and shingles caused
      by herpes viruses, can cause iritis. Infectious diseases from other viruses
      and bacteria can also be linked to uveitis. For instance, they may include toxoplasmosis,
      an infection most often caused by a parasite in uncooked food; histoplasmosis,
      a lung infection that occurs when you inhale spores of fungus; tuberculosis,
      which happens when bacteria enters the lungs; and syphilis, which is caused
      by the spread of bacteria through sexual contact.
    - Genetic predisposition. People who develop certain autoimmune diseases because
      of a gene alteration that affects their immune systems might also develop acute
      iritis. Diseases include a type of arthritis called ankylosing spondylitis,
      reactive arthritis, inflammatory bowel disease and psoriatic arthritis.
    - Behcet's disease. An uncommon cause of acute iritis in Western countries, this
      condition is also characterized by joint problems, mouth sores and genital sores.
    - Juvenile rheumatoid arthritis. Chronic iritis can develop in children with this
      condition.
    - Sarcoidosis. This autoimmune disease involves the growth of collections of inflammatory
      cells in areas of your body, including your eyes.
    - Certain medications. Some drugs, such as the antibiotic rifabutin (Mycobutin)
      and the antiviral medication cidofovir, that are used to treat HIV infections
      can be a rare cause of iritis. Rarely, bisphosphonates, used to treat osteoporosis,
      can cause uveitis. Stopping these medications usually stops the iritis symptoms.
  - type: paragraph
    text: Infections. Viral infections on your face, such as cold sores and shingles
      caused by herpes viruses, can cause iritis.
  - type: paragraph
    text: Infectious diseases from other viruses and bacteria can also be linked to
      uveitis. For instance, they may include toxoplasmosis, an infection most often
      caused by a parasite in uncooked food; histoplasmosis, a lung infection that
      occurs when you inhale spores of fungus; tuberculosis, which happens when bacteria
      enters the lungs; and syphilis, which is caused by the spread of bacteria through
      sexual contact.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Your risk of developing iritis increases if you:'
  - type: list
    ordered: false
    items:
    - Have a specific genetic alteration. People with a specific change in a gene
      that's essential for healthy immune system function are more likely to develop
      iritis. This change is labeled HLA-B27.
    - Develop a sexually transmitted infection. Certain infections, such as syphilis
      or HIV/AIDS, are linked with a significant risk of iritis.
    - Have a weakened immune system or an autoimmune disorder. This includes conditions
      such as ankylosing spondylitis and reactive arthritis.
    - Smoke tobacco. Studies have shown that smoking contributes to your risk.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'If not treated properly, iritis could lead to:'
  - type: list
    ordered: false
    items:
    - Cataracts. Development of a clouding of the lens of your eye (cataract) is a
      possible complication, especially if you've had a long period of inflammation.
    - An irregular pupil. Scar tissue can cause the iris to stick to the underlying
      lens or the cornea, making the pupil irregular in shape and the iris sluggish
      in its reaction to light.
    - Glaucoma. Recurrent iritis can result in glaucoma, a serious eye condition characterized
      by increased pressure inside the eye and possible vision loss.
    - Calcium deposits on the cornea. This causes degeneration of your cornea and
      could decrease your vision.
    - Swelling within the retina. Swelling and fluid-filled cysts that develop in
      the retina at the back of the eye can blur or decrease your central vision.
  subsections: []
