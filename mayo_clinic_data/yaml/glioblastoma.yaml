title: Glioblastoma
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Glioblastoma is a type of cancer that starts as a growth of cells in the
      brain or spinal cord. It grows quickly and can invade and destroy healthy tissue.
      Glioblastoma forms from cells called astrocytes that support nerve cells.
  - type: paragraph
    text: Glioblastoma can happen at any age. But it tends to happen more often in
      older adults. Glioblastoma symptoms may include headaches that keep getting
      worse, nausea and vomiting, blurred or double vision, trouble speaking, altered
      sense of touch, and seizures. There also may be trouble with balance, coordination,
      and moving parts of the face or body.
  - type: paragraph
    text: There's no cure for glioblastoma. Treatments might slow cancer growth and
      reduce symptoms.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Signs and symptoms of glioblastoma may include:'
  - type: list
    ordered: false
    items:
    - Headache, particularly one that hurts the most in the morning.
    - Nausea and vomiting.
    - Confusion or a decline in brain function, such as problems with thinking and
      understanding information.
    - Memory loss.
    - Personality changes or irritability.
    - Vision changes, such as blurred vision, double vision or loss of peripheral
      vision.
    - Speech difficulties.
    - Trouble with balance or coordination.
    - Muscle weakness in the face, arms or legs.
    - Reduced sensation of touch.
    - Seizures, especially in someone who hasn't had seizures before.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with a doctor or other healthcare professional if
        you have any signs or symptoms that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The cause of most glioblastomas isn't known.
  - type: paragraph
    text: Glioblastoma happens when cells in the brain or spinal cord develop changes
      in their DNA. Healthcare professionals sometimes call these changes mutations
      or variations. A cell's DNA holds the instructions that tell a cell what to
      do. In healthy cells, the DNA gives instructions to grow and multiply at a set
      rate. The instructions tell the cells to die at a set time. In cancer cells,
      the DNA changes give different instructions. The changes tell the cancer cells
      to make many more cells quickly. Cancer cells can keep living when healthy cells
      would die. This causes too many cells.
  - type: paragraph
    text: The cancer cells form a mass called a tumor. The tumor can grow to press
      on nearby nerves and parts of the brain or spinal cord. This leads to glioblastoma
      symptoms and can cause complications. The tumor can grow to invade and destroy
      healthy body tissue.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that can increase the risk of glioblastoma include:'
  - type: list
    ordered: false
    items:
    - Getting older. Glioblastomas are most common in older adults. But glioblastoma
      can happen at any age.
    - Being exposed to radiation. People who have been exposed to a type of radiation
      called ionizing radiation have an increased risk of glioblastoma. One example
      of ionizing radiation is radiation therapy used to treat cancer.
    - Inherited syndromes that increase cancer risk. In some families, DNA changes
      passed from parents to children may increase the risk of glioblastoma. Inherited
      syndromes may include Lynch syndrome and Li-Fraumeni syndrome. Genetic testing
      can detect these syndromes.
  - type: paragraph
    text: Researchers haven't found anything you can do to prevent glioblastoma.
  subsections: []
