title: Thumb arthritis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Thumb arthritis is common with aging. The condition happens when cartilage
      wears away from the ends of the bones that form the joint at the base of the
      thumb. Cartilage is the strong tissue that connects and protects joints and
      bone. This joint at the base of the thumb also is called the carpometacarpal
      joint and the CMC joint.
  - type: paragraph
    text: Thumb arthritis can cause pain and swelling. It can weaken the thumb and
      keep it from moving as it should. This can make it hard to do simple tasks,
      such as turning doorknobs and opening jars.
  - type: paragraph
    text: Treatment most often involves both medicine and splints. Sometimes thumb
      arthritis needs surgery.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Pain is the first and most common symptom of thumb arthritis. Pain can be
      at the base of the thumb when you grasp or pinch an object.
  - type: paragraph
    text: 'Other symptoms might include:'
  - type: list
    ordered: false
    items:
    - Swelling, stiffness and tenderness at the base of the thumb.
    - Less strength when pinching or grasping objects.
    - Less range of motion in the thumb.
    - The joint at the base of the thumb gets larger or bony.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See your healthcare professional if you have swelling, stiffness or pain
        at the base of your thumb that doesn't go away.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Thumb arthritis is common with aging. Having had an injury to the thumb
      joint also can cause thumb arthritis.
  - type: paragraph
    text: The strong tissue that connects and protects joints and bone is called cartilage.
      Cartilage acts as a cushion. It lets the bones move smoothly against each other.
  - type: paragraph
    text: With thumb arthritis, the cartilage that covers the ends of the bones wears
      away. Its smooth surface gets rough. The bones then rub against each other,
      which leads to joint damage.
  - type: paragraph
    text: The damage to the joint might result in the growth of new bone along the
      sides of the bone that's there. This is called bone spurs. They can cause lumps
      on the thumb joint.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that can raise the risk of thumb arthritis include:'
  - type: list
    ordered: false
    items:
    - Being assigned female at birth.
    - Being older than 40 years.
    - Having certain conditions that are passed through families. These might include
      lax joint ligaments or joints that aren't formed correctly.
    - Having injuries to the thumb joint, such as fractures and sprains.
    - Having conditions such as rheumatoid arthritis that change how cartilage forms
      and how it works.
    - Doing activities and jobs that put high stress on the thumb joints.
  subsections: []
