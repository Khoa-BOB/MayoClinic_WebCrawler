title: Hypereosinophilic syndrome
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Hypereosinophilic syndrome is organ damage or dysfunction caused by an excess
      of disease-fighting white blood cells called eosinophils.
  - type: paragraph
    text: Hypereosinophilic syndrome (hy-per-ee-o-SIN-o-phil-ik) is rare. It can affect
      any tissues in the body. Common targets include the skin, lungs, digestive tract,
      heart and nervous system.
  - type: paragraph
    text: If a condition is found to cause hypereosinophilic syndrome, then treating
      the underlying condition also may lower eosinophil levels. Other treatments
      include medicines that reduce the number of eosinophils in the bloodstream.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of hypereosinophilic syndrome (HES) vary depending on what organs
      are affected. Early symptoms of HES may include:'
  - type: list
    ordered: false
    items:
    - Fatigue.
    - Cough.
    - Shortness of breath.
    - Muscle pain.
    - Swelling in deep layers of the skin.
    - Rash.
    - Fever.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Many different conditions can cause the symptoms related to HES. See your
        healthcare professional as soon as possible if symptoms do not improve.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Eosinophils are important in fighting parasites and bacteria. They also
      regulate other immune system cells and proteins that cause allergic reactions.
  - type: paragraph
    text: HES occurs when high levels of these white blood cells last a long time.
      The cells themselves or their byproducts can move into organs, where they can
      cause damage or dysfunction.
  subsections:
  - heading: Terms to know
    level: 3
    content:
    - type: paragraph
      text: You may hear the following terms regarding HES.
    - type: list
      ordered: false
      items:
      - Eosinophilia is a higher than typical number of eosinophils circulating in
        the bloodstream.
      - Hypereosinophilia is a high number of eosinophils that lasts for an extended
        period, usually at least one month.
      - Hypereosinophilia syndrome is organ damage or destruction caused by long-term
        high eosinophils.
    subsections: []
  - heading: Types of hypereosinophilia
    level: 3
    content:
    - type: paragraph
      text: 'Persistent increases in these white blood cells may be caused by a number
        of factors. General categories of hypereosinophilia based on cause include
        the following:'
    - type: list
      ordered: false
      items:
      - Primary hypereosinophilia is caused by cancers of the bone marrow or blood
        that directly increase the production of eosinophils.
      - 'Secondary hypereosinophilia, also called reactive hypereosinophilia, is caused
        by conditions that typically activate white blood cells, such as:'
      - Familial hypereosinophilia is an inherited disorder.
      - Idiopathic hypereosinophilia has no cause that can be found. Most cases are
        idiopathic.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: HES can affect anyone, but it occurs more often in men.
  subsections: []
