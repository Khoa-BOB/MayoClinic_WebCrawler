title: Pilonidal cyst
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: A pilonidal (pie-low-NIE-dul) cyst is an unusual pocket in the skin that
      usually contains hair and skin debris. The cyst is almost always near the tailbone
      at the top of the buttocks.
  - type: paragraph
    text: Pilonidal cysts usually occur when hair punctures the skin and then becomes
      embedded. If a pilonidal cyst becomes infected, it can be very painful. The
      cyst can be drained through a small cut in the skin. Sometimes, surgery is needed.
  - type: paragraph
    text: Pilonidal cysts are most common in young adult males, and the problem tends
      to recur. People who sit for long periods of time are at higher risk of developing
      pilonidal cysts.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'A pilonidal cyst may not cause symptoms. But if it''s infected, the skin
      around the cyst may be swollen and painful. Symptoms of an infected pilonidal
      cyst include:'
  - type: list
    ordered: false
    items:
    - A pit near the top of the buttocks crease.
    - Pain.
    - Inflamed, swollen skin.
    - Pus or blood leaking from an opening in the skin.
    - An odor from draining pus.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If you notice any symptoms of a pilonidal cyst, see your health care provider.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The cause of most pilonidal cysts is loose hairs that puncture the skin.
      Friction and pressure from rubbed skin, tight clothing, cycling or long periods
      of sitting can force hair into the skin.
  - type: paragraph
    text: The body creates a cyst around the hair to try to push it out. Most pilonidal
      cysts form on the tailbone. People who groom animals or cut hair can develop
      a cyst between their fingers.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that might increase your risk of a pilonidal cyst include:'
  - type: list
    ordered: false
    items:
    - Being a young adult white male.
    - Being overweight.
    - Having an inactive lifestyle.
    - Sitting for long periods at a time.
    - Having thick, stiff body hair.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Some people have pilonidal cysts that become infected again and again over
      a long time. Without treatment, these people may be at increased risk of a type
      of skin cancer called squamous cell carcinoma.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'To help prevent pilonidal cysts, try to:'
  - type: list
    ordered: false
    items:
    - Wash regularly.
    - Achieve or maintain a healthy weight.
    - Avoid prolonged sitting.
  - type: paragraph
    text: If you've had pilonidal cysts in the past, you might want to regularly shave
      the affected area or use hair removal products to reduce the risk of a new cyst.
  subsections: []
