title: Urethral stricture
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: A urethral (u-REE-thrul) stricture involves scarring that narrows the tube
      that carries urine out of the body, called the urethra. As a result of a stricture,
      less urine comes out of the bladder. This can cause problems in the urinary
      tract, such as infection.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of urethral stricture can include:'
  - type: list
    ordered: false
    items:
    - Weak urine stream.
    - Bladder not emptying all the way.
    - Spraying urine.
    - Finding it hard or painful to pass urine.
    - Passing urine more often or feeling the need to pass urine more often.
    - Urinary tract infection.
  subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Scar tissue, which can narrow the urethra, can be due to:'
  - type: list
    ordered: false
    items:
    - A medical procedure that involves putting a tool, such as an endoscope, into
      the urethra.
    - A tube that's put into the urethra to drain the bladder, called a catheter.
    - Trauma or injury to the urethra or pelvis.
    - An enlarged prostate or having had surgery to remove or reduce an enlarged prostate
      gland.
    - Cancer of the urethra or prostate.
    - Sexually transmitted infections.
    - Radiation therapy.
    - A skin condition that causes patchy, discolored, thin skin that often affects
      the genital area, called lichen sclerosus.
  - type: paragraph
    text: Urethral stricture is much more common in males than in females. Often the
      cause is unknown.
  subsections: []
