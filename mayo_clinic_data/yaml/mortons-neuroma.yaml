title: Morton neuroma
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Morton neuroma is a damaged, enlarged nerve that causes pain on the bottom
      of the forefoot, usually in the area behind the third and fourth toes. The pain
      is usually sharp or burning. There may be pain, tingling or numbness spreading
      into these toes.
  - type: paragraph
    text: The exact cause of Morton neuroma is not known, but it's likely related
      to pressure on the nerve. High-heeled or narrow shoes may worsen the symptoms
      of Morton neuroma.
  - type: paragraph
    text: Many people get relief by wearing shoes with low heels and wide toe boxes
      and by using shoe inserts. Treatments also may include corticosteroid injections
      or surgery.
  - type: paragraph
    text: Morton neuroma also is called interdigital neuroma.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Morton neuroma causes pain in the ball of your foot. The ball is the padded
      area of the bottom of the foot between the toes and arch. Usually, the pain
      is in the area behind and between the third and fourth toes.
  - type: paragraph
    text: 'The pain is often described as:'
  - type: list
    ordered: false
    items:
    - Stabbing, shooting or burning pain in the ball of the foot.
    - Feeling as if walking on a marble or stone.
    - Pain that increases with activity.
    - Pain, a pins and needles feeling, tingling, or numbness in the two nearby toes.
    - Pain when stretching toes.
    - A clicking sensation in the forefoot.
  - type: paragraph
    text: Pain is often relieved with rest or removing shoes.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: It's best not to ignore any foot pain that lasts longer than a few days.
        See your healthcare professional if you experience a burning pain in the ball
        of your foot that's not improving with a change in footwear or activities
        that put a strain on your feet.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The exact cause of Morton neuroma is not known. Pressure on the affected
      nerve may contribute to damage and enlargement of the nerve.
  - type: paragraph
    text: The affected nerve is in a space between long bones in the forefoot called
      the metatarsal bones. Usually, the damaged and enlarged nerve is between the
      metatarsal bones that connect to the bones of the third and fourth toes. Nerves
      between other metatarsal bones also may be affected.
  - type: paragraph
    text: 'Factors that appear to worsen symptoms of Morton neuroma include:'
  - type: list
    ordered: false
    items:
    - High-heeled or narrow shoes. High-heeled shoes or shoes with narrow toe boxes
      can put extra pressure on the toes and the ball of the foot.
    - Activities. Walking, running or other activities that put pressure on the ball
      of the foot may worsen or trigger pain.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that appear to contribute to Morton neuroma include:'
  - type: list
    ordered: false
    items:
    - High heels. Wearing high-heeled shoes or shoes that are tight can place extra
      pressure on your toes and the ball of your foot.
    - Certain sports. Participating in high-impact athletic activities such as jogging
      or running may subject your feet to repetitive trauma. Sports that feature tight
      shoes, such as snow skiing or rock climbing, can put pressure on your toes.
    - Foot deformities. People who have bunions, hammertoes, high arches or flatfeet
      are at higher risk of developing Morton neuroma.
  subsections: []
