title: Mouth cancer
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: 'Mouth cancer is a growth of cells that starts in the mouth. Mouth cancer
      can happen in any of the parts that make up the mouth. Mouth cancer can occur
      on the:'
  - type: list
    ordered: false
    items:
    - Lips.
    - Gums.
    - Tongue.
    - Inner lining of the cheeks.
    - Roof of the mouth.
    - Floor of the mouth.
  - type: paragraph
    text: The mouth also is called the oral cavity. Cancer that happens in the mouth
      is sometimes called oral cancer or oral cavity cancer.
  - type: paragraph
    text: Mouth cancer is one of several cancers that are considered to be types of
      head and neck cancer. Mouth cancer and other head and neck cancers often have
      similar treatments.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Signs and symptoms of mouth cancer may include:'
  - type: list
    ordered: false
    items:
    - A lip or mouth sore that won't heal.
    - A white or reddish patch on the inside of the mouth.
    - Loose teeth.
    - A growth or lump inside the mouth.
    - Mouth pain.
    - Ear pain.
    - Difficult or painful swallowing.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with a doctor, dentist or other healthcare professional
        if you have any symptoms that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: It's not always clear what causes mouth cancer. This cancer starts as a
      growth of cells in the mouth. It most often starts in cells called squamous
      cells. These are flat, thin cells that line the lips and the inside of the mouth.
      Most oral cancers are squamous cell carcinomas.
  - type: paragraph
    text: Mouth cancer happens when cells on the lips or in the mouth develop changes
      in their DNA. A cell's DNA holds the instructions that tell the cell what to
      do. In healthy cells, the DNA tells the cells to grow and multiply at a set
      rate. The DNA also tells the cells to die at a set time.
  - type: paragraph
    text: In cancer cells, the DNA changes give different instructions. The changes
      tell the cancer cells to grow and multiply quickly. Cancer cells can keep living
      when healthy cells would die. This causes too many cells.
  - type: paragraph
    text: The cancer cells might form a mass called a tumor. The tumor can grow to
      invade and destroy healthy body tissue. In time, the cancer cells can break
      away and spread to other parts of the body. When cancer spreads, it's called
      metastatic cancer.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that can increase the risk of mouth cancer include:'
  subsections:
  - heading: Using tobacco
    level: 3
    content:
    - type: paragraph
      text: All forms of tobacco increase the risk of mouth cancer. This includes
        cigarettes, cigars, pipes, chewing tobacco and snuff.
    subsections: []
  - heading: Drinking alcohol
    level: 3
    content:
    - type: paragraph
      text: Frequent and heavy drinking increases the risk of mouth cancer. Using
        alcohol and tobacco together increases the risk even more.
    subsections: []
  - heading: Excessive sun exposure to the lips
    level: 3
    content:
    - type: paragraph
      text: Ultraviolet light from the sun and tanning lamps increases the risk of
        lip cancer.
    subsections: []
  - heading: Being exposed to human papillomavirus
    level: 3
    content:
    - type: paragraph
      text: Human papillomavirus, also called HPV, is a common virus that's passed
        through sexual contact. For most people, it causes no problems and goes away
        on its own. For others, it causes changes in the cells that can lead to many
        types of cancer, including mouth cancer.
    subsections: []
  - heading: A weakened immune system
    level: 3
    content:
    - type: paragraph
      text: If the body's germ-fighting immune system is weakened by medicines or
        illness, there might be a higher risk of mouth cancer. People with a weakened
        immune system include those taking medicines to control the immune system,
        such as after an organ transplant. Certain medical conditions, such as infection
        with HIV , also can weaken the immune system.
    subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'There''s no proven way to prevent mouth cancer. However, you may reduce
      your risk of mouth cancer if you:'
  subsections:
  - heading: Don't use tobacco
    level: 3
    content:
    - type: paragraph
      text: If you don't use tobacco, don't start. If you currently use tobacco of
        any kind, talk with your healthcare team about strategies to help you quit.
    subsections: []
  - heading: Limit alcohol intake
    level: 3
    content:
    - type: paragraph
      text: If you choose to drink alcohol, do so in moderation. For healthy adults,
        that means up to one drink a day for women and up to two drinks a day for
        men.
    subsections: []
  - heading: Avoid excessive sun exposure to your lips
    level: 3
    content:
    - type: paragraph
      text: Protect the skin on your lips from the sun by staying in the shade when
        possible. Wear a broad-brimmed hat that shades your entire face, including
        your mouth. Apply a sunscreen lip product for sun protection.
    subsections: []
  - heading: Consider the HPV vaccine
    level: 3
    content:
    - type: paragraph
      text: Receiving a vaccination to prevent HPV infection may reduce your risk
        of HPV -related cancers, such as mouth cancer. Ask your healthcare team whether
        the HPV vaccine is appropriate for you.
    subsections: []
  - heading: Have regular health and dental exams
    level: 3
    content:
    - type: paragraph
      text: During your appointments, your dentist, doctor or other member of your
        healthcare team can check your mouth for signs of cancer.
    subsections: []
