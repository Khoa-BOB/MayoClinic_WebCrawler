title: Pulmonary atresia
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Pulmonary atresia (uh-TREE-zhuh) is a heart problem present at birth. That
      means it is a congenital heart defect. In this condition, the valve that helps
      move blood from the heart to the lungs doesn't form correctly. The valve is
      called the pulmonary valve.
  - type: paragraph
    text: Instead of a valve that opens and closes, a solid sheet of tissue forms.
      So, blood can't travel its usual path to get oxygen from the lungs. Instead,
      some blood travels to the lungs through other natural passages within the heart
      and its arteries.
  - type: paragraph
    text: A baby in the womb needs these other passages. But they usually close soon
      after birth.
  - type: paragraph
    text: Pulmonary atresia is a life-threatening condition that needs emergency treatment.
      Treatment includes surgery to repair the heart and medicines to help the heart
      work better.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of pulmonary atresia may be seen soon after birth. They can include:'
  - type: list
    ordered: false
    items:
    - Blue or gray skin, lips or fingernails due to low oxygen levels. Depending on
      the skin color, these changes may be harder or easier to see.
    - Fast breathing or shortness of breath.
    - Tiring easily.
    - Not feeding well.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Pulmonary atresia is most often found soon after birth. If your baby has
        symptoms of pulmonary atresia after you've left the hospital, get medical
        help right away.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The cause of pulmonary atresia is not clear. During the first six weeks
      of pregnancy, the baby's heart begins to form and starts beating. The major
      blood vessels that run to and from the heart also begin to develop during this
      critical time. It's at this point in a baby's development that a congenital
      heart defect such as pulmonary atresia may begin to develop.
  - type: paragraph
    text: To understand how pulmonary atresia occurs, it may be helpful to know how
      the heart works.
  subsections:
  - heading: How the heart works
    level: 3
    content:
    - type: paragraph
      text: The typical heart is made of four chambers. There are two upper chambers,
        called atria, and two lower chambers, called ventricles.
    - type: paragraph
      text: The right side of the heart moves blood to the lungs. In the lungs, blood
        picks up oxygen and then returns it to the heart's left side. The left side
        of the heart then pumps the blood through the body's main artery, called the
        aorta. The blood goes to the rest of the body.
    - type: paragraph
      text: In pulmonary atresia, the pulmonary valve doesn't form as usual so it
        can't open. Blood can't flow from the right ventricle to the lungs.
    - type: paragraph
      text: Before birth, not having a pulmonary valve opening doesn't affect the
        baby's oxygen. That's because the baby gets oxygen from the tissue that connects
        the baby to the womb, called the placenta. The oxygen-rich blood from the
        placenta goes to the baby's right upper heart chamber.
    - type: paragraph
      text: The blood going into the right side of the baby's heart then passes through
        a hole between the top chambers of the baby's heart. The hole is called the
        foramen ovale. It lets oxygen-rich blood move to the rest of the baby's body
        through the aorta.
    - type: paragraph
      text: After birth, the lungs are needed for oxygen. In pulmonary atresia, without
        a working pulmonary valve, blood must find another way to reach the baby's
        lungs.
    - type: paragraph
      text: Blood from the right side of the heart can cross over the foramen ovale
        to the left heart. From there it can be pumped to the aorta. Newborn babies
        have a temporary opening called the ductus arteriosus between the aorta and
        the pulmonary artery. This opening lets some blood travel to the lungs. There
        the blood picks up oxygen to send to the rest of the baby's body.
    - type: paragraph
      text: The ductus arteriosus most often closes soon after birth. But medicines
        can keep it open.
    - type: paragraph
      text: Sometimes there's a second hole in the tissue between the main pumping
        chambers of the baby's heart. This hole is a ventricular septal defect (VSD).
    - type: paragraph
      text: The VSD lets blood flow from the right lower heart chamber to the left
        lower heart chamber. People with pulmonary atresia and a VSD often have other
        changes with the lungs and the arteries that bring blood to the lungs.
    - type: paragraph
      text: If there's no VSD , the right lower heart chamber gets little blood flow
        before birth. The chamber often doesn't form fully. This is a condition called
        pulmonary atresia with intact ventricular septum (PA/IVS).
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Pulmonary atresia happens as the baby''s heart is forming during pregnancy.
      Certain health conditions or illicit drug use during pregnancy may increase
      a baby''s risk of pulmonary atresia or other congenital heart defects. Risk
      factors include:'
  - type: list
    ordered: false
    items:
    - Obesity.
    - Alcohol or tobacco use.
    - Diabetes.
    - Use of some types of medicines during pregnancy, such as certain acne and blood
      pressure medicines.
  - type: paragraph
    text: Some types of congenital heart defects occur in families. This means they
      are inherited. If you or someone in your family was born with a heart problem,
      including pulmonary atresia, ask your care team is genetic screening is right
      for you. Screening can help show the risk of certain congenital heart defects
      in future children.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Without treatment, pulmonary atresia most often leads to death. After surgery
      for pulmonary atresia, babies need regular health checkups throughout their
      lives to watch for complications.
  - type: paragraph
    text: 'Complications of pulmonary atresia may include:'
  - type: list
    ordered: false
    items:
    - Bacterial infection of the inner lining of the heart and valves, called infectious
      endocarditis.
    - Irregular heartbeats, called arrhythmias.
    - Weakening of heart function.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'It might not be possible to prevent pulmonary atresia. But getting good
      prenatal care is important. Some things you can do before or during pregnancy
      might help lower your baby''s risk of congenital heart defects. They include:'
  - type: list
    ordered: false
    items:
    - Control other health conditions. If you have diabetes, keep your blood sugar
      in check. For other conditions that need medicines, talk to your healthcare
      professional about taking these medicines while pregnant.
    - Don't smoke and don't be around others who smoke. If you smoke, quit. Smoking
      during pregnancy increases the risk of a congenital heart defect in the baby.
    - Aim for a healthy weight. Obesity increases the risk of having a baby with a
      congenital heart defect.
    - Get recommended vaccinations. Having rubella, also called German measles, during
      pregnancy can cause problems in a baby's heart development. A blood test done
      before pregnancy can determine if you're immune to rubella. A vaccine is available
      for those who aren't immune.
  subsections: []
