title: Fibrocystic breasts
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Fibrocystic breasts are composed of tissue that feels lumpy or ropelike
      in texture. Doctors call this nodular or glandular breast tissue.
  - type: paragraph
    text: It's not at all uncommon to have fibrocystic breasts or experience fibrocystic
      breast changes. In fact, medical professionals have stopped using the term "fibrocystic
      breast disease" and now simply refer to "fibrocystic breasts" or "fibrocystic
      breast changes" because having fibrocystic breasts isn't a disease. Breast changes
      that fluctuate with the menstrual cycle and have a ropelike texture are considered
      normal.
  - type: paragraph
    text: Fibrocystic breast changes don't always cause symptoms. Some people experience
      breast pain, tenderness and lumpiness — especially in the upper, outer area
      of the breasts. Breast symptoms tend to be most bothersome just before menstruation
      and get better afterward. Simple self-care measures can usually relieve discomfort
      associated with fibrocystic breasts.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Signs and symptoms of fibrocystic breasts may include:'
  - type: list
    ordered: false
    items:
    - Breast lumps or areas of thickening that tend to blend into the surrounding
      breast tissue
    - Generalized breast pain or tenderness or discomfort that involves the upper
      outer part of the breast
    - Breast nodules or lumpy tissue change in size with the menstrual cycle
    - Green or dark brown nonbloody nipple discharge that tends to leak without pressure
      or squeezing
    - Breast changes that are similar in both breasts
    - Monthly increase in breast pain or lumpiness from midcycle (ovulation) to just
      before your period and then gets better once your period starts
  - type: paragraph
    text: Fibrocystic breast changes occur most often between 30 and 50 years of age.
      These changes happen rarely after menopause unless you're taking hormone replacement
      medicine such as estrogen or progesterone.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'Most fibrocystic breast changes are normal. However, make an appointment
        with your doctor if:'
    - type: list
      ordered: false
      items:
      - You find a new or persistent breast lump or area of prominent thickening or
        firmness of the breast tissue
      - You have specific areas of continuous or worsening breast pain
      - Breast changes persist after your period
      - Your doctor evaluated a breast lump but now it seems to be bigger or otherwise
        changed
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The exact cause of fibrocystic breast changes isn't known, but experts suspect
      that reproductive hormones — especially estrogen — play a role.
  - type: paragraph
    text: Fluctuating hormone levels during the menstrual cycle can cause breast discomfort
      and areas of lumpy breast tissue that feel tender, sore and swollen. Fibrocystic
      breast changes tend to be more bothersome before your menstrual period and ease
      up after your period begins.
  - type: paragraph
    text: 'When examined under a microscope, fibrocystic breast tissue includes distinct
      components such as:'
  - type: list
    ordered: false
    items:
    - Fluid-filled round or oval sacs (cysts)
    - A prominence of scar-like fibrous tissue (fibrosis)
    - Overgrowth of cells (hyperplasia) lining the milk ducts or milk-producing tissues
      (lobules) of the breast
    - Enlarged breast lobules (adenosis)
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Having fibrocystic breasts doesn't increase your risk of breast cancer.
  subsections: []
