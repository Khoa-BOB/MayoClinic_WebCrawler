title: Plague
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Plague is a serious illness caused by a germ called Yersinia pestis. The
      germs mostly live in small rodents and their fleas. The most common way for
      humans to get plague is a flea bite.
  - type: paragraph
    text: Plague is a rare disease. The illness mostly occurs in only a few countries
      around the world. In the United States, plague affects a few people each year
      in rural or semirural areas of western states.
  - type: paragraph
    text: Plague usually can be treated with antibiotics. If not treated, the illness
      is often deadly.
  - type: paragraph
    text: Plague is considered a potential bioweapon. The U.S. government has plans
      and treatments in place if the disease is used as a weapon.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: There are three types of plague. The symptoms vary for each type.
  subsections:
  - heading: Bubonic plague
    level: 3
    content:
    - type: paragraph
      text: Bubonic plague causes swelling of lymph nodes. These are small, bean-shaped
        filters in the body's immune system. A swollen lymph node is called a bubo.
        The word "bubonic" is describing this feature of the disease.
    - type: paragraph
      text: If a person has bubonic plague, buboes appear in the armpits, groin or
        neck. Buboes are tender or painful. They vary in size from about less than
        half an inch (1 centimeter) to about 4 inches (10 centimeters).
    - type: paragraph
      text: 'Other symptoms of bubonic plague may include:'
    - type: list
      ordered: false
      items:
      - Sudden high fever and chills.
      - Headache.
      - Tiredness.
      - Not feeling well in general.
      - Weakness.
      - Muscle aches.
      - Rarely, skin sores.
    subsections: []
  - heading: Septicemic plague
    level: 3
    content:
    - type: paragraph
      text: Septicemic plague occurs when plague bacteria multiply in the bloodstream.
        Buboes may not be present.
    - type: paragraph
      text: 'Early symptoms are very general and include:'
    - type: list
      ordered: false
      items:
      - Sudden high fever and chills.
      - Extreme weakness.
      - Stomach pain, diarrhea and vomiting.
    - type: paragraph
      text: 'More-serious symptoms may develop with advanced disease and organ failure.
        These include:'
    - type: list
      ordered: false
      items:
      - Bleeding from the mouth, nose or rectum, or under the skin.
      - Signs of shock, such as seizure, rash and low blood pressure.
      - Blackening and death of tissue, called gangrene, most commonly on the fingers,
        toes, ears and nose.
    subsections: []
  - heading: Pneumonic plague
    level: 3
    content:
    - type: paragraph
      text: Pneumonic plague affects the lungs. The disease may begin in the lungs,
        or it may spread from infected lymph nodes to the lungs. Symptoms can begin
        within a few hours after exposure and worsen rapidly.
    - type: paragraph
      text: 'Symptoms may include:'
    - type: list
      ordered: false
      items:
      - Sudden high fever and chills.
      - Cough, with bloody mucus.
      - Difficulty or irregular breathing.
      - Chest pain.
      - Upset stomach and vomiting.
      - Headache.
      - Weakness.
    - type: paragraph
      text: If treatment is not begun the first day, the disease progresses rapidly
        to failure of the lungs, shock and death.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Get immediate care if you have a sudden high fever.
    - type: paragraph
      text: Get emergency care if you have a sudden high fever or other symptoms and
        you live in an area that has had cases of plague. In the western United States,
        most cases have been in Arizona, California, Colorado and New Mexico.
    - type: paragraph
      text: Cases have occurred in Africa, Asia and Latin America. The countries with
        frequent cases include Madagascar, the Democratic Republic of Congo and Peru.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Plague is caused by a bacteria called Yersinia pestis. The bacteria circulate
      in populations of small animals and their fleas.
  - type: paragraph
    text: 'In the western United States, these animals include:'
  - type: list
    ordered: false
    items:
    - Rats, mice and voles.
    - Squirrels.
    - Rabbits.
    - Prairie dogs.
    - Ground squirrels and chipmunks.
  - type: paragraph
    text: 'Other animals can get plague by eating small animals with the disease or
      picking up their fleas. These may include:'
  - type: list
    ordered: false
    items:
    - Pet cats and dogs.
    - Coyotes.
    - Wild cats.
  subsections:
  - heading: Disease in humans
    level: 3
    content:
    - type: paragraph
      text: People are most likely to get plague from a flea bite. The fleas are likely
        to come from small wild animals or from pets.
    - type: paragraph
      text: People also can get plague from direct contact with tissues of a sick
        animal. For example, a hunter can pick up the disease while skinning or handling
        an animal with the illness.
    - type: paragraph
      text: Pneumonic plague can be passed from animals to humans, or from humans
        to humans. Tiny droplets in the air can carry the bacteria when a person or
        animal coughs or sneezes. People can become infected when they inhale the
        droplets or touch coughed-up mucus.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: The risk of getting plague is very low. Worldwide, only a few thousand people
      get plague each year. In the United States, seven people on average get plague
      each year.
  subsections:
  - heading: Location
    level: 3
    content:
    - type: paragraph
      text: Plague has been reported in nearly all parts of the world. The most common
        locations are Madagascar, the Democratic Republic of Congo and Peru. In Madagascar
        there is usually an outbreak of plague every year.
    - type: paragraph
      text: Plague has been reported in the western United States, most often in Arizona,
        California, Colorado and New Mexico.
    - type: paragraph
      text: The disease mostly survives in populations of rodents and their fleas
        in rural and semirural areas. It also has occurred in cities with overcrowding,
        poor sanitation or large rat populations.
    subsections: []
  - heading: Jobs
    level: 3
    content:
    - type: paragraph
      text: People are at risk of getting plague if they work outdoors in areas where
        plague-carrying animals are common. People who work in animal clinics in these
        regions also have a risk of coming into contact with pet cats and dogs with
        the disease.
    subsections: []
  - heading: Hobbies
    level: 3
    content:
    - type: paragraph
      text: Camping, hunting or hiking in areas where plague-carrying animals reside
        can increase the risk of being bitten by an infected flea.
    subsections: []
  - heading: Bioweapons
    level: 3
    content:
    - type: paragraph
      text: The U.S. government considers plague a possible biological weapon. Evidence
        exists of it being used or developed as a weapon in the past. The U.S. government
        has guidelines for treatment and prevention of plague used as a weapon.
    subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Complications of plague may include:'
  - type: list
    ordered: false
    items:
    - Gangrene. Blood clots can form in the tiny blood vessels of the fingers, toes,
      nose and ears. This can cause the tissues to die. The dead tissue needs to be
      removed.
    - Meningitis. Rarely, plague may cause swelling and disease of the protective
      tissues surrounding the brain and spinal cord. This condition is called meningitis.
    - Pharyngeal plague. Rarely, the disease can be present in the tissues behind
      the nasal cavity and mouth, called the pharynx. This is called pharyngeal plague.
  subsections:
  - heading: Death
    level: 3
    content:
    - type: paragraph
      text: The risk of death in people with all types of plague in the United States
        is around 11%.
    - type: paragraph
      text: Most people with bubonic plague survive with prompt diagnosis and treatment.
        Death is more likely with septicemic plague because it is difficult to diagnose
        and worsens rapidly. Treatment may unintentionally be delayed.
    - type: paragraph
      text: Pneumonic plague is severe and worsens rapidly. Risk of death is high
        if treatment doesn't begin within 24 hours after symptoms start.
    subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: No vaccine is available, but scientists are working to develop one. Antibiotics
      can help prevent infection if you were likely exposed to plague.
  - type: paragraph
    text: People with pneumonic plague are isolated during treatment to prevent the
      spread of disease. Health care workers must wear protective masks, gowns, gloves
      and eyewear when they treat someone with pneumonic plague.
  subsections:
  - heading: Reducing the risk of exposure
    level: 3
    content:
    - type: paragraph
      text: 'If you live or spend time outdoors where plague occurs:'
    - type: list
      ordered: false
      items:
      - Rodent-proof your home. Remove nesting areas for rodents, such as piles of
        brush, rock, firewood and junk. Don't leave pet food in areas that rodents
        can easily access. If you become aware of rodents living in your home, take
        steps to remove them.
      - Protect your pets. Use flea-control medicines for your pets. Talk to your
        vet about the best options. If your pet is sick, get prompt treatment. Don't
        let pets sleep with you if they are outside in areas where plague occurs.
      - Protection from animals. When handling dead animals, wear gloves to prevent
        contact between your skin and the animal. Call your local health department
        if you have concerns about the removal of a dead animal.
      - Use insect repellent on skin and clothing. When outdoors, use insect repellents
        registered with the U.S. Environmental Protection Agency. These include products
        that contain DEET, picaridin, IR3535, oil of lemon eucalyptus (OLE), para-menthane-3,8-diol
        or 2-undecanone. Do not use a spray directly on your face. Do not use products
        with OLE or PMD on children under age 3. Do not use insect repellent on a
        child under 2 months old.
    subsections: []
