title: Panic attacks and panic disorder
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: A panic attack is a sudden episode of intense fear that triggers severe
      physical reactions when there is no real danger or apparent cause. Panic attacks
      can be very frightening. When panic attacks occur, you might think you're losing
      control, having a heart attack or even dying.
  - type: paragraph
    text: Many people have just one or two panic attacks in their lifetimes, and the
      problem goes away, perhaps when a stressful situation ends. But if you've had
      recurrent, unexpected panic attacks and spent long periods in constant fear
      of another attack, you may have a condition called panic disorder.
  - type: paragraph
    text: Although panic attacks themselves aren't life-threatening, they can be frightening
      and significantly affect your quality of life. But treatment can be very effective.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Panic attacks typically begin suddenly, without warning. They can strike
      at any time — when you're driving a car, at the mall, sound asleep or in the
      middle of a business meeting. You may have occasional panic attacks, or they
      may occur frequently.
  - type: paragraph
    text: Panic attacks have many variations, but symptoms usually peak within minutes.
      You may feel fatigued and worn out after a panic attack subsides.
  - type: paragraph
    text: 'Panic attacks typically include some of these signs or symptoms:'
  - type: list
    ordered: false
    items:
    - Sense of impending doom or danger
    - Fear of loss of control or death
    - Rapid, pounding heart rate
    - Sweating
    - Trembling or shaking
    - Shortness of breath or tightness in your throat
    - Chills
    - Hot flashes
    - Nausea
    - Abdominal cramping
    - Chest pain
    - Headache
    - Dizziness, lightheadedness or faintness
    - Numbness or tingling sensation
    - Feeling of unreality or detachment
  - type: paragraph
    text: One of the worst things about panic attacks is the intense fear that you'll
      have another one. You may fear having panic attacks so much that you avoid certain
      situations where they may occur.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If you have panic attack symptoms, seek medical help as soon as possible.
        Panic attacks, while intensely uncomfortable, are not dangerous. But panic
        attacks are hard to manage on your own, and they may get worse without treatment.
    - type: paragraph
      text: Panic attack symptoms can also resemble symptoms of other serious health
        problems, such as a heart attack, so it's important to get evaluated by your
        primary care provider if you aren't sure what's causing your symptoms.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'It''s not known what causes panic attacks or panic disorder, but these
      factors may play a role:'
  - type: list
    ordered: false
    items:
    - Genetics
    - Major stress
    - Temperament that is more sensitive to stress or prone to negative emotions
    - Certain changes in the way parts of your brain function
  - type: paragraph
    text: Panic attacks may come on suddenly and without warning at first, but over
      time, they're usually triggered by certain situations.
  - type: paragraph
    text: Some research suggests that your body's natural fight-or-flight response
      to danger is involved in panic attacks. For example, if a grizzly bear came
      after you, your body would react instinctively. Your heart rate and breathing
      would speed up as your body prepared for a life-threatening situation. Many
      of the same reactions occur in a panic attack. But it's unknown why a panic
      attack occurs when there's no obvious danger present.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Symptoms of panic disorder often start in the late teens or early adulthood
      and affect more women than men.
  - type: paragraph
    text: 'Factors that may increase the risk of developing panic attacks or panic
      disorder include:'
  - type: list
    ordered: false
    items:
    - Family history of panic attacks or panic disorder
    - Major life stress, such as the death or serious illness of a loved one
    - A traumatic event, such as sexual assault or a serious accident
    - Major changes in your life, such as a divorce or the addition of a baby
    - Smoking or excessive caffeine intake
    - History of childhood physical or sexual abuse
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Left untreated, panic attacks and panic disorder can affect almost every
      area of your life. You may be so afraid of having more panic attacks that you
      live in a constant state of fear, ruining your quality of life.
  - type: paragraph
    text: 'Complications that panic attacks may cause or be linked to include:'
  - type: list
    ordered: false
    items:
    - Development of specific phobias, such as fear of driving or leaving your home
    - Frequent medical care for health concerns and other medical conditions
    - Avoidance of social situations
    - Problems at work or school
    - Depression, anxiety disorders and other psychiatric disorders
    - Increased risk of suicide or suicidal thoughts
    - Alcohol or other substance misuse
    - Financial problems
  - type: paragraph
    text: For some people, panic disorder may include agoraphobia — avoiding places
      or situations that cause you anxiety because you fear being unable to escape
      or get help if you have a panic attack. Or you may become reliant on others
      to be with you in order to leave your home.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: There's no sure way to prevent panic attacks or panic disorder. However,
      these recommendations may help.
  - type: list
    ordered: false
    items:
    - Get treatment for panic attacks as soon as possible to help stop them from getting
      worse or becoming more frequent.
    - Stick with your treatment plan to help prevent relapses or worsening of panic
      attack symptoms.
    - Get regular physical activity, which may play a role in protecting against anxiety.
  subsections: []
