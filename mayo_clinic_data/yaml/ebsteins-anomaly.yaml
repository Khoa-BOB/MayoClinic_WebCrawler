title: Ebstein anomaly
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Ebstein anomaly is a rare heart condition that's present at birth. That
      means it's a congenital heart defect.
  - type: paragraph
    text: In this condition, the valve that separates the top and bottom right heart
      chambers does not form correctly. This valve is called the tricuspid valve.
      As a result, the valve does not close as it should. Blood moves backward from
      the bottom to top chamber, making it harder for the heart to work.
  - type: paragraph
    text: In people with Ebstein anomaly, the heart can grow larger. The condition
      can lead to heart failure.
  - type: paragraph
    text: Treatment of Ebstein anomaly depends on the symptoms. Some people without
      symptoms only need regular health checkups. Others may need medicines and surgery.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Some babies born with Ebstein anomaly have few or no symptoms. Others have
      a tricuspid valve that leaks severely and causes more-noticeable symptoms. Sometimes
      symptoms don't occur until later in life.
  - type: paragraph
    text: 'Symptoms of Ebstein anomaly may include:'
  - type: list
    ordered: false
    items:
    - Blue or gray lips or fingernails. Depending on skin color, these color changes
      may be harder or easier to see.
    - Fatigue.
    - Feeling of a pounding or rapid heartbeat or irregular heartbeats.
    - Shortness of breath, especially with activity.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Serious heart conditions in a baby are often diagnosed at birth or during
        pregnancy.
    - type: paragraph
      text: Make a health appointment if you or your baby has symptoms of a possible
        heart condition. These symptoms include feeling short of breath or easily
        tired with little activity, irregular heartbeats, or changes in skin color.
        You may be sent to a doctor trained in heart diseases, called a cardiologist.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Ebstein anomaly is a heart condition that a person is born with. The cause
      is not known. To understand more about Ebstein anomaly, it may help to know
      how the heart works.
  subsections:
  - heading: How the heart works
    level: 3
    content:
    - type: paragraph
      text: The typical heart has four chambers.
    - type: list
      ordered: false
      items:
      - The two upper chambers are called the atria. They receive blood.
      - The two lower chambers are called the ventricles. They pump blood.
    - type: paragraph
      text: Four valves open and close to let blood flow in one direction through
        the heart. Each valve has two or three strong, thin flaps of tissue. The flaps
        are called leaflets or cusps.
    - type: list
      ordered: false
      items:
      - A valve that is closed stops blood from flowing into the next chamber.
      - A closed valve also prevents blood from going back to the previous chamber.
    - type: paragraph
      text: In a typical heart, the tricuspid valve sits between the two right heart
        chambers. In Ebstein anomaly, the tricuspid valve is lower than usual in the
        right lower heart chamber. Also, the shape of the tricuspid valve's flaps
        is changed. This can cause blood to flow backward into the right upper heart
        chamber. When this happens, the condition is called tricuspid valve regurgitation.
    subsections: []
  - heading: Heart conditions associated with Ebstein anomaly
    level: 3
    content:
    - type: paragraph
      text: 'Babies born with Ebstein anomaly may have other heart conditions, including:'
    - type: list
      ordered: false
      items:
      - Holes in the heart. A hole in the heart can lower the amount of oxygen in
        the blood. Many babies with Ebstein anomaly have a hole between the two upper
        chambers of the heart. This hole is called an atrial septal defect. Or there
        may be an opening called a patent foramen ovale, also called a PFO. A PFO
        is a hole between the upper heart chambers that all babies have before birth.
        It usually closes after birth. But it can stay open in some people.
      - Irregular heartbeats, called arrhythmias. An irregular heartbeat can include
        a fluttering, pounding or racing heartbeat. Changes in the heartbeat can make
        it harder for the heart to work as it should.
      - Wolff-Parkinson-White (WPW) syndrome. In this condition, an extra signaling
        pathway between the heart's upper and lower chambers causes a fast heartbeat
        and fainting.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Ebstein anomaly occurs as the baby, also called a fetus, grows in the womb
      during pregnancy.
  - type: paragraph
    text: Researchers aren't sure exactly what increases the risk of Ebstein anomaly.
      Genetics and environmental factors are believed to be involved. Using some medicines
      during pregnancy, such as lithium, might increase the risk of Ebstein anomaly
      in the baby.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Possible complications of Ebstein anomaly include:'
  - type: list
    ordered: false
    items:
    - Irregular heartbeats.
    - Heart failure.
    - Sudden cardiac arrest.
    - Stroke.
  subsections:
  - heading: Pregnancy and Ebstein anomaly
    level: 3
    content:
    - type: paragraph
      text: It may be possible to have a successful pregnancy with mild Ebstein anomaly.
        But pregnancy, labor and delivery put extra strain on the heart. Rarely, extreme
        complications can develop that can cause serious health concerns in the mother
        or baby.
    - type: paragraph
      text: Before becoming pregnant, talk with your healthcare team about the possible
        risks and complications. Together you can plan for any special care needed
        during pregnancy.
    subsections: []
