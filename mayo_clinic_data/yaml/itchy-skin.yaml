title: Itchy skin (pruritus)
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Itchy skin is an irritating sensation that makes you want to scratch. It's
      also called pruritus (proo-RIE-tus). Itchy skin is often caused by dry skin
      and is common in older adults, as skin tends to become drier with age.
  - type: paragraph
    text: Depending on the cause of your itchiness, your skin may look no different
      than usual or it may be inflamed, rough or have bumps. Repeated scratching can
      cause raised thick areas of skin that might bleed or become infected.
  - type: paragraph
    text: Many people find relief with self-care measures such as moisturizers, gentle
      cleansers and lukewarm baths. Long-term relief requires identifying and treating
      the cause of itchy skin. Common treatments are medicated creams, moist dressings
      and anti-itch medicines taken by mouth.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Itchy skin can affect small areas, such as the scalp, an arm or a leg.
      Or it can cover the whole body. Itchy skin can occur without any other noticeable
      changes on the skin. Or it may come with:'
  - type: list
    ordered: false
    items:
    - Inflamed skin
    - Scratch marks
    - Bumps, spots or blisters
    - Dry, cracked skin
    - Leathery or scaly patches
  - type: paragraph
    text: Sometimes itchiness lasts a long time and can be intense. As you rub or
      scratch the area, it gets itchier. And the more it itches, the more you scratch.
      Breaking this itch-scratch cycle can be difficult.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'See your health care provider or a skin disease specialist (dermatologist)
        if the itching:'
    - type: list
      ordered: false
      items:
      - Lasts more than two weeks and doesn't improve with self-care measures
      - Is severe and distracts you from your daily routines or prevents you from
        sleeping
      - Comes on suddenly and can't be easily explained
      - Affects your whole body
      - Comes with other symptoms, such as weight loss, fever or night sweats
    - type: paragraph
      text: If the condition persists for three months despite treatment, see a dermatologist
        to be evaluated for skin disease. You may also need to see a doctor who specializes
        in internal medicine (internist) to check for other diseases.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Causes of itchy skin include:'
  - type: list
    ordered: false
    items:
    - Skin conditions. Examples include dry skin (xerosis), eczema (dermatitis), psoriasis,
      scabies, parasites, burns, scars, insect bites and hives.
    - Internal diseases. Itching on the whole body might be a symptom of an underlying
      illness, such as liver disease, kidney disease, anemia, diabetes, thyroid problems
      and certain cancers.
    - Nerve disorders. Examples include multiple sclerosis, pinched nerves and shingles
      (herpes zoster).
    - Psychiatric conditions. Examples include anxiety, obsessive-compulsive disorder
      and depression.
    - Irritation and allergic reactions. Wool, chemicals, soaps and other things can
      irritate the skin and cause rashes and itching. Sometimes a substance, such
      as poison ivy or cosmetics, causes an allergic reaction. Also, reactions to
      certain medicines, such as narcotics to treat pain (opioids) can cause itchy
      skin.
  - type: paragraph
    text: Sometimes the cause of the itching can't be determined.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Anyone can develop itchy skin. But you may be more likely to develop it
      if you:'
  - type: list
    ordered: false
    items:
    - Have a condition that can cause itching, such as dermatitis, kidney disease,
      anemia or thyroid disease.
    - Are an older adult, as skin can become drier with age.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Itchy skin that is severe or lasts more than six weeks can affect the quality
      of your life. This type is called chronic pruritus. It might disturb your sleep
      or cause anxiety or depression. Prolonged itching and scratching can increase
      the intensity of the itch, possibly leading to skin injury, infection and scarring.
  subsections: []
