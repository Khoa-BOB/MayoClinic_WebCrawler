title: Rotator cuff injury
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: The rotator cuff is a group of muscles and tendons that surround the shoulder
      joint. These muscles keep the ball of the upper arm bone firmly within the shallow
      socket of the shoulder. A rotator cuff injury can cause a dull ache in the shoulder
      that worsens at night.
  - type: paragraph
    text: Rotator cuff injuries are common and increase with age. These injuries may
      occur earlier in people who have jobs that require repeatedly performing overhead
      motions, such as painters and carpenters.
  - type: paragraph
    text: Physical therapy exercises can improve flexibility and strength of the muscles
      surrounding the shoulder joint. For many people with rotator cuff problems,
      these exercises are all that's needed to manage their symptoms.
  - type: paragraph
    text: Sometimes, rotator cuff tears may occur from a single injury. In those circumstances,
      people should seek medical advice quickly because they might need surgery.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'The pain associated with a rotator cuff injury may:'
  - type: list
    ordered: false
    items:
    - Be described as a dull ache deep in the shoulder.
    - Disturb sleep.
    - Make it difficult to comb your hair or reach behind your back.
    - Be accompanied by arm weakness.
  - type: paragraph
    text: Some rotator cuff injuries don't cause pain.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Your family healthcare professional can evaluate short-term shoulder pain.
        See your care team right away if you have immediate weakness in your arm after
        an injury.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Rotator cuff injuries are most often caused by progressive wear and tear
      of the tendon tissue over time. Repetitive overhead activity or prolonged bouts
      of heavy lifting can irritate or damage the tendon. The rotator cuff also can
      be injured in a single incident during falls or accidents.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'The following factors may increase the risk of having a rotator cuff injury:'
  - type: list
    ordered: false
    items:
    - Age. The risk of a rotator cuff injury increases with age. Rotator cuff tears
      are most common in people older than 50.
    - Some occupations. Jobs that require repetitive overhead arm motions, such as
      carpentry or house painting, can damage the rotator cuff over time.
    - Certain sports. Some types of rotator cuff injuries are more common in people
      who participate in sports such as baseball, tennis and weightlifting.
    - Family history. There may be a genetic component involved with rotator cuff
      injuries as they appear to occur more commonly in certain families.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Without treatment, rotator cuff problems may lead to permanent loss of motion
      or weakness of the shoulder joint.
  subsections: []
