title: Post-traumatic stress disorder (PTSD)
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Post-traumatic stress disorder (PTSD) is a mental health condition that's
      caused by an extremely stressful or terrifying event — either being part of
      it or witnessing it. Symptoms may include flashbacks, nightmares, severe anxiety
      and uncontrollable thoughts about the event.
  - type: paragraph
    text: Most people who go through traumatic events may have a hard time adjusting
      and coping for a short time. But with time and by taking good care of themselves,
      they usually get better. If the symptoms get worse, last for months or years,
      and affect their ability to function daily, they may have PTSD .
  - type: paragraph
    text: Getting treatment after PTSD symptoms arise can be very important to ease
      symptoms and help people function better.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Post-traumatic stress disorder symptoms may start within the first three
      months after a traumatic event. But sometimes symptoms may not appear until
      years after the event. These symptoms last more than one month and cause major
      problems in social or work situations and how well you get along with others.
      They also can affect your ability to do your usual daily tasks.
  - type: paragraph
    text: 'Generally, PTSD symptoms are grouped into four types: intrusive memories,
      avoidance, negative changes in thinking and mood, and changes in physical and
      emotional reactions. Symptoms can vary over time or vary from person to person.'
  subsections:
  - heading: Intrusive memories
    level: 3
    content:
    - type: paragraph
      text: 'Symptoms of intrusive memories may include:'
    - type: list
      ordered: false
      items:
      - Unwanted, distressing memories of a traumatic event that come back over and
        over again.
      - Reliving a traumatic event as if it were happening again, also known as flashbacks.
      - Upsetting dreams or nightmares about a traumatic event.
      - Severe emotional distress or physical reactions to something that reminds
        you of a traumatic event.
    subsections: []
  - heading: Avoidance
    level: 3
    content:
    - type: paragraph
      text: 'Symptoms of avoidance may include:'
    - type: list
      ordered: false
      items:
      - Trying not to think or talk about a traumatic event.
      - Staying away from places, activities or people that remind you of a traumatic
        event.
    subsections: []
  - heading: Negative changes in thinking and mood
    level: 3
    content:
    - type: paragraph
      text: 'Symptoms of negative changes in thinking and mood may include:'
    - type: list
      ordered: false
      items:
      - Negative thoughts about yourself, other people or the world.
      - Ongoing negative emotions of fear, blame, guilt, anger or shame.
      - Memory problems, including not remembering important aspects of a traumatic
        event.
      - Feeling detached from family and friends.
      - Not being interested in activities you once enjoyed.
      - Having a hard time feeling positive emotions.
      - Feeling emotionally numb.
    subsections: []
  - heading: Changes in physical and emotional reactions
    level: 3
    content:
    - type: paragraph
      text: 'Symptoms of changes in physical and emotional reactions, also called
        arousal symptoms, may include:'
    - type: list
      ordered: false
      items:
      - Being easily startled or frightened.
      - Always being on guard for danger.
      - Self-destructive behavior, such as drinking too much or driving too fast.
      - Trouble sleeping.
      - Trouble concentrating.
      - Irritability, angry outbursts or aggressive behavior.
      - Physical reactions, such as sweating, rapid breathing, fast heartbeat or shaking.
    - type: paragraph
      text: 'For children 6 years old and younger, symptoms also may include:'
    - type: list
      ordered: false
      items:
      - Reenacting a traumatic event or aspects of a traumatic event through play.
      - Frightening dreams that may or may not include aspects of a traumatic event.
    subsections: []
  - heading: Intensity of symptoms
    level: 3
    content:
    - type: paragraph
      text: Over time, PTSD symptoms can vary in how severe they are. You may have
        more PTSD symptoms when you're generally stressed or when you come across
        reminders of what you went through, including the same time of year when a
        past traumatic event happened. For example, you may hear a car backfire and
        relive combat experiences. Or you may see a report on the news about a sexual
        assault and feel overcome by memories of your assault.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Talk to your healthcare professional or a mental health professional if
        you have disturbing thoughts and feelings about a traumatic event for more
        than a month, especially if they're severe. Also, see a health professional
        if you're having trouble getting your life back under control. Getting treatment
        as soon as possible can help prevent PTSD symptoms from getting worse.
    subsections: []
  - heading: If you have suicidal thoughts
    level: 3
    content:
    - type: paragraph
      text: 'If you or someone you know has suicidal thoughts, get help right away:'
    - type: list
      ordered: false
      items:
      - Reach out to a close friend or loved one.
      - Contact a minister, spiritual leader or someone in your faith community.
      - Contact a suicide hotline. In the U.S., call or text 988 to reach the 988
        Suicide & Crisis Lifeline, available 24 hours a day, seven days a week. Or
        use the Lifeline Chat. Services are free and confidential. U.S. veterans or
        service members who are in crisis can call 988 and then press "1" for the
        Veterans Crisis Line. Or text 838255. Or chat online. The Suicide & Crisis
        Lifeline in the U.S. has a Spanish language phone line at 1-888-628-9454 (toll-free).
      - Make an appointment with your healthcare professional or mental health professional.
    - type: list
      ordered: false
      items:
      - In the U.S., call or text 988 to reach the 988 Suicide & Crisis Lifeline,
        available 24 hours a day, seven days a week. Or use the Lifeline Chat. Services
        are free and confidential.
      - U.S. veterans or service members who are in crisis can call 988 and then press
        "1" for the Veterans Crisis Line. Or text 838255. Or chat online.
      - The Suicide & Crisis Lifeline in the U.S. has a Spanish language phone line
        at 1-888-628-9454 (toll-free).
    subsections: []
  - heading: When to get emergency help
    level: 3
    content:
    - type: paragraph
      text: If you think you may hurt yourself or attempt suicide, call 911 or your
        local emergency number right away.
    - type: paragraph
      text: If you know someone who's in danger of attempting suicide or has made
        a suicide attempt, make sure someone stays with that person for safety. Call
        911 or your local emergency number right away. Or, if you can do so safely,
        take the person to the nearest hospital emergency department.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: You can develop post-traumatic stress disorder when you go through, see
      or learn about an event involving actual or threatened death, serious injury
      or sexual assault.
  - type: paragraph
    text: 'Healthcare professionals aren''t sure why some people get PTSD . As with
      most mental health problems, a mix of factors probably causes it, including:'
  - type: list
    ordered: false
    items:
    - Extremely stressful experiences, as well as the amount and severity of trauma
      you've gone through in your life.
    - Inherited mental health risks, such as a family history of anxiety and depression.
    - Inherited features of your personality — often called your temperament.
    - The way your brain regulates the chemicals and hormones your body releases in
      response to stress.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'People of all ages can have post-traumatic stress disorder. But you may
      be more likely to develop PTSD after a traumatic event if you:'
  - type: list
    ordered: false
    items:
    - Have severe or long-lasting traumatic experiences.
    - Were physically injured during the traumatic event.
    - Have been exposed to other trauma earlier in life, such as childhood abuse.
    - Have a job that exposes you to traumatic events, such as being in the military
      or being a first responder.
    - Have other mental health problems, such as anxiety or depression.
    - Drink too much or misuse drugs.
    - Do not have a good support system of family and friends.
    - Have blood relatives with mental health problems, including PTSD or depression.
  subsections:
  - heading: Traumatic events that raise risk
    level: 3
    content:
    - type: paragraph
      text: 'The most common events that can lead to PTSD include:'
    - type: list
      ordered: false
      items:
      - Combat exposure.
      - Childhood physical abuse.
      - Sexual violence.
      - Physical assault.
      - Being threatened with a weapon.
      - An accident.
    - type: paragraph
      text: Many other traumatic events also can lead to PTSD , such as fire, natural
        disaster, mugging, robbery, plane crash, torture, kidnapping, a life-threatening
        medical diagnosis, a terrorist attack, and other extreme or life-threatening
        events.
    subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Post-traumatic stress disorder can disrupt your whole life — your education,
      job, how well you get along with others, physical health and enjoyment of everyday
      activities. Having PTSD also may raise your risk of other mental health problems,
      such as:'
  - type: list
    ordered: false
    items:
    - Depression and anxiety disorders.
    - Issues with drugs or alcohol use.
    - Thinking about and attempting suicide.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: After surviving a traumatic event, many people have PTSD -like symptoms
      at first, such as not being able to stop thinking about what's happened. Fear,
      anxiety, anger, depression and guilt are all common reactions to trauma. But
      most people exposed to trauma don't go on to develop PTSD .
  - type: paragraph
    text: Getting timely help and support may prevent usual stress reactions from
      getting worse and leading to PTSD . This may mean turning to family and friends
      who will listen and offer comfort. It also may mean seeking out a mental health
      professional for a brief course of therapy. Some people also may find it helpful
      to turn to their faith communities.
  - type: paragraph
    text: Support from others also may prevent you from turning to unhealthy coping
      methods, such as misusing alcohol or drugs.
  subsections: []
