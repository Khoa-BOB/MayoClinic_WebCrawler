title: Kidney cancer
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Kidney cancer is a growth of cells that starts in the kidneys. The kidneys
      are two bean-shaped organs, each about the size of a fist. They're located behind
      the abdominal organs, with one kidney on each side of the spine.
  - type: paragraph
    text: In adults, renal cell carcinoma is the most common type of kidney cancer.
      Other, less common types of kidney cancer can happen. Young children are more
      likely to develop a kind of kidney cancer called Wilms tumor.
  - type: paragraph
    text: The number of kidney cancers diagnosed each year seems to be increasing.
      One reason for this may be the fact that imaging techniques such as CT scans
      are being used more often. These tests may lead to the incidental discovery
      of more kidney cancers. Kidney cancer is often found when the cancer is small
      and confined to the kidney.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Kidney cancer doesn''t usually cause symptoms at first. In time, signs
      and symptoms may develop, including:'
  - type: list
    ordered: false
    items:
    - Blood in the urine, which may appear pink, red or cola colored.
    - Loss of appetite.
    - Pain in the side or back that doesn't go away.
    - Tiredness.
    - Unexplained weight loss.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with a doctor or other healthcare professional if
        you have any symptoms that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: It's not clear what causes most kidney cancers.
  - type: paragraph
    text: Kidney cancer happens when cells in the kidney develop changes in their
      DNA. A cell's DNA holds the instructions that tell the cell what to do. In healthy
      cells, the DNA gives instructions to grow and multiply at a set rate. The instructions
      tell the cells to die at a set time. In cancer cells, the DNA changes give different
      instructions. The changes tell the cancer cells to make many more cells quickly.
      Cancer cells can keep living when healthy cells would die. This causes too many
      cells.
  - type: paragraph
    text: The cancer cells form a mass called a tumor. The tumor can grow to invade
      and destroy healthy body tissue. In time, cancer cells can break away and spread
      to other parts of the body. When cancer spreads, it's called metastatic cancer.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that may increase the risk of kidney cancer include:'
  - type: list
    ordered: false
    items:
    - Older age. The risk of kidney cancer increases with age.
    - Smoking tobacco. People who smoke have a greater risk of kidney cancer than
      those who don't. The risk decreases after quitting.
    - Obesity. People who are obese have a higher risk of kidney cancer than people
      who are considered to have a healthy weight.
    - High blood pressure. High blood pressure, also called hypertension, increases
      the risk of kidney cancer.
    - Certain inherited conditions. People who are born with certain inherited conditions
      may have an increased risk of kidney cancer. These conditions may include von
      Hippel-Lindau disease, Birt-Hogg-Dube syndrome, tuberous sclerosis complex,
      hereditary papillary renal cell carcinoma and familial renal cancer.
    - Family history of kidney cancer. The risk of kidney cancer is higher if a blood
      relative, such as a parent or sibling, has had the disease.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'There''s no sure way to prevent kidney cancer, but you may reduce your
      risk if you:'
  subsections:
  - heading: Drink alcohol in moderation, if at all
    level: 3
    content:
    - type: paragraph
      text: If you choose to drink alcohol, do so in moderation. For healthy adults,
        that means up to one drink a day for women and up to two drinks a day for
        men.
    subsections: []
  - heading: Eat more fruits and vegetables
    level: 3
    content:
    - type: paragraph
      text: Choose a healthy diet with a variety of fruits and vegetables. Food sources
        of vitamins and nutrients are best. Avoid taking large doses of vitamins in
        pill form, as they may be harmful.
    subsections: []
  - heading: Exercise most days of the week
    level: 3
    content:
    - type: paragraph
      text: Aim for at least 30 minutes of exercise on most days of the week. If you
        haven't been active lately, ask your healthcare professional whether it's
        OK and start slowly.
    subsections: []
  - heading: Maintain a healthy weight
    level: 3
    content:
    - type: paragraph
      text: If your weight is healthy, work to maintain that weight. If you need to
        lose weight, ask a healthcare professional about healthy ways to lower your
        weight. Eat fewer calories and slowly increase the amount of exercise.
    subsections: []
  - heading: Stop smoking
    level: 3
    content:
    - type: paragraph
      text: Talk with your healthcare team about strategies and aids that can help
        you quit. Options include nicotine replacement products, medicines and support
        groups. If you've never smoked, don't start.
    subsections: []
  - heading: Control high blood pressure
    level: 3
    content:
    - type: paragraph
      text: Ask your healthcare professional to check your blood pressure at your
        next appointment. If your blood pressure is high, you can discuss options
        for lowering your numbers. Lifestyle measures such as exercise, weight loss
        and diet changes can help. Some people may need to add medicines to lower
        their blood pressure. Discuss your options with your healthcare team.
    subsections: []
