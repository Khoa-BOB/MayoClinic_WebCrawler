title: End-stage renal disease
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: End-stage renal disease, also called end-stage kidney disease or kidney
      failure, occurs when chronic kidney disease — the gradual loss of kidney function
      — reaches an advanced state. In end-stage renal disease, your kidneys no longer
      work as they should to meet your body's needs.
  - type: paragraph
    text: Your kidneys filter wastes and excess fluids from your blood, which are
      then excreted in your urine. When your kidneys lose their filtering abilities,
      dangerous levels of fluid, electrolytes and wastes can build up in your body.
  - type: paragraph
    text: With end-stage renal disease, you need dialysis or a kidney transplant to
      stay alive. But you can also choose to opt for conservative care to manage your
      symptoms — aiming for the best quality of life during your remaining time.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Early in chronic kidney disease, you might have no signs or symptoms. As
      chronic kidney disease progresses to end-stage renal disease, signs and symptoms
      might include:'
  - type: list
    ordered: false
    items:
    - Nausea
    - Vomiting
    - Loss of appetite
    - Fatigue and weakness
    - Changes in how much you urinate
    - Chest pain, if fluid builds up around the lining of the heart
    - Shortness of breath, if fluid builds up in the lungs
    - Swelling of feet and ankles
    - High blood pressure (hypertension) that's difficult to control
    - Headaches
    - Difficulty sleeping
    - Decreased mental sharpness
    - Muscle twitches and cramps
    - Persistent itching
    - Metallic taste
  - type: paragraph
    text: Signs and symptoms of kidney disease are often nonspecific, meaning they
      can also be caused by other illnesses. Because your kidneys can make up for
      lost function, signs and symptoms might not appear until irreversible damage
      has occurred.
  subsections:
  - heading: When to seek care
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with your health care provider if you have signs or
        symptoms of kidney disease.
    - type: paragraph
      text: If you have a medical condition that increases your risk of kidney disease,
        your care provider is likely to monitor your kidney function with urine and
        blood tests and your blood pressure during regular office visits. Ask your
        provider whether these tests are necessary for you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Kidney disease occurs when a disease or condition impairs kidney function,
      causing kidney damage to worsen over several months or years. For some people,
      kidney damage can continue to progress even after the underlying condition is
      resolved.
  - type: paragraph
    text: 'Diseases and conditions that can lead to kidney disease include:'
  - type: list
    ordered: false
    items:
    - Type 1 or type 2 diabetes
    - High blood pressure
    - Glomerulonephritis (gloe-mer-u-low-nuh-FRY-tis) — an inflammation of the kidney's
      filtering units (glomeruli)
    - Interstitial nephritis (in-tur-STISH-ul nuh-FRY-tis), an inflammation of the
      kidney's tubules and surrounding structures
    - Polycystic kidney disease or other inherited kidney diseases
    - Prolonged obstruction of the urinary tract, from conditions such as enlarged
      prostate, kidney stones and some cancers
    - Vesicoureteral (ves-ih-koe-yoo-REE-tur-ul) reflux, a condition that causes urine
      to back up into your kidneys
    - Recurrent kidney infection, also called pyelonephritis (pie-uh-low-nuh-FRY-tis)
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Certain factors increase the risk that chronic kidney disease will progress
      more quickly to end-stage renal disease, including:'
  - type: list
    ordered: false
    items:
    - Diabetes with poor blood sugar control
    - Kidney disease that affects the glomeruli, the structures in the kidneys that
      filter wastes from the blood
    - Polycystic kidney disease
    - High blood pressure
    - Tobacco use
    - Black, Hispanic, Asian, Pacific Islander or American Indian heritage
    - Family history of kidney failure
    - Older age
    - Frequent use of medications that could be damaging to the kidney
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Kidney damage, once it occurs, can''t be reversed. Potential complications
      can affect almost any part of your body and can include:'
  - type: list
    ordered: false
    items:
    - Fluid retention, which could lead to swelling in your arms and legs, high blood
      pressure, or fluid in your lungs (pulmonary edema)
    - A sudden rise in potassium levels in your blood (hyperkalemia), which could
      impair your heart's ability to function and may be life-threatening
    - Heart disease
    - Weak bones and an increased risk of bone fractures
    - Anemia
    - Decreased sex drive, erectile dysfunction or reduced fertility
    - Damage to your central nervous system, which can cause difficulty concentrating,
      personality changes or seizures
    - Decreased immune response, which makes you more vulnerable to infection
    - Pericarditis, an inflammation of the saclike membrane that envelops your heart
      (pericardium)
    - Pregnancy complications that carry risks for the mother and the developing fetus
    - Malnutrition
    - Irreversible damage to your kidneys (end-stage kidney disease), eventually requiring
      either dialysis or a kidney transplant for survival
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'If you have kidney disease, you may be able to slow its progress by making
      healthy lifestyle choices:'
  - type: list
    ordered: false
    items:
    - Achieve and maintain a healthy weight
    - Be active most days
    - Limit protein and eat a balanced diet of nutritious, low-sodium foods
    - Control your blood pressure
    - Take your medications as prescribed
    - Have your cholesterol levels checked every year
    - Control your blood sugar level
    - Don't smoke or use tobacco products
    - Get regular checkups
  subsections: []
