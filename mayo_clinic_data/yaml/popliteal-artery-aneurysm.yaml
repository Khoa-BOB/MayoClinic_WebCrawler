title: Popliteal artery aneurysm
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: A popliteal artery aneurysm is an irregular bulge that occurs in the wall
      of the artery located behind the knee joint. It is a type of lower extremity
      aneurysm.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'You might not notice any symptoms. The first symptom may be pain in the
      lower leg that occurs with walking, called claudication. Other symptoms of a
      popliteal artery aneurysm include:'
  - type: list
    ordered: false
    items:
    - Knee pain.
    - Lower leg pain.
    - Swelling behind the knee.
    - Pulsing feeling behind the knee.
  subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'An aneurysm is a ballooning in a weak spot in an artery wall. Many different
      things can cause the popliteal artery wall to become weak, including:'
  - type: list
    ordered: false
    items:
    - Atherosclerosis.
    - High blood pressure.
    - Wear and tear of the popliteal artery due to repeat use of the knee joint.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Popliteal artery aneurysms are rare. They are more common in men than in
      women.
  - type: paragraph
    text: Popliteal artery aneurysm often occurs in men with abdominal aortic aneurysm
      (AAA). An abdominal aortic aneurysm is a swelling of the wall of the body's
      main artery, called the aorta. Anyone diagnosed with popliteal artery aneurysm
      should be screened for AAA .
  - type: paragraph
    text: 'Other risk factors for popliteal artery aneurysm include:'
  - type: list
    ordered: false
    items:
    - Growing older.
    - High blood pressure.
    - Smoking.
    - Narrowing of a heart valve.
    - Having three or more aneurysms anywhere in the body.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Complications of popliteal artery aneurysm include blood clots. Blood clots
      can cause a severe lack of blood flow in the lower leg.
  - type: paragraph
    text: 'A severe lack of blood flow can cause the following symptoms:'
  - type: list
    ordered: false
    items:
    - A change in skin color in the affected area.
    - No pulse behind the knee.
    - Skin in the affected area feels cold.
    - Numbness in the leg.
    - Inability to move the foot.
  - type: paragraph
    text: A severe lack of blood flow may result in loss of the limb. Rarely, the
      aneurysm may rupture. But the risk of popliteal artery aneurysm rupture is low.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: Smoking and high blood pressure increase the risk of blood vessel problems
      that can lead to popliteal artery and other aneurysms. Following a heart-healthy
      lifestyle can help prevent heart disease and blood vessel damage.
  - type: paragraph
    text: 'Try these heart-healthy tips:'
  - type: list
    ordered: false
    items:
    - Do not smoke.
    - Eat a nutritious diet.
    - Get regular exercise.
  subsections: []
