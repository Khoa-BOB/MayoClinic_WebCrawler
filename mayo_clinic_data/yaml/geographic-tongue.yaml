title: Geographic tongue
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Geographic tongue is an inflammatory but harmless condition affecting the
      surface of the tongue. The tongue usually is covered with tiny, pinkish-white
      bumps called papillae. These papillae are actually fine, hairlike structures.
      With geographic tongue, patches on the surface of the tongue are missing papillae.
      These patches are smooth and red, often with slightly raised borders.
  - type: paragraph
    text: This condition is called geographic tongue because the patches make your
      tongue look like a map. The patches often appear in one area and then move to
      a different part of the tongue.
  - type: paragraph
    text: Although geographic tongue may look alarming, it does not cause health issues.
      It's not related to infection or cancer. Geographic tongue sometimes can cause
      tongue pain and make you more sensitive to certain foods, such as spices, salt
      and even sweets.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of geographic tongue may include:'
  - type: list
    ordered: false
    items:
    - Smooth, red, irregularly shaped patches on the top or side of your tongue. These
      patches may look like sores.
    - Frequent changes in the location, size and shape of the patches.
    - Pain or burning feeling in some cases, most often related to eating spicy or
      acidic foods.
  - type: paragraph
    text: Many people with geographic tongue have no symptoms.
  - type: paragraph
    text: Geographic tongue can continue for days, months or years. The problem often
      goes away on its own, but it may appear again later.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Because most people with geographic tongue don't show symptoms, they won't
        need treatment. If you have symptoms, they may be related to a fungal infection,
        so see your doctor or dentist. In some cases, medicine may be prescribed to
        help ease symptoms.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The cause of geographic tongue is not known, and there's no way to prevent
      it. There may be a link between geographic tongue and other conditions, such
      as psoriasis. This is a skin disease that causes a rash with itchy, scaly patches.
      But more research is needed to learn about possible connections to other health
      conditions.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that may increase your risk of geographic tongue include:'
  - type: list
    ordered: false
    items:
    - Family history. Some people with geographic tongue have a family history of
      it. So genetic factors may raise the risk.
    - Fissured tongue. People with geographic tongue often have a condition called
      fissured tongue. This is when deep grooves, called fissures, appear on the surface
      of the tongue.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Geographic tongue is harmless, but it can sometimes be uncomfortable. It
      does not pose a threat to your health, cause long-term complications or raise
      your risk of major health problems.
  - type: paragraph
    text: This condition can cause anxiety. That's because the appearance of the tongue
      may be embarrassing, depending on how well the patches can be seen. It also
      may be hard to believe that nothing is seriously wrong.
  subsections: []
