        brain interprets these signals as sound.
    - type: paragraph
      text: If the hairs inside your inner ear are bent or broken — this happens as
        you age or when you are regularly exposed to loud sounds — they can "leak"
        random electrical impulses to your brain, causing tinnitus.
    - type: paragraph
