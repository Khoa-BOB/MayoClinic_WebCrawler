  - heading: Other causes of tinnitus
    level: 3
    content:
    - type: paragraph
      text: Less common causes of tinnitus include other ear problems, chronic health
        conditions, and injuries or conditions that affect the nerves in your ear
        or the hearing center in your brain.
    - type: list
      ordered: false
      items:
      - Meniere's disease. Tinnitus can be an early indicator of Meniere's disease,
        an inner ear disorder that may be caused by abnormal inner ear fluid pressure.
      - Eustachian tube dysfunction. In this condition, the tube in your ear connecting
        the middle ear to your upper throat remains expanded all the time, which can
        make your ear feel full.
      - Ear bone changes. Stiffening of the bones in your middle ear (otosclerosis)
        may affect your hearing and cause tinnitus. This condition, caused by abnormal
        bone growth, tends to run in families.
      - Muscle spasms in the inner ear. Muscles in the inner ear can tense up (spasm),
        which can result in tinnitus, hearing loss and a feeling of fullness in the
        ear. This sometimes happens for no explainable reason, but can also be caused
        by neurologic diseases, including multiple sclerosis.
      - Temporomandibular joint (TMJ) disorders. Problems with the TMJ , the joint
        on each side of your head in front of your ears, where your lower jawbone
        meets your skull, can cause tinnitus.
      - Acoustic neuroma or other head and neck tumors. Acoustic neuroma is a noncancerous
        (benign) tumor that develops on the cranial nerve that runs from your brain
        to your inner ear and controls balance and hearing. Other head, neck or brain
        tumors can also cause tinnitus.
      - Blood vessel disorders. Conditions that affect your blood vessels — such as
        atherosclerosis, high blood pressure, or kinked or malformed blood vessels
        — can cause blood to move through your veins and arteries with more force.
        These blood flow changes can cause tinnitus or make tinnitus more noticeable.
      - Other chronic conditions. Conditions including diabetes, thyroid problems,
        migraines, anemia, and autoimmune disorders such as rheumatoid arthritis and
        lupus have all been associated with tinnitus.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Anyone can experience tinnitus, but these factors may increase your risk:'
  - type: list
    ordered: false
    items:
    - Loud noise exposure. Loud noises, such as those from heavy equipment, chain
      saws and firearms, are common sources of noise-related hearing loss. Portable
      music devices, such as MP3 players, also can cause noise-related hearing loss
      if played loudly for long periods. People who work in noisy environments — such
      as factory and construction workers, musicians, and soldiers — are particularly
      at risk.
    - Age. As you age, the number of functioning nerve fibers in your ears declines,
      possibly causing hearing problems often associated with tinnitus.
    - Sex. Men are more likely to experience tinnitus.
    - Tobacco and alcohol use. Smokers have a higher risk of developing tinnitus.
      Drinking alcohol also increases the risk of tinnitus.
    - Certain health problems. Obesity, cardiovascular problems, high blood pressure,
      and a history of arthritis or head injury all increase your risk of tinnitus.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Tinnitus affects people differently. For some people, tinnitus can significantly
      affect quality of life. If you have tinnitus, you may also experience:'
  - type: list
    ordered: false
    items:
    - Fatigue
    - Stress
    - Sleep problems
    - Trouble concentrating
    - Memory problems
    - Depression
    - Anxiety and irritability
    - Headaches
    - Problems with work and family life
  - type: paragraph
    text: Treating these linked conditions may not affect tinnitus directly, but it
      can help you feel better.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: In many cases, tinnitus is the result of something that can't be prevented.
      However, some precautions can help prevent certain kinds of tinnitus.
  - type: list
    ordered: false
    items:
    - Use hearing protection. Over time, exposure to loud sounds can damage the nerves
      in the ears, causing hearing loss and tinnitus. Try to limit your exposure to
      loud sounds. And if you cannot avoid loud sounds, use ear protection to help
      protect your hearing. If you use chain saws, are a musician, work in an industry
      that uses loud machinery or use firearms (especially pistols or shotguns), always
      wear over-the-ear hearing protection.
    - Turn down the volume. Long-term exposure to amplified music with no ear protection
      or listening to music at very high volume through headphones can cause hearing
      loss and tinnitus.
    - Take care of your cardiovascular health. Regular exercise, eating right and
      taking other steps to keep your blood vessels healthy can help prevent tinnitus
      linked to obesity and blood vessel disorders.
    - Limit alcohol, caffeine and nicotine. These substances, especially when used
      in excess, can affect blood flow and contribute to tinnitus.
  subsections: []
