title: Tinnitus
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Tinnitus is when you experience ringing or other noises in one or both of
      your ears. The noise you hear when you have tinnitus isn't caused by an external
      sound, and other people usually can't hear it. Tinnitus is a common problem.
      It affects about 15% to 20% of people, and is especially common in older adults.
  - type: paragraph
    text: Tinnitus is usually caused by an underlying condition, such as age-related
      hearing loss, an ear injury or a problem with the circulatory system. For many
      people, tinnitus improves with treatment of the underlying cause or with other
      treatments that reduce or mask the noise, making tinnitus less noticeable.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Tinnitus is most often described as a ringing in the ears, even though
      no external sound is present. However, tinnitus can also cause other types of
      phantom noises in your ears, including:'
  - type: list
    ordered: false
    items:
    - Buzzing
    - Roaring
    - Clicking
    - Hissing
    - Humming
  - type: paragraph
    text: Most people who have tinnitus have subjective tinnitus, or tinnitus that
      only you can hear. The noises of tinnitus may vary in pitch from a low roar
      to a high squeal, and you may hear it in one or both ears. In some cases, the
      sound can be so loud it interferes with your ability to concentrate or hear
      external sound. Tinnitus may be present all the time, or it may come and go.
  - type: paragraph
    text: In rare cases, tinnitus can occur as a rhythmic pulsing or whooshing sound,
      often in time with your heartbeat. This is called pulsatile tinnitus. If you
      have pulsatile tinnitus, your doctor may be able to hear your tinnitus when
      he or she does an examination (objective tinnitus).
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Some people aren't very bothered by tinnitus. For other people, tinnitus
        disrupts their daily lives. If you have tinnitus that bothers you, see your
        doctor.
    subsections:
    - heading: 'Make an appointment to see your doctor if:'
      level: 4
      content:
      - type: list
        ordered: false
        items:
        - You develop tinnitus after an upper respiratory infection, such as a cold,
          and your tinnitus doesn't improve within a week.
      subsections: []
    - heading: 'See your doctor as soon as possible if:'
      level: 4
      content:
      - type: list
        ordered: false
        items:
        - You have hearing loss or dizziness with the tinnitus.
        - You are experiencing anxiety or depression as a result of your tinnitus.
      subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: A number of health conditions can cause or worsen tinnitus. In many cases,
      an exact cause is never found.
  subsections:
  - heading: Common causes of tinnitus
    level: 3
    content:
    - type: paragraph
      text: 'In many people, tinnitus is caused by one of the following:'
    - type: list
      ordered: false
      items:
      - Hearing loss. There are tiny, delicate hair cells in your inner ear (cochlea)
        that move when your ear receives sound waves. This movement triggers electrical
        signals along the nerve from your ear to your brain (auditory nerve). Your
        brain interprets these signals as sound. If the hairs inside your inner ear
        are bent or broken — this happens as you age or when you are regularly exposed
        to loud sounds — they can "leak" random electrical impulses to your brain,
        causing tinnitus.
      - Ear infection or ear canal blockage. Your ear canals can become blocked with
        a buildup of fluid (ear infection), earwax, dirt or other foreign materials.
        A blockage can change the pressure in your ear, causing tinnitus.
      - Head or neck injuries. Head or neck trauma can affect the inner ear, hearing
        nerves or brain function linked to hearing. Such injuries usually cause tinnitus
        in only one ear.
      - Medications. A number of medications may cause or worsen tinnitus. Generally,
        the higher the dose of these medications, the worse tinnitus becomes. Often
        the unwanted noise disappears when you stop using these drugs. Medications
        known to cause tinnitus include nonsteroidal anti-inflammatory drugs (NSAIDs)
        and certain antibiotics, cancer drugs, water pills (diuretics), antimalarial
        drugs and antidepressants.
    - type: paragraph
      text: Hearing loss. There are tiny, delicate hair cells in your inner ear (cochlea)
        that move when your ear receives sound waves. This movement triggers electrical
