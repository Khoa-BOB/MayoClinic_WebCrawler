title: Orchitis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Orchitis (or-KIE-tis) refers to infection or swelling and irritation, called
      inflammation, of one or both testicles. Infections are common causes of orchitis.
      These include sexually transmitted infections (STIs) and infection with the
      mumps virus.
  - type: paragraph
    text: Orchitis often is linked with an infection of the epididymis, which is the
      coiled tube at the back of the testicle that stores and carries sperm. The infection
      of the epididymis is called epididymitis. With orchitis, the condition is called
      epididymo-orchitis.
  - type: paragraph
    text: Orchitis may cause pain and swelling. It is typically treated with supportive
      underwear, cold packs, medicines called anti-inflammatories and, in some instances,
      medicines called antibiotics. But it can take several weeks or even months for
      tenderness in the scrotum to go away.
  - type: paragraph
    text: Rarely, severe orchitis can affect being able to have children, called fertility.
      This most often happens in people who get the infection during childhood or
      the teen years.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Orchitis symptoms most often come on quickly. They can include:'
  - type: list
    ordered: false
    items:
    - Swelling in one or both testicles.
    - Pain ranging from mild to very bad.
    - Fever.
    - Nausea and vomiting.
    - Feeling ill, called malaise.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: For pain or swelling in your scrotum that comes on quickly, see your healthcare
        professional right away.
    - type: paragraph
      text: A number of conditions can cause testicle pain. Many go away on their
        own. But some need treatment right away.
    - type: paragraph
      text: One such condition involves twisting of the spermatic cord, called testicular
        torsion. The pain of this might feel like the pain of orchitis. Your healthcare
        professional can do tests to find out which condition is causing your pain.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Infection with a virus or bacteria can cause orchitis. Sometimes a cause
      can't be found.
  subsections:
  - heading: Bacterial orchitis
    level: 3
    content:
    - type: paragraph
      text: Most often, bacterial orchitis is linked with or is the result of epididymitis.
        An infection of the urethra or bladder that spreads to the epididymis most
        often causes epididymitis. Sometimes, an STI is the cause. But this is a less
        common cause of orchitis in adults.
    subsections: []
  - heading: Viral orchitis
    level: 3
    content:
    - type: paragraph
      text: The mumps virus most often causes viral orchitis. Nearly one-third of
        people assigned male at birth who get the mumps after puberty get orchitis.
        This most often happens 4 to 7 days after the mumps start. Thanks to routine
        childhood vaccinations for the mumps, mumps orchitis happens less often than
        it used to.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Factors that raise the risk of orchitis include untreated conditions that
      block the urinary tract. These include prostate enlargement or scar tissue in
      the urethra, called urethral stricture.
  - type: paragraph
    text: Procedures done through the urethra also raise the risk of orchitis. These
      include having a tube, called a catheter, or a scope in the bladder.
  - type: paragraph
    text: The main risk factor for mumps orchitis is not getting the mumps vaccine.
  - type: paragraph
    text: 'Sexual behaviors that can lead to STIs put you at risk of sexually transmitted
      orchitis. Those behaviors include having:'
  - type: list
    ordered: false
    items:
    - More than one sexual partner.
    - Sex with a partner who has an STI.
    - Sex without a condom.
    - A personal history of an STI.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Most often, orchitis gets better with supportive care. It can take several
      weeks or months before the pain and swelling go away. Rarely, complications
      of orchitis may include:'
  - type: list
    ordered: false
    items:
    - Testicular atrophy. Over time, orchitis can cause the affected testicle to shrink.
    - Scrotal abscess. The infected tissue fills with pus.
    - Infertility. Sometimes, orchitis can cause you to not be able to have a child,
      called infertility. Or it can cause the body to make too little testosterone,
      a condition called hypogonadism. But these are less likely to happen if orchitis
      affects only one testicle.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'To help prevent orchitis:'
  - type: list
    ordered: false
    items:
    - Get the vaccine against mumps, the most common cause of viral orchitis.
    - Practice safe sex to help protect against STIs that can cause bacterial orchitis.
    - Talk with your healthcare professional if you have trouble with urination. That
      may mean you have a blockage or other condition that can lead to orchitis.
  subsections: []
