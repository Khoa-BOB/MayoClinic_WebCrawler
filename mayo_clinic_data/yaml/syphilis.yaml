title: Syphilis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Syphilis is an infection caused by bacteria. Most often, it spreads through
      sexual contact. The disease starts as a sore that's often painless and typically
      appears on the genitals, rectum or mouth. Syphilis spreads from person to person
      through direct contact with these sores. It also can be passed to a baby during
      pregnancy and childbirth and sometimes through breastfeeding.
  - type: paragraph
    text: After the infection happens, syphilis bacteria can stay in the body for
      many years without causing symptoms. But the infection can become active again.
      Without treatment, syphilis can damage the heart, brain or other organs. It
      can become life-threatening.
  - type: paragraph
    text: Early syphilis can be cured, sometimes with a single shot of medicine called
      penicillin. That's why it's key to get a health care checkup as soon as you
      notice any symptoms of syphilis. All pregnant people should get tested for syphilis
      at their first prenatal checkup too.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Syphilis develops in stages. The symptoms vary with each stage. But the
      stages may overlap. And the symptoms don't always happen in the same order.
      You may be infected with syphilis bacteria without noticing any symptoms for
      years.
  subsections:
  - heading: Primary syphilis
    level: 3
    content:
    - type: paragraph
      text: The first symptom of syphilis is a small sore called a chancre (SHANG-kur).
        The sore is often painless. It appears at the spot where the bacteria entered
        your body. Most people with syphilis develop only one chancre. Some people
        get more than one.
    - type: paragraph
      text: The chancre often forms about three weeks after you come in contact with
        syphilis bacteria. Many people who have syphilis don't notice the chancre.
        That's because it's usually painless. It also may be hidden within the vagina
        or rectum. The chancre heals on its own within 3 to 6 weeks.
    subsections: []
  - heading: Secondary syphilis
    level: 3
    content:
    - type: paragraph
      text: You may get a rash while the first chancre heals or a few weeks after
        it heals.
    - type: paragraph
      text: 'A rash caused by syphilis:'
    - type: list
      ordered: false
      items:
      - Often is not itchy.
      - May look rough, red or reddish-brown.
      - Might be so faint that it's hard to see.
    - type: paragraph
      text: The rash often starts on the trunk of the body. That includes the chest,
        stomach area, pelvis and back. In time, it also could appear on the limbs,
        the palms of the hands and the soles of the feet.
    - type: paragraph
      text: 'Along with the rash, you may have symptoms such as:'
    - type: list
      ordered: false
      items:
      - Wartlike sores in the mouth or genital area.
      - Hair loss.
      - Muscle aches.
      - Fever.
      - Sore throat.
      - Tiredness, also called fatigue.
      - Weight loss.
      - Swollen lymph nodes.
    - type: paragraph
      text: Symptoms of secondary syphilis may go away on their own. But without treatment,
        they could come and go for months or years.
    subsections: []
  - heading: Latent syphilis
    level: 3
    content:
    - type: paragraph
      text: If you aren't treated for syphilis, the disease moves from the secondary
        stage to the latent stage. This also is called the hidden stage because you
        have no symptoms. The latent stage can last for years. Your symptoms may never
        come back. But without treatment, the disease might lead to major health problems,
        also called complications.
    subsections: []
  - heading: Tertiary syphilis
    level: 3
    content:
    - type: paragraph
      text: After the latent stage, up to 30% to 40% of people with syphilis who don't
        get treatment have complications known as tertiary syphilis. Another name
        for it is late syphilis.
    - type: paragraph
      text: 'The disease may damage the:'
    - type: list
      ordered: false
      items:
      - Brain.
      - Nerves.
      - Eyes.
      - Heart.
      - Blood vessels.
      - Liver.
      - Bones and joints.
    - type: paragraph
      text: These problems may happen many years after the original, untreated infection.
    subsections: []
  - heading: Syphilis that spreads
    level: 3
    content:
    - type: paragraph
      text: At any stage, untreated syphilis can affect the brain, spinal cord, eyes
        and other body parts. This can cause serious or life-threatening health problems.
    subsections: []
  - heading: Congenital syphilis
    level: 3
    content:
    - type: paragraph
      text: Pregnant people who have syphilis can pass the disease to their babies.
        Unborn babies can become infected through the organ that provides nutrients
        and oxygen in the womb, called the placenta. Infection also can happen during
        birth.
    - type: paragraph
      text: 'Newborns with congenital syphilis might have no symptoms. But without
        fast treatment, some babies might get:'
    - type: list
      ordered: false
      items:
      - Sores and rashes on the skin.
      - Fever.
      - A type of discolored skin and eyes, called jaundice.
      - Not enough red blood cells, called anemia.
      - Swollen spleen and liver.
      - Sneezing or stuffed, drippy nose, called rhinitis.
      - Bone changes.
    - type: paragraph
      text: Later symptoms may include deafness, teeth problems and saddle nose, a
        condition in which the bridge of the nose collapses.
    - type: paragraph
      text: Babies with syphilis also can be born too early. They may die in the womb
        before birth. Or they could die after birth.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Call a member of your health care team if you or your child has any symptoms
        of syphilis. These could include any unusual discharge, a sore or a rash,
        especially in the groin area.
    - type: paragraph
      text: 'Also get tested for syphilis if you:'
    - type: list
      ordered: false
      items:
      - Have had sexual contact with someone who might have the disease.
      - Have another sexually transmitted disease such as HIV.
      - Are pregnant.
      - Regularly have sex with more than one partner.
      - Have unprotected sex, meaning sex without a condom.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The cause of syphilis is a bacterium called Treponema pallidum. The most
      common way syphilis spreads is through contact with an infected person's sore
      during vaginal, oral or anal sex.
  - type: paragraph
    text: The bacteria enter the body through minor cuts or scrapes in the skin or
      in the moist inner lining of some body parts.
  - type: paragraph
    text: Syphilis is contagious during its primary and secondary stages. Sometimes
      it's also contagious in the early latent period, which happens within a year
      of getting infected.
  - type: paragraph
    text: Less often, syphilis can spread by kissing or touching an active sore on
      the lips, tongue, mouth, breasts or genitals. It also can be passed to babies
      during pregnancy and childbirth and sometimes through breastfeeding.
  - type: paragraph
    text: Syphilis can't be spread through casual contact with objects that an infected
      person has touched.
  - type: paragraph
    text: So you can't catch it by using the same toilet, bathtub, clothing, eating
      utensils, doorknobs, swimming pools or hot tubs.
  - type: paragraph
    text: Once cured, syphilis doesn't come back on its own. But you can become infected
      again if you have contact with someone's syphilis sore.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'The risk of catching syphilis is higher if you:'
  - type: list
    ordered: false
    items:
    - Have unprotected sex.
    - Have sex with more than one partner.
    - Live with HIV, the virus that causes AIDS if untreated.
  - type: paragraph
    text: The chances of getting syphilis also are higher for men who have sex with
      men. The higher risk may be linked, in part, with less access to health care
      and less use of condoms among this group. Another risk factor for some people
      in this group includes recent sex with partners found through social media apps.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Without treatment, syphilis can lead to damage throughout the body. Syphilis
      also raises the risk of HIV infection and can cause problems during pregnancy.
      Treatment can help prevent damage. But it can't repair or reverse damage that's
      already happened.
  subsections:
  - heading: Small bumps or growths
    level: 3
    content:
    - type: paragraph
      text: Rarely in the late stage of syphilis, bumps called gummas can form on
        the skin, bones, liver or any other organ. Most often, gummas go away after
        treatment with medicine called antibiotics.
    subsections: []
  - heading: Neurological problems
    level: 3
    content:
    - type: paragraph
      text: 'Syphilis can cause many problems with the brain, its covering or the
        spinal cord. These issues include:'
    - type: list
      ordered: false
      items:
      - Headache.
      - Stroke.
      - Meningitis, a disease that inflames the protective layers of tissue around
        the brain and spinal cord.
      - Confusion, personality changes or trouble focusing.
      - Symptoms that mimic dementia, such as loss of memory, judgment and decision-making
        skills.
      - Not being able to move certain body parts, called paralysis.
      - Trouble getting or keeping an erection, called erectile dysfunction.
      - Bladder problems.
    subsections: []
  - heading: Eye problems
    level: 3
    content:
    - type: paragraph
      text: 'Disease that spreads to the eye is called ocular syphilis. It can cause:'
    - type: list
      ordered: false
      items:
      - Eye pain or redness.
      - Vision changes.
      - Blindness.
    subsections: []
  - heading: Ear problems
    level: 3
    content:
    - type: paragraph
      text: 'Disease that spreads to the ear is called otosyphilis. Symptoms can include:'
    - type: list
      ordered: false
      items:
      - Hearing loss.
      - Ringing in the ears, called tinnitus.
      - Feeling like you or the world around you is spinning, called vertigo.
    subsections: []
  - heading: Heart and blood vessel problems
    level: 3
    content:
    - type: paragraph
      text: These may include bulging and swelling of the aorta — the body's major
        artery — and other blood vessels. Syphilis also may damage heart valves.
    subsections: []
  - heading: HIV infection
    level: 3
    content:
    - type: paragraph
      text: Syphilis sores on the genitals raise the risk of catching or spreading
        HIV through sex. A syphilis sore can bleed easily. This provides an easy way
        for HIV to enter the bloodstream during sex.
    subsections: []
  - heading: Pregnancy and childbirth complications
    level: 3
    content:
    - type: paragraph
      text: If you're pregnant, you could pass syphilis to your unborn baby. Congenital
        syphilis greatly raises the risk of miscarriage, stillbirth or your newborn's
        death within a few days after birth.
    subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'There is no vaccine for syphilis. To help prevent the spread of syphilis,
      follow these tips:'
  - type: list
    ordered: false
    items:
    - Have safe sex or no sex. The only certain way to avoid contact with syphilis
      bacteria is not to have sex. This is called abstinence. If a person is sexually
      active, safer sex means a long-term relationship in which you and your partner
      have sex only with each other, and neither of you is infected. Before you have
      sex with someone new, you should both get tested for syphilis and other sexually
      transmitted infections (STIs).
    - Use a latex condom. Condoms can lower your risk of getting or spreading syphilis.
      But condoms work only if they cover an infected person's syphilis sores. Other
      types of birth control do not lower your risk of syphilis.
    - Be careful with alcohol and stay away from street drugs. Drinking too much alcohol
      or taking drugs can get in the way of your judgment. Either can lead to unsafe
      sex.
    - Do not douche. It can remove some of the healthy bacteria that's usually in
      the vagina. And that might raise your risk of getting STIs.
    - Breastfeed with caution. Syphilis can pass from a parent to a baby during breastfeeding
      if sores are on one or both breasts. This can happen when the baby or pumping
      equipment touches a sore. To keep that from happening, pump or hand-express
      breastmilk from the breast with sores. Do so until the sores heal. If your pump
      touches a sore, get rid of the milk you just pumped.
  - type: paragraph
    text: A medicine called doxycycline may be an option to prevent infection among
      people who have a higher risk than average of getting syphilis. Higher risk
      groups include men who have sex with men and transgender women.
  - type: paragraph
    text: Taking doxycycline within 3 days of sexual activity lowers the risk of an
      infection with the bacteria that cause syphilis. Your healthcare professional
      can prescribe doxycycline and any testing you need while taking the medicine.
  subsections:
  - heading: Partner notification
    level: 3
    content:
    - type: paragraph
      text: If tests show that you have syphilis, your sex partners need to know so
        that they can get tested. This includes your current partners and any others
        you've had over the last three months to 1 year. If they're infected, they
        can then get treatment.
    - type: paragraph
      text: After you learn you have syphilis, your local health department may contact
        you. A department employee talks with you about private ways to let your partners
        know that they've been exposed to syphilis. You can ask the department to
        do this for you without revealing your identity to your partners.
    - type: paragraph
      text: Or you can contact your partners along with a department employee or simply
        tell your partners yourself. This free service is called partner notification.
        It can help limit the spread of syphilis. The practice also steers those at
        risk toward counseling and the right treatment.
    - type: paragraph
      text: And since you can get syphilis more than once, partner notification lowers
        your risk of getting infected again.
    subsections: []
  - heading: Screening tests for pregnant people
    level: 3
    content:
    - type: paragraph
      text: You can be infected with syphilis and not know it. And the disease can
        have deadly effects on unborn babies. For this reason, health officials recommend
        that all pregnant people be tested for the disease.
    subsections: []
