title: Mosquito bites
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Mosquito bites are the itchy bumps that form on the skin after mosquitoes
      feed on your blood. The bumps usually go away without treatment in a few days.
      Some mosquito bites may get very swollen, sore and inflamed. This type of reaction,
      sometimes called skeeter syndrome, is most common in children.
  - type: paragraph
    text: Mosquito bites can cause severe illnesses if the insects carry certain viruses
      or parasites. Infected mosquitoes can spread West Nile virus, Zika virus, and
      the viruses that cause malaria, yellow fever and some types of brain infection.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Mosquito bites often happen on parts of the body that aren''t covered by
      clothing. Symptoms include:'
  - type: list
    ordered: false
    items:
    - An itchy, inflamed bump that forms a few minutes after a bite
    - A painful spot that looks like a hive and forms within 24 hours after a bite
    - Small blisters
  - type: paragraph
    text: 'A severe reaction to mosquito bites can cause:'
  - type: list
    ordered: false
    items:
    - A large, swollen, inflamed area
    - A hive-like rash
    - Swelling around the eyes
  - type: paragraph
    text: Children are more likely to have a severe reaction than are adults.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Contact your health care provider if the mosquito bites seem to occur
        with warning signs of a serious condition. These might include a high fever,
        severe headache, body aches and signs of infection.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Mosquito bites are caused by female mosquitoes feeding on your blood. As
      a biting mosquito fills itself with blood, it injects saliva into your skin.
      The saliva triggers an immune system reaction that results in the classic itching
      and bump.
  - type: paragraph
    text: Mosquitoes are attracted to smells, such as from sweat, floral scents and
      exhaled carbon dioxide.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk factors for mosquito bites include:'
  - type: list
    ordered: false
    items:
    - Sweating
    - Wearing floral scents
    - Living in an area where mosquitoes are active
    - Spending time outside without using mosquito repellent
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Scratching bites can lead to infection.
  - type: paragraph
    text: Mosquitoes can carry the viruses that cause certain diseases, such as West
      Nile virus and the viruses that cause malaria, yellow fever and dengue fever.
      The mosquito gets a virus or parasite by biting an infected person or animal.
      Then when it's biting you, the mosquito can transfer that virus or parasite
      to you through its saliva. West Nile, dengue fever and some types of encephalitis
      occur in the United States. Other diseases, such as malaria and yellow fever,
      are far more common in tropical areas of the world.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: Mosquitos bite during both day and night, and they can live indoors. You
      can take several steps to protect yourself from mosquito bites.
  subsections:
  - heading: Avoid and exclude mosquitoes
    level: 3
    content:
    - type: paragraph
      text: 'Limit exposure to mosquitoes by:'
    - type: list
      ordered: false
      items:
      - Repairing any tears in the screens on windows, doors and camping gear
      - Using mosquito netting over strollers and cribs
      - Using mosquito netting when sleeping outdoors
      - Selecting self-care products that don't have scents
    subsections: []
  - heading: Use insect repellent
    level: 3
    content:
    - type: paragraph
      text: 'Use insect repellent when mosquitoes are active. The most effective insect
        repellents in the United States include one of these active ingredients:'
    - type: list
      ordered: false
      items:
      - DEET
      - Icaridin, also called picaridin
      - Oil of lemon eucalyptus
      - IR3535
      - Para-menthane-diol (PMD)
      - 2-Undecanone
    - type: paragraph
      text: These ingredients temporarily repel mosquitoes and ticks. DEET may offer
        longer lasting protection. Whichever product you choose, read the label before
        you apply it. If you're using a spray repellent, apply it outdoors and away
        from food. You may need to reapply it 6 to 8 hours later if you're still in
        an area where mosquitoes are active.
    - type: paragraph
      text: If you're also using sunscreen, put it on first, about 20 minutes before
        applying the repellent. Avoid products that have both sunscreen and repellent,
        because you'll likely need to reapply sunscreen more often than repellent.
        And it's best to use only as much repellent as you need and to wash your hands
        after applying it.
    - type: paragraph
      text: 'Used according to package directions, these products are generally safe
        for children and adults, with a few exceptions:'
    - type: list
      ordered: false
      items:
      - Don't use DEET-containing products on infants younger than 2 months.
      - Don't use icaridin on infants younger than 6 months.
      - Check the labels of products with oil of lemon eucalyptus — some aren't suitable
        for children under 3 years old.
      - Don't use para-menthane-diol on children under 3 years old.
      - Don't let young children get insect repellent on their hands, as they might
        get it in their mouths.
      - Don't apply repellent near the eyes and mouth.
      - Don't apply repellent under clothing.
      - Don't apply repellent over sunburns, cuts, wounds or rashes.
      - When the risk of mosquito bites has passed, wash repellent off the skin with
        soap and water.
    subsections: []
  - heading: Treat clothing and outdoor gear
    level: 3
    content:
    - type: paragraph
      text: Permethrin is an insecticide and insect repellent used for added protection.
        This product is made to use on clothing and outdoor gear, not skin. Check
        the product label for instructions. Some sporting goods stores sell clothing
        pretreated with permethrin. Don't wash bed nets or set them in sunlight, as
        this breaks down permethrin. Clothing sprayed with permethrin can offer protection
        for two washings and up to two weeks.
    subsections: []
  - heading: Use protective clothing and gear
    level: 3
    content:
    - type: paragraph
      text: Weather permitting, wear a hat, long-sleeved shirts and long pants.
    subsections: []
  - heading: Take preventive medicine
    level: 3
    content:
    - type: paragraph
      text: Get vaccinations or take preventive medicine that your health care provider
        has suggested.
    - type: paragraph
      text: Think about whether you tend to have large or severe reactions to mosquito
        bites — skeeter syndrome. You might want to take a nondrowsy, nonprescription
        antihistamine when you know you'll be exposed to mosquitoes.
    subsections: []
  - heading: Reduce mosquitoes around your home
    level: 3
    content:
    - type: paragraph
      text: 'Get rid of standing water, which mosquitoes need to breed. Take these
        steps to keep your house and yard free of mosquito pools:'
    - type: list
      ordered: false
      items:
      - Unclog roof gutters.
      - Empty children's wading pools at least once a week, and preferably more often.
      - Change water in birdbaths at least weekly.
      - Get rid of old tires in your yard.
      - Empty outdoor flower pots regularly or store them upside down so that they
        can't collect water.
      - Drain your fire pit if water collects there.
    subsections: []
