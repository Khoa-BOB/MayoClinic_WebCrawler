title: Achilles tendon rupture
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Achilles (uh-KILL-eez) tendon rupture is an injury that affects the back
      of your lower leg. It mainly occurs in people playing recreational sports, but
      it can happen to anyone.
  - type: paragraph
    text: The Achilles tendon is a strong fibrous cord that connects the muscles in
      the back of your calf to your heel bone. If you overstretch your Achilles tendon,
      it can tear (rupture) completely or just partially.
  - type: paragraph
    text: If your Achilles tendon ruptures, you might hear a pop, followed by an immediate
      sharp pain in the back of your ankle and lower leg that is likely to affect
      your ability to walk properly. Surgery is often performed to repair the rupture.
      For many people, however, nonsurgical treatment works just as well.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Although it''s possible to have no signs or symptoms with an Achilles tendon
      rupture, most people have:'
  - type: list
    ordered: false
    items:
    - The feeling of having been kicked in the calf
    - Pain, possibly severe, and swelling near the heel
    - An inability to bend the foot downward or "push off" the injured leg when walking
    - An inability to stand on the toes on the injured leg
    - A popping or snapping sound when the injury occurs
  subsections:
  - heading: When to see your doctor
    level: 3
    content:
    - type: paragraph
      text: Seek medical advice immediately if you hear a pop in your heel, especially
        if you can't walk properly afterward.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Your Achilles tendon helps you point your foot downward, rise on your toes
      and push off your foot as you walk. You rely on it virtually every time you
      walk and move your foot.
  - type: paragraph
    text: Rupture usually occurs in the section of the tendon situated within 2 1/2
      inches (about 6 centimeters) of the point where it attaches to the heel bone.
      This section might be prone to rupture because blood flow is poor, which also
      can impair its ability to heal.
  - type: paragraph
    text: 'Ruptures often are caused by a sudden increase in the stress on your Achilles
      tendon. Common examples include:'
  - type: list
    ordered: false
    items:
    - Increasing the intensity of sports participation, especially in sports that
      involve jumping
    - Falling from a height
    - Stepping into a hole
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that may increase your risk of Achilles tendon rupture include:'
  - type: list
    ordered: false
    items:
    - Age. The peak age for Achilles tendon rupture is 30 to 40.
    - Sex. Achilles tendon rupture is up to five times more likely to occur in men
      than in women.
    - Recreational sports. Achilles tendon injuries occur more often during sports
      that involve running, jumping, and sudden starts and stops — such as soccer,
      basketball and tennis.
    - Steroid injections. Doctors sometimes inject steroids into an ankle joint to
      reduce pain and inflammation. However, this medication can weaken nearby tendons
      and has been associated with Achilles tendon ruptures.
    - Certain antibiotics. Fluoroquinolone antibiotics, such as ciprofloxacin (Cipro)
      or levofloxacin (Levaquin), increase the risk of Achilles tendon rupture.
    - Obesity. Excess weight puts more strain on the tendon.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'To reduce your chance of developing Achilles tendon problems, follow these
      tips:'
  - type: list
    ordered: false
    items:
    - Stretch and strengthen calf muscles. Stretch your calf until you feel a noticeable
      pull but not pain. Don't bounce during a stretch. Calf-strengthening exercises
      can also help the muscle and tendon absorb more force and prevent injury.
    - Vary your exercises. Alternate high-impact sports, such as running, with low-impact
      sports, such as walking, biking or swimming. Avoid activities that place excessive
      stress on your Achilles tendons, such as hill running and jumping activities.
    - Choose running surfaces carefully. Avoid or limit running on hard or slippery
      surfaces. Dress properly for cold-weather training, and wear well-fitting athletic
      shoes with proper cushioning in the heels.
    - Increase training intensity slowly. Achilles tendon injuries commonly occur
      after an abrupt increase in training intensity. Increase the distance, duration
      and frequency of your training by no more than 10 percent weekly.
  subsections: []
