title: Constipation
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Constipation is a problem with passing stool. Constipation generally means
      passing fewer than three stools a week or having a difficult time passing stool.
  - type: paragraph
    text: Constipation is fairly common. A lack of dietary fiber, fluids and exercise
      can cause constipation. But other medical conditions or certain medicines may
      be the cause.
  - type: paragraph
    text: Constipation is usually treated with changes in diet and exercise or with
      nonprescription medicines. Constipation may require medicines, changes in medicines
      or other treatments prescribed by a health care professional.
  - type: paragraph
    text: Long-term constipation, also called chronic constipation, may require treating
      another disease or condition that can cause or worsen constipation.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of constipation include:'
  - type: list
    ordered: false
    items:
    - Fewer than three stools a week.
    - Hard, dry or lumpy stools.
    - Straining or pain when passing stools.
    - A feeling that not all stool has passed.
    - A feeling that the rectum is blocked.
    - The need to use a finger to pass stool.
  - type: paragraph
    text: Chronic constipation is having two or more of these symptoms for three months
      or longer.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'Make an appointment with your health care professional if you have constipation
        with any of the following conditions:'
    - type: list
      ordered: false
      items:
      - Symptoms that last longer than three weeks.
      - Symptoms that make it difficult to do everyday activities.
      - Bleeding from your rectum or blood on toilet tissue.
      - Blood in your stools or black stools.
      - Other unusual changes in the shape or color of stools.
      - Stomach pain that doesn't stop.
      - Weight loss without trying.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Patterns of bowel movements vary from one person to another. The typical
      range is three times a day to three times a week. So it's important to know
      what is typical for you.
  - type: paragraph
    text: In general, constipation occurs when stool moves too slowly through the
      large intestine, also called the colon. If the stool moves slowly, the body
      absorbs too much water from the stool. The stool can become hard, dry and difficult
      to pass.
  subsections:
  - heading: Lifestyle causes
    level: 3
    content:
    - type: paragraph
      text: 'Slow stool movement may happen when a person does not:'
    - type: list
      ordered: false
      items:
      - Drink enough fluids.
      - Eat enough dietary fiber.
      - Exercise regularly.
      - Use the toilet when there's an urge to pass stool.
    subsections: []
  - heading: Medicines
    level: 3
    content:
    - type: paragraph
      text: 'Constipation may be a side effect of some medicines, particularly opioid
        pain relievers. Other medicines that may cause constipation include some that
        treat the following conditions:'
    - type: list
      ordered: false
      items:
      - Pain.
      - High blood pressure.
      - Seizures.
      - Depression.
      - Disorders of the nervous system.
      - Allergies.
    subsections: []
  - heading: Problems with pelvic floor muscles
    level: 3
    content:
    - type: paragraph
      text: The muscles that hold up organs at the bottom of the torso are called
        the pelvic floor muscles. The ability both to relax these muscles and to bear
        down are necessary to pass stool from the rectum. Problems with weakness or
        coordination of these muscles can cause chronic constipation.
    subsections: []
  - heading: Blockages in the colon or rectum
    level: 3
    content:
    - type: paragraph
      text: Damage or changes to tissues in the colon or rectum can block the passage
        of stool. Also, tumors in the colon, rectum or nearby tissues can cause a
        blockage.
    subsections: []
  - heading: Other factors
    level: 3
    content:
    - type: paragraph
      text: 'A number of conditions can affect the work of muscles, nerves or hormones
        involved in passing stool. Chronic constipation may be linked to any number
        of things, including:'
    - type: list
      ordered: false
      items:
      - Irritable bowel syndrome.
      - Diabetes.
      - Multiple sclerosis.
      - Nerve dysfunction or damage.
      - Overactive thyroid, also called hyperthyroidism.
      - Parkinson's disease.
      - Pregnancy.
    - type: paragraph
      text: Sometimes, the cause of chronic constipation can't be found.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that may increase your risk of chronic constipation include:'
  - type: list
    ordered: false
    items:
    - Being an older adult
    - Being a woman
    - Getting little or no physical activity
    - Having a mental health condition such as depression or an eating disorder
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Complications of chronic constipation include:'
  - type: list
    ordered: false
    items:
    - Swollen tissues around the anus, also called hemorrhoids.
    - Torn tissues of the anus, also called anal fissures.
    - Hard stools backed up into the colon, also called fecal impaction.
    - Exposed tissues of the rectum that have slipped out of the anal opening, also
      called rectal prolapse.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: The following tips can help you avoid developing constipation.
  - type: list
    ordered: false
    items:
    - Eat lots of high-fiber foods, including vegetables, fruits, beans and whole-grain
      foods.
    - Eat fewer foods with low amounts of fiber such as processed foods, dairy and
      meats.
    - Drink plenty of fluids.
    - Stay active and exercise regularly.
    - Don't ignore the urge to pass stool.
    - Create a regular schedule for passing stool, especially after a meal.
  subsections: []
