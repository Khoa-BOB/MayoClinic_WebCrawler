title: Chronic hives
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Hives — also called urticaria (ur-tih-KAR-e-uh) — is a skin reaction that
      causes itchy welts. Chronic hives are welts that last for more than six weeks
      and return often over months or years. Often, the cause of chronic hives isn't
      clear.
  - type: paragraph
    text: The welts often start as itchy patches that turn into swollen welts that
      vary in size. These welts appear and fade at random as the reaction runs its
      course. Each individual welt typically lasts less than 24 hours.
  - type: paragraph
    text: Chronic hives can be very uncomfortable and interfere with sleep and daily
      activities. For many people, anti-itch medicines, called antihistamines, provide
      relief.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of chronic hives include:'
  - type: list
    ordered: false
    items:
    - Batches of welts, called weals, that can arise anywhere on the body.
    - Welts that might be red, purple or skin-colored, depending on your skin color.
    - Welts that vary in size, change shape, and appear and fade repeatedly.
    - Itchiness, also called pruritus, which can be intense.
    - Painful swelling, called angioedema, around the eyes, cheeks or lips.
    - Flares triggered by heat, exercise or stress.
    - Symptoms that persist for more than six weeks and recur often and anytime, sometimes
      for months or years.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See a healthcare professional if you have severe hives or hives that last
        for more than a few days.
    subsections: []
  - heading: Seek emergency medical care
    level: 3
    content:
    - type: paragraph
      text: Chronic hives do not put you at sudden risk of a serious allergic reaction,
        called anaphylaxis. If you get hives as part of a severe allergic reaction,
        seek emergency care. Symptoms of anaphylaxis include dizziness, trouble breathing,
        and swelling of the tongue, lips, mouth or throat.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The welts that come with hives are caused by the release of immune system
      chemicals, such as histamine, into your bloodstream. It's often not known why
      chronic hives happen or why short-term hives sometimes turn into a long-term
      problem.
  - type: paragraph
    text: 'The skin reaction may be triggered by:'
  - type: list
    ordered: false
    items:
    - Heat or cold.
    - Sunlight.
    - Vibration, such as caused by jogging or using lawn mowers.
    - Pressure on the skin, as from a tight waistband.
    - Medical conditions, such as thyroid disease, infection, allergy and cancer.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: In most cases, chronic hives is not predictable. In some people, the risk
      of chronic hives increases if they have certain medical conditions. These include
      infection, thyroid disease, allergy, cancer and swelling of the blood vessels,
      called vasculitis.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Chronic hives don't put you at sudden risk of a serious allergic reaction,
      called anaphylaxis. If you do get hives as part of a severe allergic reaction,
      seek emergency care. Symptoms of anaphylaxis include dizziness, trouble breathing,
      and swelling of the tongue, lips, mouth or throat.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'To lower your likelihood of getting hives, use these self-care tips:'
  - type: list
    ordered: false
    items:
    - Avoid known triggers. If you know what has triggered your hives, try to avoid
      that substance.
    - Bathe and change your clothes. If pollen or animal contact has triggered your
      hives in the past, take a bath or shower and change your clothes if you're exposed
      to pollen or animals.
  subsections: []
