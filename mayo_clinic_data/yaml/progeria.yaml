title: Progeria
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Progeria (pro-JEER-e-uh), also known as Hutchinson-Gilford progeria syndrome,
      is an extremely rare, progressive genetic disorder. It causes children to age
      rapidly, starting in their first two years of life.
  - type: paragraph
    text: Children with progeria generally appear healthy at birth. During the first
      year, symptoms such as slowed growth, loss of fat tissue and hair loss begin
      to appear.
  - type: paragraph
    text: Heart problems or strokes are the eventual cause of death in most children
      with progeria. The average life expectancy for a child with progeria is about
      15 years. Some with the condition may die younger and others may live longer,
      even to about 20 years.
  - type: paragraph
    text: There's no cure for progeria, but new treatments and research show some
      promise for managing symptoms and complications.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Usually within the first year of life, you'll notice that your child's growth
      has slowed. But motor development and intelligence are not affected.
  - type: paragraph
    text: 'Symptoms of this progressive disorder cause a distinctive appearance. They
      include:'
  - type: list
    ordered: false
    items:
    - Slowed growth and poor weight gain, with below-average height and weight.
    - Lack of fat that's stored just beneath the skin.
    - Head that is large compared with the face.
    - Small jaw, chin and mouth and thin lips.
    - Thin, curved nose with a slight hook at the end, which may look like a bird's
      beak.
    - Large eyes and eyelids that don't close completely.
    - Hair loss, including eyelashes and eyebrows.
    - Thin, spotty and wrinkled skin.
    - Veins easily seen through the skin.
    - High-pitched voice.
    - Premature aging.
  - type: paragraph
    text: 'Symptoms also include health issues:'
  - type: list
    ordered: false
    items:
    - Severe progressive heart and blood vessel disease, also known as cardiovascular
      disease.
    - Hardening and tightening of skin.
    - Delayed tooth formation and tooth shape that is not usual.
    - Some hearing loss.
    - Loss of fat under the skin and loss of muscle.
    - Problems with the growth and development of bones.
    - Joint problems, including stiff joints.
    - A hip that's forced out of the correct position, known as hip dislocation.
    - Dental problems.
    - No significant progression of puberty.
    - Insulin resistance, which means the body doesn't respond well to insulin made
      by an organ called the pancreas.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Progeria is usually found in infancy or early childhood. This often happens
        at regular checkups, when a baby first shows the distinctive signs of premature
        aging.
    - type: paragraph
      text: If you notice changes in your child that could be symptoms of progeria,
        or you have any concerns about your child's growth or development, make an
        appointment with your child's health care provider.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: A change in one gene causes progeria. This gene, known as lamin A (LMNA),
      makes a protein that's needed to hold the center of a cell, called the nucleus,
      together. When the LMNA gene has a change, a flawed lamin A protein called progerin
      is made. Progerin makes cells unstable and appears to lead to progeria's aging
      process.
  - type: paragraph
    text: The changed gene that causes progeria is rarely passed down in families.
      In most cases, the rare gene change that causes progeria happens by chance.
  subsections:
  - heading: Other similar syndromes
    level: 3
    content:
    - type: paragraph
      text: 'There are other syndromes that may include problems with progerin-like
        proteins. These conditions are called progeroid syndromes. The changed genes
        that cause these syndromes are passed down in families. They cause rapid aging
        and a shortened life span:'
    - type: list
      ordered: false
      items:
      - Wiedemann-Rautenstrauch syndrome, also known as neonatal progeroid syndrome,
        starts in the womb, with symptoms of aging apparent at birth.
      - Werner syndrome, also known as adult progeria, begins in the teen years or
        early adulthood. It causes premature aging and conditions more common in old
        age, such as cataracts and diabetes.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: There are no known factors, such as lifestyle or environmental issues, that
      increase the risk of having progeria or giving birth to a child with progeria.
      But the age of the father has been described as a possible risk factor. Progeria
      is extremely rare. If you've had one child with progeria, the chances of having
      a second child with progeria are slightly higher than the general population
      but are still low.
  - type: paragraph
    text: If you have a child with progeria, a genetic counselor can give you information
      about the risk of having other children with progeria.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Severe hardening of the arteries, known as atherosclerosis, is common in
      progeria. Arteries are blood vessels that carry nutrients and oxygen from the
      heart to the rest of the body. Atherosclerosis is a condition in which the walls
      of the arteries stiffen and thicken. This often limits blood flow. The condition
      especially affects arteries in the heart and brain.
  - type: paragraph
    text: 'Most children with progeria die of complications related to atherosclerosis,
      including:'
  - type: list
    ordered: false
    items:
    - Problems with blood vessels that supply the heart, resulting in heart attack
      and congestive heart failure.
    - Problems with blood vessels that supply the brain, resulting in stroke.
  - type: paragraph
    text: Other health problems frequently linked with aging — such as an increased
      cancer risk — usually don't develop as part of progeria.
  subsections: []
