title: Brain metastases
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Brain metastases happen when cancer cells spread from their original site
      to the brain. Any cancer can spread to the brain. But the most common types
      that spread are lung, breast, colon, kidney and melanoma.
  - type: paragraph
    text: Brain metastases may form one or more tumors in the brain. As they grow,
      they put pressure on surrounding brain tissue. This can cause symptoms such
      as headache, personality changes, confusion, seizures, vision changes, trouble
      speaking, numbness, weakness or loss of balance.
  - type: paragraph
    text: Treatment for people whose cancer has spread to the brain may include surgery,
      radiation therapy, immunotherapy, targeted therapy or chemotherapy. Other treatments
      might be used to decrease pain and symptoms caused by the cancer.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Symptoms caused by brain metastases can vary. They depend on location, size
      and how fast they're growing.
  - type: paragraph
    text: 'Symptoms of brain metastases include:'
  - type: list
    ordered: false
    items:
    - Headache, sometimes with vomiting or nausea.
    - Mental changes, such as increasing memory problems.
    - Seizures.
    - Weakness or numbness on one side of the body.
    - Vision changes.
    - Difficulty speaking or understanding language.
    - Loss of balance.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with your healthcare professional if you have persistent
        signs and symptoms that concern you. If you've been treated for cancer in
        the past, tell your doctor about your medical history.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Brain metastases occur when cancer cells break away from their original
      location. The cells may travel through the bloodstream or lymphatic system and
      spread to the brain.
  - type: paragraph
    text: Cancer that spreads from its original location is known by the name of the
      primary cancer. For example, cancer that has spread from the breast to the brain
      is called metastatic breast cancer, not brain cancer.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Any type of cancer can spread to the brain. Some of the types that are
      more likely to spread include:'
  - type: list
    ordered: false
    items:
    - Lung cancer.
    - Breast cancer.
    - Colon cancer.
    - Kidney cancer.
    - Melanoma.
  subsections: []
