title: TMJ disorders
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: The temporomandibular (tem-puh-roe-man-DIB-u-lur) joint, also called TMJ,
      acts like a sliding hinge. It connects the jawbone to the skull. There is one
      joint on each side of the jaw. TMJ disorders — a type of temporomandibular disorder
      or TMD — can cause pain in the jaw joint and in the muscles that control jaw
      movement.
  - type: paragraph
    text: The exact cause of TMJ disorder is often hard to determine. The pain may
      be due to a mix of factors, including habits such as teeth clenching, gum chewing
      and nail biting; stress; and painful conditions that occur along with TMJ disorder
      such as fibromyalgia, osteoarthritis or jaw injury. The habit of teeth clenching
      or grinding also is known as bruxism.
  - type: paragraph
    text: Most of the time, the pain and discomfort related to TMJ disorders lasts
      for only a limited time. Self-managed home care, physical therapy for the jaw
      and the use of a mouth guard can be effective in treating symptoms of TMJ disorder.
      Surgery is usually a last resort after conservative measures have failed. But
      surgical treatments may help some people with TMJ disorders.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of TMJ disorders may include:'
  - type: list
    ordered: false
    items:
    - Pain or tenderness in the jaw.
    - Pain in one or both temporomandibular joints.
    - Aching pain in and around the ear.
    - Having a hard time chewing or pain while chewing.
    - Aching facial pain.
    - Locking of the joint, making it hard to open or close your mouth.
    - Headache.
    - Neck pain.
    - Eye pain.
    - Tooth pain that occurs along with jaw tenderness.
  - type: paragraph
    text: TMJ disorders also can cause a clicking sound or grating sensation when
      you open your mouth or chew. But if there's no pain or limitation of movement
      related to your jaw clicking, it's likely that you won't need treatment.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Seek medical attention if you have constant pain or tenderness in your
        jaw that occurs suddenly or during jaw movements or if you can't open or close
        your jaw completely. Your dentist, TMJ specialist or other healthcare professional
        can discuss possible causes and treatments.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The temporomandibular joint combines a hinge action with sliding motions.
      The parts of the bones that work together in the joint are covered with cartilage
      and separated by a small shock-absorbing disk. This disk usually keeps the movement
      smooth.
  - type: paragraph
    text: 'Painful TMJ disorders can happen if:'
  - type: list
    ordered: false
    items:
    - The disk erodes or moves out of its proper relationship between the ball and
      socket of the joint.
    - Sprain or strain occurs in the ligaments or soft tissues associated with TMJ
      disorders.
    - Arthritis damages the joint's cartilage.
    - A blow or another impact damages the joint.
    - Jaw muscles are associated with TMJ spasms.
  - type: paragraph
    text: Many times, the cause of TMJ disorder has a variety of causes and is hard
      to identify.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that may raise the risk of getting TMJ disorders include:'
  - type: list
    ordered: false
    items:
    - Different types of arthritis, such as rheumatoid arthritis or osteoarthritis.
    - Jaw injury.
    - Habits such as gum chewing, nail biting, and grinding or clenching of teeth.
    - Certain connective tissue diseases.
    - Stress, post-traumatic stress disorder, anxiety or depression.
    - Conditions such as fibromyalgia, ankylosing spondylitis and sleep disturbances.
    - Smoking.
  subsections: []
