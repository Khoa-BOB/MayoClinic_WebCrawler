title: Median arcuate ligament syndrome (MALS)
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Median arcuate ligament syndrome, also called MALS, happens when the band
      of tissue in the upper belly area presses on the artery that sends blood to
      the stomach, spleen and liver. This tissue is called the median arcuate ligament.
      The artery is called the celiac artery.
  - type: paragraph
    text: The median arcuate ligament creates a pathway between the chest and belly
      area for the body's main blood vessel, called the aorta. Typically, the ligament
      goes across the aorta. The celiac artery sits just below the arch.
  - type: paragraph
    text: But sometimes, the ligament or arteries may be out of place. The ligament
      may put pressure on the celiac artery and the network of surrounding nerves,
      called the celiac plexus. This pressure can cause the symptoms of MALS . The
      condition can cause serious stomach pain in some people.
  - type: paragraph
    text: 'MALS can occur in anyone, even children. Other names for MALS are:'
  - type: list
    ordered: false
    items:
    - Celiac artery compression syndrome.
    - Celiac axis syndrome.
    - Dunbar syndrome.
  - type: paragraph
    text: Treatment involves surgery to release pressure from the ligament on the
      artery and nerves.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Pressure on the celiac artery doesn't always cause symptoms. MALS symptoms
      are mainly caused by pressure on the nerves.
  - type: paragraph
    text: 'Symptoms of MALS include:'
  - type: list
    ordered: false
    items:
    - Stomach pain after eating or exercising.
    - The stomach pain gets better by leaning forward or backward or standing while
      eating.
    - Fear of eating food because of pain.
    - Unintended weight loss.
    - Bloating.
    - Diarrhea.
    - Nausea and vomiting.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: There are many different causes of stomach pain. If your stomach pain
        continues despite home care, call your healthcare professional. You need a
        complete physical exam and tests to determine the specific cause.
    - type: paragraph
      text: 'If your stomach pain is bad and activity or movement makes it worse,
        call your healthcare professional immediately. Get medical help right away
        if your stomach pain occurs with:'
    - type: list
      ordered: false
      items:
      - Bloody stools.
      - Fever.
      - Nausea and vomiting that doesn't go away.
      - Severe tenderness when you touch your belly.
      - Swelling of the belly.
      - Yellowing of the skin or whites of the eyes, also called jaundice.
    - type: paragraph
      text: 'Sometimes upper stomach pain can be confused with chest pain. Sometimes
        chest pain can be due to a heart attack. Call 911 or emergency medical help
        if you have chest or upper stomach pain with or without any of the following
        symptoms:'
    - type: list
      ordered: false
      items:
      - Pressure, fullness or tightness in your chest.
      - Crushing or searing pain that spreads to your jaw, neck, shoulders, and one
        or both arms.
      - Pain that lasts more than a few minutes or gets worse with activity.
      - Shortness of breath.
      - Cold sweats.
      - Dizziness or weakness.
      - Nausea or vomiting.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The exact cause of median arcuate ligament syndrome, also called MALS, is
      not known.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Because the cause of MALS is poorly understood, the risk factors are unclear.
      Median arcuate ligament syndrome is more common in adults than in children.
      It also is more common among women than among men.
  - type: paragraph
    text: MALS also has been seen in identical twins, so genetics may play a role.
  - type: paragraph
    text: Some people have developed median arcuate ligament syndrome after pancreatic
      surgery or blunt injury to the upper stomach area.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: A complication of median arcuate ligament syndrome, also called MALS, is
      long-term pain, especially after meals. The pain can lead to a fear of eating
      and significant weight loss. The pain and related depression or anxiety can
      greatly impact quality of life. MALS symptoms may be vague. The symptoms can
      be similar to those of other conditions. It may take some time to get an accurate
      diagnosis.
  subsections: []
