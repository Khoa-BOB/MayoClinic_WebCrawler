title: Wet macular degeneration
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Wet macular degeneration is an eye condition that causes blurred vision
      or reduced central vision. It is a type of age-related macular degeneration
      where blood vessels leak fluid or blood into part of the retina known as the
      macula (MAK-u-luh). The macula is responsible for central vision.
  - type: paragraph
    text: Wet macular degeneration is one of two types of age-related macular degeneration.
      The other type, dry macular degeneration, is more common and less severe. The
      wet type always begins as the dry type.
  - type: paragraph
    text: Early detection and treatment of wet macular degeneration may help reduce
      vision loss. In some instances, early treatment may recover vision.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Wet macular degeneration symptoms usually appear suddenly and worsen quickly.
      They may include:'
  - type: list
    ordered: false
    items:
    - Visual distortions, such as straight lines that seem to be bent.
    - Reduced central vision in one or both eyes.
    - The need for brighter light when reading or doing close-up work.
    - Difficulty adjusting to low light levels, such as when entering a dimly lit
      restaurant or theater.
    - Increased blurriness of printed words.
    - Difficulty recognizing faces.
    - A well-defined blurry spot or blind spot in the field of vision.
  - type: paragraph
    text: Macular degeneration doesn't affect side vision, so it doesn't cause total
      blindness.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'See your eye care professional if:'
    - type: list
      ordered: false
      items:
      - You notice changes in your central vision.
      - You lose the ability to see fine detail.
    - type: paragraph
      text: These changes may be the first sign of macular degeneration, particularly
        if you're older than age 60.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: No one knows the exact cause of wet macular degeneration, but it develops
      in people who have dry macular degeneration. Of all people with age-related
      macular degeneration, about 20% have the wet form.
  - type: paragraph
    text: 'Wet macular degeneration can develop in different ways:'
  - type: list
    ordered: false
    items:
    - Vision loss caused by irregular blood vessel growth. Sometimes new blood vessels
      grow from the choroid under and into the macula. This growth isn't typical,
      and when it happens it's known as choroidal neovascularization. The choroid
      is the layer of blood vessels between the retina and the outer, firm coat of
      the eye, called the sclera. These blood vessels may leak fluid or blood, affecting
      the retina's function and leading to vision loss.
    - Vision loss caused by fluid buildup in the back of the eye. When fluid leaks
      from the choroid, it can collect between the thin cell layer called the retinal
      pigment epithelium and the retina or within the layers of the retina. This may
      cause irregularities in the macula layers, resulting in vision loss or distortion.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that may increase the risk of macular degeneration include:'
  - type: list
    ordered: false
    items:
    - Age. This disease is most common in people over 50.
    - Family history and genetics. This disease has a hereditary component, meaning
      it can run in families. Researchers have identified several genes linked to
      the condition.
    - Race. Macular degeneration is more common in white people.
    - Smoking. Smoking cigarettes or being exposed to tobacco smoke on a regular basis
      greatly increases the risk of macular degeneration.
    - Obesity. Research suggests that obesity may increase the chance that early or
      intermediate macular degeneration will progress to a more severe form of the
      disease.
    - Cardiovascular disease. If you have diseases that affect your heart and blood
      vessels, you may be at higher risk of macular degeneration.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: People whose wet macular degeneration has progressed to central vision loss
      have a higher risk of depression and social isolation. With profound loss of
      vision, people may see visual hallucinations. This condition is known as Charles
      Bonnet syndrome.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'It''s important to have routine eye exams to identify early signs of macular
      degeneration. The following measures may help reduce the risk of developing
      wet macular degeneration:'
  - type: list
    ordered: false
    items:
    - Manage all other medical conditions. For example, if you have cardiovascular
      disease or high blood pressure, take your medicine and follow your healthcare
      team's instructions for controlling the condition.
    - Don't smoke. People who smoke are more likely to develop macular degeneration
      than are people who don't smoke. Ask a healthcare professional for help stopping
      smoking.
    - Maintain a healthy weight and exercise regularly. If you need to lose weight,
      reduce the number of calories you eat and increase the amount of exercise you
      get each day.
    - Choose a diet rich in fruits and vegetables. These foods contain antioxidant
      vitamins that reduce your risk of developing macular degeneration.
    - Include fish in your diet. Omega-3 fatty acids, which are found in fish, may
      reduce the risk of macular degeneration. Nuts such as walnuts also contain omega-3
      fatty acids.
  subsections: []
