title: Lip cancer
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Lip cancer occurs on the skin of the lips. Lip cancer can occur anywhere
      along the upper or lower lip, but is most common on the lower lip. Lip cancer
      is considered a type of mouth (oral) cancer.
  - type: paragraph
    text: Most lip cancers are squamous cell carcinomas, which means they begin in
      the thin, flat cells in the middle and outer layers of the skin called squamous
      cells.
  - type: paragraph
    text: Lip cancer risk factors include excessive sun exposure and tobacco use.
      You may reduce your risk of lip cancer by protecting your face from the sun
      with a hat or sunblock, and by quitting smoking.
  - type: paragraph
    text: Treatment for lip cancer usually involves surgery to remove the cancer.
      For small lip cancers, surgery may be a minor procedure with minimal impact
      on your appearance.
  - type: paragraph
    text: For larger lip cancers, more extensive surgery may be necessary. Careful
      planning and reconstruction can preserve your ability to eat and speak normally,
      and also achieve a satisfactory appearance after surgery.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Signs and symptoms of lip cancer include:'
  - type: list
    ordered: false
    items:
    - A flat or slightly raised whitish discoloration of the lip
    - A sore on your lip that won't heal
    - Tingling, pain or numbness of the lips or the skin around the mouth
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with your doctor if you have any persistent signs
        or symptoms that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: It's not clear what causes lip cancer.
  - type: paragraph
    text: In general, cancer starts when cells develop changes (mutations) in their
      DNA. A cell's DNA contains the instructions that tell the cell what to do. The
      changes tell the cell to begin multiplying uncontrollably and to continue living
      when healthy cells would die. The accumulating cells form a tumor that can invade
      and destroy normal body tissue.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that can increase your risk of lip cancer include:'
  - type: list
    ordered: false
    items:
    - Tobacco use of any kind, including cigarettes, cigars, pipes, chewing tobacco
      and snuff, among others
    - Fair skin
    - Excessive sun exposure to your lips
    - A weakened immune system
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'To reduce your risk of lip cancer, you can:'
  - type: list
    ordered: false
    items:
    - Stop using tobacco or don't start. If you use tobacco, stop. If you don't use
      tobacco, don't start. Using tobacco, whether smoked or chewed, exposes the cells
      in your lips to dangerous cancer-causing chemicals.
    - Avoid the sun during the middle of the day. For many people in North America,
      the sun's rays are strongest between about 10 a.m. and 4 p.m. Schedule outdoor
      activities for other times of the day, even during winter or when the sky is
      cloudy.
    - Use a broad-spectrum sunscreen with an SPF of at least 30, even on cloudy days.
      Apply sunscreen generously, and reapply every two hours — or more often if you're
      swimming or perspiring.
    - Avoid tanning beds. Tanning beds emit UV rays and can increase your risk of
      lip cancer.
  subsections: []
