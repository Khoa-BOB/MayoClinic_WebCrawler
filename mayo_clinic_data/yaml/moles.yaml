title: Moles
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Moles, also known as nevi, are a common type of skin growth. They often
      appear as small, dark brown spots that are caused by clusters of pigment-forming
      cells called melanocytes. Most people have 10 to 45 moles that appear during
      childhood and the teenage years. How these moles look may change over time.
      They also may fade over time.
  - type: paragraph
    text: Most moles are harmless. Rarely, they become cancerous. Being aware of changes
      in your moles and other pigmented patches is important to finding skin cancer,
      especially malignant melanoma.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'The typical mole is a small brown spot. But moles come in different colors,
      shapes and sizes:'
  - type: list
    ordered: false
    items:
    - Color and texture. Moles can be brown, tan, black, blue, red or pink. They can
      be smooth, wrinkled, flat or raised. They may have hair growing from them.
    - Shape. Most moles are oval or round.
    - Size. Moles are typically less than 1/4 inch (about 6 mm) in diameter — the
      size of a pencil eraser. Those present at birth, known as congenital nevi, can
      be bigger and cover part of the face, trunk or a limb.
  - type: paragraph
    text: Moles can grow anywhere on your body, including your scalp and armpits,
      as well as under your nails and between your fingers and toes. Most people have
      10 to 45 moles. Many of these moles occur by age 40. Moles may change or fade
      away over time. They may become darker and larger with hormonal changes that
      occur during the teenage years and while pregnant.
  - type: paragraph
    text: Clusters of brown spots around the eyes, cheeks and nose are dermatoses
      papulosa nigra — a type of seborrheic keratosis that is noncancerous and appears
      as waxy brown, black or tan growths. They aren't clusters of pigment-forming
      cells, known as nevi. Dermatoses papulosa nigra are more common among Black
      women. These lesions don't carry a risk of melanoma, but they can be treated
      as a cosmetic concern.
  subsections:
  - heading: Unusual moles that may indicate melanoma
    level: 3
    content:
    - type: paragraph
      text: 'A mole may be a sign of skin cancer if it has irregular borders or an
        asymmetrical shape, or if it changes in color, shape, size or height. This
        ABCDE guide can help you remember what to watch for:'
    - type: list
      ordered: false
      items:
      - A is for asymmetrical shape. One half is unlike the other half.
      - B is for border. Look for moles with irregular, notched or scalloped borders.
      - C is for changes in color. Look for growths that have changed color, have
        many colors or have uneven color.
      - D is for diameter. Look for new growth in a mole larger than 1/4 inch (about
        6 mm).
      - E is for evolving. Watch for moles that change in size, shape, color or height.
        Also, new symptoms can arise, such as itchiness or bleeding.
    - type: paragraph
      text: Cancerous moles, also known as malignant moles, vary greatly in how they
        look. Some may show all of the changes listed above. Others may have only
        one or two unusual traits.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with your healthcare professional if a mole looks
        unusual, grows or otherwise changes.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Moles are caused when cells in the skin called melanocytes grow in clusters.
      Melanocytes generally are distributed throughout the skin. They produce melanin,
      the natural pigment that gives skin its color.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Melanoma is the main complication of moles. Some people have an above-average
      risk of their moles becoming cancerous and leading to melanoma. Factors that
      raise melanoma risk include:'
  - type: list
    ordered: false
    items:
    - Being born with large moles. These type of moles are called congenital nevi.
      They are subclassified based on their estimated adult size. Large and giant
      congenital nevi that are more than 20 centimeters in diameter are at higher
      risk of developing melanoma.
    - Having unusual moles. Moles that are large with an irregular border are known
      as atypical nevi, also known as dysplastic nevi. They tend to run in families.
    - Having many moles. Having more than 50 moles suggests a greater risk of melanoma
      and possibly breast cancer.
    - Having a personal or family history of melanoma. If you've had melanoma before,
      there is a higher risk of getting melanoma again. Also, some types of atypical
      nevi lead to a genetic form of melanoma.
    - Using tanning lamps or beds. Tanning lamps and beds release UV rays and can
      raise your risk of skin cancer.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'The following measures can help limit the growth of moles and the main
      complication of moles: melanoma.'
  subsections:
  - heading: Watch for changes
    level: 3
    content:
    - type: paragraph
      text: 'Become familiar with the location and pattern of your moles. Regularly
        look at your skin for changes that may signal melanoma. Do self-exams of the
        skin monthly. With the help of mirrors, do a head-to-toe check, including:'
    - type: list
      ordered: false
      items:
      - Scalp.
      - Palms and fingernails.
      - Armpits.
      - Chest.
      - Legs.
      - Feet, including the soles and between the toes.
      - Genital area and between the buttocks.
    - type: paragraph
      text: Talk with your healthcare professional about your risk factors for melanoma
        and whether you need a professional skin exam regularly.
    subsections: []
  - heading: Protect your skin
    level: 3
    content:
    - type: paragraph
      text: Take measures to protect your skin from ultraviolet (UV) radiation, such
        as from the sun or tanning beds. UV radiation has been linked to a higher
        melanoma risk. And children who haven't been protected from sun exposure tend
        to grow more moles.
    - type: list
      ordered: false
      items:
      - Stay out of the sun during peak times. For many people in North America, the
        sun's rays are strongest between 10 a.m. and 2 p.m. Try to schedule outdoor
        activities for other times of the day, even on cloudy days or during the winter.
        When you are outdoors, seek shade or use an umbrella to protect yourself from
        the sun.
      - Use sunscreen year-round. Apply sunscreen to dry skin about 15 minutes before
        going outdoors, even on cloudy days. Use a broad-spectrum, water-resistant
        sunscreen with an SPF of at least 30. Apply it generously and reapply every
        two hours — or more often if you're swimming or sweating.
      - Wear protective clothing. Sunglasses, broad-brimmed hats, long sleeves and
        other clothing can protect you from damaging UV rays. You also might want
        to think about clothing that's made with fabric specially treated to block
        UV radiation.
      - Don't use tanning lamps or beds. Tanning lamps and beds release UV rays that
        can raise your risk of skin cancer.
    subsections: []
