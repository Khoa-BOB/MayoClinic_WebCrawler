title: Rumination syndrome
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Rumination syndrome is a condition in which someone repeatedly regurgitates
      undigested or partially digested food from the stomach. The regurgitated food
      is then chewed again and swallowed or spit out. People with rumination syndrome
      don't try to regurgitate food. It happens without any effort.
  - type: paragraph
    text: Because the food hasn't yet been digested, it reportedly tastes like regular
      food and isn't acidic like vomit. Rumination typically happens at every meal,
      soon after eating.
  - type: paragraph
    text: It's not clear how many people have this condition. Treatment may include
      behavioral therapy or medicine. Behavioral therapy typically involves teaching
      people to breathe from the diaphragm.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of rumination syndrome include:'
  - type: list
    ordered: false
    items:
    - Effortless regurgitation, typically within minutes of eating.
    - Belly pain or pressure relieved by regurgitation.
    - A feeling of fullness.
    - Nausea.
    - Losing weight without trying.
  - type: paragraph
    text: Rumination syndrome isn't usually associated with retching.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Consult a healthcare professional if you or your child often regurgitates
        food.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The exact cause of rumination syndrome isn't clear. But it appears to be
      caused by an increase in abdominal pressure.
  - type: paragraph
    text: Rumination syndrome is often confused with bulimia nervosa, gastroesophageal
      reflux disease (GERD) and gastroparesis. Some people have rumination syndrome
      linked to a rectal evacuation disorder. A rectal evacuation issue involves pelvic
      floor muscles that don't work together correctly, which leads to ongoing constipation.
  - type: paragraph
    text: The condition has long been known to happen in infants and people with developmental
      disabilities. It's now clear that the condition isn't related to age, as it
      can happen in children, teens and adults. Rumination syndrome is more likely
      to happen in people with anxiety, depression or other psychiatric disorders.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Complications of rumination syndrome may include:'
  - type: list
    ordered: false
    items:
    - Unhealthy weight loss.
    - Malnutrition.
    - Worn teeth.
    - Bad breath.
    - Embarrassment.
    - Social isolation.
  - type: paragraph
    text: Untreated, rumination syndrome can damage the tube between the mouth and
      stomach, called the esophagus.
  subsections: []
