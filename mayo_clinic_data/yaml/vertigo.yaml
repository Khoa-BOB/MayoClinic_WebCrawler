title: Benign paroxysmal positional vertigo (BPPV)
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Benign paroxysmal positional vertigo (BPPV) is one of the most common causes
      of vertigo — the sudden sensation that you're spinning or that the inside of
      your head is spinning.
  - type: paragraph
    text: BPPV causes brief episodes of mild to intense dizziness. It is usually triggered
      by specific changes in your head's position. This might occur when you tip your
      head up or down, when you lie down, or when you turn over or sit up in bed.
  - type: paragraph
    text: Although BPPV can be bothersome, it's rarely serious except when it increases
      the chance of falls. You can receive effective treatment for BPPV during a doctor's
      office visit.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'The signs and symptoms of benign paroxysmal positional vertigo (BPPV) may
      include:'
  - type: list
    ordered: false
    items:
    - Dizziness
    - A sense that you or your surroundings are spinning or moving (vertigo)
    - A loss of balance or unsteadiness
    - Nausea
    - Vomiting
  - type: paragraph
    text: The signs and symptoms of BPPV can come and go and commonly last less than
      one minute. Episodes of BPPV can disappear for some time and then recur.
  - type: paragraph
    text: Activities that bring about the signs and symptoms of BPPV can vary from
      person to person, but are almost always brought on by a change in head position.
      Some people also feel out of balance when standing or walking.
  - type: paragraph
    text: Abnormal rhythmic eye movements usually accompany the symptoms of benign
      paroxysmal positional vertigo.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Generally, see your doctor if you experience any recurrent, sudden, severe,
        or prolonged and unexplained dizziness or vertigo.
    subsections: []
  - heading: Seek emergency care
    level: 3
    content:
    - type: paragraph
      text: 'Although it''s uncommon for dizziness to signal a serious illness, see
        your doctor immediately if you experience dizziness or vertigo along with
        any of the following:'
    - type: list
      ordered: false
      items:
      - A new, different or severe headache
      - A fever
      - Double vision or loss of vision
      - Hearing loss
      - Trouble speaking
      - Leg or arm weakness
      - Loss of consciousness
      - Falling or difficulty walking
      - Numbness or tingling
    - type: paragraph
      text: The signs and symptoms listed above may signal a more serious problem.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Often, there's no known cause for BPPV . This is called idiopathic BPPV
      .
  - type: paragraph
    text: When there is a known cause, BPPV is often associated with a minor to severe
      blow to your head. Less common causes of BPPV include disorders that damage
      your inner ear or, rarely, damage that occurs during ear surgery or long periods
      positioned on your back, such as in a dentist chair. BPPV also has been associated
      with migraines.
  subsections:
  - heading: The ear's role
    level: 3
    content:
    - type: paragraph
      text: Inside your ear is a tiny organ called the vestibular labyrinth. It includes
        three loop-shaped structures (semicircular canals) that contain fluid and
        fine, hairlike sensors that monitor your head's rotation.
    - type: paragraph
      text: Other structures (otolith organs) in your ear monitor your head's movements
        — up and down, right and left, back and forth — and your head's position related
        to gravity. These otolith organs contain crystals that make you sensitive
        to gravity.
    - type: paragraph
      text: For many reasons, these crystals can become dislodged. When they become
        dislodged, they can move into one of the semicircular canals — especially
        while you're lying down. This causes the semicircular canal to become sensitive
        to head position changes it would normally not respond to, which is what makes
        you feel dizzy.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Benign paroxysmal positional vertigo occurs most often in people age 50
      and older, but can occur at any age. BPPV is also more common in women than
      in men. A head injury or any other disorder of the balance organs of your ear
      may make you more susceptible to BPPV .
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Although BPPV is uncomfortable, it rarely causes complications. The dizziness
      of BPPV can make you unsteady, which may put you at greater risk of falling.
  subsections: []
