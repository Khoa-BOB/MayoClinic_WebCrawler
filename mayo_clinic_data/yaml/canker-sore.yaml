title: Canker sore
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Canker sores, also called aphthous ulcers, are small, shallow lesions that
      develop on the soft tissues in your mouth or at the base of your gums. Unlike
      cold sores, canker sores don't occur on the surface of your lips and they aren't
      contagious. They can be painful, however, and can make eating and talking difficult.
  - type: paragraph
    text: Most canker sores go away on their own in a week or two. Check with your
      doctor or dentist if you have unusually large or painful canker sores or canker
      sores that don't seem to heal.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: Most canker sores are round or oval with a white or yellow center and a
      red border. They form inside your mouth — on or under your tongue, inside your
      cheeks or lips, at the base of your gums, or on your soft palate. You might
      notice a tingling or burning sensation a day or two before the sores actually
      appear.
  - type: paragraph
    text: There are several types of canker sores, including minor, major and herpetiform
      sores.
  subsections:
  - heading: Minor canker sores
    level: 3
    content:
    - type: paragraph
      text: 'Minor canker sores are the most common and:'
    - type: list
      ordered: false
      items:
      - Are usually small
      - Are oval shaped with a red edge
      - Heal without scarring in one to two weeks
    subsections: []
  - heading: Major canker sores
    level: 3
    content:
    - type: paragraph
      text: 'Major canker sores are less common and:'
    - type: list
      ordered: false
      items:
      - Are larger and deeper than minor canker sores
      - Are usually round with defined borders, but may have irregular edges when
        very large
      - Can be extremely painful
      - May take up to six weeks to heal and can leave extensive scarring
    subsections: []
  - heading: Herpetiform canker sores
    level: 3
    content:
    - type: paragraph
      text: 'Herpetiform canker sores are uncommon and usually develop later in life,
        but they''re not caused by herpes virus infection. These canker sores:'
    - type: list
      ordered: false
      items:
      - Are pinpoint size
      - Often occur in clusters of 10 to 100 sores, but may merge into one large ulcer
      - Have irregular edges
      - Heal without scarring in one to two weeks
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'Consult your doctor if you experience:'
    - type: list
      ordered: false
      items:
      - Unusually large canker sores
      - Recurring sores, with new ones developing before old ones heal, or frequent
        outbreaks
      - Persistent sores, lasting two weeks or more
      - Sores that extend into the lips themselves (vermilion border)
      - Pain that you can't control with self-care measures
      - Extreme difficulty eating or drinking
      - High fever along with canker sores
    - type: paragraph
      text: See your dentist if you have sharp tooth surfaces or dental appliances
        that seem to trigger the sores.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The precise cause of canker sores remains unclear, though researchers suspect
      that a combination of factors contributes to outbreaks, even in the same person.
  - type: paragraph
    text: 'Possible triggers for canker sores include:'
  - type: list
    ordered: false
    items:
    - A minor injury to your mouth from dental work, overzealous brushing, sports
      mishaps or an accidental cheek bite
    - Toothpastes and mouth rinses containing sodium lauryl sulfate
    - Food sensitivities, particularly to chocolate, coffee, strawberries, eggs, nuts,
      cheese, and spicy or acidic foods
    - A diet lacking in vitamin B-12, zinc, folate (folic acid) or iron
    - An allergic response to certain bacteria in your mouth
    - Helicobacter pylori, the same bacteria that cause peptic ulcers
    - Hormonal shifts during menstruation
    - Emotional stress
  - type: paragraph
    text: 'Canker sores may also occur because of certain conditions and diseases,
      such as:'
  - type: list
    ordered: false
    items:
    - Celiac disease, a serious intestinal disorder caused by a sensitivity to gluten,
      a protein found in most grains
    - Inflammatory bowel diseases, such as Crohn's disease and ulcerative colitis
    - Behcet's disease, a rare disorder that causes inflammation throughout the body,
      including the mouth
    - A faulty immune system that attacks healthy cells in your mouth instead of pathogens,
      such as viruses and bacteria
    - HIV/AIDS, which suppresses the immune system
  - type: paragraph
    text: Unlike cold sores, canker sores are not associated with herpes virus infections.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Anyone can develop canker sores. But they occur more often in teens and
      young adults, and they're more common in females.
  - type: paragraph
    text: Often people with recurrent canker sores have a family history of the disorder.
      This may be due to heredity or to a shared factor in the environment, such as
      certain foods or allergens.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'Canker sores often recur, but you may be able to reduce their frequency
      by following these tips:'
  - type: list
    ordered: false
    items:
    - Watch what you eat. Try to avoid foods that seem to irritate your mouth. These
      may include nuts, chips, pretzels, certain spices, salty foods and acidic fruits,
      such as pineapple, grapefruit and oranges. Avoid any foods to which you're sensitive
      or allergic.
    - Choose healthy foods. To help prevent nutritional deficiencies, eat plenty of
      fruits, vegetables and whole grains.
    - Follow good oral hygiene habits. Regular brushing after meals and flossing once
      a day can keep your mouth clean and free of foods that might trigger a sore.
      Use a soft brush to help prevent irritation to delicate mouth tissues, and avoid
      toothpastes and mouth rinses that contain sodium lauryl sulfate.
    - Protect your mouth. If you have braces or other dental appliances, ask your
      dentist about orthodontic waxes to cover sharp edges.
    - Reduce your stress. If your canker sores seem to be related to stress, learn
      and use stress-reduction techniques, such as meditation and guided imagery.
  subsections: []
