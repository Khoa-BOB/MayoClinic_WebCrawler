title: Low sex drive in women
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Women's levels of sexual desire change over the years. It's common for highs
      and lows to happen along with the start or end of a relationship. Or they can
      happen with major life changes such as pregnancy, menopause or illness. Some
      medicines used for conditions that affect mood also can cause low sex drive
      in women.
  - type: paragraph
    text: If your lack of interest in sex continues or returns and causes personal
      distress, talk with your healthcare professional. You may have a treatable condition
      called sexual interest-arousal disorder.
  - type: paragraph
    text: But you don't have to meet this medical definition to seek help. If you're
      bothered by a low or reduced sex drive, you can take steps to boost your libido.
      Lifestyle changes and sexual techniques may put you in the mood more often.
      Some medicines may offer promise as well.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: neither of you may have a sex drive that's outside what's typical for people
      at your stage in life.
  - type: paragraph
    text: 'And even if your sex drive is lower than it once was, your relationship
      may be strong. Bottom line: There is no magic number to define low sex drive.
      It varies.'
  - type: paragraph
    text: 'Symptoms of low sex drive in women include:'
  - type: list
    ordered: false
    items:
    - Having less or no interest in any type of sexual activity, including masturbation.
    - Never or only seldom having sexual fantasies or thoughts.
    - Being sad or concerned about your lack of sexual activity or fantasies.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: If you're concerned about your low desire for sex, talk to your gynecologist
        or other healthcare professional. The answer might be as simple as changing
        a medicine that you take. Or you may need to get a condition such as high
        blood pressure or diabetes under tighter control.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Desire for sex is based on a complex mix of many things that affect intimacy.
      These factors include:'
  - type: list
    ordered: false
    items:
    - Physical and emotional well-being.
    - Experiences.
    - Beliefs.
    - Lifestyle.
    - Your current relationship.
  - type: paragraph
    text: If you have challenges in any of these areas, it can affect your desire
      for sex.
  subsections:
  - heading: Physical causes
    level: 3
    content:
    - type: paragraph
      text: 'A variety of illnesses, physical changes and medicines can cause low
        sex drive, including:'
    - type: list
      ordered: false
      items:
      - Sexual conditions. If you have pain during sex or can't orgasm, it can lower
        your desire for sex.
      - Diseases. Many nonsexual diseases can affect sex drive. These include cancer,
        diabetes, high blood pressure, coronary artery disease and neurological diseases.
      - Medicines. Some prescription medicines lower sex drive — especially depression
        medicines called selective serotonin reuptake inhibitors (SSRIs).
      - Lifestyle habits. A glass of wine may put you in the mood, but too much alcohol
        can affect your sex drive. The same is true of street drugs. Also, smoking
        decreases blood flow, which may dull arousal.
      - Surgery. Any surgery related to your breasts or genital tract can affect your
        body image, sexual function and desire for sex.
      - Fatigue. Exhaustion from caring for young children or aging parents can contribute
        to low sex drive. Fatigue from illness or surgery also can play a role.
    subsections: []
  - heading: Hormone changes
    level: 3
    content:
    - type: paragraph
      text: 'Changes in your hormone levels may alter your desire for sex. This can
        occur during:'
    - type: list
      ordered: false
      items:
      - Menopause. Estrogen levels drop during menopause. This can make you less interested
        in sex and cause vaginal dryness, leading to painful or uncomfortable sex.
        Many women still have satisfying sex during menopause and beyond. But some
        have a lagging libido during this hormone change.
      - Pregnancy and breastfeeding. Hormone changes during pregnancy, just after
        having a baby and during breastfeeding can put a damper on sex drive. Fatigue
        and changes in body image can affect your sexual desire. So can the pressures
        of pregnancy or caring for a new baby.
    subsections: []
  - heading: Psychological causes
    level: 3
    content:
    - type: paragraph
      text: 'Your state of mind can affect your sexual desire. Psychological causes
        of low sex drive include:'
    - type: list
      ordered: false
      items:
      - Mental health conditions such as anxiety or depression.
      - Stress tied to things such as finances, relationships or work.
      - Poor body image.
      - Low self-esteem.
      - History of physical, emotional or sexual abuse.
      - Past negative sexual experiences.
    subsections: []
  - heading: Relationship issues
    level: 3
    content:
    - type: paragraph
      text: 'For many people, emotional closeness is a key to sexual intimacy. So
        problems in your relationship can be a major factor in low sex drive. Often,
        less interest in sex is a result of ongoing issues such as:'
    - type: list
      ordered: false
      items:
      - Lack of connection with your partner.
      - Unresolved conflicts or fights.
      - Poor communication of sexual needs and desires.
      - Trust issues.
      - Concern over your partner's ability to have sex.
      - Not enough privacy.
    subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that can raise the risk of low sex drive include:'
  - type: list
    ordered: false
    items:
    - Conditions such as diabetes, high blood pressure and coronary artery disease.
    - Pain during sex or not being able orgasm.
    - Mental health conditions and life circumstances that affect your state of mind.
    - Various prescription medicines, including depression medicines called selective
      serotonin reuptake inhibitors.
    - Surgeries related to the breasts or genital tract.
    - Changes in hormone levels during menopause, pregnancy or breastfeeding.
    - Relationship issues that lessen emotional closeness with your partner.
  subsections: []
