title: Dermatographia (Dermatographism)
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Dermatographia is a condition in which lightly scratching your skin causes
      raised, inflamed lines or welts. These marks tend to go away in less than 30
      minutes. The condition is also known as dermatographism and skin writing.
  - type: paragraph
    text: The cause of dermatographia is unknown, but it may be related to an infection,
      emotional upset or a medicine you're taking.
  - type: paragraph
    text: Dermatographia is harmless. Most people who have this condition don't need
      treatment. If your symptoms bother you, talk with your health care provider,
      who might prescribe an allergy medicine.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of dermatographia may include:'
  - type: list
    ordered: false
    items:
    - Raised, inflamed lines where you scratched.
    - Welts from friction.
    - Swelling.
    - Itching.
  - type: paragraph
    text: The symptoms may occur within a few minutes of the skin being rubbed or
      scratched. They tend to go away within 30 minutes. Rarely, the skin symptoms
      develop more slowly and lasts several hours to days. The condition itself can
      last for months or years.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See your health care provider if your symptoms bother you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: The exact cause of dermatographia isn't clear. It may be an allergic reaction,
      though no specific allergen has been found.
  - type: paragraph
    text: Simple things may cause symptoms of dermatographia. For example, rubbing
      from your clothes or bedsheets may irritate your skin. In some people, the symptoms
      are preceded by an infection, emotional stress, vibration, cold exposure or
      taking a medicine.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Dermatographia can occur at any age. It tends to be more common in teens
      and young adults. If you have other skin conditions, you may be at greater risk.
      One such condition is atopic dermatitis (eczema).
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'Try these tips to reduce discomfort and prevent the symptoms of dermatographia:'
  - type: list
    ordered: false
    items:
    - Treat skin gently. Use a mild soap or nonsoap cleanser and pat skin dry. Wear
      things made of cloth that doesn't itch. Use warm water when you take a bath
      or shower.
    - Don't scratch your skin. Try not to scratch. This is a good tip for any skin
      condition.
    - Keep your skin moisturized. Use creams, lotions or ointments daily. Creams and
      ointments are thicker and tend to work better than lotions do. Apply your skin
      product while your skin is still damp from washing. Use it again during the
      day as needed.
  subsections: []
