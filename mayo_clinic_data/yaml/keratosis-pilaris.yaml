title: Keratosis pilaris
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Keratosis pilaris (ker-uh-TOE-sis pih-LAIR-is) is a harmless skin condition
      that causes dry, rough patches and tiny bumps, often on the upper arms, thighs,
      cheeks or buttocks. The bumps usually don't hurt or itch.
  - type: paragraph
    text: Keratosis pilaris is often considered a common variant of skin. It can't
      be cured or prevented. But you can treat it with moisturizers and prescription
      creams to help improve how the skin looks. The condition usually disappears
      by age 30.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Keratosis pilaris can occur at any age, but it''s more common in young
      children. Symptoms include:'
  - type: list
    ordered: false
    items:
    - Painless tiny bumps on the upper arms, thighs, cheeks or buttocks
    - Dry, rough skin in the areas with bumps
    - Worsening when seasonal changes cause low humidity and dry skin
    - Sandpaper-like bumps resembling goose flesh
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Treatment for keratosis pilaris usually isn't needed. But if you're concerned
        about your or your child's skin, consult your health care provider or a specialist
        in skin conditions (dermatologist).
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Keratosis pilaris is caused by the buildup of keratin — a hard protein that
      protects skin from harmful substances and infection. The keratin blocks the
      opening of hair follicles, causing patches of rough, bumpy skin.
  - type: paragraph
    text: It's not clear why keratin builds up in people with keratosis pilaris. It
      might happen along with a genetic disease or skin conditions such as atopic
      dermatitis. Dry skin tends to make keratosis pilaris worse.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Keratosis pilaris is very common. It tends to run in families.
  subsections: []
