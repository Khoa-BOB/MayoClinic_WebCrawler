title: Toxoplasmosis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Toxoplasmosis (tok-so-plaz-MOE-sis) is an infection with a parasite called
      Toxoplasma gondii. People often get the infection from eating undercooked meat.
      You can also get it from contact with cat feces. The parasite can pass to a
      baby during pregnancy.
  - type: paragraph
    text: Most people infected with the parasite do not have symptoms. Some people
      get flu-like symptoms. Serious disease most often affects infants and people
      with weakened immune systems. Toxoplasmosis during pregnancy may cause miscarriage
      and birth defects.
  - type: paragraph
    text: Most infections don't need treatment. Drug treatment is used for people
      with more-serious cases, pregnant people, newborns and people with weakened
      immune systems. Several steps to prevent toxoplasmosis can lower the risk of
      infection.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Most people infected with toxoplasmosis do not have any symptoms. They
      often don''t know they''re infected. Some people have flu-like symptoms, including:'
  - type: list
    ordered: false
    items:
    - Fever.
    - Swollen lymph nodes that may last for weeks.
    - Headache.
    - Muscle aches.
    - Skin rash.
  subsections:
  - heading: Symptoms of eye disease
    level: 3
    content:
    - type: paragraph
      text: 'The toxoplasma parasites may infect tissues of the inner eye. This can
        occur in people with healthy immune systems. But the disease is more serious
        in people with weakened immunity. An infection in the eye is called ocular
        toxoplasmosis. Symptoms may include:'
    - type: list
      ordered: false
      items:
      - Eye pain.
      - Poor vision.
      - Floaters, which are specks that seem to swim in your vision.
    - type: paragraph
      text: Untreated eye disease can cause blindness.
    subsections: []
  - heading: Effect on people with weakened immune systems
    level: 3
    content:
    - type: paragraph
      text: People with weakened immune systems are likely to have more-serious disease
        from toxoplasmosis. A toxoplasmosis infection from earlier in life may become
        active again. People at risk include those living with HIV/AIDS, people receiving
        cancer treatment and people with a transplanted organ.
    - type: paragraph
      text: In addition to serious eye disease, toxoplasmosis can cause severe lung
        or brain disease for a person with weakened immunity. Rarely, the infection
        can show up in other tissues throughout the body.
    - type: paragraph
      text: 'Lung infection may cause:'
    - type: list
      ordered: false
      items:
      - Breathing problems.
      - Fever.
      - Cough.
    - type: paragraph
      text: 'Toxoplasmosis may cause inflammation of the brain, also called encephalitis.
        Symptoms may include:'
    - type: list
      ordered: false
      items:
      - Confusion.
      - Poor coordination.
      - Muscle weakness.
      - Seizures.
      - Changes in alertness.
    subsections: []
  - heading: Effect on fetus or infant
    level: 3
    content:
    - type: paragraph
      text: Toxoplasmosis can pass from the mother to the fetus during a pregnancy.
        This is called congenital toxoplasmosis.
    - type: paragraph
      text: 'Infection during the first trimester often causes more-severe disease.
        It also may result in miscarriage. For some babies with toxoplasmosis, serious
        disease may be present at birth or appear early in infancy. Medical problems
        may include:'
    - type: list
      ordered: false
      items:
      - Too much fluid in or around the brain, also called hydrocephalus.
      - Severe eye infection.
      - Irregularities in brain tissues.
      - An enlarged liver or spleen.
    - type: paragraph
      text: 'Symptoms of severe disease vary. They may include:'
    - type: list
      ordered: false
      items:
      - Problems with mental or motor skills.
      - Blindness or other vision problems.
      - Hearing problems.
      - Seizures.
      - Heart disorders.
      - Yellowing of the skin and whites of the eyes, also called jaundice.
      - Rash.
    - type: paragraph
      text: 'Most babies with toxoplasmosis do not show symptoms. But problems may
        show up later in childhood or teenage years. These include:'
    - type: list
      ordered: false
      items:
      - Return of eye infections.
      - Problems with motor skill development.
      - Problems with thinking and learning.
      - Hearing loss.
      - Slowed growth.
      - Early puberty.
    subsections: []
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Talk to your health care provider about a test if you are worried about
        exposure to the parasite. If you are planning a pregnancy or are pregnant,
        see your provider if you suspect exposure.
    - type: paragraph
      text: The symptoms of severe toxoplasmosis include blurred vision, confusion
        and loss of coordination. These need immediate medical care, particularly
        if you have a weakened immune system.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Toxoplasma gondii is a parasite that can infect most animals and birds.
      It can only go through the entire cycle of reproduction in domestic and wild
      cats. These are the main hosts for the parasite.
  - type: paragraph
    text: Immature eggs, a middle stage of reproduction, can be in the feces of cats.
      This immature egg allows for the parasite to make its way through the food chain.
      It can pass from soil and water to plants, animals and humans. Once the parasite
      has a new host, the reproduction cycle goes on and causes an infection.
  - type: paragraph
    text: If you're in typical health, your immune system keeps the parasites in check.
      They stay in your body but are not active. This often gives you lifelong immunity.
      If you're exposed to the parasite again, your immune system would clear it out.
  - type: paragraph
    text: If your immune system is weakened later in life, parasite reproduction can
      start again. This causes a new active infection that can lead to serious disease
      and complications.
  - type: paragraph
    text: 'People often get a toxoplasma infection one of the following ways:'
  - type: list
    ordered: false
    items:
    - Cat feces with the parasite. Cats that hunt or who are fed raw meat are more
      likely to carry toxoplasma parasites. You may get infected if you touch your
      mouth after touching anything that has been in contact with cat feces. This
      may be gardening or cleaning a litter box.
    - Contaminated food or water. Undercooked beef, lamb, pork, venison, chicken and
      shellfish are all known carriers of the parasite. Unpasteurized goat milk and
      untreated drinking water also may be carriers.
    - Unwashed fruits and vegetables. The surface of fruits and vegetables may have
      the parasite on them.
    - Contaminated kitchen tool. Parasites may be on cutting boards, knives and other
      utensils that come into contact with raw meat or unwashed fruits and vegetables.
    - Infected organ transplant or transfused blood. Rarely, toxoplasma parasites
      are passed through an organ transplant or blood transfusion.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: The parasite is found throughout the world. Anyone can become infected.
  - type: paragraph
    text: 'Risks of serious disease from toxoplasmosis include things that prevent
      the immune system from fighting infections, such as:'
  - type: list
    ordered: false
    items:
    - Infection with HIV/AIDS.
    - Chemotherapy treatment for cancer.
    - High-dose steroids.
    - Drugs that prevent the rejection of transplanted organs.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: 'Certain precautions can help prevent toxoplasmosis:'
  - type: list
    ordered: false
    items:
    - Wear gloves when you garden or handle soil. Wear gloves when you work outdoors.
      Wash your hands with soap and water afterward.
    - Don't eat raw or undercooked meat. Use a meat thermometer to make sure meat
      is cooked enough. Cook whole meats and fish to at least 145 F (63 C) and let
      rest for at least three minutes. Cook ground meat to at least 160 F (71 C).
      Cook whole and ground poultry to at least 165 F (74 C).
    - Don't eat raw shellfish. Do not eat raw clams, mussels or oysters, particularly
      during pregnancy.
    - Wash kitchen utensils thoroughly. Wash cutting boards, knives and other utensils
      with soapy water after contact with raw meats or unwashed fruits and vegetables.
      Wash your hands thoroughly before and after preparing foods.
    - Wash all fruits and vegetables. Wash fresh fruits and vegetables before eating,
      peeling or cooking.
    - Don't drink unpasteurized goat milk. Avoid unpasteurized goat milk or products
      made from the milk.
    - Don't drink untreated water. During pregnancy, do not drink untreated water.
    - Cover children's sandboxes. Cover sandboxes to prevent outdoor cats from using
      them as litter boxes.
  subsections:
  - heading: For cat lovers
    level: 3
    content:
    - type: paragraph
      text: 'If you''re pregnant or otherwise at risk of toxoplasmosis, take these
        steps to protect yourself:'
    - type: list
      ordered: false
      items:
      - Help your cat stay healthy. Keep your cat indoors. Feed it dry or canned cat
        food, not raw or undercooked meat.
      - Avoid stray cats or kittens. Avoid stray cats, especially kittens. Do not
        get a new cat when you're pregnant.
      - Have someone else clean the litter box. Clean the box daily, if possible.
        If someone else can't clean it, wear gloves and a face mask to change the
        litter. Then wash your hands well.
    subsections: []
