title: Parotid tumors
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Parotid tumors are growths of cells that start in the parotid glands. The
      parotid glands are two salivary glands that sit just in front of the ears. There
      is one on each side of the face. Salivary glands make saliva to help with chewing
      and digesting food.
  - type: paragraph
    text: There are many salivary glands in the lips, cheeks, mouth and throat. Growths
      of cells, which are called tumors, can happen in any of these glands. The parotid
      glands are the most common place that salivary gland tumors happen.
  - type: paragraph
    text: Most parotid tumors aren't cancerous. These are called noncancerous or benign
      parotid tumors. Sometimes the tumors are cancers. These are called malignant
      parotid tumors or parotid gland cancers.
  - type: paragraph
    text: Parotid tumors often cause swelling in the face or jaw. Other symptoms include
      problems swallowing or a loss of facial movement.
  - type: paragraph
    text: Diagnosis and treatment for parotid tumors is often done by doctors who
      specialize in problems that affect the ear, nose and throat. These doctors are
      called ENT specialists or otolaryngologists.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Signs and symptoms of parotid tumors include:'
  - type: list
    ordered: false
    items:
    - A lump or swelling on one side of the face that might appear near the ear or
      cheek.
    - Trouble swallowing.
    - Trouble opening the mouth widely.
    - Numbness in part of the face.
    - Muscle weakness in part of the face.
    - Pain in the face.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with a doctor or other healthcare professional if
        you have any symptoms that worry you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: It's not clear what causes parotid tumors. These tumors start as a growth
      of cells in the parotid glands. The parotid glands are two salivary glands that
      sit just in front of the ears. There is one on each side of the face. Salivary
      glands make saliva to help with chewing and digesting food.
  - type: paragraph
    text: Parotid tumors happen when cells in the parotid glands develop changes in
      their DNA. A cell's DNA holds the instructions that tell the cell what to do.
      In healthy cells, the DNA gives instructions to grow and multiply at a set rate.
      The instructions tell the cells to die at a set time. In tumor cells, the DNA
      changes give different instructions. The changes tell the tumor cells to grow
      and multiply quickly. Tumor cells can keep living when healthy cells would die.
      This causes too many cells.
  - type: paragraph
    text: Sometimes the changes in the DNA turn the cells into cancer cells. Cancer
      cells can invade and destroy healthy body tissue. In time, cancer cells can
      break away and spread to other parts of the body. When cancer spreads, it's
      called metastatic cancer.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that increase the risk of parotid tumors include:'
  - type: list
    ordered: false
    items:
    - Increasing age. Parotid tumors can happen at any age. However, they are more
      common in older adults.
    - Previous radiation therapy treatments. People who have had radiation therapy
      to the head and neck area in the past are at a higher risk of parotid tumors.
    - Exposure to harmful substances. People who work with certain substances may
      have an increased risk of salivary gland tumors, including parotid tumors. Examples
      of industries associated with an increased risk include those that involve rubber
      manufacturing and nickel.
  subsections: []
