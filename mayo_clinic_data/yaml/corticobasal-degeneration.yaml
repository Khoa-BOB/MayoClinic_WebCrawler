title: Corticobasal degeneration (corticobasal syndrome)
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Corticobasal degeneration, also called corticobasal syndrome, is a rare
      disease that causes areas of the brain to shrink. Over time, nerve cells break
      down and die.
  - type: paragraph
    text: Corticobasal degeneration affects the area of the brain that processes information
      and brain structures that control movement. People with this disease have trouble
      with movement on one or both sides of the body. Trouble with movement gets worse
      over time.
  - type: paragraph
    text: Symptoms also may include poor coordination, stiffness, trouble thinking,
      and trouble with speech or language.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of corticobasal degeneration (corticobasal syndrome) include:'
  - type: list
    ordered: false
    items:
    - Trouble moving on one or both sides of the body, which gets worse over time.
    - Poor coordination.
    - Trouble with balance.
    - Stiffness.
    - Postures of the hands or feet that can't be controlled. For example, the hand
      may form a clenched fist.
    - Muscle jerks.
    - Trouble swallowing.
    - Changes in eye movements.
    - Trouble with thinking and language skills.
    - Speech changes, such as slow and halting speech.
  - type: paragraph
    text: Corticobasal degeneration gets worse over 6 to 8 years. Eventually, people
      with the disease lose the ability to walk.
  subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Corticobasal degeneration (corticobasal syndrome) can have several causes.
      Most commonly, the disease results from a buildup of a protein called tau in
      brain cells. The buildup of tau may lead to the breakdown of the cells. This
      can cause symptoms of corticobasal degeneration.
  - type: paragraph
    text: Half of the people who have symptoms have corticobasal degeneration. But
      the second most common cause of corticobasal degeneration symptoms is Alzheimer's
      disease. Other causes of corticobasal degeneration include progressive supranuclear
      palsy, Pick's disease or Creutzfeldt-Jakob disease.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: There are no known risk factors for corticobasal degeneration (corticobasal
      syndrome).
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: People with corticobasal degeneration (corticobasal syndrome) may develop
      serious complications. People with the disease may develop pneumonia, blood
      clots in the lungs or a dangerous response to an infection, known as sepsis.
      Complications often lead to death.
  subsections: []
