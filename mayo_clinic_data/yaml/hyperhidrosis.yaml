title: Hyperhidrosis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Hyperhidrosis (hi-pur-hi-DROE-sis) is excessive sweating that's not always
      related to heat or exercise. You may sweat so much that it soaks through your
      clothes or drips off your hands. Heavy sweating can disrupt your day and cause
      social anxiety and embarrassment.
  - type: paragraph
    text: Hyperhidrosis treatment usually helps. It often begins with antiperspirants.
      If these don't help, you may need to try different medications and therapies.
      In severe cases, your health care provider may suggest surgery to remove the
      sweat glands or to disconnect the nerves related to producing too much sweat.
  - type: paragraph
    text: Sometimes an underlying condition may be found and treated.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: The main symptom of hyperhidrosis is heavy sweating. This goes beyond the
      sweating from being in a hot environment, exercising, or feeling anxious or
      stressed. The type of hyperhidrosis that usually affects the hands, feet, underarms
      or face causes at least one episode a week when you're awake. And the sweating
      usually happens on both sides of the body.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Sometimes excessive sweating is a sign of a serious condition.
    - type: paragraph
      text: Seek immediate medical attention if you have heavy sweating with dizziness,
        pain in the chest, throat, jaw, arms, shoulders or throat, or cold skin and
        a rapid pulse.
    - type: paragraph
      text: 'See your health care provider if:'
    - type: list
      ordered: false
      items:
      - Sweating disrupts your daily routine
      - Sweating causes emotional distress or social withdrawal
      - You suddenly begin to sweat more than usual
      - You experience night sweats for no apparent reason
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Sweating is the body's mechanism to cool itself. The nervous system automatically
      triggers sweat glands when your body temperature rises. Sweating also occurs,
      especially on your palms, when you're nervous.
  - type: paragraph
    text: Primary hyperhidrosis is caused by faulty nerve signals that trigger eccrine
      sweat glands to become overactive. It usually affects the palms, soles, underarms
      and sometimes the face.
  - type: paragraph
    text: There is no medical cause for this type of hyperhidrosis. It can run in
      families.
  - type: paragraph
    text: 'Secondary hyperhidrosis is caused by an underlying medical condition or
      by taking certain medications, such as pain relievers, antidepressants, and
      some diabetes and hormonal medications. This type of hyperhidrosis may cause
      sweating all over the body. Conditions that might cause it include:'
  - type: list
    ordered: false
    items:
    - Diabetes
    - Menopause hot flashes
    - Thyroid problems
    - Some types of cancer
    - Nervous system disorders
    - Infections
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk factors for hyperhidrosis include:'
  - type: list
    ordered: false
    items:
    - Having a blood relative, such as a parent, sibling or grandparent, who sweats
      heavily
    - Taking medicines or supplements that cause sweating
    - Having a medical condition that causes sweating
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Complications of hyperhidrosis include:'
  - type: list
    ordered: false
    items:
    - Infections. People who sweat a lot are more prone to skin infections.
    - Social and emotional effects. Having clammy or dripping hands and sweat-soaked
      clothes can be embarrassing. Your condition may affect your pursuit of work
      and educational goals.
  subsections: []
