title: Heart failure
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Heart failure occurs when the heart muscle doesn't pump blood as well as
      it should. When this happens, blood often backs up and fluid can build up in
      the lungs, causing shortness of breath.
  - type: paragraph
    text: Some heart conditions slowly leave the heart too weak or stiff to fill and
      pump blood properly. These conditions include narrowed arteries in the heart
      and high blood pressure.
  - type: paragraph
    text: Proper treatment may improve the symptoms of heart failure and may help
      some people live longer. Lifestyle changes can improve quality of life. Try
      to lose weight, exercise, use less salt and manage stress.
  - type: paragraph
    text: But heart failure can be life-threatening. People with heart failure may
      have severe symptoms. Some may need a heart transplant or a device to help the
      heart pump blood.
  - type: paragraph
    text: Heart failure also may be called congestive heart failure.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: If you have heart failure, your heart can't supply enough blood to meet
      your body's needs.
  - type: paragraph
    text: 'Symptoms may develop slowly. Sometimes, heart failure symptoms start suddenly.
      Heart failure symptoms may include:'
  - type: list
    ordered: false
    items:
    - Shortness of breath with activity or when lying down.
    - Fatigue and weakness.
    - Swelling in the legs, ankles and feet.
    - Rapid or irregular heartbeat.
    - Reduced ability to exercise.
    - Wheezing.
    - A cough that doesn't go away or a cough that brings up white or pink mucus with
      spots of blood.
    - Swelling of the belly area.
    - Very rapid weight gain from fluid buildup.
    - Nausea and lack of appetite.
    - Difficulty concentrating or decreased alertness.
    - Chest pain if heart failure is caused by a heart attack.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: 'See your healthcare professional if you think you might have symptoms
        of heart failure. Call 911 or emergency medical help if you have any of the
        following:'
    - type: list
      ordered: false
      items:
      - Chest pain.
      - Fainting or severe weakness.
      - Rapid or irregular heartbeat with shortness of breath, chest pain or fainting.
      - Sudden, severe shortness of breath and coughing up white or pink, foamy mucus.
    - type: paragraph
      text: These symptoms may be due to heart failure. But there are many other possible
        causes. Don't try to diagnose yourself.
    - type: paragraph
      text: At the emergency room, healthcare professionals do tests to learn if your
        symptoms are due to heart failure or something else.
    - type: paragraph
      text: 'Call your healthcare professional right away if you have heart failure
        and:'
    - type: list
      ordered: false
      items:
      - Your symptoms suddenly get worse.
      - You develop a new symptom.
      - You gain 5 pounds (2.3 kilograms) or more within a few days.
    - type: paragraph
      text: Such changes could mean that existing heart failure is getting worse or
        that treatment isn't working.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Heart failure can be caused by a weakened, damaged or stiff heart.
  - type: list
    ordered: false
    items:
    - If the heart is damaged or weakened, the heart chambers may stretch and get
      bigger. The heart can't pump out the needed amount of blood.
    - If the main pumping chambers of the heart, called the ventricles, are stiff,
      they can't fill with enough blood between beats.
  - type: paragraph
    text: The heart muscle can be damaged by certain infections, heavy alcohol use,
      recreational drug use and some chemotherapy medicines. Your genes also can play
      a role.
  - type: paragraph
    text: Any of the following conditions also can damage or weaken the heart and
      cause heart failure.
  - type: list
    ordered: false
    items:
    - Coronary artery disease and heart attack. Coronary artery disease is the most
      common cause of heart failure. The disease results from the buildup of fatty
      deposits in the arteries. The deposits narrow the arteries. This reduces blood
      flow and can lead to heart attack. A heart attack occurs suddenly when an artery
      feeding the heart becomes completely blocked. Damage to the heart muscle from
      a heart attack may mean that the heart can no longer pump as well as it should.
    - High blood pressure. Also called hypertension, this condition forces the heart
      to work harder than it should to pump blood through the body. Over time, the
      extra work can make the heart muscle too stiff or too weak to properly pump
      blood.
    - Heart valve disease. The valves of the heart keep blood flowing the right way.
      If a valve isn't working properly, the heart must work harder to pump blood.
      This can weaken the heart over time. Treating some types of heart valve disease
      may reverse heart failure.
    - Inflammation of the heart muscle, also called myocarditis. Myocarditis is most
      commonly caused by a virus, including the COVID-19 virus, and can lead to left-sided
      heart failure.
    - A heart condition that you're born with, also called a congenital heart defect.
      If the heart and its chambers or valves haven't formed correctly, the other
      parts of the heart have to work harder to pump blood. This may lead to heart
      failure.
    - Irregular heart rhythms, called arrhythmias. Irregular heart rhythms may cause
      the heart to beat too fast, creating extra work for the heart. A slow heartbeat
      also may lead to heart failure. Treating an irregular heart rhythm may reverse
      heart failure in some people.
    - Other diseases. Some long-term diseases may contribute to chronic heart failure.
      Examples are diabetes, HIV infection, an overactive or underactive thyroid,
      or a buildup of iron or protein.
  - type: paragraph
    text: Coronary artery disease and heart attack. Coronary artery disease is the
      most common cause of heart failure. The disease results from the buildup of
      fatty deposits in the arteries. The deposits narrow the arteries. This reduces
      blood flow and can lead to heart attack.
  - type: paragraph
    text: A heart attack occurs suddenly when an artery feeding the heart becomes
      completely blocked. Damage to the heart muscle from a heart attack may mean
      that the heart can no longer pump as well as it should.
  - type: paragraph
    text: 'Causes of sudden heart failure also include:'
  - type: list
    ordered: false
    items:
    - Allergic reactions.
    - Any illness that affects the whole body.
    - Blood clots in the lungs.
    - Severe infections.
    - Use of certain medicines.
    - Viruses that attack the heart muscle.
  - type: paragraph
    text: Heart failure usually begins with the lower left heart chamber, called the
      left ventricle. This is the heart's main pumping chamber. But heart failure
      also can affect the right side. The lower right heart chamber is called the
      right ventricle. Sometimes heart failure affects both sides of the heart.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Diseases and conditions that increase the risk of heart failure include:'
  - type: list
    ordered: false
    items:
    - Coronary artery disease. Narrowed arteries may limit the heart's supply of oxygen-rich
      blood, resulting in weakened heart muscle.
    - Heart attack. A heart attack is a form of coronary artery disease that occurs
      suddenly. Damage to the heart muscle from a heart attack may mean the heart
      can no longer pump as well as it should.
    - Heart valve disease. Having a heart valve that doesn't work properly raises
      the risk of heart failure.
    - High blood pressure. The heart works harder than it has to when blood pressure
      is high.
    - Irregular heartbeats. Irregular heartbeats, especially if they are very frequent
      and fast, can weaken the heart muscle and cause heart failure.
    - Congenital heart disease. Some people who develop heart failure were born with
      changes in the structure or function of their heart.
    - Diabetes. Having diabetes increases the risk of high blood pressure and coronary
      artery disease.
    - Sleep apnea. This inability to breathe properly during sleep results in low
      blood-oxygen levels and an increased risk of irregular heartbeats. These things
      can lead to a weakened heart.
    - Obesity. People who have obesity have a higher risk of developing heart failure.
    - Viral infections. Some viral infections can damage to the heart muscle.
  - type: paragraph
    text: 'Medicines that may increase the risk of heart failure include:'
  - type: list
    ordered: false
    items:
    - Some diabetes medicines. The diabetes medicines rosiglitazone (Avandia) and
      pioglitazone (Actos) have been found to increase the risk of heart failure in
      some people. Don't stop taking these medicines without first talking to your
      healthcare professional.
    - Some other medicines. Other medicines that may lead to heart failure or heart
      conditions include nonsteroidal anti-inflammatory drugs (NSAIDs) and some medicines
      used to treat high blood pressure, cancer, blood conditions, irregular heartbeats,
      nervous system diseases, mental health conditions, lung and urinary conditions,
      and infections.
  - type: paragraph
    text: 'Other risk factors for heart failure include:'
  - type: list
    ordered: false
    items:
    - Aging. The heart's ability to work decreases with age, even in healthy people.
    - Alcohol use. Drinking too much alcohol may weaken the heart muscle and lead
      to heart failure.
    - Smoking or using tobacco. If you smoke, quit. Using tobacco increases the risk
      of heart disease and heart failure.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: If you have heart failure, it's important to have regular health checkups,
      even if symptoms improve. Your healthcare professional can examine you and run
      tests to check for complications.
  - type: paragraph
    text: 'Complications of heart failure depend on your age, overall health and the
      severity of heart disease. They may include:'
  - type: list
    ordered: false
    items:
    - Kidney damage or failure. Heart failure can reduce the blood flow to the kidneys.
      Untreated, this can cause kidney failure. Kidney damage from heart failure can
      require dialysis for treatment.
    - Other heart changes. Heart failure can cause changes in the heart's size and
      function. These changes may damage heart valves and cause irregular heartbeats.
    - Liver damage. Heart failure can cause fluid buildup that puts too much pressure
      on the liver. This fluid backup can lead to scarring, which makes it more difficult
      for the liver to work properly.
    - Sudden cardiac death. If the heart is weak, there is a risk of dying suddenly
      due to a dangerous irregular heart rhythm.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: One way to prevent heart failure is to treat and control the conditions
      that can cause it. These conditions include coronary artery disease, high blood
      pressure, diabetes and obesity.
  - type: paragraph
    text: 'Some of the same lifestyle changes used to manage heart failure also may
      help prevent it. Try these heart-healthy tips:'
  - type: list
    ordered: false
    items:
    - Don't smoke.
    - Get plenty of exercise.
    - Eat healthy foods.
    - Maintain a healthy weight.
    - Reduce and manage stress.
    - Take medicines as directed.
  subsections: []
