title: Congenital heart defects in children
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: A congenital heart defect is a problem with the structure of the heart that
      a child is born with.
  - type: paragraph
    text: Some congenital heart defects in children are simple and don't need treatment.
      Others are more complex. The child may need several surgeries done over a period
      of several years.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Serious congenital heart defects usually are found soon after birth or
      during the first few months of life. Symptoms could include:'
  - type: list
    ordered: false
    items:
    - Pale gray or blue lips, tongue, or fingernails. Depending on the skin color,
      these changes may be harder or easier to see.
    - Rapid breathing.
    - Swelling in the legs, belly or areas around the eyes.
    - Shortness of breath during feedings, leading to poor weight gain.
  - type: paragraph
    text: 'Less-serious congenital heart defects may not be found until later in childhood.
      Symptoms of congenital heart defects in older children may include:'
  - type: list
    ordered: false
    items:
    - Easily getting short of breath during exercise or activity.
    - Getting tired very easily during exercise or activity.
    - Fainting during exercise or activity.
    - Swelling in the hands, ankles or feet.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: Serious congenital heart defects are often diagnosed before or soon after
        a child is born. If you think that your baby has symptoms of a heart condition,
        call your child's healthcare professional.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: To understand the causes of congenital heart defects, it may help to know
      how the heart usually works.
  - type: paragraph
    text: The typical heart has four chambers. There are two on the right and two
      on the left.
  - type: list
    ordered: false
    items:
    - The two upper chambers are called the atria.
    - The two lower chambers are called the ventricles.
  - type: paragraph
    text: To pump blood through the body, the heart uses its left and right sides
      for different tasks.
  - type: list
    ordered: false
    items:
    - The right side of the heart moves blood to the lungs through the lung arteries,
      called the pulmonary arteries.
    - In the lungs, the blood gets oxygen. The blood then goes to the heart's left
      side through the pulmonary veins.
    - The left side of the heart pumps the blood through the body's main artery, called
      the aorta. It then goes to the rest of the body.
  subsections:
  - heading: How congenital heart defects develop
    level: 3
    content:
    - type: paragraph
      text: During the first six weeks of pregnancy, the baby's heart begins to form
        and starts to beat. The major blood vessels that go to and from the heart
        also begin to form during this critical time.
    - type: paragraph
      text: It's at this point in a baby's development that congenital heart defects
        may begin to develop. Researchers aren't sure what causes most types of congenital
        heart defects. They think that gene changes, certain medicines or health conditions,
        and environmental or lifestyle factors, such as smoking, may play a role.
    - type: paragraph
      text: There are many types of congenital heart defects. They fall into the general
        categories described below.
    subsections:
    - heading: Changes in the connections in the heart or blood vessels
      level: 4
      content:
      - type: paragraph
        text: Changes in connections, also called altered connections, let blood flow
          where it usually wouldn't.
      - type: paragraph
        text: An altered connection can cause oxygen-poor blood to mix with oxygen-rich
          blood. This lowers the amount of oxygen sent through the body. The change
          in blood flow forces the heart and lungs to work harder.
      - type: paragraph
        text: 'Types of altered connections in the heart or blood vessels include:'
      - type: list
        ordered: false
        items:
        - Atrial septal defect is a hole between the upper heart chambers, called
          the atria.
        - Ventricular septal defect is a hole in the wall between the right and left
          lower heart chambers, called the ventricles.
        - Patent ductus arteriosus (PAY-tunt DUK-tus ahr-teer-e-O-sus) is a connection
          between the lung artery and the body's main artery, called the aorta. It's
          open while a baby is growing in the womb, and typically closes a few hours
          after birth. But in some babies, it stays open, causing incorrect blood
          flow between the two arteries.
        - Total or partial anomalous pulmonary venous connection occurs when all or
          some of the blood vessels from the lungs, called the pulmonary veins, attach
          to a wrong area or areas of the heart.
      subsections: []
    - heading: Congenital heart valve problems
      level: 4
      content:
      - type: paragraph
        text: Heart valves are like doorways between the heart chambers and the blood
          vessels. Heart valves open and close to keep blood moving in the proper
          direction. If the heart valves can't open and close correctly, blood can't
          flow smoothly.
      - type: paragraph
        text: Heart valve problems include valves that are narrowed and don't open
          completely or valves that don't close completely.
      - type: paragraph
        text: 'Examples of congenital heart valve problems include:'
      - type: list
        ordered: false
        items:
        - Aortic stenosis (stuh-NO-sis). A baby may be born with an aortic valve that
          has one or two valve flaps, called cusps, instead of three. This creates
          a small, narrowed opening for blood to pass through. The heart must work
          harder to pump blood through the valve. Eventually, the heart gets bigger
          and the heart muscle gets thicker.
        - Pulmonary stenosis. The pulmonary valve opening is narrowed. This slows
          the blood flow.
        - Ebstein anomaly. The tricuspid valve — which is located between the right
          upper heart chamber and the right lower chamber — is not its usual shape.
          It often leaks.
      subsections: []
    - heading: Combination of congenital heart defects
      level: 4
      content:
      - type: paragraph
        text: Some infants are born with several congenital heart defects. Very complex
          ones may cause significant changes in blood flow or undeveloped heart chambers.
      - type: paragraph
        text: 'Examples include:'
      - type: list
        ordered: false
        items:
        - Tetralogy of Fallot (teh-TRAL-uh-jee of fuh-LOW). There are four changes
          to the heart's shape and structure. There's a hole in the wall between the
          heart's lower chambers and thickened muscle in the lower right chamber.
          The path between the lower heart chamber and pulmonary artery is narrowed.
          There also is a shift in the connection of the aorta to the heart.
        - Pulmonary atresia. The valve that lets blood out of the heart to go to the
          lungs, called the pulmonary valve, isn't formed correctly. Blood can't travel
          its usual path to get oxygen from the lungs.
        - Tricuspid atresia. The tricuspid valve isn't formed. Instead, there's solid
          tissue between the right upper heart chamber and the right lower chamber.
          This condition limits blood flow. It causes the right lower chamber to be
          underdeveloped.
        - Transposition of the great arteries. In this serious, rare congenital heart
          defect, the two main arteries leaving the heart are reversed, also called
          transposed. There are two types. Complete transposition of the great arteries
          is typically noticed during pregnancy or soon after birth. It also is called
          dextro-transposition of the great arteries (D-TGA). Levo-transposition of
          the great arteries (L-TGA) is less common. Symptoms may not be noticed right
          away.
        - Hypoplastic left heart syndrome. A major part of the heart fails to develop
          properly. The left side of the heart hasn't developed enough to successfully
          pump enough blood to the body.
      subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: Most congenital heart defects result from changes that occur early as the
      baby's heart is developing before birth. The exact cause of most congenital
      heart defects is unknown. But some risk factors have been identified.
  - type: paragraph
    text: 'Risk factors for congenital heart defects include:'
  - type: list
    ordered: false
    items:
    - Rubella, also called German measles. Having rubella during pregnancy can cause
      changes in a baby's heart development. A blood test done before pregnancy can
      determine if you're immune to rubella. A vaccine is available for those who
      aren't immune.
    - Diabetes. Careful control of blood sugar before and during pregnancy can reduce
      the risk of congenital heart defects in the baby. Diabetes that develops during
      pregnancy is called gestational diabetes. It generally doesn't increase a baby's
      risk of heart defects.
    - Some medicines. Taking certain medicines during pregnancy can cause congenital
      heart disease and other health problems present at birth. Medicines linked to
      congenital heart defects include lithium (Lithobid) for bipolar disorder and
      isotretinoin (Claravis, Myorisan, others), which is used to treat acne. Always
      tell your healthcare team about the medicines you take.
    - Drinking alcohol during pregnancy. Drinking alcohol during pregnancy increases
      the risk of congenital heart defects in the baby.
    - Smoking. If you smoke, quit. Smoking during pregnancy increases the risk of
      congenital heart defects in the baby.
    - Genetics. Congenital heart defects appear to run in families, which means they
      are inherited. Changes in genes have been linked to heart problems present at
      birth. For instance, people with Down syndrome are often born with heart conditions.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Possible complications of a congenital heart defect include:'
  - type: list
    ordered: false
    items:
    - Congestive heart failure. This serious complication may develop in babies who
      have a severe congenital heart defect. Symptoms of congestive heart failure
      include rapid breathing, often with gasping breaths, and poor weight gain.
    - Infection of the lining of the heart and heart valves, called endocarditis.
      Untreated, this infection can damage or destroy the heart valves or cause a
      stroke. Antibiotics may be recommended before dental care to prevent this infection.
      Regular dental checkups are important. Healthy gums and teeth reduce the risk
      of endocarditis.
    - Irregular heartbeats, called arrhythmias. Scar tissue in the heart from surgeries
      to fix a congenital heart condition can lead to changes in heart signaling.
      The changes can cause the heart to beat too fast, too slow or irregularly. Some
      irregular heartbeats may cause stroke or sudden cardiac death if not treated.
    - Slower growth and development (developmental delays). Children with more-serious
      congenital heart defects often develop and grow more slowly than do children
      who don't have heart defects. They may be smaller than other children of the
      same age. If the nervous system has been affected, a child may learn to walk
      and talk later than other children.
    - Stroke. Although uncommon, a congenital heart defect can let a blood clot pass
      through the heart and travel to the brain, causing a stroke.
    - Mental health disorders. Some children with congenital heart defects may develop
      anxiety or stress because of developmental delays, activity restrictions or
      learning difficulties. Talk to your child's healthcare professional if you're
      concerned about your child's mental health.
  - type: paragraph
    text: Complications of congenital heart defects may occur years after the heart
      condition is treated.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: Because the exact cause of most congenital heart defects is unknown, it
      may not be possible to prevent these conditions. If you have a high risk of
      giving birth to a child with a congenital heart defect, genetic testing and
      screening may be done during pregnancy.
  - type: paragraph
    text: 'There are some steps you can take to help reduce your child''s overall
      risk of heart problems present at birth such as:'
  - type: list
    ordered: false
    items:
    - Get proper prenatal care. Regular checkups with a healthcare professional during
      pregnancy can help keep mom and baby healthy.
    - Take a multivitamin with folic acid. Taking 400 micrograms of folic acid daily
      has been shown to prevent harmful changes in the baby's brain and spinal cord.
      It also may help reduce the risk of congenital heart defects as well.
    - Don't drink or smoke. These lifestyle habits can harm a baby's health. Also
      avoid secondhand smoke.
    - Get a rubella vaccine. Also called German measles, having rubella during pregnancy
      may affect a baby's heart development. Get vaccinated before trying to get pregnant.
    - Control blood sugar. If you have diabetes, good control of your blood sugar
      can reduce the risk of congenital heart defects.
    - Manage chronic health conditions. If you have other health conditions, talk
      to your healthcare professional about the best way to treat and manage them.
    - Avoid harmful substances. During pregnancy, have someone else do any painting
      and cleaning with strong-smelling products.
    - Tell your care team about your medicines. Some medicines can cause congenital
      heart defects and other health conditions present at birth. Tell your care team
      about all the medicines you take, including those bought without a prescription.
  subsections: []
