title: Monoclonal gammopathy of undetermined significance (MGUS)
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Monoclonal gammopathy of undetermined significance (MGUS) is a condition
      in which an atypical protein is found in the blood. The protein is called monoclonal
      protein or M protein.
  - type: paragraph
    text: This protein is made in the soft, blood-producing tissue in the center of
      bones. This blood-producing tissue is bone marrow. Monoclonal gammopathy of
      undetermined significance occurs most often in older men.
  - type: paragraph
    text: MGUS usually causes no problems. But sometimes it can lead to more-serious
      diseases. These include some forms of blood cancer.
  - type: paragraph
    text: People who have high amounts of this protein in the blood need regular checkups.
      That's so they can get earlier treatment if the condition gets worse. If it
      doesn't get worse, MGUS doesn't need treatment.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: People with monoclonal gammopathy often don't have symptoms. Some people
      have a rash or nerve problems, such as numbness or tingling. A blood test for
      another condition might find MGUS by chance.
  subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: Experts don't know what causes MGUS . Changes in genes and being around
      certain chemicals, such as those used to kill pests, appear to play a role.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Factors that increase your risk of developing MGUS include:'
  - type: list
    ordered: false
    items:
    - Age. The average age at diagnosis is 70 years.
    - Race. Africans and Black Americans are more likely to get MGUS than white people
      are.
    - Sex. MGUS is more common in men.
    - Family history. Having family members with MGUS might increase the risk.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: 'Each year, about 1% of people with MGUS get certain types of blood cancers
      or other serious diseases, such as:'
  - type: list
    ordered: false
    items:
    - Multiple myeloma.
    - Light chain amyloidosis.
    - Waldenstrom macroglobulinemia.
    - Lymphoma.
  - type: paragraph
    text: Other issues linked to MGUS include broken bones, blood clots, kidney problems,
      and damage to nerves outside of the brain and spinal cord, also known as peripheral
      neuropathy.
  subsections: []
