title: Mastitis
sections:
- heading: Overview
  level: 2
  content:
  - type: paragraph
    text: Mastitis is swelling and redness, called inflammation, of breast tissue.
      It sometimes involves an infection. Besides causing swelling and redness, mastitis
      causes breast pain and warmth. An infection also can cause fever and chills.
  - type: paragraph
    text: Mastitis most often affects people who are breastfeeding. This is called
      lactation mastitis. But mastitis can happen to people who aren't breastfeeding.
  - type: paragraph
    text: Lactation mastitis can cause you to feel run down, making it hard to care
      for your baby. Sometimes mastitis causes people to wean their babies earlier
      than they meant to. But continuing to breastfeed is better for you and your
      baby. This is true even if you're taking an antibiotic.
  subsections: []
- heading: Symptoms
  level: 2
  content:
  - type: paragraph
    text: 'Symptoms of mastitis can appear suddenly. They may be in one or both breasts.
      Symptoms may include:'
  - type: list
    ordered: false
    items:
    - Breast tenderness or warmth.
    - Breast swelling.
    - Thickening of breast tissue, or a breast lump.
    - Pain or a burning feeling all the time or while breastfeeding.
    - Skin redness, often in a wedge-shaped pattern. The redness may be harder to
      see on Black or brown skin.
    - Feeling ill.
    - Fever of 101 degrees Fahrenheit (38.3 degrees Celsius) or greater.
  subsections:
  - heading: When to see a doctor
    level: 3
    content:
    - type: paragraph
      text: See your healthcare professional if you have breast symptoms that worry
        you.
    subsections: []
- heading: Causes
  level: 2
  content:
  - type: paragraph
    text: 'Milk that is trapped in the breast is the main cause of mastitis. Other
      causes include:'
  - type: list
    ordered: false
    items:
    - A blocked milk duct. If a breast doesn't empty all the way during feedings,
      one of the milk ducts can get clogged. Then milk backs up, leading to breast
      infection.
    - Germs going into the breast. Germs from the skin's surface and baby's mouth
      can enter the milk ducts. This can happen through a crack in the skin of the
      nipple or through a milk duct opening. Germs can grow in milk that stays in
      a breast that isn't emptied.
  subsections: []
- heading: Risk factors
  level: 2
  content:
  - type: paragraph
    text: 'Risk factors for mastitis include:'
  - type: list
    ordered: false
    items:
    - Having a history of mastitis.
    - Having sore or cracked nipples.
    - Putting pressure on a breast that restricts milk flow. Wearing a tight bra or
      using a tight seat belt can cause pressure.
    - Not nursing correctly.
    - Being overly tired or stressed.
    - Eating poorly.
    - Smoking.
  subsections: []
- heading: Complications
  level: 2
  content:
  - type: paragraph
    text: Mastitis that isn't treated or that is due to a blocked duct can cause pus
      to build up in the breast. This is called an abscess. An abscess most often
      needs to be drained surgically.
  - type: paragraph
    text: To avoid this complication, talk with your healthcare professional as soon
      as you get symptoms of mastitis. You may need to take a course of antibiotics.
  subsections: []
- heading: Prevention
  level: 2
  content:
  - type: paragraph
    text: Before you start breastfeeding, think about meeting with a breastfeeding
      specialist, called a lactation consultant. This can help you avoid complications
      such as mastitis.
  - type: paragraph
    text: 'Lower your chances of getting mastitis by following these tips:'
  - type: list
    ordered: false
    items:
    - Feed your baby on demand or let out milk with your hand, called expressing,
      often.
    - Fully drain the milk from your breasts while breastfeeding.
    - Let your baby empty one breast all the way before switching to the other breast
      during feeding.
    - Change the position you use to breastfeed from one feeding to the next.
    - Make sure your baby latches on well during feedings.
    - If you smoke, talk with your healthcare professional about how to quit.
  subsections: []
