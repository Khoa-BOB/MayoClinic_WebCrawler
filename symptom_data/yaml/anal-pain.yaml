title: Anal pain
sections:
- heading: ''
  level: 2
  content:
  - type: paragraph
    text: Anal pain is pain in and around the anus or rectum, also called the perianal
      region. Anal pain is a common complaint. Although most causes of anal pain aren't
      serious, the pain itself can be severe because of the many nerve endings in
      the perianal region.
  - type: paragraph
    text: Many conditions that cause anal pain also may cause rectal bleeding, which
      is usually more frightening than serious.
  - type: paragraph
    text: The causes of anal pain usually can be easily diagnosed. Anal pain usually
      can be treated with nonprescription pain relievers and hot water soaks, also
      called sitz baths.
  subsections:
  - heading: Seek immediate medical attention
    level: 3
    content:
    - type: paragraph
      text: 'Have someone drive you to urgent care or the emergency room if you develop:'
    - type: list
      ordered: false
      items:
      - A large amount of rectal bleeding or rectal bleeding that won't stop, especially
        if it comes with lightheadedness, dizziness or feeling faint.
      - Anal pain that gets much worse, spreads or comes with fever, chills or anal
        discharge.
    subsections: []
  - heading: Schedule a doctor's visit
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with your health care team if your pain lasts more
        than a few days and self-care remedies aren't helping. Also make an appointment
        with your team if anal pain comes with a change in bowel habits or rectal
        bleeding.
    - type: paragraph
      text: A hemorrhoid that develops quickly or is especially painful may have formed
        a blood clot inside, called a thrombosed hemorrhoid. Removing the clot within
        the first 48 hours often gives the most relief, so request a timely appointment
        with your health care team. The blood clot of a thrombosed hemorrhoid, although
        painful, can't break loose and travel. It won't cause any of the complications
        associated with blood clots that form in other parts of the body, such as
        stroke.
    - type: paragraph
      text: See your health care team for rectal bleeding, especially if you're older
        than 40, to rule out rare but serious conditions such as colon cancer.
    subsections: []
  - heading: Self-care
    level: 3
    content:
    - type: paragraph
      text: 'Depending on the cause of your anal pain, there are some measures you
        can try at home to get relief. They include:'
    - type: list
      ordered: false
      items:
      - Eating more fruits, vegetables and whole grains, and exercising daily.
      - Taking stool softeners, if needed, to help with bowel movements, reduce straining
        and ease pain.
      - Sitting in a tub of hot water up to your hips, known as a sitz bath, several
        times a day. This helps ease the pain of hemorrhoids, anal fissures or rectal
        muscle spasms.
      - Applying nonprescription hemorrhoid cream for hemorrhoids or hydrocortisone
        cream for anal fissures.
      - Taking a nonprescription pain reliever such as acetaminophen (Tylenol, others),
        aspirin or ibuprofen (Advil, Motrin IB, others).
    subsections: []
  - heading: Show References
    level: 3
    content:
