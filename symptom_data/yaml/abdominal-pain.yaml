title: Abdominal pain
sections:
- heading: ''
  level: 2
  content:
  - type: paragraph
    text: Everyone experiences abdominal pain from time to time. Other terms used
      to describe abdominal pain are stomachache, tummy ache, gut ache and bellyache.
      Abdominal pain can be mild or severe. It may be constant or come and go. Abdominal
      pain can be short-lived, also called acute. It also may happen over weeks, months
      or years, also known as chronic.
  - type: paragraph
    text: Call a healthcare professional right away if you have abdominal pain so
      bad that you can't move without causing more pain. Also call if you can't sit
      still or find a comfortable position.
  subsections:
  - heading: Call 911 or emergency medical assistance
    level: 3
    content:
    - type: paragraph
      text: 'Seek help if your abdominal pain is severe and is associated with:'
    - type: list
      ordered: false
      items:
      - Trauma, such as an accident or injury.
      - Pressure or pain in your chest.
    subsections: []
  - heading: Seek immediate medical attention
    level: 3
    content:
    - type: paragraph
      text: 'Have someone drive you to urgent care or the emergency room if you have:'
    - type: list
      ordered: false
      items:
      - Severe pain.
      - Fever.
      - Bloody stools.
      - Nausea and vomiting that won't go away.
      - Weight loss.
      - Skin that appears discolored.
      - Severe tenderness when you touch your abdomen.
      - Swelling of the abdomen.
    subsections: []
  - heading: Schedule a doctor's visit
    level: 3
    content:
    - type: paragraph
      text: Make an appointment with a healthcare professional if your abdominal pain
        worries you or lasts more than a few days.
    - type: paragraph
      text: In the meantime, find ways to ease your pain. For instance, drink enough
        fluids and eat smaller meals if your pain is accompanied by indigestion. Avoid
        taking nonprescription pain relievers or laxatives unless directed by a healthcare
        professional.
    subsections: []
  - heading: Show References
    level: 3
    content:
    - type: list
      ordered: true
      items:
      - Penner RM, et al. Evaluation of the adult with abdominal pain. https://www.uptodate.com/contents/search.
        Accessed Feb. 20, 2023.
      - Acute and chronic abdominal pain in adults. Clinical Overview. https://www.clinicalkey.com.
        Accessed Feb. 20, 2023.
      - 'Cameron P, et al., eds. Approach to abdominal pain. In: Textbook of Adult
        Emergency Medicine. 5th ed. Elsevier; 2020. https://www.clinicalkey.com. Accessed
        Feb. 21, 2023.'
      - AskMayoExpert. Chronic abdominal pain (adult). Mayo Clinic; 2022.
      - Abdominal pain, adult. Patient Education. https://www.clinicalkey.com. Accessed
        Feb. 22, 2023.
    - type: paragraph
      text: 'Original article: https://www.mayoclinic.org/symptoms/abdominal-pain/basics/definition/sym-20050728'
    subsections: []
